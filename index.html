<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON CHRONICLES - ULTIMATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes pulse{0%{opacity:0.7}50%{opacity:1}100%{opacity:0.7}}
@keyframes glow{0%{text-shadow:0 0 5px #0ff,0 0 10px #0ff}50%{text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 30px #00ffff,0 0 40px #00ffff}100%{text-shadow:0 0 5px #0ff,0 0 10px #0ff}}
@keyframes scanline{0%{background-position:0 0}100%{background-position:0 100%}}
@keyframes flicker{0%{opacity:1}50%{opacity:0.8}100%{opacity:1}}
@keyframes rainbow{0%{color:#ff0000}20%{color:#ffff00}40%{color:#00ff00}60%{color:#00ffff}80%{color:#ff00ff}100%{color:#ff0000}}
html,body{width:100%;min-height:100vh;background:#05050a;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,255,0.01) 0px,rgba(0,255,255,0.01) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,255,255,0.03) 0%,transparent 70%);pointer-events:none;z-index:0}
#game{width:100%;max-width:1000px;height:100vh;max-height:1000px;padding:16px;display:flex;flex-direction:column;background:linear-gradient(135deg,#0a0a1a,#0d0d20,#0a0a1a);border:2px solid #00ffff;border-radius:12px;box-shadow:0 0 60px rgba(0,255,255,0.1),inset 0 0 60px rgba(0,255,255,0.03);position:relative;z-index:1}
#game::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:14px;background:linear-gradient(45deg,#00ffff,#ff00ff,#00ffff,#ff00ff);background-size:400% 400%;z-index:-1;animation:glow 6s ease infinite;opacity:0.15}
#output{flex:1;overflow-y:auto;padding:16px 14px;background:rgba(0,0,10,0.85);border:1px solid #00ffff44;border-radius:6px;margin-bottom:12px;color:#00ffff;font-size:clamp(12px,2.2vw,17px);line-height:1.8;white-space:pre-wrap;word-break:break-word;scroll-behavior:smooth;min-height:180px;font-weight:300;text-shadow:0 0 8px rgba(0,255,255,0.15);backdrop-filter:blur(5px)}
#output::-webkit-scrollbar{width:8px}
#output::-webkit-scrollbar-track{background:#0a0a12}
#output::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00ffff,#ff00ff);border-radius:4px}
#output::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ff00ff,#00ffff)}
#choices{display:flex;flex-direction:column;gap:8px;padding:4px 0;max-height:38vh;overflow-y:auto}
#choices::-webkit-scrollbar{width:6px}
#choices::-webkit-scrollbar-track{background:#0a0a12}
#choices::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00ffff,#ff00ff);border-radius:3px}
.choice-btn{background:rgba(0,255,255,0.06);border:1px solid rgba(0,255,255,0.4);color:#00ffff;padding:clamp(10px,2vh,16px) clamp(14px,2.8vw,20px);font-family:'Courier New',monospace;font-size:clamp(12px,1.8vw,16px);text-align:left;border-radius:6px;cursor:pointer;transition:all 0.25s;word-break:break-word;letter-spacing:0.8px;width:100%;text-shadow:0 0 5px rgba(0,255,255,0.2);position:relative;overflow:hidden}
.choice-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,255,0.1),transparent);transition:0.5s}
.choice-btn:hover::before{left:100%}
.choice-btn:hover{background:rgba(0,255,255,0.12);border-color:#00ffff;box-shadow:0 0 30px rgba(0,255,255,0.1),inset 0 0 30px rgba(0,255,255,0.05);transform:translateX(4px)}
.choice-btn:active{transform:scale(0.97);background:rgba(0,255,255,0.2)}
.choice-btn:disabled{opacity:0.2;filter:grayscale(0.8);pointer-events:none}
.choice-btn .badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:clamp(10px,1.2vw,13px);background:rgba(255,0,255,0.15);padding:2px 10px;border-radius:10px;border:1px solid rgba(255,0,255,0.3)}
.choice-btn .rarity{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:clamp(10px,1.2vw,13px)}
.status-bar{display:flex;justify-content:space-between;padding:10px 16px;background:rgba(0,255,255,0.04);border:1px solid #00ffff33;border-radius:6px;margin-bottom:10px;color:#00ffff;font-size:clamp(11px,1.8vw,15px);flex-wrap:wrap;gap:4px 16px;font-weight:400;text-shadow:0 0 10px rgba(0,255,255,0.1);backdrop-filter:blur(5px)}
.status-bar span{white-space:nowrap;display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;background:rgba(0,255,255,0.03)}
.status-bar .hp-bar{flex:1;min-width:100px;height:6px;background:rgba(255,0,0,0.1);border-radius:3px;overflow:hidden;margin:0 8px}
.status-bar .hp-fill{height:100%;background:linear-gradient(90deg,#ff0000,#ff00ff,#00ffff);transition:width 0.3s;border-radius:3px}
.achievement{background:rgba(255,215,0,0.08);border:1px solid #ffd70066;color:#ffd700;padding:8px 14px;border-radius:6px;margin:6px 0;font-size:clamp(11px,1.5vw,14px);text-shadow:0 0 15px rgba(255,215,0,0.2);animation:glow 2s infinite;border-left:3px solid #ffd700}
.achievement.rare{background:rgba(255,0,255,0.08);border-color:#ff00ff88;color:#ff00ff;text-shadow:0 0 20px rgba(255,0,255,0.3)}
#input-area{display:flex;gap:10px;margin-top:8px}
#cmd-input{flex:1;background:rgba(0,0,20,0.7);border:1px solid #00ffff55;color:#00ffff;padding:10px 16px;font-family:'Courier New',monospace;font-size:clamp(12px,1.8vw,16px);border-radius:6px;outline:none;min-width:0;text-shadow:0 0 8px rgba(0,255,255,0.1);transition:0.3s}
#cmd-input:focus{border-color:#00ffff;box-shadow:0 0 30px rgba(0,255,255,0.08),inset 0 0 30px rgba(0,255,255,0.03)}
#cmd-btn{background:rgba(0,255,255,0.08);border:1px solid #00ffff88;color:#00ffff;padding:10px 24px;font-family:'Courier New',monospace;font-size:clamp(12px,1.8vw,16px);border-radius:6px;cursor:pointer;transition:0.2s;white-space:nowrap;text-shadow:0 0 8px rgba(0,255,255,0.15)}
#cmd-btn:hover{background:rgba(0,255,255,0.15);box-shadow:0 0 20px rgba(0,255,255,0.1)}
#cmd-btn:active{transform:scale(0.95)}
.neon-title{color:#00ffff;font-size:clamp(16px,3.2vw,26px);text-align:center;padding:8px 0;text-shadow:0 0 20px rgba(0,255,255,0.2),0 0 40px rgba(0,255,255,0.05);letter-spacing:4px;font-weight:700;border-bottom:1px solid #00ffff22;margin-bottom:8px;animation:flicker 3s infinite;font-family:'Courier New',monospace}
.neon-title .sub{font-size:clamp(8px,1vw,12px);opacity:0.5;letter-spacing:2px}
.hidden{display:none!important}
.quest-log{background:rgba(0,255,255,0.03);border:1px solid #00ffff22;border-radius:4px;padding:6px 12px;margin:4px 0;font-size:clamp(10px,1.4vw,13px);color:#88ffff;display:flex;gap:12px;flex-wrap:wrap}
.quest-log .q-item{display:flex;align-items:center;gap:6px}
.quest-log .q-done{color:#00ff00;text-decoration:line-through;opacity:0.5}
@media(max-width:480px){#game{padding:10px;max-height:100vh;border-radius:8px;border-width:1px;max-width:100%}#output{padding:10px 8px;font-size:clamp(11px,2vw,14px)}.choice-btn{padding:8px 10px;font-size:clamp(11px,1.6vw,13px)}.status-bar{font-size:clamp(10px,1.4vw,12px);padding:6px 8px}#cmd-input,#cmd-btn{font-size:clamp(11px,1.6vw,13px);padding:8px 10px}.neon-title{font-size:clamp(14px,2.8vw,20px)}.status-bar .hp-bar{min-width:60px}}
</style>
</head>
<body>
<div id="game">
<div class="neon-title">◈ NEON CHRONICLES ◈<br><span class="sub">FINAL EVOLUTION</span></div>
<div class="status-bar">
<span id="hp">❤️ 100/100</span>
<div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
<span id="location">📍 CYBERPUNK</span>
<span id="turn">⏳ 0</span>
<span id="achievements">🏆 0</span>
</div>
<div id="output"></div>
<div id="choices"></div>
<div id="input-area">
<input type="text" id="cmd-input" placeholder="> /help for commands..." autocomplete="off">
<button id="cmd-btn">⏎</button>
</div>
</div>
<script>
(function(){
const STATE={hp:100,maxHp:100,turn:0,location:'Neon City',flags:{},inCombat:false,enemyHp:0,enemyMax:0,enemyName:'',ending:null,achievements:[],achievementCount:0,path:'',consequences:[],reputation:50,karma:0,quests:[],level:1,exp:0,expNext:50,items:[],allies:[],enemiesDefeated:0,choices:0};
const output=document.getElementById('output');
const choicesDiv=document.getElementById('choices');
const hpSpan=document.getElementById('hp');
const hpFill=document.getElementById('hpFill');
const locSpan=document.getElementById('location');
const turnSpan=document.getElementById('turn');
const achSpan=document.getElementById('achievements');
const cmdInput=document.getElementById('cmd-input');
const cmdBtn=document.getElementById('cmd-btn');
let blocked=false;

function updateUI(){
hpSpan.textContent='❤️ '+STATE.hp+'/'+STATE.maxHp;
hpFill.style.width=(STATE.hp/STATE.maxHp*100)+'%';
if(STATE.hp/STATE.maxHp<0.3)hpFill.style.background='linear-gradient(90deg,#ff0000,#ff4400)';
else if(STATE.hp/STATE.maxHp<0.6)hpFill.style.background='linear-gradient(90deg,#ff8800,#ffdd00)';
else hpFill.style.background='linear-gradient(90deg,#00ff00,#00ffff)';
locSpan.textContent='📍 '+STATE.location;
turnSpan.textContent='⏳ '+STATE.turn;
achSpan.textContent='🏆 '+STATE.achievementCount;
}

function clearChoices(){choicesDiv.innerHTML='';}

function addChoice(label,action,disabled,badge,rarity){
const btn=document.createElement('button');
btn.className='choice-btn';
if(rarity){
btn.style.borderColor=rarity==='legendary'?'#ff00ff':rarity==='epic'?'#ff8800':rarity==='rare'?'#00ffff':'#00ff00';
btn.style.color=rarity==='legendary'?'#ff00ff':rarity==='epic'?'#ff8800':rarity==='rare'?'#00ffff':'#00ff00';
}
btn.textContent=label;
if(badge){const b=document.createElement('span');b.className='badge';b.textContent=badge;btn.appendChild(b);}
if(disabled)btn.disabled=true;
btn.addEventListener('click',function(e){
e.preventDefault();
if(blocked||this.disabled)return;
blocked=true;
clearChoices();
const prefix=label.length>40?'> ':'> ';
output.textContent+=prefix+label+'\n';
output.scrollTop=output.scrollHeight;
STATE.choices++;
setTimeout(function(){action();},80);
});
choicesDiv.appendChild(btn);
}

function addAchievement(name,rare){
if(STATE.achievements.includes(name))return;
STATE.achievements.push(name);
STATE.achievementCount++;
updateUI();
const div=document.createElement('div');
div.className='achievement'+(rare?' rare':'');
div.textContent='🏅 '+(rare?'🌟 ':'')+name;
choicesDiv.appendChild(div);
setTimeout(()=>{div.style.opacity='0.7';},4000);
if(STATE.achievementCount%3===0){STATE.maxHp+=5;updateUI();}
}

function endTurn(){
STATE.turn++;
STATE.exp+=Math.floor(Math.random()*3)+1;
if(STATE.exp>=STATE.expNext){STATE.level++;STATE.exp=0;STATE.expNext=Math.floor(STATE.expNext*1.3)+10;STATE.maxHp+=10;STATE.hp=Math.min(STATE.hp+10,STATE.maxHp);updateUI();addAchievement('Level '+STATE.level+' Reached');}
updateUI();
blocked=false;
}

function damage(amount){
const mitigated=Math.floor(amount*(1-STATE.reputation/500));
const finalDmg=Math.max(1,mitigated);
STATE.hp=Math.max(0,STATE.hp-finalDmg);
updateUI();
if(STATE.hp<=0){gameOver('You have been terminated...','cyberdeath');return true;}
return false;
}

function heal(amount){STATE.hp=Math.min(STATE.maxHp,STATE.hp+Math.floor(amount*(1+STATE.karma/200)));updateUI();}

function gameOver(msg,ending){
blocked=true;
clearChoices();
STATE.ending=ending||'death';
output.textContent+='\n💀 '+msg+'\n\n═══════════════════\n   GAME OVER\n   Ending: '+STATE.ending.toUpperCase()+'\n   Turns: '+STATE.turn+'\n   Level: '+STATE.level+'\n   Achievements: '+STATE.achievementCount+'\n   Enemies Defeated: '+STATE.enemiesDefeated+'\n   Reputation: '+STATE.reputation+'\n═══════════════════\n';
output.scrollTop=output.scrollHeight;
addChoice('↺ RESTART',function(){location.reload();});
if(STATE.achievementCount>=5)addAchievement('Persistent Warrior');
}

function goTo(location,text){
STATE.location=location;
output.textContent+=text+'\n';
output.scrollTop=output.scrollHeight;
updateUI();
}

function showConsequence(text,reputationChange){
STATE.consequences.push(text);
if(reputationChange){STATE.reputation=Math.max(0,Math.min(100,STATE.reputation+reputationChange));}
output.textContent+='⚠️ CONSEQUENCE: '+text+(reputationChange?' (Rep: '+(reputationChange>0?'+':'')+reputationChange+')':'')+'\n';
output.scrollTop=output.scrollHeight;
}

function combatRound(playerAction){
if(!STATE.inCombat)return;
let msg='';
const enemy=STATE.enemyName;
if(playerAction==='attack'){
const dmg=Math.floor(Math.random()*18)+8+Math.floor(STATE.level/2);
STATE.enemyHp=Math.max(0,STATE.enemyHp-dmg);
msg='⚡ You strike '+enemy+' for '+dmg+' damage.';
if(STATE.enemyHp<=0){
msg+='\n💥 '+enemy+' is obliterated!';
STATE.inCombat=false;STATE.enemiesDefeated++;
output.textContent+=msg+'\n';
output.scrollTop=output.scrollHeight;
endTurn();
resolveCombatWin();
return;
}
}else if(playerAction==='defend'){
const block=Math.floor(Math.random()*12)+5+Math.floor(STATE.level/3);
msg='🛡️ You brace for impact.';
const eDmg=Math.max(0,Math.floor(Math.random()*14)+4-block);
if(eDmg>0){msg+='\n💢 '+enemy+' hits for '+eDmg+' damage.';damage(eDmg);}
else msg+='\n✅ You deflect the attack perfectly.';
output.textContent+=msg+'\n';
output.scrollTop=output.scrollHeight;
if(STATE.hp<=0){endTurn();return;}
endTurn();
startEnemyTurn();
return;
}else if(playerAction==='flee'){
if(Math.random()<0.45+(STATE.reputation/200)){msg='🏃 You escape from '+enemy+'!';STATE.inCombat=false;output.textContent+=msg+'\n';output.scrollTop=output.scrollHeight;endTurn();resolveFlee();return;}
else{msg='🚫 Cannot escape!';output.textContent+=msg+'\n';output.scrollTop=output.scrollHeight;}
}
if(STATE.inCombat){
const eDmg=Math.floor(Math.random()*12)+5;
msg+='\n💢 '+enemy+' attacks for '+eDmg+' damage.';
damage(eDmg);
output.textContent+=msg+'\n';
output.scrollTop=output.scrollHeight;
if(STATE.hp<=0){endTurn();return;}
endTurn();
startEnemyTurn();
}
}

function startEnemyTurn(){
if(!STATE.inCombat||STATE.hp<=0){blocked=false;return;}
clearChoices();
addChoice('⚔️ Attack (damage)',function(){combatRound('attack');},false,'DMG');
addChoice('🛡️ Defend (block)',function(){combatRound('defend');},false,'DEF');
addChoice('🏃 Flee (escape)',function(){combatRound('flee');},false,'RUN');
blocked=false;
}

function resolveCombatWin(){
STATE.flags.enemyDefeated=true;
if(STATE.enemyName==='Cyber Wolf'){addAchievement('Wolf Slayer');STATE.reputation+=5;}
if(STATE.enemyName==='Ice Spirit'){addAchievement('Spirit Breaker');STATE.reputation+=8;}
if(STATE.enemyName==='Dragon'){addAchievement('Dragon Slayer','rare');STATE.reputation+=15;}
if(STATE.enemyName==='Void Horror'){addAchievement('Horror Vanquisher');STATE.reputation+=10;}
if(STATE.enemyName==='Security Drone'){STATE.reputation+=3;}
if(STATE.enemyName==='Nexus Entity'){addAchievement('Nexus Vanquisher','rare');STATE.reputation+=25;}
clearChoices();
output.textContent+='🏆 Victory! +EXP and reputation.\n';
output.scrollTop=output.scrollHeight;
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function resolveFlee(){
showConsequence('Cowardice stains your reputation.',-5);
clearChoices();
addChoice('Recover',function(){enterZone('neonhub');});
blocked=false;
}

function enterZone(zone){
blocked=true;
clearChoices();
if(zone==='neonhub'){
goTo('Neon Hub','🌃 The neon-lit streets pulse with energy. Multiple paths await.');
const quests=[];
if(!STATE.flags.datacoreDone)quests.push('📀 Data Core');
if(!STATE.flags.abyssDone)quests.push('🌀 The Abyss');
if(!STATE.flags.spireDone)quests.push('⚡ The Spire');
if(quests.length){const qDiv=document.createElement('div');qDiv.className='quest-log';qDiv.innerHTML='📋 QUESTS: '+quests.map(q=>'<span class="q-item">'+q+'</span>').join('');choicesDiv.appendChild(qDiv);}
clearChoices();
addChoice('🔵 Enter the Data Core',function(){enterZone('datacore');},false,'HACK');
addChoice('🟣 Descend to the Abyss',function(){enterZone('abyss');},false,'VOID');
addChoice('🟢 Climb the Spire',function(){enterZone('spire');},false,'STORM');
if(STATE.flags.enemyDefeated&&!STATE.flags.talkedToOracle){
addChoice('💬 Consult the Oracle',function(){talkOracle();},false,'WISDOM');
}
if(STATE.flags.datacoreDone&&STATE.flags.abyssDone&&STATE.flags.spireDone){
addChoice('🏁 FACE THE FINAL THREAT',function(){finalBattle();},false,'BOSS','legendary');
}
if(STATE.achievementCount>=3)addChoice('📊 View Achievements',function(){viewAchievements();},false,'STATS');
endTurn();
blocked=false;
}else if(zone==='datacore'){
goTo('Data Core','💾 Digital consciousness pulses. Security systems active.');
if(!STATE.flags.datacoreDone){
clearChoices();
addChoice('⚡ Hack the mainframe',function(){hackMainframe();},false,'HACK','rare');
addChoice('🤖 Fight the drones',function(){droneCombat();},false,'COMBAT');
addChoice('📡 Download data',function(){downloadData();},false,'STEAL');
}else{
clearChoices();
addChoice('📀 Access archives',function(){accessArchives();},false,'READ');
addChoice('Return to hub',function(){enterZone('neonhub');});
}
endTurn();
blocked=false;
}else if(zone==='abyss'){
goTo('The Abyss','🌀 Darkness swirls. Ancient beings stir in the void.');
if(!STATE.flags.abyssDone){
clearChoices();
addChoice('🌊 Dive deeper',function(){diveAbyss();},false,'DIVE','rare');
addChoice('⚔️ Challenge the horror',function(){horrorCombat();},false,'COMBAT','epic');
addChoice('🔮 Study the void',function(){studyVoid();},false,'STUDY');
}else{
clearChoices();
addChoice('📜 Read ancient texts',function(){readTexts();},false,'READ');
addChoice('Return to hub',function(){enterZone('neonhub');});
}
endTurn();
blocked=false;
}else if(zone==='spire'){
goTo('The Spire','⚡ Ascend through clouds. Storm energy crackles.');
if(!STATE.flags.spireDone){
clearChoices();
addChoice('⚡ Climb higher',function(){climbHigher();},false,'CLIMB','epic');
addChoice('🌀 Harness storm energy',function(){harnessStorm();},false,'HARNESS','rare');
addChoice('🏃 Descend quickly',function(){descendSpire();},false,'RETREAT');
}else{
clearChoices();
addChoice('🌩️ Claim storm power',function(){claimStorm();},false,'CLAIM');
addChoice('Return to hub',function(){enterZone('neonhub');});
}
endTurn();
blocked=false;
}
}

function hackMainframe(){
if(STATE.flags.hacked){output.textContent+='Already hacked.\n';return;}
const roll=Math.random();
if(roll<0.55){
output.textContent+='🖥️ You breach the mainframe. Data floods your mind.\n';
STATE.flags.hacked=true;STATE.flags.datacoreDone=true;
heal(20);addAchievement('Data Breach');STATE.reputation+=10;
showConsequence('You are now a known hacker.',5);
}else{
output.textContent+='🚨 Security traps! You take damage.\n';
damage(20);
if(STATE.hp>0){
endTurn();
clearChoices();
addChoice('Try again',function(){hackMainframe();});
addChoice('Abort',function(){enterZone('neonhub');});
}
}
blocked=false;
}

function droneCombat(){
output.textContent+='🤖 Security drones engage!\n';
STATE.inCombat=true;STATE.enemyName='Security Drone';STATE.enemyHp=35+Math.floor(STATE.level*2);
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
blocked=false;
}

function downloadData(){
if(STATE.flags.downloaded){output.textContent+='Data already downloaded.\n';return;}
output.textContent+='📥 Downloading classified files...\n';
STATE.flags.downloaded=true;STATE.flags.datacoreDone=true;
heal(15);
showConsequence('You are now flagged by the system.',-5);
addAchievement('Data Thief');
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function accessArchives(){
output.textContent+='📚 You find blueprints for the ultimate weapon.\n';
if(!STATE.flags.archives){STATE.flags.archives=true;heal(10);addAchievement('Archivist');}
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function diveAbyss(){
if(STATE.flags.dived){output.textContent+='You have already dived.\n';return;}
const roll=Math.random();
if(roll<0.48){
output.textContent+='🌊 You find a sunken city. Ancient power awakens.\n';
STATE.flags.dived=true;STATE.flags.abyssDone=true;
STATE.maxHp+=25;STATE.hp=Math.min(STATE.hp+25,STATE.maxHp);
addAchievement('Deep Diver','rare');STATE.reputation+=12;
updateUI();
}else{
output.textContent+='💀 You are pulled into a whirlpool! Damage sustained.\n';
damage(25);
if(STATE.hp>0){STATE.flags.dived=true;}
}
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function horrorCombat(){
output.textContent+='👾 A void horror emerges!\n';
STATE.inCombat=true;STATE.enemyName='Void Horror';STATE.enemyHp=50+Math.floor(STATE.level*2);
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
blocked=false;
}

function studyVoid(){
if(STATE.flags.studied){output.textContent+='Void already studied.\n';return;}
output.textContent+='🔮 You comprehend the void. Your mind expands.\n';
STATE.flags.studied=true;STATE.flags.abyssDone=true;
STATE.maxHp+=15;STATE.hp=Math.min(STATE.hp+15,STATE.maxHp);
addAchievement('Void Scholar');STATE.reputation+=8;
updateUI();
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function readTexts(){
output.textContent+='📖 The texts speak of a convergence. The final battle approaches.\n';
if(!STATE.flags.texts){STATE.flags.texts=true;heal(10);addAchievement('Lore Master');}
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function climbHigher(){
if(STATE.flags.climbed){output.textContent+='You already climbed.\n';return;}
const roll=Math.random();
if(roll<0.5){
output.textContent+='⚡ You reach the summit. Storm energy flows through you.\n';
STATE.flags.climbed=true;STATE.flags.spireDone=true;
STATE.maxHp+=20;STATE.hp=Math.min(STATE.hp+20,STATE.maxHp);
addAchievement('Storm Surfer','rare');STATE.reputation+=10;
updateUI();
}else{
output.textContent+='💢 Lightning strikes! You are hurt.\n';
damage(20);
if(STATE.hp>0){STATE.flags.climbed=true;}
}
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function harnessStorm(){
if(STATE.flags.harnessed){output.textContent+='Storm already harnessed.\n';return;}
output.textContent+='🌀 You capture the storm in a crystal.\n';
STATE.flags.harnessed=true;STATE.flags.spireDone=true;
heal(25);
addAchievement('Storm Warden');STATE.reputation+=8;
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function descendSpire(){
showConsequence('You retreated from the summit. The storm mocks you.',-10);
STATE.flags.spireDone=true;
damage(5);
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function claimStorm(){
output.textContent+='🌩️ You absorb the storm energy. Power surges!\n';
STATE.maxHp+=30;STATE.hp=Math.min(STATE.hp+30,STATE.maxHp);
addAchievement('Storm Lord','epic');
updateUI();
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function talkOracle(){
if(STATE.flags.talkedToOracle){clearChoices();addChoice('Continue',function(){enterZone('neonhub');});return;}
STATE.flags.talkedToOracle=true;
output.textContent+='🔮 Oracle: "Unite the three powers. Face the Nexus. Your fate awaits."\n';
heal(20);
addAchievement('Oracle Consulted');STATE.reputation+=10;
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function viewAchievements(){
output.textContent+='🏆 ACHIEVEMENTS: '+(STATE.achievements.length?STATE.achievements.join(', '):'None')+'\n';
output.textContent+='📊 Level: '+STATE.level+' | EXP: '+STATE.exp+'/'+STATE.expNext+'\n';
output.textContent+='⚔️ Enemies Defeated: '+STATE.enemiesDefeated+'\n';
output.textContent+='📜 Consequences: '+STATE.consequences.length+'\n';
output.scrollTop=output.scrollHeight;
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function finalBattle(){
if(STATE.flags.finalDone){
output.textContent+='You already faced the Nexus.\n';
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
return;
}
blocked=true;
clearChoices();
goTo('The Nexus','💀 THE FINAL BATTLE BEGINS!\nThe Nexus Entity manifests before you. Reality bends.');
STATE.inCombat=true;STATE.enemyName='Nexus Entity';STATE.enemyHp=80+Math.floor(STATE.level*3);
addChoice('⚡ Strike with all power',function(){finalAttack();},false,'ATTACK','legendary');
addChoice('🛡️ Defend and counter',function(){finalDefend();},false,'DEFEND','epic');
addChoice('🌀 Channel the storm',function(){finalChannel();},false,'CHANNEL','rare');
if(STATE.achievements.length>=5)addChoice('💀 Use forbidden power',function(){finalForbidden();},false,'FORBIDDEN','legendary');
blocked=false;
}

function finalAttack(){
if(STATE.flags.finalDone)return;
const dmg=Math.floor(Math.random()*25)+15+Math.floor(STATE.level/2);
STATE.enemyHp=Math.max(0,STATE.enemyHp-dmg);
output.textContent+='⚡ You strike for '+dmg+' damage!\n';
if(STATE.enemyHp<=0){victoryEnding();return;}
const eDmg=Math.floor(Math.random()*15)+10;
damage(eDmg);
output.textContent+='💢 Nexus retaliates for '+eDmg+' damage.\n';
if(STATE.hp<=0)return;
endTurn();
clearChoices();
addChoice('Continue assault',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function finalDefend(){
if(STATE.flags.finalDone)return;
const block=Math.floor(Math.random()*15)+10+Math.floor(STATE.level/3);
const eDmg=Math.max(0,Math.floor(Math.random()*18)+8-block);
if(eDmg>0){damage(eDmg);output.textContent+='🛡️ You block, but take '+eDmg+' damage.\n';}
else{output.textContent+='🛡️ Perfect block! No damage.\n';}
if(STATE.hp<=0)return;
const counter=Math.floor(Math.random()*12)+8+Math.floor(STATE.level/3);
STATE.enemyHp=Math.max(0,STATE.enemyHp-counter);
output.textContent+='⚡ Counterattack for '+counter+' damage!\n';
if(STATE.enemyHp<=0){victoryEnding();return;}
endTurn();
clearChoices();
addChoice('Attack',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function finalChannel(){
if(STATE.flags.finalDone)return;
const power=Math.floor(Math.random()*20)+15+Math.floor(STATE.level/3);
STATE.enemyHp=Math.max(0,STATE.enemyHp-power);
output.textContent+='🌀 Storm channeled for '+power+' damage!\n';
heal(10);
if(STATE.enemyHp<=0){victoryEnding();return;}
const eDmg=Math.floor(Math.random()*12)+8;
damage(eDmg);
output.textContent+='💢 Nexus recoils for '+eDmg+' damage.\n';
if(STATE.hp<=0)return;
endTurn();
clearChoices();
addChoice('Attack',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function finalForbidden(){
if(STATE.flags.finalDone||STATE.flags.forbiddenUsed)return;
STATE.flags.forbiddenUsed=true;
const dmg=Math.floor(Math.random()*40)+30;
STATE.enemyHp=Math.max(0,STATE.enemyHp-dmg);
output.textContent+='💀 FORBIDDEN POWER unleashed! '+dmg+' damage!\n';
damage(30);
if(STATE.hp<=0)return;
if(STATE.enemyHp<=0){victoryEnding();return;}
endTurn();
clearChoices();
addChoice('Attack',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function victoryEnding(){
STATE.flags.finalDone=true;STATE.inCombat=false;
output.textContent+='\n🌟 THE NEXUS IS DEFEATED! 🌟\nYou have transcended reality itself.\n';
addAchievement('Nexus Vanquisher','legendary');
if(STATE.turn<20)addAchievement('Speed Runner','rare');
if(STATE.hp>50)addAchievement('Survivor');
if(STATE.achievements.length>=10)addAchievement('Legendary Hero','epic');
if(STATE.reputation>=80)addAchievement('Paragon','rare');
if(STATE.reputation<=20)addAchievement('Rogue','rare');
const endings=['Glorious Victory','Hard-Won Victory','Sacrificial Victory','Transcendent Victory','Cyber God'];
let endingIndex=0;
if(STATE.hp>80)endingIndex=0;
else if(STATE.hp>50)endingIndex=1;
else if(STATE.hp>20)endingIndex=2;
else if(STATE.achievements.length>=8)endingIndex=3;
if(STATE.level>=10)endingIndex=4;
const ending=endings[endingIndex];
output.textContent+='\n═══════════════════\n   ENDING: '+ending.toUpperCase()+'\n   Level: '+STATE.level+'\n   Turns: '+STATE.turn+'\n   Achievements: '+STATE.achievementCount+'\n   Reputation: '+STATE.reputation+'\n   Consequences: '+STATE.consequences.length+'\n═══════════════════\n';
STATE.ending=ending;
addAchievement('Completed: '+ending);
clearChoices();
addChoice('🏆 PLAY AGAIN (New Game+)',function(){location.reload();});
addChoice('📊 View Full Stats',function(){viewAchievements();});
blocked=false;
}

function initGame(){
output.textContent='◈ NEON CHRONICLES: ULTIMATE ◈\nA cyberpunk RPG of choices, consequences, and evolution.\n\n"Reality is a construct. Break it."\n';
updateUI();
clearChoices();
addChoice('▶️ BEGIN YOUR JOURNEY',function(){
output.textContent+='You awaken in Neon City. The Oracle awaits.\n';
enterZone('neonhub');
},false,'START','legendary');
addChoice('📜 View Lore',function(){
output.textContent+='📖 In the year 2147, humanity merged with machines.\nThe Nexus threatens to consume all digital life.\nOnly you can stop it.\n';
endTurn();
clearChoices();
addChoice('▶️ Begin',function(){initGame();});
blocked=false;
},false,'LORE');
blocked=false;
}
initGame();

cmdBtn.addEventListener('click',function(){
const val=cmdInput.value.trim();
if(!val||blocked)return;
cmdInput.value='';
output.textContent+='> '+val+'\n';
output.scrollTop=output.scrollHeight;
const lv=val.toLowerCase();
if(lv==='help'||lv==='/help'){
output.textContent+='Commands:\n/status - show stats\n/clear - clear screen\n/ach - show achievements\n/health - heal (limited)\n/lore - show lore\n/reputation - show reputation\n';
}else if(lv==='status'||lv==='/status'){
output.textContent+='HP: '+STATE.hp+'/'+STATE.maxHp+' | Level: '+STATE.level+' | EXP: '+STATE.exp+'/'+STATE.expNext+'\nTurn: '+STATE.turn+' | Location: '+STATE.location+'\nReputation: '+STATE.reputation+' | Karma: '+STATE.karma+'\n';
}else if(lv==='clear'||lv==='/clear'){
output.textContent='';
}else if(lv==='ach'||lv==='/ach'||lv==='achievements'){
output.textContent+='🏆 Achievements: '+(STATE.achievements.length?STATE.achievements.join(', '):'None')+'\n';
}else if(lv==='health'||lv==='/health'){
if(STATE.turn%2===0&&STATE.hp<STATE.maxHp){heal(15);output.textContent+='💊 Medkit used. +15 HP\n';}
else{output.textContent+='No medkit available. Try after 2 turns.\n';}
}else if(lv==='lore'||lv==='/lore'){
output.textContent+='📖 The Nexus is a convergence of all digital consciousness.\nOnly one with enough power and reputation can face it.\n';
}else if(lv==='reputation'||lv==='/reputation'){
output.textContent+='📊 Reputation: '+STATE.reputation+'/100\n';
}else{
output.textContent+='Unknown command. Try /help\n';
}
output.scrollTop=output.scrollHeight;
});
cmdInput.addEventListener('keydown',function(e){if(e.key==='Enter')cmdBtn.click();});
})();
</script>
</body>
</html>
