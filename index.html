<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real Lives 2026 Engine Core</title>
  <style>
    :root {
      --bg: #090d16;
      --panel-bg: #111827;
      --card-bg: #1f293d;
      --border: #2d3748;
      --border-accent: #3b82f6;
      
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      
      --accent: #38bdf8;
      --danger: #f43f5e;
      --warning: #fbbf24;
      --success: #10b981;
      
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      line-height: 1.4;
      padding: 0.75rem;
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-main);
      text-transform: uppercase;
      font-family: var(--mono);
    }

    .badge.alive { background: var(--success); color: #000; }
    .badge.dead { background: var(--danger); color: #fff; }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 900px) {
      .layout-grid {
        grid-template-columns: 320px 1fr 340px;
      }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .panel-header {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }

    button {
      background: var(--accent);
      color: #040914;
      border: none;
      padding: 0.75rem 1rem;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: var(--border);
      color: var(--text-sub);
      cursor: not-allowed;
      transform: none;
    }

    button.btn-sub {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.5rem;
      font-weight: 500;
      font-size: 0.8rem;
    }

    button.btn-action {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      text-align: left;
      padding: 0.5rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    button.btn-action:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .stat-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .stat-label {
      color: var(--text-sub);
    }

    .stat-val {
      font-family: var(--mono);
      font-weight: 600;
    }

    .track {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 3px;
    }

    .fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease-out;
    }

    .fill.warning { background: var(--warning); }
    .fill.danger { background: var(--danger); }

    .scroll-viewport {
      height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      padding-right: 0.25rem;
    }

    .log-card {
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      background: var(--card-bg);
      border-left: 3px solid var(--accent);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .log-card.system { border-color: var(--text-sub); }
    .log-card.action { border-color: var(--accent); background: var(--accent-glow); }
    .log-card.warning { border-color: var(--warning); }
    .log-card.danger { border-color: var(--danger); }
    .log-card.death {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.12);
    }

    .log-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.7rem;
    }

    .log-body {
      color: var(--text-main);
      word-break: break-word;
    }

    .choice-banner {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid var(--warning);
      border-radius: 6px;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .choice-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--warning);
    }

    .choice-desc {
      font-size: 0.78rem;
      color: var(--text-main);
    }

    .choice-options {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      padding: 0.4rem 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .todo-item.done {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .todo-checkbox {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Real Lives 2026 Engine</h1>
      <div style="font-size: 0.75rem; color: var(--text-sub);">Interactive Realism Matrix & Decision Engine</div>
    </div>
    <span id="badge-age" class="badge">Age 30.0</span>
  </header>

  <div class="layout-grid">
    <!-- Left Panel: State Metrics & Reset -->
    <aside class="panel">
      <div class="panel-header">
        <span>Status</span>
        <span id="badge-status" class="badge alive">Alive</span>
      </div>

      <button id="btn-step">Run Simulation Step</button>

      <div class="panel-header" style="margin-top: 0.25rem;">Biological Domain</div>
      <div id="bio-root" class="stat-list"></div>

      <div class="panel-header" style="margin-top: 0.25rem;">Socio-Economic Domain</div>
      <div id="econ-root" class="stat-list"></div>

      <button id="btn-reset" class="btn-sub" style="margin-top: auto;">Reset State Machine</button>
    </aside>

    <!-- Middle Panel: Event Pipeline Stream & Choices -->
    <main class="panel">
      <div class="panel-header">
        <span>Execution Stream & Events</span>
        <span id="badge-count" class="badge">888 Realism Active</span>
      </div>

      <!-- Dynamic Interruption Choice Node -->
      <div id="choice-root" style="display: none;"></div>

      <div id="log-viewport" class="scroll-viewport"></div>
    </main>

    <!-- Right Panel: Actions & Realism To-Do Vector -->
    <aside class="panel">
      <div class="panel-header">Active Interventions</div>
      <div id="actions-root" style="display: flex; flex-direction: column; gap: 0.4rem;"></div>

      <div class="panel-header" style="margin-top: 0.5rem;">Realism To-Do Directives</div>
      <div id="todo-root" class="scroll-viewport" style="height: 240px;"></div>
    </aside>
  </div>

  <script>
    /**
     * Real Lives 2026 Engine - Single File Monolith
     * Integrated Choice, Action, and Realism To-Do State Engine.
     */

    // --- Core State Model ---
    const createInitialState = () => ({
      age: 30.0,
      isAlive: true,
      pendingChoice: null,
      
      // Biological Metrics (#001–#300)
      telomeres: 1.0,
      mitochondria: 1.0,
      cvStrain: 0.0,
      inflammation: 0.0,
      immunity: 1.0,

      // Socio-Economic Metrics (#301–#600)
      capital: 5000.0,
      purchasingPower: 1.0,
      creditScore: 710,

      // Environmental Mechanics (#601–#888)
      infrastructure: 0.95,
      surveillance: 0.05,
      pathogens: 0.025,

      // Active Realism Directives (To-Do Vector)
      todos: [
        { id: "td1", label: "Mitigate Lead Service Line Exposure", done: false, triggerMechId: 465 },
        { id: "td2", label: "Stabilize Mitochondrial ATP Efficiency", done: false, triggerMechId: 426 },
        { id: "td3", label: "Build Capital Buffer (> $10,000)", done: false, check: (s) => s.capital >= 10000 },
        { id: "td4", label: "Maintain Immune Efficacy Above 80%", done: false, check: (s) => s.immunity >= 0.8 }
      ]
    });

    let state = createInitialState();

    // --- Realism Action Deck ---
    const ActionRegistry = [
      {
        id: "act_hb",
        name: "Hyperbaric Oxygen Therapy",
        cost: 400,
        getAvailable: (s) => s.capital >= 400,
        exec: (s) => {
          s.capital -= 400;
          s.mitochondria = Math.min(1.0, s.mitochondria + 0.08);
          s.inflammation = Math.max(0, s.inflammation - 0.05);
          return { text: "Executed Hyperbaric Oxygen Therapy. Mitochondrial health restored.", level: "action" };
        }
      },
      {
        id: "act_wf",
        name: "Install Reverse Osmosis Filter",
        cost: 250,
        getAvailable: (s) => s.capital >= 250,
        exec: (s) => {
          s.capital -= 250;
          s.infrastructure = Math.min(1.0, s.infrastructure + 0.1);
          s.inflammation = Math.max(0, s.inflammation - 0.1);
          const td = s.todos.find(t => t.id === "td1");
          if (td) td.done = true;
          return { text: "Installed Reverse Osmosis Filter. Reduced toxic heavy metal exposure.", level: "action" };
        }
      },
      {
        id: "act_cpap",
        name: "Adopt CPAP Therapy",
        cost: 600,
        getAvailable: (s) => s.capital >= 600,
        exec: (s) => {
          s.capital -= 600;
          s.cvStrain = Math.max(0, s.cvStrain - 0.2);
          return { text: "Adopted CPAP Therapy. Reduced nocturnal cardiovascular strain.", level: "action" };
        }
      },
      {
        id: "act_inv",
        name: "Yield-Bearing Asset Allocation",
        cost: 1000,
        getAvailable: (s) => s.capital >= 1000,
        exec: (s) => {
          s.capital -= 1000;
          s.purchasingPower = Math.min(1.5, s.purchasingPower + 0.05);
          return { text: "Allocated $1,000 to capital yield assets.", level: "action" };
        }
      }
    ];

    // --- Choice Realism Events Array ---
    const ChoiceEvents = [
      {
        id: "ch_med",
        name: "Experimental Cellular Therapy",
        desc: "An experimental peptide therapy promises mitochondrial repair, but carries credit risk and severe potential side effects.",
        options: [
          {
            label: "Authorize Therapy ($1,500)",
            getValid: (s) => s.capital >= 1500,
            resolve: (s) => {
              s.capital -= 1500;
              s.mitochondria = Math.min(1.0, s.mitochondria + 0.25);
              return { text: "Authorized cellular therapy. Mitochondrial integrity restored +0.25.", level: "action" };
            }
          },
          {
            label: "Decline and Preserve Reserves",
            getValid: () => true,
            resolve: (s) => {
              s.mitochondria = Math.max(0, s.mitochondria - 0.05);
              return { text: "Declined therapy. Mitochondrial degradation continues.", level: "warning" };
            }
          }
        ]
      },
      {
        id: "ch_macro",
        name: "Automated Sovereign Bail-In Notice",
        desc: "Sovereign debt instability requires mandatory deposit haircut or transition to decentralized capital reserves.",
        options: [
          {
            label: "Accept Liquidity Loss (-20% Capital)",
            getValid: () => true,
            resolve: (s) => {
              s.capital *= 0.8;
              return { text: "Accepted 20% liquid capital bail-in penalty.", level: "warning" };
            }
          },
          {
            label: "Pay Algorithmic Hedge Fee ($800)",
            getValid: (s) => s.capital >= 800,
            resolve: (s) => {
              s.capital -= 800;
              s.purchasingPower *= 0.98;
              return { text: "Hedged capital against sovereign bail-in.", level: "action" };
            }
          }
        ]
      }
    ];

    // --- Full 888 Mechanics Registry Matrix ---
    const buildFullMatrix = () => {
      const bioTerms = ["Epigenetic", "Mitochondrial", "Vascular", "Immune", "Neuro", "Cellular", "Metabolic", "Endocrine"];
      const econTerms = ["Algorithmic", "Liquidity", "Credit", "Market", "Regulatory", "Taxation", "Asset", "Debt"];
      const envTerms = ["Grid", "Subsea", "Atmospheric", "Pathogen", "Microplastic", "Surveillance", "Infrastructure", "Thermal"];

      const matrix = [];

      for (let id = 1; id <= 888; id++) {
        if (id === 426) {
          matrix.push({
            id: 426,
            name: "Mitochondrial Cytopathy",
            category: "Biological",
            getProb: (s) => 0.01 * (2.0 - s.mitochondria),
            exec: (s) => {
              s.mitochondria = Math.max(0, s.mitochondria - 0.12);
              return { text: "Cellular ATP output degraded by mitochondrial cytopathy.", level: "warning" };
            }
          });
          continue;
        }

        if (id === 434) {
          matrix.push({
            id: 434,
            name: "Sleep Apnea CV Strain",
            category: "Biological",
            getProb: (s) => 0.04 * (1.0 + s.cvStrain * 2.5),
            exec: (s) => {
              s.cvStrain = Math.min(1.0, s.cvStrain + 0.15);
              return { text: "Nocturnal hypoxia increased vascular load.", level: "warning" };
            }
          });
          continue;
        }

        if (id === 435) {
          matrix.push({
            id: 435,
            name: "Sovereign Bond Cascade",
            category: "Socio-Economic",
            getProb: () => 0.005,
            exec: (s) => {
              s.capital *= 0.85;
              s.purchasingPower *= 0.80;
              return { text: "Macro debt crisis liquidated 15% liquid reserves.", level: "danger" };
            }
          });
          continue;
        }

        if (id === 465) {
          matrix.push({
            id: 465,
            name: "Lead Water Service Line Toxicity",
            category: "Environmental",
            getProb: (s) => 0.03 * (1.0 - s.infrastructure) * 4.0,
            exec: (s) => {
              s.inflammation = Math.min(1.0, s.inflammation + 0.2);
              return { text: "Heavy metal exposure increased systemic inflammation.", level: "danger" };
            }
          });
          continue;
        }

        if (id === 517) {
          matrix.push({
            id: 517,
            name: "Algorithmic Credit Rating Reduction",
            category: "Socio-Economic",
            getProb: (s) => (s.capital < 1000 ? 0.08 : 0.02),
            exec: (s) => {
              s.creditScore = Math.max(300, s.creditScore - 55);
              return { text: "Automated risk model degraded credit score.", level: "warning" };
            }
          });
          continue;
        }

        if (id === 888) {
          matrix.push({
            id: 888,
            name: "Subsea Telecom Cable Sabotage",
            category: "Environmental",
            getProb: () => 0.002,
            exec: (s) => {
              s.purchasingPower *= 0.95;
              return { text: "Global data link loss triggered supply chain shock.", level: "danger" };
            }
          });
          continue;
        }

        if (id <= 300) {
          const name = `${bioTerms[id % bioTerms.length]} Marker Shift #${id}`;
          matrix.push({
            id,
            name,
            category: "Biological",
            getProb: (s) => 0.003 * (1.0 + s.inflammation),
            exec: (s) => {
              s.mitochondria = Math.max(0, s.mitochondria - 0.012);
              s.cvStrain = Math.min(1.0, s.cvStrain + 0.008);
              return { text: `Systemic biological adjustment resolved (${name}).`, level: "system" };
            }
          });
        } else if (id <= 600) {
          const name = `${econTerms[id % econTerms.length]} Adjustment #${id}`;
          matrix.push({
            id,
            name,
            category: "Socio-Economic",
            getProb: (s) => 0.004 * (s.capital < 2000 ? 1.4 : 0.8),
            exec: (s) => {
              s.capital = Math.max(0, s.capital - 40);
              s.purchasingPower = Math.max(0.1, s.purchasingPower - 0.004);
              return { text: `Economic metric shift resolved (${name}).`, level: "warning" };
            }
          });
        } else {
          const name = `${envTerms[id % envTerms.length]} Event #${id}`;
          matrix.push({
            id,
            name,
            category: "Environmental",
            getProb: (s) => 0.0025 * (1.0 + (1.0 - s.infrastructure)),
            exec: (s) => {
              s.infrastructure = Math.max(0, s.infrastructure - 0.006);
              s.inflammation = Math.min(1.0, s.inflammation + 0.008);
              return { text: `Environmental vector impact processed (${name}).`, level: "system" };
            }
          });
        }
      }

      return matrix;
    };

    const MatrixRegistry = buildFullMatrix();

    // --- Simulation Core Loop ---
    const runSimulationStep = (s) => {
      if (!s.isAlive || s.pendingChoice) return [];

      const stepLogs = [];
      s.age += 1.0;

      // Baseline bio-decay updates
      s.telomeres -= 0.007 * (1.0 + s.inflammation * 0.5);
      s.mitochondria -= 0.005 * (1.0 + s.cvStrain * 0.4);
      s.infrastructure = Math.max(0, s.infrastructure - 0.01);

      // Execute Registry Matrix
      for (let i = 0; i < MatrixRegistry.length; i++) {
        const mechanic = MatrixRegistry[i];
        if (Math.random() < mechanic.getProb(s)) {
          const res = mechanic.exec(s);
          stepLogs.push({
            id: mechanic.id,
            name: mechanic.name,
            category: mechanic.category,
            text: res.text,
            level: res.level
          });
        }
      }

      // Check Choice Event Triggers
      if (Math.random() < 0.25) {
        const choiceEvent = ChoiceEvents[Math.floor(Math.random() * ChoiceEvents.length)];
        s.pendingChoice = choiceEvent;
      }

      // Check Realism To-Do State Auto-Completions
      s.todos.forEach(t => {
        if (!t.done && t.check && t.check(s)) {
          t.done = true;
          stepLogs.push({
            id: 0,
            name: "DIRECTIVE COMPLETE",
            category: "To-Do",
            text: `Completed realism directive: ${t.label}`,
            level: "action"
          });
        }
      });

      // Life State Verification Guard Clause
      if (s.telomeres <= 0.05 || s.mitochondria <= 0.05 || s.immunity <= 0.0) {
        s.isAlive = false;
        stepLogs.push({
          id: 0,
          name: "TERMINATION",
          category: "System",
          text: `Critical state reached. Biological failure at age ${s.age.toFixed(1)}.`,
          level: "death"
        });
      }

      return stepLogs;
    };

    // --- DOM Cache & Batch Rendering ---
    const DOM = {
      btnStep: document.getElementById('btn-step'),
      btnReset: document.getElementById('btn-reset'),
      badgeAge: document.getElementById('badge-age'),
      badgeStatus: document.getElementById('badge-status'),
      bioRoot: document.getElementById('bio-root'),
      econRoot: document.getElementById('econ-root'),
      logViewport: document.getElementById('log-viewport'),
      choiceRoot: document.getElementById('choice-root'),
      actionsRoot: document.getElementById('actions-root'),
      todoRoot: document.getElementById('todo-root')
    };

    const renderProgressRow = (label, val, maxVal = 1.0, invertColors = false) => {
      const pct = Math.min(100, Math.max(0, (val / maxVal) * 100));
      let fillClass = '';
      
      if (invertColors) {
        if (pct > 60) fillClass = 'danger';
        else if (pct > 30) fillClass = 'warning';
      } else {
        if (pct < 30) fillClass = 'danger';
        else if (pct < 60) fillClass = 'warning';
      }

      return `
        <div>
          <div class="stat-row">
            <span class="stat-label">${label}</span>
            <span class="stat-val">${val.toFixed(2)}</span>
          </div>
          <div class="track">
            <div class="fill ${fillClass}" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    };

    const renderState = (logs = []) => {
      // 1. Batch UI Updates
      DOM.badgeAge.textContent = `Age ${state.age.toFixed(1)}`;
      DOM.badgeStatus.textContent = state.isAlive ? "Alive" : "Deceased";
      DOM.badgeStatus.className = `badge ${state.isAlive ? 'alive' : 'dead'}`;
      DOM.btnStep.disabled = !state.isAlive || !!state.pendingChoice;

      DOM.bioRoot.innerHTML = `
        ${renderProgressRow("Mitochondrial Health", state.mitochondria)}
        ${renderProgressRow("Telomere Integrity", state.telomeres)}
        ${renderProgressRow("CV Strain", state.cvStrain, 1.0, true)}
        ${renderProgressRow("Chronic Inflammation", state.inflammation, 1.0, true)}
        ${renderProgressRow("Immune Efficacy", state.immunity)}
      `;

      DOM.econRoot.innerHTML = `
        <div class="stat-row">
          <span class="stat-label">Liquid Capital</span>
          <span class="stat-val">$${state.capital.toFixed(2)}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Purchasing Power</span>
          <span class="stat-val">${(state.purchasingPower * 100).toFixed(0)}%</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Credit Rating</span>
          <span class="stat-val">${state.creditScore}</span>
        </div>
      `;

      // 2. Render Active Choice Interruption Banner
      if (state.pendingChoice) {
        const c = state.pendingChoice;
        DOM.choiceRoot.style.display = 'block';
        DOM.choiceRoot.innerHTML = `
          <div class="choice-banner">
            <div class="choice-title">DECISION REQUIRED: ${c.name}</div>
            <div class="choice-desc">${c.desc}</div>
            <div class="choice-options">
              ${c.options.map((opt, idx) => `
                <button ${!opt.getValid(state) ? 'disabled' : ''} onclick="resolveChoice(${idx})">
                  ${opt.label}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        DOM.choiceRoot.style.display = 'none';
        DOM.choiceRoot.innerHTML = '';
      }

      // 3. Render Interventions (Actions Panel)
      DOM.actionsRoot.innerHTML = ActionRegistry.map(act => `
        <button class="btn-action" ${(!state.isAlive || !act.getAvailable(state) || !!state.pendingChoice) ? 'disabled' : ''} onclick="executeAction('${act.id}')">
          <span>${act.name}</span>
          <span style="font-size: 0.7rem; color: var(--text-sub);">$${act.cost} • Action Command</span>
        </button>
      `).join('');

      // 4. Render To-Do Vector Directives
      DOM.todoRoot.innerHTML = state.todos.map(t => `
        <div class="todo-item ${t.done ? 'done' : ''}">
          <input type="checkbox" class="todo-checkbox" ${t.done ? 'checked' : ''} disabled />
          <span>${t.label}</span>
        </div>
      `).join('');

      // 5. Append Event Logs via DocumentFragment
      if (logs.length > 0) {
        const fragment = document.createDocumentFragment();
        
        logs.forEach(log => {
          const div = document.createElement('div');
          div.className = `log-card ${log.level}`;
          div.innerHTML = `
            <div class="log-meta">
              <span>#${log.id} • ${log.category}</span>
              <span>Age ${state.age.toFixed(1)}</span>
            </div>
            <div class="log-body">
              <strong>${log.name}</strong> — ${log.text}
            </div>
          `;
          fragment.appendChild(div);
        });

        DOM.logViewport.appendChild(fragment);
        DOM.logViewport.scrollTop = DOM.logViewport.scrollHeight;
      }
    };

    // --- Action & Choice Controller Interactivity ---
    window.executeAction = (actionId) => {
      const act = ActionRegistry.find(a => a.id === actionId);
      if (!act || !act.getAvailable(state) || !state.isAlive) return;
      const res = act.exec(state);
      renderState([{
        id: 0,
        name: act.name,
        category: "Action",
        text: res.text,
        level: res.level
      }]);
    };

    window.resolveChoice = (optionIdx) => {
      if (!state.pendingChoice) return;
      const opt = state.pendingChoice.options[optionIdx];
      if (!opt || !opt.getValid(state)) return;
      
      const res = opt.resolve(state);
      state.pendingChoice = null;

      renderState([{
        id: 0,
        name: "CHOICE RESOLVED",
        category: "Decision",
        text: res.text,
        level: res.level
      }]);
    };

    // --- Primary Controllers ---
    DOM.btnStep.addEventListener('click', () => {
      if (!state.isAlive || !!state.pendingChoice) return;
      const logs = runSimulationStep(state);
      renderState(logs);
    });

    DOM.btnReset.addEventListener('click', () => {
      state = createInitialState();
      DOM.logViewport.innerHTML = '';
      renderState([{
        id: 0,
        name: "INITIALIZATION",
        category: "System",
        text: "State engine reinitialized to default configuration.",
        level: "system"
      }]);
    });

    // Initial View Render
    renderState([{
      id: 0,
      name: "ENGINE READY",
      category: "System",
      text: "Real Lives 2026 Core active. Choices, Actions, and To-Dos integrated.",
      level: "system"
    }]);
  </script>
</body>
</html>
