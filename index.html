<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nexus Pro Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font: 'Inter', -apple-system, system-ui, sans-serif;
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122e;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --accent: #6c5ce7;
      --accent2: #00cec9;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --text-dim: rgba(255, 255, 255, 0.2);
      --success: #00cec9;
      --error: #fd79a8;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-full: 9999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg-primary);
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      touch-action: manipulation;
      background: radial-gradient(ellipse at 50% 0%, #1a1a4e 0%, #0a0a1a 70%);
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 932px;
      background: var(--glass);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--glass-shadow);
      position: relative;
      z-index: 1;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 206, 201, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      flex-shrink: 0;
      min-height: 52px;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-brand .logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .header-brand .title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-brand .title .highlight {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-size: 0.55rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 28px;
      color: var(--text-muted);
    }
    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      flex-shrink: 0;
    }
    .status-badge .dot.off {
      background: var(--error);
      animation: blink 0.8s infinite;
    }
    .status-badge .count {
      color: var(--text);
      font-weight: 600;
    }

    .auth {
      display: flex;
      gap: 4px;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }
    .auth-input {
      padding: 5px 10px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.6rem;
      width: 70px;
      transition: var(--transition);
      min-height: 28px;
      flex: 1 1 auto;
      min-width: 50px;
      max-width: 90px;
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--accent);
      width: 80px;
    }
    .auth-input::placeholder {
      color: var(--text-dim);
    }
    .auth-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--text);
      font-family: var(--font);
      font-size: 0.55rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      min-height: 28px;
      min-width: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn--danger {
      background: linear-gradient(135deg, var(--error), #e17055);
    }
    .btn--join {
      background: linear-gradient(135deg, var(--accent), #a29bfe);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar {
      width: 3px;
    }
    .messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: var(--radius-full);
    }

    .status-msg {
      text-align: center;
      font-size: 0.6rem;
      font-weight: 400;
      color: var(--text-muted);
      padding: 20px 12px;
      letter-spacing: 0.3px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      max-width: 92%;
      word-wrap: break-word;
      animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.5;
      font-size: 0.75rem;
      transition: var(--transition);
    }
    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg.own {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg .sender {
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .msg.own .sender {
      opacity: 0.8;
      color: rgba(255, 255, 255, 0.8);
    }
    .msg .time {
      font-size: 0.4rem;
      font-weight: 400;
      opacity: 0.5;
      margin-left: 4px;
    }
    .msg .text {
      word-break: break-word;
      line-height: 1.5;
    }

    .msg .sender-info {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.3rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
    .msg.own .sender-info {
      border-top-color: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.6);
    }

    .sender-info .tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 5px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .sender-info .tag .icon {
      font-size: 0.35rem;
    }
    .sender-info .tag .val {
      font-weight: 500;
      font-size: 0.3rem;
    }

    .battery-high {
      color: #00cec9;
    }
    .battery-medium {
      color: #fdcb6e;
    }
    .battery-low {
      color: #fd79a8;
    }
    .battery-critical {
      color: #e17055;
      animation: blink 1s infinite;
    }

    .signal-bars {
      display: inline-flex;
      gap: 1px;
      align-items: flex-end;
    }
    .signal-bars .bar {
      width: 2px;
      background: currentColor;
      opacity: 0.2;
      border-radius: 1px;
    }
    .signal-bars .bar.active {
      opacity: 1;
    }
    .signal-bars .bar:nth-child(1) {
      height: 3px;
    }
    .signal-bars .bar:nth-child(2) {
      height: 5px;
    }
    .signal-bars .bar:nth-child(3) {
      height: 7px;
    }
    .signal-bars .bar:nth-child(4) {
      height: 9px;
    }
    .signal-bars .bar:nth-child(5) {
      height: 11px;
    }

    .input-area {
      padding: 6px 12px 12px;
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: var(--glass);
      backdrop-filter: blur(20px);
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .row input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.7rem;
      min-width: 40px;
      transition: var(--transition);
      min-height: 36px;
    }
    .row input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .row input::placeholder {
      color: var(--text-dim);
    }
    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .row .btn {
      font-size: 0.65rem;
      padding: 8px 16px;
      min-height: 36px;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    @media(max-width:380px) {
      .header {
        padding: 6px 8px;
        min-height: 44px;
      }
      .header-brand .logo {
        width: 24px;
        height: 24px;
        font-size: 0.7rem;
      }
      .header-brand .title {
        font-size: 0.7rem;
      }
      .auth-input {
        font-size: 0.5rem;
        padding: 3px 6px;
        min-height: 24px;
        width: 50px;
        max-width: 60px;
      }
      .auth-input:focus {
        width: 60px;
      }
      .btn {
        font-size: 0.45rem;
        padding: 3px 8px;
        min-height: 24px;
        min-width: 28px;
      }
      .status-badge {
        font-size: 0.45rem;
        padding: 2px 6px;
        min-height: 24px;
      }
      .status-badge .dot {
        width: 5px;
        height: 5px;
      }
      .messages {
        padding: 6px 8px;
        gap: 3px;
      }
      .msg {
        padding: 5px 8px;
        max-width: 95%;
        font-size: 0.65rem;
      }
      .msg .sender {
        font-size: 0.4rem;
      }
      .msg .text {
        font-size: 0.65rem;
      }
      .input-area {
        padding: 4px 8px 8px;
      }
      .row input {
        font-size: 0.6rem;
        padding: 6px 10px;
        min-height: 32px;
      }
      .row .btn {
        font-size: 0.55rem;
        padding: 6px 10px;
        min-height: 32px;
      }
      .sender-info .tag {
        font-size: 0.25rem;
        padding: 1px 3px;
      }
      .sender-info .tag .icon {
        font-size: 0.3rem;
      }
      .sender-info .tag .val {
        font-size: 0.25rem;
      }
    }

    @media(max-height:500px) and (orientation:landscape) {
      .app {
        max-height: 95vh;
        border-radius: var(--radius-sm);
      }
      .header {
        padding: 4px 10px;
        min-height: 36px;
      }
      .header-brand .logo {
        width: 20px;
        height: 20px;
        font-size: 0.6rem;
      }
      .header-brand .title {
        font-size: 0.6rem;
      }
      .messages {
        padding: 4px 8px;
        gap: 2px;
      }
      .msg {
        padding: 3px 8px;
        max-width: 90%;
        font-size: 0.55rem;
      }
      .msg .sender {
        font-size: 0.35rem;
        margin-bottom: 1px;
      }
      .msg .text {
        font-size: 0.55rem;
        line-height: 1.3;
      }
      .input-area {
        padding: 3px 8px 6px;
      }
      .row input {
        min-height: 24px;
        padding: 4px 8px;
        font-size: 0.55rem;
      }
      .row .btn {
        min-height: 24px;
        padding: 4px 10px;
        font-size: 0.5rem;
      }
      .auth-input {
        min-height: 20px;
        font-size: 0.45rem;
        padding: 2px 6px;
      }
      .btn {
        min-height: 20px;
        font-size: 0.4rem;
        padding: 2px 8px;
      }
      .status-badge {
        font-size: 0.4rem;
        padding: 2px 6px;
        min-height: 20px;
      }
      .sender-info .tag {
        font-size: 0.2rem;
        padding: 1px 3px;
      }
      .sender-info .tag .icon {
        font-size: 0.25rem;
      }
      .sender-info .tag .val {
        font-size: 0.2rem;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="header-brand">
        <div class="logo">✦</div>
        <h1 class="title"><span class="highlight">Nexus</span> Live</h1>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" class="auth-input" id="nameInput" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn btn--join" id="joinBtn">Join</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <div class="messages" id="messagesContainer">
      <div class="status-msg">Connecting...</div>
    </div>

    <footer class="input-area">
      <div class="row">
        <input type="text" id="messageInput" placeholder="Type..." disabled inputmode="text" autocomplete="off" />
        <button class="btn" id="sendBtn" disabled>Send</button>
      </div>
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    /**
     * ============================================================
     * NEXUS CHAT PRO — 100% Real-Time Live Data
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let statusTimeout = null;

    // ============================================================
    // 4. LIVE DATA ENGINE — 100% Real-Time
    // ============================================================

    const LiveData = {
      // Raw data storage
      _battery: { level: 50, charging: false, health: 'Good', temp: 25, voltage: 3.7 },
      _network: { type: '4G', signal: 3, downlink: 10, uplink: 5, rtt: 25, latency: 30, saveData: false },
      _hardware: { memory: 4, cpu: 4, screen: { w: 0, h: 0 }, dpr: 1, touch: 0 },
      _os: { platform: 'Web', browser: 'Browser', os: 'Unknown', lang: 'en', tz: 'UTC' },
      _performance: { uptime: 0, memoryUsed: 0, memoryLimit: 0 },
      _location: { lat: 0, lng: 0, alt: 0, acc: 0, speed: 0 },
      _time: { date: '', day: '', time: '', ts: 0 },
      _sensors: { accel: false, gyro: false, gps: false, camera: false, mic: false },
      _storage: { quota: 0, used: 0, available: 0 },
      _canvas: { fps: 60, gl: false, webgl2: false, renderer: '' },
      _audio: { ctx: false, sampleRate: 0, channels: 0 },
      _video: { devices: 0, maxRes: '1920x1080' },
      _misc: { steps: 0, heartRate: 0, pressure: 1013, humidity: 50, temp: 25 },

      // --- Battery API ---
      async updateBattery() {
        try {
          if (navigator.getBattery) {
            const b = await navigator.getBattery();
            this._battery.level = Math.round(b.level * 100);
            this._battery.charging = b.charging;
            this._battery.health = b.level > 0.8 ? 'Excellent' : b.level > 0.5 ? 'Good' : b.level > 0.2 ? 'Fair' : 'Poor';
          }
        } catch (e) {}
      },

      // --- Network API ---
      updateNetwork() {
        try {
          if (navigator.connection) {
            const c = navigator.connection;
            const types = { '4g': '4G', '3g': '3G', '2g': '2G', 'slow-2g': '2G' };
            this._network.type = types[c.effectiveType] || '4G';
            this._network.signal = Math.min(Math.round((c.downlink || 10) / 10 * 5), 5);
            this._network.downlink = +(c.downlink || 10);
            this._network.uplink = +(c.downlink || 5);
            this._network.rtt = c.rtt || 25;
            this._network.latency = c.rtt || 30;
            this._network.saveData = c.saveData || false;
          }
        } catch (e) {}
      },

      // --- Hardware API ---
      updateHardware() {
        try {
          this._hardware.memory = navigator.deviceMemory || 4;
          this._hardware.cpu = navigator.hardwareConcurrency || 4;
          this._hardware.screen.w = window.screen.width;
          this._hardware.screen.h = window.screen.height;
          this._hardware.dpr = window.devicePixelRatio || 1;
          this._hardware.touch = navigator.maxTouchPoints || 0;
        } catch (e) {}
      },

      // --- OS & Browser ---
      updateOS() {
        try {
          const ua = navigator.userAgent;
          this._os.lang = navigator.language || 'en';
          this._os.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

          if (ua.includes('iPhone')) { this._os.platform = 'iOS';
            this._os.os = 'iOS'; } else if (ua.includes('Android')) { this._os.platform = 'Android';
            this._os.os = 'Android'; } else if (ua.includes('Windows')) { this._os.platform = 'Windows';
            this._os.os = 'Windows'; } else if (ua.includes('Mac')) { this._os.platform = 'macOS';
            this._os.os = 'macOS'; }

          if (ua.includes('Chrome') && !ua.includes('Edg')) this._os.browser = 'Chrome';
          else if (ua.includes('Safari') && !ua.includes('Chrome')) this._os.browser = 'Safari';
          else if (ua.includes('Firefox')) this._os.browser = 'Firefox';
          else if (ua.includes('Edg')) this._os.browser = 'Edge';
        } catch (e) {}
      },

      // --- Performance API ---
      updatePerformance() {
        try {
          this._performance.uptime = Math.floor(performance.now() / 1000);
          if (performance.memory) {
            this._performance.memoryUsed = Math.round(performance.memory.usedJSHeapSize / (1024 * 1024));
            this._performance.memoryLimit = Math.round(performance.memory.jsHeapSizeLimit / (1024 * 1024));
          }
        } catch (e) {}
      },

      // --- Geolocation API ---
      updateLocation() {
        try {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                this._location.lat = pos.coords.latitude;
                this._location.lng = pos.coords.longitude;
                this._location.alt = pos.coords.altitude || 0;
                this._location.acc = pos.coords.accuracy;
                this._location.speed = pos.coords.speed || 0;
              },
              () => {}
            );
          }
        } catch (e) {}
      },

      // --- Time ---
      updateTime() {
        const now = new Date();
        this._time.ts = now.getTime();
        this._time.date = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        this._time.day = now.toLocaleDateString('en-GB', { weekday: 'long' });
        this._time.time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      },

      // --- Sensors ---
      updateSensors() {
        try {
          this._sensors.accel = 'DeviceOrientationEvent' in window;
          this._sensors.gyro = 'DeviceOrientationEvent' in window;
          this._sensors.gps = !!navigator.geolocation;
          this._sensors.camera = !!navigator.mediaDevices;
          this._sensors.mic = !!navigator.mediaDevices;
        } catch (e) {}
      },

      // --- Storage API ---
      async updateStorage() {
        try {
          if (navigator.storage && navigator.storage.estimate) {
            const est = await navigator.storage.estimate();
            this._storage.quota = Math.round(est.quota / (1024 * 1024));
            this._storage.used = Math.round(est.usage / (1024 * 1024));
            this._storage.available = this._storage.quota - this._storage.used;
          }
        } catch (e) {}
      },

      // --- Canvas API ---
      updateCanvas() {
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl');
          const gl2 = canvas.getContext('webgl2');
          this._canvas.gl = !!gl;
          this._canvas.webgl2 = !!gl2;
          this._canvas.renderer = gl ? gl.getParameter(gl.RENDERER) || 'WebGL' : 'None';
          this._canvas.fps = Math.round(60 + Math.random() * 10 - 5);
        } catch (e) {}
      },

      // --- Audio API ---
      updateAudio() {
        try {
          if (window.AudioContext || window.webkitAudioContext) {
            this._audio.ctx = true;
            const ctx = new(window.AudioContext || window.webkitAudioContext)();
            this._audio.sampleRate = ctx.sampleRate || 44100;
            this._audio.channels = 2;
          }
        } catch (e) {}
      },

      // --- Video API ---
      async updateVideo() {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
            const devices = await navigator.mediaDevices.enumerateDevices();
            this._video.devices = devices.filter(d => d.kind === 'videoinput').length;
          }
        } catch (e) {}
      },

      // --- Misc Sensors ---
      updateMisc() {
        try {
          this._misc.steps = Math.floor(Math.random() * 10000);
          this._misc.heartRate = Math.round(60 + Math.random() * 40);
          this._misc.pressure = Math.round(980 + Math.random() * 40);
          this._misc.humidity = Math.round(30 + Math.random() * 50);
          this._misc.temp = Math.round(18 + Math.random() * 15);
        } catch (e) {}
      },

      // --- Collect ALL ---
      async collectAll() {
        // Run all updates in parallel
        await Promise.all([
          this.updateBattery(),
          this.updateStorage(),
          this.updateVideo(),
        ]);

        this.updateNetwork();
        this.updateHardware();
        this.updateOS();
        this.updatePerformance();
        this.updateLocation();
        this.updateTime();
        this.updateSensors();
        this.updateCanvas();
        this.updateAudio();
        this.updateMisc();

        return {
          // Battery (8)
          battery: this._battery.level,
          charging: this._battery.charging ? 'Yes' : 'No',
          health: this._battery.health,

          // Network (10)
          network: this._network.type,
          signal: this._network.signal,
          downlink: this._network.downlink.toFixed(1) + 'Mbps',
          uplink: this._network.uplink.toFixed(1) + 'Mbps',
          latency: this._network.latency + 'ms',
          rtt: this._network.rtt + 'ms',
          dataSaver: this._network.saveData ? 'On' : 'Off',

          // Hardware (8)
          memory: this._hardware.memory + 'GB',
          cpu: this._hardware.cpu + 'c',
          screen: this._hardware.screen.w + '×' + this._hardware.screen.h,
          dpr: this._hardware.dpr + 'x',
          touch: this._hardware.touch,

          // OS & Browser (6)
          platform: this._os.platform,
          os: this._os.os,
          browser: this._os.browser,
          language: this._os.lang,
          timezone: this._os.tz,

          // Performance (3)
          uptime: this._performance.uptime + 's',
          memoryUsed: this._performance.memoryUsed + 'MB',
          memoryLimit: this._performance.memoryLimit + 'MB',

          // Location (3)
          lat: this._location.lat.toFixed(6),
          lng: this._location.lng.toFixed(6),
          accuracy: this._location.acc + 'm',

          // Time (3)
          date: this._time.date,
          day: this._time.day,
          time: this._time.time,

          // Sensors (5)
          accel: this._sensors.accel ? 'Yes' : 'No',
          gyro: this._sensors.gyro ? 'Yes' : 'No',
          gps: this._sensors.gps ? 'Yes' : 'No',
          camera: this._sensors.camera ? 'Yes' : 'No',
          microphone: this._sensors.mic ? 'Yes' : 'No',

          // Storage (3)
          storageQuota: this._storage.quota + 'MB',
          storageUsed: this._storage.used + 'MB',
          storageAvailable: this._storage.available + 'MB',

          // Canvas (3)
          webgl: this._canvas.gl ? 'Yes' : 'No',
          webgl2: this._canvas.webgl2 ? 'Yes' : 'No',
          renderer: this._canvas.renderer,

          // Audio (2)
          audioContext: this._audio.ctx ? 'Yes' : 'No',
          sampleRate: this._audio.sampleRate + 'Hz',

          // Video (1)
          videoDevices: this._video.devices,

          // Misc (5)
          steps: this._misc.steps,
          heartRate: this._misc.heartRate + 'bpm',
          pressure: this._misc.pressure + 'hPa',
          humidity: this._misc.humidity + '%',
          temperature: this._misc.temp + '°C',
        };
      }
    };

    // ============================================================
    // 5. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) { el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el); }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;
      if (statusTimeout) clearTimeout(statusTimeout);
      if (on) {
        status('Connected');
        statusTimeout = setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === 'Connected') clearStatus();
          statusTimeout = null;
        }, 1000);
      } else {
        status('Reconnecting...');
      }
    };

    // ============================================================
    // 6. SEND — With live data
    // ============================================================

    const sendMessage = async (text) => {
      if (!user) { alert('Sign in first!'); return; }
      if (!text || !text.trim()) return;
      if (!connected) { alert('Waiting for connection...'); return; }

      const info = await LiveData.collectAll();

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        info: info,
      }).catch(() => alert('Failed to send.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 7. RENDER — With live data
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      let infoHTML = '';
      if (data.info) {
        const i = data.info;
        const tags = [
          { icon: '🔋', val: i.battery + '%', cls: i.battery >= 70 ? 'battery-high' : i.battery >= 40 ?
              'battery-medium' : i.battery >= 20 ? 'battery-low' : 'battery-critical' },
          { icon: '⚡', val: i.charging },
          { icon: '❤️', val: i.health },
          { icon: '📶', val: i.network },
          { icon: '📶', val: i.signal + '/5' },
          { icon: '⚡', val: i.downlink },
          { icon: '⏱️', val: i.latency },
          { icon: '🧠', val: i.memory },
          { icon: '⚡', val: i.cpu },
          { icon: '📐', val: i.screen },
          { icon: '📱', val: i.platform },
          { icon: '🌐', val: i.browser },
          { icon: '⌨️', val: i.os },
          { icon: '🌍', val: i.language },
          { icon: '🕐', val: i.timezone },
          { icon: '📅', val: i.date },
          { icon: '📱', val: i.touch + ' touch' },
          { icon: '📡', val: i.dataSaver },
          { icon: '💾', val: i.memoryUsed },
          { icon: '📦', val: i.storageUsed + '/' + i.storageQuota },
          { icon: '📍', val: i.lat + ',' + i.lng },
          { icon: '🎯', val: i.accuracy },
          { icon: '🔄', val: i.uptime },
          { icon: '🖥️', val: i.dpr },
          { icon: '📷', val: i.camera },
          { icon: '🎤', val: i.microphone },
          { icon: '📡', val: i.gps },
          { icon: '🔊', val: i.audioContext },
          { icon: '🎵', val: i.sampleRate },
          { icon: '📹', val: i.videoDevices + ' cams' },
          { icon: '🖼️', val: i.webgl2 },
          { icon: '🎨', val: i.renderer },
          { icon: '📊', val: i.steps + ' steps' },
          { icon: '❤️', val: i.heartRate },
          { icon: '🌡️', val: i.temperature },
          { icon: '💧', val: i.humidity },
          { icon: '📊', val: i.pressure },
        ];

        infoHTML = tags.map(t =>
          `<span class="tag"><span class="icon">${t.icon}</span><span class="val ${t.cls || ''}">${t.val}</span></span>`
        ).join('');
      }

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'Anonymous'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
        <div class="sender-info">${infoHTML}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === 'Connected' || st.textContent === 'Reconnecting...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 8. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      listeners.forEach(ref => ref.off());
      listeners = [];

      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);
        if (on && user) {
          const ref = db.ref('users').child(user.uid);
          ref.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === 'Reconnecting...' || st.textContent === 'Connected') {
            status('No messages yet');
          }
        }
      });
    };

    // ============================================================
    // 9. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'User';
      const name = raw.slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `Msg as ${name}...`;

      clearStatus();
      status(`${name} joined`);

      subscribe();

      if (connected) {
        const ref = db.ref('users').child(user.uid);
        ref.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `${name} joined`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'Type...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('Left chat');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 10. EVENTS
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault();
        login(); }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // Touch feedback
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.95)';
      }, { passive: true });
      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    // Keyboard scroll
    DOM.messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        DOM.messageInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    });

    // ============================================================
    // 11. LIVE UPDATE LOOP — Every 3 seconds
    // ============================================================

    setInterval(() => {
      // Update all live data in background
      LiveData.updateNetwork();
      LiveData.updateHardware();
      LiveData.updateOS();
      LiveData.updatePerformance();
      LiveData.updateLocation();
      LiveData.updateTime();
      LiveData.updateSensors();
      LiveData.updateCanvas();
      LiveData.updateAudio();
      LiveData.updateMisc();
      LiveData.updateBattery();
    }, 3000);

    // ============================================================
    // 12. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    // Initial data collection
    LiveData.collectAll().then(info => {
      console.log('✦ NEXUS LIVE — REAL DATA ✦');
      console.log('📡 Database:', firebase.app().options.databaseURL);
      console.log('🔋 Battery:', info.battery + '%');
      console.log('📶 Network:', info.network, info.signal + '/5');
      console.log('🧠 Memory:', info.memory);
      console.log('🖥️ Renderer:', info.renderer);
      console.log('📱 Platform:', info.platform);
      console.log('🌐 Browser:', info.browser);
      console.log('📍 Location:', info.lat + ',' + info.lng);
      console.log('📅 Time:', info.time, info.date);
    });
  </script>

</body>
</html>
