<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Chat</title>

  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;:&quot;Global Chat&quot;,
    &quot;short_name&quot;:&quot;Chat&quot;,
    &quot;start_url&quot;:&quot;/&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#1a1a2e&quot;,
    &quot;theme_color&quot;:&quot;#16213e&quot;,
    &quot;icons&quot;:[{
      &quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316213e'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23e94560'%3E💬%3C/text%3E%3C/svg%3E&quot;,
      &quot;sizes&quot;:&quot;512x512&quot;,
      &quot;type&quot;:&quot;image/svg+xml&quot;
    }]
  }" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #0f0e17;
      color: #fffffe;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .chat-container {
      max-width: 800px;
      width: 100%;
      height: 90vh;
      background: #1a1a2e;
      border-radius: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 1.5rem 2rem;
      background: #16213e;
      border-bottom: 2px solid #e94560;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .chat-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .chat-header h1 span {
      color: #e94560;
    }
    .auth-section {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .auth-section input {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 2rem;
      background: #0f0e17;
      color: #fffffe;
      font-size: 0.9rem;
      width: 140px;
      transition: all 0.2s;
    }
    .auth-section input:focus {
      outline: 2px solid #e94560;
      width: 180px;
    }
    .auth-section button {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 2rem;
      background: #e94560;
      color: #fffffe;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .auth-section button:hover {
      transform: scale(1.05);
      background: #ff6b81;
    }
    .auth-section button.logout-btn {
      background: #2d2d44;
    }
    .auth-section button.logout-btn:hover {
      background: #3d3d5c;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: #12122a;
    }
    .messages-area::-webkit-scrollbar {
      width: 6px;
    }
    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-area::-webkit-scrollbar-thumb {
      background: #e94560;
      border-radius: 10px;
    }
    .message {
      padding: 0.7rem 1.2rem;
      border-radius: 1.2rem;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    .message.own {
      align-self: flex-end;
      background: #e94560;
      color: #fffffe;
      border-bottom-right-radius: 0.3rem;
    }
    .message.other {
      align-self: flex-start;
      background: #2d2d44;
      color: #fffffe;
      border-bottom-left-radius: 0.3rem;
    }
    .message .sender {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 0.2rem;
    }
    .message .time {
      font-size: 0.6rem;
      opacity: 0.5;
      margin-left: 0.8rem;
    }
    .message .text {
      font-size: 1rem;
      line-height: 1.4;
    }
    .input-area {
      padding: 1rem 2rem 1.5rem;
      background: #16213e;
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
      border-top: 1px solid #2d2d44;
    }
    .input-area input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 2rem;
      background: #0f0e17;
      color: #fffffe;
      font-size: 1rem;
      transition: 0.2s;
    }
    .input-area input:focus {
      outline: 2px solid #e94560;
    }
    .input-area input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .input-area button {
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 2rem;
      background: #e94560;
      color: #fffffe;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1rem;
    }
    .input-area button:hover:not(:disabled) {
      transform: scale(1.05);
      background: #ff6b81;
    }
    .input-area button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.5;
      padding: 0.3rem;
      font-style: italic;
    }
    .online-count {
      font-size: 0.8rem;
      opacity: 0.6;
      padding: 0.3rem 0.8rem;
      background: #0f0e17;
      border-radius: 2rem;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 600px) {
      .chat-header {
        flex-direction: column;
        padding: 1rem;
      }
      .auth-section input {
        width: 100px;
      }
      .auth-section input:focus {
        width: 130px;
      }
      .messages-area {
        padding: 1rem;
      }
      .input-area {
        padding: 0.75rem 1rem 1rem;
        flex-wrap: wrap;
      }
      .input-area input {
        min-width: 100px;
      }
      .message {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>🌍 Global <span>Chat</span></h1>
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
        <span class="online-count" id="onlineCount">👤 0 online</span>
        <div class="auth-section" id="authSection">
          <input type="text" id="usernameInput" placeholder="Your name..." maxlength="20" />
          <button id="loginBtn">Join</button>
          <button id="logoutBtn" class="logout-btn" style="display:none;">Leave</button>
        </div>
      </div>
    </div>

    <div class="messages-area" id="messagesArea">
      <div class="status">👋 Sign in to start chatting</div>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." disabled />
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    // ============================================================
    // USING YOUR DATABASE URL - Firebase will work with just this
    // ============================================================
    const firebaseConfig = {
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // REST OF THE APP
    // ============================================================
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const usernameInput = document.getElementById('usernameInput');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const onlineCount = document.getElementById('onlineCount');

    let currentUser = null;
    let messageListeners = [];

    function subscribeToMessages() {
      messageListeners.forEach(ref => ref.off());
      messageListeners = [];

      const messagesRef = db.ref('messages');
      const query = messagesRef.orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        const data = snapshot.val();
        data._key = snapshot.key;
        appendMessage(data);
        scrollToBottom();
      });

      query.on('child_removed', (snapshot) => {
        const el = messagesArea.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      messageListeners.push(query);

      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          setStatus('💬 No messages yet. Say hello!');
        } else {
          const status = messagesArea.querySelector('.status');
          if (status) status.remove();
        }
      });

      setupPresence();
    }

    function setupPresence() {
      const presenceRef = db.ref('.info/connected');
      const usersRef = db.ref('users');

      presenceRef.on('value', (snap) => {
        if (snap.val() && currentUser) {
          const userRef = usersRef.child(currentUser.uid);
          userRef.set({
            name: currentUser.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          userRef.onDisconnect().remove();
        }
      });

      usersRef.on('value', (snap) => {
        onlineCount.textContent = snap.exists() ? `👤 ${snap.numChildren()} online` : '👤 0 online';
      });

      messageListeners.push(presenceRef);
    }

    function setStatus(text) {
      let status = messagesArea.querySelector('.status');
      if (!status) {
        status = document.createElement('div');
        status.className = 'status';
        messagesArea.appendChild(status);
      }
      status.textContent = text;
    }

    function appendMessage(data) {
      const isOwn = currentUser && data.uid === currentUser.uid;

      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      div.dataset.key = data._key;

      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = data.name || 'Anonymous';

      const time = document.createElement('span');
      time.className = 'time';
      if (data.timestamp) {
        const d = new Date(data.timestamp);
        time.textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      }
      sender.appendChild(time);

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = data.text || '';

      div.appendChild(sender);
      div.appendChild(text);
      messagesArea.appendChild(div);

      const status = messagesArea.querySelector('.status');
      if (status) status.remove();
    }

    function scrollToBottom() {
      setTimeout(() => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }, 100);
    }

    function sendMessage() {
      if (!currentUser) {
        alert('Please sign in first.');
        return;
      }

      const text = messageInput.value.trim();
      if (!text) return;

      db.ref('messages').push({
        name: currentUser.name,
        uid: currentUser.uid,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch((error) => {
        console.error('Send error:', error);
        alert('Failed to send. Check your connection.');
      });

      messageInput.value = '';
      messageInput.focus();
    }

    function login() {
      const name = usernameInput.value.trim() || 'Guest';
      currentUser = {
        name: name,
        uid: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      usernameInput.disabled = true;
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.placeholder = `Message as ${name}...`;

      setStatus(`✅ Signed in as ${name}`);
      messagesArea.innerHTML = '';
      subscribeToMessages();
    }

    function logout() {
      if (currentUser) {
        db.ref('users').child(currentUser.uid).remove();
      }

      messageListeners.forEach(ref => ref.off());
      messageListeners = [];

      currentUser = null;

      usernameInput.disabled = false;
      loginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
      messageInput.disabled = true;
      sendBtn.disabled = true;
      messageInput.placeholder = 'Sign in to chat...';
      messageInput.value = '';

      messagesArea.innerHTML = '';
      setStatus('👋 You left the chat. Sign in to rejoin.');
      onlineCount.textContent = '👤 0 online';
    }

    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    setStatus('🌐 Connecting...');
    subscribeToMessages();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('📦 SW registered'))
        .catch(() => console.log('ℹ️ SW registration skipped'));
    }

    console.log('💬 Global Chat ready');
  </script>

</body>
</html>
