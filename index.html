<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Web App</title>
  <style>
    :root {
      --bg-black: #121212;
      --bg-card: #000000;
      --text-main: #ffffff;
      --text-muted: #a6a6a6;
      --primary-red: #fe2c55;
      --border-color: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- TOP NAVBAR --- */
    header {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background-color: var(--bg-black);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
    }

    .brand-badge {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #25f4ee, var(--primary-red));
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-upload { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
    .btn-primary { background: var(--primary-red); color: white; }

    /* --- MAIN APP CONTAINER --- */
    .app-viewport {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* SIDEBAR */
    aside {
      width: 240px;
      border-right: 1px solid var(--border-color);
      padding: 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
    }

    .nav-link.active { color: var(--primary-red); }
    .nav-link:hover { background: rgba(255, 255, 255, 0.05); }

    /* FEED CONTAINER (VERTICAL SNAP SCROLL) */
    main {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .video-snap-item {
      scroll-snap-align: start;
      height: calc(100vh - 60px);
      width: 100%;
      max-width: 500px;
      padding: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }

    /* OVERLAY METADATA */
    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 70px;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .video-author { font-weight: 700; font-size: 1.1rem; }
    .video-desc { font-size: 0.9rem; line-height: 1.3; }

    /* ACTION BAR (RIGHT SIDE) */
    .action-sidebar {
      position: absolute;
      right: 12px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .icon-bubble {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: transform 0.2s, background-color 0.2s;
    }

    .action-btn:hover .icon-bubble { transform: scale(1.1); }
    .action-btn.active .icon-bubble { color: var(--primary-red); background: rgba(254, 44, 85, 0.2); }
    .action-label { font-size: 0.75rem; font-weight: 600; }

    /* COMMENT DRAWER */
    .comment-drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: #1e1e1e;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 20;
    }

    .comment-drawer.open { transform: translateY(0); }

    .drawer-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .close-btn { background: none; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; }

    .comment-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item { font-size: 0.85rem; line-height: 1.3; }
    .comment-user { font-weight: 700; color: var(--text-muted); margin-bottom: 2px; }

    .comment-input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .comment-input-area input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 16px;
      color: white;
      outline: none;
    }

    /* UPLOAD MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: #1e1e1e;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-card input, .modal-card textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      color: white;
      outline: none;
    }

    @media (max-width: 768px) {
      aside { display: none; }
      .video-snap-item { max-width: 100%; padding: 0; }
      .video-card { border-radius: 0; }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="brand">
      <div class="brand-badge"></div>
      <span>TikTok</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-upload" id="openUploadModal">+ Upload</button>
      <button class="btn btn-primary">Log In</button>
    </div>
  </header>

  <!-- VIEWPORT LAYOUT -->
  <div class="app-viewport">
    
    <!-- SIDE NAVIGATION -->
    <aside>
      <a class="nav-link active">🏠 For You</a>
      <a class="nav-link">👥 Following</a>
      <a class="nav-link">🧭 Explore</a>
      <a class="nav-link">🔴 LIVE</a>
      <a class="nav-link">👤 Profile</a>
    </aside>

    <!-- MAIN DYNAMIC FEED -->
    <main id="videoFeed">
      <!-- Video Snap Items dynamically rendered by JavaScript -->
    </main>

  </div>

  <!-- UPLOAD VIDEO MODAL -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-card">
      <h3>Upload Video to Feed</h3>
      <input type="file" id="videoFileInput" accept="video/*">
      <input type="text" id="authorInput" placeholder="@username">
      <textarea id="captionInput" placeholder="Write a caption..." rows="3"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-upload" id="closeUploadModal">Cancel</button>
        <button class="btn btn-primary" id="submitUpload">Publish</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. INITIAL DATABASE / FEED DATA ---
    const initialVideos = [
      {
        id: "v1",
        author: "@cyber_tokyo",
        caption: "Shinjuku rain vibes 🌧️✨ #tokyo #japan #cyberpunk",
        url: "https://assets.mixkit.co/videos/preview/mixkit-tokyo-street-at-night-4022-large.mp4",
        likes: 12400,
        liked: false,
        comments: ["Amazing video quality!", "I need to visit Japan ASAP!"]
      },
      {
        id: "v2",
        author: "@craftsman_lab",
        caption: "Handmade leather crafting process 🛠️ #craft #diy #satisfying",
        url: "https://assets.mixkit.co/videos/preview/mixkit-hands-of-a-craftsman-working-on-leather-41528-large.mp4",
        likes: 8520,
        liked: false,
        comments: ["So satisfying to watch.", "What tools are you using?"]
      }
    ];

    // Load feed state from LocalStorage
    let feedData = JSON.parse(localStorage.getItem('tiktok_feed_data')) || initialVideos;

    function saveState() {
      localStorage.setItem('tiktok_feed_data', JSON.stringify(feedData));
    }

    // --- 2. RENDER FEED SYSTEM ---
    const feedContainer = document.getElementById('videoFeed');

    function renderFeed() {
      feedContainer.innerHTML = '';
      feedData.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'video-snap-item';
        item.innerHTML = `
          <div class="video-card">
            <video loop playsinline src="${video.url}" data-index="${index}"></video>
            
            <div class="video-info">
              <div class="video-author">${video.author}</div>
              <div class="video-desc">${video.caption}</div>
            </div>

            <div class="action-sidebar">
              <button class="action-btn ${video.liked ? 'active' : ''}" onclick="toggleLike(${index})">
                <div class="icon-bubble">❤️</div>
                <span class="action-label">${video.likes}</span>
              </button>
              
              <button class="action-btn" onclick="toggleComments('${video.id}')">
                <div class="icon-bubble">💬</div>
                <span class="action-label">${video.comments.length}</span>
              </button>

              <button class="action-btn" onclick="shareVideo('${video.id}')">
                <div class="icon-bubble">↪️</div>
                <span class="action-label">Share</span>
              </button>
            </div>

            <!-- COMMENTS DRAWER -->
            <div class="comment-drawer" id="drawer-${video.id}">
              <div class="drawer-header">
                <span>Comments (${video.comments.length})</span>
                <button class="close-btn" onclick="toggleComments('${video.id}')">✕</button>
              </div>
              <div class="comment-list" id="comment-list-${video.id}">
                ${video.comments.map(c => `
                  <div class="comment-item">
                    <div class="comment-user">User</div>
                    <div>${c}</div>
                  </div>
                `).join('')}
              </div>
              <div class="comment-input-area">
                <input type="text" id="input-${video.id}" placeholder="Add comment...">
                <button class="btn btn-primary" onclick="addComment(${index}, '${video.id}')">Post</button>
              </div>
            </div>

          </div>
        `;
        feedContainer.appendChild(item);
      });

      setupObserver();
    }

    // --- 3. INTERSECTION OBSERVER (AUTOPLAY / AUTOPAUSE CONTROL) ---
    function setupObserver() {
      const videos = document.querySelectorAll('video');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) {
            video.play().catch(() => {});
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.6 });

      videos.forEach(video => {
        observer.observe(video);
        video.addEventListener('click', () => {
          if (video.paused) video.play();
          else video.pause();
        });
      });
    }

    // --- 4. INTERACTION FUNCTIONS ---
    window.toggleLike = function(index) {
      if (feedData[index].liked) {
        feedData[index].likes--;
        feedData[index].liked = false;
      } else {
        feedData[index].likes++;
        feedData[index].liked = true;
      }
      saveState();
      renderFeed();
    };

    window.toggleComments = function(videoId) {
      const drawer = document.getElementById(`drawer-${videoId}`);
      drawer.classList.toggle('open');
    };

    window.addComment = function(index, videoId) {
      const input = document.getElementById(`input-${videoId}`);
      const text = input.value.trim();
      if (text) {
        feedData[index].comments.push(text);
        saveState();
        renderFeed();
        // Re-open drawer after render
        setTimeout(() => toggleComments(videoId), 50);
      }
    };

    window.shareVideo = function(videoId) {
      navigator.clipboard.writeText(window.location.href);
      alert('Video link copied to clipboard!');
    };

    // --- 5. VIDEO UPLOAD CONTROLLER ---
    const uploadModal = document.getElementById('uploadModal');
    document.getElementById('openUploadModal').onclick = () => uploadModal.style.display = 'flex';
    document.getElementById('closeUploadModal').onclick = () => uploadModal.style.display = 'none';

    document.getElementById('submitUpload').onclick = () => {
      const fileInput = document.getElementById('videoFileInput');
      const authorInput = document.getElementById('authorInput');
      const captionInput = document.getElementById('captionInput');

      if (fileInput.files.length === 0) {
        alert('Please select a video file.');
        return;
      }

      const file = fileInput.files[0];
      const videoURL = URL.createObjectURL(file);

      const newVideo = {
        id: 'v_' + Date.now(),
        author: authorInput.value || '@anonymous',
        caption: captionInput.value || 'New video upload!',
        url: videoURL,
        likes: 0,
        liked: false,
        comments: []
      };

      feedData.unshift(newVideo);
      saveState();
      renderFeed();

      uploadModal.style.display = 'none';
      authorInput.value = '';
      captionInput.value = '';
      fileInput.value = '';
    };

    // Run Initial Load
    renderFeed();
  </script>
</body>
</html>
