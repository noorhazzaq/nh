<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pixel Chat</title>
  <style>
    /* ============================================================
       DESIGN SYSTEM — Optimized
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font: 'Press Start 2P', monospace;
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #12122a;
      --bg-input: #0f0e17;
      --accent: #e94560;
      --accent-hover: #ff6b81;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.3);
      --border: #e94560;
      --success: #4caf50;
      --error: #e94560;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg-primary);
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(3px, 1vw, 8px);
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================================================
       APP — Fluid sizing
       ============================================================ */
    .app {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      position: relative;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* ============================================================
       HEADER — Fixed layout
       ============================================================ */
    .header {
      padding: clamp(6px, 1.2vw, 10px) clamp(8px, 1.5vw, 14px);
      background: var(--bg-input);
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(4px, 1vw, 8px);
      flex-shrink: 0;
      min-height: clamp(40px, 6vh, 48px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.8vw, 8px);
      flex-shrink: 0;
    }

    .header-brand .logo {
      font-size: clamp(0.6rem, 1.8vw, 0.9rem);
    }

    .header-brand .title {
      font-size: clamp(0.4rem, 1.2vw, 0.65rem);
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .header-brand .title span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 8px);
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    /* ============================================================
       STATUS BADGE — Compact
       ============================================================ */
    .status-badge {
      display: flex;
      align-items: center;
      gap: clamp(2px, 0.4vw, 4px);
      padding: clamp(2px, 0.4vw, 4px) clamp(5px, 1vw, 10px);
      background: var(--bg-primary);
      border: 2px solid var(--success);
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      white-space: nowrap;
      flex-shrink: 0;
      min-height: clamp(20px, 3.5vh, 28px);
      min-width: clamp(28px, 5vw, 40px);
      justify-content: center;
    }

    .status-badge .dot {
      width: clamp(5px, 0.8vw, 7px);
      height: clamp(5px, 0.8vw, 7px);
      background: var(--success);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-badge .dot.off {
      background: var(--error);
      animation: blink 0.8s infinite;
    }

    .status-badge .count {
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      margin-left: 1px;
    }

    /* ============================================================
       AUTH — Touch friendly
       ============================================================ */
    .auth {
      display: flex;
      gap: clamp(3px, 0.6vw, 6px);
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    .auth-input {
      padding: clamp(4px, 0.8vw, 6px) clamp(6px, 1vw, 10px);
      border: 2px solid var(--border);
      background: var(--bg-primary);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      width: clamp(50px, 12vw, 70px);
      transition: 0.2s;
      min-height: clamp(24px, 4vh, 32px);
      flex: 1 1 auto;
      min-width: 40px;
      max-width: 80px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent-hover);
      width: clamp(60px, 15vw, 80px);
    }

    .auth-input::placeholder {
      color: var(--text-dim);
      font-size: clamp(0.25rem, 0.5vw, 0.3rem);
    }

    .auth-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ============================================================
       BUTTONS — Min 44px touch target
       ============================================================ */
    .btn {
      padding: clamp(4px, 0.8vw, 8px) clamp(8px, 1.5vw, 14px);
      border: 2px solid var(--border);
      background: var(--accent);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      cursor: pointer;
      transition: 0.1s;
      text-transform: uppercase;
      min-height: clamp(24px, 4vh, 32px);
      min-width: clamp(32px, 6vw, 44px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-touch-callout: none;
      border-radius: 0;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn--danger {
      background: var(--error);
      border-color: var(--error);
      padding: clamp(4px, 0.8vw, 8px) clamp(6px, 1vw, 10px);
      min-width: clamp(24px, 4vw, 32px);
    }

    /* ============================================================
       MESSAGES — Optimized scrolling
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: clamp(6px, 1vw, 10px) clamp(8px, 1.5vw, 14px);
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.4vw, 4px);
      background: var(--bg-tertiary);
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      will-change: scroll-position;
      overscroll-behavior: contain;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--bg-input);
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--accent);
      border: 1px solid var(--bg-input);
    }

    .status-msg {
      text-align: center;
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      opacity: 0.4;
      padding: clamp(12px, 2vw, 20px) clamp(6px, 1vw, 12px);
      font-style: italic;
    }

    /* ============================================================
       MESSAGE BUBBLES — Fluid width
       ============================================================ */
    .msg {
      padding: clamp(4px, 0.7vw, 8px) clamp(8px, 1.2vw, 14px);
      border: 2px solid var(--text);
      max-width: clamp(82%, 85%, 92%);
      word-wrap: break-word;
      animation: fadeIn 0.2s steps(2);
      line-height: 1.5;
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
    }

    .msg.own {
      align-self: flex-end;
      background: var(--accent);
      border-color: var(--accent-hover);
      border-bottom-right-radius: 0;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--bg-primary);
      border-color: #2a2a4e;
      border-bottom-left-radius: 0;
    }

    .msg .sender {
      font-size: clamp(0.25rem, 0.5vw, 0.35rem);
      text-transform: uppercase;
      opacity: 0.7;
      letter-spacing: 0.5px;
      margin-bottom: clamp(1px, 0.2vw, 3px);
    }

    .msg .time {
      font-size: clamp(0.2rem, 0.4vw, 0.3rem);
      opacity: 0.4;
      margin-left: clamp(3px, 0.5vw, 6px);
    }

    .msg .text {
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      word-break: break-word;
      line-height: 1.6;
    }

    /* ============================================================
       INPUT — Keyboard aware
       ============================================================ */
    .input-area {
      padding: clamp(5px, 0.8vw, 8px) clamp(8px, 1.5vw, 14px) clamp(8px, 1.5vw, 14px);
      background: var(--bg-input);
      border-top: 2px solid var(--border);
      flex-shrink: 0;
      padding-bottom: calc(clamp(8px, 1.5vw, 14px) + var(--safe-bottom));
    }

    .row {
      display: flex;
      gap: clamp(4px, 0.8vw, 8px);
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: clamp(6px, 1vw, 10px) clamp(8px, 1.2vw, 14px);
      border: 2px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      min-width: 40px;
      transition: 0.2s;
      min-height: clamp(32px, 5vh, 40px);
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }

    .row input:focus {
      outline: none;
      border-color: var(--accent-hover);
    }

    .row input::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-size: clamp(0.3rem, 0.6vw, 0.35rem);
    }

    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      padding: clamp(6px, 1vw, 10px) clamp(10px, 1.8vw, 18px);
      min-height: clamp(32px, 5vh, 40px);
      flex-shrink: 0;
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       ULTRA SMALL (under 360px)
       ============================================================ */
    @media (max-width: 360px) {
      .header {
        padding: 4px 6px;
        min-height: 32px;
        gap: 3px;
      }

      .header-brand .title {
        font-size: 0.35rem;
        letter-spacing: 0.5px;
      }

      .header-brand .logo {
        font-size: 0.5rem;
      }

      .auth-input {
        font-size: 0.25rem;
        padding: 2px 4px;
        min-height: 18px;
        width: 40px;
        max-width: 50px;
      }

      .auth-input:focus {
        width: 50px;
      }

      .btn {
        font-size: 0.25rem;
        padding: 2px 6px;
        min-height: 18px;
        min-width: 24px;
      }

      .status-badge {
        font-size: 0.25rem;
        padding: 2px 4px;
        min-height: 18px;
        min-width: 20px;
      }

      .status-badge .dot {
        width: 4px;
        height: 4px;
      }

      .messages {
        padding: 4px 6px;
        gap: 2px;
      }

      .msg {
        padding: 2px 6px;
        max-width: 95%;
        font-size: 0.3rem;
      }

      .msg .sender {
        font-size: 0.2rem;
      }

      .msg .text {
        font-size: 0.3rem;
        line-height: 1.3;
      }

      .input-area {
        padding: 3px 6px 6px;
      }

      .row input {
        font-size: 0.3rem;
        padding: 4px 6px;
        min-height: 24px;
      }

      .row .btn {
        font-size: 0.3rem;
        padding: 4px 8px;
        min-height: 24px;
      }

      .status-msg {
        font-size: 0.25rem;
        padding: 8px 4px;
      }
    }

    /* ============================================================
       LANDSCAPE PHONES
       ============================================================ */
    @media (max-height: 500px) and (orientation: landscape) {
      .app {
        max-height: 95vh;
      }

      .header {
        padding: 4px 10px;
        min-height: 32px;
      }

      .header-brand .title {
        font-size: 0.4rem;
      }

      .messages {
        padding: 4px 8px;
        gap: 2px;
      }

      .msg {
        padding: 2px 8px;
        max-width: 90%;
        font-size: 0.35rem;
      }

      .msg .sender {
        font-size: 0.25rem;
        margin-bottom: 1px;
      }

      .msg .text {
        font-size: 0.35rem;
        line-height: 1.3;
      }

      .input-area {
        padding: 3px 8px 6px;
      }

      .row input {
        min-height: 24px;
        padding: 4px 8px;
        font-size: 0.35rem;
      }

      .row .btn {
        min-height: 24px;
        padding: 4px 10px;
        font-size: 0.35rem;
      }

      .auth-input {
        min-height: 18px;
        font-size: 0.3rem;
        padding: 2px 6px;
      }

      .btn {
        min-height: 18px;
        font-size: 0.3rem;
        padding: 2px 8px;
      }

      .status-badge {
        font-size: 0.3rem;
        padding: 2px 6px;
        min-height: 18px;
      }
    }

    /* ============================================================
       ACCESSIBILITY — Reduced motion
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ============================================================
       DARK MODE SUPPORT
       ============================================================ */
    @media (prefers-color-scheme: light) {
      body {
        background: var(--bg-primary);
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-brand">
        <span class="logo" aria-hidden="true">🕹️</span>
        <h1 class="title"><span>PIXEL</span></h1>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input
          type="text"
          class="auth-input"
          id="nameInput"
          placeholder="NAME"
          maxlength="20"
          inputmode="text"
          autocomplete="off"
          aria-label="Username"
          />
          <button class="btn" id="joinBtn" aria-label="Join chat">JOIN</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none" aria-label="Leave chat">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer" role="log" aria-live="polite">
      <div class="status-msg">🔄 CONNECTING...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area">
      <div class="row">
        <input
        type="text"
        class="input-field"
        id="messageInput"
        placeholder="TYPE..."
        disabled
        inputmode="text"
        autocomplete="off"
        aria-label="Message input"
        />
        <button class="btn" id="sendBtn" disabled aria-label="Send message">SEND</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE SDK
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * PIXEL CHAT — Optimized & Tested
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM REFS
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let statusTimeout = null;

    // ============================================================
    // 4. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;

      if (statusTimeout) {
        clearTimeout(statusTimeout);
        statusTimeout = null;
      }

      if (on) {
        status('✅ CONNECTED');
        statusTimeout = setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === '✅ CONNECTED') clearStatus();
          statusTimeout = null;
        }, 1000);
      } else {
        status('🔄 RECONNECTING...');
      }
    };

    // ============================================================
    // 5. SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) {
        alert('SIGN IN FIRST!');
        return;
      }
      if (!text || !text.trim()) return;
      if (!connected) {
        alert('WAITING FOR CONNECTION...');
        return;
      }

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('FAILED TO SEND.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 6. RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'ANON'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === '✅ CONNECTED' || st.textContent === '🔄 CONNECTING...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 7. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      // Clean up old listeners
      listeners.forEach(ref => ref.off());
      listeners = [];

      // Connection status
      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);

        if (on && user) {
          const users = db.ref('users');
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      // Online users
      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      // Messages
      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      // Initial check
      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === '🔄 CONNECTING...' || st.textContent === '✅ CONNECTED') {
            status('💬 NO MESSAGES YET');
          }
        }
      });
    };

    // ============================================================
    // 8. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'GUEST';
      const name = raw.toUpperCase().slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `MSG AS ${name}...`;

      clearStatus();
      status(`👾 ${name} JOINED`);

      // Re-subscribe with user
      subscribe();

      // Force presence update
      if (connected) {
        const users = db.ref('users');
        const ref = users.child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `👾 ${name} JOINED`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      // Clean up listeners
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'TYPE...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('👋 LEFT CHAT');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 9. EVENTS — Optimized
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // Touch feedback for buttons
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.95)';
      }, { passive: true });

      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    // Keyboard aware — scroll input into view
    DOM.messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        DOM.messageInput.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }, 300);
    });

    // Prevent zoom on double tap
    document.addEventListener('touchend', (e) => {
      if (e.target.closest('.btn') || e.target.closest('input')) {
        e.preventDefault();
      }
    }, { passive: false });

    // ============================================================
    // 10. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('🕹️ PIXEL CHAT — OPTIMIZED');
    console.log('📡 Database:', firebase.app().options.databaseURL);
    console.log('📱 Screen:', window.innerWidth + 'x' + window.innerHeight);
  </script>

</body>
</html>
