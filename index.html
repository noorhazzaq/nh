<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Space Hub</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020208; color: #fff; font-family: system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 60px 10px 20px; overflow-x: hidden; cursor: crosshair;
    }
    #top-bar {
      position: fixed; top: 10px; z-index: 30; display: flex; gap: 10px; align-items: center;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85); color: #38bdf8; padding: 6px 14px;
      border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.4); font-size: 0.8rem;
    }
    .btn {
      background: rgba(168, 85, 247, 0.3); border: 1px solid #c084fc; color: #c084fc;
      padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }
    #space-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .card {
      position: relative; z-index: 10; width: 100%; max-width: 440px; margin-bottom: 15px;
      background: rgba(15, 15, 30, 0.75); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 1.2rem;
    }
    h1 {
      font-size: 1.4rem; background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
    }
    .video-box { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 10px; overflow: hidden; }
    .video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
    .chat-box { height: 200px; overflow-y: auto; text-align: left; font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
    .chat-msg { background: rgba(255, 255, 255, 0.05); padding: 6px 10px; border-radius: 8px; }
    .chat-msg b { color: #38bdf8; }
    .inputs { display: flex; gap: 6px; }
    input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.8rem; }
    input[type="text"]:first-child { width: 30%; }
    input[type="text"]:last-child { flex: 1; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="badge" id="clock">🕒 --:--:--</div>
    <button class="btn" id="warp-btn">🚀 Warp</button>
    <button class="btn" id="synth-btn">🎵 Audio</button>
  </div>

  <canvas id="space-canvas"></canvas>

  <main class="card">
    <h1>Terima Kasih Haji Abu Kassim!</h1>
    <div class="video-box">
      <iframe src="https://www.youtube.com/embed/mnN866eQQFs" title="Video" frameborder="0" allowfullscreen></iframe>
    </div>
  </main>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:1rem;">🌌 Global Chat</h2>
      <span style="font-size:0.75rem; color:#4ade80;" id="status">● Online</span>
    </div>
    <div class="chat-box" id="chat"></div>
    <form class="inputs" id="chat-form">
      <input type="text" id="user" placeholder="Name" maxlength="12" required>
      <input type="text" id="msg" placeholder="Type a message..." maxlength="150" required>
      <button type="submit" class="btn">Send</button>
    </form>
  </div>

  <script>
    // Live Clock
    const clock = document.getElementById('clock');
    setInterval(() => clock.innerText = `🕒 ${new Date().toLocaleTimeString()}`, 1000);

    // Canvas Engine & Particle Pool
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [], particles = [], warp = false;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      stars = Array.from({ length: 100 }, () => ({ x: Math.random() * w, y: Math.random() * h, z: Math.random() * w }));
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('warp-btn').onclick = () => warp = !warp;

    window.addEventListener('mousemove', (e) => {
      if (particles.length < 40) {
        particles.push({ x: e.clientX, y: e.clientY, alpha: 1, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 });
      }
    });

    function render() {
      ctx.fillStyle = warp ? 'rgba(2, 2, 8, 0.2)' : '#020208';
      ctx.fillRect(0, 0, w, h);

      stars.forEach(s => {
        s.z -= warp ? 8 : 0.5;
        if (s.z <= 0) s.z = w;
        const px = (s.x - w / 2) * (128 / s.z) + w / 2;
        const py = (s.y - h / 2) * (128 / s.z) + h / 2;
        if (px >= 0 && px <= w && py >= 0 && py <= h) {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(px, py, 1.5, 1.5);
        }
      });

      particles.forEach((p, i) => {
        ctx.fillStyle = `rgba(192, 132, 252, ${p.alpha})`;
        ctx.fillRect(p.x, p.y, 3, 3);
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      });

      requestAnimationFrame(render);
    }
    render();

    // Safe Web Audio Synth
    let actx, osc;
    document.getElementById('synth-btn').onclick = () => {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        osc = actx.createOscillator();
        const gain = actx.createGain();
        gain.gain.value = 0.02;
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        document.getElementById('synth-btn').innerText = '🎵 Audio ON';
      } else {
        actx.state === 'running' ? actx.suspend() : actx.resume();
      }
    };

    // Firebase Chat Handler
    try {
      firebase.initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" });
      const db = firebase.database().ref("global_chat");

      document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const u = document.getElementById('user').value.trim();
        const m = document.getElementById('msg').value.trim();
        if (u && m) {
          db.push({ u, m });
          if (/space|love|fire/i.test(m)) confetti({ particleCount: 40 });
          document.getElementById('msg').value = '';
        }
      };

      db.limitToLast(15).on("child_added", snap => {
        const d = snap.val();
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<b>${d.u}:</b> ${d.m}`;
        const box = document.getElementById('chat');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      });
    } catch (err) {
      document.getElementById('status').innerText = '● Offline Mode';
    }
  </script>
</body>
</html>
