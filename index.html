<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK — Realm of Light Chat">
    <title>ZACK — Realm of Light</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK","short_name":"ZACK","display":"standalone","theme_color":"%23000000","background_color":"%23000000"}'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        :root {
            --red: #ff0033;
            --cyan: #00f0ff;
            --gold: #ffd700;
            --purple: #8a2be2;
            --pink: #ff00ff;
            --bg: #000000;
            --white: #ffffff;
            --muted: #999999;
            --success: #00ff88;
            --border-glow: rgba(0,240,255,0.3);
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff, #ffd700, #ff00ff);
            --grad-btn: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --r-sm: 10px;
            --r-md: 16px;
            --r-full: 30px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        /* ============ AURORA ============ */
        .aurora {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,0,51,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,240,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(138,43,226,0.1) 0%, transparent 60%),
                radial-gradient(circle at 60% 20%, rgba(255,215,0,0.08) 0%, transparent 40%),
                radial-gradient(circle at 40% 80%, rgba(255,0,255,0.06) 0%, transparent 50%);
            z-index: 0;
            animation: auroraFloat 10s ease-in-out infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(15px, -20px) scale(1.05); }
            50% { transform: translate(-10px, 10px) scale(0.95); }
            75% { transform: translate(-20px, -15px) scale(1.02); }
        }

        /* ============ STAR FIELD ============ */
        .stars {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            border-radius: 50%;
            background: var(--white);
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; box-shadow: 0 0 8px var(--white); }
        }

        /* ============ PARTICLES ============ */
        .particles {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        .particle-red { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .particle-cyan { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .particle-gold { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .particle-purple { background: var(--purple); box-shadow: 0 0 10px var(--purple); }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* ============ GRID ============ */
        .grid-overlay {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,0,51,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 90%);
        }

        /* ============ ORBIT RINGS ============ */
        .orbit {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(0,240,255,0.08);
            border-radius: 50%;
            animation: orbitSpin 20s linear infinite;
        }
        .orbit-ring:nth-child(1) { width: 300px; height: 300px; }
        .orbit-ring:nth-child(2) { width: 500px; height: 500px; animation-duration: 30s; border-color: rgba(255,0,51,0.06); }
        .orbit-ring:nth-child(3) { width: 700px; height: 700px; animation-duration: 40s; border-color: rgba(255,215,0,0.04); }
        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ============ HEADER ============ */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(12px + var(--safe-top)) 15px 12px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 5px 40px rgba(0,240,255,0.15), 0 5px 40px rgba(255,0,51,0.1);
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px; font-weight: 900; letter-spacing: 5px;
            text-align: center;
            background: var(--grad-text);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 4s ease infinite;
            filter: drop-shadow(0 0 20px rgba(255,0,51,0.5)) drop-shadow(0 0 40px rgba(0,240,255,0.3));
        }
        @keyframes logoGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ============ MAIN ============ */
        .main {
            position: relative; z-index: 2;
            padding: calc(60px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ============ CHAT BOX ============ */
        .chat-box {
            display: flex; flex-direction: column;
            flex: 1;
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.5);
            overflow: hidden;
            min-height: 0;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow:
                0 0 30px rgba(255,0,51,0.15),
                0 0 50px rgba(0,240,255,0.1),
                inset 0 0 30px rgba(255,0,51,0.03);
            animation: boxGlow 5s ease-in-out infinite;
        }
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255,0,51,0.15), 0 0 50px rgba(0,240,255,0.1); }
            50% { box-shadow: 0 0 50px rgba(255,0,51,0.25), 0 0 80px rgba(0,240,255,0.2), 0 0 100px rgba(255,215,0,0.1); }
        }

        .chat-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-glow);
            background: linear-gradient(135deg, rgba(255,0,51,0.08), rgba(0,240,255,0.05));
            flex-shrink: 0;
        }
        .chat-head h3 {
            font-family: 'Orbitron', sans-serif; font-size: 12px;
            letter-spacing: 2px;
            background: var(--grad-text);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chat-head .online { font-size: 8px; transition: color 0.3s; letter-spacing: 1px; }

        .rec-bar {
            display: none; text-align: center; padding: 5px;
            background: rgba(255,0,51,0.15);
            border-bottom: 1px solid var(--red);
            font-size: 9px; color: var(--red);
            font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
            flex-shrink: 0;
            animation: recPulse 0.5s infinite;
        }
        .rec-bar.active { display: block; }
        @keyframes recPulse { 50% { opacity: 0.6; } }

        .chat-log {
            flex: 1; overflow-y: auto; padding: 12px 12px 30px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .date-sep {
            text-align: center; font-size: 8px; color: #555;
            margin: 12px 0; font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,240,255,0.3);
        }

        .msg {
            margin-bottom: 12px;
            animation: msgGlow 0.3s var(--ease);
        }
        @keyframes msgGlow {
            from { opacity: 0; transform: translateY(8px); filter: brightness(2); }
            to { opacity: 1; transform: translateY(0); filter: brightness(1); }
        }
        .msg.own { text-align: right; }

        .msg-name {
            font-family: 'Orbitron', sans-serif; font-size: 8px;
            letter-spacing: 1px;
            color: var(--cyan);
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }
        .msg.own .msg-name {
            color: var(--success);
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .msg-text {
            display: inline-block; font-size: 12px; color: #ddd;
            background: rgba(0,0,0,0.5);
            padding: 9px 12px; border-radius: 12px;
            word-break: break-word; max-width: 100%; text-align: left;
            border: 1px solid rgba(0,240,255,0.1);
            box-shadow: 0 0 15px rgba(0,240,255,0.05);
        }
        .msg.own .msg-text {
            background: rgba(0,255,136,0.06);
            border-color: rgba(0,255,136,0.15);
            box-shadow: 0 0 15px rgba(0,255,136,0.08);
        }

        .msg-audio {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,0,51,0.1);
            border: 1px solid rgba(255,0,51,0.3);
            border-radius: 20px; padding: 8px 14px;
            box-shadow: 0 0 15px rgba(255,0,51,0.15);
        }
        .msg-audio span { font-size: 14px; color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .msg-audio small { font-size: 8px; color: #ccc; }

        .msg-image {
            max-width: 150px; border-radius: 10px;
            border: 1px solid rgba(0,240,255,0.3);
            display: block; pointer-events: auto;
            box-shadow: 0 0 25px rgba(0,240,255,0.2);
        }
        .msg.own .msg-image { margin-left: auto; }

        .msg-del {
            background: none; border: none; color: #555; font-size: 10px;
            padding: 2px; margin-left: 6px;
            transition: all 0.2s;
        }
        .msg-del.confirm {
            color: var(--red);
            font-weight: 700;
            text-shadow: 0 0 15px var(--red);
        }

        .chat-input-area {
            padding: 10px 12px;
            border-top: 1px solid var(--border-glow);
            display: flex; gap: 6px; align-items: center;
            flex-shrink: 0;
            background: rgba(0,0,0,0.4);
        }

        .chat-input {
            flex: 1; padding: 11px 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-glow);
            color: var(--white); font-family: 'Rajdhani', sans-serif; font-size: 13px;
            border-radius: var(--r-full); outline: none; min-width: 0;
            transition: all 0.3s var(--ease);
        }
        .chat-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,240,255,0.3), inset 0 0 15px rgba(0,240,255,0.05);
        }
        .name-input { flex: 0 0 75px; }

        .send-btn {
            padding: 11px 15px;
            background: var(--grad-btn);
            color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            opacity: 0.3; transition: all 0.3s var(--ease);
            box-shadow: 0 0 20px rgba(255,0,51,0.3), 0 0 30px rgba(0,240,255,0.2);
        }
        .send-btn:not(:disabled) {
            opacity: 1;
            cursor: pointer;
            animation: sendGlow 2s ease-in-out infinite;
        }
        @keyframes sendGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,51,0.3), 0 0 30px rgba(0,240,255,0.2); }
            50% { box-shadow: 0 0 40px rgba(255,0,51,0.5), 0 0 60px rgba(0,240,255,0.4), 0 0 80px rgba(255,215,0,0.2); }
        }
        .send-btn:disabled { cursor: not-allowed; }

        .attach-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,0,51,0.08);
            border: 1px solid var(--border-glow);
            color: var(--cyan); font-size: 14px;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            transition: all 0.3s var(--ease);
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }
        .attach-btn:active {
            background: var(--red); color: var(--white);
            box-shadow: 0 0 30px rgba(255,0,51,0.5);
            transform: scale(0.9);
        }
        .attach-btn.recording {
            background: var(--red); color: var(--white);
            animation: recPulse 0.5s infinite;
            box-shadow: 0 0 40px rgba(255,0,51,0.6);
        }

        /* ============ TOAST ============ */
        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px; max-width: 260px;
        }
        .toast {
            padding: 11px 17px; border-radius: 12px; font-size: 11px; border: 1px solid;
            transform: translateX(0);
            transition: all 0.4s var(--ease);
            opacity: 1;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-success {
            background: rgba(0,255,136,0.1);
            border-color: rgba(0,255,136,0.4);
            color: var(--success);
            box-shadow: 0 0 30px rgba(0,255,136,0.3);
        }
        .toast-error {
            background: rgba(255,0,51,0.1);
            border-color: rgba(255,0,51,0.4);
            color: var(--red);
            box-shadow: 0 0 30px rgba(255,0,51,0.3);
        }
        .toast-info {
            background: rgba(0,240,255,0.1);
            border-color: rgba(0,240,255,0.4);
            color: var(--cyan);
            box-shadow: 0 0 30px rgba(0,240,255,0.3);
        }

        /* ============ LIGHTBOX ============ */
        .lightbox {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.97);
            display: none;
            justify-content: center; align-items: center;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 92%; max-height: 85%;
            border: 2px solid var(--cyan); border-radius: 12px;
            box-shadow: 0 0 60px rgba(0,240,255,0.5), 0 0 100px rgba(255,0,51,0.3), 0 0 150px rgba(255,215,0,0.15);
            pointer-events: none;
        }

        /* ============ RIPPLE EFFECT ============ */
        .ripple {
            position: fixed;
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid var(--cyan);
            pointer-events: none;
            z-index: 400;
            animation: rippleOut 0.6s var(--ease) forwards;
        }
        @keyframes rippleOut {
            from { transform: scale(0); opacity: 1; }
            to { transform: scale(10); opacity: 0; }
        }

        #chatImageInput { display: none; }
    </style>
</head>
<body>

    <div class="aurora"></div>
    <div class="stars" id="stars"></div>
    <div class="particles" id="particles"></div>
    <div class="grid-overlay"></div>
    <div class="orbit">
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
    </div>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

    <div class="lightbox" id="lightbox">
        <img id="lightboxImg" src="" alt="Gambar penuh">
    </div>

    <div class="header">
        <div class="logo">ZACK</div>
    </div>

    <div class="main">
        <div class="chat-box" role="region" aria-label="Chat">
            <div class="chat-head">
                <h3>💬 REALM OF LIGHT</h3>
                <span class="online" id="onlineStatus">● OFFLINE</span>
            </div>
            <div class="rec-bar" id="recBar">🔴 MERAKAM...</div>
            <div class="chat-log" id="chatLog"></div>
            <div class="chat-input-area">
                <input type="text" id="chatName" class="chat-input name-input" placeholder="NAMA" maxlength="20" aria-label="Nama anda">
                <input type="text" id="chatInput" class="chat-input" placeholder="Tulis mesej..." maxlength="500" aria-label="Tulis mesej">
                <button class="attach-btn" id="imgBtn" aria-label="Hantar gambar">📷</button>
                <button class="attach-btn" id="recordBtn" aria-label="Rakam audio">🎤</button>
                <button class="send-btn" id="sendBtn" disabled>HANTAR</button>
            </div>
            <input type="file" id="chatImageInput" accept="image/*">
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        'use strict';

        /* ============ CONFIG ============ */
        const CONFIG = {
            databaseURL: 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/',
            maxImageSize: 2 * 1024 * 1024,
            maxAudioDuration: 30,
            maxImageDim: 1000,
            messageLimit: 50
        };

        /* ============ STATE ============ */
        const state = {
            isRecording: false,
            recordStart: 0,
            recorder: null,
            audioChunks: [],
            recordTimer: null,
            deleteTarget: null,
            deleteTimer: null
        };

        /* ============ DOM ============ */
        const $ = id => document.getElementById(id);
        const DOM = {
            toastWrap: $('toastWrap'),
            lightbox: $('lightbox'),
            lightboxImg: $('lightboxImg'),
            chatLog: $('chatLog'),
            chatName: $('chatName'),
            chatInput: $('chatInput'),
            onlineStatus: $('onlineStatus'),
            recordBtn: $('recordBtn'),
            recBar: $('recBar'),
            sendBtn: $('sendBtn'),
            imgBtn: $('imgBtn'),
            chatImageInput: $('chatImageInput')
        };

        /* ============ FIREBASE ============ */
        const db = firebase.initializeApp({ databaseURL: CONFIG.databaseURL }).database();

        /* ============ STAR FIELD ============ */
        function initStars() {
            const wrap = $('stars');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 50; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                s.style.animationDuration = (Math.random() * 2 + 2) + 's';
                frag.appendChild(s);
            }
            wrap.appendChild(frag);
        }

        /* ============ PARTICLES ============ */
        function initParticles() {
            const wrap = $('particles');
            const colors = ['particle-red', 'particle-cyan', 'particle-gold', 'particle-purple'];
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = `particle ${colors[i % 4]}`;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.width = p.style.height = (Math.random() * 3 + 2) + 'px';
                frag.appendChild(p);
            }
            wrap.appendChild(frag);
        }

        /* ============ RIPPLE ============ */
        function createRipple(x, y) {
            const r = document.createElement('div');
            r.className = 'ripple';
            r.style.left = x + 'px';
            r.style.top = y + 'px';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 600);
        }

        /* ============ HELPERS ============ */
        function toast(msg, type = 'info') {
            while (DOM.toastWrap.children.length >= 3) DOM.toastWrap.firstChild.remove();
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            DOM.toastWrap.appendChild(el);
            setTimeout(() => {
                el.classList.add('hide');
                setTimeout(() => el.remove(), 400);
            }, 3000);
        }

        function haptic(pattern = 10) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        const safeText = str => { const d = document.createElement('div'); d.textContent = str; return d.textContent; };
        const getTime = () => new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
        const getName = () => DOM.chatName.value.trim() || 'Anonymous';

        function dateSep(ts) {
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 864e5).toDateString();
            const msgDate = new Date(ts).toDateString();
            if (msgDate === today) return 'HARI INI';
            if (msgDate === yesterday) return 'SEMALAM';
            return new Date(ts).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long' });
        }

        function compressImage(file, cb) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    if (img.width <= CONFIG.maxImageDim) { cb(reader.result); return; }
                    const canvas = document.createElement('canvas');
                    const ratio = CONFIG.maxImageDim / img.width;
                    canvas.width = CONFIG.maxImageDim;
                    canvas.height = Math.round(img.height * ratio);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    cb(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        /* ============ CHAT ============ */
        db.ref('chat').limitToLast(CONFIG.messageLimit).on('value', snap => {
            const myName = getName();
            const atBottom = DOM.chatLog.scrollHeight - DOM.chatLog.scrollTop - DOM.chatLog.clientHeight < 50;
            DOM.chatLog.innerHTML = '';
            const frag = document.createDocumentFragment();
            let lastDate = '';

            if (snap.exists()) {
                snap.forEach(child => {
                    const d = child.val();
                    const ds = dateSep(d.timestamp || Date.now());
                    if (ds !== lastDate) {
                        lastDate = ds;
                        const sep = document.createElement('div');
                        sep.className = 'date-sep';
                        sep.textContent = `— ${ds} —`;
                        frag.appendChild(sep);
                    }
                    const div = document.createElement('div');
                    div.className = 'msg' + (d.name === myName ? ' own' : '');
                    const name = document.createElement('div');
                    name.className = 'msg-name';
                    name.textContent = `${safeText(d.name)} • ${d.time || ''}`;
                    div.appendChild(name);
                    if (d.type === 'text') {
                        const t = document.createElement('div');
                        t.className = 'msg-text';
                        t.textContent = safeText(d.text);
                        div.appendChild(t);
                    } else if (d.type === 'image') {
                        const img = document.createElement('img');
                        img.className = 'msg-image';
                        img.src = d.data;
                        img.alt = 'Gambar dari ' + safeText(d.name);
                        img.addEventListener('click', () => openLightbox(d.data));
                        div.appendChild(img);
                    } else if (d.type === 'audio') {
                        const a = document.createElement('div');
                        a.className = 'msg-audio';
                        a.setAttribute('role', 'button');
                        a.setAttribute('aria-label', 'Mainkan audio');
                        const icon = document.createElement('span');
                        icon.textContent = '▶';
                        const dur = document.createElement('small');
                        dur.textContent = `${Math.floor((d.duration || 0) / 60)}:${((d.duration || 0) % 60).toString().padStart(2, '0')}`;
                        a.append(icon, dur);
                        a.addEventListener('click', () => new Audio(d.data).play().catch(() => toast('Tidak dapat main audio!', 'error')));
                        div.appendChild(a);
                    }
                    if (d.name === myName) {
                        const del = document.createElement('button');
                        del.className = 'msg-del';
                        del.textContent = '✕';
                        del.type = 'button';
                        del.setAttribute('aria-label', 'Padam mesej');
                        del.addEventListener('click', () => handleDelete(child.key, del));
                        div.appendChild(del);
                    }
                    frag.appendChild(div);
                });
            }

            DOM.chatLog.appendChild(frag);
            if (atBottom) DOM.chatLog.scrollTop = DOM.chatLog.scrollHeight;
        });

        function send(type, data) {
            db.ref('chat').push({
                type, name: getName(), timestamp: Date.now(),
                ...data, time: getTime()
            }).catch(() => toast('Gagal hantar!', 'error'));
        }

        function updateSendBtn() {
            DOM.sendBtn.disabled = !DOM.chatInput.value.trim();
        }

        function sendText() {
            const text = DOM.chatInput.value.trim();
            if (!text) return;
            send('text', { text });
            DOM.chatInput.value = '';
            updateSendBtn();
            haptic(10);
        }

        function sendImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > CONFIG.maxImageSize) { toast('Saiz terlalu besar!', 'error'); return; }
            compressImage(file, data => {
                send('image', { data });
                toast('Gambar dihantar!', 'success');
            });
            e.target.value = '';
        }

        async function toggleRecord() {
            if (state.isRecording) { stopRecord(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.recorder = new MediaRecorder(stream);
                state.audioChunks = [];
                state.recorder.ondataavailable = e => state.audioChunks.push(e.data);
                state.recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = ev => {
                        send('audio', { data: ev.target.result, duration: Math.round((Date.now() - state.recordStart) / 1000) });
                        toast('Audio dihantar!', 'success');
                    };
                    reader.readAsDataURL(blob);
                    clearInterval(state.recordTimer);
                };
                state.recorder.start();
                state.isRecording = true;
                state.recordStart = Date.now();
                DOM.recordBtn.classList.add('recording');
                DOM.recBar.classList.add('active');
                DOM.recBar.textContent = '🔴 MERAKAM... (30s)';
                haptic(20);
                state.recordTimer = setInterval(() => {
                    const elapsed = Math.round((Date.now() - state.recordStart) / 1000);
                    const remaining = CONFIG.maxAudioDuration - elapsed;
                    if (remaining <= 0) { stopRecord(); return; }
                    DOM.recBar.textContent = `🔴 MERAKAM... (${remaining}s)`;
                }, 1000);
            } catch(e) {
                toast('Tidak dapat akses mikrofon!', 'error');
                haptic([30, 50, 30]);
            }
        }

        function stopRecord() {
            if (!state.isRecording) return;
            state.isRecording = false;
            DOM.recordBtn.classList.remove('recording');
            DOM.recBar.classList.remove('active');
            DOM.recBar.textContent = '🔴 MERAKAM...';
            clearInterval(state.recordTimer);
            if (state.recorder) { try { state.recorder.stop(); } catch(e) {} }
        }

        function handleDelete(key, btn) {
            if (state.deleteTarget === key) {
                clearTimeout(state.deleteTimer);
                db.ref('chat/' + key).remove().then(() => {
                    toast('Dipadam!', 'success');
                    haptic(15);
                }).catch(() => toast('Gagal padam!', 'error'));
                state.deleteTarget = null;
                return;
            }
            state.deleteTarget = key;
            btn.classList.add('confirm');
            haptic(5);
            state.deleteTimer = setTimeout(() => {
                btn.classList.remove('confirm');
                state.deleteTarget = null;
            }, 2000);
        }

        db.ref('.info/connected').on('value', snap => {
            const isOnline = snap.val() === true;
            DOM.onlineStatus.textContent = isOnline ? '● ONLINE' : '● OFFLINE';
            DOM.onlineStatus.style.color = isOnline ? 'var(--success)' : '#555';
        });

        function openLightbox(src) {
            DOM.lightboxImg.src = src;
            DOM.lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            DOM.lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        DOM.chatName.value = localStorage.getItem('zack_name') || '';
        DOM.chatName.addEventListener('blur', () => localStorage.setItem('zack_name', getName()));

        DOM.sendBtn.addEventListener('click', sendText);
        DOM.chatInput.addEventListener('input', updateSendBtn);
        DOM.chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendText();
            }
        });
        DOM.imgBtn.addEventListener('click', () => DOM.chatImageInput.click());
        DOM.chatImageInput.addEventListener('change', sendImage);
        DOM.recordBtn.addEventListener('click', toggleRecord);
        DOM.lightbox.addEventListener('click', closeLightbox);

        document.addEventListener('click', e => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') {
                createRipple(e.clientX, e.clientY);
            }
        });

        initStars();
        initParticles();
        updateSendBtn();
    </script>

</body>
</html>
