<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK — Chat">
    <title>ZACK — Chat</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK","short_name":"ZACK","display":"standalone","theme_color":"%23000000","background_color":"%23000000"}'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --red: #ff0033;
            --cyan: #00f0ff;
            --bg: #000000;
            --white: #ffffff;
            --muted: #777777;
            --success: #00ff88;
            --border: rgba(255,0,51,0.2);
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --grad-btn: linear-gradient(135deg, #ff0033, #00f0ff);
            --r-md: 14px;
            --r-full: 25px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(10px + var(--safe-top)) 15px 10px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            text-align: center;
            background: var(--grad-text);
            background-size: 300% 300%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoShift 4s ease infinite;
        }
        @keyframes logoShift { 50% { background-position: 100% 50%; } }

        .main {
            position: relative; z-index: 2;
            padding: calc(55px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .chat-box {
            display: flex; flex-direction: column;
            flex: 1;
            border: 1px solid var(--border); border-radius: var(--r-md);
            background: rgba(255,0,51,0.04); overflow: hidden;
            min-height: 0;
        }

        .chat-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .chat-head h3 { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--cyan); }
        .chat-head .online { font-size: 8px; transition: color 0.3s; }

        .rec-bar {
            display: none; text-align: center; padding: 4px;
            background: rgba(255,0,51,0.08); border-bottom: 1px solid var(--red);
            font-size: 9px; color: var(--red); font-family: 'Orbitron', sans-serif;
            flex-shrink: 0;
        }
        .rec-bar.active { display: block; }

        .chat-log {
            flex: 1; overflow-y: auto; padding: 10px 10px 25px;
            min-height: 0;
            will-change: scroll-position;
            -webkit-overflow-scrolling: touch;
        }

        .date-sep {
            text-align: center; font-size: 8px; color: #444;
            margin: 10px 0; font-family: 'Orbitron', sans-serif;
        }

        .msg { margin-bottom: 10px; animation: msgIn 0.2s var(--ease); }
        @keyframes msgIn { from { opacity: 0; transform: translateY(5px); } }
        .msg.own { text-align: right; }
        .msg-name { font-family: 'Orbitron', sans-serif; font-size: 8px; color: var(--cyan); margin-bottom: 3px; }
        .msg.own .msg-name { color: var(--success); }

        .msg-text {
            display: inline-block; font-size: 12px; color: #ccc;
            background: rgba(0,0,0,0.4); padding: 8px 10px; border-radius: 10px;
            word-break: break-word; max-width: 100%; text-align: left;
        }
        .msg.own .msg-text { background: rgba(0,255,136,0.08); }

        .msg-audio {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,0,51,0.08); border: 1px solid var(--red);
            border-radius: 20px; padding: 7px 12px;
        }
        .msg-audio span { font-size: 14px; color: var(--cyan); }
        .msg-audio small { font-size: 8px; color: #ccc; }

        .msg-image {
            max-width: 140px; border-radius: 8px; border: 1px solid var(--cyan);
            display: block; pointer-events: auto;
        }
        .msg.own .msg-image { margin-left: auto; }

        .msg-del {
            background: none; border: none; color: #444; font-size: 10px;
            padding: 2px; margin-left: 5px;
            transition: color 0.2s;
        }
        .msg-del.confirm { color: var(--red); font-weight: 700; }

        .typing-indicator {
            font-size: 8px; color: #555; padding: 3px 10px;
            display: none; letter-spacing: 1px;
        }
        .typing-indicator.show { display: block; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        .chat-input-area {
            padding: 8px 10px; border-top: 1px solid var(--border);
            display: flex; gap: 5px; align-items: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1; padding: 10px 13px;
            background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            color: var(--white); font-family: 'Rajdhani', sans-serif; font-size: 13px;
            border-radius: var(--r-full); outline: none; min-width: 0;
        }
        .chat-input:focus { border-color: var(--cyan); }
        .name-input { flex: 0 0 70px; }

        .send-btn {
            padding: 10px 14px; background: var(--grad-btn); color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            opacity: 0.3; transition: opacity 0.2s;
        }
        .send-btn:not(:disabled) { opacity: 1; cursor: pointer; }
        .send-btn:disabled { cursor: not-allowed; }

        .attach-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,0,51,0.06); border: 1px solid var(--border);
            color: var(--cyan); font-size: 13px;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            transition: all 0.2s var(--ease);
        }
        .attach-btn:active { background: var(--red); color: var(--white); }
        .attach-btn.recording { background: var(--red); color: var(--white); animation: pulse 0.5s infinite; }

        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px; max-width: 260px;
        }
        .toast {
            padding: 10px 16px; border-radius: 10px; font-size: 11px; border: 1px solid;
            transform: translateX(0);
            transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
            opacity: 1;
        }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-success { background: rgba(0,255,136,0.12); border-color: var(--success); color: var(--success); }
        .toast-error { background: rgba(255,0,51,0.12); border-color: var(--red); color: var(--red); }
        .toast-info { background: rgba(0,240,255,0.12); border-color: var(--cyan); color: var(--cyan); }

        .lightbox {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.95); display: none;
            justify-content: center; align-items: center;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 92%; max-height: 85%;
            border: 2px solid var(--cyan); border-radius: 10px;
            pointer-events: none;
        }

        #chatImageInput { display: none; }
    </style>
</head>
<body>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

    <div class="lightbox" id="lightbox">
        <img id="lightboxImg" src="" alt="Gambar penuh">
    </div>

    <div class="header">
        <div class="logo">ZACK</div>
    </div>

    <div class="main">
        <div class="chat-box" role="region" aria-label="Chat">
            <div class="chat-head">
                <h3>💬 CHAT</h3>
                <span class="online" id="onlineStatus">● OFFLINE</span>
            </div>
            <div class="rec-bar" id="recBar">🔴 MERAKAM...</div>
            <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
            <div class="typing-indicator" id="typingIndicator">Seseorang sedang menaip...</div>
            <div class="chat-input-area">
                <input type="text" id="chatName" class="chat-input name-input" placeholder="NAMA" maxlength="20" aria-label="Nama anda" autocomplete="off">
                <input type="text" id="chatInput" class="chat-input" placeholder="Tulis..." maxlength="500" aria-label="Tulis mesej" autocomplete="off">
                <button class="attach-btn" id="imgBtn" aria-label="Hantar gambar">📷</button>
                <button class="attach-btn" id="recordBtn" aria-label="Rakam audio">🎤</button>
                <button class="send-btn" id="sendBtn" disabled>HANTAR</button>
            </div>
            <input type="file" id="chatImageInput" accept="image/*" aria-label="Pilih gambar">
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        'use strict';

        /* ============ CONFIG ============ */
        const CONFIG = {
            databaseURL: 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/',
            maxImageSize: 2 * 1024 * 1024,
            maxAudioDuration: 30,
            maxImageDim: 1000,
            messageLimit: 30
        };

        /* ============ STATE ============ */
        const state = {
            isRecording: false,
            recordStart: 0,
            recorder: null,
            audioChunks: [],
            recordTimer: null,
            deleteTarget: null,
            deleteTimer: null,
            typingTimer: null,
            typingRef: null
        };

        /* ============ DOM ============ */
        const $ = id => document.getElementById(id);
        const DOM = {
            toastWrap: $('toastWrap'),
            lightbox: $('lightbox'),
            lightboxImg: $('lightboxImg'),
            chatLog: $('chatLog'),
            chatName: $('chatName'),
            chatInput: $('chatInput'),
            onlineStatus: $('onlineStatus'),
            recordBtn: $('recordBtn'),
            recBar: $('recBar'),
            sendBtn: $('sendBtn'),
            imgBtn: $('imgBtn'),
            chatImageInput: $('chatImageInput'),
            typingIndicator: $('typingIndicator')
        };

        /* ============ FIREBASE ============ */
        const db = firebase.initializeApp({ databaseURL: CONFIG.databaseURL }).database();

        /* ============ HELPERS ============ */
        function toast(msg, type = 'info') {
            while (DOM.toastWrap.children.length >= 3) DOM.toastWrap.firstChild.remove();
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            DOM.toastWrap.appendChild(el);
            setTimeout(() => {
                el.classList.add('hide');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        function debounce(fn, delay = 500) {
            let timer;
            return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
        }

        function haptic(pattern = 10) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        const safeText = str => { const d = document.createElement('div'); d.textContent = str; return d.textContent; };
        const getTime = () => new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
        const getName = () => DOM.chatName.value.trim() || 'Anonymous';

        function dateSep(ts) {
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 864e5).toDateString();
            const msgDate = new Date(ts).toDateString();
            if (msgDate === today) return 'HARI INI';
            if (msgDate === yesterday) return 'SEMALAM';
            return new Date(ts).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long' });
        }

        function compressImage(file, cb) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    if (img.width <= CONFIG.maxImageDim) {
                        cb(reader.result);
                        return;
                    }
                    const canvas = document.createElement('canvas');
                    const ratio = CONFIG.maxImageDim / img.width;
                    canvas.width = CONFIG.maxImageDim;
                    canvas.height = Math.round(img.height * ratio);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    cb(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        /* ============ TYPING INDICATOR ============ */
        function setTyping(isTyping) {
            if (isTyping) {
                db.ref('typing/' + getName()).set(true).catch(() => {});
                clearTimeout(state.typingTimer);
                state.typingTimer = setTimeout(() => db.ref('typing/' + getName()).remove().catch(() => {}), 2000);
            }
        }

        db.ref('typing').on('value', snap => {
            const myName = getName();
            let othersTyping = false;
            if (snap.exists()) {
                snap.forEach(child => {
                    if (child.key !== myName && child.val() === true) othersTyping = true;
                });
            }
            DOM.typingIndicator.classList.toggle('show', othersTyping);
        });

        /* ============ CHAT ============ */
        db.ref('chat').limitToLast(CONFIG.messageLimit).on('value', snap => {
            const myName = getName();
            const atBottom = DOM.chatLog.scrollHeight - DOM.chatLog.scrollTop - DOM.chatLog.clientHeight < 50;
            DOM.chatLog.innerHTML = '';
            const frag = document.createDocumentFragment();
            let lastDate = '';

            if (snap.exists()) {
                snap.forEach(child => {
                    const d = child.val();
                    const ds = dateSep(d.timestamp || Date.now());
                    if (ds !== lastDate) {
                        lastDate = ds;
                        const sep = document.createElement('div');
                        sep.className = 'date-sep';
                        sep.textContent = `— ${ds} —`;
                        frag.appendChild(sep);
                    }

                    const div = document.createElement('div');
                    div.className = 'msg' + (d.name === myName ? ' own' : '');

                    const name = document.createElement('div');
                    name.className = 'msg-name';
                    name.textContent = `${safeText(d.name)} • ${d.time || ''}`;
                    div.appendChild(name);

                    if (d.type === 'text') {
                        const t = document.createElement('div');
                        t.className = 'msg-text';
                        t.textContent = safeText(d.text);
                        div.appendChild(t);
                    } else if (d.type === 'image') {
                        const img = document.createElement('img');
                        img.className = 'msg-image';
                        img.src = d.data;
                        img.alt = 'Gambar dari ' + safeText(d.name);
                        img.addEventListener('click', () => openLightbox(d.data));
                        div.appendChild(img);
                    } else if (d.type === 'audio') {
                        const a = document.createElement('div');
                        a.className = 'msg-audio';
                        a.setAttribute('role', 'button');
                        a.setAttribute('aria-label', 'Mainkan audio');
                        const icon = document.createElement('span');
                        icon.textContent = '▶';
                        const dur = document.createElement('small');
                        dur.textContent = `${Math.floor((d.duration || 0) / 60)}:${((d.duration || 0) % 60).toString().padStart(2, '0')}`;
                        a.append(icon, dur);
                        a.addEventListener('click', () => {
                            const audio = new Audio(d.data);
                            audio.play().catch(() => toast('Tidak dapat main audio!', 'error'));
                        });
                        div.appendChild(a);
                    }

                    if (d.name === myName) {
                        const del = document.createElement('button');
                        del.className = 'msg-del';
                        del.textContent = '✕';
                        del.setAttribute('aria-label', 'Padam mesej');
                        del.addEventListener('click', () => handleDelete(child.key, del));
                        div.appendChild(del);
                    }

                    frag.appendChild(div);
                });
            }

            DOM.chatLog.appendChild(frag);
            if (atBottom) DOM.chatLog.scrollTop = DOM.chatLog.scrollHeight;
        });

        function send(type, data) {
            db.ref('chat').push({
                type, name: getName(), timestamp: Date.now(),
                ...data, time: getTime()
            }).catch(() => toast('Gagal hantar!', 'error'));
            haptic(10);
        }

        function updateSendBtn() {
            DOM.sendBtn.disabled = !DOM.chatInput.value.trim();
        }

        function sendText() {
            const text = DOM.chatInput.value.trim();
            if (!text) return;
            send('text', { text });
            DOM.chatInput.value = '';
            updateSendBtn();
        }

        function sendImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > CONFIG.maxImageSize) { toast('Saiz terlalu besar!', 'error'); return; }
            compressImage(file, data => {
                send('image', { data });
                toast('Gambar dihantar!', 'success');
            });
            e.target.value = '';
        }

        async function toggleRecord() {
            if (state.isRecording) { stopRecord(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.recorder = new MediaRecorder(stream);
                state.audioChunks = [];
                state.recorder.ondataavailable = e => state.audioChunks.push(e.data);
                state.recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = ev => {
                        send('audio', { data: ev.target.result, duration: Math.round((Date.now() - state.recordStart) / 1000) });
                        toast('Audio dihantar!', 'success');
                    };
                    reader.readAsDataURL(blob);
                    clearInterval(state.recordTimer);
                };
                state.recorder.start();
                state.isRecording = true;
                state.recordStart = Date.now();
                DOM.recordBtn.classList.add('recording');
                DOM.recBar.classList.add('active');
                DOM.recBar.textContent = '🔴 MERAKAM... (30s)';
                haptic(20);
                state.recordTimer = setInterval(() => {
                    const elapsed = Math.round((Date.now() - state.recordStart) / 1000);
                    const remaining = CONFIG.maxAudioDuration - elapsed;
                    if (remaining <= 0) { stopRecord(); return; }
                    DOM.recBar.textContent = `🔴 MERAKAM... (${remaining}s)`;
                }, 1000);
            } catch(e) {
                toast('Tidak dapat akses mikrofon!', 'error');
                haptic([30, 50, 30]);
            }
        }

        function stopRecord() {
            if (!state.isRecording) return;
            state.isRecording = false;
            DOM.recordBtn.classList.remove('recording');
            DOM.recBar.classList.remove('active');
            DOM.recBar.textContent = '🔴 MERAKAM...';
            clearInterval(state.recordTimer);
            if (state.recorder) {
                try { state.recorder.stop(); } catch(e) {}
            }
        }

        /* ============ DELETE (Double-tap) ============ */
        function handleDelete(key, btn) {
            if (state.deleteTarget === key) {
                clearTimeout(state.deleteTimer);
                db.ref('chat/' + key).remove().then(() => {
                    toast('Dipadam!', 'success');
                    haptic(15);
                }).catch(() => toast('Gagal padam!', 'error'));
                state.deleteTarget = null;
                return;
            }
            state.deleteTarget = key;
            btn.classList.add('confirm');
            haptic(5);
            state.deleteTimer = setTimeout(() => {
                btn.classList.remove('confirm');
                state.deleteTarget = null;
            }, 2000);
        }

        /* ============ ONLINE ============ */
        db.ref('.info/connected').on('value', snap => {
            const isOnline = snap.val() === true;
            DOM.onlineStatus.textContent = isOnline ? '● ONLINE' : '● OFFLINE';
            DOM.onlineStatus.style.color = isOnline ? 'var(--success)' : '#555';
        });

        /* ============ LIGHTBOX ============ */
        function openLightbox(src) {
            DOM.lightboxImg.src = src;
            DOM.lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            haptic(5);
        }
        function closeLightbox() {
            DOM.lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        /* ============ NAME PERSIST ============ */
        DOM.chatName.value = localStorage.getItem('zack_name') || '';
        const saveNameDebounced = debounce(() => localStorage.setItem('zack_name', getName()), 500);
        DOM.chatName.addEventListener('input', saveNameDebounced);

        /* ============ EVENTS ============ */
        DOM.sendBtn.addEventListener('click', sendText);
        DOM.chatInput.addEventListener('input', () => {
            updateSendBtn();
            setTyping(true);
        });
        DOM.chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendText();
            }
        });
        DOM.imgBtn.addEventListener('click', () => DOM.chatImageInput.click());
        DOM.chatImageInput.addEventListener('change', sendImage);
        DOM.recordBtn.addEventListener('click', toggleRecord);
        DOM.lightbox.addEventListener('click', closeLightbox);

        /* ============ INIT ============ */
        updateSendBtn();
    </script>

</body>
</html>
