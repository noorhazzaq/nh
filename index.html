<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FOUR PATHS RPG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:#0b0e14;color:#e8edf5;touch-action:manipulation}
#app{display:flex;flex-direction:column;width:100%;height:100%;max-width:720px;margin:0 auto;padding:12px;background:linear-gradient(145deg,#131a24,#0b0f16);box-shadow:0 0 40px rgba(0,0,0,0.8)}
#screen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px;border-radius:28px;background:rgba(20,28,40,0.5);backdrop-filter:blur(4px);border:1px solid #2d3f52;min-height:0}
#title{font-size:clamp(1.6rem,8vw,2.8rem);font-weight:700;letter-spacing:2px;text-shadow:0 0 12px #3b6ea0;color:#b4d9ff;margin-bottom:6px;text-align:center}
#sub{font-size:clamp(0.7rem,2.5vw,1rem);color:#7b9ec0;text-align:center;margin-bottom:12px;border-bottom:1px solid #2a3a4a;padding-bottom:8px;width:80%}
#story{width:100%;min-height:clamp(120px,30vh,200px);padding:12px 10px;background:#0d141e;border-radius:18px;border:1px solid #2c4055;font-size:clamp(0.95rem,2.8vw,1.25rem);line-height:1.5;display:flex;align-items:center;justify-content:center;text-align:center;color:#d6e6ff;box-shadow:inset 0 0 20px #00000055;overflow-y:auto;word-break:break-word}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:14px 0;flex:0 0 auto}
.choice{background:#1d2b3a;border:1px solid #3d5770;border-radius:60px;padding:clamp(10px,2.5vh,16px) 6px;font-size:clamp(0.8rem,2.2vw,1.1rem);font-weight:600;color:#d0e2ff;text-align:center;cursor:pointer;box-shadow:0 4px 0 #0a1118;transition:all 0.08s ease;touch-action:manipulation;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1118;background:#2a3f54}
.choice.disabled{opacity:0.3;pointer-events:none;filter:grayscale(0.6)}
#info-panel{display:flex;justify-content:space-between;width:100%;padding:6px 10px;background:#111c28;border-radius:40px;border:1px solid #2a3d50;font-size:clamp(0.6rem,1.8vw,0.9rem);color:#9ab8d6;flex-wrap:wrap;gap:4px 8px;margin-top:4px}
.badge{background:#1f3142;padding:2px 12px;border-radius:40px;border:1px solid #3c5770}
#resetBtn{background:#2a1f2e;border:1px solid #6b4a5a;border-radius:40px;padding:6px 14px;font-weight:700;color:#eac6d4;cursor:pointer;font-size:clamp(0.7rem,2vw,0.95rem);transition:0.1s;touch-action:manipulation}
#resetBtn:active{background:#432f3b;transform:scale(0.95)}
@media(max-width:480px){#choices{gap:8px}.choice{border-radius:30px;padding:12px 4px;font-size:0.85rem}}
@media(orientation:landscape) and (max-height:500px){#story{min-height:80px;padding:8px}#choices{gap:6px;margin:8px 0}.choice{padding:8px 4px}}
</style>
</head>
<body>
<div id="app">
<div id="screen">
<div id="title">✦ 4 PATHS ✦</div>
<div id="sub">role · story · ending · consequence</div>
<div id="story">Choose your role to begin the prophecy.</div>
<div id="choices">
<div class="choice" data-idx="0">⚔️ WARRIOR</div>
<div class="choice" data-idx="1">🌀 MAGE</div>
<div class="choice" data-idx="2">🗡️ ROGUE</div>
<div class="choice" data-idx="3">🛡️ CLERIC</div>
</div>
<div id="info-panel">
<span class="badge" id="roleDisplay">ROLE: —</span>
<span class="badge" id="pathDisplay">PATH: 0/4</span>
<span class="badge" id="endingDisplay">ENDING: —</span>
<span id="resetBtn">⟳ RESTART</span>
</div>
</div>
</div>
<script>
(function(){
"use strict";
const STATE={role:null,path:0,step:0,ending:null,consequence:null,storyIndex:0,gameOver:false};
const ROLES=[
{id:'warrior',label:'WARRIOR',icon:'⚔️',color:'#b87333'},
{id:'mage',label:'MAGE',icon:'🌀',color:'#6a5acd'},
{id:'rogue',label:'ROGUE',icon:'🗡️',color:'#2e8b57'},
{id:'cleric',label:'CLERIC',icon:'🛡️',color:'#c0a050'}
];
const STORIES=[
{role:'warrior',text:'You are Kaelen, the Iron Vanguard. The northland burns. Your kin are scattered. A warlock offers a cursed blade — but your oath demands honor. Choose your path.',choices:['Take the cursed blade','Refuse and rally the clans','Seek the mountain oracle','March alone to the dark keep']},
{role:'mage',text:'Lyra of the Amber Spire. The Veil tears — demons seep through. The High Council is paralyzed. You hold a forbidden scroll that could seal the rift — or destroy the realm.',choices:['Read the forbidden scroll','Burn the scroll and fight','Summon the elder elemental','Flee to the southern isles']},
{role:'rogue',text:'Shadow — no true name. The Crimson Syndicate betrayed you. A vial of ichor can give you godlike speed, but each use consumes your memory. The assassin\'s guild watches.',choices:['Drink the ichor','Sell the vial for gold','Ambush the guildmaster','Disguise and infiltrate']},
{role:'cleric',text:'Seraphine, Lightbringer. The plague of undeath spreads from the catacombs. Your faith wavers — a demon offers a cure in exchange for your soul. The cathedral is besieged.',choices:['Accept the demon\'s pact','Purify the catacombs with fire','Preach hope to the survivors','Seek the lost relic of dawn']}
];
const CONSEQUENCES=[
{role:'warrior',choice0:'Cursed blade consumes you — you become a dark warlord.',choice1:'Clans unite under your banner, the north is free.',choice2:'The oracle reveals a forgotten alliance — victory is certain.',choice3:'Alone you slay the warlock, but die from your wounds.'},
{role:'mage',choice0:'The scroll unleashes chaos — you become a living rift.',choice1:'Fire purges the demons, but half the city burns.',choice2:'Elemental crushes the demons, but you lose control.',choice3:'You survive, but the realm falls to darkness.'},
{role:'rogue',choice0:'Speed unmatched — you become a ghost, but forget your past.',choice1:'Gold buys power — you lead a new syndicate.',choice2:'You kill the guildmaster — but become the new tyrant.',choice3:'You escape, free, but the ichor is lost forever.'},
{role:'cleric',choice0:'Your soul is damned — you become a death knight.',choice1:'Fire cleanses the catacombs, but you are scarred.',choice2:'Hope rallies the people — a new age of faith.',choice3:'Relic burns the undead — you ascend as a saint.'}
];
const ENDINGS={
warrior:['Dark Warlord','Northward King','Oracle\'s Champion','Martyr of the North'],
mage:['Riftwalker','Ashen Reformer','Elemental Thrall','Fugitive Seer'],
rogue:['Memoryless Phantom','Gold Emperor','Shadow Tyrant','Free Exile'],
cleric:['Death Knight','Scarred Purifier','Radiant Prophet','Ascended Saint']
};
const pathLabels=['FIRST PATH','SECOND PATH','THIRD PATH','FOURTH PATH'];

const storyEl=document.getElementById('story');
const choicesEl=document.getElementById('choices');
const roleDisplay=document.getElementById('roleDisplay');
const pathDisplay=document.getElementById('pathDisplay');
const endingDisplay=document.getElementById('endingDisplay');
const resetBtn=document.getElementById('resetBtn');

function updateUI(){
const r=STATE.role;
roleDisplay.textContent=r?`ROLE: ${r.icon} ${r.label}`:'ROLE: —';
pathDisplay.textContent=`PATH: ${STATE.path+1}/4`;
endingDisplay.textContent=STATE.ending?`ENDING: ${STATE.ending}`:'ENDING: —';
if(STATE.gameOver){
storyEl.textContent=`${STATE.consequence||'The prophecy ends.'} [GAME OVER]`;
document.querySelectorAll('.choice').forEach(b=>b.classList.add('disabled'));
}else{
const story=STORIES.find(s=>s.role===STATE.role?.id);
if(story&&STATE.step<4){
storyEl.textContent=story.text;
const btns=document.querySelectorAll('.choice');
btns.forEach((btn,i)=>{
btn.classList.remove('disabled');
if(i<4){
const label=story.choices[i]||'—';
btn.textContent=label;
btn.dataset.idx=i;
}else{btn.classList.add('disabled');}
});
}else if(story&&STATE.step>=4){
storyEl.textContent='Your legend is written. The realm remembers your deeds.';
document.querySelectorAll('.choice').forEach(b=>b.classList.add('disabled'));
}else{
storyEl.textContent='Choose your role to begin.';
document.querySelectorAll('.choice').forEach(b=>b.classList.remove('disabled'));
}
}
}

function applyConsequence(choiceIdx){
if(!STATE.role)return;
const cons=CONSEQUENCES.find(c=>c.role===STATE.role.id);
if(!cons)return;
let msg='';
switch(choiceIdx){
case 0:msg=cons.choice0;break;
case 1:msg=cons.choice1;break;
case 2:msg=cons.choice2;break;
case 3:msg=cons.choice3;break;
default:msg='The consequence unfolds.';
}
STATE.consequence=msg;
const endings=ENDINGS[STATE.role.id];
if(endings&&endings[choiceIdx])STATE.ending=endings[choiceIdx];
STATE.gameOver=true;
STATE.step=4;
updateUI();
}

function advancePath(choiceIdx){
if(STATE.gameOver)return;
if(!STATE.role){
const roleIndex=parseInt(choiceIdx);
if(roleIndex>=0&&roleIndex<ROLES.length){
STATE.role=ROLES[roleIndex];
STATE.path=0;
STATE.step=0;
STATE.ending=null;
STATE.consequence=null;
STATE.gameOver=false;
updateUI();
}
return;
}
if(STATE.step>=4)return;
const story=STORIES.find(s=>s.role===STATE.role.id);
if(!story)return;
const choiceIndex=parseInt(choiceIdx);
if(isNaN(choiceIndex)||choiceIndex<0||choiceIndex>3)return;
STATE.path=Math.min(STATE.path+1,3);
STATE.step=STATE.path;
if(STATE.step>=4){
applyConsequence(choiceIndex);
}else{
const nextStory=STORIES.find(s=>s.role===STATE.role.id);
if(nextStory){
storyEl.textContent=nextStory.text;
const btns=document.querySelectorAll('.choice');
btns.forEach((btn,i)=>{
btn.classList.remove('disabled');
if(i<4){
btn.textContent=nextStory.choices[i]||'—';
btn.dataset.idx=i;
}else{btn.classList.add('disabled');}
});
}
updateUI();
}
}

function resetGame(){
STATE.role=null;
STATE.path=0;
STATE.step=0;
STATE.ending=null;
STATE.consequence=null;
STATE.gameOver=false;
storyEl.textContent='Choose your role to begin the prophecy.';
const btns=document.querySelectorAll('.choice');
btns.forEach((btn,i)=>{
btn.classList.remove('disabled');
if(i<4){
btn.textContent=ROLES[i]?`${ROLES[i].icon} ${ROLES[i].label}`:'—';
btn.dataset.idx=i;
}else{btn.classList.add('disabled');}
});
updateUI();
}

function handleChoice(e){
const target=e.target.closest('.choice');
if(!target)return;
if(target.classList.contains('disabled'))return;
const idx=target.dataset.idx;
if(idx===undefined)return;
const numIdx=parseInt(idx);
if(isNaN(numIdx))return;
if(!STATE.role){
const roleIndex=numIdx;
if(roleIndex>=0&&roleIndex<ROLES.length){
STATE.role=ROLES[roleIndex];
STATE.path=0;
STATE.step=0;
STATE.ending=null;
STATE.consequence=null;
STATE.gameOver=false;
updateUI();
const story=STORIES.find(s=>s.role===STATE.role.id);
if(story){
storyEl.textContent=story.text;
const btns=document.querySelectorAll('.choice');
btns.forEach((btn,i)=>{
btn.classList.remove('disabled');
if(i<4){
btn.textContent=story.choices[i]||'—';
btn.dataset.idx=i;
}else{btn.classList.add('disabled');}
});
}
updateUI();
}
return;
}
advancePath(numIdx);
}

function init(){
resetGame();
choicesEl.addEventListener('click',handleChoice);
resetBtn.addEventListener('click',resetGame);
document.addEventListener('touchmove',function(e){if(e.target.closest('#story')||e.target.closest('.choice')){e.preventDefault();}},{passive:false});
if(/android/i.test(navigator.userAgent)===false){
document.body.innerHTML='<div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#0b0e14;color:#d0dae8;font-size:1.8rem;padding:20px;text-align:center;font-family:sans-serif;">🚫 ANDROID BROWSER ONLY<br><span style="font-size:1rem;color:#6a7f96">this experience is crafted for Android devices</span></div>';
return;
}
}
if(document.readyState==='complete'||document.readyState==='interactive'){init();}else{document.addEventListener('DOMContentLoaded',init);}
})();
</script>
</body>
</html>
