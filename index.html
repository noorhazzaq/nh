<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zack360</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #000;
      --text: #fff;
      --muted: #a6a6a6;
      --accent: #fe2c55;
      --border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* HEADER */
    header { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; font-weight: 800; }
    .badge { width: 20px; height: 20px; background: linear-gradient(135deg, #25f4ee, var(--accent)); border-radius: 4px; }
    .btn { padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; border: none; background: rgba(255,255,255,0.1); color: var(--text); }
    .btn-accent { background: var(--accent); color: #fff; }

    /* LAYOUT */
    .app-body { display: flex; flex: 1; height: calc(100vh - 60px); }
    aside { width: 220px; border-right: 1px solid var(--border); padding: 16px 8px; display: flex; flex-direction: column; gap: 4px; }
    .nav-item { padding: 12px 16px; border-radius: 8px; font-weight: 700; color: var(--text); text-decoration: none; }
    .nav-item.active { color: var(--accent); }

    /* FEED */
    main { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; display: flex; flex-direction: column; align-items: center; }
    .empty-state { margin-auto: 0; text-align: center; color: var(--muted); padding-top: 100px; }
    
    .video-item { scroll-snap-align: start; height: calc(100vh - 60px); width: 100%; max-width: 480px; padding: 12px 0; display: flex; justify-content: center; position: relative; }
    .video-card { position: relative; width: 100%; height: 100%; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

    .video-info { position: absolute; bottom: 0; left: 0; right: 60px; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); pointer-events: none; }
    .author { font-weight: 700; }
    .desc { font-size: 0.85rem; margin-top: 4px; }

    .actions { position: absolute; right: 12px; bottom: 20px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .action-btn { background: none; border: none; color: var(--text); cursor: pointer; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .action-btn.active .icon { color: var(--accent); background: rgba(254, 44, 85, 0.2); }

    /* COMMENTS DRAWER */
    .drawer { position: absolute; bottom: 0; inset-x: 0; height: 60%; background: #1e1e1e; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.2s; z-index: 20; }
    .drawer.open { transform: translateY(0); }
    .drawer-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: 700; }
    .comment-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
    .comment-input { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .comment-input input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 20px; padding: 8px 12px; color: #fff; outline: none; }

    /* MODAL */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
    .modal-card input, .modal-card textarea { background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 6px; padding: 8px; color: #fff; outline: none; }

    @media (max-width: 768px) { aside { display: none; } .video-item { padding: 0; } .video-card { border-radius: 0; } }
  </style>
</head>
<body>

  <header>
    <div class="brand"><div class="badge"></div>Zack360</div>
    <button class="btn" id="openModal">+ Upload</button>
  </header>

  <div class="app-body">
    <aside>
      <a class="nav-item active">🏠 For You</a>
      <a class="nav-item">👥 Following</a>
      <a class="nav-item">🧭 Explore</a>
      <a class="nav-item">👤 Profile</a>
    </aside>

    <main id="feed"></main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <h3>Upload Video</h3>
      <input type="file" id="fileIn" accept="video/*">
      <input type="text" id="userIn" placeholder="@username">
      <textarea id="descIn" placeholder="Caption..." rows="2"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" id="closeModal">Cancel</button>
        <button class="btn btn-accent" id="submitUpload">Publish</button>
      </div>
    </div>
  </div>

  <script>
    let feedData = JSON.parse(localStorage.getItem('z360_feed')) || [];
    const feed = document.getElementById('feed');
    const modal = document.getElementById('modal');

    function saveAndRender() {
      localStorage.setItem('z360_feed', JSON.stringify(feedData));
      feed.innerHTML = feedData.length ? '' : `<div class="empty-state"><h2>No videos on Zack360</h2><p>Click <strong>+ Upload</strong> to post!</p></div>`;
      
      feedData.forEach((v, i) => {
        const el = document.createElement('div');
        el.className = 'video-item';
        el.innerHTML = `
          <div class="video-card">
            <video loop playsinline src="${v.url}"></video>
            <div class="video-info"><div class="author">${v.author}</div><div class="desc">${v.caption}</div></div>
            <div class="actions">
              <button class="action-btn ${v.liked ? 'active' : ''}" onclick="toggleLike(${i})">
                <div class="icon">❤️</div><span>${v.likes}</span>
              </button>
              <button class="action-btn" onclick="toggleDrawer('${v.id}')">
                <div class="icon">💬</div><span>${v.comments.length}</span>
              </button>
            </div>
            <div class="drawer" id="d-${v.id}">
              <div class="drawer-head"><span>Comments</span><button class="btn" onclick="toggleDrawer('${v.id}')" style="padding:2px 8px;">✕</button></div>
              <div class="comment-list">${v.comments.map(c => `<div><strong>User:</strong> ${c}</div>`).join('')}</div>
              <div class="comment-input">
                <input type="text" id="in-${v.id}" placeholder="Add comment...">
                <button class="btn btn-accent" onclick="addComment(${i}, '${v.id}')">Post</button>
              </div>
            </div>
          </div>`;
        feed.appendChild(el);
      });

      setupAutoplay();
    }

    function setupAutoplay() {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          const v = e.target;
          e.isIntersecting ? v.play().catch(()=>{}) : (v.pause(), v.currentTime = 0);
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('video').forEach(v => {
        observer.observe(v);
        v.onclick = () => v.paused ? v.play() : v.pause();
      });
    }

    window.toggleLike = (i) => {
      feedData[i].liked = !feedData[i].liked;
      feedData[i].likes += feedData[i].liked ? 1 : -1;
      saveAndRender();
    };

    window.toggleDrawer = (id) => document.getElementById(`d-${id}`).classList.toggle('open');

    window.addComment = (i, id) => {
      const input = document.getElementById(`in-${id}`);
      if (input.value.trim()) {
        feedData[i].comments.push(input.value.trim());
        saveAndRender();
        setTimeout(() => toggleDrawer(id), 50);
      }
    };

    document.getElementById('openModal').onclick = () => modal.style.display = 'flex';
    document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
    
    document.getElementById('submitUpload').onclick = () => {
      const file = document.getElementById('fileIn').files[0];
      if (!file) return alert('Select a video file.');

      feedData.unshift({
        id: 'z_' + Date.now(),
        author: document.getElementById('userIn').value || '@zack360',
        caption: document.getElementById('descIn').value || '',
        url: URL.createObjectURL(file),
        likes: 0,
        liked: false,
        comments: []
      });

      saveAndRender();
      modal.style.display = 'none';
      document.getElementById('fileIn').value = '';
      document.getElementById('userIn').value = '';
      document.getElementById('descIn').value = '';
    };

    saveAndRender();
  </script>
</body>
</html>
