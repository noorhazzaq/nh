<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>XPDC - C.T Cinta Kenangan Silam</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.container{max-width:800px;width:100%;background:#1a1a2e;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.8);text-align:center}
h1{font-size:1.5rem;margin-bottom:4px;color:#e94560}
.sub{font-size:.8rem;opacity:.6;margin-bottom:16px}
.video{position:relative;padding-bottom:56.25%;height:0;border-radius:16px;overflow:hidden;background:#000}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.info{margin-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.75rem;opacity:.7}
.info span{background:#0f0e17;padding:4px 12px;border-radius:20px}
.btn{padding:10px 24px;border:none;border-radius:50px;background:#e94560;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s;margin-top:12px}
.btn:hover{transform:scale(1.05);background:#ff6b81}
@media(max-width:480px){.container{padding:16px}h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="container">
<h1>🎵 XPDC</h1>
<div class="sub">C.T Cinta Kenangan Silam</div>
<div class="video"><iframe id="player" src="https://www.youtube.com/embed/AkkV062Q0NM?enablejsapi=1" title="XPDC - C.T Cinta Kenangan Silam" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
<div class="info"><span>🎵 1.5M+ views</span><span>📅 2022</span><span>🎸 Rock Kapak</span></div>
<button class="btn" onclick="playVideo()">▶ Play</button>
</div>
<script>
function playVideo(){var p=document.getElementById('player');p.src=p.src.replace('?enablejsapi=1','?enablejsapi=1&autoplay=1')}
console.log('🎵 XPDC ready');
</script>
</body>
</html>
