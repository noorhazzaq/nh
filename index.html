<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eclipse Of Fate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100vh;width:100vw;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 20% 50%,#1a1a2e,#0a0a0f);position:relative;overflow:hidden}
#gameCanvas{flex:1;width:100%;height:auto;display:block;touch-action:none;image-rendering:pixelated}
#ui-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px 16px 20px;background:linear-gradient(0deg,rgba(10,10,15,.95)60%,transparent);pointer-events:none;display:flex;flex-direction:column;gap:8px}
#log{background:rgba(0,0,0,.7);backdrop-filter:blur(4px);border:1px solid rgba(255,215,0,.15);border-radius:12px;padding:12px 14px;min-height:72px;max-height:120px;overflow-y:auto;font-size:14px;line-height:1.5;pointer-events:auto;scrollbar-width:thin;color:#cfd4e0}
#log::-webkit-scrollbar{width:3px}
#log::-webkit-scrollbar-track{background:transparent}
#log::-webkit-scrollbar-thumb{background:#f0c060;border-radius:12px}
#log p{margin:2px 0;word-break:break-word}
#log .highlight{color:#f5d742;font-weight:500}
#choices{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto;justify-content:center;padding-top:4px}
.choice-btn{background:rgba(30,30,50,.85);backdrop-filter:blur(2px);border:1px solid rgba(255,215,0,.25);border-radius:30px;padding:10px 18px;font-size:15px;font-weight:500;color:#ececec;flex:1 1 auto;min-width:100px;max-width:48%;text-align:center;transition:all .12s ease;touch-action:manipulation;cursor:pointer;letter-spacing:.2px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.choice-btn:active{transform:scale(.94);background:#f0c060;color:#0a0a0f;border-color:#f0c060}
.choice-btn.disabled{opacity:.3;pointer-events:none;filter:grayscale(.6)}
#save-indicator{position:absolute;top:10px;right:14px;font-size:11px;color:#6a7a8a;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:20px;border:1px solid #2a3a4a;pointer-events:none;opacity:.7}
@media(max-width:480px){#log{font-size:13px;min-height:64px;padding:10px 12px}#log p{margin:1px 0}.choice-btn{font-size:14px;padding:8px 14px;min-width:80px}}
@media(min-height:800px){#log{min-height:96px;max-height:160px}.choice-btn{padding:14px 24px;font-size:17px}}
@media(orientation:landscape)and(max-height:500px){#ui-overlay{padding:6px 12px 10px}#log{min-height:48px;max-height:68px;font-size:12px;padding:6px 10px}.choice-btn{padding:6px 12px;font-size:13px;min-width:70px}}
</style>
</head>
<body>
<div id="app">
<canvas id="gameCanvas"></canvas>
<div id="ui-overlay">
<div id="log"></div>
<div id="choices"></div>
</div>
<div id="save-indicator">⚡ auto-save</div>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
var logEl=document.getElementById('log');
var choicesEl=document.getElementById('choices');
var saveIndicator=document.getElementById('save-indicator');

var isAndroid=/(android)/i.test(navigator.userAgent);
if(!isAndroid){
document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#d4af37;font-size:1.4rem;text-align:center;padding:2rem;font-family:sans-serif">🔒 This application is optimized for Android devices only.</div>';
throw new Error('non-android blocked');
}

var DPR=Math.min(window.devicePixelRatio||1,2);
var W,H;
function resize(){
var rect=canvas.parentElement.getBoundingClientRect();
W=rect.width;
H=rect.height;
canvas.width=W*DPR;
canvas.height=H*DPR;
canvas.style.width=W+'px';
canvas.style.height=H+'px';
ctx.scale(DPR,DPR);
}
resize();
window.addEventListener('resize',resize);

var ROLES=[
{id:'warrior',name:'Warrior',desc:'Blade & fury',color:'#c0392b',stats:{str:18,dex:12,con:16,int:8,wis:10,cha:10}},
{id:'mage',name:'Mage',desc:'Arcane intellect',color:'#2980b9',stats:{str:8,dex:12,con:10,int:20,wis:14,cha:12}},
{id:'rogue',name:'Rogue',desc:'Shadow & precision',color:'#2c3e50',stats:{str:12,dex:20,con:12,int:14,wis:10,cha:10}},
{id:'paladin',name:'Paladin',desc:'Holy crusader',color:'#f39c12',stats:{str:16,dex:10,con:16,int:10,wis:16,cha:14}},
{id:'druid',name:'Druid',desc:'Nature\'s balance',color:'#27ae60',stats:{str:12,dex:12,con:14,int:12,wis:18,cha:10}},
{id:'bard',name:'Bard',desc:'Melody of fate',color:'#8e44ad',stats:{str:8,dex:14,con:10,int:14,wis:12,cha:20}},
{id:'monk',name:'Monk',desc:'Inner harmony',color:'#e67e22',stats:{str:14,dex:18,con:14,int:10,wis:16,cha:8}},
{id:'necromancer',name:'Necromancer',desc:'Death\'s whisper',color:'#2c3e50',stats:{str:6,dex:10,con:12,int:18,wis:14,cha:8}},
{id:'ranger',name:'Ranger',desc:'Wild stalker',color:'#16a085',stats:{str:12,dex:18,con:12,int:12,wis:16,cha:10}},
{id:'cleric',name:'Cleric',desc:'Divine light',color:'#d4ac0d',stats:{str:10,dex:10,con:14,int:12,wis:20,cha:14}},
{id:'warlock',name:'Warlock',desc:'Eldritch pact',color:'#7d3c98',stats:{str:8,dex:12,con:12,int:16,wis:10,cha:18}}
];

var STORYLINES=[
{id:'w1',role:'warrior',title:'Honor\'s Price',desc:'Your blade sworn to the fallen king.'},
{id:'w2',role:'warrior',title:'The Last Stand',desc:'Defend the gate at dawn.'},
{id:'m1',role:'mage',title:'Arcane Ascension',desc:'Seek the lost spire.'},
{id:'m2',role:'mage',title:'The Veil Tear',desc:'Reality bleeds.'},
{id:'r1',role:'rogue',title:'Thief of Hearts',desc:'The crown jewel.'},
{id:'r2',role:'rogue',title:'Shadow\'s Embrace',desc:'The guild calls.'},
{id:'p1',role:'paladin',title:'Light\'s Fury',desc:'Purge the corruption.'},
{id:'p2',role:'paladin',title:'Oath of Vigilance',desc:'The temple burns.'},
{id:'d1',role:'druid',title:'Root of the World',desc:'The great tree withers.'},
{id:'d2',role:'druid',title:'Wild Hunt',desc:'The beast awakens.'},
{id:'b1',role:'bard',title:'Song of Silence',desc:'The muse is lost.'},
{id:'b2',role:'bard',title:'Harmony\'s End',desc:'Discord reigns.'},
{id:'k1',role:'monk',title:'Path of Enlightenment',desc:'The master is dead.'},
{id:'k2',role:'monk',title:'The Iron Fist',desc:'The monastery falls.'},
{id:'n1',role:'necromancer',title:'Bone Empire',desc:'The dead rise.'},
{id:'n2',role:'necromancer',title:'Soul Cage',desc:'The lich speaks.'},
{id:'ra1',role:'ranger',title:'Warden\'s Vigil',desc:'The forest bleeds.'},
{id:'ra2',role:'ranger',title:'The Pale Stag',desc:'Hunt the ghost.'},
{id:'c1',role:'cleric',title:'Divine Intervention',desc:'The god is silent.'},
{id:'c2',role:'cleric',title:'Inquisition',desc:'Heresy spreads.'},
{id:'wl1',role:'warlock',title:'Eldritch Whispers',desc:'Your patron hungers.'},
{id:'wl2',role:'warlock',title:'The Black Tome',desc:'Forbidden knowledge.'}
];

var ENDINGS=[
{id:'e1',name:'Victory',desc:'You reshape the world.'},
{id:'e2',name:'Sacrifice',desc:'You give all for peace.'},
{id:'e3',name:'Betrayal',desc:'Trust broken, power lost.'},
{id:'e4',name:'Ascension',desc:'You become legend.'},
{id:'e5',name:'Corruption',desc:'Darkness consumes you.'},
{id:'e6',name:'Redemption',desc:'Saved by mercy.'},
{id:'e7',name:'Exile',desc:'Cast out, you wander.'},
{id:'e8',name:'Dominion',desc:'You rule with iron.'},
{id:'e9',name:'Enlightenment',desc:'Truth beyond death.'},
{id:'e10',name:'Annihilation',desc:'All ends in fire.'},
{id:'e11',name:'Rebirth',desc:'Cycle continues anew.'}
];

var PATHS=[
{id:'p1',name:'Path of Valor',desc:'Face danger head-on.'},
{id:'p2',name:'Path of Cunning',desc:'Outthink the enemy.'},
{id:'p3',name:'Path of Faith',desc:'Trust in the divine.'},
{id:'p4',name:'Path of Shadow',desc:'Embrace the unseen.'},
{id:'p5',name:'Path of Balance',desc:'Harmony in all things.'},
{id:'p6',name:'Path of Madness',desc:'Embrace the abyss.'},
{id:'p7',name:'Path of Order',desc:'Law above all.'},
{id:'p8',name:'Path of Chaos',desc:'Free the storm.'},
{id:'p9',name:'Path of Greed',desc:'Take everything.'},
{id:'p10',name:'Path of Mercy',desc:'Spare all.'},
{id:'p11',name:'Path of Glory',desc:'Become immortal.'}
];

var CONSEQUENCES=[
{id:'c1',name:'Strength',desc:'+2 Str, might opens doors.'},
{id:'c2',name:'Wisdom',desc:'+2 Wis, see truth.'},
{id:'c3',name:'Dexterity',desc:'+2 Dex, avoid blades.'},
{id:'c4',name:'Intellect',desc:'+2 Int, unlock secrets.'},
{id:'c5',name:'Charisma',desc:'+2 Cha, sway hearts.'},
{id:'c6',name:'Constitution',desc:'+2 Con, endure pain.'},
{id:'c7',name:'Fury',desc:'+3 Str, -2 Wis.'},
{id:'c8',name:'Shadow',desc:'+3 Dex, -2 Cha.'},
{id:'c9',name:'Devotion',desc:'+3 Wis, -2 Int.'},
{id:'c10',name:'Willpower',desc:'+2 all stats (once).'},
{id:'c11',name:'Doom',desc:'-2 all stats, unlock dark path.'}
];

var state={
role:null,
storyline:null,
path:null,
consequence:null,
ending:null,
flags:{},
stats:{str:10,dex:10,con:10,int:10,wis:10,cha:10},
step:0,
history:[],
gameover:false,
choiceLock:false
};

function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)]}

function clamp(v,min,max){return Math.min(Math.max(v,min),max)}

function saveGame(){
try{
var data=JSON.stringify(state);
localStorage.setItem('rpg_save',data);
if(window.firebaseRef){
firebaseRef.set({save:data}).then(function(){saveIndicator.style.opacity='1';setTimeout(function(){saveIndicator.style.opacity='.5';},800);}).catch(function(){});
}else{
saveIndicator.style.opacity='1';setTimeout(function(){saveIndicator.style.opacity='.5';},800);
}
}catch(e){}
}

function loadGame(){
try{
var raw=localStorage.getItem('rpg_save');
if(raw){
var parsed=JSON.parse(raw);
Object.assign(state,parsed);
return true;
}
}catch(e){}
return false;
}

function resetState(){
state.role=null;state.storyline=null;state.path=null;state.consequence=null;state.ending=null;
state.flags={};state.stats={str:10,dex:10,con:10,int:10,wis:10,cha:10};
state.step=0;state.history=[];state.gameover=false;state.choiceLock=false;
}

var storyGraph={};

function buildStoryGraph(){
storyGraph={};
var r=ROLES.map(function(rr){return rr.id});
r.forEach(function(rid){
var stories=STORYLINES.filter(function(s){return s.role===rid});
if(stories.length>0){
var s=stories[Math.floor(Math.random()*stories.length)];
storyGraph[rid]=s.id;
}
});
}

function generateScene(){
if(state.gameover){
showEndingScene();
return;
}
if(!state.role){
showRoleSelection();
return;
}
if(!state.storyline){
showStorylineSelection();
return;
}
if(!state.path){
showPathSelection();
return;
}
if(!state.consequence){
showConsequenceSelection();
return;
}
showNarrativeScene();
}

function showRoleSelection(){
var html='<p class="highlight">⚔️ Choose your destiny</p>';
var btns='';
ROLES.forEach(function(r){
btns+='<button class="choice-btn" data-action="role" data-id="'+r.id+'">'+r.name+'<br><small style="font-weight:300;font-size:11px;opacity:.7">'+r.desc+'</small></button>';
});
renderUI(html,btns);
}

function showStorylineSelection(){
var html='<p class="highlight">📜 '+getRoleName(state.role)+' — your story awaits</p>';
var stories=STORYLINES.filter(function(s){return s.role===state.role});
if(stories.length===0){
var fallback={id:'fallback',role:state.role,title:'Fate\'s Thread',desc:'The path is uncertain.'};
stories=[fallback];
}
var btns='';
stories.forEach(function(s){
btns+='<button class="choice-btn" data-action="storyline" data-id="'+s.id+'">'+s.title+'<br><small style="font-weight:300;font-size:11px;opacity:.7">'+s.desc+'</small></button>';
});
renderUI(html,btns);
}

function showPathSelection(){
var html='<p class="highlight">🛤️ Choose your path</p>';
var btns='';
PATHS.forEach(function(p){
btns+='<button class="choice-btn" data-action="path" data-id="'+p.id+'">'+p.name+'<br><small style="font-weight:300;font-size:11px;opacity:.7">'+p.desc+'</small></button>';
});
renderUI(html,btns);
}

function showConsequenceSelection(){
var html='<p class="highlight">⚡ A choice has consequences</p>';
var btns='';
CONSEQUENCES.forEach(function(c){
btns+='<button class="choice-btn" data-action="consequence" data-id="'+c.id+'">'+c.name+'<br><small style="font-weight:300;font-size:11px;opacity:.7">'+c.desc+'</small></button>';
});
renderUI(html,btns);
}

function showNarrativeScene(){
var step=state.step;
var roleName=getRoleName(state.role);
var pathName=getPathName(state.path);
var conName=getConsequenceName(state.consequence);
var storyTitle=getStoryTitle(state.storyline);
var msg='';
var btns='';
if(step===0){
msg='<p>⚔️ <span class="highlight">'+roleName+'</span>, you walk the <span class="highlight">'+pathName+'</span>. The tale begins...</p>';
msg+='<p style="opacity:.8;font-size:13px">'+storyTitle+' — the world holds its breath.</p>';
btns='<button class="choice-btn" data-action="narrative" data-step="1">Continue</button>';
}else if(step===1){
var conseq=CONSEQUENCES.find(function(c){return c.id===state.consequence});
var statBonus={};
if(conseq){
if(conseq.id==='c1'){statBonus.str=2;}
else if(conseq.id==='c2'){statBonus.wis=2;}
else if(conseq.id==='c3'){statBonus.dex=2;}
else if(conseq.id==='c4'){statBonus.int=2;}
else if(conseq.id==='c5'){statBonus.cha=2;}
else if(conseq.id==='c6'){statBonus.con=2;}
else if(conseq.id==='c7'){statBonus.str=3;statBonus.wis=-2;}
else if(conseq.id==='c8'){statBonus.dex=3;statBonus.cha=-2;}
else if(conseq.id==='c9'){statBonus.wis=3;statBonus.int=-2;}
else if(conseq.id==='c10'){statBonus.str=2;statBonus.dex=2;statBonus.con=2;statBonus.int=2;statBonus.wis=2;statBonus.cha=2;}
else if(conseq.id==='c11'){statBonus.str=-2;statBonus.dex=-2;statBonus.con=-2;statBonus.int=-2;statBonus.wis=-2;statBonus.cha=-2;}
}
Object.keys(statBonus).forEach(function(k){if(state.stats[k]!==undefined){state.stats[k]=clamp(state.stats[k]+statBonus[k],1,30);}});
msg='<p>🌀 The consequence of <span class="highlight">'+conName+'</span> shapes your soul.</p>';
var statStr='';
Object.keys(state.stats).forEach(function(k){statStr+=k.toUpperCase()+':'+state.stats[k]+' ';});
msg+='<p style="font-size:12px;opacity:.7">'+statStr+'</p>';
if(!state.flags.encounter1){
state.flags.encounter1=true;
msg+='<p style="color:#d4af37">✨ You feel a shift in fate.</p>';
}
btns='<button class="choice-btn" data-action="narrative" data-step="2">Face the trial</button>';
}else if(step===2){
var r=Math.random();
if(r<0.25){
state.ending=ENDINGS[0].id;
state.gameover=true;
}else if(r<0.5){
state.ending=ENDINGS[1].id;
state.gameover=true;
}else if(r<0.75){
state.ending=ENDINGS[2].id;
state.gameover=true;
}else{
state.ending=ENDINGS[3].id;
state.gameover=true;
}
msg='<p>🔥 The final moment arrives. Your fate is sealed.</p>';
btns='<button class="choice-btn" data-action="narrative" data-step="3">Witness the ending</button>';
}else if(step===3){
showEndingScene();
return;
}else{
msg='<p>🌀 The threads of fate intertwine...</p>';
btns='<button class="choice-btn" data-action="reset">Begin anew</button>';
}
renderUI(msg,btns);
}

function showEndingScene(){
var ending=ENDINGS.find(function(e){return e.id===state.ending});
var endingName=ending?ending.name:'Unknown';
var endingDesc=ending?ending.desc:'The cycle continues.';
var msg='<p class="highlight">🏆 '+endingName+'</p><p style="opacity:.8;font-size:14px">'+endingDesc+'</p>';
msg+='<p style="font-size:12px;opacity:.5;margin-top:6px">'+(state.history.length>0?'You have walked '+state.history.length+' steps.':'')+'</p>';
var btns='<button class="choice-btn" data-action="reset">🔄 Play again</button>';
renderUI(msg,btns);
state.gameover=true;
}

function renderUI(html,btns){
logEl.innerHTML=html;
choicesEl.innerHTML=btns;
choicesEl.querySelectorAll('.choice-btn').forEach(function(btn){
btn.addEventListener('click',function(e){
e.preventDefault();
if(state.choiceLock)return;
var action=btn.dataset.action;
var id=btn.dataset.id;
var step=btn.dataset.step;
if(action==='role'){selectRole(id);}
else if(action==='storyline'){selectStoryline(id);}
else if(action==='path'){selectPath(id);}
else if(action==='consequence'){selectConsequence(id);}
else if(action==='narrative'){if(step){state.step=parseInt(step,10);}else{state.step+=1;}saveGame();generateScene();}
else if(action==='reset'){resetState();saveGame();generateScene();}
});
});
if(choicesEl.children.length===0){
var fallbackBtn=document.createElement('button');
fallbackBtn.className='choice-btn';
fallbackBtn.textContent='Continue';
fallbackBtn.dataset.action='narrative';
fallbackBtn.dataset.step='1';
choicesEl.appendChild(fallbackBtn);
fallbackBtn.addEventListener('click',function(){state.step+=1;saveGame();generateScene();});
}
}

function selectRole(id){
var role=ROLES.find(function(r){return r.id===id});
if(!role)return;
state.role=id;
state.stats=JSON.parse(JSON.stringify(role.stats));
state.step=0;
state.history.push('role:'+id);
state.flags={};
if(!state.storyline){
var stories=STORYLINES.filter(function(s){return s.role===id});
if(stories.length>0){
state.storyline=stories[0].id;
}
}
saveGame();
generateScene();
}

function selectStoryline(id){
state.storyline=id;
state.step=0;
state.history.push('storyline:'+id);
saveGame();
generateScene();
}

function selectPath(id){
state.path=id;
state.step=0;
state.history.push('path:'+id);
saveGame();
generateScene();
}

function selectConsequence(id){
state.consequence=id;
state.step=0;
state.history.push('consequence:'+id);
saveGame();
generateScene();
}

function getRoleName(id){var r=ROLES.find(function(x){return x.id===id});return r?r.name:'Unknown'}
function getPathName(id){var p=PATHS.find(function(x){return x.id===id});return p?p.name:'Unknown'}
function getConsequenceName(id){var c=CONSEQUENCES.find(function(x){return x.id===id});return c?c.name:'Unknown'}
function getStoryTitle(id){var s=STORYLINES.find(function(x){return x.id===id});return s?s.title:'Unknown Tale'}

function drawBackground(){
var grd=ctx.createRadialGradient(W*0.3,H*0.2,50,W*0.6,H*0.5,W*0.8);
grd.addColorStop(0,'#1a1a30');
grd.addColorStop(0.5,'#10101f');
grd.addColorStop(1,'#050508');
ctx.fillStyle=grd;
ctx.fillRect(0,0,W,H);
ctx.globalAlpha=0.6;
for(var i=0;i<40;i++){
var x=(i*37%W),y=(i*53%H),s=1+(i%4);
ctx.fillStyle=i%2===0?'#d4af37':'#2a3a5a';
ctx.globalAlpha=0.04+0.02*(i%5);
ctx.beginPath();
ctx.arc(x,y,s,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
if(state.role){
var r=ROLES.find(function(x){return x.id===state.role});
if(r){
ctx.fillStyle=r.color;
ctx.globalAlpha=0.08;
ctx.font='bold 120px sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('✦',W*0.5,H*0.3);
ctx.globalAlpha=1;
}
}
}

function animateCanvas(){
ctx.clearRect(0,0,W,H);
drawBackground();
ctx.fillStyle='rgba(255,255,255,0.02)';
ctx.fillRect(0,0,W,H);
requestAnimationFrame(animateCanvas);
}
animateCanvas();

function loadFirebase(){
return new Promise(function(resolve){
if(typeof firebase!=='undefined'&&firebase.database){
try{
var config={databaseURL:'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'};
if(!firebase.apps.length){firebase.initializeApp(config);}
window.firebaseRef=firebase.database().ref('rpg_save');
window.firebaseRef.on('value',function(snap){
try{
var val=snap.val();
if(val&&val.save){
var parsed=JSON.parse(val.save);
if(parsed&&parsed.role){
Object.assign(state,parsed);
generateScene();
}
}
}catch(e){}
});
resolve(true);
}catch(e){resolve(false);}
}else{resolve(false);}
});
}

function init(){
var loaded=loadGame();
if(loaded&&state.role){
generateScene();
}else{
resetState();
generateScene();
}
loadFirebase().then(function(){
saveGame();
setInterval(function(){saveGame();},30000);
});
}

init();

window.addEventListener('resize',function(){resize();});
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

document.addEventListener('DOMContentLoaded',function(){
setTimeout(resize,50);
});

})();
</script>
</body>
</html>
