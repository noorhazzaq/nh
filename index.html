<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Terminal RPG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100vh;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;overflow:hidden}body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,0,0.03) 0px,rgba(0,255,0,0.03) 2px,transparent 2px,transparent 4px);pointer-events:none}#game{width:100%;max-width:800px;height:100vh;max-height:900px;padding:16px;display:flex;flex-direction:column;background:#0d0d0d;border:1px solid #1a3a1a;box-shadow:0 0 30px rgba(0,255,0,0.1)}#output{flex:1;overflow-y:auto;padding:12px 8px;background:#050505;border:1px solid #1f3f1f;border-radius:4px;margin-bottom:12px;color:#33ff33;font-size:clamp(14px,2.5vw,20px);line-height:1.6;white-space:pre-wrap;word-break:break-word;scroll-behavior:smooth;min-height:200px}#output::-webkit-scrollbar{width:6px}#output::-webkit-scrollbar-track{background:#0a0a0a}#output::-webkit-scrollbar-thumb{background:#1f4f1f;border-radius:3px}#choices{display:flex;flex-direction:column;gap:8px;padding:4px 0;max-height:45vh;overflow-y:auto}#choices::-webkit-scrollbar{width:5px}#choices::-webkit-scrollbar-track{background:#0a0a0a}#choices::-webkit-scrollbar-thumb{background:#1f4f1f;border-radius:3px}.choice-btn{background:#0f1f0f;border:1px solid #1a4a1a;color:#55ff55;padding:clamp(10px,2vh,16px) clamp(12px,2.5vw,18px);font-family:'Courier New',monospace;font-size:clamp(13px,2vw,17px);text-align:left;border-radius:4px;cursor:pointer;transition:all 0.15s;word-break:break-word;letter-spacing:0.3px;width:100%}.choice-btn:active{background:#1a3a1a;border-color:#33ff33;transform:scale(0.99);box-shadow:0 0 12px rgba(0,255,0,0.2)}.choice-btn:disabled{opacity:0.3;filter:grayscale(0.8);pointer-events:none}.status-bar{display:flex;justify-content:space-between;padding:8px 12px;background:#060e06;border:1px solid #1a3a1a;border-radius:4px;margin-bottom:10px;color:#33cc33;font-size:clamp(12px,2vw,16px);flex-wrap:wrap;gap:4px 12px}.status-bar span{white-space:nowrap}#input-area{display:flex;gap:8px;margin-top:6px}#cmd-input{flex:1;background:#0a0a0a;border:1px solid #1f4f1f;color:#33ff33;padding:10px 14px;font-family:'Courier New',monospace;font-size:clamp(13px,2vw,17px);border-radius:4px;outline:none;min-width:0}#cmd-input:focus{border-color:#33ff33;box-shadow:0 0 8px rgba(0,255,0,0.15)}#cmd-btn{background:#0f1f0f;border:1px solid #1a4a1a;color:#55ff55;padding:10px 18px;font-family:'Courier New',monospace;font-size:clamp(13px,2vw,17px);border-radius:4px;cursor:pointer;transition:0.12s;white-space:nowrap}#cmd-btn:active{background:#1a3a1a;border-color:#33ff33;transform:scale(0.96)}.hidden{display:none!important}@media(max-width:480px){#game{padding:10px;max-height:100vh;border:none;border-radius:0}#output{padding:10px 6px;font-size:clamp(13px,2.2vw,16px)}.choice-btn{padding:8px 12px;font-size:clamp(12px,1.8vw,15px)}.status-bar{font-size:clamp(11px,1.6vw,14px);padding:6px 10px}#cmd-input,#cmd-btn{font-size:clamp(12px,1.8vw,15px);padding:8px 12px}}
</style>
</head>
<body>
<div id="game">
<div class="status-bar">
<span id="hp">❤️ 100</span>
<span id="location">📍 Terminal</span>
<span id="turn">⏳ 0</span>
</div>
<div id="output"></div>
<div id="choices"></div>
<div id="input-area">
<input type="text" id="cmd-input" placeholder="> type command..." autocomplete="off">
<button id="cmd-btn">⏎</button>
</div>
</div>
<script>
(function(){
const STATE={hp:100,maxHp:100,turn:0,location:'Terminal',flags:{},path:[],inCombat:false,enemyHp:0,enemyMax:0,enemyName:''};
const output=document.getElementById('output');
const choicesDiv=document.getElementById('choices');
const hpSpan=document.getElementById('hp');
const locSpan=document.getElementById('location');
const turnSpan=document.getElementById('turn');
const cmdInput=document.getElementById('cmd-input');
const cmdBtn=document.getElementById('cmd-btn');
let blocked=false;

function updateUI(){
hpSpan.textContent='❤️ '+STATE.hp+'/'+STATE.maxHp;
locSpan.textContent='📍 '+STATE.location;
turnSpan.textContent='⏳ '+STATE.turn;
}

function typeText(text,callback){
output.textContent+=text+'\n';
output.scrollTop=output.scrollHeight;
if(callback)setTimeout(callback,80);
}

function clearChoices(){choicesDiv.innerHTML='';}

function addChoice(label,action,disabled){
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent=label;
if(disabled)btn.disabled=true;
btn.addEventListener('click',function(e){
e.preventDefault();
if(blocked||this.disabled)return;
blocked=true;
clearChoices();
const old=output.textContent;
output.textContent=old+'> '+label+'\n';
action();
});
choicesDiv.appendChild(btn);
}

function endTurn(){
STATE.turn++;
updateUI();
blocked=false;
}

function damage(amount){
STATE.hp=Math.max(0,STATE.hp-amount);
updateUI();
if(STATE.hp<=0){gameOver('You have been defeated...');return true;}
return false;
}

function heal(amount){STATE.hp=Math.min(STATE.maxHp,STATE.hp+amount);updateUI();}

function gameOver(msg){
blocked=true;
clearChoices();
output.textContent+=msg+'\n\n--- GAME OVER ---\n';
addChoice('↺ Restart',function(){location.reload();});
}

function goTo(location,text,callback){
STATE.location=location;
output.textContent+=text+'\n';
updateUI();
if(callback)setTimeout(callback,120);
}

function combatRound(playerAction){
if(!STATE.inCombat)return;
let msg='';
const enemy=STATE.enemyName;
const eHp=STATE.enemyHp;
if(playerAction==='attack'){
const dmg=Math.floor(Math.random()*18)+8;
STATE.enemyHp=Math.max(0,STATE.enemyHp-dmg);
msg='⚔️ You strike '+enemy+' for '+dmg+' damage.';
if(STATE.enemyHp<=0){
msg+='\n💀 '+enemy+' is destroyed!';
STATE.inCombat=false;
output.textContent+=msg+'\n';
endTurn();
resolveCombatWin();
return;
}
}else if(playerAction==='defend'){
const block=Math.floor(Math.random()*12)+5;
msg='🛡️ You brace for impact.';
const eDmg=Math.max(0,Math.floor(Math.random()*14)+4-block);
if(eDmg>0){msg+='\n💢 '+enemy+' hits for '+eDmg+' damage.';damage(eDmg);}
else msg+='\n✅ You block the attack completely.';
output.textContent+=msg+'\n';
if(STATE.hp<=0){endTurn();return;}
endTurn();
startEnemyTurn();
return;
}else if(playerAction==='flee'){
if(Math.random()<0.45){msg='🏃 You escape from '+enemy+'!';STATE.inCombat=false;output.textContent+=msg+'\n';endTurn();resolveFlee();return;}
else{msg='🚫 Cannot escape!';output.textContent+=msg+'\n';}
}
if(STATE.inCombat){
const eDmg=Math.floor(Math.random()*12)+5;
msg+='\n💢 '+enemy+' attacks for '+eDmg+' damage.';
damage(eDmg);
output.textContent+=msg+'\n';
if(STATE.hp<=0){endTurn();return;}
endTurn();
startEnemyTurn();
}
}

function startEnemyTurn(){
if(!STATE.inCombat||STATE.hp<=0)return;
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
}

function resolveCombatWin(){
STATE.flags.enemyDefeated=true;
clearChoices();
output.textContent+='🏆 You gained experience.\n';
addChoice('Continue',function(){enterZone('clearing');});
}

function resolveFlee(){
clearChoices();
addChoice('Catch breath',function(){enterZone('clearing');});
}

function enterZone(zone){
if(zone==='clearing'){
goTo('Clearing','🌿 You stand in a moonlit forest clearing. A path splits three ways.');
updateUI();
clearChoices();
addChoice('🔦 Follow the northern trail',function(){enterZone('north');});
addChoice('🌲 Enter the eastern woods',function(){enterZone('east');});
addChoice('🪨 Climb the western ridge',function(){enterZone('west');});
if(STATE.flags.enemyDefeated&&!STATE.flags.talkedToWanderer){
addChoice('💬 Speak with the wanderer',function(){talkWanderer();});
}
endTurn();
}else if(zone==='north'){
goTo('North Trail','❄️ The trail leads to a frozen lake. A figure stands in the distance.');
updateUI();
clearChoices();
addChoice('Approach the figure',function(){northEncounter();});
addChoice('Turn back',function(){enterZone('clearing');});
endTurn();
}else if(zone==='east'){
goTo('Eastern Woods','🌳 Dense trees. You hear growling.');
updateUI();
if(!STATE.flags.eastCleared){
clearChoices();
addChoice('⚔️ Fight the beast',function(){eastCombat();});
addChoice('Sneak past',function(){eastSneak();});
}else{
clearChoices();
addChoice('Search the area',function(){eastSearch();});
addChoice('Return to clearing',function(){enterZone('clearing');});
}
endTurn();
}else if(zone==='west'){
goTo('Western Ridge','⛰️ A narrow path along the cliff. A cave entrance glows.');
updateUI();
clearChoices();
addChoice('Enter the cave',function(){westCave();});
addChoice('Examine the cliff',function(){westCliff();});
addChoice('Go back',function(){enterZone('clearing');});
endTurn();
}
}

function northEncounter(){
goTo('Frozen Lake','🧊 The figure is a guardian spirit.');
updateUI();
if(!STATE.flags.northSpirit){
clearChoices();
addChoice('❄️ Offer a tribute',function(){spiritTribute();});
addChoice('⚔️ Challenge the spirit',function(){spiritCombat();});
addChoice('Retreat',function(){enterZone('clearing');});
}else{
clearChoices();
addChoice('🗡️ Receive blessing',function(){spiritBlessing();});
addChoice('Return',function(){enterZone('clearing');});
}
endTurn();
}

function spiritTribute(){
if(STATE.flags.tributeGiven){output.textContent+='You already gave tribute.\n';return;}
STATE.flags.tributeGiven=true;
heal(20);
output.textContent+='🌟 Spirit accepts your offering. You feel restored.\n';
STATE.flags.northSpirit=true;
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('clearing');});
}

function spiritCombat(){
output.textContent+='⚡ You attack the spirit! It defends with ice.\n';
STATE.inCombat=true;STATE.enemyName='Ice Spirit';STATE.enemyHp=35;STATE.enemyMax=35;
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
}

function spiritBlessing(){
output.textContent+='✨ Spirit grants you +15 max HP.\n';
STATE.maxHp+=15;STATE.hp=Math.min(STATE.hp+15,STATE.maxHp);updateUI();
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('clearing');});
}

function eastCombat(){
output.textContent+='🐺 A dire wolf charges!\n';
STATE.inCombat=true;STATE.enemyName='Dire Wolf';STATE.enemyHp=40;STATE.enemyMax=40;
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
}

function eastSneak(){
if(Math.random()<0.55){
output.textContent+='🕵️ You slip past the wolf unnoticed.\n';
STATE.flags.eastCleared=true;
endTurn();
clearChoices();
addChoice('Explore deeper',function(){eastSearch();});
addChoice('Go back',function(){enterZone('clearing');});
}else{
output.textContent+='🐺 The wolf catches you!\n';
damage(15);
if(STATE.hp>0){
endTurn();
clearChoices();
addChoice('⚔️ Fight',function(){eastCombat();});
addChoice('Flee again',function(){eastSneak();});
}
}
}

function eastSearch(){
if(STATE.flags.eastTreasure){output.textContent+='You already found the treasure.\n';clearChoices();addChoice('Return',function(){enterZone('clearing');});return;}
STATE.flags.eastTreasure=true;
output.textContent+='💎 You find a hidden gem! +10 gold (but gold is glory).\n';
heal(10);
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('clearing');});
}

function westCave(){
goTo('Cave','🕯️ Inside the cave, you see a sleeping dragon.');
updateUI();
if(!STATE.flags.caveCleared){
clearChoices();
addChoice('🐉 Sneak past the dragon',function(){caveSneak();});
addChoice('⚔️ Wake and fight',function(){caveFight();});
addChoice('Retreat',function(){enterZone('clearing');});
}else{
clearChoices();
addChoice('Collect dragon scale',function(){caveScale();});
addChoice('Leave',function(){enterZone('clearing');});
}
endTurn();
}

function caveSneak(){
if(Math.random()<0.5){
output.textContent+='🤫 You sneak past and find a treasure hoard.\n';
STATE.flags.caveCleared=true;STATE.flags.caveTreasure=true;
heal(25);
endTurn();
clearChoices();
addChoice('Grab treasure',function(){caveTreasure();});
addChoice('Leave quietly',function(){enterZone('clearing');});
}else{
output.textContent+='🐉 Dragon wakes! It attacks!\n';
damage(20);
if(STATE.hp>0){
STATE.inCombat=true;STATE.enemyName='Dragon';STATE.enemyHp=60;STATE.enemyMax=60;
clearChoices();
addChoice('⚔️ Fight',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
}
}
}

function caveFight(){
output.textContent+='🐉 You engage the dragon!\n';
STATE.inCombat=true;STATE.enemyName='Dragon';STATE.enemyHp=60;STATE.enemyMax=60;
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
}

function caveTreasure(){
if(STATE.flags.caveTreasure){
output.textContent+='🏅 You claim ancient relics. Power surges through you.\n';
STATE.maxHp+=20;STATE.hp=Math.min(STATE.hp+20,STATE.maxHp);
updateUI();
STATE.flags.caveTreasure=false;
}
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('clearing');});
}

function caveScale(){
output.textContent+='🐉 You take a glowing scale. +5 HP.\n';
heal(5);
endTurn();
clearChoices();
addChoice('Leave',function(){enterZone('clearing');});
}

function westCliff(){
goTo('Cliff Edge','🌄 A breathtaking view. You see a distant tower.');
updateUI();
clearChoices();
addChoice('🔭 Study the tower',function(){cliffTower();});
addChoice('Return',function(){enterZone('clearing');});
endTurn();
}

function cliffTower(){
output.textContent+='🏰 The tower seems to be the source of the anomaly.\n';
if(!STATE.flags.towerSeen){STATE.flags.towerSeen=true;heal(10);}
endTurn();
clearChoices();
addChoice('Head toward tower',function(){towerApproach();});
addChoice('Go back',function(){enterZone('clearing');});
}

function towerApproach(){
goTo('Tower','🔮 You arrive at the obsidian tower. The door opens.');
updateUI();
clearChoices();
addChoice('Enter the tower',function(){towerInside();});
addChoice('Examine runes',function(){towerRunes();});
addChoice('Retreat',function(){enterZone('clearing');});
endTurn();
}

function towerInside(){
goTo('Tower Interior','⚡ A floating crystal pulses with energy.');
updateUI();
if(!STATE.flags.towerCleared){
clearChoices();
addChoice('💥 Touch the crystal',function(){towerCrystal();});
addChoice('🔮 Channel energy',function(){towerChannel();});
addChoice('Flee',function(){enterZone('clearing');});
}else{
clearChoices();
addChoice('Take fragment',function(){towerFragment();});
addChoice('Leave',function(){enterZone('clearing');});
}
endTurn();
}

function towerCrystal(){
output.textContent+='💫 The crystal explodes with light! You are empowered.\n';
STATE.maxHp+=30;STATE.hp=Math.min(STATE.hp+30,STATE.maxHp);
STATE.flags.towerCleared=true;
updateUI();
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('clearing');});
}

function towerChannel(){
if(STATE.flags.channeled){output.textContent+='You already channeled.\n';return;}
STATE.flags.channeled=true;
damage(10);
if(STATE.hp<=0)return;
output.textContent+='🌀 You harness the energy. +20 max HP.\n';
STATE.maxHp+=20;STATE.hp=Math.min(STATE.hp+20,STATE.maxHp);
updateUI();
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('clearing');});
}

function towerFragment(){
output.textContent+='💎 You collect a crystal shard. +5 HP.\n';
heal(5);
endTurn();
clearChoices();
addChoice('Leave',function(){enterZone('clearing');});
}

function towerRunes(){
output.textContent+='📜 Runes tell of a champion who must unite the shards.\n';
if(!STATE.flags.runesRead){STATE.flags.runesRead=true;heal(5);}
endTurn();
clearChoices();
addChoice('Enter tower',function(){towerInside();});
addChoice('Return',function(){enterZone('clearing');});
}

function talkWanderer(){
if(STATE.flags.talkedToWanderer)return;
STATE.flags.talkedToWanderer=true;
output.textContent+='🧙 Wanderer: "You seek the shards. The tower holds the key."\n';
heal(15);
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('clearing');});
}

function initGame(){
output.textContent='=== TERMINAL RPG ===\nA dark fantasy unfolds...\n\n';
updateUI();
clearChoices();
addChoice('▶️ Start adventure',function(){
output.textContent+='You wake in a misty forest. A wanderer approaches.\n';
enterZone('clearing');
});
}
initGame();

cmdBtn.addEventListener('click',function(){
const val=cmdInput.value.trim();
if(!val||blocked)return;
cmdInput.value='';
output.textContent+='> '+val+'\n';
if(val.toLowerCase()==='help'){
output.textContent+='Commands: help, status, clear\n';
}else if(val.toLowerCase()==='status'){
output.textContent+='HP: '+STATE.hp+'/'+STATE.maxHp+' | Turn: '+STATE.turn+' | Location: '+STATE.location+'\n';
}else if(val.toLowerCase()==='clear'){
output.textContent='';
}else{
output.textContent+='Unknown command. Try help.\n';
}
output.scrollTop=output.scrollHeight;
});
cmdInput.addEventListener('keydown',function(e){if(e.key==='Enter')cmdBtn.click();});
})();
</script>
</body>
</html>
