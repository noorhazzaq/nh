<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON CHAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated}
html,body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;height:100%;width:100%;position:fixed;top:0;left:0}
#app{width:100%;height:100%;max-width:480px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0d0d1a 0%,#1a0a2e 50%,#0d0d1a 100%);border:2px solid #ff00ff;box-shadow:0 0 40px #ff00ff88,inset 0 0 40px #ff00ff44;position:relative;overflow:hidden}
#scanline{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,0,0,0)0px,rgba(0,0,0,0)3px,rgba(0,0,0,0.15)3px,rgba(0,0,0,0.15)4px);pointer-events:none;z-index:10}
#header{background:rgba(0,0,0,0.85);padding:8px 14px;border-bottom:2px solid #00ffff;text-align:center;position:relative;z-index:5;flex-shrink:0}
#header h1{color:#00ffff;font-size:18px;letter-spacing:5px;text-shadow:0 0 20px #00ffff,0 0 40px #00ffff88;font-weight:700}
#header h1 span{color:#ff00ff;text-shadow:0 0 20px #ff00ff,0 0 40px #ff00ff88}
#status-bar{display:flex;justify-content:space-between;align-items:center;margin-top:3px;padding:0 2px}
#status{color:#ffaa00;font-size:9px;letter-spacing:2px;text-shadow:0 0 10px #ffaa00}
#user-badge{color:#00ffff;font-size:9px;background:rgba(0,255,255,0.1);padding:1px 10px;border:1px solid #00ffff44;letter-spacing:1px;text-shadow:0 0 10px #00ffff44}
#messages{flex:1;overflow-y:auto;padding:8px 12px;background:rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;z-index:5;position:relative;min-height:0}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-track{background:rgba(0,0,0,0.3)}
#messages::-webkit-scrollbar-thumb{background:#ff00ff;box-shadow:0 0 10px #ff00ff}
.msg{background:rgba(0,0,0,0.7);padding:5px 10px;border-left:3px solid #00ffff;word-wrap:break-word;animation:glitchIn .25s ease-out;border-radius:0 3px 3px 0;margin-bottom:1px}
.msg .user{color:#ff00ff;font-weight:700;font-size:11px;text-shadow:0 0 10px #ff00ff88;letter-spacing:1px}
.msg .time{color:#00ffff66;font-size:7px;float:right;margin-left:6px;letter-spacing:0.5px}
.msg .text{color:#e0e0ff;font-size:13px;margin-top:1px;text-shadow:0 0 5px #8888ff33;line-height:1.3;font-weight:400;word-break:break-word}
.msg.system{background:rgba(255,170,0,0.08);border-left-color:#ffaa00}
.msg.system .text{color:#ffaa00;text-shadow:0 0 10px #ffaa0044}
.msg.self{background:rgba(255,0,255,0.08);border-left-color:#ff00ff}
.msg.self .user{color:#00ffff;text-shadow:0 0 10px #00ffff88}
#input-area{background:rgba(0,0,0,0.95);padding:6px 10px;border-top:2px solid #ff00ff;display:flex;gap:6px;flex-shrink:0;z-index:5;position:relative;align-items:center;min-height:50px}
#input-area input{flex:1;background:rgba(0,0,0,0.8);border:2px solid #00ffff;padding:8px 12px;color:#e0e0ff;font-family:'Courier New',monospace;font-size:13px;outline:none;border-radius:0;transition:all .2s;min-width:0;height:38px}
#input-area input:focus{border-color:#ff00ff;box-shadow:0 0 20px #ff00ff66,inset 0 0 20px #ff00ff22}
#input-area input::placeholder{color:#555588;letter-spacing:1px;font-size:11px}
#input-area button{background:#ff00ff;color:#000;border:none;padding:8px 16px;font-family:'Courier New',monospace;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:2px;transition:all .15s;text-shadow:0 0 10px #fff;box-shadow:0 0 20px #ff00ff66;border-radius:0;white-space:nowrap;flex-shrink:0;height:38px}
#input-area button:active{transform:scale(0.92);box-shadow:0 0 40px #ff00ff}
#input-area button:disabled{opacity:0.4;transform:scale(0.96);cursor:not-allowed}
#char-counter{color:#555588;font-size:8px;letter-spacing:1px;padding:0 3px;min-width:25px;text-align:center;flex-shrink:0}
#blocker{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#ff00ff;font-family:'Courier New',monospace;font-size:20px;justify-content:center;align-items:center;z-index:9999;text-align:center;padding:30px;border:4px solid #ff00ff;box-shadow:inset 0 0 100px #ff00ff22}
#blocker span{text-shadow:0 0 40px #ff00ff;letter-spacing:4px}
@keyframes glitchIn{0%{opacity:0;transform:translateX(-6px);clip-path:inset(0 0 95% 0)}100%{opacity:1;transform:translateX(0);clip-path:inset(0 0 0 0)}}
@media(max-width:480px){#app{max-width:100%;border-width:1px;border-radius:0}
#header h1{font-size:16px;letter-spacing:3px}
.msg .text{font-size:12px}
#input-area input{font-size:12px;padding:6px 10px;height:34px}
#input-area button{padding:6px 12px;font-size:11px;height:34px}
#input-area{padding:5px 8px;min-height:44px}}
</style>
</head>
<body>
<div id="blocker"><span>⚠️ ANDROID ONLY<br><br>ACCESS DENIED</span></div>
<div id="app">
<div id="scanline"></div>
<div id="header">
<h1>◈ <span>NEON</span>CHAT ◈</h1>
<div id="status-bar">
<div id="status">● CONNECTED</div>
<div id="user-badge">🖥️ PIXEL</div>
</div>
</div>
<div id="messages"></div>
<div id="input-area">
<input type="text" id="msgInput" placeholder="✧ TYPE YOUR MESSAGE ✧" maxlength="500" autocomplete="off">
<span id="char-counter">0</span>
<button id="sendBtn">►</button>
</div>
</div>
<script>
(function(){
const isAndroid=/android/i.test(navigator.userAgent);
if(!isAndroid){
document.getElementById('blocker').style.display='flex';
document.getElementById('app').style.display='none';
return;
}
const DB_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
const MSG_PATH='messages/';
const MAX_MSG=150;
const input=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');
const messagesDiv=document.getElementById('messages');
const charCounter=document.getElementById('char-counter');
const userBadge=document.getElementById('user-badge');
let username='PIXEL_'+Math.random().toString(36).substring(2,6).toUpperCase();
userBadge.textContent='🖥️ '+username;
let isSending=false;
function getTimestamp(){return new Date().toISOString().replace('T',' ').substring(0,19)}
function generateId(){return Date.now().toString(36)+'_'+Math.random().toString(36).substring(2,6)}
function sanitize(text){const d=document.createElement('div');d.textContent=text;return d.innerHTML}
function buildMsgObj(user,text){return{id:generateId(),user:user,text:text,time:getTimestamp()}}
function renderMsg(msg,isSystem=false,isSelf=false){
const div=document.createElement('div');
div.className='msg'+(isSystem?' system':'')+(isSelf?' self':'');
const userSpan=document.createElement('span');
userSpan.className='user';
userSpan.textContent=isSystem?'⚡ SYS':sanitize(msg.user||'ANON');
const timeSpan=document.createElement('span');
timeSpan.className='time';
timeSpan.textContent=msg.time||getTimestamp();
const textSpan=document.createElement('span');
textSpan.className='text';
textSpan.textContent=sanitize(isSystem?msg.text:msg.text);
div.appendChild(userSpan);
div.appendChild(timeSpan);
div.appendChild(textSpan);
return div;
}
function addSystemMsg(text){
const msg={user:'SYSTEM',text:text,time:getTimestamp()};
const el=renderMsg(msg,true,false);
messagesDiv.appendChild(el);
scrollToBottom();
}
async function loadMessages(){
try{
const resp=await fetch(DB_URL+MSG_PATH+'.json');
if(!resp.ok)throw new Error('Fetch failed');
const data=await resp.json();
if(!data){
messagesDiv.innerHTML='';
addSystemMsg('📡 AWAITING FIRST TRANSMISSION');
return;
}
const msgs=Object.values(data).filter(m=>m&&m.text&&m.user);
msgs.sort((a,b)=>a.time.localeCompare(b.time)||a.id.localeCompare(b.id));
messagesDiv.innerHTML='';
if(msgs.length===0){
addSystemMsg('📡 AWAITING FIRST TRANSMISSION');
return;
}
const recent=msgs.slice(-MAX_MSG);
recent.forEach(m=>{
const isSelf=m.user===username;
const el=renderMsg(m,false,isSelf);
messagesDiv.appendChild(el);
});
scrollToBottom();
}catch(e){
console.error('Load error:',e);
if(messagesDiv.children.length===0){
addSystemMsg('⚠️ DATABASE OFFLINE - RETRYING...');
}
}
}
function scrollToBottom(){
setTimeout(()=>{
messagesDiv.scrollTop=messagesDiv.scrollHeight;
},30);
}
async function sendMessage(){
if(isSending)return;
const raw=input.value.trim();
if(!raw||raw.length<1)return;
if(raw.length>500){
addSystemMsg('⚠️ MESSAGE TOO LONG (MAX 500)');
return;
}
isSending=true;
sendBtn.disabled=true;
const msgObj=buildMsgObj(username,raw);
try{
const path=DB_URL+MSG_PATH+msgObj.id+'.json';
const resp=await fetch(path,{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(msgObj)
});
if(!resp.ok)throw new Error('Send failed');
input.value='';
updateCharCounter();
input.focus();
await loadMessages();
}catch(e){
console.error('Send error:',e);
addSystemMsg('❌ TRANSMISSION FAILED - RETRY');
}finally{
isSending=false;
sendBtn.disabled=false;
}
}
function updateCharCounter(){
const count=input.value.length;
charCounter.textContent=count;
if(count>450){
charCounter.style.color='#ff6600';
}else if(count>400){
charCounter.style.color='#ffaa00';
}else{
charCounter.style.color='#555588';
}
}
function setupRealtime(){
let eventSource=null;
function connect(){
if(eventSource){eventSource.close();}
try{
eventSource=new EventSource(DB_URL+MSG_PATH+'.json');
eventSource.onmessage=function(e){
if(e.data){
try{
const data=JSON.parse(e.data);
if(data&&data.text&&data.user){
loadMessages();
}
}catch(err){}
}
};
eventSource.onerror=function(){
if(eventSource)eventSource.close();
setTimeout(connect,2000);
};
}catch(e){
setTimeout(connect,2000);
}
}
connect();
}
input.addEventListener('keydown',function(e){
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});
input.addEventListener('input',updateCharCounter);
sendBtn.addEventListener('click',sendMessage);
document.addEventListener('visibilitychange',function(){
if(!document.hidden){loadMessages();}
});
loadMessages();
setupRealtime();
addSystemMsg('🔌 CONNECTION ESTABLISHED');
addSystemMsg('💀 PIXEL NEON 4K ACTIVE');
addSystemMsg('👋 WELCOME, '+username);
setInterval(()=>{
const status=document.getElementById('status');
status.textContent='● LIVE '+new Date().toLocaleTimeString();
status.style.color='#00ff88';
setTimeout(()=>{status.style.color='#ffaa00';},200);
},5000);
})();
</script>
</body>
</html>
