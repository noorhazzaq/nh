            --cyan: #00f0ff;
            --gold: #ffd700;
            --purple: #8a2be2;
            --pink: #ff00ff;
            --bg: #000000;
            --white: #ffffff;
            --muted: #999999;
            --success: #00ff88;

            --r-md: 16px;
            --r-full: 30px;

            --safe-bottom: env(safe-area-inset-bottom, 0px);

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .aurora {
            position: fixed; inset: 0;

                radial-gradient(circle at 80% 70%, rgba(0,240,255,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(138,43,226,0.08) 0%, transparent 60%),
                radial-gradient(circle at 60% 20%, rgba(255,215,0,0.06) 0%, transparent 40%);
            z-index: 0;
            animation: auroraFloat 10s ease-in-out infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10px, 10px) scale(1.05); }
        }

        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; width: 2px; height: 2px;
            border-radius: 50%; background: var(--white);
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px var(--white); } }

        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .particle {
            position: absolute; width: 3px; height: 3px;
            border-radius: 50%; animation: floatUp linear infinite;
        }
        .p-red { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .p-cyan { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .p-gold { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .p-purple { background: var(--purple); box-shadow: 0 0 10px var(--purple); }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(12px + var(--safe-top)) 15px 12px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            text-align: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            background: var(--grad-text);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 4s ease infinite;
        }
        @keyframes logoGlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .main {
            position: relative; z-index: 2;
            padding: calc(55px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .card {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.5);
            padding: 12px;
            backdrop-filter: blur(10px);
            animation: boxGlow 5s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,51,0.1); }
            50% { box-shadow: 0 0 35px rgba(0,240,255,0.15); }
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif; font-size: 11px;
            letter-spacing: 2px; color: var(--cyan);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .stat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glow);
            border-radius: var(--r-sm);
            padding: 8px 5px;
            text-align: center;
        }
        .stat-label { font-size: 6px; color: var(--muted); letter-spacing: 1px; font-family: 'Orbitron', sans-serif; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900; color: var(--white); margin-top: 2px; }
        .stat-value.small { font-size: 9px; }
        .stat-bar { height: 4px; background: rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s var(--ease); }
        .fill-green { background: var(--success); }
        .fill-yellow { background: var(--gold); }
        .fill-red { background: var(--red); }

        .btn-primary {
            width: 100%; padding: 11px;
            background: var(--grad-btn); color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            width: 100%; padding: 9px;
            background: rgba(255,0,51,0.08);
            border: 1px solid var(--border-glow);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 1px;
            border-radius: var(--r-full);
            cursor: pointer;
            margin-bottom: 5px;

        .btn-secondary:active { background: var(--red); color: var(--white); }

        .event-box {
            border: 1px solid var(--gold);
            border-radius: var(--r-sm);
            background: rgba(255,215,0,0.08);
            padding: 10px;
            margin-bottom: 8px;
            text-align: center;
            animation: fadeUp 0.3s var(--ease);

        .event-box p { font-size: 11px; color: var(--white); line-height: 1.5; }

        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;

        .toast {
            padding: 10px 15px; border-radius: 12px; font-size: 11px;
            border: 1px solid;
            transition: all 0.4s var(--ease);

        ];

        const EDUCATION_LEVELS = ['Tiada', 'Prasekolah', 'Rendah', 'Menengah', 'SPM', 'Diploma', 'Ijazah', 'Sarjana', 'PhD', 'Profesor'];

        const RELIGIONS = ['Islam', 'Kristian', 'Hindu', 'Buddha', 'Yahudi', 'Sikh', 'Taoisme', 'Konfusianisme', 'Shinto', 'Tiada'];

        const LANGUAGES = ['Melayu', 'Inggeris', 'Mandarin', 'Tamil', 'Hindi', 'Arab', 'Jepun', 'Korea', 'Sepanyol', 'Perancis', 'Jerman', 'Portugis', 'Rusia', 'Thai', 'Vietnam'];

        const HISTORICAL_EVENTS = [
            { name: 'Revolusi Perindustrian', year: 1760, impact: 'ekonomi' },
            { name: 'Perang Dunia I', year: 1914, impact: 'global' },
            { name: 'Perang Dunia II', year: 1939, impact: 'global' },
            { name: 'Kemerdekaan Tanah Melayu', year: 1957, impact: 'nasional' },
            { name: 'Runtuhnya Tembok Berlin', year: 1989, impact: 'global' },
            { name: 'Serangan 9/11', year: 2001, impact: 'global' },
            { name: 'Tsunami Lautan Hindi', year: 2004, impact: 'serantau' },
            { name: 'Krisis Kewangan Global', year: 2008, impact: 'ekonomi' },
            { name: 'Pandemik COVID-19', year: 2019, impact: 'global' },
            { name: 'Revolusi Digital', year: 2000, impact: 'teknologi' },
            { name: 'Kejatuhan Soviet', year: 1991, impact: 'global' },
            { name: 'Penemuan Penisilin', year: 1928, impact: 'perubatan' },
            { name: 'Manusia di Bulan', year: 1969, impact: 'sains' },
            { name: 'Penciptaan Internet', year: 1983, impact: 'teknologi' },
            { name: 'Revolusi Perancis', year: 1789, impact: 'politik' }
        ];

        let life = null;
        let achievements = [];

        function initStars() {
            const wrap = $('stars');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                frag.appendChild(s);
            }
            wrap.appendChild(frag);
        }

        function initParticles() {
            const wrap = $('particles');
            const colors = ['p-red','p-cyan','p-gold','p-purple'];
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = `particle ${colors[i % 4]}`;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                frag.appendChild(p);
            }
            wrap.appendChild(frag);
        }

        function startLife() {
            const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
            const religion = RELIGIONS[Math.floor(Math.random() * RELIGIONS.length)];
            const language = LANGUAGES[Math.floor(Math.random() * LANGUAGES.length)];
            const gender = Math.random() > 0.5 ? 'Lelaki' : 'Perempuan';

            life = {
                name: 'Orang ' + Math.floor(Math.random() * 1000),
                gender,
                country: country.name,
                icon: country.icon,
                gdp: country.gdp,
                pop: country.pop,
                lifeExpectancy: country.life,
                religion,
                language,
                age: 0, health: 100, happiness: 70,
                intelligence: 50, creativity: 30, reputation: 10,
                mental: 80, fitness: 40, spiritual: 20,
                money: Math.floor(country.gdp / 10),
                debt: 0,
                education: 'Tiada', job: 'Tiada',
                married: false, children: 0,
                alive: true,
                hasCriminalRecord: false,
                hasDisease: false
            };
            achievements = [];

            $('startScreen').style.display = 'none';
            $('lifeScreen').style.display = 'block';
            $('deathScreen').style.display = 'none';

            renderStats();
            generateActions();
            toast(`Lahir di ${country.icon} ${country.name}! (GDP: $${country.gdp})`, 'success');
        }

        function renderStats() {
            const grid = $('statGrid');
            const stats = [
                { label: 'UMUR', value: life.age },
                { label: 'WANG (RM)', value: 'RM ' + life.money.toLocaleString(), small: true },
                { label: 'HUTANG (RM)', value: 'RM ' + life.debt.toLocaleString(), small: true },
                { label: 'KESIHATAN', value: life.health, bar: life.health, color: life.health > 50 ? 'fill-green' : life.health > 25 ? 'fill-yellow' : 'fill-red' },
                { label: 'KEBAHAGIAAN', value: life.happiness, bar: life.happiness, color: life.happiness > 50 ? 'fill-green' : life.happiness > 25 ? 'fill-yellow' : 'fill-red' },
                { label: 'KECERDASAN', value: life.intelligence, bar: life.intelligence, color: 'fill-green' },
                { label: 'KREATIVITI', value: life.creativity, bar: life.creativity, color: 'fill-yellow' },
                { label: 'REPUTASI', value: life.reputation, bar: life.reputation, color: 'fill-green' },
                { label: 'MENTAL', value: life.mental, bar: life.mental, color: life.mental > 50 ? 'fill-green' : life.mental > 25 ? 'fill-yellow' : 'fill-red' },
                { label: 'KECERGASAN', value: life.fitness, bar: life.fitness, color: 'fill-yellow' },
                { label: 'KEROHANIAN', value: life.spiritual, bar: life.spiritual, color: 'fill-yellow' },
                { label: 'PENDIDIKAN', value: life.education, small: true },
                { label: 'PEKERJAAN', value: life.job, small: true },
                { label: 'STATUS', value: life.married ? 'Kahwin' : 'Bujang', small: true },
                { label: 'ANAK', value: life.children }
            ];

            grid.innerHTML = stats.map(s => `
                <div class="stat-box">
                    <div class="stat-label">${s.label}</div>
                    <div class="stat-value ${s.small ? 'small' : ''}">${s.value}</div>
                    ${s.bar !== undefined ? `<div class="stat-bar"><div class="stat-bar-fill ${s.color}" style="width:${s.bar}%"></div></div>` : ''}
                </div>
            `).join('');

            $('identityText').textContent = `${life.icon} ${life.name} • ${life.gender} • ${life.country} • Umur ${life.age} • Agama: ${life.religion} • Bahasa: ${life.language} • Jangka hayat: ${life.lifeExpectancy} tahun • Populasi: ${life.pop} juta • Anak: ${life.children}`;
        }

        function generateActions() {
            const list = $('actionList');
            list.innerHTML = '';
            const frag = document.createDocumentFragment();
            const actions = getActionsForAge(life.age);

            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn-secondary';
                btn.textContent = action.label;
                btn.addEventListener('click', () => performAction(action));
                frag.appendChild(btn);
            });

            list.appendChild(frag);
        }

        function getActionsForAge(age) {
            const actions = [];
            if (age < 6) {
                actions.push({ label: '🧸 Bermain', happiness: 10, health: 5 });
                actions.push({ label: '📖 Belajar bahasa ' + life.language, intelligence: 10 });
            } else if (age < 13) {
                actions.push({ label: '📚 Sekolah rendah', intelligence: 12, happiness: -3, education: 'Rendah' });
                actions.push({ label: '⚽ Main sukan', health: 15, happiness: 10, fitness: 10 });
            } else if (age < 18) {
                actions.push({ label: '📚 Sekolah menengah', intelligence: 15, happiness: -5, education: 'Menengah' });
                actions.push({ label: '🎓 Ambil SPM', intelligence: 10, education: 'SPM' });
                actions.push({ label: '🤝 Sertai kelab', reputation: 5, happiness: 10 });
            } else if (age < 25) {
                actions.push({ label: '🎓 Diploma', intelligence: 15, money: -3000, education: 'Diploma' });
                actions.push({ label: '🎓 Universiti', intelligence: 20, money: -8000, education: 'Ijazah', debt: 8000 });
                actions.push({ label: '💼 Cari kerja', money: 1500, happiness: -3, job: JOBS[Math.floor(Math.random() * JOBS.length)].title });
                actions.push({ label: '💑 Cari pasangan', happiness: 15 });
                actions.push({ label: '🕌 Amal ' + life.religion, spiritual: 10, happiness: 5 });
            } else if (age < 45) {
                actions.push({ label: '💼 Bekerja', money: 2000, happiness: -5 });
                actions.push({ label: '💍 Kahwin', happiness: 30, married: true });
                actions.push({ label: '👶 Dapat anak', happiness: 20, children: 1 });
                actions.push({ label: '🏠 Beli rumah', money: -15000, happiness: 20, debt: 15000 });
                actions.push({ label: '🚗 Beli kereta', money: -8000, happiness: 10 });
                actions.push({ label: '📈 Labur saham', money: -2000, intelligence: 5 });
                actions.push({ label: '🌍 Melancong', money: -2000, happiness: 20 });
            } else if (age < 65) {
                actions.push({ label: '💼 Bekerja', money: 1800, happiness: -3 });
                actions.push({ label: '👨‍👩‍👧 Masa keluarga', happiness: 20 });
                actions.push({ label: '🧘 Meditasi', health: 10, mental: 10, spiritual: 5 });
                actions.push({ label: '💊 Pemeriksaan kesihatan', health: 5, money: -200 });
            } else {
                actions.push({ label: '🧘 Berehat', health: 10, happiness: 15 });
                actions.push({ label: '👨‍👩‍👧 Masa bersama cucu', happiness: 20 });
                actions.push({ label: '🕌 Amal ' + life.religion, spiritual: 15, happiness: 10 });
            }
            actions.push({ label: '⏭️ Teruskan hidup (1 tahun)', age: 1 });
            return actions;
        }

        function performAction(action) {
            if (!life.alive) return;
            if (action.age) life.age += 1;
            if (action.health) life.health = clamp(life.health + action.health);
            if (action.happiness) life.happiness = clamp(life.happiness + action.happiness);
            if (action.intelligence) life.intelligence = clamp(life.intelligence + action.intelligence);
            if (action.creativity) life.creativity = clamp(life.creativity + action.creativity);
            if (action.reputation) life.reputation = clamp(life.reputation + action.reputation);
            if (action.mental) life.mental = clamp(life.mental + action.mental);
            if (action.fitness) life.fitness = clamp(life.fitness + action.fitness);
            if (action.spiritual) life.spiritual = clamp(life.spiritual + action.spiritual);
            if (action.money) life.money = Math.max(0, life.money + action.money);
            if (action.debt) life.debt = Math.max(0, life.debt + action.debt);
            if (action.education) life.education = action.education;
            if (action.job) life.job = action.job;
            if (action.married) life.married = true;
            if (action.children) life.children += action.children;

            // Random disease
            if (Math.random() < 0.08 && life.age > 10) {
                const disease = DISEASES[Math.floor(Math.random() * DISEASES.length)];
                showEvent({ text: `🏥 Anda menghidap ${disease.name} (${disease.severity})! Kesihatan ${disease.healthImpact}` });
                life.health = clamp(life.health + disease.healthImpact);
                life.hasDisease = true;
            }

            // Random disaster
            if (Math.random() < 0.05) {
                const disaster = DISASTERS[Math.floor(Math.random() * DISASTERS.length)];
                showEvent({ text: `🌋 ${disaster.name} (${disaster.magnitude}) melanda! Kesan: ${disaster.impact}` });
                life.health = clamp(life.health + disaster.impact);
                life.money = Math.max(0, life.money - 500);
            }

            // Random crime
            if (Math.random() < 0.04 && life.age > 15) {
                const crime = CRIMES[Math.floor(Math.random() * CRIMES.length)];
                if (Math.random() > 0.5) {
                    showEvent({ text: `🚨 Anda dituduh: ${crime.name} (${crime.severity}). Hukuman: ${crime.punishment}` });
                    life.hasCriminalRecord = true;
                    life.reputation = clamp(life.reputation - 20);
                } else {
                    showEvent({ text: `🛡️ Anda menjadi mangsa: ${crime.name}. Kesan: ${crime.punishment}` });
                    life.money = Math.max(0, life.money - 500);
                    life.happiness = clamp(life.happiness - 10);
                }
            }

            // Random historical event
            if (Math.random() < 0.02) {
                const he = HISTORICAL_EVENTS[Math.floor(Math.random() * HISTORICAL_EVENTS.length)];
                showEvent({ text: `📜 Peristiwa sejarah: ${he.name} (${he.year}) — kesan ${he.impact}` });
            }

            if (life.health <= 0) { die('penyakit'); return; }
            if (life.mental <= 0) { die('kemurungan'); return; }
            if (life.age >= life.lifeExpectancy + 10) { die('usia lanjut'); return; }

            renderStats();
            generateActions();
        }

        function clamp(val) { return Math.max(0, Math.min(100, val)); }

        function showEvent(event) {
            const container = $('eventContainer');
            container.innerHTML = `<div class="event-box"><p>${event.text}</p></div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        function die(reason) {
            life.alive = false;
            $('lifeScreen').style.display = 'none';
            $('deathScreen').style.display = 'block';
            $('deathSummary').textContent = `${life.icon} ${life.name} dari ${life.country} meninggal pada umur ${life.age} tahun kerana ${reason}. Wang: RM${life.money.toLocaleString()} • Pendidikan: ${life.education} • Anak: ${life.children}${life.hasCriminalRecord ? ' • Rekod jenayah: Ya' : ''}`;
            toast('Kehidupan tamat...', 'error');
        }

        function restartLife() {
            $('deathScreen').style.display = 'none';
            $('lifeScreen').style.display = 'none';
            $('startScreen').style.display = 'block';
            $('eventContainer').innerHTML = '';
        }

        initStars();
        initParticles();
    </script>

</body>
</html>
