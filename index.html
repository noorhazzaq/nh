<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Laman Web">
    <title>Laman Web</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Laman","short_name":"Laman","display":"standalone","theme_color":"%23ffffff","background_color":"%23ffffff"}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f8fafc;font-family:'Inter',sans-serif;color:#1e293b;min-height:100vh}
        .nav{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
        .logo{font-size:20px;font-weight:900;color:#3b82f6}
        .nav-links{display:flex;gap:15px}
        .nav-links a{color:#64748b;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
        .nav-links a:hover{color:#3b82f6}
        .main{max-width:800px;margin:0 auto;padding:30px 15px}
        .hero{text-align:center;padding:40px 0}
        .hero h1{font-size:32px;font-weight:900;color:#0f172a;margin-bottom:10px}
        .hero p{font-size:15px;color:#64748b;line-height:1.7}
        .btn{display:inline-block;padding:12px 30px;background:#3b82f6;color:#ffffff;font-size:13px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-decoration:none}
        .btn-outline{background:#ffffff;color:#3b82f6;border:1px solid #3b82f6}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:30px 0}
        .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:25px;text-align:center;cursor:pointer}
        .card:hover{border-color:#3b82f6}
        .card .ikon{font-size:40px;margin-bottom:10px}
        .card .nama{font-size:13px;font-weight:700;color:#0f172a}
        .input{width:100%;padding:12px 15px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:10px}
        .input:focus{border-color:#3b82f6}
        .log-v{height:200px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:10px;background:#ffffff}
        .log{padding:8px;border-bottom:1px solid #f1f5f9;font-size:13px}
        .log strong{color:#3b82f6}
        .footer{text-align:center;padding:20px;border-top:1px solid #e2e8f0;color:#64748b;font-size:12px}
        @media(max-width:600px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">Laman</div>
        <div class="nav-links">
            <a onclick="tukar('utama')">Utama</a>
            <a onclick="tukar('chat')">Chat</a>
            <a onclick="tukar('hubungi')">Hubungi</a>
        </div>
    </div>
    <div class="main">
        <div id="hal-utama">
            <div class="hero">
                <h1>Selamat Datang</h1>
                <p>Laman web ringkas dengan reka bentuk bersih dan moden.</p>
            </div>
            <div class="grid">
                <div class="card" onclick="tukar('chat')"><div class="ikon">💬</div><div class="nama">Chat</div></div>
                <div class="card" onclick="tukar('hubungi')"><div class="ikon">📞</div><div class="nama">Hubungi</div></div>
            </div>
        </div>
        <div id="hal-chat" style="display:none">
            <h2 style="margin-bottom:15px">💬 Chat</h2>
            <div class="log-v" id="chatLog"></div>
            <input type="text" id="chatNama" class="input" placeholder="Nama">
            <input type="text" id="chatInput" class="input" placeholder="Tulis mesej...">
            <button class="btn" id="btnChat">Hantar</button>
        </div>
        <div id="hal-hubungi" style="display:none">
            <h2 style="margin-bottom:15px">📞 Hubungi</h2>
            <input type="text" id="nama" class="input" placeholder="Nama">
            <input type="email" id="email" class="input" placeholder="E-mel">
            <textarea id="mesej" class="input" placeholder="Mesej" rows="4"></textarea>
            <button class="btn" id="btnHantar">Hantar</button>
        </div>
    </div>
    <div class="footer">© 2026 Laman Web — Semua Hak Terpelihara</div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
    'use strict';
    var db=firebase.initializeApp({databaseURL:'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'}).database();
    window.tukar=function(n){document.getElementById('hal-utama').style.display='none';document.getElementById('hal-chat').style.display='none';document.getElementById('hal-hubungi').style.display='none';document.getElementById('hal-'+n).style.display='block'};
    function muatChat(){db.ref('chat').limitToLast(30).on('value',function(snap){var l=[];if(snap.exists())snap.forEach(function(c){l.push(c.val())});document.getElementById('chatLog').innerHTML=l.map(function(m){return '<div class="log"><strong>'+m.n+'</strong> — '+m.t+'</div>'}).join('')||'<p style="color:#64748b">Tiada mesej</p>'})}
    document.getElementById('btnChat').addEventListener('click',function(){var n=document.getElementById('chatNama').value.trim()||'Anonymous',t=document.getElementById('chatInput').value.trim();if(!t)return;db.ref('chat').push({n:n,t:t}).then(function(){document.getElementById('chatInput').value='';muatChat()}).catch(function(){})});
    document.getElementById('btnHantar').addEventListener('click',function(){alert('Mesej dihantar!')});
    muatChat();
    </script>
</body>
</html>
