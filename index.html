<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Space Hub - Android Gesture Edition</title>
  
  <!-- External Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* CSS Variables & Theme Tokens */
    :root {
      --bg-gradient: linear-gradient(-45deg, #020208, #0a0a2a, #020211, #10002b);
      --card-bg: linear-gradient(135deg, rgba(25, 25, 45, 0.85), rgba(10, 10, 20, 0.7));
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #4ade80;
      --border-color: rgba(255, 255, 255, 0.15);
      --font-stack: system-ui, -apple-system, Roboto, sans-serif;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      touch-action: none; /* Disables browser default drag/pinch so gesture listeners take full control */
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: ambientBg 15s ease infinite;
      color: #fff;
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 12px 20px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @keyframes ambientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Fixed Canvas for 99 Multi-Touch Engine */
    #space-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Navigation Header */
    .app-header {
      position: fixed;
      top: 10px;
      z-index: 30;
      display: flex;
      gap: 12px;
      align-items: center;
      animation: floatUI 4s ease-in-out infinite;
      pointer-events: auto;
    }

    .badge {
      background: rgba(15, 23, 42, 0.9);
      color: var(--accent-cyan);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 0.8rem;
      font-weight: 600;
      animation: pulseGlow 3s infinite;
      backdrop-filter: blur(8px);
    }

    /* Main Container */
    .layout-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Interactive Gesture Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.1s ease-out, opacity 0.3s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      transform-origin: center center;
      will-change: transform;
    }

    /* Gesture Highlight Classes */
    .card.touch-held {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
    }

    /* Card Content */
    h1 {
      font-size: 1.25rem;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan), #f472b6);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      animation: textFlow 5s linear infinite;
      pointer-events: none;
    }

    /* Video Box Frame */
    .video-box {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      touch-action: auto;
    }

    .video-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Chat Structure */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      pointer-events: none;
    }

    .chat-box {
      height: 200px;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      touch-action: pan-y;
    }

    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 10px;
    }

    .chat-msg {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      animation: msgBirth 0.3s ease forwards;
    }

    .chat-msg b { color: var(--accent-cyan); }

    /* Inputs */
    .inputs {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      touch-action: auto;
    }

    input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      touch-action: auto;
    }

    input:focus { border-color: var(--accent-green); }
    input[type="text"]:first-child { width: 32%; }
    input[type="text"]:last-child { flex: 1; }

    .btn {
      background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
      background-size: 200% 200%;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      animation: rainbowBtn 3s ease infinite;
      touch-action: auto;
    }

    /* Keyframes */
    @keyframes floatUI { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 5px rgba(56,189,248,0.2); } 50% { box-shadow: 0 0 12px rgba(56,189,248,0.5); } }
    @keyframes textFlow { to { background-position: 200% center; } }
    @keyframes msgBirth { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rainbowBtn { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    #status { animation: blinkDot 2s infinite; }
    @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="badge" id="clock">🕒 --:--:--</div>
  </header>

  <canvas id="space-canvas"></canvas>

  <main class="layout-container">
    
    <!-- Gesture Frame 1 -->
    <section class="card gesture-frame">
      <h1>Terima Kasih Haji Abu Kassim!</h1>
      <div class="video-box">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/mnN866eQQFs?rel=0&enablejsapi=1" 
          title="Featured Video" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <!-- Gesture Frame 2 -->
    <section class="card gesture-frame">
      <div class="chat-header">
        <h2 style="font-size:1rem; font-weight: 600;">🌌 Global Chat</h2>
        <span style="font-size:0.75rem; color: var(--accent-green);" id="status">● Online</span>
      </div>
      
      <div class="chat-box" id="chat"></div>
      
      <form class="inputs" id="chat-form">
        <input type="text" id="user" placeholder="Name" maxlength="12" required>
        <input type="text" id="msg" placeholder="Type a message..." maxlength="150" required>
        <button type="submit" class="btn">Send</button>
      </form>
    </section>

  </main>

  <script>
    // Live Clock
    const clock = document.getElementById('clock');
    setInterval(() => clock.innerText = `🕒 ${new Date().toLocaleTimeString()}`, 1000);

    // Canvas Engine Setup
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [], particles = [], fireflies = [], meteors = [];
    let time = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const isMobile = w < 600;
      stars = Array.from({ length: isMobile ? 65 : 120 }, () => ({ 
        x: Math.random() * w, y: Math.random() * h, z: Math.random() * w, size: Math.random() * 1.5 + 0.5 
      }));
      fireflies = Array.from({ length: isMobile ? 8 : 15 }, () => ({
        x: Math.random() * w, y: Math.random() * h, offset: Math.random() * 100, speed: Math.random() * 0.02 + 0.01
      }));
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // 1. 99 MULTI-TOUCH PARTICLE SYSTEM ENGINE
    // ==========================================
    const activeTouches = new Map();

    const spawnParticlesForTouches = (touches) => {
      // Loop over every touch point (up to 99 multi-touch fingers)
      for (let i = 0; i < touches.length; i++) {
        const t = touches[i];
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });

        // Generate dynamic multi-color particle explosion per touch
        for (let p = 0; p < 2; p++) {
          if (particles.length < 150) {
            particles.push({
              x: t.clientX,
              y: t.clientY,
              alpha: 1,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              color: `hsl(${(t.identifier * 45 + Math.random() * 60) % 360}, 100%, 70%)`
            });
          }
        }
      }
    };

    window.addEventListener('touchstart', (e) => spawnParticlesForTouches(e.changedTouches), { passive: true });
    window.addEventListener('touchmove', (e) => spawnParticlesForTouches(e.changedTouches), { passive: true });
    
    const removeTouches = (touches) => {
      for (let i = 0; i < touches.length; i++) {
        activeTouches.delete(touches[i].identifier);
      }
    };
    window.addEventListener('touchend', (e) => removeTouches(e.changedTouches), { passive: true });
    window.addEventListener('touchcancel', (e) => removeTouches(e.changedTouches), { passive: true });

    // Render Canvas Frame
    function render() {
      ctx.fillStyle = '#020208';
      ctx.fillRect(0, 0, w, h);
      time += 1;

      // Shooting Stars
      if (Math.random() < 0.02) meteors.push({ x: Math.random() * w, y: 0, speed: Math.random() * 5 + 5 });
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - 25, m.y + 25); ctx.stroke();
        m.x -= m.speed; m.y += m.speed;
        if (m.y > h || m.x < 0) meteors.splice(i, 1);
      }

      // Parallax Stars
      stars.forEach(s => {
        s.z -= 0.5;
        if (s.z <= 0) s.z = w;
        const px = (s.x - w / 2) * (128 / s.z) + w / 2;
        const py = (s.y - h / 2) * (128 / s.z) + h / 2;
        if (px >= 0 && px <= w && py >= 0 && py <= h) {
          ctx.fillStyle = `rgba(255, 255, 255, ${1 - s.z / w})`;
          ctx.fillRect(px, py, s.size, s.size);
        }
      });

      // Fireflies
      fireflies.forEach(f => {
        f.x += Math.sin(time * f.speed + f.offset) * 0.4;
        f.y += Math.cos(time * f.speed + f.offset) * 0.4;
        ctx.fillStyle = `rgba(74, 222, 128, ${Math.abs(Math.sin(time * 0.04 + f.offset)) * 0.5})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, Math.PI * 2); ctx.fill();
      });

      // Render Active Multi-Touch Indicators & Constellation Web
      activeTouches.forEach((pos, id) => {
        ctx.strokeStyle = `hsl(${(id * 45) % 360}, 100%, 65%)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 18, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Render Touch Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, 2.5, 2.5);
        
        for (let j = i - 1; j >= 0; j--) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 45) {
            ctx.strokeStyle = `rgba(192, 132, 252, ${0.25 * p.alpha})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          }
        }

        p.x += p.vx; p.y += p.vy; p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1.0;

      requestAnimationFrame(render);
    }
    render();

    // ==========================================
    // 2. GESTURE CONTROLS ENGINE FOR ALL FRAMES
    // ==========================================
    document.querySelectorAll('.gesture-frame').forEach(card => {
      let scale = 1;
      let startDist = 0;
      let startX = 0, startY = 0;
      let translateX = 0, translateY = 0;
      let isDragging = false;
      let holdTimer = null;
      let lastTapTime = 0;

      const updateTransform = () => {
        card.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      };

      card.addEventListener('touchstart', (e) => {
        // Press and Hold Glow
        holdTimer = setTimeout(() => {
          card.classList.add('touch-held');
          if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
        }, 500);

        // Double-tap Zoom Gesture
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;
        if (tapLength < 250 && tapLength > 0) {
          scale = scale === 1 ? 1.15 : 1;
          translateX = 0;
          translateY = 0;
          updateTransform();
          if (navigator.vibrate) navigator.vibrate(25);
          e.preventDefault();
        }
        lastTapTime = currentTime;

        // Two-Finger Pinch Gesture Setup
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }

        // Single Finger Swipe / Drag Setup
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - translateX;
          startY = e.touches[0].clientY - translateY;
        }
      });

      card.addEventListener('touchmove', (e) => {
        clearTimeout(holdTimer);

        // Pinch Zoom Handling
        if (e.touches.length === 2 && startDist > 0) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = currentDist / startDist;
          scale = Math.min(Math.max(0.8, scale * factor), 1.5);
          startDist = currentDist;
          updateTransform();
        }

        // Swipe Drag Handling
        if (e.touches.length === 1 && isDragging) {
          translateX = e.touches[0].clientX - startX;
          translateY = e.touches[0].clientY - startY;
          updateTransform();
        }
      });

      const resetGestureState = () => {
        clearTimeout(holdTimer);
        card.classList.remove('touch-held');
        isDragging = false;

        // Swipe-to-Dismiss / Reset Position Logic
        if (Math.abs(translateX) > 180) {
          // Swipe far horizontally hides card temporarily, then snaps back
          card.style.opacity = '0.2';
          if (navigator.vibrate) navigator.vibrate(50);
          setTimeout(() => {
            translateX = 0;
            translateY = 0;
            scale = 1;
            card.style.opacity = '1';
            updateTransform();
          }, 800);
        } else {
          // Snap back to natural position smoothly
          translateX = 0;
          translateY = 0;
          scale = 1;
          updateTransform();
        }
      };

      card.addEventListener('touchend', resetGestureState);
      card.addEventListener('touchcancel', resetGestureState);
    });

    // Firebase Database & Haptics
    if (typeof firebase !== 'undefined' && firebase.initializeApp) {
      try {
        firebase.initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" });
        const db = firebase.database().ref("global_chat");

        document.getElementById('chat-form').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('user').value.trim();
          const m = document.getElementById('msg').value.trim();
          
          if (u && m) {
            if (navigator.vibrate) navigator.vibrate(40);
            db.push({ u, m });
            if (/space|love|fire/i.test(m) && typeof confetti === 'function') confetti({ particleCount: 35 });
            document.getElementById('msg').value = '';
          }
        };

        db.limitToLast(15).on("child_added", snap => {
          const d = snap.val();
          const div = document.createElement('div');
          div.className = 'chat-msg';
          div.innerHTML = `<b>${d.u}:</b> ${d.m}`;
          const box = document.getElementById('chat');
          box.appendChild(div);
          box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        });
      } catch (err) {
        document.getElementById('status').innerText = '● Offline Mode';
      }
    } else {
      document.getElementById('status').innerText = '● Offline Mode';
    }
  </script>
</body>
</html>
