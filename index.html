<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Enterprise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e17;
            color: #e0e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background: #141b2b;
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #1e2a3a;
        }
        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #64ffda;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1e2a3a;
            padding-bottom: 0.75rem;
        }
        .field-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: #0d1524;
            border: 1px solid #1e2a3a;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 1rem;
            transition: border 0.2s;
            min-width: 180px;
        }
        input:focus {
            outline: none;
            border-color: #64ffda;
        }
        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: #1e2a3a;
            border: none;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 100px;
            letter-spacing: 0.3px;
        }
        button:hover {
            background: #2a3a50;
            transform: translateY(-1px);
        }
        button.primary {
            background: #64ffda;
            color: #0a0e17;
        }
        button.primary:hover {
            background: #7fffe8;
        }
        button.danger {
            background: #ff6b6b;
            color: #0a0e17;
        }
        button.danger:hover {
            background: #ff8a8a;
        }
        #displayData {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #0d1524;
            border-radius: 8px;
            border-left: 3px solid #64ffda;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            min-height: 60px;
            color: #b0c4de;
        }
        .status {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: #7a8ba3;
            text-align: right;
        }
        @media (max-width: 480px) {
            .container { padding: 1.25rem; }
            .field-group { flex-direction: column; }
            button { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>◈ FIREBASE ENTERPRISE</h1>
        <div class="field-group">
            <input type="text" id="dataInput" placeholder="Enter payload">
        </div>
        <div class="btn-group">
            <button class="primary" onclick="saveData()">COMMIT</button>
            <button onclick="loadData()">FETCH</button>
            <button class="danger" onclick="clearData()">PURGE</button>
        </div>
        <div id="displayData">⏳ awaiting operation...</div>
        <div class="status" id="statusMsg">● system ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const DB_PATH = '/enterprise/data';
        const STATUS_EL = document.getElementById('statusMsg');
        const DISPLAY_EL = document.getElementById('displayData');
        const INPUT_EL = document.getElementById('dataInput');

        firebase.initializeApp(FIREBASE_CONFIG);
        const database = firebase.database();
        const dbRef = database.ref(DB_PATH);

        function setStatus(message, isError = false) {
            STATUS_EL.textContent = isError ? '⚠ ' + message : '● ' + message;
            STATUS_EL.style.color = isError ? '#ff6b6b' : '#7a8ba3';
        }

        function updateDisplay(value) {
            DISPLAY_EL.textContent = value !== null && value !== undefined ? 
                JSON.stringify(value, null, 2) : '∅ no data';
        }

        window.saveData = function() {
            const payload = INPUT_EL.value.trim();
            if (!payload) {
                setStatus('payload required', true);
                return;
            }
            setStatus('committing...');
            dbRef.set(payload)
                .then(() => {
                    setStatus('commit successful');
                    updateDisplay(payload);
                    INPUT_EL.value = '';
                })
                .catch(err => {
                    setStatus('commit failed: ' + err.message, true);
                    console.error('[FIREBASE] SET ERROR:', err);
                });
        };

        window.loadData = function() {
            setStatus('fetching...');
            dbRef.get()
                .then(snapshot => {
                    const value = snapshot.val();
                    if (value !== null && value !== undefined) {
                        updateDisplay(value);
                        setStatus('fetch successful');
                    } else {
                        updateDisplay(null);
                        setStatus('no data found');
                    }
                })
                .catch(err => {
                    setStatus('fetch failed: ' + err.message, true);
                    console.error('[FIREBASE] GET ERROR:', err);
                });
        };

        window.clearData = function() {
            if (!confirm('Permanently delete all data at ' + DB_PATH + '?')) {
                return;
            }
            setStatus('purging...');
            dbRef.remove()
                .then(() => {
                    setStatus('purge complete');
                    updateDisplay(null);
                })
                .catch(err => {
                    setStatus('purge failed: ' + err.message, true);
                    console.error('[FIREBASE] REMOVE ERROR:', err);
                });
        };

        dbRef.on('value', snapshot => {
            const value = snapshot.val();
            if (value !== null && value !== undefined) {
                updateDisplay(value);
            }
        }, error => {
            console.error('[FIREBASE] LISTENER ERROR:', error);
            setStatus('realtime sync error', true);
        });

        setStatus('● enterprise session active');
    </script>
</body>
</html>
