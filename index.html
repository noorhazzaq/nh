<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Simulasi Dunia Realistik Penuh">
    <title>Simulasi Dunia</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Dunia","short_name":"Dunia","display":"standalone","theme_color":"%230f172a","background_color":"%230f172a"}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f172a;font-family:'Inter',sans-serif;color:#f1f5f9;min-height:100vh}
        .nav{background:#1e293b;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:20px;font-weight:900;color:#38bdf8}
        .nav-links{display:flex;gap:12px;flex-wrap:wrap}
        .nav-links a{color:#94a3b8;font-size:12px;cursor:pointer}
        .nav-links a:hover{color:#38bdf8}
        .main{max-width:700px;margin:0 auto;padding:20px 15px}
        .kad{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:15px}
        .kad h2{font-size:16px;color:#38bdf8;margin-bottom:10px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .stat{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;text-align:center}
        .stat .label{font-size:9px;color:#94a3b8}
        .stat .nilai{font-size:14px;font-weight:700;color:#f1f5f9;margin-top:3px}
        .btn{display:block;width:100%;padding:10px;background:#38bdf8;color:#0f172a;font-size:12px;font-weight:700;border:none;border-radius:8px;cursor:pointer;margin-bottom:6px}
        .btn-outline{background:transparent;color:#38bdf8;border:1px solid #38bdf8}
        .log-v{height:200px;overflow-y:auto;border:1px solid #334155;border-radius:8px;padding:10px;background:#0f172a}
        .log{padding:5px;border-bottom:1px solid #1e293b;font-size:11px}
        .log strong{color:#38bdf8}
        .pemain{display:flex;justify-content:space-between;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;margin-bottom:6px;font-size:12px}
        .footer{text-align:center;padding:20px;color:#64748b;font-size:12px}
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">🌍 Dunia Realistik</div>
        <div class="nav-links">
            <a onclick="tukar('dunia')">Dunia</a>
            <a onclick="tukar('negara')">Negara</a>
            <a onclick="tukar('pemain')">Pemain</a>
        </div>
    </div>
    <div class="main">
        <div id="hal-dunia">
            <div class="kad">
                <h2>🌍 Status Dunia</h2>
                <div class="grid" id="statGrid"></div>
                <button class="btn" id="btnLangkah" style="margin-top:10px">⚡ Tahun Seterusnya</button>
            </div>
            <div class="kad">
                <h2>📜 Aliran</h2>
                <div class="log-v" id="logDunia"></div>
            </div>
            <div class="kad">
                <h2>🎯 Tindakan</h2>
                <div id="tindakan"></div>
            </div>
        </div>
        <div id="hal-negara" style="display:none">
            <div class="kad"><h2>🌏 Negara</h2><div id="senaraiNegara"></div></div>
        </div>
        <div id="hal-pemain" style="display:none">
            <div class="kad"><h2>👥 Pemain</h2><div id="senaraiPemain"></div></div>
        </div>
    </div>
    <div class="footer">© 2026 Simulasi Dunia Realistik</div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
    'use strict';
    var db=firebase.initializeApp({databaseURL:'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'}).database();
    var NEGARA=[
        {n:'China',i:'🇨🇳',p:1412000000,g:17734,c:15,r:35,u:5,i:3,t:20,m:'CNY',a:'Tiada',b:'Mandarin',k:'Sederhana',g1:'Pelbagai',s:'Teknologi'},
        {n:'India',i:'🇮🇳',p:1428000000,g:3714,c:25,r:45,u:8,i:5,t:15,m:'INR',a:'Hindu',b:'Hindi',k:'Tropika',g1:'Pelbagai',s:'Perkhidmatan'},
        {n:'USA',i:'🇺🇸',p:332000000,g:76399,c:20,r:25,u:4,i:3,t:25,m:'USD',a:'Kristian',b:'Inggeris',k:'Sederhana',g1:'Pelbagai',s:'Teknologi'},
        {n:'Indonesia',i:'🇮🇩',p:277000000,g:4320,c:20,r:50,u:5,i:3,t:15,m:'IDR',a:'Islam',b:'Melayu',k:'Tropika',g1:'Kepulauan',s:'Pertanian'},
        {n:'Malaysia',i:'🇲🇾',p:33000000,g:11409,c:15,r:45,u:3,i:2,t:15,m:'MYR',a:'Islam',b:'Melayu',k:'Tropika',g1:'Pantai',s:'Perkhidmatan'},
        {n:'Singapore',i:'🇸🇬',p:5900000,g:82808,c:5,r:5,u:2,i:1,t:15,m:'SGD',a:'Buddha',b:'Inggeris',k:'Tropika',g1:'Pulau',s:'Kewangan'},
        {n:'Jepun',i:'🇯🇵',p:125000000,g:42345,c:10,r:15,u:2,i:1,t:30,m:'JPY',a:'Shinto',b:'Jepun',k:'Sederhana',g1:'Pulau',s:'Teknologi'},
        {n:'Brazil',i:'🇧🇷',p:203000000,g:8918,c:40,r:55,u:12,i:4,t:15,m:'BRL',a:'Kristian',b:'Portugis',k:'Tropika',g1:'Hutan',s:'Pertanian'},
        {n:'Nigeria',i:'🇳🇬',p:223000000,g:2163,c:45,r:60,u:15,i:12,t:10,m:'NGN',a:'Islam',b:'Inggeris',k:'Tropika',g1:'Padang',s:'Minyak'},
        {n:'Russia',i:'🇷🇺',p:144000000,g:15345,c:25,r:50,u:5,i:4,t:13,m:'RUB',a:'Kristian',b:'Rusia',k:'Sejuk',g1:'Padang',s:'Minyak'},
        {n:'Australia',i:'🇦🇺',p:26000000,g:65000,c:15,r:15,u:4,i:2,t:30,m:'AUD',a:'Kristian',b:'Inggeris',k:'Sederhana',g1:'Pantai',s:'Minyak'},
        {n:'Mesir',i:'🇪🇬',p:102000000,g:3000,c:25,r:55,u:8,i:6,t:10,m:'EGP',a:'Islam',b:'Arab',k:'Kering',g1:'Padang',s:'Pelancongan'}
    ];
    var s={tahun:2024,populasi:8000000000,ekonomi:100,alam:100,teknologi:50,kesihatan:50,pencapaian:[]};
    var D=['Gempa Bumi 7.0','Tsunami 10m','Banjir Besar','Kemarau Panjang','Wabak Penyakit','Revolusi AI','Krisis Kewangan','Boom Ekonomi','Pandemik Global','Perang Saudara','Krisis Iklim','Krisis Air','Krisis Tenaga','Krisis Makanan'];
    var T=[
        {n:'🌾 Pertanian',e:function(){s.ekonomi=Math.min(100,s.ekonomi+3);s.alam=Math.max(0,s.alam-2);return'Pertanian +3% ekonomi, alam -2%'}},
        {n:'🏭 Industri',e:function(){s.ekonomi=Math.min(100,s.ekonomi+8);s.alam=Math.max(0,s.alam-8);return'Industri +8% ekonomi, alam -8%'}},
        {n:'💻 Teknologi',e:function(){s.teknologi=Math.min(100,s.teknologi+10);return'Teknologi +10%'}},
        {n:'🏥 Kesihatan',e:function(){s.kesihatan=Math.min(100,s.kesihatan+10);s.populasi+=10000000;return'Kesihatan +10%, populasi +10 juta'}},
        {n:'🌳 Alam',e:function(){s.alam=Math.min(100,s.alam+12);return'Alam +12%'}},
        {n:'☀️ Solar',e:function(){s.alam=Math.min(100,s.alam+8);s.ekonomi=Math.max(0,s.ekonomi-2);return'Alam +8%, ekonomi -2%'}},
        {n:'💨 Angin',e:function(){s.alam=Math.min(100,s.alam+6);return'Alam +6%'}},
        {n:'💧 Hidro',e:function(){s.alam=Math.min(100,s.alam+5);return'Alam +5%'}},
        {n:'♻️ Kitar Semula',e:function(){s.alam=Math.min(100,s.alam+5);return'Alam +5%'}},
        {n:'🎓 Pendidikan',e:function(){s.teknologi=Math.min(100,s.teknologi+8);return'Teknologi +8%'}},
        {n:'🕊️ Perjanjian Damai',e:function(){s.ekonomi=Math.min(100,s.ekonomi+5);return'Ekonomi +5%'}},
        {n:'🚀 Angkasa',e:function(){s.teknologi=Math.min(100,s.teknologi+15);s.ekonomi=Math.max(0,s.ekonomi-5);return'Teknologi +15%, ekonomi -5%'}}
    ];
    window.tukar=function(n){document.getElementById('hal-dunia').style.display=n==='dunia'?'block':'none';document.getElementById('hal-negara').style.display=n==='negara'?'block':'none';document.getElementById('hal-pemain').style.display=n==='pemain'?'block':'none';if(n==='negara')paparNegara();if(n==='pemain')muatPemain()};
    function paparDunia(){document.getElementById('statGrid').innerHTML=[{l:'TAHUN',v:s.tahun},{l:'POPULASI',v:(s.populasi/1000000000).toFixed(1)+'B'},{l:'EKONOMI',v:s.ekonomi+'%'},{l:'ALAM',v:s.alam+'%'},{l:'TEKNOLOGI',v:s.teknologi+'%'},{l:'KESIHATAN',v:s.kesihatan+'%'}].map(function(x){return '<div class="stat"><div class="label">'+x.l+'</div><div class="nilai">'+x.v+'</div></div>'}).join('')}
    function tambahLog(t){var d=document.getElementById('logDunia');d.innerHTML='<div class="log"><strong>'+s.tahun+'</strong> — '+t+'</div>'+d.innerHTML}
    function semakPencapaian(){if(s.populasi>=10000000000&&s.pencapaian.indexOf('p10')===-1){s.pencapaian.push('p10');tambahLog('🏆 Populasi 10 bilion!')}if(s.ekonomi>=100&&s.pencapaian.indexOf('e100')===-1){s.pencapaian.push('e100');tambahLog('🏆 Ekonomi 100%!')}if(s.teknologi>=100&&s.pencapaian.indexOf('t100')===-1){s.pencapaian.push('t100');tambahLog('🏆 Teknologi 100%!')}if(s.alam>=100&&s.pencapaian.indexOf('a100')===-1){s.pencapaian.push('a100');tambahLog('🏆 Alam 100%!')}}
    document.getElementById('btnLangkah').addEventListener('click',function(){s.tahun++;s.populasi+=Math.floor(Math.random()*50000000);s.ekonomi=Math.max(0,s.ekonomi-Math.floor(Math.random()*3));s.alam=Math.max(0,s.alam-Math.floor(Math.random()*2));if(Math.random()<0.4){var d=D[Math.floor(Math.random()*D.length)];tambahLog('⚠️ '+d);s.ekonomi=Math.max(0,s.ekonomi-8);s.kesihatan=Math.max(0,s.kesihatan-5);s.populasi=Math.max(0,s.populasi-Math.floor(Math.random()*20000000))}semakPencapaian();paparDunia()});
    document.getElementById('tindakan').innerHTML=T.map(function(a,i){return '<button class="btn btn-outline" onclick="tindak('+i+')">'+a.n+'</button>'}).join('');
    window.tindak=function(i){var r=T[i].e();tambahLog('✅ '+r);semakPencapaian();paparDunia()};
    function paparNegara(){document.getElementById('senaraiNegara').innerHTML=NEGARA.map(function(n){return '<div class="pemain"><span>'+n.i+' '+n.n+'</span><span>'+((n.p)/1000000).toFixed(0)+' juta • $'+n.g+'</span></div>'}).join('')}
    function muatPemain(){db.ref('profil').on('value',function(snap){var l=[];if(snap.exists())snap.forEach(function(c){l.push({n:c.key})});document.getElementById('senaraiPemain').innerHTML=l.map(function(p){return '<div class="pemain"><span>'+p.n+'</span></div>'}).join('')||'<p style="color:#64748b">Tiada pemain</p>'})}
    paparDunia();
    </script>
</body>
</html>
