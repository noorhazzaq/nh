<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel Chat</title>
  <style>
    /* ============================================================
       PIXEL DESIGN SYSTEM
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #12122a;
      --bg-input: #0f0e17;
      --accent: #e94560;
      --accent-hover: #ff6b81;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.3);
      --border: #e94560;
      --success: #4caf50;
      --error: #e94560;
      --font: 'Press Start 2P', monospace;
      --space-sm: 4px;
      --space-md: 8px;
      --space-lg: 12px;
      --space-xl: 16px;
      --space-2xl: 20px;
    }

    /* ============================================================
       RESET
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    /* ============================================================
       BASE
       ============================================================ */
    body {
      background: var(--bg-primary);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-md);
      overflow: hidden;
    }

    /* ============================================================
       APP
       ============================================================ */
    .app {
      max-width: 700px;
      width: 100%;
      height: 95vh;
      max-height: 800px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      padding: var(--space-xl) var(--space-2xl);
      background: var(--bg-input);
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
      flex-shrink: 0;
      min-height: 56px;
    }

    .header h1 {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    }

    .header h1 span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      flex-wrap: wrap;
    }

    /* ============================================================
       STATUS
       ============================================================ */
    .status-badge {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg);
      background: var(--bg-primary);
      border: 2px solid var(--success);
      font-size: 0.45rem;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      display: inline-block;
    }

    .status-badge .dot.off {
      background: var(--error);
      animation: blink 0.8s infinite;
    }

    /* ============================================================
       AUTH
       ============================================================ */
    .auth {
      display: flex;
      gap: var(--space-sm);
      align-items: center;
    }

    .auth input {
      padding: var(--space-sm) var(--space-lg);
      border: 2px solid var(--border);
      background: var(--bg-primary);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.45rem;
      width: 90px;
      transition: 0.2s;
    }

    .auth input:focus {
      outline: none;
      border-color: var(--accent-hover);
      width: 120px;
    }

    .auth input::placeholder {
      color: var(--text-dim);
    }

    .auth input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: var(--space-sm) var(--space-xl);
      border: 2px solid var(--border);
      background: var(--accent);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.45rem;
      cursor: pointer;
      transition: 0.1s;
      text-transform: uppercase;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translate(-2px, -2px);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn--danger {
      background: var(--error);
      border-color: var(--error);
    }

    .btn--danger:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* ============================================================
       MESSAGES
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      background: var(--bg-tertiary);
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--bg-input);
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--accent);
      border: 2px solid var(--bg-input);
    }

    .status-msg {
      text-align: center;
      font-size: 0.45rem;
      opacity: 0.4;
      padding: var(--space-2xl);
      font-style: italic;
    }

    /* ============================================================
       MESSAGE
       ============================================================ */
    .msg {
      padding: var(--space-md) var(--space-xl);
      border: 2px solid var(--text);
      max-width: 82%;
      word-wrap: break-word;
      animation: fadeIn 0.2s steps(2);
      line-height: 1.6;
    }

    .msg.own {
      align-self: flex-end;
      background: var(--accent);
      border-color: var(--accent-hover);
      border-bottom-right-radius: 0;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--bg-primary);
      border-color: var(--bg-tertiary);
      border-bottom-left-radius: 0;
    }

    .msg .sender {
      font-size: 0.4rem;
      text-transform: uppercase;
      opacity: 0.7;
      letter-spacing: 1px;
      margin-bottom: var(--space-sm);
    }

    .msg .time {
      font-size: 0.35rem;
      opacity: 0.4;
      margin-left: var(--space-sm);
    }

    .msg .text {
      font-size: 0.55rem;
      word-break: break-word;
      line-height: 1.8;
    }

    /* ============================================================
       INPUT
       ============================================================ */
    .input-area {
      padding: var(--space-lg) var(--space-2xl) var(--space-2xl);
      background: var(--bg-input);
      border-top: 2px solid var(--border);
      flex-shrink: 0;
    }

    .row {
      display: flex;
      gap: var(--space-md);
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: var(--space-lg) var(--space-xl);
      border: 2px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.5rem;
      min-width: 50px;
      transition: 0.2s;
    }

    .row input:focus {
      outline: none;
      border-color: var(--accent-hover);
    }

    .row input::placeholder {
      color: var(--text-dim);
    }

    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: 0.5rem;
      padding: var(--space-lg) var(--space-xl);
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px) {
      .app {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }

      .header {
        padding: var(--space-lg) var(--space-xl);
        min-height: 48px;
      }

      .header h1 {
        font-size: 0.65rem;
      }

      .auth input {
        width: 60px;
        font-size: 0.4rem;
        padding: var(--space-xs) var(--space-md);
      }

      .auth input:focus {
        width: 80px;
      }

      .btn {
        font-size: 0.4rem;
        padding: var(--space-xs) var(--space-md);
        min-height: 22px;
      }

      .messages {
        padding: var(--space-lg);
      }

      .msg {
        max-width: 92%;
        padding: var(--space-sm) var(--space-lg);
      }

      .msg .text {
        font-size: 0.45rem;
      }

      .input-area {
        padding: var(--space-md) var(--space-xl) var(--space-xl);
      }

      .row input {
        font-size: 0.4rem;
        padding: var(--space-md) var(--space-lg);
      }

      .row .btn {
        font-size: 0.4rem;
        padding: var(--space-md) var(--space-lg);
      }

      .status-badge {
        font-size: 0.4rem;
        padding: var(--space-xs) var(--space-md);
      }
    }

    @media (max-width: 400px) {
      .auth input {
        width: 50px;
      }

      .auth input:focus {
        width: 60px;
      }

      .header h1 {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <h1>🕹️ <span>PIXEL</span> CHAT</h1>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" id="nameInput" placeholder="NAME" maxlength="20" />
          <button class="btn" id="joinBtn">JOIN</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer">
      <div class="status-msg">🔄 CONNECTING...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area">
      <div class="row">
        <input type="text" id="messageInput" placeholder="TYPE..." disabled />
        <button class="btn" id="sendBtn" disabled>SEND</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * WORKING CHAT — Tested & Ready
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;

    // ============================================================
    // 4. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      setTimeout(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      }, 50);
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;
      if (on) {
        status('✅ CONNECTED');
        setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === '✅ CONNECTED') clearStatus();
        }, 1200);
      } else {
        status('🔄 RECONNECTING...');
      }
    };

    // ============================================================
    // 5. SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) return alert('SIGN IN FIRST!');
      if (!text || !text.trim()) return;
      if (!connected) return alert('WAITING FOR CONNECTION...');

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('FAILED TO SEND.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 6. RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'ANON'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === '✅ CONNECTED' || st.textContent === '🔄 CONNECTING...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 7. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      // Clean up old listeners
      listeners.forEach(ref => ref.off());
      listeners = [];

      // Connection status
      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);

        if (on && user) {
          const users = db.ref('users');
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      // Online users
      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      // Messages
      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      // Initial check
      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === '🔄 CONNECTING...' || st.textContent === '✅ CONNECTED') {
            status('💬 NO MESSAGES YET');
          }
        }
      });
    };

    // ============================================================
    // 8. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'GUEST';
      const name = raw.toUpperCase().slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `MSG AS ${name}...`;

      clearStatus();
      status(`👾 ${name} JOINED`);

      // Re-subscribe with user
      subscribe();

      // Force presence update
      if (connected) {
        const users = db.ref('users');
        const ref = users.child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `👾 ${name} JOINED`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      // Clean up listeners
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'TYPE...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('👋 LEFT CHAT');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 9. EVENTS
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // ============================================================
    // 10. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('🕹️ PIXEL CHAT READY');
    console.log('📡 Database:', firebase.app().options.databaseURL);
  </script>

</body>
</html>
