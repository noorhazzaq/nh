<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK Lives 8.0 — Realisme Engine">
    <title>ZACK Lives 8.0 Engine</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        :root {
            --red: #ff0033;
            --cyan: #00f0ff;
            --gold: #ffd700;
            --purple: #8a2be2;
            --bg: #000000;
            --white: #ffffff;
            --muted: #999999;
            --success: #00ff88;
            --border-glow: rgba(0,240,255,0.3);
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff, #ffd700, #ff00ff);
            --grad-btn: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --r-sm: 10px;
            --r-md: 16px;
            --r-full: 30px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .aurora {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,0,51,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,240,255,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(138,43,226,0.08) 0%, transparent 60%);
            z-index: 0;
            animation: auroraFloat 10s ease-in-out infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10px, 10px) scale(1.05); }
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(12px + var(--safe-top)) 15px 12px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            text-align: center;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; font-weight: 900; letter-spacing: 2px;
            background: var(--grad-text);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-reset-save {
            background: transparent; border: 1px solid var(--red);
            color: var(--red); font-size: 9px; font-family: 'Orbitron', sans-serif;
            padding: 4px 8px; border-radius: 12px; cursor: pointer;
        }

        .main {
            position: relative; z-index: 2;
            padding: calc(65px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex; flex-direction: column; gap: 8px;
            overflow-y: auto;
        }

        .card {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.65);
            padding: 12px;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif; font-size: 11px;
            letter-spacing: 2px; color: var(--cyan);
            margin-bottom: 8px;
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .stat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glow);
            border-radius: var(--r-sm);
            padding: 6px 4px;
            text-align: center;
        }
        .stat-label { font-size: 7px; color: var(--muted); letter-spacing: 1px; font-family: 'Orbitron', sans-serif; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: var(--white); margin-top: 2px; }
        .stat-value.small { font-size: 9px; }
        .stat-bar { height: 3px; background: rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s var(--ease); }
        .fill-green { background: var(--success); }
        .fill-yellow { background: var(--gold); }
        .fill-red { background: var(--red); }

        .btn-primary {
            width: 100%; padding: 12px;
            background: var(--grad-btn); color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            width: 100%; padding: 9px;
            background: rgba(0,240,255,0.05);
            border: 1px solid var(--border-glow);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px;
            border-radius: var(--r-full);
            cursor: pointer;
            margin-bottom: 5px;
            text-align: left;
            padding-left: 12px;
        }
        .btn-secondary:active { background: var(--cyan); color: var(--bg); }

        .timeline-item {
            border-left: 2px solid var(--cyan);
            padding-left: 8px; margin-bottom: 6px; font-size: 10px; color: var(--muted);
        }
        .timeline-item strong { color: var(--white); }

        .death-screen { text-align: center; padding: 20px 10px; }
        .death-icon { font-size: 50px; margin-bottom: 10px; }

        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px; max-width: 260px;
        }
        .toast {
            padding: 8px 12px; border-radius: 10px; font-size: 10px; border: 1px solid;
            backdrop-filter: blur(15px);
        }
        .toast-success { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.4); color: var(--success); }
        .toast-error { background: rgba(255,0,51,0.1); border-color: rgba(255,0,51,0.4); color: var(--red); }
        .toast-info { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.4); color: var(--cyan); }
    </style>
</head>
<body>

    <div class="aurora"></div>
    <div class="toast-wrap" id="toastWrap"></div>

    <div class="header">
        <div class="logo">ZACK LIVES 8.0</div>
        <button class="btn-reset-save" onclick="resetSave()">🗑️ RESET</button>
    </div>

    <div class="main" id="mainContent">
        <div id="startScreen">
            <div class="card" style="text-align:center;">
                <h3>🌍 REALISME ENGINE 8.0</h3>
                <p style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.5;">
                    Simulasi hayat berasaskan ekonomi tunai bersih, kelulusan pinjaman bank, cukai bertingkat, dan pengurusan kesihatan diagnostik.
                </p>
                <div id="legacyBanner" style="display:none;margin-bottom:10px;padding:8px;background:rgba(255,215,0,0.1);border:1px solid var(--gold);border-radius:8px;font-size:10px;color:var(--gold);"></div>
                <button class="btn-primary" onclick="startLife()">👶 MULA KEHIDUPAN</button>
            </div>
        </div>

        <div id="lifeScreen" style="display:none;">
            <div class="card">
                <h3>📊 STATUS & KEWANGAN</h3>
                <div class="stat-grid" id="statGrid"></div>
            </div>

            <div class="card">
                <h3>👤 PROFIL & SKOR KREDIT</h3>
                <p style="font-size:10px;color:var(--muted);" id="identityText"></p>
            </div>

            <div class="card" id="timelineCard" style="display:none;">
                <h3>📜 GARIS MASA REALISME</h3>
                <div id="timelineList"></div>
            </div>

            <div class="card">
                <h3>🎯 PILIHAN HAYAT</h3>
                <div id="actionList"></div>
            </div>
        </div>

        <div id="deathScreen" style="display:none;">
            <div class="death-screen">
                <div class="death-icon">🕊️</div>
                <h2 style="font-family:'Orbitron';color:var(--red);font-size:16px;">PENAMAT HAYAT</h2>
                <p style="color:var(--muted);margin-top:8px;font-size:11px;" id="deathSummary"></p>
                <button class="btn-primary" style="margin-top:15px;" onclick="restartLife()">🔄 TERUSKAN GENERASI</button>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        const $ = id => document.getElementById(id);
        const SAVE_KEY = 'ZACK_LIVES_8_ADVANCED_SAVE';
        const LEGACY_KEY = 'ZACK_LIVES_8_LEGACY';

        const COUNTRIES = [
            { name: 'Malaysia', icon: '🇲🇾', gdp: 11000, life: 75, baseCost: 1200, inflation: 0.025, currency: 'MYR' },
            { name: 'Singapore', icon: '🇸🇬', gdp: 65000, life: 83, baseCost: 3500, inflation: 0.015, currency: 'SGD' },
            { name: 'Japan', icon: '🇯🇵', gdp: 40000, life: 84, baseCost: 2200, inflation: 0.010, currency: 'JPY' },
            { name: 'USA', icon: '🇺🇸', gdp: 65000, life: 78, baseCost: 3000, inflation: 0.030, currency: 'USD' }
        ];

        const JOBS = [
            { title: 'Pekerja Kedai', salary: 1500, reqEdu: 'SPM', reqIQ: 30 },
            { title: 'Juruteknik', salary: 3200, reqEdu: 'Sijil', reqIQ: 50 },
            { title: 'Pengaturcara', salary: 6500, reqEdu: 'Ijazah', reqIQ: 65 },
            { title: 'Pegawai Bank', salary: 5500, reqEdu: 'Ijazah', reqIQ: 60 },
            { title: 'Doktor', salary: 12000, reqEdu: 'Master/PhD', reqIQ: 80 }
        ];

        let life = null;
        let timeline = [];
        let legacyBank = parseInt(localStorage.getItem(LEGACY_KEY) || '0', 10);

        function toast(msg, type = 'info') {
            const wrap = $('toastWrap');
            while (wrap.children.length >= 3) wrap.firstChild.remove();
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        function saveGame() {
            if (!life) return;
            localStorage.setItem(SAVE_KEY, JSON.stringify({ life, timeline }));
            localStorage.setItem(LEGACY_KEY, legacyBank.toString());
        }

        function loadGame() {
            const dataStr = localStorage.getItem(SAVE_KEY);
            if (!dataStr) return false;
            try {
                const data = JSON.parse(dataStr);
                life = data.life;
                timeline = data.timeline || [];
                return true;
            } catch (e) {
                return false;
            }
        }

        function resetSave() {
            localStorage.removeItem(SAVE_KEY);
            localStorage.removeItem(LEGACY_KEY);
            location.reload();
        }

        function calculateTax(monthlyIncome) {
            const annual = monthlyIncome * 12;
            if (annual <= 30000) return 0;
            if (annual <= 60000) return (annual - 30000) * 0.08;
            if (annual <= 120000) return 2400 + (annual - 60000) * 0.15;
            return 11400 + (annual - 120000) * 0.25;
        }

        function startLife() {
            const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
            const gender = Math.random() > 0.5 ? 'Lelaki' : 'Perempuan';

            life = {
                name: gender === 'Lelaki' ? 'Ahmad' : 'Siti',
                gender, country: country.name, icon: country.icon,
                currency: country.currency, baseCost: country.baseCost, inflation: country.inflation,
                baseLifeExpectancy: country.life,
                age: 0, health: 100, happiness: 75, intelligence: 50, mental: 80,
                cash: 500 + legacyBank, bankBalance: 0, creditScore: 650,
                education: 'SPM', job: 'Penganggur', monthlySalary: 0,
                loans: 0, loanPayment: 0, houseValue: 0,
                married: false, children: 0, alive: true
            };

            legacyBank = 0;
            localStorage.setItem(LEGACY_KEY, '0');
            timeline = [];
            addTimeline(`👶 Lahir di ${country.icon} ${country.name}`);

            $('startScreen').style.display = 'none';
            $('lifeScreen').style.display = 'block';

            saveGame();
            renderStats();
            generateActions();
        }

        function addTimeline(text) {
            timeline.push({ age: life.age, text });
            renderTimeline();
        }

        function renderTimeline() {
            if (timeline.length < 1) return;
            $('timelineCard').style.display = 'block';
            const list = $('timelineList');
            const frag = document.createDocumentFragment();
            timeline.slice(-6).reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `<strong>Umur ${item.age}:</strong> ${item.text}`;
                frag.appendChild(div);
            });
            list.innerHTML = ''; list.appendChild(frag);
        }

        function renderStats() {
            const annualCost = Math.floor(life.baseCost * 12 * Math.pow(1 + life.inflation, life.age));
            const grid = $('statGrid');
            const stats = [
                { label: 'UMUR', value: life.age },
                { label: 'TUNAI', value: `${life.currency} ${Math.floor(life.cash).toLocaleString()}`, small: true },
                { label: 'SIMPANAN', value: `${life.currency} ${Math.floor(life.bankBalance).toLocaleString()}`, small: true },
                { label: 'KREDIT SKOR', value: life.creditScore, color: life.creditScore > 650 ? 'fill-green' : 'fill-red' },
                { label: 'BEBAN HUTANG', value: `${life.currency} ${Math.floor(life.loans).toLocaleString()}`, small: true },
                { label: 'KOS SARA (THN)', value: `${life.currency} ${annualCost.toLocaleString()}`, small: true },
                { label: 'KESIHATAN', value: life.health, bar: life.health, color: life.health > 50 ? 'fill-green' : 'fill-red' },
                { label: 'KEBAHAGIAAN', value: life.happiness, bar: life.happiness, color: life.happiness > 50 ? 'fill-green' : 'fill-red' },
                { label: 'MENTAL', value: life.mental, bar: life.mental, color: life.mental > 50 ? 'fill-green' : 'fill-red' }
            ];

            const frag = document.createDocumentFragment();
            stats.forEach(s => {
                const box = document.createElement('div');
                box.className = 'stat-box';
                box.innerHTML = `
                    <div class="stat-label">${s.label}</div>
                    <div class="stat-value ${s.small ? 'small' : ''}">${s.value}</div>
                    ${s.bar !== undefined ? `<div class="stat-bar"><div class="stat-bar-fill ${s.color}" style="width:${Math.max(0, Math.min(100, s.bar))}%"></div></div>` : ''}
                `;
                frag.appendChild(box);
            });
            grid.innerHTML = ''; grid.appendChild(frag);

            $('identityText').textContent = `${life.icon} ${life.name} • Pekerjaan: ${life.job} (${life.education}) • Rumah: ${life.houseValue > 0 ? 'Ada' : 'Sewa'}`;
        }

        function generateActions() {
            const list = $('actionList'); list.innerHTML = '';
            const frag = document.createDocumentFragment();
            const actions = [];

            if (life.age >= 18) {
                actions.push({ label: '💼 Cari Pekerjaan (Persyaratan Kelayakan)', type: 'JOB' });
                if (life.education === 'SPM') {
                    actions.push({ label: '🎓 Sambung Pengajian Tinggi (-$10,000)', type: 'EDU' });
                }
                if (life.houseValue === 0) {
                    actions.push({ label: '🏦 Memohon Pinjaman Perumahan (Bank Loan)', type: 'MORTGAGE' });
                }
            }
            actions.push({ label: '🏃 Gaya Hidup Sihat & Senaman', type: 'EXERCISE' });
            actions.push({ label: '⏭️ Teruskan Kehidupan (Tamat Tahun)', type: 'ADVANCE' });

            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = 'btn-secondary';
                btn.textContent = act.label;
                btn.addEventListener('click', () => processAction(act.type));
                frag.appendChild(btn);
            });
            list.appendChild(frag);
        }

        function processAction(type) {
            if (!life.alive) return;

            if (type === 'JOB') {
                const available = JOBS.filter(j => life.intelligence >= j.reqIQ);
                if (available.length > 0) {
                    const selected = available[Math.floor(Math.random() * available.length)];
                    life.job = selected.title;
                    life.monthlySalary = selected.salary;
                    addTimeline(`💼 Ditawarkan kerja sebagai ${selected.title}`);
                    toast(`Mula bekerja sebagai ${selected.title}`, 'success');
                } else {
                    toast('Kelayakan IQ/Pendidikan tidak mencukupi untuk jawatan wujud.', 'error');
                }
            } else if (type === 'EDU') {
                if (life.cash >= 10000) {
                    life.cash -= 10000;
                    life.education = 'Ijazah';
                    life.intelligence += 15;
                    addTimeline('🎓 Tamat pengajian Ijazah Sarjana Muda');
                    toast('Pendidikan dinaikkan ke Ijazah!', 'success');
                } else {
                    toast('Baki tunai tidak mencukupi untuk yuran pengajian.', 'error');
                }
            } else if (type === 'MORTGAGE') {
                if (life.creditScore >= 650 && life.monthlySalary > 3000) {
                    const houseCost = 150000;
                    const downpayment = houseCost * 0.10;
                    if (life.cash >= downpayment) {
                        life.cash -= downpayment;
                        life.houseValue = houseCost;
                        life.loans += (houseCost - downpayment);
                        life.loanPayment = ((houseCost - downpayment) / 20) / 12;
                        addTimeline('🏠 Membeli rumah pertama menerusi pinjaman bank 20 tahun');
                        toast('Permohonan pinjaman rumah diluluskan!', 'success');
                    } else {
                        toast('Tunai tidak cukup untuk deposit 10%.', 'error');
                    }
                } else {
                    toast('Skor kredit rendah atau gaji tidak layak untuk pinjaman bank.', 'error');
                }
            } else if (type === 'EXERCISE') {
                life.health = Math.min(100, life.health + 5);
                life.mental = Math.min(100, life.mental + 5);
                toast('Kesihatan fizikal & mental bertambah baik.', 'info');
            } else if (type === 'ADVANCE') {
                advanceYear();
                return;
            }

            saveGame();
            renderStats();
            generateActions();
        }

        function advanceYear() {
            life.age += 1;

            const annualGrossSalary = life.monthlySalary * 12;
            const annualTax = calculateTax(life.monthlySalary);
            const annualLivingCost = Math.floor(life.baseCost * 12 * Math.pow(1 + life.inflation, life.age));
            
            let annualLoanPay = 0;
            if (life.loans > 0) {
                annualLoanPay = Math.min(life.loans, life.loanPayment * 12);
                life.loans -= annualLoanPay;
                if (life.loans <= 0) {
                    life.loanPayment = 0;
                    addTimeline('🎉 Beban pinjaman perumahan telah selesai dibayar!');
                }
            }

            const netCashflow = annualGrossSalary - annualTax - annualLivingCost - annualLoanPay;
            life.cash += netCashflow;

            if (netCashflow < 0) {
                life.creditScore = Math.max(300, life.creditScore - 15);
                life.mental = Math.max(0, life.mental - 10);
                toast('Aliran tunai negatif! Skor kredit terjejas.', 'error');
            } else {
                life.creditScore = Math.min(850, life.creditScore + 5);
            }

            life.bankBalance = Math.floor(life.bankBalance * 1.025);

            const diseaseRisk = (100 - life.health) / 400;
            if (Math.random() < diseaseRisk && life.age > 15) {
                life.health = Math.max(0, life.health - 20);
                addTimeline('🏥 Disahkan menghidap penyakit kronik');
                toast('Kesihatan merosot teruk akibat penyakit.', 'error');
            }

            const currentMaxAge = life.baseLifeExpectancy + Math.floor((life.health - 50) / 10);

            if (life.health <= 0 || life.cash < -50000 || life.age >= currentMaxAge) {
                die(life.cash < -50000 ? 'Kebankrapan Kewangan' : 'Kegagalan Organ / Usia Lanjut');
                return;
            }

            saveGame();
            renderStats();
            generateActions();
        }

        function die(reason) {
            life.alive = false;
            legacyBank = Math.max(0, Math.floor(life.cash * 0.5));
            localStorage.setItem(LEGACY_KEY, legacyBank.toString());
            localStorage.removeItem(SAVE_KEY);

            addTimeline(`🕊️ Meninggal dunia: ${reason}`);
            $('lifeScreen').style.display = 'none';
            $('deathScreen').style.display = 'block';
            $('deathSummary').textContent = `${life.icon} ${life.name} menghembuskan nafas terakhir pada umur ${life.age} akibat ${reason}. Harta bersih dipindahkan: ${life.currency} ${legacyBank.toLocaleString()}`;
        }

        function restartLife() {
            if (legacyBank > 0) {
                $('legacyBanner').style.display = 'block';
                $('legacyBanner').textContent = `🎁 Harta Pusaka Warisan: ${legacyBank.toLocaleString()} diawasi untuk generasi baharu!`;
            }
            $('deathScreen').style.display = 'none';
            $('startScreen').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (legacyBank > 0) {
                $('legacyBanner').style.display = 'block';
                $('legacyBanner').textContent = `🎁 Harta Pusaka Warisan: ${legacyBank.toLocaleString()} sedia dibawa ke generasi baharu!`;
            }
            if (loadGame() && life && life.alive) {
                $('startScreen').style.display = 'none';
                $('lifeScreen').style.display = 'block';
                renderStats();
                generateActions();
                toast('Sesi dipulihkan!', 'info');
            }
        });
    </script>
</body>
</html>
