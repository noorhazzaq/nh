<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>Editor Mobile</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#0a0a0f;color:#eee}
  .app{display:flex;flex-direction:column;height:100dvh}

  header{
    padding:12px 14px;background:#12121a;border-bottom:1px solid #222;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0
  }
  header h1{font-size:13px;font-weight:700;color:#7c5cff;white-space:nowrap}
  .fname{
    flex:1;min-width:0;font-size:11.5px;color:#666;
    padding:6px 10px;background:#1a1a24;border:1px solid #2a2a3a;
    border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  button{
    padding:10px 14px;background:#1a1a24;border:1px solid #2a2a3a;
    border-radius:9px;color:#ccc;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;font-family:inherit;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation
  }
  button:active{background:#22222e}
  button.primary{background:linear-gradient(135deg,#7c5cff,#22d3ee);border:none;color:#fff}
  button.primary:disabled{opacity:.4}
  button.danger{background:#2a1a1a;border-color:#3a2a2a;color:#ff8a8a}

  #editor{
    flex:1;width:100%;padding:14px;background:#0a0a0f;color:#e0e0e0;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;
    line-height:1.55;border:none;outline:none;resize:none;
    tab-size:2;white-space:pre;overflow:auto;-webkit-text-size-adjust:100%
  }
  #editor::selection{background:#7c5cff44}

  footer{
    padding:8px 14px;background:#0f0f16;border-top:1px solid #222;
    font-size:11.5px;color:#666;display:flex;align-items:center;
    justify-content:space-between;gap:10px;flex-shrink:0;
    padding-bottom:calc(8px + env(safe-area-inset-bottom))
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px}
  .dot.busy{background:#f59e0b;animation:pulse 1s infinite}
  .dot.err{background:#ff6b6b}
  .dot.warn{background:#f59e0b}
  @keyframes pulse{50%{opacity:.4}}

  .hint{
    position:fixed;inset:0;background:rgba(5,5,12,.9);backdrop-filter:blur(10px);
    display:grid;place-items:center;padding:20px;z-index:50
  }
  .hint.hidden{display:none}
  .hint-card{
    max-width:520px;width:100%;padding:24px;background:linear-gradient(160deg,#1a1a2a,#12121e);
    border:1px solid #2a2a3a;border-radius:18px;text-align:center
  }
  .hint-card .big{font-size:48px;margin-bottom:10px}
  .hint-card h2{margin:0 0 8px;font-size:18px}
  .hint-card p{margin:0 0 16px;font-size:13.5px;color:#888;line-height:1.6}
  .warn-box{
    background:#2a1a0a;border:1px solid #4a3a1a;color:#f5c97a;
    padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:16px;
    text-align:left;line-height:1.5
  }
  .hint-card button{width:100%;padding:14px;font-size:15px;margin-top:6px}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1a1a24;border:1px solid #2a2a3a;color:#fff;
    padding:11px 18px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:100;
    max-width:90vw;text-align:center
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:#22c55e;color:#6ee7a3}
  .toast.err{border-color:#ff6b6b;color:#ff8a8a}

  @media(max-width:520px){
    header h1{display:none}
    button{padding:9px 12px;font-size:12.5px}
    #editor{font-size:12.5px}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>✏️ Editor</h1>
    <span class="fname" id="fname">(tiada fail)</span>
    <button id="openBtn">📂 Buka</button>
    <button id="saveBtn" class="primary" disabled>💾 Simpan</button>
    <button id="saveAsBtn" disabled>📁 Salin</button>
  </header>

  <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off"
    placeholder="Buka fail HTML untuk mula mengedit…"></textarea>

  <footer>
    <span><span class="dot" id="statusDot"></span><span id="statusText">Sedia</span></span>
    <span id="info">Ctrl+S = Simpan</span>
  </footer>
</div>

<div class="hint" id="hint">
  <div class="hint-card">
    <div class="big">📝</div>
    <h2>Editor HTML Mobile</h2>
    <p>Edit fail HTML dari telefon dan simpan terus ke storan Android anda.</p>
    <div class="warn-box">
      ⚠️ <b>Perlu Chrome Android versi 132+</b> (Januari 2025 ke atas). Kemas kini Chrome dari Play Store jika perlu.
    </div>
    <button id="openNow" class="primary">📂 Buka Fail Sekarang</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let fileHandle = null;
let original = "";
let dirty = false;

function toast(msg, type) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  setTimeout(() => t.className = "toast", 2600);
}
function setStatus(text, type) {
  $("statusText").textContent = text;
  const d = $("statusDot");
  d.className = "dot";
  if (type) d.classList.add(type);
}

const editor = $("editor");
const hasFSA = "showOpenFilePicker" in window;

async function openFile() {
  if (!hasFSA) {
    toast("Chrome anda tidak menyokong. Kemas kini Chrome.", "err");
    return;
  }
  try {
    const [h] = await window.showOpenFilePicker({
      types: [{ description: "HTML", accept: { "text/html": [".html", ".htm"] } }],
      multiple: false
    });
    fileHandle = h;
    const file = await h.getFile();
    const text = await file.text();
    original = text;
    editor.value = text;
    dirty = false;
    $("fname").textContent = file.name;
    $("saveBtn").disabled = false;
    $("saveAsBtn").disabled = false;
    $("hint").classList.add("hidden");
    setStatus("Dibuka: " + file.name, "ok");
    toast("Fail dibuka", "ok");
  } catch (e) {
    if (e.name !== "AbortError") {
      toast("Gagal: " + e.message, "err");
      setStatus("Gagal buka", "err");
    }
  }
}

async function saveFile() {
  if (!fileHandle) { openFile(); return; }
  try {
    setStatus("Menyimpan…", "busy");
    const w = await fileHandle.createWritable();
    await w.write(editor.value);
    await w.close();
    original = editor.value;
    dirty = false;
    setStatus("Disimpan: " + fileHandle.name, "ok");
    toast("Disimpan ke telefon", "ok");
  } catch (e) {
    setStatus("Gagal simpan: " + e.message, "err");
    toast("Gagal simpan: " + e.message, "err");
  }
}

async function saveAsFile() {
  if (!hasFSA) return;
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: fileHandle ? fileHandle.name : "index.html",
      types: [{ description: "HTML", accept: { "text/html": [".html"] } }]
    });
    const w = await h.createWritable();
    await w.write(editor.value);
    await w.close();
    fileHandle = h;
    original = editor.value;
    dirty = false;
    $("fname").textContent = h.name;
    $("saveBtn").disabled = false;
    $("saveAsBtn").disabled = false;
    setStatus("Disimpan sebagai: " + h.name, "ok");
    toast("Fail baharu disimpan", "ok");
  } catch (e) {
    if (e.name !== "AbortError") toast("Gagal: " + e.message, "err");
  }
}

editor.addEventListener("input", () => {
  if (!dirty && fileHandle) {
    dirty = true;
    setStatus("Ada perubahan belum disimpan", "warn");
  }
});

editor.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(en);
    editor.selectionStart = editor.selectionEnd = s + 2;
  }
});

$("openBtn").onclick = openFile;
$("saveBtn").onclick = saveFile;
$("saveAsBtn").onclick = saveAsFile;
$("openNow").onclick = openFile;

window.addEventListener("beforeunload", e => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

if (!hasFSA) {
  document.querySelector(".warn-box").innerHTML =
    "❌ Pelayar ini <b>tidak menyokong</b> File System Access API. Guna <b>Chrome Android 132+</b> dan pastikan laman dihoskan melalui <b>HTTPS</b>.";
  setStatus("Pelayar tidak disokong", "err");
} else {
  setStatus("Sedia — tekan Buka", "ok");
}
</script>
</body>
</html>
