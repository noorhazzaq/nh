<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Space Hub - 99 Merrier Effects</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #020208; color: #fff; font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 60px 10px 20px; overflow-x: hidden; cursor: crosshair; position: relative;
    }

    body::before {
      content: ''; position: fixed; inset: 0; border: 3px solid transparent;
      border-image: linear-gradient(45deg, #c084fc, #38bdf8, #f472b6, #4ade80) 1;
      pointer-events: none; z-index: 100; animation: rainbowRotate 8s linear infinite;
    }
    @keyframes rainbowRotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    #top-bar { position: fixed; top: 10px; z-index: 30; display: flex; gap: 8px; align-items: center; }
    
    .badge {
      background: rgba(15, 23, 42, 0.85); color: #38bdf8; padding: 6px 14px;
      border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.4); font-size: 0.8rem;
      backdrop-filter: blur(8px); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .btn {
      background: rgba(168, 85, 247, 0.3); border: 1px solid #c084fc; color: #c084fc;
      padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
      transition: all 0.2s ease; position: relative; overflow: hidden;
    }
    .btn:hover { background: rgba(168, 85, 247, 0.5); transform: scale(1.05); box-shadow: 0 0 12px #c084fc; }

    #space-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .card {
      position: relative; z-index: 10; width: 100%; max-width: 460px; margin-bottom: 15px;
      background: rgba(15, 15, 30, 0.75); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 1.2rem;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.2); transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover { box-shadow: 0 0 40px rgba(56, 189, 248, 0.3); }

    h1 {
      font-size: 1.4rem; background: linear-gradient(90deg, #c084fc, #38bdf8, #f472b6);
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite; margin-bottom: 8px;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .video-box { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; }

    .chat-util-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
    
    .chat-box::-webkit-scrollbar { width: 5px; }
    .chat-box::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }

    .chat-box { height: 210px; overflow-y: auto; text-align: left; font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
    
    .chat-msg {
      background: rgba(255, 255, 255, 0.05); padding: 6px 10px; border-radius: 8px;
      animation: popIn 0.3s ease-out; display: flex; gap: 8px; align-items: center; word-break: break-word;
      border: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.2s;
    }
    .chat-msg:hover { background: rgba(255, 255, 255, 0.1); }
    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    .avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #c084fc, #38bdf8); color: #000; font-weight: bold; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chat-msg b { color: #38bdf8; }

    .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; animation: pulse 1.5s infinite; display: inline-block; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }

    .emoji-bar { display: flex; gap: 6px; margin-bottom: 8px; }
    .emoji-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 2px 6px; cursor: pointer; transition: transform 0.1s; }
    .emoji-btn:hover { transform: scale(1.2); background: rgba(255,255,255,0.15); }

    .inputs { display: flex; gap: 6px; }
    input {
      background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
      padding: 8px; border-radius: 6px; font-size: 0.8rem; outline: none; transition: all 0.2s;
    }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
    input[type="text"]:first-child { width: 28%; }
    input[type="text"]:nth-child(2) { flex: 1; }
    .char-limit { font-size: 0.65rem; color: #888; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="badge" id="clock">🕒 --:--:--</div>
    <div class="badge" id="msg-counter">💬 Messages: 0</div>
  </div>

  <canvas id="space-canvas"></canvas>

  <main class="card" id="main-card">
    <h1 id="title">Terima Kasih Haji Abu Kassim!</h1>
    <div class="video-box">
      <iframe src="https://www.youtube.com/embed/mnN866eQQFs" title="Video" frameborder="0" allowfullscreen></iframe>
    </div>
  </main>

  <div class="card" id="chat-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
      <h2 style="font-size:1rem; display:flex; align-items:center; gap:6px;">🌌 Global Chat</h2>
      <span style="font-size:0.75rem; color:#4ade80; display:flex; align-items:center; gap:4px;">
        <span class="status-dot"></span> <span id="status">● Online</span>
      </span>
    </div>

    <!-- Toolbar -->
    <div class="chat-util-bar">
      <input type="text" id="chat-search" placeholder="🔍 Search messages..." style="width: 140px; font-size:0.7rem; padding: 4px 6px;">
      <button class="btn" id="export-btn">📥 Export Log</button>
      <button class="btn" id="autoscroll-btn">📜 Scroll: ON</button>
      <button class="btn" id="clear-btn">🗑️ Clear</button>
    </div>

    <div class="chat-box" id="chat"></div>

    <!-- Quick Emoji Insertion Bar -->
    <div class="emoji-bar">
      <span class="emoji-btn">🚀</span>
      <span class="emoji-btn">✨</span>
      <span class="emoji-btn">🔥</span>
      <span class="emoji-btn">⭐</span>
      <span class="emoji-btn">👾</span>
      <span class="emoji-btn">🌌</span>
    </div>

    <form id="chat-form">
      <div class="inputs">
        <input type="text" id="user" placeholder="Name" maxlength="12" required>
        <input type="text" id="msg" placeholder="Type a message..." maxlength="150" required autocomplete="off">
        <button type="submit" class="btn">Send</button>
      </div>
      <div class="char-limit" id="char-count">0/150</div>
    </form>
  </div>

  <script>
    // Live Clock Banner
    const clock = document.getElementById('clock');
    setInterval(() => clock.innerText = `🕒 ${new Date().toLocaleTimeString()}`, 1000);

    // Canvas Space Engine
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [], particles = [], meteors = [], mouse = { x: -100, y: -100 };

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      stars = Array.from({ length: 110 }, () => ({
        x: Math.random() * w, y: Math.random() * h, z: Math.random() * w,
        opacity: Math.random(), color: ['#38bdf8', '#c084fc', '#ffffff', '#f472b6'][Math.floor(Math.random() * 4)]
      }));
    }
    window.addEventListener('resize', resize);
    resize();

    // Mouse Tracking & Stardust Particles
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX; mouse.y = e.clientY;
      if (particles.length < 40) {
        particles.push({ x: e.clientX, y: e.clientY, alpha: 1, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 });
      }
    });

    // Particle Burst on Double Click
    window.addEventListener('dblclick', (e) => {
      for (let i = 0; i < 20; i++) {
        particles.push({ x: e.clientX, y: e.clientY, alpha: 1, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 });
      }
      confetti({ particleCount: 35, origin: { x: e.clientX / w, y: e.clientY / h } });
    });

    function render() {
      ctx.fillStyle = '#020208';
      ctx.fillRect(0, 0, w, h);

      // Shooting Meteors
      if (Math.random() < 0.025) {
        meteors.push({ x: Math.random() * w, y: 0, length: Math.random() * 80 + 20, speed: Math.random() * 8 + 4 });
      }
      meteors.forEach((m, i) => {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.length / 2, m.y + m.length); ctx.stroke();
        m.x += m.speed; m.y += m.speed;
        if (m.y > h) meteors.splice(i, 1);
      });

      // Stars, Constellations, & Satellite Orbits
      stars.forEach((s, idx) => {
        s.z -= 0.4;
        if (s.z <= 0) s.z = w;
        const px = (s.x - w / 2) * (128 / s.z) + w / 2;
        const py = (s.y - h / 2) * (128 / s.z) + h / 2;

        if (px >= 0 && px <= w && py >= 0 && py <= h) {
          s.opacity = Math.sin(Date.now() * 0.003 + idx) * 0.5 + 0.5;
          ctx.fillStyle = s.color;
          ctx.fillRect(px, py, 1.5, 1.5);

          // Constellations Proximity Link
          stars.slice(idx + 1, idx + 3).forEach(s2 => {
            const px2 = (s2.x - w / 2) * (128 / s2.z) + w / 2;
            const py2 = (s2.y - h / 2) * (128 / s2.z) + h / 2;
            const dist = Math.hypot(px - px2, py - py2);
            if (dist < 50) {
              ctx.strokeStyle = `rgba(192, 132, 252, ${1 - dist / 50})`;
              ctx.lineWidth = 0.2;
              ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px2, py2); ctx.stroke();
            }
          });
        }
      });

      // Cursor Orbit Satellite
      if (mouse.x > 0) {
        const orbitAngle = Date.now() * 0.003;
        const ox = mouse.x + Math.cos(orbitAngle) * 22;
        const oy = mouse.y + Math.sin(orbitAngle) * 22;
        ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(ox, oy, 2, 0, Math.PI * 2); ctx.fill();
      }

      // Stardust Particle Animation
      particles.forEach((p, i) => {
        ctx.fillStyle = `rgba(192, 132, 252, ${p.alpha})`;
        ctx.fillRect(p.x, p.y, 2.5, 2.5);
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      });

      requestAnimationFrame(render);
    }
    render();

    // 3D Parallax Card Tilt
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        card.style.transform = `perspective(1000px) rotateX(${-y / 25}deg) rotateY(${x / 25}deg)`;
      });
      card.addEventListener('mouseleave', () => card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)');
    });

    // Chat Utilities State
    let autoScroll = true, lastMsgTime = 0, lastMsgText = "", messagesCache = [], totalMsgCount = 0;

    document.getElementById('autoscroll-btn').onclick = () => {
      autoScroll = !autoScroll;
      document.getElementById('autoscroll-btn').innerText = `📜 Scroll: ${autoScroll ? 'ON' : 'OFF'}`;
    };

    document.getElementById('clear-btn').onclick = () => document.getElementById('chat').innerHTML = '';

    // Character Counter
    const msgInput = document.getElementById('msg');
    msgInput.oninput = () => document.getElementById('char-count').innerText = `${msgInput.value.length}/150`;

    // Emoji Bar Insertion
    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.onclick = () => { msgInput.value += btn.innerText; msgInput.focus(); document.getElementById('char-count').innerText = `${msgInput.value.length}/150`; };
    });

    // Export Log Utility
    document.getElementById('export-btn').onclick = () => {
      const blob = new Blob([messagesCache.map(m => `[${m.time}] ${m.u}: ${m.m}`).join('\n')], { type: 'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'cosmic-chat-log.txt'; a.click();
    };

    // Filter Search Input
    document.getElementById('chat-search').oninput = (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.chat-msg').forEach(el => {
        el.style.display = el.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
      });
    };

    // Firebase Core Connection
    try {
      firebase.initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" });
      const db = firebase.database().ref("global_chat");

      document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const now = Date.now();
        const u = document.getElementById('user').value.trim();
        const m = msgInput.value.trim();

        // Anti-spam Rate Limiter & Duplicate Protection
        if (now - lastMsgTime < 1200) return alert("Slow down! Anti-spam active.");
        if (m === lastMsgText) return alert("Duplicate message prevented.");

        if (u && m) {
          db.push({ u, m, t: Date.now() });
          lastMsgTime = now;
          lastMsgText = m;
          if (/space|love|fire|star/i.test(m)) confetti({ particleCount: 40, spread: 60 });
          msgInput.value = '';
          document.getElementById('char-count').innerText = '0/150';
        }
      };

      db.limitToLast(20).on("child_added", snap => {
        const d = snap.val();
        const timeStr = new Date(d.t || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        messagesCache.push({ u: d.u, m: d.m, time: timeStr });

        totalMsgCount++;
        document.getElementById('msg-counter').innerText = `💬 Messages: ${totalMsgCount}`;

        const div = document.createElement('div');
        div.className = 'chat-msg';
        const initial = d.u.charAt(0).toUpperCase();

        // Copy on Click
        div.onclick = () => {
          navigator.clipboard.writeText(`${d.u}: ${d.m}`);
        };
        div.title = "Click to copy message";

        div.innerHTML = `
          <div class="avatar">${initial}</div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
              <b>${d.u}</b>
              <span style="font-size:0.65rem; color:#888;">${timeStr}</span>
            </div>
            <div>${d.m}</div>
          </div>
        `;

        const box = document.getElementById('chat');
        box.appendChild(div);
        if (autoScroll) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
      });
    } catch (err) {
      document.getElementById('status').innerText = '● Offline Mode';
    }
  </script>
</body>
</html>
