<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Real Lives</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
#app{width:100%;max-width:480px;min-height:100vh;background:#16213e;padding:16px;position:relative;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:2px solid #0f3460;margin-bottom:12px}
.header h1{font-size:20px;font-weight:700;color:#e94560;letter-spacing:1px}
.header .age{font-size:18px;background:#0f3460;padding:4px 14px;border-radius:20px;color:#fff}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:#1a1a40;padding:8px 12px;border-radius:8px;border-left:4px solid #e94560;display:flex;justify-content:space-between;align-items:center}
.stat-card .label{font-size:12px;color:#aaa;text-transform:uppercase;font-weight:600}
.stat-card .value{font-size:16px;font-weight:700;color:#fff}
.stat-bar{height:4px;background:#2a2a4a;border-radius:2px;margin-top:3px;overflow:hidden}
.stat-bar .fill{height:100%;border-radius:2px;transition:width .3s}
.fill-health{background:#e94560}
.fill-happiness{background:#f5a623}
.fill-intelligence{background:#4ecdc4}
.fill-wealth{background:#ffd93d}
.fill-fitness{background:#6bcb77}
.fill-social{background:#a29bfe}
.fill-career{background:#fd79a8}
.fill-spirit{background:#fdcb6e}
.event-area{background:#0f3460;border-radius:12px;padding:14px;min-height:120px;margin-bottom:12px;display:flex;flex-direction:column;justify-content:center}
.event-area .event-title{font-size:16px;font-weight:700;color:#e94560;margin-bottom:6px}
.event-area .event-desc{font-size:14px;color:#ccc;line-height:1.5;margin-bottom:10px}
.event-area .event-choice{display:flex;gap:8px;flex-wrap:wrap}
.event-area .event-choice button{flex:1;min-width:80px;background:#1a1a40;border:1px solid #2a2a5a;color:#fff;padding:8px 6px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.event-area .event-choice button:active{transform:scale(.96);background:#2a2a5a}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.action-btn{background:#0f3460;border:none;color:#fff;padding:10px 0;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.action-btn:active{transform:scale(.94);background:#1a4a7a}
.action-btn .icon{font-size:20px;display:block;margin-bottom:2px}
.log-area{background:#0a0a1a;border-radius:8px;padding:8px 10px;max-height:140px;overflow-y:auto;flex:1;min-height:80px;font-size:12px;color:#888;border:1px solid #1a1a3a}
.log-area .log-entry{padding:3px 0;border-bottom:1px solid #111;color:#bbb}
.log-area .log-entry .year{color:#e94560;font-weight:700;margin-right:6px}
.footer{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #1a1a3a}
.footer button{flex:1;background:#0f3460;border:none;color:#fff;padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.footer button:active{transform:scale(.95)}
.footer .save-btn{background:#1a6a3a}
.footer .load-btn{background:#6a3a1a}
.footer .reset-btn{background:#6a1a2a}
.dead-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;border-radius:12px;padding:30px;text-align:center}
.dead-overlay h2{font-size:32px;color:#e94560;margin-bottom:10px}
.dead-overlay p{font-size:16px;color:#ccc;margin-bottom:20px;line-height:1.6}
.dead-overlay .stats-final{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:300px;margin-bottom:20px}
.dead-overlay .stats-final div{background:#1a1a40;padding:6px 10px;border-radius:4px;display:flex;justify-content:space-between;font-size:13px}
.dead-overlay .restart-btn{background:#e94560;border:none;color:#fff;padding:14px 40px;border-radius:30px;font-size:18px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0a1a}
::-webkit-scrollbar-thumb{background:#2a2a5a;border-radius:2px}
@media(max-width:400px){#app{padding:10px}.stat-card{padding:6px 8px;font-size:11px}.action-btn{font-size:10px;padding:8px 0}}
@media(min-width:481px){#app{max-width:600px;border-radius:16px;margin:10px}}
</style>
</head>
<body>
<div id="app">
<div class="header"><h1>REAL LIVES</h1><span class="age" id="ageDisplay">Age: 0</span></div>
<div class="stats-grid" id="statsGrid"></div>
<div class="event-area" id="eventArea"><div class="event-title">Welcome</div><div class="event-desc">Your life begins. Make choices wisely.</div><div class="event-choice"><button data-choice="start">Begin Journey</button></div></div>
<div class="action-grid" id="actionGrid"><button class="action-btn" data-action="work"><span class="icon">💼</span>Work</button><button class="action-btn" data-action="study"><span class="icon">📚</span>Study</button><button class="action-btn" data-action="social"><span class="icon">🤝</span>Social</button><button class="action-btn" data-action="exercise"><span class="icon">🏃</span>Exercise</button><button class="action-btn" data-action="rest"><span class="icon">😴</span>Rest</button><button class="action-btn" data-action="invest"><span class="icon">💰</span>Invest</button><button class="action-btn" data-action="family"><span class="icon">👨‍👩‍👦</span>Family</button><button class="action-btn" data-action="next"><span class="icon">⏭️</span>Next Year</button></div>
<div class="log-area" id="logArea"><div class="log-entry"><span class="year">[0]</span>Welcome to Real Lives.</div></div>
<div class="footer"><button class="save-btn" id="saveBtn">💾 Save</button><button class="load-btn" id="loadBtn">📂 Load</button><button class="reset-btn" id="resetBtn">🔄 Reset</button></div>
<div class="dead-overlay hidden" id="deadOverlay"><h2>💀 GAME OVER</h2><p id="deathMessage">Your life has ended.</p><div class="stats-final" id="finalStats"></div><button class="restart-btn" id="restartBtn">🔄 Start New Life</button></div>
</div>
<script>
(function(){'use strict';
const FIREBASE_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
let state=null;
let eventQueue=[];
let turnLock=false;
const STAT_KEYS=['health','happiness','intelligence','wealth','fitness','social','career','spirit'];
const STAT_LABELS={health:'❤️ Health',happiness:'😊 Happiness',intelligence:'🧠 Intelligence',wealth:'💰 Wealth',fitness:'💪 Fitness',social:'👥 Social',career:'📈 Career',spirit:'✨ Spirit'};
const CAREERS=['Unemployed','Retail Worker','Office Clerk','Teacher','Nurse','Engineer','Doctor','Lawyer','Artist','Scientist','CEO','Professor','Architect','Chef','Pilot','Journalist'];
const EVENTS=[
{minAge:0,maxAge:5,title:'Childhood',desc:'You learn to walk and talk.',effects:{health:2,happiness:3,intelligence:2,social:1}},
{minAge:6,maxAge:12,title:'School Days',desc:'You start elementary school.',effects:{intelligence:4,social:3,happiness:2},choices:['Make friends','Study hard','Play sports']},
{minAge:13,maxAge:17,title:'Teen Years',desc:'High school is challenging.',effects:{social:3,intelligence:3,fitness:2},choices:['Focus on grades','Join clubs','Part-time job']},
{minAge:18,maxAge:22,title:'College',desc:'Higher education awaits.',effects:{intelligence:5,social:3,career:4},choices:['STEM major','Arts major','Business major']},
{minAge:23,maxAge:30,title:'Early Career',desc:'Building your professional life.',effects:{career:5,wealth:4,social:2},choices:['Climb corporate','Start business','Work abroad']},
{minAge:31,maxAge:45,title:'Mid Life',desc:'Family and career peak.',effects:{career:4,wealth:5,health:-2,happiness:3},choices:['Focus family','Focus career','Balance both']},
{minAge:46,maxAge:60,title:'Late Career',desc:'Experience and wisdom.',effects:{career:3,wealth:4,intelligence:3,health:-3},choices:['Mentor others','Semi-retire','Change career']},
{minAge:61,maxAge:75,title:'Retirement',desc:'Golden years begin.',effects:{happiness:4,social:3,health:-4,wealth:-2},choices:['Travel','Volunteer','Hobbies']},
{minAge:76,maxAge:100,title:'Elder Years',desc:'Reflection and legacy.',effects:{health:-6,social:2,happiness:2,intelligence:2},choices:['Write memoir','Teach youth','Rest']}
];
const RANDOM_EVENTS=[
{title:'Windfall',desc:'You receive an unexpected inheritance.',effects:{wealth:8},prob:.3},
{title:'Accident',desc:'You have a minor accident.',effects:{health:-4,fitness:-3},prob:.25},
{title:'Romance',desc:'You meet a special someone.',effects:{happiness:6,social:5},prob:.2},
{title:'Illness',desc:'You catch a seasonal illness.',effects:{health:-5,fitness:-3},prob:.3},
{title:'Promotion',desc:'You get a promotion at work!',effects:{career:5,wealth:6,happiness:4},prob:.15},
{title:'Friendship',desc:'You make a lifelong friend.',effects:{social:5,happiness:4},prob:.25},
{title:'Loss',desc:'You experience a personal loss.',effects:{happiness:-6,social:-3,spirit:2},prob:.15},
{title:'Discovery',desc:'You discover a new passion.',effects:{happiness:5,intelligence:3,spirit:4},prob:.2},
{title:'Financial Gain',desc:'Your investments pay off.',effects:{wealth:7},prob:.1},
{title:'Setback',desc:'You face a financial setback.',effects:{wealth:-5,happiness:-3},prob:.15}
];
function createInitialState(){return{age:0,gender:Math.random()>.5?'Male':'Female',name:'',health:50,happiness:50,intelligence:40,wealth:30,fitness:50,social:40,career:20,spirit:30,alive:true,careerIndex:0,education:0,relationships:{friends:0,partner:false,children:0},lifeEvents:[],yearLog:[],saved:false}}
function clamp(v,min,max){return Math.min(Math.max(v,min),max)}
function random(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function getStat(state,k){return state[k]||0}
function setStat(state,k,v){state[k]=clamp(Math.round(v),0,100)}
function modifyStat(state,k,delta){setStat(state,k,getStat(state,k)+delta)}
function getAgeGroup(age){if(age<=5)return 0;if(age<=12)return 1;if(age<=17)return 2;if(age<=22)return 3;if(age<=30)return 4;if(age<=45)return 5;if(age<=60)return 6;if(age<=75)return 7;return 8}
function getCareerName(index){return CAREERS[index]||CAREERS[0]}
function renderStats(s){const grid=document.getElementById('statsGrid');grid.innerHTML='';STAT_KEYS.forEach(k=>{const v=getStat(s,k);const pct=Math.round(v);const colorClass='fill-'+k;const div=document.createElement('div');div.className='stat-card';div.innerHTML='<span class="label">'+STAT_LABELS[k]+'</span><span class="value">'+pct+'%</span><div class="stat-bar"><div class="fill '+colorClass+'" style="width:'+pct+'%"></div></div>';grid.appendChild(div)});document.getElementById('ageDisplay').textContent='Age: '+s.age}
function renderLog(s){const log=document.getElementById('logArea');log.innerHTML='';const entries=s.yearLog.slice(-15);entries.forEach(e=>{const div=document.createElement('div');div.className='log-entry';div.innerHTML='<span class="year">['+e.year+']</span>'+e.text;log.appendChild(div)});log.scrollTop=log.scrollHeight}
function renderEvent(title,desc,choices,callback){const area=document.getElementById('eventArea');area.innerHTML='<div class="event-title">'+title+'</div><div class="event-desc">'+desc+'</div>';const choiceDiv=document.createElement('div');choiceDiv.className='event-choice';if(choices&&choices.length){choices.forEach((c,i)=>{const btn=document.createElement('button');btn.textContent=c;btn.dataset.choice=i;btn.addEventListener('click',()=>{if(turnLock)return;callback(i)});choiceDiv.appendChild(btn)})}else{const btn=document.createElement('button');btn.textContent='Continue';btn.dataset.choice='continue';btn.addEventListener('click',()=>{if(turnLock)return;callback(0)});choiceDiv.appendChild(btn)}area.appendChild(choiceDiv)}
function addLog(s,text){s.yearLog.push({year:s.age,text:text});if(s.yearLog.length>50)s.yearLog.shift();renderLog(s)}
function processLifeEvent(s){const group=getAgeGroup(s.age);const base=EVENTS[group];if(base&&s.age%3===0){let choices=base.choices||['Continue'];renderEvent(base.title,base.desc,choices,(idx)=>{Object.keys(base.effects||{}).forEach(k=>{modifyStat(s,k,base.effects[k])});if(choices.length>1){addLog(s,'Chose: '+choices[idx]);if(idx===0)modifyStat(s,'intelligence',3);else if(idx===1)modifyStat(s,'social',3);else if(idx===2)modifyStat(s,'wealth',3)}else{addLog(s,base.title+' - '+base.desc)}s.age+=1;applyAging(s);checkRandomEvent(s);renderStats(s);if(s.alive)renderEvent('Year '+s.age,'Another year passes. Choose your action.',['Continue'],()=>{})});return true}return false}
function checkRandomEvent(s){if(Math.random()<.3&&s.age>5){const ev=pick(RANDOM_EVENTS);if(Math.random()<ev.prob){Object.keys(ev.effects||{}).forEach(k=>{modifyStat(s,k,ev.effects[k])});addLog(s,'⚡ '+ev.title+': '+ev.desc);return true}}return false}
function applyAging(s){const age=s.age;if(age>70){modifyStat(s,'health',-3);modifyStat(s,'fitness',-2)}else if(age>50){modifyStat(s,'health',-2);modifyStat(s,'fitness',-1)}else if(age>30){modifyStat(s,'health',-1)}if(age>18&&s.relationships.partner===false&&Math.random()<.05){s.relationships.partner=true;addLog(s,'💕 Found a life partner!')}if(age>25&&s.relationships.children<3&&s.relationships.partner&&Math.random()<.03){s.relationships.children+=1;addLog(s,'👶 Welcomed a child!')}if(age>80&&Math.random()<.15){s.alive=false;addLog(s,'💀 Passed away at age '+s.age);return}if(getStat(s,'health')<=0||getStat(s,'happiness')<=0){s.alive=false;addLog(s,'💀 Life ended due to health or happiness reaching zero');return}if(age>110){s.alive=false;addLog(s,'💀 Reached the end of natural life')}}
function applyAction(s,action){if(!s.alive||turnLock)return;turnLock=true;let msg='';let choices=[];switch(action){case'work':if(s.age<16){msg='Too young to work.';break}const earn=5+Math.floor(getStat(s,'career')/10);modifyStat(s,'wealth',earn);modifyStat(s,'career',2);modifyStat(s,'happiness',-1);modifyStat(s,'fitness',-2);msg='Worked and earned $'+earn+'k.';if(Math.random()<.1){modifyStat(s,'wealth',3);msg+=' Bonus!']}break;case'study':if(s.age<6){msg='Too young to study.';break}modifyStat(s,'intelligence',4);modifyStat(s,'career',2);modifyStat(s,'happiness',-1);modifyStat(s,'social',-1);if(Math.random()<.05){modifyStat(s,'intelligence',5);msg='Studied hard! Major breakthrough.'}else msg='Studied and gained knowledge.';break;case'social':modifyStat(s,'social',5);modifyStat(s,'happiness',4);modifyStat(s,'health',1);if(Math.random()<.1){modifyStat(s,'social',3);msg='Made a great new friend!']}else msg='Socialized and connected with others.';break;case'exercise':modifyStat(s,'fitness',6);modifyStat(s,'health',4);modifyStat(s,'happiness',2);if(Math.random()<.05){modifyStat(s,'fitness',5);msg='Personal best! Feeling great.']}else msg='Exercised and improved fitness.';break;case'rest':modifyStat(s,'health',5);modifyStat(s,'happiness',3);modifyStat(s,'fitness',2);msg='Rested and recovered.';break;case'invest':if(getStat(s,'wealth')<10){msg='Not enough wealth to invest.';break}const risk=Math.random();if(risk<.4){const gain=Math.floor(getStat(s,'wealth')*.15);modifyStat(s,'wealth',gain);msg='Investment grew! +$'+gain+'k.'}else if(risk<.7){const loss=Math.floor(getStat(s,'wealth')*.08);modifyStat(s,'wealth',-loss);msg='Investment lost $'+loss+'k.'}else{const big=Math.floor(getStat(s,'wealth')*.3);modifyStat(s,'wealth',big);msg='Great investment! +$'+big+'k.'}break;case'family':if(s.relationships.partner){modifyStat(s,'happiness',4);modifyStat(s,'social',3);if(s.relationships.children>0){modifyStat(s,'happiness',2);msg='Spent quality time with family.'}else msg='Strengthened relationship with partner.'}else{modifyStat(s,'social',2);modifyStat(s,'happiness',1);msg='Reached out to relatives.'}break;case'next':s.age+=1;applyAging(s);checkRandomEvent(s);renderStats(s);turnLock=false;if(!s.alive){showDeath(s);return}if(!processLifeEvent(s)){renderEvent('Year '+s.age,'Another year passes. Choose your action.',['Continue'],()=>{})}return}if(msg){addLog(s,'▶ '+msg)}renderStats(s);turnLock=false;if(s.alive){if(!processLifeEvent(s)){renderEvent('Year '+s.age,'Choose your next action.',['Continue'],()=>{})}}else{showDeath(s)}}
function showDeath(s){const overlay=document.getElementById('deadOverlay');overlay.classList.remove('hidden');document.getElementById('deathMessage').textContent='You lived to age '+s.age+'. Your journey is complete.';const final=document.getElementById('finalStats');final.innerHTML='';STAT_KEYS.forEach(k=>{const div=document.createElement('div');div.innerHTML='<span>'+STAT_LABELS[k]+'</span><span>'+Math.round(getStat(s,k))+'%</span>';final.appendChild(div)});const log=document.getElementById('logArea');addLog(s,'🏁 Life completed at age '+s.age)}
function resetGame(){if(confirm('Start a new life? Current progress will be lost.')){state=createInitialState();document.getElementById('deadOverlay').classList.add('hidden');renderStats(state);addLog(state,'New life started.');renderEvent('Welcome','Your new life begins. Make your first choice.',['Begin'],()=>{state.age=1;addLog(state,'First year begins.');renderStats(state);renderEvent('Year 1','Choose your first action.',['Continue'],()=>{})})}}
function saveGame(){if(!state||!state.alive){alert('Cannot save: No active life.');return}try{const data=JSON.stringify(state);const url=FIREBASE_URL+'/save.json';fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:data}).then(r=>r.json()).then(()=>{addLog(state,'💾 Game saved successfully.');alert('Game saved!')}).catch(()=>{alert('Save failed. Check network.')})}catch(e){alert('Save error: '+e.message)}}
function loadGame(){try{const url=FIREBASE_URL+'/save.json';fetch(url).then(r=>{if(!r.ok)throw new Error('No save found');return r.json()}).then(data=>{if(!data||!data.age){alert('No valid save data found.');return}state=data;document.getElementById('deadOverlay').classList.add('hidden');renderStats(state);addLog(state,'📂 Game loaded successfully.');if(!state.alive){showDeath(state)}else{renderEvent('Loaded','Game restored. Continue your journey.',['Continue'],()=>{})}}).catch(()=>{alert('Load failed. No saved game found.')})}catch(e){alert('Load error: '+e.message)}}
function init(){state=createInitialState();renderStats(state);addLog(state,'Welcome to Real Lives.');renderEvent('Welcome','Your life simulation begins. Choose your first action.',['Start Life'],()=>{state.age=1;addLog(state,'Life begins at age 1.');renderStats(state);renderEvent('Year 1','Take your first action.',['Continue'],()=>{})});document.querySelectorAll('.action-btn').forEach(btn=>{btn.addEventListener('click',function(){const action=this.dataset.action;if(state&&state.alive)applyAction(state,action)})});document.getElementById('saveBtn').addEventListener('click',saveGame);document.getElementById('loadBtn').addEventListener('click',loadGame);document.getElementById('resetBtn').addEventListener('click',resetGame);document.getElementById('restartBtn').addEventListener('click',resetGame);document.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){const btns=document.querySelectorAll('.event-choice button');if(btns.length===1)btns[0].click()}})}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
})();
</script>
</body>
</html>
