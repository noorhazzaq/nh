<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>HTML Live Editor — Studio</title>
<style>
:root{
  --bg-0:#0d1117; --bg-1:#161b22; --bg-2:#1c2129; --bg-3:#21262d;
  --bg-4:#30363d; --border:#30363d; --border-soft:#21262d;
  --text-0:#e6edf3; --text-1:#8b949e; --text-2:#6e7681; --text-3:#484f58;
  --accent:#58a6ff; --accent-hi:#79c0ff; --accent-bg:rgba(88,166,255,.12);
  --success:#3fb950; --success-hi:#56d364; --danger:#f85149; --danger-hi:#ff7b72;
  --warning:#d29922;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --mono:'SF Mono','Consolas','Monaco','Menlo',monospace;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --transition:150ms cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg-0:#ffffff; --bg-1:#f6f8fa; --bg-2:#f0f3f6; --bg-3:#eaeef2;
  --bg-4:#d0d7de; --border:#d0d7de; --border-soft:#eaeef2;
  --text-0:#1f2328; --text-1:#656d76; --text-2:#8b949e; --text-3:#afb8c1;
  --accent:#0969da; --accent-hi:#0550ae; --accent-bg:rgba(9,105,218,.1);
  --success:#1a7f37; --success-hi:#2da44e; --danger:#cf222e; --danger-hi:#a40e26;
  --warning:#9a6700;
  --shadow-sm:0 1px 2px rgba(31,35,40,.08);
  --shadow-md:0 8px 24px rgba(31,35,40,.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg-0);color:var(--text-0);
  font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;
  border:none;cursor:pointer;outline:none;}
input,textarea{font-family:inherit;color:inherit;}
svg{display:block;flex-shrink:0;}
kbd{font-family:var(--mono);font-size:10px;background:var(--bg-3);color:var(--text-1);
  padding:2px 5px;border-radius:4px;border:1px solid var(--border);line-height:1.2;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm);}

/* ======= APP LAYOUT ======= */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

/* ======= TOPBAR ======= */
#topbar{display:flex;align-items:center;gap:6px;padding:8px 12px;
  background:var(--bg-1);border-bottom:1px solid var(--border);flex-shrink:0;min-height:52px;
  position:relative;z-index:50;}

/* Brand */
.brand{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);
  transition:background var(--transition);}
.brand:hover{background:var(--bg-3);}
.brand-bolt{width:22px;height:22px;background:linear-gradient(135deg,var(--accent),#a371f7);
  border-radius:6px;display:grid;place-items:center;font-size:13px;color:#fff;
  box-shadow:0 0 12px rgba(88,166,255,.35);}
.brand-name{font-weight:700;font-size:14px;letter-spacing:-0.2px;}
.brand-name em{color:var(--accent);font-style:normal;}
.brand-chev{color:var(--text-2);transition:transform var(--transition);}
.brand.open .brand-chev{transform:rotate(180deg);}

/* Center palette trigger */
.topbar-center{flex:1;display:flex;justify-content:center;padding:0 8px;}
.palette-btn{display:flex;align-items:center;gap:10px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 14px;
  color:var(--text-1);width:100%;max-width:420px;font-size:12.5px;
  transition:all var(--transition);}
.palette-btn:hover{background:var(--bg-3);border-color:var(--bg-4);color:var(--text-0);}
.palette-btn svg{color:var(--text-2);}
.palette-btn .lbl{flex:1;text-align:left;}

/* Actions */
.topbar-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius-sm);
  color:var(--text-1);transition:all var(--transition);border:1px solid transparent;}
.icon-btn:hover{background:var(--bg-3);color:var(--text-0);border-color:var(--border);}
.icon-btn:active{transform:scale(0.94);}
.icon-btn.small{width:26px;height:26px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--radius-sm);
  background:var(--bg-3);border:1px solid var(--border);color:var(--text-0);font-size:12.5px;
  font-weight:500;transition:all var(--transition);white-space:nowrap;}
.btn:hover{background:var(--bg-4);border-color:var(--text-3);}
.btn:active{transform:scale(0.97);}
.btn.primary{background:var(--success);border-color:var(--success);color:#fff;
  box-shadow:0 0 0 0 rgba(63,185,80,.5);}
.btn.primary:hover{background:var(--success-hi);border-color:var(--success-hi);}
.btn.primary:active{box-shadow:0 0 0 4px rgba(63,185,80,.15);}

/* Dropdown menus */
.menu-wrap{position:relative;}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg-1);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:5px;
  min-width:220px;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;
  transform:translateY(-4px);transition:all var(--transition);z-index:100;}
.dropdown.right{left:auto;right:0;}
.dropdown.open{opacity:1;visibility:visible;transform:translateY(0);}
.dropdown button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;
  border-radius:var(--radius-sm);color:var(--text-0);font-size:12.5px;text-align:left;
  transition:background var(--transition);}
.dropdown button:hover{background:var(--bg-3);}
.dropdown button svg{color:var(--text-1);}
.dropdown button .kbd-hint{margin-left:auto;font-family:var(--mono);font-size:10px;
  color:var(--text-2);background:var(--bg-3);padding:2px 5px;border-radius:4px;}
.dropdown .divider{height:1px;background:var(--border-soft);margin:4px 0;}
.dropdown button.danger{color:var(--danger);}
.dropdown button.danger svg{color:var(--danger);}
.dropdown button.danger:hover{background:rgba(248,81,73,.1);}

/* ======= TABS ======= */
#tabs{display:flex;align-items:center;background:var(--bg-1);
  border-bottom:1px solid var(--border);flex-shrink:0;padding:0 8px;gap:2px;}
.tab{display:flex;align-items:center;gap:7px;padding:10px 16px;color:var(--text-1);
  font-size:12.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;
  transition:all var(--transition);-webkit-user-select:none;user-select:none;margin-bottom:-1px;}
.tab:hover{color:var(--text-0);}
.tab.active{color:var(--text-0);border-bottom-color:var(--accent);}
.tab .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tab[data-lang="html"] .dot{background:#e34c26;}
.tab[data-lang="css"] .dot{background:#2965f1;}
.tab[data-lang="js"] .dot{background:#f7df1e;}
.tab .badge-live{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;
  background:var(--accent-bg);color:var(--accent);letter-spacing:0.5px;}
#tabs .spacer{flex:1;}

/* ======= MAIN ======= */
#main{flex:1;display:flex;overflow:hidden;min-height:0;position:relative;}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
#editorPane{flex:1 1 50%;background:var(--bg-0);}
#previewPane{flex:1 1 50%;background:var(--bg-1);}

/* Divider */
#divider{width:5px;background:var(--bg-1);cursor:col-resize;position:relative;
  flex-shrink:0;transition:background var(--transition);}
#divider::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:1px;height:34px;background:var(--border);border-radius:1px;
  transition:all var(--transition);}
#divider:hover,#divider.dragging{background:var(--accent-bg);}
#divider:hover::before,#divider.dragging::before{background:var(--accent);width:2px;height:50px;}

/* ======= EDITOR ======= */
#editorWrap{flex:1;display:flex;position:relative;overflow:hidden;min-height:0;}
#gutter{width:56px;background:var(--bg-0);color:var(--text-3);text-align:right;
  padding:14px 10px 14px 0;font-family:var(--mono);font-size:12.5px;line-height:1.6;
  overflow:hidden;user-select:none;border-right:1px solid var(--border-soft);flex-shrink:0;}
#gutter div{height:1.6em;padding-right:2px;}
#gutter div.active{color:var(--accent);background:var(--accent-bg);border-right:2px solid var(--accent);
  margin-right:-1px;}
#code{flex:1;background:var(--bg-0);color:var(--text-0);border:none;outline:none;resize:none;
  padding:14px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
  tab-size:2;white-space:pre;overflow:auto;caret-color:var(--accent);}
#code::placeholder{color:var(--text-3);}
#code.wrap{white-space:pre-wrap;word-wrap:break-word;}
#code::-webkit-scrollbar,#gutter::-webkit-scrollbar,
#consoleBody::-webkit-scrollbar{width:10px;height:10px;}
#code::-webkit-scrollbar-thumb,#gutter::-webkit-scrollbar-thumb,
#consoleBody::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:5px;
  border:2px solid var(--bg-0);}
#code::-webkit-scrollbar-thumb:hover{background:var(--text-3);}
#code::-webkit-scrollbar-track,#gutter::-webkit-scrollbar-track,
#consoleBody::-webkit-scrollbar-track{background:transparent;}

/* Status bar */
#statusbar{display:flex;align-items:center;gap:10px;padding:4px 14px;
  background:var(--bg-1);border-top:1px solid var(--border);font-size:11px;
  color:var(--text-2);flex-shrink:0;min-height:26px;font-family:var(--mono);}
#statusbar .sep{width:1px;height:12px;background:var(--border);}
#statusbar .spacer{flex:1;}
.save-indicator{display:flex;align-items:center;gap:5px;color:var(--text-2);
  transition:color var(--transition);}
.save-indicator.saving{color:var(--warning);}
.save-indicator.saved{color:var(--success);}
.save-indicator::before{content:'';width:6px;height:6px;border-radius:50%;
  background:currentColor;box-shadow:0 0 6px currentColor;}

/* ======= PREVIEW ======= */
#previewHeader{display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:var(--bg-1);border-bottom:1px solid var(--border);flex-shrink:0;min-height:40px;}
.preview-chrome{display:flex;gap:6px;padding-left:4px;}
.preview-chrome .dot{width:11px;height:11px;border-radius:50%;}
.preview-chrome .dot.red{background:#ff5f57;}
.preview-chrome .dot.yellow{background:#febc2e;}
.preview-chrome .dot.green{background:#28c840;}
.preview-title{font-size:11.5px;color:var(--text-2);font-family:var(--mono);
  padding:3px 12px;background:var(--bg-3);border-radius:20px;}
#previewHeader .spacer{flex:1;}
#previewHeader .actions{display:flex;gap:2px;}
#preview{flex:1;background:#fff;border:none;width:100%;min-height:0;}

/* Console */
#console{display:flex;flex-direction:column;background:var(--bg-0);
  border-top:1px solid var(--border);flex-shrink:0;overflow:hidden;
  height:0;transition:height var(--transition);}
#console.open{height:170px;}
#consoleHeader{display:flex;align-items:center;gap:2px;padding:4px 8px;
  background:var(--bg-1);border-bottom:1px solid var(--border-soft);flex-shrink:0;min-height:32px;}
.console-tab{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11.5px;
  color:var(--text-2);border-radius:var(--radius-sm);transition:all var(--transition);}
.console-tab:hover{background:var(--bg-3);color:var(--text-0);}
.console-tab.active{background:var(--bg-3);color:var(--text-0);font-weight:600;}
.console-tab .badge{font-size:10px;font-weight:700;min-width:16px;height:16px;padding:0 5px;
  display:grid;place-items:center;border-radius:8px;background:var(--bg-4);color:var(--text-1);}
.console-tab .badge.danger{background:var(--danger);color:#fff;box-shadow:0 0 8px rgba(248,81,73,.5);}
#consoleHeader .spacer{flex:1;}
#consoleBody{flex:1;overflow-y:auto;padding:8px 14px;font-family:var(--mono);font-size:12px;
  line-height:1.55;}
.log-line{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--border-soft);
  word-wrap:break-word;white-space:pre-wrap;align-items:flex-start;}
.log-line:last-child{border-bottom:none;}
.log-line .time{color:var(--text-3);font-size:10.5px;flex-shrink:0;padding-top:1px;}
.log-line .msg{flex:1;min-width:0;}
.log-line.log .msg{color:var(--text-0);}
.log-line.info .msg{color:var(--accent);}
.log-line.warn .msg{color:var(--warning);}
.log-line.error{background:rgba(248,81,73,.06);margin:2px -6px;padding:6px 6px;
  border-radius:4px;border-bottom:none;}
.log-line.error .msg{color:var(--danger-hi);}

/* ======= MOBILE NAV ======= */
#mobileNav{display:none;padding:6px;background:var(--bg-1);border-top:1px solid var(--border);
  gap:4px;flex-shrink:0;}
#mobileNav .seg{flex:1;padding:9px;font-size:12.5px;font-weight:500;
  color:var(--text-1);background:var(--bg-2);border-radius:var(--radius-sm);
  transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;}
#mobileNav .seg.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(88,166,255,.3);}

/* ======= OVERLAYS ======= */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:grid;place-items:center;opacity:0;visibility:hidden;
  transition:all var(--transition);z-index:200;padding:20px;}
.overlay.open{opacity:1;visibility:visible;}
.overlay .modal{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);width:100%;max-width:520px;max-height:85vh;
  overflow:hidden;display:flex;flex-direction:column;
  transform:scale(.96);transition:transform var(--transition);}
.overlay.open .modal{transform:scale(1);}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-header h3{font-size:14px;font-weight:600;}
.modal-body{padding:16px 18px;overflow-y:auto;}

/* Palette */
.palette-modal{max-width:560px;}
.palette-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--border);color:var(--text-1);}
.palette-input-wrap input{flex:1;background:none;border:none;outline:none;
  font-size:14px;color:var(--text-0);}
.palette-input-wrap input::placeholder{color:var(--text-3);}
.palette-list{max-height:380px;overflow-y:auto;padding:6px;}
.palette-item{display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-radius:var(--radius-sm);cursor:pointer;color:var(--text-0);
  transition:background var(--transition);font-size:13px;}
.palette-item:hover,.palette-item.selected{background:var(--accent-bg);}
.palette-item svg{color:var(--text-2);}
.palette-item.selected svg{color:var(--accent);}
.palette-item .kbd-hint{margin-left:auto;font-family:var(--mono);font-size:10px;
  color:var(--text-2);background:var(--bg-3);padding:2px 6px;border-radius:4px;}
.palette-empty{padding:30px;text-align:center;color:var(--text-2);font-size:13px;}

/* Settings drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:90vw;
  background:var(--bg-1);border-left:1px solid var(--border);box-shadow:var(--shadow-md);
  transform:translateX(100%);transition:transform 220ms cubic-bezier(.4,0,.2,1);
  z-index:210;display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-header{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.drawer-header h3{font-size:15px;font-weight:600;}
.drawer-body{padding:16px 20px;overflow-y:auto;flex:1;}
.setting{margin-bottom:20px;}
.setting:last-child{margin-bottom:0;}
.setting>label{display:block;font-size:12px;color:var(--text-1);margin-bottom:8px;
  font-weight:500;letter-spacing:.2px;}
.setting.switch-setting{display:flex;align-items:center;justify-content:space-between;}
.setting.switch-setting>label{margin-bottom:0;}

.segmented{display:flex;background:var(--bg-3);border-radius:var(--radius-sm);padding:3px;}
.segmented button{flex:1;padding:7px 10px;font-size:12px;color:var(--text-1);
  border-radius:5px;transition:all var(--transition);font-weight:500;}
.segmented button:hover{color:var(--text-0);}
.segmented button.active{background:var(--bg-0);color:var(--text-0);
  box-shadow:var(--shadow-sm);font-weight:600;}

.slider-wrap{display:flex;align-items:center;gap:12px;}
.slider-wrap input[type=range]{flex:1;-webkit-appearance:none;appearance:none;
  background:var(--bg-3);height:5px;border-radius:3px;outline:none;}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 0 3px var(--accent-bg);transition:all var(--transition);}
.slider-wrap input[type=range]::-webkit-slider-thumb:hover{background:var(--accent-hi);}
.slider-wrap input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;
  border-radius:50%;background:var(--accent);cursor:pointer;}
.slider-wrap span{font-family:var(--mono);font-size:11.5px;color:var(--text-1);
  min-width:48px;text-align:right;}

.switch{width:38px;height:22px;background:var(--bg-4);border-radius:11px;
  position:relative;transition:background var(--transition);flex-shrink:0;}
.switch span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform var(--transition);}
.switch[aria-checked="true"]{background:var(--success);}
.switch[aria-checked="true"] span{transform:translateX(16px);}

/* Shortcuts */
.shortcut-grid{padding:8px 18px 18px;display:flex;flex-direction:column;gap:2px;}
.shortcut{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);}
.shortcut:hover{background:var(--bg-2);}
.shortcut kbd{min-width:26px;text-align:center;}
.shortcut span{color:var(--text-1);font-size:12.5px;margin-left:auto;text-align:right;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);
  background:var(--bg-1);color:var(--text-0);padding:12px 20px;border-radius:var(--radius-md);
  font-size:13px;box-shadow:var(--shadow-md);border:1px solid var(--border);
  transition:transform 260ms cubic-bezier(.4,0,.2,1),opacity var(--transition);
  z-index:300;opacity:0;pointer-events:none;max-width:90vw;text-align:center;
  display:flex;align-items:center;gap:10px;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.success{border-color:var(--success);color:var(--success-hi);}
#toast.error{border-color:var(--danger);color:var(--danger-hi);}
#toast svg{flex-shrink:0;}

/* ======= RESPONSIVE ======= */
@media (max-width:820px){
  .topbar-center{display:none;}
  .brand-name{display:none;}
  #main{flex-direction:column;}
  #divider{display:none;}
  #mobileNav{display:flex;}
  .pane{flex:1 1 auto;width:100%;}
  #editorPane.hidden,#previewPane.hidden{display:none;}
  #console.open{height:150px;}
  #consoleBody{padding:8px 12px;}
  .palette-btn .kbd-hint{display:none;}
}
@media (max-width:480px){
  #topbar{padding:6px 8px;gap:4px;min-height:48px;}
  .brand{padding:4px 6px;}
  .brand-bolt{width:20px;height:20px;}
  .btn{padding:6px 10px;font-size:12px;}
  .btn .lbl-hide-xs{display:none;}
  .icon-btn{width:32px;height:32px;}
  .tab{padding:9px 10px;font-size:12px;}
  .tab .tab-label{display:none;}
  .tab .dot{width:10px;height:10px;}
  #gutter{width:40px;font-size:11.5px;padding-right:6px;}
  #code{font-size:12px;padding:10px;}
  #statusbar{padding:3px 10px;font-size:10.5px;}
  #statusbar .hide-xs{display:none;}
  .drawer{width:100%;}
  .preview-title{display:none;}
}
</style>
</head>
<body>

<div id="app" data-theme="dark">

  <!-- ========== TOPBAR ========== -->
  <header id="topbar">
    <div class="menu-wrap">
      <button class="brand" id="btnBrand" aria-haspopup="true" aria-expanded="false">
        <span class="brand-bolt">⚡</span>
        <span class="brand-name">HTML <em>Live</em></span>
        <svg class="brand-chev" width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="dropdown" id="brandMenu" role="menu">

/* ============================================================
   STATE
============================================================ */
const STORAGE_KEY = 'html-studio-v2';
let currentLang = 'html';
let files = { html: DEFAULT.html, css: DEFAULT.css, js: DEFAULT.js };
let settings = {
  theme: 'dark',
  fontSize: 12.5,
  tabSize: 2,
  wrap: false,
  autorun: true,
  delay: 350
};
let updateTimer = null;
let saveTimer = null;
let consoleLogs = [];
let consoleFilter = 'all';

/* ============================================================
   DOM REFS
============================================================ */
const $ = id => document.getElementById(id);
const codeEl = $('code');
const gutterEl = $('gutter');
const previewEl = $('preview');
const appEl = $('app');
const tabs = document.querySelectorAll('.tab');
const consoleEl = $('console');
const consoleBody = $('consoleBody');
const badgeAll = $('badgeAll');
const badgeErr = $('badgeErr');
const toastEl = $('toast');
const saveIndicator = $('saveIndicator');
const statusPos = $('statusPos');
const statusCount = $('statusCount');
const statusLang = $('statusLang');

/* ============================================================
   STORAGE
============================================================ */
function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ files, settings }));
  } catch (e) {}
}
function restore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.files) Object.assign(files, data.files);
    if (data.settings) Object.assign(settings, data.settings);
  } catch (e) {}
}
function markSaving() {
  saveIndicator.className = 'save-indicator saving';
  saveIndicator.textContent = 'Menulis…';
}
function markSaved() {
  saveIndicator.className = 'save-indicator saved';
  saveIndicator.textContent = 'Disimpan';
}

/* ============================================================
   EDITOR
============================================================ */
function updateGutter() {
  const lines = codeEl.value.split('\n').length;
  const activeLine = codeEl.value.substr(0, codeEl.selectionStart).split('\n').length;
  let html = '';
  for (let i = 1; i <= lines; i++) {
    html += '<div' + (i === activeLine ? ' class="active"' : '') + '>' + i + '</div>';
  }
  gutterEl.innerHTML = html;
  gutterEl.scrollTop = codeEl.scrollTop;
}
function updateStatus() {
  const val = codeEl.value;
  const pos = codeEl.selectionStart;
  const before = val.substr(0, pos);
  const line = before.split('\n').length;
  const col = pos - before.lastIndexOf('\n');
  statusPos.textContent = 'Ln ' + line + ', Col ' + col;
  statusCount.textContent = val.length + ' aksara';
  statusLang.textContent = currentLang.toUpperCase();
}
function syncScroll() { gutterEl.scrollTop = codeEl.scrollTop; }

function switchTab(lang) {
  files[currentLang] = codeEl.value;
  currentLang = lang;
  tabs.forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
  codeEl.value = files[lang];
  codeEl.scrollTop = 0;
  updateGutter();
  updateStatus();
  codeEl.focus();
}

/* ============================================================
   BUILD HTML + PREVIEW
============================================================ */
function buildHTML() {
  return `<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
${files.css}
</style>
</head>
<body>
${files.html}
<script>
(function(){
  const send = (type,args)=>{
    try{
      parent.postMessage({
        __editor:true, type:type,
        msg: Array.from(args).map(a=>{
          if(a===null) return 'null';
          if(a===undefined) return 'undefined';
          if(typeof a==='object'){
            try{return JSON.stringify(a,null,2);}catch(e){return String(a);}
          }
          return String(a);
        }).join(' ')
      },'*');
    }catch(e){}
  };
  ['log','warn','error','info'].forEach(t=>{
    const o = console[t];
    console[t] = function(){ send(t,arguments); o.apply(console,arguments); };
  });
  window.addEventListener('error',e=>send('error',[e.message+' (baris '+e.lineno+')']));
  window.addEventListener('unhandledrejection',e=>send('error',['Promise ditolak: '+(e.reason&&e.reason.message||e.reason)]));
})();
<\/script>
<script>
try {
${files.js}
} catch (e) {
  console.error(e.message);
}
<\/script>
</body>
</html>`;
}

function runNow() {
  clearTimeout(updateTimer);
  files[currentLang] = codeEl.value;
  clearConsole(false);
  try { previewEl.srcdoc = buildHTML(); } catch (e) { console.error(e); }
  persist();
}

function scheduleUpdate() {
  if (!settings.autorun) return;
  clearTimeout(updateTimer);
  updateTimer = setTimeout(runNow, settings.delay);
}
function scheduleSave() {
  markSaving();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { persist(); markSaved(); }, 700);
}

/* ============================================================
   CONSOLE
============================================================ */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !d.__editor) return;
  addLog(d.type, d.msg);
});

function addLog(type, msg) {
  consoleLogs.push({ type, msg, time: new Date() });
  renderConsole();
  updateConsoleBadges();
  if (type === 'error' && !consoleEl.classList.contains('open')) {
    // Optionally auto-open console on error
  }
}

function renderConsole() {
  const filtered = consoleFilter === 'all'
    ? consoleLogs
    : consoleLogs.filter(l => l.type === 'error');
  consoleBody.innerHTML = '';
  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:var(--text-3);padding:20px;text-align:center;font-size:12px;';
    empty.textContent = 'Tiada log buat masa ini.';
    consoleBody.appendChild(empty);
    return;
  }
  for (const log of filtered) {
    const line = document.createElement('div');
    line.className = 'log-line ' + (log.type === 'log' ? 'log' : log.type);
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = log.time.toTimeString().slice(0,8);
    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = log.msg;
    line.appendChild(time);
    line.appendChild(msg);
    consoleBody.appendChild(line);
  }
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

function updateConsoleBadges() {
  badgeAll.textContent = consoleLogs.length;
  const errs = consoleLogs.filter(l => l.type === 'error').length;
  badgeErr.textContent = errs;
  badgeErr.classList.toggle('danger', errs > 0);
}
function clearConsole(rerender = true) {
  consoleLogs = [];
  if (rerender) { renderConsole(); updateConsoleBadges(); }
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer = null;
function toast(msg, type = '') {
  toastEl.className = '';
  if (type) toastEl.classList.add(type);
  toastEl.innerHTML = (type === 'success' ? ICONS.check : type === 'error' ? ICONS.info : ICONS.info) +
    '<span>' + msg + '</span>';
  requestAnimationFrame(() => {
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  });
}

/* ============================================================
   ACTIONS
============================================================ */
function downloadHTML() {
  files[currentLang] = codeEl.value;
  const blob = new Blob([buildHTML()], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'halaman-saya.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Fail HTML dimuat turun', 'success');
}
function copyHTML() {
  files[currentLang] = codeEl.value;
  navigator.clipboard.writeText(buildHTML())
    .then(() => toast('HTML disalin ke papan keratan', 'success'))
    .catch(() => toast('Gagal menyalin', 'error'));
}
function importHTML() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html,.htm,text/html';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result);
      // Simple heuristic: put everything into html, keep css/js empty
      files.html = text;
      files.css = '';
      files.js = '';
      codeEl.value = files.html;
      currentLang = 'html';
      tabs.forEach(t => t.classList.toggle('active', t.dataset.lang === 'html'));
      updateGutter();
      runNow();
      toast('Fail diimport', 'success');
    };
    reader.readAsText(f);
  };
  input.click();
}
function clearAll() {
  if (!confirm('Kosongkan semua kod dan pulihkan contoh asal?')) return;
  files = { html: DEFAULT.html, css: DEFAULT.css, js: DEFAULT.js };
  codeEl.value = files[currentLang];
  updateGutter();
  runNow();
  toast('Editor dikosongkan', 'success');
}
function loadTemplate(key) {
  const t = TEMPLATES[key];
  if (!t) return;
  files = { html: t.html, css: t.css, js: t.js };
  codeEl.value = files[currentLang];
  updateGutter();
  runNow();
  toast('Templat dimuatkan', 'success');
}
function loadNew() {
  files = { html: '', css: '', js: '' };
  codeEl.value = '';
  updateGutter();
  runNow();
  toast('Fail baharu dicipta', 'success');
}

/* ============================================================
   SETTINGS UI
============================================================ */
function applySettings() {
  appEl.setAttribute('data-theme', settings.theme);
  codeEl.style.fontSize = settings.fontSize + 'px';
  gutterEl.style.fontSize = settings.fontSize + 'px';
  codeEl.style.tabSize = settings.tabSize;
  codeEl.classList.toggle('wrap', settings.wrap);

  // Update theme toggle icon
  document.querySelector('.icon-moon').style.display = settings.theme === 'dark' ? 'block' : 'none';
  document.querySelector('.icon-sun').style.display = settings.theme === 'light' ? 'block' : 'none';

  // Update segmented controls
  document.querySelectorAll('#segTheme button').forEach(b =>
    b.classList.toggle('active', b.dataset.value === settings.theme));
  document.querySelectorAll('#segTabSize button').forEach(b =>
    b.classList.toggle('active', b.dataset.value == settings.tabSize));

  // Sliders
  $('setFontSize').value = settings.fontSize;
  $('valFontSize').textContent = settings.fontSize + 'px';
  $('setDelay').value = settings.delay;
  $('valDelay').textContent = settings.delay + 'ms';

  // Switches
  $('setWrap').setAttribute('aria-checked', settings.wrap);
  $('setAutorun').setAttribute('aria-checked', settings.autorun);

  persist();
}

  { id:'tpl-game', label:'Templat: Permainan kecil', icon:'sparkle', fn: () => loadTemplate('game') }
];

let paletteSelected = 0;
let paletteItems = [];

function openPalette() {
  $('palette').classList.add('open');
  $('paletteInput').value = '';
  renderPalette('');
  setTimeout(() => $('paletteInput').focus(), 50);
}
function closePalette() { $('palette').classList.remove('open'); }

function renderPalette(query) {
  const q = query.toLowerCase().trim();
  paletteItems = COMMANDS.filter(c => c.label.toLowerCase().includes(q));
  paletteSelected = 0;
  const list = $('paletteList');
  list.innerHTML = '';
  if (!paletteItems.length) {
    list.innerHTML = '<div class="palette-empty">Tiada arahan sepadan.</div>';
    return;
  }
  paletteItems.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'palette-item' + (i === 0 ? ' selected' : '');
    el.innerHTML = ICONS[c.icon] + '<span>' + c.label + '</span>' +
      (c.kbd ? '<span class="kbd-hint">' + c.kbd + '</span>' : '');
    el.addEventListener('click', () => { closePalette(); c.fn(); });
    el.addEventListener('mousemove', () => {
      paletteSelected = i;
      list.querySelectorAll('.palette-item').forEach((x, j) =>
        x.classList.toggle('selected', j === i));
    });
    list.appendChild(el);
  });
}

function paletteNavigate(dir) {
  const items = $('paletteList').querySelectorAll('.palette-item');
  if (!items.length) return;
  paletteSelected = (paletteSelected + dir + items.length) % items.length;
  items.forEach((x, i) => x.classList.toggle('selected', i === paletteSelected));
  items[paletteSelected].scrollIntoView({ block: 'nearest' });
}

   OVERLAY / DRAWER HELPERS
============================================================ */
function openOverlay(id) { $(id).classList.add('open'); }
function closeOverlay(id) { $(id).classList.remove('open'); }
function openDrawer(id) { $(id).classList.add('open'); }
function closeDrawer(id) { $(id).classList.remove('open'); }

function toggleTheme() {
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  applySettings();
  toast('Tema: ' + (settings.theme === 'dark' ? 'Gelap' : 'Cerah'));
}
function toggleConsole() {
  consoleEl.classList.toggle('open');
}

/* ============================================================
   DROPDOWN MENU
============================================================ */
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  $('btnBrand').classList.remove('open');
}

/* ============================================================
   EVENT BINDINGS
============================================================ */
// Brand menu
$('btnBrand').addEventListener('click', e => {
  e.stopPropagation();
  const m = $('brandMenu');
  const isOpen = m.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen) { m.classList.add('open'); $('btnBrand').classList.add('open'); }
});
$('btnMore').addEventListener('click', e => {
  e.stopPropagation();
  const m = $('moreMenu');
  const isOpen = m.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen) m.classList.add('open');
});
document.addEventListener('click', () => closeAllDropdowns());

// Menu actions
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.action;
    closeAllDropdowns();
    if (a === 'new') loadNew();
    else if (a === 'import') importHTML();
    else if (a === 'download') downloadHTML();
    else if (a === 'copy') copyHTML();
    else if (a === 'clear') clearAll();
    else if (a === 'templates') { openPalette(); $('paletteInput').value = 'templat'; renderPalette('templat'); }
    else if (a === 'refresh') runNow();
    else if (a === 'console') toggleConsole();
    else if (a === 'shortcuts') openOverlay('shortcuts');
  });
});

// Tabs
tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.lang)));

// Editor events
codeEl.addEventListener('input', () => {
  files[currentLang] = codeEl.value;
  updateGutter();
  updateStatus();
  scheduleUpdate();
  scheduleSave();
});
codeEl.addEventListener('scroll', syncScroll);
codeEl.addEventListener('keyup', updateStatus);
codeEl.addEventListener('click', updateStatus);
codeEl.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    const sp = ' '.repeat(settings.tabSize);
    codeEl.value = codeEl.value.substring(0, s) + sp + codeEl.value.substring(en);
    codeEl.selectionStart = codeEl.selectionEnd = s + settings.tabSize;
    files[currentLang] = codeEl.value;
    updateGutter();
    scheduleUpdate();
    scheduleSave();
  }
});

// Topbar actions
$('btnRun').addEventListener('click', () => { runNow(); toast('Kod dijalankan', 'success'); });
$('btnTheme').addEventListener('click', toggleTheme);
$('btnSettings').addEventListener('click', () => openDrawer('settings'));
$('btnPalette').addEventListener('click', openPalette);

// Preview actions
$('btnRefresh').addEventListener('click', () => { runNow(); toast('Pratonton dimuat semula'); });
$('btnExternal').addEventListener('click', () => {
  files[currentLang] = codeEl.value;
  const blob = new Blob([buildHTML()], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 30000);
});
$('btnFullscreen').addEventListener('click', () => {
  const el = $('previewPane');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

// Console actions
$('btnClearConsole').addEventListener('click', () => { clearConsole(); });
$('btnCloseConsole').addEventListener('click', () => consoleEl.classList.remove('open'));
document.querySelectorAll('.console-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.console-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    consoleFilter = tab.dataset.filter;
    renderConsole();
  });
});

// Settings drawer
$('btnCloseSettings').addEventListener('click', () => closeDrawer('settings'));
$('segTheme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  settings.theme = b.dataset.value; applySettings();
});
$('segTabSize').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  settings.tabSize = parseInt(b.dataset.value, 10); applySettings();
});
$('setFontSize').addEventListener('input', e => {
  settings.fontSize = parseFloat(e.target.value); applySettings();
});
$('setDelay').addEventListener('input', e => {
  settings.delay = parseInt(e.target.value, 10); applySettings();
});
$('setWrap').addEventListener('click', () => {
  settings.wrap = !settings.wrap; applySettings();
});
$('setAutorun').addEventListener('click', () => {
  settings.autorun = !settings.autorun; applySettings();
});

// Shortcuts modal
$('btnCloseShortcuts').addEventListener('click', () => closeOverlay('shortcuts'));

// Palette
$('paletteInput').addEventListener('input', e => renderPalette(e.target.value));
$('paletteInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteNavigate(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); paletteNavigate(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const c = paletteItems[paletteSelected];
    if (c) { closePalette(); c.fn(); }
  }
});
$('palette').addEventListener('click', e => {
  if (e.target.id === 'palette') closePalette();
});

// Overlay backdrops
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => {
    if (e.target === o) o.classList.remove('open');
  });
});

// Global keyboard
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); runNow(); toast('Kod dijalankan', 'success'); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); downloadHTML(); return; }
  if (mod && e.key === '1') { e.preventDefault(); switchTab('html'); return; }
  if (mod && e.key === '2') { e.preventDefault(); switchTab('css'); return; }
  if (mod && e.key === '3') { e.preventDefault(); switchTab('js'); return; }
  if (mod && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleConsole(); return; }
  if (mod && e.key === ',') { e.preventDefault(); openDrawer('settings'); return; }
  if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
    const t = e.target;
    if (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA') {
      e.preventDefault(); openOverlay('shortcuts');
    }
  }
  if (e.key === 'Escape') {
    closeAllDropdowns();
    closePalette();
    closeOverlay('shortcuts');
    closeDrawer('settings');
  }
});
