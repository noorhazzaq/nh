function initState(){return{age:0,health:50,happiness:50,intelligence:40,wealth:30,fitness:50,social:40,career:20,spirit:30,law:50,crime:10,alive:true,partner:false,partnerName:'',children:0,childNames:[],careerIdx:0,education:0,prison:false,prisonYears:0,prisonSentence:0,prisonCrime:'',criminalRecord:[],lawsuits:[],log:[],waiting:false,turn:0,history:[],chatLog:[],gameStarted:false,savings:0,debt:0,educationLevel:'None',healthConditions:[],careerHistory:[]}}

function processEvent(){if(S.prison)return false;const g=ageGroup(S.age);const e=EVENTS[g];if(e&&S.age%2===0){const opts=e.opts||['Continue'];renderEvent(e.title,e.desc,opts,function(idx){if(S.waiting)return;S.waiting=true;Object.keys(e.eff||{}).forEach(k=>mod(S,k,e.eff[k]));if(opts.length>1){addLog('📌 Chose: '+opts[idx],'history');addHistory('Chose: '+opts[idx]);if(idx===0)mod(S,'intelligence',3);else if(idx===1)mod(S,'social',3);else if(idx===2)mod(S,'fitness',3)}else{addLog(e.title+' - '+e.desc,'event')}S.age++;applyAging();randomEvent();renderStats();S.waiting=false;if(!S.alive){showDeath();return}renderEvent('Year '+S.age,'Choose your path forward.',['Continue'],function(){S.waiting=false})});return true}return false}
function doCrime(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(S.prison){addLog('🚫 Cannot commit crime in prison.','crime');return}if(S.age<12){addLog('🚫 Too young for serious crime.','crime');return}const crimes=['Petty Theft','Fraud','Assault','Robbery','Burglary','Hacking'];const c=pick(crimes);const risk=Math.random();const lawBonus=get(S,'law')/100;const success=risk<.5+lawBonus*.2;if(success){const gain=rnd(2,15);mod(S,'wealth',gain);mod(S,'crime',6);mod(S,'law',-4);mod(S,'happiness',2);addLog('🔫 Committed '+c+' - Gained $'+gain+'k.','crime');addHistory('Committed '+c);if(get(S,'crime')>75&&Math.random()<.45){S.prison=true;S.prisonSentence=rnd(2,5);S.prisonCrime=c;mod(S,'law',-10);addLog('🔒 Arrested for '+c+'! Sentenced to '+S.prisonSentence+' years.','crime')}}else{mod(S,'law',-6);mod(S,'happiness',-5);mod(S,'crime',4);addLog('🚨 Failed '+c+' - Got caught!','crime');if(Math.random()<.65){S.prison=true;S.prisonSentence=rnd(1,4);S.prisonCrime=c;addLog('🔒 Sentenced to '+S.prisonSentence+' years for '+c+'!','crime')}}}
function doLaw(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(S.prison){addLog('🚫 Cannot practice law in prison.','law');return}const actions=['File Lawsuit','Report Crime','Community Service','Legal Advice','Court Case','Police Report'];const a=pick(actions);const success=Math.random()<.45+get(S,'law')/180;if(success){mod(S,'law',6);mod(S,'social',3);mod(S,'happiness',3);if(a==='File Lawsuit'||a==='Court Case'){const gain=rnd(2,10);mod(S,'wealth',gain);addLog('⚖️ '+a+' successful! Gained $'+gain+'k.','law')}else if(a==='Report Crime'){mod(S,'crime',-4);addLog('⚖️ '+a+' helped reduce crime.','law')}else{addLog('⚖️ '+a+' went well.','law')}addHistory('Legal: '+a)}else{mod(S,'law',-4);mod(S,'happiness',-3);addLog('⚖️ '+a+' failed.','law')}}
function doPrisonWork(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(!S.prison){addLog('🚫 Not in prison.','prison');return}mod(S,'happiness',-1);mod(S,'fitness',2);mod(S,'law',1);mod(S,'crime',-1);const earn=rnd(1,3);mod(S,'wealth',earn);addLog('🔧 Prison work - Earned $'+earn+'k. Good behavior noted.','prison');S.prisonSentence=Math.max(0,S.prisonSentence-1);if(S.prisonSentence<=0){S.prison=false;S.prisonCrime='';addLog('🔓 Released early for good behavior!','prison')}renderStats()}
function doPrisonEdu(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(!S.prison){addLog('🚫 Not in prison.','prison');return}mod(S,'intelligence',4);mod(S,'law',2);mod(S,'crime',-1);mod(S,'happiness',1);addLog('📖 Prison education - Gained knowledge.','prison');S.prisonSentence=Math.max(0,S.prisonSentence-1);if(S.prisonSentence<=0){S.prison=false;S.prisonCrime='';addLog('🔓 Released early for good behavior!','prison')}renderStats()}
function doParole(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(!S.prison){addLog('🚫 Not in prison.','prison');return}if(S.prisonSentence>3){addLog('🕊️ Parole denied - Sentence too long.','prison');return}const success=Math.random()<.3+get(S,'law')/200+get(S,'social')/200;if(success){S.prison=false;S.prisonCrime='';S.prisonSentence=0;addLog('🕊️ Granted parole! Released from prison.','prison');renderStats()}else{addLog('🕊️ Parole denied. Try again later.','prison')}}
function doCareerAction(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(S.prison){addLog('🚫 Cannot advance career in prison.','career');return}const paths=['Get Certified','Network','Apply Promotion','Switch Field','Start Side Business'];const p=pick(paths);const success=Math.random()<.35+get(S,'intelligence')/180+get(S,'career')/180;if(success){const idx=S.careerIdx;if(idx<CAREERS.length-1){S.careerIdx=Math.min(idx+1,CAREERS.length-1)}mod(S,'career',6);mod(S,'wealth',5);mod(S,'happiness',3);S.careerHistory.push({age:S.age,career:CAREERS[S.careerIdx]});addLog('📊 '+p+' - Career advanced to '+CAREERS[S.careerIdx]+'!','career');addHistory('Career: '+p+' -> '+CAREERS[S.careerIdx])}else{mod(S,'career',3);mod(S,'happiness',-1);addLog('📊 '+p+' - No progress.','career')}}
function showHistory(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}const h=S.history.length>0?S.history.slice(-15).map(h=>'• Age '+h.y+': '+h.t).join('<br>'):'No history yet.';renderEvent('📜 Life History',h,['Close'],function(){renderEvent('Year '+S.age,'Continue your journey.',['Continue'],function(){S.waiting=false})})}
function showFamily(){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}let info='👤 Partner: '+(S.partner?S.partnerName:'None')+'<br>👶 Children: '+(S.children>0?S.childNames.join(', '):'None')+'<br>👨‍👩‍👦 Family Status: '+(S.partner?'Married/Partnered':'Single');renderEvent('👨‍👩‍👦 Family',info,['Close'],function(){renderEvent('Year '+S.age,'Continue your journey.',['Continue'],function(){S.waiting=false})})}
function doAction(a){if(!S.gameStarted){addLog('⚠️ Start life first!','event');return}if(!S.alive||S.waiting)return;S.waiting=true;let msg='';let type='event';switch(a){case'work':if(S.age<14){msg='Too young to work.';S.waiting=false;break}if(S.prison){msg='Cannot work in prison.';S.waiting=false;break}const earn=4+Math.floor(get(S,'career')/8);mod(S,'wealth',earn);mod(S,'career',2);mod(S,'happiness',-1);mod(S,'fitness',-2);msg='Worked +$'+earn+'k.';if(Math.random()<.08){mod(S,'wealth',4);msg+=' Bonus!'}type='career';break;case'study':if(S.prison){msg='Cannot study effectively in prison.';S.waiting=false;break}if(S.age<5){msg='Too young.';S.waiting=false;break}mod(S,'intelligence',5);mod(S,'career',2);mod(S,'happiness',-1);mod(S,'social',-1);msg='Studied.';if(Math.random()<.04){mod(S,'intelligence',6);msg='Academic breakthrough!'}type='education';break;case'social':if(S.prison){mod(S,'social',1);mod(S,'happiness',1);msg='Prison socializing.';type='event';break}mod(S,'social',5);mod(S,'happiness',4);mod(S,'health',1);msg='Socialized.';if(Math.random()<.08){mod(S,'social',4);msg='Made a close friend!'}type='event';break;case'exercise':if(S.prison){mod(S,'fitness',3);mod(S,'health',2);msg='Prison workout.';type='fitness';break}mod(S,'fitness',6);mod(S,'health',4);mod(S,'happiness',2);msg='Exercised.';if(Math.random()<.04){mod(S,'fitness',5);msg='Fitness milestone!'}type='fitness';break;case'rest':mod(S,'health',5);mod(S,'happiness',3);mod(S,'fitness',2);msg='Rested and recovered.';type='event';break;case'invest':if(S.prison){msg='Cannot invest in prison.';S.waiting=false;break}if(get(S,'wealth')<8){msg='Need $8k to invest.';S.waiting=false;break}const r=Math.random();if(r<.35){const g=Math.floor(get(S,'wealth')*.15);mod(S,'wealth',g);msg='Invest +$'+g+'k.';type='finance'}else if(r<.65){const l=Math.floor(get(S,'wealth')*.06);mod(S,'wealth',-l);msg='Invest -$'+l+'k.';type='finance'}else{const b=Math.floor(get(S,'wealth')*.25);mod(S,'wealth',b);msg='Great investment +$'+b+'k!';type='finance'}break;case'crime':doCrime();S.waiting=false;renderStats();if(S.alive&&!S.prison&&!processEvent()){renderEvent('Year '+S.age,'Choose your action.',['Continue'],function(){S.waiting=false})}return;case'law':doLaw();S.waiting=false;renderStats();if(S.alive&&!S.prison&&!processEvent()){renderEvent('Year '+S.age,'Choose your action.',['Continue'],function(){S.waiting=false})}return;case'prison_work':doPrisonWork();S.waiting=false;renderStats();if(S.alive&&S.prison){renderEvent('🔒 Prison Life','Serve your time.',['Continue'],function(){S.waiting=false})}else if(S.alive&&!S.prison){processEvent()}return;case'prison_edu':doPrisonEdu();S.waiting=false;renderStats();if(S.alive&&S.prison){renderEvent('🔒 Prison Life','Serve your time.',['Continue'],function(){S.waiting=false})}else if(S.alive&&!S.prison){processEvent()}return;case'parole':doParole();S.waiting=false;renderStats();if(S.alive&&S.prison){renderEvent('🔒 Prison Life','Serve your time.',['Continue'],function(){S.waiting=false})}else if(S.alive&&!S.prison){processEvent()}return;case'career':doCareerAction();S.waiting=false;renderStats();if(S.alive&&!S.prison&&!processEvent()){renderEvent('Year '+S.age,'Choose your action.',['Continue'],function(){S.waiting=false})}return;case'history':showHistory();S.waiting=false;return;case'family':showFamily();S.waiting=false;return;case'chat':openChat();S.waiting=false;return;case'next':S.age++;applyAging();randomEvent();renderStats();S.waiting=false;if(!S.alive){showDeath();return}if(!processEvent()){renderEvent('Year '+S.age,'Choose your path.',['Continue'],function(){S.waiting=false})}return}if(msg){addLog('▶ '+msg,type)}renderStats();S.waiting=false;if(S.alive&&!S.prison){if(!processEvent()){renderEvent('Year '+S.age,'Choose your action.',['Continue'],function(){S.waiting=false})}}else if(S.alive&&S.prison){renderEvent('🔒 Prison Life','You are incarcerated. Serve your time.',['Continue'],function(){S.waiting=false})}else{showDeath()}}
function showDeath(){const o=document.getElementById('deadOverlay');o.className='dead-overlay show';const legacy=Math.round((get(S,'health')+get(S,'happiness')+get(S,'intelligence')+get(S,'wealth')+get(S,'social')+get(S,'career')+get(S,'spirit'))/7);document.getElementById('legacyScore').textContent='🏆 Legacy Score: '+legacy;document.getElementById('deathMessage').textContent='Lived to '+S.age+' years. Career: '+CAREERS[S.careerIdx]+' | Partner: '+(S.partner?S.partnerName:'None')+' | Children: '+S.children;const f=document.getElementById('finalStats');f.innerHTML='';STATS.forEach(k=>{const d=document.createElement('div');d.innerHTML='<span>'+LABELS[k]+'</span><span>'+Math.round(get(S,k))+'%</span>';f.appendChild(d)});addLog('🏁 Life completed at '+S.age,'event')}
function resetGame(){if(!confirm('Start a new life?'))return;S=initState();document.getElementById('deadOverlay').className='dead-overlay';renderStats();addLog('🔄 New life begins.','event');renderEvent('Welcome','Your complete life awaits.','Begin',function(){startLife()})}
function saveGame(){if(!S||!S.alive){alert('No active life.');return}try{const d=JSON.stringify(S);fetch(FIREBASE_URL+'/save.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:d}).then(r=>r.json()).then(()=>{addLog('💾 Game saved.','event');alert('Saved!')}).catch(()=>alert('Save failed.'))}catch(e){alert('Error: '+e.message)}}
function loadGame(){fetch(FIREBASE_URL+'/save.json').then(r=>{if(!r.ok)throw new Error('No save');return r.json()}).then(d=>{if(!d||!d.age){alert('No valid save.');return}S=d;S.gameStarted=true;document.getElementById('deadOverlay').className='dead-overlay';renderStats();addLog('📂 Game loaded.','event');if(!S.alive){showDeath()}else if(S.prison){renderEvent('🔒 Prison Life','You are incarcerated. Serve your time.','Continue',function(){S.waiting=false})}else{renderEvent('Loaded','Continue your journey.','Continue',function(){S.waiting=false})}}).catch(()=>alert('No save found.'))}
function openChat(){const m=document.getElementById('chatModal');m.classList.add('show');document.getElementById('chatInput').focus();renderChat()}
function closeChat(){document.getElementById('chatModal').classList.remove('show')}
function renderChat(){const g=document.getElementById('chatMessages');g.innerHTML='';const msgs=chatHistory.slice(-20);msgs.forEach(m=>{const d=document.createElement('div');d.className='msg'+(m.system?' system':'');d.innerHTML=(m.who?'<span class="who">'+m.who+':</span>':'')+m.text;g.appendChild(d)});g.scrollTop=g.scrollHeight}
function sendChat(){const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text)return;const responses=['That\'s interesting!','I agree with you.','Tell me more.','That\'s deep.','Really? Wow!','I see what you mean.','That makes sense.','You\'re right!','Interesting perspective.','I never thought of that.','That\'s cool!','Yeah, totally.','Hmm, good point.','I feel the same.','That\'s wild!','For real?','No way!','That\'s awesome.','I understand.','Keep going.'];const names=['Alex','Jordan','Taylor','Morgan','Riley','Avery','Quinn','Parker','Cameron','Logan'];chatHistory.push({who:'You',text:text,time:Date.now()});const reply=pick(responses);const name=pick(names);setTimeout(()=>{chatHistory.push({who:name,text:reply,time:Date.now()});renderChat();addLog('💬 Chat: '+name+' said "'+reply+'"','chat')},500+Math.random()*800);chatHistory.push({who:'System',text:'...',system:true,time:Date.now()});renderChat();inp.value='';if(S&&S.alive){addLog('💬 You: '+text,'chat');addHistory('Chat: '+text)}}
function startLife(){if(S.gameStarted)return;S.age=1;S.gameStarted=true;addLog('🌟 Life begins at age 1.','event');renderStats();renderEvent('Year 1','Your complete journey starts now. Choose your first action.',['Continue'],function(){S.waiting=false})}
function init(){S=initState();chatHistory=[{who:'System',text:'Welcome to the Social Hub. Connect with others.',system:true}];renderStats();addLog('🌟 Welcome to Real Lives Complete.','event');document.getElementById('beginBtn').onclick=startLife;document.querySelectorAll('.action-btn').forEach(b=>{b.onclick=function(){doAction(this.dataset.action)}});document.getElementById('saveBtn').onclick=saveGame;document.getElementById('loadBtn').onclick=loadGame;document.getElementById('resetBtn').onclick=resetGame;document.getElementById('restartBtn').onclick=resetGame;document.getElementById('chatToggleBtn').onclick=openChat;document.getElementById('chatCloseBtn').onclick=closeChat;document.getElementById('chatSendBtn').onclick=sendChat;document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter')sendChat()});document.addEventListener('click',function(e){const m=document.getElementById('chatModal');if(e.target===m)closeChat()})}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
})();
</script>
</body>
