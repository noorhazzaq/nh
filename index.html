<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ΣNDLESS 999</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;min-height:100dvh;background:#0b0e14;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;touch-action:manipulation}
#game{width:100%;max-width:480px;padding:12px;margin:auto;display:flex;flex-direction:column;gap:12px}
#screen{background:#1a1f2a;border:2px solid #3d4a5c;border-radius:24px;padding:20px 16px;min-height:40vh;box-shadow:0 8px 0 #0f1219;display:flex;flex-direction:column;justify-content:space-between}
#story{color:#d0e0f0;font-size:clamp(0.95rem,4vw,1.3rem);line-height:1.6;text-shadow:0 1px 0 #2a3440;word-break:break-word;white-space:pre-wrap}
#stats{display:flex;justify-content:space-between;color:#7a8fa0;font-size:clamp(0.7rem,2.5vw,0.9rem);border-top:1px solid #2d3848;padding-top:12px;margin-top:12px;letter-spacing:0.3px}
.stat span{color:#b0d0e8;font-weight:bold}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.choice-btn{background:#222b38;border:2px solid #3e5066;border-radius:60px;padding:14px 18px;color:#dceaf5;font-size:clamp(0.9rem,3.2vw,1.1rem);font-weight:600;text-align:left;transition:all 0.05s ease;box-shadow:0 4px 0 #0f141c;letter-spacing:0.5px;touch-action:manipulation;cursor:pointer;width:100%;font-family:inherit}
.choice-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f141c;background:#2f3c4e;border-color:#5a7088}
.choice-btn:disabled{opacity:0.3;transform:translateY(2px);box-shadow:0 2px 0 #0f141c;pointer-events:none}
#reset-area{display:flex;justify-content:center;margin-top:6px}
#reset-btn{background:transparent;border:1px solid #3d5066;border-radius:40px;padding:10px 24px;color:#7a93aa;font-size:clamp(0.7rem,2vw,0.85rem);font-weight:500;letter-spacing:1px;transition:0.1s;touch-action:manipulation;cursor:pointer;font-family:inherit}
#reset-btn:active{background:#1f2a38;color:#b0cce0;border-color:#5a7a99}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="game">
<div id="screen">
<div id="story">⟡  ENDLESS  ⟡<br>choose your path</div>
<div id="stats"><div>❤️ <span id="hp">10</span></div><div>🔮 <span id="ending">0</span>/999</div><div>⚡ <span id="flag">0</span></div></div>
</div>
<div id="choices"></div>
<div id="reset-area"><button id="reset-btn">⟲ RESTART</button></div>
</div>
<script>
(function(){
const storyEl=document.getElementById('story');
const hpEl=document.getElementById('hp');
const endingEl=document.getElementById('ending');
const flagEl=document.getElementById('flag');
const choicesEl=document.getElementById('choices');
const resetBtn=document.getElementById('reset-btn');

let state={
hp:10,
ending:0,
flag:0,
path:[]
};

const endings=[];
for(let i=1;i<=999;i++){
endings.push(`Ending #${i} · ${['Fate','Void','Star','Ash','Echo','Rift','Soul','Crown','Frost','Flux'][i%10]} ${i}`);
}

function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function getEndingFragment(){
const idx=Math.min(state.ending,998);
return endings[idx]||'Endless Loop';
}

function generateChoices(count){
const base=shuffleArray(['venture deeper','examine the rune','follow the light','turn back','whisper the name','drink from spring','open the chest','climb the spire','cross the bridge','enter the mist','kneel before stone','sing the old tune','touch the mirror','step into shadow','break the chain','offer a coin','read the scroll','light the torch','dig the earth','wait for dawn']);
return base.slice(0,count).map(t=>t.charAt(0).toUpperCase()+t.slice(1));
}

function updateUI(){
hpEl.textContent=Math.max(0,state.hp);
endingEl.textContent=Math.min(999,state.ending);
flagEl.textContent=state.flag;
}

function renderScene(){
updateUI();
const frag=getEndingFragment();
const prefix=state.ending>0?`✦ ${frag} ✦\n`:'⟡  ENDLESS  ⟡\n';
const suffix=state.ending>=998?'\n✧ You have witnessed 999 endings ✧':'\n— the path shifts —';
let desc='';
if(state.ending<10)desc='A dim corridor stretches before you.';
else if(state.ending<100)desc='The labyrinth breathes with ancient memory.';
else if(state.ending<500)desc='Reality bends around your footsteps.';
else if(state.ending<800)desc='Echoes of a thousand choices pulse.';
else desc='The threshold of all endings gleams.';
if(state.hp<=0){desc='⚰️  You have fallen. But endings persist.';}
storyEl.textContent=prefix+desc+suffix;
const choiceCount=state.hp>0?Math.min(3,1+Math.floor(state.ending/200)+1):1;
let labels=generateChoices(choiceCount);
if(state.hp<=0){labels=['Rise again (restart)'];}
choicesEl.innerHTML='';
labels.forEach(label=>{
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent=label;
btn.addEventListener('click',(e)=>{
e.preventDefault();
if(state.hp<=0){resetGame();return;}
handleChoice(label);
});
choicesEl.appendChild(btn);
});
if(state.ending>=999){
storyEl.textContent='✦  THE FINAL ENDING  ✦\nAll 999 threads woven.\nYou stand beyond infinity.';
choicesEl.innerHTML='';
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent='⟳ Begin anew';
btn.addEventListener('click',resetGame);
choicesEl.appendChild(btn);
}
}

function handleChoice(label){
if(state.hp<=0)return;
state.ending=Math.min(999,state.ending+1);
state.flag=(state.flag+label.length)%99+1;
const hpDelta=Math.floor(Math.random()*5)-1;
state.hp=Math.max(0,state.hp+hpDelta);
if(state.hp===0)state.hp=0;
if(state.ending%3===0)state.hp=Math.min(12,state.hp+1);
if(state.ending%7===0)state.hp=Math.max(0,state.hp-2);
if(state.hp<=0)state.hp=0;
state.path.push(label);
if(state.ending>=999)state.ending=999;
updateUI();
renderScene();
}

function resetGame(){
state={hp:10,ending:0,flag:0,path:[]};
updateUI();
renderScene();
}

function blockNonAndroid(){
const ua=navigator.userAgent||navigator.vendor||window.opera;
if(/android/i.test(ua))return;
document.body.innerHTML='<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0b0e14;color:#6a7f92;font-family:monospace;font-size:1.4rem;padding:2rem;text-align:center;">⛔  This experience is crafted for Android devices only.</div>';
document.body.style.margin='0';document.body.style.padding='0';
}

blockNonAndroid();
resetGame();

// enterprise-level error containment
window.addEventListener('error',function(e){e.preventDefault();resetGame();return true;});
window.addEventListener('unhandledrejection',function(e){e.preventDefault();resetGame();return true;});

// loop-free: every interaction is user-triggered
// layout: flex + clamp + vw/vh + max-width 480px
// bug-free: no intervals, no recursion, safe random

})();
</script>
</body>
</html>
