<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZACK THREADS</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #b400ff;
            --neon-cyan: #00ffd0;
            --neon-pink: #ff00aa;
            --neon-gold: #ffd700;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(10, 14, 30, 0.85);
            --theme-color: #00ffd0;
        }

        html, body {
            height: 100%;
            background: var(--dark-bg);
            color: #e0f0ff;
            font-family: 'Orbitron', 'Segoe UI', monospace;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                radial-gradient(circle at 20% 50%, rgba(180, 0, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 240, 255, 0.04) 0%, transparent 50%);
            background-size: 60px 60px, 60px 60px, 100% 100%, 100% 100%;
            z-index: 0;
            pointer-events: none;
            animation: gridPulse 8s infinite alternate ease-in-out;
        }

        @keyframes gridPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        body::after {
            content: '';
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-gold), var(--neon-cyan), transparent);
            box-shadow: 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-purple);
            z-index: 9999;
            pointer-events: none;
            opacity: 0.3;
            animation: scanLine 12s linear infinite;
        }

        @keyframes scanLine {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        .particle-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 5%; animation-duration: 18s; animation-delay: 0s; width: 3px; height: 3px; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
        .particle:nth-child(2) { left: 15%; animation-duration: 22s; animation-delay: 2s; width: 2px; height: 2px; background: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }
        .particle:nth-child(3) { left: 25%; animation-duration: 16s; animation-delay: 4s; width: 4px; height: 4px; background: var(--neon-purple); box-shadow: 0 0 12px var(--neon-purple); }
        .particle:nth-child(4) { left: 35%; animation-duration: 24s; animation-delay: 1s; width: 2px; height: 2px; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .particle:nth-child(5) { left: 45%; animation-duration: 20s; animation-delay: 3s; width: 5px; height: 5px; background: var(--neon-gold); box-shadow: 0 0 16px var(--neon-gold); }
        .particle:nth-child(6) { left: 55%; animation-duration: 26s; animation-delay: 5s; width: 3px; height: 3px; background: var(--neon-orange); box-shadow: 0 0 10px var(--neon-orange); }
        .particle:nth-child(7) { left: 65%; animation-duration: 19s; animation-delay: 7s; width: 4px; height: 4px; background: var(--neon-cyan); box-shadow: 0 0 12px var(--neon-cyan); }
        .particle:nth-child(8) { left: 75%; animation-duration: 23s; animation-delay: 9s; width: 2px; height: 2px; background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple); }
        .particle:nth-child(9) { left: 85%; animation-duration: 17s; animation-delay: 6s; width: 3px; height: 3px; background: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }
        .particle:nth-child(10) { left: 92%; animation-duration: 21s; animation-delay: 8s; width: 4px; height: 4px; background: var(--neon-gold); box-shadow: 0 0 14px var(--neon-gold); }
        .particle:nth-child(11) { left: 10%; animation-duration: 25s; animation-delay: 10s; width: 3px; height: 3px; background: var(--neon-orange); box-shadow: 0 0 10px var(--neon-orange); }
        .particle:nth-child(12) { left: 30%; animation-duration: 20s; animation-delay: 12s; width: 2px; height: 2px; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

        @keyframes floatParticle {
            0% { transform: translateY(110vh) scale(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1) rotate(720deg); opacity: 0; }
        }

        .sparkle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 208, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 170, 0.01) 0%, transparent 70%);
            animation: sparkleBg 12s infinite alternate ease-in-out;
        }

        @keyframes sparkleBg {
            0% { opacity: 0.2; }
            50% { opacity: 0.6; }
            100% { opacity: 0.2; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 1.5rem auto;
            padding: 1.8rem;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 240, 255, 0.2);
            border-radius: 28px;
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.08),
                0 0 60px rgba(180, 0, 255, 0.05),
                inset 0 0 30px rgba(0, 240, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: containerGlow 5s infinite alternate ease-in-out;
        }

        @keyframes containerGlow {
            0% { 
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.06), 0 0 40px rgba(180, 0, 255, 0.03), inset 0 0 20px rgba(0, 240, 255, 0.01);
                border-color: rgba(0, 240, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 50px rgba(0, 240, 255, 0.12), 0 0 100px rgba(180, 0, 255, 0.08), 0 0 150px rgba(255, 0, 170, 0.03), inset 0 0 40px rgba(0, 240, 255, 0.03);
                border-color: rgba(180, 0, 255, 0.25);
            }
            100% { 
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.06), 0 0 60px rgba(0, 240, 255, 0.06), inset 0 0 30px rgba(255, 215, 0, 0.01);
                border-color: rgba(255, 215, 0, 0.15);
            }
        }

        .header {
            text-align: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-gold), transparent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            animation: headerLine 5s infinite alternate ease-in-out;
        }

        @keyframes headerLine {
            0% { opacity: 0.2; transform: scaleX(0.7); }
            100% { opacity: 1; transform: scaleX(1.3); }
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease-in-out infinite, titleFlicker 4s infinite;
            display: inline-block;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header h1::before {
            content: '✦';
            position: absolute;
            left: -60px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-text-fill-color: initial;
            color: var(--neon-gold);
            font-size: 2rem;
            animation: sparkleIcon 2.5s infinite;
            text-shadow: 0 0 30px var(--neon-gold);
        }

        .header h1::after {
            content: '✦';
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-text-fill-color: initial;
            color: var(--neon-pink);
            font-size: 2rem;
            animation: sparkleIcon 2.5s infinite 1.25s;
            text-shadow: 0 0 30px var(--neon-pink);
        }

        @keyframes sparkleIcon {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1) rotate(0deg); }
            50% { opacity: 0.2; transform: translateY(-50%) scale(1.5) rotate(180deg); }
        }

        @keyframes titleFlicker {
            0%, 100% { opacity: 1; }
            2% { opacity: 0.85; }
            4% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 10px;
            color: rgba(0, 240, 255, 0.3);
            margin-top: 0.3rem;
            font-weight: 400;
            text-transform: uppercase;
            animation: subtitlePulse 4s infinite alternate ease-in-out;
        }

        @keyframes subtitlePulse {
            0% { opacity: 0.3; letter-spacing: 10px; }
            100% { opacity: 0.7; letter-spacing: 14px; }
        }

        .form-group {
            margin: 1.8rem 0;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.4rem;
            margin-bottom: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(0, 240, 255, 0.15);
            border-radius: 14px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 30px rgba(0, 240, 255, 0.03);
            transform: scale(1.01);
        }

        .form-group input::placeholder {
            color: rgba(0, 240, 255, 0.2);
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.12), rgba(180, 0, 255, 0.12));
            color: var(--neon-cyan);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            background-size: 300% 300%;
            animation: gradientShift 3s ease-in-out infinite;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), 0 0 80px rgba(180, 0, 255, 0.08);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: rgba(0, 240, 255, 0.02);
            color: rgba(0, 240, 255, 0.4);
            border-color: rgba(0, 240, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(0, 240, 255, 0.06);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.03);
        }

        .btn-gold {
            background: rgba(255, 215, 0, 0.08);
            color: var(--neon-gold);
            border-color: var(--neon-gold);
        }

        .btn-gold:hover {
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: var(--neon-pink);
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.5rem;
            text-shadow: 0 0 20px var(--neon-pink);
            animation: errorPulse 1s infinite alternate;
        }

        @keyframes errorPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .user-badge {
            text-align: center;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            letter-spacing: 3px;
            border: 1px solid rgba(0, 240, 255, 0.06);
            margin-bottom: 1.2rem;
        }

        .user-badge span {
            color: var(--neon-purple);
            text-shadow: 0 0 20px var(--neon-purple);
        }

        .thread-input {
            margin: 1.2rem 0;
        }

        .thread-input textarea {
            width: 100%;
            padding: 1rem 1.4rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(0, 240, 255, 0.1);
            border-radius: 14px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
            outline: none;
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
        }

        .thread-input textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.08), inset 0 0 25px rgba(0, 240, 255, 0.02);
            transform: scale(1.01);
        }

        .thread-input textarea::placeholder {
            color: rgba(0, 240, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        .thread-input .btn {
            margin-top: 0.8rem;
        }

        .threads-container {
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 240, 255, 0.06);
        }

        .threads-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .threads-header span {
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.25);
            text-transform: uppercase;
        }

        .threads-header .thread-count {
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            font-weight: 700;
        }

        .threads-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 0.3rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
            -webkit-overflow-scrolling: touch;
        }

        .threads-list::-webkit-scrollbar {
            width: 3px;
        }

        .threads-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .threads-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 10px;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .thread-item {
            padding: 1.2rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border-left: 3px solid var(--neon-cyan);
            transition: all 0.25s;
            animation: threadIn 0.35s ease-out;
            position: relative;
            overflow: hidden;
        }

        .thread-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.01), rgba(180, 0, 255, 0.01));
            pointer-events: none;
        }

        .thread-item:hover {
            transform: translateX(4px);
            border-left-color: var(--neon-purple);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.02);
        }

        @keyframes threadIn {
            0% { opacity: 0; transform: translateY(-12px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .thread-item .thread-author {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            font-weight: 700;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }

        .thread-item .thread-author::before {
            content: '◆ ';
            color: var(--neon-purple);
        }

        .thread-item .thread-content {
            font-size: 0.85rem;
            color: #e8f0ff;
            margin: 0.6rem 0;
            line-height: 1.8;
            word-break: break-word;
            position: relative;
            z-index: 1;
        }

        .thread-item .thread-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.2);
            margin-top: 0.6rem;
            position: relative;
            z-index: 1;
        }

        .thread-item .thread-actions {
            display: flex;
            gap: 1.2rem;
        }

        .thread-item .thread-actions button {
            background: none;
            border: none;
            color: rgba(0, 240, 255, 0.3);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
        }

        .thread-item .thread-actions button:hover {
            background: rgba(0, 240, 255, 0.04);
            transform: scale(1.05);
        }

        .thread-item .thread-actions .like-btn.liked {
            color: var(--neon-pink);
            text-shadow: 0 0 25px var(--neon-pink);
        }

        .thread-item .thread-actions .like-btn:hover {
            color: var(--neon-pink);
        }

        .thread-item .thread-actions .reply-btn:hover {
            color: var(--neon-purple);
        }

        .thread-item .replies-container {
            margin-top: 0.8rem;
            padding-left: 1.2rem;
            border-left: 1px solid rgba(180, 0, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .thread-item .reply-item {
            padding: 0.5rem 0;
            font-size: 0.7rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.02);
            animation: replyIn 0.25s ease-out;
        }

        @keyframes replyIn {
            0% { opacity: 0; transform: translateX(-8px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .thread-item .reply-item:last-child {
            border-bottom: none;
        }

        .thread-item .reply-item .reply-author {
            color: var(--neon-purple);
            text-shadow: 0 0 12px rgba(180, 0, 255, 0.1);
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 2px;
        }

        .thread-item .reply-item .reply-author::before {
            content: '↳ ';
        }

        .thread-item .reply-item .reply-text {
            color: #c0d0e8;
            margin-left: 0.5rem;
        }

        .thread-item .reply-item .reply-time {
            font-size: 0.45rem;
            color: rgba(0, 240, 255, 0.12);
            float: right;
        }

        .thread-item .reply-input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .thread-item .reply-input-group input {
            flex: 1;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(180, 0, 255, 0.1);
            border-radius: 10px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            outline: none;
            transition: all 0.2s;
        }

        .thread-item .reply-input-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(180, 0, 255, 0.06);
        }

        .thread-item .reply-input-group input::placeholder {
            color: rgba(0, 240, 255, 0.12);
            font-size: 0.5rem;
            letter-spacing: 2px;
        }

        .thread-item .reply-input-group button {
            padding: 0.5rem 1rem;
            background: rgba(180, 0, 255, 0.08);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            color: var(--neon-purple);
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 2px;
        }

        .thread-item .reply-input-group button:hover {
            background: rgba(180, 0, 255, 0.15);
            box-shadow: 0 0 25px rgba(180, 0, 255, 0.08);
            transform: scale(1.05);
        }

        .empty-threads {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(0, 240, 255, 0.08);
            font-size: 0.7rem;
            letter-spacing: 6px;
            border: 1px dashed rgba(0, 240, 255, 0.03);
            border-radius: 16px;
        }

        .empty-threads::before {
            content: '✦ ';
            color: var(--neon-gold);
            opacity: 0.2;
        }

        .empty-threads::after {
            content: ' ✦';
            color: var(--neon-gold);
            opacity: 0.2;
        }

        .status-bar {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 240, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.15);
            letter-spacing: 3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan);
            display: inline-block;
            animation: dotBlink 1.5s infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .exit-btn {
            background: rgba(255, 0, 170, 0.06);
            border: 1px solid rgba(255, 0, 170, 0.1);
            color: var(--neon-pink);
            padding: 0.4rem 1.2rem;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 2px;
        }

        .exit-btn:hover {
            background: rgba(255, 0, 170, 0.12);
            box-shadow: 0 0 25px rgba(255, 0, 170, 0.06);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .container { margin: 0.6rem; padding: 1.2rem; border-radius: 20px; }
            .header h1 { font-size: 2rem; letter-spacing: 4px; }
            .header h1::before, .header h1::after { display: none; }
            .thread-item { padding: 0.8rem; }
            .thread-item .thread-content { font-size: 0.75rem; }
            .form-group input { font-size: 0.8rem; padding: 0.8rem 1rem; }
            .btn { font-size: 0.7rem; padding: 0.8rem; }
        }

        @media (max-width: 400px) {
            .container { padding: 0.8rem; }
            .header h1 { font-size: 1.5rem; letter-spacing: 2px; }
            .subtitle { font-size: 0.55rem; letter-spacing: 5px; }
            .thread-item .thread-footer { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .thread-item .thread-actions { width: 100%; justify-content: space-around; }
            .thread-item .reply-input-group { flex-direction: column; }
            .thread-item .reply-input-group button { width: 100%; }
            .threads-header { flex-direction: column; gap: 0.3rem; align-items: flex-start; }
        }

        .container, .header, .thread-item, .btn, .form-group input, .thread-input textarea {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-perspective: 1000;
            perspective: 1000;
        }

        .threads-list {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="particle-field">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <div class="sparkle-overlay"></div>

    <!-- LOGIN PAGE -->
    <div class="container" id="loginPage">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ cyber social ◈</div>
        </div>
        <div class="form-group">
            <input type="text" id="loginUsername" placeholder="USERNAME" />
            <input type="password" id="loginPassword" placeholder="PASSWORD" />
            <button class="btn" onclick="login()">⚡ SIGN IN</button>
            <button class="btn btn-secondary" onclick="showRegister()" style="margin-top:0.6rem;">⟡ CREATE ACCOUNT</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- REGISTER PAGE -->
    <div class="container hidden" id="registerPage">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ create account ◈</div>
        </div>
        <div class="form-group">
            <input type="text" id="regUsername" placeholder="USERNAME" />
            <input type="password" id="regPassword" placeholder="PASSWORD" />
            <input type="password" id="regConfirm" placeholder="CONFIRM PASSWORD" />
            <button class="btn btn-gold" onclick="register()">⟡ CREATE</button>
            <button class="btn btn-secondary" onclick="showLogin()" style="margin-top:0.6rem;">⬅ BACK</button>
            <div id="regError" class="error-msg"></div>
        </div>
    </div>

    <!-- THREADS PAGE -->
    <div class="container hidden" id="threadsPage">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ cyber social ◈</div>
        </div>

        <div class="user-badge">
            LOGGED IN AS <span id="displayUsername">USER</span>
        </div>

        <div class="thread-input">
            <textarea id="threadContent" placeholder="WHAT'S HAPPENING?"></textarea>
            <button class="btn btn-gold" onclick="postThread()">⟐ POST THREAD</button>
        </div>

        <div class="threads-container">
            <div class="threads-header">
                <span>⟡ public threads</span>
                <span class="thread-count" id="threadCount">0 threads</span>
            </div>
            <div class="threads-list" id="threadsList">
                <div class="empty-threads">⍟ no threads yet ⍟</div>
            </div>
        </div>

        <div class="status-bar">
            <span><span class="status-dot"></span> online</span>
            <button class="exit-btn" onclick="logout()">⬅ EXIT</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        // ===== FIREBASE CONFIG =====
        const FIREBASE_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const usersRef = firebase.database().ref('/users');
        const threadsRef = firebase.database().ref('/threads');

        let currentUser = null;
        let threads = [];
        let listenerActive = false;
        let renderTimeout = null;

        // ===== DOM REFS =====
        const loginPage = document.getElementById('loginPage');
        const registerPage = document.getElementById('registerPage');
        const threadsPage = document.getElementById('threadsPage');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const regUsername = document.getElementById('regUsername');
        const regPassword = document.getElementById('regPassword');
        const regConfirm = document.getElementById('regConfirm');
        const regError = document.getElementById('regError');
        const displayUsername = document.getElementById('displayUsername');
        const threadContent = document.getElementById('threadContent');
        const threadsList = document.getElementById('threadsList');
        const threadCount = document.getElementById('threadCount');

        // ===== PAGE NAVIGATION =====
        function showLogin() {
            loginPage.classList.remove('hidden');
            registerPage.classList.add('hidden');
            threadsPage.classList.add('hidden');
        }

        function showRegister() {
            loginPage.classList.add('hidden');
            registerPage.classList.remove('hidden');
            threadsPage.classList.add('hidden');
        }

        function showThreads() {
            loginPage.classList.add('hidden');
            registerPage.classList.add('hidden');
            threadsPage.classList.remove('hidden');
        }

        // ===== REGISTER =====
        function register() {
            const username = regUsername.value.trim();
            const password = regPassword.value;
            const confirm = regConfirm.value;

            if (!username || !password || !confirm) {
                regError.textContent = 'All fields required';
                return;
            }
            if (password.length < 4) {
                regError.textContent = 'Password must be at least 4 characters';
                return;
            }
            if (password !== confirm) {
                regError.textContent = 'Passwords do not match';
                return;
            }

            usersRef.child(username).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    regError.textContent = 'Username already taken';
                    return;
                }
                usersRef.child(username).set({
                    password: password,
                    created: Date.now()
                }).then(() => {
                    regError.textContent = '';
                    regUsername.value = '';
                    regPassword.value = '';
                    regConfirm.value = '';
                    showLogin();
                    loginError.textContent = 'Account created! Sign in.';
                }).catch(err => {
                    regError.textContent = 'Error: ' + err.message;
                });
            });
        }

        // ===== LOGIN =====
        function login() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            if (!username || !password) {
                loginError.textContent = 'Enter username and password';
                return;
            }

            usersRef.child(username).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    loginError.textContent = 'User not found';
                    return;
                }
                const data = snapshot.val();
                if (data.password !== password) {
                    loginError.textContent = 'Wrong password';
                    return;
                }
                loginError.textContent = '';
                currentUser = username;
                displayUsername.textContent = username.toUpperCase();
                loginUsername.value = '';
                loginPassword.value = '';
                loadThreads();
                showThreads();
            });
        }

        // ===== LOGOUT =====
        function logout() {
            if (listenerActive) {
                threadsRef.off();
                listenerActive = false;
            }
            currentUser = null;
            threads = [];
            showLogin();
            loginError.textContent = '';
        }

        // ===== LOAD THREADS =====
        function loadThreads() {
            if (listenerActive) {
                threadsRef.off();
                listenerActive = false;
            }

            threadsRef.on('value', snapshot => {
                try {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        threads = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        threads.sort((a, b) => b.timestamp - a.timestamp);
                    } else {
                        threads = [];
                    }
                    
                    if (renderTimeout) {
                        cancelAnimationFrame(renderTimeout);
                    }
                    renderTimeout = requestAnimationFrame(() => {
                        renderThreads();
                    });
                } catch (err) {
                    console.error('Load error:', err);
                }
            }, error => {
                console.error('Firebase error:', error);
            });
            listenerActive = true;
        }

        // ===== RENDER THREADS =====
        function renderThreads() {
            if (!threadsList) return;
            
            if (threads.length === 0) {
                threadsList.innerHTML = '<div class="empty-threads">⍟ no threads yet ⍟</div>';
                threadCount.textContent = '0 threads';
                return;
            }

            let html = '';
            const len = threads.length;
            
            for (let i = 0; i < len; i++) {
                const thread = threads[i];
                const time = new Date(thread.timestamp).toLocaleTimeString('en-US', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                const likes = thread.likes || [];
                const liked = likes.includes(currentUser);
                const replies = thread.replies || [];
                const replyCount = replies.length;
                
                let repliesHtml = '';
                if (replyCount > 0) {
                    const rLen = replies.length;
                    for (let j = 0; j < rLen; j++) {
                        const reply = replies[j];
                        const rTime = new Date(reply.timestamp).toLocaleTimeString('en-US', { 
                            hour12: false, 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });
                        repliesHtml += `
                            <div class="reply-item">
                                <span class="reply-author">${escapeHtml(reply.author).toUpperCase()}</span>
                                <span class="reply-text">${escapeHtml(reply.text)}</span>
                                <span class="reply-time">${rTime}</span>
                            </div>
                        `;
                    }
                }

                html += `
                    <div class="thread-item" id="thread-${thread.id}">
                        <div class="thread-author">${escapeHtml(thread.author).toUpperCase()}</div>
                        <div class="thread-content">${escapeHtml(thread.content)}</div>
                        <div class="thread-footer">
                            <span>${time}</span>
                            <div class="thread-actions">
                                <button class="like-btn ${liked ? 'liked' : ''}" onclick="likeThread('${thread.id}')" ${liked ? 'style="color:#ff00aa"' : ''}>
                                    ♥ ${likes.length}
                                </button>
                                <button class="reply-btn" onclick="toggleReply('${thread.id}')">
                                    ⌨ ${replyCount}
                                </button>
                            </div>
                        </div>
                        <div class="replies-container" id="replies-${thread.id}">
                            ${repliesHtml}
                        </div>
                        <div class="reply-input-group hidden" id="replyInput-${thread.id}">
                            <input type="text" id="replyText-${thread.id}" placeholder="REPLY..." />
                            <button onclick="postReply('${thread.id}')">SEND</button>
                        </div>
                    </div>
                `;
            }

            threadsList.innerHTML = html;
            threadCount.textContent = `${len} threads`;
        }

        // ===== ESCAPE HTML =====
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== TOGGLE REPLY =====
        function toggleReply(threadId) {
            const input = document.getElementById(`replyInput-${threadId}`);
            if (input) {
                input.classList.toggle('hidden');
                if (!input.classList.contains('hidden')) {
                    const inputField = document.getElementById(`replyText-${threadId}`);
                    if (inputField) {
                        setTimeout(() => inputField.focus(), 50);
                    }
                }
            }
        }

        // ===== POST THREAD =====
        function postThread() {
            const content = threadContent.value.trim();
            if (!content) {
                alert('Please enter thread content.');
                return;
            }
            if (!currentUser) {
                alert('You must be logged in to post.');
                return;
            }

            const newThread = {
                author: currentUser,
                content: content,
                timestamp: Date.now(),
                likes: [],
                replies: []
            };

            threadsRef.push(newThread).then(() => {
                threadContent.value = '';
            }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ===== LIKE THREAD =====
        function likeThread(threadId) {
            if (!currentUser) {
                alert('You must be logged in to like.');
                return;
            }
            const thread = threads.find(t => t.id === threadId);
            if (!thread) return;

            const likes = thread.likes || [];
            const index = likes.indexOf(currentUser);
            if (index > -1) {
                likes.splice(index, 1);
            } else {
                likes.push(currentUser);
            }

            threadsRef.child(threadId).update({ likes: likes }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ===== POST REPLY =====
        function postReply(threadId) {
            if (!currentUser) {
                alert('You must be logged in to reply.');
                return;
            }
            const input = document.getElementById(`replyText-${threadId}`);
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const thread = threads.find(t => t.id === threadId);
            if (!thread) return;

            const replies = thread.replies || [];
            replies.push({
                author: currentUser,
                text: text,
                timestamp: Date.now()
            });

            threadsRef.child(threadId).update({ replies: replies }).then(() => {
                input.value = '';
                const replyInput = document.getElementById(`replyInput-${threadId}`);
                if (replyInput) {
                    replyInput.classList.add('hidden');
                }
            }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ===== KEYBOARD SHORTCUTS =====
        if (threadContent) {
            threadContent.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    postThread();
                }
            });
        }

        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        regConfirm.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') register();
        });

        // ===== INIT =====
        showLogin();

        console.log('ZACK THREADS • Clean version');
        console.log('✓ Theme preserved');
        console.log('✓ Public threads');
        console.log('✓ Account required to post');
        console.log('✓ All extra features removed');
    </script>
</body>
</html>
