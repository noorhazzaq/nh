<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Android Cloud Hub</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    /* ===== SORTED & EVOLVED STYLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 28px 24px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 2rem;
      line-height: 1;
    }

    .title-group h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.5px;
    }

    .title-group .subtitle {
      font-size: 0.7rem;
      color: #666;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .android-badge {
      background: #3ddc84;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-item {
      background: #f0f2f5;
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .stat-label {
      font-size: 0.6rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* Data Display */
    .data-section {
      background: #f8f9fc;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e9ecef;
      min-height: 100px;
      position: relative;
    }

    .data-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .data-content {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #1a1a2e;
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
    }

    .data-content.empty {
      color: #aaa;
      font-style: italic;
    }

    .timestamp {
      font-size: 0.6rem;
      color: #999;
      margin-top: 8px;
      text-align: right;
    }

    /* Action Buttons */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: #1a1a2e;
      color: white;
    }

    .btn-primary:hover {
      background: #2d2d44;
    }

    .btn-success {
      background: #00b894;
      color: white;
    }

    .btn-success:hover {
      background: #00a381;
    }

    .btn-danger {
      background: #e94560;
      color: white;
    }

    .btn-danger:hover {
      background: #d63851;
    }

    .btn-warning {
      background: #fdcb6e;
      color: #1a1a2e;
    }

    .btn-warning:hover {
      background: #f9ca5c;
    }

    .btn-full {
      grid-column: 1 / -1;
    }

    /* Input Area */
    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e9ecef;
      border-radius: 16px;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }

    .input-area input:focus {
      border-color: #1a1a2e;
    }

    .input-area .btn {
      padding: 12px 20px;
      white-space: nowrap;
    }

    /* Status */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
    }

    .status-msg {
      font-size: 0.75rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.idle { background: #b2bec3; }
    .status-dot.loading { background: #fdcb6e; animation: blink 0.8s infinite; }
    .status-dot.success { background: #00b894; }
    .status-dot.error { background: #e94560; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .connection-status {
      font-size: 0.65rem;
      color: #999;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
      .actions {
        grid-template-columns: 1fr;
      }
      .input-area {
        flex-direction: column;
      }
      .stats-bar {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ===== BLOCKED MESSAGE ===== */
    .blocked-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63);
      color: white;
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      flex-direction: column;
    }

    .blocked-page .icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .blocked-page h1 {
      font-size: 2rem;
      margin: 0 0 10px;
    }

    .blocked-page p {
      max-width: 320px;
      color: #ccc;
      line-height: 1.6;
    }

    .blocked-page .ua {
      margin-top: 30px;
      font-size: 0.7rem;
      color: #666;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Will be replaced if blocked -->
</div>

<script>
  (function() {
    "use strict";

    // ============================================================
    // 1. SORTED: FIREBASE CONFIGURATION
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyReplaceMe",
      authDomain: "zack360-2b303.firebaseapp.com",
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "zack360-2b303",
      storageBucket: "zack360-2b303.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    // ============================================================
    // 2. SORTED: STATE MANAGEMENT
    // ============================================================
    const State = {
      data: null,
      lastUpdate: null,
      connectionStatus: 'idle',
      stats: { reads: 0, writes: 0, errors: 0 }
    };

    // ============================================================
    // 3. SORTED: DOM REFERENCES
    // ============================================================
    let elements = {};

    function cacheElements() {
      elements = {
        app: document.getElementById('app'),
        dataContent: document.getElementById('dataContent'),
        timestamp: document.getElementById('timestamp'),
        statusMsg: document.getElementById('statusMsg'),
        statusDot: document.getElementById('statusDot'),
        connStatus: document.getElementById('connStatus'),
        readCount: document.getElementById('readCount'),
        writeCount: document.getElementById('writeCount'),
        errorCount: document.getElementById('errorCount'),
        androidBadge: document.getElementById('androidBadge'),
        customInput: document.getElementById('customInput'),
        // Buttons
        fetchBtn: document.getElementById('fetchBtn'),
        updateBtn: document.getElementById('updateBtn'),
        deleteBtn: document.getElementById('deleteBtn'),
        customBtn: document.getElementById('customBtn'),
        clearBtn: document.getElementById('clearBtn')
      };
    }

    // ============================================================
    // 4. SORTED: ANDROID DETECTION & ENFORCEMENT
    // ============================================================
    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }

    function enforceAndroidOnly() {
      if (!isAndroid()) {
        document.body.innerHTML = `
          <div class="blocked-page">
            <div class="icon">📱</div>
            <h1>Android Required</h1>
            <p>This app is optimized for Android browsers. Please open on an Android device.</p>
            <div class="ua">User-Agent: ${navigator.userAgent}</div>
          </div>
        `;
        return false;
      }
      return true;
    }

    // ============================================================
    // 5. SORTED: FIREBASE INITIALIZATION
    // ============================================================
    let database, dbRef;

    function initFirebase() {
      firebase.initializeApp(firebaseConfig);
      database = firebase.database();
      dbRef = database.ref('appData'); // using a clean path
    }

    // ============================================================
    // 6. SORTED: UI RENDER FUNCTIONS
    // ============================================================
    function renderApp() {
      elements.app.innerHTML = `
        <div class="app-container">
          <div class="card">
            <!-- Header -->
            <div class="header">
              <div class="header-left">
                <span class="logo">☁️</span>
                <div class="title-group">
                  <h1>Cloud Hub</h1>
                  <div class="subtitle">Real-time Database</div>
                </div>
              </div>
              <span class="android-badge" id="androidBadge">🤖 Android</span>
            </div>

            <!-- Stats -->
            <div class="stats-bar">
              <div class="stat-item">
                <div class="stat-number" id="readCount">0</div>
                <div class="stat-label">Reads</div>
              </div>
              <div class="stat-item">
                <div class="stat-number" id="writeCount">0</div>
                <div class="stat-label">Writes</div>
              </div>
              <div class="stat-item">
                <div class="stat-number" id="errorCount">0</div>
                <div class="stat-label">Errors</div>
              </div>
            </div>

            <!-- Data Display -->
            <div class="data-section">
              <div class="data-label">📦 Data</div>
              <div class="data-content empty" id="dataContent">No data yet</div>
              <div class="timestamp" id="timestamp">—</div>
            </div>

            <!-- Actions -->
            <div class="actions">
              <button class="btn btn-primary" id="fetchBtn">📥 Fetch</button>
              <button class="btn btn-success" id="updateBtn">✏️ Update</button>
              <button class="btn btn-danger" id="deleteBtn">🗑️ Delete</button>
              <button class="btn btn-warning" id="clearBtn">🧹 Clear</button>
            </div>

            <!-- Custom Input -->
            <div class="input-area">
              <input type="text" id="customInput" placeholder="Enter custom value..." />
              <button class="btn btn-primary" id="customBtn">Send</button>
            </div>

            <!-- Status -->
            <div class="status-bar">
              <div class="status-msg">
                <span class="status-dot idle" id="statusDot"></span>
                <span id="statusMsg">Ready</span>
              </div>
              <div class="connection-status" id="connStatus">● Online</div>
            </div>
          </div>
        </div>
      `;
      cacheElements();
      if (elements.androidBadge) elements.androidBadge.style.display = 'inline-block';
    }

    // ============================================================
    // 7. SORTED: UPDATE UI FUNCTIONS
    // ============================================================
    function setStatus(msg, type = 'idle') {
      if (elements.statusMsg) elements.statusMsg.textContent = msg;
      if (elements.statusDot) {
        elements.statusDot.className = 'status-dot ' + type;
      }
      if (type === 'loading') State.connectionStatus = 'loading';
      else if (type === 'success') State.connectionStatus = 'online';
      else if (type === 'error') State.connectionStatus = 'error';
      else State.connectionStatus = 'idle';
      updateConnectionStatus();
    }

    function updateConnectionStatus() {
      if (elements.connStatus) {
        const status = State.connectionStatus;
        const icons = { online: '🟢', loading: '🟡', error: '🔴', idle: '⚪' };
        const labels = { online: 'Online', loading: 'Loading...', error: 'Error', idle: 'Idle' };
        elements.connStatus.textContent = `${icons[status] || '⚪'} ${labels[status] || 'Idle'}`;
      }
    }

    function updateStats() {
      if (elements.readCount) elements.readCount.textContent = State.stats.reads;
      if (elements.writeCount) elements.writeCount.textContent = State.stats.writes;
      if (elements.errorCount) elements.errorCount.textContent = State.stats.errors;
    }

    function displayData(value) {
      if (!elements.dataContent) return;
      if (value === null || value === undefined) {
        elements.dataContent.textContent = '📭 Empty';
        elements.dataContent.className = 'data-content empty';
        return;
      }
      const display = typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value);
      elements.dataContent.textContent = display;
      elements.dataContent.className = 'data-content';
    }

    function updateTimestamp() {
      if (elements.timestamp) {
        const now = new Date();
        elements.timestamp.textContent = `🕐 ${now.toLocaleTimeString()}`;
      }
    }

    // ============================================================
    // 8. SORTED: DATABASE OPERATIONS
    // ============================================================
    function fetchData() {
      setStatus('Fetching...', 'loading');
      State.stats.reads++;
      updateStats();

      dbRef.once('value')
        .then((snapshot) => {
          const val = snapshot.val();
          State.data = val;
          displayData(val);
          updateTimestamp();
          setStatus('✅ Data loaded', 'success');
          State.stats.reads++;
          updateStats();
        })
        .catch((err) => {
          console.error('Fetch error:', err);
          State.stats.errors++;
          updateStats();
          setStatus('❌ ' + err.message, 'error');
          displayData(null);
        });
    }

    function updateData(customValue = null) {
      const payload = customValue || {
        timestamp: Date.now(),
        message: 'Hello from Android!',
        random: Math.floor(Math.random() * 10000),
        note: 'Evolved version'
      };

      setStatus('Updating...', 'loading');
      State.stats.writes++;
      updateStats();

      dbRef.set(payload)
        .then(() => {
          State.data = payload;
          displayData(payload);
          updateTimestamp();
          setStatus('✅ Updated successfully', 'success');
          State.stats.writes++;
          updateStats();
        })
        .catch((err) => {
          console.error('Update error:', err);
          State.stats.errors++;
          updateStats();
          setStatus('❌ ' + err.message, 'error');
        });
    }

    function deleteData() {
      if (!confirm('🗑️ Delete all data?')) return;

      setStatus('Deleting...', 'loading');
      State.stats.writes++;
      updateStats();

      dbRef.remove()
        .then(() => {
          State.data = null;
          displayData(null);
          updateTimestamp();
          setStatus('🗑️ Data deleted', 'success');
          State.stats.writes++;
          updateStats();
        })
        .catch((err) => {
          console.error('Delete error:', err);
          State.stats.errors++;
          updateStats();
          setStatus('❌ ' + err.message, 'error');
        });
    }

    function clearDisplay() {
      displayData(null);
      setStatus('🧹 Display cleared', 'idle');
      // Note: Doesn't delete from Firebase, just clears view
    }

    function handleCustomInput() {
      const input = elements.customInput;
      if (!input) return;
      const value = input.value.trim();
      if (!value) {
        setStatus('⚠️ Please enter a value', 'error');
        return;
      }
      // Try to parse as JSON, else use as string
      let parsed;
      try { parsed = JSON.parse(value); } catch (e) { parsed = value; }
      updateData(parsed);
      input.value = '';
    }

    // ============================================================
    // 9. SORTED: REAL-TIME LISTENER (OPTIONAL)
    // ============================================================
    let listenerAttached = false;

    function attachRealtimeListener() {
      if (listenerAttached) return;
      listenerAttached = true;
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        State.data = val;
        displayData(val);
        updateTimestamp();
        setStatus('🔄 Live update', 'success');
        // Don't increment stats for passive listeners
      }, (error) => {
        console.warn('Realtime listener error:', error);
      });
    }

    // ============================================================
    // 10. SORTED: EVENT BINDING
    // ============================================================
    function bindEvents() {
      if (elements.fetchBtn) elements.fetchBtn.addEventListener('click', fetchData);
      if (elements.updateBtn) elements.updateBtn.addEventListener('click', () => updateData());
      if (elements.deleteBtn) elements.deleteBtn.addEventListener('click', deleteData);
      if (elements.clearBtn) elements.clearBtn.addEventListener('click', clearDisplay);
      if (elements.customBtn) elements.customBtn.addEventListener('click', handleCustomInput);
      if (elements.customInput) {
        elements.customInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleCustomInput();
        });
      }
    }

    // ============================================================
    // 11. SORTED: INITIALIZATION
    // ============================================================
    function init() {
      // Step 1: Enforce Android
      if (!enforceAndroidOnly()) return;

      // Step 2: Init Firebase
      initFirebase();

      // Step 3: Render UI
      renderApp();

      // Step 4: Cache elements (already done in renderApp)
      // But re-cache to be safe
      cacheElements();

      // Step 5: Load initial data
      fetchData();

      // Step 6: Attach realtime listener for live updates
      attachRealtimeListener();

      // Step 7: Bind events
      bindEvents();

      // Step 8: Update connection status periodically
      setStatus('🚀 Ready', 'idle');
      updateConnectionStatus();
      updateStats();

      console.log('✅ Cloud Hub evolved and ready!');
    }

    // ============================================================
    // 12. SORTED: DOM READY
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
</script>

</body>
</html>
