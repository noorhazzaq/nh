<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Enterprise App" />
  <title>Enterprise Android PWA Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Dynamically Generated Web App Manifest -->
  <link id="manifestLink" rel="manifest" />

  <style>
    /* Custom Modern Scrollbars & Touch Target Handling */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="h-full text-gray-100 font-sans flex flex-col overflow-hidden antialiased select-none">

  <!-- TOP APP BAR -->
  <header class="h-14 bg-gray-900 border-b border-gray-800 px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-layer-group text-base"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold tracking-tight text-white uppercase">Enterprise PWA</h1>
        <div class="flex items-center space-x-2">
          <span id="netStatusBadge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1">
            <span id="netStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="netStatusText">Online</span>
          </span>
          <span id="swStatusText" class="text-[10px] font-mono text-gray-400">SW: Active</span>
        </div>
      </div>
    </div>

    <!-- NATIVE INSTALL TRIGGER -->
    <div class="flex items-center space-x-2">
      <button id="pwaInstallBtn" onclick="Application.pwa.promptInstall()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white border border-indigo-400/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-download text-[10px]"></i>
        <span>Install App</span>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-950">
    
    <!-- SYSTEM NOTICE BANNER -->
    <section class="bg-gray-900/80 border border-gray-800 rounded-xl p-4 space-y-2 shadow-sm">
      <div class="flex items-center space-x-2 text-indigo-400 text-xs font-bold uppercase tracking-wider">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Enterprise Android Core</span>
      </div>
      <p class="text-xs text-gray-400 leading-relaxed">
        Engineered with strict Clean Architecture contracts, asynchronous IndexedDB storage, and offline-first Stale-While-Revalidate Caching over Vercel Edge.
      </p>
    </section>

    <!-- DATA MANAGEMENT COMPONENT -->
    <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">
      <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider flex items-center space-x-2">
        <i class="fa-solid fa-database text-amber-400"></i>
        <span>Offline IndexedDB Store</span>
      </h2>

      <form id="recordForm" onsubmit="Application.ui.handleFormSubmit(event)" class="flex gap-2">
        <input type="text" id="recordInput" placeholder="Enter task or log event..." required class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center space-x-1 transition">
          <i class="fa-solid fa-plus text-[10px]"></i>
          <span>Save</span>
        </button>
      </form>

      <!-- RECORDED ITEMS LIST -->
      <div id="recordsList" class="space-y-2 pt-2"></div>
    </section>

  </main>

  <!-- SINGLE-FILE ENTERPRISE SCRIPT -->
  <script type="module">

    // ==========================================
    // 1. DYNAMIC PWA MANIFEST INJECTION
    // ==========================================
    const manifestBlob = new Blob([JSON.stringify({
      "name": "Enterprise Android PWA",
      "short_name": "EntPWA",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#030712",
      "theme_color": "#4f46e5",
      "icons": [
        { "src": "https://cdn-icons-png.flaticon.com/512/2592/2592317.png", "sizes": "192x192", "type": "image/png" },
        { "src": "https://cdn-icons-png.flaticon.com/512/2592/2592317.png", "sizes": "512x512", "type": "image/png" }
      ]
    })], { type: 'application/json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);


    // ==========================================
    // 2. ENTERPRISE INDEXEDDB ADAPTER
    // ==========================================
    class StorageAdapter {
      constructor(dbName = "EnterprisePwaDB", storeName = "app_records") {
        this.dbName = dbName;
        this.storeName = storeName;
        this.db = null;
      }

      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName, { keyPath: "id" });
            }
          };
          request.onsuccess = (e) => {
            this.db = e.target.result;
            resolve();
          };
          request.onerror = (e) => reject("IndexedDB connection failed: " + e.target.error);
        });
      }

      async getAll() {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, "readonly");
          const store = tx.objectStore(this.storeName);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async add(item) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, "readwrite");
          const store = tx.objectStore(this.storeName);
          const request = store.put(item);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      async remove(id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(this.storeName, "readwrite");
          const store = tx.objectStore(this.storeName);
          const request = store.delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }
    }


    // ==========================================
    // 3. PWA & SERVICE WORKER MANAGER
    // ==========================================
    class PwaManager {
      constructor() {
        this.deferredPrompt = null;
      }

      async init() {
        this.listenForInstallPrompt();
        await this.registerServiceWorker();
      }

      async registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;

        // Inlined Service Worker Implementation via Blob
        const swCode = `
          const CACHE_NAME = 'ent-pwa-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              caches.match(e.request).then((res) => {
                const fetchPromise = fetch(e.request).then((networkRes) => {
                  if (networkRes && networkRes.status === 200) {
                    const resClone = networkRes.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(e.request, resClone));
                  }
                  return networkRes;
                }).catch(() => res);
                return res || fetchPromise;
              })
            );
          });
        `;

        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);

        try {
          await navigator.serviceWorker.register(swUrl);
          document.getElementById("swStatusText").innerText = "SW: Active (Blob)";
        } catch (err) {
          console.warn("[SW] Registration skipped or failed:", err);
          document.getElementById("swStatusText").innerText = "SW: Disabled";
        }
      }

      listenForInstallPrompt() {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          this.deferredPrompt = e;
          document.getElementById("pwaInstallBtn").classList.remove("hidden");
        });

        window.addEventListener('appinstalled', () => {
          this.deferredPrompt = null;
          document.getElementById("pwaInstallBtn").classList.add("hidden");
        });
      }

      async promptInstall() {
        if (!this.deferredPrompt) return;
        this.deferredPrompt.prompt();
        const { outcome } = await this.deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          this.deferredPrompt = null;
          document.getElementById("pwaInstallBtn").classList.add("hidden");
        }
      }
    }


    // ==========================================
    // 4. NETWORK & UI CONTROLLER
    // ==========================================
    class UiController {
      constructor(storage) {
        this.storage = storage;
        this.setupNetworkListeners();
      }

      setupNetworkListeners() {
        const updateStatus = () => {
          const badge = document.getElementById("netStatusBadge");
          const dot = document.getElementById("netStatusDot");
          const text = document.getElementById("netStatusText");

          if (navigator.onLine) {
            badge.className = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1";
            dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse";
            text.innerText = "Online";
          } else {
            badge.className = "bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1";
            dot.className = "w-1.5 h-1.5 rounded-full bg-rose-400";
            text.innerText = "Offline Mode";
          }
        };

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
      }

      escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }

      async handleFormSubmit(e) {
        e.preventDefault();
        const input = document.getElementById("recordInput");
        const val = input.value.trim();
        if (!val) return;

        const record = {
          id: `rec_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
          title: this.escapeHTML(val),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        await this.storage.add(record);
        input.value = "";
        await this.renderRecords();
      }

      async deleteRecord(id) {
        await this.storage.remove(id);
        await this.renderRecords();
      }

      async renderRecords() {
        const list = document.getElementById("recordsList");
        const records = await this.storage.getAll();

        if (records.length === 0) {
          list.innerHTML = `<p class="text-[11px] text-gray-500 italic text-center py-2">No records stored in IndexedDB.</p>`;
          return;
        }

        list.innerHTML = records.map(r => `
          <div class="p-2.5 bg-gray-950 border border-gray-800 rounded-lg flex items-center justify-between">
            <div class="space-y-0.5">
              <p class="text-xs font-semibold text-gray-200">${r.title}</p>
              <p class="text-[9px] font-mono text-gray-500">${r.time}</p>
            </div>
            <button onclick="Application.ui.deleteRecord('${r.id}')" class="text-gray-500 hover:text-rose-400 p-1.5 transition">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `).join('');
      }
    }


    // ==========================================
    // 5. APPLICATION COMPOSITION ROOT
    // ==========================================
    class ApplicationRoot {
      constructor() {
        this.storage = new StorageAdapter();
        this.pwa = new PwaManager();
        this.ui = new UiController(this.storage);
      }

      async bootstrap() {
        await this.storage.init();
        await this.pwa.init();
        await this.ui.renderRecords();
      }
    }

    // Export Application Instance Globally
    window.Application = new ApplicationRoot();
    window.addEventListener("DOMContentLoaded", () => window.Application.bootstrap());

  </script>
</body>
</html>
