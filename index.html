<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>ZACK LIVES</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK Lives","short_name":"ZACK","display":"standalone","theme_color":"%230a0a0f","background_color":"%230a0a0f"}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap');
        :root{--bg:#0a0a0f;--panel:rgba(20,20,30,.92);--glass:rgba(56,189,248,.08);--border:rgba(56,189,248,.25);--cyan:#38bdf8;--orange:#f59e0b;--red:#ef4444;--green:#10b981;--text:#f1f5f9;--dim:#94a3b8}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
        .viewport{max-width:520px;margin:0 auto;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#1a1a2e 0%,#0a0a0f 70%);display:flex;flex-direction:column}
        .header{background:var(--panel);padding:14px;text-align:center;border-bottom:1px solid var(--border)}
        .header h1{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;color:var(--cyan);letter-spacing:2px}
        .nav{display:flex;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
        .nav button{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;cursor:pointer;white-space:nowrap}
        .nav button.aktif{color:var(--cyan);border-bottom:2px solid var(--cyan)}
        .main{flex:1;padding:14px;overflow-y:auto}
        .page{display:none}
        .page.aktif{display:block;animation:fadeIn .3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
        .card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
        .card h2{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--cyan);margin-bottom:10px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .stat{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
        .stat .l{font-size:9px;color:var(--dim);text-transform:uppercase}
        .stat .v{font-size:14px;font-weight:700;margin-top:4px}
        .stat .v.baik{color:var(--green)}
        .stat .v.buruk{color:var(--red)}
        .btn{width:100%;padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;cursor:pointer;margin-bottom:6px;text-align:left}
        .btn:active{transform:scale(.97);border-color:var(--cyan)}
        .input{width:100%;padding:12px;background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px}
        .pemain{display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:12px;cursor:pointer}
        .pemain:active{border-color:var(--cyan)}
        .log-v{height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:10px;background:rgba(0,0,0,.4)}
        .log-v p{font-size:11px;color:var(--dim);padding:3px 0;border-bottom:1px solid rgba(56,189,248,.1)}
        .log-v p b{color:var(--cyan)}
        .log-v p.baik{color:var(--green)}
        .log-v p.buruk{color:var(--red)}
    </style>
</head>
<body>
    <div class="viewport">
        <div class="header"><h1>ZACK LIVES</h1></div>
        <div class="nav">
            <button class="aktif" onclick="page('hidup',this)">HIDUP</button>
            <button onclick="page('profil',this)">PROFIL</button>
            <button onclick="page('pemain',this)">PEMAIN</button>
            <button onclick="page('kerjaya',this)">KERJAYA</button>
            <button onclick="page('kewangan',this)">KEWANGAN</button>
        </div>
        <div class="main">
            <div class="page aktif" id="pg-hidup">
                <div class="card"><h2>LOGIN</h2><input class="input" id="namaLogin" placeholder="Nama"><button class="btn" id="btnLogin">MASUK</button></div>
                <div class="card" id="hidupCard" style="display:none">
                    <h2>STATUS</h2>
                    <div class="grid" id="statsHidup"></div>
                    <button class="btn" id="btnTahun" style="text-align:center">TAHUN SETERUSNYA</button>
                </div>
            </div>
            <div class="page" id="pg-profil">
                <div class="card" id="profilCard" style="display:none">
                    <h2>PROFIL ANDA</h2>
                    <div id="profilSendiri"></div>
                </div>
            </div>
            <div class="page" id="pg-pemain">
                <div class="card"><h2>SENARAI PEMAIN</h2><div id="senaraiPemain"></div></div>
                <div class="card" id="profilLihat" style="display:none">
                    <h2>PROFIL PEMAIN</h2>
                    <div id="profilPemain"></div>
                </div>
            </div>
            <div class="page" id="pg-kerjaya">
                <div class="card"><h2>PEKERJAAN</h2><div id="kerjaList"></div></div>
                <div class="card"><h2>NAIK PANGKAT</h2><button class="btn" id="btnPangkat">NAIK PANGKAT</button></div>
                <div class="card"><h2>KERJA OT</h2><button class="btn" id="btnOT">KERJA OT</button></div>
            </div>
            <div class="page" id="pg-kewangan">
                <div class="card"><h2>SIMPAN</h2><input class="input" id="simpanJumlah" placeholder="Jumlah"><button class="btn" id="btnSimpan">SIMPAN</button></div>
                <div class="card"><h2>LABUR</h2><input class="input" id="laburJumlah" placeholder="Jumlah"><button class="btn" id="btnLabur">LABUR</button></div>
                <div class="card"><h2>BAYAR HUTANG</h2><input class="input" id="bayarJumlah" placeholder="Jumlah"><button class="btn" id="btnBayar">BAYAR</button></div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
    'use strict';
    var db=firebase.initializeApp({databaseURL:'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'}).database();
    var pengguna=null;
    var profilLihatNama=null;
    var state={umur:18,kesihatan:85,mental:80,tenaga:70,kebahagiaan:75,wang:3000,simpanan:1000,aset:5000,hutang:0,gaji:1500,pekerjaan:'Pelajar',berkahwin:false,tahun:1,hidup:true};
    var kerja=[{n:'Pelajar',g:0},{n:'Pekerja Kilang',g:1800},{n:'Guru',g:2800},{n:'Jurutera',g:5000},{n:'Doktor',g:8000},{n:'Peniaga',g:3500}];
    window.page=function(n,btn){
        document.querySelectorAll('.page').forEach(function(p){p.classList.remove('aktif')});
        document.getElementById('pg-'+n).classList.add('aktif');
        document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('aktif')});
        if(btn)btn.classList.add('aktif');
        if(n==='profil')showProfilSendiri();
        if(n==='pemain')muatPemain();
        if(n==='kerjaya')showKerja();
    };
    function simpan(){if(!pengguna)return;db.ref('profil/'+pengguna).set(state).catch(function(){})}
    function muat(nama){
        db.ref('profil/'+nama).once('value').then(function(snap){
            if(snap.exists()){state=snap.val();}
            else{state={umur:18,kesihatan:85,mental:80,tenaga:70,kebahagiaan:75,wang:3000,simpanan:1000,aset:5000,hutang:0,gaji:1500,pekerjaan:'Pelajar',berkahwin:false,tahun:1,hidup:true};simpan();}
            document.getElementById('hidupCard').style.display='block';
            document.getElementById('profilCard').style.display='block';
            showStats();
            showProfilSendiri();
        }).catch(function(){alert('Ralat')});
    }
    function showStats(){
        var k=state.kesihatan>=50?'baik':'buruk';
        document.getElementById('statsHidup').innerHTML=[
            {l:'UMUR',v:state.umur},{l:'TAHUN',v:state.tahun},
            {l:'KESIHATAN',v:state.kesihatan+'%',c:k},
            {l:'MENTAL',v:state.mental+'%'},
            {l:'TENAGA',v:state.tenaga+'%'},
            {l:'KEBAHAGIAAN',v:state.kebahagiaan+'%'},
            {l:'WANG',v:'$'+state.wang},
            {l:'PEKERJAAN',v:state.pekerjaan},
            {l:'STATUS',v:state.berkahwin?'Kahwin':'Bujang'}
        ].map(function(x){return '<div class="stat"><div class="l">'+x.l+'</div><div class="v '+(x.c||'')+'">'+x.v+'</div></div>';}).join('');
    }
    function showProfilSendiri(){
        if(!pengguna){document.getElementById('profilCard').style.display='none';return}
        document.getElementById('profilCard').style.display='block';
        document.getElementById('profilSendiri').innerHTML=[
            {l:'NAMA',v:pengguna},
            {l:'UMUR',v:state.umur},
            {l:'PEKERJAAN',v:state.pekerjaan},
            {l:'PENDAPATAN',v:'$'+state.gaji},
            {l:'WANG',v:'$'+state.wang},
            {l:'SIMPANAN',v:'$'+state.simpanan},
            {l:'ASET',v:'$'+state.aset},
            {l:'HUTANG',v:'$'+state.hutang},
            {l:'KEBAHAGIAAN',v:state.kebahagiaan+'%'},
            {l:'KESIHATAN',v:state.kesihatan+'%'},
            {l:'STATUS',v:state.berkahwin?'Kahwin':'Bujang'},
            {l:'TAHUN',v:state.tahun}
        ].map(function(x){return '<div class="stat"><div class="l">'+x.l+'</div><div class="v">'+x.v+'</div></div>';}).join('');
    }
    function muatPemain(){
        db.ref('profil').on('value',function(snap){
            var l=[];
            if(snap.exists())snap.forEach(function(c){l.push({n:c.key,w:c.val().wang||0})});
            document.getElementById('senaraiPemain').innerHTML=l.map(function(p){
                return '<div class="pemain" onclick="lihatProfil(\''+p.n+'\')"><span>'+p.n+(p.n===pengguna?' (Anda)':'')+'</span><span>$'+p.w+'</span></div>';
            }).join('')||'<p style="color:#94a3b8">Tiada pemain</p>';
        });
    }
    function lihatProfil(nama){
        db.ref('profil/'+nama).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada');return}
            var d=snap.val();
            document.getElementById('profilLihat').style.display='block';
            document.getElementById('profilPemain').innerHTML=[
                {l:'NAMA',v:nama},
                {l:'UMUR',v:d.umur||0},
                {l:'PEKERJAAN',v:d.pekerjaan||'Tiada'},
                {l:'PENDAPATAN',v:'$'+(d.gaji||0)},
                {l:'WANG',v:'$'+(d.wang||0)},
                {l:'SIMPANAN',v:'$'+(d.simpanan||0)},
                {l:'ASET',v:'$'+(d.aset||0)},
                {l:'HUTANG',v:'$'+(d.hutang||0)},
                {l:'KEBAHAGIAAN',v:(d.kebahagiaan||0)+'%'},
                {l:'KESIHATAN',v:(d.kesihatan||0)+'%'},
                {l:'STATUS',v:d.berkahwin?'Kahwin':'Bujang'},
                {l:'TAHUN',v:d.tahun||0}
            ].map(function(x){return '<div class="stat"><div class="l">'+x.l+'</div><div class="v">'+x.v+'</div></div>';}).join('');
        }).catch(function(){alert('Ralat')});
    }
    function showKerja(){
        document.getElementById('kerjaList').innerHTML=kerja.map(function(k,i){
            return '<button class="btn" onclick="pilihKerja('+i+')">'+k.n+' — $'+k.g+'</button>';
        }).join('');
    }
    function pilihKerja(i){var k=kerja[i];state.pekerjaan=k.n;state.gaji=k.g;simpan();showStats();showProfilSendiri();}
    document.getElementById('btnLogin').addEventListener('click',function(){var n=document.getElementById('namaLogin').value.trim();if(!n)return;pengguna=n;muat(n);});
    document.getElementById('btnTahun').addEventListener('click',function(){
        if(!state.hidup)return;
        state.tahun++;state.umur++;
        state.kesihatan=Math.max(0,state.kesihatan-Math.floor(Math.random()*5));
        state.mental=Math.max(0,state.mental-Math.floor(Math.random()*3));
        state.tenaga=Math.max(0,state.tenaga-Math.floor(Math.random()*4));
        state.wang+=state.gaji;
        state.wang=Math.max(0,state.wang-Math.floor(500+state.umur*10));
        if(state.kesihatan<=0||state.umur>80)state.hidup=false;
        simpan();showStats();showProfilSendiri();
    });
    document.getElementById('btnPangkat').addEventListener('click',function(){state.gaji+=500;simpan();showStats();showProfilSendiri();alert('Gaji +$500');});
    document.getElementById('btnOT').addEventListener('click',function(){state.wang+=500;state.tenaga=Math.max(0,state.tenaga-15);simpan();showStats();showProfilSendiri();});
    document.getElementById('btnSimpan').addEventListener('click',function(){var j=parseInt(document.getElementById('simpanJumlah').value);if(!j||j<=0||state.wang<j)return;state.wang-=j;state.simpanan+=j;simpan();showStats();showProfilSendiri();});
    document.getElementById('btnLabur').addEventListener('click',function(){var j=parseInt(document.getElementById('laburJumlah').value);if(!j||j<=0||state.wang<j)return;state.wang-=j;state.aset+=j;simpan();showStats();showProfilSendiri();});
    document.getElementById('btnBayar').addEventListener('click',function(){var j=parseInt(document.getElementById('bayarJumlah').value);if(!j||j<=0||state.wang<j)return;state.wang-=j;state.hutang=Math.max(0,state.hutang-j);simpan();showStats();showProfilSendiri();});
    </script>
</body>
</html>
