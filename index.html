                state={umur:18,kesihatan:85,mental:80,tenaga:70,kenyang:70,air:70,pengetahuan:30,kemahiran:20,stamina:60,kebahagiaan:75,masa:0,tahun:1,hidup:true,wang:1000,pengalaman:0,tahap:1,mood:'neutral',inventori:{},pencapaian:{},quest:{},statistik:{totalMakan:0,totalTidur:0,totalKerja:0,totalBelajar:0,totalSukan:0,totalSosial:0},tetapan:{autoSimpan:true,kelajuan:1,notifikasi:true}};
                simpan();
            }
            pengguna=key;
            document.getElementById('hidupCard').style.display='block';
            showStats();
            toast('Selamat datang '+key);
            startAutoSave();
        }).catch(function(){toast('Ralat')});
    }

    function daftar(nama,kata){
        var key=sanitize(nama);
        if(!key||!kata){toast('Isi semua');return}
        db.ref('auth/'+key).once('value').then(function(snap){
            if(snap.exists()){toast('Nama wujud');return}
            db.ref('auth/'+key).set({password:kata}).then(function(){
                var profil={umur:18,kesihatan:85,mental:80,tenaga:70,kenyang:70,air:70,pengetahuan:30,kemahiran:20,stamina:60,kebahagiaan:75,masa:0,tahun:1,hidup:true,wang:1000,pengalaman:0,tahap:1,mood:'neutral',inventori:{},pencapaian:{},quest:{},statistik:{totalMakan:0,totalTidur:0,totalKerja:0,totalBelajar:0,totalSukan:0,totalSosial:0},tetapan:{autoSimpan:true,kelajuan:1,notifikasi:true}};
                db.ref('profil/'+key).set(profil).then(function(){toast('Daftar berjaya!')});
            });
        });
    }

    function login(nama,kata){
        var key=sanitize(nama);
        if(!key||!kata){toast('Isi semua');return}
        db.ref('auth/'+key).once('value').then(function(snap){
            if(!snap.exists()){toast('Nama tiada');return}
            if(snap.val().password!==kata){toast('Kata laluan salah');return}
            muat(key);
        });
    }

    function showStats(){
        var stats=[
            {l:'UMUR',v:state.umur},{l:'JAM',v:state.masa},{l:'TAHUN',v:state.tahun},
            {l:'KESIHATAN',v:state.kesihatan+'%',c:state.kesihatan>50?'baik':state.kesihatan>25?'amar':'buruk'},
            {l:'MENTAL',v:state.mental+'%'},{l:'TENAGA',v:state.tenaga+'%'},
            {l:'KENYANG',v:state.kenyang+'%',c:state.kenyang>50?'baik':'buruk'},
            {l:'AIR',v:state.air+'%',c:state.air>50?'baik':'buruk'},
            {l:'PENGETAHUAN',v:state.pengetahuan+'%'},{l:'KEMAHIRAN',v:state.kemahiran+'%'},
            {l:'STAMINA',v:state.stamina+'%'},{l:'KEBAHAGIAAN',v:state.kebahagiaan+'%'},
            {l:'WANG',v:'RM'+state.wang},{l:'PENGALAMAN',v:state.pengalaman},
            {l:'TAHAP',v:state.tahap},{l:'MOOD',v:state.mood}
        ];
        document.getElementById('statsHidup').innerHTML=stats.map(function(x){
            return '<div class="stat" onclick="toast(\''+x.l+': '+x.v+'\')"><div class="l">'+x.l+'</div><div class="v '+(x.c||'')+'">'+x.v+'</div></div>';
        }).join('');
    }

    function makan(i){
        if(!rateLimit())return;
        var m=makanan[i];
        state.kenyang=Math.min(100,state.kenyang+m.k);
        state.tenaga=Math.min(100,state.tenaga+m.t);
        state.air=Math.max(0,state.air+m.a);
        state.kebahagiaan=Math.min(100,state.kebahagiaan+m.h);
        state.masa++;
        state.statistik.totalMakan++;
        state.wang-=m.harga||10;
        checkQuest();
        simpan();showStats();
        addLog('Makan '+m.n+' ('+m.kategori+')','baik');
    }

    function tidur(i){
        if(!rateLimit())return;
        var t=tidur[i];
        state.tenaga=Math.min(100,state.tenaga+t.t);
        state.masa+=parseInt(t.n);
        state.statistik.totalTidur++;
        simpan();showStats();
        addLog('Tidur '+t.n+' (Kualiti: '+t.kualiti+'%)','baik');
    }

    function kerja(i){
        if(!rateLimit())return;
        var k=kerja[i];
        state.tenaga=Math.max(0,state.tenaga+k.t);
        state.kemahiran=Math.min(100,state.kemahiran+k.k);
        state.wang+=k.w;
        state.pengalaman+=Math.floor(k.w/10);
        state.masa+=8;
        state.statistik.totalKerja++;
        levelUp();
        simpan();showStats();
        addLog(k.n+' (+RM'+k.w+')','baik');
    }

    function belajar(i){
        if(!rateLimit())return;
        var b=belajar[i];
        state.pengetahuan=Math.min(100,state.pengetahuan+b.a);
        state.tenaga=Math.max(0,state.tenaga+b.t);
        state.masa+=2;
        state.statistik.totalBelajar++;
        simpan();showStats();
        addLog(b.n+' ('+b.kategori+')','baik');
    }

    function sukan(i){
        if(!rateLimit())return;
        var s=sukan[i];
        state.stamina=Math.min(100,state.stamina+s.k);
        state.kesihatan=Math.min(100,state.kesihatan+s.a);
        state.tenaga=Math.max(0,state.tenaga+s.t);
        state.masa++;
        state.statistik.totalSukan++;
        simpan();showStats();
        addLog(s.n+' ('+s.jenis+')','baik');
    }

    function sosial(i){
        if(!rateLimit())return;
        var s=sosial[i];
        state.sosial=Math.min(100,state.sosial+s.s);
        state.kebahagiaan=Math.min(100,state.kebahagiaan+s.mood);
        state.tenaga=Math.max(0,state.tenaga+s.t);
        state.masa+=2;
        state.statistik.totalSosial++;
        simpan();showStats();
        addLog(s.n+' ('+s.jenis+')','baik');
    }

    function hobi(i){
        if(!rateLimit())return;
        var h=hobi[i];
        state.kreativiti=Math.min(100,state.kreativiti+h.k);
        state.kebahagiaan=Math.min(100,state.kebahagiaan+h.mood);
        state.tenaga=Math.max(0,state.tenaga+h.t);
        state.masa++;
        simpan();showStats();
        addLog(h.n+' ('+h.jenis+')','baik');
    }

    function kesihatan(i){
        if(!rateLimit())return;
        var k=kesihatan[i];
        state.kesihatan=Math.min(100,state.kesihatan+k.kesan);
        state.wang-=k.kos;
        state.masa+=1;
        simpan();showStats();
        addLog(k.n+' (-RM'+k.kos+')','baik');
    }

    function kerjaya(i){
        if(!rateLimit())return;
        var k=kerjaya[i];
        state.kerjayaTahap=k.tahap;
        state.gaji=k.gaji;
        state.kerjayaPengalaman=0;
        state.masa+=40;
        state.pengalaman+=100;
        simpan();showStats();
        addLog('Mula kerjaya: '+k.n+' (Gaji RM'+k.gaji+')','baik');
    }

    function kemahiran(i){
        if(!rateLimit())return;
        var k=kemahiran[i];
        k.tahap=Math.min(k.maksimum,k.tahap+10);
        state.pengalaman+=20;
        state.masa+=3;
        simpan();showStats();
        addLog('Latih '+k.n+' ('+k.kategori+')','baik');
    }

    function hubungan(i){
        if(!rateLimit())return;
        var h=hubungan[i];
        h.tahap=Math.min(h.maksimum,h.tahap+15);
        state.sosial=Math.min(100,state.sosial+5);
        state.masa+=2;
        simpan();showStats();
        addLog('Kuatkan hubungan dengan '+h.n+' ('+h.jenis+')','baik');
    }

    function acara(i){
        if(!rateLimit())return;
        var a=acara[i];
        state.kesihatan=Math.max(0,Math.min(100,state.kesihatan+a.kesan.kesihatan));
        state.mental=Math.max(0,Math.min(100,state.mental+a.kesan.mental));
        state.wang=Math.max(0,state.wang+a.kesan.wang);
        state.masa+=1;
        simpan();showStats();
        addLog(a.n+' ('+a.jenis+')',a.jenis==='positif'?'baik':a.jenis==='negatif'?'buruk':'neutral');
    }

    function beliItem(i){
        if(!rateLimit())return;
        var item=kedaiItem[i];
        if(state.wang<item.harga){toast('Wang tidak cukup!');return}
        state.wang-=item.harga;
        state.inventori[item.nama]=(state.inventori[item.nama]||0)+1;
        if(item.kesan.tenaga)state.tenaga=Math.min(100,state.tenaga+item.kesan.tenaga);
        if(item.kesan.kesihatan)state.kesihatan=Math.min(100,state.kesihatan+item.kesan.kesihatan);
        if(item.kesan.mood)state.kebahagiaan=Math.min(100,state.kebahagiaan+item.kesan.mood);
        simpan();showStats();
        addLog('Beli '+item.nama+' (-RM'+item.harga+')','baik');
    }

    function claimQuest(i){
        var q=questList[i];
        state.wang+=q.hadiah.wang;
        state.pengalaman+=q.hadiah.xp;
        state.inventori[q.hadiah.item]=(state.inventori[q.hadiah.item]||0)+1;
        q.complete=true;
        simpan();showQuest();
        addLog('Selesaikan quest: '+q.nama+' (+RM'+q.hadiah.wang+')','baik');
    }

    function checkQuest(){
        questList.forEach(function(q,index){
            var progress=state.quest[q.id]||0;
            if(progress<q.target){
                progress++;
                state.quest[q.id]=progress;
                if(progress>=q.target){
                    toast('Quest selesai: '+q.nama);
                }
            }
        });
    }

    function levelUp(){
        var nextLevel=state.tahap*100;
        if(state.pengalaman>=nextLevel){
            state.tahap++;
            state.pengalaman-=nextLevel;
            toast('Tahap naik! Tahap '+state.tahap);
            addLog('Tahap naik ke '+state.tahap,'rarity');
        }
    }

    function simpanWang(){
        if(state.wang<100){toast('Wang tidak cukup!');return}
        state.wang-=100;
        state.simpanan+=100;
        simpan();showStats();
        addLog('Simpan RM100','baik');
    }

    function laburWang(){
        if(state.wang<200){toast('Wang tidak cukup!');return}
        state.wang-=200;
        state.pelaburan+=200;
        state.masa+=1;
        simpan();showStats();
        addLog('Labur RM200','baik');
    }

    function bayarHutang(){
        if(state.wang<150){toast('Wang tidak cukup!');return}
        state.wang-=150;
        state.hutang=Math.max(0,state.hutang-150);
        simpan();showStats();
        addLog('Bayar hutang RM150','baik');
    }

    function toggleAutoSimpan(){state.tetapan.autoSimpan=!state.tetapan.autoSimpan;simpan();toast('Auto simpan '+(state.tetapan.autoSimpan?'AKTIF':'MATI'))}
    function toggleNotifikasi(){state.tetapan.notifikasi=!state.tetapan.notifikasi;simpan();toast('Notifikasi '+(state.tetapan.notifikasi?'AKTIF':'MATI'))}
    function ubahKelajuan(v){state.tetapan.kelajuan=parseInt(v);simpan();toast('Kelajuan '+v+'x')}
    function resetGame(){
        if(confirm('Pasti reset semua progress?')){
            state={umur:18,kesihatan:85,mental:80,tenaga:70,kenyang:70,air:70,pengetahuan:30,kemahiran:20,stamina:60,kebahagiaan:75,masa:0,tahun:1,hidup:true,wang:1000,pengalaman:0,tahap:1,mood:'neutral',inventori:{},pencapaian:{},quest:{},statistik:{totalMakan:0,totalTidur:0,totalKerja:0,totalBelajar:0,totalSukan:0,totalSosial:0},tetapan:{autoSimpan:true,kelajuan:1,notifikasi:true}};
            simpan();showStats();
            toast('Game direset');
        }
    }

    function startAutoSave(){
        if(autoSaveInterval)clearInterval(autoSaveInterval);
        autoSaveInterval=setInterval(function(){
            if(pengguna&&state.tetapan.autoSimpan){
                simpan();
            }
        },30000);
    }

    function advanceTime(hours){
        for(var h=0;h<hours;h++){
            state.masa++;
            state.kenyang=Math.max(0,state.kenyang-5);
            state.air=Math.max(0,state.air-3);
            state.tenaga=Math.max(0,state.tenaga-2);
            state.stamina=Math.max(0,state.stamina-1);
            
            if(state.kenyang<=0){state.kesihatan=Math.max(0,state.kesihatan-10);addLog('Kelaparan!','buruk')}
            if(state.air<=0){state.kesihatan=Math.max(0,state.kesihatan-15);addLog('Dehidrasi!','buruk')}
            if(state.tenaga<=0){state.kesihatan=Math.max(0,state.kesihatan-5);addLog('Letih!','buruk')}
            if(state.masa>=24){state.masa=0;state.tahun++;state.umur++}
            if(state.kesihatan<=0||state.umur>80){state.hidup=false;toast('GAME OVER!')}
        }
        simpan();showStats();
    }

    document.getElementById('btnLogin').addEventListener('click',function(){login(document.getElementById('namaLogin').value.trim(),document.getElementById('kataLogin').value.trim())});
    document.getElementById('btnDaftar').addEventListener('click',function(){daftar(document.getElementById('namaLogin').value.trim(),document.getElementById('kataLogin').value.trim())});
    document.getElementById('btnLogout').addEventListener('click',function(){
        pengguna=null;
        document.getElementById('hidupCard').style.display='none';
        if(autoSaveInterval)clearInterval(autoSaveInterval);
        toast('Logout');
    });
    document.getElementById('btnJam').addEventListener('click',function(){
        if(!state.hidup)return;
        if(!rateLimit())return;
        advanceTime(1*state.tetapan.kelajuan);
    });
    document.getElementById('btnHari').addEventListener('click',function(){
        if(!state.hidup)return;
        if(!rateLimit())return;
        advanceTime(24*state.tetapan.kelajuan);
    });
    document.getElementById('btnMinggu').addEventListener('click',function(){
        if(!state.hidup)return;
        if(!rateLimit())return;
        advanceTime(168*state.tetapan.kelajuan);
    });

    showStats();
</script>
