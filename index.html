<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Mesh Chat - Real IP Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
  </style>
</head>
<body class="h-full text-gray-100 font-sans flex flex-col overflow-hidden antialiased">

  <!-- TOP APP BAR -->
  <header class="h-14 bg-gray-900 border-b border-gray-800 px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-network-wired text-lg"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-sm font-bold tracking-tight text-white">StreamMesh IP Engine</h1>
          <span id="socketBadge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="socketStatusText">IP Verified</span>
          </span>
        </div>
        <p class="text-[11px] text-gray-400">Your IP: <span id="myIpDisplay" class="font-mono text-indigo-300">Fetching...</span> | <span id="activeIpCount" class="font-bold text-white">0</span> Unique IP(s) Online</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="UI.toggleRoster()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 p-2 rounded-lg text-xs transition md:hidden">
        <i class="fa-solid fa-users"></i>
      </button>
    </div>
  </header>

  <!-- WORKSPACE BODY -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- MAIN CHAT VIEW -->
    <main class="flex-1 flex flex-col bg-gray-950 overflow-hidden relative">
      <div id="messageViewport" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div id="messagesList" class="space-y-3"></div>
      </div>

      <!-- COMPOSER -->
      <footer class="bg-gray-900 border-t border-gray-800 p-3 shrink-0">
        <form id="chatForm" onsubmit="Engine.handleSendMessage(event)" class="flex items-center space-x-2">
          <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3.5 py-2 text-xs text-gray-100 focus:outline-none focus:border-indigo-500 transition">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
            <span>Send</span>
            <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </form>
      </footer>
    </main>

    <!-- ROSTER SIDEBAR (REAL IPs) -->
    <aside id="rosterSidebar" class="w-72 bg-gray-900 border-l border-gray-800 flex flex-col transition-all duration-300 absolute md:relative right-0 top-0 bottom-0 z-20 translate-x-full md:translate-x-0 shrink-0">
      <div class="p-3 border-b border-gray-800 flex justify-between items-center">
        <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Active Public IPs</h2>
        <span id="rosterBadge" class="bg-indigo-950 text-indigo-400 border border-indigo-800/50 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="userRosterList" class="flex-1 overflow-y-auto p-2 space-y-1.5"></div>
    </aside>

  </div>

  <!-- APPLICATION MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Public Firebase Demo Instance Config (Or replace with your config)
    const firebaseConfig = {
      databaseURL: "https://realtime-mesh-ip-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const State = {
      myIp: "Detecting...",
      sessionId: `session_${Math.random().toString(36).substr(2, 9)}`,
      onlineNodes: new Map(),
      messages: []
    };

    // --- REAL IP DETECTION ENGINE ---
    async function fetchRealIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
      } catch (err) {
        // Fallback IP provider
        try {
          const res = await fetch('https://ipapi.co/json/');
          const data = await res.json();
          return data.ip;
        } catch {
          return "127.0.0.1";
        }
      }
    }

    // --- ENGINE LOGIC ---
    window.Engine = {
      async init() {
        // 1. Fetch Real IP from Client Network
        State.myIp = await fetchRealIP();
        document.getElementById("myIpDisplay").innerText = State.myIp;

        // 2. Register Presence in Realtime DB with IP
        const presenceRef = ref(db, `presence/${State.sessionId}`);
        const nodeData = {
          ip: State.myIp,
          userAgent: navigator.userAgent,
          lastSeen: serverTimestamp()
        };

        set(presenceRef, nodeData);
        onDisconnect(presenceRef).remove(); // Auto purge when socket closes

        // Heartbeat to keep connection alive
        setInterval(() => {
          set(presenceRef, { ...nodeData, lastSeen: Date.now() });
        }, 10000);

        // 3. Listen for Real Online Nodes across the world
        onValue(ref(db, 'presence'), (snapshot) => {
          const data = snapshot.val() || {};
          State.onlineNodes.clear();
          
          const now = Date.now();
          Object.values(data).forEach(node => {
            // Filter out stale sessions (older than 30s)
            if (node.lastSeen && (now - node.lastSeen < 30000 || typeof node.lastSeen !== 'number')) {
              State.onlineNodes.set(node.ip, node);
            }
          });

          UI.renderRoster();
        });

        // 4. Listen for Realtime Messages
        onValue(ref(db, 'chat_messages'), (snapshot) => {
          const data = snapshot.val() || {};
          State.messages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
          UI.renderMessages();
        });
      },

      handleSendMessage(e) {
        e.preventDefault();
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text) return;

        const msgRef = ref(db, `chat_messages/msg_${Date.now()}`);
        set(msgRef, {
          ip: State.myIp,
          text: text,
          timestamp: Date.now(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        input.value = "";
      }
    };

    // --- UI RENDERER ---
    window.UI = {
      renderRoster() {
        const list = document.getElementById("userRosterList");
        const uniqueIps = Array.from(State.onlineNodes.values());

        document.getElementById("rosterBadge").innerText = uniqueIps.length;
        document.getElementById("activeIpCount").innerText = uniqueIps.length;

        list.innerHTML = uniqueIps.map(node => `
          <div class="p-2 bg-gray-950 border border-gray-800 rounded-lg flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span class="font-mono text-xs font-semibold ${node.ip === State.myIp ? 'text-indigo-400' : 'text-gray-200'}">
                ${node.ip} ${node.ip === State.myIp ? '(You)' : ''}
              </span>
            </div>
            <span class="text-[9px] bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded font-mono">Verified IP</span>
          </div>
        `).join('');
      },

      renderMessages() {
        const list = document.getElementById("messagesList");
        list.innerHTML = State.messages.map(m => {
          const isSelf = m.ip === State.myIp;
          return `
            <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
              <div class="flex items-baseline space-x-1.5 mb-0.5">
                <span class="text-[10px] font-mono text-gray-400">${m.ip}</span>
                <span class="text-[9px] text-gray-600">${m.time}</span>
              </div>
              <div class="max-w-xs sm:max-w-md ${isSelf ? 'bg-indigo-600 text-white rounded-l-xl rounded-tr-xl' : 'bg-gray-900 text-gray-100 rounded-r-xl rounded-tl-xl border border-gray-800'} p-2.5 text-xs shadow-sm">
                ${m.text}
              </div>
            </div>
          `;
        }).join('');

        const vp = document.getElementById("messageViewport");
        vp.scrollTop = vp.scrollHeight;
      },

      toggleRoster() {
        document.getElementById("rosterSidebar").classList.toggle("translate-x-full");
      }
    };

    window.addEventListener("DOMContentLoaded", () => Engine.init());
  </script>
</body>
</html>
