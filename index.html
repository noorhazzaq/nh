<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no">
<title>⚡ NEON PULSE CHAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
html,body{width:100%;height:100%;background:#0a0a12;overflow:hidden;position:relative}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1a0a2e,#0a0a12 70%)}
#app{width:100%;height:100%;max-width:640px;max-height:960px;background:linear-gradient(145deg,#12121f,#1a1a2e);border-radius:0;display:flex;flex-direction:column;position:relative;overflow:hidden;border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 60px rgba(255,0,255,.3),0 0 120px rgba(0,255,255,.15),inset 0 0 80px rgba(255,0,255,.05)}
@media(min-width:720px){#app{border-radius:40px;max-height:85vh;box-shadow:0 0 80px rgba(255,0,255,.4),0 0 160px rgba(0,255,255,.2),inset 0 0 100px rgba(255,0,255,.08)}}
#app::before{content:'';position:absolute;inset:-3px;border-radius:inherit;background:conic-gradient(from 0deg,#ff00ff,#00ffff,#ff00ff,#ffaa00,#ff00ff,#00ffff,#ff00ff);background-size:300% 300%;z-index:-1;animation:spinBorder 6s linear infinite;opacity:.7;filter:blur(2px)}
@keyframes spinBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.header{background:rgba(10,10,30,.85);backdrop-filter:blur(12px);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid;border-image:linear-gradient(90deg,#ff00ff,#00ffff,#ffaa00,#ff00ff)1;flex-shrink:0;position:relative;z-index:2;box-shadow:0 4px 30px rgba(255,0,255,.2)}
.header .brand{font-size:1.2rem;font-weight:800;background:linear-gradient(90deg,#ff00ff,#00ffff,#ffaa00,#ff00ff);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowText 3s linear infinite;letter-spacing:2px;text-shadow:0 0 30px rgba(255,0,255,.5);flex:1;white-space:nowrap}
@keyframes rainbowText{0%{background-position:0%}100%{background-position:300%}}
.header .user-area{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header .user-area input{background:rgba(20,20,50,.8);border:1.5px solid #ff00ff88;border-radius:30px;padding:7px 16px;color:#f0fcff;font-size:.8rem;width:110px;transition:.4s;outline:0;box-shadow:0 0 20px rgba(255,0,255,.2),inset 0 0 20px rgba(255,0,255,.05)}
.header .user-area input:focus{width:140px;border-color:#00ffff;box-shadow:0 0 40px rgba(0,255,255,.6),0 0 80px rgba(255,0,255,.3);background:rgba(10,10,40,.9)}
.header .user-area button{background:linear-gradient(135deg,#ff00ff,#cc00ff);border:0;border-radius:30px;padding:6px 16px;font-size:.75rem;font-weight:700;color:#fff;cursor:pointer;transition:.3s;text-shadow:0 0 20px rgba(255,255,255,.5);box-shadow:0 0 30px rgba(255,0,255,.4),inset 0 0 20px rgba(255,255,255,.2);letter-spacing:.5px}
.header .user-area button:active{transform:scale(.9);box-shadow:0 0 60px rgba(0,255,255,.8)}
.chat-area{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;background:radial-gradient(ellipse at 30% 20%,rgba(30,10,50,.6),rgba(10,10,26,.9));position:relative}
.chat-area::-webkit-scrollbar{width:5px}
.chat-area::-webkit-scrollbar-track{background:rgba(255,0,255,.1);border-radius:20px}
.chat-area::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff00ff,#00ffff);border-radius:20px;box-shadow:0 0 20px rgba(255,0,255,.5)}
.message{background:linear-gradient(135deg,rgba(30,20,60,.85),rgba(20,10,40,.9));backdrop-filter:blur(8px);border-radius:18px 18px 18px 4px;padding:12px 16px;border-left:4px solid #ff00ff;box-shadow:0 0 30px rgba(255,0,255,.2),inset 0 0 30px rgba(255,0,255,.05);animation:fadeIn .25s ease;word-break:break-word;max-width:92%;align-self:flex-start;transition:.3s;border:1px solid rgba(255,0,255,.2)}
.message:hover{box-shadow:0 0 50px rgba(255,0,255,.4),inset 0 0 40px rgba(255,0,255,.1)}
.message .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:5px;font-size:.7rem}
.message .username{font-weight:800;background:linear-gradient(90deg,#ff44ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,0,255,.6);letter-spacing:.5px;font-size:.8rem}
.message .time{color:#aab8d0;font-size:.6rem;opacity:.7;font-weight:300;text-shadow:0 0 10px rgba(0,255,255,.2)}
.message .text{color:#e8f0ff;font-size:.93rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;text-shadow:0 0 20px rgba(255,255,255,.05)}
.message .text a{color:#00ffff;text-decoration:none;font-weight:600;border-bottom:2px solid #ff00ff88;padding:0 4px;transition:.3s;text-shadow:0 0 20px rgba(0,255,255,.4)}
.message .text a:active{color:#fff;background:rgba(255,0,255,.3);border-radius:6px;box-shadow:0 0 40px rgba(255,0,255,.5)}
.message.own{align-self:flex-end;border-left-color:#00ffff;border-left-width:4px;background:linear-gradient(135deg,rgba(20,30,70,.85),rgba(10,20,50,.9));box-shadow:0 0 40px rgba(0,255,255,.25),inset 0 0 40px rgba(0,255,255,.05);border-color:rgba(0,255,255,.3)}
.message.own .username{background:linear-gradient(90deg,#00ffff,#ff44ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(0,255,255,.6)}
.neon-pulse{animation:pulseGlow 2.8s infinite alternate}
@keyframes pulseGlow{0%{border-color:rgba(255,0,255,.3);box-shadow:0 0 40px rgba(255,0,255,.2),0 0 80px rgba(0,255,255,.1)}100%{border-color:rgba(0,255,255,.7);box-shadow:0 0 70px rgba(255,0,255,.4),0 0 140px rgba(0,255,255,.25)}}
@keyframes fadeIn{0%{opacity:0;transform:translateY(12px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.input-area{background:rgba(10,10,30,.9);backdrop-filter:blur(12px);padding:12px 14px 16px;display:flex;align-items:flex-end;gap:10px;border-top:2px solid;border-image:linear-gradient(90deg,#ff00ff,#00ffff,#ffaa00,#ff00ff)1;flex-shrink:0;position:relative;z-index:2;box-shadow:0 -4px 30px rgba(255,0,255,.15)}
.input-area textarea{flex:1;background:rgba(20,20,50,.7);border:1.5px solid #ff00ff66;border-radius:28px;padding:12px 18px;color:#f0fcff;font-size:.95rem;resize:none;min-height:50px;max-height:130px;outline:0;transition:.4s;line-height:1.4;font-family:inherit;box-shadow:inset 0 0 30px rgba(255,0,255,.05)}
.input-area textarea:focus{border-color:#00ffff;box-shadow:0 0 50px rgba(0,255,255,.3),inset 0 0 40px rgba(255,0,255,.1);background:rgba(12,12,40,.9)}
.input-area .send-btn{background:linear-gradient(145deg,#ff00ff,#cc00ff,#aa00ff);border:0;border-radius:50px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:300;color:#fff;cursor:pointer;transition:.3s;box-shadow:0 0 50px rgba(255,0,255,.5),inset 0 0 30px rgba(255,255,255,.2);flex-shrink:0;text-shadow:0 0 30px rgba(255,255,255,.3)}
.input-area .send-btn:active{transform:scale(.82);box-shadow:0 0 80px rgba(0,255,255,.8),0 0 120px rgba(255,0,255,.6)}
.banned-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:24px;color:#ff4466;font-size:1.6rem;text-align:center;padding:30px;font-weight:700}
.banned-overlay .icon{font-size:5rem;filter:drop-shadow(0 0 60px #ff4466);animation:pulseGlow 1.5s infinite alternate}
.banned-overlay span{color:#ff88aa;text-shadow:0 0 40px rgba(255,68,102,.4)}
@media(max-width:480px){.header .brand{font-size:1rem}.header .user-area input{width:80px}.header .user-area input:focus{width:110px}.message{padding:10px 12px;font-size:.85rem}.message .username{font-size:.75rem}.input-area textarea{font-size:.85rem;padding:10px 14px}.input-area .send-btn{width:48px;height:48px;font-size:1.5rem}}
</style>
</head>
<body>
<div id="app" class="neon-pulse">
<div class="header">
<span class="brand">✦ NEON PULSE ✦</span>
<div class="user-area">
<input type="text" id="usernameInput" placeholder="Name" maxlength="20" value="Guest">
<button id="setNameBtn">⚡</button>
</div>
</div>
<div class="chat-area" id="chatContainer"></div>
<div class="input-area">
<textarea id="msgInput" rows="1" placeholder="Message..."></textarea>
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>
<div class="banned-overlay" id="bannedOverlay"><div class="icon">⛔</div><div>ACCESS DENIED<br><span style="font-size:1rem;opacity:.7">Android Only</span></div></div>
<script>
(function(){'use strict';
const isAndroid=/android/i.test(navigator.userAgent);
if(!isAndroid){document.getElementById('bannedOverlay').style.display='flex';document.getElementById('app').style.filter='blur(8px)';return;}
const DB_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
let db,messagesRef,nameRef;
let currentUser='Guest';
const chat=document.getElementById('chatContainer');
const msgInput=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');
const usernameInput=document.getElementById('usernameInput');
const setNameBtn=document.getElementById('setNameBtn');
function initFirebase(){if(typeof firebase!=='undefined'){try{if(!firebase.apps.length){firebase.initializeApp({databaseURL:DB_URL});}db=firebase.database();messagesRef=db.ref('messages');nameRef=db.ref('users/'+currentUser.replace(/[.#$[\]]/g,'_'));}catch(e){console.warn('FB init issue',e);}}else{setTimeout(initFirebase,300);}}
function loadMessages(){if(!messagesRef)return;messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added',function(snap){const data=snap.val();if(data&&data.text&&data.username){appendMessage(data.username,data.text,data.timestamp,data.userId===currentUser);}});}
function appendMessage(username,text,timestamp,isOwn){const msgDiv=document.createElement('div');msgDiv.className='message'+(isOwn?' own':'');
const meta=document.createElement('div');meta.className='meta';
const uname=document.createElement('span');uname.className='username';uname.textContent=username||'Anon';
const time=document.createElement('span');time.className='time';if(timestamp){const d=new Date(timestamp);time.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}else{time.textContent='now';}
meta.appendChild(uname);meta.appendChild(time);
const textDiv=document.createElement('div');textDiv.className='text';
textDiv.innerHTML=linkify(text);
msgDiv.appendChild(meta);msgDiv.appendChild(textDiv);
chat.appendChild(msgDiv);
chat.scrollTop=chat.scrollHeight;
}
function linkify(txt){if(!txt)return'';const urlPattern=/(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gi;return txt.replace(urlPattern,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
function sendMessage(){const text=msgInput.value.trim();if(!text)return;if(!messagesRef){initFirebase();if(!messagesRef){alert('DB not ready');return;}}const userId=currentUser||'Guest';
const payload={username:userId,text:text,timestamp:Date.now(),userId:userId};
messagesRef.push(payload).then(()=>{msgInput.value='';msgInput.style.height='auto';chat.scrollTop=chat.scrollHeight;}).catch(e=>{console.warn('send fail',e);});}
function changeUsername(newName){const trimmed=newName.trim().slice(0,20);if(!trimmed){usernameInput.value=currentUser;return;}if(trimmed===currentUser){return;}
if(trimmed.length<2){alert('Min 2 chars');usernameInput.value=currentUser;return;}
const oldUser=currentUser;
currentUser=trimmed;
usernameInput.value=currentUser;
if(nameRef){nameRef.remove();}
nameRef=db.ref('users/'+currentUser.replace(/[.#$[\]]/g,'_'));
nameRef.set({name:currentUser,updated:Date.now()});
localStorage.setItem('neonUser',currentUser);}
function setupListeners(){
sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
msgInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px';});
setNameBtn.addEventListener('click',function(){const val=usernameInput.value.trim();if(val&&val!==currentUser){changeUsername(val);}else{usernameInput.value=currentUser;}});
usernameInput.addEventListener('keydown',function(e){if(e.key==='Enter'){setNameBtn.click();}});}
function restoreUser(){const saved=localStorage.getItem('neonUser');if(saved){currentUser=saved;usernameInput.value=saved;}}
(function boot(){restoreUser();initFirebase();setTimeout(()=>{if(!db){initFirebase();}},500);setupListeners();loadMessages();})();
window.addEventListener('online',function(){if(!db){initFirebase();}});
})();
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</body>
</html>
