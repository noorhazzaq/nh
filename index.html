<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Two-Way Video Call</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--font:system-ui,-apple-system,sans-serif;--bg:#0a0a12;--surface:#1a1a2e;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.06);--blue:#0084ff;--green:#31a24c;--text:#fff;--muted:rgba(255,255,255,.5);--dim:rgba(255,255,255,.15);--radius:16px;--full:9999px}
    body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;display:flex;justify-content:center;align-items:center;padding:8px;overflow:hidden}

    .app{width:100%;max-width:480px;height:100%;max-height:932px;background:var(--surface);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;position:relative}

    .header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px}
    .brand{display:flex;align-items:center;gap:6px}
    .brand .logo{width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
    .brand .title{font-size:.9rem;font-weight:700;color:var(--text)}
    .right{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
    .badge{display:flex;align-items:center;gap:4px;font-size:.55rem;color:var(--muted)}
    .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
    .badge .dot.off{background:#e94560;animation:blink .8s infinite}
    .badge .count{color:var(--text);font-weight:600}

    .auth{display:flex;gap:4px;align-items:center}
    .auth input{padding:3px 8px;border:1px solid var(--border);border-radius:var(--full);background:var(--card);color:var(--text);font-family:var(--font);font-size:.6rem;width:60px;min-height:24px;flex:1;min-width:40px}
    .auth input:focus{outline:none;border-color:var(--blue)}
    .auth input::placeholder{color:var(--dim)}
    .auth input:disabled{opacity:.4}
    .btn{padding:3px 10px;border:none;border-radius:var(--full);background:var(--blue);color:#fff;font-family:var(--font);font-size:.55rem;font-weight:600;cursor:pointer;min-height:24px;white-space:nowrap;flex-shrink:0;transition:.2s}
    .btn:active{transform:scale(.95)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn--danger{background:#e94560}
    .btn--call{background:var(--green);animation:pulseCall 2s infinite}
    .btn--call.active{background:#e94560;animation:blink .8s infinite}
    @keyframes pulseCall{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    .msgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
    .msgs::-webkit-scrollbar{width:3px}
    .msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--full)}
    .status-msg{text-align:center;font-size:.6rem;color:var(--muted);padding:16px 10px}
    .msg{max-width:82%;padding:4px 10px;border-radius:14px;word-wrap:break-word;animation:slide .25s ease;line-height:1.4;font-size:.75rem;margin-bottom:2px}
    .msg.own{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
    .msg.other{align-self:flex-start;background:var(--card);color:var(--text);border-bottom-left-radius:4px}
    .msg .sender{font-size:.5rem;font-weight:600;opacity:.6;margin-bottom:1px}
    .msg .time{font-size:.45rem;opacity:.4;margin-left:4px}
    .msg .text{word-break:break-word}

    .typing{display:none;align-items:center;gap:3px;padding:3px 10px;background:var(--card);border-radius:var(--full);font-size:.55rem;color:var(--muted);margin:2px 0;align-self:flex-start}
    .typing.active{display:flex}
    .typing .dot{width:4px;height:4px;border-radius:50%;background:var(--blue);animation:bounce 1.2s infinite}
    .typing .dot:nth-child(2){animation-delay:.2s}
    .typing .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
    @keyframes slide{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}

    .input-area{padding:4px 10px 10px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
    .row{display:flex;gap:4px;align-items:center}
    .row input{flex:1;padding:6px 12px;border:1px solid var(--border);border-radius:var(--full);background:var(--card);color:var(--text);font-family:var(--font);font-size:.75rem;min-height:32px}
    .row input:focus{outline:none;border-color:var(--blue)}
    .row input::placeholder{color:var(--dim)}
    .row input:disabled{opacity:.3}
    .row .btn{font-size:.65rem;padding:6px 14px;min-height:32px;flex-shrink:0}

    /* ===== VIDEO CALL OVERLAY — TWO-WAY ===== */
    .call-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
    .call-overlay.active{display:flex;animation:fadeIn .3s}
    @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}

    .call-grid{width:100%;max-width:600px;display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
    .call-grid video{width:100%;border-radius:var(--radius);background:#0a0a12;border:2px solid var(--border);max-height:40vh;object-fit:cover}
    .call-grid .remote{grid-column:1;grid-row:1}
    .call-grid .local{grid-column:2;grid-row:1}

    .call-info{display:flex;flex-direction:column;align-items:center;gap:4px}
    .call-info .status{font-size:.7rem;color:var(--muted)}
    .call-info .timer{font-size:1rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}

    .call-actions{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap;justify-content:center}
    .call-actions button{width:48px;height:48px;border-radius:50%;border:none;font-size:1.2rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
    .call-actions button:hover{transform:scale(1.1)}
    .call-actions .end{background:#e94560;color:#fff;width:56px;height:56px;font-size:1.4rem}
    .call-actions .mute{background:var(--card);color:var(--text)}
    .call-actions .mute.muted{background:var(--blue);color:#fff}
    .call-actions .camera{background:var(--card);color:var(--text)}
    .call-actions .camera.off{background:var(--blue);color:#fff}
    .call-actions .switch{background:var(--card);color:var(--text);font-size:1rem}

    /* ===== RESPONSIVE ===== */
    @media(max-width:380px){
      .header{padding:6px 8px}
      .brand .logo{width:22px;height:22px;font-size:.6rem}
      .brand .title{font-size:.7rem}
      .auth input{font-size:.5rem;padding:2px 6px;min-height:20px;width:45px}
      .btn{font-size:.45rem;padding:2px 6px;min-height:20px}
      .msgs{padding:4px 6px}
      .msg{max-width:92%;padding:3px 6px;font-size:.65rem}
      .row input{font-size:.6rem;padding:4px 8px;min-height:26px}
      .row .btn{font-size:.55rem;padding:4px 8px;min-height:26px}
      .call-grid{grid-template-columns:1fr 1fr;gap:4px}
      .call-grid video{max-height:30vh}
      .call-actions button{width:36px;height:36px;font-size:.9rem}
      .call-actions .end{width:42px;height:42px;font-size:1.1rem}
    }

    @media(max-height:500px) and (orientation:landscape){
      .app{max-height:95vh;border-radius:var(--radius)}
      .header{padding:3px 8px;min-height:30px}
      .brand .logo{width:18px;height:18px;font-size:.5rem}
      .brand .title{font-size:.6rem}
      .msgs{padding:3px 6px;gap:1px}
      .msg{padding:2px 6px;max-width:90%;font-size:.55rem}
      .input-area{padding:2px 6px 6px}
      .row input{min-height:20px;padding:3px 8px;font-size:.5rem}
      .row .btn{min-height:20px;padding:3px 8px;font-size:.45rem}
      .call-grid video{max-height:25vh}
      .call-actions button{width:30px;height:30px;font-size:.7rem}
      .call-actions .end{width:36px;height:36px;font-size:.9rem}
    }

    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  </style>
</head>
<body>

  <!-- ===== VIDEO CALL OVERLAY ===== -->
  <div class="call-overlay" id="callOverlay">
    <div class="call-grid">
      <video class="remote" id="remoteVideo" autoplay playsinline></video>
      <video class="local" id="localVideo" autoplay muted playsinline></video>
    </div>
    <div class="call-info">
      <div class="status" id="callStatus">Connecting...</div>
      <div class="timer" id="callTimer">00:00</div>
    </div>
    <div class="call-actions">
      <button class="mute" id="muteBtn" title="Mute">🔇</button>
      <button class="camera" id="cameraBtn" title="Camera">📷</button>
      <button class="switch" id="switchBtn" title="Switch Camera">🔄</button>
      <button class="end" id="endCallBtn" title="End call">📞</button>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">📹</div>
        <h1 class="title">Video Chat</h1>
      </div>
      <div class="right">
        <div class="badge">
          <span class="dot" id="dot"></span>
          <span class="count" id="count">0</span>
        </div>
        <div class="auth">
          <input type="text" id="name" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn" id="join">Join</button>
          <button class="btn btn--danger" id="leave" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <div class="msgs" id="msgs">
      <div class="status-msg">✦ Connecting...</div>
      <div class="typing" id="typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span style="margin-left:4px;">typing</span>
      </div>
    </div>

    <div style="padding:3px 10px;display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--border)">
      <button class="btn btn--call" id="callBtn" style="flex:1;min-height:28px;font-size:.6rem">📹 Start Call</button>
    </div>

    <footer class="input-area">
      <div class="row">
        <input type="text" id="input" placeholder="Type a message..." disabled inputmode="text" autocomplete="off" />
        <button class="btn" id="send" disabled>Send</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE SDK
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * TWO-WAY VIDEO CALL — A Sees B, B Sees A
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    let db = null;

    function initFirebase() {
      try {
        if (typeof firebase === 'undefined') { setTimeout(initFirebase, 500); return }
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp({
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
          });
        }
        db = firebase.database();
        console.log('✅ Firebase ready');
        startApp();
      } catch (e) { console.error('Firebase error:', e);
        setTimeout(initFirebase, 2000) }
    }

    // ============================================================
    // 2. DOM
    // ============================================================

    const $ = id => document.getElementById(id);
    const D = {
      msgs: $('msgs'),
      input: $('input'),
      send: $('send'),
      name: $('name'),
      join: $('join'),
      leave: $('leave'),
      count: $('count'),
      dot: $('dot'),
      callBtn: $('callBtn'),
      callOverlay: $('callOverlay'),
      localVideo: $('localVideo'),
      remoteVideo: $('remoteVideo'),
      callStatus: $('callStatus'),
      callTimer: $('callTimer'),
      muteBtn: $('muteBtn'),
      cameraBtn: $('cameraBtn'),
      switchBtn: $('switchBtn'),
      endCallBtn: $('endCallBtn'),
    };
    const typingEl = $('typing');

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null,
      listeners = [],
      connected = !1,
      start = Date.now();
    let localStream = null,
      remoteStream = null,
      peerConnection = null;
    let callActive = !1,
      callTimerInterval = null,
      callSeconds = 0;
    let muted = !1,
      cameraOff = !1,
      usingFrontCamera = !0;
    let callListeners = [];

    // ============================================================
    // 4. HELPERS
    // ============================================================

    function setStatus(t) {
      let e = D.msgs.querySelector('.status-msg');
      if (!e) { e = document.createElement('div');
        e.className = 'status-msg';
        D.msgs.appendChild(e) }
      e.textContent = t;
    }

    function clearStatus() { const e = D.msgs.querySelector('.status-msg'); if (e) e.remove() }

    function scrollBottom() { requestAnimationFrame(() => { D.msgs.scrollTop = D.msgs.scrollHeight }) }

    function formatTime(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) } catch (e) { return '' }
    }

    function setOnline(on) {
      connected = on;
      D.dot.className = 'dot' + (on ? '' : ' off');
      if (on) {
        console.log('⚡ Connected');
        setStatus('✦ Connected ✦');
        setTimeout(() => { const e = D.msgs.querySelector('.status-msg'); if (e && e.textContent === '✦ Connected ✦')
            clearStatus() }, 600);
      } else setStatus('✦ Reconnecting...');
    }

    // ============================================================
    // 5. WEBRTC — TWO-WAY VIDEO CALL
    // ============================================================

    const CALL_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
      ]
    };

    async function getMedia() {
      const constraints = {
        video: {
          facingMode: usingFrontCamera ? 'user' : 'environment',
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: true
      };
      return await navigator.mediaDevices.getUserMedia(constraints);
    }

    async function startCall() {
      if (!user) return alert('Sign in first!');
      if (callActive) return endCall();

      try {
        // Get local media
        localStream = await getMedia();
        D.localVideo.srcObject = localStream;

        // Create peer connection
        peerConnection = new RTCPeerConnection(CALL_CONFIG);

        // Add local tracks
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // Handle remote stream (B sees A)
        peerConnection.ontrack = (event) => {
          remoteStream = event.streams[0];
          D.remoteVideo.srcObject = remoteStream;
        };

        // Handle ICE candidates
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            db.ref('calls/' + user.uid + '/candidate').push({
              candidate: event.candidate,
              from: user.uid
            });
          }
        };

        // Create offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        // Send offer to Firebase
        await db.ref('calls/' + user.uid + '/offer').set({
          sdp: offer,
          from: user.uid,
          name: user.name
        });

        // Cleanup old listeners
        callListeners.forEach(ref => { try { ref.off() } catch (e) {} });
        callListeners = [];

        // Listen for answer
        const answerRef = db.ref('calls/' + user.uid + '/answer');
        answerRef.on('value', async (snapshot) => {
          const data = snapshot.val();
          if (data && data.sdp && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            D.callStatus.textContent = 'Connected';
            startCallTimer();
            callActive = true;
            D.callBtn.textContent = '📹 End Call';
            D.callBtn.classList.add('active');
            db.ref('calls/' + user.uid + '/status').set('connected');
          }
        });
        callListeners.push(answerRef);

        // Listen for ICE candidates
        const candidateRef = db.ref('calls/' + user.uid + '/candidate');
        candidateRef.on('child_added', async (snapshot) => {
          const data = snapshot.val();
          if (data && data.from !== user.uid && peerConnection) {
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) { /* ignore */ }
          }
        });
        callListeners.push(candidateRef);

        // Listen for call end
        const endRef = db.ref('calls/' + user.uid + '/end');
        endRef.on('value', (snapshot) => {
          if (snapshot.val() === true) {
            endCall();
          }
        });
        callListeners.push(endRef);

        D.callOverlay.classList.add('active');
        D.callStatus.textContent = 'Calling...';
        D.callBtn.textContent = '📹 End Call';
        D.callBtn.classList.add('active');
        db.ref('calls/' + user.uid + '/status').set('calling');

        console.log('📹 Call started as ' + (usingFrontCamera ? 'front' : 'back') + ' camera');

      } catch (e) {
        console.error('Call error:', e);
        alert('Could not start call. Please allow camera and microphone access.');
        endCall();
      }
    }

    async function answerCall(offerData, callerId) {
      if (callActive) return;
      if (!offerData) return;

      try {
        // Get local media
        localStream = await getMedia();
        D.localVideo.srcObject = localStream;

        // Create peer connection
        peerConnection = new RTCPeerConnection(CALL_CONFIG);

        // Add local tracks
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // Handle remote stream (A sees B)
        peerConnection.ontrack = (event) => {
          remoteStream = event.streams[0];
          D.remoteVideo.srcObject = remoteStream;
        };

        // Handle ICE candidates
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            db.ref('calls/' + callerId + '/candidate').push({
              candidate: event.candidate,
              from: user.uid
            });
          }
        };

        // Set remote description
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerData.sdp));

        // Create answer
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        // Send answer
        await db.ref('calls/' + callerId + '/answer').set({
          sdp: answer,
          from: user.uid
        });

        // Cleanup old listeners
        callListeners.forEach(ref => { try { ref.off() } catch (e) {} });
        callListeners = [];

        // Listen for ICE candidates
        const candidateRef = db.ref('calls/' + callerId + '/candidate');
        candidateRef.on('child_added', async (snapshot) => {
          const data = snapshot.val();
          if (data && data.from !== user.uid && peerConnection) {
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) { /* ignore */ }
          }
        });
        callListeners.push(candidateRef);

        // Listen for call end
        const endRef = db.ref('calls/' + callerId + '/end');
        endRef.on('value', (snapshot) => {
          if (snapshot.val() === true) {
            endCall();
          }
        });
        callListeners.push(endRef);

        D.callOverlay.classList.add('active');
        D.callStatus.textContent = 'Connected';
        startCallTimer();
        callActive = true;
        D.callBtn.textContent = '📹 End Call';
        D.callBtn.classList.add('active');
        db.ref('calls/' + user.uid + '/status').set('connected');

        console.log('📹 Call answered with ' + (usingFrontCamera ? 'front' : 'back') + ' camera');

      } catch (e) {
        console.error('Answer error:', e);
        alert('Could not answer call.');
        endCall();
      }
    }

    function endCall() {
      // Stop timer
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
        callSeconds = 0;
        D.callTimer.textContent = '00:00';
      }

      // Cleanup call listeners
      callListeners.forEach(ref => { try { ref.off() } catch (e) {} });
      callListeners = [];

      // Close peer connection
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      // Stop local stream
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      // Clear streams
      remoteStream = null;
      D.localVideo.srcObject = null;
      D.remoteVideo.srcObject = null;

      // Cleanup Firebase
      if (user) {
        try { db.ref('calls/' + user.uid).remove() } catch (e) {}
      }

      callActive = false;
      D.callOverlay.classList.remove('active');
      D.callBtn.textContent = '📹 Start Call';
      D.callBtn.classList.remove('active');
      D.callStatus.textContent = 'Call ended';
      setTimeout(() => { D.callStatus.textContent = '' }, 2000);

      muted = false;
      cameraOff = false;
      D.muteBtn.textContent = '🔇';
      D.muteBtn.classList.remove('muted');
      D.cameraBtn.textContent = '📷';
      D.cameraBtn.classList.remove('off');

      console.log('📹 Call ended');
    }

    function startCallTimer() {
      callSeconds = 0;
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        D.callTimer.textContent = m + ':' + s;
      }, 1000);
    }

    function toggleMute() {
      if (!localStream) return;
      muted = !muted;
      localStream.getAudioTracks().forEach(t => t.enabled = !muted);
      D.muteBtn.textContent = muted ? '🔊' : '🔇';
      D.muteBtn.classList.toggle('muted', muted);
    }

    function toggleCamera() {
      if (!localStream) return;
      cameraOff = !cameraOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !cameraOff);
      D.cameraBtn.textContent = cameraOff ? '📷❌' : '📷';
      D.cameraBtn.classList.toggle('off', cameraOff);
    }

    async function switchCamera() {
      if (!localStream) return;
      usingFrontCamera = !usingFrontCamera;

      // Get new stream with new camera
      try {
        const newStream = await getMedia();
        // Replace tracks
        const videoTrack = newStream.getVideoTracks()[0];
        const oldVideoTrack = localStream.getVideoTracks()[0];
        localStream.removeTrack(oldVideoTrack);
        localStream.addTrack(videoTrack);
        oldVideoTrack.stop();

        // Update local video
        D.localVideo.srcObject = localStream;

        // Update peer connection
        if (peerConnection) {
          const senders = peerConnection.getSenders();
          const sender = senders.find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(videoTrack);
          }
        }

        console.log('🔄 Switched to ' + (usingFrontCamera ? 'front' : 'back') + ' camera');
      } catch (e) {
        console.error('Switch camera error:', e);
        alert('Could not switch camera.');
      }
    }

    // ============================================================
    // 6. LISTEN FOR INCOMING CALLS
    // ============================================================

    function listenForCalls() {
      if (!db) return;

      const callRef = db.ref('calls');
      callRef.on('child_added', (snapshot) => {
        const data = snapshot.val();
        const callerId = snapshot.key;

        if (callerId === user?.uid) return;
        if (!data.offer) return;
        if (data.answer) return;

        // Show incoming call
        D.callStatus.textContent = '📞 Incoming from ' + (data.name || 'Unknown');

        // Auto-answer after 0.5s
        setTimeout(() => {
          if (!callActive && user) {
            answerCall(data.offer, callerId);
          }
        }, 500);
      });
    }

    // ============================================================
    // 7. SEND
    // ============================================================

    function sendMessage(t) {
      if (!user) return alert('Sign in!');
      if (!t || !t.trim()) return;
      if (!connected) return alert('Waiting...');
      if (!db) return alert('Connection error.');

      try {
        db.ref('messages').push({
          name: user.name,
          uid: user.uid,
          text: t.trim(),
          timestamp: firebase.database.ServerValue.TIMESTAMP
        }).catch(() => alert('Failed'));
      } catch (e) { alert('Failed') }

      D.input.value = '';
      D.input.focus();
    }

    // ============================================================
    // 8. RENDER
    // ============================================================

    function render(data) {
      if (!data || !data.text) return;
      const own = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = 'msg ' + (own ? 'own' : 'other');
      el.dataset.key = data._key || '';
      el.innerHTML =
        '<div class="sender">' + (data.name || 'Anon') +
        '<span class="time">' + formatTime(data.timestamp) + '</span></div>' +
        '<div class="text">' + (data.text || '') + '</div>';

      const st = D.msgs.querySelector('.status-msg');
      if (st && (st.textContent === '✦ Connected ✦' || st.textContent === '✦ Reconnecting...')) clearStatus();

      D.msgs.appendChild(el);
      scrollBottom();
    }

    // ============================================================
    // 9. SUBSCRIBE
    // ============================================================

    function subscribe() {
      if (!db) { setTimeout(subscribe, 500); return }
      listeners.forEach(r => { try { r.off() } catch (e) {} });
      listeners = [];

      try {
        const p = db.ref('.info/connected');
        p.on('value', s => {
          const on = s.val() === !0;
          if (on && !connected) setOnline(!0);
          else if (!on) setOnline(!1);
          if (on && user) {
            const r = db.ref('users').child(user.uid);
            r.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            r.onDisconnect().remove();
          }
        });
        listeners.push(p);

        const u = db.ref('users');
        u.on('value', s => {
          if (connected) {
            D.count.textContent = s.exists() ? s.numChildren() : '0';
          }
        });
        listeners.push(u);

        const q = db.ref('messages').orderByKey().limitToLast(50);
        q.on('child_added', s => { if (connected) { const d = s.val();
            d._key = s.key;
            render(d) } });
        q.on('child_removed', s => { const e = D.msgs.querySelector('[data-key="' + s.key + '"]'); if (e) e.remove() });
        listeners.push(q);

        q.once('value', s => {
          if (!s.exists()) {
            const e = D.msgs.querySelector('.status-msg');
            if (!e || e.textContent === '✦ Reconnecting...' || e.textContent === '✦ Connected ✦') {
              setStatus('✦ No messages yet ✦');
              setTimeout(() => { const el = D.msgs.querySelector('.status-msg'); if (el && el.textContent ===
                  '✦ No messages yet ✦') clearStatus() }, 1500);
            }
          }
        });

        listenForCalls();

        console.log('✅ Subscribed');
      } catch (e) { console.error('Subscribe error:', e);
        setTimeout(subscribe, 3000) }
    }

    // ============================================================
    // 10. AUTH
    // ============================================================

    function login() {
      if (!db) return alert('Connection error.');
      const n = D.name.value.trim() || 'User';
      user = { name: n.slice(0, 20), uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) };
      D.name.disabled = !0;
      D.join.style.display = 'none';
      D.leave.style.display = 'inline-block';
      D.input.disabled = !1;
      D.send.disabled = !1;
      D.input.placeholder = 'Message as ' + n + '...';
      clearStatus();
      setStatus('✦ ' + n + ' joined ✦');
      D.callBtn.disabled = !1;
      subscribe();
      if (connected) {
        const r = db.ref('users').child(user.uid);
        r.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        r.onDisconnect().remove();
      }
      D.count.textContent = '1';
      setTimeout(() => { const e = D.msgs.querySelector('.status-msg'); if (e && e.textContent === '✦ ' + n +
          ' joined ✦') clearStatus() }, 1200);
    }

    function logout() {
      try { if (user && db) db.ref('users').child(user.uid).remove() } catch (e) {}
      if (callActive) endCall();
      listeners.forEach(r => { try { r.off() } catch (e) {} });
      listeners = [];
      callListeners.forEach(ref => { try { ref.off() } catch (e) {} });
      callListeners = [];
      user = null;
      D.name.disabled = !1;
      D.join.style.display = 'inline-block';
      D.leave.style.display = 'none';
      D.input.disabled = !0;
      D.send.disabled = !0;
      D.input.placeholder = 'Type a message...';
      D.input.value = '';
      D.msgs.innerHTML = '';
      setStatus('✦ Left chat ✦');
      D.count.textContent = '0';
      connected = !1;
      D.dot.className = 'dot off';
      D.callBtn.disabled = !0;
      D.callBtn.textContent = '📹 Start Call';
      D.callBtn.classList.remove('active');
    }

    // ============================================================
    // 11. EVENTS
    // ============================================================

    D.join.onclick = login;
    D.leave.onclick = logout;
    D.name.onkeydown = e => { if (e.key === 'Enter') login() };
    D.send.onclick = () => sendMessage(D.input.value);
    D.input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
        sendMessage(D.input.value) } };

    D.callBtn.onclick = () => { callActive ? endCall() : startCall() };
    D.endCallBtn.onclick = endCall;
    D.muteBtn.onclick = toggleMute;
    D.cameraBtn.onclick = toggleCamera;
    D.switchBtn.onclick = switchCamera;

    document.querySelectorAll('.btn').forEach(b => {
      b.addEventListener('touchstart', function() { this.style.transform = 'scale(.95)' }, { passive: !0 });
      b.addEventListener('touchend', function() { this.style.transform = '' }, { passive: !0 })
    });

    D.input.addEventListener('focus', () => { setTimeout(() => { D.input.scrollIntoView({ behavior: 'smooth',
          block: 'center' }) }, 300) });

    // ============================================================
    // 12. BOOT
    // ============================================================

    function startApp() {
      start = Date.now();
      setStatus('✦ Connecting...');
      D.callBtn.disabled = !0;
      subscribe();
      setTimeout(() => { if (!connected) setOnline(!0) }, 2000);
      console.log('📹 Two-Way Video Call — A↔B');
    }

    initFirebase();
    setTimeout(() => { if (!db) initFirebase() }, 5000);
  </script>

</body>
</html>
