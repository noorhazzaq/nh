<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;My Site&quot;,&quot;short_name&quot;:&quot;Site&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#ffffff&quot;,&quot;theme_color&quot;:&quot;#000000&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23fff'%3E🚀%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    body{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;justify-content:center;align-items:center;padding:20px}
    .card{max-width:600px;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:32px;padding:48px 40px;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center;animation:fadeUp .6s ease}
    .card .icon{font-size:64px;margin-bottom:16px}
    .card h1{font-size:2.5rem;font-weight:800;color:#1a1a2e;margin-bottom:8px}
    .card p{font-size:1.1rem;color:#666;line-height:1.6;margin-bottom:24px}
    .card .btn{display:inline-block;padding:14px 40px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-weight:700;font-size:1rem;border:none;border-radius:50px;cursor:pointer;transition:.3s;text-decoration:none}
    .card .btn:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(102,126,234,.4)}
    .card .features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:32px;padding-top:32px;border-top:2px solid #f0f0f0}
    .card .features .f{font-size:.85rem;color:#555}
    .card .features .f span{display:block;font-size:28px;margin-bottom:4px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:500px){.card{padding:32px 24px}.card h1{font-size:1.8rem}.card .features{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>

<div class="card">
  <div class="icon">🚀</div>
  <h1>Welcome</h1>
  <p>Build something amazing. This is your brand new website — clean, fast, and ready to go.</p>
  <button class="btn" onclick="alert('Hello! 🎉')">Get Started</button>
  <div class="features">
    <div class="f"><span>⚡</span>Fast</div>
    <div class="f"><span>📱</span>Responsive</div>
    <div class="f"><span>🎨</span>Clean</div>
  </div>
</div>

<script>
  console.log('🚀 Brand new site ready!');
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>

</body>
</html>
