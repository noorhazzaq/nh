<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🌿 Living Site</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden;position:relative}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.container{max-width:800px;width:100%;background:rgba(26,26,46,.85);backdrop-filter:blur(20px);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.8);text-align:center;position:relative;z-index:1;border:1px solid rgba(255,255,255,.05)}
h1{font-size:1.8rem;margin-bottom:4px;background:linear-gradient(135deg,#e94560,#ff6b81,#fbbf24,#34d399);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradient 6s ease-in-out infinite}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{font-size:.8rem;opacity:.6;margin-bottom:12px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
.season-badge{display:inline-block;padding:4px 16px;border-radius:50px;font-size:.7rem;font-weight:600;margin-bottom:12px;animation:badgePulse 2s ease-in-out infinite}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.season-spring{background:#34d399;color:#0f0e17}
.season-summer{background:#fbbf24;color:#0f0e17}
.season-autumn{background:#fb923c;color:#0f0e17}
.season-winter{background:#60a5fa;color:#0f0e17}
.video{position:relative;padding-bottom:56.25%;height:0;border-radius:16px;overflow:hidden;background:#000;border:2px solid rgba(255,255,255,.05);transition:border-color 2s}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.info{margin-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.7rem;opacity:.6}
.info span{background:rgba(255,255,255,.04);padding:4px 12px;border-radius:20px}
.btn{padding:10px 24px;border:none;border-radius:50px;background:#e94560;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;transition:.3s;margin-top:12px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:.3s}
.btn:hover::before{opacity:1}
.btn:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 10px 40px rgba(233,69,96,.3)}
.btn:active{transform:scale(.95)}
.breathing-border{position:absolute;inset:-2px;border-radius:26px;padding:2px;background:conic-gradient(from 0deg,#e94560,#fbbf24,#34d399,#60a5fa,#e94560);background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:borderSpin 8s linear infinite;opacity:.3;transition:opacity 1s}
@keyframes borderSpin{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.clock{font-size:.6rem;opacity:.3;margin-top:12px;font-variant-numeric:tabular-nums}
.flower{position:fixed;font-size:2rem;pointer-events:none;z-index:0;animation:flowerFloat 20s ease-in-out infinite;opacity:.15}
@keyframes flowerFloat{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-20px) rotate(10deg)}50%{transform:translateY(10px) rotate(-5deg)}75%{transform:translateY(-10px) rotate(5deg)}}
.seasonal-text{font-size:.6rem;opacity:.4;margin-top:8px;letter-spacing:2px;text-transform:uppercase;animation:fadeSeason 4s ease-in-out infinite}
@keyframes fadeSeason{0%,100%{opacity:.2}50%{opacity:.6}}
@media(max-width:480px){.container{padding:16px}h1{font-size:1.3rem}.flower{font-size:1.2rem}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="flower" style="top:5%;left:3%;animation-delay:0s">🌸</div>
<div class="flower" style="top:15%;right:5%;animation-delay:-4s">🌺</div>
<div class="flower" style="bottom:20%;left:8%;animation-delay:-8s">🌻</div>
<div class="flower" style="bottom:10%;right:3%;animation-delay:-12s">🌷</div>
<div class="flower" style="top:45%;left:2%;animation-delay:-16s">🌿</div>
<div class="flower" style="top:60%;right:2%;animation-delay:-20s">🌱</div>

<div class="container">
<div class="breathing-border" id="borderGlow"></div>

<div class="season-badge" id="seasonBadge">🌸 SPRING</div>
<h1>🎵 XPDC</h1>
<div class="sub">C.T Cinta Kenangan Silam</div>
<div class="seasonal-text" id="seasonalText">🌱 Blooming season</div>

<div class="video"><iframe id="player" src="https://www.youtube.com/embed/AkkV062Q0NM?enablejsapi=1" title="XPDC" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>

<div class="info">
<span id="viewCount">🎵 1.5M+ views</span>
<span id="dateDisplay">📅 2022</span>
<span>🎸 Rock Kapak</span>
</div>

<button class="btn" onclick="playVideo()">▶ Play</button>
<div class="clock" id="clock"></div>
</div>

<script>
// ===== SEASON SYSTEM =====
function getSeason(){
const m=new Date().getMonth();
if(m>=2&&m<=4)return{name:'SPRING',emoji:'🌸',color:'#34d399',text:'🌱 Blooming season — flowers are waking up',badge:'season-spring'}
if(m>=5&&m<=7)return{name:'SUMMER',emoji:'☀️',color:'#fbbf24',text:'🌻 Sunny days — life is vibrant',badge:'season-summer'}
if(m>=8&&m<=10)return{name:'AUTUMN',emoji:'🍂',color:'#fb923c',text:'🍁 Golden hour — leaves are falling',badge:'season-autumn'}
return{name:'WINTER',emoji:'❄️',color:'#60a5fa',text:'🌨️ Quiet season — stars are bright',badge:'season-winter'}
}

function updateSeason(){
const s=getSeason();
const badge=document.getElementById('seasonBadge');
const text=document.getElementById('seasonalText');
const border=document.getElementById('borderGlow');
badge.textContent=s.emoji+' '+s.name;
badge.className='season-badge '+s.badge;
text.textContent=s.text;
border.style.borderColor=s.color;
border.style.opacity='0.5';
document.querySelector('.video').style.borderColor=s.color+'44';
}

// ===== CLOCK =====
function updateClock(){
const d=new Date();
const h=String(d.getHours()).padStart(2,'0');
const m=String(d.getMinutes()).padStart(2,'0');
const s=String(d.getSeconds()).padStart(2,'0');
document.getElementById('clock').textContent='🕐 '+h+':'+m+':'+s;
}

// ===== VIEWS COUNTER =====
let views=1548000;
function updateViews(){
views+=Math.floor(Math.random()*3)+1;
document.getElementById('viewCount').textContent='🎵 '+views.toLocaleString()+' views';
}

// ===== PLAY VIDEO =====
function playVideo(){
var p=document.getElementById('player');
p.src=p.src.replace('?enablejsapi=1','?enablejsapi=1&autoplay=1');
}

// ===== BACKGROUND PARTICLES =====
const c=document.getElementById('bg-canvas');
const ctx=c.getContext('2d');
let W,H,pts=[];

function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

const colors=['#e94560','#fbbf24','#34d399','#60a5fa','#a78bfa','#fb923c'];
for(let i=0;i<60;i++){
pts.push({
x:Math.random()*W,
y:Math.random()*H,
s:Math.random()*2+1,
vx:(Math.random()-.5)*.3,
vy:(Math.random()-.5)*.3-.1,
c:colors[Math.floor(Math.random()*colors.length)],
l:Math.random()*100+50,
ml:Math.random()*100+50,
g:Math.random()*8+4
});
}

function draw(){
ctx.clearRect(0,0,W,H);
pts.forEach(p=>{
p.x+=p.vx;p.y+=p.vy;p.l--;
if(p.l<=0||p.x<0||p.x>W||p.y<0||p.y>H){
p.x=Math.random()*W;p.y=H;p.l=p.ml;
p.vx=(Math.random()-.5)*.3;p.vy=-Math.random()*.3-.1;
p.c=colors[Math.floor(Math.random()*colors.length)];
}
const a=p.l/p.ml;
ctx.beginPath();
ctx.arc(p.x,p.y,p.s*a,0,Math.PI*2);
ctx.fillStyle=p.c;
ctx.shadowColor=p.c;
ctx.shadowBlur=p.g*a;
ctx.fill();
});
requestAnimationFrame(draw);
}
draw();

// ===== BREATHING EFFECT =====
let breathe=0;
setInterval(()=>{
breathe=(breathe+1)%100;
const s=1+Math.sin(breathe/20)*.008;
document.querySelector('.container').style.transform='scale('+s+')';
},100);

// ===== LIVE UPDATES =====
updateSeason();
updateClock();
updateViews();
setInterval(updateClock,1000);
setInterval(updateViews,5000);
setInterval(updateSeason,30000);

console.log('🌿 Living website — '+getSeason().name+' season');
</script>
</body>
</html>
