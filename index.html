<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@zack360 — Glass Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ---------- Asas & Pemboleh Ubah ---------- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #a78bfa; /* Ungu lembut */
            --accent-glow: rgba(167, 139, 250, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Latar Belakang Gradien Gelap */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #000000 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Kesan Cahaya Latar Belakang (Blob) */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
        }
        .blob-1 {
            width: 400px;
            height: 400px;
            background: #4c1d95;
            top: -10%;
            left: -10%;
        }
        .blob-2 {
            width: 500px;
            height: 500px;
            background: #1e3a8a;
            bottom: -20%;
            right: -10%;
        }

        /* ---------- Bekas Utama (Panel Kaca) ---------- */
        .container {
            width: 100%;
            max-width: 700px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--glass-shadow);
            z-index: 1;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #c4b5fd, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ---------- Kotak Sembang ---------- */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--text-muted) transparent;
        }
        
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }

        .message {
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .user {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }

        .message .text {
            color: var(--text-main);
        }

        .message .img-container {
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
        }

        .message img {
            max-width: 100%;
            display: block;
            border-radius: 8px;
        }

        /* ---------- Kawalan Input ---------- */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.9rem;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            padding: 14px 20px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        button:hover {
            background: #9061f9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---------- Muat Naik Imej ---------- */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-btn {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            transition: all 0.2s ease;
        }

        .file-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ---------- Status ---------- */
        #status {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Blob -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container">
        <h1>@ZACK360 GLASS</h1>

        <div id="chat-box"></div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" id="username" placeholder="Nama Anda" maxlength="15">
                <button id="set-name-btn">SET</button>
            </div>
            <div class="input-row">
                <input type="text" id="message-input" placeholder="Taip mesej..." maxlength="200">
                <button id="send-btn">HANTAR</button>
            </div>
            <div class="input-row">
                <label class="file-input-wrapper">
                    <span class="file-btn">MUAT NAIK IMEJ</span>
                    <input type="file" id="image-input" accept="image/*">
                </label>
            </div>
        </div>

        <div id="status">Menyambung...</div>
    </div>

    <script type="module">
        /* ============================================================
           KONFIGURASI FIREBASE — GANTIKAN DENGAN MAKLUMAT ANDA
           ============================================================ */
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "zack360-2b303.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "zack360-2b303",
            storageBucket: "zack360-2b303.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ============================================================
           INISIALISASI
           ============================================================ */
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const usernameInput = document.getElementById('username');
        const setNameBtn = document.getElementById('set-name-btn');
        const imageInput = document.getElementById('image-input');
        const statusDiv = document.getElementById('status');

        let currentUser = localStorage.getItem('zack360_user') || '';

        /* ============================================================
           PENGURUSAN NAMA PENGGUNA
           ============================================================ */
        function setUserName(name) {
            if (!name) return;
            localStorage.setItem('zack360_user', name);
            currentUser = name;
            usernameInput.value = name;
            usernameInput.disabled = true;
            setNameBtn.disabled = true;
            statusDiv.textContent = `Log masuk sebagai ${name}`;
        }

        if (currentUser) {
            setUserName(currentUser);
        }

        setNameBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) setUserName(name);
        });

        /* ============================================================
           FUNGSI BANTU: PAPAR MESEJ
           ============================================================ */
        function renderMessage(data) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            const userSpan = document.createElement('span');
            userSpan.className = 'user';
            userSpan.textContent = data.user;

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = data.text || '';

            msgDiv.appendChild(userSpan);
            msgDiv.appendChild(textSpan);

            if (data.imageUrl) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'img-container';
                const img = document.createElement('img');
                img.src = data.imageUrl;
                img.loading = 'lazy';
                imgContainer.appendChild(img);
                msgDiv.appendChild(imgContainer);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* ============================================================
           SEMBANG TEKS
           ============================================================ */
        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (!currentUser) {
                alert('Sila tetapkan nama anda dahulu.');
                return;
            }
            if (!text) return;

            push(ref(db, 'chats'), {
                user: currentUser,
                text: text,
                timestamp: serverTimestamp()
            });
            msgInput.value = '';
        });

        /* ============================================================
           PEMAMPATAN IMEJ (Canvas)
           ============================================================ */
        function compressImage(file, maxDimension = 600, quality = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;

                    img.onload = () => {
                        let { width, height } = img;

                        if (width > height && width > maxDimension) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else if (height > maxDimension) {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };

                    img.onerror = reject;
                };

                reader.onerror = reject;
            });
        }

        /* ============================================================
           SEMBANG IMEJ (Base64 → Realtime Database)
           ============================================================ */
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!currentUser) {
                alert('Sila tetapkan nama anda dahulu.');
                imageInput.value = '';
                return;
            }

            statusDiv.textContent = 'Memproses imej...';

            try {
                const base64Image = await compressImage(file);
                statusDiv.textContent = 'Menghantar ke pangkalan data...';

                push(ref(db, 'chats'), {
                    user: currentUser,
                    text: ' [Imej]',
                    imageUrl: base64Image,
                    timestamp: serverTimestamp()
                });

                statusDiv.textContent = 'Imej berjaya dihantar.';
            } catch (error) {
                console.error('Gagal memproses imej:', error);
                statusDiv.textContent = 'Gagal memproses imej.';
            }

            imageInput.value = '';
        });

        /* ============================================================
           DENGAR SEMBANG BAHARU
           ============================================================ */
        const chatsRef = ref(db, 'chats');
        onChildAdded(chatsRef, (snapshot) => {
            renderMessage(snapshot.val());
        });

        statusDiv.textContent = 'Bersambung ke Firebase...';
    </script>
</body>
</html>
