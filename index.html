<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>✨ Neon Nexus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font: 'Inter', -apple-system, system-ui, sans-serif;
      --bg: #0a0a12;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.06);
      --neon-pink: #ff2d75;
      --neon-blue: #00d4ff;
      --neon-purple: #7c3aed;
      --neon-cyan: #22d3ee;
      --neon-green: #34d399;
      --neon-yellow: #fbbf24;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.4);
      --text-dim: rgba(255, 255, 255, 0.15);
      --radius: 20px;
      --radius-sm: 12px;
      --radius-full: 9999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      touch-action: manipulation;
      background: radial-gradient(ellipse at 50% 0%, #0f0a2a 0%, #0a0a12 70%);
    }

    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: orbFloat 20s ease-in-out infinite alternate;
    }
    .orb--1 {
      width: 400px;
      height: 400px;
      background: rgba(255, 45, 117, 0.08);
      top: -10%;
      left: -10%;
    }
    .orb--2 {
      width: 350px;
      height: 350px;
      background: rgba(0, 212, 255, 0.06);
      bottom: -10%;
      right: -10%;
      animation-delay: -7s;
    }
    .orb--3 {
      width: 300px;
      height: 300px;
      background: rgba(124, 58, 237, 0.07);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }
    @keyframes orbFloat {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(30px, -30px) scale(1.1);
      }
      100% {
        transform: translate(-20px, 20px) scale(0.9);
      }
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .sparkle-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(255, 45, 117, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 932px;
      background: var(--glass);
      backdrop-filter: blur(60px);
      -webkit-backdrop-filter: blur(60px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.08), 0 8px 32px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .rainbow-border {
      position: absolute;
      inset: -2px;
      border-radius: var(--radius);
      padding: 2px;
      background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-purple), var(--neon-blue), var(--neon-cyan), var(--neon-green), var(--neon-yellow), var(--neon-pink));
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: rainbowSpin 6s linear infinite;
      z-index: 2;
    }
    @keyframes rainbowSpin {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 300% 50%;
      }
    }

    .header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      flex-shrink: 0;
      min-height: 56px;
      border-bottom: 1px solid var(--glass-border);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10%;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-blue), transparent);
      opacity: 0.3;
      animation: linePulse 3s ease-in-out infinite;
    }
    @keyframes linePulse {
      0%,
      100% {
        opacity: 0.2;
      }
      50% {
        opacity: 0.6;
      }
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-brand .logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 40px rgba(255, 45, 117, 0.3);
      flex-shrink: 0;
      animation: logoGlow 3s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,
      100% {
        box-shadow: 0 0 40px rgba(255, 45, 117, 0.3);
      }
      50% {
        box-shadow: 0 0 70px rgba(124, 58, 237, 0.5);
      }
    }

    .header-brand .title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-brand .title .highlight {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-size: 0.55rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 30px;
      color: var(--text-muted);
      backdrop-filter: blur(10px);
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-green);
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
      animation: dotPulse 2s ease-in-out infinite;
      transition: 0.3s;
    }
    @keyframes dotPulse {
      0%,
      100% {
        box-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
      }
      50% {
        box-shadow: 0 0 50px rgba(52, 211, 153, 0.8);
      }
    }

    .status-badge .dot.off {
      background: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 45, 117, 0.4);
      animation: blink 0.8s infinite;
    }
    .status-badge .count {
      color: var(--text);
      font-weight: 600;
    }

    .auth {
      display: flex;
      gap: 6px;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    .auth-input {
      padding: 6px 12px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 400;
      width: 80px;
      transition: var(--transition);
      min-height: 30px;
      flex: 1 1 auto;
      min-width: 50px;
      max-width: 100px;
      backdrop-filter: blur(10px);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
      width: 90px;
    }
    .auth-input::placeholder {
      color: var(--text-dim);
      font-weight: 300;
    }
    .auth-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: var(--text);
      font-family: var(--font);
      font-size: 0.55rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      min-height: 30px;
      min-width: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      box-shadow: 0 0 30px rgba(255, 45, 117, 0.15);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0;
      transition: var(--transition);
    }
    .btn:hover:not(:disabled)::before {
      opacity: 1;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }
    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn--danger {
      background: linear-gradient(135deg, var(--neon-pink), #e11d48);
    }
    .btn--join {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.2);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar {
      width: 3px;
    }
    .messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--neon-pink), var(--neon-blue));
      border-radius: var(--radius-full);
    }

    .status-msg {
      text-align: center;
      font-size: 0.6rem;
      font-weight: 400;
      color: var(--text-muted);
      padding: 24px 12px;
      letter-spacing: 0.5px;
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.4;
      }
      50% {
        opacity: 0.8;
      }
    }

    .msg {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      max-width: 88%;
      word-wrap: break-word;
      animation: slideGlow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.5;
      font-size: 0.75rem;
      font-weight: 400;
      transition: var(--transition);
      position: relative;
    }
    @keyframes slideGlow {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg.own {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 0 30px rgba(255, 45, 117, 0.15);
    }
    .msg.other {
      align-self: flex-start;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg .sender {
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.6;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .msg.own .sender {
      opacity: 0.8;
      color: rgba(255, 255, 255, 0.8);
    }
    .msg .time {
      font-size: 0.4rem;
      font-weight: 400;
      opacity: 0.4;
      margin-left: 4px;
    }
    .msg .text {
      word-break: break-word;
      line-height: 1.6;
    }

    .input-area {
      padding: 8px 14px 14px;
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
      padding-bottom: calc(14px + var(--safe-bottom));
      background: var(--glass);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .row input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: 400;
      min-width: 40px;
      transition: var(--transition);
      min-height: 40px;
      backdrop-filter: blur(10px);
    }
    .row input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.05);
    }
    .row input::placeholder {
      color: var(--text-dim);
      font-weight: 300;
    }
    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: 0.65rem;
      padding: 10px 20px;
      min-height: 40px;
      flex-shrink: 0;
    }
    .row .btn--send {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
    }

    .floating-emoji {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 0;
      animation: floatEmoji 8s ease-in-out infinite;
      opacity: 0.2;
    }
    .floating-emoji:nth-child(1) {
      top: 10%;
      left: 5%;
      animation-delay: 0s;
    }
    .floating-emoji:nth-child(2) {
      top: 20%;
      right: 8%;
      animation-delay: -2s;
    }
    .floating-emoji:nth-child(3) {
      bottom: 30%;
      left: 10%;
      animation-delay: -4s;
    }
    .floating-emoji:nth-child(4) {
      bottom: 20%;
      right: 5%;
      animation-delay: -6s;
    }
    @keyframes floatEmoji {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(10deg);
      }
    }

    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 6px;
      height: 6px;
      top: -10px;
      animation: confettiFall linear infinite;
      opacity: 0;
    }
    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg);
      }
    }

    .typing-dots {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: var(--glass);
      border-radius: var(--radius-full);
      font-size: 0.5rem;
      color: var(--text-muted);
      margin: 4px 0;
    }
    .typing-dots.active {
      display: flex;
    }
    .typing-dots .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-blue);
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .typing-dots .dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-dots .dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes dotBounce {
      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .notification-bell {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 30px rgba(255, 45, 117, 0.3);
      z-index: 10;
      cursor: pointer;
      display: none;
    }
    .notification-bell.active {
      display: flex;
      animation: bellPulse 2s ease-in-out infinite;
    }
    @keyframes bellPulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    @media(max-width:380px) {
      .header {
        padding: 8px 10px;
        min-height: 48px;
      }
      .header-brand .logo {
        width: 28px;
        height: 28px;
        font-size: 0.9rem;
      }
      .header-brand .title {
        font-size: 0.85rem;
      }
      .auth-input {
        font-size: 0.5rem;
        padding: 4px 8px;
        min-height: 26px;
        width: 55px;
        max-width: 70px;
      }
      .auth-input:focus {
        width: 65px;
      }
      .btn {
        font-size: 0.45rem;
        padding: 4px 10px;
        min-height: 26px;
        min-width: 30px;
      }
      .status-badge {
        font-size: 0.45rem;
        padding: 3px 8px;
        min-height: 26px;
      }
      .status-badge .dot {
        width: 6px;
        height: 6px;
      }
      .messages {
        padding: 8px 10px;
        gap: 3px;
      }
      .msg {
        padding: 5px 10px;
        max-width: 95%;
        font-size: 0.65rem;
      }
      .msg .sender {
        font-size: 0.4rem;
      }
      .msg .text {
        font-size: 0.65rem;
      }
      .input-area {
        padding: 6px 10px 10px;
      }
      .row input {
        font-size: 0.6rem;
        padding: 8px 12px;
        min-height: 34px;
      }
      .row .btn {
        font-size: 0.55rem;
        padding: 8px 12px;
        min-height: 34px;
      }
      .floating-emoji {
        font-size: 1rem;
      }
    }

    @media(max-height:500px) and (orientation:landscape) {
      .app {
        max-height: 95vh;
        border-radius: var(--radius-sm);
      }
      .header {
        padding: 6px 12px;
        min-height: 40px;
      }
      .header-brand .logo {
        width: 24px;
        height: 24px;
        font-size: 0.7rem;
      }
      .header-brand .title {
        font-size: 0.7rem;
      }
      .messages {
        padding: 6px 10px;
        gap: 2px;
      }
      .msg {
        padding: 4px 10px;
        max-width: 90%;
        font-size: 0.6rem;
      }
      .msg .sender {
        font-size: 0.35rem;
        margin-bottom: 1px;
      }
      .msg .text {
        font-size: 0.6rem;
        line-height: 1.3;
      }
      .input-area {
        padding: 4px 10px 8px;
      }
      .row input {
        min-height: 28px;
        padding: 6px 12px;
        font-size: 0.6rem;
      }
      .row .btn {
        min-height: 28px;
        padding: 6px 12px;
        font-size: 0.55rem;
      }
      .auth-input {
        min-height: 24px;
        font-size: 0.5rem;
        padding: 3px 8px;
      }
      .btn {
        min-height: 24px;
        font-size: 0.45rem;
        padding: 3px 10px;
      }
      .status-badge {
        font-size: 0.45rem;
        padding: 2px 8px;
        min-height: 24px;
      }
      .floating-emoji {
        font-size: 0.8rem;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>
  <div class="sparkle-overlay"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="bg-grid"></div>

  <div class="floating-emoji">✨</div>
  <div class="floating-emoji">🌟</div>
  <div class="floating-emoji">💫</div>
  <div class="floating-emoji">🌈</div>

  <div class="notification-bell" id="notificationBell">🔔</div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="app">
    <div class="rainbow-border"></div>

    <header class="header">
      <div class="header-brand">
        <div class="logo">✦</div>
        <h1 class="title"><span class="highlight">Neon</span> Nexus</h1>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" class="auth-input" id="nameInput" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn btn--join" id="joinBtn">Join</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <div class="messages" id="messagesContainer">
      <div class="status-msg">✦ Connecting...</div>
      <div class="typing-dots" id="typingDots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span style="margin-left:6px;">typing</span>
      </div>
    </div>

    <footer class="input-area">
      <div class="row">
        <input type="text" id="messageInput" placeholder="✦ Type message..." disabled inputmode="text" autocomplete="off" />
        <button class="btn btn--send" id="sendBtn" disabled>Send</button>
      </div>
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    /**
     * ============================================================
     * NEON NEXUS — Fast Connect (<2s)
     * ============================================================
     */

    // ============================================================
    // PARTICLES
    // ============================================================

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const colors = ['#ff2d75', '#00d4ff', '#7c3aed', '#22d3ee', '#34d399', '#fbbf24'];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 2 + 1,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3 - 0.1,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: Math.random() * 80 + 40,
        maxLife: Math.random() * 80 + 40,
        glow: Math.random() * 10 + 5,
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.life--;
        if (p.life <= 0 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          p.x = Math.random() * w;
          p.y = h;
          p.life = p.maxLife;
          p.speedX = (Math.random() - 0.5) * 0.3;
          p.speedY = -Math.random() * 0.3 - 0.1;
          p.color = colors[Math.floor(Math.random() * colors.length)];
        }
        const alpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.glow * alpha;
        ctx.fill();
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ============================================================
    // CONFETTI
    // ============================================================

    function createConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#ff2d75', '#00d4ff', '#7c3aed', '#22d3ee', '#34d399', '#fbbf24', '#fff'];
      for (let i = 0; i < 20; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + '%';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (Math.random() * 4 + 3) + 'px';
        el.style.height = (Math.random() * 4 + 3) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (Math.random() * 2 + 2) + 's';
        el.style.animationDelay = (Math.random() * 2) + 's';
        container.appendChild(el);
      }
      setTimeout(() => { container.innerHTML = ''; }, 4000);
    }

    // ============================================================
    // NOTIFICATION
    // ============================================================

    const bell = document.getElementById('notificationBell');
    let msgCount = 0;

    function showNotification() {
      msgCount++;
      bell.classList.add('active');
      bell.textContent = '🔔 ' + msgCount;
    }

    bell.addEventListener('click', () => {
      msgCount = 0;
      bell.classList.remove('active');
    });

    // ============================================================
    // TYPING
    // ============================================================

    const typingDots = document.getElementById('typingDots');
    let typingTimeout = null;

    function showTyping() {
      typingDots.classList.add('active');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        typingDots.classList.remove('active');
      }, 2000);
    }

    // ============================================================
    // FIREBASE — Fast Connect
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // DOM
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let connectStart = Date.now();

    // ============================================================
    // HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) { el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el); }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;

      if (on) {
        const elapsed = (Date.now() - connectStart) / 1000;
        console.log(`⚡ Connected in ${elapsed.toFixed(1)}s`);

        // Force status clear after 1s max
        setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && (el.textContent === '✦ Connecting...' || el.textContent === '✦ Connected ✦')) {
            clearStatus();
          }
        }, 800);

        // Update status briefly
        status('✦ Connected ✦');
        setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === '✦ Connected ✦') clearStatus();
        }, 600);

        if (user) createConfetti();

      } else {
        status('✦ Reconnecting...');
      }
    };

    // ============================================================
    // SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) { alert('✦ Sign in first!'); return; }
      if (!text || !text.trim()) return;
      if (!connected) { alert('✦ Waiting for connection...'); return; }

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('✦ Failed to send.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'Anonymous'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === '✦ Connected ✦' || st.textContent === '✦ Reconnecting...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();

      if (!isOwn) {
        showNotification();
        showTyping();
        if (Math.random() > 0.8) createConfetti();
      }
    };

    // ============================================================
    // SUBSCRIBE — Optimised for speed
    // ============================================================

    const subscribe = () => {
      listeners.forEach(ref => ref.off());
      listeners = [];

      // Connection status — immediate
      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        if (on && !connected) {
          // First connection
          setOnline(true);
        } else if (!on) {
          setOnline(false);
        }

        if (on && user) {
          const ref = db.ref('users').child(user.uid);
          ref.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      // Online users
      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      // Messages — limit for speed
      const query = db.ref('messages').orderByKey().limitToLast(50);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      // Initial check — fast
      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === '✦ Reconnecting...' || st.textContent === '✦ Connected ✦') {
            status('✦ No messages yet ✦');
            setTimeout(() => {
              const el = DOM.messages.querySelector('.status-msg');
              if (el && el.textContent === '✦ No messages yet ✦') clearStatus();
            }, 1500);
          }
        }
      });
    };

    // ============================================================
    // AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'User';
      const name = raw.slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `✦ ${name}...`;

      clearStatus();
      status(`✦ ${name} joined ✦`);
      createConfetti();

      subscribe();

      if (connected) {
        const ref = db.ref('users').child(user.uid);
        ref.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `✦ ${name} joined ✦`) clearStatus();
      }, 1200);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = '✦ Type message...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('✦ Left chat ✦');
      DOM.onlineCount.textContent = '0';
      connected = false;
      DOM.statusDot.className = 'dot off';
      msgCount = 0;
      bell.classList.remove('active');
    };

    // ============================================================
    // EVENTS
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault();
        login(); }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.95)';
      }, { passive: true });
      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    DOM.messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        DOM.messageInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    });

    // ============================================================
    // INIT — Fast connect
    // ============================================================

    connectStart = Date.now();
    status('✦ Connecting...');
    subscribe();

    // Force connection status check after 2s
    setTimeout(() => {
      if (!connected) {
        // Try to force reconnect
        setOnline(true);
        console.log('⚡ Forced connection after 2s');
      }
    }, 2000);

    console.log('✦ NEON NEXUS — FAST CONNECT ✦');
    console.log('📡 Database:', firebase.app().options.databaseURL);
    console.log('⚡ Max connect time: 2 seconds');
  </script>

</body>
</html>
