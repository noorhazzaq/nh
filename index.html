<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON CHRONICLES - RPG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes pulse{0%{opacity:0.7}50%{opacity:1}100%{opacity:0.7}}
@keyframes glow{0%{text-shadow:0 0 5px #0ff,0 0 10px #0ff}50%{text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 30px #00ffff}100%{text-shadow:0 0 5px #0ff,0 0 10px #0ff}}
@keyframes scanline{0%{background-position:0 0}100%{background-position:0 100%}}
html,body{width:100%;min-height:100vh;background:#0a0a12;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,255,0.02) 0px,rgba(0,255,255,0.02) 2px,transparent 2px,transparent 4px);pointer-events:none}
#game{width:100%;max-width:900px;height:100vh;max-height:950px;padding:16px;display:flex;flex-direction:column;background:linear-gradient(135deg,#0a0a1a,#0d0d20);border:2px solid #00ffff;border-radius:12px;box-shadow:0 0 40px rgba(0,255,255,0.15),inset 0 0 40px rgba(0,255,255,0.05)}
#output{flex:1;overflow-y:auto;padding:14px 12px;background:rgba(0,0,0,0.7);border:1px solid #00ffff55;border-radius:6px;margin-bottom:12px;color:#00ffff;font-size:clamp(13px,2.4vw,18px);line-height:1.7;white-space:pre-wrap;word-break:break-word;scroll-behavior:smooth;min-height:180px;font-weight:300;text-shadow:0 0 8px rgba(0,255,255,0.2)}
#output::-webkit-scrollbar{width:6px}
#output::-webkit-scrollbar-track{background:#0a0a12}
#output::-webkit-scrollbar-thumb{background:#00ffff66;border-radius:3px}
#choices{display:flex;flex-direction:column;gap:8px;padding:4px 0;max-height:40vh;overflow-y:auto}
#choices::-webkit-scrollbar{width:5px}
#choices::-webkit-scrollbar-track{background:#0a0a12}
#choices::-webkit-scrollbar-thumb{background:#00ffff66;border-radius:3px}
.choice-btn{background:rgba(0,255,255,0.08);border:1px solid #00ffff88;color:#00ffff;padding:clamp(10px,2vh,16px) clamp(14px,2.8vw,20px);font-family:'Courier New',monospace;font-size:clamp(13px,2vw,17px);text-align:left;border-radius:6px;cursor:pointer;transition:all 0.2s;word-break:break-word;letter-spacing:0.5px;width:100%;text-shadow:0 0 5px rgba(0,255,255,0.3)}
.choice-btn:hover{background:rgba(0,255,255,0.18);border-color:#00ffff;box-shadow:0 0 25px rgba(0,255,255,0.15)}
.choice-btn:active{background:rgba(0,255,255,0.25);transform:scale(0.98);box-shadow:0 0 35px rgba(0,255,255,0.25)}
.choice-btn:disabled{opacity:0.25;filter:grayscale(0.6);pointer-events:none}
.status-bar{display:flex;justify-content:space-between;padding:10px 16px;background:rgba(0,255,255,0.05);border:1px solid #00ffff44;border-radius:6px;margin-bottom:10px;color:#00ffff;font-size:clamp(12px,2vw,16px);flex-wrap:wrap;gap:4px 16px;font-weight:400;text-shadow:0 0 10px rgba(0,255,255,0.15)}
.status-bar span{white-space:nowrap;display:flex;align-items:center;gap:6px}
.achievement{background:rgba(255,215,0,0.12);border:1px solid #ffd70088;color:#ffd700;padding:8px 14px;border-radius:6px;margin:6px 0;font-size:clamp(11px,1.6vw,14px);text-shadow:0 0 15px rgba(255,215,0,0.3);animation:glow 2s infinite}
#input-area{display:flex;gap:10px;margin-top:8px}
#cmd-input{flex:1;background:rgba(0,0,0,0.6);border:1px solid #00ffff66;color:#00ffff;padding:10px 16px;font-family:'Courier New',monospace;font-size:clamp(13px,2vw,17px);border-radius:6px;outline:none;min-width:0;text-shadow:0 0 8px rgba(0,255,255,0.15)}
#cmd-input:focus{border-color:#00ffff;box-shadow:0 0 25px rgba(0,255,255,0.12)}
#cmd-btn{background:rgba(0,255,255,0.12);border:1px solid #00ffff88;color:#00ffff;padding:10px 22px;font-family:'Courier New',monospace;font-size:clamp(13px,2vw,17px);border-radius:6px;cursor:pointer;transition:0.15s;white-space:nowrap;text-shadow:0 0 8px rgba(0,255,255,0.2)}
#cmd-btn:active{background:rgba(0,255,255,0.2);transform:scale(0.96)}
.hidden{display:none!important}
.neon-title{color:#00ffff;font-size:clamp(18px,3.5vw,28px);text-align:center;padding:6px 0;text-shadow:0 0 20px rgba(0,255,255,0.3),0 0 40px rgba(0,255,255,0.1);letter-spacing:3px;font-weight:700;border-bottom:1px solid #00ffff33;margin-bottom:8px}
@media(max-width:480px){#game{padding:10px;max-height:100vh;border-radius:8px;border-width:1px}#output{padding:10px 8px;font-size:clamp(12px,2.2vw,15px)}.choice-btn{padding:8px 12px;font-size:clamp(12px,1.8vw,14px)}.status-bar{font-size:clamp(11px,1.6vw,13px);padding:6px 10px}#cmd-input,#cmd-btn{font-size:clamp(12px,1.8vw,14px);padding:8px 12px}.neon-title{font-size:clamp(16px,3vw,22px)}}
</style>
</head>
<body>
<div id="game">
<div class="neon-title">◈ NEON CHRONICLES ◈</div>
<div class="status-bar">
<span id="hp">❤️ 100/100</span>
<span id="location">📍 CYBERPUNK</span>
<span id="turn">⏳ 0</span>
<span id="achievements">🏆 0</span>
</div>
<div id="output"></div>
<div id="choices"></div>
<div id="input-area">
<input type="text" id="cmd-input" placeholder="> /help for commands..." autocomplete="off">
<button id="cmd-btn">⏎</button>
</div>
</div>
<script>
(function(){
const STATE={hp:100,maxHp:100,turn:0,location:'Neon City',flags:{},inCombat:false,enemyHp:0,enemyMax:0,enemyName:'',ending:null,achievements:[],achievementCount:0,path:'',consequences:[]};
const output=document.getElementById('output');
const choicesDiv=document.getElementById('choices');
const hpSpan=document.getElementById('hp');
const locSpan=document.getElementById('location');
const turnSpan=document.getElementById('turn');
const achSpan=document.getElementById('achievements');
const cmdInput=document.getElementById('cmd-input');
const cmdBtn=document.getElementById('cmd-btn');
let blocked=false;

function updateUI(){
hpSpan.textContent='❤️ '+STATE.hp+'/'+STATE.maxHp;
locSpan.textContent='📍 '+STATE.location;
turnSpan.textContent='⏳ '+STATE.turn;
achSpan.textContent='🏆 '+STATE.achievementCount;
}

function clearChoices(){choicesDiv.innerHTML='';}

function addChoice(label,action,disabled){
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent=label;
if(disabled)btn.disabled=true;
btn.addEventListener('click',function(e){
e.preventDefault();
if(blocked||this.disabled)return;
blocked=true;
clearChoices();
output.textContent+='> '+label+'\n';
output.scrollTop=output.scrollHeight;
setTimeout(function(){action();},70);
});
choicesDiv.appendChild(btn);
}

function addAchievement(name){
if(STATE.achievements.includes(name))return;
STATE.achievements.push(name);
STATE.achievementCount++;
updateUI();
const div=document.createElement('div');
div.className='achievement';
div.textContent='🏅 ACHIEVEMENT: '+name;
choicesDiv.appendChild(div);
setTimeout(()=>{div.style.opacity='0.6';},3000);
}

function endTurn(){
STATE.turn++;
updateUI();
blocked=false;
}

function damage(amount){
STATE.hp=Math.max(0,STATE.hp-amount);
updateUI();
if(STATE.hp<=0){gameOver('You have been terminated...','cyberdeath');return true;}
return false;
}

function heal(amount){STATE.hp=Math.min(STATE.maxHp,STATE.hp+amount);updateUI();}

function gameOver(msg,ending){
blocked=true;
clearChoices();
STATE.ending=ending||'death';
output.textContent+='\n💀 '+msg+'\n\n══════════════════\n   GAME OVER\n   Ending: '+STATE.ending.toUpperCase()+'\n   Turns: '+STATE.turn+'\n   Achievements: '+STATE.achievementCount+'\n══════════════════\n';
output.scrollTop=output.scrollHeight;
addChoice('↺ RESTART',function(){location.reload();});
if(STATE.achievementCount>=3)addAchievement('Persistence');
}

function goTo(location,text){
STATE.location=location;
output.textContent+=text+'\n';
output.scrollTop=output.scrollHeight;
updateUI();
}

function showConsequence(text){
STATE.consequences.push(text);
output.textContent+='⚠️ CONSEQUENCE: '+text+'\n';
output.scrollTop=output.scrollHeight;
}

function combatRound(playerAction){
if(!STATE.inCombat)return;
let msg='';
const enemy=STATE.enemyName;
if(playerAction==='attack'){
const dmg=Math.floor(Math.random()*18)+8;
STATE.enemyHp=Math.max(0,STATE.enemyHp-dmg);
msg='⚡ You strike '+enemy+' for '+dmg+' damage.';
if(STATE.enemyHp<=0){
msg+='\n💥 '+enemy+' is obliterated!';
STATE.inCombat=false;
output.textContent+=msg+'\n';
output.scrollTop=output.scrollHeight;
endTurn();
resolveCombatWin();
return;
}
}else if(playerAction==='defend'){
const block=Math.floor(Math.random()*12)+5;
msg='🛡️ You brace for impact.';
const eDmg=Math.max(0,Math.floor(Math.random()*14)+4-block);
if(eDmg>0){msg+='\n💢 '+enemy+' hits for '+eDmg+' damage.';damage(eDmg);}
else msg+='\n✅ You deflect the attack.';
output.textContent+=msg+'\n';
output.scrollTop=output.scrollHeight;
if(STATE.hp<=0){endTurn();return;}
endTurn();
startEnemyTurn();
return;
}else if(playerAction==='flee'){
if(Math.random()<0.45){msg='🏃 You escape from '+enemy+'!';STATE.inCombat=false;output.textContent+=msg+'\n';output.scrollTop=output.scrollHeight;endTurn();resolveFlee();return;}
else{msg='🚫 Cannot escape!';output.textContent+=msg+'\n';output.scrollTop=output.scrollHeight;}
}
if(STATE.inCombat){
const eDmg=Math.floor(Math.random()*12)+5;
msg+='\n💢 '+enemy+' attacks for '+eDmg+' damage.';
damage(eDmg);
output.textContent+=msg+'\n';
output.scrollTop=output.scrollHeight;
if(STATE.hp<=0){endTurn();return;}
endTurn();
startEnemyTurn();
}
}

function startEnemyTurn(){
if(!STATE.inCombat||STATE.hp<=0){blocked=false;return;}
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
blocked=false;
}

function resolveCombatWin(){
STATE.flags.enemyDefeated=true;
if(STATE.enemyName==='Cyber Wolf')addAchievement('Wolf Slayer');
if(STATE.enemyName==='Ice Spirit')addAchievement('Spirit Breaker');
if(STATE.enemyName==='Dragon')addAchievement('Dragon Slayer');
clearChoices();
output.textContent+='🏆 Victory! Experience gained.\n';
output.scrollTop=output.scrollHeight;
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function resolveFlee(){
showConsequence('Cowardice weighs on your reputation.');
clearChoices();
addChoice('Recover',function(){enterZone('neonhub');});
blocked=false;
}

function enterZone(zone){
blocked=true;
clearChoices();
if(zone==='neonhub'){
goTo('Neon Hub','🌃 The neon-lit streets hum with energy. Three paths beckon.');
clearChoices();
addChoice('🔵 Enter the Data Core',function(){enterZone('datacore');});
addChoice('🟣 Descend to the Abyss',function(){enterZone('abyss');});
addChoice('🟢 Climb the Spire',function(){enterZone('spire');});
if(STATE.flags.enemyDefeated&&!STATE.flags.talkedToOracle){
addChoice('💬 Consult the Oracle',function(){talkOracle();});
}
if(STATE.flags.datacoreDone&&STATE.flags.abyssDone&&STATE.flags.spireDone){
addChoice('🏁 FACE THE FINAL THREAT',function(){finalBattle();});
}
endTurn();
blocked=false;
}else if(zone==='datacore'){
goTo('Data Core','💾 Digital consciousness pulses. Security drones patrol.');
if(!STATE.flags.datacoreDone){
clearChoices();
addChoice('⚡ Hack the mainframe',function(){hackMainframe();});
addChoice('🤖 Fight the drones',function(){droneCombat();});
addChoice('📡 Download data',function(){downloadData();});
}else{
clearChoices();
addChoice('📀 Access archives',function(){accessArchives();});
addChoice('Return to hub',function(){enterZone('neonhub');});
}
endTurn();
blocked=false;
}else if(zone==='abyss'){
goTo('The Abyss','🌀 Darkness swirls. Ancient beings stir below.');
if(!STATE.flags.abyssDone){
clearChoices();
addChoice('🌊 Dive deeper',function(){diveAbyss();});
addChoice('⚔️ Challenge the horror',function(){horrorCombat();});
addChoice('🔮 Study the void',function(){studyVoid();});
}else{
clearChoices();
addChoice('📜 Read ancient texts',function(){readTexts();});
addChoice('Return to hub',function(){enterZone('neonhub');});
}
endTurn();
blocked=false;
}else if(zone==='spire'){
goTo('The Spire','⚡ Ascend through clouds. Lightning crackles.');
if(!STATE.flags.spireDone){
clearChoices();
addChoice('⚡ Climb higher',function(){climbHigher();});
addChoice('🌀 Harness storm energy',function(){harnessStorm();});
addChoice('🏃 Descend quickly',function(){descendSpire();});
}else{
clearChoices();
addChoice('🌩️ Claim storm power',function(){claimStorm();});
addChoice('Return to hub',function(){enterZone('neonhub');});
}
endTurn();
blocked=false;
}
}

function hackMainframe(){
if(STATE.flags.hacked){output.textContent+='Already hacked.\n';return;}
const roll=Math.random();
if(roll<0.6){
output.textContent+='🖥️ You breach the mainframe. Data floods your mind.\n';
STATE.flags.hacked=true;STATE.flags.datacoreDone=true;
heal(20);addAchievement('Data Breach');
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
}else{
output.textContent+='🚨 Security traps! You take damage.\n';
damage(20);
if(STATE.hp>0){
endTurn();
clearChoices();
addChoice('Try again',function(){hackMainframe();});
addChoice('Abort',function(){enterZone('neonhub');});
}
}
blocked=false;
}

function droneCombat(){
output.textContent+='🤖 Security drones engage!\n';
STATE.inCombat=true;STATE.enemyName='Security Drone';STATE.enemyHp=35;
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
blocked=false;
}

function downloadData(){
if(STATE.flags.downloaded){output.textContent+='Data already downloaded.\n';return;}
output.textContent+='📥 Downloading classified files...\n';
STATE.flags.downloaded=true;STATE.flags.datacoreDone=true;
heal(15);
showConsequence('You are now flagged by the system.');
addAchievement('Data Thief');
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function accessArchives(){
output.textContent+='📚 You find blueprints for the ultimate weapon.\n';
if(!STATE.flags.archives){STATE.flags.archives=true;heal(10);}
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function diveAbyss(){
if(STATE.flags.dived){output.textContent+='You have already dived.\n';return;}
const roll=Math.random();
if(roll<0.5){
output.textContent+='🌊 You find a sunken city. Ancient power awakens.\n';
STATE.flags.dived=true;STATE.flags.abyssDone=true;
STATE.maxHp+=25;STATE.hp=Math.min(STATE.hp+25,STATE.maxHp);
addAchievement('Deep Diver');
updateUI();
}else{
output.textContent+='💀 You are pulled into a whirlpool! Damage sustained.\n';
damage(25);
if(STATE.hp>0){STATE.flags.dived=true;}
}
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function horrorCombat(){
output.textContent+='👾 A void horror emerges!\n';
STATE.inCombat=true;STATE.enemyName='Void Horror';STATE.enemyHp=50;
clearChoices();
addChoice('⚔️ Attack',function(){combatRound('attack');});
addChoice('🛡️ Defend',function(){combatRound('defend');});
addChoice('🏃 Flee',function(){combatRound('flee');});
blocked=false;
}

function studyVoid(){
if(STATE.flags.studied){output.textContent+='Void already studied.\n';return;}
output.textContent+='🔮 You comprehend the void. Your mind expands.\n';
STATE.flags.studied=true;STATE.flags.abyssDone=true;
STATE.maxHp+=15;STATE.hp=Math.min(STATE.hp+15,STATE.maxHp);
addAchievement('Void Scholar');
updateUI();
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function readTexts(){
output.textContent+='📖 The texts speak of a convergence. The final battle approaches.\n';
if(!STATE.flags.texts){STATE.flags.texts=true;heal(10);}
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function climbHigher(){
if(STATE.flags.climbed){output.textContent+='You already climbed.\n';return;}
const roll=Math.random();
if(roll<0.55){
output.textContent+='⚡ You reach the summit. Storm energy flows through you.\n';
STATE.flags.climbed=true;STATE.flags.spireDone=true;
STATE.maxHp+=20;STATE.hp=Math.min(STATE.hp+20,STATE.maxHp);
addAchievement('Storm Surfer');
updateUI();
}else{
output.textContent+='💢 Lightning strikes! You are hurt.\n';
damage(20);
if(STATE.hp>0){STATE.flags.climbed=true;}
}
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function harnessStorm(){
if(STATE.flags.harnessed){output.textContent+='Storm already harnessed.\n';return;}
output.textContent+='🌀 You capture the storm in a crystal.\n';
STATE.flags.harnessed=true;STATE.flags.spireDone=true;
heal(25);
addAchievement('Storm Warden');
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function descendSpire(){
showConsequence('You retreated from the summit. The storm mocks you.');
STATE.flags.spireDone=true;
damage(5);
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function claimStorm(){
output.textContent+='🌩️ You absorb the storm energy. Power surges!\n';
STATE.maxHp+=30;STATE.hp=Math.min(STATE.hp+30,STATE.maxHp);
updateUI();
endTurn();
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
blocked=false;
}

function talkOracle(){
if(STATE.flags.talkedToOracle){clearChoices();addChoice('Continue',function(){enterZone('neonhub');});return;}
STATE.flags.talkedToOracle=true;
output.textContent+='🔮 Oracle: "Unite the three powers. Face the Nexus."\n';
heal(15);
addAchievement('Oracle Consulted');
endTurn();
clearChoices();
addChoice('Continue',function(){enterZone('neonhub');});
blocked=false;
}

function finalBattle(){
if(STATE.flags.finalDone){
output.textContent+='You already faced the Nexus.\n';
clearChoices();
addChoice('Return',function(){enterZone('neonhub');});
return;
}
blocked=true;
clearChoices();
goTo('The Nexus','💀 THE FINAL BATTLE BEGINS!\nThe Nexus Entity manifests before you.');
STATE.inCombat=true;STATE.enemyName='Nexus Entity';STATE.enemyHp=80;
addChoice('⚡ Strike with all power',function(){finalAttack();});
addChoice('🛡️ Defend and counter',function(){finalDefend();});
addChoice('🌀 Channel the storm',function(){finalChannel();});
blocked=false;
}

function finalAttack(){
if(STATE.flags.finalDone)return;
const dmg=Math.floor(Math.random()*25)+15;
STATE.enemyHp=Math.max(0,STATE.enemyHp-dmg);
output.textContent+='⚡ You strike for '+dmg+' damage!\n';
if(STATE.enemyHp<=0){victoryEnding();return;}
const eDmg=Math.floor(Math.random()*15)+10;
damage(eDmg);
output.textContent+='💢 Nexus retaliates for '+eDmg+' damage.\n';
if(STATE.hp<=0)return;
endTurn();
clearChoices();
addChoice('Continue assault',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function finalDefend(){
if(STATE.flags.finalDone)return;
const block=Math.floor(Math.random()*15)+10;
const eDmg=Math.max(0,Math.floor(Math.random()*18)+8-block);
if(eDmg>0){damage(eDmg);output.textContent+='🛡️ You block, but take '+eDmg+' damage.\n';}
else{output.textContent+='🛡️ Perfect block!\n';}
if(STATE.hp<=0)return;
const counter=Math.floor(Math.random()*12)+8;
STATE.enemyHp=Math.max(0,STATE.enemyHp-counter);
output.textContent+='⚡ Counterattack for '+counter+' damage!\n';
if(STATE.enemyHp<=0){victoryEnding();return;}
endTurn();
clearChoices();
addChoice('Attack',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function finalChannel(){
if(STATE.flags.finalDone)return;
const power=Math.floor(Math.random()*20)+15;
STATE.enemyHp=Math.max(0,STATE.enemyHp-power);
output.textContent+='🌀 Storm channeled for '+power+' damage!\n';
heal(10);
if(STATE.enemyHp<=0){victoryEnding();return;}
const eDmg=Math.floor(Math.random()*12)+8;
damage(eDmg);
output.textContent+='💢 Nexus recoils for '+eDmg+' damage.\n';
if(STATE.hp<=0)return;
endTurn();
clearChoices();
addChoice('Attack',function(){finalAttack();});
addChoice('Defend',function(){finalDefend();});
addChoice('Channel',function(){finalChannel();});
blocked=false;
}

function victoryEnding(){
STATE.flags.finalDone=true;STATE.inCombat=false;
output.textContent+='\n🌟 THE NEXUS IS DEFEATED! 🌟\nYou have saved the city... but at what cost?\n';
addAchievement('Nexus Vanquisher');
if(STATE.turn<15)addAchievement('Speed Runner');
if(STATE.hp>50)addAchievement('Survivor');
const ending=STATE.hp>70?'Glorious Victory':STATE.hp>30?'Hard-Won Victory':'Sacrificial Victory';
output.textContent+='\n══════════════════\n   ENDING: '+ending.toUpperCase()+'\n   Turns: '+STATE.turn+'\n   Achievements: '+STATE.achievementCount+'\n   Consequences: '+STATE.consequences.length+'\n══════════════════\n';
STATE.ending=ending;
clearChoices();
addChoice('🏆 PLAY AGAIN',function(){location.reload();});
blocked=false;
}

function initGame(){
output.textContent='◈ NEON CHRONICLES ◈\nA cyberpunk RPG of choices and consequences.\n\n';
updateUI();
clearChoices();
addChoice('▶️ BEGIN',function(){
output.textContent+='You awaken in Neon City. The Oracle awaits.\n';
enterZone('neonhub');
});
blocked=false;
}
initGame();

cmdBtn.addEventListener('click',function(){
const val=cmdInput.value.trim();
if(!val||blocked)return;
cmdInput.value='';
output.textContent+='> '+val+'\n';
output.scrollTop=output.scrollHeight;
const lv=val.toLowerCase();
if(lv==='help'||lv==='/help'){
output.textContent+='Commands:\n/status - show stats\n/clear - clear screen\n/ach - show achievements\n/health - heal (limited)\n';
}else if(lv==='status'||lv==='/status'){
output.textContent+='HP: '+STATE.hp+'/'+STATE.maxHp+' | Turn: '+STATE.turn+' | Location: '+STATE.location+'\n';
}else if(lv==='clear'||lv==='/clear'){
output.textContent='';
}else if(lv==='ach'||lv==='/ach'){
output.textContent+='Achievements: '+(STATE.achievements.length?STATE.achievements.join(', '):'None')+'\n';
}else if(lv==='health'||lv==='/health'){
if(STATE.turn%3===0&&STATE.hp<STATE.maxHp){heal(10);output.textContent+='💊 You used a medkit. +10 HP\n';}
else{output.textContent+='No medkit available.\n';}
}else{
output.textContent+='Unknown command. Try /help\n';
}
output.scrollTop=output.scrollHeight;
});
cmdInput.addEventListener('keydown',function(e){if(e.key==='Enter')cmdBtn.click();});
})();
</script>
</body>
</html>
