<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Global Chat</title>
  <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Global Chat&quot;,&quot;short_name&quot;:&quot;Chat&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f0e17&quot;,&quot;theme_color&quot;:&quot;#16213e&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316213e'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23e94560'%3E💬%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    body{background:#0f0e17;color:#fff;height:100vh;display:flex;justify-content:center;align-items:center;padding:8px;overflow:hidden}
    .app{max-width:800px;width:100%;height:98vh;max-height:850px;background:#1a1a2e;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)}
    .h{padding:12px 20px;background:#16213e;border-bottom:2px solid #e94560;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;flex-shrink:0}
    .h h1{font-size:1.2rem;font-weight:700}
    .h h1 span{color:#e94560}
    .info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .online{font-size:.75rem;opacity:.6;padding:4px 12px;background:#0f0e17;border-radius:20px}
    .auth{display:flex;gap:6px;align-items:center}
    .auth input{padding:4px 10px;border:none;border-radius:20px;background:#0f0e17;color:#fff;font-size:.85rem;width:100px;transition:.2s}
    .auth input:focus{outline:2px solid #e94560;width:130px}
    .auth button{padding:4px 14px;border:none;border-radius:20px;background:#e94560;color:#fff;font-weight:600;cursor:pointer;font-size:.8rem;transition:.2s;white-space:nowrap}
    .auth button:hover{transform:scale(1.05);background:#ff6b81}
    .auth button.out{background:#2d2d44}
    .auth button.out:hover{background:#3d3d5c}
    .msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:4px;background:#12122a;scroll-behavior:smooth}
    .msgs::-webkit-scrollbar{width:4px}
    .msgs::-webkit-scrollbar-thumb{background:#e94560;border-radius:10px}
    .status{text-align:center;font-size:.8rem;opacity:.4;padding:12px;font-style:italic}
    .msg{padding:6px 14px;border-radius:16px;max-width:82%;word-wrap:break-word;animation:fadeIn .2s;line-height:1.4}
    .msg.o{align-self:flex-end;background:#e94560;border-bottom-right-radius:4px}
    .msg.t{align-self:flex-start;background:#2d2d44;border-bottom-left-radius:4px}
    .msg .s{font-size:.6rem;font-weight:700;text-transform:uppercase;opacity:.6;letter-spacing:.5px;margin-bottom:2px}
    .msg .tm{font-size:.5rem;opacity:.4;margin-left:6px}
    .msg .text{font-size:.9rem;word-break:break-word}
    .msg .text img,.msg .text video{max-width:100%;max-height:250px;border-radius:8px;margin:4px 0;display:block}
    .msg .text .voice{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);padding:4px 14px;border-radius:24px}
    .msg .text .voice audio{max-width:140px;height:28px}
    .in{padding:8px 12px 12px;background:#16213e;border-top:1px solid #2d2d44;flex-shrink:0}
    .tools{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
    .tools button{padding:2px 10px;border:none;border-radius:12px;background:#2d2d44;color:#fff;cursor:pointer;font-size:.7rem;transition:.2s;opacity:.7}
    .tools button:hover:not(:disabled){opacity:1;background:#e94560;transform:scale(1.05)}
    .tools button:disabled{opacity:.25;cursor:not-allowed}
    .row{display:flex;gap:6px;align-items:center}
    .row input{flex:1;padding:8px 14px;border:none;border-radius:20px;background:#0f0e17;color:#fff;font-size:.9rem;min-width:50px;transition:.2s}
    .row input:focus{outline:2px solid #e94560}
    .row input:disabled{opacity:.4;cursor:not-allowed}
    .row button{padding:8px 18px;border:none;border-radius:20px;background:#e94560;color:#fff;font-weight:700;cursor:pointer;font-size:.85rem;transition:.2s;white-space:nowrap}
    .row button:hover:not(:disabled){transform:scale(1.05);background:#ff6b81}
    .row button:disabled{opacity:.4;cursor:not-allowed}
    .row button.icon{padding:8px 10px;font-size:1.1rem;background:#2d2d44}
    .row button.icon:hover:not(:disabled){background:#3d3d5c}
    .rec{display:none;align-items:center;gap:10px;padding:4px 14px;background:#e94560;border-radius:24px;font-size:.8rem;animation:pulse 1s infinite;margin-bottom:6px}
    .rec.active{display:flex}
    .rec button{background:0 0;border:none;color:#fff;cursor:pointer;font-size:1.2rem;padding:0 4px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @media(max-width:600px){.app{height:100vh;max-height:100vh;border-radius:0}.h{padding:8px 12px}.h h1{font-size:1rem}.auth input{width:70px;font-size:.75rem}.auth input:focus{width:90px}.msgs{padding:8px}.msg{max-width:92%;padding:4px 10px;font-size:.85rem}.tools button{font-size:.6rem;padding:2px 6px}.row input{font-size:.85rem;padding:6px 10px}.row button{padding:6px 12px;font-size:.75rem}}
  </style>
</head>
<body>

<div class="app">
  <div class="h">
    <h1>🌍 <span>Global</span> Chat</h1>
    <div class="info">
      <span class="online" id="o">👤 0</span>
      <div class="auth">
        <input type="text" id="n" placeholder="Name..." maxlength="20" />
        <button id="j">Join</button>
        <button id="l" class="out" style="display:none">Leave</button>
      </div>
    </div>
  </div>

  <div class="msgs" id="m"><div class="status">👋 Sign in to chat</div></div>

  <div class="in">
    <div class="tools" id="tools">
      <button data-a="image">🖼️</button>
      <button data-a="video">🎥</button>
      <button data-a="voice">🎤</button>
    </div>

    <div class="rec" id="rec"><span>🔴</span> Recording... <button id="stoprec">⏹️</button></div>

    <div class="row">
      <input type="text" id="i" placeholder="Type a message..." disabled />
      <button id="s" disabled>Send</button>
      <button id="filebtn" class="icon" disabled>📎</button>
      <input type="file" id="file" accept="image/*,video/*,audio/*" style="display:none" multiple />
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
// Firebase
firebase.initializeApp({databaseURL:"https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"});
const db=firebase.database();

// DOM shortcuts
const $=id=>document.getElementById(id), m=$('m'), i=$('i'), s=$('s'), n=$('n'), j=$('j'), l=$('l'), o=$('o');
const tools=$('tools'), fileInput=$('file'), fileBtn=$('filebtn'), rec=$('rec'), stopRec=$('stoprec');

let u=null, listeners=[], recorder=null, chunks=[], isRecording=false;

// Helpers
const st=t=>{let e=m.querySelector('.status');if(!e){e=document.createElement('div');e.className='status';m.appendChild(e)}e.textContent=t};
const sc=()=>setTimeout(()=>m.scrollTop=m.scrollHeight,50);
const tm=t=>t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
const upload=f=>new Promise((r,re)=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.onerror=re;rd.readAsDataURL(f)});

// Send message
const sm=t=>{if(!u)return alert('Sign in!');if(!t||!t.trim())return;db.ref('messages').push({name:u.name,uid:u.uid,text:t.trim(),timestamp:firebase.database.ServerValue.TIMESTAMP}).catch(()=>alert('Failed.'));i.value='';i.focus()};

// Render message
const rn=d=>{const ow=u&&d.uid===u.uid,el=document.createElement('div');el.className=`msg ${ow?'o':'t'}`;el.dataset.key=d._key;let html=d.text||'';
if(html.startsWith('📸 '))html=`<img src="${html.substring(4)}" loading="lazy" onerror="this.style.display='none'" />`;
else if(html.startsWith('🎬 '))html=`<video controls src="${html.substring(4)}" preload="metadata"></video>`;
else if(html.startsWith('🎤 '))html=`<div class="voice">🎤 <audio controls src="${html.substring(4)}"></audio></div>`;
el.innerHTML=`<div class="s">${d.name||'Anonymous'}<span class="tm">${tm(d.timestamp)}</span></div><div class="text">${html}</div>`;
const sts=m.querySelector('.status');if(sts)sts.remove();m.appendChild(el);sc()};

// Subscribe
const sub=()=>{listeners.forEach(r=>r.off());listeners=[];const q=db.ref('messages').orderByKey().limitToLast(150);
q.on('child_added',s=>{const d=s.val();d._key=s.key;rn(d)});
q.on('child_removed',s=>{const el=m.querySelector(`[data-key="${s.key}"]`);if(el)el.remove()});listeners.push(q);
q.once('value',s=>{if(!s.exists())st('💬 No messages yet')});
const p=db.ref('.info/connected'),us=db.ref('users');
p.on('value',s=>{if(s.val()&&u){const r=us.child(u.uid);r.set({name:u.name,lastSeen:firebase.database.ServerValue.TIMESTAMP});r.onDisconnect().remove()}});
us.on('value',s=>{o.textContent=s.exists()?`👤 ${s.numChildren()}`:'👤 0'});listeners.push(p)};

// Voice recording
const startRec=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];isRecording=true;
recorder.ondataavailable=e=>chunks.push(e.data);
recorder.onstop=async()=>{isRecording=false;rec.classList.remove('active');i.disabled=false;s.disabled=false;const blob=new Blob(chunks,{type:'audio/webm'});if(blob.size>0){const file=new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'});const dataUrl=await upload(file);sm('🎤 '+dataUrl)}stream.getTracks().forEach(t=>t.stop())};
recorder.start();rec.classList.add('active');i.disabled=true;s.disabled=true}catch(e){alert('Microphone access denied')}};
const stopRecFn=()=>{if(recorder&&recorder.state==='recording'){recorder.stop();rec.classList.remove('active');i.disabled=false;s.disabled=false}};

// File handling
const hf=async f=>{if(!u)return alert('Sign in!');const type=f.type;let prefix='📸 ';if(type.startsWith('video/'))prefix='🎬 ';else if(type.startsWith('audio/'))prefix='🎤 ';const dataUrl=await upload(f);sm(prefix+dataUrl)};

// Auth
const login=()=>{const nm=n.value.trim()||'Guest';u={name:nm,uid:'u_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)};n.disabled=true;j.style.display='none';l.style.display='inline-block';i.disabled=false;s.disabled=false;fileBtn.disabled=false;i.placeholder=`Message as ${nm}...`;document.querySelectorAll('#tools button').forEach(b=>b.disabled=false);st(`✅ Signed in as ${nm}`);m.innerHTML='';sub()};
const logout=()=>{if(u)db.ref('users').child(u.uid).remove();listeners.forEach(r=>r.off());listeners=[];u=null;n.disabled=false;j.style.display='inline-block';l.style.display='none';i.disabled=true;s.disabled=true;fileBtn.disabled=true;i.placeholder='Sign in to chat...';i.value='';document.querySelectorAll('#tools button').forEach(b=>b.disabled=true);m.innerHTML='';st('👋 You left the chat');o.textContent='👤 0';if(isRecording)stopRecFn()};

// Events
j.onclick=login;l.onclick=logout;n.onkeydown=e=>{if(e.key==='Enter')login()};
s.onclick=()=>sm(i.value);i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sm(i.value)}};
fileBtn.onclick=()=>fileInput.click();fileInput.onchange=async e=>{if(e.target.files.length){for(const f of e.target.files)await hf(f);e.target.value=''}};
stopRec.onclick=stopRecFn;

tools.onclick=e=>{const btn=e.target.closest('button');if(!btn)return;const a=btn.dataset.a;
if(a==='image')fileInput.click();else if(a==='video')fileInput.click();else if(a==='voice'){if(isRecording)stopRecFn();else startRec()}};

// Init
document.querySelectorAll('#tools button').forEach(b=>b.disabled=true);
st('🌐 Connecting...');sub();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
console.log('💬 Global Chat ready');
</script>

</body>
</html>
