<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Hub</title>
  <style>
    /* 1. RESET & BASE LAYOUT */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-main: #03030a;
      --card-bg: rgba(15, 15, 30, 0.6);
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* 2. LAYOUT CONTAINERS */
    .app-viewport { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1.25rem; z-index: 2; }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* 3. UTILITY & FORM CONTROL STYLES */
    .row { display: flex; align-items: center; gap: 0.5rem; }
    .col { display: flex; flex-direction: column; gap: 0.5rem; }
    .flex-1 { flex: 1; }
    .text-sm { font-size: 0.85rem; color: var(--text-muted); }
    .text-glow {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input, button, select, textarea {
      font: inherit;
      color: inherit;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan); }
    button {
      cursor: pointer;
      font-weight: 600;
      border: none;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button.btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent-danger);
      color: #f87171;
    }

    /* 4. CANVAS BACKGROUND */
    #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <main class="app-viewport">
    
    <!-- HEADER MODULE -->
    <header class="card col" id="header-module">
      <div class="row" style="justify-content: space-between;">
        <h1 class="text-glow" style="font-size: 1.4rem;">Application</h1>
        <span class="text-sm" id="system-status">Online</span>
      </div>
    </header>

    <!-- CONTENT / WORKSPACE MODULE -->
    <section class="card col" id="workspace-module">
      <!-- Logic components inject here -->
    </section>

  </main>

  <script>
    /* ----------------------------------------------------
       SECTION 1: CANVAS & ANIMATION ENGINE (STYLE/BG)
    ---------------------------------------------------- */
    const CanvasEngine = (() => {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width, height, particles = [];

      function init() {
        resize();
        window.addEventListener('resize', resize);
        loop();
      }

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = Array.from({ length: Math.floor((width * height) / 4000) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.5 + 0.5,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random()
        }));
      }

      function loop() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.x = (p.x + p.vx + width) % width;
          p.y = (p.y + p.vy + height) % height;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(192, 132, 252, ${p.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(loop);
      }

      return { init };
    })();

    /* ----------------------------------------------------
       SECTION 2: STATE STORE & UTILITIES (LOGIC)
    ---------------------------------------------------- */
    const Store = (() => {
      const state = {
        user: localStorage.getItem('app_user') || '',
        data: []
      };

      return {
        get: (key) => state[key],
        set: (key, val) => {
          state[key] = val;
          if (key === 'user') localStorage.setItem('app_user', val);
        }
      };
    })();

    const Utils = {
      escape: (str) => String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)),
      timeNow: () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    /* ----------------------------------------------------
       SECTION 3: APPLICATION CONTROLLER (FUNCTION)
    ---------------------------------------------------- */
    const AppController = (() => {
      function init() {
        CanvasEngine.init();
        bindEvents();
        render();
      }

      function bindEvents() {
        // Global delegate listener pattern
        document.addEventListener('click', (e) => {
          const action = e.target.dataset.action;
          if (action && ControllerActions[action]) {
            ControllerActions[action](e.target);
          }
        });
      }

      const ControllerActions = {
        'clear-all': () => {
          const user = Store.get('user').toLowerCase().trim();
          if (user === 'zack') {
            Store.set('data', []);
            render();
          } else {
            alert('Only zack can clear all chat.');
          }
        }
      };

      function render() {
        // Master view dispatcher
      }

      return { init };
    })();

    // Initialize application on DOM ready
    document.addEventListener('DOMContentLoaded', AppController.init);
  </script>
</body>
</html>
