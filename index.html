<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRON LEGACY · SHARE</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
      }
    }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;background:#0b0e14;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
    body{background:radial-gradient(circle at 20% 30%,#13202e,#05080c);overflow:hidden}
    #app{width:100%;max-width:480px;padding:24px 20px 32px;margin:0 auto;background:rgba(8,16,26,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,255,255,0.15);border-radius:48px 48px 32px 32px;box-shadow:0 20px 50px rgba(0,0,0,0.8),inset 0 0 40px rgba(0,255,255,0.05)}
    .tron-glow{text-align:center;margin-bottom:28px;position:relative}
    .tron-glow h1{font-weight:300;letter-spacing:6px;font-size:2.1rem;color:#b3ffff;text-shadow:0 0 12px #00e5ff,0 0 30px #0088ff55,0 0 60px #0044ff33;text-transform:uppercase;word-break:break-word}
    .tron-glow .sub{color:#7fb4c9;font-size:0.8rem;letter-spacing:3px;border-top:1px solid #1f3f4f;padding-top:10px;margin-top:6px;text-transform:uppercase;opacity:0.7}
    .share-card{background:rgba(12,22,34,0.6);border-radius:28px;padding:20px 18px 18px;border:1px solid #1c4555;box-shadow:inset 0 0 30px #002b3b33,0 8px 24px #00000066}
    .url-box{background:#0a121c;border-radius:60px;padding:12px 20px;border:1px solid #0f3a47;display:flex;align-items:center;gap:8px;margin-bottom:20px;box-shadow:inset 0 2px 8px #00000099}
    .url-box input{flex:1;background:transparent;border:none;outline:none;color:#b0f0f0;font-size:0.95rem;font-weight:400;letter-spacing:0.3px;padding:6px 0;min-width:0;width:100%}
    .url-box input::selection{background:#00ccdd33}
    .url-box button{background:#0b3b4a;border:none;border-radius:40px;padding:8px 18px;color:#c7ffff;font-weight:600;font-size:0.8rem;letter-spacing:1px;border:1px solid #1d7a8f;box-shadow:0 0 12px #00ddff33;transition:0.2s;text-transform:uppercase;cursor:pointer;white-space:nowrap}
    .url-box button:active{transform:scale(0.95);background:#105b6e;box-shadow:0 0 24px #00eeff66}
    .feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 16px}
    .feature{background:rgba(4,18,28,0.7);border-radius:20px;padding:14px 8px;border:1px solid #194552;text-align:center;transition:0.2s;box-shadow:0 0 12px #003d4d22}
    .feature .icon{font-size:1.8rem;display:block;margin-bottom:4px;filter:drop-shadow(0 0 6px #00ccff55)}
    .feature .label{color:#8fcbdb;font-size:0.7rem;font-weight:400;letter-spacing:1px;text-transform:uppercase;opacity:0.9}
    .feature .value{color:#e0ffff;font-size:0.95rem;font-weight:500;margin-top:2px;text-shadow:0 0 8px #00aaff33}
    .action-row{display:flex;gap:12px;margin:16px 0 6px}
    .action-row button{flex:1;background:transparent;border:1px solid #1b687e;border-radius:60px;padding:14px 6px;color:#b9f2ff;font-weight:600;font-size:0.9rem;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(145deg,#0b2938,#05161f);box-shadow:0 0 20px #0066aa22;transition:0.2s;cursor:pointer}
    .action-row button:active{transform:scale(0.94);background:#0b3b4e;box-shadow:0 0 40px #00aaff66}
    .action-row button.primary{background:#0e4a5e;border-color:#2ab3d0;color:#ebffff;box-shadow:0 0 30px #00bbff44}
    .status-bar{margin-top:18px;text-align:center;font-size:0.7rem;color:#4b7f8f;letter-spacing:1px;border-top:1px solid #13303d;padding-top:14px;opacity:0.7}
    .status-bar span{color:#7cd4e8;font-weight:400}
    @media (max-width:380px){#app{padding:18px 14px 22px}.feature-grid{gap:10px}.url-box input{font-size:0.8rem}}
    .blocked-msg{display:none;position:fixed;inset:0;background:#0b0e14;z-index:9999;align-items:center;justify-content:center;flex-direction:column;color:#b0e0ea;padding:40px;text-align:center;font-size:1.2rem;border:2px solid #2a6a7a}
    .blocked-msg .big{font-size:3rem;margin-bottom:12px}
  </style>
</head>
<body>
  <div id="app">
    <div class="tron-glow">
      <h1>⍟ TRON</h1>
      <div class="sub">legacy · share protocol</div>
    </div>
    <div class="share-card">
      <div class="url-box">
        <input type="text" id="shareUrlInput" readonly value="loading..." aria-label="share url">
        <button id="copyBtn">⍟ copy</button>
      </div>
      <div class="feature-grid">
        <div class="feature"><span class="icon">⚡</span><div class="label">status</div><div class="value" id="statusDisplay">online</div></div>
        <div class="feature"><span class="icon">🔗</span><div class="label">links</div><div class="value" id="linkCount">0</div></div>
        <div class="feature"><span class="icon">🔄</span><div class="label">sync</div><div class="value" id="syncDisplay">live</div></div>
        <div class="feature"><span class="icon">📡</span><div class="label">relay</div><div class="value" id="relayDisplay">active</div></div>
      </div>
      <div class="action-row">
        <button id="shareBtn" class="primary">⍟ share</button>
        <button id="refreshBtn">⟳ refresh</button>
      </div>
      <div class="status-bar">
        <span id="timestampDisplay">●</span>  <span id="firebaseStatus">link ready</span>
      </div>
    </div>
  </div>
  <div id="blocker" class="blocked-msg" style="display:none">
    <div class="big">⛔</div>
    <div>ACCESS DENIED</div>
    <div style="font-size:0.9rem;margin-top:12px;opacity:0.6">android browser only</div>
  </div>
  <script type="module">
    // ============================================================
    // TRON LEGACY · FIXED PRODUCTION BUILD
    // FIXES: firebase config, android detection, copy api, retry, listener cleanup
    // ============================================================
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, onValue, push, get, off } from "firebase/database";

    // ========== FIX 1: FIREBASE CONFIG (replace with your actual values) ==========
    const FIREBASE_CONFIG = {
      apiKey: "YOUR_ACTUAL_API_KEY",
      authDomain: "zack360-2b303.firebaseapp.com",
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "zack360-2b303",
      storageBucket: "zack360-2b303.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // ========== FIX 2: ANDROID DETECTION (simplified) ==========
    (function enforceAndroid() {
      const isAndroid = /android/i.test(navigator.userAgent);
      if (!isAndroid) {
        document.getElementById('blocker').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
        throw new Error('android-only');
      }
    })();

    // ========== FIX 3: FIREBASE INIT WITH RETRY ==========
    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);
    const linksRef = ref(db, 'links');

    // DOM refs
    const shareInput = document.getElementById('shareUrlInput');
    const copyBtn = document.getElementById('copyBtn');
    const shareBtn = document.getElementById('shareBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDisplay = document.getElementById('statusDisplay');
    const linkCount = document.getElementById('linkCount');
    const syncDisplay = document.getElementById('syncDisplay');
    const relayDisplay = document.getElementById('relayDisplay');
    const timestampDisplay = document.getElementById('timestampDisplay');
    const firebaseStatus = document.getElementById('firebaseStatus');

    // ========== FIX 4: CENTRALIZED STATE ==========
    const state = {
      currentUrl: '',
      linkCounter: 0,
      lastPushKey: '',
      listenerActive: false,
      retryCount: 0,
      maxRetries: 5
    };

    // ========== FIX 5: RETRY LOGIC WITH BACKOFF ==========
    function retryOperation(fn, delay = 1000) {
      return fn().catch((err) => {
        if (state.retryCount < state.maxRetries) {
          state.retryCount++;
          const backoff = delay * Math.pow(2, state.retryCount - 1);
          firebaseStatus.textContent = `⍟ retry ${state.retryCount}/${state.maxRetries}`;
          return new Promise((resolve) => {
            setTimeout(() => resolve(retryOperation(fn, backoff)), backoff);
          });
        }
        throw err;
      });
    }

    // ========== FIX 6: GENERATE URL ==========
    function generateShareUrl(key = '') {
      const base = window.location.href.split('?')[0];
      return key ? `${base}?ref=${encodeURIComponent(key)}` : base;
    }

    function updateUrlDisplay(key) {
      const url = generateShareUrl(key);
      state.currentUrl = url;
      shareInput.value = url;
    }

    // ========== FIX 7: FIREBASE READ WITH RETRY ==========
    function fetchLinkStats() {
      if (state.listenerActive) {
        off(linksRef);
        state.listenerActive = false;
      }
      
      retryOperation(() => {
        return new Promise((resolve, reject) => {
          const unsubscribe = onValue(linksRef, (snapshot) => {
            try {
              const data = snapshot.val();
              if (data) {
                const keys = Object.keys(data);
                state.linkCounter = keys.length;
                linkCount.textContent = state.linkCounter;
                if (keys.length > 0) {
                  const lastKey = keys[keys.length - 1];
                  state.lastPushKey = lastKey;
                  const lastEntry = data[lastKey];
                  if (lastEntry?.timestamp) {
                    const d = new Date(lastEntry.timestamp);
                    timestampDisplay.textContent = `⍟ ${d.toLocaleTimeString()}`;
                  }
                  updateUrlDisplay(lastKey);
                  firebaseStatus.textContent = '⍟ synced';
                  statusDisplay.textContent = 'online';
                  syncDisplay.textContent = 'live';
                  relayDisplay.textContent = 'active';
                }
              } else {
                state.linkCounter = 0;
                linkCount.textContent = '0';
                updateUrlDisplay('');
                firebaseStatus.textContent = '⍟ empty';
              }
              state.retryCount = 0;
              state.listenerActive = true;
              resolve();
            } catch (e) {
              reject(e);
            }
          }, (error) => {
            reject(error);
          });
          // store unsubscribe for cleanup
          window.__unsubscribe = unsubscribe;
        });
      }).catch((error) => {
        firebaseStatus.textContent = '⚠️ db error';
        statusDisplay.textContent = 'offline';
        syncDisplay.textContent = 'error';
        relayDisplay.textContent = 'down';
        console.warn('Firebase error:', error);
      });
    }

    // ========== FIX 8: PUSH WITH RETRY ==========
    async function pushNewLink() {
      try {
        const result = await retryOperation(async () => {
          const newRef = push(linksRef);
          const payload = {
            timestamp: Date.now(),
            userAgent: navigator.userAgent.substring(0, 120),
            platform: 'android',
            action: 'share'
          };
          await set(newRef, payload);
          return newRef.key;
        });
        
        if (result) {
          state.lastPushKey = result;
          updateUrlDisplay(result);
          state.linkCounter += 1;
          linkCount.textContent = state.linkCounter;
          firebaseStatus.textContent = '⍟ pushed';
          statusDisplay.textContent = 'online';
          syncDisplay.textContent = 'live';
          timestampDisplay.textContent = `⍟ ${new Date().toLocaleTimeString()}`;
          // refresh count
          const snapshot = await get(linksRef);
          if (snapshot.exists()) {
            const data = snapshot.val();
            state.linkCounter = Object.keys(data).length;
            linkCount.textContent = state.linkCounter;
          }
        }
        return result;
      } catch (e) {
        firebaseStatus.textContent = '⚠️ push fail';
        console.error('push error:', e);
        return null;
      }
    }

    // ========== FIX 9: COPY WITH MODERN API ONLY ==========
    async function copyUrl() {
      const val = shareInput.value;
      if (!val || val === 'loading...') {
        firebaseStatus.textContent = '⍟ nothing to copy';
        return;
      }
      try {
        await navigator.clipboard.writeText(val);
        firebaseStatus.textContent = '✓ copied';
        copyBtn.textContent = '✓ done';
        setTimeout(() => { copyBtn.textContent = '⍟ copy'; }, 1600);
      } catch (e) {
        // fallback for older Android
        try {
          const textarea = document.createElement('textarea');
          textarea.value = val;
          textarea.style.cssText = 'position:fixed;opacity:0;left:-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          firebaseStatus.textContent = '✓ copied';
          copyBtn.textContent = '✓ done';
          setTimeout(() => { copyBtn.textContent = '⍟ copy'; }, 1600);
        } catch (err) {
          firebaseStatus.textContent = '⚠️ copy fail';
        }
      }
    }

    // ========== FIX 10: SHARE ==========
    function shareUrl() {
      const url = shareInput.value;
      if (!url || url === 'loading...') {
        firebaseStatus.textContent = '⍟ no link';
        return;
      }
      if (navigator.share) {
        navigator.share({
          title: 'TRON LEGACY · share',
          text: '⚡ TRON link',
          url: url
        }).then(() => {
          firebaseStatus.textContent = '✓ shared';
        }).catch((err) => {
          if (err.name !== 'AbortError') {
            firebaseStatus.textContent = '⍟ share canceled';
          }
        });
      } else {
        copyUrl();
        firebaseStatus.textContent = '⍟ copied (share api unavailable)';
      }
    }

    // ========== FIX 11: REFRESH ==========
    async function manualRefresh() {
      firebaseStatus.textContent = '⍟ refreshing...';
      try {
        const snapshot = await get(linksRef);
        if (snapshot.exists()) {
          const data = snapshot.val();
          const keys = Object.keys(data);
          state.linkCounter = keys.length;
          linkCount.textContent = state.linkCounter;
          if (keys.length > 0) {
            const last = keys[keys.length - 1];
            state.lastPushKey = last;
            updateUrlDisplay(last);
            const entry = data[last];
            if (entry?.timestamp) {
              const d = new Date(entry.timestamp);
              timestampDisplay.textContent = `⍟ ${d.toLocaleTimeString()}`;
            }
            firebaseStatus.textContent = '⍟ refreshed';
          } else {
            linkCount.textContent = '0';
            updateUrlDisplay('');
            firebaseStatus.textContent = '⍟ empty';
          }
        }
        state.retryCount = 0;
      } catch (e) {
        firebaseStatus.textContent = '⚠️ refresh fail';
      }
    }

    // ========== FIX 12: CLEANUP ON UNLOAD ==========
    window.addEventListener('beforeunload', () => {
      if (window.__unsubscribe) {
        window.__unsubscribe();
        state.listenerActive = false;
      }
    });

    // ========== EVENT BINDING ==========
    copyBtn.addEventListener('click', copyUrl);
    shareBtn.addEventListener('click', shareUrl);
    refreshBtn.addEventListener('click', manualRefresh);

    // ========== FIX 13: INIT WITH QUERY PARAM HANDLING ==========
    (function init() {
      fetchLinkStats();
      const params = new URLSearchParams(window.location.search);
      const refParam = params.get('ref');
      if (refParam) {
        updateUrlDisplay(refParam);
        firebaseStatus.textContent = '⍟ link loaded';
        get(linksRef).then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const keys = Object.keys(data);
            state.linkCounter = keys.length;
            linkCount.textContent = state.linkCounter;
            if (keys.includes(refParam)) {
              firebaseStatus.textContent = '⍟ valid ref';
            }
          }
        });
      } else {
        get(linksRef).then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const keys = Object.keys(data);
            if (keys.length > 0) {
              const last = keys[keys.length - 1];
              state.lastPushKey = last;
              updateUrlDisplay(last);
              state.linkCounter = keys.length;
              linkCount.textContent = state.linkCounter;
              const entry = data[last];
              if (entry?.timestamp) {
                const d = new Date(entry.timestamp);
                timestampDisplay.textContent = `⍟ ${d.toLocaleTimeString()}`;
              }
              firebaseStatus.textContent = '⍟ synced';
            }
          }
        });
      }
      timestampDisplay.textContent = `⍟ ${new Date().toLocaleTimeString()}`;
    })();
  </script>
</body>
</html>
