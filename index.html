<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRON BLOG MOBILE - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-orange: #ff6b00;
            --dark-bg: #000000;
            --glass: rgba(0, 255, 255, 0.05);
            --glass-strong: rgba(0, 255, 255, 0.1);
            --border-glow: rgba(0, 240, 255, 0.3);
            --accent: #00f0ff;
            --accent-2: #ff00ff;
            --text: #ffffff;
            --text-muted: #999999;
            --danger: #ff0033;
            --success: #00ff88;
            --gradient-main: linear-gradient(135deg, #00f0ff, #0088ff, #ff00ff);
            --shadow-neon: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.3);
            --shadow-neon-strong: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 50px rgba(0, 240, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            background: var(--dark-bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            touch-action: manipulation;
        }

        /* ===== CUSTOM SCROLLBAR (Mobile) ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        /* ===== GRID BACKGROUND ===== */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 15s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 30px 30px; }
        }

        /* ===== SCANLINE ===== */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.06) 0px,
                rgba(0, 0, 0, 0.06) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 1;
            pointer-events: none;
        }

        /* ===== AURORA ===== */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background:
                radial-gradient(circle at 30% 20%, rgba(0, 240, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255, 0, 255, 0.06) 0%, transparent 40%);
            animation: auroraShift 8s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* ===== PARTICLES ===== */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
        }

        /* ===== PARTICLE BURST ===== */
        .particle-burst {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }

        .burst-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: burstFly 1s ease-out forwards;
        }

        @keyframes burstFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* ===== SHAKE ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        /* ===== PULSE ===== */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 0.5s;
        }

        /* ===== BOUNCE ===== */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .bounce {
            animation: bounce 0.5s;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.92);
            border-bottom: 1px solid var(--border-glow);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 5px 30px rgba(0, 240, 255, 0.1);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 3px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        .icon-btn:active {
            background: var(--accent);
            color: #000000;
            box-shadow: var(--shadow-neon);
            transform: scale(0.9);
        }

        /* ===== MOBILE MENU ===== */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.97);
            z-index: 99;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 70px 15px 20px;
            border-left: 1px solid var(--border-glow);
            box-shadow: -10px 0 50px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 15px;
            color: #cccccc;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.08);
            transition: all 0.3s;
            cursor: pointer;
            border-radius: 10px;
        }

        .mobile-menu a:active {
            color: var(--accent);
            background: rgba(0, 240, 255, 0.08);
            padding-left: 20px;
        }

        .menu-icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 98;
            display: none;
            backdrop-filter: blur(3px);
        }

        .overlay.active {
            display: block;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            position: relative;
            z-index: 2;
            padding-top: 62px;
            min-height: 100vh;
            padding-left: 15px;
            padding-right: 15px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 35px 0 25px;
            position: relative;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 6px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)); }
        }

        .hero .subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 10px;
            color: #666666;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
            display: inline-block;
            margin-right: 5px;
        }

        /* ===== CLOCK DISPLAY ===== */
        .clock-display {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .clock-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent);
        }

        .clock-date {
            font-size: 11px;
            color: #666666;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 13px 18px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            border-radius: 25px;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: var(--shadow-neon);
        }

        .search-bar button {
            padding: 13px 20px;
            background: var(--gradient-main);
            color: #000000;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-weight: 700;
            box-shadow: var(--shadow-neon);
        }

        .search-bar button:active {
            transform: scale(0.9);
        }

        /* ===== BLOG GRID ===== */
        .blog-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .blog-card {
            border: 1px solid var(--border-glow);
            background: var(--glass);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            perspective: 800px;
        }

        .blog-card:active {
            box-shadow: var(--shadow-neon-strong);
            border-color: var(--accent);
            transform: scale(0.97);
        }

        .blog-card-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05), rgba(255, 0, 255, 0.1));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: var(--accent);
            text-shadow: 0 0 25px var(--accent);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-glow);
        }

        .blog-card-content {
            padding: 15px;
        }

        .blog-card-tag {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            border-radius: 12px;
        }

        .blog-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .blog-card-excerpt {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #555555;
            letter-spacing: 1px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 240, 255, 0.08);
        }

        .blog-card-meta .author {
            color: var(--accent);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            border: 2px dashed var(--border-glow);
            color: #555555;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            border-radius: 15px;
            animation: pulseBorder 2s ease-in-out infinite;
        }

        @keyframes pulseBorder {
            0%, 100% { border-color: var(--border-glow); }
            50% { border-color: var(--accent); }
        }

        .empty-state .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== ARTICLE VIEW ===== */
        .article-view {
            display: none;
            margin-bottom: 30px;
        }

        .article-view.active {
            display: block;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .back-to-blog {
            display: inline-block;
            padding: 10px 18px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            margin-bottom: 20px;
            border-radius: 20px;
        }

        .back-to-blog:active {
            background: var(--accent);
            color: #000000;
        }

        .article-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            line-height: 1.4;
            text-align: center;
        }

        .article-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: var(--accent);
            text-shadow: 0 0 25px var(--accent);
            margin-bottom: 20px;
            border: 1px solid var(--border-glow);
            border-radius: 15px;
        }

        .article-content {
            font-size: 14px;
            line-height: 1.8;
            color: #cccccc;
            padding: 15px;
            border: 1px solid var(--border-glow);
            border-radius: 15px;
            background: var(--glass);
        }

        /* ===== READING PROGRESS ===== */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: var(--gradient-main);
            box-shadow: 0 0 15px var(--accent);
            z-index: 200;
            transition: width 0.3s;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 15px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            letter-spacing: 1px;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.5s forwards;
            border: 1px solid;
            max-width: 280px;
            backdrop-filter: blur(10px);
        }

        .toast-success {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .toast-error {
            background: rgba(255, 0, 51, 0.15);
            border-color: var(--danger);
            color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .toast-info {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            display: none;
            margin-bottom: 30px;
        }

        .admin-panel.active {
            display: block;
            animation: slideIn 0.4s ease;
        }

        .admin-login {
            border: 1px solid var(--border-glow);
            padding: 25px;
            background: var(--glass);
            text-align: center;
            border-radius: 15px;
            box-shadow: var(--shadow-neon);
        }

        .admin-login h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-login input {
            width: 100%;
            padding: 13px 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            border-radius: 20px;
            letter-spacing: 3px;
        }

        .admin-dashboard {
            display: none;
        }

        .admin-dashboard.active {
            display: block;
        }

        .admin-dashboard h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-form {
            border: 1px solid var(--border-glow);
            padding: 18px;
            background: var(--glass);
            margin-bottom: 20px;
            border-radius: 15px;
        }

        .admin-form h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .admin-form input,
        .admin-form textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            border-radius: 10px;
        }

        .admin-form input:focus,
        .admin-form textarea:focus {
            border-color: var(--accent);
            box-shadow: var(--shadow-neon);
        }

        .admin-form textarea {
            height: 120px;
            resize: vertical;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .admin-btn-primary {
            flex: 1;
            padding: 12px 20px;
            background: var(--gradient-main);
            color: #000000;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 700;
            box-shadow: var(--shadow-neon);
        }

        .admin-btn-primary:active {
            transform: scale(0.9);
        }

        .admin-btn-danger {
            padding: 10px 15px;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 20px;
        }

        .admin-btn-danger:active {
            background: var(--danger);
            color: #ffffff;
        }

        .admin-post-item {
            border: 1px solid var(--border-glow);
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            border-radius: 10px;
            gap: 10px;
        }

        .admin-post-info h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 3px;
        }

        .admin-post-info p {
            font-size: 9px;
            color: #555555;
        }

        .admin-post-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .admin-post-actions button {
            padding: 6px 10px;
            font-size: 8px;
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .quick-btn {
            padding: 8px 14px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-glow);
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .quick-btn:active {
            background: var(--accent);
            color: #000000;
            box-shadow: var(--shadow-neon);
            transform: scale(0.9);
        }

        /* ===== FOOTER ===== */
        footer {
            padding: 20px 15px;
            text-align: center;
            border-top: 1px solid var(--border-glow);
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.7);
        }

        footer p {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
            color: #555555;
        }

        footer .footer-glow {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== BACK TO TOP ===== */
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 15px;
            z-index: 90;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--shadow-neon);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .back-to-top:active {
            background: var(--accent);
            color: #000000;
            transform: scale(0.9);
        }

        /* ===== FAB (Floating Action Button) ===== */
        .fab {
            position: fixed;
            bottom: 20px;
            left: 15px;
            z-index: 90;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient-main);
            border: none;
            color: #000000;
            font-size: 22px;
            cursor: pointer;
            box-shadow: var(--shadow-neon-strong);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
        }

        .fab:active {
            transform: scale(0.85) rotate(90deg);
        }

        /* ===== THEME SWITCHER ===== */
        .theme-switcher {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-btn:active {
            transform: scale(0.8);
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- BACKGROUND EFFECTS -->
    <div class="grid-bg"></div>
    <div class="scanline"></div>
    <div class="aurora"></div>
    <div class="particles-container" id="particlesContainer"></div>

    <!-- READING PROGRESS -->
    <div class="reading-progress" id="readingProgress"></div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- HEADER -->
    <header>
        <div class="logo" onclick="showHome()">TRON BLOG</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="showAdminPanel()">🔐</button>
            <button class="icon-btn" onclick="toggleThemeSwitcher()">🎨</button>
            <button class="icon-btn" id="hamburger" onclick="toggleMenu()">☰</button>
        </div>
    </header>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">
        <a onclick="showHome(); closeMenu();"><span class="menu-icon">🏠</span> UTAMA</a>
        <a onclick="showAdminPanel(); closeMenu();"><span class="menu-icon">🔐</span> ADMIN</a>
        <a onclick="createBurstParticles(); closeMenu();"><span class="menu-icon">✨</span> PARTIKEL</a>
        <a onclick="toggleMatrixRain(); closeMenu();"><span class="menu-icon">🌧️</span> MATRIX RAIN</a>
        <a onclick="toggleAurora(); closeMenu();"><span class="menu-icon">🌈</span> AURORA</a>
        <a onclick="showToast('Maklumat TRON BLOG', 'info'); closeMenu();"><span class="menu-icon">ℹ️</span> TENTANG</a>
    </div>

    <!-- THEME SWITCHER -->
    <div class="theme-switcher" id="themeSwitcher" style="display:none;">
        <button class="theme-btn" style="background:#00f0ff;box-shadow:0 0 15px #00f0ff;" onclick="changeTheme('#00f0ff')"></button>
        <button class="theme-btn" style="background:#ff00ff;box-shadow:0 0 15px #ff00ff;" onclick="changeTheme('#ff00ff')"></button>
        <button class="theme-btn" style="background:#ff6b00;box-shadow:0 0 15px #ff6b00;" onclick="changeTheme('#ff6b00')"></button>
        <button class="theme-btn" style="background:#00ff88;box-shadow:0 0 15px #00ff88;" onclick="changeTheme('#00ff88')"></button>
    </div>

    <!-- MAIN CONTENT -->
    <main>

        <!-- HERO -->
        <div class="hero" id="heroSection">
            <h1>TRON BLOG</h1>
            <p class="subtitle">DIGITAL CHRONICLES</p>
        </div>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <span><span class="status-dot"></span>ONLINE</span>
            <span id="visitorCount">👁️ 0</span>
        </div>

        <!-- CLOCK -->
        <div class="clock-display">
            <div class="clock-time" id="clockTime">00:00:00</div>
            <div class="clock-date" id="clockDate">---</div>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-bar" id="searchSection">
            <input type="text" id="searchInput" placeholder="CARI..." onkeyup="searchPosts(this.value)">
            <button onclick="searchPosts(document.getElementById('searchInput').value)">CARI</button>
        </div>

        <!-- QUICK ACTIONS -->
        <div class="quick-actions" id="quickActions">
            <button class="quick-btn" onclick="createBurstParticles()">✨ LETUP</button>
            <button class="quick-btn" onclick="toggleMatrixRain()">🌧️ MATRIX</button>
            <button class="quick-btn" onclick="toggleAurora()">🌈 AURORA</button>
            <button class="quick-btn" onclick="showToast('Selamat datang!', 'success')">🔔 TOAST</button>
            <button class="quick-btn" onclick="document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),500)">📳 GEGAR</button>
            <button class="quick-btn" onclick="document.getElementById('heroSection').classList.add('bounce'); setTimeout(()=>document.getElementById('heroSection').classList.remove('bounce'),500)">🏀 LOMPAT</button>
        </div>

        <!-- BLOG GRID -->
        <div class="blog-grid" id="blogGrid">
            <!-- Blog cards -->
        </div>

        <!-- ARTICLE VIEW -->
        <div class="article-view" id="articleView">
            <button class="back-to-blog" onclick="showHome()">← KEMBALI</button>
            <div class="article-header">
                <h1 id="articleTitle"></h1>
            </div>
            <div class="article-image" id="articleImage"></div>
            <div class="article-content" id="articleContent"></div>
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-login" id="adminLogin">
                <h2>🔐 LOGIN ADMIN</h2>
                <input type="password" id="adminPassword" placeholder="KATA LALUAN" onkeypress="if(event.key === 'Enter') adminLogin()">
                <button class="admin-btn-primary" onclick="adminLogin()">LOGIN</button>
            </div>

            <div class="admin-dashboard" id="adminDashboard">
                <h2>📝 PENGURUSAN ARTIKEL</h2>
                
                <div class="admin-form" id="adminForm">
                    <h3 id="formTitle">➕ TAMBAH ARTIKEL</h3>
                    <input type="hidden" id="postId">
                    <input type="text" id="postTitle" placeholder="TAJUK">
                    <input type="text" id="postCategory" placeholder="KATEGORI">
                    <input type="text" id="postIcon" placeholder="IKON (EMOJI)">
                    <input type="text" id="postAuthor" placeholder="PENULIS">
                    <textarea id="postExcerpt" placeholder="RINGKASAN"></textarea>
                    <textarea id="postContent" placeholder="KANDUNGAN (HTML)"></textarea>
                    <div class="btn-row">
                        <button class="admin-btn-primary" onclick="savePost()">💾 SIMPAN</button>
                        <button class="admin-btn-danger" onclick="resetForm()">BATAL</button>
                    </div>
                </div>

                <div id="adminPostList"></div>

                <button class="admin-btn-danger" onclick="adminLogout()" style="margin-top:15px;">🚪 LOGOUT</button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 <span class="footer-glow">TRON BLOG</span> — MOBILE ULTIMATE</p>
    </footer>

    <!-- BACK TO TOP -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>

    <!-- FAB -->
    <button class="fab" onclick="createBurstParticles(); showToast('Letupan Partikel! ✨', 'success')">✦</button>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // ===== FIREBASE =====
        const firebaseConfig = {
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ADMIN_PASSWORD = "admin123";
        let isAdminLoggedIn = false;
        let blogPosts = [];
        let matrixRainActive = false;
        let auroraActive = true;
        let themeSwitcherVisible = false;

        // ===== AUDIO CONTEXT (Sound Effects) =====
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const now = audioContext.currentTime;
                
                switch(type) {
                    case 'click':
                        oscillator.frequency.setValueAtTime(800, now);
                        oscillator.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                        gainNode.gain.setValueAtTime(0.3, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        oscillator.start(now);
                        oscillator.stop(now + 0.1);
                        break;
                    case 'success':
                        oscillator.frequency.setValueAtTime(600, now);
                        oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                        gainNode.gain.setValueAtTime(0.3, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        oscillator.start(now);
                        oscillator.stop(now + 0.2);
                        break;
                    case 'error':
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(200, now);
                        oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                        gainNode.gain.setValueAtTime(0.2, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        oscillator.start(now);
                        oscillator.stop(now + 0.3);
                        break;
                    case 'open':
                        oscillator.frequency.setValueAtTime(400, now);
                        oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                        gainNode.gain.setValueAtTime(0.25, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        oscillator.start(now);
                        oscillator.stop(now + 0.15);
                        break;
                }
            } catch(e) {
                // Audio not available
            }
        }

        // ===== PARTICLES =====
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 4 + 3) + 's';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.width = (Math.random() * 3 + 2) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        function createBurstParticles() {
            playSound('success');
            const burst = document.createElement('div');
            burst.className = 'particle-burst';
            burst.style.left = '50%';
            burst.style.top = '50%';
            document.body.appendChild(burst);

            const colors = ['#00f0ff', '#ff00ff', '#ff6b00', '#00ff88', '#ffffff'];
            
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'burst-particle';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = `0 0 10px ${p.style.background}`;
                
                const angle = (Math.PI * 2 * i) / 25;
                const distance = Math.random() * 100 + 50;
                p.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                
                burst.appendChild(p);
            }

            setTimeout(() => burst.remove(), 1000);
        }

        // ===== MATRIX RAIN =====
        function toggleMatrixRain() {
            matrixRainActive = !matrixRainActive;
            playSound('click');
            
            if (matrixRainActive) {
                const rain = document.createElement('div');
                rain.className = 'matrix-rain';
                rain.id = 'matrixRain';
                document.body.appendChild(rain);
                
                const chars = '01';
                for (let i = 0; i < 50; i++) {
                    const span = document.createElement('span');
                    span.textContent = chars[Math.floor(Math.random() * 2)];
                    span.style.position = 'absolute';
                    span.style.left = Math.random() * 100 + '%';
                    span.style.top = Math.random() * 100 + '%';
                    span.style.animation = `floatParticle ${Math.random() * 3 + 2}s linear infinite`;
                    rain.appendChild(span);
                }
                showToast('Matrix Rain Aktif! 🌧️', 'success');
            } else {
                const rain = document.getElementById('matrixRain');
                if (rain) rain.remove();
                showToast('Matrix Rain Dimatikan', 'info');
            }
        }

        // ===== AURORA =====
        function toggleAurora() {
            auroraActive = !auroraActive;
            playSound('click');
            const aurora = document.querySelector('.aurora');
            if (aurora) {
                aurora.style.display = auroraActive ? 'block' : 'none';
            }
            showToast(auroraActive ? 'Aurora Aktif! 🌈' : 'Aurora Dimatikan', 'info');
        }

        // ===== THEME =====
        function toggleThemeSwitcher() {
            themeSwitcherVisible = !themeSwitcherVisible;
            playSound('click');
            document.getElementById('themeSwitcher').style.display = themeSwitcherVisible ? 'flex' : 'none';
        }

        function changeTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--neon-blue', color);
            playSound('success');
            showToast('Tema ditukar! 🎨', 'success');
        }

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').textContent = now.toLocaleTimeString('ms-MY', { hour12: false });
            document.getElementById('clockDate').textContent = now.toLocaleDateString('ms-MY', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== READING PROGRESS =====
        window.addEventListener('scroll', function() {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = (scrollTop / docHeight) * 100;
            document.getElementById('readingProgress').style.width = progress + '%';
            
            const backToTop = document.getElementById('backToTop');
            if (scrollTop > 200) {
                backToTop.style.display = 'flex';
            } else {
                backToTop.style.display = 'none';
            }
        });

        // ===== VISITOR COUNTER =====
        function updateVisitorCount() {
            const countRef = database.ref('visitors');
            countRef.transaction((current) => {
                return (current || 0) + 1;
            });
            countRef.on('value', (snapshot) => {
                document.getElementById('visitorCount').textContent = '👁️ ' + (snapshot.val() || 0);
            });
        }

        // ===== LOAD POSTS =====
        function loadPosts() {
            database.ref('posts').on('value', (snapshot) => {
                blogPosts = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        blogPosts.push({ id: child.key, ...child.val() });
                    });
                }
                renderBlog(blogPosts);
                renderAdminPostList();
            });
        }

        // ===== RENDER BLOG =====
        function renderBlog(posts) {
            const grid = document.getElementById('blogGrid');
            grid.innerHTML = '';

            if (posts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        TIADA ARTIKEL<br>
                        <span style="font-size:9px;color:#444;">TAMBAH MELALUI ADMIN</span>
                    </div>
                `;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.onclick = () => { playSound('open'); openArticle(post.id); };
                card.innerHTML = `
                    <div class="blog-card-image">${post.icon || '📄'}</div>
                    <div class="blog-card-content">
                        <span class="blog-card-tag">${post.category || 'UMUM'}</span>
                        <h2>${post.title}</h2>
                        <p class="blog-card-excerpt">${post.excerpt || ''}</p>
                        <div class="blog-card-meta">
                            <span class="author">${post.author || 'Tanpa Nama'}</span>
                            <span>${post.date || ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ===== SEARCH =====
        function searchPosts(query) {
            playSound('click');
            const filtered = blogPosts.filter(post => {
                const text = (post.title + ' ' + post.excerpt + ' ' + post.category).toLowerCase();
                return text.includes(query.toLowerCase());
            });
            renderBlog(filtered);
        }

        // ===== OPEN ARTICLE =====
        function openArticle(id) {
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('quickActions').style.display = 'none';
            document.getElementById('blogGrid').style.display = 'none';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('articleView').classList.add('active');

            document.getElementById('articleTitle').textContent = post.title;
            document.getElementById('articleImage').textContent = post.icon || '📄';
            document.getElementById('articleContent').innerHTML = post.content || '<p>Tiada kandungan.</p>';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== SHOW HOME =====
        function showHome() {
            playSound('click');
            document.getElementById('heroSection').style.display = 'block';
            document.getElementById('searchSection').style.display = 'flex';
            document.getElementById('quickActions').style.display = 'flex';
            document.getElementById('blogGrid').style.display = 'grid';
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.remove('active');
            renderBlog(blogPosts);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== ADMIN =====
        function showAdminPanel() {
            playSound('click');
            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('quickActions').style.display = 'none';
            document.getElementById('blogGrid').style.display = 'none';
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.add('active');

            if (isAdminLoggedIn) {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').classList.add('active');
            } else {
                document.getElementById('adminLogin').style.display = 'block';
                document.getElementById('adminDashboard').classList.remove('active');
            }
        }

        function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                playSound('success');
                isAdminLoggedIn = true;
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').classList.add('active');
                document.getElementById('adminPassword').value = '';
                showToast('Login berjaya! ✅', 'success');
            } else {
                playSound('error');
                showToast('Kata laluan salah! ❌', 'error');
                document.getElementById('adminLogin').classList.add('shake');
                setTimeout(() => document.getElementById('adminLogin').classList.remove('shake'), 500);
            }
        }

        function adminLogout() {
            playSound('click');
            isAdminLoggedIn = false;
            document.getElementById('adminLogin').style.display = 'block';
            document.getElementById('adminDashboard').classList.remove('active');
            resetForm();
            showToast('Logout berjaya!', 'info');
        }

        function renderAdminPostList() {
            const list = document.getElementById('adminPostList');
            list.innerHTML = '';
            if (blogPosts.length === 0) {
                list.innerHTML = '<p style="color:#444;text-align:center;padding:15px;">Tiada artikel.</p>';
                return;
            }
            blogPosts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'admin-post-item';
                item.innerHTML = `
                    <div class="admin-post-info">
                        <h4>${post.title}</h4>
                        <p>${post.category || 'UMUM'} • ${post.date || ''}</p>
                    </div>
                    <div class="admin-post-actions">
                        <button class="admin-btn-primary" onclick="editPost('${post.id}')">EDIT</button>
                        <button class="admin-btn-danger" onclick="deletePost('${post.id}')">PADAM</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function savePost() {
            playSound('success');
            const id = document.getElementById('postId').value;
            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value.trim();
            const icon = document.getElementById('postIcon').value.trim();
            const author = document.getElementById('postAuthor').value.trim();
            const excerpt = document.getElementById('postExcerpt').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !category || !author) {
                showToast('Sila isi ruangan wajib!', 'error');
                return;
            }

            const data = { title, category, icon: icon || '📄', author, excerpt, content, date: new Date().toISOString().split('T')[0] };

            if (id) {
                database.ref('posts/' + id).update(data).then(() => {
                    showToast('Artikel dikemaskini! ✅', 'success');
                    resetForm();
                });
            } else {
                database.ref('posts').push(data).then(() => {
                    showToast('Artikel disimpan! ✅', 'success');
                    resetForm();
                });
            }
        }

        function editPost(id) {
            playSound('click');
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;
            document.getElementById('postId').value = post.id;
            document.getElementById('postTitle').value = post.title || '';
            document.getElementById('postCategory').value = post.category || '';
            document.getElementById('postIcon').value = post.icon || '';
            document.getElementById('postAuthor').value = post.author || '';
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('postContent').value = post.content || '';
            document.getElementById('formTitle').textContent = '✏️ EDIT ARTIKEL';
        }

        function deletePost(id) {
            playSound('error');
            if (confirm('Padam artikel ini?')) {
                database.ref('posts/' + id).remove().then(() => {
                    showToast('Artikel dipadam! ✅', 'success');
                });
            }
        }

        function resetForm() {
            document.getElementById('postId').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postCategory').value = '';
            document.getElementById('postIcon').value = '';
            document.getElementById('postAuthor').value = '';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('formTitle').textContent = '➕ TAMBAH ARTIKEL';
        }

        // ===== MENU =====
        function toggleMenu() {
            playSound('click');
            document.getElementById('mobileMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('hamburger').classList.toggle('active');
        }

        function closeMenu() {
            document.getElementById('mobileMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // ===== BACK TO TOP =====
        function scrollToTop() {
            playSound('click');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== SWIPE GESTURES =====
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diff = touchEndX - touchStartX;
            if (diff > 80) {
                // Swipe right - open menu
                toggleMenu();
            } else if (diff < -80) {
                // Swipe left - close menu
                closeMenu();
            }
        }

        // ===== TAP ANYWHERE FOR PARTICLES =====
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                createMiniBurst(e.clientX, e.clientY);
            }
        });

        function createMiniBurst(x, y) {
            const burst = document.createElement('div');
            burst.className = 'particle-burst';
            burst.style.left = x + 'px';
            burst.style.top = y + 'px';
            document.body.appendChild(burst);
            
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'burst-particle';
                p.style.background = '#00f0ff';
                p.style.boxShadow = '0 0 8px #00f0ff';
                const angle = (Math.PI * 2 * i) / 8;
                const dist = Math.random() * 30 + 15;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                burst.appendChild(p);
            }
            setTimeout(() => burst.remove(), 800);
        }

        // ===== INIT =====
        createParticles();
        loadPosts();
        updateVisitorCount();

        // ===== PREVENT ZOOM =====
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>

</body>
</html>
