<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixelChat</title>

  <!-- Preconnect to YOUR Firebase database -->
  <link rel="preconnect" href="https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app">
  <link rel="preconnect" href="https://www.googleapis.com">

  <!-- Pixel font -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"></noscript>

  <!-- PWA Manifest (inline) -->
  <link rel="manifest" href='data:application/json,{"name":"PixelChat","short_name":"PixelChat","start_url":"/","display":"standalone","background_color":"#111","theme_color":"#0f0","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23111%22/%3E%3Ctext x=%228%22 y=%2248%22 font-family=%22monospace%22 font-size=%2248%22 fill=%22%230f0%22%3E%3C/text%3E%3C/svg%3E","sizes":"64x64","type":"image/svg+xml"}]}'>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#111;
      color:#0f0;
      font-family: 'Press Start 2P', monospace;
      font-size:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:8px;
      image-rendering:pixelated;
    }
    #app {
      max-width:600px;
      width:100%;
      background:#222;
      border:4px solid #0f0;
      padding:12px;
      box-shadow:8px 8px 0 #0f0;
    }
    h1 {
      font-size:18px;
      text-align:center;
      color:#f0f;
      text-shadow:3px 3px 0 #0ff;
      margin-bottom:12px;
      letter-spacing:2px;
    }
    #messages {
      height:300px;
      overflow-y:auto;
      background:#000;
      border:2px solid #0f0;
      padding:8px;
      margin-bottom:8px;
      scroll-behavior:smooth;
      font-size:11px;
      line-height:1.6;
    }
    #messages div {
      border-bottom:1px solid #333;
      padding:4px 0;
      word-wrap:break-word;
    }
    .username { color:#ff0; margin-right:8px; }
    .timestamp { color:#666; font-size:8px; margin-left:8px; }
    #input-area {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    #input-area input, #input-area button {
      font-family:inherit;
      font-size:11px;
      background:#000;
      color:#0f0;
      border:2px solid #0f0;
      padding:8px;
      outline:none;
      image-rendering:pixelated;
    }
    #input-area input {
      flex:2;
      min-width:120px;
    }
    #input-area input:focus {
      background:#0f0;
      color:#000;
    }
    #input-area button {
      flex:1;
      background:#0f0;
      color:#000;
      cursor:pointer;
      font-weight:bold;
      min-width:80px;
    }
    #input-area button:hover {
      background:#f0f;
      color:#fff;
      border-color:#f0f;
    }
    #status {
      font-size:8px;
      color:#888;
      margin-top:6px;
      text-align:center;
    }
    ::-webkit-scrollbar { width:6px; background:#000; }
    ::-webkit-scrollbar-thumb { background:#0f0; border:1px solid #0f0; }
  </style>
</head>
<body>
  <div id="app">
    <h1>⬛ PIXELCHAT ⬛</h1>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="nameInput" placeholder="NAME" maxlength="12" value="Guest">
      <input type="text" id="msgInput" placeholder="MESSAGE" maxlength="200" autofocus>
      <button id="sendBtn">SEND</button>
    </div>
    <div id="status">connecting…</div>
  </div>

  <script>
    // ============================================================
    //  YOUR FIREBASE DATABASE URL – NO API KEY NEEDED!
    //  Using Firebase REST API directly
    // ============================================================
    const DB_URL = 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app';

    // DOM refs
    const msgContainer = document.getElementById('messages');
    const nameInput = document.getElementById('nameInput');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');

    let lastKey = null;

    // Helpers
    function getTime() {
      const d = new Date();
      return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function addMessage(key, data) {
      const div = document.createElement('div');
      const name = data.username || 'Anonymous';
      const text = data.text || '';
      const colour = data.colour || '#0f0';
      const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
      div.innerHTML = `<span class="username" style="color:${colour}">${escapeHtml(name)}</span>${escapeHtml(text)}<span class="timestamp">${time}</span>`;
      div.dataset.key = key;
      msgContainer.appendChild(div);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    // ============================================================
    //  FETCH MESSAGES VIA REST API (only last 50)
    // ============================================================
    function fetchMessages() {
      const url = `${DB_URL}/messages.json?orderBy="$key"&limitToLast=50`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          const keys = Object.keys(data).sort();
          // Clear and re-render
          msgContainer.innerHTML = '';
          keys.forEach(key => {
            addMessage(key, data[key]);
          });
          if (keys.length > 0) {
            lastKey = keys[keys.length - 1];
          }
          statusEl.textContent = 'connected · ' + getTime();
        })
        .catch(err => {
          statusEl.textContent = '⚠️ offline – retrying…';
          console.warn(err);
        });
    }

    // ============================================================
    //  POLL FOR NEW MESSAGES (REST alternative to realtime)
    //  Optimised for 64kbps – polls every 3 seconds
    // ============================================================
    function pollNewMessages() {
      let query = `${DB_URL}/messages.json?orderBy="$key"&limitToLast=1`;
      if (lastKey) {
        query = `${DB_URL}/messages.json?orderBy="$key"&startAfter="${lastKey}"&limitToFirst=5`;
      }
      fetch(query)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          const keys = Object.keys(data).sort();
          keys.forEach(key => {
            if (key !== lastKey) {
              addMessage(key, data[key]);
            }
          });
          if (keys.length > 0) {
            lastKey = keys[keys.length - 1];
          }
          statusEl.textContent = 'live · ' + getTime();
        })
        .catch(err => {
          // Silent fail – will retry next poll
        });
    }

    // ============================================================
    //  SEND MESSAGE VIA REST API
    // ============================================================
    function sendMessage() {
      const name = nameInput.value.trim() || 'Guest';
      const text = msgInput.value.trim();
      if (!text) return;

      const msg = {
        username: name.slice(0, 12),
        text: text.slice(0, 200),
        timestamp: Date.now(),
        colour: '#0f0'
      };

      const url = `${DB_URL}/messages.json`;
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(msg)
      })
      .then(res => res.json())
      .then(() => {
        msgInput.value = '';
        msgInput.focus();
        // Immediately fetch to show new message
        pollNewMessages();
      })
      .catch(err => {
        statusEl.textContent = '❌ send failed';
        console.error(err);
      });
    }

    // ============================================================
    //  INIT – fetch messages and start polling
    // ============================================================
    fetchMessages();
    // Poll every 3 seconds (optimised for 64kbps)
    setInterval(pollNewMessages, 3000);

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    window.addEventListener('load', () => msgInput.focus());

    // ============================================================
    //  SERVICE WORKER – Inline (no separate file)
    // ============================================================
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'pixelchat-v1';
        const ASSETS = [
          '/',
          '/index.html',
          'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap'
        ];
        self.addEventListener('install', e => {
          e.waitUntil(
            caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting())
          );
        });
        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(
              keys.filter(k => k !== CACHE).map(k => caches.delete(k))
            )).then(() => clients.claim())
          );
        });
        self.addEventListener('fetch', e => {
          const req = e.request;
          const url = new URL(req.url);
          if (url.origin === location.origin || url.hostname === 'fonts.googleapis.com') {
            e.respondWith(
              caches.match(req).then(cached => cached || fetch(req).then(res => {
                const clone = res.clone();
                caches.open(CACHE).then(c => c.put(req, clone));
                return res;
              }))
            );
          } else {
            e.respondWith(fetch(req));
          }
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl);
    }
  </script>
</body>
</html>
