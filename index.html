<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Threads - Social Platform</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ================================================================
       FIXED THREADS STYLES v4.1
       ================================================================ */
    
    /* ----- 1. RESET & VARIABLES ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: #121212;
      --bg-input: #1a1a1a;
      --bg-hover: #1f1f1f;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-muted: #6b6b6b;
      --accent: #0095f6;
      --accent-hover: #1a9fff;
      --like: #ed4956;
      --border: #2a2a2a;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: all 0.2s ease;
    }

    body {
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ----- 2. SCROLLBAR ----- */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    /* ----- 3. APP LAYOUT ----- */
    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 0 80px;
      position: relative;
    }

    /* ----- 4. HEADER ----- */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0095f6, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .logo i {
      -webkit-text-fill-color: initial;
      color: var(--accent);
      margin-right: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: var(--transition);
      position: relative;
    }

    .header-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .header-btn:active {
      transform: scale(0.9);
    }

    .header-btn .badge-count {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--like);
      color: white;
      font-size: 0.5rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    .android-badge {
      background: #3ddc84;
      color: #000;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    /* ----- 5. COMPOSE THREAD ----- */
    .compose-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .compose-container {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .compose-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }

    .compose-input-wrap {
      flex: 1;
      position: relative;
    }

    .compose-input-wrap textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      min-height: 70px;
      max-height: 200px;
      outline: none;
      transition: var(--transition);
    }

    .compose-input-wrap textarea:focus {
      border-color: var(--accent);
    }

    .compose-input-wrap textarea::placeholder {
      color: var(--text-muted);
    }

    .compose-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .compose-tools {
      display: flex;
      gap: 8px;
    }

    .compose-tools button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: var(--transition);
    }

    .compose-tools button:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }

    .compose-tools button:active {
      transform: scale(0.9);
    }

    .compose-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .compose-submit:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .compose-submit:active {
      transform: scale(0.95);
    }

    .compose-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .char-count {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-right: 12px;
    }

    .char-count.over {
      color: var(--like);
    }

    /* ----- 6. THREADS FEED ----- */
    .feed {
      padding: 0;
    }

    .feed-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
    }

    .feed-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .feed-header .feed-stats {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ----- 7. THREAD CARD ----- */
    .thread-card {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
      animation: fadeSlideUp 0.3s ease;
    }

    .thread-card:hover {
      background: var(--bg-hover);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .thread-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .thread-user {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .thread-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: white;
      flex-shrink: 0;
    }

    .thread-avatar.green { background: linear-gradient(135deg, #00b894, #00a381); }
    .thread-avatar.pink { background: linear-gradient(135deg, #e94560, #d63851); }
    .thread-avatar.orange { background: linear-gradient(135deg, #fdcb6e, #f9ca5c); }
    .thread-avatar.purple { background: linear-gradient(135deg, #a855f7, #7c3aed); }

    .thread-user-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .thread-username {
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .thread-username .verified {
      color: var(--accent);
      font-size: 0.7rem;
    }

    .thread-handle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .thread-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .thread-content {
      margin: 8px 0 12px 46px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .thread-content .hashtag {
      color: var(--accent);
      cursor: pointer;
    }

    .thread-content .hashtag:hover {
      text-decoration: underline;
    }

    .thread-content .mention {
      color: var(--accent);
      cursor: pointer;
    }

    .thread-content .mention:hover {
      text-decoration: underline;
    }

    /* ----- 8. THREAD MEDIA ----- */
    .thread-media {
      margin: 8px 0 12px 46px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border: 1px solid var(--border);
      position: relative;
    }

    .thread-media img {
      width: 100%;
      display: block;
      max-height: 300px;
      object-fit: cover;
    }

    .thread-media .media-placeholder {
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .thread-media .media-placeholder i {
      font-size: 2rem;
      color: var(--text-muted);
    }

    /* ----- 9. THREAD ACTIONS ----- */
    .thread-actions {
      display: flex;
      gap: 20px;
      margin-left: 46px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .thread-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      transition: var(--transition);
    }

    .thread-action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .thread-action-btn:active {
      transform: scale(0.9);
    }

    .thread-action-btn.liked {
      color: var(--like);
    }

    .thread-action-btn.liked i {
      font-weight: 900;
    }

    .thread-action-btn .count {
      font-weight: 600;
      min-width: 16px;
    }

    .thread-action-btn .icon {
      font-size: 1.1rem;
    }

    /* ----- 10. REPLY SECTION ----- */
    .reply-section {
      margin: 10px 0 0 46px;
      display: none;
      animation: fadeSlideUp 0.2s ease;
    }

    .reply-section.open {
      display: block;
    }

    .reply-container {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .reply-container .compose-avatar {
      width: 28px;
      height: 28px;
      font-size: 0.8rem;
    }

    .reply-container input {
      flex: 1;
      min-width: 120px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 14px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition);
    }

    .reply-container input:focus {
      border-color: var(--accent);
    }

    .reply-container input::placeholder {
      color: var(--text-muted);
    }

    .reply-container .reply-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .reply-container .reply-submit:hover {
      background: var(--accent-hover);
    }

    .reply-container .reply-submit:active {
      transform: scale(0.9);
    }

    /* ----- 11. REPLIES LIST ----- */
    .replies-list {
      margin: 8px 0 0 34px;
      padding-left: 16px;
      border-left: 2px solid var(--border);
    }

    .reply-item {
      padding: 8px 0;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .reply-item .thread-avatar {
      width: 24px;
      height: 24px;
      font-size: 0.6rem;
      flex-shrink: 0;
    }

    .reply-item .reply-content {
      flex: 1;
      min-width: 0;
    }

    .reply-item .reply-user {
      font-weight: 700;
      font-size: 0.75rem;
    }

    .reply-item .reply-text {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
      word-wrap: break-word;
    }

    .reply-item .reply-time {
      font-size: 0.6rem;
      color: var(--text-muted);
    }

    /* ----- 12. EMPTY STATE ----- */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 0.9rem;
      max-width: 300px;
      margin: 0 auto;
    }

    /* ----- 13. LOADING SHIMMER ----- */
    .shimmer {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      height: 60px;
      margin: 12px;
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    /* ----- 14. TOAST ----- */
    .toast-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: 90%;
      max-width: 540px;
      pointer-events: none;
    }

    .toast {
      background: rgba(30,30,30,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      animation: fadeSlideUp 0.3s ease;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .toast.success { border-left: 3px solid var(--accent); }
    .toast.error { border-left: 3px solid var(--like); }
    .toast.warning { border-left: 3px solid #fdcb6e; }

    .toast .toast-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .toast .toast-close:hover {
      color: var(--text-primary);
    }

    /* ----- 15. BLOCKED PAGE ----- */
    .blocked-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      color: white;
      padding: 20px;
      text-align: center;
      flex-direction: column;
    }

    .blocked-page .icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .blocked-page h1 {
      font-size: 2rem;
      margin: 0 0 8px;
    }

    .blocked-page p {
      max-width: 320px;
      color: #aaa;
      line-height: 1.8;
    }

    /* ----- 16. RESPONSIVE ----- */
    @media (max-width: 480px) {
      .thread-content {
        margin-left: 0;
      }
      .thread-actions {
        margin-left: 0;
        gap: 12px;
      }
      .reply-section {
        margin-left: 0;
      }
      .replies-list {
        margin-left: 0;
        padding-left: 12px;
      }
      .compose-container {
        flex-direction: row;
      }
      .compose-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .compose-tools {
        justify-content: center;
      }
      .thread-time {
        font-size: 0.6rem;
      }
      .logo {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 380px) {
      .header {
        padding: 8px 12px;
      }
      .thread-card {
        padding: 12px;
      }
      .compose-section {
        padding: 12px;
      }
      .thread-actions {
        gap: 8px;
      }
      .thread-action-btn {
        font-size: 0.7rem;
        padding: 2px 6px;
      }
    }

    /* ----- 17. ACCESSIBILITY ----- */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

<div id="root"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
  (function() {
    "use strict";

    // ================================================================
    // 1. CONFIGURATION
    // ================================================================
    const CONFIG = {
      firebase: {
        apiKey: "AIzaSyDemoKeyReplaceMe",
        authDomain: "zack360-2b303.firebaseapp.com",
        databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "zack360-2b303",
        storageBucket: "zack360-2b303.appspot.com",
        messagingSenderId: "123456789012",
        appId: "1:123456789012:web:abcdef123456"
      },
      dbPath: 'threads',
      maxThreadLength: 500,
      maxReplies: 50,
      maxReplyLength: 280
    };

    // ================================================================
    // 2. STATE
    // ================================================================
    const State = {
      threads: [],
      users: {},
      currentUser: null,
      isOnline: true,
      loading: true,
      replyingTo: null,
      stats: { threads: 0, replies: 0, likes: 0 },
      listeners: []
    };

    // ================================================================
    // 3. UTILITY FUNCTIONS
    // ================================================================
    const Utils = {
      isAndroid() {
        return /android/i.test(navigator.userAgent);
      },

      generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 8);
      },

      timeAgo(timestamp) {
        const now = Date.now();
        const diff = now - timestamp;
        const seconds = Math.floor(diff / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        
        if (days > 0) return days + 'd';
        if (hours > 0) return hours + 'h';
        if (minutes > 0) return minutes + 'm';
        if (seconds > 10) return seconds + 's';
        return 'now';
      },

      getAvatarColor(id) {
        const colors = ['', 'green', 'pink', 'orange', 'purple'];
        const index = id ? parseInt(id.charAt(id.length - 1), 36) % colors.length : 0;
        return colors[index] || '';
      },

      getInitials(name) {
        if (!name) return 'U';
        return name.charAt(0).toUpperCase();
      },

      formatText(text) {
        if (!text) return '';
        // Escape HTML
        const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        // Hashtag and mention detection
        return escaped
          .replace(/#(\w+)/g, '<span class="hashtag">#$1</span>')
          .replace(/@(\w+)/g, '<span class="mention">@$1</span>');
      },

      truncate(str, max) {
        if (!str) return '';
        if (str.length <= max) return str;
        return str.substring(0, max) + '...';
      },

      debounce(fn, delay = 300) {
        let timeoutId;
        return function(...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), delay);
        };
      }
    };

    // ================================================================
    // 4. TOAST SYSTEM
    // ================================================================
    const Toast = {
      container: null,

      init() {
        this.container = document.getElementById('toastContainer');
        if (!this.container) {
          console.error('Toast container not found');
        }
      },

      show(message, type = 'info') {
        if (!this.container) return;
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icons = {
          success: '✅',
          error: '❌',
          warning: '⚠️',
          info: 'ℹ️'
        };
        toast.innerHTML = `
          <span>${icons[type] || 'ℹ️'} ${message}</span>
          <button class="toast-close" aria-label="Close notification">&times;</button>
        `;
        
        const closeBtn = toast.querySelector('.toast-close');
        closeBtn.addEventListener('click', () => {
          this.removeToast(toast);
        });
        
        this.container.appendChild(toast);
        
        // Auto-remove after 3.5 seconds
        const timeoutId = setTimeout(() => {
          this.removeToast(toast);
        }, 3500);
        
        // Store timeout for cleanup
        toast._timeoutId = timeoutId;
        
        // Pause timeout on hover
        toast.addEventListener('mouseenter', () => {
          clearTimeout(toast._timeoutId);
        });
        
        toast.addEventListener('mouseleave', () => {
          toast._timeoutId = setTimeout(() => {
            this.removeToast(toast);
          }, 1500);
        });
      },

      removeToast(toast) {
        if (!toast || !toast.parentNode) return;
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
          }
        }, 300);
      },

      success(msg) { this.show(msg, 'success'); },
      error(msg) { this.show(msg, 'error'); },
      warning(msg) { this.show(msg, 'warning'); },
      info(msg) { this.show(msg, 'info'); }
    };

    // ================================================================
    // 5. FIREBASE MANAGER
    // ================================================================
    const FirebaseManager = {
      db: null,
      ref: null,
      threadsRef: null,
      initialized: false,
      listeners: [],

      init() {
        if (this.initialized) return;
        try {
          firebase.initializeApp(CONFIG.firebase);
          this.db = firebase.database();
          this.ref = this.db.ref(CONFIG.dbPath);
          this.threadsRef = this.ref.child('threads');
          this.initialized = true;
          
          // Monitor connection status
          const connRef = this.db.ref('.info/connected');
          connRef.on('value', (snap) => {
            State.isOnline = snap.val() === true;
          });
          
          return this;
        } catch (e) {
          console.error('Firebase init error:', e);
          Toast.error('Connection failed. Please refresh.');
          throw e;
        }
      },

      async getThreads(limit = 50) {
        try {
          const snapshot = await this.threadsRef
            .orderByChild('timestamp')
            .limitToLast(limit)
            .once('value');
          const data = snapshot.val();
          if (!data) return [];
          return Object.entries(data)
            .map(([id, thread]) => {
              // Ensure thread has an id
              return { 
                id, 
                ...thread,
                replies: thread.replies || {},
                replyCount: thread.replyCount || 0,
                likes: thread.likes || 0,
                likedBy: thread.likedBy || {}
              };
            })
            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        } catch (e) {
          console.error('Get threads error:', e);
          throw e;
        }
      },

      async createThread(threadData) {
        try {
          const id = Utils.generateId();
          const timestamp = Date.now();
          const newThread = {
            ...threadData,
            id,
            timestamp,
            replies: {},
            replyCount: 0,
            likes: 0,
            likedBy: {}
          };
          await this.threadsRef.child(id).set(newThread);
          return { id, ...newThread };
        } catch (e) {
          console.error('Create thread error:', e);
          throw e;
        }
      },

      async addReply(threadId, replyData) {
        try {
          const replyId = Utils.generateId();
          const timestamp = Date.now();
          const newReply = {
            ...replyData,
            id: replyId,
            timestamp
          };
          
          // Add reply
          const replyPath = `threads/${threadId}/replies/${replyId}`;
          await this.ref.child(replyPath).set(newReply);
          
          // Increment reply count
          await this.threadsRef.child(threadId).child('replyCount')
            .transaction(current => (current || 0) + 1);
          
          return { ...newReply, id: replyId };
        } catch (e) {
          console.error('Add reply error:', e);
          throw e;
        }
      },

      async toggleLike(threadId) {
        try {
          const threadRef = this.threadsRef.child(threadId);
          const userId = 'user_' + Utils.generateId().substr(0, 8);
          
          // Check if already liked
          const likedSnapshot = await threadRef.child('likedBy').child(userId).once('value');
          const alreadyLiked = likedSnapshot.val() === true;
          
          if (alreadyLiked) {
            // Unlike
            await threadRef.child('likedBy').child(userId).remove();
            const newLikes = await threadRef.child('likes')
              .transaction(current => Math.max(0, (current || 0) - 1));
            return { liked: false, likes: newLikes.snapshot.val() || 0 };
          } else {
            // Like
            await threadRef.child('likedBy').child(userId).set(true);
            const newLikes = await threadRef.child('likes')
              .transaction(current => (current || 0) + 1);
            return { liked: true, likes: newLikes.snapshot.val() || 0 };
          }
        } catch (e) {
          console.error('Toggle like error:', e);
          throw e;
        }
      },

      attachRealtime(callback) {
        const listener = this.threadsRef
          .orderByChild('timestamp')
          .limitToLast(50)
          .on('value', (snapshot) => {
            try {
              const data = snapshot.val();
              if (!data) {
                callback([]);
                return;
              }
              const threads = Object.entries(data)
                .map(([id, thread]) => ({
                  id,
                  ...thread,
                  replies: thread.replies || {},
                  replyCount: thread.replyCount || 0,
                  likes: thread.likes || 0,
                  likedBy: thread.likedBy || {}
                }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
              callback(threads);
            } catch (e) {
              console.error('Realtime callback error:', e);
            }
          }, (error) => {
            console.error('Realtime listener error:', error);
            Toast.warning('Connection issue. Retrying...');
          });
        
        this.listeners.push(listener);
        return listener;
      },

      detachRealtime() {
        this.listeners.forEach(listener => {
          this.threadsRef.off('value', listener);
        });
        this.listeners = [];
      }
    };

      renderThreads(threads) {

      createThreadHTML(thread) {
        const avatarClass = Utils.getAvatarColor(thread.userId || thread.id);

        const likes = thread.likes || 0;
        const replies = thread.replies ? Object.values(thread.replies) : [];

                </div>

            </div>
            <div class="thread-content">${content}</div>

          </div>

      },

      escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      },

      createThreadMedia(thread) {
        if (thread.media) {
          return `
            <div class="thread-media">
              <img src="${this.escapeHtml(thread.media)}" alt="Thread media" loading="lazy" />
            </div>
          `;
        }
        if (thread.mediaType) {
          return `
            <div class="thread-media">
              <div class="media-placeholder">
                <i class="fas fa-${this.escapeHtml(thread.mediaType)}" aria-hidden="true"></i>
                <span>${this.escapeHtml(thread.mediaLabel || 'Media')}</span>
              </div>

      createReplySection(thread) {
        return `

                class="reply-input" 
                id="reply-input-${thread.id}"
                placeholder="Write a reply..."

              />

            </div>
          </div>

      createRepliesList(replies) {
        if (!replies || replies.length === 0) return '';
        const visibleReplies = replies.slice(0, CONFIG.maxReplies);
        return `
          <div class="replies-list">
            ${visibleReplies.map(reply => `
              <div class="reply-item">
                <div class="thread-avatar ${Utils.getAvatarColor(reply.userId || reply.id)}" style="width:24px;height:24px;font-size:0.6rem;" aria-hidden="true">
                  ${Utils.getInitials(reply.username || 'U')}
                </div>
                <div class="reply-content">
                  <div>
                    <span class="reply-user">${this.escapeHtml(Utils.truncate(reply.username || 'Anonymous', 15))}</span>
                    <span class="reply-time"> · ${Utils.timeAgo(reply.timestamp)}</span>
                  </div>

                </div>
              </div>

          </div>

      updateStats(threads) {
        const total = threads ? threads.length : 0;
        const replies = threads ? threads.reduce((sum, t) => sum + (t.replyCount || 0), 0) : 0;
        const likes = threads ? threads.reduce((sum, t) => sum + (t.likes || 0), 0) : 0;
        
        if (this.elements.threadCount) this.elements.threadCount.textContent = total;
        if (this.elements.feedStats) {
          this.elements.feedStats.textContent = `${total} threads · ${replies} replies · ${likes} likes`;
        }
        
        State.stats.threads = total;
        State.stats.replies = replies;
        State.stats.likes = likes;
      },

      updateCharCount() {
        const input = this.elements.threadInput;
        const counter = this.elements.charCount;
        if (!input || !counter) return;
        const len = input.value.length;
        const max = CONFIG.maxThreadLength;
        counter.textContent = `${len}/${max}`;
        counter.classList.toggle('over', len > max);
        if (this.elements.postBtn) {
          this.elements.postBtn.disabled = len === 0 || len > max;
        }
      },

      bindThreadEvents() {
        // Like buttons - use event delegation for better performance
        document.querySelectorAll('.like-btn').forEach(btn => {
          // Remove existing listeners to prevent duplicates
          btn.replaceWith(btn.cloneNode(true));
        });
        
        document.querySelectorAll('.like-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            e.preventDefault();
            const threadId = btn.dataset.threadId;
            if (threadId) {
              await this.handleLike(threadId, btn);
            }
          });
        });

        // Reply toggle
        document.querySelectorAll('.reply-toggle').forEach(btn => {
          btn.replaceWith(btn.cloneNode(true));
        });
        
        document.querySelectorAll('.reply-toggle').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const threadId = btn.dataset.threadId;
            const section = document.querySelector(`.reply-section[data-thread-id="${threadId}"]`);
            if (section) {
              const isOpen = section.classList.toggle('open');
              if (isOpen) {
                const input = section.querySelector('.reply-input');
                if (input) {
                  setTimeout(() => input.focus(), 100);
                }
              }
            }
          });
        });

        // Reply submit
        document.querySelectorAll('.reply-submit').forEach(btn => {
          btn.replaceWith(btn.cloneNode(true));
        });
        
        document.querySelectorAll('.reply-submit').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const threadId = btn.dataset.threadId;
            const section = document.querySelector(`.reply-section[data-thread-id="${threadId}"]`);
            const input = section?.querySelector('.reply-input');
            if (input && input.value.trim()) {
              await this.handleReply(threadId, input.value.trim());
              input.value = '';
              section.classList.remove('open');
            }
          });
        });

        // Reply input enter key
        document.querySelectorAll('.reply-input').forEach(input => {
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const section = input.closest('.reply-section');
              const threadId = section?.dataset.threadId;
              if (threadId) {
                const btn = document.querySelector(`.reply-submit[data-thread-id="${threadId}"]`);
                if (btn) btn.click();
              }
            }
          });
        });

        // Share buttons
        document.querySelectorAll('.share-btn').forEach(btn => {
          btn.replaceWith(btn.cloneNode(true));
        });
        
        document.querySelectorAll('.share-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const threadId = btn.dataset.threadId;
            const shareData = {
              title: 'Threads Post',
              text: 'Check out this thread!',
              url: window.location.origin + window.location.pathname + '?thread=' + threadId
            };
            
            if (navigator.share) {
              navigator.share(shareData).catch(() => {});
            } else if (navigator.clipboard) {
              navigator.clipboard.writeText(shareData.url)
                .then(() => Toast.success('Link copied!'))
                .catch(() => Toast.warning('Could not copy link'));
            } else {
              // Fallback
              const textarea = document.createElement('textarea');
              textarea.value = shareData.url;
              document.body.appendChild(textarea);
              textarea.select();
              try {
                document.execCommand('copy');
                Toast.success('Link copied!');
              } catch (err) {
                Toast.warning('Could not copy link');
              }
              document.body.removeChild(textarea);
            }
          });
        });
      },

      async handleLike(threadId, btn) {
        try {
          btn.disabled = true;
          const result = await FirebaseManager.toggleLike(threadId);
          const countEl = btn.querySelector('.like-count');
          if (countEl) countEl.textContent = result.likes;
          btn.classList.toggle('liked', result.liked);
          
          // Update the icon
          const icon = btn.querySelector('.icon i');
          if (icon) {
            icon.className = result.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
          }
          
          Toast.info(result.liked ? '❤️ Liked!' : '💔 Unliked');
        } catch (e) {
          console.error('Like error:', e);
          Toast.error('Failed to like');
        } finally {
          btn.disabled = false;
        }
      },

      async handleReply(threadId, content) {
        try {
          if (content.length > CONFIG.maxReplyLength) {
            Toast.warning(`Reply too long (max ${CONFIG.maxReplyLength} chars)`);
            return;
          }
          
          const replyData = {
            content: content.trim(),
            username: 'User_' + Utils.generateId().substr(0, 4),
            userId: Utils.generateId(),
            timestamp: Date.now()
          };
          
          await FirebaseManager.addReply(threadId, replyData);
          Toast.success('💬 Reply posted!');
        } catch (e) {
          console.error('Reply error:', e);
          Toast.error('Failed to reply');
        }
      }
    };

    // ================================================================
    // 8. APP CONTROLLER
    // ================================================================
    const App = {
      isInitialized: false,

      init() {
        // Prevent double initialization
        if (this.isInitialized) return;
        
        // Step 1: Enforce Android
        if (!enforceAndroid()) return;

        // Step 2: Render UI
        UI.render();

        // Step 3: Init Firebase
        try {
          FirebaseManager.init();
        } catch (e) {
          Toast.error('Failed to connect. Please refresh.');
          return;
        }

        // Step 4: Load initial threads
        this.loadThreads();

        // Step 5: Attach realtime listener
        FirebaseManager.attachRealtime((threads) => {
          State.threads = threads;
          UI.renderThreads(threads);
        });

        // Step 6: Setup compose functionality
        this.setupCompose();

        // Step 7: Setup header buttons
        this.setupHeaderButtons();

        // Step 8: Initial char count
        UI.updateCharCount();

        this.isInitialized = true;
        Toast.success('🚀 Threads ready!');
      },

      setupCompose() {
        const postBtn = UI.elements.postBtn;
        const threadInput = UI.elements.threadInput;
        
        if (threadInput) {
          // Char count update with debounce
          const updateCharCount = Utils.debounce(() => UI.updateCharCount(), 100);
          threadInput.addEventListener('input', updateCharCount);
          
          // Enter key to post (Shift+Enter for new line)
          threadInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              postBtn?.click();
            }
          });
        }

        if (postBtn) {
          postBtn.addEventListener('click', async () => {
            const content = threadInput?.value.trim();
            if (!content || content.length > CONFIG.maxThreadLength) {
              if (content && content.length > CONFIG.maxThreadLength) {
                Toast.warning(`Thread too long (max ${CONFIG.maxThreadLength} chars)`);
              } else {
                Toast.warning('Please write something');
              }
              return;
            }

            const threadData = {
              content: content,
              username: 'AndroidUser_' + Utils.generateId().substr(0, 4),
              handle: 'user_' + Utils.generateId().substr(0, 6),
              userId: Utils.generateId(),
              verified: Math.random() > 0.9,
              timestamp: Date.now()
            };

            try {
              postBtn.disabled = true;
              postBtn.textContent = 'Posting...';
              await FirebaseManager.createThread(threadData);
              if (threadInput) threadInput.value = '';
              UI.updateCharCount();
              Toast.success('🎉 Thread posted!');
            } catch (e) {
              console.error('Post error:', e);
              Toast.error('Failed to post');
            } finally {
              postBtn.disabled = false;
              postBtn.textContent = 'Post';
            }
          });
        }

        // Emoji button
        const emojiBtn = UI.elements.emojiBtn;
        if (emojiBtn) {
          emojiBtn.addEventListener('click', () => {
            const emojis = ['😊', '🔥', '💯', '👏', '🙌', '💪', '✨', '🚀', '🎉', '❤️', '😂', '🥰', '😎', '🤩', '💫'];
            const random = emojis[Math.floor(Math.random() * emojis.length)];
            if (threadInput) {
              const cursor = threadInput.selectionStart || 0;
              const text = threadInput.value;
              threadInput.value = text.slice(0, cursor) + random + text.slice(cursor);
              threadInput.focus();
              UI.updateCharCount();
            }
          });
        }

        // Hashtag button
        const hashtagBtn = UI.elements.hashtagBtn;
        if (hashtagBtn) {
          hashtagBtn.addEventListener('click', () => {
            if (threadInput) {
              const hashtag = prompt('Enter hashtag:', 'threads');
              if (hashtag && hashtag.trim()) {
                const cursor = threadInput.selectionStart || 0;
                const text = threadInput.value;
                const cleanHashtag = hashtag.trim().replace(/\s/g, '');
                threadInput.value = text.slice(0, cursor) + '#' + cleanHashtag + ' ' + text.slice(cursor);
                threadInput.focus();
                UI.updateCharCount();
              }
            }
          });
        }
      },

      setupHeaderButtons() {
        // Refresh button
        const refreshBtn = UI.elements.refreshBtn;
        if (refreshBtn) {
          refreshBtn.addEventListener('click', () => {
            Toast.info('🔄 Refreshing...');
            this.loadThreads();
          });
        }

        // Stats button
        const statsBtn = UI.elements.statsBtn;
        if (statsBtn) {
          statsBtn.addEventListener('click', () => {
            const s = State.stats;
            Toast.info(`📊 ${s.threads} threads · ${s.replies} replies · ${s.likes} likes`);
          });
        }
      },

      async loadThreads() {
        try {
          const threads = await FirebaseManager.getThreads(50);
          State.threads = threads;
          UI.renderThreads(threads);
        } catch (e) {
          console.error('Load threads error:', e);
          Toast.error('Failed to load threads');
        }
      },

      cleanup() {
        FirebaseManager.detachRealtime();
        this.isInitialized = false;
      }
    };

    // ================================================================
    // 9. BOOT
    // ================================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => App.init());
    } else {
      // DOM already loaded, init immediately
      App.init();
    }

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      App.cleanup();
    });

  })();
</script>

</body>
</html>
