<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@zack360 — Log Kerja & Sembang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --muted: #94a3b8;
            --accent: #818cf8;
            --green: #34d399;
            --red: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px;
        }
        .panel {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        h2 { font-size: 1rem; text-align: center; margin-bottom: 10px; color: var(--accent); }
        
        /* Sembang */
        #chat-box { height: 300px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 85%; }
        .msg .name { color: var(--accent); font-weight: 600; font-size: 0.7rem; display: block; margin-bottom: 3px; }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        
        /* Input */
        .row { display: flex; gap: 5px; margin-bottom: 5px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; font-size: 0.85rem; }
        button { padding: 10px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        button:disabled { opacity: 0.5; }
        
        /* Log */
        .summary { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.8rem; text-align: center; }
        .val { font-weight: 600; font-size: 1rem; display: block; }
        .val.g { color: var(--green); }
        .val.r { color: var(--red); }
        
        .chart-wrap { height: 180px; margin-bottom: 10px; position: relative; }
        
        .log-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.8rem; }
        .log-item .top { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .log-item .date { color: var(--accent); font-weight: 600; }
        .log-item .inc { color: var(--green); }
        .log-item .exp { color: var(--red); }
        .log-item .note { color: var(--muted); font-style: italic; margin-top: 5px; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.8rem; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 999; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- SEMBANG -->
    <div class="panel">
        <h2>@ZACK360 CHAT</h2>
        <div id="chat-box"></div>
        <div class="row">
            <input type="text" id="username" placeholder="Nama Anda" maxlength="15">
            <button id="set-name-btn">SET</button>
        </div>
        <div class="row">
            <input type="text" id="msg-input" placeholder="Taip mesej..." maxlength="200">
            <button id="send-btn">HANTAR</button>
        </div>
    </div>

    <!-- LOG KERJA -->
    <div class="panel">
        <h2>LOG KERJA LALAMOVE</h2>
        <div class="row">
            <input type="month" id="month-filter">
        </div>
        
        <div class="summary">
            <div><span class="val g" id="sum-inc">RM0</span><span>Pendapatan</span></div>
            <div><span class="val r" id="sum-exp">RM0</span><span>Perbelanjaan</span></div>
            <div><span class="val" id="sum-bal">RM0</span><span>Baki</span></div>
        </div>

        <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
        <div class="chart-wrap"><canvas id="pieChart"></canvas></div>

        <div class="row">
            <input type="date" id="log-date">
            <input type="number" id="log-trip" placeholder="Trip" min="0" max="100">
        </div>
        <div class="row">
            <input type="number" id="log-inc" placeholder="Pendapatan (RM)" min="0" max="9999" step="0.01">
            <input type="number" id="log-exp" placeholder="Perbelanjaan (RM)" min="0" max="9999" step="0.01">
        </div>
        <input type="text" id="log-note" placeholder="Catatan (pilihan)" maxlength="100" style="margin-bottom:5px;">
        <button id="add-log-btn">TAMBAH LOG</button>

        <div id="log-list" style="margin-top:15px;"></div>
    </div>

    <div id="toast"></div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "zack360-2b303.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "zack360-2b303",
            storageBucket: "zack360-2b303.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue, remove, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('username');
        const setNameBtn = document.getElementById('set-name-btn');
        const toast = document.getElementById('toast');
        
        const monthFilter = document.getElementById('month-filter');
        const logDate = document.getElementById('log-date');
        const logTrip = document.getElementById('log-trip');
        const logInc = document.getElementById('log-inc');
        const logExp = document.getElementById('log-exp');
        const logNote = document.getElementById('log-note');
        const addLogBtn = document.getElementById('add-log-btn');
        const logList = document.getElementById('log-list');
        const sumInc = document.getElementById('sum-inc');
        const sumExp = document.getElementById('sum-exp');
        const sumBal = document.getElementById('sum-bal');

        let currentUser = localStorage.getItem('zack360_user') || '';
        let allLogs = [];
        let lineChart, pieChart;

        // Toast
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // User
        function setUser(name) {
            localStorage.setItem('zack360_user', name);
            currentUser = name;
            userInput.value = name;
            userInput.disabled = true;
            setNameBtn.disabled = true;
        }
        if (currentUser) setUser(currentUser);
        setNameBtn.onclick = () => { if(userInput.value.trim()) setUser(userInput.value.trim()); };

        // Sembang
        const chatQuery = query(ref(db, 'chats'), limitToLast(50));
        onChildAdded(chatQuery, (snap) => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="name">${d.user}</span><span>${d.text || ''}</span>`;
            if (d.imageUrl) div.innerHTML += `<img src="${d.imageUrl}" loading="lazy">`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        sendBtn.onclick = () => {
            const txt = msgInput.value.trim();
            if (!currentUser) return showToast('Set nama dahulu');
            if (!txt) return;
            push(ref(db, 'chats'), { user: currentUser, text: txt, timestamp: serverTimestamp() })
                .catch(() => showToast('Gagal hantar'));
            msgInput.value = '';
        };

        // Log Kerja
        logDate.valueAsDate = new Date();
        const now = new Date();
        monthFilter.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

        function updateUI() {
            const m = monthFilter.value;
            const filtered = allLogs.filter(l => l.date.startsWith(m)).sort((a,b) => a.date.localeCompare(b.date));
            
            let tInc = 0, tExp = 0;
            filtered.forEach(l => { tInc += l.income; tExp += l.expense; });
            sumInc.textContent = `RM${tInc.toFixed(2)}`;
            sumExp.textContent = `RM${tExp.toFixed(2)}`;
            sumBal.textContent = `RM${(tInc-tExp).toFixed(2)}`;
            sumBal.className = `val ${tInc-tExp >= 0 ? 'g' : 'r'}`;

            logList.innerHTML = '';
            [...filtered].reverse().forEach(l => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `
                    <div class="top"><span class="date">${l.date}</span><span class="inc">+RM${l.income.toFixed(2)}</span></div>
                    <div class="top"><span>${l.trips} trip</span><span class="exp">-RM${l.expense.toFixed(2)}</span></div>
                    ${l.note ? `<div class="note">"${l.note}"</div>` : ''}
                `;
                if (l.user === currentUser) {
                    const btn = document.createElement('button');
                    btn.textContent = 'PADAM';
                    btn.style.cssText = 'margin-top:5px; padding:4px 8px; font-size:0.7rem; background:var(--red);';
                    btn.onclick = () => { if(confirm('Padam?')) remove(ref(db, 'logs/'+l.key)).then(()=>showToast('Dipadam')); };
                    div.appendChild(btn);
                }
                logList.appendChild(div);
            });

            // Chart
            const labels = filtered.map(l => l.date.slice(8,10));
            const incData = filtered.map(l => l.income);
            const expData = filtered.map(l => l.expense);

            if (lineChart) lineChart.destroy();
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: { labels, datasets: [
                    { label: 'Masuk', data: incData, borderColor: '#34d399', tension: 0.3 },
                    { label: 'Keluar', data: expData, borderColor: '#f87171', tension: 0.3 }
                ]},
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#fff', font: {size:10} } } }, scales: { x: { ticks:{color:'#aaa'} }, y: { ticks:{color:'#aaa'} } } }
            });

            if (pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: { labels: ['Bersih', 'Belanja'], datasets: [{ data: [tInc-tExp, tExp], backgroundColor: ['#818cf8', '#f87171'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: {size:10} } } } }
            });
        }

        addLogBtn.onclick = () => {
            if (!currentUser) return showToast('Set nama dahulu');
            const d = logDate.value;
            const t = parseInt(logTrip.value)||0;
            const i = parseFloat(logInc.value)||0;
            const e = parseFloat(logExp.value)||0;
            const n = logNote.value.trim();
            if (!d || (i===0 && e===0 && t===0)) return showToast('Isi data');
            
            push(ref(db, 'logs'), { user: currentUser, date: d, trips: t, income: i, expense: e, note: n, timestamp: serverTimestamp() })
                .then(() => {
                    showToast('Log ditambah');
                    logTrip.value = ''; logInc.value = ''; logExp.value = ''; logNote.value = '';
                })
                .catch(() => showToast('Gagal tambah'));
        };

        onValue(ref(db, 'logs'), (snap) => {
            allLogs = [];
            snap.forEach(child => allLogs.push({ ...child.val(), key: child.key }));
            updateUI();
        });

        monthFilter.onchange = updateUI;
    </script>
</body>
</html>
