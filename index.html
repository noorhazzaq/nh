<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TRON CHAT</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    
    <style>
        /* ===== 1. RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00f0ff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* ===== 2. GRID BACKGROUND ===== */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 4s ease-in-out infinite;
        }
        
        @keyframes gridPulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }
        
        /* ===== 3. SPARKLE PARTICLES ===== */
        .sparkle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(0, 240, 255, 0.8);
            animation: sparkleFloat linear infinite;
        }
        
        @keyframes sparkleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }
        
        /* ===== 4. CHAT LAYOUT ===== */
        .chat-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(5px);
            border-left: 2px solid rgba(0, 240, 255, 0.2);
            border-right: 2px solid rgba(0, 240, 255, 0.2);
        }
        
        /* ===== 5. HEADER ===== */
        .header {
            text-align: center;
            padding: 15px 0 10px;
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            position: relative;
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #00f0ff;
            text-shadow:
                0 0 10px rgba(0, 240, 255, 0.5),
                0 0 20px rgba(0, 240, 255, 0.3),
                0 0 40px rgba(0, 240, 255, 0.1);
            animation: headerGlow 3s ease-in-out infinite;
        }
        
        @keyframes headerGlow {
            0%,
            100% {
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 40px rgba(0, 240, 255, 0.5), 0 0 80px rgba(123, 47, 252, 0.3);
            }
        }
        
        .header .subtitle {
            font-size: 0.7rem;
            color: rgba(0, 240, 255, 0.5);
            letter-spacing: 4px;
            margin-top: 4px;
        }
        
        .online-count {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: #7b2ffc;
            text-shadow: 0 0 10px rgba(123, 47, 252, 0.5);
        }
        
        /* ===== 6. MESSAGES AREA ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 5px;
            margin: 10px 0;
            scroll-behavior: smooth;
        }
        
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: rgba(0, 240, 255, 0.05);
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 2px;
        }
        
        /* ===== 7. MESSAGE BUBBLES ===== */
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 4px;
            border-left: 3px solid #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            animation: messageIn 0.3s ease-out;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
            word-wrap: break-word;
        }
        
        @keyframes messageIn {
            0% {
                opacity: 0;
                transform: translateX(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .message .sender {
            font-size: 0.7rem;
            color: #7b2ffc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(123, 47, 252, 0.3);
        }
        
        .message .text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #c0f0ff;
        }
        
        .message .time {
            font-size: 0.6rem;
            color: rgba(0, 240, 255, 0.3);
            margin-top: 4px;
            text-align: right;
        }
        
        .message.system {
            border-left-color: #7b2ffc;
            background: rgba(123, 47, 252, 0.05);
            text-align: center;
            font-style: italic;
            color: rgba(123, 47, 252, 0.6);
        }
        
        .message.system .text {
            color: rgba(123, 47, 252, 0.6);
        }
        
        /* ===== 8. INPUT AREA ===== */
        .input-area {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 12px 0;
            border-top: 2px solid rgba(0, 240, 255, 0.2);
            position: relative;
        }
        
        .input-area::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, #7b2ffc, transparent);
            animation: inputGlow 2s linear infinite;
            background-size: 200% 100%;
        }
        
        @keyframes inputGlow {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 4px;
            color: #00f0ff;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }
        
        #messageInput:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }
        
        #messageInput::placeholder {
            color: rgba(0, 240, 255, 0.3);
        }
        
        #sendBtn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid #00f0ff;
            border-radius: 4px;
            color: #00f0ff;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        #sendBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.1), transparent);
            transition: left 0.5s;
        }
        
        #sendBtn:hover::before {
            left: 100%;
        }
        
        #sendBtn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        
        #sendBtn:active {
            transform: scale(0.95);
        }
        
        /* ===== 9. BANNED OVERLAY ===== */
        .ban-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            text-align: center;
        }
        
        .ban-overlay h1 {
            font-size: 2rem;
            color: #ff0040;
            text-shadow: 0 0 30px rgba(255, 0, 64, 0.5);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        
        .ban-overlay p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            max-width: 300px;
        }
        
        /* ===== 10. RESPONSIVE ===== */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.3rem;
                letter-spacing: 4px;
            }
            .message .text {
                font-size: 0.85rem;
            }
            #sendBtn {
                padding: 12px 16px;
                font-size: 0.7rem;
            }
            #messageInput {
                font-size: 0.85rem;
                padding: 10px 12px;
            }
        }
        
        @media (min-width: 481px) {
            .chat-container {
                border-left: 2px solid rgba(0, 240, 255, 0.3);
                border-right: 2px solid rgba(0, 240, 255, 0.3);
                box-shadow: 0 0 60px rgba(0, 240, 255, 0.05);
            }
        }
    </style>
</head>
<body>
    
    <!-- BAN OVERLAY (hidden by default) -->
    <div id="banOverlay" class="ban-overlay" style="display:none;">
        <h1>⛔ ACCESS DENIED</h1>
        <p>This terminal is only accessible from Android devices.</p>
    </div>
    
    <!-- GRID BACKGROUND -->
    <div class="grid-bg"></div>
    
    <!-- SPARKLE CONTAINER -->
    <div class="sparkle-container" id="sparkleContainer"></div>
    
    <!-- CHAT UI -->
    <div class="chat-container" id="chatContainer">
        <!-- Header -->
        <div class="header">
            <h1>TRON</h1>
            <div class="subtitle">⚡ GLOBAL NETWORK ⚡</div>
            <div class="online-count" id="onlineCount">● 0</div>
        </div>
        
        <!-- Messages -->
        <div class="messages" id="messages"></div>
        
        <!-- Input -->
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="TRANSMIT MESSAGE..." maxlength="500" />
            <button id="sendBtn">SEND</button>
        </div>
    </div>
    
    <script>
        // ============================================================
        // 1. FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const messagesRef = database.ref('messages');
        const usersRef = database.ref('users');
        
        // ============================================================
        // 2. DEVICE DETECTION - BLOCK NON-ANDROID
        // ============================================================
        function isAndroid() {
            return /android/i.test(navigator.userAgent);
        }
        
        if (!isAndroid()) {
            document.getElementById('banOverlay').style.display = 'flex';
            document.getElementById('chatContainer').style.display = 'none';
            throw new Error('Access denied: Android only');
        }
        
        // ============================================================
        // 3. EMOJI & GIF FILTER
        // ============================================================
        function filterEmojiAndGif(text) {
            // Remove emoji (Unicode emoji ranges)
            const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}\u{2B50}\u{2934}\u{2935}\u{2190}-\u{21FF}]/gu;
            text = text.replace(emojiRegex, '');
            
            // Remove GIF references (case insensitive)
            text = text.replace(/gif/gi, '');
            text = text.replace(/\.gif/gi, '');
            text = text.replace(/\[gif\]/gi, '');
            text = text.replace(/\(gif\)/gi, '');
            
            // Remove extra spaces
            text = text.replace(/\s+/g, ' ').trim();
            
            return text || '[filtered]';
        }
        
        // ============================================================
        // 4. GENERATE USERNAME
        // ============================================================
        function generateUsername() {
            const prefixes = ['USER', 'NODE', 'GRID', 'CORE', 'BYTE', 'ZERO', 'ONE', 'LIGHT', 'DIGI', 'CYBER'];
            const suffixes = ['_X', '_9', '_7', '_Z', '_K', '_V', '_R', '_M', '_Q', '_F'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            const num = String(Math.floor(Math.random() * 100)).padStart(2, '0');
            return prefix + suffix + num;
        }
        
        const username = generateUsername();
        
        // ============================================================
        // 5. SPARKLE GENERATOR
        // ============================================================
        function createSparkles() {
            const container = document.getElementById('sparkleContainer');
            for (let i = 0; i < 25; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.width = (Math.random() * 3 + 1) + 'px';
                sparkle.style.height = sparkle.style.width;
                sparkle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                sparkle.style.animationDelay = (Math.random() * 15) + 's';
                sparkle.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(sparkle);
            }
        }
        createSparkles();
        
        // ============================================================
        // 6. MESSAGE FUNCTIONS
        // ============================================================
        function sendMessage(text) {
            text = text.trim();
            if (!text) return;
            
            // Filter emoji/GIF
            text = filterEmojiAndGif(text);
            if (!text || text === '[filtered]') return;
            
            const message = {
                sender: username,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            
            messagesRef.push(message);
            document.getElementById('messageInput').value = '';
            document.getElementById('messageInput').focus();
        }
        
        function displayMessage(data) {
            const messagesDiv = document.getElementById('messages');
            const msg = data.val();
            const key = data.key;
            
            // Skip if no text
            if (!msg || !msg.text) return;
            
            const div = document.createElement('div');
            div.className = 'message';
            div.dataset.key = key;
            
            // System message detection
            if (msg.sender === 'SYSTEM') {
                div.classList.add('system');
            }
            
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
            
            div.innerHTML = `
                        <div class="sender">${msg.sender || 'UNKNOWN'}</div>
                        <div class="text">${escapeHtml(msg.text)}</div>
                        <div class="time">${time}</div>
                    `;
            
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================================
        // 7. ONLINE COUNT
        // ============================================================
        function updateOnlineCount() {
            usersRef.on('value', function(snapshot) {
                const count = snapshot.numChildren() || 0;
                document.getElementById('onlineCount').textContent = '● ' + count;
            });
        }
        
        // Add/remove user presence
        function setPresence() {
            const userRef = usersRef.child(username);
            userRef.onDisconnect().remove();
            userRef.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        }
        
        // ============================================================
        // 8. REAL-TIME LISTENER
        // ============================================================
        function listenForMessages() {
            // Load last 100 messages
            messagesRef.limitToLast(100).on('child_added', function(data) {
                displayMessage(data);
            });
        }
        
        // ============================================================
        // 9. SEND SYSTEM MESSAGE
        // ============================================================
        function sendSystemMessage(text) {
            const msg = {
                sender: 'SYSTEM',
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            messagesRef.push(msg);
        }
        
        // ============================================================
        // 10. EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Set presence
            setPresence();
            updateOnlineCount();
            
            // Listen for messages
            listenForMessages();
            
            // Send system welcome
            setTimeout(() => {
                sendSystemMessage('⚡ ' + username + ' has entered the Grid');
            }, 500);
            
            // Send button
            document.getElementById('sendBtn').addEventListener('click', function() {
                const input = document.getElementById('messageInput');
                sendMessage(input.value);
            });
            
            // Enter key
            document.getElementById('messageInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage(this.value);
                }
            });
            
            // Auto-focus input
            document.getElementById('messageInput').focus();
        });
        
        // ============================================================
        // 11. CLEANUP ON UNLOAD
        // ============================================================
        window.addEventListener('beforeunload', function() {
            const userRef = usersRef.child(username);
            userRef.remove();
            sendSystemMessage('⚡ ' + username + ' has left the Grid');
        });
        
        console.log('⚡ TRON CHAT INITIALIZED');
        console.log('👤 Username:', username);
        console.log('📱 Device:', navigator.userAgent);
    </script>
</body>
</html>
