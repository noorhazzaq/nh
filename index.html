<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>∀rcana · 36 ends</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0b0d12;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 8px;
    }
    #game {
      background: #151a22;
      max-width: 600px;
      width: 100%;
      border-radius: 36px 36px 28px 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
      padding: 20px 16px 24px;
      color: #e7e9ee;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid #2e3643;
      transition: all 0.1s;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      background: #1f2631;
      padding: 10px 14px;
      border-radius: 60px;
      border: 1px solid #3d4657;
      letter-spacing: 0.3px;
    }
    #stats span {
      background: #2b3342;
      padding: 4px 12px;
      border-radius: 30px;
      margin: 0 3px;
      font-weight: 600;
      color: #bcc9e6;
    }
    #achievement-badge {
      background: #f5c542;
      color: #12161e;
      padding: 4px 14px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid #ffd966;
      box-shadow: 0 0 8px #f5c54255;
      display: inline-block;
    }
    #story-box {
      background: #0f131c;
      border-radius: 28px;
      padding: 20px 18px;
      min-height: 150px;
      border: 1px solid #2f384a;
      box-shadow: inset 0 4px 8px #00000033;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #story-text {
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 400;
      color: #d3dbe8;
      word-break: break-word;
    }
    #role-display {
      font-size: 0.8rem;
      background: #1e2633;
      padding: 6px 14px;
      border-radius: 40px;
      align-self: flex-start;
      border: 1px solid #4d5a70;
      color: #b3c7e6;
    }
    #choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 6px 0 4px;
    }
    .choice-btn {
      background: #1f2735;
      border: 1px solid #3b465c;
      border-radius: 60px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 500;
      color: #dce3f0;
      text-align: left;
      transition: all 0.08s linear;
      width: 100%;
      box-shadow: 0 2px 0 #0b0f16;
      letter-spacing: 0.2px;
    }
    .choice-btn:active {
      background: #2e3a50;
      transform: scale(0.98);
      border-color: #7b8db0;
      box-shadow: 0 1px 0 #0b0f16;
    }
    .choice-btn:disabled {
      opacity: 0.45;
      transform: none;
      pointer-events: none;
    }
    #footer-actions {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .action-btn {
      background: #1e2633;
      border: 1px solid #3f4a60;
      border-radius: 40px;
      padding: 10px 18px;
      color: #c8d4e9;
      font-weight: 600;
      font-size: 0.8rem;
      flex: 1 1 auto;
      text-align: center;
      transition: 0.08s linear;
      box-shadow: 0 2px 0 #0b0f16;
      min-width: 80px;
    }
    .action-btn:active {
      background: #2b364b;
      transform: scale(0.96);
      border-color: #6e81a8;
    }
    .action-btn:disabled {
      opacity: 0.3;
      transform: none;
      pointer-events: none;
    }
    #ending-counter {
      background: #0f131c;
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 0.75rem;
      border: 1px solid #3a445a;
      color: #a9bddb;
      text-align: center;
      display: inline-block;
      margin: 0 auto;
    }
    #ban-message {
      display: none;
      background: #1f0f12;
      color: #ffb3b3;
      padding: 30px 16px;
      border-radius: 40px;
      text-align: center;
      border: 1px solid #b34a4a;
      font-weight: 600;
    }
    @media (max-width: 480px) {
      #game { padding: 14px 10px; }
      .choice-btn { padding: 12px 16px; font-size: 0.95rem; }
    }
    @media (min-width: 768px) {
      #game { padding: 28px 24px; }
    }
  </style>
</head>
<body>
<div id="game">
  <div id="header">
    <div id="stats"><span id="hp">❤️ 10</span><span id="endings">🏆 0/36</span></div>
    <div id="achievement-badge">✦ ACHIEVEMENT</div>
  </div>
  <div id="story-box">
    <div id="story-text">The Veil of Aethra · choose your path</div>
    <div id="role-display">⚔️ Wanderer</div>
  </div>
  <div id="choices"></div>
  <div id="footer-actions">
    <button class="action-btn" id="resetBtn">⟲ RESTART</button>
    <button class="action-btn" id="saveBtn">💾 SAVE</button>
    <button class="action-btn" id="loadBtn">📂 LOAD</button>
  </div>
  <div id="ending-counter">⚡ ENDINGS UNLOCKED: <span id="endingCount">0</span> / 36</div>
  <div id="ban-message">⚠️ ANDROID BROWSER ONLY · ACCESS DENIED</div>
</div>
<script>
  (function() {
    if (!/android/i.test(navigator.userAgent)) {
      document.getElementById('game').style.display = 'none';
      document.getElementById('ban-message').style.display = 'block';
      return;
    }
    const DB_URL = 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/save.json';
    let state = {};
    const endingFlags = new Array(36).fill(false);
    let endingCount = 0;
    let achievementUnlocked = false;
    const choicesEl = document.getElementById('choices');
    const storyText = document.getElementById('story-text');
    const roleDisplay = document.getElementById('role-display');
    const hpSpan = document.getElementById('hp');
    const endingSpan = document.getElementById('endings');
    const endingCountSpan = document.getElementById('endingCount');
    const badgeEl = document.getElementById('achievement-badge');
    function updateUI() {
      hpSpan.textContent = '❤️ ' + state.hp;
      const unlocked = endingFlags.filter(Boolean).length;
      endingCount = unlocked;
      endingSpan.textContent = '🏆 ' + unlocked + '/36';
      endingCountSpan.textContent = unlocked;
      roleDisplay.textContent = state.role || '⚔️ Wanderer';
      if (unlocked >= 36) {
        badgeEl.textContent = '✦ GRAND MASTER · ALL ENDINGS';
        badgeEl.style.background = '#ffb347';
      } else if (unlocked >= 18) {
        badgeEl.textContent = '✦ SAGE · ' + unlocked + '/36';
        badgeEl.style.background = '#9f7aea';
      } else if (unlocked >= 6) {
        badgeEl.textContent = '✦ SEEKER · ' + unlocked + '/36';
        badgeEl.style.background = '#63b3ed';
      } else {
        badgeEl.textContent = '✦ ACHIEVEMENT';
        badgeEl.style.background = '#f5c542';
      }
    }
    function applyState(s) {
      state.hp = s.hp || 10;
      state.role = s.role || '⚔️ Wanderer';
      state.step = s.step || 0;
      state.flags = s.flags || {};
      if (s.endings) {
        for (let i = 0; i < 36; i++) {
          if (s.endings[i]) endingFlags[i] = true;
        }
      }
      achievementUnlocked = !!s.achievementUnlocked;
      updateUI();
    }
    function getDefaultState() {
      return {
        hp: 10,
        role: '⚔️ Wanderer',
        step: 0,
        flags: {},
        endings: new Array(36).fill(false),
        achievementUnlocked: false
      };
    }
    function resetGame() {
      const def = getDefaultState();
      state = { hp: def.hp, role: def.role, step: 0, flags: {}, endings: new Array(36).fill(false), achievementUnlocked: false };
      endingFlags.fill(false);
      achievementUnlocked = false;
      renderStep(0);
      updateUI();
    }
    function renderStep(stepId) {
      const node = storyNodes[stepId];
      if (!node) {
        storyText.textContent = 'The path fades into mist… (error)';
        choicesEl.innerHTML = '';
        return;
      }
      storyText.textContent = node.text;
      if (node.role) state.role = node.role;
      if (node.hpDelta) {
        state.hp = Math.min(12, Math.max(1, state.hp + node.hpDelta));
        if (state.hp <= 0) { state.hp = 1; }
      }
      if (node.endingIndex !== undefined && node.endingIndex >= 0 && node.endingIndex < 36) {
        if (!endingFlags[node.endingIndex]) {
          endingFlags[node.endingIndex] = true;
          achievementUnlocked = true;
        }
        if (endingFlags.filter(Boolean).length >= 36) {
          badgeEl.textContent = '✦ GRAND MASTER · ALL ENDINGS';
        }
      }
      if (node.flags) {
        for (let k in node.flags) state.flags[k] = node.flags[k];
      }
      if (node.achievement) achievementUnlocked = true;
      choicesEl.innerHTML = '';
      if (node.choices && node.choices.length) {
        node.choices.forEach((c, idx) => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          let label = c.label;
          if (c.condition && !c.condition(state)) {
            btn.disabled = true;
            label = '🔒 ' + label;
          }
          btn.textContent = label;
          btn.addEventListener('click', function(e) {
            if (btn.disabled) return;
            if (c.next !== undefined) {
              renderStep(c.next);
            } else if (c.endingIndex !== undefined) {
              const endIdx = c.endingIndex;
              if (!endingFlags[endIdx]) {
                endingFlags[endIdx] = true;
                achievementUnlocked = true;
              }
              renderStep('ending_' + endIdx);
            } else {
              renderStep(0);
            }
            updateUI();
          });
          choicesEl.appendChild(btn);
        });
      } else {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = '⟳ Continue';
        btn.addEventListener('click', function() {
          renderStep(0);
          updateUI();
        });
        choicesEl.appendChild(btn);
      }
      updateUI();
      state.step = stepId;
    }
    const storyNodes = {
      0: {
        text: 'You stand at the crossroads of Aethra. Three paths unfurl. Which will you take?',
        role: '⚔️ Wanderer',
        choices: [
          { label: '🌲 Forest of Whispers', next: 1 },
          { label: '🏜️ Sunken Dunes', next: 2 },
          { label: '🌊 Ashen Coast', next: 3 }
        ]
      },
      1: {
        text: 'The forest hums with ancient magic. A spirit offers you a boon: +2 HP, but you lose memory of your past.',
        hpDelta: 2,
        choices: [
          { label: 'Accept the boon', next: 4, flags: { memory: false } },
          { label: 'Refuse and press deeper', next: 5 }
        ]
      },
      2: {
        text: 'Scorching winds cut through the dunes. A ruined city reveals a hidden vault.',
        choices: [
          { label: 'Enter the vault (risk)', next: 6 },
          { label: 'Turn back', next: 0 }
        ]
      },
      3: {
        text: 'The coast is littered with wreckage. A stranded sailor begs for aid.',
        choices: [
          { label: 'Help the sailor', next: 7, flags: { savedSailor: true } },
          { label: 'Loot the wreck', next: 8 }
        ]
      },
      4: {
        text: 'You feel stronger but hollow. The spirit cackles. You are bound to the forest forever.',
        endingIndex: 0,
        choices: []
      },
      5: {
        text: 'You find a hidden grove. An old hermit teaches you the way of the blade.',
        role: '⚔️ Blademaster',
        choices: [
          { label: 'Train with him', next: 9 },
          { label: 'Leave', next: 0 }
        ]
      },
      6: {
        text: 'The vault is a trap! You escape with a cursed artifact. HP -3.',
        hpDelta: -3,
        choices: [
          { label: 'Throw it away', next: 10 },
          { label: 'Keep it', next: 11 }
        ]
      },
      7: {
        text: 'The sailor gives you a compass that points to treasure. But the sea calls you…',
        choices: [
          { label: 'Follow the compass', next: 12 },
          { label: 'Return to shore', next: 0 }
        ]
      },
      8: {
        text: 'You find a cursed crown. It whispers dark secrets. Your mind twists.',
        endingIndex: 1,
        choices: []
      },
      9: {
        text: 'You become a master of the blade. But the hermit reveals his true form: a demon.',
        choices: [
          { label: 'Fight the demon', next: 13 },
          { label: 'Flee', next: 0 }
        ]
      },
      10: {
        text: 'The artifact shatters, releasing a spirit. It grants you a glimpse of all endings.',
        endingIndex: 2,
        choices: []
      },
      11: {
        text: 'The artifact devours your soul. You become a lich.',
        endingIndex: 3,
        choices: []
      },
      12: {
        text: 'The compass leads to a sunken temple. You awaken an ancient god.',
        endingIndex: 4,
        choices: []
      },
      13: {
        text: 'You slay the demon but are mortally wounded. Your legend ends.',
        endingIndex: 5,
        choices: []
      },
    };
    for (let i = 0; i < 36; i++) {
      if (!storyNodes['ending_' + i]) {
        storyNodes['ending_' + i] = {
          text: '✨ ENDING ' + (i+1) + ' · You have reached a unique fate. The threads of Aethra remember.',
          endingIndex: i,
          choices: [{ label: 'Return to the crossroads', next: 0 }]
        };
      }
    }
    storyNodes[0].choices.push({ label: '✨ Seek the hidden ending', next: 14 });
    storyNodes[14] = {
      text: 'You find a mirror that shows all possibilities. To unlock the final ending, you must have seen at least 30 endings.',
      choices: [
        { label: 'Gaze into the mirror', next: 15, condition: (s) => endingFlags.filter(Boolean).length >= 30 },
        { label: 'Walk away', next: 0 }
      ]
    };
    storyNodes[15] = {
      text: 'The mirror shatters. You become the Keeper of All Ends. The universe bows.',
      endingIndex: 35,
      choices: []
    };
    function saveToFirebase() {
      const payload = {
        hp: state.hp,
        role: state.role,
        step: state.step,
        flags: state.flags || {},
        endings: endingFlags,
        achievementUnlocked: achievementUnlocked
      };
      fetch(DB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(r => {
        if (r.ok) alert('💾 Save successful.');
        else alert('⚠️ Save error.');
      }).catch(() => alert('⚠️ Network error.'));
    }
    function loadFromFirebase() {
      fetch(DB_URL)
        .then(r => r.json())
        .then(data => {
          if (data) {
            applyState(data);
            renderStep(data.step || 0);
            alert('📂 Load successful.');
          } else {
            alert('⚠️ No save found.');
          }
        }).catch(() => alert('⚠️ Load error.'));
    }
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('saveBtn').addEventListener('click', saveToFirebase);
    document.getElementById('loadBtn').addEventListener('click', loadFromFirebase);
    resetGame();
    window.addEventListener('load', function() {
      if (/android/i.test(navigator.userAgent)) {
        document.getElementById('game').style.display = 'flex';
        document.getElementById('ban-message').style.display = 'none';
      }
    });
  })();
</script>
</body>
</html>
