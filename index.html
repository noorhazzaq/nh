<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZACK BANK • TRON</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #b400ff;
            --neon-cyan: #00ffd0;
            --neon-pink: #ff00aa;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(10, 14, 30, 0.85);
        }

        html, body {
            height: 100%;
            background: var(--dark-bg);
            color: #e0f0ff;
            font-family: 'Orbitron', 'Segoe UI', monospace;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridPulse 4s infinite alternate;
            pointer-events: none;
        }

        @keyframes gridPulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        body::after {
            content: '';
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-cyan), transparent);
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 60px var(--neon-purple);
            z-index: 9999;
            animation: scanLine 8s linear infinite;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes scanLine {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        .particle-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-cyan), 0 0 12px var(--neon-blue);
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: 0s; width: 4px; height: 4px; }
        .particle:nth-child(2) { left: 25%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 40%; animation-duration: 12s; animation-delay: 4s; width: 5px; height: 5px; background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }
        .particle:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 70%; animation-duration: 16s; animation-delay: 3s; width: 6px; height: 6px; background: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }
        .particle:nth-child(6) { left: 85%; animation-duration: 22s; animation-delay: 5s; }
        .particle:nth-child(7) { left: 50%; animation-duration: 19s; animation-delay: 7s; width: 4px; height: 4px; }
        .particle:nth-child(8) { left: 15%; animation-duration: 15s; animation-delay: 9s; background: var(--neon-cyan); }
        .particle:nth-child(9) { left: 65%; animation-duration: 17s; animation-delay: 11s; width: 5px; height: 5px; }
        .particle:nth-child(10) { left: 35%; animation-duration: 21s; animation-delay: 6s; background: var(--neon-purple); }

        @keyframes floatParticle {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .sparkle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 240, 255, 0.02) 100%);
            animation: sparkleBg 8s infinite alternate;
        }

        @keyframes sparkleBg {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 1.5rem auto;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 240, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 30px rgba(0, 240, 255, 0.05);
            backdrop-filter: blur(12px);
            animation: containerGlow 3s infinite alternate;
        }

        @keyframes containerGlow {
            0% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.03); }
            100% { box-shadow: 0 0 50px rgba(180, 0, 255, 0.25), 0 0 80px rgba(0, 240, 255, 0.1), inset 0 0 40px rgba(0, 240, 255, 0.08); }
        }

        .header {
            text-align: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            animation: titleFlicker 3s infinite;
        }

        @keyframes titleFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 8px;
            color: rgba(0, 240, 255, 0.5);
            margin-top: 0.3rem;
            font-weight: 400;
            text-transform: uppercase;
        }

        .form-group {
            margin: 1.5rem 0;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.8rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(0, 240, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(180, 0, 255, 0.2));
            color: var(--neon-cyan);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(180, 0, 255, 0.3));
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-danger {
            background: rgba(255, 0, 170, 0.15);
            color: var(--neon-pink);
            border-color: var(--neon-pink);
        }

        .btn-danger:hover {
            background: rgba(255, 0, 170, 0.25);
            box-shadow: 0 0 40px rgba(255, 0, 170, 0.3);
        }

        .btn-success {
            background: rgba(0, 255, 208, 0.15);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .btn-success:hover {
            background: rgba(0, 255, 208, 0.25);
            box-shadow: 0 0 40px rgba(0, 255, 208, 0.3);
        }

        .btn-secondary {
            background: rgba(0, 240, 255, 0.05);
            color: rgba(0, 240, 255, 0.6);
            border-color: rgba(0, 240, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(0, 240, 255, 0.1);
        }

        .balance-display {
            margin: 1.5rem 0;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .balance-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 240, 255, 0.05), transparent, rgba(180, 0, 255, 0.05), transparent);
            animation: rotateBg 10s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .balance-label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.6);
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .balance-amount {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            position: relative;
            z-index: 1;
            animation: balancePulse 2s infinite alternate;
        }

        @keyframes balancePulse {
            0% { text-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
            100% { text-shadow: 0 0 50px rgba(0, 240, 255, 0.6), 0 0 80px rgba(180, 0, 255, 0.3); }
        }

        .balance-currency {
            font-size: 1.2rem;
            color: var(--neon-purple);
            text-shadow: 0 0 20px var(--neon-purple);
        }

        .panel {
            margin: 1.5rem 0;
        }

        .panel .input-group {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .panel .input-group input {
            flex: 2;
            min-width: 120px;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            outline: none;
            transition: all 0.3s;
        }

        .panel .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .panel .input-group input::placeholder {
            color: rgba(0, 240, 255, 0.3);
            font-size: 0.6rem;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 80px;
            padding: 0.8rem;
            font-size: 0.65rem;
        }

        .log-section {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 240, 255, 0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .log-header span {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
        }

        .log-header .log-count {
            color: var(--neon-purple);
            text-shadow: 0 0 10px var(--neon-purple);
        }

        .log-container {
            max-height: 150px;
            overflow-y: auto;
            padding-right: 0.3rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
        }

        .log-container::-webkit-scrollbar {
            width: 4px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .log-item {
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.3rem;
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--neon-cyan);
            border-radius: 4px;
            font-size: 0.65rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: logIn 0.3s ease-out;
        }

        @keyframes logIn {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .log-item .log-amount {
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .log-item .log-amount.negative {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 0, 170, 0.2);
        }

        .log-item .log-time {
            font-size: 0.5rem;
            color: rgba(0, 240, 255, 0.3);
            letter-spacing: 1px;
        }

        .log-item .log-type {
            font-size: 0.5rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .log-item .log-type.transfer {
            background: rgba(180, 0, 255, 0.1);
            color: var(--neon-purple);
            border-color: rgba(180, 0, 255, 0.2);
        }

        .log-item .log-type.receive {
            background: rgba(0, 255, 208, 0.1);
            color: var(--neon-cyan);
            border-color: rgba(0, 255, 208, 0.2);
        }

        .empty-log {
            text-align: center;
            padding: 1.5rem;
            color: rgba(0, 240, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 4px;
        }

        .status-bar {
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(0, 240, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.25);
            letter-spacing: 2px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: dotBlink 1.5s infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .hidden {
            display: none !important;
        }

        .username-display {
            text-align: center;
            padding: 0.5rem;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            margin-bottom: 1rem;
        }

        .username-display span {
            color: var(--neon-purple);
            text-shadow: 0 0 20px var(--neon-purple);
        }

        .error-msg {
            color: var(--neon-pink);
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.5rem;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .chat-section {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 240, 255, 0.1);
        }

        .chat-header {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .chat-container {
            max-height: 120px;
            overflow-y: auto;
            padding-right: 0.3rem;
            margin-bottom: 0.6rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-purple) transparent;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-purple);
        }

        .chat-message {
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.3rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: logIn 0.3s ease-out;
            border-left: 2px solid var(--neon-purple);
        }

        .chat-message .chat-sender {
            color: var(--neon-cyan);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .chat-message .chat-text {
            color: #e0f0ff;
            flex: 1;
            margin: 0 0.5rem;
        }

        .chat-message .chat-time {
            font-size: 0.45rem;
            color: rgba(0, 240, 255, 0.2);
        }

        .chat-input-group {
            display: flex;
            gap: 0.6rem;
        }

        .chat-input-group input {
            flex: 1;
            padding: 0.6rem 0.8rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(180, 0, 255, 0.25);
            border-radius: 10px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(180, 0, 255, 0.2);
        }

        .chat-input-group input::placeholder {
            color: rgba(0, 240, 255, 0.2);
            font-size: 0.55rem;
            letter-spacing: 1px;
        }

        .chat-input-group .btn {
            flex: 0 0 auto;
            width: auto;
            padding: 0.6rem 1.2rem;
            font-size: 0.55rem;
            background: rgba(180, 0, 255, 0.15);
            color: var(--neon-purple);
            border-color: var(--neon-purple);
        }

        .chat-input-group .btn:hover {
            background: rgba(180, 0, 255, 0.25);
            box-shadow: 0 0 30px rgba(180, 0, 255, 0.3);
        }

        @media (max-width: 600px) {
            .container { margin: 0.8rem; padding: 1rem; }
            .header h1 { font-size: 1.8rem; letter-spacing: 3px; }
            .balance-amount { font-size: 2.4rem; }
            .btn-group .btn { font-size: 0.55rem; padding: 0.6rem; }
            .panel .input-group input { font-size: 0.7rem; }
        }

        @media (max-width: 400px) {
            .balance-amount { font-size: 1.8rem; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; }
            .chat-input-group { flex-direction: column; }
            .chat-input-group .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="particle-field">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="sparkle-overlay"></div>

    <!-- ===== LOGIN PAGE ===== -->
    <div class="container" id="loginPage">
        <div class="header">
            <h1>Zack Bank</h1>
            <div class="subtitle">◈ cyber finance ◈</div>
        </div>
        <div class="form-group">
            <input type="text" id="loginUsername" placeholder="USERNAME" />
            <input type="password" id="loginPassword" placeholder="PASSWORD" />
            <button class="btn" onclick="login()">⚡ SIGN IN</button>
            <button class="btn btn-secondary" onclick="showRegister()" style="margin-top:0.5rem;">⟡ CREATE ACCOUNT</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- ===== REGISTER PAGE ===== -->
    <div class="container hidden" id="registerPage">
        <div class="header">
            <h1>Zack Bank</h1>
            <div class="subtitle">◈ create account ◈</div>
        </div>
        <div class="form-group">
            <input type="text" id="regUsername" placeholder="USERNAME" />
            <input type="password" id="regPassword" placeholder="PASSWORD" />
            <input type="password" id="regConfirm" placeholder="CONFIRM PASSWORD" />
            <button class="btn" onclick="register()">⟡ CREATE</button>
            <button class="btn btn-secondary" onclick="showLogin()" style="margin-top:0.5rem;">⬅ BACK</button>
            <div id="regError" class="error-msg"></div>
        </div>
    </div>

    <!-- ===== BANK PAGE ===== -->
    <div class="container hidden" id="bankPage">
        <div class="header">
            <h1>Zack Bank</h1>
            <div class="subtitle">◈ cyber finance ◈</div>
        </div>
        <div class="username-display">
            WELCOME, <span id="displayUsername">USER</span>
        </div>

        <div class="balance-display">
            <div class="balance-label">⟡ available balance ⟡</div>
            <div class="balance-amount" id="balanceDisplay">
                0.00 <span class="balance-currency">ZACK</span>
            </div>
        </div>

        <div class="panel">
            <div class="input-group">
                <input type="number" id="amountInput" placeholder="AMOUNT" step="0.01" min="0.01" />
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="deposit()">⚡ DEPOSIT</button>
                <button class="btn" onclick="withdraw()">⬡ WITHDRAW</button>
            </div>
        </div>

        <div class="panel">
            <div class="input-group">
                <input type="text" id="transferUsername" placeholder="TO USERNAME" />
                <input type="number" id="transferAmount" placeholder="AMOUNT" step="0.01" min="0.01" />
            </div>
            <button class="btn" onclick="transfer()" style="background:rgba(180,0,255,0.15);color:var(--neon-purple);border-color:var(--neon-purple);">
                ⟐ TRANSFER
            </button>
        </div>

        <div class="log-section">
            <div class="log-header">
                <span>⟡ transaction log</span>
                <span class="log-count" id="logCount">0 entries</span>
            </div>
            <div class="log-container" id="logContainer">
                <div class="empty-log">⍟ no transactions yet ⍟</div>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">⟡ personal chat</div>
            <div class="chat-container" id="chatContainer">
                <div class="empty-log">⍟ no messages ⍟</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chatInput" placeholder="MESSAGE" />
                <button class="btn" onclick="sendChat()">⏎ SEND</button>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="statusText">online</span>
            </div>
            <button class="btn btn-danger" onclick="logout()" style="width:auto;padding:0.4rem 1rem;font-size:0.55rem;min-width:auto;">
                ⬅ EXIT
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const database = firebase.database();
        const usersRef = database.ref('/users');
        const chatsRef = database.ref('/chats');

        let currentUser = null;
        let balance = 0;
        let transactions = [];
        let chatMessages = [];

        function showLogin() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('bankPage').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
            document.getElementById('bankPage').classList.add('hidden');
        }

        function showBank() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('bankPage').classList.remove('hidden');
        }

        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const errorEl = document.getElementById('regError');

            if (!username || !password || !confirm) {
                errorEl.textContent = 'All fields required';
                return;
            }
            if (password.length < 4) {
                errorEl.textContent = 'Password must be at least 4 characters';
                return;
            }
            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                return;
            }

            usersRef.child(username).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    errorEl.textContent = 'Username already taken';
                    return;
                }
                usersRef.child(username).set({
                    password: password,
                    balance: 1000,
                    transactions: [{
                        type: 'deposit',
                        amount: 1000,
                        timestamp: Date.now()
                    }]
                }).then(() => {
                    errorEl.textContent = '';
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regConfirm').value = '';
                    showLogin();
                    document.getElementById('loginError').textContent = 'Account created! Sign in.';
                }).catch(err => {
                    errorEl.textContent = 'Error: ' + err.message;
                });
            });
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = 'Enter username and password';
                return;
            }

            usersRef.child(username).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    errorEl.textContent = 'User not found';
                    return;
                }
                const data = snapshot.val();
                if (data.password !== password) {
                    errorEl.textContent = 'Wrong password';
                    return;
                }
                errorEl.textContent = '';
                currentUser = username;
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('displayUsername').textContent = username.toUpperCase();
                loadUserData();
                showBank();
            });
        }

        function logout() {
            currentUser = null;
            balance = 0;
            transactions = [];
            chatMessages = [];
            showLogin();
            document.getElementById('loginError').textContent = '';
        }

        function loadUserData() {
            if (!currentUser) return;
            usersRef.child(currentUser).on('value', snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    balance = data.balance || 0;
                    transactions = data.transactions || [];
                    renderBank();
                }
            });
            loadChat();
        }

        function loadChat() {
            chatsRef.child(currentUser).on('value', snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    chatMessages = data.messages || [];
                    renderChat();
                } else {
                    chatMessages = [];
                    renderChat();
                }
            });
        }

        function renderBank() {
            const balanceEl = document.getElementById('balanceDisplay');
            balanceEl.innerHTML = `${balance.toFixed(2)} <span class="balance-currency">ZACK</span>`;

            const logContainer = document.getElementById('logContainer');
            const logCountEl = document.getElementById('logCount');

            if (transactions.length === 0) {
                logContainer.innerHTML = '<div class="empty-log">⍟ no transactions yet ⍟</div>';
                logCountEl.textContent = '0 entries';
                return;
            }

            let html = '';
            const display = transactions.slice(0, 20);
            display.forEach(tx => {
                const isNegative = tx.type === 'withdraw' || tx.type === 'transfer';
                const cls = isNegative ? 'log-amount negative' : 'log-amount';
                let typeCls = 'log-type';
                let typeLabel = tx.type.toUpperCase();
                if (tx.type === 'transfer') {
                    typeCls += ' transfer';
                    typeLabel = 'SENT';
                } else if (tx.type === 'receive') {
                    typeCls += ' receive';
                    typeLabel = 'RECEIVED';
                }
                const sign = (tx.type === 'withdraw' || tx.type === 'transfer') ? '-' : '+';
                const amountDisplay = tx.type === 'transfer' || tx.type === 'receive' ? 
                    tx.amount.toFixed(2) : tx.amount.toFixed(2);
                const time = new Date(tx.timestamp).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                html += `
                    <div class="log-item">
                        <span class="${typeCls}">${typeLabel}</span>
                        <span class="${cls}">${sign}$${amountDisplay}</span>
                        <span class="log-time">${time}</span>
                    </div>
                `;
            });
            logContainer.innerHTML = html;
            logCountEl.textContent = `${transactions.length} entries`;
        }

        function renderChat() {
            const container = document.getElementById('chatContainer');
            if (chatMessages.length === 0) {
                container.innerHTML = '<div class="empty-log">⍟ no messages ⍟</div>';
                return;
            }
            let html = '';
            const display = chatMessages.slice(-20);
            display.forEach(msg => {
                const time = new Date(msg.timestamp).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="chat-message">
                        <span class="chat-sender">${msg.sender.toUpperCase()}</span>
                        <span class="chat-text">${msg.text}</span>
                        <span class="chat-time">${time}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function deposit() {
            const val = parseFloat(document.getElementById('amountInput').value);
            if (!val || val <= 0) {
                setStatus('invalid amount', true);
                return;
            }
            balance += val;
            transactions.unshift({ type: 'deposit', amount: val, timestamp: Date.now() });
            saveUserData();
            document.getElementById('amountInput').value = '';
            setStatus(`+ $${val.toFixed(2)} deposited`);
        }

        function withdraw() {
            const val = parseFloat(document.getElementById('amountInput').value);
            if (!val || val <= 0) {
                setStatus('invalid amount', true);
                return;
            }
            if (val > balance) {
                setStatus('insufficient funds', true);
                return;
            }
            balance -= val;
            transactions.unshift({ type: 'withdraw', amount: val, timestamp: Date.now() });
            saveUserData();
            document.getElementById('amountInput').value = '';
            setStatus(`- $${val.toFixed(2)} withdrawn`);
        }

        function transfer() {
            const toUser = document.getElementById('transferUsername').value.trim();
            const val = parseFloat(document.getElementById('transferAmount').value);
            if (!toUser) {
                setStatus('enter recipient username', true);
                return;
            }
            if (!val || val <= 0) {
                setStatus('invalid amount', true);
                return;
            }
            if (val > balance) {
                setStatus('insufficient funds', true);
                return;
            }
            if (toUser === currentUser) {
                setStatus('cannot transfer to self', true);
                return;
            }

            usersRef.child(toUser).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    setStatus('recipient not found', true);
                    return;
                }
                const recipientData = snapshot.val();
                const newRecipientBalance = (recipientData.balance || 0) + val;
                const recipientTxs = recipientData.transactions || [];
                recipientTxs.unshift({ type: 'receive', amount: val, from: currentUser, timestamp: Date.now() });

                balance -= val;
                transactions.unshift({ type: 'transfer', amount: val, to: toUser, timestamp: Date.now() });

                const updates = {};
                updates[`/users/${currentUser}/balance`] = balance;
                updates[`/users/${currentUser}/transactions`] = transactions;
                updates[`/users/${toUser}/balance`] = newRecipientBalance;
                updates[`/users/${toUser}/transactions`] = recipientTxs;

                database.ref().update(updates).then(() => {
                    document.getElementById('transferUsername').value = '';
                    document.getElementById('transferAmount').value = '';
                    setStatus(`⟐ $${val.toFixed(2)} sent to ${toUser}`);
                    renderBank();
                }).catch(err => {
                    setStatus('transfer failed: ' + err.message, true);
                });
            });
        }

        function sendChat() {
            const text = document.getElementById('chatInput').value.trim();
            if (!text) return;
            if (!currentUser) return;

            const msg = {
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            };

            chatMessages.push(msg);
            chatsRef.child(currentUser).set({ messages: chatMessages }).then(() => {
                document.getElementById('chatInput').value = '';
                renderChat();
            }).catch(err => {
                setStatus('chat error: ' + err.message, true);
            });
        }

        function saveUserData() {
            usersRef.child(currentUser).update({
                balance: balance,
                transactions: transactions
            }).catch(err => {
                setStatus('save error: ' + err.message, true);
            });
        }

        function setStatus(msg, isError = false) {
            const el = document.getElementById('statusText');
            el.textContent = msg;
            el.style.color = isError ? '#ff00aa' : 'rgba(0,240,255,0.5)';
            if (!isError) {
                setTimeout(() => {
                    el.textContent = 'online';
                    el.style.color = 'rgba(0,240,255,0.5)';
                }, 3000);
            }
        }

        document.getElementById('amountInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') deposit();
        });

        document.getElementById('transferAmount').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') transfer();
        });

        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        document.getElementById('loginPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        document.getElementById('regConfirm').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') register();
        });

        showLogin();
    </script>
</body>
</html>
