<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZACK360 · Cyber-Neo</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ----- reset & base ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c18;
      color: #f0f4ff;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.4); border-radius: 20px; }

    /* ----- glass & gradients ----- */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --glass-blur: 18px;
      --primary: #a78bfa;
      --primary-glow: rgba(167, 139, 250, 0.25);
      --secondary: #f472b6;
      --grad-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --grad-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --text-main: #f0f4ff;
      --text-muted: #8b94a9;
      --bg-deep: #080c18;
      --bg-card: rgba(12, 18, 34, 0.7);
    }

    /* ----- particle canvas (background) ----- */
    #particleCanvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    /* ----- screens ----- */
    .screen { display: none; flex-direction: column; height: 100dvh; width: 100%; position: relative; z-index: 2; }
    .screen.active { display: flex; }

    /* ----- AUTH (splash) ----- */
    .auth-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; z-index: 5;
    }
    .auth-card {
      width: 100%; max-width: 400px; padding: 36px 28px 32px;
      background: var(--bg-card); backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: var(--glass-shadow), 0 0 40px rgba(167, 139, 250, 0.08);
      text-align: center;
      animation: floatUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-logo {
      font-size: 2.6rem; font-weight: 800; letter-spacing: -1px;
      background: var(--grad-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px; display: inline-block;
    }
    .auth-sub {
      color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; letter-spacing: 0.5px;
    }
    .auth-card .input-group {
      position: relative; margin-bottom: 18px; text-align: left;
    }
    .auth-card .input-group i {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 1rem;
    }
    .auth-card .input-group input {
      width: 100%; padding: 14px 14px 14px 48px;
      background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.06);
      border-radius: 30px; color: white; font-size: 0.95rem;
      transition: 0.3s; outline: none; font-weight: 500;
    }
    .auth-card .input-group input:focus {
      border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .auth-card .input-group input::placeholder { color: #4a5268; font-weight: 400; }

    .btn-neon {
      width: 100%; padding: 15px; border: none; border-radius: 40px;
      background: var(--grad-1); color: white; font-weight: 700; font-size: 1rem;
      letter-spacing: 0.5px; cursor: pointer; transition: 0.25s;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
      margin-top: 8px;
    }
    .btn-neon:active { transform: scale(0.97); opacity: 0.8; }
    .btn-neon.outline {
      background: transparent; border: 2px solid var(--primary); color: var(--primary);
      box-shadow: none; margin-top: 10px;
    }
    .auth-toggle {
      background: none; border: none; color: var(--text-muted); font-size: 0.85rem;
      margin-top: 16px; cursor: pointer; transition: 0.2s;
    }
    .auth-toggle:hover { color: var(--primary); }

    /* ----- MAIN APP ----- */
    .app-container {
      display: flex; flex: 1; overflow: hidden; position: relative; z-index: 3;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px; background: var(--bg-card); backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-right: 1px solid var(--glass-border); display: flex; flex-direction: column;
      flex-shrink: 0; padding: 20px 14px; overflow-y: auto;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-top {
      display: flex; align-items: center; gap: 10px; margin-bottom: 28px; padding-left: 6px;
    }
    .sidebar-top .logo-mini {
      font-weight: 800; font-size: 1.3rem; background: var(--grad-1); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-top .badge {
      font-size: 0.6rem; background: var(--primary-glow); color: var(--primary);
      padding: 2px 10px; border-radius: 30px; font-weight: 600; letter-spacing: 0.3px;
      -webkit-text-fill-color: var(--primary);
    }

    .user-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.03); padding: 12px 14px; border-radius: 24px;
      border: 1px solid var(--glass-border); margin-bottom: 28px;
    }
    .user-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--grad-2); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.2rem; color: #fff; box-shadow: 0 0 20px rgba(245, 87, 108, 0.25);
      flex-shrink: 0;
    }
    .user-info { flex: 1; }
    .user-info .name { font-weight: 600; font-size: 0.95rem; }
    .user-info .status { font-size: 0.7rem; color: #10b981; display: flex; align-items: center; gap: 5px; }
    .user-info .status i { font-size: 0.5rem; }

    .section-label {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-muted); margin: 20px 0 10px 4px; font-weight: 600;
    }
    .channel-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-radius: 16px; cursor: pointer; transition: 0.2s; font-weight: 500;
      color: var(--text-muted); position: relative;
    }
    .channel-item:hover { background: rgba(255,255,255,0.04); color: white; }
    .channel-item.active {
      background: rgba(167, 139, 250, 0.12); color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.2);
    }
    .channel-item i { width: 20px; font-size: 0.9rem; }
    .channel-item .badge-count {
      margin-left: auto; background: rgba(255,255,255,0.06); padding: 1px 10px;
      border-radius: 30px; font-size: 0.7rem; color: var(--text-muted);
    }
    .channel-item.active .badge-count { background: rgba(167, 139, 250, 0.15); color: var(--primary); }

    .sidebar-actions {
      margin-top: auto; padding-top: 20px; border-top: 1px solid var(--glass-border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .sidebar-actions .action-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-radius: 16px; cursor: pointer; transition: 0.2s; color: var(--text-muted);
      font-size: 0.9rem;
    }
    .sidebar-actions .action-item:hover { background: rgba(255,255,255,0.04); color: white; }
    .sidebar-actions .action-item.danger { color: #f87171; }
    .sidebar-actions .action-item.danger:hover { background: rgba(248, 113, 113, 0.08); }

    /* MAIN CHAT AREA */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      background: rgba(8, 12, 24, 0.6);
      position: relative;
    }
    .chat-header {
      padding: 16px 24px; display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(8px);
      background: rgba(8, 12, 24, 0.4);
      flex-shrink: 0;
    }
    .chat-header .hamburger { display: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); }
    .chat-header .channel-name { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .chat-header .channel-name i { color: var(--primary); }
    .chat-header .header-actions { margin-left: auto; display: flex; gap: 12px; color: var(--text-muted); font-size: 1.1rem; }
    .chat-header .header-actions i { cursor: pointer; transition: 0.2s; }
    .chat-header .header-actions i:hover { color: white; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px 20px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg-row {
      display: flex; gap: 10px; align-items: flex-end; animation: fadeSlide 0.3s ease;
    }
    .msg-row.me { justify-content: flex-end; }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: var(--grad-2); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.7rem; color: white; cursor: pointer;
      box-shadow: 0 0 12px rgba(245, 87, 108, 0.15);
    }
    .msg-bubble {
      max-width: 78%; padding: 10px 16px; border-radius: 20px;
      background: var(--bg-card); backdrop-filter: blur(4px);
      border: 1px solid var(--glass-border); word-break: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .msg-row.me .msg-bubble {
      background: var(--grad-1); border-color: transparent;
      border-bottom-right-radius: 4px; color: white;
    }
    .msg-row:not(.me) .msg-bubble { border-bottom-left-radius: 4px; }
    .msg-user {
      font-size: 0.7rem; font-weight: 700; color: var(--primary);
      margin-bottom: 2px; display: flex; align-items: center; gap: 6px;
    }
    .msg-row.me .msg-user { color: rgba(255,255,255,0.7); }
    .msg-text { font-size: 0.9rem; line-height: 1.4; }
    .msg-time {
      font-size: 0.55rem; color: var(--text-muted); margin-top: 4px; text-align: right;
    }
    .msg-row.me .msg-time { color: rgba(255,255,255,0.5); }
    .msg-img { max-width: 100%; max-height: 160px; border-radius: 12px; margin-top: 6px; cursor: pointer; border: 1px solid var(--glass-border); }
    .msg-audio { width: 100%; height: 32px; margin-top: 4px; border-radius: 30px; }

    .typing-indicator {
      padding: 4px 16px 8px; font-size: 0.75rem; color: var(--text-muted);
      min-height: 24px; font-style: italic;
    }
    .typing-indicator i { color: var(--primary); margin-right: 6px; }

    /* INPUT DOCK */
    .input-dock {
      padding: 10px 16px 14px; background: var(--bg-card); backdrop-filter: blur(12px);
      border-top: 1px solid var(--glass-border); display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .input-dock .dock-icon {
      font-size: 1.2rem; color: var(--text-muted); cursor: pointer; transition: 0.2s;
      padding: 6px; border-radius: 30px;
    }
    .input-dock .dock-icon:hover { color: white; background: rgba(255,255,255,0.04); }
    .input-dock input {
      flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      border-radius: 40px; padding: 12px 18px; color: white; font-size: 0.9rem;
      outline: none; transition: 0.3s; font-weight: 500;
    }
    .input-dock input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
    .input-dock input::placeholder { color: #4a5268; }
    .input-dock .send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--grad-1); color: white; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
      flex-shrink: 0;
    }
    .input-dock .send-btn:active { transform: scale(0.92); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--bg-card); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 32px; padding: 32px 28px;
      max-width: 400px; width: 100%; box-shadow: var(--glass-shadow);
      animation: floatUp 0.4s ease;
    }
    .modal-card h3 { font-size: 1.3rem; margin-bottom: 8px; }
    .modal-card .modal-close { float: right; cursor: pointer; color: var(--text-muted); }

    /* RESPONSIVE */
    @media (max-width: 820px) {
      .sidebar { position: fixed; left: 0; top: 0; height: 100%; z-index: 50;
        transform: translateX(-110%); width: 280px; border-radius: 0 20px 20px 0;
        box-shadow: 8px 0 40px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .chat-header .hamburger { display: block; }
      .auth-card { padding: 28px 20px; }
    }
    @media (max-width: 480px) {
      .msg-bubble { max-width: 88%; }
      .input-dock { padding: 8px 10px 12px; gap: 6px; }
      .input-dock input { padding: 10px 14px; font-size: 0.85rem; }
    }

    /* scrollable sidebar */
    .sidebar-scroll { flex: 1; overflow-y: auto; padding-right: 4px; }
  </style>
</head>
<body>

<!-- particle background -->
<canvas id="particleCanvas"></canvas>

<!-- ========== AUTH SCREEN ========== -->
<div id="authScreen" class="screen active">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">✦ ZACK360</div>
      <div class="auth-sub">next‑gen chat · cyber‑neo</div>
      <form id="authForm" autocomplete="off">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Username" maxlength="15" required />
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn-neon" id="authBtn">⚡ LOGIN</button>
        <button type="button" class="btn-neon outline" id="toggleAuth">✨ Create account</button>
        <button type="button" class="auth-toggle" id="toggleMode">Need an account? Register</button>
      </form>
    </div>
  </div>
</div>

<!-- ========== APP SCREEN ========== -->
<div id="appScreen" class="screen">
  <div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <span class="logo-mini">✦ ZACK</span>
        <span class="badge">v3</span>
      </div>
      <div class="user-card">
        <div class="user-avatar" id="sideAvatar">U</div>
        <div class="user-info">
          <div class="name" id="sideUsername">user</div>
          <div class="status"><i class="fas fa-circle"></i> Online</div>
        </div>
      </div>
      <div class="sidebar-scroll">
        <div class="section-label">📡 CHANNELS</div>
        <div id="channelList">
          <div class="channel-item active" data-chan="general"><i class="fas fa-hashtag"></i> general <span class="badge-count">12</span></div>
          <div class="channel-item" data-chan="gaming"><i class="fas fa-gamepad"></i> gaming <span class="badge-count">8</span></div>
          <div class="channel-item" data-chan="media"><i class="fas fa-image"></i> media <span class="badge-count">5</span></div>
        </div>
        <div class="section-label">💬 DIRECT MESSAGES</div>
        <div class="channel-item" id="dmTrigger"><i class="fas fa-envelope"></i> @new DM</div>
        <div class="section-label">🏆 LEADERBOARD</div>
        <div class="channel-item" id="lbTrigger"><i class="fas fa-trophy"></i> Rankings</div>
      </div>
      <div class="sidebar-actions">
        <div class="action-item" id="soundToggle"><i class="fas fa-volume-up"></i> Sound</div>
        <div class="action-item danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area">
      <header class="chat-header">
        <span class="hamburger" id="hamburger"><i class="fas fa-bars"></i></span>
        <div class="channel-name"><i class="fas fa-hashtag"></i> <span id="activeChanLabel">general</span></div>
        <div class="header-actions">
          <i class="fas fa-search"></i>
          <i class="fas fa-ellipsis-v"></i>
        </div>
      </header>

      <div class="chat-messages" id="chatMessages">
        <!-- messages rendered here -->
        <div style="text-align:center;color:var(--text-muted);padding:40px 0;font-size:0.9rem;">
          <i class="fas fa-comment-dots" style="font-size:2rem;opacity:0.2;display:block;margin-bottom:10px;"></i>
          No messages yet — say hello!
        </div>
      </div>

      <div class="typing-indicator" id="typingArea"><i class="fas fa-ellipsis-h"></i> </div>

      <div class="input-dock">
        <i class="dock-icon fas fa-image" id="imgBtn"></i>
        <i class="dock-icon fas fa-microphone" id="audioBtn"></i>
        <i class="dock-icon fas fa-smile" id="gifBtn"></i>
        <input type="text" id="msgInput" placeholder="Type a message..." maxlength="500" />
        <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-right"></i></button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" />
      </div>
    </main>
  </div>
</div>

<!-- ========== MODALS ========== -->
<div class="modal-overlay" id="imgModal"><div class="modal-card" style="background:transparent;border:none;box-shadow:none;padding:0;max-width:90%;"><img id="modalImg" style="width:100%;border-radius:24px;border:1px solid var(--glass-border);" /></div></div>
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <span class="modal-close" id="closeProf"><i class="fas fa-times"></i></span>
    <h3 id="profUser">USER</h3>
    <p style="color:var(--text-muted);font-size:0.9rem;" id="profMsgs">Messages: 0</p>
    <button class="btn-neon" style="margin-top:14px;" id="dmFromProf">💬 Direct Message</button>
    <button class="btn-neon outline" style="margin-top:10px;" id="closeProfBtn">Close</button>
  </div>
</div>

<!-- ========== FIREBASE ========== -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
  }
}
</script>

<script type="module">
// --------------------------------------------------------------
// MODULE IMPORTS
// --------------------------------------------------------------
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, set, get, push, onValue, off, serverTimestamp, onDisconnect, remove, query, limitToLast } from 'firebase/database';

// --------------------------------------------------------------
// FIREBASE CONFIG
// --------------------------------------------------------------
const firebaseConfig = {
  databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --------------------------------------------------------------
// STATE
// --------------------------------------------------------------
let currentUser = null;
let isRegistering = false;
let currentChan = 'general';
let targetDM = null;
let activeMode = 'chat'; // 'chat' | 'dm'
let soundEnabled = true;
let activeChatQuery = null;
let activeTypingRef = null;
let isTyping = false;
let typingTimeout = null;
let selectedProfileUser = null;
let lastMsgTime = 0;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];

// --------------------------------------------------------------
// DOM REFS
// --------------------------------------------------------------
const $ = id => document.getElementById(id);
const authScreen = $('authScreen');
const appScreen = $('appScreen');
const usernameIn = $('username');
const passwordIn = $('password');
const authBtn = $('authBtn');
const toggleAuth = $('toggleAuth');
const toggleMode = $('toggleMode');
const authForm = $('authForm');

const sidebar = $('sidebar');
const hamburger = $('hamburger');
const activeChanLabel = $('activeChanLabel');
const chatMessages = $('chatMessages');
const msgInput = $('msgInput');
const sendBtn = $('sendBtn');
const typingArea = $('typingArea');
const fileInput = $('fileInput');
const imgBtn = $('imgBtn');
const audioBtn = $('audioBtn');
const gifBtn = $('gifBtn');
const soundToggle = $('soundToggle');
const logoutBtn = $('logoutBtn');
const sideAvatar = $('sideAvatar');
const sideUsername = $('sideUsername');
const dmTrigger = $('dmTrigger');
const lbTrigger = $('lbTrigger');
const channelList = $('channelList');

const imgModal = $('imgModal');
const modalImg = $('modalImg');
const profileModal = $('profileModal');
const profUser = $('profUser');
const profMsgs = $('profMsgs');
const dmFromProf = $('dmFromProf');
const closeProf = $('closeProf');
const closeProfBtn = $('closeProfBtn');

// --------------------------------------------------------------
// AUTH
// --------------------------------------------------------------
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str + "_zack360_salt"));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

toggleMode.addEventListener('click', () => {
  isRegistering = !isRegistering;
  authBtn.textContent = isRegistering ? '✨ CREATE ACCOUNT' : '⚡ LOGIN';
  toggleMode.textContent = isRegistering ? 'Have an account? Login' : 'Need an account? Register';
});
toggleAuth.addEventListener('click', () => toggleMode.click());

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = usernameIn.value.trim().toLowerCase();
  const p = passwordIn.value.trim();
  if (!u || !p) return alert('Fill all fields');
  const hashed = await sha256(p);
  const userRef = ref(db, `users/${u}`);
  try {
    const snap = await get(userRef);
    if (isRegistering) {
      if (snap.exists()) return alert('Username taken');
      await set(userRef, { password: hashed, msgCount: 0, joined: serverTimestamp() });
      loginUser(u);
    } else {
      if (!snap.exists() || snap.val().password !== hashed) return alert('Invalid credentials');
      loginUser(u);
    }
  } catch (err) { alert('Network error'); }
});

function loginUser(u) {
  currentUser = u;
  sideAvatar.textContent = u.charAt(0).toUpperCase();
  sideUsername.textContent = u;
  authScreen.classList.remove('active');
  appScreen.classList.add('active');
  setupPresence();
  initChat();
  initTyping();
  initLeaderboard();
}

function setupPresence() {
  const pRef = ref(db, `online/${currentUser}`);
  set(pRef, true);
  onDisconnect(pRef).remove();
}

// --------------------------------------------------------------
// TYPING
// --------------------------------------------------------------
function clearTypingState() {
  if (activeTypingRef) { remove(activeTypingRef); off(ref(db, `typing/${getPath()}`)); }
  isTyping = false; clearTimeout(typingTimeout);
}

function initTyping() {
  clearTypingState();
  const path = getPath();
  activeTypingRef = ref(db, `typing/${path}/${currentUser}`);
  onDisconnect(activeTypingRef).remove();

  msgInput.oninput = () => {
    if (!isTyping) { set(activeTypingRef, true); isTyping = true; }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { remove(activeTypingRef); isTyping = false; }, 1800);
  };

  onValue(ref(db, `typing/${path}`), snap => {
    const data = snap.val() || {};
    const typers = Object.keys(data).filter(k => k !== currentUser);
    typingArea.innerHTML = typers.length ? `<i class="fas fa-ellipsis-h"></i> ${typers.join(', ')} typing...` : `<i class="fas fa-ellipsis-h"></i> `;
  });
}

// --------------------------------------------------------------
// PATH HELPER
// --------------------------------------------------------------
function getPath() {
  if (activeMode === 'dm' && targetDM) {
    const pair = [currentUser, targetDM].sort().join('_');
    return `dms/${pair}`;
  }
  return `channels/${currentChan}`;
}

// --------------------------------------------------------------
// CHAT
// --------------------------------------------------------------
function initChat() {
  if (activeChatQuery) off(activeChatQuery);
  const path = getPath();
  activeChatQuery = query(ref(db, path), limitToLast(50));

  onValue(activeChatQuery, snap => {
    const data = snap.val();
    chatMessages.innerHTML = '';
    if (!data) {
      chatMessages.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 0;font-size:0.9rem;">
        <i class="fas fa-comment-dots" style="font-size:2rem;opacity:0.2;display:block;margin-bottom:10px;"></i>
        No messages yet — say hello!
      </div>`;
      return;
    }
    const keys = Object.keys(data);
    keys.forEach(id => {
      const m = data[id];
      const isMe = m.user === currentUser;
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'me' : ''}`;

      let media = '';
      if (m.image) media += `<img src="${m.image}" class="msg-img" onclick="window.openImg('${m.image}')" />`;
      if (m.audio) media += `<audio src="${m.audio}" controls class="msg-audio"></audio>`;

      const avatarHtml = !isMe ? `<div class="msg-avatar" data-username="${m.user}">${m.user.charAt(0).toUpperCase()}</div>` : '';

      row.innerHTML = `
        ${avatarHtml}
        <div class="msg-bubble">
          <div class="msg-user">${m.user}</div>
          <div class="msg-text">${escapeHtml(m.text || '')}${media}</div>
          <div class="msg-time">${formatTime(m.time)}</div>
        </div>
      `;
      chatMessages.appendChild(row);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

// click on avatar -> profile
chatMessages.addEventListener('click', (e) => {

});

function escapeHtml(str) {
  return str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
}
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// --------------------------------------------------------------
// SEND MESSAGE
// --------------------------------------------------------------
async function sendMessage(extra = {}) {
  const now = Date.now();
  if (now - lastMsgTime < 1200) return alert('Rate limit: wait 1.2s');
  const text = msgInput.value.trim();
  if (!text && !extra.image && !extra.audio) return;
  msgInput.value = '';
  lastMsgTime = Date.now();
  clearTypingState();
  if (soundEnabled) playBeep();
  await push(ref(db, getPath()), { user: currentUser, text, ...extra, time: serverTimestamp() });
  const countRef = ref(db, `users/${currentUser}/msgCount`);
  const snap = await get(countRef);
  await set(countRef, (snap.val() || 0) + 1);
}

sendBtn.addEventListener('click', () => sendMessage());
msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

// image
imgBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const max = 800;
      if (w > max || h > max) {
        if (w > h) { h = Math.round((h * max) / w); w = max; } else { w = Math.round((w * max) / h); h = max; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      sendMessage({ image: dataUrl });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

// audio record
audioBtn.addEventListener('click', async () => {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = ev => sendMessage({ audio: ev.target.result });
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start(250);
      isRecording = true;
      audioBtn.style.color = '#f472b6';
    } catch (e) { alert('Mic permission denied'); }
  } else {
    if (mediaRecorder) mediaRecorder.stop();
    isRecording = false;
    audioBtn.style.color = 'var(--text-muted)';
  }
});

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 540; gain.gain.value = 0.04;
    osc.start(); osc.stop(ctx.currentTime + 0.07);
  } catch(e) {}
}

function renderLeaderboard() {
  const usersRef = ref(db, 'users');
  if (lbListener) off(usersRef);
  lbListener = onValue(usersRef, snap => {
    const data = snap.val();
    if (!data) return;
    const users = Object.keys(data).map(k => ({ name: k, count: data[k].msgCount || 0 }));
    users.sort((a,b) => b.count - a.count);
    let html = `<div style="padding:6px 4px 12px;"><h3 style="margin-bottom:16px;display:flex;gap:10px;align-items:center;"><i class="fas fa-trophy" style="color:#fbbf24;"></i> LEADERBOARD</h3>`;
    users.forEach((u,i) => {
      html += `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:16px;margin-bottom:6px;border:1px solid var(--glass-border);">
        <span style="font-weight:700;color:#fbbf24;width:24px;">#${i+1}</span>
        <span style="font-weight:600;cursor:pointer;" onclick="window.openProfile('${u.name}')">${u.name}</span>
        <span style="margin-left:auto;color:var(--text-muted);font-size:0.8rem;">${u.count} msgs</span>
      </div>`;
    });
    html += `</div>`;
    chatMessages.innerHTML = html;
    chatMessages.scrollTop = 0;
    // reset channel highlight
    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
    activeChanLabel.textContent = '🏆 Leaderboard';
  });
  // if already open, we switch
  activeMode = 'lb';
}

// --------------------------------------------------------------
// PARTICLE BACKGROUND
// --------------------------------------------------------------
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width; canvas.height = height;

const particles = [];
const count = 50;
for (let i = 0; i < count; i++) {
  particles.push({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 1.8 + 0.8,
    dx: (Math.random() - 0.5) * 0.6,
    dy: (Math.random() - 0.5) * 0.6,
    o: Math.random() * 0.3 + 0.15
  });
}

function drawParticles() {
  ctx.clearRect(0, 0, width, height);
  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0 || p.x > width) p.dx *= -1;
    if (p.y < 0 || p.y > height) p.dy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(167, 139, 250, ${p.o})`;
    ctx.fill();
  });
  // draw lines
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(167, 139, 250, ${0.06 * (1 - dist/150)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();
window.addEventListener('resize', () => {
  width = window.innerWidth; height = window.innerHeight;
  canvas.width = width; canvas.height = height;
});
