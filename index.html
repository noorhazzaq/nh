<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK Tube — Video Platform">
    <title>ZACK Tube</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK Tube","short_name":"ZACK","display":"standalone","theme_color":"%23000000","background_color":"%23000000"}'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        :root {
            --red: #ff0033;
            --cyan: #00f0ff;
            --gold: #ffd700;
            --purple: #8a2be2;
            --bg: #000000;
            --white: #ffffff;
            --muted: #999999;
            --success: #00ff88;
            --border-glow: rgba(0,240,255,0.3);
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff, #ffd700);
            --grad-btn: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --r-sm: 10px;
            --r-md: 16px;
            --r-full: 30px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .aurora {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,0,51,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,240,255,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(138,43,226,0.08) 0%, transparent 60%);
            z-index: 0;
            animation: auroraFloat 10s ease-in-out infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10px, 10px) scale(1.05); }
        }

        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; width: 2px; height: 2px;
            border-radius: 50%; background: var(--white);
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; box-shadow: 0 0 8px var(--white); }
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(12px + var(--safe-top)) 15px 12px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            background: var(--grad-text);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 4s ease infinite;
        }
        @keyframes logoGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .main {
            position: relative; z-index: 2;
            padding: calc(55px + var(--safe-top)) 10px calc(70px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .page { display: none; flex: 1; flex-direction: column; min-height: 0; }
        .page.active { display: flex; animation: fadeUp 0.3s var(--ease); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            padding: 8px 10px calc(8px + var(--safe-bottom));
            background: rgba(0,0,0,0.95);
            border-top: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 8px 15px; border: none; background: none;
            color: #666; font-family: 'Orbitron', sans-serif; font-size: 7px;
            cursor: pointer; border-radius: 10px;
        }
        .nav-btn .nav-icon { font-size: 18px; }
        .nav-btn.active { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5); }

        .video-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .video-card {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: pointer;
            animation: boxGlow 5s ease-in-out infinite;
        }
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,51,0.1); }
            50% { box-shadow: 0 0 35px rgba(0,240,255,0.2); }
        }
        .video-thumb {
            height: 160px;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px;
            background: linear-gradient(135deg, rgba(255,0,51,0.2), rgba(0,240,255,0.1));
            border-bottom: 1px solid var(--border-glow);
        }
        .video-info { padding: 12px; }
        .video-title {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            color: var(--white); margin-bottom: 5px;
        }
        .video-meta {
            display: flex; justify-content: space-between;
            font-size: 9px; color: var(--muted);
        }

        .watch-container {
            flex: 1; display: flex; flex-direction: column;
            overflow-y: auto; gap: 12px;
        }
        .video-player {
            height: 200px;
            display: flex; justify-content: center; align-items: center;
            font-size: 70px;
            background: linear-gradient(135deg, rgba(255,0,51,0.3), rgba(0,240,255,0.2));
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            animation: boxGlow 5s ease-in-out infinite;
        }
        .video-title-lg {
            font-family: 'Orbitron', sans-serif; font-size: 16px;
            color: var(--white);
        }
        .video-actions { display: flex; gap: 10px; }
        .action-btn {
            padding: 8px 15px;
            background: rgba(255,0,51,0.08);
            border: 1px solid var(--border-glow);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif; font-size: 9px;
            border-radius: var(--r-full); cursor: pointer;
        }
        .comment-list { display: flex; flex-direction: column; gap: 8px; }
        .comment {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-sm);
            padding: 10px;
            background: rgba(0,0,0,0.4);
        }
        .comment-name {
            font-family: 'Orbitron', sans-serif; font-size: 8px;
            color: var(--cyan); margin-bottom: 3px;
        }
        .comment-text { font-size: 11px; color: #ccc; }

        .upload-card {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.5);
            padding: 20px;
            text-align: center;
        }
        .input-field {
            width: 100%; padding: 11px 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-glow);
            color: var(--white);
            font-family: 'Rajdhani', sans-serif; font-size: 13px;
            border-radius: var(--r-full); outline: none;
            margin-bottom: 10px;
        }
        .btn-primary {
            width: 100%; padding: 12px;
            background: var(--grad-btn); color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            cursor: pointer;
        }

        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px; max-width: 260px;
        }
        .toast {
            padding: 11px 17px; border-radius: 12px; font-size: 11px;
            border: 1px solid;
            transition: all 0.4s var(--ease);
            backdrop-filter: blur(15px);
        }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-success { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.4); color: var(--success); }
        .toast-error { background: rgba(255,0,51,0.1); border-color: rgba(255,0,51,0.4); color: var(--red); }
        .toast-info { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.4); color: var(--cyan); }
    </style>
</head>
<body>

    <div class="aurora"></div>
    <div class="stars" id="stars"></div>

    <div class="toast-wrap" id="toastWrap"></div>

    <div class="header">
        <div class="logo">ZACK TUBE</div>
    </div>

    <div class="main">

        <!-- HOME -->
        <div class="page active" id="page-home">
            <div class="video-list" id="videoList"></div>
        </div>

        <!-- WATCH -->
        <div class="page" id="page-watch">
            <div class="watch-container" id="watchContainer"></div>
        </div>

        <!-- UPLOAD -->
        <div class="page" id="page-upload">
            <div class="upload-card">
                <h3 style="font-family:'Orbitron',sans-serif;font-size:13px;color:var(--cyan);margin-bottom:15px;">📤 MUAT NAIK VIDEO</h3>
                <input type="text" id="videoTitle" class="input-field" placeholder="TAJUK VIDEO" maxlength="100">
                <input type="text" id="videoIcon" class="input-field" placeholder="IKON (EMOJI)" maxlength="5" value="🎬">
                <input type="text" id="videoDesc" class="input-field" placeholder="DESKRIPSI" maxlength="200">
                <input type="text" id="videoAuthor" class="input-field" placeholder="NAMA ANDA" maxlength="30">
                <button class="btn-primary" onclick="uploadVideo()">🚀 TERBITKAN</button>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showPage('home', this)"><span class="nav-icon">🏠</span>HOME</button>
        <button class="nav-btn" onclick="showPage('upload', this)"><span class="nav-icon">📤</span>UPLOAD</button>
        <button class="nav-btn" onclick="showPage('home', this)"><span class="nav-icon">🔔</span>SUB</button>
        <button class="nav-btn" onclick="showPage('home', this)"><span class="nav-icon">👤</span>SAYA</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        'use strict';

        const CONFIG = {
            databaseURL: 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'
        };

        const db = firebase.initializeApp({ databaseURL: CONFIG.databaseURL }).database();

        const $ = id => document.getElementById(id);

        function toast(msg, type = 'info') {
            const wrap = $('toastWrap');
            while (wrap.children.length >= 3) wrap.firstChild.remove();
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => {
                el.classList.add('hide');
                setTimeout(() => el.remove(), 400);
            }, 3000);
        }

        const safeText = str => { const d = document.createElement('div'); d.textContent = str; return d.textContent; };
        const getDate = () => new Date().toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' });

        function initStars() {
            const wrap = $('stars');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                frag.appendChild(s);
            }
            wrap.appendChild(frag);
        }

        function showPage(name, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            $(`page-${name}`).classList.add('active');
            if (btn) btn.classList.add('active');
            if (name === 'home') renderVideos();
        }

        function renderVideos() {
            const list = $('videoList');
            list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">Memuat video...</p>';
            db.ref('videos').limitToLast(50).on('value', snap => {
                list.innerHTML = '';
                if (!snap.exists()) {
                    list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">Tiada video. Jadilah yang pertama!</p>';
                    return;
                }
                const frag = document.createDocumentFragment();
                const videos = [];
                snap.forEach(child => videos.push({ key: child.key, ...child.val() }));
                videos.reverse();
                videos.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="video-thumb">${v.icon || '🎬'}</div>
                        <div class="video-info">
                            <div class="video-title">${safeText(v.title)}</div>
                            <div class="video-meta">
                                <span>${safeText(v.author)}</span>
                                <span>${safeText(v.views || 0)} tontonan • ${safeText(v.date)}</span>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => watchVideo(v.key));
                    frag.appendChild(card);
                });
                list.appendChild(frag);
            });
        }

        function watchVideo(key) {
            db.ref('videos/' + key).once('value', snap => {
                if (!snap.exists()) return;
                const v = snap.val();
                const container = $('watchContainer');
                container.innerHTML = `
                    <div class="video-player">${v.icon || '🎬'}</div>
                    <div class="video-title-lg">${safeText(v.title)}</div>
                    <div class="video-meta">
                        <span>${safeText(v.author)} • ${safeText(v.views || 0)} tontonan • ${safeText(v.date)}</span>
                    </div>
                    <div class="video-actions">
                        <button class="action-btn" onclick="likeVideo('${key}')">👍 ${v.likes || 0}</button>
                        <button class="action-btn" onclick="shareVideo('${key}')">📤 KONGSI</button>
                    </div>
                    <p style="font-size:11px;color:var(--muted);">${safeText(v.desc || '')}</p>
                    <h3 style="font-family:'Orbitron',sans-serif;font-size:10px;color:var(--cyan);">💬 KOMEN</h3>
                    <div class="comment-list" id="commentList"></div>
                    <div style="display:flex;gap:6px;">
                        <input type="text" id="commentInput" class="input-field" placeholder="Tulis komen..." style="margin-bottom:0;">
                        <button class="btn-primary" style="width:auto;padding:11px 15px;" onclick="addComment('${key}')">HANTAR</button>
                    </div>
                `;
                db.ref('videos/' + key).update({ views: (v.views || 0) + 1 });
                loadComments(key);
                showPage('watch');
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            });
        }

        function likeVideo(key) {
            db.ref('videos/' + key).transaction(v => {
                if (v) {
                    v.likes = (v.likes || 0) + 1;
                }
                return v;
            }).then(() => toast('Dilike! 👍', 'success'));
        }

        function shareVideo(key) {
            if (navigator.share) {
                navigator.share({ title: 'ZACK Tube', url: window.location.href }).catch(() => {});
            } else {
                toast('Pautan disalin!', 'info');
            }
        }

        function loadComments(videoKey) {
            db.ref('comments/' + videoKey).limitToLast(30).on('value', snap => {
                const list = $('commentList');
                list.innerHTML = '';
                if (!snap.exists()) {
                    list.innerHTML = '<p style="color:#555;font-size:10px;">Tiada komen.</p>';
                    return;
                }
                const frag = document.createDocumentFragment();
                snap.forEach(child => {
                    const c = child.val();
                    const div = document.createElement('div');
                    div.className = 'comment';
                    div.innerHTML = `
                        <div class="comment-name">${safeText(c.name)}</div>
                        <div class="comment-text">${safeText(c.text)}</div>
                    `;
                    frag.appendChild(div);
                });
                list.appendChild(frag);
            });
        }

        function addComment(videoKey) {
            const input = $('commentInput');
            const text = input.value.trim();
            if (!text) return;
            const name = localStorage.getItem('zack_name') || 'Anonymous';
            db.ref('comments/' + videoKey).push({
                name: name,
                text: text,
                time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
            }).then(() => {
                input.value = '';
                toast('Komen dihantar!', 'success');
            });
        }

        function uploadVideo() {
            const title = $('videoTitle').value.trim();
            const icon = $('videoIcon').value.trim() || '🎬';
            const desc = $('videoDesc').value.trim();
            const author = $('videoAuthor').value.trim() || localStorage.getItem('zack_name') || 'Anonymous';
            if (!title) { toast('Sila isi tajuk!', 'error'); return; }
            if (!author) { toast('Sila isi nama!', 'error'); return; }
            localStorage.setItem('zack_name', author);
            db.ref('videos').push({
                title: title,
                icon: icon,
                desc: desc,
                author: author,
                views: 0,
                likes: 0,
                date: getDate(),
                timestamp: Date.now()
            }).then(() => {
                toast('Video diterbitkan! 🎉', 'success');
                $('videoTitle').value = '';
                $('videoDesc').value = '';
                showPage('home');
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            }).catch(() => toast('Gagal terbit!', 'error'));
        }

        initStars();
        renderVideos();
    </script>

</body>
</html>
