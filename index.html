<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZACK THREADS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #b400ff;
            --neon-cyan: #00ffd0;
            --neon-pink: #ff00aa;
            --neon-gold: #ffd700;
            --neon-orange: #ff6a00;
            --neon-red: #ff0040;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(10, 14, 30, 0.85);
            --theme-color: #00ffd0;
        }

        html,
        body {
            height: 100%;
            background: var(--dark-bg);
            color: #e0f0ff;
            font-family: 'Orbitron', 'Segoe UI', monospace;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            animation: gridPulse 8s infinite alternate ease-in-out;
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 0.8;
            }
        }

        body::after {
            content: '';
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-gold), var(--neon-cyan), transparent);
            box-shadow: 0 0 30px var(--neon-cyan);
            z-index: 9999;
            pointer-events: none;
            opacity: 0.3;
            animation: scanLine 12s linear infinite;
        }

        @keyframes scanLine {
            0% {
                top: -5%;
            }
            100% {
                top: 105%;
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) {
            left: 10%;
            animation-duration: 18s;
            width: 3px;
            height: 3px;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }
        .particle:nth-child(2) {
            left: 25%;
            animation-duration: 22s;
            width: 2px;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
        }
        .particle:nth-child(3) {
            left: 40%;
            animation-duration: 16s;
            width: 4px;
            height: 4px;
            background: var(--neon-purple);
            box-shadow: 0 0 12px var(--neon-purple);
        }
        .particle:nth-child(4) {
            left: 55%;
            animation-duration: 24s;
            width: 2px;
            height: 2px;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        .particle:nth-child(5) {
            left: 70%;
            animation-duration: 20s;
            width: 5px;
            height: 5px;
            background: var(--neon-gold);
            box-shadow: 0 0 16px var(--neon-gold);
        }
        .particle:nth-child(6) {
            left: 85%;
            animation-duration: 26s;
            width: 3px;
            height: 3px;
            background: var(--neon-orange);
            box-shadow: 0 0 10px var(--neon-orange);
        }
        .particle:nth-child(7) {
            left: 50%;
            animation-duration: 19s;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
        }
        .particle:nth-child(8) {
            left: 15%;
            animation-duration: 23s;
            width: 2px;
            height: 2px;
            background: var(--neon-purple);
            box-shadow: 0 0 8px var(--neon-purple);
        }
        .particle:nth-child(9) {
            left: 65%;
            animation-duration: 17s;
            width: 3px;
            height: 3px;
            background: var(--neon-pink);
            box-shadow: 0 0 12px var(--neon-pink);
        }
        .particle:nth-child(10) {
            left: 35%;
            animation-duration: 21s;
            width: 4px;
            height: 4px;
            background: var(--neon-gold);
            box-shadow: 0 0 14px var(--neon-gold);
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(110vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: radial-gradient(circle at 20% 30%, rgba(0, 255, 208, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.02) 0%, transparent 50%);
            animation: sparkleBg 12s infinite alternate ease-in-out;
        }

        @keyframes sparkleBg {
            0% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 0.2;
            }
        }

        /* ===== TOP BAR MENU ===== */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 30, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: barGlow 5s infinite alternate ease-in-out;
        }

        @keyframes barGlow {
            0% {
                border-bottom-color: rgba(0, 240, 255, 0.1);
            }
            50% {
                border-bottom-color: rgba(180, 0, 255, 0.2);
            }
            100% {
                border-bottom-color: rgba(255, 215, 0, 0.1);
            }
        }

        .bar-brand {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease-in-out infinite;
            cursor: pointer;
        }

        .bar-brand small {
            font-size: 0.5rem;
            letter-spacing: 6px;
            -webkit-text-fill-color: rgba(0, 240, 255, 0.2);
            display: block;
            margin-top: -0.2rem;
        }

        .bar-menu {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .bar-menu .menu-btn {
            background: none;
            border: 1px solid rgba(0, 240, 255, 0.1);
            color: rgba(0, 240, 255, 0.3);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            padding: 0.4rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .bar-menu .menu-btn:hover {
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
            transform: scale(1.05);
        }

        .bar-menu .menu-btn.active {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .bar-menu .menu-btn.gold {
            border-color: rgba(255, 215, 0, 0.2);
            color: var(--neon-gold);
        }

        .bar-menu .menu-btn.gold:hover {
            border-color: var(--neon-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        .bar-menu .menu-btn.pink {
            border-color: rgba(255, 0, 170, 0.15);
            color: var(--neon-pink);
        }

        .bar-menu .menu-btn.pink:hover {
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 170, 0.1);
        }

        .bar-user {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.55rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
        }

        .bar-user .user-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan);
            display: inline-block;
            animation: dotBlink 1.5s infinite;
        }

        .bar-user .user-name {
            color: var(--neon-purple);
            text-shadow: 0 0 20px rgba(180, 0, 255, 0.2);
        }

        @keyframes dotBlink {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.8);
            }
        }

        /* ===== LOGIN OVERLAY ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            animation: overlayIn 0.3s ease-out;
        }

        .login-overlay.show {
            display: flex;
        }

        @keyframes overlayIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .login-box {
            max-width: 420px;
            width: 90%;
            padding: 2rem;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.08), 0 0 100px rgba(180, 0, 255, 0.05);
            position: relative;
        }

        .login-box .close-btn {
            position: absolute;
            top: 0.8rem;
            right: 1rem;
            background: none;
            border: none;
            color: rgba(0, 240, 255, 0.2);
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box .close-btn:hover {
            color: var(--neon-pink);
            transform: rotate(90deg);
        }

        .login-box h2 {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: var(--neon-cyan);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .login-box .form-group {
            margin: 0;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(0, 240, 255, 0.15);
            border-radius: 12px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            transition: all 0.2s;
            outline: none;
        }

        .login-box .form-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            transform: scale(1.01);
        }

        .login-box .form-group input::placeholder {
            color: rgba(0, 240, 255, 0.2);
            font-size: 0.65rem;
            letter-spacing: 3px;
        }

        .login-box .btn {
            width: 100%;
            padding: 0.9rem;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.12), rgba(180, 0, 255, 0.12));
            color: var(--neon-cyan);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .login-box .btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            background-size: 300% 300%;
            animation: gradientShift 3s ease-in-out infinite;
        }

        .login-box .btn:hover::before {
            opacity: 1;
        }

        .login-box .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
        }

        .login-box .btn-secondary {
            background: rgba(0, 240, 255, 0.02);
            color: rgba(0, 240, 255, 0.4);
            border-color: rgba(0, 240, 255, 0.08);
            margin-top: 0.5rem;
        }

        .login-box .btn-secondary:hover {
            background: rgba(0, 240, 255, 0.06);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.03);
        }

        .login-box .btn-gold {
            background: rgba(255, 215, 0, 0.08);
            color: var(--neon-gold);
            border-color: var(--neon-gold);
        }

        .login-box .btn-gold:hover {
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
        }

        .login-box .error-msg {
            color: var(--neon-pink);
            font-size: 0.6rem;
            text-align: center;
            margin-top: 0.5rem;
            text-shadow: 0 0 20px var(--neon-pink);
            animation: errorPulse 1s infinite alternate;
        }

        @keyframes errorPulse {
            0% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        .login-box .register-link {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.2);
            letter-spacing: 2px;
        }

        .login-box .register-link span {
            color: var(--neon-gold);
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .login-box .register-link span:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 1.5rem auto;
            padding: 1.8rem;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 240, 255, 0.2);
            border-radius: 28px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.08), 0 0 60px rgba(180, 0, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: containerGlow 5s infinite alternate ease-in-out;
        }

        @keyframes containerGlow {
            0% {
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.06), 0 0 40px rgba(180, 0, 255, 0.03);
                border-color: rgba(0, 240, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 50px rgba(0, 240, 255, 0.12), 0 0 100px rgba(180, 0, 255, 0.08);
                border-color: rgba(180, 0, 255, 0.25);
            }
            100% {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.06), 0 0 60px rgba(0, 240, 255, 0.06);
                border-color: rgba(255, 215, 0, 0.15);
            }
        }

        .header {
            text-align: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-gold), transparent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            animation: headerLine 5s infinite alternate ease-in-out;
        }

        @keyframes headerLine {
            0% {
                opacity: 0.2;
                transform: scaleX(0.7);
            }
            100% {
                opacity: 1;
                transform: scaleX(1.3);
            }
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease-in-out infinite, titleFlicker 4s infinite;
            display: inline-block;
            position: relative;
        }

        .header h1::before {
            content: '✦';
            position: absolute;
            left: -60px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-text-fill-color: initial;
            color: var(--neon-gold);
            font-size: 2rem;
            animation: sparkleIcon 2.5s infinite;
            text-shadow: 0 0 30px var(--neon-gold);
        }

        .header h1::after {
            content: '✦';
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-text-fill-color: initial;
            color: var(--neon-pink);
            font-size: 2rem;
            animation: sparkleIcon 2.5s infinite 1.25s;
            text-shadow: 0 0 30px var(--neon-pink);
        }

        @keyframes sparkleIcon {
            0%,
            100% {
                opacity: 1;
                transform: translateY(-50%) scale(1) rotate(0deg);
            }
            50% {
                opacity: 0.2;
                transform: translateY(-50%) scale(1.5) rotate(180deg);
            }
        }

        @keyframes titleFlicker {
            0%,
            100% {
                opacity: 1;
            }
            2% {
                opacity: 0.85;
            }
            4% {
                opacity: 1;
            }
            50% {
                opacity: 0.95;
            }
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 10px;
            color: rgba(0, 240, 255, 0.3);
            margin-top: 0.3rem;
            text-transform: uppercase;
            animation: subtitlePulse 4s infinite alternate ease-in-out;
        }

        @keyframes subtitlePulse {
            0% {
                opacity: 0.3;
                letter-spacing: 10px;
            }
            100% {
                opacity: 0.7;
                letter-spacing: 14px;
            }
        }

        .user-badge {
            text-align: center;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            letter-spacing: 3px;
            border: 1px solid rgba(0, 240, 255, 0.06);
            margin-bottom: 1.2rem;
        }

        .user-badge span {
            color: var(--neon-purple);
            text-shadow: 0 0 20px rgba(180, 0, 255, 0.2);
        }

        .thread-input {
            margin: 1.2rem 0;
        }

        .thread-input textarea {
            width: 100%;
            padding: 1rem 1.4rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(0, 240, 255, 0.1);
            border-radius: 14px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
            outline: none;
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
            max-height: 200px;
        }

        .thread-input textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.08);
            transform: scale(1.01);
        }

        .thread-input textarea::placeholder {
            color: rgba(0, 240, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        .thread-input .btn {
            margin-top: 0.8rem;
        }

        .threads-container {
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 240, 255, 0.06);
        }

        .threads-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .threads-header span {
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.25);
            text-transform: uppercase;
        }

        .threads-header .thread-count {
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            font-weight: 700;
        }

        .threads-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 0.3rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
            -webkit-overflow-scrolling: touch;
        }

        .threads-list::-webkit-scrollbar {
            width: 3px;
        }

        .threads-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .threads-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 10px;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .thread-item {
            padding: 1.2rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border-left: 3px solid var(--neon-cyan);
            transition: all 0.25s;
            animation: threadIn 0.35s ease-out;
            position: relative;
        }

        .thread-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.01), rgba(180, 0, 255, 0.01));
            pointer-events: none;
            border-radius: 16px;
        }

        .thread-item:hover {
            transform: translateX(4px);
            border-left-color: var(--neon-purple);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.02);
        }

        @keyframes threadIn {
            0% {
                opacity: 0;
                transform: translateY(-12px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .thread-author {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            font-weight: 700;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }

        .thread-author::before {
            content: '◆ ';
            color: var(--neon-purple);
        }

        .thread-content {
            font-size: 0.85rem;
            color: #e8f0ff;
            margin: 0.6rem 0;
            line-height: 1.8;
            word-break: break-word;
            position: relative;
            z-index: 1;
        }

        .thread-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.2);
            margin-top: 0.6rem;
            position: relative;
            z-index: 1;
        }

        .thread-actions {
            display: flex;
            gap: 1.2rem;
        }

        .thread-actions button {
            background: none;
            border: none;
            color: rgba(0, 240, 255, 0.3);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
        }

        .thread-actions button:hover {
            background: rgba(0, 240, 255, 0.04);
            transform: scale(1.05);
        }

        .thread-actions .like-btn.liked {
            color: var(--neon-pink);
            text-shadow: 0 0 25px var(--neon-pink);
        }

        .thread-actions .like-btn:hover {
            color: var(--neon-pink);
        }

        .thread-actions .reply-btn:hover {
            color: var(--neon-purple);
        }

        .thread-actions .view-only {
            color: rgba(0, 240, 255, 0.2);
            font-size: 0.55rem;
            padding: 0.3rem 0.6rem;
        }

        .replies-container {
            margin-top: 0.8rem;
            padding-left: 1.2rem;
            border-left: 1px solid rgba(180, 0, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .reply-item {
            padding: 0.5rem 0;
            font-size: 0.7rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.02);
            animation: replyIn 0.25s ease-out;
        }

        .reply-item:last-child {
            border-bottom: none;
        }

        .reply-author {
            color: var(--neon-purple);
            text-shadow: 0 0 12px rgba(180, 0, 255, 0.1);
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 2px;
        }

        .reply-author::before {
            content: '↳ ';
        }

        .reply-text {
            color: #c0d0e8;
            margin-left: 0.5rem;
        }

        .reply-time {
            font-size: 0.45rem;
            color: rgba(0, 240, 255, 0.12);
            float: right;
        }

        .reply-input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .reply-input-group input {
            flex: 1;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(180, 0, 255, 0.1);
            border-radius: 10px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            outline: none;
            transition: all 0.2s;
        }

        .reply-input-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(180, 0, 255, 0.06);
        }

        .reply-input-group input::placeholder {
            color: rgba(0, 240, 255, 0.12);
            font-size: 0.5rem;
            letter-spacing: 2px;
        }

        .reply-input-group button {
            padding: 0.5rem 1rem;
            background: rgba(180, 0, 255, 0.08);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            color: var(--neon-purple);
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 2px;
        }

        .reply-input-group button:hover {
            background: rgba(180, 0, 255, 0.15);
            box-shadow: 0 0 25px rgba(180, 0, 255, 0.08);
            transform: scale(1.05);
        }

        .empty-threads {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(0, 240, 255, 0.08);
            font-size: 0.7rem;
            letter-spacing: 6px;
            border: 1px dashed rgba(0, 240, 255, 0.03);
            border-radius: 16px;
        }

        .empty-threads::before {
            content: '✦ ';
            color: var(--neon-gold);
            opacity: 0.2;
        }

        .empty-threads::after {
            content: ' ✦';
            color: var(--neon-gold);
            opacity: 0.2;
        }

        .status-bar {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 240, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.15);
            letter-spacing: 3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan);
            display: inline-block;
            animation: dotBlink 1.5s infinite;
        }

        .exit-btn {
            background: rgba(255, 0, 170, 0.06);
            border: 1px solid rgba(255, 0, 170, 0.1);
            color: var(--neon-pink);
            padding: 0.4rem 1.2rem;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 2px;
        }

        .exit-btn:hover {
            background: rgba(255, 0, 170, 0.12);
            box-shadow: 0 0 25px rgba(255, 0, 170, 0.06);
            transform: scale(1.05);
        }

        .public-notice {
            text-align: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.15);
            letter-spacing: 2px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border-top: 1px solid rgba(0, 240, 255, 0.04);
        }

        .public-notice span {
            color: var(--neon-gold);
            opacity: 0.5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .top-bar {
                padding: 0.6rem 1rem;
            }
            .bar-brand {
                font-size: 0.9rem;
                letter-spacing: 2px;
            }
            .bar-brand small {
                font-size: 0.4rem;
                letter-spacing: 4px;
            }
            .bar-menu .menu-btn {
                font-size: 0.5rem;
                padding: 0.3rem 0.6rem;
                letter-spacing: 1px;
            }
            .bar-user {
                font-size: 0.45rem;
            }
            .container {
                margin: 0.6rem;
                padding: 1.2rem;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 2rem;
                letter-spacing: 4px;
            }
            .header h1::before,
            .header h1::after {
                display: none;
            }
            .thread-item {
                padding: 0.8rem;
            }
            .thread-content {
                font-size: 0.75rem;
            }
            .login-box {
                padding: 1.5rem;
            }
            .login-box h2 {
                font-size: 1rem;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 0.8rem;
            }
            .header h1 {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
            .subtitle {
                font-size: 0.55rem;
                letter-spacing: 5px;
            }
            .thread-footer {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }
            .thread-actions {
                width: 100%;
                justify-content: space-around;
            }
            .reply-input-group {
                flex-direction: column;
            }
            .reply-input-group button {
                width: 100%;
            }
            .threads-header {
                flex-direction: column;
                gap: 0.3rem;
                align-items: flex-start;
            }
            .top-bar {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .bar-menu {
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }

        .container,
        .header,
        .thread-item,
        .btn,
        .form-group input,
        .thread-input textarea,
        .login-box {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-perspective: 1000;
            perspective: 1000;
        }

        .threads-list {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="sparkle"></div>

    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <div class="bar-brand" onclick="scrollToTop()">
            ZACK
            <small>◈ threads ◈</small>
        </div>
        <div class="bar-menu">

    <!-- ===== LOGIN OVERLAY ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <button class="close-btn" onclick="closeLogin()">✕</button>
            <h2>⟡ sign in</h2>

                <span onclick="showRegisterForm()">create account →</span>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container" id="mainContainer">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ cyber social ◈</div>
        </div>

        <!-- ===== PUBLIC THREADS (Visible to everyone) ===== -->
        <div class="threads-container" id="publicThreads">
            <div class="threads-header">
                <span>⟡ public threads</span>
                <span class="thread-count" id="publicCount">0 threads</span>
            </div>
            <div class="threads-list" id="publicList">
                <div class="empty-threads">⍟ loading threads... ⍟</div>
            </div>
        </div>

        <!-- ===== LOGGED IN SECTION ===== -->
        <div id="loggedInSection" style="display:none;">
            <div class="user-badge">
                LOGGED IN AS <span id="displayUsername">USER</span>
            </div>

            <div class="thread-input">
                <textarea id="threadContent" placeholder="WHAT'S HAPPENING?" maxlength="500"></textarea>
                <button class="btn btn-gold" onclick="postThread()">⟐ POST THREAD</button>
            </div>

            <div class="threads-container">
                <div class="threads-header">
                    <span>⟡ your feed</span>
                    <span class="thread-count" id="threadCount">0 threads</span>
                </div>
                <div class="threads-list" id="threadsList">
                    <div class="empty-threads">⍟ no threads yet ⍟</div>
                </div>
            </div>

            <div class="status-bar">
                <span><span class="status-dot"></span> <span id="statusText">online</span></span>
            </div>
        </div>

        <div class="public-notice">
            <span>✦</span> login to post, like &amp; reply <span>✦</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        // ===== FIREBASE =====
        const FB_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(FB_CONFIG);
        }

        const DB = firebase.database();
        const USERS = DB.ref('/users');
        const THREADS = DB.ref('/threads');

        let user = null;
        let threads = [];
        let publicThreads = [];
        let listening = false;
        let publicListener = null;
        let renderTimer = null;
        let statusTimeout = null;

        // ===== DOM =====
        const $ = id => document.getElementById(id);
        const loginOverlay = $('loginOverlay');
        const loginUser = $('loginUsername');
        const loginPass = $('loginPassword');
        const loginErr = $('loginError');
        const displayUser = $('displayUsername');
        const barUsername = $('barUsername');
        const barUserInfo = $('barUserInfo');
        const loginBtn = $('loginBtn');
        const logoutBtn = $('logoutBtn');
        const threadInput = $('threadContent');
        const threadsList = $('threadsList');
        const threadCount = $('threadCount');
        const publicList = $('publicList');
        const publicCount = $('publicCount');
        const statusText = $('statusText');
        const loggedInSection = $('loggedInSection');
        const mainContainer = $('mainContainer');

        // ===== LOGIN OVERLAY =====
        function openLogin() {
            loginOverlay.classList.add('show');
            loginUser.focus();
            loginErr.textContent = '';
        }

        function closeLogin() {
            loginOverlay.classList.remove('show');
            loginUser.value = '';
            loginPass.value = '';
            loginErr.textContent = '';
        }

        function showRegisterForm() {
            // Simple redirect to register logic
            loginErr.textContent = '';
            // We'll handle registration in the same form
            const username = loginUser.value.trim();
            const password = loginPass.value;
            if (!username || !password) {
                loginErr.textContent = 'Enter username and password to register';
                return;
            }
            if (password.length < 4) {
                loginErr.textContent = 'Password min 4 chars';
                return;
            }
            registerUser(username, password);
        }

        // ===== REGISTER =====
        function registerUser(username, password) {
            USERS.child(username).once('value').then(snap => {
                if (snap.exists()) {
                    loginErr.textContent = 'Username taken';
                    return;
                }
                USERS.child(username).set({
                    password: password,
                    created: Date.now()
                }).then(() => {
                    loginErr.textContent = '';
                    loginErr.style.color = 'var(--neon-cyan)';
                    loginErr.textContent = '✓ Account created! Sign in.';
                    setTimeout(() => {
                        loginErr.style.color = '';
                        loginErr.textContent = '';
                    }, 3000);
                }).catch(err => {
                    loginErr.textContent = 'Error: ' + err.message;
                });
            });
        }

        // ===== LOGIN =====
        function login() {
            const username = loginUser.value.trim();
            const password = loginPass.value;

            if (!username || !password) {
                loginErr.textContent = 'Enter username and password';
                return;
            }

            USERS.child(username).once('value').then(snap => {
                if (!snap.exists()) {
                    loginErr.textContent = 'User not found';
                    return;
                }
                const data = snap.val();
                if (data.password !== password) {
                    loginErr.textContent = 'Wrong password';
                    return;
                }
                loginErr.textContent = '';
                user = username;
                displayUser.textContent = username.toUpperCase();
                barUsername.textContent = username.toUpperCase();
                barUserInfo.style.display = 'flex';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                loginUser.value = '';
                loginPass.value = '';
                closeLogin();
                // Stop public listener, start private listener
                if (publicListener) {
                    THREADS.off('value', publicListener);
                    publicListener = null;
                }
                loggedInSection.style.display = 'block';
                loadThreads();
                setStatus('welcome ' + username);
            });
        }

        // ===== LOGOUT =====
        function logout() {
            if (listening) {
                THREADS.off();
                listening = false;
            }
            user = null;
            threads = [];
            loggedInSection.style.display = 'none';
            barUserInfo.style.display = 'none';
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
            setStatus('logged out');
            // Reload public threads
            loadPublicThreads();
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== STATUS =====
        function setStatus(msg, isErr = false) {
            if (!statusText) return;
            statusText.textContent = msg;
            statusText.style.color = isErr ? '#ff00aa' : 'rgba(0,240,255,0.5)';
            if (!isErr) {
                clearTimeout(statusTimeout);
                statusTimeout = setTimeout(() => {
                    statusText.textContent = 'online';
                    statusText.style.color = 'rgba(0,240,255,0.5)';
                }, 3000);
            }
        }

        // ===== PUBLIC THREADS =====
        function loadPublicThreads() {
            if (publicListener) {
                THREADS.off('value', publicListener);
                publicListener = null;
            }

            publicListener = function(snap) {
                try {
                    if (snap.exists()) {
                        const data = snap.val();
                        publicThreads = Object.keys(data).map(k => ({
                            id: k,
                            ...data[k]
                        }));
                        publicThreads.sort((a, b) => b.timestamp - a.timestamp);
                    } else {
                        publicThreads = [];
                    }
                    renderPublicThreads();
                } catch (e) {
                    console.error('Public load error:', e);
                }
            };

            THREADS.on('value', publicListener);
        }

        function renderPublicThreads() {
            if (!publicList) return;

            if (!publicThreads.length) {
                publicList.innerHTML = '<div class="empty-threads">⍟ no threads yet ⍟</div>';
                publicCount.textContent = '0 threads';
                return;
            }

            let html = '';
            for (let i = 0; i < publicThreads.length; i++) {
                const t = publicThreads[i];
                const time = new Date(t.timestamp).toLocaleTimeString('en-US', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit'
                });
                const likes = t.likes || [];
                const replies = t.replies || [];
                const rCount = replies.length;

                let repliesHtml = '';
                if (rCount) {
                    for (let j = 0; j < replies.length; j++) {
                        const r = replies[j];
                        const rTime = new Date(r.timestamp).toLocaleTimeString('en-US', {
                            hour12: false,
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        repliesHtml += `
                            <div class="reply-item">
                                <span class="reply-author">${esc(r.author).toUpperCase()}</span>
                                <span class="reply-text">${esc(r.text)}</span>
                                <span class="reply-time">${rTime}</span>
                            </div>
                        `;
                    }
                }

                html += `
                    <div class="thread-item">
                        <div class="thread-author">${esc(t.author).toUpperCase()}</div>
                        <div class="thread-content">${esc(t.content)}</div>
                        <div class="thread-footer">
                            <span>${time}</span>
                            <div class="thread-actions">
                                <span class="view-only">♥ ${likes.length}</span>
                                <span class="view-only">⌨ ${rCount}</span>
                            </div>
                        </div>
                        <div class="replies-container">
                            ${repliesHtml}
                        </div>
                    </div>
                `;
            }

            publicList.innerHTML = html;
            publicCount.textContent = `${publicThreads.length} threads`;
        }

        // ===== LOGGED IN THREADS =====
        function loadThreads() {
            if (listening) {
                THREADS.off();
                listening = false;
            }

            THREADS.on('value', snap => {
                try {
                    if (snap.exists()) {
                        const data = snap.val();
                        threads = Object.keys(data).map(k => ({
                            id: k,
                            ...data[k]
                        }));
                        threads.sort((a, b) => b.timestamp - a.timestamp);
                    } else {
                        threads = [];
                    }
                    if (renderTimer) cancelAnimationFrame(renderTimer);
                    renderTimer = requestAnimationFrame(renderThreads);
                } catch (e) {
                    console.error('Load error:', e);
                    setStatus('error loading', true);
                }
            }, err => {
                console.error('Firebase error:', err);
                setStatus('connection error', true);
            });
            listening = true;
        }

        function renderThreads() {
            if (!threadsList) return;

            if (!threads.length) {
                threadsList.innerHTML = '<div class="empty-threads">⍟ no threads yet ⍟</div>';
                threadCount.textContent = '0 threads';
                return;
            }

            let html = '';
            for (let i = 0; i < threads.length; i++) {
                const t = threads[i];
                const time = new Date(t.timestamp).toLocaleTimeString('en-US', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit'
                });
                const likes = t.likes || [];
                const liked = likes.includes(user);
                const replies = t.replies || [];
                const rCount = replies.length;

                let repliesHtml = '';
                if (rCount) {
                    for (let j = 0; j < replies.length; j++) {
                        const r = replies[j];
                        const rTime = new Date(r.timestamp).toLocaleTimeString('en-US', {
                            hour12: false,
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        repliesHtml += `
                            <div class="reply-item">
                                <span class="reply-author">${esc(r.author).toUpperCase()}</span>
                                <span class="reply-text">${esc(r.text)}</span>
                                <span class="reply-time">${rTime}</span>
                            </div>
                        `;
                    }
                }

                html += `
                    <div class="thread-item" id="thread-${t.id}">
                        <div class="thread-author">${esc(t.author).toUpperCase()}</div>
                        <div class="thread-content">${esc(t.content)}</div>
                        <div class="thread-footer">
                            <span>${time}</span>
                            <div class="thread-actions">
                                <button class="like-btn ${liked ? 'liked' : ''}" onclick="likeThread('${t.id}')" ${liked ? 'style="color:#ff00aa"' : ''}>
                                    ♥ ${likes.length}
                                </button>
                                <button class="reply-btn" onclick="toggleReply('${t.id}')">
                                    ⌨ ${rCount}
                                </button>
                            </div>
                        </div>
                        <div class="replies-container" id="replies-${t.id}">
                            ${repliesHtml}
                        </div>
                        <div class="reply-input-group hidden" id="replyInput-${t.id}">
                            <input type="text" id="replyText-${t.id}" placeholder="REPLY..." maxlength="200" />
                            <button onclick="postReply('${t.id}')">SEND</button>
                        </div>
                    </div>
                `;
            }

            threadsList.innerHTML = html;
            threadCount.textContent = `${threads.length} threads`;
        }

        // ===== ESCAPE =====
        function esc(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== TOGGLE REPLY =====
        function toggleReply(id) {
            const input = document.getElementById(`replyInput-${id}`);
            if (input) {
                input.classList.toggle('hidden');
                if (!input.classList.contains('hidden')) {
                    const field = document.getElementById(`replyText-${id}`);
                    if (field) setTimeout(() => field.focus(), 50);
                }
            }
        }

        // ===== POST =====
        function postThread() {
            if (!user) {
                alert('You must be logged in.');
                return;
            }
            const content = threadInput.value.trim();
            if (!content) {
                alert('Please enter content.');
                return;
            }
            if (content.length > 500) {
                alert('Max 500 characters.');
                return;
            }

            THREADS.push({
                author: user,
                content: content,
                timestamp: Date.now(),
                likes: [],
                replies: []
            }).then(() => {
                threadInput.value = '';
                setStatus('thread posted ✓');
            }).catch(err => {
                alert('Error: ' + err.message);
                setStatus('error', true);
            });
        }

        // ===== LIKE =====
        function likeThread(id) {
            if (!user) {
                alert('Login to like.');
                return;
            }
            const t = threads.find(x => x.id === id);
            if (!t) return;

            const likes = t.likes || [];
            const idx = likes.indexOf(user);
            if (idx > -1) {
                likes.splice(idx, 1);
            } else {
                likes.push(user);
            }
            THREADS.child(id).update({ likes: likes }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ===== REPLY =====
        function postReply(id) {
            if (!user) {
                alert('Login to reply.');
                return;
            }
            const input = document.getElementById(`replyText-${id}`);
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            if (text.length > 200) {
                alert('Max 200 characters.');
                return;
            }

            const t = threads.find(x => x.id === id);
            if (!t) return;

            const replies = t.replies || [];
            replies.push({
                author: user,
                text: text,
                timestamp: Date.now()
            });

            THREADS.child(id).update({ replies: replies }).then(() => {
                input.value = '';
                const inp = document.getElementById(`replyInput-${id}`);
                if (inp) inp.classList.add('hidden');
                setStatus('reply posted ✓');
            }).catch(err => {
                alert('Error: ' + err.message);
                setStatus('error', true);
            });
        }

        // ===== KEYBOARD =====
        if (threadInput) {
            threadInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    postThread();
                }
            });
        }

        loginPass.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        // ===== SCROLL TO TOP =====
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== CLICK OUTSIDE LOGIN =====
        loginOverlay.addEventListener('click', (e) => {
            if (e.target === loginOverlay) {
                closeLogin();
            }
        });

        // ===== INIT =====
        loadPublicThreads();

        // ===== MOBILE OPTIMIZATION =====
        if (window.innerWidth < 600) {
            document.querySelectorAll('.particle').forEach((el, i) => {
                if (i > 5) el.style.display = 'none';
            });
        }

        // ===== VISIBILITY =====
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.querySelectorAll('.particle, .sparkle, body::before, body::after').forEach(el => {
                    if (el.style) el.style.animationPlayState = 'paused';
                });
            } else {
                document.querySelectorAll('.particle, .sparkle, body::before, body::after').forEach(el => {
                    if (el.style) el.style.animationPlayState = 'running';
                });
            }
        });

        console.log('✓ ZACK THREADS • BAR MENU VERSION');
        console.log('✓ Login via top-right menu');
        console.log('✓ Login overlay with blur effect');
        console.log('✓ Public threads always visible');
        console.log('✓ Login required to post/like/reply');
        console.log('✓ Clean bar menu design');
        console.log('✓ All features functional');
    </script>
</body>
</html>
