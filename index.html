<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Global Chat</title>
  <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Global Chat&quot;,&quot;short_name&quot;:&quot;Chat&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f0e17&quot;,&quot;theme_color&quot;:&quot;#16213e&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316213e'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23e94560'%3E💬%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}" />
  <style>
    /* ===== DESIGN SYSTEM ===== */
    :root {
      --bg-primary: #0f0e17;
      --bg-secondary: #1a1a2e;
      --bg-header: #16213e;
      --bg-messages: #12122a;
      --accent: #e94560;
      --accent-hover: #ff6b81;
      --text-primary: #fffffe;
      --text-muted: #a7a9be;
      --msg-own: #e94560;
      --msg-other: #2d2d44;
      --radius: 24px;
      --radius-sm: 12px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font: system-ui, -apple-system, sans-serif;
    }

    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== BASE ===== */
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      overflow: hidden;
    }

    /* ===== APP CONTAINER ===== */
    .app {
      max-width: 800px;
      width: 100%;
      height: 98vh;
      max-height: 850px;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* ===== HEADER ===== */
    .header {
      padding: 12px 20px;
      background: var(--bg-header);
      border-bottom: 2px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .header-title span {
      color: var(--accent);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .online-count {
      font-size: 0.75rem;
      opacity: 0.6;
      padding: 4px 12px;
      background: var(--bg-primary);
      border-radius: 20px;
    }

    /* ===== AUTH ===== */
    .auth {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .auth-input {
      padding: 4px 10px;
      border: none;
      border-radius: 20px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.85rem;
      width: 100px;
      transition: var(--transition);
    }
    .auth-input:focus {
      outline: 2px solid var(--accent);
      width: 130px;
    }
    .auth-btn {
      padding: 4px 14px;
      border: none;
      border-radius: 20px;
      background: var(--accent);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .auth-btn:hover {
      transform: scale(1.05);
      background: var(--accent-hover);
    }
    .auth-btn--logout {
      background: var(--msg-other);
    }
    .auth-btn--logout:hover {
      background: #3d3d5c;
    }

    /* ===== MESSAGES ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-messages);
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar {
      width: 4px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    .status {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.4;
      padding: 12px;
      font-style: italic;
    }

    /* ===== MESSAGE ===== */
    .message {
      padding: 6px 14px;
      border-radius: 16px;
      max-width: 82%;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
      line-height: 1.4;
    }
    .message--own {
      align-self: flex-end;
      background: var(--msg-own);
      border-bottom-right-radius: 4px;
    }
    .message--other {
      align-self: flex-start;
      background: var(--msg-other);
      border-bottom-left-radius: 4px;
    }
    .message-sender {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.6;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .message-time {
      font-size: 0.5rem;
      opacity: 0.4;
      margin-left: 6px;
    }
    .message-text {
      font-size: 0.9rem;
      word-break: break-word;
    }
    .message-text img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin: 4px 0;
      display: block;
    }
    .message-text video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin: 4px 0;
      display: block;
    }
    .message-text .voice {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 14px;
      border-radius: 24px;
    }
    .message-text .voice audio {
      max-width: 180px;
      height: 32px;
      flex: 1;
    }
    .message-text .error {
      color: #ff6b81;
      font-size: 0.8rem;
      padding: 4px 8px;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 6px;
    }

    /* ===== INPUT AREA ===== */
    .input-area {
      padding: 8px 12px 12px;
      background: var(--bg-header);
      border-top: 1px solid var(--msg-other);
      flex-shrink: 0;
    }
    .toolbar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .toolbar-btn {
      padding: 2px 10px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--msg-other);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.7rem;
      transition: var(--transition);
      opacity: 0.7;
    }
    .toolbar-btn:hover:not(:disabled) {
      opacity: 1;
      background: var(--accent);
      transform: scale(1.05);
    }
    .toolbar-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .toolbar-btn--active {
      background: var(--accent);
      opacity: 1;
      animation: pulse 1s infinite;
    }

    /* ===== RECORDING ===== */
    .recording {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 4px 14px;
      background: var(--accent);
      border-radius: 24px;
      font-size: 0.8rem;
      animation: pulse 1s infinite;
      margin-bottom: 6px;
    }
    .recording--active {
      display: flex;
    }
    .recording-timer {
      font-weight: 600;
      min-width: 30px;
    }
    .recording-stop {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 4px;
    }

    /* ===== INPUT ROW ===== */
    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-field {
      flex: 1;
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.9rem;
      min-width: 50px;
      transition: var(--transition);
    }
    .input-field:focus {
      outline: 2px solid var(--accent);
    }
    .input-field:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .input-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      background: var(--accent);
      color: var(--text-primary);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .input-btn:hover:not(:disabled) {
      transform: scale(1.05);
      background: var(--accent-hover);
    }
    .input-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .input-btn--icon {
      padding: 8px 10px;
      font-size: 1.1rem;
      background: var(--msg-other);
    }
    .input-btn--icon:hover:not(:disabled) {
      background: #3d3d5c;
    }
    .file-input {
      display: none;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .app {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .header {
        padding: 8px 12px;
      }
      .header-title {
        font-size: 1rem;
      }
      .auth-input {
        width: 70px;
        font-size: 0.75rem;
      }
      .auth-input:focus {
        width: 90px;
      }
      .messages {
        padding: 8px;
      }
      .message {
        max-width: 92%;
        padding: 4px 10px;
        font-size: 0.85rem;
      }
      .toolbar-btn {
        font-size: 0.6rem;
        padding: 2px 6px;
      }
      .input-field {
        font-size: 0.85rem;
        padding: 6px 10px;
      }
      .input-btn {
        padding: 6px 12px;
        font-size: 0.75rem;
      }
      .message-text .voice audio {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- ===== HEADER ===== -->
    <header class="header">
      <h1 class="header-title">🌍 <span>Global</span> Chat</h1>
      <div class="header-right">
        <span class="online-count" id="onlineCount">👤 0</span>
        <div class="auth">
          <input type="text" class="auth-input" id="usernameInput" placeholder="Name..." maxlength="20" />
          <button class="auth-btn" id="joinBtn">Join</button>
          <button class="auth-btn auth-btn--logout" id="leaveBtn" style="display:none">Leave</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer">
      <div class="status">👋 Sign in to chat</div>
    </div>

    <!-- ===== INPUT ===== -->
    <div class="input-area">
      <div class="toolbar" id="toolbar">
        <button class="toolbar-btn" data-action="image">🖼️ Image</button>
        <button class="toolbar-btn" data-action="video">🎥 Video</button>
        <button class="toolbar-btn" id="voiceBtn" data-action="voice">🎤 Voice</button>
      </div>

      <div class="recording" id="recordingIndicator">
        <span>🔴</span>
        <span class="recording-timer" id="recordingTimer">0:00</span>
        <span>Recording...</span>
        <button class="recording-stop" id="stopRecordingBtn">⏹️</button>
      </div>

      <div class="input-row">
        <input type="text" class="input-field" id="messageInput" placeholder="Type a message..." disabled />
        <button class="input-btn" id="sendBtn" disabled>Send</button>
        <button class="input-btn input-btn--icon" id="fileBtn" disabled>📎</button>
        <input type="file" class="file-input" id="fileInput" accept="image/*,video/*,audio/*" multiple />
      </div>
    </div>
  </div>

  <!-- ===== FIREBASE ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    /**
     * ============================================================
     * GLOBAL CHAT — Gemini AI Style
     * Architecture: Firebase Realtime DB + PWA + Vercel
     * ============================================================
     */

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const CONFIG = {
      FIREBASE: {
        databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
      },
      MESSAGE_LIMIT: 150,
      MAX_FILE_SIZE: 10 * 1024 * 1024, // 10MB
      VOICE_MIME_TYPE: 'audio/webm',
    };

    // ============================================================
    // FIREBASE INIT
    // ============================================================

    firebase.initializeApp(CONFIG.FIREBASE);
    const db = firebase.database();

    // ============================================================
    // DOM REFS
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      input: document.getElementById('messageInput'),
      send: document.getElementById('sendBtn'),
      username: document.getElementById('usernameInput'),
      join: document.getElementById('joinBtn'),
      leave: document.getElementById('leaveBtn'),
      online: document.getElementById('onlineCount'),
      toolbar: document.getElementById('toolbar'),
      fileInput: document.getElementById('fileInput'),
      fileBtn: document.getElementById('fileBtn'),
      recording: document.getElementById('recordingIndicator'),
      recordingTimer: document.getElementById('recordingTimer'),
      stopRecording: document.getElementById('stopRecordingBtn'),
      voiceBtn: document.getElementById('voiceBtn'),
    };

    // ============================================================
    // STATE
    // ============================================================

    const STATE = {
      user: null,
      listeners: [],
      isRecording: false,
      recorder: null,
      chunks: [],
      seconds: 0,
      timerInterval: null,
    };

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================

    const Utils = {
      /** Set status message in messages container */
      setStatus: (text) => {
        let el = DOM.messages.querySelector('.status');
        if (!el) {
          el = document.createElement('div');
          el.className = 'status';
          DOM.messages.appendChild(el);
        }
        el.textContent = text;
      },

      /** Scroll messages to bottom */
      scrollToBottom: () => {
        setTimeout(() => {
          DOM.messages.scrollTop = DOM.messages.scrollHeight;
        }, 50);
      },

      /** Format timestamp */
      formatTime: (timestamp) => {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        return d.toLocaleTimeString('en-GB', {
          hour: '2-digit',
          minute: '2-digit'
        });
      },

      /** Format seconds to MM:SS */
      formatSeconds: (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      },

      /** Escape HTML */
      escapeHTML: (text) => {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      },

      /** Upload file as data URL */
      uploadFile: (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      },

      /** Get file type prefix */
      getFilePrefix: (file) => {
        const type = file.type;
        if (type.startsWith('video/')) return '🎬 ';
        if (type.startsWith('audio/')) return '🎤 ';
        return '📸 ';
      },

      /** Toggle pickers */
      togglePicker: () => {
        // No pickers in this version
      },
    };

    // ============================================================
    // MESSAGE HANDLER
    // ============================================================

    const MessageHandler = {
      /** Send a message */
      send: (text) => {
        if (!STATE.user) {
          alert('Sign in first!');
          return;
        }
        if (!text || !text.trim()) return;

        db.ref('messages').push({
          name: STATE.user.name,
          uid: STATE.user.uid,
          text: text.trim(),
          timestamp: firebase.database.ServerValue.TIMESTAMP,
        }).catch(() => alert('Failed to send. Check connection.'));

        DOM.input.value = '';
        DOM.input.focus();
      },

      /** Render a message */
      render: (data) => {
        const isOwn = STATE.user && data.uid === STATE.user.uid;
        const el = document.createElement('div');
        el.className = `message ${isOwn ? 'message--own' : 'message--other'}`;
        el.dataset.key = data._key;

        let html = data.text || '';

        // Parse media
        if (html.startsWith('📸 ')) {
          html =
            `<img src="${html.substring(4)}" loading="lazy" onerror="this.outerHTML='<span class=\\'error\\'>❌ Failed to load image</span>'" />`;
        } else if (html.startsWith('🎬 ')) {
          html =
            `<video controls src="${html.substring(4)}" preload="metadata" onerror="this.outerHTML='<span class=\\'error\\'>❌ Failed to load video</span>'"></video>`;
        } else if (html.startsWith('🎤 ')) {
          html =
            `<div class="voice">🎤 <audio controls src="${html.substring(4)}" onerror="this.outerHTML='<span class=\\'error\\'>❌ Failed to load voice</span>'"></audio></div>`;
        }

        el.innerHTML = `
            <div class="message-sender">
              ${data.name || 'Anonymous'}
              <span class="message-time">${Utils.formatTime(data.timestamp)}</span>
            </div>
            <div class="message-text">${html}</div>
          `;

        const status = DOM.messages.querySelector('.status');
        if (status) status.remove();

        DOM.messages.appendChild(el);
        Utils.scrollToBottom();
      },
    };

    // ============================================================
    // FIREBASE SUBSCRIPTIONS
    // ============================================================

    const Subscription = {
      /** Subscribe to messages */
      messages: () => {
        // Clean up old listeners
        STATE.listeners.forEach(ref => ref.off());
        STATE.listeners = [];

        const query = db.ref('messages')
          .orderByKey()
          .limitToLast(CONFIG.MESSAGE_LIMIT);

        // New messages
        query.on('child_added', (snapshot) => {
          const data = snapshot.val();
          data._key = snapshot.key;
          MessageHandler.render(data);
        });

        // Removed messages
        query.on('child_removed', (snapshot) => {
          const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
          if (el) el.remove();
        });

        STATE.listeners.push(query);

        // Initial check
        query.once('value', (snapshot) => {
          if (!snapshot.exists()) {
            Utils.setStatus('💬 No messages yet. Say hello!');
          }
        });

        // Setup presence
        Subscription.presence();
      },

      /** Setup online presence */
      presence: () => {
        const presence = db.ref('.info/connected');
        const users = db.ref('users');

        presence.on('value', (snapshot) => {
          if (snapshot.val() && STATE.user) {
            const ref = users.child(STATE.user.uid);
            ref.set({
              name: STATE.user.name,
              lastSeen: firebase.database.ServerValue.TIMESTAMP,
            });
            ref.onDisconnect().remove();
          }
        });

        users.on('value', (snapshot) => {
          DOM.online.textContent = snapshot.exists() ?
            `👤 ${snapshot.numChildren()}` :
            '👤 0';
        });

        STATE.listeners.push(presence);
      },

      /** Clean up all listeners */
      cleanup: () => {
        STATE.listeners.forEach(ref => ref.off());
        STATE.listeners = [];
      },
    };

    // ============================================================
    // VOICE RECORDER
    // ============================================================

    const VoiceRecorder = {
      /** Start recording */
      start: async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          STATE.recorder = new MediaRecorder(stream);
          STATE.chunks = [];
          STATE.isRecording = true;
          STATE.seconds = 0;

          STATE.recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              STATE.chunks.push(event.data);
            }
          };

          STATE.recorder.onstop = async () => {
            STATE.isRecording = false;
            DOM.recording.classList.remove('recording--active');
            DOM.voiceBtn.classList.remove('toolbar-btn--active');
            DOM.input.disabled = false;
            DOM.send.disabled = false;

            if (STATE.timerInterval) {
              clearInterval(STATE.timerInterval);
              STATE.timerInterval = null;
            }

            if (STATE.chunks.length > 0) {
              const blob = new Blob(STATE.chunks, {
                type: CONFIG.VOICE_MIME_TYPE,
              });
              if (blob.size > 0) {
                try {
                  const file = new File(
                    [blob],
                    `voice-${Date.now()}.webm`, {
                      type: CONFIG.VOICE_MIME_TYPE,
                    }
                  );
                  const dataUrl = await Utils.uploadFile(file);
                  MessageHandler.send('🎤 ' + dataUrl);
                } catch (error) {
                  alert('Failed to upload voice. Please try again.');
                }
              }
            }

            stream.getTracks().forEach(track => track.stop());
          };

          STATE.recorder.start(1000);
          DOM.recording.classList.add('recording--active');
          DOM.voiceBtn.classList.add('toolbar-btn--active');
          DOM.input.disabled = true;
          DOM.send.disabled = true;

          // Start timer
          STATE.timerInterval = setInterval(() => {
            STATE.seconds++;
            DOM.recordingTimer.textContent = Utils.formatSeconds(STATE.seconds);
          }, 1000);

        } catch (error) {
          alert('Microphone access denied. Please allow microphone permissions.');
        }
      },

      /** Stop recording */
      stop: () => {
        if (STATE.recorder && STATE.recorder.state === 'recording') {
          STATE.recorder.stop();
        }
      },

      /** Toggle recording */
      toggle: () => {
        if (STATE.isRecording) {
          VoiceRecorder.stop();
        } else {
          VoiceRecorder.start();
        }
      },
    };

    // ============================================================
    // FILE HANDLER
    // ============================================================

    const FileHandler = {
      /** Handle file upload */
      handle: async (file) => {
        if (!STATE.user) {
          alert('Sign in first!');
          return;
        }

        try {
          // Check file size
          if (file.size > CONFIG.MAX_FILE_SIZE) {
            alert('File too large! Max 10MB.');
            return;
          }

          const prefix = Utils.getFilePrefix(file);
          const dataUrl = await Utils.uploadFile(file);
          MessageHandler.send(prefix + dataUrl);
        } catch (error) {
          alert('Failed to upload file. Please try again.');
        }
      },

      /** Handle multiple files */
      handleMultiple: async (files) => {
        for (const file of files) {
          await FileHandler.handle(file);
        }
        DOM.fileInput.value = '';
      },
    };

    // ============================================================
    // AUTH
    // ============================================================

    const Auth = {
      /** Login */
      login: () => {
        const name = DOM.username.value.trim() || 'Guest';
        STATE.user = {
          name: name,
          uid: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        };

        DOM.username.disabled = true;
        DOM.join.style.display = 'none';
        DOM.leave.style.display = 'inline-block';
        DOM.input.disabled = false;
        DOM.send.disabled = false;
        DOM.fileBtn.disabled = false;
        DOM.input.placeholder = `Message as ${name}...`;

        // Enable toolbar buttons
        DOM.toolbar.querySelectorAll('button').forEach(btn => btn.disabled = false);

        Utils.setStatus(`✅ Signed in as ${name}`);
        DOM.messages.innerHTML = '';
        Subscription.messages();
      },

      /** Logout */
      logout: () => {
        if (STATE.user) {
          db.ref('users').child(STATE.user.uid).remove();
        }

        Subscription.cleanup();
        STATE.user = null;

        DOM.username.disabled = false;
        DOM.join.style.display = 'inline-block';
        DOM.leave.style.display = 'none';
        DOM.input.disabled = true;
        DOM.send.disabled = true;
        DOM.fileBtn.disabled = true;
        DOM.input.placeholder = 'Sign in to chat...';
        DOM.input.value = '';

        // Disable toolbar buttons
        DOM.toolbar.querySelectorAll('button').forEach(btn => btn.disabled = true);

        DOM.messages.innerHTML = '';
        Utils.setStatus('👋 You left the chat. Sign in to rejoin.');
        DOM.online.textContent = '👤 0';

        if (STATE.isRecording) {
          VoiceRecorder.stop();
        }
      },
    };

    // ============================================================
    // EVENT BINDINGS
    // ============================================================

    const Events = {
      /** Initialize all event listeners */
      init: () => {
        // Auth
        DOM.join.addEventListener('click', Auth.login);
        DOM.leave.addEventListener('click', Auth.logout);
        DOM.username.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') Auth.login();
        });

        // Send
        DOM.send.addEventListener('click', () => {
          MessageHandler.send(DOM.input.value);
        });
        DOM.input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            MessageHandler.send(DOM.input.value);
          }
        });

        // Voice
        DOM.voiceBtn.addEventListener('click', VoiceRecorder.toggle);
        DOM.stopRecording.addEventListener('click', VoiceRecorder.stop);

        // File
        DOM.fileBtn.addEventListener('click', () => DOM.fileInput.click());
        DOM.fileInput.addEventListener('change', (e) => {
          if (e.target.files.length) {
            FileHandler.handleMultiple(e.target.files);
          }
        });

        // Toolbar
        DOM.toolbar.addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === 'image' || action === 'video') {
            DOM.fileInput.click();
          }
        });
      },
    };

    // ============================================================
    // INIT
    // ============================================================

    const Init = {
      /** Start the app */
      start: () => {
        // Disable toolbar initially
        DOM.toolbar.querySelectorAll('button').forEach(btn => btn.disabled = true);

        Utils.setStatus('🌐 Connecting...');
        Subscription.messages();
        Events.init();

        // PWA
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        console.log('💬 Global Chat initialized');
        console.log(`📡 Database: ${CONFIG.FIREBASE.databaseURL}`);
        console.log(`📦 Max messages: ${CONFIG.MESSAGE_LIMIT}`);
        console.log(`📁 Max file size: ${CONFIG.MAX_FILE_SIZE / 1024 / 1024}MB`);
      },
    };

    // ============================================================
    // BOOT
    // ============================================================

    // Start the application
    document.addEventListener('DOMContentLoaded', Init.start);
  </script>

</body>
</html>
