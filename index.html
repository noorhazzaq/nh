<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>✨ Sparkle Chat</title>
  <style>
    /* ============================================================
       SPARKLE DESIGN SYSTEM
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font: 'Press Start 2P', monospace;
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122e;
      --bg-tertiary: #0f0f2a;
      --bg-input: #0a0a1a;
      --accent: #ff6b9d;
      --accent2: #ffd93d;
      --accent3: #6bcbff;
      --accent4: #a66cff;
      --accent-hover: #ff8ab3;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.3);
      --border: #ff6b9d;
      --success: #6bcbff;
      --error: #ff6b9d;
      --glow: 0 0 20px rgba(255, 107, 157, 0.3);
      --glow-strong: 0 0 40px rgba(255, 107, 157, 0.5);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg-primary);
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(3px, 1vw, 8px);
      touch-action: manipulation;
    }

    /* ============================================================
       PARTICLE CANVAS — Background magic
       ============================================================ */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================================================
       APP — Glowing container
       ============================================================ */
    .app {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--glow-strong), inset 0 0 60px rgba(255, 107, 157, 0.05);
      position: relative;
      z-index: 1;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      animation: borderPulse 3s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%,
      100% {
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(255, 107, 157, 0.3), inset 0 0 60px rgba(255, 107, 157, 0.03);
      }
      33% {
        border-color: var(--accent2);
        box-shadow: 0 0 30px rgba(255, 217, 61, 0.3), inset 0 0 60px rgba(255, 217, 61, 0.03);
      }
      66% {
        border-color: var(--accent3);
        box-shadow: 0 0 30px rgba(107, 203, 255, 0.3), inset 0 0 60px rgba(107, 203, 255, 0.03);
      }
    }

    /* ============================================================
       HEADER — Glowing
       ============================================================ */
    .header {
      padding: clamp(6px, 1.2vw, 10px) clamp(8px, 1.5vw, 14px);
      background: var(--bg-input);
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(4px, 1vw, 8px);
      flex-shrink: 0;
      min-height: clamp(40px, 6vh, 48px);
      position: relative;
      overflow: visible;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent4), var(--accent));
      background-size: 200% 100%;
      animation: rainbowLine 4s linear infinite;
      filter: blur(2px);
    }

    @keyframes rainbowLine {
      0% {
        background-position: 0% 0%;
      }
      100% {
        background-position: 200% 0%;
      }
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.8vw, 8px);
      flex-shrink: 0;
    }

    .header-brand .logo {
      font-size: clamp(0.6rem, 1.8vw, 0.9rem);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    .header-brand .title {
      font-size: clamp(0.4rem, 1.2vw, 0.65rem);
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
      white-space: nowrap;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3), var(--accent4));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%,
      100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 8px);
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    /* ============================================================
       STATUS BADGE — Glowing
       ============================================================ */
    .status-badge {
      display: flex;
      align-items: center;
      gap: clamp(2px, 0.4vw, 4px);
      padding: clamp(2px, 0.4vw, 4px) clamp(5px, 1vw, 10px);
      background: var(--bg-primary);
      border: 2px solid var(--success);
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      white-space: nowrap;
      flex-shrink: 0;
      min-height: clamp(20px, 3.5vh, 28px);
      min-width: clamp(28px, 5vw, 40px);
      justify-content: center;
      box-shadow: 0 0 15px rgba(107, 203, 255, 0.2);
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%,
      100% {
        box-shadow: 0 0 15px rgba(107, 203, 255, 0.2);
      }
      50% {
        box-shadow: 0 0 30px rgba(107, 203, 255, 0.4);
      }
    }

    .status-badge .dot {
      width: clamp(5px, 0.8vw, 7px);
      height: clamp(5px, 0.8vw, 7px);
      background: var(--success);
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(107, 203, 255, 0.6);
      animation: dotPulse 1s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%,
      100% {
        box-shadow: 0 0 10px rgba(107, 203, 255, 0.6);
      }
      50% {
        box-shadow: 0 0 20px rgba(107, 203, 255, 0.9);
      }
    }

    .status-badge .dot.off {
      background: var(--error);
      box-shadow: 0 0 10px rgba(255, 107, 157, 0.6);
      animation: blink 0.8s infinite;
    }

    /* ============================================================
       AUTH — Glowing inputs
       ============================================================ */
    .auth {
      display: flex;
      gap: clamp(3px, 0.6vw, 6px);
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    .auth-input {
      padding: clamp(4px, 0.8vw, 6px) clamp(6px, 1vw, 10px);
      border: 2px solid var(--border);
      background: var(--bg-primary);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      width: clamp(50px, 12vw, 70px);
      transition: 0.3s;
      min-height: clamp(24px, 4vh, 32px);
      flex: 1 1 auto;
      min-width: 40px;
      max-width: 80px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
      box-shadow: 0 0 10px rgba(255, 107, 157, 0.1);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent2);
      width: clamp(60px, 15vw, 80px);
      box-shadow: 0 0 30px rgba(255, 217, 61, 0.3);
    }

    .auth-input::placeholder {
      color: var(--text-dim);
      font-size: clamp(0.25rem, 0.5vw, 0.3rem);
    }

    /* ============================================================
       BUTTONS — Glowing
       ============================================================ */
    .btn {
      padding: clamp(4px, 0.8vw, 8px) clamp(8px, 1.5vw, 14px);
      border: 2px solid var(--border);
      background: var(--accent);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      min-height: clamp(24px, 4vh, 32px);
      min-width: clamp(32px, 6vw, 44px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      border-radius: 0;
      box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      transition: 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.95);
      box-shadow: 0 0 40px rgba(255, 107, 157, 0.6);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn--danger {
      background: var(--error);
      border-color: var(--error);
      box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
    }

    .btn--join {
      background: linear-gradient(135deg, var(--accent), var(--accent4));
      border-color: var(--accent4);
      box-shadow: 0 0 30px rgba(166, 108, 255, 0.4);
    }

    .btn--join:hover:not(:disabled) {
      box-shadow: 0 0 50px rgba(166, 108, 255, 0.6);
    }

    /* ============================================================
       MESSAGES — Sparkling background
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: clamp(6px, 1vw, 10px) clamp(8px, 1.5vw, 14px);
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.4vw, 4px);
      background: var(--bg-tertiary);
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      will-change: scroll-position;
      overscroll-behavior: contain;
      position: relative;
    }

    .messages::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 107, 157, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--bg-input);
    }

    .messages::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent), var(--accent2), var(--accent3));
      border: 1px solid var(--bg-input);
      border-radius: 0;
    }

    .status-msg {
      text-align: center;
      font-size: clamp(0.3rem, 0.7vw, 0.4rem);
      opacity: 0.4;
      padding: clamp(12px, 2vw, 20px) clamp(6px, 1vw, 12px);
      font-style: italic;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    /* ============================================================
       MESSAGE BUBBLES — Glowing
       ============================================================ */
    .msg {
      padding: clamp(4px, 0.7vw, 8px) clamp(8px, 1.2vw, 14px);
      border: 2px solid var(--text);
      max-width: clamp(82%, 85%, 92%);
      word-wrap: break-word;
      animation: sparkleIn 0.3s steps(2);
      line-height: 1.5;
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      position: relative;
      transition: 0.3s;
    }

    .msg::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 2px solid transparent;
      border-radius: 0;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }

    .msg:hover::before {
      opacity: 1;
      box-shadow: 0 0 30px rgba(255, 107, 157, 0.2);
    }

    @keyframes sparkleIn {
      0% {
        opacity: 0;
        transform: scale(0.95) rotate(-1deg);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.03) rotate(0.5deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    .msg.own {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent4));
      border-color: var(--accent4);
      border-bottom-right-radius: 0;
      box-shadow: 0 0 30px rgba(255, 107, 157, 0.2);
    }

    .msg.other {
      align-self: flex-start;
      background: var(--bg-primary);
      border-color: #2a2a4e;
      border-bottom-left-radius: 0;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
    }

    .msg .sender {
      font-size: clamp(0.25rem, 0.5vw, 0.35rem);
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 0.5px;
      margin-bottom: clamp(1px, 0.2vw, 3px);
      color: var(--accent2);
      text-shadow: 0 0 10px rgba(255, 217, 61, 0.3);
    }

    .msg.own .sender {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .msg .time {
      font-size: clamp(0.2rem, 0.4vw, 0.3rem);
      opacity: 0.5;
      margin-left: clamp(3px, 0.5vw, 6px);
    }

    .msg .text {
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      word-break: break-word;
      line-height: 1.6;
    }

    /* ============================================================
       INPUT — Glowing
       ============================================================ */
    .input-area {
      padding: clamp(5px, 0.8vw, 8px) clamp(8px, 1.5vw, 14px) clamp(8px, 1.5vw, 14px);
      background: var(--bg-input);
      border-top: 2px solid var(--border);
      flex-shrink: 0;
      padding-bottom: calc(clamp(8px, 1.5vw, 14px) + var(--safe-bottom));
      position: relative;
    }

    .input-area::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent4), var(--accent));
      background-size: 200% 100%;
      animation: rainbowLine 4s linear infinite;
      filter: blur(2px);
    }

    .row {
      display: flex;
      gap: clamp(4px, 0.8vw, 8px);
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: clamp(6px, 1vw, 10px) clamp(8px, 1.2vw, 14px);
      border: 2px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      min-width: 40px;
      transition: 0.3s;
      min-height: clamp(32px, 5vh, 40px);
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
      box-shadow: 0 0 10px rgba(255, 107, 157, 0.05);
    }

    .row input:focus {
      outline: none;
      border-color: var(--accent2);
      box-shadow: 0 0 30px rgba(255, 217, 61, 0.2), inset 0 0 30px rgba(255, 217, 61, 0.05);
    }

    .row input::placeholder {
      color: rgba(255, 255, 255, 0.15);
      font-size: clamp(0.3rem, 0.6vw, 0.35rem);
    }

    .row .btn {
      font-size: clamp(0.35rem, 0.8vw, 0.45rem);
      padding: clamp(6px, 1vw, 10px) clamp(10px, 1.8vw, 18px);
      min-height: clamp(32px, 5vh, 40px);
      flex-shrink: 0;
    }

    .row .btn--send {
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      border-color: var(--accent3);
      box-shadow: 0 0 30px rgba(107, 203, 255, 0.3);
      color: var(--bg-primary);
    }

    .row .btn--send:hover:not(:disabled) {
      box-shadow: 0 0 50px rgba(107, 203, 255, 0.5);
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 360px) {
      .header {
        padding: 4px 6px;
        min-height: 32px;
        gap: 3px;
      }
      .header-brand .title {
        font-size: 0.35rem;
      }
      .header-brand .logo {
        font-size: 0.5rem;
      }
      .auth-input {
        font-size: 0.25rem;
        padding: 2px 4px;
        min-height: 18px;
        width: 40px;
        max-width: 50px;
      }
      .auth-input:focus {
        width: 50px;
      }
      .btn {
        font-size: 0.25rem;
        padding: 2px 6px;
        min-height: 18px;
        min-width: 24px;
      }
      .status-badge {
        font-size: 0.25rem;
        padding: 2px 4px;
        min-height: 18px;
        min-width: 20px;
      }
      .status-badge .dot {
        width: 4px;
        height: 4px;
      }
      .messages {
        padding: 4px 6px;
        gap: 2px;
      }
      .msg {
        padding: 2px 6px;
        max-width: 95%;
        font-size: 0.3rem;
      }
      .msg .sender {
        font-size: 0.2rem;
      }
      .msg .text {
        font-size: 0.3rem;
        line-height: 1.3;
      }
      .input-area {
        padding: 3px 6px 6px;
      }
      .row input {
        font-size: 0.3rem;
        padding: 4px 6px;
        min-height: 24px;
      }
      .row .btn {
        font-size: 0.3rem;
        padding: 4px 8px;
        min-height: 24px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .app {
        max-height: 95vh;
      }
      .header {
        padding: 4px 10px;
        min-height: 32px;
      }
      .header-brand .title {
        font-size: 0.4rem;
      }
      .messages {
        padding: 4px 8px;
        gap: 2px;
      }
      .msg {
        padding: 2px 8px;
        max-width: 90%;
        font-size: 0.35rem;
      }
      .msg .sender {
        font-size: 0.25rem;
        margin-bottom: 1px;
      }
      .msg .text {
        font-size: 0.35rem;
        line-height: 1.3;
      }
      .input-area {
        padding: 3px 8px 6px;
      }
      .row input {
        min-height: 24px;
        padding: 4px 8px;
        font-size: 0.35rem;
      }
      .row .btn {
        min-height: 24px;
        padding: 4px 10px;
        font-size: 0.35rem;
      }
      .auth-input {
        min-height: 18px;
        font-size: 0.3rem;
        padding: 2px 6px;
      }
      .btn {
        min-height: 18px;
        font-size: 0.3rem;
        padding: 2px 8px;
      }
      .status-badge {
        font-size: 0.3rem;
        padding: 2px 6px;
        min-height: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== PARTICLES BACKGROUND ===== -->
  <canvas id="particles"></canvas>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-brand">
        <span class="logo" aria-hidden="true">✨</span>
        <h1 class="title"><span>SPARKLE</span></h1>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" class="auth-input" id="nameInput" placeholder="NAME" maxlength="20" inputmode="text" autocomplete="off" aria-label="Username" />
          <button class="btn btn--join" id="joinBtn" aria-label="Join chat">✨ JOIN</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none" aria-label="Leave chat">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer" role="log" aria-live="polite">
      <div class="status-msg">✨ CONNECTING...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area">
      <div class="row">
        <input type="text" class="input-field" id="messageInput" placeholder="TYPE..." disabled inputmode="text" autocomplete="off" aria-label="Message input" />
        <button class="btn btn--send" id="sendBtn" disabled aria-label="Send message">✨ SEND</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE SDK
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * SPARKLE CHAT — Magical & Merry
     * ============================================================
     */

    // ============================================================
    // 1. PARTICLES SYSTEM
    // ============================================================

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let stars = [];
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Create stars (twinkling background)
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random(),
        speed: 0.01 + Math.random() * 0.02,
      });
    }

    // Create floating particles
    const colors = ['#ff6b9d', '#ffd93d', '#6bcbff', '#a66cff', '#ff8ab3', '#ffb347'];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 3 + 1,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5 - 0.2,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: Math.random() * 100 + 50,
        maxLife: Math.random() * 100 + 50,
        glow: Math.random() * 10 + 5,
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, w, h);

      // Draw stars
      stars.forEach(s => {
        s.a += s.speed;
        const alpha = Math.sin(s.a) * 0.5 + 0.5;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
        ctx.fill();
      });

      // Draw particles
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.life--;

        if (p.life <= 0 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          p.x = Math.random() * w;
          p.y = h;
          p.life = p.maxLife;
          p.speedX = (Math.random() - 0.5) * 0.5;
          p.speedY = -Math.random() * 0.5 - 0.2;
          p.color = colors[Math.floor(Math.random() * colors.length)];
        }

        const alpha = p.life / p.maxLife;
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.glow);
        gradient.addColorStop(0, p.color + '80');
        gradient.addColorStop(1, p.color + '00');

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.glow * alpha;
        ctx.fill();

        // Glow trail
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.glow * alpha * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 0;
        ctx.fill();
      });

      requestAnimationFrame(drawParticles);
    }

    drawParticles();

    // ============================================================
    // 2. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 3. DOM REFS
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 4. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let statusTimeout = null;

    // ============================================================
    // 5. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;

      if (statusTimeout) {
        clearTimeout(statusTimeout);
        statusTimeout = null;
      }

      if (on) {
        status('✨ CONNECTED ✨');
        statusTimeout = setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === '✨ CONNECTED ✨') clearStatus();
          statusTimeout = null;
        }, 1200);
      } else {
        status('🌀 RECONNECTING...');
      }
    };

    // ============================================================
    // 6. SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) {
        alert('✨ SIGN IN FIRST! ✨');
        return;
      }
      if (!text || !text.trim()) return;
      if (!connected) {
        alert('🌀 WAITING FOR CONNECTION...');
        return;
      }

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('✨ FAILED TO SEND ✨'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 7. RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      // Sparkle emojis for random messages
      const sparkles = ['✨', '🌟', '⭐', '💫', '🌈', '🎆', '🎇'];
      const sparkle = sparkles[Math.floor(Math.random() * sparkles.length)];

      el.innerHTML = `
        <div class="sender">
          ${isOwn ? '💫 ' : ''}${data.name || 'ANON'} ${isOwn ? '💫' : ''}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === '✨ CONNECTED ✨' || st.textContent === '🌀 RECONNECTING...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 8. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      listeners.forEach(ref => ref.off());
      listeners = [];

      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);

        if (on && user) {
          const users = db.ref('users');
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === '🌀 RECONNECTING...' || st.textContent === '✨ CONNECTED ✨') {
            status('💫 NO MESSAGES YET ✨');
          }
        }
      });
    };

    // ============================================================
    // 9. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'STAR';
      const name = raw.toUpperCase().slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `✨ MSG AS ${name} ✨`;

      clearStatus();
      status(`🌟 ${name} JOINED ✨`);

      subscribe();

      if (connected) {
        const users = db.ref('users');
        const ref = users.child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `🌟 ${name} JOINED ✨`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'TYPE...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('💫 LEFT CHAT ✨');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 10. EVENTS
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // Touch feedback
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.95)';
      }, { passive: true });

      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    DOM.messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        DOM.messageInput.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }, 300);
    });

    // ============================================================
    // 11. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('✨ SPARKLE CHAT — MERRY & MAGICAL ✨');
    console.log('📡 Database:', firebase.app().options.databaseURL);
    console.log('🌟 Particles:', particles.length);
    console.log('⭐ Stars:', stars.length);
  </script>

</body>
</html>
