<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel Chat</title>
  <style>
    /* ============================================================
       PIXEL DESIGN SYSTEM
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(4px, 1vw, 12px);
    }

    /* ============================================================
       APP — Fits all screens
       ============================================================ */
    .app {
      width: 100%;
      max-width: min(700px, 100%);
      height: min(95vh, 800px, calc(100vh - 16px));
      background: #16213e;
      border: 2px solid #e94560;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      padding: clamp(8px, 1.5vw, 16px) clamp(12px, 2vw, 20px);
      background: #0f0e17;
      border-bottom: 2px solid #e94560;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(4px, 1vw, 10px);
      flex-shrink: 0;
      min-height: clamp(44px, 6vh, 56px);
    }

    .header h1 {
      font-size: clamp(0.5rem, 1.5vw, 0.85rem);
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .header h1 span {
      color: #e94560;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 14px);
      flex-wrap: wrap;
      flex: 1 1 auto;
      justify-content: flex-end;
    }

    /* ============================================================
       STATUS
       ============================================================ */
    .status-badge {
      display: flex;
      align-items: center;
      gap: clamp(3px, 0.5vw, 6px);
      padding: clamp(3px, 0.5vw, 6px) clamp(6px, 1vw, 12px);
      background: #1a1a2e;
      border: 2px solid #4caf50;
      font-size: clamp(0.35rem, 1vw, 0.5rem);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-badge .dot {
      width: clamp(6px, 1vw, 8px);
      height: clamp(6px, 1vw, 8px);
      background: #4caf50;
      display: inline-block;
      flex-shrink: 0;
    }

    .status-badge .dot.off {
      background: #e94560;
      animation: blink 0.8s infinite;
    }

    /* ============================================================
       AUTH
       ============================================================ */
    .auth {
      display: flex;
      gap: clamp(4px, 0.8vw, 8px);
      align-items: center;
      flex-wrap: wrap;
    }

    .auth input {
      padding: clamp(3px, 0.6vw, 6px) clamp(6px, 1vw, 12px);
      border: 2px solid #e94560;
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.35rem, 0.9vw, 0.5rem);
      width: clamp(60px, 12vw, 100px);
      transition: 0.2s;
      min-height: clamp(22px, 3.5vh, 30px);
    }

    .auth input:focus {
      outline: none;
      border-color: #ff6b81;
      width: clamp(70px, 15vw, 130px);
    }

    .auth input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .auth input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: clamp(3px, 0.6vw, 6px) clamp(8px, 1.2vw, 16px);
      border: 2px solid #e94560;
      background: #e94560;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.35rem, 0.9vw, 0.5rem);
      cursor: pointer;
      transition: 0.1s;
      text-transform: uppercase;
      min-height: clamp(22px, 3.5vh, 30px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) {
      background: #ff6b81;
      transform: translate(-2px, -2px);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn--danger {
      background: #e94560;
      border-color: #e94560;
    }

    .btn--danger:hover:not(:disabled) {
      background: #ff6b81;
      border-color: #ff6b81;
    }

    /* ============================================================
       MESSAGES
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: clamp(8px, 1.5vw, 16px);
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.5vw, 6px);
      background: #12122a;
      min-height: 0;
    }

    .messages::-webkit-scrollbar {
      width: clamp(4px, 0.6vw, 6px);
    }

    .messages::-webkit-scrollbar-track {
      background: #0f0e17;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #e94560;
      border: 2px solid #0f0e17;
    }

    .status-msg {
      text-align: center;
      font-size: clamp(0.35rem, 0.8vw, 0.5rem);
      opacity: 0.4;
      padding: clamp(12px, 2vw, 24px);
      font-style: italic;
    }

    /* ============================================================
       MESSAGE
       ============================================================ */
    .msg {
      padding: clamp(4px, 0.8vw, 10px) clamp(8px, 1.2vw, 16px);
      border: 2px solid #ffffff;
      max-width: clamp(75%, 82%, 88%);
      word-wrap: break-word;
      animation: fadeIn 0.2s steps(2);
      line-height: 1.6;
    }

    .msg.own {
      align-self: flex-end;
      background: #e94560;
      border-color: #ff6b81;
      border-bottom-right-radius: 0;
    }

    .msg.other {
      align-self: flex-start;
      background: #1a1a2e;
      border-color: #12122a;
      border-bottom-left-radius: 0;
    }

    .msg .sender {
      font-size: clamp(0.3rem, 0.7vw, 0.45rem);
      text-transform: uppercase;
      opacity: 0.7;
      letter-spacing: 1px;
      margin-bottom: clamp(2px, 0.3vw, 4px);
    }

    .msg .time {
      font-size: clamp(0.25rem, 0.5vw, 0.35rem);
      opacity: 0.4;
      margin-left: clamp(3px, 0.5vw, 6px);
    }

    .msg .text {
      font-size: clamp(0.4rem, 0.9vw, 0.6rem);
      word-break: break-word;
      line-height: 1.8;
    }

    /* ============================================================
       INPUT
       ============================================================ */
    .input-area {
      padding: clamp(6px, 1vw, 14px) clamp(10px, 1.5vw, 18px) clamp(10px, 1.5vw, 18px);
      background: #0f0e17;
      border-top: 2px solid #e94560;
      flex-shrink: 0;
    }

    .row {
      display: flex;
      gap: clamp(4px, 0.8vw, 10px);
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: clamp(6px, 1vw, 12px) clamp(8px, 1.2vw, 16px);
      border: 2px solid #e94560;
      background: #12122a;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.35rem, 0.8vw, 0.55rem);
      min-width: 40px;
      transition: 0.2s;
      min-height: clamp(28px, 4vh, 38px);
    }

    .row input:focus {
      outline: none;
      border-color: #ff6b81;
    }

    .row input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: clamp(0.35rem, 0.8vw, 0.55rem);
      padding: clamp(6px, 1vw, 12px) clamp(10px, 1.5vw, 20px);
      min-height: clamp(28px, 4vh, 38px);
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       ULTRA SMALL SCREENS (under 400px)
       ============================================================ */
    @media (max-width: 400px) {
      .header {
        padding: 6px 10px;
        min-height: 38px;
      }

      .header h1 {
        font-size: 0.45rem;
      }

      .auth input {
        width: 50px;
        font-size: 0.3rem;
        padding: 2px 6px;
        min-height: 18px;
      }

      .auth input:focus {
        width: 60px;
      }

      .btn {
        font-size: 0.3rem;
        padding: 2px 8px;
        min-height: 18px;
      }

      .status-badge {
        font-size: 0.3rem;
        padding: 2px 6px;
      }

      .status-badge .dot {
        width: 5px;
        height: 5px;
      }

      .msg {
        padding: 3px 8px;
        max-width: 95%;
      }

      .msg .sender {
        font-size: 0.25rem;
      }

      .msg .text {
        font-size: 0.35rem;
      }

      .row input {
        font-size: 0.3rem;
        padding: 4px 8px;
        min-height: 22px;
      }

      .row .btn {
        font-size: 0.3rem;
        padding: 4px 8px;
        min-height: 22px;
      }

      .input-area {
        padding: 4px 8px 8px;
      }

      .messages {
        padding: 6px;
      }

      .status-msg {
        font-size: 0.3rem;
        padding: 8px;
      }
    }

    /* ============================================================
       LARGE SCREENS (over 1200px)
       ============================================================ */
    @media (min-width: 1200px) {
      .app {
        max-width: 700px;
        height: 800px;
      }

      .header h1 {
        font-size: 1rem;
      }

      .auth input {
        font-size: 0.55rem;
        padding: 8px 14px;
      }

      .btn {
        font-size: 0.55rem;
        padding: 8px 18px;
      }

      .msg .text {
        font-size: 0.65rem;
      }

      .row input {
        font-size: 0.6rem;
        padding: 12px 18px;
      }

      .row .btn {
        font-size: 0.6rem;
        padding: 12px 22px;
      }
    }

    /* ============================================================
       LANDSCAPE PHONES
       ============================================================ */
    @media (max-height: 500px) and (orientation: landscape) {
      .app {
        height: 92vh;
        max-height: 450px;
      }

      .header {
        padding: 4px 10px;
        min-height: 32px;
      }

      .header h1 {
        font-size: 0.4rem;
      }

      .messages {
        padding: 4px 8px;
        gap: 2px;
      }

      .msg {
        padding: 2px 8px;
        max-width: 90%;
      }

      .msg .sender {
        font-size: 0.25rem;
        margin-bottom: 1px;
      }

      .msg .text {
        font-size: 0.35rem;
        line-height: 1.4;
      }

      .input-area {
        padding: 4px 8px 8px;
      }

      .row input {
        padding: 4px 8px;
        min-height: 20px;
        font-size: 0.3rem;
      }

      .row .btn {
        padding: 4px 10px;
        min-height: 20px;
        font-size: 0.3rem;
      }

      .auth input {
        padding: 2px 6px;
        min-height: 16px;
        font-size: 0.3rem;
        width: 50px;
      }

      .btn {
        padding: 2px 8px;
        min-height: 16px;
        font-size: 0.3rem;
      }

      .status-badge {
        font-size: 0.3rem;
        padding: 2px 6px;
      }

      .status-badge .dot {
        width: 4px;
        height: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <h1>🕹️ <span>PIXEL</span> CHAT</h1>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" id="nameInput" placeholder="NAME" maxlength="20" />
          <button class="btn" id="joinBtn">JOIN</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer">
      <div class="status-msg">🔄 CONNECTING...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area">
      <div class="row">
        <input type="text" id="messageInput" placeholder="TYPE..." disabled />
        <button class="btn" id="sendBtn" disabled>SEND</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * PIXEL CHAT — Optimized for All Screens
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;

    // ============================================================
    // 4. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      setTimeout(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      }, 50);
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;
      if (on) {
        status('✅ CONNECTED');
        setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === '✅ CONNECTED') clearStatus();
        }, 1200);
      } else {
        status('🔄 RECONNECTING...');
      }
    };

    // ============================================================
    // 5. SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) return alert('SIGN IN FIRST!');
      if (!text || !text.trim()) return;
      if (!connected) return alert('WAITING FOR CONNECTION...');

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('FAILED TO SEND.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 6. RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'ANON'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === '✅ CONNECTED' || st.textContent === '🔄 CONNECTING...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 7. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      // Clean up old listeners
      listeners.forEach(ref => ref.off());
      listeners = [];

      // Connection status
      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);

        if (on && user) {
          const users = db.ref('users');
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      // Online users
      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      // Messages
      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      // Initial check
      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === '🔄 CONNECTING...' || st.textContent === '✅ CONNECTED') {
            status('💬 NO MESSAGES YET');
          }
        }
      });
    };

    // ============================================================
    // 8. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'GUEST';
      const name = raw.toUpperCase().slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `MSG AS ${name}...`;

      clearStatus();
      status(`👾 ${name} JOINED`);

      // Re-subscribe with user
      subscribe();

      // Force presence update
      if (connected) {
        const users = db.ref('users');
        const ref = users.child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `👾 ${name} JOINED`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      // Clean up listeners
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'TYPE...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('👋 LEFT CHAT');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 9. EVENTS
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // ============================================================
    // 10. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('🕹️ PIXEL CHAT READY');
    console.log('📡 Database:', firebase.app().options.databaseURL);
  </script>

</body>
</html>
