<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nexus Chat</title>
  <style>
    /* ============================================================
       HI-TECH DESIGN SYSTEM — Premium UI/UX
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font: 'Inter', -apple-system, system-ui, sans-serif;
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122e;
      --bg-tertiary: #0f0f2a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --accent: #6c5ce7;
      --accent2: #00cec9;
      --accent3: #fd79a8;
      --accent4: #fdcb6e;
      --accent-glow: #6c5ce7;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --text-dim: rgba(255, 255, 255, 0.2);
      --border: rgba(255, 255, 255, 0.06);
      --success: #00cec9;
      --error: #fd79a8;
      --radius: 20px;
      --radius-sm: 12px;
      --radius-full: 9999px;
      --glow: 0 0 40px rgba(108, 92, 231, 0.15);
      --glow-strong: 0 0 60px rgba(108, 92, 231, 0.2);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg-primary);
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 1.5vw, 16px);
      touch-action: manipulation;
      background: radial-gradient(ellipse at 50% 0%, #1a1a4e 0%, #0a0a1a 70%);
    }

    /* ============================================================
       ANIMATED BACKGROUND
       ============================================================ */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(108, 92, 231, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 92, 231, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(108, 92, 231, 0.08), transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(0, 206, 201, 0.05), transparent 50%);
      z-index: 0;
      pointer-events: none;
      animation: bgDrift 20s ease-in-out infinite alternate;
    }

    @keyframes bgDrift {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        transform: translate(2%, 1%) rotate(2deg);
      }
    }

    /* ============================================================
       APP — Glassmorphism container
       ============================================================ */
    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 960px;
      background: var(--glass);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--glass-shadow), var(--glow-strong);
      position: relative;
      z-index: 1;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.3), rgba(0, 206, 201, 0.2), rgba(253, 121, 168, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ============================================================
       HEADER — Premium
       ============================================================ */
    .header {
      padding: clamp(12px, 2vw, 18px) clamp(16px, 2.5vw, 24px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: clamp(8px, 1.5vw, 12px);
      flex-shrink: 0;
      min-height: clamp(56px, 8vh, 72px);
      border-bottom: 1px solid var(--glass-border);
      position: relative;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.2vw, 14px);
      flex-shrink: 0;
    }

    .header-brand .logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 30px rgba(108, 92, 231, 0.3);
      flex-shrink: 0;
    }

    .header-brand .title {
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-brand .title .highlight {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 14px);
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    /* ============================================================
       STATUS BADGE — Premium
       ============================================================ */
    .status-badge {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.6vw, 8px);
      padding: clamp(4px, 0.6vw, 8px) clamp(10px, 1.5vw, 16px);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-size: clamp(0.6rem, 1vw, 0.75rem);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: clamp(28px, 4vh, 36px);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-muted);
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(0, 206, 201, 0.4);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%,
      100% {
        box-shadow: 0 0 20px rgba(0, 206, 201, 0.4);
      }
      50% {
        box-shadow: 0 0 40px rgba(0, 206, 201, 0.8);
      }
    }

    .status-badge .dot.off {
      background: var(--error);
      box-shadow: 0 0 20px rgba(253, 121, 168, 0.4);
      animation: blink 0.8s infinite;
    }

    .status-badge .count {
      color: var(--text);
      font-weight: 600;
    }

    /* ============================================================
       AUTH — Premium inputs
       ============================================================ */
    .auth {
      display: flex;
      gap: clamp(6px, 1vw, 10px);
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    .auth-input {
      padding: clamp(6px, 0.8vw, 10px) clamp(10px, 1.5vw, 16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.7rem, 1vw, 0.85rem);
      font-weight: 400;
      width: clamp(80px, 14vw, 110px);
      transition: var(--transition);
      min-height: clamp(32px, 4.5vh, 40px);
      flex: 1 1 auto;
      min-width: 60px;
      max-width: 120px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(108, 92, 231, 0.15);
      width: clamp(90px, 16vw, 140px);
    }

    .auth-input::placeholder {
      color: var(--text-dim);
      font-weight: 300;
    }

    .auth-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ============================================================
       BUTTONS — Premium
       ============================================================ */
    .btn {
      padding: clamp(6px, 0.8vw, 10px) clamp(14px, 2vw, 22px);
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.65rem, 0.9vw, 0.8rem);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      min-height: clamp(32px, 4.5vh, 40px);
      min-width: clamp(40px, 6vw, 56px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
      opacity: 0;
      transition: var(--transition);
    }

    .btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn--danger {
      background: linear-gradient(135deg, var(--error), #e17055);
      box-shadow: 0 4px 20px rgba(253, 121, 168, 0.3);
    }

    .btn--danger:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(253, 121, 168, 0.4);
    }

    .btn--join {
      background: linear-gradient(135deg, var(--accent), #a29bfe);
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.4);
    }

    /* ============================================================
       MESSAGES — Premium scrolling
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: clamp(12px, 1.5vw, 20px) clamp(16px, 2vw, 24px);
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.6vw, 8px);
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      will-change: scroll-position;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: var(--radius-full);
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .status-msg {
      text-align: center;
      font-size: clamp(0.7rem, 1vw, 0.85rem);
      font-weight: 400;
      color: var(--text-muted);
      padding: clamp(20px, 3vw, 40px) clamp(12px, 1.5vw, 20px);
      letter-spacing: 0.3px;
    }

    /* ============================================================
       MESSAGE BUBBLES — Premium
       ============================================================ */
    .msg {
      padding: clamp(8px, 1vw, 14px) clamp(14px, 1.8vw, 22px);
      border-radius: var(--radius-sm);
      max-width: clamp(82%, 85%, 92%);
      word-wrap: break-word;
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.6;
      font-size: clamp(0.8rem, 1.1vw, 0.95rem);
      font-weight: 400;
      position: relative;
      transition: var(--transition);
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg.own {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.2);
    }

    .msg.other {
      align-self: flex-start;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg .sender {
      font-size: clamp(0.55rem, 0.7vw, 0.65rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: clamp(2px, 0.3vw, 4px);
    }

    .msg.own .sender {
      opacity: 0.8;
      color: rgba(255, 255, 255, 0.8);
    }

    .msg .time {
      font-size: clamp(0.45rem, 0.5vw, 0.55rem);
      font-weight: 400;
      opacity: 0.5;
      margin-left: clamp(4px, 0.6vw, 8px);
    }

    .msg .text {
      word-break: break-word;
      line-height: 1.6;
    }

    /* ============================================================
       INPUT — Premium
       ============================================================ */
    .input-area {
      padding: clamp(10px, 1.2vw, 16px) clamp(16px, 2vw, 24px) clamp(14px, 1.8vw, 22px);
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
      padding-bottom: calc(clamp(14px, 1.8vw, 22px) + var(--safe-bottom));
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .row {
      display: flex;
      gap: clamp(8px, 1.2vw, 14px);
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: clamp(10px, 1.2vw, 16px) clamp(16px, 2vw, 24px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(0.8rem, 1.1vw, 0.95rem);
      font-weight: 400;
      min-width: 50px;
      transition: var(--transition);
      min-height: clamp(44px, 6vh, 52px);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .row input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(108, 92, 231, 0.1);
    }

    .row input::placeholder {
      color: var(--text-dim);
      font-weight: 300;
    }

    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: clamp(0.75rem, 1vw, 0.85rem);
      padding: clamp(10px, 1.2vw, 16px) clamp(20px, 2.5vw, 30px);
      min-height: clamp(44px, 6vh, 52px);
      flex-shrink: 0;
    }

    .row .btn--send {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
    }

    .row .btn--send:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(108, 92, 231, 0.5);
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 400px) {
      .header {
        padding: 8px 12px;
        min-height: 48px;
      }
      .header-brand .logo {
        width: 28px;
        height: 28px;
        font-size: 0.9rem;
      }
      .header-brand .title {
        font-size: 0.85rem;
      }
      .auth-input {
        font-size: 0.6rem;
        padding: 4px 8px;
        min-height: 28px;
        width: 60px;
        max-width: 80px;
      }
      .auth-input:focus {
        width: 70px;
      }
      .btn {
        font-size: 0.55rem;
        padding: 4px 10px;
        min-height: 28px;
        min-width: 32px;
      }
      .status-badge {
        font-size: 0.5rem;
        padding: 3px 8px;
        min-height: 24px;
      }
      .status-badge .dot {
        width: 6px;
        height: 6px;
      }
      .messages {
        padding: 8px 10px;
        gap: 3px;
      }
      .msg {
        padding: 6px 10px;
        max-width: 95%;
        font-size: 0.7rem;
      }
      .msg .sender {
        font-size: 0.45rem;
      }
      .msg .text {
        font-size: 0.7rem;
      }
      .input-area {
        padding: 6px 10px 10px;
      }
      .row input {
        font-size: 0.7rem;
        padding: 8px 12px;
        min-height: 36px;
      }
      .row .btn {
        font-size: 0.65rem;
        padding: 8px 14px;
        min-height: 36px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .app {
        max-height: 95vh;
        border-radius: var(--radius-sm);
      }
      .header {
        padding: 6px 12px;
        min-height: 40px;
      }
      .header-brand .logo {
        width: 24px;
        height: 24px;
        font-size: 0.8rem;
      }
      .header-brand .title {
        font-size: 0.75rem;
      }
      .messages {
        padding: 6px 10px;
        gap: 2px;
      }
      .msg {
        padding: 4px 10px;
        max-width: 90%;
        font-size: 0.65rem;
      }
      .msg .sender {
        font-size: 0.4rem;
        margin-bottom: 1px;
      }
      .msg .text {
        font-size: 0.65rem;
        line-height: 1.4;
      }
      .input-area {
        padding: 4px 10px 8px;
      }
      .row input {
        min-height: 28px;
        padding: 6px 12px;
        font-size: 0.65rem;
      }
      .row .btn {
        min-height: 28px;
        padding: 6px 14px;
        font-size: 0.6rem;
      }
      .auth-input {
        min-height: 24px;
        font-size: 0.55rem;
        padding: 3px 8px;
      }
      .btn {
        min-height: 24px;
        font-size: 0.5rem;
        padding: 3px 10px;
      }
      .status-badge {
        font-size: 0.5rem;
        padding: 2px 8px;
        min-height: 22px;
      }
      .status-badge .dot {
        width: 5px;
        height: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== BACKGROUND ===== -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="header-brand">
        <div class="logo">✦</div>
        <h1 class="title"><span class="highlight">Nexus</span> Chat</h1>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" class="auth-input" id="nameInput" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" aria-label="Username" />
          <button class="btn btn--join" id="joinBtn" aria-label="Join chat">Join</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none" aria-label="Leave chat">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer" role="log" aria-live="polite">
      <div class="status-msg">Connecting...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area">
      <div class="row">
        <input type="text" class="input-field" id="messageInput" placeholder="Type a message..." disabled inputmode="text" autocomplete="off" aria-label="Message input" />
        <button class="btn btn--send" id="sendBtn" disabled aria-label="Send message">Send</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE SDK
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * NEXUS CHAT — Hi-Tech Modern
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM REFS
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let statusTimeout = null;

    // ============================================================
    // 4. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;

      if (statusTimeout) {
        clearTimeout(statusTimeout);
        statusTimeout = null;
      }

      if (on) {
        status('Connected');
        statusTimeout = setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === 'Connected') clearStatus();
          statusTimeout = null;
        }, 1200);
      } else {
        status('Reconnecting...');
      }
    };

    // ============================================================
    // 5. SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) {
        alert('Please sign in first!');
        return;
      }
      if (!text || !text.trim()) return;
      if (!connected) {
        alert('Waiting for connection...');
        return;
      }

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('Failed to send.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 6. RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'Anonymous'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === 'Connected' || st.textContent === 'Reconnecting...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 7. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      listeners.forEach(ref => ref.off());
      listeners = [];

      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);

        if (on && user) {
          const users = db.ref('users');
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === 'Reconnecting...' || st.textContent === 'Connected') {
            status('No messages yet');
          }
        }
      });
    };

    // ============================================================
    // 8. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'User';
      const name = raw.slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `Message as ${name}...`;

      clearStatus();
      status(`${name} joined`);

      subscribe();

      if (connected) {
        const users = db.ref('users');
        const ref = users.child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `${name} joined`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'Type a message...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('Left chat');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 9. EVENTS
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // Touch feedback
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.97)';
      }, { passive: true });

      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    DOM.messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        DOM.messageInput.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }, 300);
    });

    // ============================================================
    // 10. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('✦ NEXUS CHAT — HI-TECH MODERN ✦');
    console.log('📡 Database:', firebase.app().options.databaseURL);
  </script>

</body>
</html>
