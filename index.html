<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRON BLOG - Chat Multimedia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --dark-bg: #000000;
            --glass: rgba(0, 255, 255, 0.05);
            --glass-strong: rgba(0, 255, 255, 0.1);
            --border-glow: rgba(0, 240, 255, 0.3);
            --accent: #00f0ff;
            --text: #ffffff;
            --text-muted: #999999;
            --danger: #ff0033;
            --success: #00ff88;
            --gradient-main: linear-gradient(135deg, #00f0ff, #0088ff, #ff00ff);
            --shadow-neon: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.3);
            --shadow-neon-strong: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 50px rgba(0, 240, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            background: var(--dark-bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        /* ===== BACKGROUND ===== */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0; pointer-events: none;
            animation: gridMove 15s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 30px 30px; }
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg, rgba(0, 0, 0, 0.06) 0px, rgba(0, 0, 0, 0.06) 1px,
                transparent 1px, transparent 3px
            );
            z-index: 1; pointer-events: none;
        }

        .aurora {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
            background:
                radial-gradient(circle at 30% 20%, rgba(0, 240, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255, 0, 255, 0.06) 0%, transparent 40%);
            animation: auroraShift 8s ease-in-out infinite;
        }

        @keyframes auroraShift { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        .particles-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .particle {
            position: absolute; width: 3px; height: 3px;
            background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
        }

        .particle-burst { position: fixed; pointer-events: none; z-index: 999; }

        .burst-particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            animation: burstFly 1s ease-out forwards;
        }

        @keyframes burstFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.5s; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse { animation: pulse 0.5s; }

        /* ===== HEADER ===== */
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0, 0, 0, 0.92);
            border-bottom: 1px solid var(--border-glow);
            padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 5px 30px rgba(0, 240, 255, 0.1);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px; font-weight: 900; letter-spacing: 3px;
            background: var(--gradient-main);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; cursor: pointer;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--accent); font-size: 16px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s;
        }

        .icon-btn:active {
            background: var(--accent); color: #000000;
            box-shadow: var(--shadow-neon); transform: scale(0.9);
        }

        /* ===== MENU ===== */
        .mobile-menu {
            position: fixed; top: 0; right: -100%;
            width: 80%; height: 100vh;
            background: rgba(0, 0, 0, 0.97); z-index: 99;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 70px 15px 20px;
            border-left: 1px solid var(--border-glow);
            box-shadow: -10px 0 50px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(20px); overflow-y: auto;
        }

        .mobile-menu.active { right: 0; }

        .mobile-menu a {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 15px; color: #cccccc; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.08);
            transition: all 0.3s; cursor: pointer; border-radius: 10px;
        }

        .mobile-menu a:active {
            color: var(--accent); background: rgba(0, 240, 255, 0.08); padding-left: 20px;
        }

        .menu-icon { font-size: 20px; width: 30px; text-align: center; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 98; display: none;
            backdrop-filter: blur(3px);
        }
        .overlay.active { display: block; }

        /* ===== MAIN ===== */
        main {
            position: relative; z-index: 2; padding-top: 62px;
            min-height: 100vh; padding-left: 15px; padding-right: 15px;
            padding-bottom: 80px;
        }

        .hero { text-align: center; padding: 35px 0 25px; }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900; letter-spacing: 6px;
            background: var(--gradient-main);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 10px;
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)); }
        }

        .hero .subtitle {
            font-size: 11px; letter-spacing: 4px;
            color: var(--accent); text-shadow: 0 0 10px var(--accent);
        }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow); border-radius: 20px;
            margin-bottom: 15px; font-size: 10px; color: #666666; letter-spacing: 1px;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite; display: inline-block; margin-right: 5px;
        }

        .clock-display {
            text-align: center; padding: 12px;
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border-glow);
            border-radius: 15px; margin-bottom: 15px;
        }

        .clock-time {
            font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900;
            color: var(--accent); text-shadow: 0 0 20px var(--accent);
        }

        .clock-date { font-size: 10px; color: #666666; letter-spacing: 2px; margin-top: 3px; }

        /* ===== TABS ===== */
        .tabs {
            display: flex; gap: 5px; margin-bottom: 15px;
            overflow-x: auto; white-space: nowrap;
        }

        .tab-btn {
            flex: 1; min-width: 100px; padding: 10px 12px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-glow); color: #cccccc;
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px;
            cursor: pointer; border-radius: 15px; transition: all 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent); color: #000000;
            border-color: var(--accent); box-shadow: var(--shadow-neon);
        }

        .tab-btn:active { transform: scale(0.9); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== BLOG ===== */
        .search-bar { display: flex; gap: 8px; margin-bottom: 15px; }

        .search-bar input {
            flex: 1; padding: 12px 18px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border-glow);
            color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 14px;
            outline: none; transition: all 0.3s; border-radius: 25px;
        }

        .search-bar input:focus { border-color: var(--accent); box-shadow: var(--shadow-neon); }

        .search-bar button {
            padding: 12px 20px; background: var(--gradient-main); color: #000000;
            font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 1px;
            border: none; cursor: pointer; border-radius: 25px; font-weight: 700;
            box-shadow: var(--shadow-neon);
        }

        .blog-grid { display: grid; gap: 15px; margin-bottom: 20px; }

        .blog-card {
            border: 1px solid var(--border-glow); background: var(--glass);
            transition: all 0.3s; cursor: pointer; position: relative;
            overflow: hidden; border-radius: 15px; backdrop-filter: blur(10px);
        }

        .blog-card:active {
            box-shadow: var(--shadow-neon-strong); border-color: var(--accent);
            transform: scale(0.97);
        }

        .blog-card-image {
            width: 100%; height: 140px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05), rgba(255, 0, 255, 0.1));
            display: flex; justify-content: center; align-items: center;
            font-size: 45px; color: var(--accent); text-shadow: 0 0 25px var(--accent);
            border-bottom: 1px solid var(--border-glow);
        }

        .blog-card-content { padding: 12px; }

        .blog-card-tag {
            display: inline-block; padding: 4px 10px;
            background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent);
            color: var(--accent); font-family: 'Orbitron', sans-serif;
            font-size: 8px; letter-spacing: 2px; margin-bottom: 8px; border-radius: 12px;
        }

        .blog-card h2 {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            letter-spacing: 1px; color: #ffffff; margin-bottom: 6px; line-height: 1.3;
        }

        .blog-card-excerpt {
            font-size: 11px; color: var(--text-muted); line-height: 1.5;
            margin-bottom: 8px; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .blog-card-meta {
            display: flex; justify-content: space-between;
            font-size: 9px; color: #555555; letter-spacing: 1px;
            padding-top: 8px; border-top: 1px solid rgba(0, 240, 255, 0.08);
        }

        .blog-card-meta .author { color: var(--accent); }

        .empty-state {
            text-align: center; padding: 40px 20px;
            border: 2px dashed var(--border-glow); color: #555555;
            font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 2px;
            border-radius: 15px; animation: pulseBorder 2s ease-in-out infinite;
        }

        @keyframes pulseBorder {
            0%, 100% { border-color: var(--border-glow); }
            50% { border-color: var(--accent); }
        }

        .empty-icon { font-size: 45px; margin-bottom: 12px; animation: floatIcon 3s ease-in-out infinite; }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== ARTICLE ===== */
        .article-view { display: none; margin-bottom: 20px; }
        .article-view.active { display: block; animation: slideIn 0.4s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .back-to-blog {
            display: inline-block; padding: 10px 18px;
            background: transparent; border: 1px solid var(--accent);
            color: var(--accent); font-family: 'Orbitron', sans-serif;
            font-size: 10px; letter-spacing: 2px; cursor: pointer;
            margin-bottom: 15px; border-radius: 20px;
        }

        .article-header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 18px; letter-spacing: 2px;
            background: var(--gradient-main);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 12px; text-align: center; line-height: 1.4;
        }

        .article-image {
            width: 100%; height: 160px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
            display: flex; justify-content: center; align-items: center;
            font-size: 55px; color: var(--accent); text-shadow: 0 0 25px var(--accent);
            margin-bottom: 15px; border: 1px solid var(--border-glow); border-radius: 15px;
        }

        .article-content {
            font-size: 13px; line-height: 1.7; color: #cccccc;
            padding: 15px; border: 1px solid var(--border-glow);
            border-radius: 15px; background: var(--glass);
        }

        /* ===== CHAT ===== */
        .chat-section {
            border: 1px solid var(--border-glow); border-radius: 15px;
            padding: 12px; background: var(--glass); margin-bottom: 15px;
        }

        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

        .chat-header h3 {
            font-family: 'Orbitron', sans-serif; font-size: 11px;
            letter-spacing: 2px; color: var(--accent);
        }

        .chat-online { font-size: 8px; color: var(--success); letter-spacing: 1px; }

        .chat-messages {
            height: 350px; overflow-y: auto;
            border: 1px solid var(--border-glow); border-radius: 10px;
            padding: 8px; margin-bottom: 8px;
        }

        .chat-msg { margin-bottom: 10px; }

        .chat-msg .msg-name {
            font-family: 'Orbitron', sans-serif; font-size: 8px;
            letter-spacing: 1px; color: var(--accent); margin-bottom: 3px;
        }

        .chat-msg .msg-text {
            font-size: 11px; color: #cccccc; line-height: 1.5;
            background: rgba(0, 0, 0, 0.4); padding: 8px 10px;
            border-radius: 10px; display: inline-block;
        }

        .chat-msg.own .msg-name { color: var(--success); text-align: right; }
        .chat-msg.own .msg-text { background: rgba(0, 255, 136, 0.1); }

        /* ===== CHAT AUDIO ===== */
        .chat-msg .msg-audio {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 8px 15px;
            cursor: pointer;
            min-width: 180px;
            max-width: 250px;
        }

        .chat-msg .msg-audio .audio-icon {
            font-size: 20px;
            color: var(--accent);
        }

        .chat-msg .msg-audio .audio-bar {
            flex: 1;
            height: 4px;
            background: rgba(0, 240, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .chat-msg .msg-audio .audio-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent);
            width: 0%;
            transition: width 0.1s;
        }

        .chat-msg .msg-audio .audio-duration {
            font-size: 9px;
            color: #cccccc;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* ===== CHAT IMAGE ===== */
        .chat-msg .msg-image {
            max-width: 180px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            cursor: pointer;
            display: block;
        }

        /* ===== CHAT INPUT ===== */
        .chat-input-row { display: flex; gap: 5px; align-items: center; }

        .chat-input-row input {
            flex: 1; padding: 10px 14px;
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border-glow);
            color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 12px;
            outline: none; border-radius: 20px;
        }

        .chat-input-row button {
            padding: 10px 15px; background: var(--gradient-main);
            color: #000000; font-family: 'Orbitron', sans-serif;
            font-size: 10px; letter-spacing: 1px; border: none;
            cursor: pointer; border-radius: 20px; font-weight: 700;
            white-space: nowrap;
        }

        .chat-attach-btn {
            width: 35px; height: 35px; border-radius: 50%;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--accent); font-size: 14px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s; flex-shrink: 0;
        }

        .chat-attach-btn:active {
            background: var(--accent); color: #000000;
            box-shadow: var(--shadow-neon); transform: scale(0.9);
        }

        .chat-attach-btn.recording {
            background: var(--danger); color: #ffffff;
            border-color: var(--danger);
            box-shadow: 0 0 20px var(--danger);
            animation: pulse 0.5s infinite;
        }

        /* ===== RECORDING INDICATOR ===== */
        .recording-indicator {
            display: none;
            text-align: center;
            padding: 8px;
            background: rgba(255, 0, 51, 0.1);
            border: 1px solid var(--danger);
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 10px;
            color: var(--danger);
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .recording-indicator.active {
            display: block;
            animation: pulse 0.5s infinite;
        }

        /* ===== IMAGE LIGHTBOX ===== */
        .image-lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 500;
            display: none; justify-content: center; align-items: center;
        }

        .image-lightbox.active { display: flex; }

        .image-lightbox img {
            max-width: 95%; max-height: 90%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 50px var(--accent);
            border-radius: 10px;
        }

        .image-lightbox-close {
            position: absolute; top: 20px; right: 20px;
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.8); border: 2px solid var(--accent);
            color: var(--accent); font-size: 22px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        /* ===== READING PROGRESS ===== */
        .reading-progress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--gradient-main); box-shadow: 0 0 15px var(--accent);
            z-index: 200; transition: width 0.3s;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed; top: 70px; right: 15px; z-index: 300;
            display: flex; flex-direction: column; gap: 8px;
        }

        .toast {
            padding: 12px 18px; border-radius: 10px;
            font-size: 12px; letter-spacing: 1px;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.5s forwards;
            border: 1px solid; max-width: 260px; backdrop-filter: blur(10px);
        }

        .toast-success {
            background: rgba(0, 255, 136, 0.15); border-color: var(--success);
            color: var(--success); box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .toast-error {
            background: rgba(255, 0, 51, 0.15); border-color: var(--danger);
            color: var(--danger); box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .toast-info {
            background: rgba(0, 240, 255, 0.15); border-color: var(--accent);
            color: var(--accent); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* ===== ADMIN ===== */
        .admin-panel { display: none; margin-bottom: 20px; }
        .admin-panel.active { display: block; animation: slideIn 0.4s ease; }

        .admin-login {
            border: 1px solid var(--border-glow); padding: 20px;
            background: var(--glass); text-align: center;
            border-radius: 15px; box-shadow: var(--shadow-neon);
        }

        .admin-login h2 {
            font-family: 'Orbitron', sans-serif; font-size: 14px;
            letter-spacing: 2px; margin-bottom: 15px;
            background: var(--gradient-main);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-login input {
            width: 100%; padding: 12px 15px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border-glow);
            color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 14px;
            margin-bottom: 12px; outline: none; text-align: center;
            border-radius: 20px; letter-spacing: 3px;
        }

        .admin-dashboard { display: none; }
        .admin-dashboard.active { display: block; }

</head>
<body>

    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <!-- HEADER -->

        <a onclick="showTab('chat'); closeMenu();"><span class="menu-icon">💬</span> CHAT</a>
        <a onclick="showAdminPanel(); closeMenu();"><span class="menu-icon">🔐</span> ADMIN</a>
        <a onclick="createBurstParticles(); closeMenu();"><span class="menu-icon">✨</span> PARTIKEL</a>
    </div>

    <!-- MAIN -->
    <main>

        <!-- HERO -->
        <div class="hero" id="heroSection">
            <h1>TRON BLOG</h1>
            <p class="subtitle">DIGITAL CHRONICLES</p>
        </div>

        <!-- STATUS -->
        <div class="status-bar">
            <span><span class="status-dot"></span>ONLINE</span>

        <!-- CLOCK -->
        <div class="clock-display">

        <!-- TABS -->
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" onclick="showTab('blog', this)">📝 BLOG</button>
            <button class="tab-btn" onclick="showTab('chat', this)">💬 CHAT</button>
        </div>

        <!-- BLOG TAB -->
        <div class="tab-content active" id="tab-blog">
            <div class="search-bar">

        <!-- CHAT TAB -->
        <div class="tab-content" id="tab-chat">

                </div>

                <!-- RECORDING INDICATOR -->
                <div class="recording-indicator" id="recordingIndicator">🔴 MERAKAM...</div>

                <div class="chat-messages" id="chatMessages"></div>

                <!-- CHAT INPUT ROW -->
                <div class="chat-input-row">
                    <input type="text" id="chatName" placeholder="NAMA" style="max-width:70px;">
                    <input type="text" id="chatInput" placeholder="TULIS MESEJ..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button class="chat-attach-btn" onclick="document.getElementById('chatImageInput').click()" title="Hantar Gambar">📷</button>
                    <button class="chat-attach-btn" id="recordBtn" onclick="toggleRecording()" title="Rakam Audio">🎤</button>

        <!-- ARTICLE -->
        <div class="article-view" id="articleView">
            <button class="back-to-blog" onclick="showHome()">← KEMBALI</button>

        <!-- ADMIN -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-login" id="adminLogin">
                <h2>🔐 LOGIN ADMIN</h2>

                <button class="admin-btn-primary" onclick="adminLogin()">LOGIN</button>
            </div>
            <div class="admin-dashboard" id="adminDashboard">
                <h2>📝 PENGURUSAN ARTIKEL</h2>
                <div class="admin-form">
                    <h3 id="formTitle">➕ TAMBAH ARTIKEL</h3>
                    <input type="hidden" id="postId">
                    <input type="text" id="postTitle" placeholder="TAJUK">
                    <input type="text" id="postCategory" placeholder="KATEGORI">
                    <input type="text" id="postIcon" placeholder="IKON (EMOJI)">
                    <input type="text" id="postAuthor" placeholder="PENULIS">
                    <textarea id="postExcerpt" placeholder="RINGKASAN"></textarea>
                    <textarea id="postContent" placeholder="KANDUNGAN (HTML)"></textarea>
                    <div class="btn-row">
                        <button class="admin-btn-primary" onclick="savePost()">💾 SIMPAN</button>
                        <button class="admin-btn-danger" onclick="resetForm()">BATAL</button>
                    </div>
                </div>

                <button class="admin-btn-danger" onclick="adminLogout()" style="margin-top:10px;">🚪 LOGOUT</button>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 <span class="footer-glow">TRON BLOG</span> — CHAT MULTIMEDIA</p>
    </footer>

    <!-- BUTTONS -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>
    <button class="fab" onclick="createBurstParticles(); showToast('Letupan Partikel! ✨', 'success')">✦</button>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // ===== FIREBASE =====
        const firebaseConfig = {
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const ADMIN_PASSWORD = "admin123";

        let isAdminLoggedIn = false;
        let blogPosts = [];
        let audioContext = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let recordingTimer = null;

        // ===== AUDIO (Sound Effects) =====
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                const now = audioContext.currentTime;

                switch(type) {
                    case 'click':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                        break;
                    case 'success':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                        break;
                    case 'error':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                }
            } catch(e) {}
        }

        // ===== PARTICLES =====
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                p.style.animationDelay = Math.random() * 4 + 's';
                p.style.width = (Math.random() * 3 + 2) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        }

        function createBurstParticles() {
            playSound('success');
            const burst = document.createElement('div');
            burst.className = 'particle-burst';
            burst.style.left = '50%';
            burst.style.top = '50%';
            document.body.appendChild(burst);
            const colors = ['#00f0ff', '#ff00ff', '#ff6b00', '#00ff88', '#ffffff'];
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'burst-particle';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = `0 0 10px ${p.style.background}`;
                const angle = (Math.PI * 2 * i) / 20;
                const dist = Math.random() * 80 + 40;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                burst.appendChild(p);
            }
            setTimeout(() => burst.remove(), 1000);
        }

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').textContent = now.toLocaleTimeString('ms-MY', { hour12: false });
            document.getElementById('clockDate').textContent = now.toLocaleDateString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== READING PROGRESS =====
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            document.getElementById('readingProgress').style.width = (scrollTop / docHeight * 100) + '%';
            document.getElementById('backToTop').style.display = scrollTop > 200 ? 'flex' : 'none';
        });

        // ===== VISITOR =====
        function updateVisitor() {
            database.ref('visitors').transaction((cur) => (cur || 0) + 1);
            database.ref('visitors').on('value', (snap) => {
                document.getElementById('visitorCount').textContent = '👁️ ' + (snap.val() || 0);
            });
        }

        // ===== TABS =====
        function showTab(tabName, btn) {
            playSound('click');
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            if (btn) btn.classList.add('active');
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('tabsContainer').style.display = 'flex';
        }

        // ===== BLOG =====
        function loadPosts() {
            database.ref('posts').on('value', (snapshot) => {
                blogPosts = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => blogPosts.push({ id: child.key, ...child.val() }));
                }
                renderBlog(blogPosts);
                renderAdminPostList();
            });
        }

        function renderBlog(posts) {
            const grid = document.getElementById('blogGrid');
            grid.innerHTML = '';
            if (posts.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div>TIADA ARTIKEL<br><span style="font-size:9px;color:#444;">TAMBAH MELALUI ADMIN</span></div>`;
                return;
            }
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.onclick = () => { playSound('click'); openArticle(post.id); };
                card.innerHTML = `
                    <div class="blog-card-image">${post.icon || '📄'}</div>
                    <div class="blog-card-content">
                        <span class="blog-card-tag">${post.category || 'UMUM'}</span>
                        <h2>${post.title}</h2>
                        <p class="blog-card-excerpt">${post.excerpt || ''}</p>
                        <div class="blog-card-meta">
                            <span class="author">${post.author || 'Tanpa Nama'}</span>
                            <span>${post.date || ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function searchPosts(query) {
            const filtered = blogPosts.filter(post => {
                const text = (post.title + ' ' + post.excerpt + ' ' + post.category).toLowerCase();
                return text.includes(query.toLowerCase());
            });
            renderBlog(filtered);
        }

        function openArticle(id) {
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;
            document.getElementById('articleView').classList.add('active');
            document.getElementById('tab-blog').style.display = 'none';
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('articleTitle').textContent = post.title;
            document.getElementById('articleImage').textContent = post.icon || '📄';
            document.getElementById('articleContent').innerHTML = post.content || '<p>Tiada kandungan.</p>';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showHome() {
            playSound('click');
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('tabsContainer').style.display = 'flex';
            document.getElementById('tab-blog').style.display = 'block';
            document.getElementById('tab-chat').style.display = 'block';
            showTab('blog');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== CHAT =====
        function sendChat() {
            const name = document.getElementById('chatName').value.trim() || 'Anonymous';
            const msg = document.getElementById('chatInput').value.trim();
            if (!msg) return;
            playSound('success');
            database.ref('chat').push({
                type: 'text',
                name: name,
                text: msg,
                time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
            });
            document.getElementById('chatInput').value = '';
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 2 * 1024 * 1024) {
                showToast('Saiz gambar terlalu besar (max 2MB)!', 'error');
                return;
            }

            const name = document.getElementById('chatName').value.trim() || 'Anonymous';
            const reader = new FileReader();
            reader.onload = function(e) {
                playSound('success');
                database.ref('chat').push({
                    type: 'image',
                    name: name,
                    data: e.target.result,
                    time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
                });
                showToast('Gambar dihantar! 📷', 'success');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // ===== AUDIO RECORDING =====
        async function toggleRecording() {
            const recordBtn = document.getElementById('recordBtn');
            const indicator = document.getElementById('recordingIndicator');

            if (isRecording) {
                // Stop recording
                isRecording = false;
                recordBtn.classList.remove('recording');
                indicator.classList.remove('active');
                clearInterval(recordingTimer);
                mediaRecorder.stop();
                showToast('Rakaman dihentikan, menghantar...', 'info');
                return;
            }

            // Start recording
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    stream.getTracks().forEach(track => track.stop());
                    
                    if (audioBlob.size > 500 * 1024) {
                        showToast('Audio terlalu panjang (max 30 saat)!', 'error');
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const duration = Math.round((Date.now() - recordingStartTime) / 1000);
                        const name = document.getElementById('chatName').value.trim() || 'Anonymous';
                        playSound('success');
                        database.ref('chat').push({
                            type: 'audio',
                            name: name,
                            data: e.target.result,
                            duration: duration,
                            time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
                        });
                        showToast('Audio dihantar! 🎤', 'success');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                recordingStartTime = Date.now();
                recordBtn.classList.add('recording');
                indicator.classList.add('active');
                playSound('click');

                // Auto stop after 30 seconds
                recordingTimer = setInterval(() => {
                    const elapsed = (Date.now() - recordingStartTime) / 1000;
                    if (elapsed >= 30 && isRecording) {
                        toggleRecording();
                    }
                }, 1000);

                showToast('Rakaman bermula...', 'info');
            } catch(e) {
                playSound('error');
                showToast('Tidak dapat akses mikrofon!', 'error');
            }
        }

        // ===== PLAY AUDIO MESSAGE =====
        function playAudioMessage(audioData, duration) {
            try {
                const audio = new Audio(audioData);
                audio.play();
                showToast('Memainkan audio (' + duration + 's)...', 'info');
            } catch(e) {
                showToast('Tidak dapat main audio!', 'error');
            }
        }

        // ===== IMAGE LIGHTBOX =====
        function openImageLightbox(imageData) {
            document.getElementById('lightboxImage').src = imageData;
            document.getElementById('imageLightbox').classList.add('active');
        }

        function closeImageLightbox() {
            document.getElementById('imageLightbox').classList.remove('active');
        }

        // ===== LOAD CHAT =====
        function loadChat() {
            database.ref('chat').limitToLast(50).on('value', (snapshot) => {
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';
                const currentName = document.getElementById('chatName').value.trim() || 'Anonymous';

                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'chat-msg';
                        
                        if (data.name === currentName) {
                            msgDiv.classList.add('own');
                        }

                        const nameDisplay = document.createElement('div');
                        nameDisplay.className = 'msg-name';
                        nameDisplay.textContent = `${data.name} • ${data.time || ''}`;
                        msgDiv.appendChild(nameDisplay);

                        if (data.type === 'text') {
                            const textDiv = document.createElement('div');
                            textDiv.className = 'msg-text';
                            textDiv.textContent = data.text;
                            msgDiv.appendChild(textDiv);
                        } else if (data.type === 'image') {
                            const img = document.createElement('img');
                            img.className = 'msg-image';
                            img.src = data.data;
                            img.onclick = () => openImageLightbox(data.data);
                            msgDiv.appendChild(img);
                        } else if (data.type === 'audio') {
                            const audioDiv = document.createElement('div');
                            audioDiv.className = 'msg-audio';
                            audioDiv.onclick = () => playAudioMessage(data.data, data.duration);
                            audioDiv.innerHTML = `
                                <span class="audio-icon">▶</span>
                                <div class="audio-bar"><div class="audio-bar-fill"></div></div>
                                <span class="audio-duration">${data.duration || 0}s</span>
                            `;
                            msgDiv.appendChild(audioDiv);
                        }

                        container.appendChild(msgDiv);
                    });
                }
                container.scrollTop = container.scrollHeight;
            });
        }

        // ===== ADMIN =====
        function showAdminPanel() {
            playSound('click');
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('tab-blog').style.display = 'none';
            document.getElementById('tab-chat').style.display = 'none';
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.add('active');
            if (isAdminLoggedIn) {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').classList.add('active');
            } else {
                document.getElementById('adminLogin').style.display = 'block';
                document.getElementById('adminDashboard').classList.remove('active');
            }
        }

        function adminLogin() {
            if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
                playSound('success');
                isAdminLoggedIn = true;
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').classList.add('active');
                document.getElementById('adminPassword').value = '';
                showToast('Login berjaya! ✅', 'success');
            } else {
                playSound('error');
                showToast('Kata laluan salah! ❌', 'error');
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            document.getElementById('adminLogin').style.display = 'block';
            document.getElementById('adminDashboard').classList.remove('active');
            resetForm();
        }

        function renderAdminPostList() {
            const list = document.getElementById('adminPostList');
            list.innerHTML = '';
            if (blogPosts.length === 0) {
                list.innerHTML = '<p style="color:#444;text-align:center;padding:12px;">Tiada artikel.</p>';
                return;
            }
            blogPosts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'admin-post-item';
                item.innerHTML = `
                    <div class="admin-post-info"><h4>${post.title}</h4><p>${post.category || 'UMUM'}</p></div>
                    <div class="admin-post-actions">
                        <button class="admin-btn-primary" onclick="editPost('${post.id}')">EDIT</button>
                        <button class="admin-btn-danger" onclick="deletePost('${post.id}')">PADAM</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function savePost() {
            playSound('success');
            const id = document.getElementById('postId').value;
            const data = {
                title: document.getElementById('postTitle').value.trim(),
                category: document.getElementById('postCategory').value.trim(),
                icon: document.getElementById('postIcon').value.trim() || '📄',
                author: document.getElementById('postAuthor').value.trim(),
                excerpt: document.getElementById('postExcerpt').value.trim(),
                content: document.getElementById('postContent').value.trim(),
                date: new Date().toISOString().split('T')[0]
            };
            if (!data.title || !data.category || !data.author) {
                showToast('Sila isi ruangan wajib!', 'error');
                return;
            }
            if (id) {
                database.ref('posts/' + id).update(data).then(() => { showToast('Dikemaskini! ✅', 'success'); resetForm(); });
            } else {
                database.ref('posts').push(data).then(() => { showToast('Disimpan! ✅', 'success'); resetForm(); });
            }
        }

        function editPost(id) {
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;
            document.getElementById('postId').value = post.id;
            document.getElementById('postTitle').value = post.title || '';
            document.getElementById('postCategory').value = post.category || '';
            document.getElementById('postIcon').value = post.icon || '';
            document.getElementById('postAuthor').value = post.author || '';
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('postContent').value = post.content || '';
            document.getElementById('formTitle').textContent = '✏️ EDIT ARTIKEL';
        }

        function deletePost(id) {
            playSound('error');
            if (confirm('Padam artikel ini?')) {
                database.ref('posts/' + id).remove().then(() => showToast('Dipadam! ✅', 'success'));
            }
        }

        function resetForm() {
            ['postId','postTitle','postCategory','postIcon','postAuthor','postExcerpt','postContent'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('formTitle').textContent = '➕ TAMBAH ARTIKEL';
        }

        // ===== MENU =====
        function toggleMenu() {
            playSound('click');
            document.getElementById('mobileMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function closeMenu() {
            document.getElementById('mobileMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // ===== SWIPE =====
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (diff > 80) toggleMenu();
            else if (diff < -80) closeMenu();
        }, { passive: true });

        // ===== TAP PARTICLES =====
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                createMiniBurst(e.clientX, e.clientY);
            }
        });

        function createMiniBurst(x, y) {
            const burst = document.createElement('div');
            burst.className = 'particle-burst';
            burst.style.left = x + 'px';
            burst.style.top = y + 'px';
            document.body.appendChild(burst);
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'burst-particle';
                p.style.background = '#00f0ff';
                p.style.boxShadow = '0 0 8px #00f0ff';
                const angle = (Math.PI * 2 * i) / 8;
                const dist = Math.random() * 25 + 10;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                burst.appendChild(p);
            }
            setTimeout(() => burst.remove(), 800);
        }

        // ===== BACK TO TOP =====
        function scrollToTop() {
            playSound('click');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== INIT =====
        createParticles();
        loadPosts();
        loadChat();
        updateVisitor();
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>

</body>
</html>
