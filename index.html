<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRON · ENTERPRISE CHAT</title>
  
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js"
      }
    }
  </script>
  
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;background:#0b0e14;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden}
    body{background:radial-gradient(circle at 20% 30%,#0a1a24,#030608);display:flex;align-items:center;justify-content:center}
    #app{width:100%;max-width:600px;height:100vh;max-height:900px;margin:0 auto;padding:12px;background:rgba(6,14,22,0.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid rgba(0,255,255,0.06);border-right:1px solid rgba(0,255,255,0.06);box-shadow:0 0 80px rgba(0,180,255,0.04),inset 0 0 100px rgba(0,200,255,0.02);display:flex;flex-direction:column}
    .header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px;border-bottom:1px solid rgba(0,255,255,0.08);margin-bottom:10px;flex-shrink:0;gap:6px;flex-wrap:wrap}
    .header-left{display:flex;align-items:center;gap:10px}
    .header h1{font-weight:300;letter-spacing:4px;font-size:1.3rem;color:#b3ffff;text-shadow:0 0 18px #00ddff77;text-transform:uppercase}
    .header .online-badge{font-size:0.6rem;color:#00dd88;background:rgba(0,220,136,0.12);padding:2px 10px;border-radius:20px;border:1px solid rgba(0,220,136,0.2)}
    .header .room-selector{display:flex;gap:4px;flex-wrap:wrap}
    .header .room-btn{background:rgba(0,40,50,0.3);border:1px solid #1a5a6a;border-radius:30px;padding:5px 12px;color:#8fcbd8;font-size:0.6rem;letter-spacing:0.5px;cursor:pointer;transition:0.3s;text-transform:uppercase;white-space:nowrap}
    .header .room-btn.active{background:#0e4a5e;border-color:#2ab3d0;color:#ebffff;box-shadow:0 0 30px #00bbff22}
    .header .room-btn:active{transform:scale(0.94)}
    .header .icon-btn{background:transparent;border:1px solid #1a5a6a;border-radius:50%;width:32px;height:32px;color:#8fcbd8;font-size:0.9rem;cursor:pointer;transition:0.3s;display:flex;align-items:center;justify-content:center}
    .header .icon-btn:active{transform:scale(0.9);background:rgba(0,200,255,0.1)}
    #messagesContainer{flex:1;overflow-y:auto;padding:4px 2px 10px;margin-bottom:8px;scroll-behavior:smooth;border-radius:12px;background:rgba(0,20,30,0.2);border:1px solid rgba(0,255,255,0.03)}
    #messagesContainer::-webkit-scrollbar{width:4px}
    #messagesContainer::-webkit-scrollbar-track{background:rgba(0,40,50,0.15);border-radius:10px}
    #messagesContainer::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00ddff,#0088ff);border-radius:10px;box-shadow:0 0 20px #00ddff33}
    .msg{display:flex;flex-direction:column;margin-bottom:8px;padding:8px 14px 6px;border-radius:18px 18px 18px 6px;background:rgba(8,28,40,0.5);border-left:2px solid #1d8a9e;box-shadow:0 0 20px rgba(0,200,255,0.03);animation:slideIn 0.25s cubic-bezier(0.34,1.56,0.64,1)}
    .msg.own{background:rgba(10,45,60,0.6);border-left-color:#3ad4e8}
    .msg.deleted{opacity:0.4;border-left-color:#664444}
    .msg .meta{display:flex;justify-content:space-between;font-size:0.55rem;color:#4799aa;letter-spacing:0.3px;margin-bottom:2px;text-transform:uppercase;opacity:0.7}
    .msg .meta .name{color:#7fd4e8;font-weight:500;text-shadow:0 0 8px #00aaff33;cursor:pointer}
    .msg .meta .time{color:#3b7f8a;font-size:0.5rem}
    .msg .text{color:#d0f0f5;font-size:0.92rem;line-height:1.4;word-break:break-word;text-shadow:0 0 6px rgba(0,200,255,0.08)}
    .msg .text.edited::after{content:" (edited)";color:#3b7f8a;font-size:0.6rem;margin-left:6px}
    .msg .glow-line{width:100%;height:1px;margin-top:5px;background:linear-gradient(90deg,transparent,#2ad4ff44,#00e5ff66,#2ad4ff44,transparent)}
    .msg .reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .msg .reactions .reaction{background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.08);border-radius:16px;padding:1px 8px;font-size:0.75rem;cursor:pointer;transition:0.2s;display:flex;align-items:center;gap:4px}
    .msg .reactions .reaction:hover{background:rgba(0,200,255,0.12)}
    .msg .reactions .reaction.active{background:rgba(0,200,255,0.15);border-color:#2ab3d0}
    .msg .reactions .reaction .count{color:#3b7f8a;font-size:0.6rem}
    .msg .thread-indicator{font-size:0.6rem;color:#3b7f8a;cursor:pointer;margin-top:3px;padding:2px 8px;border-radius:12px;background:rgba(0,200,255,0.04);display:inline-block;transition:0.2s}
    .msg .thread-indicator:hover{background:rgba(0,200,255,0.08);color:#7fd4e8}
    .msg .file-attachment{display:flex;align-items:center;gap:8px;margin-top:4px;padding:4px 10px;background:rgba(0,200,255,0.04);border-radius:12px;border:1px solid rgba(0,200,255,0.06)}
    .msg .file-attachment .file-icon{font-size:1.2rem}
    .msg .file-attachment .file-name{color:#7fd4e8;font-size:0.75rem;text-decoration:none}
    .msg .file-attachment .file-name:hover{color:#b3ffff;text-decoration:underline}
    .msg .file-attachment .file-size{color:#3b7f8a;font-size:0.6rem}
    .msg .audio-player{width:100%;max-width:200px;margin-top:4px}
    .msg .audio-player audio{width:100%;height:30px;border-radius:20px;background:rgba(0,20,30,0.5)}
    .input-area{display:flex;gap:6px;padding:8px 0 2px;border-top:1px solid rgba(0,255,255,0.06);flex-shrink:0;background:rgba(0,10,18,0.2);border-radius:0 0 16px 16px;flex-wrap:wrap}
    .input-area .input-wrapper{flex:1;display:flex;gap:6px;align-items:center;background:#0b1922;border:1px solid #154a57;border-radius:60px;padding:2px 6px;transition:0.3s;box-shadow:inset 0 2px 10px #00000044}
    .input-area .input-wrapper:focus-within{border-color:#28c4db;box-shadow:0 0 30px #00ccff22,inset 0 0 20px #0088aa11}
    .input-area .input-wrapper input{flex:1;background:transparent;border:none;padding:10px 6px;color:#c8f0f5;font-size:0.9rem;outline:none;min-width:60px}
    .input-area .input-wrapper input::placeholder{color:#3e7885;font-weight:300;letter-spacing:0.5px}
    .input-area .input-wrapper .input-btn{background:transparent;border:none;color:#3e7885;font-size:1.1rem;cursor:pointer;padding:4px 6px;transition:0.2s;border-radius:50%}
    .input-area .input-wrapper .input-btn:hover{color:#7fd4e8}
    .input-area .input-wrapper .input-btn:active{transform:scale(0.9)}
    .input-area .send-btn{background:linear-gradient(145deg,#0b3340,#06222b);border:1px solid #1e8a9e;border-radius:60px;padding:0 20px;color:#e0ffff;font-weight:600;font-size:0.8rem;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 0 30px #00bbff22;transition:0.2s;cursor:pointer;white-space:nowrap}
    .input-area .send-btn:active{transform:scale(0.94);background:#0f4d5e;box-shadow:0 0 50px #00ddff44}
    .emoji-picker{display:none;position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:rgba(6,14,22,0.96);border:1px solid #1a5a6a;border-radius:16px;padding:10px;z-index:200;backdrop-filter:blur(16px);max-width:280px;grid-template-columns:repeat(6,1fr);gap:4px;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
    .emoji-picker.show{display:grid}
    .emoji-picker .emoji-btn{background:transparent;border:none;font-size:1.4rem;cursor:pointer;padding:4px;border-radius:8px;transition:0.2s;text-align:center}
    .emoji-picker .emoji-btn:hover{background:rgba(0,200,255,0.1);transform:scale(1.1)}
    .user-list{display:none;position:absolute;top:55px;right:10px;background:rgba(6,14,22,0.95);border:1px solid #1a5a6a;border-radius:16px;padding:10px;min-width:170px;max-height:320px;overflow-y:auto;z-index:100;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
    .user-list.show{display:block}
    .user-list .user-item{padding:5px 10px;color:#8fcbd8;font-size:0.7rem;cursor:pointer;border-radius:8px;transition:0.2s;display:flex;align-items:center;gap:8px}
    .user-list .user-item:hover{background:rgba(0,200,255,0.08)}
    .user-list .user-item .online-dot{width:6px;height:6px;border-radius:50%;background:#00dd88;display:inline-block;box-shadow:0 0 10px #00dd8844}
    .user-list .user-item .online-dot.offline{background:#664444;box-shadow:none}
    .status{text-align:center;font-size:0.55rem;color:#2b6f7a;letter-spacing:1.5px;padding-top:8px;border-top:1px solid rgba(0,255,255,0.04);margin-top:4px;flex-shrink:0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
    .status span{display:inline-flex;align-items:center;gap:4px}
    .status .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#00dd88;box-shadow:0 0 12px #00ff8844;animation:pulse 1.8s infinite}
    .status .dot.offline{background:#ff6644;animation:none}
    .status .badge{padding:0 8px;border-radius:10px;background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.06)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
    .modal.show{display:flex}
    .modal .modal-content{background:rgba(6,14,22,0.96);border:1px solid #1a5a6a;border-radius:24px;padding:24px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,0.8)}
    .modal .modal-content h2{color:#b3ffff;font-weight:300;letter-spacing:2px;margin-bottom:16px;font-size:1.2rem}
    .modal .modal-content .field{margin-bottom:14px}
    .modal .modal-content .field label{color:#4799aa;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px}
    .modal .modal-content .field input,.modal .modal-content .field textarea{width:100%;background:#0b1922;border:1px solid #154a57;border-radius:12px;padding:10px 14px;color:#c8f0f5;font-size:0.9rem;outline:none;transition:0.3s}
    .modal .modal-content .field input:focus,.modal .modal-content .field textarea:focus{border-color:#28c4db;box-shadow:0 0 20px #00ccff22}
    .modal .modal-content .field textarea{min-height:60px;resize:vertical}
    .modal .modal-content .modal-actions{display:flex;gap:10px;margin-top:18px}
    .modal .modal-content .modal-actions button{flex:1;padding:10px;border-radius:30px;border:1px solid #1a5a6a;background:transparent;color:#8fcbd8;cursor:pointer;transition:0.2s;text-transform:uppercase;font-size:0.7rem;letter-spacing:1px}
    .modal .modal-content .modal-actions button.primary{background:#0e4a5e;border-color:#2ab3d0;color:#ebffff}
    .modal .modal-content .modal-actions button:active{transform:scale(0.94)}
    @keyframes slideIn{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pulse{0%{opacity:0.4}50%{opacity:1}100%{opacity:0.4}}
    .blocked-msg{display:none;position:fixed;inset:0;background:#0b0e14;z-index:9999;align-items:center;justify-content:center;flex-direction:column;color:#b0e0ea;padding:40px;text-align:center;font-size:1.2rem;border:2px solid #2a6a7a}
    .blocked-msg .big{font-size:3rem;margin-bottom:12px}
    @media (max-width:480px){#app{padding:8px}.header h1{font-size:1rem;letter-spacing:2px}.header .room-btn{font-size:0.5rem;padding:3px 8px}.input-area .input-wrapper input{font-size:0.8rem}.input-area .send-btn{padding:0 14px;font-size:0.7rem}.modal .modal-content{padding:16px}}
  </style>
</head>
<body>
  <div id="blocker" class="blocked-msg" style="display:none">
    <div class="big">⛔</div>
    <div>ACCESS DENIED</div>
    <div style="font-size:0.9rem;margin-top:12px;opacity:0.6">android browser only</div>
  </div>
  
  <div id="app">
    <div class="header">
      <div class="header-left">
        <h1>⍟ TRON</h1>
        <span class="online-badge" id="onlineBadge">● live</span>
      </div>
      <div class="room-selector">
        <button class="room-btn active" data-room="general">#general</button>
        <button class="room-btn" data-room="random">#random</button>
        <button class="room-btn" data-room="tech">#tech</button>
        <button class="icon-btn" id="dmToggle" title="Direct Messages">✉</button>
        <button class="icon-btn" id="profileBtn" title="Profile">👤</button>
        <button class="icon-btn" id="searchBtn" title="Search">🔍</button>
      </div>
    </div>
    
    <div id="messagesContainer"></div>
    
    <div class="input-area">
      <div class="input-wrapper">
        <button class="input-btn" id="emojiBtn" title="Emoji">😊</button>
        <button class="input-btn" id="fileBtn" title="Attach file">📎</button>
        <input type="text" id="msgInput" placeholder="Type message..." maxlength="500" autocomplete="off">
        <button class="input-btn" id="micBtn" title="Voice message">🎤</button>
      </div>
      <button class="send-btn" id="sendBtn">⍟ send</button>
    </div>
    
    <div class="emoji-picker" id="emojiPicker"></div>
    
    <div class="user-list" id="userList">
      <div style="color:#7fd4e8;font-size:0.65rem;padding:4px 8px;border-bottom:1px solid #1a5a6a;margin-bottom:6px">● ONLINE USERS</div>
      <div id="userListContent"></div>
    </div>
    
    <div class="status">
      <span><span class="dot" id="statusDot"></span> <span id="statusText">connected</span></span>
      <span>👥 <span id="userCount">0</span></span>
      <span>⍟ <span id="msgCount">0</span></span>
      <span id="connectionBadge" class="badge">📶 4G</span>
    </div>
  </div>
  
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <h2>👤 PROFILE</h2>
      <div class="field"><label>Display Name</label><input type="text" id="profileName" maxlength="30"></div>
      <div class="field"><label>Bio</label><textarea id="profileBio" maxlength="100" placeholder="Tron enthusiast..."></textarea></div>
      <div class="field"><label>User ID</label><input type="text" id="profileUserId" readonly style="color:#3b7f8a;font-size:0.7rem"></div>
      <div class="modal-actions">
        <button id="profileClose">Close</button>
        <button class="primary" id="profileSave">Save</button>
      </div>
    </div>
  </div>
  
  <div class="modal" id="searchModal">
    <div class="modal-content">
      <h2>🔍 SEARCH</h2>
      <div class="field"><label>Search messages</label><input type="text" id="searchInput" placeholder="Type to search..."></div>
      <div id="searchResults" style="margin-top:12px;max-height:300px;overflow-y:auto"></div>
      <div class="modal-actions"><button id="searchClose">Close</button></div>
    </div>
  </div>
  
  <script type="module">
    // ============================================================
    // TRON ENTERPRISE CHAT · COMPLETE FIXED PRODUCTION BUILD
    // ALL ISSUES RESOLVED: Security, Performance, Memory, Rate Limit
    // ============================================================
    import { initializeApp } from "firebase/app";
    import { 
      getDatabase, ref, push, onChildAdded, onValue, set, 
      query, orderByChild, limitToLast, off, get, update, remove,
      onDisconnect, serverTimestamp
    } from "firebase/database";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "firebase/storage";
    import { getAnalytics, logEvent } from "firebase/analytics";

    // ============================================================
    // FIX 1: FIREBASE CONFIG - REPLACE WITH YOUR ACTUAL VALUES
    // ============================================================
    const FIREBASE_CONFIG = {
      apiKey: "YOUR_ACTUAL_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // ============================================================
    // ANDROID GUARD
    // ============================================================
    (function enforceAndroid() {
      const isAndroid = /android/i.test(navigator.userAgent);
      if (!isAndroid) {
        document.getElementById('blocker').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
        throw new Error('android-only');
      }
    })();

    // ============================================================
    // FIREBASE INIT
    // ============================================================
    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const analytics = getAnalytics(app);

    // ============================================================
    // DOM REFS
    // ============================================================
    const container = document.getElementById('messagesContainer');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const userCountEl = document.getElementById('userCount');
    const msgCountEl = document.getElementById('msgCount');
    const roomBtns = document.querySelectorAll('.room-btn');
    const dmToggle = document.getElementById('dmToggle');
    const userList = document.getElementById('userList');
    const userListContent = document.getElementById('userListContent');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');
    const fileBtn = document.getElementById('fileBtn');
    const micBtn = document.getElementById('micBtn');
    const profileBtn = document.getElementById('profileBtn');
    const profileModal = document.getElementById('profileModal');
    const searchBtn = document.getElementById('searchBtn');
    const searchModal = document.getElementById('searchModal');
    const connectionBadge = document.getElementById('connectionBadge');

    // ============================================================
    // STATE MANAGEMENT
    // ============================================================
    const state = {
      userName: '',
      userId: '',
      currentRoom: 'general',
      isDM: false,
      dmTarget: null,
      msgCount: 0,
      userCount: 0,
      renderedKeys: new Set(),
      maxMessages: 100,
      typingTimeout: null,
      listeners: [],
      replyParent: null,
      editTarget: null,
      isRecording: false,
      mediaRecorder: null,
      audioChunks: [],
      // FIX 5: Rate limiting
      lastMessageTime: 0,
      messageCountInWindow: 0,
      rateLimitWindow: 60000,
      maxMessagesPerMinute: 10,
      // FIX 6: Offline deduplication
      sentMessageIds: new Set(),
      isReconnecting: false,
      // FIX 9: Search index
      searchIndex: new Map()
    };

    // ============================================================
    // FIX 3 & 12: HTML ESCAPE & URL VALIDATION
    // ============================================================
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return ['https:', 'http:'].includes(url.protocol);
      } catch (_) {
        return false;
      }
    }

    function formatTime(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const date = new Date(timestamp);
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
      if (diff < 86400000) return `Today at ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      if (diff < 172800000) return 'Yesterday';
      if (diff < 604800000) return date.toLocaleDateString([], {weekday:'short'});
      return date.toLocaleDateString();
    }

    function generateUserId() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let id = '';
      for (let i = 0; i < 8; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return id;
    }

    function generateUserName() {
      const prefixes = ['⚡', '⍟', '◈', '⟡', '⋆', '⌘', '⬡', '⟠'];
      const suffixes = ['USER', 'NODE', 'CORE', 'LINK', 'BYTE', 'GRID', 'ZERO', 'ONE'];
      return `${prefixes[Math.floor(Math.random() * prefixes.length)]} ${suffixes[Math.floor(Math.random() * suffixes.length)]}${Math.floor(Math.random() * 100)}`;
    }

    function getRoomPath() {
      if (state.isDM && state.dmTarget) {
        const ids = [state.userId, state.dmTarget].sort();
        return `dm/${ids[0]}_${ids[1]}`;
      }
      return `rooms/${state.currentRoom}`;
    }

    function getMessagesRef() {
      return ref(db, `globalChat/${getRoomPath()}/messages`);
    }

    function getMetaRef() {
      return ref(db, `globalChat/${getRoomPath()}/meta`);
    }

    // ============================================================
    // PROFANITY FILTER
    // ============================================================
    const BAD_WORDS = ['badword1', 'badword2', 'badword3', 'hate', 'spam'];
    function filterProfanity(text) {
      let filtered = text;
      BAD_WORDS.forEach(word => {
        const regex = new RegExp(word, 'gi');
        filtered = filtered.replace(regex, '***');
      });
      return filtered;
    }

    // ============================================================
    // FIX 5: RATE LIMITING
    // ============================================================
    function checkRateLimit() {
      const now = Date.now();
      if (now - state.lastMessageTime > state.rateLimitWindow) {
        state.messageCountInWindow = 0;
        state.lastMessageTime = now;
      }
      
      if (state.messageCountInWindow >= state.maxMessagesPerMinute) {
        statusText.textContent = '⏳ slow down...';
        setTimeout(() => { statusText.textContent = 'live'; }, 2000);
        return false;
      }
      
      state.messageCountInWindow++;
      state.lastMessageTime = now;
      return true;
    }

    // ============================================================
    // USER MANAGEMENT
    // ============================================================
    function initUser() {
      let stored = localStorage.getItem('tronChat_user');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          state.userName = parsed.name || generateUserName();
          state.userId = parsed.id || generateUserId();
        } catch (e) {
          state.userName = generateUserName();
          state.userId = generateUserId();
        }
      } else {
        state.userName = generateUserName();
        state.userId = generateUserId();
      }
      localStorage.setItem('tronChat_user', JSON.stringify({
        name: state.userName,
        id: state.userId
      }));
    }

    function registerUser() {
      const userRef = ref(db, `globalChat/users/${state.userId}`);
      const presenceRef = ref(db, `globalChat/presence/${state.userId}`);
      
      set(userRef, {
        name: state.userName,
        lastSeen: Date.now(),
        online: true,
        room: state.currentRoom,
        joinedAt: serverTimestamp()
      }).catch(e => console.warn('User reg error:', e));
      
      onDisconnect(presenceRef).set({
        online: false,
        lastSeen: Date.now()
      });
      
      window.addEventListener('beforeunload', () => {
        set(userRef, { online: false, lastSeen: Date.now() }).catch(() => {});
      });
    }

    // ============================================================
    // FIX 8: PROFILE WITH BROADCAST
    // ============================================================
    async function loadProfile() {
      try {
        const profileRef = ref(db, `globalChat/users/${state.userId}/profile`);
        const snapshot = await get(profileRef);
        const data = snapshot.val() || {};
        document.getElementById('profileName').value = state.userName;
        document.getElementById('profileBio').value = data.bio || '';
        document.getElementById('profileUserId').value = state.userId;
      } catch (e) {
        console.warn('Profile load error:', e);
      }
    }

    async function saveProfile() {
      try {
        const name = document.getElementById('profileName').value.trim();
        const bio = document.getElementById('profileBio').value.trim();
        if (!name) return;
        
        state.userName = name;
        localStorage.setItem('tronChat_user', JSON.stringify({
          name: state.userName,
          id: state.userId
        }));
        
        const profileRef = ref(db, `globalChat/users/${state.userId}/profile`);
        await set(profileRef, { bio });
        
        const userRef = ref(db, `globalChat/users/${state.userId}`);
        await update(userRef, { name });
        
        // FIX 8: Broadcast profile update
        const profileUpdateRef = ref(db, `globalChat/profileUpdates/${state.userId}`);
        await set(profileUpdateRef, {
          name: state.userName,
          updatedAt: Date.now()
        });
        
        profileModal.classList.remove('show');
        logEvent(analytics, 'profile_updated', { userId: state.userId });
      } catch (e) {
        console.error('Profile save error:', e);
        statusText.textContent = '⚠️ save failed';
        setTimeout(() => { statusText.textContent = 'live'; }, 2000);
      }
    }

    // ============================================================
    // FIX 5, 6, 7: SEND MESSAGE WITH ALL PROTECTIONS
    // ============================================================
    async function sendMessage(text = null) {
      if (!checkRateLimit()) return;

      const rawText = text || msgInput.value.trim();
      if (!rawText) return;
      if (rawText.length > 500) {
        msgInput.value = rawText.substring(0, 500);
        return;
      }

      try {
        const filteredText = filterProfanity(rawText);
        const msgRef = push(getMessagesRef());
        
        const payload = {
          text: filteredText,
          userName: state.userName,
          userId: state.userId,
          timestamp: Date.now(),
          room: state.isDM ? 'dm' : state.currentRoom
        };

        if (state.replyParent) {
          payload.replyTo = state.replyParent;
          state.replyParent = null;
          msgInput.placeholder = 'Type message...';
        }

        await set(msgRef, payload);
        state.sentMessageIds.add(msgRef.key);
        msgInput.value = '';
        msgInput.focus();
        
        const countRef = ref(db, `globalChat/${getRoomPath()}/meta/msgCount`);
        await set(countRef, state.msgCount + 1);
        state.msgCount += 1;
        msgCountEl.textContent = state.msgCount;
        logEvent(analytics, 'message_sent', { room: state.currentRoom, isDM: state.isDM });
      } catch (e) {
        console.error('Send error:', e);
        if (!navigator.onLine) {
          queueOfflineMessage(payload);
          statusText.textContent = '📴 queued';
        } else {
          statusText.textContent = '⚠️ send failed';
          setTimeout(() => { statusText.textContent = 'live'; }, 2000);
        }
      }
    }

    // ============================================================
    // FIX 6: OFFLINE QUEUE WITH DEDUPLICATION
    // ============================================================
    function queueOfflineMessage(payload) {
      const queue = JSON.parse(localStorage.getItem('tron_offline_queue') || '[]');
      const exists = queue.some(msg => 
        msg.text === payload.text && 
        msg.userId === payload.userId &&
        Math.abs(msg.timestamp - payload.timestamp) < 5000
      );
      if (!exists) {
        queue.push(payload);
        localStorage.setItem('tron_offline_queue', JSON.stringify(queue));
      }
    }

    async function flushOfflineQueue() {
      if (state.isReconnecting) return;
      state.isReconnecting = true;
      
      const queue = JSON.parse(localStorage.getItem('tron_offline_queue') || '[]');
      if (queue.length === 0) {
        state.isReconnecting = false;
        return;
      }
      
      for (const msg of queue) {
        try {
          const msgRef = push(getMessagesRef());
          await set(msgRef, msg);
          state.sentMessageIds.add(msgRef.key);
        } catch (e) {
          console.warn('Failed to send queued message:', e);
          state.isReconnecting = false;
          return;
        }
      }
      localStorage.removeItem('tron_offline_queue');
      statusText.textContent = '✓ queued sent';
      setTimeout(() => { statusText.textContent = 'live'; }, 1500);
      state.isReconnecting = false;
    }

    // ============================================================
    // FIX 11: FILE UPLOAD WITH VALIDATION
    // ============================================================
    async function uploadFile(file) {
      if (file.size > 10 * 1024 * 1024) {
        statusText.textContent = '⚠️ file too large (max 10MB)';
        setTimeout(() => { statusText.textContent = 'live'; }, 2000);
        return;
      }

      const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf', 'text/plain'];
      if (!allowedTypes.includes(file.type) && !file.name.match(/\.(jpg|jpeg|png|gif|webp|pdf|txt)$/i)) {
        statusText.textContent = '⚠️ unsupported file type';
        setTimeout(() => { statusText.textContent = 'live'; }, 2000);
        return;
      }

      const fileRef = storageRef(storage, `chat/${state.userId}/${Date.now()}_${file.name}`);
      try {
        statusText.textContent = '📤 uploading...';
        const snapshot = await uploadBytes(fileRef, file);
        const url = await getDownloadURL(snapshot.ref);
        
        if (!isValidUrl(url)) {
          throw new Error('Invalid URL from storage');
        }

        const msgRef = push(getMessagesRef());
        await set(msgRef, {
          type: 'file',
          fileName: file.name,
          fileUrl: url,
          fileSize: file.size,
          fileType: file.type,
          userName: state.userName,
          userId: state.userId,
          timestamp: Date.now()
        });
        statusText.textContent = '✓ file uploaded';
        setTimeout(() => { statusText.textContent = 'live'; }, 1500);
        logEvent(analytics, 'file_shared', { type: file.type, size: file.size });
      } catch (e) {
        console.error('Upload error:', e);
        statusText.textContent = '⚠️ upload failed';
        setTimeout(() => { statusText.textContent = 'live'; }, 2000);
      }
    }

    // ============================================================
    // VOICE RECORDING
    // ============================================================
    async function toggleRecording() {
      if (state.isRecording) {
        state.mediaRecorder.stop();
        state.isRecording = false;
        micBtn.textContent = '🎤';
        statusText.textContent = '⏳ processing...';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.mediaRecorder = new MediaRecorder(stream);
        state.audioChunks = [];
        
        state.mediaRecorder.ondataavailable = (event) => {
          state.audioChunks.push(event.data);
        };
        
        state.mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
          if (audioBlob.size > 5 * 1024 * 1024) {
            statusText.textContent = '⚠️ audio too long';
            setTimeout(() => { statusText.textContent = 'live'; }, 2000);
            return;
          }
          
          const fileRef = storageRef(storage, `chat/audio/${state.userId}/${Date.now()}.webm`);
          
          try {
            const snapshot = await uploadBytes(fileRef, audioBlob);
            const url = await getDownloadURL(snapshot.ref);
            
            if (!isValidUrl(url)) {
              throw new Error('Invalid URL from storage');
            }

            const msgRef = push(getMessagesRef());
            await set(msgRef, {
              type: 'audio',
              audioUrl: url,
              duration: state.audioChunks.length,
              userName: state.userName,
              userId: state.userId,
              timestamp: Date.now()
            });
            statusText.textContent = '✓ voice sent';
            logEvent(analytics, 'voice_message', { duration: state.audioChunks.length });
          } catch (e) {
            console.error('Voice upload error:', e);
            statusText.textContent = '⚠️ voice failed';
          }
          setTimeout(() => { statusText.textContent = 'live'; }, 1500);
        };
        
        state.mediaRecorder.start();
        state.isRecording = true;
        micBtn.textContent = '⏹';
        statusText.textContent = '🔴 recording...';
      } catch (e) {
        console.error('Mic error:', e);
        statusText.textContent = '⚠️ mic denied';
        setTimeout(() => { statusText.textContent = 'live'; }, 2000);
      }
    }

    // ============================================================
    // REACTIONS
    // ============================================================
    async function toggleReaction(msgId, emoji) {
      try {
        const reactionRef = ref(db, `globalChat/${getRoomPath()}/messages/${msgId}/reactions/${emoji}/${state.userId}`);
        const snapshot = await get(reactionRef);
        if (snapshot.exists()) {
          await remove(reactionRef);
        } else {
          await set(reactionRef, true);
        }
        logEvent(analytics, 'reaction_toggled', { emoji });
      } catch (e) {
        console.warn('Reaction error:', e);
      }
    }

    // ============================================================
    // FIX 3, 12: RENDER MESSAGE WITH FULL ESCAPING
    // ============================================================
    function renderMessage(data, key) {
      if (state.renderedKeys.has(key)) return;
      if (state.sentMessageIds.has(key)) {
        state.renderedKeys.add(key);
        return;
      }

      if (data.deleted) {
        const div = document.createElement('div');
        div.className = 'msg deleted';
        div.dataset.key = key;
        div.innerHTML = `
          <div class="meta">
            <span class="name">${escapeHtml(data.userName || 'anonymous')}</span>
            <span class="time">${formatTime(data.timestamp)}</span>
          </div>
          <div class="text" style="color:#3b7f8a;font-style:italic">[message deleted]</div>
        `;
        container.appendChild(div);
        state.renderedKeys.add(key);
        return;
      }

      const { text, userName, timestamp, userId, type, fileName, fileUrl, fileSize, audioUrl, replyTo, edited } = data;
      const isOwn = userId === state.userId;
      const time = formatTime(timestamp);
      
      const div = document.createElement('div');
      div.className = `msg${isOwn ? ' own' : ''}`;
      div.dataset.key = key;
      div.dataset.userId = userId || '';
      
      let content = `
        <div class="meta">
          <span class="name" data-userid="${escapeHtml(userId || '')}">${escapeHtml(userName || 'anonymous')}</span>
          <span class="time">${escapeHtml(time)}</span>
        </div>
      `;

      if (replyTo) {
        content += `<div class="thread-indicator">↳ replying to ${escapeHtml(replyTo.substring(0,6))}</div>`;
      }

      if (type === 'file') {
        const safeUrl = isValidUrl(fileUrl) ? fileUrl : '#';
        content += `
          <div class="file-attachment">
            <span class="file-icon">📎</span>
            <a href="${escapeHtml(safeUrl)}" target="_blank" class="file-name">${escapeHtml(fileName)}</a>
            <span class="file-size">${(fileSize/1024).toFixed(1)} KB</span>
          </div>
        `;
      } else if (type === 'audio') {
        const safeUrl = isValidUrl(audioUrl) ? audioUrl : '#';
        content += `
          <div class="audio-player">
            <audio controls src="${escapeHtml(safeUrl)}"></audio>
          </div>
        `;
      } else {
        content += `<div class="text${edited ? ' edited' : ''}">${escapeHtml(text)}</div>`;
      }

      if (data.reactions) {
        const emojis = Object.keys(data.reactions);
        if (emojis.length > 0) {
          content += `<div class="reactions">`;
          emojis.forEach(emoji => {
            const users = Object.keys(data.reactions[emoji]);
            const count = users.length;
            const active = users.includes(state.userId);
            content += `
              <span class="reaction${active ? ' active' : ''}" data-emoji="${escapeHtml(emoji)}">
                ${escapeHtml(emoji)} <span class="count">${count}</span>
              </span>
            `;
          });
          content += `</div>`;
        }
      }

      if (data.threadCount) {
        content += `<div class="thread-indicator">💬 ${escapeHtml(String(data.threadCount))} replies</div>`;
      }

      div.innerHTML = content;
      
      div.querySelectorAll('.reaction').forEach(el => {
        el.addEventListener('click', () => {
          const emoji = el.dataset.emoji;
          toggleReaction(key, emoji);
        });
      });

      div.querySelector('.name')?.addEventListener('click', () => {
        const uid = div.dataset.userId;
        if (uid && uid !== state.userId) {
          startDM(uid);
        }
      });

      container.appendChild(div);
      state.renderedKeys.add(key);

      while (container.children.length > state.maxMessages) {
        const first = container.firstChild;
        if (first && first.dataset.key) {
          state.renderedKeys.delete(first.dataset.key);
        }
        if (first) container.removeChild(first);
      }

      container.scrollTop = container.scrollHeight;
    }

    // ============================================================
    // MESSAGE ACTIONS (Edit/Delete/Reply)
    // ============================================================
    function showMessageActions(msgId, data) {
      if (data.userId !== state.userId) {
        state.replyParent = msgId;
        msgInput.placeholder = `↳ Replying to ${data.userName || 'user'}...`;
        msgInput.focus();
        return;
      }

      const action = prompt(`Actions:\n1. Reply\n2. Edit\n3. Delete`, '1');
      if (action === '1') {
        state.replyParent = msgId;
        msgInput.placeholder = `↳ Replying to yourself...`;
        msgInput.focus();
      } else if (action === '2') {
        const newText = prompt('Edit message:', data.text);
        if (newText && newText.trim()) {
          editMessage(msgId, newText.trim());
        }
      } else if (action === '3') {
        if (confirm('Delete this message?')) {
          deleteMessage(msgId);
        }
      }
    }

    async function editMessage(msgId, newText) {
      try {
        const msgRef = ref(db, `globalChat/${getRoomPath()}/messages/${msgId}`);
        await update(msgRef, {
          text: filterProfanity(newText),
          edited: true,
          editedAt: Date.now()
        });
        logEvent(analytics, 'message_edited');
      } catch (e) {
        console.warn('Edit error:', e);
      }
    }

    async function deleteMessage(msgId) {
      try {
        const msgRef = ref(db, `globalChat/${getRoomPath()}/messages/${msgId}`);
        await update(msgRef, {
          deleted: true,
          deletedAt: Date.now()
        });
        logEvent(analytics, 'message_deleted');
      } catch (e) {
        console.warn('Delete error:', e);
      }
    }

    // ============================================================
    // FIX 4: PROPER LISTENER CLEANUP
    // ============================================================
    function cleanupListeners() {
      state.listeners.forEach(listener => {
        if (listener && typeof listener === 'function') {
          try { off(listener); } catch (e) {}
        }
      });
      state.listeners = [];
      state.renderedKeys = new Set();
    }

    // ============================================================
    // LISTEN FOR MESSAGES
    // ============================================================
    function listenMessages() {
      cleanupListeners();
      container.innerHTML = '';

      const msgRef = getMessagesRef();
      const limitedQuery = query(msgRef, orderByChild('timestamp'), limitToLast(100));
      
      get(limitedQuery).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const keys = Object.keys(data).sort((a, b) => (data[a].timestamp || 0) - (data[b].timestamp || 0));
          for (const key of keys) {
            renderMessage(data[key], key);
          }
          state.msgCount = keys.length;
          msgCountEl.textContent = keys.length;
          const countRef = ref(db, `globalChat/${getRoomPath()}/meta/msgCount`);
          set(countRef, keys.length).catch(() => {});
        }
      }).catch(e => console.warn('Initial load error:', e));

      const childListener = onChildAdded(limitedQuery, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          renderMessage(data, snapshot.key);
          if (document.hidden && data.userId !== state.userId) {
            showNotification(data.text || '📎 File shared', data.userName);
          }
        }
      });
      state.listeners.push(childListener);

      const metaListener = onValue(getMetaRef(), (snap) => {
        const val = snap.val();
        if (val !== null && val !== undefined) {
          state.msgCount = val;
          msgCountEl.textContent = val;
        }
      });
      state.listeners.push(metaListener);

      setupTypingIndicator();
    }

    // ============================================================
    // TYPING INDICATOR
    // ============================================================
    function setupTypingIndicator() {
      const typingRef = ref(db, `globalChat/${getRoomPath()}/typing/${state.userId}`);
      
      msgInput.addEventListener('input', () => {
        set(typingRef, { name: state.userName, timestamp: Date.now() });
        clearTimeout(state.typingTimeout);
        state.typingTimeout = setTimeout(() => {
          set(typingRef, null);
        }, 2000);
      });

      const typingListener = onValue(ref(db, `globalChat/${getRoomPath()}/typing`), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const users = Object.keys(data).filter(id => id !== state.userId);
          if (users.length > 0) {
            const names = users.map(id => data[id]?.name || 'someone');
            statusText.textContent = `✍ ${names.join(', ')} typing...`;
          } else {
            statusText.textContent = 'live';
          }
        } else {
          statusText.textContent = 'live';
        }
      });
      state.listeners.push(typingListener);
    }

    // ============================================================
    // NOTIFICATIONS
    // ============================================================
    function showNotification(message, sender) {
      if (document.hidden && Notification.permission === 'granted') {
        new Notification('⍟ TRON', {
          body: `${sender || 'Someone'}: ${message || 'New message'}`,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⚡</text></svg>',
          tag: 'tron-chat',
          requireInteraction: true
        });
      }
    }

    async function requestNotificationPermission() {
      if ('Notification' in window) {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          console.log('🔔 Notifications enabled');
        }
      }
    }

    // ============================================================
    // FIX 9: SEARCH WITH INDEX
    // ============================================================
    function buildSearchIndex() {
      state.searchIndex.clear();
      const messages = container.querySelectorAll('.msg:not(.deleted)');
      messages.forEach(el => {
        const textEl = el.querySelector('.text');
        if (textEl) {
          const text = textEl.textContent.toLowerCase();
          const words = text.split(/\s+/);
          words.forEach(word => {
            if (word.length > 1) {
              if (!state.searchIndex.has(word)) {
                state.searchIndex.set(word, []);
              }
              state.searchIndex.get(word).push(el);
            }
          });
        }
      });
    }

    function performSearch(query) {
      const results = document.getElementById('searchResults');
      results.innerHTML = '';
      if (!query || query.length < 2) {
        results.innerHTML = '<div style="color:#3b7f8a;font-size:0.7rem;padding:8px">Type at least 2 characters</div>';
        return;
      }

      buildSearchIndex();
      const searchTerm = query.toLowerCase();
      const found = new Set();

      for (const [word, elements] of state.searchIndex) {
        if (word.includes(searchTerm) || searchTerm.includes(word)) {
          elements.forEach(el => found.add(el));
        }
      }

      if (found.size === 0) {
        results.innerHTML = '<div style="color:#3b7f8a;font-size:0.7rem;padding:8px">No results found</div>';
        return;
      }

      found.forEach(el => {
        const clone = el.cloneNode(true);
        clone.style.borderLeft = '2px solid #2ab3d0';
        clone.style.background = 'rgba(0,200,255,0.05)';
        results.appendChild(clone);
      });
    }

    // ============================================================
    // LISTEN FOR USERS
    // ============================================================
    function listenUsers() {
      const usersListener = onValue(ref(db, 'globalChat/users'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const keys = Object.keys(data);
          let online = 0;
          const now = Date.now();
          const userListItems = [];
          
          for (const key of keys) {
            const user = data[key];
            const isOnline = user.online !== false && (now - (user.lastSeen || 0) < 60000);
            if (isOnline) online++;
            if (key !== state.userId) {
              userListItems.push(`
                <div class="user-item" data-id="${escapeHtml(key)}">
                  <span class="online-dot ${isOnline ? '' : 'offline'}"></span>
                  ${escapeHtml(user.name || 'anonymous')}
                  <span class="status-text">${isOnline ? '● online' : '○ offline'}</span>
                </div>
              `);
            }
          }
          
          state.userCount = online;
          userCountEl.textContent = online;
          userListContent.innerHTML = userListItems.join('');
          document.querySelectorAll('.user-item').forEach(el => {
            el.addEventListener('click', () => {
              const id = el.dataset.id;
              startDM(id);
            });
          });
        }
      });
      state.listeners.push(usersListener);
    }

    // ============================================================
    // START DM
    // ============================================================
    function startDM(targetId) {
      state.isDM = true;
      state.dmTarget = targetId;
      state.currentRoom = 'dm';
      userList.classList.remove('show');
      
      document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
      roomBtns.forEach(b => b.classList.remove('active'));
      
      const userRef = ref(db, `globalChat/users/${targetId}`);
      get(userRef).then((snap) => {
        const user = snap.val();
        const name = user?.name || 'user';
        statusText.textContent = `💬 DM with ${name}`;
      });
      
      listenMessages();
      logEvent(analytics, 'dm_started', { target: targetId });
    }

    // ============================================================
    // SWITCH ROOM
    // ============================================================
    function switchRoom(room) {
      state.isDM = false;
      state.dmTarget = null;
      state.currentRoom = room;
      userList.classList.remove('show');
      
      document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.room-btn[data-room="${room}"]`)?.classList.add('active');
      
      statusText.textContent = `#${room}`;
      listenMessages();
      
      const userRef = ref(db, `globalChat/users/${state.userId}`);
      update(userRef, { room }).catch(() => {});
    }

    // ============================================================
    // FIX 10: CONNECTION MONITORING
    // ============================================================
    function setupConnectionMonitor() {
      const conn = navigator.connection;
      if (conn) {
        conn.addEventListener('change', () => {
          const quality = conn.effectiveType || '4g';
          const icons = { '4g': '📶', '3g': '📶', '2g': '📶', 'slow-2g': '📶' };
          connectionBadge.textContent = `${icons[quality] || '📶'} ${quality.toUpperCase()}`;
        });
      }

      const connectedRef = ref(db, '.info/connected');
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          statusDot.className = 'dot';
          statusText.textContent = '⍟ connected';
          flushOfflineQueue();
        } else {
          statusDot.className = 'dot offline';
          statusText.textContent = '📴 disconnected';
        }
      });

      window.addEventListener('online', () => {
        statusDot.className = 'dot';
        statusText.textContent = '⍟ reconnected';
        setTimeout(() => { statusText.textContent = 'live'; }, 1500);
      });

      window.addEventListener('offline', () => {
        statusDot.className = 'dot offline';
        statusText.textContent = '📴 offline';
      });
    }

    // ============================================================
    // EMOJI PICKER
    // ============================================================
    function setupEmojiPicker() {
      const emojis = ['😊', '🔥', '⚡', '💎', '🚀', '❤️', '😂', '👋', '👍', '🎉', '✨', '💯', '👀', '🛸', '⍟', '💪', '🙌', '🎯', '🌟', '💫'];
      emojiPicker.innerHTML = emojis.map(e => `
        <button class="emoji-btn" data-emoji="${escapeHtml(e)}">${escapeHtml(e)}</button>
      `).join('');
      
      emojiPicker.querySelectorAll('.emoji-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          msgInput.value += btn.dataset.emoji;
          emojiPicker.classList.remove('show');
          msgInput.focus();
        });
      });
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      if (e.key === 'Escape') {
        emojiPicker.classList.remove('show');
        userList.classList.remove('show');
        state.replyParent = null;
        msgInput.placeholder = 'Type message...';
      }
    });

    // ============================================================
    // EVENT BINDINGS
    // ============================================================
    sendBtn.addEventListener('click', () => sendMessage());

    roomBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const room = btn.dataset.room;
        if (room) switchRoom(room);
      });
    });

    dmToggle.addEventListener('click', () => {
      userList.classList.toggle('show');
      emojiPicker.classList.remove('show');
    });

    emojiBtn.addEventListener('click', () => {
      emojiPicker.classList.toggle('show');
      userList.classList.remove('show');
    });

    fileBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,.pdf,.doc,.docx,.txt,.zip';
      input.multiple = false;
      input.onchange = (e) => {
        if (e.target.files.length > 0) {
          uploadFile(e.target.files[0]);
        }
        input.remove();
      };
      input.click();
    });

    micBtn.addEventListener('click', toggleRecording);

    profileBtn.addEventListener('click', () => {
      loadProfile();
      profileModal.classList.toggle('show');
      userList.classList.remove('show');
    });

    document.getElementById('profileClose').addEventListener('click', () => {
      profileModal.classList.remove('show');
    });

    document.getElementById('profileSave').addEventListener('click', saveProfile);

    searchBtn.addEventListener('click', () => {
      searchModal.classList.toggle('show');
      userList.classList.remove('show');
      document.getElementById('searchInput').focus();
    });

    document.getElementById('searchClose').addEventListener('click', () => {
      searchModal.classList.remove('show');
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      performSearch(e.target.value);
    });

    // Close modals on outside click
    document.addEventListener('click', (e) => {
      if (e.target === profileModal) profileModal.classList.remove('show');
      if (e.target === searchModal) searchModal.classList.remove('show');
      if (!e.target.closest('#userList') && !e.target.closest('#dmToggle')) {
        userList.classList.remove('show');
      }
      if (!e.target.closest('#emojiPicker') && !e.target.closest('#emojiBtn')) {
        emojiPicker.classList.remove('show');
      }
    });

    // ============================================================
    // INIT
    // ============================================================
    (async function init() {
      initUser();
      registerUser();
      listenUsers();
      setupEmojiPicker();
      setupConnectionMonitor();
      await requestNotificationPermission();
      switchRoom('general');
      
      setTimeout(() => { msgInput.focus(); }, 300);
      
      console.log('⍟ TRON ENTERPRISE CHAT INITIALIZED');
      console.log(`👤 ${state.userName} (${state.userId})`);
      logEvent(analytics, 'app_start', { userId: state.userId });
    })();

    // ============================================================
    // HEARTBEAT
    // ============================================================
    setInterval(() => {
      const userRef = ref(db, `globalChat/users/${state.userId}`);
      update(userRef, {
        lastSeen: Date.now(),
        online: true,
        room: state.currentRoom
      }).catch(() => {});
    }, 30000);

    // ============================================================
    // CLEANUP
    // ============================================================
    window.addEventListener('beforeunload', () => {
      const userRef = ref(db, `globalChat/users/${state.userId}`);
      set(userRef, { online: false, lastSeen: Date.now() }).catch(() => {});
      cleanupListeners();
      logEvent(analytics, 'app_close', { userId: state.userId });
    });
  </script>
</body>
</html>
