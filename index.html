<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK Lives X — Bank Realistik">
    <title>ZACK Lives X — Bank</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK Lives X","short_name":"ZACK","display":"standalone","theme_color":"%23000000","background_color":"%23000000"}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');
        :root{--r:#ff0033;--c:#00f0ff;--g:#ffd700;--b:#000;--w:#fff;--m:#999;--s:#00ff88;--br:rgba(0,240,255,.3);--gd:linear-gradient(135deg,#ff0033,#ff4455,#00f0ff);--st:env(safe-area-inset-top,0);--sb:env(safe-area-inset-bottom,0)}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{background:var(--b);font-family:'Rajdhani',sans-serif;color:var(--w);height:100dvh;overflow:hidden;touch-action:manipulation}
        ::-webkit-scrollbar{width:0;height:0}
        .aurora{position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,0,51,.08),transparent 50%),radial-gradient(circle at 80% 70%,rgba(0,240,255,.08),transparent 50%);z-index:0;pointer-events:none}
        .header{position:fixed;top:0;left:0;right:0;z-index:100;padding:calc(12px + var(--st)) 15px;background:rgba(0,0,0,.9);border-bottom:1px solid var(--br);display:flex;justify-content:space-between;align-items:center}
        .logo{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#ff0033,#ff4455,#00f0ff,#ffd700);background-size:400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .badge{font-size:7px;font-family:'Orbitron',sans-serif;padding:4px 8px;border-radius:10px;border:1px solid var(--s);color:var(--s)}
        .badge.mati{border-color:var(--r);color:var(--r)}
        .main{position:relative;z-index:2;padding:calc(55px + var(--st)) 8px calc(60px + var(--sb));max-width:600px;margin:0 auto;height:100dvh;overflow-y:auto}
        .tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 8px calc(6px + var(--sb));background:rgba(0,0,0,.95);border-top:1px solid var(--br);display:flex;justify-content:space-around;max-width:600px;margin:0 auto}
        .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;background:none;border:none;color:var(--m);font-family:'Orbitron',sans-serif;font-size:6px;cursor:pointer;border-radius:8px}
        .tab.aktif{color:var(--c)}
        .tab .ikon{font-size:16px}
        .halaman{display:none}
        .halaman.aktif{display:block;animation:f .3s}
        @keyframes f{from{opacity:0;transform:translateY(8px)}}
        .kad{border:1px solid var(--br);border-radius:14px;background:rgba(0,0,0,.5);padding:10px;margin-bottom:6px}
        .kad h3{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--c);margin-bottom:6px}
        .input{width:100%;padding:10px 15px;background:rgba(0,0,0,.7);border:1px solid var(--br);color:var(--w);font-family:'Rajdhani',sans-serif;font-size:13px;border-radius:25px;outline:none;margin-bottom:6px}
        .grid-stat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .kotak{background:rgba(0,0,0,.5);border:1px solid var(--br);border-radius:10px;padding:10px 6px;text-align:center}
        .label{font-size:7px;color:var(--m);font-family:'Orbitron',sans-serif}
        .nilai{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;margin-top:3px}
        .bar{height:4px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden;margin-top:4px}
        .isi{height:100%}
        .fh{background:var(--s)}.fk{background:var(--g)}.fm{background:var(--r)}
        .butang{width:100%;padding:10px;background:var(--gd);color:var(--w);font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:1px;border:none;border-radius:25px;font-weight:700;cursor:pointer;margin-bottom:3px}
        .butang:disabled{opacity:.3}
        .butang-k{width:100%;padding:7px 10px;background:rgba(255,0,51,.06);border:1px solid var(--br);color:var(--c);font-family:'Orbitron',sans-serif;font-size:7px;border-radius:15px;cursor:pointer;margin-bottom:3px;text-align:left}
        .butang-k:disabled{opacity:.3}
        .butang-modal{width:100%;padding:10px;background:rgba(0,0,0,.8);border:1px solid var(--g);color:var(--g);font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1px;border-radius:15px;cursor:pointer;margin-bottom:4px;text-align:left}
        .modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;padding:20px}
        .modal.aktif{display:flex}
        .modal-kandungan{width:100%;max-width:400px;max-height:80dvh;overflow-y:auto;border:1px solid var(--br);border-radius:16px;background:var(--b);padding:15px}
        .modal-kandungan h3{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--c);margin-bottom:10px;letter-spacing:2px}
        .modal-tutup{width:100%;padding:10px;background:transparent;border:1px solid var(--r);color:var(--r);font-family:'Orbitron',sans-serif;font-size:8px;border-radius:25px;cursor:pointer;margin-top:10px}
        .pil{border:1px solid var(--g);border-radius:10px;background:rgba(255,215,0,.08);padding:8px;margin-bottom:6px}
        .pil-t{font-family:'Orbitron',sans-serif;font-size:8px;color:var(--g);margin-bottom:4px}
        .pil-d{font-size:9px;margin-bottom:6px}
        .log-v{height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:7px}
        .log{padding:5px 8px;border-radius:5px;background:rgba(0,0,0,.4);border-left:3px solid var(--c)}
        .log.sistem{border-color:var(--m)}.log.tindakan{border-color:var(--c)}.log.amaran{border-color:var(--g)}.log.bahaya{border-color:var(--r)}.log.kematian{border-color:var(--r);background:rgba(255,0,51,.1)}
        .log-meta{display:flex;justify-content:space-between;font-size:6px;color:var(--m);font-family:'Orbitron',sans-serif}
        .pemain{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(0,0,0,.4);border:1px solid var(--br);border-radius:10px;margin-bottom:3px;font-size:9px}
        .pemain-nama{color:var(--c);font-family:'Orbitron',sans-serif}
        .pemain-bank{color:var(--s)}
        .pemain-mati{opacity:.4;border-color:var(--r)}
        .pemain-mati .pemain-nama{color:var(--r);text-decoration:line-through}
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="header"><div class="logo">ZACK BANK</div><span id="umur" class="badge">UMUR 30</span></div>
    <div class="main">
        <div class="halaman aktif" id="hal-login">
            <div class="kad"><h3>🔐 LOGIN</h3><input type="text" id="nama" class="input" placeholder="NAMA PENGGUNA" maxlength="20"><input type="password" id="kata" class="input" placeholder="KATA LALUAN" maxlength="20"><button class="butang" id="btnLogin">MASUK</button><button class="butang" id="btnDaftar" style="background:transparent;border:1px solid var(--c);color:var(--c)">DAFTAR BARU</button></div>
        </div>
        <div class="halaman" id="hal-status">
            <div class="kad">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">📊 AKAUN</h3><span id="status" class="badge">AKTIF</span></div>
                <div class="grid-stat" id="sg"></div>
                <button class="butang" id="langkah" style="margin-top:8px">⚡ BULAN SETERUSNYA</button>
            </div>
            <div id="ch"></div>
        </div>
        <div class="halaman" id="hal-tindakan">
            <div class="kad"><h3>🎯 OPERASI BANK</h3><div id="tindakan"></div></div>
        </div>
        <div class="halaman" id="hal-pemain">
            <div class="kad"><h3>👥 SENARAI PEMAIN</h3><div id="senaraiPemain"></div></div>
        </div>
        <div class="halaman" id="hal-log">
            <div class="kad"><h3>📜 ALIRAN</h3><div class="log-v" id="log"></div></div>
        </div>
    </div>
    <div class="tab-bar" id="tabBar" style="display:none">
        <button class="tab aktif" onclick="tukar('status',this)"><span class="ikon">📊</span>AKAUN</button>
        <button class="tab" onclick="tukar('tindakan',this)"><span class="ikon">🎯</span>OPERASI</button>
        <button class="tab" onclick="tukar('pemain',this)"><span class="ikon">👥</span>PEMAIN</button>
        <button class="tab" onclick="tukar('log',this)"><span class="ikon">📜</span>ALIRAN</button>
    </div>
    <div class="modal" id="modal">
        <div class="modal-kandungan">
            <h3 id="modalTajuk">🎯 OPERASI</h3>
            <div id="modalIsi"></div>
            <button class="modal-tutup" onclick="tutupModal()">✕ TUTUP</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
    'use strict';
    const $=id=>document.getElementById(id),M=Math;
    const db=firebase.initializeApp({databaseURL:'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'}).database();
    let pengguna=null,s=null;
    const KUMPULAN={
        '💳 Akaun':[
            {i:'b1',n:'Buka Akaun Simpanan',c:100,e:s=>{if(s.bank<100)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=100;s.simpanan+=100;return{teks:'Akaun simpanan dibuka +$100',aras:'tindakan'}}},
            {i:'b2',n:'Buka Akaun Tetap',c:500,e:s=>{if(s.bank<500)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=500;s.simpanan+=500;s.tetap=(s.tetap||0)+500;return{teks:'Akaun tetap dibuka +$500 (faedah 3%)',aras:'tindakan'}}}
        ],
        '💰 Pinjaman':[
            {i:'b3',n:'Pinjaman Peribadi',c:0,e:s=>{s.bank+=2000;s.hutang+=2000;return{teks:'Pinjaman $2000 diterima',aras:'amaran'}}},
            {i:'b4',n:'Pinjaman Perumahan',c:0,e:s=>{s.bank+=50000;s.hutang+=50000;s.aset+=100000;return{teks:'Pinjaman rumah $50k, aset +$100k',aras:'amaran'}}},
            {i:'b5',n:'Bayar Hutang',c:500,e:s=>{if(s.bank<500)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=500;s.hutang=M.max(0,s.hutang-500);return{teks:'Hutang -$500',aras:'tindakan'}}}
        ],
        '📈 Pelaburan':[
            {i:'b6',n:'Labur Saham',c:1000,e:s=>{if(s.bank<1000)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=1000;s.pelaburan=(s.pelaburan||0)+1000;return{teks:'Pelaburan saham +$1000',aras:'tindakan'}}},
            {i:'b7',n:'Beli Emas',c:2000,e:s=>{if(s.bank<2000)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=2000;s.emas=(s.emas||0)+2000;return{teks:'Emas dibeli +$2000',aras:'tindakan'}}}
        ],
        '🛡️ Insurans':[
            {i:'b8',n:'Insurans Hayat',c:100,e:s=>{if(s.bank<100)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=100;s.insurans=(s.insurans||0)+1;return{teks:'Insurans hayat dibeli',aras:'tindakan'}}},
            {i:'b9',n:'Insurans Kesihatan',c:200,e:s=>{if(s.bank<200)return{teks:'Baki tidak cukup',aras:'amaran'};s.bank-=200;s.insurans=(s.insurans||0)+1;return{teks:'Insurans kesihatan dibeli',aras:'tindakan'}}}
        ],
        '💸 Transfer':[
            {i:'b10',n:'Transfer Wang',c:0,e:s=>{bukaTransfer();return{teks:'Sila pilih penerima',aras:'sistem'}}}
        ]
    };
    const C=[
        {n:'Kenaikan Kadar Faedah',d:'BNM menaikkan kadar faedah.',o:[{l:'Simpan Lebih',v:()=>1,r:s=>{s.bank=M.max(0,s.bank-300);s.simpanan+=300;return{teks:'Simpanan +$300',aras:'tindakan'}}},{l:'Biarkan',v:()=>1,r:s=>({teks:'Tiada tindakan',aras:'sistem'})}]},
        {n:'Peluang Pelaburan',d:'Saham IPO dengan risiko tinggi.',o:[{l:'Labur $1000',v:s=>s.bank>=1000,r:s=>{s.bank-=1000;const u=M.random()>.5?2000:-500;s.bank+=M.max(0,u);return{teks:u>0?'Untung +$2000':'Rugi -$500',aras:u>0?'tindakan':'bahaya'}}},{l:'Tolak',v:()=>1,r:s=>({teks:'Ditolak',aras:'sistem'})}]}
    ];
    function tukar(nama,btn){document.querySelectorAll('.halaman').forEach(h=>h.classList.remove('aktif'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('aktif'));$('hal-'+nama).classList.add('aktif');if(btn)btn.classList.add('aktif');if(nama==='pemain')muatPemain()}
    function simpanProfil(){if(!pengguna)return;db.ref('profil/'+pengguna).update(s).catch(()=>{})}
    function muatProfil(nama){db.ref('profil/'+nama).once('value').then(snap=>{if(snap.exists()){s=snap.val();s.ch=null}else{s={umur:30,hidup:1,bank:5000,simpanan:2000,tetap:0,hutang:0,pelaburan:0,emas:0,insurans:0,gaji:3000,ch:null};db.ref('profil/'+nama).set(s).catch(()=>{})}papar([])})}
    function muatPemain(){db.ref('profil').on('value',snap=>{const list=[];if(snap.exists()){snap.forEach(child=>{const d=child.val();list.push({nama:child.key,bank:d.bank||0,hidup:d.hidup!==0})})}list.sort((a,b)=>(b.hidup?b.bank:0)-(a.hidup?a.bank:0));$('senaraiPemain').innerHTML=list.map(p=>`<div class="pemain ${!p.hidup?'pemain-mati':''}"><span class="pemain-nama">${p.nama}${p.nama===pengguna?' (Anda)':''}${!p.hidup?' 💀':''}</span><span class="pemain-bank">${p.hidup?'$'+p.bank.toFixed(0):'Meninggal'}</span></div>`).join('')||'<p style="color:var(--m);font-size:9px;">Tiada pemain.</p>'})}
    function bukaModal(kumpulan){
        $('modalTajuk').textContent=kumpulan;
        const actions=KUMPULAN[kumpulan];
        $('modalIsi').innerHTML=actions.map(a=>`<button class="butang-k" ${!s.hidup||!!s.ch?'disabled':''} onclick="ea('${a.i}');tutupModal()">${a.n} ${a.c>0?`<span style="color:var(--m)">$${a.c}</span>`:''}</button>`).join('');
        $('modal').classList.add('aktif');
    }
    function tutupModal(){$('modal').classList.remove('aktif')}
    function bukaTransfer(){
        $('modalTajuk').textContent='💸 TRANSFER';
        $('modalIsi').innerHTML=`<input type="text" id="penerima" class="input" placeholder="NAMA PENERIMA"><input type="number" id="jumlah" class="input" placeholder="JUMLAH ($)"><button class="butang" id="btnTransfer">HANTAR</button>`;
        $('modal').classList.add('aktif');
        $('btnTransfer').addEventListener('click',()=>{
            const penerima=$('penerima').value.trim(),jumlah=parseInt($('jumlah').value);
            if(!penerima||!jumlah||jumlah<=0||penerima===pengguna)return;
            if(s.bank<jumlah){papar([{id:0,nama:'TRANSFER',kategori:'Bank',teks:'Baki tidak cukup',aras:'bahaya'}]);return}
            db.ref('profil/'+penerima).once('value').then(snap=>{
                if(!snap.exists()){papar([{id:0,nama:'TRANSFER',kategori:'Bank',teks:'Penerima tidak wujud',aras:'amaran'}]);return}
                const data=snap.val();if(data.hidup===0){papar([{id:0,nama:'TRANSFER',kategori:'Bank',teks:'Penerima telah meninggal',aras:'amaran'}]);return}
                data.bank=(data.bank||0)+jumlah;s.bank-=jumlah;
                db.ref('profil/'+penerima).update({bank:data.bank}).catch(()=>{});
                simpanProfil();
                tutupModal();
                papar([{id:0,nama:'TRANSFER',kategori:'Bank',teks:`$${jumlah} dihantar kepada ${penerima}`,aras:'tindakan'}]);
            })
        })
    }
    function langkah(){
        if(!s.hidup||s.ch)return[];
        const L=[];s.umur++;
        const faedahSimpanan=M.floor(s.simpanan*.02);
        s.simpanan+=faedahSimpanan;
        const faedahTetap=M.floor((s.tetap||0)*.03);
        s.tetap=(s.tetap||0)+faedahTetap;
        const faedahHutang=M.floor(s.hutang*.05);
        s.hutang+=faedahHutang;
        s.bank=M.max(0,s.bank-M.floor(500+s.umur*.5));
        if(faedahHutang>0)L.push({id:0,nama:'FAEDAH HUTANG',kategori:'Bank',teks:`Faedah hutang +$${faedahHutang}`,aras:'amaran'});
        if(s.hutang>100000&&M.random()<.2){s.hidup=0;L.push({id:0,nama:'MUFLIS',kategori:'Bank',teks:'Diisytiharkan muflis',aras:'kematian'})}
        if(M.random()<.2)s.ch=C[M.floor(M.random()*C.length)];
        simpanProfil();return L;
    }
    function papar(L=[]){
        if(!s)return;
        $('umur').textContent=`UMUR ${s.umur}`;$('status').textContent=s.hidup?'AKTIF':'MUFLIS';$('status').className=`badge ${s.hidup?'':'mati'}`;$('langkah').disabled=!s.hidup||!!s.ch;
        const st=[{l:'BANK',v:'$'+s.bank.toFixed(0)},{l:'SIMPANAN',v:'$'+s.simpanan.toFixed(0)},{l:'TETAP',v:'$'+(s.tetap||0).toFixed(0)},{l:'HUTANG',v:'$'+s.hutang.toFixed(0)},{l:'PELABURAN',v:'$'+(s.pelaburan||0).toFixed(0)},{l:'EMAS',v:'$'+(s.emas||0).toFixed(0)},{l:'INSURANS',v:s.insurans||0},{l:'GAJI',v:'$'+s.gaji.toFixed(0)}];
        $('sg').innerHTML=st.map(x=>`<div class="kotak"><div class="label">${x.l}</div><div class="nilai">${x.v}</div></div>`).join('');
        $('ch').innerHTML=s.ch?`<div class="pil"><div class="pil-t">⚡ ${s.ch.n}</div><div class="pil-d">${s.ch.d}</div>${s.ch.o.map((o,i)=>`<button class="butang-k" ${!o.v(s)?'disabled':''} onclick="rc(${i})">${o.l}</button>`).join('')}</div>`:'';
        $('tindakan').innerHTML=Object.keys(KUMPULAN).map(k=>`<button class="butang-modal" ${!s.hidup||!!s.ch?'disabled':''} onclick="bukaModal('${k}')">${k} →</button>`).join('');
        if(L.length){const f=document.createDocumentFragment();L.forEach(x=>{const d=document.createElement('div');d.className=`log ${x.aras}`;d.innerHTML=`<div class="log-meta"><span>${x.kategori}</span><span>Umur ${s.umur}</span></div><strong>${x.nama}</strong> — ${x.teks}`;f.appendChild(d)});$('log').appendChild(f);$('log').scrollTop=$('log').scrollHeight}
    }
    window.ea=id=>{let found=null;Object.values(KUMPULAN).forEach(list=>{const a=list.find(x=>x.i===id);if(a)found=a});if(!found||!s.hidup||s.bank<found.c)return;const r=found.e(s);if(found.i!=='b10')papar([{id:0,nama:found.n,kategori:'Bank',teks:r.teks,aras:r.aras}]);simpanProfil()};
    window.rc=i=>{if(!s.ch||!s.hidup)return;const o=s.ch.o[i];if(!o||!o.v(s))return;const r=o.r(s);s.ch=null;papar([{id:0,nama:'KEPUTUSAN',kategori:'Pilihan',teks:r.teks,aras:r.aras}]);simpanProfil()};
    $('btnDaftar').addEventListener('click',()=>{
        const nama=$('nama').value.trim(),kata=$('kata').value.trim();
        if(!nama||!kata)return;
        db.ref('auth/'+nama).once('value').then(snap=>{
            if(snap.exists()){papar([{id:0,nama:'DAFTAR',kategori:'Auth',teks:'Nama sudah wujud',aras:'amaran'}]);return}
            db.ref('auth/'+nama).set({password:kata}).then(()=>{
                const profil={umur:30,hidup:1,bank:5000,simpanan:2000,tetap:0,hutang:0,pelaburan:0,emas:0,insurans:0,gaji:3000,ch:null};
                db.ref('profil/'+nama).set(profil).then(()=>{papar([{id:0,nama:'DAFTAR',kategori:'Auth',teks:'Pendaftaran berjaya!',aras:'tindakan'}])});
            })
        })
    });
    $('btnLogin').addEventListener('click',()=>{
        const nama=$('nama').value.trim(),kata=$('kata').value.trim();
        if(!nama||!kata)return;
        db.ref('auth/'+nama).once('value').then(snap=>{
            if(!snap.exists()){papar([{id:0,nama:'LOGIN',kategori:'Auth',teks:'Nama tidak wujud',aras:'amaran'}]);return}
            if(snap.val().password!==kata){papar([{id:0,nama:'LOGIN',kategori:'Auth',teks:'Kata laluan salah',aras:'bahaya'}]);return}
            pengguna=nama;
            $('hal-login').classList.remove('aktif');
            $('tabBar').style.display='flex';
            tukar('status');
            document.querySelectorAll('.tab')[0].classList.add('aktif');
            muatProfil(nama);
        })
    });
    $('langkah').addEventListener('click',()=>papar(langkah()));
    </script>
</body>
</html>
