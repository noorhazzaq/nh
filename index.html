<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>💔 Healing Heart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden;position:relative}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#trail-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.container{max-width:700px;width:100%;background:rgba(26,26,46,.75);backdrop-filter:blur(30px);border-radius:24px;padding:24px;box-shadow:0 20px 80px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);text-align:center;position:relative;z-index:1;border:1px solid rgba(255,255,255,.05);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:2rem;margin-bottom:4px;background:linear-gradient(135deg,#e94560,#ff6b81,#fbbf24,#34d399);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:grad 6s ease-in-out infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{font-size:.85rem;opacity:.7;margin-bottom:8px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.badge{display:inline-block;padding:6px 20px;border-radius:50px;font-size:.7rem;font-weight:600;margin-bottom:12px;animation:bp 2s ease-in-out infinite;background:rgba(233,69,96,.15);color:#e94560;border:1px solid rgba(233,69,96,.2);box-shadow:0 0 40px rgba(233,69,96,.1)}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.heart-beat{font-size:4rem;display:block;animation:heartbeat 1.2s ease-in-out infinite;margin:8px 0}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1.1)}42%{transform:scale(1.2)}70%{transform:scale(1)}}
.quote-box{min-height:120px;display:flex;align-items:center;justify-content:center;padding:12px;margin:8px 0;background:rgba(255,255,255,.02);border-radius:16px;border:1px solid rgba(255,255,255,.03)}
.quote-text{font-size:1.1rem;line-height:1.6;opacity:.9;font-style:italic}
.quote-text .author{display:block;font-size:.75rem;opacity:.5;margin-top:6px;font-style:normal}
.quote-counter{font-size:.6rem;opacity:.3;margin:6px 0}
.btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.btn{padding:10px 20px;border:none;border-radius:50px;font-size:.75rem;font-weight:600;cursor:pointer;transition:.3s;position:relative;overflow:hidden;flex:1;min-width:80px;max-width:140px}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:.3s}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.95)}
.btn--heal{background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 4px 30px rgba(52,211,153,.3)}
.btn--heal:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(52,211,153,.5)}
.btn--cry{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;box-shadow:0 4px 30px rgba(96,165,250,.3)}
.btn--cry:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(96,165,250,.5)}
.btn--angry{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;box-shadow:0 4px 30px rgba(251,146,60,.3)}
.btn--angry:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(251,146,60,.5)}
.btn--reset{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 4px 30px rgba(167,139,250,.3)}
.btn--reset:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(167,139,250,.5)}
.btn--rand{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff;box-shadow:0 4px 30px rgba(244,114,182,.3)}
.btn--rand:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(244,114,182,.5)}
.progress{width:100%;height:4px;background:rgba(255,255,255,.05);border-radius:10px;margin:12px 0;overflow:hidden}
.progress .bar{height:100%;background:linear-gradient(90deg,#e94560,#fbbf24,#34d399);border-radius:10px;width:0%;transition:width 1s ease}
.heal-note{font-size:.75rem;opacity:.5;margin-top:4px;letter-spacing:.5px}
.clock{font-size:.6rem;opacity:.3;margin-top:12px;font-variant-numeric:tabular-nums}
.flower{position:fixed;font-size:2rem;pointer-events:none;z-index:0;animation:ff 25s ease-in-out infinite;opacity:.1}
@keyframes ff{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}25%{transform:translateY(-40px) rotate(20deg) scale(1.1)}50%{transform:translateY(20px) rotate(-10deg) scale(.9)}75%{transform:translateY(-20px) rotate(10deg) scale(1.05)}}
@media(max-width:480px){.container{padding:16px}h1{font-size:1.5rem}.heart-beat{font-size:3rem}.quote-text{font-size:.95rem}.btn{padding:8px 12px;font-size:.65rem;min-width:60px}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="trail-canvas"></canvas>

<div class="flower" style="top:5%;left:3%;animation-delay:0s">💔</div>
<div class="flower" style="top:15%;right:5%;animation-delay:-4s">🌹</div>
<div class="flower" style="bottom:20%;left:8%;animation-delay:-8s">🌷</div>
<div class="flower" style="bottom:10%;right:3%;animation-delay:-12s">🕊️</div>
<div class="flower" style="top:45%;left:2%;animation-delay:-16s">🌿</div>
<div class="flower" style="top:60%;right:2%;animation-delay:-20s">🌱</div>

<div class="container">
<div class="badge" id="badge">💔 Heartbroken</div>
<h1>💔 Healing Heart</h1>
<div class="sub">It's okay to feel broken right now</div>
<div class="heart-beat" id="heart">💔</div>

<div class="quote-box">
<div class="quote-text" id="quote">"The wound is where the light enters you."<span class="author">— Rumi</span></div>
</div>
<div class="quote-counter" id="counter">Quote 1 of 99</div>

<div class="progress"><div class="bar" id="bar"></div></div>
<div class="heal-note" id="note">Healing: 0%</div>

<div class="btn-group">
<button class="btn btn--heal" onclick="getQuote('heal')">🌱 Heal</button>
<button class="btn btn--cry" onclick="getQuote('cry')">😢 Cry</button>
<button class="btn btn--angry" onclick="getQuote('angry')">😤 Angry</button>
<button class="btn btn--reset" onclick="getQuote('reset')">🔄 Reset</button>
<button class="btn btn--rand" onclick="getQuote('rand')">🎲 Random</button>
</div>

<div class="clock" id="clock"></div>
</div>

<script>
// ============================================================
// 99 QUOTES
// ============================================================

var quotes={
heal:[
'"The wound is the place where the Light enters you." — Rumi',
'"Healing is not about changing who you are. It\'s about becoming who you were meant to be."',
'"Sometimes the hardest part isn\'t letting go but learning to start over."',
'"You can\'t heal what you refuse to feel."',
'"Healing takes time, and asking for help is a courageous step."',
'"The soul always knows what to do to heal itself. The challenge is to silence the mind."',
'"You are allowed to fall apart. You are allowed to heal."',
'"Healing is a journey. Not a destination."',
'"Every storm runs out of rain." — Maya Angelou',
'"You are not your past. You are the future that is healing."',
'"The lotus blooms in the mud. So can you."',
'"Healing is the process of becoming whole again."',
'"You are worthy of healing. You are worthy of love."',
'"Let your tears water the seeds of your new growth."',
'"Healing is not linear. It\'s a spiral."',
'"Your heart knows the way. Trust it."',
'"Healing begins when you choose to forgive yourself."',
'"The sun will rise again. And so will you."',
'"You are stronger than you think. Braver than you feel."',
'"Healing is the art of letting go and letting in."',
'"Every day is a new chance to heal."',
'"You are not broken. You are becoming."',
'"Healing is the courage to feel everything."',
'"The pain you feel today is the strength you feel tomorrow."',
'"You are the author of your own healing story."',
'"Healing is a gift you give yourself."',
'"Your heart is a garden. Tend it with love."',
'"Healing is not about forgetting. It\'s about forgiving."',
'"You are worthy of peace. You are worthy of joy."',
'"The best way to heal is to feel."',
'"Healing is a dance between holding on and letting go."',
'"You are not alone in your healing journey."',
'"Healing is the process of becoming more yourself."',
'"Your wounds are not your identity. They are your history."',
'"Healing is the bridge between pain and purpose."',
'"You have survived 100% of your worst days. You can heal."',
'"Healing is the greatest act of self-love."',
'"Your heart knows how to heal. Let it."',
'"Healing is not about being perfect. It\'s about being whole."',
'"The night is darkest before the dawn. Heal towards the light."',
'"Healing is the art of becoming."',
'"You are a masterpiece in progress."',
'"Healing is the courage to begin again."',
'"Your soul is healing. Be patient."',
'"Healing is the journey home to yourself."',
'"You are enough. You are healing."',
'"Healing is the power of love."',
'"Your heart is healing. Believe it."',
'"Healing is the light within you."',
'"You are whole. You are healing."'
],
cry:[
'"Crying is not weakness. It\'s courage to feel."',
'"Tears are the language of the soul."',
'"Sometimes the only way to heal is to cry."',
'"Let your tears water the garden of your heart."',
'"Crying is the rain that washes away the pain."',
'"It\'s okay to not be okay."',
'"Your tears are a sign of your strength, not weakness."',
'"Cry if you need to. It\'s the first step to healing."',
'"Tears are the healing balm for the broken heart."',
'"The heart cries so the soul can heal."',
'"Crying is the soul\'s way of releasing pain."',
'"Your tears are a prayer for healing."',
'"It\'s okay to fall apart sometimes."',
'"Crying is the beginning of healing."',
'"Your tears are a sign of your humanity."',
'"Let the tears flow. They are healing you."',
'"Crying is the medicine for the broken heart."',
'"Your tears are the river to your healing."',
'"It\'s okay to cry. It\'s okay to heal."',
'"Tears are the proof you are alive."',
'"Crying is the soul\'s release."',
'"Your tears are a gift to yourself."',
'"Let the tears cleanse your soul."',
'"Crying is the path to healing."',
'"Your tears are the rain of renewal."'
],
angry:[
'"Anger is a signal. Listen to what it tells you."',
'"Your anger is a gift. It tells you where your boundaries are."',
'"Anger is the fire that burns away the old."',
'"It\'s okay to be angry. It\'s part of healing."',
'"Anger is the energy of transformation."',
'"Your anger is a protector. Thank it and release it."',
'"Anger is the voice of your inner truth."',
'"Let your anger be the fuel for change."',
'"Anger is the flame that lights the way to healing."',
'"It\'s okay to feel angry. It\'s part of being human."',
'"Anger is the bridge between pain and power."',
'"Your anger is a sign you are alive."',
'"Anger is the fire that purifies."',
'"Let your anger be your teacher."',
'"Anger is the energy of self-respect."',
'"Your anger is a call for healing."',
'"Anger is the beginning of liberation."',
'"It\'s okay to be angry. It\'s how you heal."',
'"Anger is the light in the darkness."',
'"Your anger is a gift to yourself."',
'"Anger is the path to freedom."',
'"Let your anger heal you."',
'"Anger is the fire of the soul."',
'"Your anger is a sign you are ready to heal."'
],
reset:[
'"Every day is a new beginning. Take a deep breath."',
'"Reset your heart. Reset your mind. Reset your life."',
'"You are not your past. You are your future."',
'"Every moment is a chance to start again."',
'"Reset. Restart. Refocus."',
'"The best time to start over is now."',
'"You can always begin again."',
'"Reset your soul. Renew your spirit."',
'"Every sunrise is a reset."',
'"You are worthy of a fresh start."',
'"Reset your heart and let love in."',
'"The power of reset is the power of you."',
'"Start again. You are stronger now."',
'"Reset is the path to freedom."',
'"Every breath is a reset."',
'"You are the author of your new beginning."',
'"Reset your mind. Reclaim your life."',
'"The reset button is always available."',
'"You are worthy of a new chapter."',
'"Reset. Restart. Rise."',
'"Your healing starts with a reset."',
'"Reset your heart. Reset your soul."',
'"The magic of reset is the magic of you."',
'"You are the reset you need."'
]
};

// ============================================================
// QUOTE ENGINE
// ============================================================

var healProgress=0;
var used=[];
var currentType='heal';

function getQuote(type){
var pool=[];
if(type==='heal')pool=quotes.heal;
else if(type==='cry')pool=quotes.cry;
else if(type==='angry')pool=quotes.angry;
else if(type==='reset')pool=quotes.reset;
else{var all=[].concat(quotes.heal,quotes.cry,quotes.angry,quotes.reset);pool=all}
if(pool.length===0)pool=['💫 "You are enough. You are healing."'];
var q=pool[Math.floor(Math.random()*pool.length)];
document.getElementById('quote').innerHTML=q;
currentType=type;
if(type==='heal'){healProgress=Math.min(healProgress+2,100);document.getElementById('bar').style.width=healProgress+'%';document.getElementById('note').textContent='Healing: '+Math.round(healProgress)+'%';document.getElementById('badge').textContent='🌱 Healing';document.getElementById('heart').textContent='💚';if(healProgress>=100){document.getElementById('badge').textContent='💖 Healed';document.getElementById('heart').textContent='💖';document.getElementById('note').textContent='✨ Fully healed. You are whole.'}}
if(type==='cry'){document.getElementById('badge').textContent='😢 Crying';document.getElementById('heart').textContent='😢'}
if(type==='angry'){document.getElementById('badge').textContent='😤 Angry';document.getElementById('heart').textContent='😤'}
if(type==='reset'){healProgress=0;document.getElementById('bar').style.width='0%';document.getElementById('note').textContent='Healing: 0%';document.getElementById('badge').textContent='🔄 Reset';document.getElementById('heart').textContent='💫'}
document.getElementById('counter').textContent='Quote '+ (Math.floor(Math.random()*99)+1) +' of 99';
updateColors(type);
}

function updateColors(type){
var colors={heal:'#34d399',cry:'#60a5fa',angry:'#fb923c',reset:'#a78bfa'};
var c=colors[type]||'#e94560';
document.querySelector('.badge').style.borderColor=c+'44';
document.querySelector('.badge').style.boxShadow='0 0 40px '+c+'15';
document.querySelector('.badge').style.color=c;
}

// ============================================================
// AUTO HEAL
// ============================================================

setInterval(function(){
if(healProgress<100&&currentType!=='reset'){
healProgress=Math.min(healProgress+0.3,100);
document.getElementById('bar').style.width=healProgress+'%';
document.getElementById('note').textContent='Healing: '+Math.round(healProgress)+'%';
if(healProgress>=100){
document.getElementById('badge').textContent='💖 Healed';
document.getElementById('heart').textContent='💖';
document.getElementById('note').textContent='✨ Fully healed. You are whole.';
}
}
},3000);

// ============================================================
// CLOCK
// ============================================================

function updateClock(){
var d=new Date();
document.getElementById('clock').textContent='🕐 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
setInterval(updateClock,1000);updateClock();

// ============================================================
// PARTICLES
// ============================================================

var c=document.getElementById('bg-canvas'),ctx=c.getContext('2d'),W,H,pts=[],running=true;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
document.addEventListener('visibilitychange',function(){running=!document.hidden});
var cols=['#e94560','#fbbf24','#34d399','#60a5fa','#a78bfa','#fb923c','#ff6b81','#22d3ee'];
for(var i=0;i<50;i++){pts.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*3+1,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4-.1,c:cols[Math.floor(Math.random()*cols.length)],l:Math.random()*120+60,ml:Math.random()*120+60,g:Math.random()*12+6})}
function draw(){if(!running){requestAnimationFrame(draw);return}ctx.clearRect(0,0,W,H);pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0||p.x<0||p.x>W||p.y<0||p.y>H){p.x=Math.random()*W;p.y=H;p.l=p.ml;p.vx=(Math.random()-.5)*.4;p.vy=-Math.random()*.4-.1;p.c=cols[Math.floor(Math.random()*cols.length)]}var a=p.l/p.ml;ctx.beginPath();ctx.arc(p.x,p.y,p.s*a,0,Math.PI*2);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=p.g*a;ctx.fill()});requestAnimationFrame(draw)}
draw();

// ============================================================
// MOUSE TRAIL
// ============================================================

var tc=document.getElementById('trail-canvas'),tctx=tc.getContext('2d'),trail=[];
function resizeTrail(){tc.width=window.innerWidth;tc.height=window.innerHeight}
window.addEventListener('resize',resizeTrail);resizeTrail();
document.addEventListener('mousemove',function(e){trail.push({x:e.clientX,y:e.clientY,life:1});if(trail.length>30)trail.shift()});
document.addEventListener('touchmove',function(e){var t=e.touches[0];trail.push({x:t.clientX,y:t.clientY,life:1});if(trail.length>30)trail.shift()},{passive:true});
function drawTrail(){tctx.clearRect(0,0,tc.width,tc.height);trail.forEach(function(p){p.life-=0.03;if(p.life>0){var a=p.life*0.3;var s=p.life*8+2;var g=tctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s);g.addColorStop(0,'rgba(233,69,96,'+a+')');g.addColorStop(1,'rgba(233,69,96,0)');tctx.beginPath();tctx.arc(p.x,p.y,s,0,Math.PI*2);tctx.fillStyle=g;tctx.fill()}});trail=trail.filter(function(p){return p.life>0});requestAnimationFrame(drawTrail)}
drawTrail();

// ============================================================
// BREATHING
// ============================================================

var breathe=0;setInterval(function(){breathe=(breathe+1)%100;var s=1+Math.sin(breathe/20)*.008;document.querySelector('.container').style.transform='scale('+s+')'},100);

// ============================================================
// INIT
// ============================================================

getQuote('heal');
console.log('💔 Healing Heart — 99 quotes ready');
</script>
</body>
</html>
