<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHRONOS · 36 FATES</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    body{background:#080b12;display:flex;align-items:center;justify-content:center;min-height:100dvh;min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:6px}
    #game{background:linear-gradient(145deg,#111820,#0a0f17);max-width:640px;width:100%;border-radius:48px 48px 32px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.9),inset 0 1px 0 #2a3448;padding:18px 14px 22px;color:#e2e8f0;display:flex;flex-direction:column;gap:12px;border:1px solid #283040}
    #hud{display:flex;justify-content:space-between;align-items:center;background:rgba(18,24,34,0.8);backdrop-filter:blur(8px);padding:10px 16px;border-radius:60px;border:1px solid #33405a;flex-wrap:wrap;gap:6px}
    #hud-left{display:flex;gap:10px;flex-wrap:wrap}
    .hud-item{background:#1a2332;padding:4px 14px;border-radius:40px;font-weight:600;font-size:0.8rem;color:#b7c9e6;border:1px solid #2f3d57;display:flex;align-items:center;gap:6px}
    .hud-item .icon{font-size:1rem}
    #hud-right{display:flex;gap:8px;align-items:center}
    #badge{background:#f5c542;color:#0e1420;padding:4px 14px;border-radius:40px;font-weight:700;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.8px;border:1px solid #ffd966;box-shadow:0 0 16px #f5c54244;white-space:nowrap}
    #panel{background:#0c121e;border-radius:32px;padding:20px 18px;min-height:160px;border:1px solid #263040;box-shadow:inset 0 4px 20px #00000055;display:flex;flex-direction:column;gap:10px;position:relative}
    #story{font-size:1.05rem;line-height:1.6;font-weight:400;color:#d5dfee;word-break:break-word;min-height:3.2em}
    #role-tag{font-size:0.75rem;background:#1a2538;padding:4px 16px;border-radius:40px;align-self:flex-start;border:1px solid #4a5a78;color:#a7bfe0;font-weight:500;letter-spacing:0.3px}
    #choices{display:flex;flex-direction:column;gap:8px;margin:4px 0 2px}
    .choice{background:linear-gradient(135deg,#192233,#111a28);border:1px solid #334563;border-radius:60px;padding:14px 22px;font-size:0.95rem;font-weight:500;color:#dce4f2;text-align:left;transition:all 0.06s linear;width:100%;box-shadow:0 3px 0 #070b12;letter-spacing:0.2px;display:flex;align-items:center;gap:12px}
    .choice:active{background:#293954;transform:scale(0.97);border-color:#6a80aa;box-shadow:0 1px 0 #070b12}
    .choice:disabled{opacity:0.35;transform:none;pointer-events:none;filter:grayscale(0.6)}
    .choice .badge{font-size:0.7rem;background:#2a3650;padding:2px 12px;border-radius:30px;color:#9bb0d0;margin-left:auto}
    #toolbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:4px}
    .tool-btn{background:#141e2e;border:1px solid #334763;border-radius:40px;padding:10px 16px;color:#c4d2ea;font-weight:600;font-size:0.75rem;flex:1 1 auto;text-align:center;transition:0.06s linear;box-shadow:0 2px 0 #080c14;min-width:70px;letter-spacing:0.3px}
    .tool-btn:active{background:#1f2e48;transform:scale(0.95);border-color:#5a72a0}
    .tool-btn:disabled{opacity:0.25;transform:none;pointer-events:none}
    #progress{background:#0a101c;border-radius:40px;padding:6px 16px;font-size:0.7rem;border:1px solid #2d3d58;color:#9bb2d4;text-align:center;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    #progress-bar{flex:1;height:4px;background:#1a253a;border-radius:10px;overflow:hidden;min-width:60px}
    #progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#f5c542,#f7a63a);border-radius:10px;transition:width 0.3s}
    #ban{display:none;background:#1a0b10;color:#ffb3b3;padding:40px 20px;border-radius:48px;text-align:center;border:1px solid #b34a4a;font-weight:600;font-size:1.1rem}
    @media(max-width:480px){#game{padding:12px 8px}#panel{padding:16px 14px}.choice{padding:12px 16px;font-size:0.9rem}#story{font-size:0.95rem}}
    @media(min-width:768px){#game{padding:28px 24px}#panel{padding:26px 24px}}
    .fade-in{animation:fade 0.15s ease}
    @keyframes fade{0%{opacity:0.5;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
    .ending-glow{box-shadow:0 0 30px #f5c54233,inset 0 0 30px #f5c54211}
  </style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="hud-left">
      <span class="hud-item"><span class="icon">❤️</span><span id="hp">10</span></span>
      <span class="hud-item"><span class="icon">⚡</span><span id="fate">0/36</span></span>
      <span class="hud-item"><span class="icon">🏅</span><span id="achievements">0</span></span>
    </div>
    <div id="hud-right">
      <span id="badge">✦ APPRENTICE</span>
    </div>
  </div>

  <div id="panel" class="fade-in">
    <div id="story">The Veil of Chronos parts before you. Destiny awaits.</div>
    <div id="role-tag">⚔️ Nomad</div>
  </div>

  <div id="choices"></div>

  <div id="toolbar">
    <button class="tool-btn" id="resetBtn">⟳ REBIRTH</button>
    <button class="tool-btn" id="saveBtn">💾 SAVE</button>
    <button class="tool-btn" id="loadBtn">📂 LOAD</button>
    <button class="tool-btn" id="hintBtn">🔮 HINT</button>
  </div>

  <div id="progress">
    <span>FATES UNLOCKED</span>
    <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    <span id="progressText">0 / 36</span>
  </div>

  <div id="ban">⚠️ ANDROID BROWSER ONLY · ACCESS DENIED</div>
</div>

<script>
(function(){
  if(!/android/i.test(navigator.userAgent)){
    document.getElementById('game').style.display='none';
    document.getElementById('ban').style.display='block';
    return;
  }

  const DB_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/save.json';
  let state={};
  let endings=new Array(36).fill(false);
  let achievementCount=0;
  let hintCount=0;
  let visitedNodes=new Set();

  const el={
    story:document.getElementById('story'),
    role:document.getElementById('role-tag'),
    hp:document.getElementById('hp'),
    fate:document.getElementById('fate'),
    achieve:document.getElementById('achievements'),
    badge:document.getElementById('badge'),
    choices:document.getElementById('choices'),
    progress:document.getElementById('progress-fill'),
    progressText:document.getElementById('progressText'),
    panel:document.getElementById('panel')
  };

  function updateUI(){
    el.hp.textContent=state.hp||10;
    const unlocked=endings.filter(Boolean).length;
    el.fate.textContent=unlocked+'/36';
    el.achieve.textContent=Math.min(unlocked,36);
    el.progress.style.width=(unlocked/36*100)+'%';
    el.progressText.textContent=unlocked+' / 36';
    el.role.textContent=state.role||'⚔️ Nomad';
    if(unlocked>=36){el.badge.textContent='✦ GOD OF FATES';el.badge.style.background='#ff6b35';el.badge.style.boxShadow='0 0 30px #ff6b3555';}
    else if(unlocked>=24){el.badge.textContent='✦ LEGENDARY SAGE';el.badge.style.background='#a855f7';el.badge.style.boxShadow='0 0 20px #a855f744';}
    else if(unlocked>=12){el.badge.textContent='✦ MASTER OF PATHS';el.badge.style.background='#3b82f6';el.badge.style.boxShadow='0 0 20px #3b82f644';}
    else if(unlocked>=6){el.badge.textContent='✦ SEEKER';el.badge.style.background='#22d3ee';el.badge.style.boxShadow='0 0 20px #22d3ee33';}
    else if(unlocked>=1){el.badge.textContent='✦ APPRENTICE';el.badge.style.background='#f5c542';el.badge.style.boxShadow='0 0 16px #f5c54244';}
    else{el.badge.textContent='✦ INITIATE';el.badge.style.background='#64748b';el.badge.style.boxShadow='none';}
    if(state.hp<=0){state.hp=1;}
  }

  function applyState(s){
    state.hp=s.hp||10;
    state.role=s.role||'⚔️ Nomad';
    state.step=s.step||0;
    state.flags=s.flags||{};
    state.inventory=s.inventory||[];
    if(s.endings){for(let i=0;i<36;i++){if(s.endings[i])endings[i]=true;}}
    if(s.achievementCount!==undefined){achievementCount=s.achievementCount;}
    updateUI();
  }

  function resetGame(){
    state={hp:10,role:'⚔️ Nomad',step:0,flags:{},inventory:[]};
    endings.fill(false);
    achievementCount=0;
    hintCount=0;
    visitedNodes=new Set();
    renderNode(0);
    updateUI();
  }

  function renderNode(id){
    const node=nodes[id];
    if(!node){
      el.story.textContent='The threads of fate unravel... return to the beginning.';
      el.choices.innerHTML='';
      return;
    }
    visitedNodes.add(id);
    el.story.textContent=node.text;
    if(node.role)state.role=node.role;
    if(node.hpDelta){
      state.hp=Math.min(15,Math.max(1,state.hp+node.hpDelta));
      if(state.hp<=0){state.hp=1;}
    }
    if(node.inventoryAdd){
      if(!state.inventory)state.inventory=[];
      state.inventory.push(node.inventoryAdd);
    }
    if(node.flags){for(let k in node.flags)state.flags[k]=node.flags[k];}
    if(node.endingIndex!==undefined&&node.endingIndex>=0&&node.endingIndex<36){
      if(!endings[node.endingIndex]){
        endings[node.endingIndex]=true;
        achievementCount++;
        el.panel.classList.add('ending-glow');
        setTimeout(()=>el.panel.classList.remove('ending-glow'),800);
      }
    }
    el.choices.innerHTML='';
    if(node.choices&&node.choices.length){
      node.choices.forEach((c)=>{
        const btn=document.createElement('button');
        btn.className='choice';
        let label=c.label;
        let disabled=false;
        if(c.condition&&!c.condition(state)){disabled=true;label='🔒 '+label;}
        if(c.requireEndings&&endings.filter(Boolean).length<c.requireEndings){disabled=true;label='🔒 '+label+' ('+c.requireEndings+' fates)';}
        btn.innerHTML=label+(c.hint?'<span class="badge">'+c.hint+'</span>':'');
        btn.disabled=disabled;
        btn.addEventListener('click',()=>{
          if(btn.disabled)return;
          if(c.next!==undefined){renderNode(c.next);}
          else if(c.endingIndex!==undefined){
            const ei=c.endingIndex;
            if(!endings[ei]){endings[ei]=true;achievementCount++;}
            renderNode('end_'+ei);
          }else{renderNode(0);}
          updateUI();
        });
        el.choices.appendChild(btn);
      });
    }else{
      const btn=document.createElement('button');
      btn.className='choice';
      btn.textContent='⟳ Return to crossroads';
      btn.addEventListener('click',()=>{renderNode(0);updateUI();});
      el.choices.appendChild(btn);
    }
    state.step=id;
    updateUI();
    el.panel.classList.remove('fade-in');
    void el.panel.offsetWidth;
    el.panel.classList.add('fade-in');
  }

  const nodes={};

  // === NEXUS (0) ===
  nodes[0]={
    text:'🌌 The Nexus of Chronos. Six paths spiral into infinity. Each choice weaves a new fate. Which thread will you pull?',
    role:'⚔️ Nomad',
    choices:[
      {label:'🌿 Verdant Labyrinth',next:1,hint:'life +2'},
      {label:'🏜️ Obsidian Wastes',next:2,hint:'risk + treasure'},
      {label:'🌊 Abyssal Trench',next:3,hint:'mystery'},
      {label:'🔥 Ember Citadel',next:20,hint:'fire + fury'},
      {label:'❄️ Frostbound Peak',next:21,hint:'ice + wisdom'},
      {label:'⚡ Stormspire',next:22,hint:'lightning + speed'}
    ]
  };

  // === LEVEL 1 PATHS (nodes 1-3, 20-22) ===

  // Verdant Labyrinth
  nodes[1]={
    text:'The Labyrinth breathes with sentient flora. A Dryad offers you the Fruit of Rebirth (+3 HP).',
    hpDelta:3,
    choices:[
      {label:'🍎 Accept the fruit',next:4,flags:{memory:false}},
      {label:'🌱 Refuse and delve deeper',next:5},
      {label:'🔥 Burn the grove',next:6,flags:{burned:true}}
    ]
  };

  // Obsidian Wastes
  nodes[2]={
    text:'The Wastes shimmer with heat. A colossal skeleton of a god lies half-buried.',
    choices:[
      {label:'⚰️ Enter the vault',next:7},
      {label:'🏃 Climb the skeleton',next:8},
      {label:'💀 Pray to the god',next:9,flags:{prayed:true}}
    ]
  };

  // Abyssal Trench
  nodes[3]={
    text:'The Trench pulses with bioluminescence. A drowned city spirals downward.',
    choices:[
      {label:'🎵 Accept the siren\'s deal',next:10,flags:{sirenDeal:true}},
      {label:'🏊 Dive alone into the abyss',next:11},
      {label:'📜 Read the ancient tablets',next:12,flags:{readTablets:true}}
    ]
  };

  // Ember Citadel
  nodes[20]={
    text:'The Citadel burns with eternal flame. The Fire Lord challenges you.',
    choices:[
      {label:'⚔️ Fight the Fire Lord',next:23},
      {label:'🔥 Embrace the flame',next:24,flags:{flameEmbrace:true}},
      {label:'🏃 Flee',next:0}
    ]
  };

  // Frostbound Peak
  nodes[21]={
    text:'The Peak is veiled in eternal winter. An ice oracle speaks riddles.',
    choices:[
      {label:'❄️ Answer the riddle',next:25},
      {label:'🗡️ Break the ice',next:26},
      {label:'📖 Study the runes',next:27,flags:{runesStudied:true}}
    ]
  };

  // Stormspire
  nodes[22]={
    text:'The Spire crackles with lightning. Storm giants guard the summit.',
    choices:[
      {label:'⚡ Challenge the giants',next:28},
      {label:'🌪️ Ride the storm',next:29},
      {label:'🔮 Channel the lightning',next:30,flags:{lightningChanneled:true}}
    ]
  };

  // === BRANCH ENDINGS (4-19) ===

  // From Labyrinth (1)
  nodes[4]={text:'The Fruit binds you to the Labyrinth. You become its eternal guardian.',endingIndex:0,choices:[]};
  nodes[5]={text:'You find a grove of memory. An ancient treant teaches you the Roots.',role:'🌳 Rootwarden',choices:[{label:'🌿 Learn the Rootway',next:13},{label:'🚶 Leave',next:0}]};
  nodes[6]={text:'The grove burns. The Dryad curses you. You become the Ashen Wanderer.',endingIndex:1,choices:[]};

  // From Wastes (2)
  nodes[7]={text:'The vault contains a shard of the god\'s heart. It pulses with power.',hpDelta:-2,choices:[{label:'💎 Keep the shard',next:14,flags:{godShard:true}},{label:'🗑️ Discard it',next:15}]};
  nodes[8]={text:'You climb the skeleton and find the god\'s crown. You become the Skeleton King.',endingIndex:2,choices:[]};
  nodes[9]={text:'The god answers. You become the God-Touched Prophet.',endingIndex:3,choices:[]};

  // From Trench (3)
  nodes[10]={text:'The siren grants you gills and a map to the sunken throne. You can never leave the deep.',endingIndex:4,choices:[]};
  nodes[11]={text:'You find a relic of the drowned king. It shows you all possible deaths.',endingIndex:5,choices:[]};
  nodes[12]={text:'The tablets reveal the city\'s fall. You become the Archivist of the Deep.',endingIndex:6,choices:[]};

  // Continue from Rootwarden (5 -> 13)
  nodes[13]={text:'The Rootwarden reveals the Labyrinth\'s heart. You become one with the forest.',endingIndex:7,choices:[]};

  // Continue from shard (7 -> 14,15)
  nodes[14]={text:'The shard awakens the god. You become its vessel. Immortal, but hollow.',endingIndex:8,choices:[]};
  nodes[15]={text:'The shard shatters, releasing a wave of pure fate. You glimpse the entire web of endings.',endingIndex:9,choices:[]};

  // === FROM EMBER CITADEL (20 -> 23,24) ===
  nodes[23]={text:'You defeat the Fire Lord and claim his crown. The realm bows to you.',endingIndex:10,choices:[]};
  nodes[24]={text:'You embrace the flame and become the Phoenix King. Reborn in fire.',endingIndex:11,choices:[]};

  // === FROM FROSTBOUND PEAK (21 -> 25,26,27) ===
  nodes[25]={text:'You solve the riddle. The oracle grants you the Ice Crown. You rule the frozen north.',endingIndex:12,choices:[]};
  nodes[26]={text:'You shatter the ice and free the imprisoned storm. Chaos reigns. You become the Stormbreaker.',endingIndex:13,choices:[]};
  nodes[27]={text:'You study the runes and learn the language of the ancients. You become the Rune Master.',endingIndex:14,choices:[]};

  // === FROM STORMSPIRE (22 -> 28,29,30) ===
  nodes[28]={text:'You defeat the giants and claim the Storm Scepter. The skies obey you.',endingIndex:15,choices:[]};
  nodes[29]={text:'You ride the storm into the void. You become the Void Walker.',endingIndex:16,choices:[]};
  nodes[30]={text:'You channel the lightning into your soul. You become the Thunder God.',endingIndex:17,choices:[]};

  // === ENDINGS 18-29 (additional branches from deeper choices) ===

  // Add more branches from existing nodes
  nodes[31]={text:'You find a hidden passage in the Labyrinth. It leads to the Dreamer\'s Sanctuary.',choices:[{label:'🌙 Enter the sanctuary',next:32},{label:'🚶 Return',next:0}]};
  nodes[32]={text:'You meet the Dreamer. He offers you a vision of all futures.',endingIndex:18,choices:[]};
  
  nodes[33]={text:'You find a oasis in the Wastes. A merchant offers you a cursed artifact.',choices:[{label:'💀 Buy the artifact',next:34},{label:'🚶 Walk away',next:0}]};
  nodes[34]={text:'The artifact consumes you. You become the Cursed One.',endingIndex:19,choices:[]};

  nodes[35]={text:'You find a submerged library in the Trench. It holds forbidden knowledge.',choices:[{label:'📚 Read the forbidden book',next:36},{label:'🚶 Leave',next:0}]};
  nodes[36]={text:'The knowledge drives you mad. You become the Mad Prophet.',endingIndex:20,choices:[]};

  // Endings 21-29 (extra branches)
  nodes[37]={text:'You find the Forge of Creation. You can craft your own fate.',endingIndex:21,choices:[]};
  nodes[38]={text:'You find the Garden of Eden. You become the Eternal Gardener.',endingIndex:22,choices:[]};
  nodes[39]={text:'You find the Clockwork City. You become the Mechanist.',endingIndex:23,choices:[]};
  nodes[40]={text:'You find the Void Engine. You become the Void Lord.',endingIndex:24,choices:[]};
  nodes[41]={text:'You find the Star Forge. You become the Star Smith.',endingIndex:25,choices:[]};
  nodes[42]={text:'You find the Time Well. You become the Time Keeper.',endingIndex:26,choices:[]};
  nodes[43]={text:'You find the Mirror of Souls. You become the Soul Weaver.',endingIndex:27,choices:[]};
  nodes[44]={text:'You find the Dream Forge. You become the Dream Smith.',endingIndex:28,choices:[]};
  nodes[45]={text:'You find the Fate Spinner. You become the Fate Weaver.',endingIndex:29,choices:[]};

  // Connect these extra nodes to the Nexus via new choices
  nodes[0].choices.push(
    {label:'🌙 Dreamer\'s Sanctuary',next:31,hint:'vision'},
    {label:'🏜️ Oasis Merchant',next:33,hint:'cursed'},
    {label:'📚 Submerged Library',next:35,hint:'forbidden'},
    {label:'🔥 Forge of Creation',next:37,hint:'craft'},
    {label:'🌺 Garden of Eden',next:38,hint:'eternal'},
    {label:'⚙️ Clockwork City',next:39,hint:'mechanist'},
    {label:'🌀 Void Engine',next:40,hint:'void'},
    {label:'⭐ Star Forge',next:41,hint:'smith'},
    {label:'⏳ Time Well',next:42,hint:'keeper'},
    {label:'🪞 Mirror of Souls',next:43,hint:'weaver'},
    {label:'💭 Dream Forge',next:44,hint:'dream'},
    {label:'🕸️ Fate Spinner',next:45,hint:'weaver'}
  );

  // === HIDDEN ENDINGS (30-35) ===
  nodes[46]={text:'You find the Mirror of Aethra. It reflects all your past lives.',choices:[{label:'🪞 Gaze into the mirror',next:47,requireEndings:12},{label:'🚶 Walk away',next:0}]};
  nodes[47]={text:'The mirror fractures. You become the Weaver of All Fates.',endingIndex:30,choices:[]};
  nodes['end_30']={text:'✨ FATE #31 · The Weaver of All Fates.',endingIndex:30,choices:[{label:'⟳ Return to the Nexus',next:0}]};
  
  nodes[48]={text:'You stumble upon a tear in the fabric of Chronos.',endingIndex:31,choices:[]};
  nodes['end_31']={text:'✨ FATE #32 · The Rift Walker.',endingIndex:31,choices:[{label:'⟳ Return to the Nexus',next:0}]};
  
  nodes[49]={text:'A celestial being offers you omniscience. You accept.',endingIndex:32,choices:[]};
  nodes['end_32']={text:'✨ FATE #33 · The Omniscient.',endingIndex:32,choices:[{label:'⟳ Return to the Nexus',next:0}]};
  
  nodes[50]={text:'You reject all fate and forge your own path. The system breaks.',endingIndex:33,choices:[]};
  nodes['end_33']={text:'✨ FATE #34 · The Renegade.',endingIndex:33,choices:[{label:'⟳ Return to the Nexus',next:0}]};
  
  nodes[51]={text:'You find the First Thread. You become the origin.',endingIndex:34,choices:[]};
  nodes['end_34']={text:'✨ FATE #35 · The Origin.',endingIndex:34,choices:[{label:'⟳ Return to the Nexus',next:0}]};
  
  nodes['final']={text:'The Chronos acknowledges you as its master. All 36 fates are yours.',endingIndex:35,choices:[]};
  nodes['end_35']={text:'✨ FATE #36 · THE WEAVER OF DESTINY. You have conquered all fates.',endingIndex:35,choices:[{label:'⟳ Return to the Nexus',next:0}]};

  // Add hidden paths to Nexus
  nodes[0].choices.push(
    {label:'🪞 Mirror of Aethra',next:46,requireEndings:12,hint:'12+ fates'},
    {label:'🌀 Rift Walker',next:48,requireEndings:24,hint:'24+ fates'},
    {label:'🌌 Celestial Pact',next:49,requireEndings:30,hint:'30+ fates'},
    {label:'🌱 First Thread',next:51,requireEndings:34,hint:'34+ fates'}
  );

  // === GENERATE ENDING NODES FOR 0-29 ===
  for(let i=0;i<30;i++){
    if(!nodes['end_'+i]){
      nodes['end_'+i]={
        text:'✨ FATE #'+(i+1)+' · You have claimed a unique destiny. The threads of Chronos remember your name.',
        endingIndex:i,
        choices:[{label:'⟳ Return to the Nexus',next:0}]
      };
    }
  }

  // === SAVE/LOAD ===
  function saveToFirebase(){
    const payload={
      hp:state.hp,
      role:state.role,
      step:state.step,
      flags:state.flags||{},
      inventory:state.inventory||[],
      endings:endings,
      achievementCount:achievementCount
    };
    fetch(DB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>{if(r.ok)alert('💾 Fate saved.');else alert('⚠️ Save failed.');})
    .catch(()=>alert('⚠️ Network error.'));
  }

  function loadFromFirebase(){
    fetch(DB_URL).then(r=>r.json()).then(data=>{
      if(data){applyState(data);renderNode(data.step||0);alert('📂 Fate restored.');}
      else{alert('⚠️ No save found.');}
    }).catch(()=>alert('⚠️ Load error.'));
  }

  function showHint(){
    const unlocked=endings.filter(Boolean).length;
    if(unlocked>=36){alert('🔮 You have mastered all 36 fates. You are the Weaver.');return;}
    const remaining=36-unlocked;
    const hints=[
      'The Nexus has 6 paths. Explore all of them.',
      'Each path branches into 2-3 endings.',
      'Hidden paths appear after 12, 24, 30, and 34 endings.',
      'Some endings require specific flags (burned, prayed, etc.).',
      'Save often and try every choice.',
      'The Mirror, Rift, Pact, and First Thread unlock hidden endings.'
    ];
    alert('🔮 '+hints[hintCount%hints.length]+' ('+remaining+' fates remaining)');
    hintCount++;
  }

  document.getElementById('resetBtn').addEventListener('click',resetGame);
  document.getElementById('saveBtn').addEventListener('click',saveToFirebase);
  document.getElementById('loadBtn').addEventListener('click',loadFromFirebase);
  document.getElementById('hintBtn').addEventListener('click',showHint);

  resetGame();
  window.addEventListener('load',()=>{
    if(/android/i.test(navigator.userAgent)){
      document.getElementById('game').style.display='flex';
      document.getElementById('ban').style.display='none';
    }
  });
})();
</script>
</body>
</html>
