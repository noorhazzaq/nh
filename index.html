<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080c18" />
  <title>ZACK360 · Cyber-Neo Chat</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100%; height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c18;
      color: #f0f4ff;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.4); border-radius: 20px; }
    
    /* ===== CSS VARIABLES ===== */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --glass-blur: 18px;
      --primary: #a78bfa;
      --primary-glow: rgba(167, 139, 250, 0.25);
      --secondary: #f472b6;
      --grad-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --grad-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --grad-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --text-main: #f0f4ff;
      --text-muted: #8b94a9;
      --bg-deep: #080c18;
      --bg-card: rgba(12, 18, 34, 0.7);
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --radius: 16px;
      --radius-lg: 32px;
      --radius-pill: 9999px;
      --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* ===== PARTICLE CANVAS ===== */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    
    /* ===== SCREENS ===== */
    .screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .screen.active { display: flex; }
    
    /* ===== TOAST NOTIFICATIONS ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      width: 100%;
    }
    
    .toast {
      padding: 14px 20px;
      border-radius: var(--radius);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 0.9rem;
      animation: slideInRight 0.4s var(--transition);
      box-shadow: var(--glass-shadow);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast.warning { border-color: var(--warning); }
    .toast.info { border-color: var(--primary); }
    
    .toast .toast-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warning); }
    .toast.info .toast-icon { color: var(--primary); }
    
    .toast.fade-out {
      animation: slideOutRight 0.3s var(--transition) forwards;
    }
    
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutRight {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(40px); }
    }
    
    /* ===== AUTH SCREEN ===== */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 5;
    }
    
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 36px 28px 32px;
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--glass-shadow), 0 0 40px rgba(167, 139, 250, 0.08);
      text-align: center;
      animation: floatUp 0.7s var(--transition);
    }
    
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .auth-logo {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--grad-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      display: inline-block;
    }
    
    .auth-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }
    
    .auth-card .input-group {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }
    
    .auth-card .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }
    
    .auth-card .input-group input {
      width: 100%;
      padding: 14px 14px 14px 48px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-pill);
      color: white;
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
      font-weight: 500;
    }
    
    .auth-card .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    
    .auth-card .input-group input::placeholder {
      color: #4a5268;
      font-weight: 400;
    }
    
    /* ===== BUTTONS ===== */
    .btn-neon {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--grad-1);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    
    .btn-neon:active { transform: scale(0.97); opacity: 0.8; }
    .btn-neon:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-neon.outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      box-shadow: none;
      margin-top: 10px;
    }
    
    .btn-neon.outline:hover {
      background: rgba(167, 139, 250, 0.1);
    }
    
    .btn-neon.danger {
      background: var(--danger);
      box-shadow: 0 4px 20px rgba(248, 113, 113, 0.3);
    }
    
    .btn-neon.success {
      background: var(--success);
      box-shadow: 0 4px 20px rgba(52, 211, 153, 0.3);
    }
    
    .auth-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 16px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .auth-toggle:hover { color: var(--primary); }
    
    /* ===== APP CONTAINER ===== */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 3;
    }
    
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 20px 14px;
      overflow-y: auto;
      transition: transform 0.35s var(--transition);
    }
    
    .sidebar-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding-left: 6px;
    }
    
    .sidebar-top .logo-mini {
      font-weight: 800;
      font-size: 1.3rem;
      background: var(--grad-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sidebar-top .badge {
      font-size: 0.6rem;
      background: var(--primary-glow);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      letter-spacing: 0.3px;
      -webkit-text-fill-color: var(--primary);
    }
    
    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 14px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      margin-bottom: 28px;
    }
    
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--grad-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      box-shadow: 0 0 20px rgba(245, 87, 108, 0.25);
      flex-shrink: 0;
    }
    
    .user-info { flex: 1; }
    .user-info .name { font-weight: 600; font-size: 0.95rem; }
    .user-info .status {
      font-size: 0.7rem;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .user-info .status i { font-size: 0.5rem; }
    
    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin: 20px 0 10px 4px;
      font-weight: 600;
    }
    
    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
      color: var(--text-muted);
      position: relative;
    }
    
    .channel-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: white;
    }
    
    .channel-item.active {
      background: rgba(167, 139, 250, 0.12);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.2);
    }
    
    .channel-item i { width: 20px; font-size: 0.9rem; }
    
    .channel-item .badge-count {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    
    .channel-item.active .badge-count {
      background: rgba(167, 139, 250, 0.15);
      color: var(--primary);
    }
    
    .sidebar-actions {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .sidebar-actions .action-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .sidebar-actions .action-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: white;
    }
    
    .sidebar-actions .action-item.danger { color: var(--danger); }
    .sidebar-actions .action-item.danger:hover {
      background: rgba(248, 113, 113, 0.08);
    }
    
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }
    
    /* ===== CHAT AREA ===== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: rgba(8, 12, 24, 0.6);
      position: relative;
    }
    
    .chat-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      background: rgba(8, 12, 24, 0.4);
      flex-shrink: 0;
    }
    
    .chat-header .hamburger {
      display: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    
    .chat-header .channel-name {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .chat-header .channel-name i { color: var(--primary); }
    
    .chat-header .header-actions {
      margin-left: auto;
      display: flex;
      gap: 12px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    
    .chat-header .header-actions i {
      cursor: pointer;
      transition: var(--transition);
    }
    
    .chat-header .header-actions i:hover { color: white; }
    
    /* ===== MESSAGES ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeSlide 0.3s ease;
    }
    
    .msg-row.me { justify-content: flex-end; }
    
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--grad-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.7rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(245, 87, 108, 0.15);
      transition: var(--transition);
    }
    
    .msg-avatar:hover { transform: scale(1.05); }
    
    .msg-bubble {
      max-width: 78%;
      padding: 10px 16px;
      border-radius: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(4px);
      border: 1px solid var(--glass-border);
      word-break: break-word;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: relative;
    }
    
    .msg-row.me .msg-bubble {
      background: var(--grad-1);
      border-color: transparent;
      border-bottom-right-radius: 4px;
      color: white;
    }
    
    .msg-row:not(.me) .msg-bubble {
      border-bottom-left-radius: 4px;
    }
    
    .msg-user {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .msg-row.me .msg-user { color: rgba(255, 255, 255, 0.7); }
    
    .msg-text { font-size: 0.9rem; line-height: 1.4; }
    .msg-text a {
      color: #93c5fd;
      text-decoration: underline;
      word-break: break-all;
    }
    
    .msg-text .edited-badge {
      font-size: 0.6rem;
      color: var(--text-muted);
      font-style: italic;
      margin-left: 6px;
    }
    
    .msg-time {
      font-size: 0.55rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }
    
    .msg-row.me .msg-time { color: rgba(255, 255, 255, 0.5); }
    
    .msg-img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 12px;
      margin-top: 6px;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      transition: var(--transition);
    }
    
    .msg-img:hover { opacity: 0.9; }
    
    .msg-audio {
      width: 100%;
      height: 32px;
      margin-top: 4px;
      border-radius: var(--radius-pill);
    }
    
    .msg-actions {
      position: absolute;
      top: -12px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: var(--transition);
      background: var(--bg-card);
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
    }
    
    .msg-bubble:hover .msg-actions,
    .msg-bubble:focus-within .msg-actions {
      opacity: 1;
    }
    
    .msg-actions button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 0.7rem;
      transition: var(--transition);
    }
    
    .msg-actions button:hover { color: white; }
    .msg-actions button.danger:hover { color: var(--danger); }
    
    .msg-reactions {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    
    .msg-reaction {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.7rem;
      transition: var(--transition);
      color: var(--text-muted);
    }
    
    .msg-reaction:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .msg-reaction.active {
      border-color: var(--primary);
      background: rgba(167, 139, 250, 0.15);
      color: var(--primary);
    }
    
    .msg-reaction .count {
      font-size: 0.6rem;
      color: var(--text-muted);
    }
    
    .msg-reaction.active .count { color: var(--primary); }
    
    /* ===== TYPING INDICATOR ===== */
    .typing-indicator {
      padding: 4px 16px 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      min-height: 24px;
      font-style: italic;
    }
    
    .typing-indicator i { color: var(--primary); margin-right: 6px; }
    
    /* ===== INPUT DOCK ===== */
    .input-dock {
      padding: 10px 16px 14px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    
    .input-dock .dock-icon {
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      padding: 6px;
      border-radius: var(--radius-pill);
    }
    
    .input-dock .dock-icon:hover {
      color: white;
      background: rgba(255, 255, 255, 0.04);
    }
    
    .input-dock .dock-icon.recording {
      color: var(--danger);
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .input-dock input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      padding: 12px 18px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
      font-weight: 500;
    }
    
    .input-dock input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    
    .input-dock input::placeholder { color: #4a5268; }
    .input-dock input:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .input-dock .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--grad-1);
      color: white;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
      flex-shrink: 0;
    }
    
    .input-dock .send-btn:active { transform: scale(0.92); }
    .input-dock .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
      font-size: 0.9rem;
    }
    
    .empty-state i {
      font-size: 2rem;
      opacity: 0.2;
      display: block;
      margin-bottom: 10px;
    }
    
    /* ===== LOADING STATE ===== */
    .loading-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
    }
    
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* ===== MODALS ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"

<!-- ===== MAIN APPLICATION ===== -->
<script type="module">
// ============================================================
// IMPORTS
// ============================================================
import { initializeApp } from 'firebase/app';
import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  off,
  serverTimestamp,
  onDisconnect,
  remove,
  query,
  limitToLast,
  update,
  orderByKey,
  startAt,
  endAt
} from 'firebase/database';

// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
  databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ============================================================
// APPLICATION STATE
// ============================================================
const state = {
  currentUser: null,
  isRegistering: false,
  currentChan: 'general',
  targetDM: null,
  activeMode: 'chat', // 'chat' | 'dm' | 'lb'
  soundEnabled: true,
  isTyping: false,
  typingTimeout: null,
  selectedProfileUser: null,
  lastMsgTime: 0,
  isRecording: false,
  mediaRecorder: null,
  audioChunks: [],
  isLeaderboardMode: false,
  messageCount: 0,
  onlineUsers: new Set(),
  channelCounts: {}
};

// ============================================================
// DOM REFS
// ============================================================
const $ = (id) => document.getElementById(id);

// Auth
const authScreen = $('authScreen');
const appScreen = $('appScreen');
const usernameIn = $('username');
const passwordIn = $('password');
const authBtn = $('authBtn');
const toggleAuth = $('toggleAuth');
const toggleMode = $('toggleMode');
const authForm = $('authForm');

// Sidebar
const sidebar = $('sidebar');
const hamburger = $('hamburger');
const sideAvatar = $('sideAvatar');
const sideUsername = $('sideUsername');
const channelList = $('channelList');
const dmTrigger = $('dmTrigger');
const lbTrigger = $('lbTrigger');
const soundToggle = $('soundToggle');
const logoutBtn = $('logoutBtn');

// Chat
const activeChanLabel = $('activeChanLabel');
const chatMessages = $('chatMessages');
const msgInput = $('msgInput');
const sendBtn = $('sendBtn');
const typingArea = $('typingArea');

// Input
const fileInput = $('fileInput');
const imgBtn = $('imgBtn');
const audioBtn = $('audioBtn');
const gifBtn = $('gifBtn');

// Modals
const imgModal = $('imgModal');
const modalImg = $('modalImg');
const profileModal = $('profileModal');
const profUser = $('profUser');
const profMsgs = $('profMsgs');
const profJoined = $('profJoined');
const dmFromProf = $('dmFromProf');
const closeProf = $('closeProf');
const closeProfBtn = $('closeProfBtn');

// Toast container
const toastContainer = $('toastContainer');

// ============================================================
// FIREBASE REFS (cached)
// ============================================================
let activeChatQuery = null;
let activeTypingRef = null;
let typingListener = null;
let lbListener = null;
let onlineListener = null;

// ============================================================
// UTILITY FUNCTIONS
// ============================================================

// Toast notification system
function showToast(message, type = 'info') {
  const icons = {
    success: 'fas fa-check-circle',
    error: 'fas fa-exclamation-circle',
    warning: 'fas fa-exclamation-triangle',
    info: 'fas fa-info-circle'
  };
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <i class="${icons[type] || icons.info} toast-icon"></i>
    <span>${message}</span>
  `;
  
  toastContainer.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// SHA-256 hashing
async function sha256(str) {
  const buf = await crypto.subtle.digest(
    'SHA-256',
    new TextEncoder().encode(str + '_zack360_salt')
  );
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

// HTML escaping
function escapeHtml(str) {
  if (!str) return '';
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  };
  return str.replace(/[&<>'"]/g, m => map[m]);
}

// Time formatting
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Relative time (for timestamps)
function formatRelativeTime(ts) {
  if (!ts) return '';
  const now = Date.now();
  const diff = now - ts;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  
  if (seconds < 60) return 'Just now';
  if (minutes < 60) return `${minutes}m ago`;
  if (hours < 24) return `${hours}h ago`;
  if (days < 7) return `${days}d ago`;
  return formatTime(ts);
}

// Get current data path
function getPath() {
  if (state.activeMode === 'dm' && state.targetDM) {
    const pair = [state.currentUser, state.targetDM].sort().join('_');
    return `dms/${pair}`;
  }
  if (state.activeMode === 'chat' && state.currentChan) {
    return `channels/${state.currentChan}`;
  }
  return null;
}

// Play notification sound
function playBeep() {
  if (!state.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 540;
    gain.gain.value = 0.04;
    osc.start();
    osc.stop(ctx.currentTime + 0.07);
  } catch (e) {
    // Silently fail
  }
}

// ============================================================
// TOAST SYSTEM (exposed globally for inline onclick)
// ============================================================
window.showToast = showToast;

// ============================================================
// AUTHENTICATION
// ============================================================

// Toggle between login and register
toggleMode.addEventListener('click', (e) => {
  e.preventDefault();
  state.isRegistering = !state.isRegistering;
  authBtn.textContent = state.isRegistering ? '✨ CREATE ACCOUNT' : '⚡ LOGIN';
  toggleMode.textContent = state.isRegistering
    ? 'Have an account? Login'
    : 'Need an account? Register';
  usernameIn.value = '';
  passwordIn.value = '';
  usernameIn.focus();
});

toggleAuth.addEventListener('click', (e) => {
  e.preventDefault();
  toggleMode.click();
});

// Handle authentication
authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const u = usernameIn.value.trim().toLowerCase();
  const p = passwordIn.value.trim();
  
  if (!u || !p) {
    showToast('Please fill in all fields', 'warning');
    return;
  }
  
  if (u.length < 2) {
    showToast('Username must be at least 2 characters', 'warning');
    return;
  }
  
  if (p.length < 3) {
    showToast('Password must be at least 3 characters', 'warning');
    return;
  }
  
  authBtn.disabled = true;
  authBtn.textContent = state.isRegistering ? 'Creating...' : 'Logging in...';
  
  try {
    const hashed = await sha256(p);
    const userRef = ref(db, `users/${u}`);
    const snap = await get(userRef);
    
    if (state.isRegistering) {
      if (snap.exists()) {
        showToast('Username already taken', 'error');
        authBtn.disabled = false;
        authBtn.textContent = '✨ CREATE ACCOUNT';
        return;
      }
      
      await set(userRef, {
        password: hashed,
        msgCount: 0,
        joined: serverTimestamp()
      });
      
      showToast('Account created! Welcome to ZACK360 🎉', 'success');
      loginUser(u);
    } else {
      if (!snap.exists()) {
        showToast('User not found', 'error');
        authBtn.disabled = false;
        authBtn.textContent = '⚡ LOGIN';
        return;
      }
      
      if (snap.val().password !== hashed) {
        showToast('Invalid password', 'error');
        authBtn.disabled = false;
        authBtn.textContent = '⚡ LOGIN';
        return;
      }
      
      showToast(`Welcome back, ${u}! 👋`, 'success');
      loginUser(u);
    }
  } catch (err) {
    console.error('Auth error:', err);
    showToast('Network error. Please check your connection.', 'error');
    authBtn.disabled = false;
    authBtn.textContent = state.isRegistering ? '✨ CREATE ACCOUNT' : '⚡ LOGIN';
  }
});

function loginUser(u) {
  state.currentUser = u;
  sideAvatar.textContent = u.charAt(0).toUpperCase();
  sideUsername.textContent = u;
  
  authScreen.classList.remove('active');
  appScreen.classList.add('active');
  
  setupPresence();
  initChat();
  initTyping();
  setupOnlineTracking();
  
  showToast(`Connected as ${u}`, 'success');
}

function setupPresence() {
  const pRef = ref(db, `online/${state.currentUser}`);
  set(pRef, true);
  onDisconnect(pRef).remove();
}

function setupOnlineTracking() {
  if (onlineListener) off(onlineListener);
  onlineListener = onValue(ref(db, 'online'), snap => {
    const data = snap.val() || {};
    state.onlineUsers = new Set(Object.keys(data));
    // Update channel counts if needed
  });
}

// ============================================================
// SIDEBAR NAVIGATION
// ============================================================

// Mobile sidebar toggle
hamburger.addEventListener('click', () => {
  sidebar.classList.toggle('open');
});

// Close sidebar on outside click (mobile)
document.addEventListener('click', (e) => {
  if (window.innerWidth <= 820 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  }
});

// Channel switching
channelList.addEventListener('click', (e) => {
  const item = e.target.closest('.channel-item');
  if (!item || !item.dataset.chan) return;
  
  const chan = item.dataset.chan;
  if (chan === state.currentChan && state.activeMode === 'chat') return;
  
  // Cleanup
  clearTypingState();
  if (lbListener) { off(lbListener); lbListener = null; }
  if (state.activeChatQuery) { off(state.activeChatQuery); state.activeChatQuery = null; }
  
  state.currentChan = chan;
  state.targetDM = null;
  state.activeMode = 'chat';
  state.isLeaderboardMode = false;
  
  // Update UI
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  item.classList.add('active');
  activeChanLabel.textContent = state.currentChan;
  sidebar.classList.remove('open');
  
  initChat();
  initTyping();
});

// DM trigger
dmTrigger.addEventListener('click', () => {
  const target = prompt('Enter username for DM:');
  if (!target || !target.trim()) {
    showToast('DM cancelled', 'info');
    return;
  }
  
  const targetUser = target.trim().toLowerCase();
  if (targetUser === state.currentUser) {
    showToast('You cannot DM yourself', 'warning');
    return;
  }
  
  clearTypingState();
  if (lbListener) { off(lbListener); lbListener = null; }
  if (state.activeChatQuery) { off(state.activeChatQuery); state.activeChatQuery = null; }
  
  state.targetDM = targetUser;
  state.activeMode = 'dm';
  state.isLeaderboardMode = false;
  activeChanLabel.textContent = `@${targetUser}`;
  
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  sidebar.classList.remove('open');
  
  showToast(`DM with @${targetUser}`, 'info');
  initChat();
  initTyping();
});

// Leaderboard trigger
lbTrigger.addEventListener('click', () => {
  clearTypingState();
  if (state.activeChatQuery) { off(state.activeChatQuery); state.activeChatQuery = null; }
  if (typingListener) { off(typingListener); typingListener = null; }
  
  state.isLeaderboardMode = true;
  state.activeMode = 'lb';
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  sidebar.classList.remove('open');
  activeChanLabel.textContent = '🏆 Leaderboard';
  
  renderLeaderboard();
});

// ============================================================
// TYPING SYSTEM
// ============================================================

function clearTypingState() {
  if (activeTypingRef) {
    remove(activeTypingRef);
    activeTypingRef = null;
  }
  if (typingListener) {
    off(typingListener);
    typingListener = null;
  }
  state.isTyping = false;
  clearTimeout(state.typingTimeout);
}

function initTyping() {
  clearTypingState();
  
  if (state.isLeaderboardMode || state.activeMode === 'lb') {
    typingArea.innerHTML = '<i class="fas fa-ellipsis-h"></i> ';
    return;
  }
  
  const path = getPath();
  if (!path) {
    typingArea.innerHTML = '<i class="fas fa-ellipsis-h"></i> ';
    return;
  }
  
  activeTypingRef = ref(db, `typing/${path}/${state.currentUser}`);
  onDisconnect(activeTypingRef).remove();
  
  // Setup typing input handler
  msgInput.oninput = () => {
    if (!state.isTyping) {
      set(activeTypingRef, true);
      state.isTyping = true;
    }
    clearTimeout(state.typingTimeout);
    state.typingTimeout = setTimeout(() => {
      if (activeTypingRef) {
        remove(activeTypingRef);
        state.isTyping = false;
      }
    }, 1800);
  };
  
  // Listen for others typing
  typingListener = onValue(ref(db, `typing/${path}`), snap => {
    const data = snap.val() || {};
    const typers = Object.keys(data).filter(k => k !== state.currentUser);
    if (typers.length > 0) {
      const names = typers.slice(0, 3).join(', ');
      const extra = typers.length > 3 ? ` +${typers.length - 3} more` : '';
      typingArea.innerHTML = `<i class="fas fa-ellipsis-h"></i> ${names}${extra} typing...`;
    } else {
      typingArea.innerHTML = '<i class="fas fa-ellipsis-h"></i> ';
    }
  });
}

// ============================================================
// CHAT SYSTEM
// ============================================================

function initChat() {
  // Clean up old listeners
  if (state.activeChatQuery) {
    off(state.activeChatQuery);
    state.activeChatQuery = null;
  }
  
  if (state.isLeaderboardMode || state.activeMode === 'lb') {
    chatMessages.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading leaderboard...</p>
      </div>
    `;
    return;
  }
  
  const path = getPath();
  if (!path) {
    chatMessages.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-triangle"></i>
        Invalid channel
      </div>
    `;
    return;
  }
  
  // Show loading state
  chatMessages.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading messages...</p>
    </div>
  `;
  
  state.activeChatQuery = query(ref(db, path), limitToLast(50));
  
  onValue(state.activeChatQuery, snap => {
    const data = snap.val();
    chatMessages.innerHTML = '';
    
    if (!data) {
      chatMessages.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-comment-dots"></i>
          No messages yet — say hello!
        </div>
      `;
      return;
    }
    
    // Update channel count
    const count = Object.keys(data).length;
    state.channelCounts[state.currentChan] = count;
    updateChannelBadges();
    
    const keys = Object.keys(data);
    keys.forEach(id => {
      const m = data[id];
      if (!m || !m.user) return;
      
      const isMe = m.user === state.currentUser;
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'me' : ''}`;
      
      let media = '';
      if (m.image) {
        media += `<img src="${m.image}" class="msg-img" onclick="window.openImg('${m.image}')" onerror="this.style.display='none'" />`;
      }
      if (m.audio) {
        media += `<audio src="${m.audio}" controls class="msg-audio" preload="metadata"></audio>`;
      }
      
      const avatarHtml = !isMe
        ? `<div class="msg-avatar" data-username="${escapeHtml(m.user)}">${escapeHtml(m.user.charAt(0).toUpperCase())}</div>`
        : '';
      
      // Build reactions
      let reactionsHtml = '';
      if (m.reactions) {
        const emojis = Object.keys(m.reactions);
        emojis.forEach(emoji => {
          const users = Object.keys(m.reactions[emoji]);
          const count = users.length;
          const isActive = users.includes(state.currentUser);
          reactionsHtml += `
            <span class="msg-reaction ${isActive ? 'active' : ''}" 
                  onclick="window.toggleReaction('${id}','${emoji}')">
              ${emoji} <span class="count">${count}</span>
            </span>
          `;
        });
      }
      
      row.innerHTML = `
        ${avatarHtml}
        <div class="msg-bubble">
          <div class="msg-user">${escapeHtml(m.user)}</div>
          <div class="msg-text">
            ${escapeHtml(m.text || '')}
            ${m.edited ? '<span class="edited-badge">(edited)</span>' : ''}
            ${media}
          </div>
          ${reactionsHtml ? `<div class="msg-reactions">${reactionsHtml}</div>` : ''}
          <div class="msg-time">
            ${formatTime(m.time)}
            ${m.edited ? ' ✎' : ''}
          </div>
          <div class="msg-actions">
            <button onclick="window.reactToMessage('${id}','❤️')" title="React">❤️</button>
            <button onclick="window.reactToMessage('${id}','🔥')" title="React">🔥</button>
            ${isMe ? `<button class="danger" onclick="window.deleteMessage('${id}')" title="Delete">🗑️</button>` : ''}
          </div>
        </div>
      `;
      chatMessages.appendChild(row);
    });
    
    // Auto-scroll to bottom
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

// Update channel badge counts
function updateChannelBadges() {
  document.querySelectorAll('.channel-item[data-chan]').forEach(el => {
    const chan = el.dataset.chan;
    const badge = el.querySelector('.badge-count');
    if (badge && state.channelCounts[chan] !== undefined) {

// Send message
async function sendMessage(extra = {}) {
  if (!state.currentUser) {
    showToast('Not logged in', 'error');
    return;
  }
  
  const now = Date.now();
  if (now - state.lastMsgTime < 1200) {
    showToast('Please wait 1.2 seconds between messages', 'warning');
    return;
  }
  
  const text = msgInput.value.trim();
  if (!text && !extra.image && !extra.audio) {
    showToast('Type a message or attach media', 'warning');
    return;
  }
  
  msgInput.value = '';
  state.lastMsgTime = Date.now();
  clearTypingState();
  playBeep();
  
  const path = getPath();
  if (!path) {
    showToast('No active channel', 'error');
    return;
  }
  
  try {
    await push(ref(db, path), {
      user: state.currentUser,
      text: text || '',
      ...extra,
      time: serverTimestamp()
    });
    
    // Update message count
    const countRef = ref(db, `users/${state.currentUser}/msgCount`);
    const snap = await get(countRef);
    await set(countRef, (snap.val() || 0) + 1);
    
  } catch (err) {
    console.error('Send error:', err);
    showToast('Failed to send message', 'error');
  }
}

sendBtn.addEventListener('click', () => sendMessage());

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Image upload
imgBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  // Validate file type
  if (!file.type.startsWith('image/')) {
    showToast('Please select an image file', 'warning');
    fileInput.value = '';
    return;
  }
  
  // Validate file size (max 5MB)
  if (file.size > 5 * 1024 * 1024) {
    showToast('Image too large (max 5MB)', 'warning');
    fileInput.value = '';
    return;
  }
  
  showToast('Compressing image...', 'info');
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width;
      let h = img.height;
      const max = 800;
      
      if (w > max || h > max) {
        if (w > h) {
          h = Math.round((h * max) / w);
          w = max;
        } else {
          w = Math.round((w * max) / h);
          h = max;
        }
      }
      
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      sendMessage({ image: dataUrl });
      showToast('Image sent! 📸', 'success');
    };
    img.onerror = () => {
      showToast('Failed to load image', 'error');
    };
    img.src = ev.target.result;
  };
  reader.onerror = () => {
    showToast('Failed to read file', 'error');
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

// Audio recording
audioBtn.addEventListener('click', async () => {
  if (!state.isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.mediaRecorder = new MediaRecorder(stream);
      state.audioChunks = [];
      
      state.mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) state.audioChunks.push(e.data);
      };
      
      state.mediaRecorder.onstop = () => {
        if (state.audioChunks.length === 0) {
          showToast('No audio recorded', 'warning');
          return;
        }
        const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = (ev) => {
          sendMessage({ audio: ev.target.result });
          showToast('Voice message sent! 🎙️', 'success');
        };
        reader.readAsDataURL(blob);
        audioBtn.classList.remove('recording');
        audioBtn.style.color = '';
      };
      
      state.mediaRecorder.start(250);
      state.isRecording = true;
      audioBtn.classList.add('recording');
      audioBtn.style.color = '#f87171';
      showToast('Recording... tap again to stop', 'info');
      
    } catch (e) {
      showToast('Microphone access denied', 'error');
    }
  } else {
    if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
      state.mediaRecorder.stop();
      state.isRecording = false;
      audioBtn.classList.remove('recording');
      audioBtn.style.color = '';
      showToast('Recording stopped', 'info');
    }
  }
});

// Reactions (exposed globally)
window.toggleReaction = async function(messageId, emoji) {
  if (!state.currentUser) return;
  
  const path = getPath();
  if (!path) return;
  
  const reactionRef = ref(db, `${path}/${messageId}/reactions/${emoji}/${state.currentUser}`);
  try {
    const snap = await get(reactionRef);
    if (snap.exists()) {
      await remove(reactionRef);
    } else {
      await set(reactionRef, true);
    }
  } catch (err) {
    console.error('Reaction error:', err);
  }
};

window.reactToMessage = function(messageId, emoji) {
  window.toggleReaction(messageId, emoji);
};

// Delete message (exposed globally)
window.deleteMessage = async function(messageId) {
  if (!state.currentUser) return;
  if (!confirm('Delete this message?')) return;
  
  const path = getPath();
  if (!path) return;
  
  try {
    const msgRef = ref(db, `${path}/${messageId}`);
    const snap = await get(msgRef);
    if (snap.exists() && snap.val().user === state.currentUser) {
      await remove(msgRef);
      showToast('Message deleted', 'success');
    } else {
      showToast('You can only delete your own messages', 'warning');
    }
  } catch (err) {
    console.error('Delete error:', err);
    showToast('Failed to delete message', 'error');
  }
};

function renderLeaderboard() {
  if (lbListener) {
    off(lbListener);
    lbListener = null;
  }
  
  chatMessages.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading leaderboard...</p>
    </div>
  `;
  
  const usersRef = ref(db, 'users');
  lbListener = onValue(usersRef, snap => {
    const data = snap.val();
    if (!data) {
      chatMessages.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-users"></i>
          No users found
        </div>
      `;
      return;
    }
    
    const users = Object.keys(data).map(k => ({
      name: k,
      count: data[k].msgCount || 0,
      joined: data[k].joined || null
    }));
    users.sort((a, b) => b.count - a.count);
    
    let html = `
      <div style="padding:6px 4px 12px;">
        <h3 style="margin-bottom:16px;display:flex;gap:10px;align-items:center;">
          <i class="fas fa-trophy" style="color:#fbbf24;"></i> LEADERBOARD
        </h3>
    `;
    
    if (users.length === 0) {
      html += `<p style="color:var(--text-muted);text-align:center;">No users yet</p>`;
    } else {
      users.forEach((u, i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
        const isCurrent = u.name === state.currentUser;
        html += `
          <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;
                    background:${isCurrent ? 'rgba(167,139,250,0.08)' : 'rgba(255,255,255,0.03)'};
                    border-radius:16px;margin-bottom:6px;
                    border:1px solid ${isCurrent ? 'var(--primary)' : 'var(--glass-border)'};
                    ${isCurrent ? 'box-shadow: 0 0 20px rgba(167,139,250,0.1);' : ''}">
            <span style="font-weight:700;color:#fbbf24;width:36px;font-size:0.9rem;">${medal}</span>
            <span style="font-weight:600;cursor:pointer;color:${isCurrent ? 'var(--primary)' : 'var(--text-main)'};" 
                  onclick="window.openProfile('${u.name}')">${escapeHtml(u.name)}${isCurrent ? ' (you)' : ''}</span>
            <span style="margin-left:auto;color:var(--text-muted);font-size:0.8rem;">${u.count} msgs</span>
          </div>
        `;
      });
    }
    
    html += `
      <div style="margin-top:16px;text-align:center;">
        <button class="btn-neon" onclick="window.goBackToChat()" style="width:auto;padding:10px 32px;">
          <i class="fas fa-arrow-left"></i> Back to Chat
        </button>
      </div>
    </div>`;
    
    chatMessages.innerHTML = html;
    chatMessages.scrollTop = 0;
  });
}

window.goBackToChat = function() {
  if (lbListener) {
    off(lbListener);
    lbListener = null;

  state.isLeaderboardMode = false;
  state.activeMode = 'chat';
  activeChanLabel.textContent = state.currentChan;

    if (el.dataset.chan === state.currentChan) {

      el.classList.remove('active');

  initTyping();
  showToast('Back to chat', 'info');

});

// ============================================================
// PARTICLE BACKGROUND
// ============================================================

const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

const particles = [];
for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4,
    o: Math.random() * 0.3 + 0.1
  });
}

function drawParticles() {
  ctx.clearRect(0, 0, width, height);
  
  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;
    if (p.x < 0 || p.x > width) p.dx *= -1;
    if (p.y < 0 || p.y > height) p.dy *= -1;
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(167, 139, 250, ${p.o})`;
    ctx.fill();
  });
  
  // Lines between nearby particles
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(167, 139, 250, ${0.04 * (1 - dist / 150)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  
  requestAnimationFrame(drawParticles);
}

drawParticles();

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
});
