<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok - Make Your Day</title>
  <style>
    :root {
      --bg-main: #000000;
      --bg-panel: #121212;
      --text-main: #ffffff;
      --text-muted: #a6a6a6;
      --accent-pink: #fe2c55;
      --accent-cyan: #25f4ee;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Proxima Nova", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- TOP NAVBAR --- */
    header {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: var(--bg-main);
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      border-radius: 6px;
    }

    .search-bar {
      width: 320px;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 92px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      width: 100%;
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-upload {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent-pink);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }

    /* --- MAIN LAYOUT --- */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* --- SIDEBAR --- */
    aside {
      width: 240px;
      border-right: 1px solid var(--border-color);
      padding: 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-pink);
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* --- FEED CONTAINER (MIMICS TIKTOK SCROLL) --- */
    main {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feed-item {
      scroll-snap-align: start;
      height: calc(100vh - 60px);
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .video-card {
      position: relative;
      height: 100%;
      max-height: 680px;
      aspect-ratio: 9/16;
      background: var(--bg-panel);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* OVERLAY METADATA */
    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .author-info {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .video-desc {
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .audio-track {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* SIDE ACTION BAR */
    .action-bar {
      position: absolute;
      right: 12px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
    }

    .icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: transform 0.2s;
    }

    .action-btn:hover .icon-circle {
      transform: scale(1.1);
    }

    .action-btn.liked .icon-circle {
      color: var(--accent-pink);
    }

    .action-count {
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <span>TikTok</span>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Search accounts and videos...">
    </div>

    <div class="header-actions">
      <button class="btn-upload">+ Upload</button>
      <button class="btn-primary">Log in</button>
    </div>
  </header>

  <!-- APP CORE -->
  <div class="app-container">
    
    <!-- LEFT NAVIGATION -->
    <aside>
      <a class="nav-item active">🏠 For You</a>
      <a class="nav-item">👥 Following</a>
      <a class="nav-item">🧭 Explore</a>
      <a class="nav-item">LIVE</a>
      <a class="nav-item">👤 Profile</a>
    </aside>

    <!-- CENTER VERTICAL FEED -->
    <main id="video-feed">

      <!-- ITEM 1 -->
      <div class="feed-item">
        <div class="video-card">
          <video loop muted playsinline autoplay src="https://assets.mixkit.co/videos/preview/mixkit-tokyo-street-at-night-4022-large.mp4"></video>
          
          <div class="video-overlay">
            <div class="author-info">@tokyonights</div>
            <div class="video-desc">Walking through Shinjuku under the rain 🌧️✨ #tokyo #japan #cyberpunk</div>
            <div class="audio-track">🎵 Original Sound - Tokyo Vibe Beats</div>
          </div>

          <div class="action-bar">
            <button class="action-btn" onclick="toggleLike(this)">
              <div class="icon-circle">❤️</div>
              <span class="action-count">124.5K</span>
            </button>
            <button class="action-btn">
              <div class="icon-circle">💬</div>
              <span class="action-count">1,832</span>
            </button>
            <button class="action-btn">
              <div class="icon-circle">🔖</div>
              <span class="action-count">8,410</span>
            </button>
            <button class="action-btn">
              <div class="icon-circle">↪️</div>
              <span class="action-count">3,200</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ITEM 2 -->
      <div class="feed-item">
        <div class="video-card">
          <video loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-hands-of-a-craftsman-working-on-leather-41528-large.mp4"></video>
          
          <div class="video-overlay">
            <div class="author-info">@leathercraft_studio</div>
            <div class="video-desc">Crafting a handmade cardholder from scratch. Rate this color! 🛠️</div>
            <div class="audio-track">🎵 Relaxing Lofi Beats - Crafting Lab</div>
          </div>

          <div class="action-bar">
            <button class="action-btn" onclick="toggleLike(this)">
              <div class="icon-circle">❤️</div>
              <span class="action-count">45.2K</span>
            </button>
            <button class="action-btn">
              <div class="icon-circle">💬</div>
              <span class="action-count">412</span>
            </button>
            <button class="action-btn">
              <div class="icon-circle">🔖</div>
              <span class="action-count">2,105</span>
            </button>
            <button class="action-btn">
              <div class="icon-circle">↪️</div>
              <span class="action-count">512</span>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Toggle Heart Like Color
    function toggleLike(btn) {
      btn.classList.toggle('liked');
    }

    // Auto-play / pause video on scroll intersection (TikTok style)
    const videos = document.querySelectorAll('video');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.play().catch(() => {});
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: 0.6 });

    videos.forEach(video => observer.observe(video));
  </script>
</body>
</html>
