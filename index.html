<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK Lives — Simulasi Kehidupan">
    <title>ZACK Lives — Simulasi Kehidupan</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK Lives","short_name":"ZACK","display":"standalone","theme_color":"%23000000","background_color":"%23000000"}'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        :root {
            --red: #ff0033;
            --cyan: #00f0ff;
            --gold: #ffd700;
            --purple: #8a2be2;
            --bg: #000000;
            --white: #ffffff;
            --muted: #999999;
            --success: #00ff88;
            --border-glow: rgba(0,240,255,0.3);
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff, #ffd700);
            --grad-btn: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --r-sm: 10px;
            --r-md: 16px;
            --r-full: 30px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .aurora {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,0,51,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,240,255,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(138,43,226,0.08) 0%, transparent 60%);
            z-index: 0;
            animation: auroraFloat 10s ease-in-out infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10px, 10px) scale(1.05); }
        }

        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; width: 2px; height: 2px;
            border-radius: 50%; background: var(--white);
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; box-shadow: 0 0 8px var(--white); }
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(12px + var(--safe-top)) 15px 12px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            text-align: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            background: var(--grad-text);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 4s ease infinite;
        }
        @keyframes logoGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .main {
            position: relative; z-index: 2;
            padding: calc(55px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .card {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.5);
            padding: 15px;
            backdrop-filter: blur(10px);
            animation: boxGlow 5s ease-in-out infinite;
        }
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,51,0.1); }
            50% { box-shadow: 0 0 35px rgba(0,240,255,0.15); }
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif; font-size: 12px;
            letter-spacing: 2px; color: var(--cyan);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .stat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glow);
            border-radius: var(--r-sm);
            padding: 10px;
            text-align: center;
        }
        .stat-label {
            font-size: 8px; color: var(--muted);
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px; font-weight: 900;
            color: var(--white);
            margin-top: 3px;
        }
        .stat-value.positive { color: var(--success); }
        .stat-value.negative { color: var(--red); }

        .stat-bar {
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s var(--ease);
        }
        .fill-green { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .fill-yellow { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .fill-red { background: var(--red); box-shadow: 0 0 10px var(--red); }

        .btn-primary {
            width: 100%; padding: 12px;
            background: var(--grad-btn); color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            cursor: pointer;
            animation: sendGlow 2s ease-in-out infinite;
        }
        @keyframes sendGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255,0,51,0.3); }
            50% { box-shadow: 0 0 35px rgba(255,0,51,0.5), 0 0 50px rgba(0,240,255,0.3); }
        }

        .btn-secondary {
            width: 100%; padding: 10px;
            background: rgba(255,0,51,0.08);
            border: 1px solid var(--border-glow);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px;
            border-radius: var(--r-full);
            cursor: pointer;
            margin-bottom: 8px;
        }

        .event-box {
            border: 1px solid var(--gold);
            border-radius: var(--r-sm);
            background: rgba(255,215,0,0.08);
            padding: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .event-box p {
            font-size: 12px;
            color: var(--white);
            line-height: 1.5;
        }

        .choice-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .death-screen {
            text-align: center;
            padding: 30px 15px;
        }
        .death-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .death-screen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: var(--red);
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255,0,51,0.5);
        }

        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px; max-width: 260px;
        }
        .toast {
            padding: 11px 17px; border-radius: 12px; font-size: 11px;
            border: 1px solid;
            transition: all 0.4s var(--ease);
            backdrop-filter: blur(15px);
        }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-success { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.4); color: var(--success); }
        .toast-error { background: rgba(255,0,51,0.1); border-color: rgba(255,0,51,0.4); color: var(--red); }
        .toast-info { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.4); color: var(--cyan); }
    </style>
</head>
<body>

    <div class="aurora"></div>
    <div class="stars" id="stars"></div>

    <div class="toast-wrap" id="toastWrap"></div>

    <div class="header">
        <div class="logo">ZACK LIVES</div>
    </div>

    <div class="main" id="mainContent">

        <!-- START SCREEN -->
        <div id="startScreen">
            <div class="card" style="text-align:center;">
                <h3>🌍 SIMULASI KEHIDUPAN</h3>
                <p style="font-size:13px;color:var(--muted);margin-bottom:15px;line-height:1.6;">
                    Lahir di negara rawak. Jalani kehidupan penuh dengan keputusan dan peristiwa rawak.
                </p>
                <button class="btn-primary" onclick="startLife()">👶 MULA KEHIDUPAN</button>
            </div>
        </div>

        <!-- LIFE SCREEN -->
        <div id="lifeScreen" style="display:none;">
            <!-- EVENT -->
            <div id="eventContainer"></div>

            <!-- STATS -->
            <div class="card">
                <h3>📊 STATISTIK</h3>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-label">UMUR</div>
                        <div class="stat-value" id="statAge">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">KESIHATAN</div>
                        <div class="stat-value positive" id="statHealth">100</div>
                        <div class="stat-bar"><div class="stat-bar-fill fill-green" id="healthBar" style="width:100%"></div></div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">KEBAHAGIAAN</div>
                        <div class="stat-value positive" id="statHappiness">70</div>
                        <div class="stat-bar"><div class="stat-bar-fill fill-yellow" id="happinessBar" style="width:70%"></div></div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">KECERDASAN</div>
                        <div class="stat-value positive" id="statIntelligence">50</div>
                        <div class="stat-bar"><div class="stat-bar-fill fill-green" id="intelligenceBar" style="width:50%"></div></div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">WANG (RM)</div>
                        <div class="stat-value" id="statMoney">100</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">PENDIDIKAN</div>
                        <div class="stat-value" id="statEducation">Tiada</div>
                    </div>
                </div>
            </div>

            <!-- IDENTITY -->
            <div class="card">
                <h3>👤 IDENTITI</h3>
                <p style="font-size:12px;color:var(--muted);" id="identityText"></p>
            </div>

            <!-- ACTIONS -->
            <div class="card">
                <h3>🎯 TINDAKAN</h3>
                <div class="choice-list" id="actionList"></div>
            </div>
        </div>

        <!-- DEATH SCREEN -->
        <div id="deathScreen" style="display:none;">
            <div class="death-screen">
                <div class="death-icon">🕊️</div>
                <h2>KISAH TAMAT</h2>
                <p style="color:var(--muted);margin-bottom:20px;" id="deathSummary"></p>
                <button class="btn-primary" onclick="restartLife()">🔄 KEHIDUPAN BARU</button>
            </div>
        </div>

    </div>

    <script>
        'use strict';

        const $ = id => document.getElementById(id);

        function toast(msg, type = 'info') {
            const wrap = $('toastWrap');
            while (wrap.children.length >= 3) wrap.firstChild.remove();
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => {
                el.classList.add('hide');
                setTimeout(() => el.remove(), 400);
            }, 3000);
        }

        const COUNTRIES = [
            { name: 'Malaysia', icon: '🇲🇾', income: 'sederhana', education: 'baik', health: 'baik' },
            { name: 'Jepun', icon: '🇯🇵', income: 'tinggi', education: 'cemerlang', health: 'cemerlang' },
            { name: 'India', icon: '🇮🇳', income: 'rendah', education: 'sederhana', health: 'sederhana' },
            { name: 'Brazil', icon: '🇧🇷', income: 'sederhana', education: 'sederhana', health: 'baik' },
            { name: 'Nigeria', icon: '🇳🇬', income: 'rendah', education: 'rendah', health: 'rendah' },
            { name: 'USA', icon: '🇺🇸', income: 'tinggi', education: 'baik', health: 'baik' },
            { name: 'Indonesia', icon: '🇮🇩', income: 'rendah', education: 'sederhana', health: 'sederhana' },
            { name: 'UK', icon: '🇬🇧', income: 'tinggi', education: 'cemerlang', health: 'cemerlang' },
            { name: 'Mesir', icon: '🇪🇬', income: 'rendah', education: 'sederhana', health: 'sederhana' },
            { name: 'Australia', icon: '🇦🇺', income: 'tinggi', education: 'baik', health: 'cemerlang' }
        ];

        const NAMES = ['Ahmad', 'Siti', 'John', 'Maria', 'Tanaka', 'Yuki', 'Raj', 'Priya', 'Carlos', 'Ana', 'Chinedu', 'Amara', 'Budi', 'Dewi', 'Omar', 'Layla'];

        const JOBS = [
            { title: 'Pelajar', salary: 0, education: 'Tiada' },
            { title: 'Buruh', salary: 800, education: 'Rendah' },
            { title: 'Pekerja Kilang', salary: 1500, education: 'Sederhana' },
            { title: 'Guru', salary: 2500, education: 'Tinggi' },
            { title: 'Jurutera', salary: 5000, education: 'Tinggi' },
            { title: 'Doktor', salary: 8000, education: 'Cemerlang' },
            { title: 'Peniaga', salary: 3000, education: 'Sederhana' },
            { title: 'Artis', salary: 1200, education: 'Sederhana' }
        ];

        const EVENTS = [
            { text: '🎉 Anda mendapat kenaikan gaji!', happiness: +10, money: +500 },
            { text: '🤒 Anda jatuh sakit.', health: -20, happiness: -10 },
            { text: '📚 Anda belajar ilmu baru!', intelligence: +10, happiness: +5 },
            { text: '💔 Rakan anda berpindah.', happiness: -10 },
            { text: '🏆 Anda memenangi pertandingan!', happiness: +20, money: +1000 },
            { text: '🚗 Anda terlibat kemalangan kecil.', health: -15, money: -300 },
            { text: '🎁 Anda menerima hadiah!', happiness: +15 },
            { text: '📉 Ekonomi merosot.', money: -200, happiness: -5 },
            { text: '🌧️ Banjir melanda kawasan anda.', health: -10, money: -500 },
            { text: '🌟 Anda bertemu kawan baru!', happiness: +15 }
        ];

        let life = null;

        function initStars() {
            const wrap = $('stars');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                frag.appendChild(s);
            }
            wrap.appendChild(frag);
        }

        function startLife() {
            const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
            const name = NAMES[Math.floor(Math.random() * NAMES.length)];
            const gender = Math.random() > 0.5 ? 'Lelaki' : 'Perempuan';

            life = {
                name: name,
                gender: gender,
                country: country.name,
                icon: country.icon,
                age: 0,
                health: 100,
                happiness: 70,
                intelligence: 50,
                money: Math.floor(Math.random() * 500) + 100,
                education: 'Tiada',
                alive: true
            };

            $('startScreen').style.display = 'none';
            $('lifeScreen').style.display = 'block';
            $('deathScreen').style.display = 'none';

            updateIdentity();
            updateStats();
            generateActions();
            toast(`Lahir di ${country.icon} ${country.name}!`, 'success');
        }

        function updateIdentity() {
            $('identityText').textContent = `${life.icon} ${life.name} • ${life.gender} • ${life.country} • Umur ${life.age}`;
        }

        function updateStats() {
            $('statAge').textContent = life.age;
            $('statHealth').textContent = life.health;
            $('statHappiness').textContent = life.happiness;
            $('statIntelligence').textContent = life.intelligence;
            $('statMoney').textContent = life.money.toLocaleString();
            $('statEducation').textContent = life.education;

            $('healthBar').style.width = life.health + '%';
            $('happinessBar').style.width = life.happiness + '%';
            $('intelligenceBar').style.width = life.intelligence + '%';

            $('healthBar').className = 'stat-bar-fill ' + (life.health > 50 ? 'fill-green' : life.health > 25 ? 'fill-yellow' : 'fill-red');
            $('happinessBar').className = 'stat-bar-fill ' + (life.happiness > 50 ? 'fill-green' : life.happiness > 25 ? 'fill-yellow' : 'fill-red');
            $('intelligenceBar').className = 'stat-bar-fill ' + (life.intelligence > 50 ? 'fill-green' : life.intelligence > 25 ? 'fill-yellow' : 'fill-red');
        }

        function generateActions() {
            const list = $('actionList');
            list.innerHTML = '';
            const actions = getActionsForAge(life.age);
            const frag = document.createDocumentFragment();

            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn-secondary';
                btn.textContent = action.label;
                btn.addEventListener('click', () => performAction(action));
                frag.appendChild(btn);
            });

            list.appendChild(frag);
        }

        function getActionsForAge(age) {
            const actions = [];
            if (age < 6) {
                actions.push({ label: '🧸 Bermain', happiness: +10, health: +5 });
                actions.push({ label: '📖 Belajar ABC', intelligence: +10 });
                actions.push({ label: '😴 Tidur', health: +10, happiness: +5 });
            } else if (age < 18) {
                actions.push({ label: '📚 Belajar di sekolah', intelligence: +15, happiness: -5 });
                actions.push({ label: '⚽ Bermain sukan', health: +15, happiness: +10 });
                actions.push({ label: '🎮 Main game', happiness: +10, health: -5 });
                actions.push({ label: '📖 Baca buku', intelligence: +10, happiness: +5 });
            } else if (age < 60) {
                actions.push({ label: '💼 Bekerja', money: +1500, happiness: -5 });
                actions.push({ label: '📚 Sambung belajar', intelligence: +10, money: -500 });
                actions.push({ label: '🏋️ Bersenam', health: +15, happiness: +10 });
                actions.push({ label: '💑 Cari pasangan', happiness: +15 });
                actions.push({ label: '🏠 Beli rumah', money: -5000, happiness: +20 });
            } else {
                actions.push({ label: '🧘 Berehat', health: +10, happiness: +15 });
                actions.push({ label: '👨‍👩‍👧 Luangkan masa dengan keluarga', happiness: +20 });
                actions.push({ label: '📖 Baca buku', intelligence: +5, happiness: +10 });
            }
            actions.push({ label: '⏭️ Teruskan hidup (1 tahun)', age: +1 });
            return actions;
        }

        function performAction(action) {
            if (!life.alive) return;

            if (action.age) {
                life.age += action.age;
            }
            if (action.health) life.health = Math.max(0, Math.min(100, life.health + action.health));
            if (action.happiness) life.happiness = Math.max(0, Math.min(100, life.happiness + action.happiness));
            if (action.intelligence) life.intelligence = Math.max(0, Math.min(100, life.intelligence + action.intelligence));
            if (action.money) life.money = Math.max(0, life.money + action.money);

            // Random event
            if (Math.random() < 0.3) {
                const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
                showEvent(event);
                if (event.health) life.health = Math.max(0, Math.min(100, life.health + event.health));
                if (event.happiness) life.happiness = Math.max(0, Math.min(100, life.happiness + event.happiness));
                if (event.intelligence) life.intelligence = Math.max(0, Math.min(100, life.intelligence + event.intelligence));
                if (event.money) life.money = Math.max(0, life.money + event.money);
            }

            // Check death
            if (life.health <= 0) {
                die('kesihatan teruk');
                return;
            }
            if (life.age >= 90) {
                die('usia lanjut');
                return;
            }
            if (Math.random() < 0.01 && life.age > 50) {
                die('penyakit');
                return;
            }

            updateStats();
            updateIdentity();
            generateActions();
        }

        function showEvent(event) {
            const container = $('eventContainer');
            container.innerHTML = `
                <div class="event-box">
                    <p>${event.text}</p>
                </div>
            `;
            setTimeout(() => container.innerHTML = '', 2500);
        }

        function die(reason) {
            life.alive = false;
            $('lifeScreen').style.display = 'none';
            $('deathScreen').style.display = 'block';
            $('deathSummary').textContent = `${life.icon} ${life.name} meninggal pada umur ${life.age} tahun di ${life.country} kerana ${reason}. Wang: RM${life.money.toLocaleString()} • Pendidikan: ${life.education}`;
            toast('Kehidupan tamat...', 'error');
        }

        function restartLife() {
            $('deathScreen').style.display = 'none';
            $('lifeScreen').style.display = 'none';
            $('startScreen').style.display = 'block';
            $('eventContainer').innerHTML = '';
        }

        initStars();
    </script>

</body>
</html>
