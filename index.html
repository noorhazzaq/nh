<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Chat&quot;,&quot;short_name&quot;:&quot;Chat&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#1a1a2e&quot;,&quot;theme_color&quot;:&quot;#16213e&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316213e'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23e94560'%3E💬%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    :root {
      --bg: #0f0e17;
      --surface: #1a1a2e;
      --header: #16213e;
      --accent: #e94560;
      --text: #fffffe;
      --own: #e94560;
      --other: #2d2d44;
    }
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }
    .app {
      max-width: 800px;
      width: 100%;
      height: 95vh;
      max-height: 800px;
      background: var(--surface);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .header {
      padding: 12px 20px;
      background: var(--header);
      border-bottom: 2px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 1.2rem;
    }
    .header h1 span {
      color: var(--accent);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .online {
      font-size: 0.75rem;
      opacity: 0.6;
      padding: 4px 12px;
      background: var(--bg);
      border-radius: 20px;
    }
    .auth {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .auth input {
      padding: 4px 10px;
      border: none;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      width: 100px;
      transition: 0.2s;
    }
    .auth input:focus {
      outline: 2px solid var(--accent);
      width: 130px;
    }
    .auth button {
      padding: 4px 14px;
      border: none;
      border-radius: 20px;
      background: var(--accent);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .auth button:hover {
      transform: scale(1.05);
      background: #ff6b81;
    }
    .auth button.logout {
      background: var(--other);
    }
    .auth button.logout:hover {
      background: #3d3d5c;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #12122a;
    }
    .messages::-webkit-scrollbar {
      width: 4px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    .status {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.4;
      padding: 8px;
      font-style: italic;
    }
    .msg {
      padding: 6px 14px;
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
      line-height: 1.4;
    }
    .msg.own {
      align-self: flex-end;
      background: var(--own);
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: var(--other);
      border-bottom-left-radius: 4px;
    }
    .msg .sender {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.6;
      letter-spacing: 0.5px;
    }
    .msg .time {
      font-size: 0.5rem;
      opacity: 0.4;
      margin-left: 6px;
    }
    .msg .text {
      font-size: 0.9rem;
    }
    .msg .text img,
    .msg .text video {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin: 4px 0;
      display: block;
    }
    .msg .text .sticker {
      font-size: 3rem;
      display: inline-block;
    }
    .msg .text .gif {
      max-width: 180px;
      border-radius: 8px;
    }
    .msg .text .location {
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: inline-block;
      font-size: 0.8rem;
    }
    .msg .text .location a {
      color: #4fc3f7;
      text-decoration: none;
    }
    .msg .text .voice {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 12px;
      border-radius: 20px;
    }
    .msg .text .voice audio {
      max-width: 140px;
      height: 28px;
    }
    .msg .text .poll {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .msg .text .poll .option {
      padding: 4px 8px;
      margin: 2px 0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .msg .text .poll .option:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .msg .text .poll .bar {
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin-top: 2px;
      transition: width 0.3s;
      width: 0%;
    }
    .msg .text pre {
      background: #0f0e17;
      padding: 6px 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.75rem;
    }
    .msg .text pre code {
      font-family: monospace;
      color: #a7a9be;
    }
    .input-area {
      padding: 8px 12px 12px;
      background: var(--header);
      border-top: 1px solid var(--other);
      flex-shrink: 0;
    }
    .tools {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .tools button {
      padding: 2px 10px;
      border: none;
      border-radius: 12px;
      background: var(--other);
      color: var(--text);
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.2s;
      opacity: 0.7;
    }
    .tools button:hover:not(:disabled) {
      opacity: 1;
      background: var(--accent);
      transform: scale(1.05);
    }
    .tools button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .picker {
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px;
      background: var(--surface);
      border-radius: 12px;
      max-height: 100px;
      overflow-y: auto;
      margin-bottom: 6px;
    }
    .picker.open {
      display: flex;
    }
    .picker button {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: 0.2s;
    }
    .picker button:hover {
      background: var(--other);
      transform: scale(1.15);
    }
    .sticker-picker button {
      font-size: 2.2rem;
    }
    .recording {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--accent);
      border-radius: 20px;
      font-size: 0.8rem;
      animation: pulse 1s infinite;
      margin-bottom: 6px;
    }
    .recording.active {
      display: flex;
    }
    .recording button {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .row input {
      flex: 1;
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      min-width: 50px;
    }
    .row input:focus {
      outline: 2px solid var(--accent);
    }
    .row input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .row button {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: var(--accent);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .row button:hover:not(:disabled) {
      transform: scale(1.05);
      background: #ff6b81;
    }
    .row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .row button.icon {
      padding: 8px 10px;
      font-size: 1.1rem;
      background: var(--other);
    }
    .row button.icon:hover:not(:disabled) {
      background: #3d3d5c;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }
    @media (max-width: 600px) {
      .app {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .header h1 {
        font-size: 1rem;
      }
      .auth input {
        width: 70px;
        font-size: 0.75rem;
      }
      .auth input:focus {
        width: 90px;
      }
      .messages {
        padding: 8px;
      }
      .msg {
        max-width: 92%;
        padding: 4px 10px;
        font-size: 0.85rem;
      }
      .tools button {
        font-size: 0.6rem;
        padding: 2px 6px;
      }
      .picker button {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <h1>💬 <span>Chat</span></h1>
      <div class="header-right">
        <span class="online" id="online">👤 0</span>
        <div class="auth" id="auth">
          <input type="text" id="name" placeholder="Name..." maxlength="20" />
          <button id="join">Join</button>
          <button id="leave" class="logout" style="display:none;">Leave</button>
        </div>
      </div>
    </div>

    <div class="messages" id="msgs"><div class="status">👋 Sign in</div></div>

    <div class="input-area">
      <div class="tools" id="tools">
        <button data-a="emoji">😊</button>
        <button data-a="sticker">🎨</button>
        <button data-a="gif">🎬</button>
        <button data-a="image">🖼️</button>
        <button data-a="video">🎥</button>
        <button data-a="voice">🎤</button>
        <button data-a="location">📍</button>
        <button data-a="poll">📊</button>
        <button data-a="code">💻</button>
        <button data-a="bold"><b>B</b></button>
        <button data-a="italic"><i>I</i></button>
        <button data-a="strike"><s>S</s></button>
      </div>

      <div class="recording" id="recording">
        🔴 Recording <button id="stoprec">⏹️</button>
      </div>

      <div class="picker" id="emojiPicker">
        <button>😊</button><button>😂</button><button>🤣</button><button>❤️</button>
        <button>🔥</button><button>👍</button><button>👎</button><button>🙏</button>
        <button>💪</button><button>🎉</button><button>✨</button><button>🌟</button>
        <button>💀</button><button>👀</button><button>🤔</button><button>😭</button>
        <button>🥰</button><button>😍</button><button>🤩</button><button>😎</button>
        <button>🥳</button><button>😤</button><button>🤯</button><button>😱</button>
        <button>🍕</button><button>🌮</button><button>🍔</button><button>☕</button>
        <button>🏆</button><button>🎯</button><button>💯</button><button>🔮</button>
      </div>

      <div class="picker sticker-picker" id="stickerPicker">
        <button>🐱</button><button>🐶</button><button>🐼</button><button>🐨</button>
        <button>🦊</button><button>🐰</button><button>🐻</button><button>🐸</button>
        <button>🐵</button><button>🦄</button><button>🐉</button><button>🐲</button>
        <button>🚀</button><button>🛸</button><button>👽</button><button>🤖</button>
        <button>🎃</button><button>👻</button><button>💀</button><button>👾</button>
      </div>

      <div class="row">
        <input type="text" id="input" placeholder="Type..." disabled />
        <button id="send" disabled>Send</button>
        <button id="filebtn" class="icon" disabled>📎</button>
        <input type="file" id="file" accept="image/*,video/*,audio/*" style="display:none" multiple />
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    // Firebase
    firebase.initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    const db = firebase.database();

    // DOM
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const msgs = $('#msgs'),
      input = $('#input'),
      send = $('#send'),
      name = $('#name'),
      join = $('#join'),
      leave = $('#leave'),
      online = $('#online'),
      tools = $('#tools'),
      emojiPicker = $('#emojiPicker'),
      stickerPicker = $('#stickerPicker'),
      fileInput = $('#file'),
      fileBtn = $('#filebtn'),
      recording = $('#recording'),
      stopRec = $('#stoprec');

    let user = null,
      listeners = [],
      recorder = null,
      chunks = [],
      votes = {};

    // Helpers
    const status = t => {
      let el = msgs.querySelector('.status');
      if (!el) { el = document.createElement('div');
        el.className = 'status';
        msgs.appendChild(el); }
      el.textContent = t;
    };
    const scroll = () => setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
    const esc = t => { const d = document.createElement('div');
      d.textContent = t; return d.innerHTML; };
    const time = t => t ? new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';

    // Upload file
    const upload = f => new Promise((r, re) => { const rd = new FileReader();
      rd.onload = e => r(e.target.result);
      rd.onerror = re;
      rd.readAsDataURL(f); });

    // Send message
    const sendMsg = txt => {
      if (!user) return alert('Sign in!');
      if (!txt || !txt.trim()) return;
      const data = { name: user.name, uid: user.uid, text: txt.trim(), timestamp: firebase.database.ServerValue.TIMESTAMP };
      if (txt.startsWith('📊 ')) {
        const parts = txt.substring(4).split('|');
        if (parts.length >= 3) {
          const id = db.ref('messages').push().key;
          db.ref('polls/' + id).set({ question: parts[0], options: parts.slice(1), votes: {} });
          data.text = `📊 ${parts[0]}|${parts.slice(1).join('|')}`;
        }
      }
      db.ref('messages').push(data).catch(() => alert('Failed to send.'));
      input.value = '';
      input.focus();
    };

    // Render message
    const render = data => {
      const own = user && data.uid === user.uid;
      const div = document.createElement('div');
      div.className = `msg ${own ? 'own' : 'other'}`;
      div.dataset.key = data._key;

      const hdr = document.createElement('div');
      hdr.className = 'sender';
      hdr.textContent = data.name || 'Anonymous';
      const tm = document.createElement('span');
      tm.className = 'time';
      tm.textContent = time(data.timestamp);
      hdr.appendChild(tm);
      div.appendChild(hdr);

      const cnt = document.createElement('div');
      cnt.className = 'text';
      let html = data.text || '';

      if (html.startsWith('📸 ')) html = `<img src="${html.substring(4)}" loading="lazy" onerror="this.style.display='none'" />`;
      else if (html.startsWith('🎬 ')) html = `<video controls src="${html.substring(4)}" preload="metadata"></video>`;
      else if (html.startsWith('🎤 ')) html =
        `<div class="voice">🎤 <audio controls src="${html.substring(4)}"></audio></div>`;
      else if (html.startsWith('📍 ')) html =
        `<div class="location">📍 <a href="https://maps.google.com/maps?q=${html.substring(4)}" target="_blank">${html.substring(4)}</a></div>`;
      else if (html.startsWith('📊 ')) {
        const parts = html.substring(4).split('|');
        const q = parts[0],
          opts = parts.slice(1);
        const id = data._key;
        let pollHtml = `<div class="poll" data-poll="${id}"><strong>📊 ${esc(q)}</strong><br/>`;
        opts.forEach((o, i) => {
          const v = votes[id]?.[i] || 0;
          const t = votes[id]?.total || 1;
          const pct = Math.round((v / t) * 100);
          pollHtml +=
            `<div class="option" data-poll="${id}" data-opt="${i}">${esc(o)} (${v})<div class="bar" style="width:${pct}%"></div></div>`;
        });
        pollHtml += '</div>';
        html = pollHtml;
      } else if (html.startsWith('💻 ')) html = `<pre><code>${esc(html.substring(4))}</code></pre>`;
      else if (html.startsWith('🎬 GIF: ')) html =
        `<img class="gif" src="${html.substring(8)}" loading="lazy" onerror="this.style.display='none'" />`;
      else if (html.startsWith('🎨 ')) html = `<span class="sticker">${html.substring(4)}</span>`;
      else html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<i>$1</i>').replace(/~~(.*?)~~/g,
        '<s>$1</s>');

      cnt.innerHTML = html;
      div.appendChild(cnt);

      const st = msgs.querySelector('.status');
      if (st) st.remove();
      msgs.appendChild(div);
      scroll();

      div.querySelectorAll('.option').forEach(el => {
        el.onclick = () => {
          if (!user) return alert('Sign in to vote!');
          const id = el.dataset.poll,
            opt = parseInt(el.dataset.opt);
          const ref = db.ref('polls/' + id + '/votes/' + user.uid);
          ref.once('value', s => {
            if (s.exists()) return alert('Already voted!');
            ref.set(opt, () => {
              if (!votes[id]) votes[id] = {};
              votes[id][opt] = (votes[id][opt] || 0) + 1;
              votes[id].total = (votes[id].total || 0) + 1;
              renderPoll(id);
            });
          });
        };
      });
    };

    const renderPoll = id => {
      const el = document.querySelector(`[data-poll="${id}"]`);
      if (!el) return;
      const msg = el.closest('.msg');
      if (!msg) return;
      db.ref('polls/' + id).once('value', s => {
        const d = s.val();
        if (!d) return;
        const v = d.votes || {},
          total = Object.keys(v).length,
          opts = d.options || [];
        let html = `<div class="poll" data-poll="${id}"><strong>📊 ${esc(d.question)}</strong><br/>`;
        const counts = {};
        Object.values(v).forEach(x => counts[x] = (counts[x] || 0) + 1);
        opts.forEach((o, i) => {
          const c = counts[i] || 0,
            pct = total > 0 ? Math.round((c / total) * 100) : 0;
          html +=
            `<div class="option" data-poll="${id}" data-opt="${i}">${esc(o)} (${c})<div class="bar" style="width:${pct}%"></div></div>`;
        });
        html += '</div>';
        const cnt = msg.querySelector('.text');
        cnt.innerHTML = html;
        msg.querySelectorAll('.option').forEach(el => {
          el.onclick = () => {
            if (!user) return alert('Sign in!');
            const pid = el.dataset.poll,
              opt = parseInt(el.dataset.opt);
            const ref = db.ref('polls/' + pid + '/votes/' + user.uid);
            ref.once('value', s => {
              if (s.exists()) return alert('Already voted!');
              ref.set(opt, () => {
                if (!votes[pid]) votes[pid] = {};
                votes[pid][opt] = (votes[pid][opt] || 0) + 1;
                votes[pid].total = (votes[pid].total || 0) + 1;
                renderPoll(pid);
              });
            });
          };
        });
      });
    };

    // Subscribe
    const subscribe = () => {
      listeners.forEach(r => r.off());
      listeners = [];
      const q = db.ref('messages').orderByKey().limitToLast(150);
      q.on('child_added', s => { const d = s.val();
        d._key = s.key;
        render(d); });
      q.on('child_removed', s => { const el = msgs.querySelector(`[data-key="${s.key}"]`); if (el) el.remove(); });
      listeners.push(q);
      q.once('value', s => { if (!s.exists()) status('💬 No messages'); });
      db.ref('polls').on('child_changed', s => renderPoll(s.key));
      listeners.push(db.ref('polls'));

      const presence = db.ref('.info/connected'),
        users = db.ref('users');
      presence.on('value', s => {
        if (s.val() && user) {
          const ref = users.child(user.uid);
          ref.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          ref.onDisconnect().remove();
        }
      });
      users.on('value', s => { online.textContent = s.exists() ? `👤 ${s.numChildren()}` : '👤 0'; });
      listeners.push(presence);
    };

    // Auth
    const login = () => {
      const n = name.value.trim() || 'Guest';
      user = { name: n, uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) };
      name.disabled = true;
      join.style.display = 'none';
      leave.style.display = 'inline-block';
      input.disabled = false;
      send.disabled = false;
      fileBtn.disabled = false;
      input.placeholder = `Message as ${n}...`;
      $$('#tools button').forEach(b => b.disabled = false);
      status(`✅ Signed in as ${n}`);
      msgs.innerHTML = '';
      subscribe();
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();
      listeners.forEach(r => r.off());
      listeners = [];
      user = null;
      name.disabled = false;
      join.style.display = 'inline-block';
      leave.style.display = 'none';
      input.disabled = true;
      send.disabled = true;
      fileBtn.disabled = true;
      input.placeholder = 'Sign in...';
      input.value = '';
      $$('#tools button').forEach(b => b.disabled = true);
      msgs.innerHTML = '';
      status('👋 Left chat');
      online.textContent = '👤 0';
    };

    // Voice recording
    const startRecord = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const file = new File([blob], 'voice.webm', { type: 'audio/webm' });
          const dataUrl = await upload(file);
          sendMsg('🎤 ' + dataUrl);
          recording.classList.remove('active');
          input.disabled = false;
          send.disabled = false;
          stream.getTracks().forEach(t => t.stop());
        };
        recorder.start();
        recording.classList.add('active');
        input.disabled = true;
        send.disabled = true;
      } catch (e) { alert('Microphone access denied.'); }
    };

    const stopRecord = () => {
      if (recorder && recorder.state === 'recording') {
        recorder.stop();
        recording.classList.remove('active');
        input.disabled = false;
        send.disabled = false;
      }
    };

    // Handle files
    const handleFile = async f => {
      if (!user) return alert('Sign in!');
      const type = f.type.startsWith('image/') ? '📸 ' : f.type.startsWith('video/') ? '🎬 ' : '🎤 ';
      const dataUrl = await upload(f);
      sendMsg(type + dataUrl);
    };

    // Toggle pickers
    const togglePicker = type => {
      const picker = type === 'emoji' ? emojiPicker : stickerPicker;
      const isOpen = picker.classList.contains('open');
      [emojiPicker, stickerPicker].forEach(p => p.classList.remove('open'));
      if (!isOpen) picker.classList.add('open');
    };

    // Events
    join.onclick = login;
    leave.onclick = logout;
    name.onkeydown = e => { if (e.key === 'Enter') login(); };
    send.onclick = () => sendMsg(input.value);
    input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
        sendMsg(input.value); } };

    fileBtn.onclick = () => fileInput.click();
    fileInput.onchange = async e => {
      if (e.target.files.length) {
        for (const f of e.target.files) await handleFile(f);
        e.target.value = '';
      }
    };

    stopRec.onclick = stopRecord;

    tools.onclick = e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const a = btn.dataset.a;
      if (a === 'emoji') togglePicker('emoji');
      else if (a === 'sticker') togglePicker('sticker');
      else if (a === 'gif') { const url = prompt('GIF URL:'); if (url) sendMsg('🎬 GIF: ' + url); } else if (a === 'image')
        fileInput.click();
      else if (a === 'video') fileInput.click();
      else if (a === 'voice') { if (recorder && recorder.state === 'recording') stopRecord();
        else startRecord(); } else if (a === 'location') {
        if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
          p => sendMsg('📍 ' + p.coords.latitude + ',' + p.coords.longitude),
          () => alert('Location denied.')
        );
        else alert('Not supported.');
      } else if (a === 'poll') {
        const q = prompt('Poll question:');
        if (q) {
          const opts = prompt('Options (comma separated):');
          if (opts) {
            const o = opts.split(',').map(x => x.trim()).filter(x => x);
            if (o.length >= 2) sendMsg('📊 ' + q + '|' + o.join('|'));
            else alert('Need 2+ options');
          }
        }
      } else if (a === 'code') { const c = prompt('Code:'); if (c) sendMsg('💻 ' + c); } else if (a === 'bold') input
        .value += ' **bold** ';
      else if (a === 'italic') input.value += ' *italic* ';
      else if (a === 'strike') input.value += ' ~~strike~~ ';
      input.focus();
    };

    emojiPicker.onclick = e => {
      const btn = e.target.closest('button');
      if (btn) { input.value += btn.textContent;
        input.focus();
        emojiPicker.classList.remove('open'); }
    };

    stickerPicker.onclick = e => {
      const btn = e.target.closest('button');
      if (btn) { sendMsg('🎨 ' + btn.textContent);
        stickerPicker.classList.remove('open'); }
    };

    document.onclick = e => {
      if (!e.target.closest('.input-area')) {
        emojiPicker.classList.remove('open');
        stickerPicker.classList.remove('open');
      }
    };

    // Init
    $$('#tools button').forEach(b => b.disabled = true);
    status('🌐 Connecting...');
    subscribe();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    console.log('💬 Chat loaded');
  </script>

</body>
</html>
