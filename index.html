<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no">
<title>Neon Pulse Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
html,body{width:100%;height:100%;background:#0b0b1a;overflow:hidden;position:relative}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;height:100%;max-width:600px;max-height:900px;background:#111128;border-radius:0;box-shadow:0 0 40px rgba(0,255,255,.3);display:flex;flex-direction:column;position:relative;overflow:hidden;border:1px solid #2affdd55}
@media(min-width:720px){#app{border-radius:32px;max-height:85vh}}
.header{background:#0e0e24;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #2affdd66;flex-shrink:0;backdrop-filter:blur(4px);position:relative;z-index:2}
.header .brand{color:#b0faff;font-weight:700;font-size:1.1rem;letter-spacing:2px;text-shadow:0 0 12px #2affdd;flex:1;white-space:nowrap}
.header .user-area{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header .user-area input{background:#1f1f3a;border:1px solid #2affdd66;border-radius:30px;padding:6px 14px;color:#f0fcff;font-size:.8rem;width:100px;transition:.3s;outline:0}
.header .user-area input:focus{width:130px;border-color:#7bf5ff;box-shadow:0 0 16px #2affdd88}
.header .user-area button{background:0 0;border:1.5px solid #2affdd;color:#2affdd;border-radius:30px;padding:4px 12px;font-size:.75rem;font-weight:600;cursor:pointer;transition:.2s;text-shadow:0 0 8px #2affdd88;letter-spacing:.5px}
.header .user-area button:active{transform:scale(.92);background:#2affdd22}
.chat-area{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;background:radial-gradient(circle at 20% 30%,#141433,#0a0a1a);position:relative}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:#2affdd88;border-radius:20px}
.message{background:#191943cc;backdrop-filter:blur(4px);border-radius:16px 16px 16px 4px;padding:10px 14px;border-left:3px solid #2affdd;box-shadow:0 0 18px #2affdd22;animation:fadeIn .2s ease;word-break:break-word;max-width:95%;align-self:flex-start;transition:.2s}
.message .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:4px;font-size:.7rem}
.message .username{color:#8cf5ff;font-weight:700;text-shadow:0 0 12px #2affdd;letter-spacing:.3px}
.message .time{color:#7a8b9f;font-size:.6rem;opacity:.8;font-weight:300}
.message .text{color:#e2f0fa;font-size:.92rem;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.message .text a{color:#7bf5ff;text-decoration:none;font-weight:500;border-bottom:1px dashed #2affdd88;padding:0 2px;transition:.2s}
.message .text a:active{color:#fff;background:#2affdd33;border-radius:4px}
.message.own{align-self:flex-end;border-left-color:#ff7bf0;border-left-width:3px;background:#221d3acc;box-shadow:0 0 22px #ff7bf033}
.message.own .username{color:#ff91f0;text-shadow:0 0 16px #ff7bf0}
.neon-pulse{animation:pulseGlow 2.2s infinite alternate}
@keyframes pulseGlow{0%{border-color:#2affdd44;box-shadow:0 0 20px #2affdd22}100%{border-color:#7bf5ffaa;box-shadow:0 0 48px #7bf5ff66}}
@keyframes fadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.input-area{background:#0e0e24cc;backdrop-filter:blur(8px);padding:10px 12px 14px;display:flex;align-items:flex-end;gap:8px;border-top:2px solid #2affdd55;flex-shrink:0;position:relative;z-index:2}
.input-area textarea{flex:1;background:#1a1a3a;border:1px solid #2affdd55;border-radius:24px;padding:10px 16px;color:#f0fcff;font-size:.95rem;resize:none;min-height:48px;max-height:120px;outline:0;transition:.25s;line-height:1.3;font-family:inherit}
.input-area textarea:focus{border-color:#7bf5ff;box-shadow:0 0 30px #2affdd44;background:#12122e}
.input-area .send-btn{background:linear-gradient(145deg,#2affdd,#00c8b0);border:0;border-radius:50px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:300;color:#0b0b1a;cursor:pointer;transition:.2s;box-shadow:0 0 30px #2affdd66;flex-shrink:0}
.input-area .send-btn:active{transform:scale(.85);box-shadow:0 0 60px #7bf5ff}
.banned-overlay{display:none;position:fixed;inset:0;background:#000c;backdrop-filter:blur(12px);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:#ff6670;font-size:1.4rem;text-align:center;padding:30px;font-weight:600}
.banned-overlay .icon{font-size:4rem;filter:drop-shadow(0 0 30px #ff4466)}
@media(max-width:480px){.header .brand{font-size:.9rem}.header .user-area input{width:70px}.header .user-area input:focus{width:100px}.message{padding:8px 12px;font-size:.85rem}}
</style>
</head>
<body>
<div id="app" class="neon-pulse">
<div class="header">
<span class="brand">⚡ PULSE</span>
<div class="user-area">
<input type="text" id="usernameInput" placeholder="Name" maxlength="20" value="Guest">
<button id="setNameBtn">✓</button>
</div>
</div>
<div class="chat-area" id="chatContainer"></div>
<div class="input-area">
<textarea id="msgInput" rows="1" placeholder="Message..."></textarea>
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>
<div class="banned-overlay" id="bannedOverlay"><div class="icon">⛔</div><div>ACCESS DENIED<br><span style="font-size:.9rem;opacity:.7">Android only</span></div></div>
<script>
(function(){'use strict';
const isAndroid = /android/i.test(navigator.userAgent);
if(!isAndroid){document.getElementById('bannedOverlay').style.display='flex';document.getElementById('app').style.filter='blur(6px)';return;}
const DB_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
let db, messagesRef, nameRef;
let currentUser='Guest';
const chat=document.getElementById('chatContainer');
const msgInput=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');
const usernameInput=document.getElementById('usernameInput');
const setNameBtn=document.getElementById('setNameBtn');
let lastScrollHeight=0;
function initFirebase(){if(typeof firebase!=='undefined'){try{if(!firebase.apps.length){firebase.initializeApp({databaseURL:DB_URL});}db=firebase.database();messagesRef=db.ref('messages');nameRef=db.ref('users/'+currentUser.replace(/[.#$[\]]/g,'_'));}catch(e){console.warn('FB init issue',e);}}else{setTimeout(initFirebase,400);}}
function loadMessages(){if(!messagesRef)return;messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added',function(snap){const data=snap.val();if(data&&data.text&&data.username){appendMessage(data.username,data.text,data.timestamp,data.userId===currentUser);}});}
function appendMessage(username,text,timestamp,isOwn){const msgDiv=document.createElement('div');msgDiv.className='message'+(isOwn?' own':'');
const meta=document.createElement('div');meta.className='meta';
const uname=document.createElement('span');uname.className='username';uname.textContent=username||'Anon';
const time=document.createElement('span');time.className='time';if(timestamp){const d=new Date(timestamp);time.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}else{time.textContent='now';}
meta.appendChild(uname);meta.appendChild(time);
const textDiv=document.createElement('div');textDiv.className='text';
textDiv.innerHTML=linkify(text);
msgDiv.appendChild(meta);msgDiv.appendChild(textDiv);
chat.appendChild(msgDiv);
chat.scrollTop=chat.scrollHeight;
lastScrollHeight=chat.scrollHeight;
}
function linkify(txt){if(!txt)return'';const urlPattern=/(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gi;return txt.replace(urlPattern,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
function sendMessage(){const text=msgInput.value.trim();if(!text)return;if(!messagesRef){initFirebase();if(!messagesRef){alert('DB not ready');return;}}const userId=currentUser||'Guest';
const payload={username:userId,text:text,timestamp:Date.now(),userId:userId};
messagesRef.push(payload).then(()=>{msgInput.value='';msgInput.style.height='auto';chat.scrollTop=chat.scrollHeight;}).catch(e=>{console.warn('send fail',e);});
}
function changeUsername(newName){const trimmed=newName.trim().slice(0,20);if(!trimmed){usernameInput.value=currentUser;return;}if(trimmed===currentUser){return;}
if(trimmed.length<2){alert('Min 2 chars');usernameInput.value=currentUser;return;}
const oldUser=currentUser;
currentUser=trimmed;
usernameInput.value=currentUser;
if(nameRef){nameRef.remove();}
nameRef=db.ref('users/'+currentUser.replace(/[.#$[\]]/g,'_'));
nameRef.set({name:currentUser,updated:Date.now()});
localStorage.setItem('neonUser',currentUser);
}
function setupListeners(){
sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
msgInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
setNameBtn.addEventListener('click',function(){const val=usernameInput.value.trim();if(val&&val!==currentUser){changeUsername(val);}else{usernameInput.value=currentUser;}});
usernameInput.addEventListener('keydown',function(e){if(e.key==='Enter'){setNameBtn.click();}});
}
function restoreUser(){const saved=localStorage.getItem('neonUser');if(saved){currentUser=saved;usernameInput.value=saved;}}
(function boot(){restoreUser();initFirebase();setTimeout(()=>{if(!db){initFirebase();}},600);setupListeners();loadMessages();})();
window.addEventListener('online',function(){if(!db){initFirebase();}});
})();
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</body>
</html>
