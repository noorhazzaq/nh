        :root {
            --red: #ff0033;
            --cyan: #00f0ff;
            --gold: #ffd700;
            --purple: #8a2be2;
            --pink: #ff00ff;
            --bg: #000000;
            --white: #ffffff;
            --muted: #999999;
            --success: #00ff88;
            --border-glow: rgba(0,240,255,0.3);
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff, #ffd700, #ff00ff);
            --grad-btn: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --r-sm: 10px;
            --r-md: 16px;
            --r-full: 30px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .aurora {
            position: fixed; inset: 0;
            background:

                radial-gradient(circle at 80% 70%, rgba(0,240,255,0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(138,43,226,0.08) 0%, transparent 60%),
                radial-gradient(circle at 60% 20%, rgba(255,215,0,0.06) 0%, transparent 40%);
            z-index: 0;
            animation: auroraFloat 10s ease-in-out infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10px, 10px) scale(1.05); }
        }

        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; width: 2px; height: 2px;
            border-radius: 50%; background: var(--white);
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px var(--white); } }

        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .particle {
            position: absolute; width: 3px; height: 3px;
            border-radius: 50%; animation: floatUp linear infinite;
        }
        .p-red { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .p-cyan { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .p-gold { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .p-purple { background: var(--purple); box-shadow: 0 0 10px var(--purple); }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(12px + var(--safe-top)) 15px 12px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            text-align: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            background: var(--grad-text);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 4s ease infinite;
        }
        @keyframes logoGlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .main {
            position: relative; z-index: 2;
            padding: calc(55px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .card {
            border: 1px solid var(--border-glow);
            border-radius: var(--r-md);
            background: rgba(0,0,0,0.5);
            padding: 12px;
            backdrop-filter: blur(10px);
            animation: boxGlow 5s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,51,0.1); }
            50% { box-shadow: 0 0 35px rgba(0,240,255,0.15); }
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif; font-size: 11px;
            letter-spacing: 2px; color: var(--cyan);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .stat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glow);
            border-radius: var(--r-sm);
            padding: 8px 5px;
            text-align: center;
        }
        .stat-label { font-size: 6px; color: var(--muted); letter-spacing: 1px; font-family: 'Orbitron', sans-serif; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900; color: var(--white); margin-top: 2px; }
        .stat-value.small { font-size: 9px; }
        .stat-bar { height: 4px; background: rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s var(--ease); }
        .fill-green { background: var(--success); }
        .fill-yellow { background: var(--gold); }
        .fill-red { background: var(--red); }

        .btn-primary {
            width: 100%; padding: 11px;
            background: var(--grad-btn); color: var(--white);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px;
            border: none; border-radius: var(--r-full); font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            width: 100%; padding: 9px;
            background: rgba(255,0,51,0.08);
            border: 1px solid var(--border-glow);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 1px;
            border-radius: var(--r-full);
            cursor: pointer;
            margin-bottom: 5px;
        }
        .btn-secondary:active { background: var(--red); color: var(--white); }

        .event-box {
            border: 1px solid var(--gold);
            border-radius: var(--r-sm);
            background: rgba(255,215,0,0.08);
            padding: 10px;
            margin-bottom: 8px;
            text-align: center;
            animation: fadeUp 0.3s var(--ease);

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
        .event-box p { font-size: 11px; color: var(--white); line-height: 1.5; }

        .achievement-badge {
            display: inline-flex; align-items: center; gap: 4px;

            background: rgba(255,215,0,0.1);
            border: 1px solid var(--gold);
            border-radius: 12px;

            color: var(--gold);

            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;

        .toast {
            padding: 10px 15px; border-radius: 12px; font-size: 11px;
            border: 1px solid;
            transition: all 0.4s var(--ease);

            { title: 'Youtuber', salary: 4500, education: 'Tiada' },
            { title: 'Aktivis', salary: 2500, education: 'Sederhana' },
            { title: 'Sukarelawan', salary: 500, education: 'Tiada' },
            { title: 'Ahli Politik', salary: 6000, education: 'Sederhana' }
        ];

        const RELIGIONS = ['Islam', 'Kristian', 'Hindu', 'Buddha', 'Yahudi', 'Sikh', 'Tiada'];
        const LANGUAGES = ['Melayu', 'Inggeris', 'Mandarin', 'Tamil', 'Hindi', 'Arab', 'Jepun', 'Korea', 'Sepanyol', 'Perancis', 'Jerman', 'Portugis', 'Rusia', 'Thai', 'Vietnam'];

        let life = null;
        let timeline = [];
        let achievements = [];
        let stocks = 0;
        let crypto = 0;
        let gold = 0;
        let property = 0;

        function initStars() {
            const wrap = $('stars');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's';
                frag.appendChild(s);
            }
            wrap.appendChild(frag);
        }

        function initParticles() {
            const wrap = $('particles');
            const colors = ['p-red','p-cyan','p-gold','p-purple'];
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = `particle ${colors[i % 4]}`;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                frag.appendChild(p);
            }
            wrap.appendChild(frag);
        }

        function startLife() {
            const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
            const gender = Math.random() > 0.5 ? 'Lelaki' : 'Perempuan';
            const names = gender === 'Lelaki' ? country.maleNames : country.femaleNames;
            const name = names[Math.floor(Math.random() * names.length)];
            const religion = RELIGIONS[Math.floor(Math.random() * RELIGIONS.length)];
            const language = LANGUAGES[Math.floor(Math.random() * LANGUAGES.length)];
            const baseSalary = Math.floor(country.gdp / 10);

            life = {
                name, gender,
                country: country.name, icon: country.icon,
                gdp: country.gdp, lifeExpectancy: country.life,
                crimeRate: country.crime, corruption: country.corruption,
                unemployment: country.unemployment, inflation: country.inflation,
                taxRate: country.tax, currency: country.currency,
                climate: country.climate, geo: country.geo,
                passport: country.passport,
                religion, language,
                age: 0, health: 100, happiness: 70,
                intelligence: 50, creativity: 30, reputation: 10,
                mental: 80, fitness: 40, spiritual: 20,
                money: baseSalary, debt: 0,
                education: 'Tiada', job: 'Tiada',
                married: false, children: 0,
                alive: true,
                hasCriminalRecord: false, inJail: false, jailYears: 0,
                bankAccount: baseSalary * 2,
                hasInsurance: false, hasCar: false, hasHouse: false,
                dynamicLifeExpectancy: country.life,
                followers: 0, isInfluencer: false,
                hasDivorced: false, adoptedChildren: 0,
                hasSurgery: false, hasCancer: false,
                hasLicense: false, hasVisa: false,
                hasPassport: false, hasWill: false,
                hasContract: false, hasPatent: false
            };
            timeline = [];
            achievements = [];
            stocks = 0;
            crypto = 0;
            gold = 0;
            property = 0;
            addTimeline(`👶 Lahir di ${country.icon} ${country.name}`);

            $('startScreen').style.display = 'none';
            $('lifeScreen').style.display = 'block';
            $('deathScreen').style.display = 'none';

            renderStats();
            generateActions();
            toast(`Lahir sebagai ${name} di ${country.icon} ${country.name}!`, 'success');
        }

        function addTimeline(text) {
            timeline.push({ age: life.age, text });
            renderTimeline();
        }

        function renderTimeline() {
            if (timeline.length < 2) return;
            $('timelineCard').style.display = 'block';
            const list = $('timelineList');
            const frag = document.createDocumentFragment();
            timeline.slice(-10).reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `<strong>Umur ${item.age}:</strong> ${item.text}`;
                frag.appendChild(div);
            });
            list.innerHTML = '';
            list.appendChild(frag);
        }

        function checkAchievements() {
            const checks = [
                { id: 'age50', label: '🎂 50 Tahun', cond: life.age >= 50 },
                { id: 'age80', label: '🎂 80 Tahun', cond: life.age >= 80 },
                { id: 'millionaire', label: '💎 Jutawan', cond: life.money >= 1000000 },
                { id: 'married', label: '💍 Kahwin', cond: life.married },
                { id: 'parent', label: '👶 Anak', cond: life.children + life.adoptedChildren > 0 },
                { id: 'educated', label: '🎓 Universiti', cond: life.education === 'Ijazah' || life.education === 'PhD' },
                { id: 'famous', label: '⭐ Terkenal', cond: life.reputation >= 80 },
                { id: 'influencer', label: '📱 Influencer', cond: life.isInfluencer },
                { id: 'house', label: '🏠 Rumah', cond: life.hasHouse },
                { id: 'car', label: '🚗 Kereta', cond: life.hasCar },
                { id: 'stocks', label: '📈 Pelabur', cond: stocks > 0 },
                { id: 'crypto', label: '₿ Kripto', cond: crypto > 0 },
                { id: 'gold', label: '🥇 Emas', cond: gold > 0 },
                { id: 'property', label: '🏢 Hartanah', cond: property > 0 },
                { id: 'license', label: '🚦 Lesen', cond: life.hasLicense },
                { id: 'passport', label: '🛂 Pasport', cond: life.hasPassport },
                { id: 'will', label: '📜 Wasiat', cond: life.hasWill },
                { id: 'patent', label: '💡 Paten', cond: life.hasPatent },
                { id: 'surgery', label: '🔪 Pembedahan', cond: life.hasSurgery },
                { id: 'divorced', label: '💔 Cerai', cond: life.hasDivorced }
            ];

            checks.forEach(check => {
                if (check.cond && !achievements.includes(check.id)) {
                    achievements.push(check.id);
                    toast('Pencapaian: ' + check.label + '! 🏆', 'success');
                }
            });

            if (achievements.length > 0) {
                $('achievementCard').style.display = 'block';
                const labels = { age50: '🎂 50 Tahun', age80: '🎂 80 Tahun', millionaire: '💎 Jutawan', married: '💍 Kahwin', parent: '👶 Anak', educated: '🎓 Universiti', famous: '⭐ Terkenal', influencer: '📱 Influencer', house: '🏠 Rumah', car: '🚗 Kereta', stocks: '📈 Pelabur', crypto: '₿ Kripto', gold: '🥇 Emas', property: '🏢 Hartanah', license: '🚦 Lesen', passport: '🛂 Pasport', will: '📜 Wasiat', patent: '💡 Paten', surgery: '🔪 Pembedahan', divorced: '💔 Cerai' };
                $('achievementList').innerHTML = achievements.map(id => `<span class="achievement-badge">${labels[id] || id}</span>`).join(' ');
            }
        }

        function renderStats() {
            const grid = $('statGrid');
            const stats = [
                { label: 'UMUR', value: life.age },
                { label: 'WANG (' + life.currency + ')', value: life.money.toLocaleString(), small: true },
                { label: 'BANK', value: life.bankAccount.toLocaleString(), small: true },
                { label: 'HUTANG', value: life.debt.toLocaleString(), small: true },
                { label: 'SAHAM', value: stocks, small: true },
                { label: 'KRIPTO', value: crypto, small: true },
                { label: 'EMAS', value: gold, small: true },
                { label: 'HARTANAH', value: property, small: true },
                { label: 'KESIHATAN', value: life.health, bar: life.health, color: life.health > 50 ? 'fill-green' : life.health > 25 ? 'fill-yellow' : 'fill-red' },
                { label: 'KEBAHAGIAAN', value: life.happiness, bar: life.happiness, color: life.happiness > 50 ? 'fill-green' : life.happiness > 25 ? 'fill-yellow' : 'fill-red' },
                { label: 'KECERDASAN', value: life.intelligence, bar: life.intelligence, color: 'fill-green' },
                { label: 'MENTAL', value: life.mental, bar: life.mental, color: life.mental > 50 ? 'fill-green' : life.mental > 25 ? 'fill-yellow' : 'fill-red' },
                { label: 'JANGKA HAYAT', value: life.dynamicLifeExpectancy, small: true },
                { label: 'PENDIDIKAN', value: life.education, small: true },
                { label: 'PEKERJAAN', value: life.job, small: true },
                { label: 'STATUS', value: life.married ? (life.hasDivorced ? 'Cerai' : 'Kahwin') : 'Bujang', small: true },
                { label: 'ANAK', value: life.children + life.adoptedChildren },
                { label: 'PENGIKUT', value: life.followers, small: true },
                { label: 'PENJARA', value: life.inJail ? 'Ya' : 'Tidak', small: true },
                { label: 'REKOD JENAYAH', value: life.hasCriminalRecord ? 'Ya' : 'Tiada', small: true },
                { label: 'PASPORT', value: life.passport + ' negara', small: true }
            ];

            const frag = document.createDocumentFragment();
            stats.forEach(s => {
                const box = document.createElement('div');
                box.className = 'stat-box';
                box.innerHTML = `
                    <div class="stat-label">${s.label}</div>
                    <div class="stat-value ${s.small ? 'small' : ''}">${s.value}</div>
                    ${s.bar !== undefined ? `<div class="stat-bar"><div class="stat-bar-fill ${s.color}" style="width:${s.bar}%"></div></div>` : ''}
                `;
                frag.appendChild(box);
            });
            grid.innerHTML = '';
            grid.appendChild(frag);

            $('identityText').textContent = `${life.icon} ${life.name} • ${life.gender} • ${life.country} • Umur ${life.age} • Agama: ${life.religion} • Bahasa: ${life.language} • Iklim: ${life.climate} • Geografi: ${life.geo} • Pasport: ${life.passport} negara • Jenayah: ${life.crimeRate}% • Rasuah: ${life.corruption}% • Inflasi: ${life.inflation}% • Cukai: ${life.taxRate}%`;
        }

        function generateActions() {
            const list = $('actionList');
            list.innerHTML = '';
            const frag = document.createDocumentFragment();
            const actions = getActionsForAge(life.age);

            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn-secondary';
                btn.textContent = action.label;
                btn.addEventListener('click', () => performAction(action));
                frag.appendChild(btn);
            });

            list.appendChild(frag);
        }

        function getActionsForAge(age) {
            const actions = [];
            if (life.inJail) {
                actions.push({ label: '⛓️ Jalani hukuman (1 tahun)', jail: 1 });
                return actions;
            }
            if (age < 6) {
                actions.push({ label: '🧸 Bermain', happiness: 10, health: 5 });
                actions.push({ label: '📖 Belajar ' + life.language, intelligence: 10 });
            } else if (age < 13) {
                actions.push({ label: '📚 Sekolah rendah', intelligence: 12, education: 'Rendah' });
                actions.push({ label: '⚽ Main sukan', health: 15, happiness: 10, fitness: 10 });
            } else if (age < 18) {
                actions.push({ label: '📚 Sekolah menengah', intelligence: 15, education: 'Menengah' });
                actions.push({ label: '🎓 Ambil SPM', intelligence: 10, education: 'SPM' });
                actions.push({ label: '🚦 Ambil lesen memandu', money: -500, hasLicense: true });
            } else if (age < 25) {
                actions.push({ label: '🎓 Diploma', intelligence: 15, money: -3000, education: 'Diploma' });
                actions.push({ label: '🎓 Universiti', intelligence: 20, money: -8000, education: 'Ijazah', debt: 8000 });
                actions.push({ label: '💼 Cari kerja', money: 1500, job: JOBS[Math.floor(Math.random() * JOBS.length)].title });
                actions.push({ label: '💑 Cari pasangan', happiness: 15 });
                actions.push({ label: '📈 Beli saham', money: -1000, stocks: 10, intelligence: 5 });
                actions.push({ label: '₿ Beli kripto', money: -500, crypto: 5 });
                actions.push({ label: '🥇 Beli emas', money: -2000, gold: 5 });
                actions.push({ label: '🛂 Buat pasport', money: -200, hasPassport: true });
            } else if (age < 45) {
                actions.push({ label: '💼 Bekerja', money: 2000, happiness: -5 });
                actions.push({ label: '💍 Kahwin', happiness: 30, married: true });
                actions.push({ label: '👶 Dapat anak', happiness: 20, children: 1 });
                actions.push({ label: '👶 Anak angkat', happiness: 15, adoptedChildren: 1 });
                actions.push({ label: '💔 Bercerai', happiness: -20, hasDivorced: true, married: false });
                actions.push({ label: '🏠 Beli rumah', money: -15000, happiness: 20, debt: 15000, hasHouse: true });
                actions.push({ label: '🏢 Beli hartanah sewa', money: -20000, property: 1, happiness: 15 });
                actions.push({ label: '🚗 Beli kereta', money: -8000, happiness: 10, hasCar: true });
                actions.push({ label: '📱 Jadi influencer', happiness: 15, isInfluencer: true, followers: 10000 });
                actions.push({ label: '💡 Daftar paten', money: -3000, hasPatent: true, intelligence: 10 });
            } else if (age < 65) {
                actions.push({ label: '💼 Bekerja', money: 1800, happiness: -3 });
                actions.push({ label: '👨‍👩‍👧 Masa keluarga', happiness: 20 });
                actions.push({ label: '🧘 Meditasi', health: 10, mental: 10, spiritual: 5 });
                actions.push({ label: '💊 Pemeriksaan kesihatan', health: 5, money: -200 });
                actions.push({ label: '🔪 Pembedahan', health: 10, money: -5000, hasSurgery: true });
                actions.push({ label: '📜 Tulis wasiat', hasWill: true });
            } else {
                actions.push({ label: '🧘 Berehat', health: 10, happiness: 15 });
                actions.push({ label: '👨‍👩‍👧 Masa bersama cucu', happiness: 20 });
                actions.push({ label: '🕌 Amal ' + life.religion, spiritual: 15, happiness: 10 });
            }
            actions.push({ label: '⏭️ Teruskan hidup (1 tahun)', age: 1 });
            return actions;
        }

        function performAction(action) {
            if (!life.alive) return;
            if (action.jail) {
                life.jailYears--;
                addTimeline(`⛓️ Jalani hukuman (${life.jailYears} tahun lagi)`);
                if (life.jailYears <= 0) {
                    life.inJail = false;
                    life.jailYears = 0;
                    addTimeline('🕊️ Dibebaskan dari penjara');
                    toast('Anda dibebaskan!', 'success');
                }
                renderStats();
                generateActions();
                return;
            }
            if (action.age) life.age += 1;
            if (action.health) life.health = clamp(life.health + action.health);
            if (action.happiness) life.happiness = clamp(life.happiness + action.happiness);
            if (action.intelligence) life.intelligence = clamp(life.intelligence + action.intelligence);
            if (action.creativity) life.creativity = clamp(life.creativity + action.creativity);
            if (action.reputation) life.reputation = clamp(life.reputation + action.reputation);
            if (action.mental) life.mental = clamp(life.mental + action.mental);
            if (action.fitness) life.fitness = clamp(life.fitness + action.fitness);
            if (action.spiritual) life.spiritual = clamp(life.spiritual + action.spiritual);
            if (action.money) life.money = Math.max(0, life.money + action.money);
            if (action.debt) life.debt = Math.max(0, life.debt + action.debt);
            if (action.education) { life.education = action.education; addTimeline(`🎓 Pendidikan: ${action.education}`); }
            if (action.job) { life.job = action.job; addTimeline(`💼 Kerja: ${action.job}`); }
            if (action.married) { life.married = true; addTimeline('💍 Berkahwin'); }
            if (action.children) { life.children += 1; addTimeline('👶 Mendapat anak'); }
            if (action.adoptedChildren) { life.adoptedChildren += 1; addTimeline('👶 Anak angkat'); }
            if (action.hasHouse) { life.hasHouse = true; addTimeline('🏠 Membeli rumah'); }
            if (action.hasCar) { life.hasCar = true; addTimeline('🚗 Membeli kereta'); }
            if (action.hasDivorced) { life.hasDivorced = true; life.married = false; addTimeline('💔 Bercerai'); }
            if (action.isInfluencer) { life.isInfluencer = true; life.followers += 10000; addTimeline('📱 Menjadi influencer'); }
            if (action.hasSurgery) { life.hasSurgery = true; addTimeline('🔪 Pembedahan'); }
            if (action.hasLicense) { life.hasLicense = true; addTimeline('🚦 Lesen memandu'); }
            if (action.hasPassport) { life.hasPassport = true; addTimeline('🛂 Pasport dibuat'); }
            if (action.hasWill) { life.hasWill = true; addTimeline('📜 Wasiat ditulis'); }
            if (action.hasPatent) { life.hasPatent = true; addTimeline('💡 Paten didaftarkan'); }
            if (action.stocks) stocks += action.stocks;
            if (action.crypto) crypto += action.crypto;
            if (action.gold) gold += action.gold;
            if (action.property) property += action.property;

            // Inflasi
            life.money = Math.floor(life.money * (1 - life.inflation / 100));

            // Cukai
            if (life.money > 1000) {
                life.money -= Math.floor(life.money * life.taxRate / 100);
            }

            // Jangka hayat dinamik
            life.dynamicLifeExpectancy = Math.floor(life.lifeExpectancy + (life.health - 50) / 5 + (life.fitness - 50) / 10 + (life.mental - 50) / 10);

            // Penyakit
            if (Math.random() < 0.05 && life.age > 5) {
                const eligible = DISEASES.filter(d => d.climate === 'semua' || d.climate === life.climate);
                const disease = eligible[Math.floor(Math.random() * eligible.length)];
                if (life.age >= disease.minAge) {
                    showEvent(`🏥 ${disease.name}! Kesihatan ${disease.impact}`);
                    life.health = clamp(life.health + disease.impact);
                    life.money = Math.max(0, life.money - (life.hasInsurance ? Math.floor(disease.cost / 2) : disease.cost));
                    addTimeline(`🏥 ${disease.name}`);
                    if (disease.name.includes('Kanser')) life.hasCancer = true;
                }
            }

            // Bencana
            if (Math.random() < 0.03) {
                const eligible = DISASTERS.filter(d => d.geo === life.geo || d.geo === 'semua');
                const disaster = eligible[Math.floor(Math.random() * eligible.length)] || DISASTERS[0];
                showEvent(`🌋 ${disaster.name}!`);
                life.health = clamp(life.health + disaster.impact);
                life.money = Math.max(0, life.money - disaster.cost);
                addTimeline(`🌋 ${disaster.name}`);
            }

            // Jenayah
            if (Math.random() < life.crimeRate / 1000 && life.age > 15) {
                const crime = CRIMES[Math.floor(Math.random() * CRIMES.length)];
                if (Math.random() > 0.5) {
                    showEvent(`🚨 Dituduh: ${crime.name}. ${crime.punishment} ${crime.years} tahun`);
                    life.hasCriminalRecord = true;
                    life.inJail = true;
                    life.jailYears = crime.years;
                    life.reputation = clamp(life.reputation - 20);
                    life.money = Math.max(0, life.money - (crime.fine || 0));
                    addTimeline(`🚨 Dipenjara: ${crime.name}`);
                } else {
                    showEvent(`🛡️ Mangsa: ${crime.name}`);
                    life.money = Math.max(0, life.money - (crime.fine || 500));
                    life.happiness = clamp(life.happiness - 10);
                }
            }

            // Skandal
            if (life.isInfluencer && Math.random() < 0.04) {
                showEvent('🎭 Skandal terbongkar!');
                life.reputation = clamp(life.reputation - 30);
                life.followers = Math.floor(life.followers / 2);
                addTimeline('🎭 Skandal');
            }

            // Buli
            if (Math.random() < 0.02 && life.age < 18) {
                showEvent('😢 Dibuli di sekolah');
                life.mental = clamp(life.mental - 15);
                life.happiness = clamp(life.happiness - 10);
            }

            checkAchievements();

            // Kematian
            if (Math.random() < 0.005 && life.age > 15) { die('kemalangan jalan raya'); return; }
            if (life.health <= 0) { die('penyakit'); return; }
            if (life.mental <= 0) { die('bunuh diri'); return; }
            if (life.age >= life.dynamicLifeExpectancy + 10) { die('usia lanjut'); return; }

            renderStats();
            generateActions();
        }

        function clamp(val) { return Math.max(0, Math.min(100, val)); }

        function showEvent(text) {
            const container = $('eventContainer');
            container.innerHTML = `<div class="event-box"><p>${text}</p></div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        function die(reason) {
            life.alive = false;
            addTimeline(`🕊️ Meninggal: ${reason}`);
            $('lifeScreen').style.display = 'none';
            $('deathScreen').style.display = 'block';
            $('deathSummary').textContent = `${life.icon} ${life.name} dari ${life.country} meninggal pada umur ${life.age} tahun kerana ${reason}. Wang: ${life.currency} ${life.money.toLocaleString()} • Bank: ${life.bankAccount.toLocaleString()} • Saham: ${stocks} • Kripto: ${crypto} • Emas: ${gold} • Hartanah: ${property} • Pendidikan: ${life.education} • Anak: ${life.children + life.adoptedChildren}${life.isInfluencer ? ` • Pengikut: ${life.followers}` : ''}`;
            $('achievementSummary').innerHTML = achievements.length ? `<p style="color:var(--gold);font-size:11px;">🏆 ${achievements.length} pencapaian</p>` : '';
            $('timelineSummary').innerHTML = timeline.length ? `<p style="color:var(--cyan);font-size:10px;">📜 ${timeline.length} peristiwa</p>` : '';
            toast('Kehidupan tamat...', 'error');
        }

        function restartLife() {
            $('deathScreen').style.display = 'none';
            $('lifeScreen').style.display = 'none';
            $('startScreen').style.display = 'block';
            $('eventContainer').innerHTML = '';
        }

        initStars();
        initParticles();
    </script>

</body>
</html>
