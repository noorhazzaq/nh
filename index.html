<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Mesh Chat Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Custom Scrollbar Styles */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="h-full text-gray-100 font-sans flex flex-col overflow-hidden antialiased">

  <!-- TOP APP BAR -->
  <header class="h-14 bg-gray-900 border-b border-gray-800 px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-bolt text-lg"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-sm font-bold tracking-tight text-white">StreamMesh Realtime</h1>
          <span id="socketBadge" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="socketStatusText">Connecting...</span>
          </span>
        </div>
        <p class="text-[11px] text-gray-400"><span id="activeCount">1</span> active user connected</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="UI.toggleAdminModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-shield-halved text-amber-400"></i>
        <span id="adminBtnLabel">Admin Unlock</span>
      </button>
      <button onclick="Engine.exportChatLog()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition" title="Export Log">
        <i class="fa-solid fa-download"></i>
        <span class="hidden sm:inline">Export</span>
      </button>
      <button onclick="UI.toggleRoster()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 p-2 rounded-lg text-xs transition md:hidden">
        <i class="fa-solid fa-users"></i>
      </button>
    </div>
  </header>

  <!-- WORKSPACE BODY -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- MAIN CHAT VIEW -->
    <main class="flex-1 flex flex-col bg-gray-950 overflow-hidden relative">
      
      <!-- DYNAMIC TABS -->
      <nav id="tabBar" class="bg-gray-900/60 border-b border-gray-800 px-3 pt-2 flex space-x-1 overflow-x-auto shrink-0">
        <button onclick="Engine.switchTab('global')" id="tab-global" class="px-3.5 py-1.5 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 bg-gray-900 rounded-t-lg flex items-center space-x-2">
          <i class="fa-solid fa-hashtag text-indigo-400"></i>
          <span>global-room</span>
        </button>
      </nav>

      <!-- REALTIME LIVE POLL BANNER -->
      <section id="activePollContainer" class="hidden bg-indigo-950/40 border-b border-indigo-800/40 p-3 shrink-0">
        <div class="max-w-2xl mx-auto space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-indigo-300 flex items-center space-x-2">
              <i class="fa-solid fa-square-poll-vertical"></i>
              <span id="pollQuestion">Active Poll</span>
            </span>
            <span id="pollTotalVotes" class="text-[11px] text-indigo-400 font-mono">0 votes</span>
          </div>
          <div id="pollOptionsList" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>
      </section>

      <!-- MESSAGES VIEWPORT -->
      <div id="messageViewport" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="loadMoreContainer" class="text-center hidden">
          <button onclick="Engine.loadOlderMessages()" class="text-[11px] bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-gray-200 px-3 py-1 rounded-full border border-gray-800 transition">
            Load Older Messages
          </button>
        </div>
        <div id="messagesList" class="space-y-3"></div>
      </div>

      <!-- GIF PICKER POPUP -->
      <div id="gifPicker" class="hidden absolute bottom-20 left-4 bg-gray-900 border border-gray-800 rounded-xl shadow-2xl p-3 w-72 z-30">
        <div class="flex justify-between items-center mb-2">
          <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Search GIFs</span>
          <button onclick="UI.toggleGifPicker()" class="text-gray-400 hover:text-gray-200">&times;</button>
        </div>
        <input type="text" id="gifSearchInput" oninput="Engine.searchGifs(this.value)" placeholder="Search trending GIFs..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-2.5 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500 mb-2">
        <div id="gifResults" class="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto"></div>
      </div>

      <!-- COMPOSER INPUT BAR -->
      <footer class="bg-gray-900 border-t border-gray-800 p-3 shrink-0">
        <form id="chatForm" onsubmit="Engine.handleSendMessage(event)" class="flex flex-col space-y-2">
          <div class="flex items-center space-x-2">
            <button type="button" onclick="UI.toggleGifPicker()" class="p-2 text-gray-400 hover:text-indigo-400 hover:bg-gray-800 rounded-lg transition" title="Send GIF">
              <i class="fa-solid fa-file-image"></i>
            </button>
            <button type="button" id="voiceNoteBtn" onclick="Engine.toggleVoiceRecording()" class="p-2 text-gray-400 hover:text-red-400 hover:bg-gray-800 rounded-lg transition" title="Record Audio">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="messageInput" placeholder="Message #global-room..." class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3.5 py-2 text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
              <span>Send</span>
              <i class="fa-solid fa-paper-plane text-[10px]"></i>
            </button>
          </div>
          <div id="recordingStatus" class="hidden flex items-center space-x-2 text-[11px] text-red-400 font-semibold px-1">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            <span id="recordingTimer">Recording... 0:00</span>
          </div>
        </form>
      </footer>
    </main>

    <!-- ROSTER SIDEBAR -->
    <aside id="rosterSidebar" class="w-60 bg-gray-900 border-l border-gray-800 flex flex-col transition-all duration-300 absolute md:relative right-0 top-0 bottom-0 z-20 translate-x-full md:translate-x-0 shrink-0">
      <div class="p-3 border-b border-gray-800 flex justify-between items-center">
        <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Online Roster</h2>
        <span id="rosterBadge" class="bg-indigo-950 text-indigo-400 border border-indigo-800/50 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="userRosterList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </aside>

  </div>

  <!-- ADMIN / POLL MODAL -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-gray-900 border border-gray-800 rounded-xl shadow-2xl w-full max-w-sm p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center space-x-2">
          <i class="fa-solid fa-shield-halved text-amber-400"></i>
          <span>Admin Control Panel</span>
        </h3>
        <button onclick="UI.toggleAdminModal()" class="text-gray-400 hover:text-white">&times;</button>
      </div>

      <div id="adminAuthSection" class="space-y-3">
        <p class="text-xs text-gray-400">Enter authorization key to unlock administrator privileges for <strong>Zack</strong>.</p>
        <input type="password" id="adminKeyInput" placeholder="Secret Key (zack123)" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-amber-500">
        <button onclick="Engine.authenticateAdmin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded-lg text-xs transition">Verify Access</button>
      </div>

      <div id="adminPanelSection" class="hidden space-y-4">
        <div class="bg-green-950/40 border border-green-800/40 p-2 rounded-lg text-xs text-green-400 flex items-center space-x-2">
          <i class="fa-solid fa-circle-check"></i>
          <span>Authenticated as Administrator</span>
        </div>
        <div class="space-y-2 border-t border-gray-800 pt-3">
          <h4 class="text-xs font-semibold text-gray-200">Broadcast Realtime Poll</h4>
          <input type="text" id="pollQuestionInput" placeholder="Poll Question" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-gray-100 focus:outline-none focus:border-indigo-500">
          <input type="text" id="pollOptionsInput" placeholder="Options (comma separated)" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-gray-100 focus:outline-none focus:border-indigo-500">
          <button onclick="Engine.broadcastPoll()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg text-xs transition">Push Live Poll</button>
        </div>
      </div>
    </div>
  </div>

  <!-- APPLICATION ARCHITECTURE SCRIPT -->
  <script type="module">
    // --- STATE ENGINE ---
    const State = {
      currentUser: localStorage.getItem("mesh_user") || `User_${Math.floor(1000 + Math.random() * 9000)}`,
      isAdmin: false,
      activeTab: "global",
      activeUsers: new Map(),
      messages: { global: [] },
      activePoll: null,
      recording: false,
      recordingTimer: null,
      recordingSecs: 0,
      channel: null,
      ws: null
    };

    localStorage.setItem("mesh_user", State.currentUser);

    // --- REALTIME MESH NETWORK (WebSocket + Multi-Tab Fallback) ---
    class RealtimeNetwork {
      constructor() {
        this.broadcast = new BroadcastChannel("mesh_realtime_network");
        this.broadcast.onmessage = (e) => this.handleIncomingEvent(e.data);
        
        // Attempt Realtime WebSocket Sync, gracefully fall back to BroadcastChannel
        try {
          this.ws = new WebSocket("wss://echo.websocket.org");
          this.ws.onopen = () => {
            UI.setSocketStatus(true, "Connected");
            this.sendPresence();
          };
          this.ws.onerror = () => UI.setSocketStatus(false, "Local Mesh Mode");
          this.ws.onclose = () => UI.setSocketStatus(false, "Local Mesh Mode");
        } catch {
          UI.setSocketStatus(false, "Local Mesh Mode");
        }

        // Heartbeat Presence
        setInterval(() => this.sendPresence(), 5000);
        setTimeout(() => this.sendPresence(), 200);
      }

      send(type, payload) {
        const packet = { type, payload, sender: State.currentUser, timestamp: Date.now() };
        this.broadcast.postMessage(packet);
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify(packet));
        }
        // Self process locally
        this.handleIncomingEvent(packet, true);
      }

      sendPresence() {
        this.send("PRESENCE", { name: State.currentUser, isAdmin: State.isAdmin });
      }

      handleIncomingEvent(packet, isSelf = false) {
        const { type, payload, sender } = packet;

        switch (type) {
          case "PRESENCE":
            State.activeUsers.set(sender, { name: sender, isAdmin: payload.isAdmin, lastSeen: Date.now() });
            Engine.purgeStaleUsers();
            UI.renderRoster();
            break;

          case "MESSAGE":
            if (isSelf && packet.processedLocally) return;
            packet.processedLocally = true;

            const targetRoom = payload.target === "global" ? "global" : (sender === State.currentUser ? payload.target : sender);
            if (!State.messages[targetRoom]) State.messages[targetRoom] = [];
            
            // Deduplicate by message ID
            if (!State.messages[targetRoom].some(m => m.id === payload.id)) {
              State.messages[targetRoom].push(payload);
              if (State.activeTab === targetRoom) UI.renderMessages();
            }
            break;

          case "POLL_CREATE":
            State.activePoll = payload;
            UI.renderPoll();
            break;

          case "POLL_VOTE":
            if (State.activePoll && State.activePoll.id === payload.pollId) {
              const option = State.activePoll.options.find(o => o.id === payload.optionId);
              if (option && !State.activePoll.votedUsers.includes(sender)) {
                option.votes++;
                State.activePoll.totalVotes++;
                State.activePoll.votedUsers.push(sender);
                UI.renderPoll();
              }
            }
            break;
        }
      }
    }

    // --- APPLICATION ENGINE ---
    window.Engine = {
      network: null,

      init() {
        this.network = new RealtimeNetwork();
        UI.renderRoster();
        UI.renderMessages();
      },

      purgeStaleUsers() {
        const now = Date.now();
        State.activeUsers.forEach((user, key) => {
          if (now - user.lastSeen > 12000 && key !== State.currentUser) {
            State.activeUsers.delete(key);
          }
        });
      },

      switchTab(tabKey) {
        State.activeTab = tabKey;
        UI.updateTabUI(tabKey);
        UI.renderMessages();
      },

      openDirectMessage(targetUser) {
        if (targetUser === State.currentUser) return;
        if (!State.messages[targetUser]) State.messages[targetUser] = [];
        UI.ensureTabExists(targetUser);
        this.switchTab(targetUser);
      },

      handleSendMessage(e) {
        e.preventDefault();
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text) return;

        const messagePacket = {
          id: `msg_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
          sender: State.currentUser,
          target: State.activeTab,
          text: Engine.sanitizeAndFilter(text),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          type: "text"
        };

        this.network.send("MESSAGE", messagePacket);
        input.value = "";
      },

      sanitizeAndFilter(text) {
        // Profanity Masking Engine
        const banned = ["badword1", "spam", "phishing"];
        let cleaned = text;
        banned.forEach(word => {
          const regex = new RegExp(`\\b${word}\\b`, 'gi');
          cleaned = cleaned.replace(regex, "****");
        });
        return cleaned;
      },

      toggleVoiceRecording() {
        const btn = document.getElementById("voiceNoteBtn");
        const status = document.getElementById("recordingStatus");
        const timer = document.getElementById("recordingTimer");

        if (!State.recording) {
          State.recording = true;
          State.recordingSecs = 0;
          btn.classList.add("text-red-500", "animate-pulse");
          status.classList.remove("hidden");
          State.recordingTimer = setInterval(() => {
            State.recordingSecs++;
            const m = Math.floor(State.recordingSecs / 60);
            const s = State.recordingSecs % 60;
            timer.innerText = `Recording... ${m}:${s < 10 ? '0' : ''}${s}`;
          }, 1000);
        } else {
          State.recording = false;
          clearInterval(State.recordingTimer);
          btn.classList.remove("text-red-500", "animate-pulse");
          status.classList.add("hidden");

          const audioPacket = {
            id: `vmsg_${Date.now()}`,
            sender: State.currentUser,
            target: State.activeTab,
            duration: `${Math.floor(State.recordingSecs / 60)}:${State.recordingSecs % 60 < 10 ? '0' : ''}${State.recordingSecs % 60}`,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            type: "voice"
          };
          this.network.send("MESSAGE", audioPacket);
        }
      },

      searchGifs(query) {
        const container = document.getElementById("gifResults");
        const mockGifs = [
          "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3E1cHBvYzh5dThyc3dtNDRzbTh6a3YxczN5MndocXU3cmc3M3hhZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0HlA3L9Myd93N2X6/giphy.gif",
          "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnAzaDVtdnF6eXJvODRhcnAxdmVrbXlyYm1xZW10cjAwbzh0OHU3OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26ufdipQqU2lhNA4g/giphy.gif"
        ];
        container.innerHTML = mockGifs.map(url => `
          <img src="${url}" onclick="Engine.sendGif('${url}')" class="rounded h-16 w-full object-cover cursor-pointer hover:opacity-80 transition border border-gray-800" />
        `).join('');
      },

      sendGif(url) {
        this.network.send("MESSAGE", {
          id: `gif_${Date.now()}`,
          sender: State.currentUser,
          target: State.activeTab,
          text: url,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          type: "gif"
        });
        UI.toggleGifPicker();
      },

      authenticateAdmin() {
        const key = document.getElementById("adminKeyInput").value;
        if (key === "zack123") {
          State.isAdmin = true;
          State.currentUser = "Zack";
          localStorage.setItem("mesh_user", "Zack");
          document.getElementById("adminAuthSection").classList.add("hidden");
          document.getElementById("adminPanelSection").classList.remove("hidden");
          document.getElementById("adminBtnLabel").innerText = "Admin: Zack";
          this.network.sendPresence();
        } else {
          alert("Invalid Authorization Key");
        }
      },

      broadcastPoll() {
        const question = document.getElementById("pollQuestionInput").value.trim();
        const optionsRaw = document.getElementById("pollOptionsInput").value.trim();
        if (!question || !optionsRaw) return;

        const payload = {
          id: `poll_${Date.now()}`,
          question,
          options: optionsRaw.split(",").map((opt, i) => ({ id: i, text: opt.trim(), votes: 0 })),
          totalVotes: 0,
          votedUsers: []
        };

        this.network.send("POLL_CREATE", payload);
        UI.toggleAdminModal();
      },

      votePoll(optionId) {
        if (!State.activePoll) return;
        this.network.send("POLL_VOTE", { pollId: State.activePoll.id, optionId });
      },

      exportChatLog() {
        const blob = new Blob([JSON.stringify(State.messages, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `chat_log_${Date.now()}.json`;
        a.click();
      }
    };

    // --- USER INTERFACE RENDERER ---
    window.UI = {
      setSocketStatus(isLive, text) {
        const badge = document.getElementById("socketBadge");
        document.getElementById("socketStatusText").innerText = text;
        if (isLive) {
          badge.className = "bg-green-500/10 text-green-400 border border-green-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1";
        } else {
          badge.className = "bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1";
        }
      },

      renderRoster() {
        const list = document.getElementById("userRosterList");
        const users = Array.from(State.activeUsers.values());
        document.getElementById("rosterBadge").innerText = users.length;
        document.getElementById("activeCount").innerText = users.length;

        list.innerHTML = users.map(u => `
          <div onclick="Engine.openDirectMessage('${u.name}')" class="flex items-center justify-between p-1.5 rounded-lg hover:bg-gray-800/80 cursor-pointer transition">
            <div class="flex items-center space-x-2">
              <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center font-bold text-[10px] text-white">
                ${u.name.substring(0,2).toUpperCase()}
              </div>
              <span class="text-xs ${u.name === State.currentUser ? 'font-bold text-indigo-400' : 'text-gray-300'}">${u.name}</span>
            </div>
            ${u.isAdmin ? `<span class="text-[9px] bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 rounded">Admin</span>` : ''}
          </div>
        `).join('');
      },

      renderMessages() {
        const list = document.getElementById("messagesList");
        const msgs = State.messages[State.activeTab] || [];

        list.innerHTML = msgs.map(m => {
          const isSelf = m.sender === State.currentUser;
          return `
            <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
              <div class="flex items-baseline space-x-1.5 mb-0.5">
                <span class="text-[11px] font-semibold text-gray-400">${m.sender}</span>
                <span class="text-[9px] text-gray-600">${m.time}</span>
              </div>
              <div class="max-w-xs sm:max-w-md ${isSelf ? 'bg-indigo-600 text-white rounded-l-xl rounded-tr-xl' : 'bg-gray-900 text-gray-100 rounded-r-xl rounded-tl-xl border border-gray-800'} p-2.5 text-xs shadow-sm">
                ${this.formatContent(m)}
              </div>
            </div>
          `;
        }).join('');

        const vp = document.getElementById("messageViewport");
        vp.scrollTop = vp.scrollHeight;
      },

      formatContent(m) {
        if (m.type === "voice") {
          return `
            <div class="flex items-center space-x-2 py-0.5">
              <i class="fa-solid fa-play text-xs opacity-80"></i>
              <div class="h-1.5 bg-gray-950/40 rounded-full w-24"></div>
              <span class="text-[9px] font-mono opacity-75">${m.duration}</span>
            </div>
          `;
        }
        if (m.type === "gif") {
          return `<img src="${m.text}" class="rounded max-h-40 w-auto object-cover" />`;
        }

        // Markdown & YouTube Auto Parser
        let parsed = m.text
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`(.*?)`/g, '<code class="bg-gray-950 px-1 py-0.5 rounded text-amber-300">$1</code>');

        const ytMatch = parsed.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytMatch) {
          parsed += `
            <div class="mt-2 rounded overflow-hidden aspect-video border border-gray-800">
              <iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allowfullscreen></iframe>
            </div>
          `;
        }
        return parsed;
      },

      renderPoll() {
        const container = document.getElementById("activePollContainer");
        if (!State.activePoll) return container.classList.add("hidden");

        container.classList.remove("hidden");
        document.getElementById("pollQuestion").innerText = State.activePoll.question;
        document.getElementById("pollTotalVotes").innerText = `${State.activePoll.totalVotes} votes`;

        const optionsList = document.getElementById("pollOptionsList");
        optionsList.innerHTML = State.activePoll.options.map(opt => {
          const pct = State.activePoll.totalVotes > 0 ? Math.round((opt.votes / State.activePoll.totalVotes) * 100) : 0;
          return `
            <button onclick="Engine.votePoll(${opt.id})" class="relative bg-gray-950 border border-indigo-900/50 rounded-lg p-2 text-left hover:border-indigo-500 transition overflow-hidden">
              <div class="absolute inset-0 bg-indigo-600/20" style="width: ${pct}%"></div>
              <div class="relative flex justify-between text-xs text-gray-200 font-medium">
                <span>${opt.text}</span>
                <span class="text-indigo-400 font-mono">${pct}%</span>
              </div>
            </button>
          `;
        }).join('');
      },

      ensureTabExists(key) {
        if (!document.getElementById(`tab-${key}`)) {
          const nav = document.getElementById("tabBar");
          const btn = document.createElement("button");
          btn.id = `tab-${key}`;
          btn.onclick = () => Engine.switchTab(key);
          btn.className = "px-3 py-1.5 text-xs font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 bg-gray-900/40 rounded-t-lg flex items-center space-x-1.5";
          btn.innerHTML = `<i class="fa-solid fa-user text-xs"></i><span>@${key}</span>`;
          nav.appendChild(btn);
        }
      },

      updateTabUI(tabKey) {
        document.querySelectorAll("#tabBar button").forEach(b => {
          b.className = "px-3 py-1.5 text-xs font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 bg-gray-900/40 rounded-t-lg flex items-center space-x-1.5";
        });
        const active = document.getElementById(`tab-${tabKey}`);
        if (active) {
          active.className = "px-3.5 py-1.5 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 bg-gray-900 rounded-t-lg flex items-center space-x-1.5";
        }
        document.getElementById("messageInput").placeholder = tabKey === "global" ? "Message #global-room..." : `Direct message @${tabKey}...`;
      },

      toggleRoster() {
        document.getElementById("rosterSidebar").classList.toggle("translate-x-full");
      },

      toggleAdminModal() {
        document.getElementById("adminModal").classList.toggle("hidden");
      },

      toggleGifPicker() {
        const picker = document.getElementById("gifPicker");
        picker.classList.toggle("hidden");
        if (!picker.classList.contains("hidden")) Engine.searchGifs("");
      }
    };

    // Initialize application on startup
    window.addEventListener("DOMContentLoaded", () => Engine.init());
  </script>
</body>
</html>
