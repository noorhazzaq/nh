<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Real Lives</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0a1a;color:#eee;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
#app{width:100%;max-width:480px;min-height:100vh;background:#16213e;padding:12px;position:relative;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:2px solid #0f3460;margin-bottom:10px}
.header h1{font-size:18px;font-weight:700;color:#e94560;letter-spacing:1px}
.header .age{font-size:16px;background:#0f3460;padding:4px 12px;border-radius:20px;color:#fff}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.stat-card{background:#1a1a40;padding:6px 10px;border-radius:6px;border-left:3px solid #e94560}
.stat-card .top{display:flex;justify-content:space-between;align-items:center}
.stat-card .label{font-size:11px;color:#aaa;text-transform:uppercase;font-weight:600}
.stat-card .value{font-size:14px;font-weight:700;color:#fff}
.stat-bar{height:3px;background:#2a2a4a;border-radius:2px;margin-top:3px;overflow:hidden}
.stat-bar .fill{height:100%;border-radius:2px;transition:width .3s}
.fill-health{background:#e94560}
.fill-happiness{background:#f5a623}
.fill-intelligence{background:#4ecdc4}
.fill-wealth{background:#ffd93d}
.fill-fitness{background:#6bcb77}
.fill-social{background:#a29bfe}
.fill-career{background:#fd79a8}
.fill-spirit{background:#fdcb6e}
.event-area{background:#0f3460;border-radius:10px;padding:12px;min-height:100px;margin-bottom:10px;display:flex;flex-direction:column;justify-content:center}
.event-area .event-title{font-size:15px;font-weight:700;color:#e94560;margin-bottom:4px}
.event-area .event-desc{font-size:13px;color:#ccc;line-height:1.4;margin-bottom:8px}
.event-area .event-choice{display:flex;gap:6px;flex-wrap:wrap}
.event-area .event-choice button{flex:1;min-width:70px;background:#1a1a40;border:1px solid #2a2a5a;color:#fff;padding:8px 4px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.event-area .event-choice button:active{transform:scale(.95);background:#2a2a5a}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.action-btn{background:#0f3460;border:none;color:#fff;padding:8px 0;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.action-btn:active{transform:scale(.94);background:#1a4a7a}
.action-btn .icon{font-size:18px;display:block;margin-bottom:1px}
.log-area{background:#0a0a1a;border-radius:6px;padding:6px 8px;max-height:120px;overflow-y:auto;flex:1;min-height:70px;font-size:11px;color:#888;border:1px solid #1a1a3a}
.log-area .log-entry{padding:2px 0;border-bottom:1px solid #111;color:#bbb}
.log-area .log-entry .year{color:#e94560;font-weight:700;margin-right:5px}
.footer{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #1a1a3a}
.footer button{flex:1;background:#0f3460;border:none;color:#fff;padding:7px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer}
.footer button:active{transform:scale(.95)}
.footer .save-btn{background:#1a6a3a}
.footer .load-btn{background:#6a3a1a}
.footer .reset-btn{background:#6a1a2a}
.dead-overlay{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;border-radius:10px;padding:20px;text-align:center}
.dead-overlay.show{display:flex}
.dead-overlay h2{font-size:28px;color:#e94560;margin-bottom:8px}
.dead-overlay p{font-size:14px;color:#ccc;margin-bottom:14px;line-height:1.5}
.dead-overlay .stats-final{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:280px;margin-bottom:14px}
.dead-overlay .stats-final div{background:#1a1a40;padding:5px 8px;border-radius:4px;display:flex;justify-content:space-between;font-size:12px}
.dead-overlay .restart-btn{background:#e94560;border:none;color:#fff;padding:12px 32px;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#0a0a1a}
::-webkit-scrollbar-thumb{background:#2a2a5a;border-radius:2px}
@media(max-width:360px){#app{padding:8px}.stat-card{padding:4px 6px}.stat-card .label{font-size:9px}.stat-card .value{font-size:12px}.action-btn{font-size:9px;padding:6px 0}.action-btn .icon{font-size:15px}}
@media(min-width:481px){#app{max-width:600px;border-radius:14px;margin:10px;min-height:auto}}
</style>
</head>
<body>
<div id="app">
<div class="header"><h1>REAL LIVES</h1><span class="age" id="ageDisplay">Age: 0</span></div>
<div class="stats-grid" id="statsGrid"></div>
<div class="event-area" id="eventArea"><div class="event-title">Welcome</div><div class="event-desc">Your life begins. Make choices wisely.</div><div class="event-choice"><button id="beginBtn">Begin</button></div></div>
<div class="action-grid">
<button class="action-btn" data-action="work"><span class="icon">💼</span>Work</button>
<button class="action-btn" data-action="study"><span class="icon">📚</span>Study</button>
<button class="action-btn" data-action="social"><span class="icon">🤝</span>Social</button>
<button class="action-btn" data-action="exercise"><span class="icon">🏃</span>Exercise</button>
<button class="action-btn" data-action="rest"><span class="icon">😴</span>Rest</button>
<button class="action-btn" data-action="invest"><span class="icon">💰</span>Invest</button>
<button class="action-btn" data-action="family"><span class="icon">👨‍👩‍👦</span>Family</button>
<button class="action-btn" data-action="next"><span class="icon">⏭️</span>Next</button>
</div>
<div class="log-area" id="logArea"><div class="log-entry"><span class="year">[0]</span>Welcome to Real Lives.</div></div>
<div class="footer"><button class="save-btn" id="saveBtn">💾 Save</button><button class="load-btn" id="loadBtn">📂 Load</button><button class="reset-btn" id="resetBtn">🔄 Reset</button></div>
<div class="dead-overlay" id="deadOverlay"><h2>💀 GAME OVER</h2><p id="deathMessage">Your life has ended.</p><div class="stats-final" id="finalStats"></div><button class="restart-btn" id="restartBtn">🔄 New Life</button></div>
</div>
<script>
(function(){
const FIREBASE_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
let S=null;
const STATS=['health','happiness','intelligence','wealth','fitness','social','career','spirit'];
const LABELS={health:'❤️ Health',happiness:'😊 Happy',intelligence:'🧠 Intel',wealth:'💰 Wealth',fitness:'💪 Fitness',social:'👥 Social',career:'📈 Career',spirit:'✨ Spirit'};
const EVENTS=[
{min:0,max:5,title:'Childhood',desc:'You learn and grow.',eff:{health:2,happiness:3,intelligence:2,social:1},opts:['Grow up']},
{min:6,max:12,title:'School',desc:'Elementary school years.',eff:{intelligence:4,social:3,happiness:2},opts:['Make friends','Study hard','Play sports']},
{min:13,max:17,title:'Teen',desc:'High school challenges.',eff:{social:3,intelligence:3,fitness:2},opts:['Focus grades','Join clubs','Part-time job']},
{min:18,max:22,title:'College',desc:'Higher education.',eff:{intelligence:5,social:3,career:4},opts:['STEM','Arts','Business']},
{min:23,max:30,title:'Career',desc:'Building professional life.',eff:{career:5,wealth:4,social:2},opts:['Climb corporate','Start business','Work abroad']},
{min:31,max:45,title:'Midlife',desc:'Family and career peak.',eff:{career:4,wealth:5,health:-2,happiness:3},opts:['Focus family','Focus career','Balance']},
{min:46,max:60,title:'Late Career',desc:'Experience and wisdom.',eff:{career:3,wealth:4,intelligence:3,health:-3},opts:['Mentor','Semi-retire','Change career']},
{min:61,max:75,title:'Retirement',desc:'Golden years.',eff:{happiness:4,social:3,health:-4,wealth:-2},opts:['Travel','Volunteer','Hobbies']},
{min:76,max:100,title:'Elder',desc:'Reflection and legacy.',eff:{health:-6,social:2,happiness:2,intelligence:2},opts:['Write memoir','Teach youth','Rest']}
];
const RANDOMS=[
{title:'Windfall',desc:'Unexpected inheritance.',eff:{wealth:8},prob:.3},
{title:'Accident',desc:'Minor accident.',eff:{health:-4,fitness:-3},prob:.25},
{title:'Romance',desc:'Met someone special.',eff:{happiness:6,social:5},prob:.2},
{title:'Illness',desc:'Seasonal illness.',eff:{health:-5,fitness:-3},prob:.3},
{title:'Promotion',desc:'Job promotion!',eff:{career:5,wealth:6,happiness:4},prob:.15},
{title:'Friendship',desc:'Made a friend.',eff:{social:5,happiness:4},prob:.25},
{title:'Loss',desc:'Personal loss.',eff:{happiness:-6,social:-3,spirit:2},prob:.15},
{title:'Discovery',desc:'Found new passion.',eff:{happiness:5,intelligence:3,spirit:4},prob:.2},
{title:'Gain',desc:'Investments paid off.',eff:{wealth:7},prob:.1},
{title:'Setback',desc:'Financial setback.',eff:{wealth:-5,happiness:-3},prob:.15}
];
function initState(){return{age:0,health:50,happiness:50,intelligence:40,wealth:30,fitness:50,social:40,career:20,spirit:30,alive:true,partner:false,children:0,log:[],waiting:false}}
function clamp(v,a,b){return Math.min(Math.max(v,a),b)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function get(S,k){return S[k]||0}
function set(S,k,v){S[k]=clamp(Math.round(v),0,100)}
function mod(S,k,d){set(S,k,get(S,k)+d)}
function ageGroup(a){if(a<=5)return 0;if(a<=12)return 1;if(a<=17)return 2;if(a<=22)return 3;if(a<=30)return 4;if(a<=45)return 5;if(a<=60)return 6;if(a<=75)return 7;return 8}
function renderStats(){const g=document.getElementById('statsGrid');g.innerHTML='';STATS.forEach(k=>{const v=get(S,k);const p=Math.round(v);const c='fill-'+k;const d=document.createElement('div');d.className='stat-card';d.innerHTML='<div class="top"><span class="label">'+LABELS[k]+'</span><span class="value">'+p+'%</span></div><div class="stat-bar"><div class="fill '+c+'" style="width:'+p+'%"></div></div>';g.appendChild(d)});document.getElementById('ageDisplay').textContent='Age: '+S.age}
function renderLog(){const g=document.getElementById('logArea');g.innerHTML='';const e=S.log.slice(-12);e.forEach(t=>{const d=document.createElement('div');d.className='log-entry';d.innerHTML='<span class="year">['+t.y+']</span>'+t.t;g.appendChild(d)});g.scrollTop=g.scrollHeight}
function renderEvent(title,desc,opts,cb){const g=document.getElementById('eventArea');g.innerHTML='<div class="event-title">'+title+'</div><div class="event-desc">'+desc+'</div>';const c=document.createElement('div');c.className='event-choice';(opts||['Continue']).forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.dataset.idx=i;b.onclick=function(e){e.stopPropagation();if(S.waiting)return;cb(parseInt(this.dataset.idx))};c.appendChild(b)});g.appendChild(c)}
function addLog(t){S.log.push({y:S.age,t:t});if(S.log.length>40)S.log.shift();renderLog()}
function applyAging(){const a=S.age;if(a>70){mod(S,'health',-3);mod(S,'fitness',-2)}else if(a>50){mod(S,'health',-2);mod(S,'fitness',-1)}else if(a>30){mod(S,'health',-1)}if(a>18&&!S.partner&&Math.random()<.05){S.partner=true;addLog('💕 Found partner!')}if(a>25&&S.children<3&&S.partner&&Math.random()<.03){S.children++;addLog('👶 Had child!')}if(a>80&&Math.random()<.12){S.alive=false;addLog('💀 Passed at '+S.age)}if(get(S,'health')<=0||get(S,'happiness')<=0){S.alive=false;addLog('💀 Health or happiness zero')}if(a>110){S.alive=false;addLog('💀 Natural end')}}
function randomEvent(){if(Math.random()<.25&&S.age>5){const e=pick(RANDOMS);if(Math.random()<e.prob){Object.keys(e.eff).forEach(k=>mod(S,k,e.eff[k]));addLog('⚡ '+e.title+': '+e.desc);return true}}return false}
function processEvent(){const g=ageGroup(S.age);const e=EVENTS[g];if(e&&S.age%2===0){const opts=e.opts||['Continue'];renderEvent(e.title,e.desc,opts,function(idx){if(S.waiting)return;S.waiting=true;Object.keys(e.eff||{}).forEach(k=>mod(S,k,e.eff[k]));if(opts.length>1){addLog('Chose: '+opts[idx]);if(idx===0)mod(S,'intelligence',2);else if(idx===1)mod(S,'social',2);else if(idx===2)mod(S,'wealth',2)}else{addLog(e.title+' - '+e.desc)}S.age++;applyAging();randomEvent();renderStats();S.waiting=false;if(!S.alive){showDeath();return}renderEvent('Year '+S.age,'Another year passes. Choose action.',['Continue'],function(){S.waiting=false})});return true}return false}
function doAction(a){if(!S.alive||S.waiting)return;S.waiting=true;let msg='';switch(a){case'work':if(S.age<16){msg='Too young.';S.waiting=false;break}const e=5+Math.floor(get(S,'career')/10);mod(S,'wealth',e);mod(S,'career',2);mod(S,'happiness',-1);mod(S,'fitness',-2);msg='Worked +$'+e+'k.';if(Math.random()<.1){mod(S,'wealth',3);msg+=' Bonus!'}break;case'study':if(S.age<6){msg='Too young.';S.waiting=false;break}mod(S,'intelligence',4);mod(S,'career',2);mod(S,'happiness',-1);mod(S,'social',-1);msg='Studied.';if(Math.random()<.05){mod(S,'intelligence',5);msg='Studied hard! Breakthrough.'}break;case'social':mod(S,'social',5);mod(S,'happiness',4);mod(S,'health',1);msg='Socialized.';if(Math.random()<.1){mod(S,'social',3);msg='Made great friend!'}break;case'exercise':mod(S,'fitness',6);mod(S,'health',4);mod(S,'happiness',2);msg='Exercised.';if(Math.random()<.05){mod(S,'fitness',5);msg='Personal best!'}break;case'rest':mod(S,'health',5);mod(S,'happiness',3);mod(S,'fitness',2);msg='Rested.';break;case'invest':if(get(S,'wealth')<10){msg='Need $10k.';S.waiting=false;break}const r=Math.random();if(r<.4){const g=Math.floor(get(S,'wealth')*.15);mod(S,'wealth',g);msg='Invest +$'+g+'k.'}else if(r<.7){const l=Math.floor(get(S,'wealth')*.08);mod(S,'wealth',-l);msg='Invest -$'+l+'k.'}else{const b=Math.floor(get(S,'wealth')*.3);mod(S,'wealth',b);msg='Invest +$'+b+'k!'}break;case'family':if(S.partner){mod(S,'happiness',4);mod(S,'social',3);if(S.children>0){mod(S,'happiness',2);msg='Family time.'}else msg='Time with partner.'}else{mod(S,'social',2);mod(S,'happiness',1);msg='Contacted relatives.'}break;case'next':S.age++;applyAging();randomEvent();renderStats();S.waiting=false;if(!S.alive){showDeath();return}if(!processEvent()){renderEvent('Year '+S.age,'Choose your action.',['Continue'],function(){S.waiting=false})}return}if(msg){addLog('▶ '+msg)}renderStats();S.waiting=false;if(S.alive){if(!processEvent()){renderEvent('Year '+S.age,'Choose your action.',['Continue'],function(){S.waiting=false})}}else{showDeath()}}
function showDeath(){const o=document.getElementById('deadOverlay');o.className='dead-overlay show';document.getElementById('deathMessage').textContent='Lived to '+S.age+' years.';const f=document.getElementById('finalStats');f.innerHTML='';STATS.forEach(k=>{const d=document.createElement('div');d.innerHTML='<span>'+LABELS[k]+'</span><span>'+Math.round(get(S,k))+'%</span>';f.appendChild(d)});addLog('🏁 Life completed at '+S.age)}
function resetGame(){if(!confirm('Start new life?'))return;S=initState();document.getElementById('deadOverlay').className='dead-overlay';renderStats();addLog('New life started.');renderEvent('Welcome','Begin your journey.',['Start'],function(){S.age=1;addLog('Life begins.');renderStats();renderEvent('Year 1','Choose action.',['Continue'],function(){S.waiting=false})})}
function saveGame(){if(!S||!S.alive){alert('No active life.');return}try{const d=JSON.stringify(S);fetch(FIREBASE_URL+'/save.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:d}).then(r=>r.json()).then(()=>{addLog('💾 Saved.');alert('Saved!')}).catch(()=>alert('Save failed.'))}catch(e){alert('Error: '+e.message)}}
function loadGame(){fetch(FIREBASE_URL+'/save.json').then(r=>{if(!r.ok)throw new Error('No save');return r.json()}).then(d=>{if(!d||!d.age){alert('No valid save.');return}S=d;document.getElementById('deadOverlay').className='dead-overlay';renderStats();addLog('📂 Loaded.');if(!S.alive){showDeath()}else{renderEvent('Loaded','Continue journey.',['Continue'],function(){S.waiting=false})}}).catch(()=>alert('No save found.'))}
function init(){S=initState();renderStats();addLog('Welcome to Real Lives.');document.getElementById('beginBtn').onclick=function(){S.age=1;addLog('Life begins.');renderStats();renderEvent('Year 1','Choose your first action.',['Continue'],function(){S.waiting=false})};document.querySelectorAll('.action-btn').forEach(b=>{b.onclick=function(){doAction(this.dataset.action)}});document.getElementById('saveBtn').onclick=saveGame;document.getElementById('loadBtn').onclick=loadGame;document.getElementById('resetBtn').onclick=resetGame;document.getElementById('restartBtn').onclick=resetGame}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
})();
</script>
</body>
</html>
