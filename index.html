<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZACK Lives 8.0 - Realism Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid #334155; }
    h1 { font-size: 1.25rem; color: var(--accent); text-align: center; margin-bottom: 4px; }
    .status-badge { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .stat-item { background: #0f172a; padding: 10px; border-radius: 8px; font-size: 0.85rem; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-top: 2px; }
    .btn { background: var(--accent); color: #0f172a; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 1rem; cursor: pointer; touch-action: manipulation; }
    .btn:active { opacity: 0.8; }
    .btn-danger { background: var(--danger); color: #fff; }
    .log-box { background: #0f172a; border-radius: 8px; padding: 10px; height: 160px; overflow-y: auto; font-size: 0.8rem; display: flex; flex-direction: column; gap: 6px; }
    .log-entry { border-bottom: 1px solid #1e293b; padding-bottom: 4px; color: var(--muted); }
    .log-entry strong { color: var(--text); }
    .sync-indicator { font-size: 0.75rem; text-align: right; color: var(--success); margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>ZACK Lives 8.0</h1>
    <div class="status-badge" id="statusBadge">Connecting to Cloud...</div>
  </div>

  <div class="card">
    <div class="stat-grid">
      <div class="stat-item">Nama<div class="stat-val" id="dispName">-</div></div>
      <div class="stat-item">Umur<div class="stat-val" id="dispAge">0</div></div>
      <div class="stat-item">Wang Simpanan<div class="stat-val" id="dispBank">RM 0</div></div>
      <div class="stat-item">Gaji Bulanan<div class="stat-val" id="dispSalary">RM 0</div></div>
    </div>
    <div style="margin-top: 10px; font-size: 0.85rem; color: var(--muted);" id="familyText">Status: Bujang</div>
    <div class="sync-indicator" id="syncStatus">Local Mode</div>
  </div>

  <div class="card">
    <button class="btn" id="btnAdvance">Maju 1 Tahun (+1 Year)</button>
  </div>

  <div class="card">
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const SAVE_KEY = "ZACK_LIFE_SAVE_V8";
  const USER_ID_KEY = "ZACK_USER_ID";
  
  // Custom Realtime Database Configuration
  const firebaseConfig = {
    databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  let db = null;
  let userId = localStorage.getItem(USER_ID_KEY);
  
  if (!userId) {
    userId = "user_" + Math.random().toString(36).substring(2, 9);
    localStorage.setItem(USER_ID_KEY, userId);
  }

  const $ = (id) => document.getElementById(id);

  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    $('statusBadge').textContent = `Cloud Sync Active (ID: ${userId})`;
  } catch(e) {
    $('statusBadge').textContent = "Offline Mode (Local Storage Only)";
  }

  const initialLifeState = {
    name: "Zack",
    age: 18,
    bank: 1000,
    monthlySalary: 1500,
    married: false,
    spouseName: "",
    children: 0,
    alive: true,
    lastUpdated: Date.now()
  };

  let life = { ...initialLifeState };

  function calculateTax(annualGross) {
    if (annualGross <= 5000) return 0;
    if (annualGross <= 20000) return (annualGross - 5000) * 0.01;
    if (annualGross <= 35000) return 150 + (annualGross - 20000) * 0.03;
    if (annualGross <= 50000) return 600 + (annualGross - 35000) * 0.08;
    return 1800 + (annualGross - 50000) * 0.14;
  }

  function logMessage(msg) {
    const box = $('logBox');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<strong>Tahun ${life.age}:</strong> ${msg}`;
    box.prepend(entry);
  }

  function renderStats() {
    $('dispName').textContent = life.name;
    $('dispAge').textContent = life.age;
    $('dispBank').textContent = `RM ${Math.round(life.bank).toLocaleString()}`;
    $('dispSalary').textContent = `RM ${Math.round(life.monthlySalary).toLocaleString()}`;
    $('familyText').textContent = `Status: ${life.married ? 'Berkahwin dengan ' + life.spouseName : 'Bujang'} • Anak: ${life.children}`;
    
    if(!life.alive) {
      $('btnAdvance').textContent = "Mula Semula (Restart)";
      $('btnAdvance').className = "btn btn-danger";
    } else {
      $('btnAdvance').textContent = "Maju 1 Tahun (+1 Year)";
      $('btnAdvance').className = "btn";
    }
  }

  async function syncState() {
    life.lastUpdated = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(life));
    
    if (db) {
      $('syncStatus').textContent = "Syncing...";
      try {
        await set(ref(db, `players/${userId}`), life);
        $('syncStatus').textContent = "Cloud Synced ✓";
      } catch (e) {
        $('syncStatus').textContent = "Saved Locally (Sync Error)";
      }
    }
  }

  async function loadState() {
    const localSaved = localStorage.getItem(SAVE_KEY);
    if (localSaved) {
      try { life = JSON.parse(localSaved); } catch(e) { life = { ...initialLifeState }; }
    }

    if (db) {
      try {
        const snapshot = await get(ref(db, `players/${userId}`));
        if (snapshot.exists()) {
          const cloudLife = snapshot.val();
          if (!life.lastUpdated || cloudLife.lastUpdated > life.lastUpdated) {
            life = cloudLife;
            localStorage.setItem(SAVE_KEY, JSON.stringify(life));
            logMessage("Data disegerakkan daripada cloud.");
          }
        }
      } catch(e) {
        console.log("Could not load from Firebase, falling back to local data.");
      }
    }
    renderStats();
  }

  function advanceYear() {
    if(!life.alive) {
      life = { ...initialLifeState };
      $('logBox').innerHTML = '';
      logMessage("Kehidupan baru bermula.");
      syncState();
      renderStats();
      return;
    }

    life.age += 1;

    // Financial Computations
    const annualGrossSalary = life.monthlySalary * 12;
    const annualTax = calculateTax(annualGrossSalary);
    const annualExpenses = (life.married ? 18000 : 10000) + (life.children * 4000);
    const netSavings = annualGrossSalary - annualTax - annualExpenses;

    life.bank += netSavings;

    // Career & Inflation Progression
    if (Math.random() < 0.3) {
      life.monthlySalary *= 1.05;
      logMessage("Menerima kenaikan gaji 5%!");
    }

    // Life Events
    if(!life.married && life.age >= 24 && Math.random() < 0.25) {
      life.married = true;
      life.spouseName = "Siti";
      life.bank -= 5000;
      logMessage(`Berkahwin dengan ${life.spouseName}. Kos kenduri RM 5,000.`);
    } else if(life.married && life.children < 4 && Math.random() < 0.2) {
      life.children += 1;
      logMessage(`Mendapat anak ke-${life.children}!`);
    }

    // Insolvency Check
    if(life.bank < -10000) {
      life.alive = false;
      logMessage("<span style='color:var(--danger)'>Muflis dan muflis kesihatan. Kehidupan berakhir.</span>");
    } else if(life.age >= 80) {
      life.alive = false;
      logMessage("<span style='color:var(--muted)'>Meninggal dunia secara tenang pada usia tua.</span>");
    }

    syncState();
    renderStats();
  }

  $('btnAdvance').addEventListener('click', advanceYear);

  // App Startup
  loadState();
</script>
</body>
</html>
