<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Enterprise Pixel Chat</title>
  <style>
    /* ============================================================
       ENTERPRISE DESIGN SYSTEM
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      /* Colours */
      --color-bg-primary: #1a1a2e;
      --color-bg-secondary: #16213e;
      --color-bg-tertiary: #12122a;
      --color-bg-input: #0f0e17;
      --color-accent: #e94560;
      --color-accent-hover: #ff6b81;
      --color-accent-dark: #c7304a;
      --color-text: #ffffff;
      --color-text-muted: rgba(255, 255, 255, 0.6);
      --color-text-dim: rgba(255, 255, 255, 0.3);
      --color-border: #e94560;
      --color-success: #4caf50;
      --color-error: #e94560;
      --color-warning: #ff9800;

      /* Typography */
      --font-family: 'Press Start 2P', monospace;
      --font-size-xs: 0.35rem;
      --font-size-sm: 0.45rem;
      --font-size-md: 0.55rem;
      --font-size-base: 0.65rem;
      --font-size-lg: 0.85rem;
      --font-size-xl: 1rem;
      --font-size-2xl: 1.2rem;

      /* Spacing */
      --space-xs: 2px;
      --space-sm: 4px;
      --space-md: 8px;
      --space-lg: 12px;
      --space-xl: 16px;
      --space-2xl: 20px;
      --space-3xl: 24px;

      /* Borders */
      --border-width: 2px;
      --border-radius: 0px;
      --border-style: solid;

      /* Shadows */
      --shadow-pixel: 4px 4px 0 rgba(0, 0, 0, 0.6);
      --shadow-pixel-sm: 2px 2px 0 rgba(0, 0, 0, 0.4);

      /* Z-index */
      --z-header: 100;
      --z-overlay: 200;
      --z-modal: 300;

      /* Transitions */
      --transition-fast: 0.1s ease;
      --transition-base: 0.2s ease;
      --transition-slow: 0.3s ease;

      /* Sizing */
      --app-max-width: 700px;
      --app-height: 95vh;
      --app-max-height: 800px;
    }

    /* ============================================================
       RESET
       ============================================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    /* ============================================================
       BASE
       ============================================================ */
    body {
      background: var(--color-bg-primary);
      color: var(--color-text);
      font-family: var(--font-family);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-md);
      overflow: hidden;
      font-size: var(--font-size-base);
    }

    /* ============================================================
       APP CONTAINER
       ============================================================ */
    .app {
      max-width: var(--app-max-width);
      width: 100%;
      height: var(--app-height);
      max-height: var(--app-max-height);
      background: var(--color-bg-secondary);
      border: var(--border-width) var(--border-style) var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-pixel);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      padding: var(--space-xl) var(--space-2xl);
      background: var(--color-bg-input);
      border-bottom: var(--border-width) var(--border-style) var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
      flex-shrink: 0;
      min-height: 60px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .header-brand .logo {
      font-size: var(--font-size-xl);
    }

    .header-brand .title {
      font-size: var(--font-size-lg);
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: var(--shadow-pixel-sm);
    }

    .header-brand .title .highlight {
      color: var(--color-accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      flex-wrap: wrap;
    }

    /* ============================================================
       STATUS INDICATOR
       ============================================================ */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg);
      background: var(--color-bg-primary);
      border: var(--border-width) var(--border-style) var(--color-success);
      font-size: var(--font-size-xs);
    }

    .status-indicator .dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      background: var(--color-success);
    }

    .status-indicator .dot--offline {
      background: var(--color-error);
      animation: pulse 0.8s infinite;
    }

    .status-indicator .count {
      font-size: var(--font-size-xs);
      margin-left: var(--space-xs);
    }

    /* ============================================================
       AUTH
       ============================================================ */
    .auth {
      display: flex;
      gap: var(--space-sm);
      align-items: center;
    }

    .auth-input {
      padding: var(--space-sm) var(--space-lg);
      border: var(--border-width) var(--border-style) var(--color-border);
      background: var(--color-bg-primary);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: var(--font-size-xs);
      width: 100px;
      transition: var(--transition-fast);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--color-accent-hover);
      width: 130px;
    }

    .auth-input::placeholder {
      color: var(--color-text-dim);
    }

    .auth-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: var(--space-sm) var(--space-xl);
      border: var(--border-width) var(--border-style) var(--color-border);
      background: var(--color-accent);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: var(--font-size-xs);
      cursor: pointer;
      transition: var(--transition-fast);
      text-transform: uppercase;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover:not(:disabled) {
      background: var(--color-accent-hover);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-pixel-sm);
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn--secondary {
      background: var(--color-bg-primary);
      border-color: var(--color-bg-primary);
    }

    .btn--secondary:hover:not(:disabled) {
      background: var(--color-bg-tertiary);
      border-color: var(--color-bg-tertiary);
    }

    .btn--danger {
      background: var(--color-error);
      border-color: var(--color-error);
    }

    .btn--danger:hover:not(:disabled) {
      background: var(--color-accent-hover);
      border-color: var(--color-accent-hover);
    }

    .btn--success {
      background: var(--color-success);
      border-color: var(--color-success);
    }

    /* ============================================================
       MESSAGES
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      background: var(--color-bg-tertiary);
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--color-bg-input);
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--color-accent);
      border: var(--border-width) var(--border-style) var(--color-bg-input);
    }

    .status-message {
      text-align: center;
      font-size: var(--font-size-xs);
      opacity: 0.5;
      padding: var(--space-3xl);
      font-style: italic;
    }

    /* ============================================================
       MESSAGE
       ============================================================ */
    .message {
      padding: var(--space-md) var(--space-xl);
      border: var(--border-width) var(--border-style) var(--color-text);
      max-width: 82%;
      word-wrap: break-word;
      animation: pixelFade 0.2s steps(2);
      line-height: 1.6;
    }

    .message--own {
      align-self: flex-end;
      background: var(--color-accent);
      border-color: var(--color-accent-hover);
      border-bottom-right-radius: 0;
    }

    .message--other {
      align-self: flex-start;
      background: var(--color-bg-primary);
      border-color: var(--color-bg-tertiary);
      border-bottom-left-radius: 0;
    }

    .message__sender {
      font-size: var(--font-size-xs);
      text-transform: uppercase;
      opacity: 0.7;
      letter-spacing: 1px;
      margin-bottom: var(--space-sm);
    }

    .message__timestamp {
      font-size: var(--font-size-xs);
      opacity: 0.5;
      margin-left: var(--space-sm);
    }

    .message__content {
      font-size: var(--font-size-md);
      word-break: break-word;
      line-height: 1.8;
    }

    /* ============================================================
       INPUT AREA
       ============================================================ */
    .input-area {
      padding: var(--space-lg) var(--space-2xl) var(--space-2xl);
      background: var(--color-bg-input);
      border-top: var(--border-width) var(--border-style) var(--color-border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: var(--space-md);
      align-items: center;
    }

    .input-field {
      flex: 1;
      padding: var(--space-lg) var(--space-xl);
      border: var(--border-width) var(--border-style) var(--color-border);
      background: var(--color-bg-tertiary);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      min-width: 50px;
      transition: var(--transition-fast);
    }

    .input-field:focus {
      outline: none;
      border-color: var(--color-accent-hover);
    }

    .input-field::placeholder {
      color: var(--color-text-dim);
    }

    .input-field:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes pixelFade {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px) {
      :root {
        --app-height: 100vh;
        --app-max-height: 100vh;
        --space-xl: 12px;
        --space-2xl: 16px;
      }

      .app {
        border-width: var(--border-width);
        border-radius: 0;
      }

      .header {
        padding: var(--space-lg) var(--space-xl);
        min-height: 50px;
      }

      .header-brand .title {
        font-size: var(--font-size-md);
      }

      .auth-input {
        width: 70px;
        font-size: var(--font-size-xs);
        padding: var(--space-xs) var(--space-md);
      }

      .auth-input:focus {
        width: 90px;
      }

      .btn {
        font-size: var(--font-size-xs);
        padding: var(--space-xs) var(--space-md);
        min-height: 24px;
      }

      .messages {
        padding: var(--space-lg);
      }

      .message {
        max-width: 92%;
        padding: var(--space-sm) var(--space-lg);
      }

      .message__content {
        font-size: var(--font-size-sm);
      }

      .input-area {
        padding: var(--space-md) var(--space-xl) var(--space-xl);
      }

      .input-field {
        font-size: var(--font-size-xs);
        padding: var(--space-md) var(--space-lg);
      }

      .status-indicator {
        font-size: var(--font-size-xs);
        padding: var(--space-xs) var(--space-md);
      }
    }

    @media (max-width: 400px) {
      .auth-input {
        width: 50px;
      }

      .auth-input:focus {
        width: 70px;
      }

      .header-brand .title {
        font-size: var(--font-size-sm);
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app" role="main" aria-label="Chat Application">

    <!-- ===== HEADER ===== -->
    <header class="header" role="banner">
      <div class="header-brand">
        <span class="logo" aria-hidden="true">🕹️</span>
        <h1 class="title">
          <span class="highlight">PIXEL</span> CHAT
        </h1>
      </div>
      <div class="header-actions">
        <div class="status-indicator" role="status" aria-live="polite">
          <span class="dot" id="statusDot"></span>
          <span id="onlineCount">0</span>
        </div>
        <div class="auth" role="group" aria-label="Authentication">
          <input
          type="text"
          class="auth-input"
          id="nameInput"
          placeholder="NAME"
          maxlength="20"
          aria-label="Username"
          />
          <button class="btn" id="joinBtn" aria-label="Join chat">JOIN</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none" aria-label="Leave chat">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer" role="log" aria-live="polite">
      <div class="status-message">🔄 CONNECTING...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area" role="contentinfo">
      <div class="input-row">
        <input
        type="text"
        class="input-field"
        id="messageInput"
        placeholder="TYPE..."
        disabled
        aria-label="Message input"
        />
        <button class="btn" id="sendBtn" disabled aria-label="Send message">SEND</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE SDK
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APPLICATION SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * ENTERPRISE PIXEL CHAT
     * Architecture: Clean, Modular, Production-Ready
     * ============================================================
     */

    // ============================================================
    // 1. CONFIGURATION
    // ============================================================

    const CONFIG = Object.freeze({
      FIREBASE: {
        databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
      },
      MESSAGE_LIMIT: 100,
      MAX_USERNAME_LENGTH: 20,
      CONNECTION_TIMEOUT: 5000,
      STATUS_CLEAR_DELAY: 1500,
    });

    // ============================================================
    // 2. LOGGER
    // ============================================================

    const Logger = {
      _prefix: '[PixelChat]',

      info: (...args) => {
        console.info(Logger._prefix, ...args);
      },

      warn: (...args) => {
        console.warn(Logger._prefix, ...args);
      },

      error: (...args) => {
        console.error(Logger._prefix, ...args);
      },

      debug: (...args) => {
        if (process.env.NODE_ENV === 'development') {
          console.debug(Logger._prefix, ...args);
        }
      },
    };

    // ============================================================
    // 3. FIREBASE SERVICE
    // ============================================================

    const FirebaseService = {
      _db: null,
      _initialized: false,

      init() {
        try {
          firebase.initializeApp(CONFIG.FIREBASE);
          this._db = firebase.database();
          this._initialized = true;
          Logger.info('Firebase initialized successfully');
          return this._db;
        } catch (error) {
          Logger.error('Firebase initialization failed:', error);
          throw new Error('Failed to initialize Firebase');
        }
      },

      get db() {
        if (!this._initialized) {
          this.init();
        }
        return this._db;
      },

      get messagesRef() {
        return this.db.ref('messages');
      },

      get usersRef() {
        return this.db.ref('users');
      },

      get connectionRef() {
        return this.db.ref('.info/connected');
      },
    };

    // ============================================================
    // 4. DOM SERVICE
    // ============================================================

    const DOMService = {
      elements: {},

      init() {
        this.elements = {
          messages: document.getElementById('messagesContainer'),
          messageInput: document.getElementById('messageInput'),
          sendBtn: document.getElementById('sendBtn'),
          nameInput: document.getElementById('nameInput'),
          joinBtn: document.getElementById('joinBtn'),
          leaveBtn: document.getElementById('leaveBtn'),
          onlineCount: document.getElementById('onlineCount'),
          statusDot: document.getElementById('statusDot'),
        };

        // Validate all elements exist
        Object.entries(this.elements).forEach(([key, element]) => {
          if (!element) {
            Logger.error(`DOM element not found: ${key}`);
            throw new Error(`Required DOM element missing: ${key}`);
          }
        });

        Logger.info('DOM initialized');
        return this.elements;
      },

      get(id) {
        return this.elements[id];
      },

      setStatus(text) {
        const el = this.elements.messages.querySelector('.status-message');
        if (el) {
          el.textContent = text;
        } else {
          const newEl = document.createElement('div');
          newEl.className = 'status-message';
          newEl.textContent = text;
          this.elements.messages.appendChild(newEl);
        }
      },

      clearStatus() {
        const el = this.elements.messages.querySelector('.status-message');
        if (el) el.remove();
      },

      scrollToBottom() {
        setTimeout(() => {
          this.elements.messages.scrollTop = this.elements.messages.scrollHeight;
        }, 50);
      },
    };

    // ============================================================
    // 5. MESSAGE SERVICE
    // ============================================================

    const MessageService = {
      _listeners: [],
      _user: null,
      _connected: false,

      setUser(user) {
        this._user = user;
      },

      setConnected(status) {
        this._connected = status;
      },

      send(text) {
        if (!this._user) {
          Logger.warn('Cannot send: User not authenticated');
          alert('SIGN IN FIRST!');
          return false;
        }

        if (!text || !text.trim()) {
          return false;
        }

        if (!this._connected) {
          Logger.warn('Cannot send: Not connected');
          alert('WAITING FOR CONNECTION...');
          return false;
        }

        try {
          FirebaseService.messagesRef.push({
            name: this._user.name,
            uid: this._user.uid,
            text: text.trim(),
            timestamp: firebase.database.ServerValue.TIMESTAMP,
          });
          Logger.info('Message sent successfully');
          return true;
        } catch (error) {
          Logger.error('Failed to send message:', error);
          alert('FAILED TO SEND.');
          return false;
        }
      },

      render(data) {
        const isOwn = this._user && data.uid === this._user.uid;
        const el = document.createElement('div');
        el.className = `message ${isOwn ? 'message--own' : 'message--other'}`;
        el.dataset.key = data._key;

        const timestamp = data.timestamp ?
          new Date(data.timestamp).toLocaleTimeString('en-GB', {
            hour: '2-digit',
            minute: '2-digit',
          }) :
          '';

        el.innerHTML = `
            <div class="message__sender">
              ${this._escapeHtml(data.name || 'ANON')}
              <span class="message__timestamp">${timestamp}</span>
            </div>
            <div class="message__content">${this._escapeHtml(data.text || '')}</div>
          `;

        DOMService.clearStatus();
        DOMService.elements.messages.appendChild(el);
        DOMService.scrollToBottom();
      },

      _escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      },

      clearListeners() {
        this._listeners.forEach(ref => ref.off());
        this._listeners = [];
        Logger.debug('Listeners cleared');
      },

      subscribe() {
        this.clearListeners();

        // Connection status
        const presenceRef = FirebaseService.connectionRef;
        const onConnection = (snapshot) => {
          const isConnected = snapshot.val() === true;
          this.setConnected(isConnected);
          this._updateConnectionStatus(isConnected);

          if (isConnected && this._user) {
            this._updateUserPresence();
          }
        };
        presenceRef.on('value', onConnection);
        this._listeners.push(presenceRef);

        // Online users
        const usersRef = FirebaseService.usersRef;
        const onUsers = (snapshot) => {
          if (this._connected) {
            const count = snapshot.exists() ? snapshot.numChildren() : 0;
            DOMService.elements.onlineCount.textContent = count;
          }
        };
        usersRef.on('value', onUsers);
        this._listeners.push(usersRef);

        // Messages
        const query = FirebaseService.messagesRef
          .orderByKey()
          .limitToLast(CONFIG.MESSAGE_LIMIT);

        const onMessageAdded = (snapshot) => {
          if (this._connected) {
            const data = snapshot.val();
            data._key = snapshot.key;
            this.render(data);
          }
        };
        query.on('child_added', onMessageAdded);
        this._listeners.push(query);

        const onMessageRemoved = (snapshot) => {
          const el = DOMService.elements.messages
            .querySelector(`[data-key="${snapshot.key}"]`);
          if (el) el.remove();
        };
        query.on('child_removed', onMessageRemoved);
        this._listeners.push(query);

        // Initial check
        query.once('value', (snapshot) => {
          if (!snapshot.exists()) {
            DOMService.setStatus('💬 NO MESSAGES YET');
          }
        });

        Logger.info('Subscribed to Firebase events');
      },

      _updateConnectionStatus(isConnected) {
        const dot = DOMService.elements.statusDot;
        dot.className = `dot ${isConnected ? '' : 'dot--offline'}`;

        if (isConnected) {
          DOMService.setStatus('✅ CONNECTED');
          setTimeout(() => {
            const statusEl = DOMService.elements.messages
              .querySelector('.status-message');
            if (statusEl && statusEl.textContent === '✅ CONNECTED') {
              DOMService.clearStatus();
            }
          }, CONFIG.STATUS_CLEAR_DELAY);
        } else {
          DOMService.setStatus('🔄 RECONNECTING...');
        }
      },

      _updateUserPresence() {
        const ref = FirebaseService.usersRef.child(this._user.uid);
        ref.set({
          name: this._user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP,
        });
        ref.onDisconnect().remove();
        Logger.info('User presence updated');
      },
    };

    // ============================================================
    // 6. AUTH SERVICE
    // ============================================================

    const AuthService = {
      _user: null,

      get currentUser() {
        return this._user;
      },

      login() {
        const nameInput = DOMService.elements.nameInput;
        const rawName = nameInput.value.trim() || 'GUEST';
        const name = rawName.toUpperCase().slice(0, CONFIG.MAX_USERNAME_LENGTH);

        this._user = {
          name: name,
          uid: `u_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        };

        MessageService.setUser(this._user);

        // Update UI
        nameInput.disabled = true;
        DOMService.elements.joinBtn.style.display = 'none';
        DOMService.elements.leaveBtn.style.display = 'inline-block';
        DOMService.elements.messageInput.disabled = false;
        DOMService.elements.sendBtn.disabled = false;
        DOMService.elements.messageInput.placeholder = `MSG AS ${name}...`;

        DOMService.clearStatus();
        DOMService.setStatus(`👾 ${name} JOINED`);

        // Re-subscribe with user context
        MessageService.subscribe();

        // Force presence update if connected
        if (MessageService._connected) {
          const ref = FirebaseService.usersRef.child(this._user.uid);
          ref.set({
            name: this._user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP,
          });
          ref.onDisconnect().remove();
        }

        DOMService.elements.onlineCount.textContent = '1';

        setTimeout(() => {
          const statusEl = DOMService.elements.messages
            .querySelector('.status-message');
          if (statusEl && statusEl.textContent === `👾 ${name} JOINED`) {
            DOMService.clearStatus();
          }
        }, CONFIG.STATUS_CLEAR_DELAY);

        Logger.info(`User logged in: ${name}`);
        return this._user;
      },

      logout() {
        if (this._user) {
          FirebaseService.usersRef.child(this._user.uid).remove();
        }

        MessageService.clearListeners();
        MessageService.setUser(null);

        const nameInput = DOMService.elements.nameInput;
        nameInput.disabled = false;
        DOMService.elements.joinBtn.style.display = 'inline-block';
        DOMService.elements.leaveBtn.style.display = 'none';
        DOMService.elements.messageInput.disabled = true;
        DOMService.elements.sendBtn.disabled = true;
        DOMService.elements.messageInput.placeholder = 'TYPE...';
        DOMService.elements.messageInput.value = '';

        DOMService.elements.messages.innerHTML = '';
        DOMService.setStatus('👋 LEFT CHAT');
        DOMService.elements.onlineCount.textContent = '0';

        // Update connection status
        const isConnected = MessageService._connected;
        const dot = DOMService.elements.statusDot;
        dot.className = `dot ${isConnected ? '' : 'dot--offline'}`;

        this._user = null;
        Logger.info('User logged out');
      },
    };

    // ============================================================
    // 7. EVENT HANDLER
    // ============================================================

    const EventHandler = {
      _initialized: false,

      init() {
        if (this._initialized) {
          Logger.warn('Event handler already initialized');
          return;
        }

        const dom = DOMService.elements;

        // Auth events
        dom.joinBtn.addEventListener('click', () => AuthService.login());
        dom.leaveBtn.addEventListener('click', () => AuthService.logout());
        dom.nameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') AuthService.login();
        });

        // Message events
        dom.sendBtn.addEventListener('click', () => {
          const text = dom.messageInput.value;
          if (MessageService.send(text)) {
            dom.messageInput.value = '';
            dom.messageInput.focus();
          }
        });

        dom.messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const text = dom.messageInput.value;
            if (MessageService.send(text)) {
              dom.messageInput.value = '';
              dom.messageInput.focus();
            }
          }
        });

        this._initialized = true;
        Logger.info('Event handlers initialized');
      },
    };

    // ============================================================
    // 8. APPLICATION BOOTSTRAP
    // ============================================================

    const App = {
      _bootstrapped: false,

      bootstrap() {
        if (this._bootstrapped) {
          Logger.warn('App already bootstrapped');
          return;
        }

        try {
          // Initialize services in order
          Logger.info('Bootstrapping application...');

          // 1. Firebase
          FirebaseService.init();

          // 2. DOM
          DOMService.init();

          // 3. Message Service
          MessageService.subscribe();

          // 4. Event Handler
          EventHandler.init();

          // 5. Initial status
          DOMService.setStatus('🔄 CONNECTING...');

          this._bootstrapped = true;
          Logger.info('Application bootstrapped successfully');
          Logger.info(`📡 Database: ${CONFIG.FIREBASE.databaseURL}`);
          Logger.info(`📦 Message limit: ${CONFIG.MESSAGE_LIMIT}`);

        } catch (error) {
          Logger.error('Failed to bootstrap application:', error);
          document.body.innerHTML = `
              <div style="
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: 'Press Start 2P', monospace;
                color: #e94560;
                padding: 20px;
                text-align: center;
              ">
                <div>
                  <div style="font-size: 48px; margin-bottom: 20px;">💀</div>
                  <h2 style="font-size: 1rem; margin-bottom: 10px;">BOOT FAILED</h2>
                  <p style="font-size: 0.6rem; opacity: 0.6;">
                    ${error.message || 'Unknown error'}
                  </p>
                </div>
              </div>
            `;
          throw error;
        }
      },
    };

    // ============================================================
    // 9. INIT
    // ============================================================

    // Boot the application when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => App.bootstrap());
    } else {
      App.bootstrap();
    }

    // ============================================================
    // 10. EXPOSE FOR DEBUGGING (Development only)
    // ============================================================

    if (process.env.NODE_ENV === 'development') {
      window.__APP = {
        CONFIG,
        FirebaseService,
        DOMService,
        MessageService,
        AuthService,
        EventHandler,
        App,
      };
      Logger.info('Debug API exposed');
    }
  </script>

</body>
</html>
