<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nexus Chat Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --font: 'Inter', -apple-system, system-ui, sans-serif;
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122e;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --accent: #6c5ce7;
      --accent2: #00cec9;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --text-dim: rgba(255, 255, 255, 0.2);
      --success: #00cec9;
      --error: #fd79a8;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-full: 9999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg-primary);
    }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      touch-action: manipulation;
      background: radial-gradient(ellipse at 50% 0%, #1a1a4e 0%, #0a0a1a 70%);
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 932px;
      background: var(--glass);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--glass-shadow);
      position: relative;
      z-index: 1;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 206, 201, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      flex-shrink: 0;
      min-height: 52px;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-brand .logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .header-brand .title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-brand .title .highlight {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-size: 0.55rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 28px;
      color: var(--text-muted);
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-badge .dot.off {
      background: var(--error);
      animation: blink 0.8s infinite;
    }

    .status-badge .count {
      color: var(--text);
      font-weight: 600;
    }

    .auth {
      display: flex;
      gap: 4px;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    .auth-input {
      padding: 5px 10px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 400;
      width: 70px;
      transition: var(--transition);
      min-height: 28px;
      flex: 1 1 auto;
      min-width: 50px;
      max-width: 90px;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent);
      width: 80px;
    }

    .auth-input::placeholder {
      color: var(--text-dim);
      font-weight: 300;
    }

    .auth-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--text);
      font-family: var(--font);
      font-size: 0.55rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      min-height: 28px;
      min-width: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn--danger {
      background: linear-gradient(135deg, var(--error), #e17055);
    }

    .btn--join {
      background: linear-gradient(135deg, var(--accent), #a29bfe);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: var(--radius-full);
    }

    .status-msg {
      text-align: center;
      font-size: 0.6rem;
      font-weight: 400;
      color: var(--text-muted);
      padding: 20px 12px;
      letter-spacing: 0.3px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      max-width: 88%;
      word-wrap: break-word;
      animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.5;
      font-size: 0.75rem;
      font-weight: 400;
      transition: var(--transition);
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg.own {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg .sender {
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .msg.own .sender {
      opacity: 0.8;
      color: rgba(255, 255, 255, 0.8);
    }

    .msg .time {
      font-size: 0.4rem;
      font-weight: 400;
      opacity: 0.5;
      margin-left: 4px;
    }

    .msg .text {
      word-break: break-word;
      line-height: 1.5;
    }

    .msg .sender-info {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.35rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .msg.own .sender-info {
      border-top-color: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.6);
    }

    .sender-info .tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 6px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .sender-info .tag .icon {
      font-size: 0.4rem;
    }

    .sender-info .tag .val {
      font-weight: 500;
      font-size: 0.35rem;
    }

    .battery-high {
      color: #00cec9;
    }
    .battery-medium {
      color: #fdcb6e;
    }
    .battery-low {
      color: #fd79a8;
    }
    .battery-critical {
      color: #e17055;
      animation: blink 1s infinite;
    }

    .signal-bars {
      display: inline-flex;
      gap: 1px;
      align-items: flex-end;
    }

    .signal-bars .bar {
      width: 2px;
      background: currentColor;
      opacity: 0.2;
      border-radius: 1px;
    }

    .signal-bars .bar.active {
      opacity: 1;
    }

    .signal-bars .bar:nth-child(1) {
      height: 3px;
    }
    .signal-bars .bar:nth-child(2) {
      height: 5px;
    }
    .signal-bars .bar:nth-child(3) {
      height: 7px;
    }
    .signal-bars .bar:nth-child(4) {
      height: 9px;
    }
    .signal-bars .bar:nth-child(5) {
      height: 11px;
    }

    .input-area {
      padding: 6px 12px 12px;
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: var(--glass);
      backdrop-filter: blur(20px);
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: 400;
      min-width: 40px;
      transition: var(--transition);
      min-height: 36px;
    }

    .row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .row input::placeholder {
      color: var(--text-dim);
      font-weight: 300;
    }

    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: 0.65rem;
      padding: 8px 16px;
      min-height: 36px;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    @media (max-width: 380px) {
      .header {
        padding: 6px 8px;
        min-height: 44px;
      }
      .header-brand .logo {
        width: 24px;
        height: 24px;
        font-size: 0.7rem;
      }
      .header-brand .title {
        font-size: 0.7rem;
      }
      .auth-input {
        font-size: 0.5rem;
        padding: 3px 6px;
        min-height: 24px;
        width: 50px;
        max-width: 60px;
      }
      .auth-input:focus {
        width: 60px;
      }
      .btn {
        font-size: 0.45rem;
        padding: 3px 8px;
        min-height: 24px;
        min-width: 28px;
      }
      .status-badge {
        font-size: 0.45rem;
        padding: 2px 6px;
        min-height: 24px;
      }
      .status-badge .dot {
        width: 5px;
        height: 5px;
      }
      .messages {
        padding: 6px 8px;
        gap: 3px;
      }
      .msg {
        padding: 5px 8px;
        max-width: 95%;
        font-size: 0.65rem;
      }
      .msg .sender {
        font-size: 0.4rem;
      }
      .msg .text {
        font-size: 0.65rem;
      }
      .input-area {
        padding: 4px 8px 8px;
      }
      .row input {
        font-size: 0.6rem;
        padding: 6px 10px;
        min-height: 32px;
      }
      .row .btn {
        font-size: 0.55rem;
        padding: 6px 10px;
        min-height: 32px;
      }
      .sender-info .tag {
        font-size: 0.3rem;
        padding: 1px 4px;
      }
      .sender-info .tag .icon {
        font-size: 0.35rem;
      }
      .sender-info .tag .val {
        font-size: 0.3rem;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .app {
        max-height: 95vh;
        border-radius: var(--radius-sm);
      }
      .header {
        padding: 4px 10px;
        min-height: 36px;
      }
      .header-brand .logo {
        width: 20px;
        height: 20px;
        font-size: 0.6rem;
      }
      .header-brand .title {
        font-size: 0.6rem;
      }
      .messages {
        padding: 4px 8px;
        gap: 2px;
      }
      .msg {
        padding: 3px 8px;
        max-width: 90%;
        font-size: 0.55rem;
      }
      .msg .sender {
        font-size: 0.35rem;
        margin-bottom: 1px;
      }
      .msg .text {
        font-size: 0.55rem;
        line-height: 1.3;
      }
      .input-area {
        padding: 3px 8px 6px;
      }
      .row input {
        min-height: 24px;
        padding: 4px 8px;
        font-size: 0.55rem;
      }
      .row .btn {
        min-height: 24px;
        padding: 4px 10px;
        font-size: 0.5rem;
      }
      .auth-input {
        min-height: 20px;
        font-size: 0.45rem;
        padding: 2px 6px;
      }
      .btn {
        min-height: 20px;
        font-size: 0.4rem;
        padding: 2px 8px;
      }
      .status-badge {
        font-size: 0.4rem;
        padding: 2px 6px;
        min-height: 20px;
      }
      .sender-info .tag {
        font-size: 0.25rem;
        padding: 1px 3px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="header-brand">
        <div class="logo">✦</div>
        <h1 class="title"><span class="highlight">Nexus</span></h1>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" class="auth-input" id="nameInput" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn btn--join" id="joinBtn">Join</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <div class="messages" id="messagesContainer">
      <div class="status-msg">Connecting...</div>
    </div>

    <footer class="input-area">
      <div class="row">
        <input type="text" id="messageInput" placeholder="Type..." disabled inputmode="text" autocomplete="off" />
        <button class="btn" id="sendBtn" disabled>Send</button>
      </div>
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    /**
     * ============================================================
     * NEXUS CHAT PRO — Real Data Only
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let statusTimeout = null;
    let batteryLevel = 50;
    let isCharging = false;
    let signalStrength = 3;

    // ============================================================
    // 4. REAL DEVICE DATA — No dummies
    // ============================================================

    const DeviceInfo = {
      getBattery: async function() {
        try {
          if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            batteryLevel = Math.round(battery.level * 100);
            isCharging = battery.charging;
            return {
              level: batteryLevel,
              charging: isCharging,
            };
          }
        } catch (e) {}
        return { level: batteryLevel, charging: false };
      },

      getSignal: function() {
        try {
          if (navigator.connection) {
            const conn = navigator.connection;
            const downlink = conn.downlink || 10;
            signalStrength = Math.min(Math.round(downlink / 10 * 5), 5);
            return signalStrength;
          }
        } catch (e) {}
        return signalStrength;
      },

      getNetwork: function() {
        try {
          if (navigator.connection) {
            const type = navigator.connection.effectiveType;
            const map = {
              '4g': '4G',
              '3g': '3G',
              '2g': '2G',
              'slow-2g': '2G'
            };
            return map[type] || '4G';
          }
        } catch (e) {}
        return '4G';
      },

      getMemory: function() {
        try {
          if (navigator.deviceMemory) {
            return navigator.deviceMemory + 'GB';
          }
        } catch (e) {}
        return '4GB';
      },

      getCPU: function() {
        try {
          if (navigator.hardwareConcurrency) {
            return navigator.hardwareConcurrency + 'c';
          }
        } catch (e) {}
        return '4c';
      },

      getPlatform: function() {
        try {
          const ua = navigator.userAgent;
          if (ua.includes('iPhone')) return 'iOS';
          if (ua.includes('Android')) return 'Android';
          if (ua.includes('Windows')) return 'Win';
          if (ua.includes('Mac')) return 'macOS';
          return 'Web';
        } catch (e) {}
        return 'Web';
      },

      getBrowser: function() {
        try {
          const ua = navigator.userAgent;
          if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
          if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
          if (ua.includes('Firefox')) return 'Firefox';
          if (ua.includes('Edg')) return 'Edge';
          return 'Browser';
        } catch (e) {}
        return 'Browser';
      },

      getScreen: function() {
        try {
          return window.screen.width + '×' + window.screen.height;
        } catch (e) {}
        return 'Unknown';
      },

      getLanguage: function() {
        try {
          return navigator.language || 'en';
        } catch (e) {}
        return 'en';
      },

      getTimezone: function() {
        try {
          return Intl.DateTimeFormat().resolvedOptions().timeZone;
        } catch (e) {}
        return 'UTC';
      },

      getUptime: function() {
        try {
          const start = performance.now();
          const s = Math.floor(start / 1000);
          const m = Math.floor(s / 60);
          const h = Math.floor(m / 60);
          if (h > 0) return h + 'h';
          if (m > 0) return m + 'm';
          return s + 's';
        } catch (e) {}
        return '0s';
      },

      getLocation: function() {
        // Real location via API — will be updated when permission granted
        return '—';
      },

      getDevice: function() {
        try {
          const ua = navigator.userAgent;
          if (ua.includes('iPhone')) return 'iPhone';
          if (ua.includes('iPad')) return 'iPad';
          if (ua.includes('Android')) return 'Android';
          if (ua.includes('Windows')) return 'PC';
          if (ua.includes('Mac')) return 'Mac';
          return 'Device';
        } catch (e) {}
        return 'Device';
      },

      getOrientation: function() {
        try {
          return window.innerHeight > window.innerWidth ? 'Portrait' : 'Landscape';
        } catch (e) {}
        return 'Portrait';
      },

      getConnectionSpeed: function() {
        try {
          if (navigator.connection) {
            const speed = navigator.connection.downlink;
            if (speed >= 50) return '⚡Very Fast';
            if (speed >= 20) return 'Fast';
            if (speed >= 5) return 'Medium';
            return 'Slow';
          }
        } catch (e) {}
        return 'Medium';
      },

      getBatteryIcon: function() {
        const l = batteryLevel;
        if (l >= 90) return '🔋';
        if (l >= 70) return '🔋';
        if (l >= 40) return '🔌';
        if (l >= 20) return '⚠️';
        return '🪫';
      },

      getBatteryColor: function() {
        const l = batteryLevel;
        if (l >= 70) return 'battery-high';
        if (l >= 40) return 'battery-medium';
        if (l >= 20) return 'battery-low';
        return 'battery-critical';
      },

      getSignalBarsHTML: function() {
        const s = this.getSignal();
        return [1, 2, 3, 4, 5].map((_, i) =>
          `<span class="bar ${i < s ? 'active' : ''}"></span>`
        ).join('');
      },

      collectAll: async function() {
        await this.getBattery();
        return {
          battery: batteryLevel,
          batteryIcon: this.getBatteryIcon(),
          batteryColor: this.getBatteryColor(),
          charging: isCharging,
          signal: this.getSignal(),
          signalBars: this.getSignalBarsHTML(),
          network: this.getNetwork(),
          memory: this.getMemory(),
          cpu: this.getCPU(),
          uptime: this.getUptime(),
          platform: this.getPlatform(),
          browser: this.getBrowser(),
          screen: this.getScreen(),
          language: this.getLanguage(),
          timezone: this.getTimezone(),
          device: this.getDevice(),
          orientation: this.getOrientation(),
          connectionSpeed: this.getConnectionSpeed(),
        };
      }
    };

    // Start battery monitoring
    if (navigator.getBattery) {
      navigator.getBattery().then(battery => {
        battery.addEventListener('levelchange', () => {
          batteryLevel = Math.round(battery.level * 100);
        });
        battery.addEventListener('chargingchange', () => {
          isCharging = battery.charging;
        });
      });
    }

    // Monitor connection
    if (navigator.connection) {
      navigator.connection.addEventListener('change', () => {
        DeviceInfo.getSignal();
      });
    }

    // ============================================================
    // 5. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;
      if (statusTimeout) clearTimeout(statusTimeout);
      if (on) {
        status('Connected');
        statusTimeout = setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === 'Connected') clearStatus();
          statusTimeout = null;
        }, 1000);
      } else {
        status('Reconnecting...');
      }
    };

    // ============================================================
    // 6. SEND — With real device data
    // ============================================================

    const sendMessage = async (text) => {
      if (!user) { alert('Sign in first!'); return; }
      if (!text || !text.trim()) return;
      if (!connected) { alert('Waiting for connection...'); return; }

      const info = await DeviceInfo.collectAll();

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        info: info,
      }).catch(() => alert('Failed to send.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 7. RENDER — With real sender info
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      let infoHTML = '';
      if (data.info) {
        const i = data.info;
        infoHTML = `
          <div class="sender-info">
            <span class="tag">
              <span class="icon">${i.batteryIcon || '🔋'}</span>
              <span class="val ${i.batteryColor || ''}">${i.battery || 0}%</span>
            </span>
            <span class="tag">
              <span class="icon">📶</span>
              <span class="signal-bars">${i.signalBars || ''}</span>
            </span>
            <span class="tag">
              <span class="icon">${i.network || '4G'}</span>
            </span>
            <span class="tag">
              <span class="icon">🧠</span>
              <span class="val">${i.memory || '4GB'}</span>
            </span>
            <span class="tag">
              <span class="icon">⚡</span>
              <span class="val">${i.cpu || '4c'}</span>
            </span>
            <span class="tag">
              <span class="icon">⏱️</span>
              <span class="val">${i.uptime || '0s'}</span>
            </span>
            <span class="tag">
              <span class="icon">${i.platform || 'Web'}</span>
            </span>
            <span class="tag">
              <span class="icon">${i.browser || 'Browser'}</span>
            </span>
            <span class="tag">
              <span class="icon">📐</span>
              <span class="val">${i.screen || 'Unknown'}</span>
            </span>
            <span class="tag">
              <span class="icon">🌐</span>
              <span class="val">${i.language || 'en'}</span>
            </span>
            <span class="tag">
              <span class="icon">${i.device || 'Device'}</span>
            </span>
            <span class="tag">
              <span class="icon">${i.orientation || 'Portrait'}</span>
            </span>
            <span class="tag">
              <span class="icon">${i.connectionSpeed || 'Medium'}</span>
            </span>
          </div>
        `;
      }

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'Anonymous'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
        ${infoHTML}
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === 'Connected' || st.textContent === 'Reconnecting...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 8. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      listeners.forEach(ref => ref.off());
      listeners = [];

      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);
        if (on && user) {
          const ref = db.ref('users').child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === 'Reconnecting...' || st.textContent === 'Connected') {
            status('No messages yet');
          }
        }
      });
    };

    // ============================================================
    // 9. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'User';
      const name = raw.slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `Msg as ${name}...`;

      clearStatus();
      status(`${name} joined`);

      subscribe();

      if (connected) {
        const ref = db.ref('users').child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `${name} joined`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'Type...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('Left chat');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 10. EVENTS — Touch optimized
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault();
        login(); }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // Touch feedback
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.95)';
      }, { passive: true });
      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    // Keyboard scroll
    DOM.messageInput.addEventListener('focus', () => {
      setTimeout(() => {
        DOM.messageInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    });

    // ============================================================
    // 11. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('✦ NEXUS CHAT PRO — REAL DATA ✦');
    console.log('📡 Database:', firebase.app().options.databaseURL);
    console.log('📱 Device:', DeviceInfo.getDevice());
    console.log('🔋 Battery:', batteryLevel + '%');
  </script>

</body>
</html>
