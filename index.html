<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZACK360 MODERN PLATFORM</title>
<link rel="manifest" href="data:application/manifest+json;utf8,{\"name\":\"ZACK360\",\"short_name\":\"ZACK360\",\"start_url\":\".\",\"display\":\"standalone\",\"background_color\":\"#030712\",\"theme_color\":\"#00f3ff\"}">
<style>
:root {
  --bg: #030712;
  --card: rgba(15, 23, 42, 0.75);
  --card-solid: rgba(15, 23, 42, 0.95);
  --border: rgba(0, 243, 255, 0.25);
  --neon: #00f3ff;
  --pink: #ff007f;
  --purple: #a855f7;
  --gold: #eab308;
  --text: #f8fafc;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}

#blocker{display:none;position:fixed;inset:0;background:#000;z-index:99999;justify-content:center;align-items:center;text-align:center;padding:20px;color:var(--pink);font-size:1.2rem;font-weight:bold;text-shadow:0 0 10px var(--pink);}
.screen{display:none;width:100%;height:100dvh;flex-direction:column;position:relative;z-index:10;overflow:hidden;}
.active{display:flex;}

/* Animated Background Ambient Glow */
.bg-glow{position:absolute;width:350px;height:350px;background:radial-gradient(circle,rgba(0,243,255,0.12) 0%,transparent 70%);top:40%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 6s infinite ease-in-out;}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.3;}50%{transform:translate(-50%,-50%) scale(1.4);opacity:0.6;}}

/* Floating App Header */
header {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  height: 50px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  backdrop-filter: blur(16px);
  z-index: 100;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}
.brand{display:flex;align-items:center;gap:10px;}
.menu-trigger{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--neon);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;}
.avatar-header{width:30px;height:30px;border-radius:50%;background:linear-gradient(45deg,var(--neon),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.8rem;color:#000;box-shadow:0 0 8px var(--neon);cursor:pointer;}
header h1{font-size:0.9rem;color:var(--neon);letter-spacing:1px;text-shadow:0 0 6px var(--neon);}
.online-badge{font-size:0.6rem;color:#10b981;display:flex;align-items:center;gap:4px;font-weight:bold;}
.online-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;}

/* Slide-out Navigation Drawer */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer {
  position: fixed;
  top: 0;
  left: -280px;
  width: 260px;
  height: 100%;
  background: var(--card-solid);
  border-right: 1px solid var(--border);
  z-index: 201;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 20px 15px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: 10px 0 30px rgba(0,0,0,0.5);
}
.drawer.open {
  transform: translateX(280px);
}
.drawer-title {
  color: var(--neon);
  font-size: 1.1rem;
  font-weight: bold;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}
.drawer-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.drawer-label {
  font-size: 0.65rem;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}
.drawer-btn {
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  color: var(--text);
  text-align: left;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.drawer-btn.active {
  background: rgba(0,243,255,0.15);
  border-color: var(--neon);
  color: var(--neon);
  font-weight: bold;
}

/* Floating Banner */
.pinned-banner {
  position: absolute;
  top: 68px;
  left: 14px;
  right: 14px;
  background: rgba(234, 179, 8, 0.12);
  border: 1px solid rgba(234, 179, 8, 0.3);
  border-radius: 10px;
  color: var(--gold);
  font-size: 0.68rem;
  padding: 6px 12px;
  backdrop-filter: blur(8px);
  z-index: 90;
}

/* Chat Main Screen Space */
.main-body{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:105px;padding-bottom:70px;}
.content{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;}

/* Message Cards */
.msg-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:2px;}
.msg-row.me{justify-content:flex-end;}
.msg-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:bold;color:#fff;box-shadow:0 0 6px var(--pink);flex-shrink:0;cursor:pointer;}
.msg-card{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid rgba(255,255,255,0.08);font-size:0.85rem;word-break:break-word;position:relative;backdrop-filter:blur(8px);}
.msg-row.me .msg-card{background:linear-gradient(135deg,rgba(0,243,255,0.18),rgba(168,85,247,0.18));border-color:var(--neon);box-shadow:0 4px 15px rgba(0,243,255,0.15);border-bottom-right-radius:4px;}
.msg-row:not(.me) .msg-card{border-bottom-left-radius:4px;}
.msg-header{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.msg-user{font-size:0.68rem;color:var(--neon);font-weight:bold;text-shadow:0 0 4px var(--neon);cursor:pointer;}
.rank-tag{font-size:0.5rem;padding:1px 4px;border-radius:4px;background:rgba(234,179,8,0.2);color:var(--gold);border:1px solid var(--gold);font-weight:bold;}
.msg-body{line-height:1.3;}

/* High-Contrast Readable Neon Links */
.msg-body a {
  color: #00ffff !important;
  background: rgba(0, 243, 255, 0.12);
  padding: 1px 5px;
  border-radius: 4px;
  border-bottom: 1px solid var(--neon);
  text-shadow: none !important;
  word-break: break-all;
  text-decoration: none;
}
.msg-body a:hover { background: rgba(0, 243, 255, 0.25); color: #fff !important; }

.msg-img{max-width:100%;max-height:160px;border-radius:8px;margin-top:4px;border:1px solid var(--border);cursor:pointer;object-fit:cover;}
.msg-audio{width:100%;margin-top:4px;height:30px;}
.msg-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;}
.msg-time{font-size:0.58rem;color:#64748b;}
.ticks{font-size:0.6rem;color:var(--neon);}

.reactions{display:flex;gap:6px;margin-top:6px;}
.react-btn{font-size:0.68rem;padding:2px 8px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:#fff;cursor:pointer;}
.react-btn.voted{border-color:var(--neon);background:rgba(0,243,255,0.2);}

.typing-bar{position:absolute;bottom:62px;left:20px;font-size:0.62rem;color:var(--neon);font-style:italic;}

/* Floating Pill Input Bar */
.chat-input-bar {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  height: 52px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 26px;
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 0 8px;
  backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  z-index: 100;
}
.chat-input-bar input {
  border: none;
  background: transparent;
  padding: 8px 6px;
  font-size: 0.85rem;
}
.chat-input-bar input:focus { box-shadow: none; }
.icon-btn {
  width: 34px;
  height: 34px;
  min-width: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--neon);
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.send-btn {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 50%;
  background: linear-gradient(45deg,var(--neon),var(--pink));
  border: none;
  color: #000;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 10px var(--neon);
  padding: 0;
}

/* Modals & Popups */
#imgModal, #profileModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; padding:15px; backdrop-filter:blur(6px); }
#imgModal img { max-width:100%; max-height:80vh; border-radius:16px; border:1px solid var(--neon); box-shadow:0 0 25px var(--neon); }
.modal-card { width:90%; max-width:320px; padding:24px 20px; background:var(--card-solid); border:1px solid var(--border); border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); }

/* Auth Box */
.auth-box{margin:auto;width:90%;max-width:360px;padding:25px 20px;background:var(--card-solid);border:1px solid var(--border);border-radius:20px;box-shadow:0 0 30px rgba(0,243,255,0.2);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:15px;}
.auth-box h2{text-align:center;color:var(--neon);text-shadow:0 0 10px var(--neon);letter-spacing:2px;font-size:1.6rem;}
input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:#fff;outline:none;font-size:0.9rem;transition:0.3s;}
input:focus{border-color:var(--neon);box-shadow:0 0 12px rgba(0,243,255,0.5);}
button{width:100%;padding:10px;background:transparent;border:1px solid var(--neon);border-radius:12px;color:var(--neon);font-weight:bold;font-size:0.9rem;cursor:pointer;text-shadow:0 0 6px var(--neon);box-shadow:0 0 12px rgba(0,243,255,0.2);transition:0.2s;}
button:active{transform:scale(0.97);background:var(--neon);color:#000;}
.toggle-btn{background:none;border:none;box-shadow:none;color:var(--pink);text-shadow:0 0 6px var(--pink);font-size:0.85rem;}

.lb-item{padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;display:flex;justify-content:space-between;align-items:center;}
.lb-left{display:flex;align-items:center;gap:10px;}
.lb-rank{font-size:0.85rem;font-weight:bold;color:var(--gold);width:20px;}
.lb-name{color:var(--neon);font-weight:bold;font-size:0.85rem;cursor:pointer;}
.lb-count{font-size:0.75rem;color:var(--pink);font-weight:bold;}
</style>
</head>
<body>

<div id="blocker">ACCESS DENIED: ANDROID DEVICES ONLY</div>
<div class="bg-glow"></div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="navDrawer">
  <div class="drawer-title">ZACK360 MENU</div>
  
  <div class="drawer-section">
    <div class="drawer-label">Channels</div>
    <button class="drawer-btn active" data-chan="general">💬 #general</button>
    <button class="drawer-btn" data-chan="gaming">🎮 #gaming</button>
    <button class="drawer-btn" data-chan="media">📷 #media</button>
  </div>

  <div class="drawer-section">
    <div class="drawer-label">Navigation</div>
    <button class="drawer-btn" id="drawerDmBtn">📩 Direct Message</button>
    <button class="drawer-btn" id="drawerLbBtn">🏆 Leaderboard</button>
  </div>

  <div class="drawer-section" style="margin-top:auto;">
    <button class="drawer-btn" id="soundBtn">🔊 Mute Audio</button>
    <button class="drawer-btn" id="logoutBtn" style="border-color:var(--pink);color:var(--pink);">🚪 Logout</button>
  </div>
</div>

<div id="imgModal"><img id="modalImg" src=""></div>

<div id="profileModal">
  <div class="modal-card">
    <h3 id="profUser" style="color:var(--neon);margin-bottom:8px;">USER</h3>
    <p id="profMsgs" style="font-size:0.85rem;color:var(--text);margin-bottom:6px;">Msgs: 0</p>
    <p id="profRank" style="font-size:0.85rem;color:var(--gold);margin-bottom:12px;">Rank: #--</p>
    <button id="dmBtn" style="margin-bottom:8px;">DIRECT MESSAGE</button>
    <button id="closeProfBtn" style="border-color:var(--pink);color:var(--pink);">CLOSE</button>
  </div>
</div>

<div id="authScreen" class="screen active">
  <div class="auth-box">
    <h2 id="authTitle">ZACK360</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="off" maxlength="15">
    <input type="password" id="password" placeholder="Password">
    <button id="authBtn">LOGIN</button>
    <button class="toggle-btn" id="toggleAuth">Need an account? Register</button>
  </div>
</div>

<div id="appScreen" class="screen">
  <header>
    <div class="brand">
      <button class="menu-trigger" id="menuBtn">☰</button>
      <div class="avatar-header" id="headerAvatar">?</div>
      <div>
        <h1 id="userDisplay">ZACK360</h1>
        <div class="online-badge"><div class="online-dot"></div><span id="onlineCount">1 online</span></div>
      </div>
    </div>
  </header>

  <div class="pinned-banner">📌 Rules: Respect members & no spamming.</div>

  <div class="main-body">
    <div id="chatView" class="content"></div>
    <div id="lbView" class="content" style="display:none;"></div>
    <div id="typingArea" class="typing-bar"></div>
    
    <div id="chatControls" class="chat-input-bar">
      <label class="icon-btn" for="imgInput">📷</label>
      <input type="file" id="imgInput" accept="image/*" style="display:none;">
      <button class="icon-btn" id="gifBtn">👾</button>
      <button class="icon-btn" id="audioRecBtn">🎙️</button>
      <input type="text" id="msgInput" placeholder="Send message..." autocomplete="off" maxlength="500">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, off, serverTimestamp, onDisconnect, remove, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

if (!/Android/i.test(navigator.userAgent)) {
  document.getElementById('blocker').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.remove());
}

const db = getDatabase(initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

let currentUser = null;
let isRegistering = false;
let typingTimeout = null;
let isTyping = false;
let currentChan = "general";
let targetDM = null;
let activeMode = "chat";
let soundEnabled = true;
let lastMsgTime = 0;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let selectedProfileUser = null;
let activeChatQuery = null;
let activeTypingRef = null;
let usersListenerRef = null;

// UI Elements
const menuBtn = document.getElementById('menuBtn');
const navDrawer = document.getElementById('navDrawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const usernameIn = document.getElementById('username');
const passwordIn = document.getElementById('password');
const authBtn = document.getElementById('authBtn');
const toggleAuth = document.getElementById('toggleAuth');
const authTitle = document.getElementById('authTitle');
const chatView = document.getElementById('chatView');
const lbView = document.getElementById('lbView');
const msgInput = document.getElementById('msgInput');
const imgInput = document.getElementById('imgInput');
const sendBtn = document.getElementById('sendBtn');
const chatControls = document.getElementById('chatControls');
const typingArea = document.getElementById('typingArea');
const soundBtn = document.getElementById('soundBtn');

/* Drawer Toggle Controls */
function toggleDrawer(open) {
  if(open) {
    navDrawer.classList.add('open');
    drawerOverlay.classList.add('open');
  } else {
    navDrawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
  }
}
menuBtn.onclick = () => toggleDrawer(true);
drawerOverlay.onclick = () => toggleDrawer(false);

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str + "_zack360_salt"));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function validatePayloadSize(base64Str, maxBytes = 150000) {
  const padding = (base64Str.match(/=/g) || []).length;
  const sizeInBytes = (base64Str.length * (3 / 4)) - padding;
  if (sizeInBytes > maxBytes) {
    alert(`Payload size (${Math.round(sizeInBytes / 1024)}KB) exceeds allowed 150KB limit.`);
    return false;
  }
  return true;
}

const playAudio = () => {
  if(!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 520; gain.gain.value = 0.04;
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e){}
};

soundBtn.onclick = () => {
  soundEnabled = !soundEnabled;
  soundBtn.innerText = soundEnabled ? "🔊 Mute Audio" : "🔇 Unmute Audio";
  toggleDrawer(false);
};

toggleAuth.onclick = () => {
  isRegistering = !isRegistering;
  authTitle.innerText = isRegistering ? "REGISTER" : "ZACK360";
  authBtn.innerText = isRegistering ? "CREATE ACCOUNT" : "LOGIN";
  toggleAuth.innerText = isRegistering ? "Have an account? Login" : "Need an account? Register";
};

authBtn.onclick = async () => {
  const u = usernameIn.value.trim().toLowerCase();
  const p = passwordIn.value.trim();
  if(!u || !p) return alert("Fill all fields");
  const hashedP = await sha256(p);
  const userRef = ref(db, `users/${u}`);
  try {
    const snap = await get(userRef);
    if(isRegistering){
      if(snap.exists()) return alert("Username taken");
      await set(userRef, { password: hashedP, msgCount: 0, joined: serverTimestamp() });
      login(u);
    }else{
      if(!snap.exists() || snap.val().password !== hashedP) return alert("Invalid credentials");
      login(u);
    }
  } catch(e) { alert("Network Error"); }
};

function login(u){
  currentUser = u;
  document.getElementById('userDisplay').innerText = u.toUpperCase();
  document.getElementById('headerAvatar').innerText = u.charAt(0).toUpperCase();
  authScreen.classList.remove('active');
  appScreen.classList.add('active');
  setupPresence();
  initChat();
  initLeaderboard();
  initTyping();
}

function setupPresence(){
  const pRef = ref(db, `online/${currentUser}`);
  set(pRef, true);
  onDisconnect(pRef).remove();
  onValue(ref(db, 'online'), snap => {
    const data = snap.val();
    const count = data ? Object.keys(data).length : 1;
    document.getElementById('onlineCount').innerText = `${count} online`;
  });
}

function clearTypingState() {
  if(activeTypingRef) {
    remove(activeTypingRef);
    off(ref(db, `typing/${currentChan}`));
  }
  isTyping = false;
  clearTimeout(typingTimeout);
}

function initTyping(){
  clearTypingState();
  activeTypingRef = ref(db, `typing/${currentChan}/${currentUser}`);
  onDisconnect(activeTypingRef).remove();

  msgInput.oninput = () => {
    if(!isTyping) {
      set(activeTypingRef, true);
      isTyping = true;
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      remove(activeTypingRef);
      isTyping = false;
    }, 1800);
  };

  onValue(ref(db, `typing/${currentChan}`), snap => {
    const data = snap.val() || {};
    const typers = Object.keys(data).filter(k => k !== currentUser);
    typingArea.innerText = typers.length ? `${typers.join(', ')} is typing...` : '';
  });
}

document.getElementById('logoutBtn').onclick = () => location.reload();

document.querySelectorAll('.drawer-btn[data-chan]').forEach(btn => {
  btn.onclick = (e) => {
    clearTypingState();
    currentChan = e.target.dataset.chan;
    targetDM = null;
    activeMode = "chat";
    document.querySelectorAll('.drawer-btn[data-chan]').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    chatView.style.display = 'flex';
    lbView.style.display = 'none';
    chatControls.style.display = 'flex';
    toggleDrawer(false);
    initChat();
    initTyping();
  };
});

document.getElementById('drawerDmBtn').onclick = () => {
  const target = prompt("Enter username for DM:");
  if(!target) return;
  clearTypingState();
  activeMode = "dm";
  targetDM = target.toLowerCase();
  chatView.style.display = 'flex';
  lbView.style.display = 'none';
  chatControls.style.display = 'flex';
  toggleDrawer(false);
  initChat();
};

document.getElementById('drawerLbBtn').onclick = () => {
  chatView.style.display = 'none';
  lbView.style.display = 'flex';
  chatControls.style.display = 'none';
  toggleDrawer(false);
};

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

function linkify(text) {
  if (!text) return '';
  const cleanText = escapeHTML(text);
  const urlRegex = /(https?:\/\/[^\s<]+)/gi;
  return cleanText.replace(urlRegex, (url) => {
    const cleanUrl = url.replace(/[.,;!?]+$/, '');
    return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>`;
  });
}

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

document.getElementById('imgModal').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('imgModal').style.display = 'none';
};

document.getElementById('closeProfBtn').onclick = () => {
  document.getElementById('profileModal').style.display = 'none';
};

document.getElementById('headerAvatar').onclick = () => window.openProfile(currentUser);

window.openImg = src => {
  document.getElementById('modalImg').src = src;
  document.getElementById('imgModal').style.display = 'flex';
};

window.openProfile = async (u) => {
  selectedProfileUser = u;
  document.getElementById('profUser').innerText = u.toUpperCase();
  const snap = await get(ref(db, `users/${u}`));
  const data = snap.val() || {};
  document.getElementById('profMsgs').innerText = `Msgs: ${data.msgCount || 0}`;
  document.getElementById('profileModal').style.display = 'flex';
};

document.getElementById('dmBtn').onclick = () => {
  document.getElementById('profileModal').style.display = 'none';
  clearTypingState();
  activeMode = "dm";
  targetDM = selectedProfileUser;
  initChat();
};

function getDBPath(){
  if(activeMode === "dm"){
    const pair = [currentUser, targetDM].sort().join('_');
    return `dms/${pair}`;
  }
  return `channels/${currentChan}`;
}

chatView.addEventListener('click', (e) => {
  const avatar = e.target.closest('.msg-avatar, .msg-user');
  if (avatar && avatar.dataset.username) {
    window.openProfile(avatar.dataset.username);
  }
});

function initChat(){
  if(activeChatQuery) off(activeChatQuery);
  const path = getDBPath();
  activeChatQuery = query(ref(db, path), limitToLast(50));
  
  onValue(activeChatQuery, snap => {
    chatView.innerHTML = '';
    const data = snap.val();
    if(!data) return;
    Object.keys(data).forEach(id => {
      const m = data[id];
      const isMe = m.user === currentUser;
      const div = document.createElement('div');
      div.className = `msg-row ${isMe ? 'me' : ''}`;
      
      let mediaHtml = '';
      if(m.image) mediaHtml += `<img src="${m.image}" class="msg-img" onclick="window.openImg('${m.image}')">`;
      if(m.audio) mediaHtml += `<audio src="${m.audio}" controls class="msg-audio"></audio>`;

      const heartCount = m.reacts?.['❤️'] ? Object.keys(m.reacts['❤️']).length : 0;
      const fireCount = m.reacts?.['🔥'] ? Object.keys(m.reacts['🔥']).length : 0;
      const hasHeart = m.reacts?.['❤️']?.[currentUser] ? 'voted' : '';
      const hasFire = m.reacts?.['🔥']?.[currentUser] ? 'voted' : '';

      let rxHtml = `
        <div class="reactions">
          <button class="react-btn ${hasHeart}" onclick="window.addReact('${id}','❤️')">❤️ ${heartCount}</button>
          <button class="react-btn ${hasFire}" onclick="window.addReact('${id}','🔥')">🔥 ${fireCount}</button>
        </div>
      `;

      const avatarHtml = !isMe ? `<div class="msg-avatar" data-username="${escapeHTML(m.user)}">${escapeHTML(m.user.charAt(0).toUpperCase())}</div>` : '';

      div.innerHTML = `
        ${avatarHtml}
        <div class="msg-card">
          <div class="msg-header">
            <span class="msg-user" data-username="${escapeHTML(m.user)}">${escapeHTML(m.user)}</span>
            <span class="rank-tag">PRO</span>
          </div>
          <div class="msg-body">${m.text ? linkify(m.text) : ''}${mediaHtml}</div>
          ${rxHtml}
          <div class="msg-footer">
            <span class="msg-time">${formatTime(m.time)}</span>
            ${isMe ? '<span class="ticks">✓✓</span>' : ''}
          </div>
        </div>
      `;
      chatView.appendChild(div);
    });
    chatView.scrollTop = chatView.scrollHeight;
  });
}

window.addReact = async (msgId, emoji) => {
  const rRef = ref(db, `${getDBPath()}/${msgId}/reacts/${emoji}/${currentUser}`);
  const snap = await get(rRef);
  if(snap.exists()){ await remove(rRef); } else { await set(rRef, true); }
};

async function sendMessage(extraData = {}){
  const now = Date.now();
  if(now - lastMsgTime < 1500) return alert("Rate limit: Wait 1.5s");
  const text = msgInput.value.trim();
  if(!text && !extraData.image && !extraData.audio) return;
  msgInput.value = '';
  lastMsgTime = Date.now();
  clearTypingState();
  playAudio();
  await push(ref(db, getDBPath()), { user: currentUser, text: text, ...extraData, time: serverTimestamp() });
  const countRef = ref(db, `users/${currentUser}/msgCount`);
  const snap = await get(countRef);
  await set(countRef, (snap.val() || 0) + 1);
}

sendBtn.onclick = () => sendMessage();
msgInput.onkeypress = e => { if(e.key === 'Enter') sendMessage(); };

document.getElementById('gifBtn').onclick = () => {

    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p0eDZ3eXp4ZnByaXZhdGUmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/cE02lboc8JPO/giphy.gif",
    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p0eDZ3eXp4ZnByaXZhdGUmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/julfEI43BXY08/giphy.gif"
  ];

const audioRecBtn = document.getElementById('audioRecBtn');
audioRecBtn.onclick = async () => {
  if(!isRecording){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = ev => {
          if (validatePayloadSize(ev.target.result)) {
            sendMessage({ audio: ev.target.result });
          }
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start(250);
      isRecording = true;
      audioRecBtn.style.color = "var(--pink)";
    } catch(e){ alert("Mic permission denied"); }
  } else {
    if(mediaRecorder) mediaRecorder.stop();
    isRecording = false;
    audioRecBtn.style.color = "var(--neon)";
  }
};

imgInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxDim = 800;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      if (validatePayloadSize(dataUrl)) {
        sendMessage({ image: dataUrl });
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

function initLeaderboard(){
  const usersRef = ref(db, 'users');
  if (usersListenerRef) off(usersRef);
  
  usersListenerRef = onValue(usersRef, snap => {
    lbView.innerHTML = '';
    const data = snap.val();
    if(!data) return;
    const users = Object.keys(data).map(k => ({ name: k, count: data[k].msgCount || 0 }));
    users.sort((a,b) => b.count - a.count);
    users.forEach((u, i) => {
      const div = document.createElement('div');
      div.className = 'lb-item';
      
      const left = document.createElement('div');
      left.className = 'lb-left';
      
      const rank = document.createElement('span');
      rank.className = 'lb-rank';
      rank.textContent = `#${i+1}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.style.cssText = 'width:24px;height:24px;font-size:0.6rem';
      avatar.textContent = u.name.charAt(0).toUpperCase();
      avatar.addEventListener('click', () => window.openProfile(u.name));
      
      const name = document.createElement('span');
      name.className = 'lb-name';
      name.textContent = u.name;
      name.addEventListener('click', () => window.openProfile(u.name));
      
      left.append(rank, avatar, name);
      
      const count = document.createElement('span');
      count.className = 'lb-count';
      count.textContent = `${u.count} msgs`;
      
      div.append(left, count);
      lbView.appendChild(div);
    });
  });
}
