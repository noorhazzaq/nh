<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@zack360 - 8Bit Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
        }
        body {
            background-color: #1a1a1a;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 20px;
            image-rendering: pixelated;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #2a2a2a;
            border: 4px solid #00ff00;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            box-shadow: 8px 8px 0 #000;
        }
        h1 {
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            color: #ff00ff;
            text-shadow: 2px 2px #000;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            border: 2px solid #00ff00;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            font-size: 10px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message .user {
            color: #ff00ff;
        }
        .message .text {
            color: #00ff00;
        }
        .message .img-container {
            margin-top: 5px;
            max-width: 100%;
        }
        .message img {
            max-width: 100%;
            border: 2px solid #00ff00;
            image-rendering: pixelated;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 5px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background-color: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 10px;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #008800;
        }
        button {
            padding: 10px 15px;
            background-color: #ff00ff;
            color: #000;
            border: 2px solid #00ff00;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc00cc;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-btn {
            padding: 10px 15px;
            background-color: #00ff00;
            color: #000;
            border: 2px solid #ff00ff;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        #status {
            font-size: 8px;
            color: #ffff00;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>@ZACK360 8BIT CHAT</h1>
        <div id="chat-box"></div>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="username" placeholder="Nama Anda" maxlength="15">
                <button id="set-name-btn">SET</button>
            </div>
            <div class="input-row">
                <input type="text" id="message-input" placeholder="Taip mesej..." maxlength="200">
                <button id="send-btn">HANTAR</button>
            </div>
            <div class="input-row">
                <div class="file-input-wrapper">
                    <button class="file-btn">MUAT NAIK IMEJ</button>
                    <input type="file" id="image-input" accept="image/*">
                </div>
            </div>
        </div>
        <div id="status">Menyambung...</div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // ============================================
        // GANTIKAN KONFIGURASI DI BAWAH DENGAN PUNYA ANDA
        // ============================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "zack360-2b303",
            storageBucket: "zack360-2b303.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const usernameInput = document.getElementById('username');
        const setNameBtn = document.getElementById('set-name-btn');
        const imageInput = document.getElementById('image-input');
        const statusDiv = document.getElementById('status');

        let currentUser = localStorage.getItem('zack360_user') || '';

        if (currentUser) {
            usernameInput.value = currentUser;
            usernameInput.disabled = true;
            setNameBtn.disabled = true;
        }

        setNameBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                localStorage.setItem('zack360_user', name);
                currentUser = name;
                usernameInput.disabled = true;
                setNameBtn.disabled = true;
                statusDiv.textContent = `Log masuk sebagai ${name}`;
            }
        });

        // Sembang Teks
        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text && currentUser) {
                push(ref(db, 'chats'), {
                    user: currentUser,
                    text: text,
                    timestamp: serverTimestamp()
                });
                msgInput.value = '';
            } else if (!currentUser) {
                alert('Sila tetapkan nama anda dahulu.');
            }
        });

        // Fungsi Pemampatan Imej (Canvas)
        function compressImage(file, maxWidth, maxHeight) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Kualiti 0.6 untuk pastikan saiz kecil
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // Sembang Imej (Simpan Base64 ke Realtime Database)
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) {
                if (!currentUser) alert('Sila tetapkan nama anda dahulu.');
                return;
            }

            statusDiv.textContent = 'Memproses imej...';
            try {
                // Mampatkan imej kepada maksimum 600px (Saiz fail akan jadi sangat kecil)
                const base64Image = await compressImage(file, 600, 600);
                
                statusDiv.textContent = 'Menghantar ke pangkalan data...';
                push(ref(db, 'chats'), {
                    user: currentUser,
                    text: ' [Imej]',
                    imageUrl: base64Image, // Simpan sebagai teks Base64
                    timestamp: serverTimestamp()
                });
                statusDiv.textContent = 'Imej berjaya dihantar.';
            } catch (error) {
                console.error('Gagal memproses imej:', error);
                statusDiv.textContent = 'Gagal memproses imej.';
            }
            imageInput.value = '';
        });

        // Dengar sembang baru
        const chatsRef = ref(db, 'chats');
        onChildAdded(chatsRef, (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            const userSpan = document.createElement('span');
            userSpan.className = 'user';
            userSpan.textContent = `${data.user}: `;

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = data.text || '';

            msgDiv.appendChild(userSpan);
            msgDiv.appendChild(textSpan);

            if (data.imageUrl) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'img-container';
                const img = document.createElement('img');
                img.src = data.imageUrl;
                img.loading = 'lazy';
                imgContainer.appendChild(img);
                msgDiv.appendChild(imgContainer);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        statusDiv.textContent = 'Bersambung ke Firebase...';
    </script>
</body>
</html>
