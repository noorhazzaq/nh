/* ============================================================
   STATE
============================================================ */
const STORAGE_KEY = 'html-studio-v2';
let currentLang = 'html';
let files = { html: DEFAULT.html, css: DEFAULT.css, js: DEFAULT.js };
let settings = { theme:'dark', fontSize:12.5, tabSize:2, wrap:false, autorun:true, delay:350 };
let updateTimer = null, saveTimer = null, toastTimer = null;
let consoleLogs = [];
let consoleFilter = 'all';

/* ============================================================
   DOM
============================================================ */
const $ = id => document.getElementById(id);
const codeEl = $('code'), gutterEl = $('gutter'), previewEl = $('preview');
const appEl = $('app');
const tabs = document.querySelectorAll('.tab');
const consoleEl = $('console'), consoleBody = $('consoleBody');
const badgeAll = $('badgeAll'), badgeErr = $('badgeErr');
const toastEl = $('toast'), saveIndicator = $('saveIndicator');
const statusPos = $('statusPos'), statusCount = $('statusCount'), statusLang = $('statusLang');
const editorPaneEl = $('editorPane'), previewPaneEl = $('previewPane');
const dividerEl = $('divider');
const mobileSegs = document.querySelectorAll('#mobileNav .seg');

/* ============================================================
   STORAGE
============================================================ */
function persist(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ files, settings })); } catch(e){}
}
function restore(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.files) Object.assign(files, d.files);
    if (d.settings) Object.assign(settings, d.settings);
  } catch(e){}
}
function markSaving(){ saveIndicator.className='save-indicator saving'; saveIndicator.textContent='Menulis…'; }
function markSaved(){ saveIndicator.className='save-indicator saved'; saveIndicator.textContent='Disimpan'; }

/* ============================================================
   EDITOR HELPERS
============================================================ */
function updateGutter(){
  const lines = codeEl.value.split('\n').length;
  const pos = codeEl.selectionStart || 0;
  const activeLine = codeEl.value.slice(0, pos).split('\n').length;
  let html = '';
  for (let i=1; i<=lines; i++){
    html += '<div' + (i===activeLine ? ' class="active"' : '') + '>' + i + '</div>';
  }
  gutterEl.innerHTML = html;
  gutterEl.scrollTop = codeEl.scrollTop;
}
function updateStatus(){
  const val = codeEl.value;
  const pos = codeEl.selectionStart || 0;
  const before = val.slice(0, pos);
  const line = before.split('\n').length;
  const col = pos - before.lastIndexOf('\n');
  statusPos.textContent = 'Ln ' + line + ', Col ' + col;
  statusCount.textContent = val.length + ' aksara';
  statusLang.textContent = currentLang.toUpperCase();
}
function syncScroll(){ gutterEl.scrollTop = codeEl.scrollTop; }

function switchTab(lang){
  if (lang === currentLang) return;
  files[currentLang] = codeEl.value;
  currentLang = lang;
  tabs.forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
  codeEl.value = files[lang] || '';
  codeEl.scrollTop = 0;
  updateGutter();
  updateStatus();
  codeEl.focus();
}

/* ============================================================
   SAFE EMBED — escape </script> and </style> in user code
============================================================ */
function safeEndTags(s){
  return String(s).replace(/<\/(script|style)/gi, '<\\/$1');
}

function buildHTML(){
  return `<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
${safeEndTags(files.css)}
</style>
</head>
<body>
${safeEndTags(files.html)}
<script>
(function(){
  function send(type,args){
    try{
      var payload = {__editor:true, type:type, msg:Array.prototype.map.call(args,function(a){
        if(a===null) return 'null';
        if(a===undefined) return 'undefined';
        if(a instanceof Error) return a.stack || (a.name+': '+a.message);
        if(typeof a==='object'){
          try{return JSON.stringify(a,null,2);}catch(e){return String(a);}
        }
        return String(a);
      }).join(' ')};
      parent.postMessage(payload,'*');
    }catch(e){}
  }
  ['log','warn','error','info'].forEach(function(t){
    var orig = console[t];
    console[t] = function(){ send(t,arguments); try{orig.apply(console,arguments);}catch(e){} };
  });
  window.addEventListener('error',function(e){
    send('error',[e.message+' (baris '+e.lineno+':'+e.colno+')']);
  });
  window.addEventListener('unhandledrejection',function(e){
    var r = e.reason;
    send('error',['Promise ditolak: '+(r && r.stack || r && r.message || r)]);
  });
})();
<\/script>
<script>
try {
${safeEndTags(files.js)}
} catch (e) {
  console.error(e.stack || (e.name+': '+e.message));
}
<\/script>
</body>
</html>`;
}

function runNow(){
  clearTimeout(updateTimer);
  files[currentLang] = codeEl.value;
  clearConsole(false);
  try { previewEl.srcdoc = buildHTML(); }
  catch(e){ addLog('error', 'Gagal menjana pratonton: ' + e.message); }
  persist();
}
function scheduleUpdate(){
  if (!settings.autorun) return;
  clearTimeout(updateTimer);
  updateTimer = setTimeout(runNow, settings.delay);
}
function scheduleSave(){
  markSaving();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ persist(); markSaved(); }, 700);
}

/* ============================================================
   CONSOLE
============================================================ */
window.addEventListener('message', function(e){
  if (e.source !== previewEl.contentWindow) return;
  const d = e.data;
  if (!d || !d.__editor) return;
  addLog(d.type, d.msg);
});

function addLog(type, msg){
  consoleLogs.push({ type: type, msg: msg, time: new Date() });
  renderConsole();
  updateConsoleBadges();
}
function renderConsole(){
  const filtered = consoleFilter === 'all'
    ? consoleLogs
    : consoleLogs.filter(l => l.type === 'error');
  consoleBody.innerHTML = '';
  if (!filtered.length){
    const empty = document.createElement('div');
    empty.style.cssText = 'color:var(--text-3);padding:20px;text-align:center;font-size:12px;';
    empty.textContent = 'Tiada log buat masa ini.';
    consoleBody.appendChild(empty);
    return;
  }
  for (const log of filtered){
    const line = document.createElement('div');
    line.className = 'log-line ' + (log.type === 'log' ? 'log' : log.type);
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = log.time.toTimeString().slice(0,8);
    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = log.msg;
    line.appendChild(time);
    line.appendChild(msg);
    consoleBody.appendChild(line);
  }
  consoleBody.scrollTop = consoleBody.scrollHeight;
}
function updateConsoleBadges(){
  badgeAll.textContent = consoleLogs.length;
  const errs = consoleLogs.filter(l => l.type === 'error').length;
  badgeErr.textContent = errs;
  badgeErr.classList.toggle('danger', errs > 0);
}
function clearConsole(rerender){
  consoleLogs = [];
  if (rerender !== false){ renderConsole(); updateConsoleBadges(); }
  else { updateConsoleBadges(); }
}

/* ============================================================
   TOAST
============================================================ */
function toast(msg, type){
  type = type || '';
  toastEl.className = '';
  if (type) toastEl.classList.add(type);
  const icon = type === 'success' ? ICONS.check : type === 'error' ? ICONS.error : ICONS.info;
  toastEl.innerHTML = icon + '<span>' + msg + '</span>';
  requestAnimationFrame(function(){
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  });
}

/* ============================================================
   ACTIONS
============================================================ */
function downloadHTML(){
  files[currentLang] = codeEl.value;
  const blob = new Blob([buildHTML()], { type:'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'halaman-saya.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Fail HTML dimuat turun', 'success');
}
function copyHTML(){
  files[currentLang] = codeEl.value;
  const text = buildHTML();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(function(){ toast('HTML disalin', 'success'); })
      .catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    const ok = document.execCommand('copy');
    toast(ok ? 'HTML disalin' : 'Gagal menyalin', ok ? 'success' : 'error');
  } catch(e){ toast('Gagal menyalin', 'error'); }
  document.body.removeChild(ta);
}
function importHTML(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html,.htm,text/html';
  input.onchange = function(e){
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function(){
      const text = String(reader.result);
      const styles = [], scripts = [];
      let rest = text
        .replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, function(_, css){ styles.push(css); return ''; })
        .replace(/<script[^>]*>([\s\S]*?)<\/script>/gi, function(_, js){ scripts.push(js); return ''; });
      const bodyMatch = rest.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      let body = bodyMatch ? bodyMatch[1] : rest;
      body = body.replace(/<!DOCTYPE[^>]*>/gi,'').replace(/<head[^>]*>[\s\S]*?<\/head>/gi,'').trim();

      files.html = body;
      files.css = styles.join('\n\n');
      files.js = scripts.join('\n\n');
      codeEl.value = files[currentLang];
      updateGutter();
      updateStatus();
      runNow();
      toast('Fail diimport', 'success');
    };
    reader.readAsText(f);
  };
  input.click();
}
function clearAll(){
  if (!confirm('Kosongkan semua kod dan pulihkan contoh asal?')) return;
  files = { html: DEFAULT.html, css: DEFAULT.css, js: DEFAULT.js };
  codeEl.value = files[currentLang];
  updateGutter();
  updateStatus();
  runNow();
  toast('Editor dikosongkan', 'success');
}
function loadTemplate(key){
  const t = TEMPLATES[key];
  if (!t) return;
  files = { html: t.html, css: t.css, js: t.js };
  codeEl.value = files[currentLang];
  updateGutter();
  updateStatus();
  runNow();
  toast('Templat dimuatkan', 'success');
}
function loadNew(){
  files = { html:'', css:'', js:'' };
  codeEl.value = '';
  updateGutter();
  updateStatus();
  runNow();
  toast('Fail baharu dicipta', 'success');
}

/* ============================================================
   SETTINGS
============================================================ */
function applySettings(){
  appEl.setAttribute('data-theme', settings.theme);
  codeEl.style.fontSize = settings.fontSize + 'px';
  gutterEl.style.fontSize = settings.fontSize + 'px';
  codeEl.style.tabSize = String(settings.tabSize);
  codeEl.style.MozTabSize = String(settings.tabSize);
  codeEl.classList.toggle('wrap', settings.wrap);

  const moon = document.querySelector('#btnTheme .icon-moon');
  const sun  = document.querySelector('#btnTheme .icon-sun');
  if (moon) moon.style.display = settings.theme === 'dark' ? 'block' : 'none';
  if (sun)  sun.style.display  = settings.theme === 'light' ? 'block' : 'none';

  document.querySelectorAll('#segTheme button').forEach(function(b){
    b.classList.toggle('active', b.dataset.value === settings.theme);
  });
  document.querySelectorAll('#segTabSize button').forEach(function(b){
    b.classList.toggle('active', String(b.dataset.value) === String(settings.tabSize));
  });

  const fs = $('setFontSize'); if (fs) fs.value = settings.fontSize;
  const vfs = $('valFontSize'); if (vfs) vfs.textContent = settings.fontSize + 'px';
  const dl = $('setDelay'); if (dl) dl.value = settings.delay;
  const vdl = $('valDelay'); if (vdl) vdl.textContent = settings.delay + 'ms';
  const sw = $('setWrap'); if (sw) sw.setAttribute('aria-checked', String(settings.wrap));
  const sa = $('setAutorun'); if (sa) sa.setAttribute('aria-checked', String(settings.autorun));

  persist();
}

/* ============================================================
   COMMAND PALETTE
============================================================ */
const COMMANDS = [
  { id:'run',       label:'Jalankan kod',                 icon:'play',     kbd:'Ctrl Enter', fn: runNow },
  { id:'refresh',   label:'Muat semula pratonton',         icon:'refresh',  fn: runNow },
  { id:'download',  label:'Muat turun HTML',               icon:'download', kbd:'Ctrl S', fn: downloadHTML },
  { id:'copy',      label:'Salin HTML',                    icon:'copy',     fn: copyHTML },
  { id:'new',       label:'Fail baharu',                   icon:'file',     fn: loadNew },
  { id:'import',    label:'Import HTML',                   icon:'download', fn: importHTML },
  { id:'clear',     label:'Kosongkan editor',              icon:'trash',    fn: clearAll },
  { id:'theme',     label:'Tukar tema (gelap/cerah)',      icon:'palette',  fn: function(){ toggleTheme(); } },
  { id:'settings',  label:'Buka tetapan',                  icon:'settings', kbd:'Ctrl ,', fn: function(){ openDrawer('settings'); } },
  { id:'shortcuts', label:'Pintasan papan kekunci',        icon:'keyboard', kbd:'?', fn: function(){ openOverlay('shortcuts'); } },
  { id:'tab-html',  label:'Tukar ke tab HTML',             icon:'code',     kbd:'Alt 1', fn: function(){ switchTab('html'); } },
  { id:'tab-css',   label:'Tukar ke tab CSS',              icon:'code',     kbd:'Alt 2', fn: function(){ switchTab('css'); } },
  { id:'tab-js',    label:'Tukar ke tab JavaScript',       icon:'code',     kbd:'Alt 3', fn: function(){ switchTab('js'); } },
  { id:'console',   label:'Buka/tutup konsol',             icon:'code',     kbd:'Ctrl J', fn: toggleConsole },
  { id:'tpl-card',  label:'Templat: Kad ucapan',           icon:'sparkle',  fn: function(){ loadTemplate('card'); } },
  { id:'tpl-form',  label:'Templat: Borang log masuk',     icon:'sparkle',  fn: function(){ loadTemplate('form'); } },
  { id:'tpl-anim',  label:'Templat: Animasi Canvas',       icon:'sparkle',  fn: function(){ loadTemplate('anim'); } },
  { id:'tpl-game',  label:'Templat: Permainan kecil',      icon:'sparkle',  fn: function(){ loadTemplate('game'); } }
];

let paletteSelected = 0;
let paletteItems = [];

function openPalette(){
  const p = $('palette');
  if (p.classList.contains('open')) { closePalette(); return; }
  p.classList.add('open');
  $('paletteInput').value = '';
  renderPalette('');
  setTimeout(function(){ $('paletteInput').focus(); }, 50);
}
function closePalette(){ $('palette').classList.remove('open'); }

function renderPalette(query){
  const q = String(query || '').toLowerCase().trim();
  paletteItems = COMMANDS.filter(function(c){ return c.label.toLowerCase().indexOf(q) !== -1; });
  paletteSelected = 0;
  const list = $('paletteList');
  list.innerHTML = '';
  if (!paletteItems.length){
    list.innerHTML = '<div class="palette-empty">Tiada arahan sepadan.</div>';
    return;
  }
  paletteItems.forEach(function(c, i){
    const el = document.createElement('div');
    el.className = 'palette-item' + (i === 0 ? ' selected' : '');
    el.innerHTML = ICONS[c.icon] + '<span>' + c.label + '</span>' +
      (c.kbd ? '<span class="kbd-hint">' + c.kbd + '</span>' : '');
    el.addEventListener('click', function(){ closePalette(); c.fn(); });
    el.addEventListener('mousemove', function(){
      paletteSelected = i;
      list.querySelectorAll('.palette-item').forEach(function(x, j){
        x.classList.toggle('selected', j === i);
      });
    });
    list.appendChild(el);
  });
}
function paletteNavigate(dir){
  const items = $('paletteList').querySelectorAll('.palette-item');
  if (!items.length) return;
  paletteSelected = (paletteSelected + dir + items.length) % items.length;
  items.forEach(function(x, i){ x.classList.toggle('selected', i === paletteSelected); });
  items[paletteSelected].scrollIntoView({ block:'nearest' });
}

/* ============================================================
   OVERLAY / DRAWER / MISC
============================================================ */
function openOverlay(id){ $(id).classList.add('open'); }
function closeOverlay(id){ $(id).classList.remove('open'); }
function openDrawer(id){ $(id).classList.add('open'); }
function closeDrawer(id){ $(id).classList.remove('open'); }
function toggleTheme(){
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  applySettings();
  toast('Tema: ' + (settings.theme === 'dark' ? 'Gelap' : 'Cerah'));
}
function toggleConsole(){
  consoleEl.classList.toggle('open');
  if (window.matchMedia('(max-width:820px)').matches){
    if (consoleEl.classList.contains('open')) setMobileView('console');
    else setMobileView('preview');
  }
}
function closeAllDropdowns(){
  document.querySelectorAll('.dropdown.open').forEach(function(d){ d.classList.remove('open'); });
  const b = $('btnBrand'); if (b) b.classList.remove('open');
}

/* ============================================================
   MOBILE NAV
============================================================ */
function isMobile(){ return window.matchMedia('(max-width:820px)').matches; }

function setMobileView(view){
  mobileSegs.forEach(function(s){ s.classList.toggle('active', s.dataset.view === view); });
  if (!isMobile()){
    editorPaneEl.classList.remove('hidden');
    previewPaneEl.classList.remove('hidden');
    return;
  }
  if (view === 'editor'){
    editorPaneEl.classList.remove('hidden');
    previewPaneEl.classList.add('hidden');
    consoleEl.classList.remove('open');
  } else if (view === 'preview'){
    editorPaneEl.classList.add('hidden');
    previewPaneEl.classList.remove('hidden');
    consoleEl.classList.remove('open');
  } else if (view === 'console'){
    editorPaneEl.classList.add('hidden');
    previewPaneEl.classList.remove('hidden');
    consoleEl.classList.add('open');
  }
}
mobileSegs.forEach(function(seg){
  seg.addEventListener('click', function(){ setMobileView(seg.dataset.view); });
});

/* ============================================================
   DIVIDER DRAG
============================================================ */
let dragging = false;
function onDown(e){
  if (e.button !== undefined && e.button !== 0) return;
  dragging = true;
  dividerEl.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  if (e.cancelable) e.preventDefault();
}
function onMove(e){
  if (!dragging) return;
  const main = document.getElementById('main');
  const rect = main.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  let pct = ((cx - rect.left) / rect.width) * 100;
  pct = Math.max(20, Math.min(80, pct));
  editorPaneEl.style.flex = '0 0 ' + pct + '%';
  previewPaneEl.style.flex = '1 1 auto';
  if (e.cancelable) e.preventDefault();
}
function onUp(){
  if (!dragging) return;
  dragging = false;
  dividerEl.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
}
dividerEl.addEventListener('mousedown', onDown);
dividerEl.addEventListener('touchstart', onDown, { passive: false });
document.addEventListener('mousemove', onMove);
document.addEventListener('touchmove', onMove, { passive: false });
document.addEventListener('mouseup', onUp);
document.addEventListener('touchend', onUp);
document.addEventListener('touchcancel', onUp);

/* ============================================================
   EVENT BINDINGS
============================================================ */
// Brand menu
$('btnBrand').addEventListener('click', function(e){
  e.stopPropagation();
  const m = $('brandMenu');
  const isOpen = m.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen){ m.classList.add('open'); $('btnBrand').classList.add('open'); }
});
$('btnMore').addEventListener('click', function(e){
  e.stopPropagation();
  const m = $('moreMenu');
  const isOpen = m.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen) m.classList.add('open');
});
document.addEventListener('click', function(){ closeAllDropdowns(); });

// All data-action buttons
document.querySelectorAll('[data-action]').forEach(function(btn){
  btn.addEventListener('click', function(){
    const a = btn.dataset.action;
    closeAllDropdowns();
    switch(a){
      case 'new': loadNew(); break;
      case 'import': importHTML(); break;
      case 'download': downloadHTML(); break;
      case 'copy': copyHTML(); break;
      case 'clear': clearAll(); break;
      case 'templates':
        openPalette();
        $('paletteInput').value = 'templat';
        renderPalette('templat');
        break;
      case 'refresh': runNow(); toast('Pratonton dimuat semula'); break;
      case 'console': toggleConsole(); break;
      case 'shortcuts': openOverlay('shortcuts'); break;
    }
  });
});

// Tabs
tabs.forEach(function(t){ t.addEventListener('click', function(){ switchTab(t.dataset.lang); }); });

// Editor
codeEl.addEventListener('input', function(){
  files[currentLang] = codeEl.value;
  updateGutter();
  updateStatus();
  scheduleUpdate();
  scheduleSave();
});
codeEl.addEventListener('scroll', syncScroll);
codeEl.addEventListener('keyup', updateStatus);
codeEl.addEventListener('click', updateStatus);
codeEl.addEventListener('keydown', function(e){
  if (e.key === 'Tab'){
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    const sp = new Array(settings.tabSize + 1).join(' ');
    codeEl.value = codeEl.value.substring(0, s) + sp + codeEl.value.substring(en);
    codeEl.selectionStart = codeEl.selectionEnd = s + settings.tabSize;
    files[currentLang] = codeEl.value;
    updateGutter();
    scheduleUpdate();
    scheduleSave();
  }
});

// Topbar
$('btnRun').addEventListener('click', function(){ runNow(); toast('Kod dijalankan', 'success'); });
$('btnTheme').addEventListener('click', toggleTheme);
$('btnSettings').addEventListener('click', function(){ openDrawer('settings'); });
$('btnPalette').addEventListener('click', openPalette);

// Preview
$('btnRefresh').addEventListener('click', function(){ runNow(); toast('Pratonton dimuat semula'); });
$('btnExternal').addEventListener('click', function(){
  files[currentLang] = codeEl.value;
  const blob = new Blob([buildHTML()], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
});
$('btnFullscreen').addEventListener('click', function(){
  const el = $('previewPane');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

// Console
$('btnClearConsole').addEventListener('click', function(){ clearConsole(); });
$('btnCloseConsole').addEventListener('click', function(){
  consoleEl.classList.remove('open');
  if (isMobile()) setMobileView('editor');
});
document.querySelectorAll('.console-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.console-tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    consoleFilter = tab.dataset.filter;
    renderConsole();
  });
});

// Settings
$('btnCloseSettings').addEventListener('click', function(){ closeDrawer('settings'); });
$('segTheme').addEventListener('click', function(e){
  const b = e.target.closest('button'); if (!b) return;
  settings.theme = b.dataset.value; applySettings();
});
$('segTabSize').addEventListener('click', function(e){
  const b = e.target.closest('button'); if (!b) return;
  settings.tabSize = parseInt(b.dataset.value, 10); applySettings();
});
$('setFontSize').addEventListener('input', function(e){
  settings.fontSize = parseFloat(e.target.value); applySettings();
});
$('setDelay').addEventListener('input', function(e){
  settings.delay = parseInt(e.target.value, 10); applySettings();
});
$('setWrap').addEventListener('click', function(){ settings.wrap = !settings.wrap; applySettings(); });
$('setAutorun').addEventListener('click', function(){ settings.autorun = !settings.autorun; applySettings(); });

// Shortcuts modal
$('btnCloseShortcuts').addEventListener('click', function(){ closeOverlay('shortcuts'); });

// Palette
$('paletteInput').addEventListener('input', function(e){ renderPalette(e.target.value); });
$('paletteInput').addEventListener('keydown', function(e){
  if (e.key === 'ArrowDown'){ e.preventDefault(); paletteNavigate(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); paletteNavigate(-1); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    const c = paletteItems[paletteSelected];
    if (c){ closePalette(); c.fn(); }
  }
});
$('palette').addEventListener('click', function(e){
  if (e.target.id === 'palette') closePalette();
});

// Overlay backdrop
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click', function(e){
    if (e.target === o) o.classList.remove('open');
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e){
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); return; }
  if (mod && e.key === 'Enter'){ e.preventDefault(); runNow(); toast('Kod dijalankan', 'success'); return; }
  if (mod && e.key.toLowerCase() === 's'){ e.preventDefault(); downloadHTML(); return; }
  if (mod && e.altKey && e.key === '1'){ e.preventDefault(); switchTab('html'); return; }
  if (mod && e.altKey && e.key === '2'){ e.preventDefault(); switchTab('css'); return; }
  if (mod && e.altKey && e.key === '3'){ e.preventDefault(); switchTab('js'); return; }
  if (mod && e.key.toLowerCase() === 'j'){ e.preventDefault(); toggleConsole(); return; }
  if (mod && e.key === ','){ e.preventDefault(); openDrawer('settings'); return; }

  if (e.key === '?' && !mod){
    const t = e.target;
    if (t && t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA'){
      e.preventDefault(); openOverlay('shortcuts');
    }
  }
  if (e.key === 'Escape'){
    closeAllDropdowns();
    closePalette();
    closeOverlay('shortcuts');
    closeDrawer('settings');
  }
});

// Resize — pastikan keadaan pane konsisten
let resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if (!isMobile()){
      editorPaneEl.classList.remove('hidden');
      previewPaneEl.classList.remove('hidden');
    } else {
      const active = document.querySelector('#mobileNav .seg.active');
      setMobileView(active ? active.dataset.view : 'editor');
    }
  }, 120);
});

/* ============================================================
   INIT
============================================================ */
function init(){
  restore();
  applySettings();
  codeEl.value = files[currentLang] || '';
  updateGutter();
  updateStatus();
  clearConsole();
  runNow();

  if (isMobile()) setMobileView('editor');

  setTimeout(function(){ toast('Editor sedia — selamat mengekod!', 'success'); }, 400);
}
init();

/* ============================================================
   BEFORE UNLOAD
============================================================ */
window.addEventListener('beforeunload', function(){
  files[currentLang] = codeEl.value;
  persist();
});

})();
</script>
