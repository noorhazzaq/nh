<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>NEOCHAT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f}
body{display:flex;justify-content:center;align-items:center}
#app{width:100%;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 30%,#14141e,#08080c);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,255,200,0.08)}
#app::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(0,255,200,0.01)30px,rgba(0,200,255,0.01)60px);pointer-events:none}
.glow-ring{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.25;animation:breath 4s ease-in-out infinite alternate}
.glow-ring:nth-child(1){width:70%;height:70%;top:-20%;left:-20%;background:conic-gradient(from 0deg,#0ff,#f0f,#0ff);animation-delay:0s}
.glow-ring:nth-child(2){width:50%;height:50%;bottom:-10%;right:-10%;background:conic-gradient(from 180deg,#f0f,#0ff,#f0f);animation-delay:2s}
@keyframes breath{0%{transform:scale(0.9)rotate(0deg);opacity:0.2}100%{transform:scale(1.3)rotate(15deg);opacity:0.35}}
header{position:relative;z-index:10;padding:14px 18px;background:rgba(10,10,18,0.55);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,255,210,0.2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
header h1{font-weight:300;font-size:1.3rem;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(135deg,#0ff,#a0f,#0ff);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;text-shadow:0 0 20px rgba(0,255,200,0.3)}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.user-badge{display:flex;align-items:center;gap:10px;color:#8cf;font-size:0.8rem;font-weight:300}
.user-badge span{background:rgba(0,255,200,0.08);padding:4px 14px;border-radius:40px;border:1px solid rgba(0,255,200,0.25);backdrop-filter:blur(4px);letter-spacing:0.5px}
#messages{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:5;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-track{background:transparent}
#messages::-webkit-scrollbar-thumb{background:rgba(0,255,210,0.3);border-radius:20px}
.msg{margin-bottom:4px;padding:10px 16px;border-radius:20px;max-width:84%;word-break:break-word;font-size:0.95rem;line-height:1.4;animation:fadeUp 0.25s ease;position:relative;border:1px solid transparent;backdrop-filter:blur(2px)}
.msg.self{align-self:flex-end;background:rgba(0,255,210,0.08);border-color:rgba(0,255,210,0.25);color:#bffff0;border-bottom-right-radius:4px;box-shadow:0 0 20px rgba(0,255,200,0.05)}
.msg.other{align-self:flex-start;background:rgba(180,0,255,0.06);border-color:rgba(180,0,255,0.2);color:#e0d0ff;border-bottom-left-radius:4px;box-shadow:0 0 20px rgba(180,0,255,0.05)}
.msg .name{font-size:0.65rem;font-weight:400;letter-spacing:0.5px;opacity:0.6;margin-bottom:2px;text-transform:uppercase;color:#8cf}
.msg .time{font-size:0.55rem;opacity:0.3;float:right;margin-left:12px;margin-top:4px}
@keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
#input-area{position:relative;z-index:10;padding:10px 14px 16px;background:rgba(10,10,18,0.5);backdrop-filter:blur(14px);border-top:1px solid rgba(0,255,210,0.12);display:flex;gap:10px;align-items:center;flex-shrink:0}
#input-area input{flex:1;padding:12px 18px;border-radius:60px;border:1px solid rgba(0,255,210,0.2);background:rgba(0,20,20,0.5);color:#c8fff0;font-size:0.95rem;outline:none;transition:0.25s;backdrop-filter:blur(4px);letter-spacing:0.3px}
#input-area input::placeholder{color:rgba(180,220,255,0.3);font-weight:300}
#input-area input:focus{border-color:#0ff;box-shadow:0 0 30px rgba(0,255,200,0.06),inset 0 0 20px rgba(0,255,200,0.03)}
#send-btn{background:linear-gradient(135deg,#0cf,#a0f);border:none;width:50px;height:50px;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:1.6rem;font-weight:200;cursor:pointer;transition:0.2s;box-shadow:0 0 30px rgba(0,200,255,0.15);border:1px solid rgba(255,255,255,0.08);flex-shrink:0}
#send-btn:active{transform:scale(0.92);opacity:0.7}
#status{text-align:center;font-size:0.6rem;letter-spacing:1px;color:rgba(0,255,210,0.2);padding:4px 0 2px;background:transparent;position:relative;z-index:5}
@media(max-width:380px){header h1{font-size:1rem}.msg{font-size:0.85rem;padding:8px 12px}}
@media(min-width:600px){#app{max-width:440px;border-radius:28px;box-shadow:0 0 80px rgba(0,255,200,0.06)}}
</style>
</head>
<body>
<div id="app">
<div class="glow-ring"></div>
<div class="glow-ring"></div>
<header>
<h1>✦ NEOCHAT</h1>
<div class="user-badge"><span id="user-label">● ANON</span></div>
</header>
<div id="messages"></div>
<div id="input-area">
<input id="msg-input" type="text" placeholder="ENTER MESSAGE" autocomplete="off">
<button id="send-btn">➤</button>
</div>
<div id="status">⚡ LIVE · BREATHING METALLIC</div>
</div>
<script>
(function(){
const DB_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
const MSG_PATH='messages';
let username='ANON_'+Math.random().toString(36).substring(2,6).toUpperCase();
document.getElementById('user-label').textContent='● '+username;

const messagesDiv=document.getElementById('messages');
const inputEl=document.getElementById('msg-input');
const sendBtn=document.getElementById('send-btn');

let lastMsgCount=0;
let isFirstLoad=true;

function getTimestamp(){return Date.now();}

function formatTime(ts){const d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

function renderMessage(data,key){
const div=document.createElement('div');
div.className='msg '+(data.user===username?'self':'other');
const nameSpan=document.createElement('div');
nameSpan.className='name';
nameSpan.textContent=data.user||'unknown';
const textSpan=document.createElement('span');
textSpan.textContent=data.text||'';
const timeSpan=document.createElement('span');
timeSpan.className='time';
timeSpan.textContent=data.ts?formatTime(data.ts):'';
div.appendChild(nameSpan);
div.appendChild(textSpan);
div.appendChild(timeSpan);
div.dataset.key=key;
return div;
}

function appendMessage(data,key){
const el=renderMessage(data,key);
messagesDiv.appendChild(el);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

function fetchMessages(){
fetch(DB_URL+MSG_PATH+'.json')
.then(r=>{if(!r.ok)throw new Error('DB fetch fail');return r.json();})
.then(data=>{
if(!data){if(isFirstLoad){messagesDiv.innerHTML='';}return;}
const keys=Object.keys(data);
if(keys.length===0){if(isFirstLoad){messagesDiv.innerHTML='';}return;}
const sorted=keys.sort((a,b)=> (data[a].ts||0) - (data[b].ts||0));
const currentKeys=new Set();
sorted.forEach(k=>currentKeys.add(k));
if(isFirstLoad){
messagesDiv.innerHTML='';
sorted.forEach(k=>{
const item=data[k];
if(item&&item.text&&item.user){
appendMessage(item,k);
}
});
lastMsgCount=sorted.length;
isFirstLoad=false;
return;
}
const existing=Array.from(messagesDiv.querySelectorAll('.msg')).map(el=>el.dataset.key);
const existingSet=new Set(existing);
const newKeys=sorted.filter(k=>!existingSet.has(k));
if(newKeys.length>0){
newKeys.forEach(k=>{
const item=data[k];
if(item&&item.text&&item.user){
appendMessage(item,k);
}
});
lastMsgCount=sorted.length;
}
if(sorted.length<lastMsgCount){
messagesDiv.innerHTML='';
sorted.forEach(k=>{
const item=data[k];
if(item&&item.text&&item.user){
appendMessage(item,k);
}
});
lastMsgCount=sorted.length;
}
})
.catch(e=>{console.warn('fetch error',e);});
}

function pushMessage(text){
if(!text||text.trim()==='')return;
const payload={user:username,text:text.trim(),ts:getTimestamp()};
fetch(DB_URL+MSG_PATH+'.json',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(payload)
})
.then(r=>{if(!r.ok)throw new Error('push fail');return r.json();})
.then(()=>{inputEl.value='';inputEl.focus();fetchMessages();})
.catch(e=>{console.warn('send error',e);});
}

function handleSend(){
const raw=inputEl.value;
if(raw.trim()==='')return;
pushMessage(raw);
}

sendBtn.addEventListener('click',handleSend);
inputEl.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();handleSend();}});

let pollInterval=null;

function startPolling(){
fetchMessages();
if(pollInterval)clearInterval(pollInterval);
pollInterval=setInterval(fetchMessages,1800);
}

function blockNonAndroid(){
const ua=navigator.userAgent||'';
const isAndroid=/android/i.test(ua);
if(!isAndroid){
document.body.innerHTML='<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0f;color:#0ff;font-family:sans-serif;padding:20px;text-align:center;flex-direction:column;"><span style="font-size:3rem;margin-bottom:16px;">⛔</span><h2 style="font-weight:300;letter-spacing:2px;">ANDROID ONLY</h2><p style="opacity:0.4;font-size:0.9rem;margin-top:8px;">this terminal is optimized for android</p></div>';
return false;
}
return true;
}

if(!blockNonAndroid()){
throw new Error('non-android blocked');
}

startPolling();

window.addEventListener('beforeunload',function(){
if(pollInterval)clearInterval(pollInterval);
});

inputEl.focus();

})();
</script>
</body>
</html>
