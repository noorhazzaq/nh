<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI LOGIC · 999</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;min-height:100dvh;background:#080b12;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;touch-action:manipulation}
#game{width:100%;max-width:500px;padding:10px;margin:auto;display:flex;flex-direction:column;gap:10px}
#screen{background:#111a24;border:2px solid #2a3f55;border-radius:20px;padding:18px 14px;min-height:38vh;box-shadow:0 6px 0 #0a111a;display:flex;flex-direction:column;justify-content:space-between}
#story{color:#c8dcee;font-size:clamp(0.9rem,3.8vw,1.25rem);line-height:1.7;text-shadow:0 1px 0 #1d2a38;word-break:break-word;white-space:pre-wrap}
#stats{display:flex;justify-content:space-between;color:#6e8aa0;font-size:clamp(0.65rem,2.2vw,0.85rem);border-top:1px solid #233242;padding-top:10px;margin-top:10px;letter-spacing:0.2px}
.stat span{color:#aac8e0;font-weight:bold}
#choices{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.choice-btn{background:#1b2737;border:2px solid #314a62;border-radius:50px;padding:13px 16px;color:#d4e6f5;font-size:clamp(0.85rem,3vw,1.05rem);font-weight:600;text-align:left;transition:all 0.04s ease;box-shadow:0 4px 0 #0d1520;letter-spacing:0.3px;touch-action:manipulation;cursor:pointer;width:100%;font-family:inherit}
.choice-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d1520;background:#293c50;border-color:#4a6a88}
.choice-btn:disabled{opacity:0.25;transform:translateY(2px);box-shadow:0 2px 0 #0d1520;pointer-events:none}
#reset-area{display:flex;justify-content:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.reset-btn{background:transparent;border:1px solid #314a62;border-radius:40px;padding:9px 20px;color:#6e8aa0;font-size:clamp(0.65rem,1.8vw,0.8rem);font-weight:500;letter-spacing:0.8px;transition:0.08s;touch-action:manipulation;cursor:pointer;font-family:inherit}
.reset-btn:active{background:#17232f;color:#aac8e0;border-color:#4a6a88}
.hidden{display:none !important}
#ai-badge{color:#3a5a78;font-size:clamp(0.55rem,1.5vw,0.7rem);text-align:center;letter-spacing:2px;margin-top:2px}
</style>
</head>
<body>
<div id="game">
<div id="screen">
<div id="story">⟡  AI LOGIC MACHINE  ⟡<br>999 formula active</div>
<div id="stats"><div>❤️ <span id="hp">10</span></div><div>🧠 <span id="ending">0</span>/999</div><div>⚙️ <span id="flag">0</span></div></div>
</div>
<div id="choices"></div>
<div id="reset-area"><button class="reset-btn" id="reset-btn">⟲ RESET</button><button class="reset-btn" id="logic-btn">⚡ LOGIC</button></div>
<div id="ai-badge">AI · DETERMINISTIC 999</div>
</div>
<script>
(function(){
const storyEl=document.getElementById('story');
const hpEl=document.getElementById('hp');
const endingEl=document.getElementById('ending');
const flagEl=document.getElementById('flag');
const choicesEl=document.getElementById('choices');
const resetBtn=document.getElementById('reset-btn');
const logicBtn=document.getElementById('logic-btn');

// --- deterministic 999 formula (no random) ---
const ENDING_WORDS = ['Fate','Void','Star','Ash','Echo','Rift','Soul','Crown','Frost','Flux'];
function generateEndingTitle(n){
const w=ENDING_WORDS[n % 10];
return `#${n} · ${w}${n}`;
}

// AI logic machine: deterministic path generator
function aiLogic(ending, hp, flag){
// formula: (ending * 7 + flag * 13 + hp * 3) % 20 → deterministic choice index
const idx = (ending * 7 + flag * 13 + hp * 3) % 20;
const pool = [
'analyze pattern','compute trajectory','optimize path','decode glyph','simulate future',
'calibrate flux','map anomaly','sync matrix','purge noise','engage core',
'filter signal','amplify echo','stabilize rift','quantize soul','crown iteration',
'frost compile','flux override','recurse timeline','branch entropy','merge causality'
];
return pool[idx];
}

// deterministic HP delta (no random)
function hpDelta(ending, flag){
return ((ending * 3 + flag * 7) % 5) - 2; // -2,-1,0,1,2
}

// deterministic bonus/penalty (no random)
function conditionalMod(ending){
let mod=0;
if(ending % 3 === 0) mod += 1;
if(ending % 7 === 0) mod -= 2;
if(ending % 11 === 0) mod += 2;
if(ending % 13 === 0) mod -= 1;
return mod;
}

// 999 formula: deterministic progression
function nextState(state){
let {hp, ending, flag, path} = state;
if(ending >= 999) return state;

// deterministic choice label (AI logic)
const choice = aiLogic(ending, hp, flag);

// deterministic HP change
let delta = hpDelta(ending, flag);
delta += conditionalMod(ending);
hp = Math.max(0, Math.min(12, hp + delta));

// flag update: deterministic hash (no random)
flag = (flag * 31 + choice.length * 7 + ending * 3) % 99 + 1;

// ending increment (capped)
ending = Math.min(999, ending + 1);

// push choice to path
path.push(choice);

return {hp, ending, flag, path};
}

// --- state management ---
let state = {hp:10, ending:0, flag:1, path:[]};

function getEndingFragment(){
if(state.ending === 999) return '✦ ALL 999 FORMULAS RESOLVED ✦';
if(state.ending > 800) return '⚡ NEARING LOGIC COMPLETION';
if(state.ending > 500) return '⟡ DEEP RECURSION ACTIVE';
if(state.ending > 100) return '⟡ MATRIX EXPANDING';
if(state.ending > 20) return '⟡ PATTERN EMERGING';
return '⟡ INITIALIZING LOGIC';
}

function renderScene(){
hpEl.textContent=state.hp;
endingEl.textContent=state.ending;
flagEl.textContent=state.flag;

const title = state.ending === 999 ? '✦ FINAL ✦' : generateEndingTitle(state.ending);
const frag = getEndingFragment();
let desc = '';
if(state.ending === 999) desc = 'All 999 logic gates aligned. Infinite loop resolved.';
else if(state.ending > 800) desc = 'Causality woven. 99% formula complete.';
else if(state.ending > 500) desc = 'Recursive depth exceeds threshold.';
else if(state.ending > 100) desc = 'AI logic machines expanding decision space.';
else if(state.ending > 20) desc = 'Deterministic paths converging.';
else desc = 'Initializing 999-formula engine.';

if(state.hp <= 0){
desc = '⚠️ LOGIC OVERFLOW · SYSTEM RESET REQUIRED';
}

storyEl.textContent = `⟡ ${title} ⟡\n${frag}\n${desc}`;

choicesEl.innerHTML='';
if(state.hp <= 0){
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent='⟳ RESTART LOGIC';
btn.addEventListener('click', resetGame);
choicesEl.appendChild(btn);
renderAIStatus();
return;
}

if(state.ending >= 999){
storyEl.textContent='✦  ALL 999 FORMULAS  ✦\nDeterministic logic complete.\nAll paths resolved.';
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent='⟳ BEGIN NEW CYCLE';
btn.addEventListener('click', resetGame);
choicesEl.appendChild(btn);
renderAIStatus();
return;
}

// deterministic choice (AI logic machine)
const next = nextState(state);
const choiceLabel = next.path[next.path.length-1] || 'compute';
const btn=document.createElement('button');
btn.className='choice-btn';
btn.textContent=`▶ ${choiceLabel}`;
btn.addEventListener('click', ()=>{
if(state.hp <= 0 || state.ending >= 999) return;
// apply deterministic transition
const newState = nextState(state);
state.hp = newState.hp;
state.ending = newState.ending;
state.flag = newState.flag;
state.path = newState.path;
renderScene();
});
choicesEl.appendChild(btn);
renderAIStatus();
}

function renderAIStatus(){
// show deterministic formula preview
if(state.ending < 999 && state.hp > 0){
const preview = aiLogic(state.ending, state.hp, state.flag);
const delta = hpDelta(state.ending, state.flag) + conditionalMod(state.ending);
const deltaStr = delta > 0 ? `+${delta}` : `${delta}`;
document.getElementById('ai-badge').textContent = `AI · next: ${preview}  |  δHP: ${deltaStr}  |  F: ${state.flag}`;
} else {
document.getElementById('ai-badge').textContent = 'AI · DETERMINISTIC 999 · COMPLETE';
}
}

function resetGame(){
state = {hp:10, ending:0, flag:1, path:[]};
renderScene();
}

// manual logic step (for demonstration)
function stepLogic(){
if(state.hp <= 0 || state.ending >= 999) return;
const newState = nextState(state);
state.hp = newState.hp;
state.ending = newState.ending;
state.flag = newState.flag;
state.path = newState.path;
renderScene();
}

// --- android-only block ---
function blockNonAndroid(){
const ua=navigator.userAgent||navigator.vendor||window.opera;
if(/android/i.test(ua))return;
document.body.innerHTML='<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#080b12;color:#5a7a92;font-family:monospace;font-size:1.3rem;padding:2rem;text-align:center;">⛔  ANDROID-ONLY LOGIC ENGINE</div>';
document.body.style.margin='0';document.body.style.padding='0';
}
blockNonAndroid();

// event binding
resetBtn.addEventListener('click', resetGame);
logicBtn.addEventListener('click', stepLogic);

// error containment (enterprise)
window.addEventListener('error', function(e){ e.preventDefault(); resetGame(); return true; });
window.addEventListener('unhandledrejection', function(e){ e.preventDefault(); resetGame(); return true; });

// init
resetGame();
})();
</script>
</body>
</html>
