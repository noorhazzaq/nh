<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Realtime Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center justify-between z-10">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 p-2 rounded-lg"><i class="fa-solid me-1 fa-comments text-xl"></i></div>
      <div>
        <h1 class="text-lg font-bold tracking-wide">ProStream Chat</h1>
        <div class="flex items-center text-xs text-green-400 font-medium space-x-1">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
          <span id="activeCount">1 User Online</span>
        </div>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-3">
      <button id="adminBtn" onclick="toggleAdminModal()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-shield-halved"></i>
        <span id="adminBtnLabel">Admin Unlock</span>
      </button>
      <button onclick="exportChatLog()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition" title="Export Chat Log">
        <i class="fa-solid fa-file-export"></i>
        <span>Export Log</span>
      </button>
      <button onclick="toggleRoster()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 p-2 rounded-lg text-sm transition md:hidden" title="Toggle Active Users">
        <i class="fa-solid fa-users"></i>
      </button>
    </div>
  </header>

  <!-- MAIN APP BODY -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- CHAT & DM AREA -->
    <div class="flex-1 flex flex-col bg-gray-900 overflow-hidden">
      
      <!-- CHAT TABS BAR -->
      <div id="tabBar" class="bg-gray-800/60 border-b border-gray-700/80 px-4 pt-2 flex space-x-1 overflow-x-auto">
        <button onclick="switchTab('global')" id="tab-global" class="px-4 py-2 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 bg-gray-800 rounded-t-lg flex items-center space-x-2">
          <i class="fa-solid fa-globe"></i>
          <span># global-room</span>
        </button>
        <!-- Dynamic DM tabs appended here -->
      </div>

      <!-- ACTIVE POLL CONTAINER (Sticky Banner if poll active) -->
      <div id="activePollContainer" class="hidden bg-indigo-950/80 border-b border-indigo-700/50 p-4 text-sm">
        <div class="max-w-2xl mx-auto flex flex-col space-y-2">
          <div class="flex justify-between items-center">
            <span class="font-bold text-indigo-300 flex items-center space-x-2">
              <i class="fa-solid fa-poll"></i>
              <span id="pollQuestion">Active Community Poll</span>
            </span>
            <span id="pollTotalVotes" class="text-xs text-indigo-400">0 votes</span>
          </div>
          <div id="pollOptionsList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-1"></div>
        </div>
      </div>

      <!-- MESSAGES VIEWPORT -->
      <div id="messageViewport" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Infinite Scroll Sentinel / Load More -->
        <div class="text-center">
          <button onclick="loadMoreMessages()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-gray-200 px-3 py-1 rounded-full border border-gray-700 transition">
            <i class="fa-solid fa-arrows-up-down"></i> Load Older Messages
          </button>
        </div>
        <div id="messagesList" class="space-y-4"></div>
      </div>

      <!-- GIF PICKER MODAL (FLOATING) -->
      <div id="gifPicker" class="hidden absolute bottom-20 left-4 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-3 w-80 z-20">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Search GIFs</span>
          <button onclick="toggleGifPicker()" class="text-gray-400 hover:text-gray-200 text-sm">&times;</button>
        </div>
        <input type="text" id="gifSearchInput" oninput="searchGifs(this.value)" placeholder="Search Tenor GIFs..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500 mb-2">
        <div id="gifResults" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto">
          <!-- GIF thumbs dynamically populated -->
        </div>
      </div>

      <!-- INPUT BAR -->
      <div class="bg-gray-800 border-t border-gray-700 p-3">
        <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex flex-col space-y-2">
          <div class="flex items-center space-x-2">
            <button type="button" onclick="toggleGifPicker()" class="p-2 text-gray-400 hover:text-indigo-400 hover:bg-gray-700 rounded-lg transition" title="Send GIF">
              <i class="fa-solid fa-file-video text-lg"></i>
            </button>
            <button type="button" id="voiceNoteBtn" onclick="toggleVoiceRecording()" class="p-2 text-gray-400 hover:text-red-400 hover:bg-gray-700 rounded-lg transition" title="Record Voice Note">
              <i class="fa-solid fa-microphone text-lg"></i>
            </button>
            <input type="text" id="messageInput" placeholder="Message #global-room... (Supports **bold**, `code`, YouTube links)" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center space-x-2 transition shadow-lg shadow-indigo-600/30">
              <span>Send</span>
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </div>
          <!-- Recording Indicator -->
          <div id="recordingStatus" class="hidden flex items-center space-x-2 text-xs text-red-400 font-semibold px-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
            <span id="recordingTimer">Recording... 0:00</span>
          </div>
        </form>
      </div>
    </div>

    <!-- ACTIVE USER ROSTER SIDEBAR -->
    <aside id="rosterSidebar" class="w-64 bg-gray-800/90 border-l border-gray-700 flex flex-col transition-all duration-300 transform md:transform-none absolute md:relative right-0 top-0 bottom-0 z-10 translate-x-full md:translate-x-0">
      <div class="p-4 border-b border-gray-700 flex justify-between items-center">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Online Members</h2>
        <span id="rosterBadge" class="bg-indigo-600/30 text-indigo-400 text-xs px-2 py-0.5 rounded-full font-bold">1</span>
      </div>
      <div id="userRosterList" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- User list dynamically populated -->
      </div>
    </aside>

  </div>

  <!-- ADMIN / POLL CREATION MODAL -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl w-full max-w-md p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-user-shield text-amber-500"></i>
          <span>Admin Authentication</span>
        </h3>
        <button onclick="toggleAdminModal()" class="text-gray-400 hover:text-white">&times;</button>
      </div>

      <!-- Auth Screen -->
      <div id="adminAuthSection" class="space-y-3">
        <p class="text-xs text-gray-400">Please enter the administrator key to unlock privileged actions for <strong>Zack</strong>.</p>
        <input type="password" id="adminKeyInput" placeholder="Enter Admin Secret Key (Default: zack123)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500">
        <button onclick="authenticateAdmin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded-lg text-sm transition">Verify Key</button>
      </div>

      <!-- Admin Actions Panel (Hidden until authed) -->
      <div id="adminPanelSection" class="hidden space-y-4">
        <div class="bg-green-950/50 border border-green-800/50 p-2.5 rounded-lg text-xs text-green-300 flex items-center space-x-2">
          <i class="fa-solid fa-circle-check"></i>
          <span>Authenticated as <strong>Zack (Administrator)</strong></span>
        </div>

        <!-- Poll Creation Form -->
        <div class="space-y-3 border-t border-gray-700 pt-3">
          <h4 class="text-sm font-semibold text-gray-200">Create Live Realtime Poll</h4>
          <input type="text" id="pollQuestionInput" placeholder="Poll Question (e.g., Preferred Stack?)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-indigo-500">
          <input type="text" id="pollOptionsInput" placeholder="Options separated by commas (e.g. React, Vue, Svelte)" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-indigo-500">
          <button onclick="createPoll()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg text-sm transition">Push Live Poll</button>
        </div>
      </div>
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    // --- APP STATE ---
    let currentUser = "Guest_" + Math.floor(1000 + Math.random() * 9000);
    let isAdminAuthenticated = false;
    let activeTab = "global"; // "global" or username for DM
    let recordingInterval = null;
    let recordingSeconds = 0;
    let isRecording = false;

    // Simulated Active Users Database
    let activeUsers = [
      { name: "Zack", status: "Admin", isOnline: true },
      { name: "Sarah_Dev", status: "Member", isOnline: true },
      { name: "Alex99", status: "Member", isOnline: true }
    ];

    // Simulated Message Storage
    let chatData = {
      global: [
        {
          id: 1,
          sender: "Zack",
          text: "Welcome everyone! Check out our new video review: https://www.youtube.com/watch?v=dQw4w9WgXcQ",
          time: "10:14 AM",
          status: "read",
          type: "text"
        },
        {
          id: 2,
          sender: "Sarah_Dev",
          text: "Love the new formatting! You can write **bold code** like `const x = 100;` easily now.",
          time: "10:15 AM",
          status: "read",
          type: "text"
        }
      ]
    };

    // Active Poll State
    let activePoll = null;

    // Profanity Filter Dictionary
    const BANNED_WORDS = ["badword1", "spam", "abuse", "phishing"];

    // --- INITIALIZATION ---
    window.addEventListener("DOMContentLoaded", () => {
      // Add current user to active roster if missing
      if (!activeUsers.find(u => u.name === currentUser)) {
        activeUsers.push({ name: currentUser, status: "You", isOnline: true });
      }
      renderRoster();
      renderTabMessages();
    });

    // --- USER ROSTER & DM TABS ---
    function renderRoster() {
      const list = document.getElementById("userRosterList");
      document.getElementById("rosterBadge").innerText = activeUsers.length;
      document.getElementById("activeCount").innerText = `${activeUsers.length} Users Online`;

      list.innerHTML = activeUsers.map(u => `
        <div onclick="openDirectMessage('${u.name}')" class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-700/60 cursor-pointer transition group">
          <div class="flex items-center space-x-2.5">
            <div class="relative">
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xs text-white">
                ${u.name.substring(0,2).toUpperCase()}
              </div>
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full ${u.isOnline ? 'bg-green-500' : 'bg-gray-500'} border-2 border-gray-800"></span>
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-200 group-hover:text-indigo-400 transition">${u.name} ${u.name === currentUser ? '<span class="text-gray-500 font-normal">(You)</span>' : ''}</p>
              <p class="text-[10px] text-gray-400">${u.status}</p>
            </div>
          </div>
          ${u.name !== currentUser ? `<i class="fa-solid fa-comment-dots text-xs text-gray-500 group-hover:text-indigo-400"></i>` : ''}
        </div>
      `).join('');
    }

    function toggleRoster() {
      const sidebar = document.getElementById("rosterSidebar");
      sidebar.classList.toggle("translate-x-full");
    }

    function openDirectMessage(targetUser) {
      if (targetUser === currentUser) return;
      if (!chatData[targetUser]) chatData[targetUser] = [];
      
      // Ensure tab exists
      if (!document.getElementById(`tab-${targetUser}`)) {
        const tabBar = document.getElementById("tabBar");
        const button = document.createElement("button");
        button.id = `tab-${targetUser}`;
        button.onclick = () => switchTab(targetUser);
        button.className = "px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 bg-gray-800/40 rounded-t-lg flex items-center space-x-2";
        button.innerHTML = `<i class="fa-solid fa-user"></i><span>@${targetUser}</span>`;
        tabBar.appendChild(button);
      }
      switchTab(targetUser);
    }

    function switchTab(tabKey) {
      activeTab = tabKey;
      document.querySelectorAll("#tabBar button").forEach(btn => {
        btn.classList.remove("border-indigo-500", "text-indigo-400", "bg-gray-800");
        btn.classList.add("border-transparent", "text-gray-400", "bg-gray-800/40");
      });
      const activeBtn = document.getElementById(`tab-${tabKey}`);
      if (activeBtn) {
        activeBtn.classList.add("border-indigo-500", "text-indigo-400", "bg-gray-800");
        activeBtn.classList.remove("border-transparent", "text-gray-400", "bg-gray-800/40");
      }
      document.getElementById("messageInput").placeholder = tabKey === "global" ? "Message #global-room..." : `Direct message @${tabKey}...`;
      renderTabMessages();
    }

    // --- MESSAGE RENDERING & PARSERS ---
    function renderTabMessages() {
      const list = document.getElementById("messagesList");
      const messages = chatData[activeTab] || [];
      
      list.innerHTML = messages.map(msg => {
        const isSelf = msg.sender === currentUser;
        return `
          <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
            <div class="flex items-baseline space-x-2 mb-1">
              <span class="text-xs font-bold text-gray-400">${msg.sender}</span>
              <span class="text-[10px] text-gray-500">${msg.time}</span>
            </div>
            <div class="max-w-md ${isSelf ? 'bg-indigo-600 text-white rounded-l-xl rounded-tr-xl' : 'bg-gray-800 text-gray-100 rounded-r-xl rounded-tl-xl'} p-3 shadow-md border border-gray-700/50">
              ${renderMessageContent(msg)}
            </div>
            <div class="text-[10px] text-gray-500 mt-0.5 flex items-center space-x-1">
              <span>${msg.status === 'read' ? 'Seen' : 'Delivered'}</span>
              <i class="fa-solid fa-check-double ${msg.status === 'read' ? 'text-indigo-400' : 'text-gray-500'}"></i>
            </div>
          </div>
        `;
      }).join('');

      const viewport = document.getElementById("messageViewport");
      viewport.scrollTop = viewport.scrollHeight;
    }

    function renderMessageContent(msg) {
      if (msg.type === "voice") {
        return `
          <div class="flex items-center space-x-3 py-1">
            <button onclick="playVoiceAudio(this)" class="bg-indigo-800 hover:bg-indigo-700 text-white p-2.5 rounded-full transition">
              <i class="fa-solid fa-play text-xs"></i>
            </button>
            <div class="flex-1">
              <div class="h-2 bg-indigo-950/60 rounded-full overflow-hidden w-32">
                <div class="h-full bg-indigo-300 w-1/3"></div>
              </div>
              <span class="text-[10px] opacity-75 mt-1 block">Voice Note (${msg.duration || '0:05'})</span>
            </div>
            <select onchange="this.previousElementSibling.firstElementChild.playbackRate = this.value" class="bg-gray-900/60 text-[10px] text-gray-300 rounded px-1 py-0.5 border border-gray-700 focus:outline-none">
              <option value="1">1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        `;
      }

      if (msg.type === "gif") {
        return `<img src="${msg.text}" alt="GIF" class="rounded-lg max-w-full h-auto max-h-48" />`;
      }

      // Rich Text & URL Auto-Parsing
      let parsed = filterProfanity(msg.text);

      // Markdown: **bold**
      parsed = parsed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Markdown: `code`
      parsed = parsed.replace(/`(.*?)`/g, '<code class="bg-gray-900/80 text-amber-300 px-1.5 py-0.5 rounded text-xs">$1</code>');

      // YouTube Embed Auto-Parser
      const ytMatch = parsed.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        const videoId = ytMatch[1];
        parsed += `
          <div class="mt-2 rounded-lg overflow-hidden border border-gray-700 aspect-video">
            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      }

      return `<div class="text-sm leading-relaxed">${parsed}</div>`;
    }

    function filterProfanity(text) {
      let filtered = text;
      BANNED_WORDS.forEach(word => {
        const regex = new RegExp(`\\b${word}\\b`, 'gi');
        filtered = filtered.replace(regex, '****');
      });
      return filtered;
    }

    // --- MESSAGE SENDING ---
    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      if (!chatData[activeTab]) chatData[activeTab] = [];

      chatData[activeTab].push({
        id: Date.now(),
        sender: currentUser,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        status: "sent",
        type: "text"
      });

      input.value = "";
      renderTabMessages();
    }

    // --- VOICE NOTES ---
    function toggleVoiceRecording() {
      const btn = document.getElementById("voiceNoteBtn");
      const status = document.getElementById("recordingStatus");
      const timer = document.getElementById("recordingTimer");

      if (!isRecording) {
        isRecording = true;
        btn.classList.add("text-red-500", "animate-pulse");
        status.classList.remove("hidden");
        recordingSeconds = 0;
        recordingInterval = setInterval(() => {
          recordingSeconds++;
          const mins = Math.floor(recordingSeconds / 60);
          const secs = recordingSeconds % 60;
          timer.innerText = `Recording... ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);
      } else {
        isRecording = false;
        clearInterval(recordingInterval);
        btn.classList.remove("text-red-500", "animate-pulse");
        status.classList.add("hidden");

        // Save Voice Note
        if (!chatData[activeTab]) chatData[activeTab] = [];
        chatData[activeTab].push({
          id: Date.now(),
          sender: currentUser,
          text: "",
          duration: `${Math.floor(recordingSeconds / 60)}:${recordingSeconds % 60 < 10 ? '0' : ''}${recordingSeconds % 60}`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: "sent",
          type: "voice"
        });
        renderTabMessages();
      }
    }

    function playVoiceAudio(btn) {
      const icon = btn.querySelector("i");
      if (icon.classList.contains("fa-play")) {
        icon.classList.remove("fa-play");
        icon.classList.add("fa-pause");
        setTimeout(() => {
          icon.classList.remove("fa-pause");
          icon.classList.add("fa-play");
        }, 3000);
      } else {
        icon.classList.remove("fa-pause");
        icon.classList.add("fa-play");
      }
    }

    // --- GIF PICKER INTEGRATION ---
    const MOCK_GIFS = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3E1cHBvYzh5dThyc3dtNDRzbTh6a3YxczN5MndocXU3cmc3M3hhZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0HlA3L9Myd93N2X6/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnAzaDVtdnF6eXJvODRhcnAxdmVrbXlyYm1xZW10cjAwbzh0OHU3OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26ufdipQqU2lhNA4g/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnAxaW8wOWk4MW9icWZveGdzcGp6ZmppYmljcW45MDR1M3Z1dnExOCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oKIPnAiaMCws8nOsE/giphy.gif"
    ];

    function toggleGifPicker() {
      const picker = document.getElementById("gifPicker");
      picker.classList.toggle("hidden");
      if (!picker.classList.contains("hidden")) {
        searchGifs("");
      }
    }

    function searchGifs(query) {
      const container = document.getElementById("gifResults");
      container.innerHTML = MOCK_GIFS.map(url => `
        <img src="${url}" onclick="sendGif('${url}')" class="rounded-lg h-20 w-full object-cover cursor-pointer hover:opacity-80 transition border border-gray-700" />
      `).join('');
    }

    function sendGif(url) {
      if (!chatData[activeTab]) chatData[activeTab] = [];
      chatData[activeTab].push({
        id: Date.now(),
        sender: currentUser,
        text: url,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        status: "sent",
        type: "gif"
      });
      toggleGifPicker();
      renderTabMessages();
    }

    // --- ADMIN AUTH & POLLS ---
    function toggleAdminModal() {
      const modal = document.getElementById("adminModal");
      modal.classList.toggle("hidden");
    }

    function authenticateAdmin() {
      const key = document.getElementById("adminKeyInput").value;
      if (key === "zack123" || key === "admin") {
        isAdminAuthenticated = true;
        currentUser = "Zack";
        document.getElementById("adminAuthSection").classList.add("hidden");
        document.getElementById("adminPanelSection").classList.remove("hidden");
        document.getElementById("adminBtnLabel").innerText = "Admin: Zack";
        renderRoster();
      } else {
        alert("Invalid Admin Key! Access Denied.");
      }
    }

    function createPoll() {
      const question = document.getElementById("pollQuestionInput").value;
      const optionsRaw = document.getElementById("pollOptionsInput").value;
      if (!question || !optionsRaw) return;

      const options = optionsRaw.split(",").map((opt, idx) => ({ id: idx, text: opt.trim(), votes: 0 }));
      activePoll = { question, options, totalVotes: 0, votedUsers: [] };

      renderPoll();
      toggleAdminModal();
    }

    function renderPoll() {
      const container = document.getElementById("activePollContainer");
      if (!activePoll) {
        container.classList.add("hidden");
        return;
      }

      container.classList.remove("hidden");
      document.getElementById("pollQuestion").innerText = activePoll.question;
      document.getElementById("pollTotalVotes").innerText = `${activePoll.totalVotes} votes`;

      const optionsList = document.getElementById("pollOptionsList");
      optionsList.innerHTML = activePoll.options.map(opt => {
        const pct = activePoll.totalVotes > 0 ? Math.round((opt.votes / activePoll.totalVotes) * 100) : 0;
        return `
          <button onclick="votePoll(${opt.id})" class="relative bg-gray-900 border border-indigo-800/80 rounded-lg p-2 text-left hover:border-indigo-500 transition overflow-hidden">
            <div class="absolute inset-0 bg-indigo-600/20" style="width: ${pct}%"></div>
            <div class="relative flex justify-between items-center text-xs text-gray-200">
              <span class="font-medium">${opt.text}</span>
              <span class="text-indigo-300 font-bold">${pct}% (${opt.votes})</span>
            </div>
          </button>
        `;
      }).join('');
    }

    function votePoll(optionId) {
      if (!activePoll) return;
      if (activePoll.votedUsers.includes(currentUser)) {
        alert("You have already voted in this poll!");
        return;
      }
      activePoll.options[optionId].votes++;
      activePoll.totalVotes++;
      activePoll.votedUsers.push(currentUser);
      renderPoll();
    }

    // --- UTILITIES ---
    function loadMoreMessages() {
      alert("Fetched 20 older paginated messages from archive.");
    }

    function exportChatLog() {
      const log = JSON.stringify(chatData, null, 2);
      const blob = new Blob([log], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `chat_export_${Date.now()}.json`;
      a.click();
    }
  </script>
</body>
</html>
