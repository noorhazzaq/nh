<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tech Neon Chat</title>
<style>
:root{--bg:#030712;--neon:#00f3ff;--pink:#ff007f;--card:rgba(15,23,42,0.85);--border:rgba(0,243,255,0.3);--text:#e2e8f0;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
body,html{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}
#blocker{display:none;position:fixed;inset:0;background:#000;z-index:99999;justify-content:center;align-items:center;text-align:center;padding:20px;color:#ff4444;font-size:1.2rem;font-weight:bold;}
.screen{display:none;width:100vw;height:100vh;flex-direction:column;position:relative;z-index:10;}
.active{display:flex;}
.bg-glow{position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(0,243,255,0.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 4s infinite ease-in-out;}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.5;}50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.9;}}
.auth-box{margin:auto;width:90%;max-width:360px;padding:30px 20px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 0 20px rgba(0,243,255,0.2);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:15px;}
.auth-box h2{text-align:center;color:var(--neon);text-shadow:0 0 8px var(--neon);letter-spacing:2px;font-size:1.5rem;}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:#fff;outline:none;font-size:0.95rem;transition:0.3s;}
input:focus{border-color:var(--neon);box-shadow:0 0 10px rgba(0,243,255,0.5);}
button{width:100%;padding:12px;background:transparent;border:1px solid var(--neon);border-radius:8px;color:var(--neon);font-weight:bold;font-size:1rem;cursor:pointer;text-shadow:0 0 5px var(--neon);box-shadow:0 0 10px rgba(0,243,255,0.2);transition:0.2s;}
button:active{transform:scale(0.98);background:var(--neon);color:#000;}
.toggle-btn{background:none;border:none;box-shadow:none;color:var(--pink);text-shadow:0 0 5px var(--pink);font-size:0.85rem;}
header{height:60px;padding:0 15px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(10px);}
header h1{font-size:1.1rem;color:var(--neon);text-shadow:0 0 5px var(--neon);}
.tabs{display:flex;gap:10px;}
.tab-btn{width:auto;padding:6px 12px;font-size:0.8rem;}
.tab-btn.active-tab{background:var(--neon);color:#000;}
.content{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);font-size:0.9rem;word-break:break-word;position:relative;}
.msg.me{align-self:flex-end;border-color:var(--neon);box-shadow:0 0 8px rgba(0,243,255,0.15);background:rgba(0,243,255,0.05);}
.msg .user{font-size:0.75rem;color:var(--pink);margin-bottom:4px;font-weight:bold;}
.msg a{color:var(--neon);text-shadow:0 0 5px var(--neon);text-decoration:underline;}
.chat-input{padding:10px 15px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;}
.lb-item{padding:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
.lb-item .name{color:var(--neon);font-weight:bold;}
.lb-item .count{font-size:0.8rem;color:var(--pink);}
</style>
</head>
<body>
<div id="blocker">Access Restricted: Android Browsers Only</div>
<div class="bg-glow"></div>

<div id="authScreen" class="screen active">
  <div class="auth-box">
    <h2 id="authTitle">CYBER CHAT</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="authBtn">LOGIN</button>
    <button class="toggle-btn" id="toggleAuth">Need an account? Register</button>
  </div>
</div>

<div id="appScreen" class="screen">
  <header>
    <h1 id="userDisplay">USER</h1>
    <div class="tabs">
      <button class="tab-btn active-tab" id="chatTabBtn">Chat</button>
      <button class="tab-btn" id="lbTabBtn">Board</button>
      <button class="tab-btn" id="logoutBtn" style="border-color:var(--pink);color:var(--pink)">X</button>
    </div>
  </header>
  <div id="chatView" class="content"></div>
  <div id="lbView" class="content" style="display:none;"></div>
  <div id="chatControls" class="chat-input">
    <input type="text" id="msgInput" placeholder="Type neon message...">
    <button id="sendBtn" style="width:auto;padding:0 20px;">></button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

if (!/Android/i.test(navigator.userAgent)) {
  document.getElementById('blocker').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.remove());
}

const db = getDatabase(initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

let currentUser = null;
let isRegistering = false;

const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const usernameIn = document.getElementById('username');
const passwordIn = document.getElementById('password');
const authBtn = document.getElementById('authBtn');
const toggleAuth = document.getElementById('toggleAuth');
const authTitle = document.getElementById('authTitle');
const chatView = document.getElementById('chatView');
const lbView = document.getElementById('lbView');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const chatTabBtn = document.getElementById('chatTabBtn');
const lbTabBtn = document.getElementById('lbTabBtn');
const chatControls = document.getElementById('chatControls');

toggleAuth.onclick = () => {
  isRegistering = !isRegistering;
  authTitle.innerText = isRegistering ? "REGISTER" : "CYBER CHAT";
  authBtn.innerText = isRegistering ? "CREATE ACCOUNT" : "LOGIN";
  toggleAuth.innerText = isRegistering ? "Have an account? Login" : "Need an account? Register";
};

authBtn.onclick = async () => {
  const u = usernameIn.value.trim().toLowerCase();
  const p = passwordIn.value.trim();
  if(!u || !p) return alert("Fill all fields");
  const userRef = ref(db, `users/${u}`);
  const snap = await get(userRef);
  if(isRegistering){
    if(snap.exists()) return alert("User exists");
    await set(userRef, { password: p, msgCount: 0, joined: serverTimestamp() });
    login(u);
  }else{
    if(!snap.exists() || snap.val().password !== p) return alert("Invalid credentials");
    login(u);
  }
};

function login(u){
  currentUser = u;
  document.getElementById('userDisplay').innerText = u.toUpperCase();
  authScreen.classList.remove('active');
  appScreen.classList.add('active');
  initChat();
  initLeaderboard();
}

document.getElementById('logoutBtn').onclick = () => location.reload();

chatTabBtn.onclick = () => {
  chatView.style.display = 'flex';
  lbView.style.display = 'none';
  chatControls.style.display = 'flex';
  chatTabBtn.classList.add('active-tab');
  lbTabBtn.classList.remove('active-tab');
};

lbTabBtn.onclick = () => {
  chatView.style.display = 'none';
  lbView.style.display = 'flex';
  chatControls.style.display = 'none';
  lbTabBtn.classList.add('active-tab');
  chatTabBtn.classList.remove('active-tab');
};

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

function initChat(){
  onValue(ref(db, 'messages'), snap => {
    chatView.innerHTML = '';
    const data = snap.val();
    if(!data) return;
    Object.values(data).sort((a,b) => a.time - b.time).forEach(m => {
      const div = document.createElement('div');
      div.className = `msg ${m.user === currentUser ? 'me' : ''}`;
      div.innerHTML = `<div class="user">${m.user}</div><div>${linkify(m.text)}</div>`;
      chatView.appendChild(div);
    });
    chatView.scrollTop = chatView.scrollHeight;
  });
}

async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text) return;
  msgInput.value = '';
  await push(ref(db, 'messages'), { user: currentUser, text: text, time: serverTimestamp() });
  const countRef = ref(db, `users/${currentUser}/msgCount`);
  const snap = await get(countRef);
  await set(countRef, (snap.val() || 0) + 1);
}

sendBtn.onclick = sendMessage;
msgInput.onkeypress = e => { if(e.key === 'Enter') sendMessage(); };

function initLeaderboard(){
  onValue(ref(db, 'users'), snap => {
    lbView.innerHTML = '';
    const data = snap.val();
    if(!data) return;
    const users = Object.keys(data).map(k => ({ name: k, count: data[k].msgCount || 0 }));
    users.sort((a,b) => b.count - a.count);
    users.forEach((u, i) => {
      const div = document.createElement('div');
      div.className = 'lb-item';
      div.innerHTML = `<span class="name">#${i+1} ${u.name}</span><span class="count">${u.count} msgs</span>`;
      lbView.appendChild(div);
    });
  });
}
</script>
</body>
</html>
