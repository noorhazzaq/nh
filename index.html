<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universe with Voice & Media Chat</title>
  
  <!-- Firebase SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #03030a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
      position: relative;
      padding: 70px 10px 30px 10px;
      cursor: crosshair;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 3px solid transparent;
      border-image: linear-gradient(45deg, #c084fc, #38bdf8, #f472b6, #a855f7) 1;
      pointer-events: none;
      z-index: 100;
      animation: borderGlow 8s linear infinite;
    }

    @keyframes borderGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* Live Dynamic Clock Banner */
    .last-updated-banner {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(8px);
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .ambient-music-btn {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 30;
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #c084fc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .ambient-music-btn:hover {
      background: rgba(168, 85, 247, 0.45);
      transform: scale(1.05);
    }

    #space-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .nebula-1, .nebula-2 {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .nebula-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, rgba(0, 212, 255, 0.2) 50%, transparent 70%);
      filter: blur(75px);
      animation: float1 12s infinite ease-in-out alternate;
    }

    .nebula-2 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(147, 51, 234, 0.15) 50%, transparent 70%);
      filter: blur(70px);
      animation: float2 15s infinite ease-in-out alternate;
    }

    @keyframes float1 {
      0% { transform: translate(-80px, -60px) scale(0.9); }
      100% { transform: translate(60px, 70px) scale(1.2); }
    }

    @keyframes float2 {
      0% { transform: translate(70px, 80px) scale(1.1); }
      100% { transform: translate(-60px, -50px) scale(0.85); }
    }

    .ship-container {
      position: fixed;
      width: 70px; height: 70px;
      top: 18%; left: -100px;
      z-index: 3;
      cursor: pointer;
      animation: sailAcross 22s linear infinite;
    }

    .ship-svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
    }

    @keyframes sailAcross {
      0% { transform: translateX(0vw) translateY(0px) rotate(-6deg); }
      25% { transform: translateX(30vw) translateY(-35px) rotate(8deg); }
      50% { transform: translateX(60vw) translateY(25px) rotate(-8deg); }
      75% { transform: translateX(85vw) translateY(-20px) rotate(6deg); }
      100% { transform: translateX(calc(100vw + 150px)) translateY(0px) rotate(0deg); }
    }

    .astronaut-mascot {
      position: fixed;
      bottom: 25px; left: 20px;
      width: 55px; height: 55px;
      z-index: 25;
      font-size: 2.5rem;
      animation: floatAstronaut 4s ease-in-out infinite alternate;
      user-select: none;
      filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.6));
    }

    @keyframes floatAstronaut {
      0% { transform: translateY(0px) rotate(-5deg); }
      100% { transform: translateY(-18px) rotate(8deg); }
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      perspective: 1000px;
    }

    .card {
      background: rgba(15, 15, 30, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px) rotateX(2deg);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.35);
    }

    h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #c084fc, #38bdf8, #f472b6);
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    p {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .video-container {
      margin-top: 1rem;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .fortune-btn {
      margin-top: 12px;
      background: linear-gradient(135deg, #f472b6, #a855f7);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.4);
      transition: transform 0.1s ease;
    }

    .fortune-btn:active { transform: scale(0.95); }

    .chat-card {
      display: flex;
      flex-direction: column;
      height: 540px;
      text-align: left;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .chat-header h2 {
      font-size: 1.1rem;
      color: #38bdf8;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clear-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .online-indicator {
      font-size: 0.75rem;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .online-dot {
      width: 8px; height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
      margin-bottom: 8px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .chat-msg {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      word-wrap: break-word;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      animation: msgPop 0.3s ease-out;
    }

    @keyframes msgPop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .chat-msg:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .chat-msg .author {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .author-name {
      background: linear-gradient(90deg, #38bdf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .chat-msg .time {
      font-size: 0.65rem;
      color: #64748b;
    }

    .chat-msg .text { color: #f1f5f9; }

    .chat-msg img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .voice-note-card {
      margin-top: 6px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid rgba(244, 114, 182, 0.4);
      border-radius: 14px;
      padding: 8px 10px;
    }

    .voice-note-card audio {
      width: 100%; height: 36px;
      border-radius: 20px;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .action-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover { color: #f472b6; }

    .comments-wrapper {
      margin-top: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      padding-left: 8px;
      border-left: 2px solid rgba(56, 189, 248, 0.3);
    }

    .comments-wrapper.open { display: flex; }

    .comment-item {
      font-size: 0.75rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .comment-item span.c-author {
      font-weight: bold;
      color: #38bdf8;
      margin-right: 4px;
    }

    .comment-input-box {
      display: flex; gap: 6px; margin-top: 4px;
    }

    .comment-input-box input {
      flex: 1; padding: 4px 8px; font-size: 0.75rem;
      border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.5); color: white;
    }

    .comment-input-box button {
      background: #38bdf8; border: none; color: #000;
      font-weight: bold; font-size: 0.7rem; padding: 4px 8px;
      border-radius: 6px; cursor: pointer;
    }

    .typing-indicator {
      font-size: 0.7rem;
      color: #94a3b8;
      height: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 4px;
      visibility: hidden;
    }

    .typing-indicator.active { visibility: visible; }

    .dots { display: flex; gap: 3px; }
    .dots span {
      width: 4px; height: 4px; background: #38bdf8;
      border-radius: 50%; animation: blink 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

    .emoji-palette {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 8px;
    }

    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .emoji-btn:hover { transform: scale(1.3); }

    .chat-form { display: flex; flex-direction: column; gap: 8px; }
    .chat-inputs { display: flex; gap: 8px; }

    input[type="text"] {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    #username-input { width: 32%; }
    #message-input { flex: 1; }

    .chat-actions-row { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .recording {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(244, 114, 182, 0.8)) !important;
    }

    button.send-btn {
      flex: 1;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      border: none; color: white; padding: 8px 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }

    .floating-heart {
      position: fixed;
      font-size: 1.8rem;
      pointer-events: none;
      z-index: 99;
      animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.6); }
    }
  </style>
</head>
<body>

  <!-- Live Dynamic Updating Banner -->
  <div class="last-updated-banner" id="live-clock">
    🕒 Loading Time...
  </div>

  <button class="ambient-music-btn" id="music-btn">🎵 Cosmic Audio: OFF</button>

  <canvas id="space-canvas"></canvas>

  <div class="nebula-1"></div>
  <div class="nebula-2"></div>

  <div class="astronaut-mascot" title="Cosmic Floating Buddy">👨‍🚀</div>

  <div class="ship-container" id="space-ship" title="Click to fire cosmic lasers!">
    <svg class="ship-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 42 L52 42 L44 54 L20 54 Z" fill="#8B4513" stroke="#5D2E0A" stroke-width="1.5"/>
      <rect x="31" y="8" width="2" height="34" fill="#A0522D"/>
      <path d="M33 12 L48 25 L33 38 Z" fill="#F0F8FF" stroke="#DCDCDC" stroke-width="1"/>
      <path d="M30 14 L16 38 L30 38 Z" fill="#F0F8FF" stroke="#DCDCDC" stroke-width="1"/>
      <path d="M31 8 L18 4 L31 0 Z" fill="#FF2222" stroke="#CC0000" stroke-width="1"/>
    </svg>
  </div>

  <div class="main-container">
    <div class="card">
      <h1>Terima Kasih Haji Abu Kassim!</h1>
      <p>Welcome to the merrier cosmic hub! Explore the chat and trigger space effects!</p>

      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/mnN866eQQFs" 
          title="Jalur Gemilang (Video Lirik)" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>

      <button class="fortune-btn" onclick="spinFortune()">🔮 Spin Daily Cosmic Fortune</button>
    </div>

    <div class="card chat-card">
      <div class="chat-header">
        <h2>🌌 Global Cosmic Chat</h2>
        <div class="chat-header-actions">
          <button id="clear-chat-btn" class="clear-btn">Clear</button>
          
          <!-- Real-time IP-based Visitor Counter -->
          <div class="online-indicator">
            <div class="online-dot"></div>
            <span id="visitor-count">Detecting IP...</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages"></div>

      <div class="typing-indicator" id="typing-indicator">
        <span id="typing-user">Someone</span> is typing
        <div class="dots"><span></span><span></span><span></span></div>
      </div>

      <div class="emoji-palette">
        <button class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
        <button class="emoji-btn" onclick="addEmoji('🌌')">🌌</button>
        <button class="emoji-btn" onclick="addEmoji('✨')">✨</button>
        <button class="emoji-btn" onclick="addEmoji('🛸')">🛸</button>
        <button class="emoji-btn" onclick="addEmoji('👾')">👾</button>
        <button class="emoji-btn" onclick="addEmoji('🪐')">🪐</button>
      </div>

      <form class="chat-form" id="chat-form">
        <div class="chat-inputs">
          <input type="text" id="username-input" placeholder="Name" maxlength="15" required>
          <input type="text" id="message-input" placeholder="Type a message..." maxlength="200" autocomplete="off">
        </div>
        
        <div class="chat-actions-row">
          <input type="file" id="media-input" accept="image/*" style="display: none;">
          <button type="button" class="icon-btn" id="attach-btn" title="Attach Image">📷</button>
          <button type="button" class="icon-btn" id="voice-btn" title="Record Voice Note">🎙️</button>
          <button type="submit" class="send-btn">Send ✨</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. LIVE REAL-TIME CLOCK FUNCTION
    function updateLiveClock() {
      const now = new Date();
      const options = { 
        year: 'numeric', month: 'long', day: 'numeric', 
        hour: '2-digit', minute: '2-digit', second: '2-digit', 
        hour12: true, timeZoneName: 'short' 
      };
      document.getElementById('live-clock').innerText = `🕒 Time: ${now.toLocaleString('en-US', options)}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    // 2. STAR CANVAS
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [], dustParticles = [], shockwaves = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createStars();
    }

    function createStars() {
      stars = [];
      const count = Math.floor((width * height) / 2500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.6 + 0.3,
          color: `rgba(${Math.floor(Math.random() * 100 + 155)}, ${Math.floor(Math.random() * 100 + 155)}, 255, ${Math.random() * 0.8 + 0.2})`,
          speedX: (Math.random() - 0.5) * 0.3,
          speedY: (Math.random() - 0.5) * 0.3,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          alpha: Math.random()
        });
      }
    }

    let shootingStar = null;
    function spawnShootingStar() {
      if (!shootingStar && Math.random() < 0.015) {
        shootingStar = {
          x: Math.random() * width,
          y: 0,
          length: Math.random() * 80 + 40,
          speed: Math.random() * 10 + 6,
          alpha: 1
        };
      }
    }

    window.addEventListener('mousemove', (e) => {
      dustParticles.push({
        x: e.clientX, y: e.clientY,
        size: Math.random() * 4 + 1,
        color: `hsl(${Math.random() * 60 + 180}, 100%, 75%)`,
        alpha: 1, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5
      });
    });

    window.addEventListener('click', (e) => {
      shockwaves.push({ x: e.clientX, y: e.clientY, radius: 2, alpha: 1 });
    });

    function drawCanvas() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(star => {
        star.x += star.speedX; star.y += star.speedY;
        if (star.x < 0) star.x = width; if (star.x > width) star.x = 0;
        if (star.y < 0) star.y = height; if (star.y > height) star.y = 0;

        star.alpha += star.twinkleSpeed;
        if (star.alpha > 1 || star.alpha < 0.1) star.twinkleSpeed = -star.twinkleSpeed;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.fill();
      });

      spawnShootingStar();
      if (shootingStar) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(shootingStar.x, shootingStar.y);
        ctx.lineTo(shootingStar.x - shootingStar.length, shootingStar.y + shootingStar.length);
        ctx.stroke();
        shootingStar.x += shootingStar.speed; shootingStar.y += shootingStar.speed;
        shootingStar.alpha -= 0.01;
        if (shootingStar.y > height || shootingStar.alpha <= 0) shootingStar = null;
      }

      dustParticles.forEach((p, idx) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.025;
        if (p.alpha <= 0) dustParticles.splice(idx, 1);
      });

      shockwaves.forEach((sw, idx) => {
        ctx.strokeStyle = `rgba(56, 189, 248, ${sw.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        sw.radius += 4; sw.alpha -= 0.03;
        if (sw.alpha <= 0) shockwaves.splice(idx, 1);
      });

      requestAnimationFrame(drawCanvas);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawCanvas();

    // AMBIENT SOUND SYNTH
    let audioCtx, synthOsc, synthGain, isAudioPlaying = false;
    document.getElementById('music-btn').addEventListener('click', () => {
      if (!isAudioPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        synthOsc = audioCtx.createOscillator();
        synthGain = audioCtx.createGain();
        synthOsc.type = 'sine';
        synthOsc.frequency.setValueAtTime(110, audioCtx.currentTime);
        synthGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        synthOsc.connect(synthGain);
        synthGain.connect(audioCtx.destination);
        synthOsc.start();
        document.getElementById('music-btn').innerText = '🎵 Cosmic Audio: ON';
        isAudioPlaying = true;
      } else {
        synthOsc.stop();
        document.getElementById('music-btn').innerText = '🎵 Cosmic Audio: OFF';
        isAudioPlaying = false;
      }
    });

    function playCosmicPopSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    document.getElementById('space-ship').addEventListener('click', (e) => {
      const ship = e.currentTarget.getBoundingClientRect();
      shockwaves.push({ x: ship.left + 35, y: ship.top + 35, radius: 5, alpha: 1 });
      playCosmicPopSound();
      alert('⚡ Cosmic Laser Fired!');
    });

    const fortunes = [
      "🌟 A bright galaxy of luck surrounds you today!",
      "🚀 Your ideas will reach outer space heights!",
      "🪐 Stay centered like Saturn's beautiful rings.",
      "🛸 Unexpected cosmic surprises are heading your way!",
      "✨ You radiate brilliant stardust energy!"
    ];
    function spinFortune() {
      confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
      alert(fortunes[Math.floor(Math.random() * fortunes.length)]);
    }

    function addEmoji(emoji) {
      const input = document.getElementById('message-input');
      input.value += emoji;
      input.focus();
    }

    // FIREBASE INITIALIZATION & REAL-TIME IP VISITOR DETECTOR
    const firebaseConfig = {
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref("global_cosmic_chat");
    const activeVisitorsRef = db.ref("active_ip_visitors");

    // Fetch Unique Visitor IP and Track Live Session
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        const sanitizedIP = data.ip.replace(/\./g, '_');
        const userPresenceRef = db.ref(`active_ip_visitors/${sanitizedIP}`);
        
        // Register online session and clean up on disconnect
        userPresenceRef.set({
          ip: data.ip,
          last_seen: Date.now()
        });
        userPresenceRef.onDisconnect().remove();
      })
      .catch(() => {
        // Fallback session key if IP fetch fails
        const fallbackId = 'guest_' + Math.random().toString(36).substring(2, 9);
        db.ref(`active_ip_visitors/${fallbackId}`).set({ last_seen: Date.now() });
        db.ref(`active_ip_visitors/${fallbackId}`).onDisconnect().remove();
      });

    // Listen to real-time unique active IP visitors
    activeVisitorsRef.on("value", (snapshot) => {
      const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 1;
      document.getElementById('visitor-count').innerText = `${count} Active ${count === 1 ? 'IP' : 'IPs'} Online`;
    });

    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const usernameInput = document.getElementById('username-input');
    const messageInput = document.getElementById('message-input');
    const clearBtn = document.getElementById('clear-chat-btn');
    const attachBtn = document.getElementById('attach-btn');
    const mediaInput = document.getElementById('media-input');
    const voiceBtn = document.getElementById('voice-btn');

    let mediaRecorder, audioChunks = [], isRecording = false;

    if (localStorage.getItem('cosmic_username')) {
      usernameInput.value = localStorage.getItem('cosmic_username');
    }

    messageInput.addEventListener('input', () => {
      const name = usernameInput.value.trim() || 'Someone';
      const typingRef = db.ref("typing_status");
      if (messageInput.value.length > 0) {
        typingRef.set({ user: name, active: true });
      } else {
        typingRef.set({ active: false });
      }
    });

    db.ref("typing_status").on("value", (snap) => {
      const val = snap.val();
      const indicator = document.getElementById('typing-indicator');
      if (val && val.active && val.user !== usernameInput.value) {
        document.getElementById('typing-user').innerText = val.user;
        indicator.classList.add('active');
      } else {
        indicator.classList.remove('active');
      }
    });

    chatRef.limitToLast(50).on("child_added", (snapshot) => {
      appendMessage(snapshot.key, snapshot.val());
    });

    chatRef.limitToLast(50).on("child_changed", (snapshot) => {
      updateMessageUI(snapshot.key, snapshot.val());
    });

    chatRef.on("value", (snapshot) => {
      if (!snapshot.exists()) chatMessages.innerHTML = '';
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = usernameInput.value.trim();
      const text = messageInput.value.trim();

      if (name && text) {
        localStorage.setItem('cosmic_username', name);
        
        chatRef.push({
          username: name,
          message: text,
          likes: 0,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
        playCosmicPopSound();

        messageInput.value = '';
        db.ref("typing_status").set({ active: false });
      }
    });

    attachBtn.addEventListener('click', () => mediaInput.click());
    mediaInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      const name = usernameInput.value.trim();
      if (!name) return alert('Enter name first!');

      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          chatRef.push({
            username: name,
            image: event.target.result,
            likes: 0,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        };
        reader.readAsDataURL(file);
      }
    });

    voiceBtn.addEventListener('click', async () => {
      const name = usernameInput.value.trim();
      if (!name) return alert('Enter name first!');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              chatRef.push({
                username: name,
                audio: reader.result,
                likes: 0,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              });
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start();
          isRecording = true;
          voiceBtn.classList.add('recording');
        } catch (err) { alert('Microphone unavailable.'); }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        voiceBtn.classList.remove('recording');
      }
    });

    clearBtn.addEventListener('click', () => {
      if (usernameInput.value.trim().toLowerCase() === 'zack') {
        if (confirm('Clear all messages?')) chatRef.remove();
      } else alert('Only zack can clear chat.');
    });

    function appendMessage(key, data) {
      if (document.getElementById(`msg-${key}`)) return;

      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      msgDiv.id = `msg-${key}`;
      
      let contentHtml = '';
      if (data.message) contentHtml += `<div class="text">${escapeHTML(data.message)}</div>`;
      if (data.image) contentHtml += `<img src="${data.image}" alt="media">`;
      if (data.audio) contentHtml += `<div class="voice-note-card"><audio controls src="${data.audio}"></audio></div>`;

      const likeCount = data.likes || 0;
      const comments = data.comments || {};

      msgDiv.innerHTML = `
        <div class="author">
          <span class="author-name">${escapeHTML(data.username)}</span>
          <span class="time">${data.timestamp || ''}</span>
        </div>
        ${contentHtml}
        
        <div class="msg-actions">
          <button class="action-btn" onclick="likeMessage('${key}', event)">
            ❤️ <span id="like-count-${key}">${likeCount}</span>
          </button>
          <button class="action-btn" onclick="toggleComments('${key}')">
            💬 <span id="comment-count-${key}">${Object.keys(comments).length}</span> Comments
          </button>
        </div>

        <div class="comments-wrapper" id="comments-${key}">
          <div id="comments-list-${key}">${renderCommentsList(comments)}</div>
          <div class="comment-input-box">
            <input type="text" id="c-input-${key}" placeholder="Comment..." maxlength="100">
            <button onclick="postComment('${key}')">Reply</button>
          </div>
        </div>
      `;

      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function updateMessageUI(key, data) {
      const likeElem = document.getElementById(`like-count-${key}`);
      if (likeElem) likeElem.innerText = data.likes || 0;

      const commentElem = document.getElementById(`comment-count-${key}`);
      const commentsListElem = document.getElementById(`comments-list-${key}`);
      const comments = data.comments || {};

      if (commentElem) commentElem.innerText = Object.keys(comments).length;
      if (commentsListElem) commentsListElem.innerHTML = renderCommentsList(comments);
    }

    function renderCommentsList(comments) {
      let html = '';
      for (let cId in comments) {
        const c = comments[cId];
        html += `<div class="comment-item"><span class="c-author">${escapeHTML(c.username)}:</span>${escapeHTML(c.text)}</div>`;
      }
      return html;
    }

    window.likeMessage = function(key, e) {
      chatRef.child(key).child("likes").transaction(c => (c || 0) + 1);

      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = '❤️';
      heart.style.left = `${e.clientX - 10}px`;
      heart.style.top = `${e.clientY - 20}px`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1800);
    };

    window.toggleComments = function(key) {
      const box = document.getElementById(`comments-${key}`);
      if (box) box.classList.toggle('open');
    };

    window.postComment = function(key) {
      const name = usernameInput.value.trim() || 'Guest';
      const input = document.getElementById(`c-input-${key}`);
      const text = input ? input.value.trim() : '';

      if (text) {
        chatRef.child(key).child("comments").push({ username: name, text: text });
        input.value = '';
      }
    };

    function escapeHTML(str) {
      return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
    }
  </script>
</body>
</html>
