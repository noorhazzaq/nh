<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Messenger Pro</title>
  <style>
    /* ============================================================
       VARIABLES — Feature 82: Bubble Styles
       ============================================================ */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--font:system-ui,-apple-system,sans-serif;--bg:#0a0a12;--surface:#1a1a2e;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.06);--blue:#0084ff;--blue2:#0070e0;--green:#31a24c;--yellow:#fbbf24;--text:#fff;--muted:rgba(255,255,255,.5);--dim:rgba(255,255,255,.15);--bubble-radius:18px;--bubble-radius-own:4px 18px 18px 4px;--bubble-radius-other:18px 4px 4px 18px;--bubble-padding:8px 14px;--bubble-font:.9rem;--radius:16px;--full:9999px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--t:.2s cubic-bezier(.4,0,.2,1)}

    /* Bubble Style Variants */
    .bubble--rounded{--bubble-radius:18px;--bubble-radius-own:4px 18px 18px 4px;--bubble-radius-other:18px 4px 4px 18px}
    .bubble--square{--bubble-radius:4px;--bubble-radius-own:4px;--bubble-radius-other:4px}
    .bubble--pill{--bubble-radius:9999px;--bubble-radius-own:4px 9999px 9999px 4px;--bubble-radius-other:9999px 4px 4px 9999px}
    .bubble--compact{--bubble-padding:4px 10px;--bubble-font:.8rem}
    .bubble--spacious{--bubble-padding:12px 18px;--bubble-font:1rem}

    html,body{height:100%;width:100%;overflow:hidden;position:fixed;top:0;left:0;background:var(--bg)}
    body{color:var(--text);font-family:var(--font);display:flex;justify-content:center;align-items:center;padding:0;touch-action:manipulation}

    .app{width:100%;max-width:480px;height:100%;max-height:932px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}

    /* ===== HEADER ===== */
    .header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:56px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;gap:4px}
    .brand{display:flex;align-items:center;gap:8px}
    .brand .logo{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0}
    .brand .title{font-size:1rem;font-weight:700;color:var(--text)}
    .brand .title small{font-weight:400;font-size:.6rem;color:var(--muted);margin-left:4px}

    .right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
    .badge{display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--muted)}
    .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
    .badge .dot.off{background:#e94560;animation:blink .8s infinite}
    .badge .count{color:var(--text);font-weight:600}

    /* ===== FEATURE 54: LAST SEEN ===== */
    .lastseen{font-size:.55rem;color:var(--muted);padding:2px 8px;background:var(--card);border-radius:var(--full);white-space:nowrap}

    /* ===== AUTH ===== */
    .auth{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
    .auth input{padding:4px 10px;border:1px solid var(--border);border-radius:var(--full);background:var(--card);color:var(--text);font-family:var(--font);font-size:.7rem;width:70px;transition:var(--t);min-height:28px;flex:1;min-width:50px;max-width:100px}
    .auth input:focus{outline:none;border-color:var(--blue)}
    .auth input::placeholder{color:var(--dim)}
    .auth input:disabled{opacity:.4;cursor:not-allowed}
    .btn{padding:4px 12px;border:none;border-radius:var(--full);background:var(--blue);color:#fff;font-family:var(--font);font-size:.65rem;font-weight:600;cursor:pointer;transition:var(--t);min-height:28px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;flex-shrink:0;touch-action:manipulation}
    .btn:active:not(:disabled){transform:scale(.95)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
    .btn--danger{background:#e94560}
    .btn--join{background:var(--blue)}

    /* ===== FEATURE 57: ACTIVITY STATUS ===== */
    .status-bar{display:flex;align-items:center;gap:6px;padding:2px 10px;background:var(--card);border-radius:var(--full);font-size:.55rem;color:var(--muted)}
    .status-bar select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--full);padding:2px 6px;font-size:.5rem;font-family:var(--font);cursor:pointer}
    .status-bar select:focus{outline:none;border-color:var(--blue)}

    /* ===== MESSAGES ===== */
    .msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:smooth;background:var(--bg)}
    .msgs::-webkit-scrollbar{width:3px}
    .msgs::-webkit-scrollbar-track{background:transparent}
    .msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--full)}

    .status-msg{text-align:center;font-size:.7rem;color:var(--muted);padding:20px 12px}

    /* ===== MESSENGER BUBBLES — Feature 82 ===== */
    .msg{max-width:82%;padding:var(--bubble-padding);border-radius:var(--bubble-radius);word-wrap:break-word;animation:slide .25s ease;line-height:1.5;font-size:var(--bubble-font);position:relative;margin-bottom:2px}
    @keyframes slide{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
    .msg.own{align-self:flex-end;background:var(--blue);color:#fff;border-radius:var(--bubble-radius-own)}
    .msg.other{align-self:flex-start;background:var(--card);color:var(--text);border-radius:var(--bubble-radius-other)}
    .msg .sender{font-size:.55rem;font-weight:600;opacity:.6;margin-bottom:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .msg.own .sender{opacity:.7;color:rgba(255,255,255,.7)}
    .msg .time{font-size:.5rem;opacity:.4;margin-left:4px}
    .msg .text{word-break:break-word;line-height:1.5}

    /* ===== FEATURE 55: USER ID ===== */
    .msg .userid{font-size:.4rem;opacity:.3;margin-left:4px;font-family:monospace}

    /* ===== TYPING ===== */
    .typing{display:none;align-items:center;gap:5px;padding:5px 12px;background:var(--card);border-radius:var(--full);font-size:.65rem;color:var(--muted);margin:3px 0;align-self:flex-start;max-width:70px}
    .typing.active{display:flex}
    .typing .dot{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:bounce 1.2s ease-in-out infinite}
    .typing .dot:nth-child(2){animation-delay:.2s}
    .typing .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}

    /* ===== INPUT ===== */
    .input-area{padding:6px 12px 12px;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:calc(12px + var(--safe-bottom));background:var(--surface)}
    .row{display:flex;gap:6px;align-items:center}
    .row input{flex:1;padding:8px 14px;border:1px solid var(--border);border-radius:var(--full);background:var(--card);color:var(--text);font-family:var(--font);font-size:.85rem;min-width:40px;transition:var(--t);min-height:36px}
    .row input:focus{outline:none;border-color:var(--blue)}
    .row input::placeholder{color:var(--dim)}
    .row input:disabled{opacity:.3;cursor:not-allowed}
    .row .btn{font-size:.75rem;padding:8px 16px;min-height:36px;flex-shrink:0}
    .row .btn--send{background:var(--blue)}

    /* ===== FEATURE 80: VIDEO CALL ===== */
    .call-btn{background:var(--green);padding:4px 10px;font-size:.5rem;border:none;border-radius:var(--full);color:#fff;cursor:pointer;transition:var(--t)}
    .call-btn:hover{transform:scale(1.05)}
    .call-btn:disabled{opacity:.4;cursor:not-allowed}

    .call-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:20px}
    .call-overlay.active{display:flex}
    .call-overlay video{width:90%;max-width:400px;max-height:60vh;background:#1a1a2e;border-radius:16px;border:2px solid var(--blue)}
    .call-overlay .call-actions{display:flex;gap:20px}
    .call-overlay .call-actions button{width:60px;height:60px;border-radius:50%;border:none;font-size:1.5rem;cursor:pointer;transition:var(--t)}
    .call-overlay .call-actions .end-call{background:#e94560;color:#fff}
    .call-overlay .call-actions .end-call:hover{transform:scale(1.1)}
    .call-overlay .call-actions .mute-call{background:var(--card);color:var(--text)}
    .call-overlay .call-actions .mute-call:hover{transform:scale(1.1)}
    .call-overlay .call-status{font-size:.8rem;color:var(--muted)}

    /* ===== FEATURE 76: CHAT STATS ===== */
    .stats{display:flex;gap:8px;font-size:.5rem;color:var(--muted);padding:2px 8px;background:var(--card);border-radius:var(--full);white-space:nowrap}
    .stats span{display:flex;align-items:center;gap:3px}

    /* ===== RESPONSIVE ===== */
    @media(max-width:380px){
      .header{padding:6px 10px;min-height:44px}
      .brand .logo{width:26px;height:26px;font-size:.8rem}
      .brand .title{font-size:.8rem}
      .auth input{font-size:.6rem;padding:3px 6px;min-height:24px;width:55px;max-width:70px}
      .btn{font-size:.55rem;padding:3px 8px;min-height:24px}
      .msgs{padding:6px 8px}
      .msg{max-width:92%;padding:5px 10px;font-size:.75rem}
      .input-area{padding:4px 8px 8px}
      .row input{font-size:.7rem;padding:6px 10px;min-height:30px}
      .row .btn{font-size:.65rem;padding:6px 10px;min-height:30px}
      .stats{font-size:.4rem;padding:2px 6px}
      .status-bar{font-size:.45rem;padding:2px 6px}
    }
    @media(max-height:500px) and (orientation:landscape){
      .app{max-height:95vh}
      .header{padding:4px 10px;min-height:36px}
      .brand .logo{width:22px;height:22px;font-size:.6rem}
      .brand .title{font-size:.65rem}
      .msgs{padding:4px 8px;gap:2px}
      .msg{padding:3px 8px;max-width:90%;font-size:.65rem}
      .input-area{padding:3px 8px 6px}
      .row input{min-height:24px;padding:4px 10px;font-size:.6rem}
      .row .btn{min-height:24px;padding:4px 10px;font-size:.55rem}
      .stats{font-size:.4rem;padding:2px 4px}
      .status-bar{font-size:.4rem;padding:2px 4px}
    }
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  </style>
</head>
<body>

  <!-- ===== VIDEO CALL OVERLAY (Feature 80) ===== -->
  <div class="call-overlay" id="callOverlay">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="call-status" id="callStatus">Connecting...</div>
    <div class="call-actions">
      <button class="mute-call" id="muteBtn" title="Mute">🔇</button>
      <button class="end-call" id="endCallBtn" title="End call">📞</button>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">M</div>
        <h1 class="title">
          Messenger
          <small id="userDisplay"></small>
        </h1>
      </div>
      <div class="right">
        <!-- Feature 54: Last Seen -->
        <span class="lastseen" id="lastSeen">● Online</span>

        <!-- Feature 57: Activity Status -->
        <div class="status-bar">
          <span>●</span>
          <select id="statusSelect">
            <option value="online">Online</option>
            <option value="busy">Busy</option>
            <option value="away">Away</option>
            <option value="offline">Offline</option>
          </select>
        </div>

        <!-- Feature 76: Chat Stats -->
        <div class="stats" id="stats">
          <span>💬 <span id="msgCount">0</span></span>
          <span>👤 <span id="userCount">0</span></span>
        </div>

        <!-- Feature 80: Video Call -->
        <button class="call-btn" id="callBtn">📹 Call</button>

        <div class="badge">
          <span class="dot" id="dot"></span>
          <span class="count" id="count">0</span>
        </div>
        <div class="auth">
          <input type="text" id="name" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn btn--join" id="join">Join</button>
          <button class="btn btn--danger" id="leave" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <div class="msgs" id="msgs">
      <div class="status-msg">✦ Connecting...</div>
      <div class="typing" id="typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span style="margin-left:5px;">typing</span>
      </div>
    </div>

    <!-- Feature 82: Bubble Style Selector -->
    <div style="padding:4px 12px;display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--border)">
      <button class="btn" style="font-size:.45rem;padding:2px 8px;min-height:20px;background:var(--card);color:var(--text)" data-style="rounded">Rounded</button>
      <button class="btn" style="font-size:.45rem;padding:2px 8px;min-height:20px;background:var(--card);color:var(--text)" data-style="square">Square</button>
      <button class="btn" style="font-size:.45rem;padding:2px 8px;min-height:20px;background:var(--card);color:var(--text)" data-style="pill">Pill</button>
      <button class="btn" style="font-size:.45rem;padding:2px 8px;min-height:20px;background:var(--card);color:var(--text)" data-style="compact">Compact</button>
      <button class="btn" style="font-size:.45rem;padding:2px 8px;min-height:20px;background:var(--card);color:var(--text)" data-style="spacious">Spacious</button>
    </div>

    <footer class="input-area">
      <div class="row">
        <input type="text" id="input" placeholder="Type a message..." disabled inputmode="text" autocomplete="off" />
        <button class="btn btn--send" id="send" disabled>Send</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * MESSENGER PRO — 6 Features
     * 54: Last Seen | 55: User ID | 57: Activity Status
     * 76: Chat Stats | 80: Video Calls | 82: Bubble Styles
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    let db = null;

    function initFirebase() {
      try {
        if (typeof firebase === 'undefined') { setTimeout(initFirebase, 500); return }
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp({
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
          });
        }
        db = firebase.database();
        console.log('✅ Firebase ready');
        startApp();
      } catch (e) { console.error('Firebase error:', e);
        setTimeout(initFirebase, 2000) }
    }

    // ============================================================
    // 2. DOM
    // ============================================================

    const $ = id => document.getElementById(id);
    const D = {
      msgs: $('msgs'),
      input: $('input'),
      send: $('send'),
      name: $('name'),
      join: $('join'),
      leave: $('leave'),
      count: $('count'),
      dot: $('dot'),
      lastSeen: $('lastSeen'),
      userDisplay: $('userDisplay'),
      statusSelect: $('statusSelect'),
      msgCount: $('msgCount'),
      userCount: $('userCount'),
      callBtn: $('callBtn'),
      callOverlay: $('callOverlay'),
      localVideo: $('localVideo'),
      remoteVideo: $('remoteVideo'),
      callStatus: $('callStatus'),
      muteBtn: $('muteBtn'),
      endCallBtn: $('endCallBtn'),
    };
    const typingEl = $('typing');

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null,
      listeners = [],
      connected = !1,
      notifCount = 0,
      typingTimeout = null,
      start = Date.now();
    let localStream = null,
      peerConnection = null,
      callActive = !1;

    // ============================================================
    // 4. HELPERS
    // ============================================================

    function setStatus(t) {
      let e = D.msgs.querySelector('.status-msg');
      if (!e) { e = document.createElement('div');
        e.className = 'status-msg';
        D.msgs.appendChild(e) }
      e.textContent = t;
    }

    function clearStatus() { const e = D.msgs.querySelector('.status-msg'); if (e) e.remove() }

    function scrollBottom() { requestAnimationFrame(() => { D.msgs.scrollTop = D.msgs.scrollHeight }) }

    function formatTime(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) } catch (e) { return '' }
    }

    // Feature 54: Last Seen
    function updateLastSeen(ts) {
      if (!ts) { D.lastSeen.textContent = '● Online'; return }
      const now = Date.now();
      const diff = Math.floor((now - ts) / 1000);
      if (diff < 60) D.lastSeen.textContent = '● Online';
      else if (diff < 3600) D.lastSeen.textContent = '● ' + Math.floor(diff / 60) + 'm ago';
      else if (diff < 86400) D.lastSeen.textContent = '● ' + Math.floor(diff / 3600) + 'h ago';
      else D.lastSeen.textContent = '● ' + Math.floor(diff / 86400) + 'd ago';
    }

    function setOnline(on) {
      connected = on;
      D.dot.className = 'dot' + (on ? '' : ' off');
      if (on) {
        console.log('⚡ Connected');
        setStatus('✦ Connected ✦');
        setTimeout(() => { const e = D.msgs.querySelector('.status-msg'); if (e && e.textContent === '✦ Connected ✦')
            clearStatus() }, 600);
        if (user) { updateLastSeen(Date.now());
          updateStats() }
      } else setStatus('✦ Reconnecting...');
    }

    // Feature 76: Chat Stats
    function updateStats() {
      if (!db) return;
      db.ref('messages').once('value', s => {
        const count = s.exists() ? s.numChildren() : 0;
        D.msgCount.textContent = count;
      });
      db.ref('users').once('value', s => {
        D.userCount.textContent = s.exists() ? s.numChildren() : 0;
      });
    }

    // Feature 55: User ID
    function getUserId() { return user ? user.uid.slice(0, 8) : '' }

    // ============================================================
    // 5. CONFETTI
    // ============================================================

    function createConfetti() {
      const c = ['#0084ff', '#31a24c', '#e94560', '#fbbf24', '#7c3aed'];
      for (let i = 0; i < 15; i++) {
        const e = document.createElement('div');
        e.style.cssText =
          `position:fixed;width:${Math.random()*4+3}px;height:${Math.random()*4+3}px;background:${c[Math.floor(Math.random()*c.length)]};left:${Math.random()*100}%;top:-10px;border-radius:${Math.random()>.5?'50%':'2px'};pointer-events:none;z-index:100;animation:fall ${Math.random()*2+2}s linear ${Math.random()*2}s forwards;opacity:0`;
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 4000);
      }
    }

    if (!document.querySelector('#confetti-style')) {
      const s = document.createElement('style');
      s.id = 'confetti-style';
      s.textContent =
        '@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}';
      document.head.appendChild(s);
    }

    // ============================================================
    // 6. NOTIFICATION
    // ============================================================

    function showNotification() {
      notifCount = Math.min(notifCount + 1, 99);
      // bell class removed, using stats instead
    }

    // ============================================================
    // 7. TYPING
    // ============================================================

    function showTyping() {
      typingEl.classList.add('active');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => typingEl.classList.remove('active'), 2000);
    }

    // ============================================================
    // 8. SEND
    // ============================================================

    function sendMessage(t) {
      if (!user) return alert('✦ Sign in!');
      if (!t || !t.trim()) return;
      if (!connected) return alert('✦ Waiting...');
      if (!db) return alert('✦ Connection error. Refresh.');

      try {
        db.ref('messages').push({
          name: user.name,
          uid: user.uid,
          text: t.trim(),
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          status: 'online' // Feature 57
        }).catch(() => alert('✦ Failed'));
      } catch (e) { alert('✦ Failed') }

      D.input.value = '';
      D.input.focus();
    }

    // ============================================================
    // 9. RENDER
    // ============================================================

    function render(data) {
      if (!data || !data.text) return;
      const own = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = 'msg ' + (own ? 'own' : 'other');
      el.dataset.key = data._key || '';
      const uid = data.uid ? data.uid.slice(0, 8) : '';

      el.innerHTML =
        '<div class="sender">' + (data.name || 'Anon') +
        '<span class="time">' + formatTime(data.timestamp) + '</span>' +
        '<span class="userid">#' + uid + '</span>' + // Feature 55
        '</div>' +
        '<div class="text">' + (data.text || '') + '</div>';

      const st = D.msgs.querySelector('.status-msg');
      if (st && (st.textContent === '✦ Connected ✦' || st.textContent === '✦ Reconnecting...')) clearStatus();

      D.msgs.appendChild(el);
      scrollBottom();

      if (!own && user) {
        showNotification();
        showTyping();
        if (Math.random() > .85) createConfetti();
      }
      updateStats(); // Feature 76
    }

    // ============================================================
    // 10. SUBSCRIBE
    // ============================================================

    function subscribe() {
      if (!db) { setTimeout(subscribe, 500); return }
      listeners.forEach(r => { try { r.off() } catch (e) {} });
      listeners = [];

      try {
        const p = db.ref('.info/connected');
        p.on('value', s => {
          const on = s.val() === !0;
          if (on && !connected) setOnline(!0);
          else if (!on) setOnline(!1);
          if (on && user) {
            const r = db.ref('users').child(user.uid);
            r.set({
              name: user.name,
              lastSeen: firebase.database.ServerValue.TIMESTAMP,
              status: D.statusSelect.value // Feature 57
            });
            r.onDisconnect().remove();
          }
        });
        listeners.push(p);

        const u = db.ref('users');
        u.on('value', s => {
          if (connected) {
            const count = s.exists() ? s.numChildren() : 0;
            D.count.textContent = count;
            D.userCount.textContent = count;
            // Update last seen for current user
            if (s.exists() && user) {
              const data = s.val();
              if (data[user.uid] && data[user.uid].lastSeen) {
                updateLastSeen(data[user.uid].lastSeen);
              }
            }
          }
        });
        listeners.push(u);

        const q = db.ref('messages').orderByKey().limitToLast(50);
        q.on('child_added', s => { if (connected) { const d = s.val();
            d._key = s.key;
            render(d) } });
        q.on('child_removed', s => { const e = D.msgs.querySelector('[data-key="' + s.key + '"]'); if (e) e.remove() });
        listeners.push(q);

        q.once('value', s => {
          if (!s.exists()) {
            const e = D.msgs.querySelector('.status-msg');
            if (!e || e.textContent === '✦ Reconnecting...' || e.textContent === '✦ Connected ✦') {
              setStatus('✦ No messages yet ✦');
              setTimeout(() => { const el = D.msgs.querySelector('.status-msg'); if (el && el.textContent ===
                  '✦ No messages yet ✦') clearStatus() }, 1500);
            }
          }
          updateStats(); // Feature 76
        });

        console.log('✅ Subscribed');
      } catch (e) { console.error('Subscribe error:', e);
        setTimeout(subscribe, 3000) }
    }

    // ============================================================
    // 11. FEATURE 80: VIDEO CALL
    // ============================================================

    async function startCall() {
      if (!user) return alert('Sign in first!');
      if (callActive) return;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        D.localVideo.srcObject = localStream;
        D.callOverlay.classList.add('active');
        D.callStatus.textContent = 'Connecting...';
        callActive = true;

        // Simulate connection (demo)
        setTimeout(() => {
          D.callStatus.textContent = 'Connected';
          // Show remote video (simulated)
          D.remoteVideo.srcObject = localStream;
        }, 1500);

      } catch (e) {
        alert('Camera/Microphone access denied.');
        endCall();
      }
    }

    function endCall() {
      callActive = false;
      D.callOverlay.classList.remove('active');
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      D.localVideo.srcObject = null;
      D.remoteVideo.srcObject = null;
      D.callStatus.textContent = 'Call ended';
      setTimeout(() => { D.callStatus.textContent = '' }, 2000);
    }

    let muted = !1;

    function toggleMute() {
      if (!localStream) return;
      muted = !muted;
      localStream.getAudioTracks().forEach(t => t.enabled = !muted);
      D.muteBtn.textContent = muted ? '🔊' : '🔇';
    }

    // ============================================================
    // 12. FEATURE 82: BUBBLE STYLES
    // ============================================================

    function setBubbleStyle(style) {
      const app = document.querySelector('.app');
      // Remove all bubble classes
      app.classList.remove('bubble--rounded', 'bubble--square', 'bubble--pill', 'bubble--compact', 'bubble--spacious');
      if (style !== 'rounded') {
        app.classList.add('bubble--' + style);
      }
      // Update active button
      document.querySelectorAll('[data-style]').forEach(b => {
        b.style.background = b.dataset.style === style ? 'var(--blue)' : 'var(--card)';
        b.style.color = b.dataset.style === style ? '#fff' : 'var(--text)';
      });
    }

    // ============================================================
    // 13. AUTH
    // ============================================================

    function login() {
      if (!db) return alert('✦ Connection error. Refresh.');
      const n = D.name.value.trim() || 'User';
      user = { name: n.slice(0, 20), uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) };
      D.name.disabled = !0;
      D.join.style.display = 'none';
      D.leave.style.display = 'inline-block';
      D.input.disabled = !1;
      D.send.disabled = !1;
      D.input.placeholder = 'Message as ' + n + '...';
      D.userDisplay.textContent = '#' + getUserId(); // Feature 55
      clearStatus();
      setStatus('✦ ' + n + ' joined ✦');
      createConfetti();
      subscribe();
      if (connected) {
        const r = db.ref('users').child(user.uid);
        r.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP,
          status: D.statusSelect.value // Feature 57
        });
        r.onDisconnect().remove();
      }
      D.count.textContent = '1';
      setTimeout(() => { const e = D.msgs.querySelector('.status-msg'); if (e && e.textContent === '✦ ' + n +
          ' joined ✦') clearStatus() }, 1200);
      updateStats(); // Feature 76
    }

    function logout() {
      try { if (user && db) db.ref('users').child(user.uid).remove() } catch (e) {}
      listeners.forEach(r => { try { r.off() } catch (e) {} });
      listeners = [];
      user = null;
      D.name.disabled = !1;
      D.join.style.display = 'inline-block';
      D.leave.style.display = 'none';
      D.input.disabled = !0;
      D.send.disabled = !0;
      D.input.placeholder = 'Type a message...';
      D.input.value = '';
      D.userDisplay.textContent = '';
      D.msgs.innerHTML = '';
      setStatus('✦ Left chat ✦');
      D.count.textContent = '0';
      connected = !1;
      D.dot.className = 'dot off';
      notifCount = 0;
      if (callActive) endCall();
      updateStats();
    }

    // ============================================================
    // 14. EVENTS
    // ============================================================

    D.join.onclick = login;
    D.leave.onclick = logout;
    D.name.onkeydown = e => { if (e.key === 'Enter') login() };
    D.send.onclick = () => sendMessage(D.input.value);
    D.input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
        sendMessage(D.input.value) } };

    // Feature 57: Status change
    D.statusSelect.onchange = () => {
      if (user && connected) {
        const r = db.ref('users').child(user.uid);
        r.update({ status: D.statusSelect.value });
      }
    };

    // Feature 80: Video Call
    D.callBtn.onclick = startCall;
    D.endCallBtn.onclick = endCall;
    D.muteBtn.onclick = toggleMute;

    // Feature 82: Bubble Styles
    document.querySelectorAll('[data-style]').forEach(btn => {
      btn.onclick = () => setBubbleStyle(btn.dataset.style);
    });
    // Default: rounded
    setBubbleStyle('rounded');

    // Touch feedback
    document.querySelectorAll('.btn').forEach(b => {
      b.addEventListener('touchstart', function() { this.style.transform = 'scale(.95)' }, { passive: !0 });
      b.addEventListener('touchend', function() { this.style.transform = '' }, { passive: !0 })
    });

    D.input.addEventListener('focus', () => { setTimeout(() => { D.input.scrollIntoView({ behavior: 'smooth',
          block: 'center' }) }, 300) });

    // ============================================================
    // 15. BOOT
    // ============================================================

    function startApp() {
      start = Date.now();
      setStatus('✦ Connecting...');
      subscribe();
      setTimeout(() => { if (!connected) setOnline(!0) }, 2000);
      console.log('💬 Messenger Pro — 6 Features');
      console.log('📋 54:Last Seen | 55:User ID | 57:Status | 76:Stats | 80:Calls | 82:Bubbles');
    }

    initFirebase();
    setTimeout(() => { if (!db) initFirebase() }, 5000);
  </script>

</body>
</html>
