<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Network & TikTok Media App</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-pink: #fe2c55;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      height: 55px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .brand { font-weight: bold; font-size: 1.1rem; color: var(--accent-pink); }
    .status-badge { font-size: 0.8rem; background: rgba(63, 185, 80, 0.2); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; }

    /* Main Container */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar: Real Network Inspection */
    aside {
      width: 320px;
      border-right: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      background: #0d1117;
    }
    .card-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.85rem; }
    .data-table td { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .data-table td.key { color: var(--text-muted); width: 40%; }
    .data-table td.val { font-family: monospace; word-break: break-all; }

    /* Right Main Feed: Live TikTok Player */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      background: #000;
      padding: 20px;
    }

    .tiktok-container {
      width: 100%;
      max-width: 380px;
      height: 100%;
      max-height: 700px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">TikTok Live Player + Real Network Inspector</div>
    <div class="status-badge">API Live Connected</div>
  </header>

  <div class="container">
    <!-- Real BrowserLeaks Network Inspector -->
    <aside>
      <div class="card-title">Live Network Connection</div>
      <table class="data-table">
        <tr><td class="key">Public IP</td><td class="val" id="net-ip">Loading...</td></tr>
        <tr><td class="key">ISP / Org</td><td class="val" id="net-isp">Loading...</td></tr>
        <tr><td class="key">Location</td><td class="val" id="net-loc">Loading...</td></tr>
        <tr><td class="key">Timezone</td><td class="val" id="net-tz">Loading...</td></tr>
      </table>

      <div class="card-title" style="margin-top: 10px;">WebRTC Leak Detector</div>
      <table class="data-table">
        <tr><td class="key">WebRTC State</td><td class="val" id="webrtc-state">Testing...</td></tr>
        <tr><td class="key">Local Candidate</td><td class="val" id="webrtc-candidate">None</td></tr>
      </table>

      <div class="card-title" style="margin-top: 10px;">Browser Fingerprint</div>
      <table class="data-table">
        <tr><td class="key">User Agent</td><td class="val" id="sys-ua">Loading...</td></tr>
        <tr><td class="key">Screen Spec</td><td class="val" id="sys-res">Loading...</td></tr>
      </table>
    </aside>

    <!-- Real Functional TikTok Player -->
    <main>
      <div class="tiktok-container">
        <!-- Official Embed URL provided by TikTok for Developers -->
        <iframe 
          src="https://www.tiktok.com/player/v1/6718335390845095173?autoplay=1&controls=1" 
          allow="autoplay; encrypted-media" 
          allowfullscreen>
        </iframe>
      </div>
    </main>
  </div>

  <script>
    // 1. REAL LIVE DATA FETCHING
    async function getRealNetworkData() {
      try {
        const response = await fetch('https://ipwho.is/');
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('net-ip').innerText = data.ip;
          document.getElementById('net-isp').innerText = `${data.connection.isp} (${data.connection.asn})`;
          document.getElementById('net-loc').innerText = `${data.city}, ${data.country}`;
          document.getElementById('net-tz').innerText = data.timezone.id;
        } else {
          document.getElementById('net-ip').innerText = 'Rate Limited';
        }
      } catch (err) {
        document.getElementById('net-ip').innerText = 'API Offline';
      }
    }

    // 2. FUNCTIONAL WEBRTC DETECTOR
    function checkWebRTC() {
      const stateEl = document.getElementById('webrtc-state');
      const candidateEl = document.getElementById('webrtc-candidate');

      const RTCPeer = window.RTCPeerConnection || window.webkitRTCPeerConnection;
      if (!RTCPeer) {
        stateEl.innerText = "Unsupported";
        return;
      }

      const pc = new RTCPeer({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.createDataChannel('');
      
      pc.onicecandidate = (evt) => {
        if (!evt.candidate) return;
        stateEl.innerText = "Active";
        candidateEl.innerText = evt.candidate.address || "Encrypted (mDNS)";
      };

      pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {
        stateEl.innerText = "Blocked by Browser";
      });
    }

    // 3. SYSTEM METRICS
    function getSystemMetrics() {
      document.getElementById('sys-ua').innerText = navigator.userAgent;
      document.getElementById('sys-res').innerText = `${window.screen.width}x${window.screen.height} (${window.screen.colorDepth}-bit)`;
    }

    // Initialization
    getRealNetworkData();
    checkWebRTC();
    getSystemMetrics();
  </script>
</body>
</html>
