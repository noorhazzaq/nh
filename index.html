<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universe - Ultimate Dynamic Experience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* CSS Custom Variables for Smooth Theme Transitions */
    :root {
      --nebula-1-color: rgba(138, 43, 226, 0.4);
      --nebula-1-secondary: rgba(0, 212, 255, 0.2);
      --nebula-2-color: rgba(236, 72, 153, 0.35);
      --nebula-2-secondary: rgba(147, 51, 234, 0.15);
    }

    [data-theme="emerald"] {
      --nebula-1-color: rgba(16, 185, 129, 0.4);
      --nebula-1-secondary: rgba(6, 182, 212, 0.2);
      --nebula-2-color: rgba(52, 211, 153, 0.35);
      --nebula-2-secondary: rgba(59, 130, 246, 0.15);
    }

    [data-theme="supernova"] {
      --nebula-1-color: rgba(245, 158, 11, 0.45);
      --nebula-1-secondary: rgba(239, 68, 68, 0.25);
      --nebula-2-color: rgba(244, 63, 94, 0.4);
      --nebula-2-secondary: rgba(217, 70, 239, 0.2);
    }

    body {
      background-color: #03030a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
      padding: 20px 0;
      user-select: none;
    }

    /* Live Clock Banner */
    .last-updated-banner {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.75);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    /* Score Counter Badge */
    .score-badge {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.75rem;
      color: #f472b6;
      background: rgba(15, 23, 42, 0.75);
      padding: 4px 14px;
      border-radius: 15px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      backdrop-filter: blur(8px);
    }

    /* Canvas Elements */
    #space-canvas, #effects-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #space-canvas { z-index: 1; }
    #effects-canvas { z-index: 15; }

    /* Nebulas */
    .nebula-1 {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--nebula-1-color) 0%, var(--nebula-1-secondary) 50%, transparent 70%);
      filter: blur(70px);
      animation: float1 12s infinite ease-in-out alternate;
      z-index: 2;
      transition: background 1.5s ease-in-out;
    }

    .nebula-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--nebula-2-color) 0%, var(--nebula-2-secondary) 50%, transparent 70%);
      filter: blur(65px);
      animation: float2 15s infinite ease-in-out alternate;
      z-index: 2;
      transition: background 1.5s ease-in-out;
    }

    @keyframes float1 {
      0% { transform: translate(-80px, -60px) scale(0.9); }
      100% { transform: translate(60px, 70px) scale(1.2); }
    }

    @keyframes float2 {
      0% { transform: translate(70px, 80px) scale(1.1); }
      100% { transform: translate(-60px, -50px) scale(0.85); }
    }

    /* Floating Ship */
    .ship-container {
      position: absolute;
      width: 70px;
      height: 70px;
      top: 25%;
      left: -100px;
      z-index: 3;
      pointer-events: none;
      animation: sailAcross 22s linear infinite;
    }

    .ship-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
    }

    @keyframes sailAcross {
      0% { transform: translateX(0vw) translateY(0px) rotate(-6deg); }
      25% { transform: translateX(30vw) translateY(-35px) rotate(8deg); }
      50% { transform: translateX(60vw) translateY(25px) rotate(-8deg); }
      75% { transform: translateX(85vw) translateY(-20px) rotate(6deg); }
      100% { transform: translateX(calc(100vw + 150px)) translateY(0px) rotate(0deg); }
    }

    /* Interactive Floating UFO Easter Egg */
    .ufo-container {
      position: absolute;
      width: 50px;
      height: 50px;
      bottom: 20%;
      right: -80px;
      z-index: 12;
      cursor: pointer;
      animation: ufoFly 18s ease-in-out infinite;
      transition: transform 0.2s ease;
    }

    .ufo-container:hover {
      transform: scale(1.3) !important;
    }

    @keyframes ufoFly {
      0% { transform: translateX(0vw) translateY(0px); }
      50% { transform: translateX(-110vw) translateY(-80px) rotate(15deg); }
      100% { transform: translateX(-220vw) translateY(0px); }
    }

    /* Orbiting Planets */
    .orbit-container {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
    }

    .planet {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
    }

    @keyframes orbitPlanet {
      from { transform: translate(-50%, -50%) rotate(0deg) translateX(var(--orbit-x)) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(1turn) translateX(var(--orbit-x)) rotate(-1turn); }
    }

    #planet-pink {
      --orbit-x: 230px;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle at 30% 30%, #f472b6 0%, #a82e70 70%);
      box-shadow: 0 0 15px rgba(244, 114, 182, 0.6);
      animation: orbitPlanet 15s linear infinite;
    }

    #planet-blue {
      --orbit-x: 290px;
      width: 38px;
      height: 38px;
      background: radial-gradient(circle at 30% 30%, #38bdf8 0%, #116892 70%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
      animation: orbitPlanet 20s linear infinite reverse;
    }

    #planet-purple {
      --orbit-x: 190px;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #c084fc 0%, #6e1cda 70%);
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
      animation: orbitPlanet 12s ease-in-out infinite alternate;
    }

    /* Card Layout */
    .card {
      position: relative;
      z-index: 10;
      padding: 3px;
      border-radius: 20px;
      max-width: 90%;
      width: 400px;
      margin-top: 55px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.3);
    }

    .card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, #f472b6, #38bdf8, #c084fc, #f472b6);
      animation: rotateBorder 6s linear infinite;
      z-index: 1;
    }

    @keyframes rotateBorder {
      to { transform: rotate(1turn); }
    }

    .card-content {
      position: relative;
      background: rgba(15, 15, 30, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      height: 100%;
      border-radius: 17px;
      z-index: 2;
      padding: 1.8rem 1.2rem;
    }

    h1 {
      font-size: 1.9rem;
      background: linear-gradient(135deg, #c084fc, #38bdf8, #f472b6);
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
      line-height: 1.25;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    p {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Custom Greeting Name Input */
    .greeting-input-box {
      margin-top: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .greeting-input-box input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 5px 12px;
      color: #fff;
      font-size: 0.8rem;
      text-align: center;
      outline: none;
      width: 65%;
    }

    .greeting-input-box input::placeholder {
      color: #94a3b8;
    }

    .video-container {
      margin-top: 1rem;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .stars {
      font-size: 1.4rem;
      margin-top: 0.8rem;
      letter-spacing: 4px;
      animation: pulseStars 2s infinite alternate ease-in-out;
    }

    @keyframes pulseStars {
      0% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* Buttons Group */
    .theme-controls {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .theme-btn, .party-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .party-btn {
      background: linear-gradient(135deg, #f472b6, #c084fc);
      border: none;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
    }

    .theme-btn:hover, .party-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Live Dynamic Clock Banner (Updated Initial Time) -->
  <div class="last-updated-banner" id="live-clock">
    Live MYT: August 22, 2026, 3:18:21 AM
  </div>

  <!-- Interactive Shooting Stars Score Badge -->
  <div class="score-badge" id="score-badge">
    ⭐ Cosmic Catch Score: <span id="score">0</span>
  </div>

  <!-- Background Starfield Canvas -->
  <canvas id="space-canvas"></canvas>
  
  <!-- Interactive Overlay Canvas -->
  <canvas id="effects-canvas"></canvas>

  <div class="nebula-1"></div>
  <div class="nebula-2"></div>

  <!-- Floating Ship -->
  <div class="ship-container">
    <svg class="ship-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 42 L52 42 L44 54 L20 54 Z" fill="#8B4513" stroke="#5D2E0A" stroke-width="1.5"/>
      <rect x="31" y="8" width="2" height="34" fill="#A0522D"/>
      <path d="M33 12 L48 25 L33 38 Z" fill="#F0F8FF" stroke="#DCDCDC" stroke-width="1"/>
      <path d="M30 14 L16 38 L30 38 Z" fill="#F0F8FF" stroke="#DCDCDC" stroke-width="1"/>
      <path d="M31 8 L18 4 L31 0 Z" fill="#FF2222" stroke="#CC0000" stroke-width="1"/>
    </svg>
  </div>

  <!-- Clickable UFO Easter Egg -->
  <div class="ufo-container" id="ufo-easter-egg" onclick="triggerUFOEvent()">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="32" cy="36" rx="24" ry="8" fill="#94a3b8" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M20 34 C20 20, 44 20, 44 34 Z" fill="rgba(56, 189, 248, 0.6)" stroke="#38bdf8"/>
      <circle cx="20" cy="36" r="2" fill="#f472b6"/>
      <circle cx="32" cy="38" r="2" fill="#facc15"/>
      <circle cx="44" cy="36" r="2" fill="#4ade80"/>
    </svg>
  </div>

  <div class="orbit-container">
    <div class="planet" id="planet-pink"></div>
    <div class="planet" id="planet-blue"></div>
    <div class="planet" id="planet-purple"></div>
  </div>

  <div class="card">
    <div class="card-content">
      <h1 id="greeting-title">Terima Kasih Alhamdulillah Haji Abu Kassim!</h1>
      <p>Thank you for exploring the cosmic web. May your journeys across the digital universe be limitlessly bright.</p>

      <!-- Custom Name Input -->
      <div class="greeting-input-box">
        <input type="text" id="name-input" placeholder="Type your name to personalize..." oninput="updateGreeting(this.value)">
      </div>

      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/z_uOB_Gsyis" 
          title="Cinta Satu Malam (DJ Remix Tahun Baru 2026) | Party Night Vibes 🔥" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>

      <div class="stars">✨ 🪐 🚀 🌌 ⭐</div>

      <div class="theme-controls">
        <button class="theme-btn" onclick="setNebulaTheme('cosmic')">🔮 Cosmic</button>
        <button class="theme-btn" onclick="setNebulaTheme('emerald')">🌌 Emerald</button>
        <button class="theme-btn" onclick="setNebulaTheme('supernova')">💥 Supernova</button>
        <button class="party-btn" onclick="fireFestiveConfetti()">🎉 Celebrate!</button>
      </div>
    </div>
  </div>

  <script>
    // Audio Synthesizer via Web Audio API
    let audioCtx;
    function playCosmicTone(freq = 440, type = 'sine', duration = 0.15) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Live Dynamic Clock
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('live-clock').innerText = `Live MYT: ${now.toLocaleString('en-US', options)}`;
    }
    setInterval(updateClock, 1000);

    // Custom Greeting Personalization
    function updateGreeting(name) {
      const title = document.getElementById('greeting-title');
      if (name.trim() === "") {
        title.innerText = "Terima Kasih Alhamdulillah Haji Abu Kassim!";
      } else {
        title.innerText = `Terima Kasih Alhamdulillah ${name}!`;
      }
    }

    // Canvas Starfield Background
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [];

    function resizeSpaceCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createStars();
    }

    function createStars() {
      stars = [];
      const count = Math.floor((width * height) / 2500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.6 + 0.3,
          color: `rgba(${Math.floor(Math.random() * 100 + 155)}, ${Math.floor(Math.random() * 100 + 155)}, 255, ${Math.random() * 0.8 + 0.2})`,
          speedX: (Math.random() - 0.5) * 0.3,
          speedY: (Math.random() - 0.5) * 0.3,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          alpha: Math.random()
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(star => {
        star.x += star.speedX; star.y += star.speedY;
        if (star.x < 0) star.x = width;
        if (star.x > width) star.x = 0;
        if (star.y < 0) star.y = height;
        if (star.y > height) star.y = 0;
        star.alpha += star.twinkleSpeed;
        if (star.alpha > 1 || star.alpha < 0.1) star.twinkleSpeed = -star.twinkleSpeed;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.shadowBlur = star.radius > 1.2 ? 8 : 0;
        ctx.shadowColor = '#38bdf8';
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }

    // Interactive Overlay Canvas
    const fxCanvas = document.getElementById('effects-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];
    let shootingStars = [];
    let confetti = [];
    let score = 0;

    function resizeFxCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }

    window.addEventListener('mousemove', (e) => {
      for (let i = 0; i < 2; i++) {
        particles.push({
          x: e.clientX,
          y: e.clientY,
          size: Math.random() * 3 + 1,
          speedX: (Math.random() - 0.5) * 2,
          speedY: (Math.random() - 0.5) * 2,
          color: `hsl(${Math.random() * 60 + 180}, 100%, 75%)`,
          life: 1
        });
      }
    });

    // Click Fireworks
    window.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('.ufo-container')) return;
      playCosmicTone(600 + Math.random() * 400, 'sine', 0.1);
      
      let caught = false;
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        let s = shootingStars[i];
        let dist = Math.hypot(e.clientX - s.x, e.clientY - s.y);
        if (dist < 40) {
          shootingStars.splice(i, 1);
          score += 10;
          document.getElementById('score').innerText = score;
          playCosmicTone(880, 'triangle', 0.3);
          caught = true;
          break;
        }
      }

      for (let i = 0; i < 25; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: e.clientX,
          y: e.clientY,
          size: Math.random() * 4 + 2,
          speedX: Math.cos(angle) * speed,
          speedY: Math.sin(angle) * speed,
          color: caught ? '#facc15' : `hsl(${Math.random() * 360}, 100%, 70%)`,
          life: 1.2
        });
      }
    });

    function addShootingStar() {
      shootingStars.push({
        x: Math.random() * fxCanvas.width,
        y: Math.random() * (fxCanvas.height / 2),
        length: Math.random() * 80 + 40,
        speed: Math.random() * 10 + 6,
        angle: Math.PI / 4,
        opacity: 1
      });
    }

    setInterval(() => {
      if (Math.random() < 0.6) addShootingStar();
    }, 2200);

    // Festive Confetti Cannon
    function fireFestiveConfetti() {
      playCosmicTone(523.25, 'square', 0.2);
      setTimeout(() => playCosmicTone(659.25, 'square', 0.2), 100);
      setTimeout(() => playCosmicTone(783.99, 'square', 0.3), 200);

      for (let i = 0; i < 100; i++) {
        confetti.push({
          x: fxCanvas.width / 2,
          y: fxCanvas.height / 2 + 100,
          size: Math.random() * 8 + 4,
          speedX: (Math.random() - 0.5) * 16,
          speedY: Math.random() * -14 - 4,
          color: `hsl(${Math.random() * 360}, 100%, 65%)`,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          life: 2.5
        });
      }
    }

    // UFO Easter Egg Click Event
    function triggerUFOEvent() {
      playCosmicTone(300, 'sawtooth', 0.5);
      alert("👽 You contacted the Alien Space Cruiser! +50 Cosmic Points!");
      score += 50;
      document.getElementById('score').innerText = score;
      fireFestiveConfetti();
    }

    function animateEffects() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.speedX;
        p.y += p.speedY;
        p.life -= 0.02;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = p.life;
        fxCtx.fill();
      }

      for (let i = confetti.length - 1; i >= 0; i--) {
        let c = confetti[i];
        c.x += c.speedX;
        c.y += c.speedY;
        c.speedY += 0.2;
        c.rotation += c.rotationSpeed;
        c.life -= 0.01;

        if (c.life <= 0 || c.y > fxCanvas.height) {
          confetti.splice(i, 1);
          continue;
        }

        fxCtx.save();
        fxCtx.translate(c.x, c.y);
        fxCtx.rotate((c.rotation * Math.PI) / 180);
        fxCtx.fillStyle = c.color;
        fxCtx.globalAlpha = c.life;
        fxCtx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
        fxCtx.restore();
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        let s = shootingStars[i];
        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        s.opacity -= 0.015;

        if (s.opacity <= 0 || s.x > fxCanvas.width || s.y > fxCanvas.height) {
          shootingStars.splice(i, 1);
          continue;
        }

        let tailX = s.x - Math.cos(s.angle) * s.length;
        let tailY = s.y - Math.sin(s.angle) * s.length;

        let gradient = fxCtx.createLinearGradient(s.x, s.y, tailX, tailY);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${s.opacity})`);
        gradient.addColorStop(1, `rgba(56, 189, 248, 0)`);

        fxCtx.beginPath();
        fxCtx.moveTo(s.x, s.y);
        fxCtx.lineTo(tailX, tailY);
        fxCtx.strokeStyle = gradient;
        fxCtx.lineWidth = 2.5;
        fxCtx.stroke();
      }

      requestAnimationFrame(animateEffects);
    }

    // Theme Switcher
    function setNebulaTheme(themeName) {
      playCosmicTone(700, 'sine', 0.15);
      document.documentElement.setAttribute('data-theme', themeName);
    }

    window.addEventListener('resize', () => {
      resizeSpaceCanvas();
      resizeFxCanvas();
    });

    resizeSpaceCanvas();
    resizeFxCanvas();
    drawStars();
    animateEffects();
  </script>
</body>
</html>
