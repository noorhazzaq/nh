<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Text Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f0e17;
      color: #fffffe;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      overflow: hidden;
    }

    .app {
      max-width: 700px;
      width: 100%;
      height: 95vh;
      max-height: 800px;
      background: #1a1a2e;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .header {
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 2px solid #e94560;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header h1 span {
      color: #e94560;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .online {
      font-size: 0.75rem;
      opacity: 0.6;
      padding: 4px 12px;
      background: #0f0e17;
      border-radius: 20px;
    }

    .auth {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .auth input {
      padding: 4px 10px;
      border: none;
      border-radius: 20px;
      background: #0f0e17;
      color: #fffffe;
      font-size: 0.85rem;
      width: 100px;
      transition: 0.2s;
    }

    .auth input:focus {
      outline: 2px solid #e94560;
      width: 130px;
    }

    .auth button {
      padding: 4px 14px;
      border: none;
      border-radius: 20px;
      background: #e94560;
      color: #fffffe;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      white-space: nowrap;
    }

    .auth button:hover {
      transform: scale(1.05);
      background: #ff6b81;
    }

    .auth button.out {
      background: #2d2d44;
    }

    .auth button.out:hover {
      background: #3d3d5c;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #12122a;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #e94560;
      border-radius: 10px;
    }

    .status {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.4;
      padding: 12px;
      font-style: italic;
    }

    .msg {
      padding: 6px 14px;
      border-radius: 16px;
      max-width: 82%;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
      line-height: 1.4;
    }

    .msg.own {
      align-self: flex-end;
      background: #e94560;
      border-bottom-right-radius: 4px;
    }

    .msg.other {
      align-self: flex-start;
      background: #2d2d44;
      border-bottom-left-radius: 4px;
    }

    .msg .sender {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.6;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .msg .time {
      font-size: 0.5rem;
      opacity: 0.4;
      margin-left: 6px;
    }

    .msg .text {
      font-size: 0.9rem;
      word-break: break-word;
    }

    .input-area {
      padding: 8px 12px 12px;
      background: #16213e;
      border-top: 1px solid #2d2d44;
      flex-shrink: 0;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      background: #0f0e17;
      color: #fffffe;
      font-size: 0.9rem;
      min-width: 50px;
      transition: 0.2s;
    }

    .row input:focus {
      outline: 2px solid #e94560;
    }

    .row input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .row button {
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      background: #e94560;
      color: #fffffe;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
      white-space: nowrap;
    }

    .row button:hover:not(:disabled) {
      transform: scale(1.05);
      background: #ff6b81;
    }

    .row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .app {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }

      .header {
        padding: 8px 12px;
      }

      .header h1 {
        font-size: 1rem;
      }

      .auth input {
        width: 70px;
        font-size: 0.75rem;
      }

      .auth input:focus {
        width: 90px;
      }

      .messages {
        padding: 8px;
      }

      .msg {
        max-width: 92%;
        padding: 4px 10px;
        font-size: 0.85rem;
      }

      .row input {
        font-size: 0.85rem;
        padding: 6px 10px;
      }

      .row button {
        padding: 6px 12px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <h1>💬 <span>Text</span> Chat</h1>
      <div class="header-right">
        <span class="online" id="online">👤 0</span>
        <div class="auth">
          <input type="text" id="name" placeholder="Name..." maxlength="20" />
          <button id="join">Join</button>
          <button id="leave" class="out" style="display:none">Leave</button>
        </div>
      </div>
    </div>

    <div class="messages" id="msgs">
      <div class="status">👋 Sign in to chat</div>
    </div>

    <div class="input-area">
      <div class="row">
        <input type="text" id="input" placeholder="Type a message..." disabled />
        <button id="send" disabled>Send</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    // ============================================================
    // FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // DOM
    // ============================================================

    const msgs = document.getElementById('msgs');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const name = document.getElementById('name');
    const join = document.getElementById('join');
    const leave = document.getElementById('leave');
    const online = document.getElementById('online');

    // ============================================================
    // STATE
    // ============================================================

    let user = null;
    let listeners = [];

    // ============================================================
    // HELPERS
    // ============================================================

    const status = (text) => {
      let el = msgs.querySelector('.status');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status';
        msgs.appendChild(el);
      }
      el.textContent = text;
    };

    const scroll = () => setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);

    const time = (ts) => ts ? new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';

    // ============================================================
    // SEND
    // ============================================================

    const sendMsg = (text) => {
      if (!user) return alert('Sign in first!');
      if (!text || !text.trim()) return;

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch(() => alert('Failed to send.'));

      input.value = '';
      input.focus();
    };

    // ============================================================
    // RENDER
    // ============================================================

    const render = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">${data.name || 'Anonymous'}<span class="time">${time(data.timestamp)}</span></div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = msgs.querySelector('.status');
      if (st) st.remove();

      msgs.appendChild(el);
      scroll();
    };

    // ============================================================
    // SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      listeners.forEach(ref => ref.off());
      listeners = [];

      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        const data = snapshot.val();
        data._key = snapshot.key;
        render(data);
      });

      query.on('child_removed', (snapshot) => {
        const el = msgs.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      query.once('value', (snapshot) => {
        if (!snapshot.exists()) status('💬 No messages yet. Say hello!');
      });

      // Presence
      const presence = db.ref('.info/connected');
      const users = db.ref('users');

      presence.on('value', (snapshot) => {
        if (snapshot.val() && user) {
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });

      users.on('value', (snapshot) => {
        online.textContent = snapshot.exists() ? `👤 ${snapshot.numChildren()}` : '👤 0';
      });

      listeners.push(presence);
    };

    // ============================================================
    // AUTH
    // ============================================================

    const login = () => {
      const n = name.value.trim() || 'Guest';
      user = {
        name: n,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      name.disabled = true;
      join.style.display = 'none';
      leave.style.display = 'inline-block';
      input.disabled = false;
      send.disabled = false;
      input.placeholder = `Message as ${n}...`;

      status(`✅ Signed in as ${n}`);
      msgs.innerHTML = '';
      subscribe();
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      name.disabled = false;
      join.style.display = 'inline-block';
      leave.style.display = 'none';
      input.disabled = true;
      send.disabled = true;
      input.placeholder = 'Sign in to chat...';
      input.value = '';

      msgs.innerHTML = '';
      status('👋 You left the chat. Sign in to rejoin.');
      online.textContent = '👤 0';
    };

    // ============================================================
    // EVENTS
    // ============================================================

    join.addEventListener('click', login);
    leave.addEventListener('click', logout);

    name.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    send.addEventListener('click', () => sendMsg(input.value));

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg(input.value);
      }
    });

    // ============================================================
    // INIT
    // ============================================================

    status('🌐 Connecting...');
    subscribe();

    console.log('💬 Text Chat ready');
  </script>

</body>
</html>
