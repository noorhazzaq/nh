<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZACK360 PRO CHAT</title>
<style>
:root{--bg:#030712;--card:rgba(15,23,42,0.9);--border:rgba(0,243,255,0.3);--neon:#00f3ff;--pink:#ff007f;--purple:#a855f7;--gold:#eab308;--text:#f8fafc;}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}
#blocker{display:none;position:fixed;inset:0;background:#000;z-index:99999;justify-content:center;align-items:center;text-align:center;padding:20px;color:var(--pink);font-size:1.2rem;font-weight:bold;text-shadow:0 0 10px var(--pink);}
.screen{display:none;width:100%;height:100dvh;flex-direction:column;position:relative;z-index:10;overflow:hidden;}
.active{display:flex;}
.bg-glow{position:absolute;width:320px;height:320px;background:radial-gradient(circle,rgba(0,243,255,0.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 4s infinite ease-in-out;}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.3;}50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.7;}}

.auth-box{margin:auto;width:90%;max-width:360px;padding:25px 20px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 0 30px rgba(0,243,255,0.2);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:15px;}
.auth-box h2{text-align:center;color:var(--neon);text-shadow:0 0 10px var(--neon);letter-spacing:2px;font-size:1.6rem;}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:#fff;outline:none;font-size:0.95rem;transition:0.3s;}
input:focus{border-color:var(--neon);box-shadow:0 0 12px rgba(0,243,255,0.5);}
button{width:100%;padding:12px;background:transparent;border:1px solid var(--neon);border-radius:12px;color:var(--neon);font-weight:bold;font-size:0.95rem;cursor:pointer;text-shadow:0 0 6px var(--neon);box-shadow:0 0 12px rgba(0,243,255,0.2);transition:0.2s;}
button:active{transform:scale(0.97);background:var(--neon);color:#000;}
.toggle-btn{background:none;border:none;box-shadow:none;color:var(--pink);text-shadow:0 0 6px var(--pink);font-size:0.85rem;}

header{height:60px;min-height:60px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(12px);}
.brand{display:flex;align-items:center;gap:8px;}
.avatar-header{width:34px;height:34px;border-radius:50%;background:linear-gradient(45deg,var(--neon),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000;box-shadow:0 0 8px var(--neon);}
header h1{font-size:0.95rem;color:var(--neon);text-shadow:0 0 8px var(--neon);}
.online-badge{font-size:0.65rem;color:#10b981;display:flex;align-items:center;gap:4px;font-weight:bold;}
.online-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;}

.tabs{display:flex;gap:4px;}
.tab-btn{width:auto;padding:5px 10px;font-size:0.75rem;border-radius:16px;border-color:var(--border);}
.tab-btn.active-tab{background:linear-gradient(90deg,var(--neon),var(--purple));color:#000;border:none;box-shadow:0 0 10px var(--neon);font-weight:bold;}

.main-body{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.content{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}

.msg-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:2px;}
.msg-row.me{flex-direction:row-reverse;}
.msg-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:bold;color:#fff;box-shadow:0 0 6px var(--pink);flex-shrink:0;}
.msg-card{max-width:78%;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);font-size:0.88rem;word-break:break-word;position:relative;}
.msg-row.me .msg-card{background:linear-gradient(135deg,rgba(0,243,255,0.15),rgba(168,85,247,0.15));border-color:var(--neon);box-shadow:0 0 10px rgba(0,243,255,0.2);border-bottom-right-radius:4px;}
.msg-row:not(.me) .msg-card{border-bottom-left-radius:4px;}
.msg-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.msg-user{font-size:0.75rem;color:var(--neon);font-weight:bold;text-shadow:0 0 4px var(--neon);}
.rank-tag{font-size:0.6rem;padding:1px 4px;border-radius:4px;background:rgba(234,179,8,0.2);color:var(--gold);border:1px solid var(--gold);font-weight:bold;}
.msg-body{line-height:1.3;}
.msg-img{max-width:100%;max-height:200px;border-radius:10px;margin-top:6px;border:1px solid var(--border);}
.msg-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;}
.msg-time{font-size:0.65rem;color:#64748b;}
.ticks{font-size:0.7rem;color:var(--neon);}

.reactions{display:flex;gap:4px;margin-top:4px;}
.react-btn{font-size:0.7rem;padding:2px 6px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid var(--border);color:#fff;cursor:pointer;}

.chat-input-bar{height:65px;min-height:65px;padding:8px 10px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:6px;align-items:center;backdrop-filter:blur(12px);}
.chat-input-bar input{border-radius:20px;padding-left:14px;font-size:0.9rem;}
.media-btn{width:38px;height:38px;min-width:38px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--neon);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.send-btn{width:40px;height:40px;min-width:40px;border-radius:50%;background:linear-gradient(45deg,var(--neon),var(--pink));border:none;color:#000;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px var(--neon);padding:0;}

.lb-item{padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;display:flex;justify-content:space-between;align-items:center;}
.lb-left{display:flex;align-items:center;gap:10px;}
.lb-rank{font-size:0.9rem;font-weight:bold;color:var(--gold);width:20px;}
.lb-name{color:var(--neon);font-weight:bold;font-size:0.9rem;}
.lb-count{font-size:0.8rem;color:var(--pink);font-weight:bold;}
</style>
</head>
<body>
<div id="blocker">ACCESS DENIED: ANDROID DEVICES ONLY</div>
<div class="bg-glow"></div>

<div id="authScreen" class="screen active">
  <div class="auth-box">
    <h2 id="authTitle">ZACK360</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button id="authBtn">LOGIN</button>
    <button class="toggle-btn" id="toggleAuth">Need an account? Register</button>
  </div>
</div>

<div id="appScreen" class="screen">
  <header>
    <div class="brand">
      <div class="avatar-header" id="headerAvatar">?</div>
      <div>
        <h1 id="userDisplay">ZACK360</h1>
        <div class="online-badge"><div class="online-dot"></div><span id="onlineCount">1 online</span></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active-tab" id="chatTabBtn">Chat</button>
      <button class="tab-btn" id="lbTabBtn">Board</button>
      <button class="tab-btn" id="logoutBtn" style="border-color:var(--pink);color:var(--pink)">X</button>
    </div>
  </header>
  <div class="main-body">
    <div id="chatView" class="content"></div>
    <div id="lbView" class="content" style="display:none;"></div>
    <div id="chatControls" class="chat-input-bar">
      <label class="media-btn" for="imgInput">📷</label>
      <input type="file" id="imgInput" accept="image/*" style="display:none;">
      <input type="text" id="msgInput" placeholder="Send a message..." autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, serverTimestamp, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

if (!/Android/i.test(navigator.userAgent)) {
  document.getElementById('blocker').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.remove());
}

const db = getDatabase(initializeApp({ databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

let currentUser = null;
let isRegistering = false;

const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const usernameIn = document.getElementById('username');
const passwordIn = document.getElementById('password');
const authBtn = document.getElementById('authBtn');
const toggleAuth = document.getElementById('toggleAuth');
const authTitle = document.getElementById('authTitle');
const chatView = document.getElementById('chatView');
const lbView = document.getElementById('lbView');
const msgInput = document.getElementById('msgInput');
const imgInput = document.getElementById('imgInput');
const sendBtn = document.getElementById('sendBtn');
const chatTabBtn = document.getElementById('chatTabBtn');
const lbTabBtn = document.getElementById('lbTabBtn');
const chatControls = document.getElementById('chatControls');

const playAudio = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 520; gain.gain.value = 0.05;
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e){}
};

toggleAuth.onclick = () => {
  isRegistering = !isRegistering;
  authTitle.innerText = isRegistering ? "REGISTER" : "ZACK360";
  authBtn.innerText = isRegistering ? "CREATE ACCOUNT" : "LOGIN";
  toggleAuth.innerText = isRegistering ? "Have an account? Login" : "Need an account? Register";
};

authBtn.onclick = async () => {
  const u = usernameIn.value.trim().toLowerCase();
  const p = passwordIn.value.trim();
  if(!u || !p) return alert("Fill all fields");
  const userRef = ref(db, `users/${u}`);
  const snap = await get(userRef);
  if(isRegistering){
    if(snap.exists()) return alert("Username taken");
    await set(userRef, { password: p, msgCount: 0, joined: serverTimestamp() });
    login(u);
  }else{
    if(!snap.exists() || snap.val().password !== p) return alert("Invalid credentials");
    login(u);
  }
};

function login(u){
  currentUser = u;
  document.getElementById('userDisplay').innerText = u.toUpperCase();
  document.getElementById('headerAvatar').innerText = u.charAt(0).toUpperCase();
  authScreen.classList.remove('active');
  appScreen.classList.add('active');
  setupPresence();
  initChat();
  initLeaderboard();
}

function setupPresence(){
  const pRef = ref(db, `online/${currentUser}`);
  set(pRef, true);
  onDisconnect(pRef).remove();
  onValue(ref(db, 'online'), snap => {
    const data = snap.val();
    const count = data ? Object.keys(data).length : 1;
    document.getElementById('onlineCount').innerText = `${count} online`;
  });
}

document.getElementById('logoutBtn').onclick = () => location.reload();

chatTabBtn.onclick = () => {
  chatView.style.display = 'flex';
  lbView.style.display = 'none';
  chatControls.style.display = 'flex';
  chatTabBtn.classList.add('active-tab');
  lbTabBtn.classList.remove('active-tab');
  chatView.scrollTop = chatView.scrollHeight;
};

lbTabBtn.onclick = () => {
  chatView.style.display = 'none';
  lbView.style.display = 'flex';
  chatControls.style.display = 'none';
  lbTabBtn.classList.add('active-tab');
  chatTabBtn.classList.remove('active-tab');
};

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

function linkify(text) {
  const cleanText = escapeHTML(text);
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return cleanText.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener" style="color:var(--neon);text-shadow:0 0 5px var(--neon);font-weight:bold">${url}</a>`);
}

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function initChat(){
  onValue(ref(db, 'messages'), snap => {
    chatView.innerHTML = '';
    const data = snap.val();
    if(!data) return;
    Object.keys(data).forEach(id => {
      const m = data[id];
      const isMe = m.user === currentUser;
      const div = document.createElement('div');
      div.className = `msg-row ${isMe ? 'me' : ''}`;
      
      let imgHtml = m.image ? `<img src="${m.image}" class="msg-img">` : '';
      let rxHtml = `<div class="reactions"><button class="react-btn" onclick="window.addReact('${id}','❤️')">❤️ ${m.reacts?.['❤️']||0}</button><button class="react-btn" onclick="window.addReact('${id}','🔥')">🔥 ${m.reacts?.['🔥']||0}</button></div>`;

      div.innerHTML = `
        <div class="msg-avatar">${escapeHTML(m.user.charAt(0).toUpperCase())}</div>
        <div class="msg-card">
          <div class="msg-header">
            <span class="msg-user">${escapeHTML(m.user)}</span>
            <span class="rank-tag">PRO</span>
          </div>
          <div class="msg-body">${m.text ? linkify(m.text) : ''}${imgHtml}</div>
          ${rxHtml}
          <div class="msg-footer">
            <span class="msg-time">${formatTime(m.time)}</span>
            ${isMe ? '<span class="ticks">✓✓</span>' : ''}
          </div>
        </div>
      `;
      chatView.appendChild(div);
    });
    chatView.scrollTop = chatView.scrollHeight;
  });
}

window.addReact = async (msgId, emoji) => {
  const rRef = ref(db, `messages/${msgId}/reacts/${emoji}`);
  const snap = await get(rRef);
  await set(rRef, (snap.val() || 0) + 1);
};

async function sendMessage(imgData = null){
  const text = msgInput.value.trim();
  if(!text && !imgData) return;
  msgInput.value = '';
  playAudio();
  await push(ref(db, 'messages'), { user: currentUser, text: text, image: imgData, time: serverTimestamp() });
  const countRef = ref(db, `users/${currentUser}/msgCount`);
  const snap = await get(countRef);
  await set(countRef, (snap.val() || 0) + 1);
}

sendBtn.onclick = () => sendMessage();
msgInput.onkeypress = e => { if(e.key === 'Enter') sendMessage(); };

imgInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => sendMessage(ev.target.result);
  reader.readAsDataURL(file);
};

function initLeaderboard(){
  onValue(ref(db, 'users'), snap => {
    lbView.innerHTML = '';
    const data = snap.val();
    if(!data) return;
    const users = Object.keys(data).map(k => ({ name: k, count: data[k].msgCount || 0 }));
    users.sort((a,b) => b.count - a.count);
    users.forEach((u, i) => {
      const div = document.createElement('div');
      div.className = 'lb-item';
      div.innerHTML = `
        <div class="lb-left">
          <span class="lb-rank">#${i+1}</span>
          <div class="msg-avatar" style="width:28px;height:28px;font-size:0.7rem">${escapeHTML(u.name.charAt(0).toUpperCase())}</div>
          <span class="lb-name">${escapeHTML(u.name)}</span>
        </div>
        <span class="lb-count">${u.count} msgs</span>
      `;
      lbView.appendChild(div);
    });
  });
}
</script>
</body>
</html>
