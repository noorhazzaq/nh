<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>ZACK FIGHTER</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK Fighter","short_name":"ZACK","display":"standalone","theme_color":"%230f172a","background_color":"%230f172a"}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f172a;font-family:'Inter',sans-serif;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent}
        .header{width:100%;background:#1e293b;padding:14px;text-align:center;border-bottom:1px solid #334155}
        .header h1{font-size:18px;font-weight:900;color:#ef4444;letter-spacing:1px}
        .arena{width:100%;max-width:500px;height:280px;background:linear-gradient(180deg,#1e293b,#0f172a);position:relative;overflow:hidden;border-bottom:2px solid #334155}
        .fighter{position:absolute;bottom:20px;width:60px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:left .2s,transform .2s}
        .fighter .body{width:40px;height:70px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px}
        .fighter .name{font-size:9px;font-weight:700;margin-top:4px;text-align:center}
        .fighter .hp-bar{width:60px;height:6px;background:#334155;border-radius:3px;overflow:hidden;margin-bottom:4px}
        .fighter .hp{height:100%;border-radius:3px;transition:width .3s}
        #player{left:60px}
        #player .body{background:#1e40af}
        #player .hp{background:#10b981}
        #enemy{right:60px}
        #enemy .body{background:#991b1b}
        #enemy .hp{background:#ef4444}
        .controls{width:100%;max-width:500px;padding:15px;display:flex;flex-direction:column;gap:8px}
        .row{display:flex;gap:8px}
        .ctrl{flex:1;padding:16px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#f1f5f9;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:transform .1s}
        .ctrl:active{transform:scale(.93);background:#334155}
        .ctrl.special{background:#7c2d12;border-color:#ea580c;color:#fdba74}
        .ctrl.special:active{background:#9a3412}
        .hud{width:100%;max-width:500px;padding:10px 15px;display:flex;justify-content:space-between;font-size:11px;color:#94a3b8}
        .log-box{width:100%;max-width:500px;height:80px;overflow-y:auto;padding:10px;background:#1e293b;border-radius:10px;margin:0 15px 15px}
        .log-box p{font-size:10px;color:#94a3b8;padding:2px 0}
        .log-box p.hit{color:#ef4444}
        .log-box p.kritis{color:#fbbf24}
        .log-box p.ko{color:#ef4444;font-weight:900;font-size:14px;text-align:center}
    </style>
</head>
<body>
    <div class="header"><h1>ZACK FIGHTER</h1></div>
    <div class="hud">
        <span id="turnText">Giliran: Anda</span>
        <span id="roundText">Pusingan 1</span>
    </div>
    <div class="arena">
        <div class="fighter" id="player">
            <div class="hp-bar"><div class="hp" id="playerHp" style="width:100%"></div></div>
            <div class="body">👊</div>
            <div class="name">ANDA</div>
        </div>
        <div class="fighter" id="enemy">
            <div class="hp-bar"><div class="hp" id="enemyHp" style="width:100%"></div></div>
            <div class="body">🥋</div>
            <div class="name">MUSUH</div>
        </div>
    </div>
    <div class="controls">
        <div class="row">
            <button class="ctrl" onclick="attack('light')">Pukulan Ringan</button>
            <button class="ctrl" onclick="attack('heavy')">Pukulan Kuat</button>
        </div>
        <div class="row">
            <button class="ctrl" onclick="block()">Bertahan</button>
            <button class="ctrl special" onclick="special()">Serangan Khas</button>
        </div>
        <div class="row">
            <button class="ctrl" onclick="heal()">Pulih</button>
            <button class="ctrl" onclick="resetGame()">Mula Semula</button>
        </div>
    </div>
    <div class="log-box" id="log"></div>
    <script>
    var state={playerHp:100,enemyHp:100,round:1,turn:'player',playerBlock:false,enemyBlock:false};
    function addLog(m,c){var d=document.getElementById('log');d.innerHTML='<p class="'+(c||'')+'">'+m+'</p>'+d.innerHTML;if(d.children.length>30)d.lastChild.remove()}
    function updateHud(){document.getElementById('playerHp').style.width=state.playerHp+'%';document.getElementById('enemyHp').style.width=state.enemyHp+'%';document.getElementById('roundText').textContent='Pusingan '+state.round;document.getElementById('turnText').textContent='Giliran: '+(state.turn==='player'?'Anda':'Musuh')}
    function attack(type){if(state.turn!=='player'||state.playerHp<=0||state.enemyHp<=0)return;var dmg=type==='light'?Math.floor(Math.random()*10)+5:Math.floor(Math.random()*20)+10;var crit=Math.random()<0.15;if(crit)dmg=Math.floor(dmg*2);if(state.enemyBlock){dmg=Math.floor(dmg*.3);addLog('Musuh bertahan! Kerosakan -' + dmg,'hit');state.enemyBlock=false}else{state.enemyHp=Math.max(0,state.enemyHp-dmg);addLog((crit?'KRITIKAL! ':'')+'Anda serang! -'+dmg+(crit?' (Kritikal)':''),crit?'kritis':'hit')}updateHud();if(state.enemyHp<=0)return win();state.turn='enemy';setTimeout(enemyTurn,800)}
    function block(){if(state.turn!=='player')return;state.playerBlock=true;addLog('Anda bertahan!');state.turn='enemy';setTimeout(enemyTurn,800)}
    function special(){if(state.turn!=='player'||state.playerHp<=0||state.enemyHp<=0)return;var dmg=Math.floor(Math.random()*30)+15;if(state.enemyBlock){dmg=Math.floor(dmg*.3);addLog('Musuh bertahan! Kerosakan -'+dmg,'hit');state.enemyBlock=false}else{state.enemyHp=Math.max(0,state.enemyHp-dmg);addLog('SERANGAN KHAS! -'+dmg,'kritis')}updateHud();if(state.enemyHp<=0)return win();state.turn='enemy';setTimeout(enemyTurn,800)}
    function heal(){if(state.turn!=='player'||state.playerHp<=0)return;var h=Math.floor(Math.random()*15)+5;state.playerHp=Math.min(100,state.playerHp+h);addLog('Anda pulih +'+h,'ok');updateHud();state.turn='enemy';setTimeout(enemyTurn,800)}
    function enemyTurn(){if(state.enemyHp<=0||state.playerHp<=0)return;var act=Math.random();if(act<.3){state.enemyBlock=true;addLog('Musuh bertahan!')}else if(act<.7){var dmg=Math.floor(Math.random()*12)+5;if(state.playerBlock){dmg=Math.floor(dmg*.3);addLog('Anda bertahan! -'+dmg,'hit');state.playerBlock=false}else{state.playerHp=Math.max(0,state.playerHp-dmg);addLog('Musuh serang! -'+dmg,'hit')}}else{var h=Math.floor(Math.random()*10)+5;state.enemyHp=Math.min(100,state.enemyHp+h);addLog('Musuh pulih +'+h)}updateHud();if(state.playerHp<=0)return lose();state.turn='player'}
    function win(){addLog('ANDA MENANG!','ko');state.round++;setTimeout(function(){state.playerHp=100;state.enemyHp=100;state.turn='player';updateHud()},1500)}
    function lose(){addLog('ANDA KALAH!','ko');setTimeout(resetGame,1500)}
    function resetGame(){state={playerHp:100,enemyHp:100,round:1,turn:'player',playerBlock:false,enemyBlock:false};document.getElementById('log').innerHTML='';addLog('Permainan baru!');updateHud()}
    updateHud();
    </script>
</body>
</html>
