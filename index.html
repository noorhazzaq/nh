<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Evolve Free Fire</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:sans-serif;touch-action:none}
#game{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
canvas{display:block;width:100%;height:100%;background:radial-gradient(circle at center,#1a1a2e,#050510);touch-action:none;image-rendering:pixelated}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;top:1.5vh;left:2vw;color:#fff;font-size:clamp(11px,2.6vw,20px);text-shadow:0 0 15px rgba(0,0,0,0.9);pointer-events:none;display:flex;gap:2.5vw;flex-wrap:wrap;font-weight:bold}
#hud span{background:rgba(0,0,0,0.65);padding:0.3vh 1.6vw;border-radius:10px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08)}
#hud .lvl{color:#ffdd44;border-color:#ffdd44}
#hud .xp{color:#44ffaa;border-color:#44ffaa}
#hud .hp{color:#ff4466;border-color:#ff4466}
#controls{position:absolute;bottom:2.5vh;left:0;width:100%;display:flex;justify-content:space-between;padding:0 3vw;pointer-events:none}
.ctrl-btn{pointer-events:auto;width:clamp(55px,14vw,85px);height:clamp(55px,14vw,85px);border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);color:#fff;font-size:clamp(18px,4.5vw,36px);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,0.6);transition:transform 0.05s;touch-action:none;font-weight:bold;text-shadow:0 2px 8px rgba(0,0,0,0.6)}
.ctrl-btn:active{transform:scale(0.82);background:rgba(255,200,50,0.25)}
#fireBtn{width:clamp(65px,17vw,105px);height:clamp(65px,17vw,105px);background:rgba(255,40,40,0.25);border-color:rgba(255,80,80,0.6);font-size:clamp(14px,3.5vw,28px)}
#info{position:absolute;bottom:10vh;left:50%;transform:translateX(-50%);color:#88ddff;font-size:clamp(11px,2.2vw,18px);background:rgba(0,0,0,0.7);padding:0.4vh 3vw;border-radius:20px;backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none;text-shadow:0 2px 8px #000;border:1px solid rgba(136,221,255,0.15)}
#info .highlight{color:#ffdd44}
@media (orientation:portrait){#controls{padding:0 5vw}}
@media (orientation:landscape){#controls{padding:0 8vw}}
</style>
</head>
<body>
<div id="game">
<canvas id="gc"></canvas>
<div id="ui">
<div id="hud">
<span class="lvl">⭐ Lv.<span id="levelDisplay">1</span></span>
<span class="xp">⚡ <span id="xpDisplay">0</span>/<span id="xpMaxDisplay">10</span></span>
<span class="hp">❤️ <span id="hpDisplay">100</span></span>
<span>💀 <span id="scoreDisplay">0</span></span>
<span>🌊 <span id="waveDisplay">1</span></span>
</div>
<div id="controls">
<div class="ctrl-btn" id="moveLeft">◀</div>
<div class="ctrl-btn" id="fireBtn">🔥</div>
<div class="ctrl-btn" id="moveRight">▶</div>
</div>
<div id="info">⚔️ <span class="highlight">EVOLVE</span> · Survive & grow stronger</div>
</div>
</div>
<script>
(function(){
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const scoreSpan=document.getElementById('scoreDisplay');
const waveSpan=document.getElementById('waveDisplay');
const levelSpan=document.getElementById('levelDisplay');
const xpSpan=document.getElementById('xpDisplay');
const xpMaxSpan=document.getElementById('xpMaxDisplay');
const hpSpan=document.getElementById('hpDisplay');
const moveLeft=document.getElementById('moveLeft');
const moveRight=document.getElementById('moveRight');
const fireBtn=document.getElementById('fireBtn');

let W,H;
function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
}
window.addEventListener('resize',resize);
resize();

const player={
x:0,y:0,r:0,
hp:100,maxHp:100,
level:1,xp:0,xpMax:10,
damage:10,fireRate:15,fireCooldown:0,
speed:3.2,
shotCount:1,spread:0
};
const enemies=[];
const bullets=[];
const particles=[];
const floatingTexts=[];
let score=0;
let wave=1;
let alive=true;
let moveDir=0;
let enemySpawnCounter=0;
const ENEMY_SPAWN_RATE=35;
let enemySpeed=1.0;
let baseEnemySpeed=1.0;
let frame=0;
let comboCount=0;
let comboTimer=0;

function resetGame(){
player.x=W/2;
player.y=H*0.85;
player.r=Math.min(W,H)*0.022;
player.hp=100;
player.maxHp=100;
player.level=1;
player.xp=0;
player.xpMax=10;
player.damage=10;
player.fireRate=15;
player.fireCooldown=0;
player.speed=3.2;
player.shotCount=1;
player.spread=0;
enemies.length=0;
bullets.length=0;
particles.length=0;
floatingTexts.length=0;
score=0;
wave=1;
alive=true;
enemySpeed=1.0;
baseEnemySpeed=1.0;
frame=0;
comboCount=0;
comboTimer=0;
updateHUD();
}

function updateHUD(){
scoreSpan.textContent=score;
waveSpan.textContent=wave;
levelSpan.textContent=player.level;
xpSpan.textContent=player.xp;
xpMaxSpan.textContent=player.xpMax;
hpSpan.textContent=Math.floor(player.hp);
}

function spawnParticles(x,y,color,count=12,speed=3){
for(let i=0;i<count;i++){
const angle=Math.random()*Math.PI*2;
const sp=Math.random()*speed+0.5;
particles.push({
x,y,
vx:Math.cos(angle)*sp,
vy:Math.sin(angle)*sp,
life:30+Math.random()*30,
maxLife:60,
r:2+Math.random()*4,
color:color
});
}
}

function spawnFloatingText(x,y,text,color='#ffdd44',size=16){
floatingTexts.push({x,y,text,color,size,life:60,vy:-1.5});
}

function levelUp(){
player.level++;
player.xp=0;
player.xpMax=Math.floor(player.xpMax*1.4)+2;
player.maxHp+=15;
player.hp=player.maxHp;
player.damage+=3;
player.speed+=0.15;
if(player.level%2===0)player.shotCount++;
if(player.level%3===0)player.fireRate=Math.max(6,player.fireRate-1);
if(player.level%4===0)player.spread+=0.05;
spawnParticles(player.x,player.y,'#ffdd44',40,6);
spawnParticles(player.x,player.y,'#44ffaa',30,5);
spawnFloatingText(player.x,player.y-30,'⬆ LEVEL UP!','#ffdd44',24);
updateHUD();
}

function gainXP(amount){
if(!alive)return;
player.xp+=amount;
while(player.xp>=player.xpMax)levelUp();
updateHUD();
}

function spawnEnemy(){
const r=Math.min(W,H)*0.03+Math.random()*0.01*W;
const side=Math.floor(Math.random()*4);
let x,y;
if(side===0){x=Math.random()*W;y=-r;}
else if(side===1){x=W+r;y=Math.random()*H;}
else if(side===2){x=Math.random()*W;y=H+r;}
else {x=-r;y=Math.random()*H;}
const type=Math.random();
let hp=1;
let speedMul=1;
let color='#ff6644';
let size=r;
if(type<0.15 && wave>3){
hp=3;speedMul=0.6;color='#ff44ff';size=r*1.4;
}else if(type<0.35 && wave>2){
hp=2;speedMul=0.8;color='#ff8844';size=r*1.2;
}
enemies.push({
x,y,r:size,
hp:hp,maxHp:hp,
speed:enemySpeed*speedMul,
color:color,
damage:10+wave*1.5,
type:type<0.15?'tank':type<0.35?'strong':'normal'
});
}

function spawnWave(){
const count=3+wave*2+Math.floor(wave/2);
for(let i=0;i<count;i++)spawnEnemy();
enemySpeed=baseEnemySpeed+wave*0.12;
}

function fireBullet(){
if(!alive)return;
if(player.fireCooldown>0)return;
const angle=-Math.PI/2;
const speed=7+Math.min(W,H)*0.008;
const count=player.shotCount;
for(let i=0;i<count;i++){
const spread=player.spread*(i-(count-1)/2)*0.8;
const a=angle+spread+Math.random()*0.02;
const bx=player.x+Math.cos(a)*(player.r+5);
const by=player.y+Math.sin(a)*(player.r+5);
bullets.push({
x:bx,y:by,
vx:Math.cos(a)*speed,
vy:Math.sin(a)*speed,
r:3+player.level*0.15,
damage:player.damage,
life:80
});
}
player.fireCooldown=player.fireRate;
spawnParticles(player.x,player.y-10,'#ffaa33',5,2);
}

function update(){
if(!alive)return;
frame++;
if(player.fireCooldown>0)player.fireCooldown--;
if(moveDir!==0){
const spd=player.speed+Math.min(W,H)*0.006;
player.x+=moveDir*spd;
player.x=Math.max(player.r,Math.min(W-player.r,player.x));
}
if(comboTimer>0){comboTimer--;if(comboTimer===0)comboCount=0;}
if(frame%ENEMY_SPAWN_RATE===0){
if(enemies.length<40+wave*3)spawnEnemy();
}
if(frame%400===0){
wave++;
enemySpeed=baseEnemySpeed+wave*0.12;
spawnWave();
updateHUD();
}
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
const dx=player.x-e.x;
const dy=player.y-e.y;
const dist=Math.hypot(dx,dy);
if(dist>0.5){
const normX=dx/dist;
const normY=dy/dist;
e.x+=normX*e.speed;
e.y+=normY*e.speed;
}
if(dist<player.r+e.r){
player.hp-=e.damage*0.15;
spawnParticles(player.x,player.y,'#ff4444',15,3);
spawnFloatingText(player.x,player.y-20,'-'+Math.floor(e.damage*0.15),'#ff4444',14);
if(player.hp<=0){player.hp=0;alive=false;updateHUD();return;}
updateHUD();
}
}
for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];
b.x+=b.vx;
b.y+=b.vy;
b.life--;
if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30||b.life<=0){
bullets.splice(i,1);continue;
}
let hit=false;
for(let j=enemies.length-1;j>=0;j--){
const e=enemies[j];
if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){
e.hp-=b.damage;
spawnParticles(b.x,b.y,'#ffaa44',8,2);
if(e.hp<=0){
const xpGain=1+(e.type==='tank'?3:e.type==='strong'?2:1);
gainXP(xpGain);
comboCount++;
comboTimer=60;
score++;
if(comboCount>5)spawnFloatingText(e.x,e.y-20,'🔥 '+comboCount+'x COMBO!','#ff8800',18);
spawnParticles(e.x,e.y,e.color,20,4);
enemies.splice(j,1);
updateHUD();
}else{
spawnParticles(b.x,b.y,'#ff8844',6,2);
}
hit=true;
break;
}
}
if(hit){bullets.splice(i,1);}
}
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.vx*=0.96;
p.vy*=0.96;
p.life--;
if(p.life<=0){particles.splice(i,1);}
}
for(let i=floatingTexts.length-1;i>=0;i--){
const ft=floatingTexts[i];
ft.y+=ft.vy;
ft.life--;
if(ft.life<=0){floatingTexts.splice(i,1);}
}
if(!alive)return;
if(enemies.length===0){
wave++;
enemySpeed=baseEnemySpeed+wave*0.12;
spawnWave();
updateHUD();
}
}

function draw(){
ctx.clearRect(0,0,W,H);
const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.9);
grad.addColorStop(0,'#1a1a32');
grad.addColorStop(1,'#06060e');
ctx.fillStyle=grad;
ctx.fillRect(0,0,W,H);
ctx.shadowBlur=0;
ctx.strokeStyle='rgba(100,200,255,0.06)';
ctx.lineWidth=1;
for(let i=0;i<20;i++){
const x=(i*47+frame*0.1)%W;
const y=(i*73+frame*0.05)%H;
ctx.beginPath();
ctx.arc(x,y,1,0,Math.PI*2);
ctx.stroke();
}
ctx.shadowBlur=25;
ctx.shadowColor='rgba(0,180,255,0.2)';
ctx.strokeStyle='rgba(100,200,255,0.12)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(player.x,player.y,player.r*3.5,0,Math.PI*2);
ctx.stroke();
ctx.shadowBlur=0;
const hpRatio=player.hp/player.maxHp;
ctx.strokeStyle='rgba(255,255,255,0.1)';
ctx.lineWidth=3;
ctx.beginPath();
ctx.arc(player.x,player.y,player.r+6,0,Math.PI*2);
ctx.stroke();
ctx.strokeStyle=hpRatio>0.5?`rgba(68,255,136,${0.3+hpRatio*0.3})`:'rgba(255,68,68,0.5)';
ctx.lineWidth=4;
ctx.beginPath();
ctx.arc(player.x,player.y,player.r+6,-Math.PI/2,(-Math.PI/2)+(Math.PI*2*hpRatio));
ctx.stroke();
ctx.shadowBlur=30;
ctx.shadowColor='#00ddff';
const grd=ctx.createRadialGradient(player.x-4,player.y-4,2,player.x,player.y,player.r);
grd.addColorStop(0,'#66eeff');
grd.addColorStop(0.4,'#00bbff');
grd.addColorStop(1,'#0066aa');
ctx.fillStyle=grd;
ctx.beginPath();
ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(player.x-3,player.y-4,player.r*0.22,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(player.x+4,player.y-4,player.r*0.22,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#ff4466';
ctx.beginPath();
ctx.arc(player.x,player.y+2,player.r*0.18,0,Math.PI);
ctx.fill();
ctx.fillStyle='#88ddff';
ctx.font='bold '+Math.max(10,player.r*0.7)+'px sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('⭐',player.x,player.y-player.r-8);
for(const e of enemies){
ctx.shadowBlur=20;
ctx.shadowColor=e.color;
const grd2=ctx.createRadialGradient(e.x-3,e.y-4,2,e.x,e.y,e.r);
grd2.addColorStop(0,'#ffaa66');
grd2.addColorStop(0.3,e.color);
grd2.addColorStop(1,'#882200');
ctx.fillStyle=grd2;
ctx.beginPath();
ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle='rgba(255,255,255,0.2)';
ctx.beginPath();
ctx.arc(e.x-3,e.y-5,e.r*0.25,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#000';
ctx.beginPath();
ctx.arc(e.x-4,e.y-2,2,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(e.x+3,e.y-2,2,0,Math.PI*2);
ctx.fill();
if(e.hp<e.maxHp){
ctx.fillStyle='rgba(0,0,0,0.5)';
ctx.fillRect(e.x-e.r,e.y-e.r-6,e.r*2,3);
ctx.fillStyle='#44ff88';
ctx.fillRect(e.x-e.r+1,e.y-e.r-5,(e.r*2-2)*(e.hp/e.maxHp),1.5);
}
ctx.fillStyle='#ff3300';
ctx.font='bold '+Math.max(7,e.r*0.6)+'px sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('👹',e.x,e.y-1);
}
for(const b of bullets){
ctx.shadowBlur=30;
ctx.shadowColor='#ffcc44';
const grd3=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r+4);
grd3.addColorStop(0,'#ffffaa');
grd3.addColorStop(0.3,'#ffaa33');
grd3.addColorStop(1,'#ff4400');
ctx.fillStyle=grd3;
ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(b.x-2,b.y-3,2,0,Math.PI*2);
ctx.fill();
}
for(const p of particles){
const alpha=p.life/p.maxLife;
ctx.globalAlpha=alpha;
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r*alpha,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
for(const ft of floatingTexts){
const alpha=ft.life/60;
ctx.globalAlpha=alpha;
ctx.fillStyle=ft.color;
ctx.font='bold '+ft.size+'px sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.shadowBlur=20;
ctx.shadowColor='#000';
ctx.fillText(ft.text,ft.x,ft.y);
}
ctx.globalAlpha=1;
ctx.shadowBlur=0;
if(!alive){
ctx.fillStyle='rgba(0,0,0,0.7)';
ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ff2244';
ctx.font='bold '+Math.min(W,H)*0.08+'px sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.shadowBlur=40;
ctx.shadowColor='#ff0000';
ctx.fillText('💀 GAME OVER',W/2,H/2-50);
ctx.fillStyle='#ffcc00';
ctx.font='bold '+Math.min(W,H)*0.03+'px sans-serif';
ctx.shadowBlur=0;
ctx.fillText('Tap anywhere to restart',W/2,H/2+20);
ctx.fillStyle='#88ddff';
ctx.font='bold '+Math.min(W,H)*0.025+'px sans-serif';
ctx.fillText('Level '+player.level+' · '+score+' kills',W/2,H/2+60);
}
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

function handleRestart(e){
if(!alive){
e.preventDefault();
resetGame();
}
}

canvas.addEventListener('click',handleRestart);
canvas.addEventListener('touchstart',function(e){
if(!alive){
e.preventDefault();
resetGame();
}
},{passive:false});

moveLeft.addEventListener('touchstart',function(e){e.preventDefault();moveDir=-1;},{passive:false});
moveLeft.addEventListener('touchend',function(e){e.preventDefault();if(moveDir<0)moveDir=0;},{passive:false});
moveLeft.addEventListener('touchcancel',function(e){if(moveDir<0)moveDir=0;});
moveRight.addEventListener('touchstart',function(e){e.preventDefault();moveDir=1;},{passive:false});
moveRight.addEventListener('touchend',function(e){e.preventDefault();if(moveDir>0)moveDir=0;},{passive:false});
moveRight.addEventListener('touchcancel',function(e){if(moveDir>0)moveDir=0;});
fireBtn.addEventListener('touchstart',function(e){e.preventDefault();fireBullet();},{passive:false});
fireBtn.addEventListener('touchcancel',function(e){});

document.addEventListener('keydown',function(e){
if(e.key==='ArrowLeft')moveDir=-1;
if(e.key==='ArrowRight')moveDir=1;
if(e.key===' '||e.key==='Space'){e.preventDefault();fireBullet();}
if(e.key==='r'&&!alive)resetGame();
});
document.addEventListener('keyup',function(e){
if(e.key==='ArrowLeft'&&moveDir<0)moveDir=0;
if(e.key==='ArrowRight'&&moveDir>0)moveDir=0;
});

resetGame();
loop();

setInterval(function(){
if(!alive)return;
if(enemies.length<8+wave*2){
for(let i=0;i<2;i++)spawnEnemy();
}
},1800);

const style=document.createElement('style');
style.textContent='*{touch-action:none!important}';
document.head.appendChild(style);

const banCheck=setInterval(function(){
if(window.innerWidth<200||window.innerHeight<200){
document.body.innerHTML='<div style="color:#fff;background:#000;display:flex;align-items:center;justify-content:center;height:100vh;font-size:2rem;text-align:center;padding:20px;">⚠️ ANDROID ONLY</div>';
clearInterval(banCheck);
}
},1000);

if(navigator.userAgent.indexOf('Android')===-1){
document.body.innerHTML='<div style="color:#fff;background:#000;display:flex;align-items:center;justify-content:center;height:100vh;font-size:2rem;text-align:center;padding:20px;">🚫 ANDROID BROWSER ONLY</div>';
}
})();
</script>
</body>
</html>
