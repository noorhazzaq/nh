<!-- DeepSeek: Production-ready with everything -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Login | ZACK360</title>
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-container glass-morphism">
    <!-- Logo & Branding -->
    <div class="auth-header">
      <span class="logo">✦ ZACK360</span>
      <p class="subtitle">Secure access to your account</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form" autocomplete="off">
      <!-- Username Field -->
      <div class="input-group floating">
        <i class="fas fa-user input-icon"></i>
        <input 
          type="text" 
          id="username" 
          class="input-field" 
          placeholder=" " 
          required 
          minlength="3"
          maxlength="20"
          pattern="[a-zA-Z0-9_]+"
          aria-describedby="username-error"
        />
        <label for="username" class="input-label">Username</label>
        <span id="username-error" class="error-message"></span>
      </div>

      <!-- Password Field -->
      <div class="input-group floating">
        <i class="fas fa-lock input-icon"></i>
        <input 
          type="password" 
          id="password" 
          class="input-field" 
          placeholder=" " 
          required 
          minlength="6"
          aria-describedby="password-error"
        />
        <label for="password" class="input-label">Password</label>
        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
          <i class="fas fa-eye"></i>
        </button>
        <span id="password-error" class="error-message"></span>
      </div>

      <!-- Remember Me & Forgot -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" />
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn-neon" id="loginBtn">
        <span class="btn-text">Secure Login</span>
        <i class="fas fa-arrow-right btn-icon"></i>
      </button>

      <!-- Register Link -->
      <p class="auth-switch">
        Don't have an account? 
        <a href="#" id="registerLink">Create one</a>
      </p>
    </form>

    <!-- Social Login -->
    <div class="social-login">
      <span class="divider">or continue with</span>
      <div class="social-buttons">
        <button class="social-btn google">
          <i class="fab fa-google"></i>
          Google
        </button>
        <button class="social-btn github">
          <i class="fab fa-github"></i>
          GitHub
        </button>
      </div>
    </div>

    <!-- Footer -->
    <p class="auth-footer">
      By continuing, you agree to our 
      <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
    </p>
  </div>

  <script type="module">
    // Full-featured login with validation, security, and UX
    import { validateForm, showToast } from './utils.js';
    
    const loginForm = document.getElementById('loginForm');
    
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      // Real-time validation
      if (!validateForm({ username, password })) {
        showToast('Please fix the errors above', 'warning');
        return;
      }
      
      // Show loading state
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Authenticating...';
      
      try {
        // API call with timeout
        const response = await Promise.race([
          fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          }),
          new Promise((_, reject) => 
            setTimeout(() => reject(new Error('Request timeout')), 5000)
          )
        ]);
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }
        
        // Success
        showToast('Welcome back!', 'success');
        window.location.href = '/dashboard';
        
      } catch (error) {
        // Error handling
        console.error('Login error:', error);
        showToast(error.message || 'Authentication failed', 'error');
        
        // Re-enable button
        btn.disabled = false;
        btn.innerHTML = `
          <span class="btn-text">Secure Login</span>
          <i class="fas fa-arrow-right btn-icon"></i>
        `;
      }
    });
  </script>
</body>
</html>
