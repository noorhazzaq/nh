    <style>
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --accent: #e94560;
            --gold: #ffd700;
            --text: #eee;
            --muted: #aaa;
            --border: #2a2a4a;
            --section-bg: #16213e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .header h1 {
            font-size: 2.5em;
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: var(--muted);
            font-size: 1.1em;
        }
        
        .header .count {
            color: var(--gold);
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .search-bar {
            margin: 20px auto;
            max-width: 600px;
        }
        
        .search-bar input {
            width: 100%;
            padding: 15px;
            background: #1a1a2e;
            border: 2px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 1.1em;
            transition: border-color 0.3s;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .category-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .category-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .category-btn:hover,
        .category-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .system-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .system-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
            border-color: var(--accent);
        }
        
        .system-card .number {
            color: var(--gold);
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 8px;
        }
        
        .system-card .title {
            font-weight: 700;
            font-size: 1.05em;
            margin-bottom: 6px;
            color: #fff;
        }
        
        .system-card .description {
            color: var(--muted);
            font-size: 0.85em;
            line-height: 1.4;
        }
        
        .system-card .category-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
        }
        
        .section-header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 0 15px;
            font-size: 2em;
            color: var(--accent);
            font-weight: bold;
        }
        
        .section-header .emoji {
            font-size: 1.2em;
        }
        
        .save-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin: 30px auto;
            max-width: 600px;
            text-align: center;
        }
        
        .save-section h2 {
            color: var(--gold);
            margin-bottom: 15px;
        }
        
        .save-btn {
            padding: 15px 30px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        
        .save-btn:hover {
            background: #d63851;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.4);
        }
        
        .save-btn.secondary {
            background: #333;
        }
        
        .save-btn.secondary:hover {
            background: #444;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
        
        .status.success {
            display: block;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        
        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .status.loading {
            display: block;
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .hidden {
            display: none !important;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .category-btn {
                padding: 8px 15px;
                font-size: 0.8em;
            }
        }
    </style>
</head>

        const container = document.getElementById('systemsContainer');
        let currentCategory = 'all';
        let searchTerm = '';
        
        function renderSystems() {
            container.innerHTML = '';
            
            const filtered = systems.filter(system => {
                const matchesCategory = currentCategory === 'all' || system.category === currentCategory;
                const matchesSearch = system.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    system.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    system.id.toString().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="section-header">No systems found</div>';
                return;
            }
            
            // Group by category for better organization
            const categories = {};
            filtered.forEach(system => {
                if (!categories[system.category]) {
                    categories[system.category] = [];
                }
                categories[system.category].push(system);
            });
            
            const categoryNames = {
                'core': '🏛️ Core Government Systems',
                'gameplay': '🎮 Gameplay Mechanics',
                'world': '🌍 World Systems',
                'character': '🎭 Character Systems',
                'institution': '🏢 Institution Systems',
                'policy': '💼 Policy Systems',
                'action': '🎯 Action Systems',
                'consequence': '📊 Consequence Systems',
                'dynamic': '🔄 Dynamic Systems',
                'advanced': '🎲 Advanced Systems',
                'special': '🌟 Special Systems',
                'ultimate': '🏆 Ultimate Systems'
            };
            
            Object.keys(categories).forEach(category => {
                if (currentCategory === 'all') {
                    const header = document.createElement('div');
                    header.className = 'section-header';
                    header.innerHTML = `<span class="emoji">${categoryNames[category].split(' ')[0]}</span> ${categoryNames[category].split(' ').slice(1).join(' ')}`;
                    container.appendChild(header);
                }
                
                categories[category].forEach(system => {
                    const card = document.createElement('div');
                    card.className = 'system-card';
                    card.innerHTML = `
                        <div class="category-tag">${categoryNames[system.category].split(' ')[0]}</div>
                        <div class="number">#${system.id}</div>
                        <div class="title">${system.title}</div>
                        <div class="description">${system.desc}</div>
                    `;
                    card.onclick = () => showSystemDetail(system);
                    container.appendChild(card);
                });
            });
        }
        
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderSystems();
        }
        
        function filterSystems() {
            searchTerm = document.getElementById('searchInput').value;
            renderSystems();
        }
        
        function showSystemDetail(system) {
            alert(`System #${system.id}\n\n${system.title}\n\n${system.desc}`);
        }
        
        function saveSettings() {
            const status = document.getElementById('status');
            status.className = 'status loading';
            status.textContent = 'Saving settings...';
            
            const settings = {
                currentCategory,
                searchTerm,
                timestamp: new Date().toISOString(),
                totalSystems: systems.length,
                savedAt: Date.now()
            };
            
            // Save to localStorage
            localStorage.setItem('presidentSimulatorSettings', JSON.stringify(settings));
            
            // Save to Firebase if available
            const firebaseUrl = 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
            fetch(`${firebaseUrl}/settings.json`, {
                method: 'PUT',
                body: JSON.stringify(settings),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    status.className = 'status success';
                    status.textContent = '✅ Settings saved successfully to localStorage and Firebase!';
                } else {
                    status.className = 'status success';
                    status.textContent = '✅ Settings saved to localStorage (Firebase sync pending)';
                }
            })
            .catch(error => {
                status.className = 'status success';
                status.textContent = '✅ Settings saved to localStorage';
            });
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        function loadSettings() {
            const status = document.getElementById('status');
            const saved = localStorage.getItem('presidentSimulatorSettings');
            
            if (saved) {
                const settings = JSON.parse(saved);
                currentCategory = settings.currentCategory || 'all';
                searchTerm = settings.searchTerm || '';
                document.getElementById('searchInput').value = searchTerm;
                
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.textContent.toLowerCase().includes(currentCategory)) {
                        btn.classList.add('active');
                    }
                });
                
                renderSystems();
                
                status.className = 'status success';
                status.textContent = '✅ Settings loaded successfully!';
            } else {
                status.className = 'status error';
                status.textContent = '❌ No saved settings found';
            }
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        function exportSettings() {
            const settings = {
                version: '1.0',
                game: 'President Simulator',
                totalSystems: systems.length,
                systems: systems,
                savedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'president-simulator-settings.json';
            a.click();
            URL.revokeObjectURL(url);
            
            const status = document.getElementById('status');
            status.className = 'status success';
            status.textContent = '📤 Settings exported as JSON file!';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        function importSettings() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const settings = JSON.parse(event.target.result);
                        const status = document.getElementById('status');
                        status.className = 'status success';
                        status.textContent = `📥 Imported ${settings.totalSystems || settings.systems?.length || 0} systems successfully!`;
                        setTimeout(() => {
                            status.style.display = 'none';
                        }, 3000);
                    } catch (error) {
                        const status = document.getElementById('status');
                        status.className = 'status error';
                        status.textContent = '❌ Invalid JSON file';
                        setTimeout(() => {
                            status.style.display = 'none';
                        }, 3000);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        // Initialize
        renderSystems();
        console.log('President Simulator - 999 Systems Loaded');
        console.log('Total Systems:', systems.length);
    </script>
</body>
</html>
