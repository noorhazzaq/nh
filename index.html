<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>✨ Neon Nexus</title>
  <style>
    /* ===== RESET & BASE ===== */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--font:'Inter',system-ui,sans-serif;--bg:#0a0a12;--glass:rgba(255,255,255,.03);--border:rgba(255,255,255,.06);--pink:#ff2d75;--blue:#00d4ff;--purple:#7c3aed;--cyan:#22d3ee;--green:#34d399;--yellow:#fbbf24;--text:#fff;--muted:rgba(255,255,255,.4);--dim:rgba(255,255,255,.15);--radius:20px;--sm:12px;--full:9999px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--t:.2s cubic-bezier(.4,0,.2,1)}
    html,body{height:100%;width:100%;overflow:hidden;position:fixed;top:0;left:0;background:var(--bg)}
    body{color:var(--text);font-family:var(--font);display:flex;justify-content:center;align-items:center;padding:8px;touch-action:manipulation;background:radial-gradient(ellipse at 50% 0%,#0f0a2a 0%,#0a0a12 70%)}

    /* ===== BACKGROUND ===== */
    .bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);background-size:50px 50px;z-index:0;pointer-events:none}
    .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;animation:orb 20s ease-in-out infinite alternate}
    .orb--1{width:400px;height:400px;background:rgba(255,45,117,.08);top:-10%;left:-10%}
    .orb--2{width:350px;height:350px;background:rgba(0,212,255,.06);bottom:-10%;right:-10%;animation-delay:-7s}
    .orb--3{width:300px;height:300px;background:rgba(124,58,237,.07);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-14s}
    @keyframes orb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}100%{transform:translate(-20px,20px) scale(.9)}}

    #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .sparkle{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(255,45,117,.03) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(0,212,255,.03) 0%,transparent 50%)}
    .emoji{position:fixed;font-size:1.5rem;pointer-events:none;z-index:0;animation:float 8s ease-in-out infinite;opacity:.2}
    .emoji:nth-child(1){top:10%;left:5%}
    .emoji:nth-child(2){top:20%;right:8%;animation-delay:-2s}
    .emoji:nth-child(3){bottom:30%;left:10%;animation-delay:-4s}
    .emoji:nth-child(4){bottom:20%;right:5%;animation-delay:-6s}
    @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(10deg)}}

    /* ===== APP ===== */
    .app{width:100%;max-width:480px;height:100%;max-height:932px;background:var(--glass);backdrop-filter:blur(60px);-webkit-backdrop-filter:blur(60px);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(124,58,237,.08),0 8px 32px rgba(0,0,0,.6);position:relative;z-index:1;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
    .rainbow{position:absolute;inset:-2px;border-radius:var(--radius);padding:2px;background:conic-gradient(from 0deg,var(--pink),var(--purple),var(--blue),var(--cyan),var(--green),var(--yellow),var(--pink));background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:spin 6s linear infinite;z-index:2}
    @keyframes spin{0%{background-position:0% 50%}100%{background-position:300% 50%}}

    /* ===== HEADER ===== */
    .header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0;min-height:56px;border-bottom:1px solid var(--border);position:relative}
    .header::after{content:'';position:absolute;bottom:-1px;left:10%;width:80%;height:1px;background:linear-gradient(90deg,transparent,var(--pink),var(--blue),transparent);opacity:.3;animation:line 3s ease-in-out infinite}
    @keyframes line{0%,100%{opacity:.2}50%{opacity:.6}}

    .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .logo{width:36px;height:36px;border-radius:var(--sm);background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 40px rgba(255,45,117,.3);flex-shrink:0;animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{box-shadow:0 0 40px rgba(255,45,117,.3)}50%{box-shadow:0 0 70px rgba(124,58,237,.5)}}
    .title{font-size:1.1rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.7) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .title .hl{background:linear-gradient(135deg,var(--pink),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    .right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}

    /* ===== STATUS ===== */
    .badge{display:flex;align-items:center;gap:6px;padding:4px 12px;background:var(--glass);border:1px solid var(--border);border-radius:var(--full);font-size:.55rem;font-weight:500;white-space:nowrap;flex-shrink:0;min-height:30px;color:var(--muted);backdrop-filter:blur(10px)}
    .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0;box-shadow:0 0 20px rgba(52,211,153,.4);animation:pulse 2s ease-in-out infinite;transition:.3s}
    @keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(52,211,153,.4)}50%{box-shadow:0 0 50px rgba(52,211,153,.8)}}
    .badge .dot.off{background:var(--pink);box-shadow:0 0 20px rgba(255,45,117,.4);animation:blink .8s infinite}
    .badge .count{color:var(--text);font-weight:600}

    /* ===== AUTH ===== */
    .auth{display:flex;gap:6px;align-items:center;flex:1;min-width:0;max-width:100%}
    .auth input{padding:6px 12px;border:1px solid var(--border);border-radius:var(--full);background:var(--glass);color:var(--text);font-family:var(--font);font-size:.6rem;font-weight:400;width:80px;transition:var(--t);min-height:30px;flex:1;min-width:50px;max-width:100px;backdrop-filter:blur(10px)}
    .auth input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 30px rgba(0,212,255,.1);width:90px}
    .auth input::placeholder{color:var(--dim);font-weight:300}
    .auth input:disabled{opacity:.4;cursor:not-allowed}

    /* ===== BUTTONS ===== */
    .btn{padding:6px 14px;border:none;border-radius:var(--full);background:linear-gradient(135deg,var(--pink),var(--purple));color:var(--text);font-family:var(--font);font-size:.55rem;font-weight:600;cursor:pointer;transition:var(--t);min-height:30px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;flex-shrink:0;touch-action:manipulation;user-select:none;box-shadow:0 0 30px rgba(255,45,117,.15);position:relative;overflow:hidden}
    .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:var(--t)}
    .btn:hover:not(:disabled)::before{opacity:1}
    .btn:active:not(:disabled){transform:scale(.95)}
    .btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none!important}
    .btn--danger{background:linear-gradient(135deg,var(--pink),#e11d48)}
    .btn--join{background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 0 30px rgba(124,58,237,.2)}

    /* ===== MESSAGES ===== */
    .msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:smooth}
    .msgs::-webkit-scrollbar{width:3px}
    .msgs::-webkit-scrollbar-track{background:transparent}
    .msgs::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink),var(--blue));border-radius:var(--full)}

    .status-msg{text-align:center;font-size:.6rem;font-weight:400;color:var(--muted);padding:24px 12px;letter-spacing:.5px;animation:pulseText 2s ease-in-out infinite}
    @keyframes pulseText{0%,100%{opacity:.4}50%{opacity:.8}}

    /* ===== MESSAGE BUBBLES ===== */
    .msg{padding:8px 14px;border-radius:var(--sm);max-width:88%;word-wrap:break-word;animation:slide .25s cubic-bezier(.4,0,.2,1);line-height:1.5;font-size:.75rem;font-weight:400;transition:var(--t);position:relative}
    @keyframes slide{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
    .msg.own{align-self:flex-end;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-bottom-right-radius:4px;box-shadow:0 0 30px rgba(255,45,117,.15)}
    .msg.other{align-self:flex-start;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
    .msg .sender{font-size:.5rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;opacity:.6;margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .msg.own .sender{opacity:.8;color:rgba(255,255,255,.8)}
    .msg .time{font-size:.4rem;font-weight:400;opacity:.4;margin-left:4px}
    .msg .text{word-break:break-word;line-height:1.6}

    /* ===== TYPING ===== */
    .typing{display:none;align-items:center;gap:4px;padding:6px 12px;background:var(--glass);border-radius:var(--full);font-size:.5rem;color:var(--muted);margin:4px 0}
    .typing.active{display:flex}
    .typing .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:bounce 1.2s ease-in-out infinite}
    .typing .dot:nth-child(2){animation-delay:.2s}
    .typing .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}

    /* ===== INPUT ===== */
    .input-area{padding:8px 14px 14px;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:calc(14px + var(--safe-bottom));background:var(--glass);backdrop-filter:blur(20px);position:relative}
    .row{display:flex;gap:8px;align-items:center}
    .row input{flex:1;padding:10px 16px;border:1px solid var(--border);border-radius:var(--full);background:var(--glass);color:var(--text);font-family:var(--font);font-size:.7rem;font-weight:400;min-width:40px;transition:var(--t);min-height:40px;backdrop-filter:blur(10px)}
    .row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 40px rgba(0,212,255,.05)}
    .row input::placeholder{color:var(--dim);font-weight:300}
    .row input:disabled{opacity:.3;cursor:not-allowed}
    .row .btn{font-size:.65rem;padding:10px 20px;min-height:40px;flex-shrink:0}
    .row .btn--send{background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 0 30px rgba(0,212,255,.2)}

    /* ===== NOTIFICATION ===== */
    .bell{position:fixed;bottom:80px;right:20px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));display:none;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 30px rgba(255,45,117,.3);z-index:10;cursor:pointer}
    .bell.active{display:flex;animation:bell 2s ease-in-out infinite}
    @keyframes bell{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    /* ===== CONFETTI ===== */
    .confetti-box{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;overflow:hidden}
    .confetti{position:absolute;width:6px;height:6px;top:-10px;animation:fall linear infinite;opacity:0}
    @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}

    /* ===== RESPONSIVE ===== */
    @media(max-width:380px){
      .header{padding:8px 10px;min-height:48px}
      .logo{width:28px;height:28px;font-size:.9rem}
      .title{font-size:.85rem}
      .auth input{font-size:.5rem;padding:4px 8px;min-height:26px;width:55px;max-width:70px}
      .auth input:focus{width:65px}
      .btn{font-size:.45rem;padding:4px 10px;min-height:26px;min-width:30px}
      .badge{font-size:.45rem;padding:3px 8px;min-height:26px}
      .badge .dot{width:6px;height:6px}
      .msgs{padding:8px 10px;gap:3px}
      .msg{padding:5px 10px;max-width:95%;font-size:.65rem}
      .msg .sender{font-size:.4rem}
      .msg .text{font-size:.65rem}
      .input-area{padding:6px 10px 10px}
      .row input{font-size:.6rem;padding:8px 12px;min-height:34px}
      .row .btn{font-size:.55rem;padding:8px 12px;min-height:34px}
      .emoji{font-size:1rem}
    }
    @media(max-height:500px) and (orientation:landscape){
      .app{max-height:95vh;border-radius:var(--sm)}
      .header{padding:6px 12px;min-height:40px}
      .logo{width:24px;height:24px;font-size:.7rem}
      .title{font-size:.7rem}
      .msgs{padding:6px 10px;gap:2px}
      .msg{padding:4px 10px;max-width:90%;font-size:.6rem}
      .msg .sender{font-size:.35rem;margin-bottom:1px}
      .msg .text{font-size:.6rem;line-height:1.3}
      .input-area{padding:4px 10px 8px}
      .row input{min-height:28px;padding:6px 12px;font-size:.6rem}
      .row .btn{min-height:28px;padding:6px 12px;font-size:.55rem}
      .auth input{min-height:24px;font-size:.5rem;padding:3px 8px}
      .btn{min-height:24px;font-size:.45rem;padding:3px 10px}
      .badge{font-size:.45rem;padding:2px 8px;min-height:24px}
      .emoji{font-size:.8rem}
    }
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  </style>
</head>
<body>

  <!-- ===== BACKGROUND ===== -->
  <canvas id="particles"></canvas>
  <div class="sparkle"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="bg-grid"></div>

  <div class="emoji">✨</div>
  <div class="emoji">🌟</div>
  <div class="emoji">💫</div>
  <div class="emoji">🌈</div>

  <div class="bell" id="bell">🔔</div>
  <div class="confetti-box" id="confettiBox"></div>

  <!-- ===== APP ===== -->
  <div class="app">
    <div class="rainbow"></div>

    <header class="header">
      <div class="brand">
        <div class="logo">✦</div>
        <h1 class="title"><span class="hl">Neon</span> Nexus</h1>
      </div>
      <div class="right">
        <div class="badge">
          <span class="dot" id="dot"></span>
          <span class="count" id="count">0</span>
        </div>
        <div class="auth">
          <input type="text" id="name" placeholder="Name" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn btn--join" id="join">Join</button>
          <button class="btn btn--danger" id="leave" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <div class="msgs" id="msgs">
      <div class="status-msg">✦ Connecting...</div>
      <div class="typing" id="typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span style="margin-left:6px;">typing</span>
      </div>
    </div>

    <footer class="input-area">
      <div class="row">
        <input type="text" id="input" placeholder="✦ Type message..." disabled inputmode="text" autocomplete="off" />
        <button class="btn btn--send" id="send" disabled>Send</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE + APP
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    // ============================================================
    // 1. PARTICLES
    // ============================================================
    const c = document.getElementById('particles'),
      x = c.getContext('2d');
    let p = [],
      W, H;

    function resize() { W = c.width = innerWidth;
      H = c.height = innerHeight }
    resize();
    addEventListener('resize', resize);

    const cols = ['#ff2d75', '#00d4ff', '#7c3aed', '#22d3ee', '#34d399', '#fbbf24'];
    for (let i = 0; i < 40; i++) p.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() * 2 + 1,
      vx: (Math.random() - .5) * .3,
      vy: (Math.random() - .5) * .3 - .1,
      c: cols[Math.floor(Math.random() * cols.length)],
      l: Math.random() * 80 + 40,
      mL: Math.random() * 80 + 40,
      g: Math.random() * 10 + 5
    });

    function draw() {
      x.clearRect(0, 0, W, H);
      p.forEach(q => {
        q.x += q.vx;
        q.y += q.vy;
        q.l--;
        if (q.l <= 0 || q.x < 0 || q.x > W || q.y < 0 || q.y > H) {
          q.x = Math.random() * W;
          q.y = H;
          q.l = q.mL;
          q.vx = (Math.random() - .5) * .3;
          q.vy = -Math.random() * .3 - .1;
          q.c = cols[Math.floor(Math.random() * cols.length)];
        }
        const a = q.l / q.mL;
        x.beginPath();
        x.arc(q.x, q.y, q.s * a, 0, Math.PI * 2);
        x.fillStyle = q.c;
        x.shadowColor = q.c;
        x.shadowBlur = q.g * a;
        x.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    // ============================================================
    // 2. CONFETTI
    // ============================================================
    const cf = document.getElementById('confettiBox');

    function confetti() {
      const cols = ['#ff2d75', '#00d4ff', '#7c3aed', '#22d3ee', '#34d399', '#fbbf24', '#fff'];
      for (let i = 0; i < 20; i++) {
        const e = document.createElement('div');
        e.className = 'confetti';
        e.style.left = Math.random() * 100 + '%';
        e.style.background = cols[Math.floor(Math.random() * cols.length)];
        e.style.width = (Math.random() * 4 + 3) + 'px';
        e.style.height = (Math.random() * 4 + 3) + 'px';
        e.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        e.style.animationDuration = (Math.random() * 2 + 2) + 's';
        e.style.animationDelay = (Math.random() * 2) + 's';
        cf.appendChild(e);
      }
      setTimeout(() => cf.innerHTML = '', 4000);
    }

    // ============================================================
    // 3. NOTIFICATION
    // ============================================================
    const bell = document.getElementById('bell');
    let nCount = 0;

    function notify() { nCount++;
      bell.classList.add('active');
      bell.textContent = '🔔 ' + nCount }
    bell.onclick = () => { nCount = 0;
      bell.classList.remove('active') };

    // ============================================================
    // 4. TYPING
    // ============================================================
    const typing = document.getElementById('typing');
    let tOut = null;

    function showTyping() {
      typing.classList.add('active');
      clearTimeout(tOut);
      tOut = setTimeout(() => typing.classList.remove('active'), 2000);
    }

    // ============================================================
    // 5. FIREBASE
    // ============================================================
    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 6. DOM
    // ============================================================
    const $ = id => document.getElementById(id);
    const D = {
      msgs: $('msgs'),
      input: $('input'),
      send: $('send'),
      name: $('name'),
      join: $('join'),
      leave: $('leave'),
      count: $('count'),
      dot: $('dot'),
    };

    // ============================================================
    // 7. STATE
    // ============================================================
    let user = null,
      listeners = [],
      connected = !1,
      start = Date.now();

    // ============================================================
    // 8. HELPERS
    // ============================================================
    const status = t => {
      let e = D.msgs.querySelector('.status-msg');
      if (!e) { e = document.createElement('div');
        e.className = 'status-msg';
        D.msgs.appendChild(e) }
      e.textContent = t;
    };
    const clear = () => { const e = D.msgs.querySelector('.status-msg'); if (e) e.remove() };
    const scroll = () => requestAnimationFrame(() => D.msgs.scrollTop = D.msgs.scrollHeight);
    const time = t => t ? new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';

    const setOnline = on => {
      connected = on;
      D.dot.className = `dot ${on ? '' : 'off'}`;
      if (on) {
        const el = (Date.now() - start) / 1000;
        console.log(`⚡ ${el.toFixed(1)}s`);
        status('✦ Connected ✦');
        setTimeout(() => { const e = D.msgs.querySelector('.status-msg'); if (e && e.textContent === '✦ Connected ✦') clear() },
        600);
        if (user) confetti();
      } else status('✦ Reconnecting...');
    };

    // ============================================================
    // 9. SEND
    // ============================================================
    const sendMsg = t => {
      if (!user) return alert('✦ Sign in!');
      if (!t || !t.trim()) return;
      if (!connected) return alert('✦ Waiting...');
      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: t.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch(() => alert('✦ Failed'));
      D.input.value = '';
      D.input.focus();
    };

    // ============================================================
    // 10. RENDER
    // ============================================================
    const render = data => {
      const own = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${own ? 'own' : 'other'}`;
      el.dataset.key = data._key;
      el.innerHTML =
        `<div class="sender">${data.name||'Anon'}<span class="time">${time(data.timestamp)}</span></div><div class="text">${data.text||''}</div>`;
      const st = D.msgs.querySelector('.status-msg');
      if (st && (st.textContent === '✦ Connected ✦' || st.textContent === '✦ Reconnecting...')) clear();
      D.msgs.appendChild(el);
      scroll();
      if (!own) { notify();
        showTyping(); if (Math.random() > .8) confetti() }
    };

    // ============================================================
    // 11. SUBSCRIBE
    // ============================================================
    const sub = () => {
      listeners.forEach(r => r.off());
      listeners = [];
      const p = db.ref('.info/connected');
      p.on('value', s => {
        const on = s.val() === !0;
        if (on && !connected) setOnline(!0);
        else if (!on) setOnline(!1);
        if (on && user) {
          const r = db.ref('users').child(user.uid);
          r.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          r.onDisconnect().remove();
        }
      });
      listeners.push(p);
      const u = db.ref('users');
      u.on('value', s => { if (connected) D.count.textContent = s.exists() ? s.numChildren() : '0' });
      listeners.push(u);
      const q = db.ref('messages').orderByKey().limitToLast(50);
      q.on('child_added', s => { if (connected) { const d = s.val();
          d._key = s.key;
          render(d) } });
      q.on('child_removed', s => { const e = D.msgs.querySelector(`[data-key="${s.key}"]`); if (e) e.remove() });
      listeners.push(q);
      q.once('value', s => { if (!s.exists()) { const e = D.msgs.querySelector('.status-msg'); if (!e || e.textContent ===
            '✦ Reconnecting...' || e.textContent === '✦ Connected ✦') { status('✦ No messages yet ✦');
            setTimeout(() => { const el = D.msgs.querySelector('.status-msg'); if (el && el.textContent ===
                '✦ No messages yet ✦') clear() }, 1500) } } });
    };

    // ============================================================
    // 12. AUTH
    // ============================================================
    const login = () => {
      const n = D.name.value.trim() || 'User';
      user = { name: n.slice(0, 20), uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) };
      D.name.disabled = !0;
      D.join.style.display = 'none';
      D.leave.style.display = 'inline-block';
      D.input.disabled = !1;
      D.send.disabled = !1;
      D.input.placeholder = `✦ ${n}...`;
      clear();
      status(`✦ ${n} joined ✦`);
      confetti();
      sub();
      if (connected) { const r = db.ref('users').child(user.uid);
        r.set({ name: user.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        r.onDisconnect().remove() }
      D.count.textContent = '1';
      setTimeout(() => { const e = D.msgs.querySelector('.status-msg'); if (e && e.textContent === `✦ ${n} joined ✦`) clear() },
        1200);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();
      listeners.forEach(r => r.off());
      listeners = [];
      user = null;
      D.name.disabled = !1;
      D.join.style.display = 'inline-block';
      D.leave.style.display = 'none';
      D.input.disabled = !0;
      D.send.disabled = !0;
      D.input.placeholder = '✦ Type message...';
      D.input.value = '';
      D.msgs.innerHTML = '';
      status('✦ Left chat ✦');
      D.count.textContent = '0';
      connected = !1;
      D.dot.className = 'dot off';
      nCount = 0;
      bell.classList.remove('active');
    };

    // ============================================================
    // 13. EVENTS
    // ============================================================
    D.join.onclick = login;
    D.leave.onclick = logout;
    D.name.onkeydown = e => { if (e.key === 'Enter') login() };
    D.send.onclick = () => sendMsg(D.input.value);
    D.input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
        sendMsg(D.input.value) } };
    document.querySelectorAll('.btn').forEach(b => {
      b.addEventListener('touchstart', function() { this.style.transform = 'scale(.95)' }, { passive: !0 });
      b.addEventListener('touchend', function() { this.style.transform = '' }, { passive: !0 })
    });
    D.input.addEventListener('focus', () => { setTimeout(() => { D.input.scrollIntoView({ behavior: 'smooth',
          block: 'center' }) }, 300) });

    // ============================================================
    // 14. INIT
    // ============================================================
    start = Date.now();
    status('✦ Connecting...');
    sub();
    setTimeout(() => { if (!connected) setOnline(!0) }, 2000);
    console.log('✦ NEON NEXUS ✦');
    console.log('📡', firebase.app().options.databaseURL);
    console.log('⚡ <2s connect');
  </script>

</body>
</html>
