<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no">
<title>NEON PULSE ADMIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
:root{--primary:#ff00ff;--secondary:#00ffff;--accent:#ffaa00;--bg:#0a0a12;--surface:#12121f;--glass:rgba(10,10,30,.85)}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;position:relative}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1a0a2e,#0a0a12 70%)}
#app{width:100%;height:100%;max-width:640px;max-height:960px;background:linear-gradient(145deg,#12121f,#1a1a2e);border-radius:0;display:flex;flex-direction:column;position:relative;overflow:hidden;border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 60px rgba(255,0,255,.3),0 0 120px rgba(0,255,255,.15),inset 0 0 80px rgba(255,0,255,.05)}
@media(min-width:720px){#app{border-radius:40px;max-height:85vh;box-shadow:0 0 80px rgba(255,0,255,.4),0 0 160px rgba(0,255,255,.2),inset 0 0 100px rgba(255,0,255,.08)}}
#app::before{content:'';position:absolute;inset:-3px;border-radius:inherit;background:conic-gradient(from 0deg,#ff00ff,#00ffff,#ff00ff,#ffaa00,#ff00ff,#00ffff,#ff00ff);background-size:300% 300%;z-index:-1;animation:spinBorder 6s linear infinite;opacity:.7;filter:blur(2px)}
@keyframes spinBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.neon-pulse{animation:pulseGlow 2.8s infinite alternate}
@keyframes pulseGlow{0%{border-color:rgba(255,0,255,.3);box-shadow:0 0 40px rgba(255,0,255,.2),0 0 80px rgba(0,255,255,.1)}100%{border-color:rgba(0,255,255,.7);box-shadow:0 0 70px rgba(255,0,255,.4),0 0 140px rgba(0,255,255,.25)}}
.header{background:var(--glass);backdrop-filter:blur(12px);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid;border-image:linear-gradient(90deg,#ff00ff,#00ffff,#ffaa00,#ff00ff)1;flex-shrink:0;z-index:2;box-shadow:0 4px 30px rgba(255,0,255,.2);flex-wrap:wrap}
.header .brand{font-size:1rem;font-weight:800;background:linear-gradient(90deg,#ff00ff,#00ffff,#ffaa00,#ff00ff);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowText 3s linear infinite;letter-spacing:2px;flex:1;white-space:nowrap;min-width:80px}
@keyframes rainbowText{0%{background-position:0%}100%{background-position:300%}}
.header .controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.header .user-area{display:flex;align-items:center;gap:4px;flex-shrink:0}
.header .user-area input{background:rgba(20,20,50,.8);border:1.5px solid #ff00ff88;border-radius:30px;padding:5px 12px;color:#f0fcff;font-size:.75rem;width:80px;transition:.4s;outline:0;box-shadow:0 0 20px rgba(255,0,255,.2),inset 0 0 20px rgba(255,0,255,.05)}
.header .user-area input:focus{width:110px;border-color:#00ffff;box-shadow:0 0 40px rgba(0,255,255,.6),0 0 80px rgba(255,0,255,.3);background:rgba(10,10,40,.9)}
.header .user-area button{background:linear-gradient(135deg,#ff00ff,#cc00ff);border:0;border-radius:30px;padding:4px 12px;font-size:.7rem;font-weight:700;color:#fff;cursor:pointer;transition:.3s;text-shadow:0 0 20px rgba(255,255,255,.5);box-shadow:0 0 30px rgba(255,0,255,.4),inset 0 0 20px rgba(255,255,255,.2)}
.header .user-area button:active{transform:scale(.9)}
.header .theme-btn{background:linear-gradient(135deg,#00ffff,#0088ff);border:0;border-radius:30px;padding:4px 10px;font-size:.65rem;font-weight:700;color:#fff;cursor:pointer;transition:.3s;text-shadow:0 0 20px rgba(255,255,255,.3);box-shadow:0 0 30px rgba(0,255,255,.3);white-space:nowrap}
.header .theme-btn:active{transform:scale(.9)}
.drawer-toggle{background:0 0;border:0;color:#fff;font-size:1.5rem;cursor:pointer;padding:4px 8px;text-shadow:0 0 20px rgba(255,0,255,.5)}
.chat-area{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;background:radial-gradient(ellipse at 30% 20%,rgba(30,10,50,.6),rgba(10,10,26,.9));position:relative}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:rgba(255,0,255,.1);border-radius:20px}
.chat-area::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff00ff,#00ffff);border-radius:20px;box-shadow:0 0 20px rgba(255,0,255,.5)}
.chat-area.blurred{filter:blur(12px);pointer-events:none;user-select:none}
.chat-area .login-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:10;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-size:1.2rem;font-weight:600}
.chat-area.blurred .login-overlay{display:flex}
.chat-area .login-overlay button{background:linear-gradient(135deg,#ff00ff,#00ffff);border:0;border-radius:40px;padding:14px 40px;font-size:1.1rem;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 0 60px rgba(255,0,255,.4);transition:.3s}
.chat-area .login-overlay button:active{transform:scale(.9)}
.message{background:linear-gradient(135deg,rgba(30,20,60,.85),rgba(20,10,40,.9));backdrop-filter:blur(8px);border-radius:18px 18px 18px 4px;padding:10px 14px;border-left:4px solid #ff00ff;box-shadow:0 0 30px rgba(255,0,255,.2);animation:fadeIn .25s ease;word-break:break-word;max-width:92%;align-self:flex-start;transition:.3s;border:1px solid rgba(255,0,255,.2)}
.message:hover{box-shadow:0 0 50px rgba(255,0,255,.4)}
.message .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:4px;font-size:.65rem}
.message .username{font-weight:800;background:linear-gradient(90deg,#ff44ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,0,255,.6);letter-spacing:.5px;font-size:.8rem}
.message .time{color:#aab8d0;font-size:.55rem;opacity:.7;font-weight:300}
.message .text{color:#e8f0ff;font-size:.88rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.message .text a{color:#00ffff;text-decoration:none;font-weight:600;border-bottom:2px solid #ff00ff88;padding:0 4px;transition:.3s}
.message .text a:active{color:#fff;background:rgba(255,0,255,.3);border-radius:6px}
.message.own{align-self:flex-end;border-left-color:#00ffff;border-left-width:4px;background:linear-gradient(135deg,rgba(20,30,70,.85),rgba(10,20,50,.9));box-shadow:0 0 40px rgba(0,255,255,.25)}
.message.own .username{background:linear-gradient(90deg,#00ffff,#ff44ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes fadeIn{0%{opacity:0;transform:translateY(12px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.input-area{background:var(--glass);backdrop-filter:blur(12px);padding:10px 12px 14px;display:flex;align-items:flex-end;gap:8px;border-top:2px solid;border-image:linear-gradient(90deg,#ff00ff,#00ffff,#ffaa00,#ff00ff)1;flex-shrink:0;z-index:2;box-shadow:0 -4px 30px rgba(255,0,255,.15)}
.input-area textarea{flex:1;background:rgba(20,20,50,.7);border:1.5px solid #ff00ff66;border-radius:28px;padding:10px 16px;color:#f0fcff;font-size:.9rem;resize:none;min-height:44px;max-height:120px;outline:0;transition:.4s;line-height:1.4;font-family:inherit}
.input-area textarea:focus{border-color:#00ffff;box-shadow:0 0 50px rgba(0,255,255,.3);background:rgba(12,12,40,.9)}
.input-area .send-btn{background:linear-gradient(145deg,#ff00ff,#cc00ff,#aa00ff);border:0;border-radius:50px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;cursor:pointer;transition:.3s;box-shadow:0 0 50px rgba(255,0,255,.5);flex-shrink:0}
.input-area .send-btn:active{transform:scale(.82);box-shadow:0 0 80px rgba(0,255,255,.8)}
.drawer{position:fixed;top:0;left:-320px;width:300px;height:100%;background:rgba(10,10,30,.97);backdrop-filter:blur(20px);z-index:100;transition:.4s cubic-bezier(.4,0,.2,1);padding:20px 16px;border-right:2px solid;border-image:linear-gradient(180deg,#ff00ff,#00ffff,#ffaa00)1;box-shadow:4px 0 60px rgba(255,0,255,.2);overflow-y:auto}
.drawer.open{left:0}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
.drawer-overlay.active{display:block}
.drawer .close-btn{background:0 0;border:0;color:#ff00ff;font-size:2rem;cursor:pointer;float:right;text-shadow:0 0 30px rgba(255,0,255,.5)}
.drawer .user-info{color:#fff;padding:20px 0 16px;border-bottom:1px solid rgba(255,0,255,.2);margin-bottom:16px}
.drawer .user-info .name{font-size:1.2rem;font-weight:700;background:linear-gradient(90deg,#ff44ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.drawer .user-info .email{font-size:.8rem;color:#888;margin-top:4px}
.drawer .auth-section{display:flex;flex-direction:column;gap:10px}
.drawer .auth-section input{background:rgba(20,20,50,.8);border:1.5px solid rgba(255,0,255,.3);border-radius:30px;padding:10px 16px;color:#f0fcff;font-size:.85rem;outline:0;transition:.3s}
.drawer .auth-section input:focus{border-color:#00ffff;box-shadow:0 0 30px rgba(0,255,255,.2)}
.drawer .auth-section .btn-primary{background:linear-gradient(135deg,#ff00ff,#cc00ff);border:0;border-radius:30px;padding:12px;font-size:.9rem;font-weight:700;color:#fff;cursor:pointer;transition:.3s;box-shadow:0 0 40px rgba(255,0,255,.3)}
.drawer .auth-section .btn-primary:active{transform:scale(.95)}
.drawer .auth-section .btn-google{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:12px;font-size:.85rem;font-weight:600;color:#fff;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
.drawer .auth-section .btn-google:active{transform:scale(.95)}
.drawer .auth-section .toggle-auth{color:#00ffff;cursor:pointer;text-align:center;font-size:.8rem;margin-top:6px;text-decoration:underline}
.drawer .auth-section .toggle-auth:active{color:#ff00ff}
.drawer .admin-section{display:none;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,0,255,.2)}
.drawer .admin-section.active{display:block}
.drawer .admin-section .title{color:#ff00ff;font-weight:700;font-size:.9rem;margin-bottom:10px;text-shadow:0 0 20px rgba(255,0,255,.3)}
.drawer .admin-section .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.drawer .admin-section .tool-btn{background:rgba(255,0,255,.1);border:1px solid rgba(255,0,255,.2);border-radius:12px;padding:8px 6px;color:#c8d0e0;font-size:.65rem;cursor:pointer;transition:.3s;text-align:center}
.drawer .admin-section .tool-btn:active{transform:scale(.9);background:rgba(255,0,255,.2)}
.drawer .admin-section .tool-btn.danger{border-color:#ff446688;color:#ff6688}
.drawer .admin-section .logout-btn{background:linear-gradient(135deg,#ff0044,#cc0033);border:0;border-radius:30px;padding:10px;font-size:.85rem;font-weight:700;color:#fff;cursor:pointer;margin-top:12px;width:100%;transition:.3s;box-shadow:0 0 30px rgba(255,0,68,.3)}
.drawer .admin-section .logout-btn:active{transform:scale(.95)}
.banned-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:24px;color:#ff4466;font-size:1.6rem;text-align:center;padding:30px;font-weight:700}
.banned-overlay .icon{font-size:5rem;filter:drop-shadow(0 0 60px #ff4466);animation:pulseGlow 1.5s infinite alternate}
@media(max-width:480px){.drawer{width:280px;left:-290px}.header .brand{font-size:.85rem}.header .user-area input{width:70px}.message{padding:8px 12px;font-size:.82rem}.input-area textarea{font-size:.82rem;padding:8px 14px}.input-area .send-btn{width:44px;height:44px;font-size:1.3rem}.drawer .admin-section .tool-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app" class="neon-pulse">
<div class="header">
<button class="drawer-toggle" id="drawerToggle">☰</button>
<span class="brand">✦ NEON PULSE</span>
<div class="controls">
<button class="theme-btn" id="themeToggle">🎨</button>
</div>
</div>
<div class="chat-area blurred" id="chatContainer">
<div class="login-overlay">
<span>🔒 CHAT LOCKED</span>
<button id="loginPromptBtn">LOGIN TO VIEW</button>
</div>
</div>
<div class="input-area">
<textarea id="msgInput" rows="1" placeholder="Message..."></textarea>
<button class="send-btn" id="sendBtn">➤</button>
</div>
</div>
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
<button class="close-btn" id="drawerClose">✕</button>
<div class="user-info" id="userInfo">
<div class="name" id="displayName">Guest</div>
<div class="email" id="displayEmail">Not logged in</div>
</div>
<div class="auth-section" id="authSection">
<input type="email" id="authEmail" placeholder="Email">
<input type="password" id="authPassword" placeholder="Password">
<button class="btn-primary" id="authSubmit">Login</button>
<button class="btn-google" id="googleLogin">🅶 Sign in with Google</button>
<div class="toggle-auth" id="toggleAuth">Don't have an account? Register</div>
</div>
<div class="admin-section" id="adminSection">
<div class="title">⚡ ADMIN TOOLS (36)</div>
<div class="tool-grid" id="adminTools"></div>
<button class="logout-btn" id="logoutBtn">🚪 LOGOUT</button>
</div>
</div>
<div class="banned-overlay" id="bannedOverlay"><div class="icon">⛔</div><div>ACCESS DENIED<br><span style="font-size:1rem;opacity:.7">Android Only</span></div></div>
<script>
(function(){'use strict';
const isAndroid=/android/i.test(navigator.userAgent);
if(!isAndroid){document.getElementById('bannedOverlay').style.display='flex';document.getElementById('app').style.filter='blur(8px)';return;}
const DB_URL='https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/';
let db,messagesRef,usersRef,adminRef;
let currentUser=null;
let isAdmin=false;
let isLoginMode=true;
const chat=document.getElementById('chatContainer');
const msgInput=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');
const drawer=document.getElementById('drawer');
const overlay=document.getElementById('drawerOverlay');
const drawerToggle=document.getElementById('drawerToggle');
const drawerClose=document.getElementById('drawerClose');
const loginPromptBtn=document.getElementById('loginPromptBtn');
const authEmail=document.getElementById('authEmail');
const authPassword=document.getElementById('authPassword');
const authSubmit=document.getElementById('authSubmit');
const toggleAuth=document.getElementById('toggleAuth');
const googleLogin=document.getElementById('googleLogin');
const displayName=document.getElementById('displayName');
const displayEmail=document.getElementById('displayEmail');
const adminSection=document.getElementById('adminSection');
const adminTools=document.getElementById('adminTools');
const logoutBtn=document.getElementById('logoutBtn');
const themeToggle=document.getElementById('themeToggle');
let themes=['default','cyber','synth','aurora','galaxy','rave'];
let themeIndex=0;
function initFirebase(){if(typeof firebase!=='undefined'){try{if(!firebase.apps.length){firebase.initializeApp({databaseURL:DB_URL,apiKey:'AIzaSyDemoKey',authDomain:'zack360-2b303.firebaseapp.com'});}db=firebase.database();messagesRef=db.ref('messages');usersRef=db.ref('users');adminRef=db.ref('admin');}catch(e){console.warn('FB init',e);}}else{setTimeout(initFirebase,300);}}
function loadMessages(){if(!messagesRef)return;messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added',function(snap){const data=snap.val();if(data&&data.text&&data.username){appendMessage(data.username,data.text,data.timestamp,data.userId===currentUser?.uid||data.userId===currentUser);}});}
function appendMessage(username,text,timestamp,isOwn){const msgDiv=document.createElement('div');msgDiv.className='message'+(isOwn?' own':'');
const meta=document.createElement('div');meta.className='meta';
const uname=document.createElement('span');uname.className='username';uname.textContent=username||'Anon';
const time=document.createElement('span');time.className='time';if(timestamp){const d=new Date(timestamp);time.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}else{time.textContent='now';}
meta.appendChild(uname);meta.appendChild(time);
const textDiv=document.createElement('div');textDiv.className='text';
textDiv.innerHTML=linkify(text);
msgDiv.appendChild(meta);msgDiv.appendChild(textDiv);
chat.appendChild(msgDiv);
chat.scrollTop=chat.scrollHeight;}
function linkify(txt){if(!txt)return'';const urlPattern=/(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gi;return txt.replace(urlPattern,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
function sendMessage(){const text=msgInput.value.trim();if(!text||!currentUser)return;if(!messagesRef){initFirebase();return;}const payload={username:displayName.textContent||'Guest',text:text,timestamp:Date.now(),userId:currentUser.uid||currentUser};
messagesRef.push(payload).then(()=>{msgInput.value='';msgInput.style.height='auto';chat.scrollTop=chat.scrollHeight;}).catch(e=>{console.warn('send fail',e);});}
function setupListeners(){
sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
msgInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
drawerToggle.addEventListener('click',function(){drawer.classList.toggle('open');overlay.classList.toggle('active');});
drawerClose.addEventListener('click',function(){drawer.classList.remove('open');overlay.classList.remove('active');});
overlay.addEventListener('click',function(){drawer.classList.remove('open');overlay.classList.remove('active');});
loginPromptBtn.addEventListener('click',function(){drawer.classList.add('open');overlay.classList.add('active');});
toggleAuth.addEventListener('click',function(){isLoginMode=!isLoginMode;this.textContent=isLoginMode?'Don\'t have an account? Register':'Already have an account? Login';authSubmit.textContent=isLoginMode?'Login':'Register';});
authSubmit.addEventListener('click',handleAuth);
googleLogin.addEventListener('click',handleGoogleAuth);
logoutBtn.addEventListener('click',handleLogout);
themeToggle.addEventListener('click',cycleTheme);
}
function handleAuth(){const email=authEmail.value.trim();const pass=authPassword.value.trim();if(!email||!pass){alert('Please fill all fields');return;}
if(isLoginMode){firebase.auth().signInWithEmailAndPassword(email,pass).then(user=>{onAuthSuccess(user.user);}).catch(err=>{alert('Login failed: '+err.message);});}else{firebase.auth().createUserWithEmailAndPassword(email,pass).then(user=>{onAuthSuccess(user.user);}).catch(err=>{alert('Registration failed: '+err.message);});}}
function handleGoogleAuth(){const provider=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(provider).then(result=>{onAuthSuccess(result.user);}).catch(err=>{alert('Google login failed: '+err.message);});}
function onAuthSuccess(user){currentUser=user;const name=user.displayName||user.email?.split('@')[0]||'User';displayName.textContent=name;displayEmail.textContent=user.email||'No email';authEmail.value='';authPassword.value='';checkAdmin(user);drawer.classList.remove('open');overlay.classList.remove('active');chat.classList.remove('blurred');chat.querySelector('.login-overlay').style.display='none';localStorage.setItem('neonUser',JSON.stringify({uid:user.uid,email:user.email,name:name}));}
function checkAdmin(user){if(!user)return;usersRef.child(user.uid).once('value').then(snap=>{const data=snap.val();const isAdminUser=user.email==='zack360@neon.chat'||user.email==='zack360@gmail.com'||user.email==='zack360@admin.com'||user.uid==='zack360';if(isAdminUser||(data&&data.role==='admin')){isAdmin=true;adminSection.classList.add('active');generateAdminTools();usersRef.child(user.uid).update({role:'admin',email:user.email,name:displayName.textContent});}else{isAdmin=false;adminSection.classList.remove('active');}}).catch(()=>{});}
function generateAdminTools(){const tools=[{name:'👥 Users',action:'listUsers'},{name:'🔍 Search',action:'searchUsers'},{name:'👑 Roles',action:'manageRoles'},{name:'🚫 Ban',action:'banUser'},{name:'🔇 Mute',action:'muteUser'},{name:'🗑️ Delete User',action:'deleteUser'},{name:'📊 Stats',action:'viewStats'},{name:'💬 Messages',action:'viewMessages'},{name:'🔎 Filter Msg',action:'filterMessages'},{name:'✏️ Edit Msg',action:'editMessage'},{name:'🗑️ Bulk Del',action:'bulkDelete'},{name:'📌 Pin Msg',action:'pinMessage'},{name:'😀 Emoji Ban',action:'toggleEmojiBan'},{name:'🚫 Blocklist',action:'manageBlocklist'},{name:'🎨 Theme Lock',action:'lockTheme'},{name:'📋 Rules',action:'setRules'},{name:'📊 Dashboard',action:'dashboard'},{name:'📜 Audit Log',action:'auditLog'},{name:'🚨 Reports',action:'viewReports'},{name:'📈 Insights',action:'userInsights'},{name:'💾 Backup',action:'backupData'},{name:'🔄 Restore',action:'restoreData'},{name:'⚙️ Settings',action:'systemSettings'},{name:'🔒 Maintenance',action:'maintenanceMode'},{name:'🗑️ Clear All',action:'clearAll'},{name:'📤 Export CSV',action:'exportCSV'},{name:'📥 Import',action:'importData'},{name:'🛡️ Mod Stats',action:'modStats'},{name:'📊 Trends',action:'viewTrends'},{name:'👤 User Details',action:'userDetails'},{name:'🔐 Sessions',action:'viewSessions'},{name:'📧 Notify All',action:'notifyAll'},{name:'🎯 Announce',action:'makeAnnouncement'},{name:'📁 Media',action:'manageMedia'},{name:'🌐 API Keys',action:'manageAPI'},{name:'💻 System Logs',action:'systemLogs'}];
adminTools.innerHTML='';tools.forEach(t=>{const btn=document.createElement('button');btn.className='tool-btn'+(t.name.includes('Delete')||t.name.includes('Ban')||t.name.includes('Clear')?' danger':'');btn.textContent=t.name;btn.dataset.action=t.action;btn.addEventListener('click',function(){alert('🔧 Admin Tool: '+t.name+'\n\nThis would execute the '+t.action+' function.\n\n(Production implementation would handle this action)');if(t.action==='clearAll'||t.action==='deleteUser'||t.action==='bulkDelete'){if(confirm('⚠️ This action is destructive. Are you sure?')){alert('Action confirmed!')}}});adminTools.appendChild(btn);});}
function handleLogout(){firebase.auth().signOut().then(()=>{currentUser=null;isAdmin=false;adminSection.classList.remove('active');chat.classList.add('blurred');chat.querySelector('.login-overlay').style.display='flex';displayName.textContent='Guest';displayEmail.textContent='Not logged in';localStorage.removeItem('neonUser');drawer.classList.remove('open');overlay.classList.remove('active');}).catch(err=>{alert('Logout failed: '+err.message);});}
function cycleTheme(){themeIndex=(themeIndex+1)%themes.length;const theme=themes[themeIndex];const colors={default:['#ff00ff','#00ffff','#ffaa00'],cyber:['#00ff00','#00ffff','#ff00ff'],synth:['#ff6bff','#ffb86b','#ff00ff'],aurora:['#00ff88','#00ddff','#ff00ff'],galaxy:['#9b59b6','#3498db','#2ecc71'],rave:['#ff0000','#00ff00','#0000ff']};const c=colors[theme]||colors.default;document.documentElement.style.setProperty('--primary',c[0]);document.documentElement.style.setProperty('--secondary',c[1]);document.documentElement.style.setProperty('--accent',c[2]);document.querySelector('#app').style.borderColor=c[0]+'66';document.querySelector('#app').style.boxShadow='0 0 60px '+c[0]+'33,0 0 120px '+c[1]+'22';}
function restoreSession(){const saved=localStorage.getItem('neonUser');if(saved){try{const data=JSON.parse(saved);if(data.uid){firebase.auth().onAuthStateChanged(user=>{if(user){onAuthSuccess(user);}else{firebase.auth().signInWithEmailAndPassword('','').catch(()=>{});}});}}catch(e){}}}
function initAuthListener(){firebase.auth().onAuthStateChanged(user=>{if(user){onAuthSuccess(user);}else{if(!currentUser){chat.classList.add('blurred');chat.querySelector('.login-overlay').style.display='flex';displayName.textContent='Guest';displayEmail.textContent='Not logged in';adminSection.classList.remove('active');}}});}
(function boot(){restoreSession();initFirebase();setTimeout(()=>{if(!db){initFirebase();}},500);setupListeners();loadMessages();initAuthListener();})();
window.addEventListener('online',function(){if(!db){initFirebase();}});
})();
</script>
