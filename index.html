<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRON BLOG — Digital Chronicles</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        :root {
            --accent: #00f0ff;
            --accent-2: #ff00ff;
            --bg: #000000;
            --glass: rgba(0, 255, 255, 0.05);
            --border: rgba(0, 240, 255, 0.25);
            --text: #ffffff;
            --muted: #888888;
            --danger: #ff0033;
            --success: #00ff88;
            --gradient: linear-gradient(135deg, #00f0ff, #0088ff, #ff00ff);
            --glow: 0 0 15px rgba(0, 240, 255, 0.4), 0 0 40px rgba(0, 240, 255, 0.2);
            --glow-strong: 0 0 25px rgba(0, 240, 255, 0.7), 0 0 60px rgba(0, 240, 255, 0.4);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-full: 25px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        /* ===== BACKGROUND LAYERS ===== */
        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0; pointer-events: none;
            animation: gridShift 15s linear infinite;
        }
        @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 30px 30px; } }

        .bg-scan {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 3px);
            z-index: 1; pointer-events: none;
        }

        .bg-aurora {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
                radial-gradient(circle at 30% 20%, rgba(0,240,255,0.06), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255,0,255,0.06), transparent 40%);
            animation: aurora 8s ease-in-out infinite;
        }
        @keyframes aurora { 50% { opacity: 1; } }

        .bg-particles {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        .particle {
            position: absolute; width: 3px; height: 3px;
            background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px;
            background: rgba(0,0,0,0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px; font-weight: 900; letter-spacing: 3px;
            background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; cursor: pointer;
        }

        .header-actions { display: flex; gap: 6px; }

        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(0,240,255,0.08);
            border: 1px solid var(--border);
            color: var(--accent); font-size: 15px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .icon-btn:active { background: var(--accent); color: #000; box-shadow: var(--glow); transform: scale(0.9); }

        /* ===== MENU ===== */
        .menu-overlay {
            position: fixed; inset: 0; z-index: 98;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(3px);
            display: none;
        }
        .menu-overlay.active { display: block; }

        .side-menu {
            position: fixed; top: 0; right: -100%; bottom: 0;
            width: 78%; z-index: 99;
            background: rgba(0,0,0,0.97);
            border-left: 1px solid var(--border);
            padding: 70px 15px 20px;
            transition: right 0.35s cubic-bezier(0.68,-0.55,0.265,1.55);
            overflow-y: auto;
        }
        .side-menu.active { right: 0; }

        .side-menu a {
            display: flex; align-items: center; gap: 12px;
            padding: 15px; color: #ccc; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
            border-bottom: 1px solid rgba(0,240,255,0.08);
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .side-menu a:active { color: var(--accent); background: rgba(0,240,255,0.08); padding-left: 20px; }

        /* ===== MAIN ===== */
        .main {
            position: relative; z-index: 2;
            padding: 62px 15px 80px;
            max-width: 600px; margin: 0 auto;
        }

        .hero { text-align: center; padding: 30px 0 20px; }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 900; letter-spacing: 6px;
            background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px;
            animation: textGlow 3s ease-in-out infinite;
        }
        @keyframes textGlow {
            50% { filter: drop-shadow(0 0 25px rgba(0,240,255,0.7)); }
        }

        .hero .subtitle { font-size: 11px; letter-spacing: 4px; color: var(--accent); }

        /* ===== INFO CARD ===== */
        .info-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); border-radius: var(--radius-full);
            margin-bottom: 12px; font-size: 10px; color: var(--muted);
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 8px var(--success);
            display: inline-block; margin-right: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.5; } }

        /* ===== CLOCK ===== */
        .clock {
            text-align: center; padding: 10px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 12px;
        }
        .clock-time {
            font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900;
            color: var(--accent); text-shadow: 0 0 15px var(--accent);
        }
        .clock-date { font-size: 10px; color: var(--muted); letter-spacing: 2px; }

        /* ===== TABS ===== */
        .tabs {
            display: flex; gap: 6px; margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1; padding: 10px;
            background: rgba(0,240,255,0.06);
            border: 1px solid var(--border); color: #ccc;
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px;
            border-radius: var(--radius-full); cursor: pointer; transition: all 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
            box-shadow: var(--glow);
        }
        .tab-btn:active { transform: scale(0.95); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }

        /* ===== SEARCH ===== */
        .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-row input {
            flex: 1; padding: 11px 16px;
            background: rgba(0,0,0,0.7); border: 1px solid var(--border);
            color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 14px;
            border-radius: var(--radius-full); outline: none;
        }
        .search-row input:focus { border-color: var(--accent); box-shadow: var(--glow); }
        .search-row button {
            padding: 11px 18px; background: var(--gradient); color: #000;
            font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 1px;
            border: none; border-radius: var(--radius-full); font-weight: 700; cursor: pointer;
            box-shadow: var(--glow);
        }

        /* ===== BLOG CARDS ===== */
        .blog-list { display: grid; gap: 12px; }

        .blog-card {
            border: 1px solid var(--border); background: var(--glass);
            border-radius: var(--radius); overflow: hidden; cursor: pointer;
            transition: all 0.25s; backdrop-filter: blur(10px);
        }
        .blog-card:active { border-color: var(--accent); box-shadow: var(--glow-strong); transform: scale(0.97); }

        .blog-card .card-img {
            height: 130px; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(0,240,255,0.05), rgba(255,0,255,0.08));
            font-size: 42px; color: var(--accent); text-shadow: 0 0 25px var(--accent);
            border-bottom: 1px solid var(--border);
        }

        .blog-card .card-body { padding: 12px; }

        .card-tag {
            display: inline-block; padding: 3px 10px;
            background: rgba(0,240,255,0.1); border: 1px solid var(--accent);
            color: var(--accent); font-family: 'Orbitron', sans-serif;
            font-size: 7px; letter-spacing: 2px; border-radius: 10px; margin-bottom: 8px;
        }
        .card-title {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            letter-spacing: 1px; color: #fff; margin-bottom: 5px;
        }
        .card-excerpt {
            font-size: 11px; color: var(--muted); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            margin-bottom: 8px;
        }
        .card-meta {
            display: flex; justify-content: space-between;
            font-size: 9px; color: #555; padding-top: 8px;
            border-top: 1px solid rgba(0,240,255,0.06);
        }
        .card-meta .author { color: var(--accent); }

        /* ===== EMPTY ===== */
        .empty {
            text-align: center; padding: 40px 15px;
            border: 2px dashed var(--border); border-radius: var(--radius);
            color: #555; font-family: 'Orbitron', sans-serif;
            font-size: 11px; letter-spacing: 2px;
            animation: borderPulse 2s infinite;
        }
        @keyframes borderPulse { 50% { border-color: var(--accent); } }
        .empty-icon { font-size: 40px; margin-bottom: 10px; animation: float 3s infinite; }
        @keyframes float { 50% { transform: translateY(-6px); } }

        /* ===== ARTICLE ===== */
        .article-view { display: none; }
        .article-view.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(25px); } }

        .back-btn {
            display: inline-block; padding: 9px 16px;
            background: transparent; border: 1px solid var(--accent);
            color: var(--accent); font-family: 'Orbitron', sans-serif;
            font-size: 9px; letter-spacing: 2px; border-radius: var(--radius-full);
            cursor: pointer; margin-bottom: 12px;
        }
        .back-btn:active { background: var(--accent); color: #000; }

        .article-title {
            font-family: 'Orbitron', sans-serif; font-size: 17px; letter-spacing: 1px;
            background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; text-align: center; margin-bottom: 12px; line-height: 1.3;
        }

        .article-img {
            height: 150px; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, rgba(0,240,255,0.12), rgba(0,240,255,0.04));
            font-size: 50px; color: var(--accent); text-shadow: 0 0 25px var(--accent);
            border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px;
        }

        .article-body {
            font-size: 13px; line-height: 1.7; color: #ccc;
            padding: 14px; border: 1px solid var(--border);
            border-radius: var(--radius); background: var(--glass);
        }

        /* ===== CHAT ===== */
        .chat-box {
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 12px; background: var(--glass);
        }
        .chat-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .chat-head h3 { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--accent); }
        .chat-head .online { font-size: 8px; color: var(--success); }

        .chat-log {
            height: 320px; overflow-y: auto;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 10px; margin-bottom: 8px;
        }

        .msg { margin-bottom: 10px; }
        .msg-name { font-family: 'Orbitron', sans-serif; font-size: 8px; color: var(--accent); margin-bottom: 3px; }
        .msg-text {
            display: inline-block; font-size: 11px; color: #ccc;
            background: rgba(0,0,0,0.4); padding: 7px 10px; border-radius: 10px;
        }
        .msg.own .msg-name { color: var(--success); text-align: right; }
        .msg.own .msg-text { background: rgba(0,255,136,0.08); }

        .msg-audio {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,240,255,0.1); border: 1px solid var(--accent);
            border-radius: 20px; padding: 7px 12px; cursor: pointer;
            max-width: 220px;
        }
        .msg-audio .audio-icon { font-size: 16px; color: var(--accent); }
        .msg-audio .audio-bar { flex: 1; height: 3px; background: rgba(0,240,255,0.2); border-radius: 2px; overflow: hidden; }
        .msg-audio .audio-duration { font-size: 8px; color: #ccc; font-family: 'Orbitron', sans-serif; }

        .msg-image {
            max-width: 150px; border-radius: 8px;
            border: 1px solid var(--accent); cursor: pointer;
            box-shadow: 0 0 15px rgba(0,240,255,0.25);
        }

        .chat-input-row { display: flex; gap: 5px; align-items: center; }
        .chat-input-row input {
            flex: 1; padding: 10px 13px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 12px;
            border-radius: var(--radius-full); outline: none;
        }
        .chat-input-row .send-btn {
            padding: 10px 15px; background: var(--gradient); color: #000;
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px;
            border: none; border-radius: var(--radius-full); font-weight: 700; cursor: pointer;
            white-space: nowrap;
        }
        .attach-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,240,255,0.08); border: 1px solid var(--border);
            color: var(--accent); font-size: 13px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .attach-btn:active { background: var(--accent); color: #000; box-shadow: var(--glow); transform: scale(0.9); }
        .attach-btn.recording {
            background: var(--danger); color: #fff; border-color: var(--danger);
            box-shadow: 0 0 15px var(--danger); animation: pulse 0.5s infinite;
        }

        .recording-bar {
            display: none; text-align: center; padding: 6px;
            background: rgba(255,0,51,0.08); border: 1px solid var(--danger);
            border-radius: 8px; font-size: 9px; color: var(--danger);
            letter-spacing: 2px; font-family: 'Orbitron', sans-serif;
            margin-bottom: 5px;
        }
        .recording-bar.active { display: block; animation: pulse 0.5s infinite; }

        /* ===== ADMIN ===== */
        .admin-panel { display: none; }
        .admin-panel.active { display: block; animation: slideIn 0.3s ease; }

        .admin-login {
            border: 1px solid var(--border); padding: 20px;
            background: var(--glass); border-radius: var(--radius);
            text-align: center; box-shadow: var(--glow);
        }
        .admin-login h2 {
            font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
            margin-bottom: 12px; background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .admin-login input {
            width: 100%; padding: 11px 14px;
            background: rgba(0,0,0,0.7); border: 1px solid var(--border);
            color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 13px;
            border-radius: var(--radius-full); outline: none; text-align: center;
            letter-spacing: 3px; margin-bottom: 10px;
        }

        .admin-dash { display: none; }
        .admin-dash.active { display: block; }
        .admin-dash h2 {
            font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 2px;
            text-align: center; margin-bottom: 12px; background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-form {
            border: 1px solid var(--border); padding: 14px;
            background: var(--glass); border-radius: var(--radius); margin-bottom: 12px;
        }
        .admin-form h3 { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
        .admin-form input, .admin-form textarea {
            width: 100%; padding: 10px 12px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 12px;
            border-radius: var(--radius-sm); outline: none; margin-bottom: 8px;
        }
        .admin-form textarea { height: 90px; resize: vertical; }
        .admin-form input:focus, .admin-form textarea:focus { border-color: var(--accent); box-shadow: var(--glow); }

        .btn-row { display: flex; gap: 6px; }

        .btn-primary {
            flex: 1; padding: 11px 15px; background: var(--gradient); color: #000;
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px;
            border: none; border-radius: var(--radius-full); font-weight: 700;
            cursor: pointer; box-shadow: var(--glow);
        }
        .btn-danger {
            padding: 9px 13px; background: transparent;
            border: 1px solid var(--danger); color: var(--danger);
            font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 1px;
            border-radius: var(--radius-full); cursor: pointer;
        }

        .admin-post {
            border: 1px solid var(--border); padding: 11px;
            border-radius: var(--radius-sm); background: var(--glass);
            display: flex; justify-content: space-between; align-items: center;
            gap: 6px; margin-bottom: 6px;
        }
        .admin-post h4 { font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px; color: #fff; }
        .admin-post p { font-size: 8px; color: #555; }
        .admin-post-actions { display: flex; gap: 4px; flex-shrink: 0; }

        /* ===== TOAST ===== */
        .toast-wrap {
            position: fixed; top: 65px; right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px;
        }
        .toast {
            padding: 10px 16px; border-radius: 10px; font-size: 11px;
            border: 1px solid; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.4s forwards;
            backdrop-filter: blur(10px);
        }
        .toast-success { background: rgba(0,255,136,0.12); border-color: var(--success); color: var(--success); }
        .toast-error { background: rgba(255,0,51,0.12); border-color: var(--danger); color: var(--danger); }
        .toast-info { background: rgba(0,240,255,0.12); border-color: var(--accent); color: var(--accent); }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } }
        @keyframes toastOut { to { transform: translateX(100%); opacity: 0; } }

        /* ===== PROGRESS ===== */
        .progress {
            position: fixed; top: 0; left: 0; height: 3px; width: 0%;
            background: var(--gradient); box-shadow: 0 0 12px var(--accent);
            z-index: 200; transition: width 0.2s;
        }

        /* ===== FLOATING BUTTONS ===== */
        .back-top {
            position: fixed; bottom: 18px; right: 14px; z-index: 90;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(0,0,0,0.9); border: 2px solid var(--accent);
            color: var(--accent); font-size: 16px; cursor: pointer;
            box-shadow: var(--glow); display: none;
            justify-content: center; align-items: center;
        }
        .back-top.show { display: flex; }

        .fab {
            position: fixed; bottom: 18px; left: 14px; z-index: 90;
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--gradient); border: none; color: #000;
            font-size: 18px; cursor: pointer; box-shadow: var(--glow-strong);
            display: flex; justify-content: center; align-items: center; font-weight: 900;
        }
        .fab:active { transform: scale(0.85) rotate(90deg); }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 92%; max-height: 85%; border: 2px solid var(--accent); border-radius: 10px; box-shadow: 0 0 50px var(--accent); }
        .lightbox-close {
            position: absolute; top: 18px; right: 18px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.8); border: 2px solid var(--accent);
            color: var(--accent); font-size: 20px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center; padding: 18px 15px;
            border-top: 1px solid var(--border);
            position: relative; z-index: 2; background: rgba(0,0,0,0.7);
        }
        .footer p { font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 2px; color: #555; }
        .footer .glow {
            background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #chatImageInput { display: none; }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="bg-grid"></div>
    <div class="bg-scan"></div>
    <div class="bg-aurora"></div>
    <div class="bg-particles" id="particles"></div>

    <!-- PROGRESS -->
    <div class="progress" id="progress"></div>

    <!-- TOAST -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close">✕</button>
        <img id="lightboxImg" src="" alt="Gambar">
    </div>

    <!-- HEADER -->
    <div class="header">
        <div class="logo" onclick="goHome()">TRON</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="switchTab('blog')">📝</button>
            <button class="icon-btn" onclick="switchTab('chat')">💬</button>
            <button class="icon-btn" onclick="openAdmin()">🔐</button>
            <button class="icon-btn" id="menuBtn" onclick="toggleMenu()">☰</button>
        </div>
    </div>

    <!-- MENU -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <a onclick="goHome()">🏠 UTAMA</a>
        <a onclick="switchTab('chat')">💬 CHAT</a>
        <a onclick="openAdmin()">🔐 ADMIN</a>
        <a onclick="burst()">✨ PARTIKEL</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- HERO -->
        <div class="hero" id="heroArea">
            <h1>TRON BLOG</h1>
            <p class="subtitle">DIGITAL CHRONICLES</p>
        </div>

        <!-- INFO -->
        <div class="info-card">
            <span><span class="status-dot"></span>ONLINE</span>
            <span id="visitors">👁️ 0</span>
        </div>

        <!-- CLOCK -->
        <div class="clock">
            <div class="clock-time" id="clockTime">00:00:00</div>
            <div class="clock-date" id="clockDate">---</div>
        </div>

        <!-- TABS -->
        <div class="tabs" id="tabsBar">
            <button class="tab-btn active" onclick="switchTab('blog', this)">📝 BLOG</button>
            <button class="tab-btn" onclick="switchTab('chat', this)">💬 CHAT</button>
        </div>

        <!-- BLOG TAB -->
        <div class="tab-content active" id="tab-blog">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Cari artikel..." onkeyup="searchPosts(this.value)">
                <button onclick="searchPosts(document.getElementById('searchInput').value)">CARI</button>
            </div>
            <div class="blog-list" id="blogList"></div>
        </div>

        <!-- CHAT TAB -->
        <div class="tab-content" id="tab-chat">
            <div class="chat-box">
                <div class="chat-head">
                    <h3>💬 CHAT MULTIMEDIA</h3>
                    <span class="online">● ONLINE</span>
                </div>
                <div class="recording-bar" id="recBar">🔴 MERAKAM...</div>
                <div class="chat-log" id="chatLog"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatName" placeholder="NAMA" style="max-width:65px;">
                    <input type="text" id="chatInput" placeholder="Tulis mesej..." onkeypress="if(event.key==='Enter')sendText()">
                    <button class="attach-btn" onclick="document.getElementById('chatImageInput').click()">📷</button>
                    <button class="attach-btn" id="recordBtn" onclick="toggleRecord()">🎤</button>
                    <button class="send-btn" onclick="sendText()">HANTAR</button>
                </div>
                <input type="file" id="chatImageInput" accept="image/*" onchange="sendImage(event)">
            </div>
        </div>

        <!-- ARTICLE -->
        <div class="article-view" id="articleView">
            <button class="back-btn" onclick="goHome()">← KEMBALI</button>
            <div class="article-title" id="articleTitle"></div>
            <div class="article-img" id="articleImg"></div>
            <div class="article-body" id="articleBody"></div>
        </div>

        <!-- ADMIN -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-login" id="adminLogin">
                <h2>🔐 LOGIN ADMIN</h2>
                <input type="password" id="adminPass" placeholder="KATA LALUAN" onkeypress="if(event.key==='Enter')doLogin()">
                <button class="btn-primary" onclick="doLogin()">LOGIN</button>
            </div>
            <div class="admin-dash" id="adminDash">
                <h2>📝 PENGURUSAN ARTIKEL</h2>
                <div class="admin-form">
                    <h3 id="formTitle">➕ TAMBAH ARTIKEL</h3>
                    <input type="hidden" id="postId">
                    <input type="text" id="postTitle" placeholder="TAJUK">
                    <input type="text" id="postCategory" placeholder="KATEGORI">
                    <input type="text" id="postIcon" placeholder="IKON (EMOJI)">
                    <input type="text" id="postAuthor" placeholder="PENULIS">
                    <textarea id="postExcerpt" placeholder="RINGKASAN"></textarea>
                    <textarea id="postContent" placeholder="KANDUNGAN (HTML)"></textarea>
                    <div class="btn-row">
                        <button class="btn-primary" onclick="savePost()">💾 SIMPAN</button>
                        <button class="btn-danger" onclick="resetForm()">BATAL</button>
                    </div>
                </div>
                <div id="adminList"></div>
                <button class="btn-danger" onclick="doLogout()" style="margin-top:8px;">🚪 LOGOUT</button>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>© 2026 <span class="glow">TRON BLOG</span> — DIGITAL CHRONICLES</p>
    </div>

    <!-- FLOATING -->
    <button class="back-top" id="backTop" onclick="scrollTop()">↑</button>
    <button class="fab" onclick="burst(); toast('Letupan Partikel! ✨', 'success')">✦</button>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // ===== CONFIG =====
        const db = firebase.initializeApp({
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
        }).database();
        const ADMIN_PASS = "admin123";

        let isAdmin = false;
        let posts = [];
        let audioCtx = null;
        let recorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordStart = 0;

        // ===== HELPERS =====
        const $ = id => document.getElementById(id);
        const toast = (msg, type = 'info') => {
            const wrap = $('toastWrap');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            wrap.appendChild(t);
            setTimeout(() => t.remove(), 2700);
        };

        const sound = (type) => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                const t = audioCtx.currentTime;
                const freqs = { click: [800, 400], success: [600, 1200], error: [200, 100] };
                const [start, end] = freqs[type] || [600, 800];
                o.frequency.setValueAtTime(start, t);
                o.frequency.exponentialRampToValueAtTime(end, t + 0.15);
                g.gain.setValueAtTime(0.25, t);
                g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                if (type === 'error') o.type = 'sawtooth';
                o.start(t); o.stop(t + 0.2);
            } catch(e) {}
        };

        // ===== PARTICLES =====
        (function createParticles() {
            const wrap = $('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 4 + 3) + 's';
                p.style.animationDelay = Math.random() * 4 + 's';
                p.style.width = p.style.height = (Math.random() * 3 + 2) + 'px';
                wrap.appendChild(p);
            }
        })();

        function burst() {
            sound('success');
            const wrap = document.createElement('div');
            wrap.style.cssText = 'position:fixed;left:50%;top:50%;z-index:999;pointer-events:none;';
            document.body.appendChild(wrap);
            const colors = ['#00f0ff', '#ff00ff', '#ff6b00', '#00ff88', '#fff'];
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.style.cssText = `position:absolute;width:6px;height:6px;border-radius:50%;background:${colors[i%5]};box-shadow:0 0 10px ${colors[i%5]};animation:burstFly 1s ease-out forwards;`;
                const angle = (Math.PI * 2 * i) / 20;
                const dist = Math.random() * 80 + 40;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                wrap.appendChild(p);
            }
            setTimeout(() => wrap.remove(), 1000);
        }

        // ===== CLOCK =====
        setInterval(() => {
            const now = new Date();
            $('clockTime').textContent = now.toLocaleTimeString('ms-MY', { hour12: false });
            $('clockDate').textContent = now.toLocaleDateString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        // ===== VISITORS =====
        db.ref('visitors').transaction(c => (c || 0) + 1);
        db.ref('visitors').on('value', s => $('visitors').textContent = '👁️ ' + (s.val() || 0));

        // ===== SCROLL =====
        window.addEventListener('scroll', () => {
            const h = document.documentElement;
            $('progress').style.width = (window.scrollY / (h.scrollHeight - innerHeight) * 100) + '%';
            $('backTop').classList.toggle('show', window.scrollY > 200);
        });
        const scrollTop = () => { sound('click'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

        // ===== TABS =====
        function switchTab(name, btn) {
            sound('click');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            $('tab-' + name).classList.add('active');
            if (btn) btn.classList.add('active');
            $('articleView').classList.remove('active');
            $('adminPanel').classList.remove('active');
            $('tabsBar').style.display = 'flex';
            $('heroArea').style.display = 'block';
        }

        function goHome() {
            sound('click');
            $('articleView').classList.remove('active');
            $('adminPanel').classList.remove('active');
            $('tabsBar').style.display = 'flex';
            $('heroArea').style.display = 'block';
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            $('tab-blog').classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== BLOG =====
        db.ref('posts').on('value', snap => {
            posts = [];
            if (snap.exists()) snap.forEach(c => posts.push({ id: c.key, ...c.val() }));
            renderBlog(posts);
            renderAdminList();
        });

        function renderBlog(list) {
            const wrap = $('blogList');
            if (!list.length) {
                wrap.innerHTML = `<div class="empty"><div class="empty-icon">📝</div>TIADA ARTIKEL</div>`;
                return;
            }
            wrap.innerHTML = list.map(p => `
                <div class="blog-card" onclick="openArticle('${p.id}')">
                    <div class="card-img">${p.icon || '📄'}</div>
                    <div class="card-body">
                        <span class="card-tag">${p.category || 'UMUM'}</span>
                        <div class="card-title">${p.title}</div>
                        <div class="card-excerpt">${p.excerpt || ''}</div>
                        <div class="card-meta">
                            <span class="author">${p.author || 'Tanpa Nama'}</span>
                            <span>${p.date || ''}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function searchPosts(q) {
            sound('click');
            const filtered = posts.filter(p => (p.title + p.excerpt + p.category).toLowerCase().includes(q.toLowerCase()));
            renderBlog(filtered);
        }

        function openArticle(id) {
            sound('click');
            const p = posts.find(x => x.id === id);
            if (!p) return;
            $('articleView').classList.add('active');
            $('tabsBar').style.display = 'none';
            $('heroArea').style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            $('articleTitle').textContent = p.title;
            $('articleImg').textContent = p.icon || '📄';
            $('articleBody').innerHTML = p.content || '<p>Tiada kandungan.</p>';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== CHAT =====
        db.ref('chat').limitToLast(50).on('value', snap => {
            const log = $('chatLog');
            const myName = $('chatName').value.trim() || 'Anonymous';
            log.innerHTML = '';
            if (snap.exists()) {
                snap.forEach(c => {
                    const d = c.val();
                    const div = document.createElement('div');
                    div.className = 'msg' + (d.name === myName ? ' own' : '');
                    const name = document.createElement('div');
                    name.className = 'msg-name';
                    name.textContent = `${d.name} • ${d.time || ''}`;
                    div.appendChild(name);
                    if (d.type === 'text') {
                        const t = document.createElement('div');
                        t.className = 'msg-text';
                        t.textContent = d.text;
                        div.appendChild(t);
                    } else if (d.type === 'image') {
                        const img = document.createElement('img');
                        img.className = 'msg-image';
                        img.src = d.data;
                        img.onclick = () => openLightbox(d.data);
                        div.appendChild(img);
                    } else if (d.type === 'audio') {
                        const a = document.createElement('div');
                        a.className = 'msg-audio';
                        a.onclick = () => { new Audio(d.data).play(); };
                        a.innerHTML = `<span class="audio-icon">▶</span><div class="audio-bar"></div><span class="audio-duration">${d.duration || 0}s</span>`;
                        div.appendChild(a);
                    }
                    log.appendChild(div);
                });
            }
            log.scrollTop = log.scrollHeight;
        });

        function sendText() {
            const name = $('chatName').value.trim() || 'Anonymous';
            const text = $('chatInput').value.trim();
            if (!text) return;
            sound('success');
            db.ref('chat').push({ type: 'text', name, text, time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) });
            $('chatInput').value = '';
        }

        function sendImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) return toast('Saiz gambar terlalu besar!', 'error');
            const name = $('chatName').value.trim() || 'Anonymous';
            const reader = new FileReader();
            reader.onload = ev => {
                sound('success');
                db.ref('chat').push({ type: 'image', name, data: ev.target.result, time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) });
                toast('Gambar dihantar! 📷', 'success');
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        async function toggleRecord() {
            const btn = $('recordBtn');
            const bar = $('recBar');
            if (isRecording) {
                isRecording = false;
                btn.classList.remove('recording');
                bar.classList.remove('active');
                recorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                audioChunks = [];
                recorder.ondataavailable = e => audioChunks.push(e.data);
                recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const duration = Math.round((Date.now() - recordStart) / 1000);
                        const name = $('chatName').value.trim() || 'Anonymous';
                        sound('success');
                        db.ref('chat').push({ type: 'audio', name, data: ev.target.result, duration, time: new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) });
                        toast('Audio dihantar! 🎤', 'success');
                    };
                    reader.readAsDataURL(blob);
                };
                recorder.start();
                isRecording = true;
                recordStart = Date.now();
                btn.classList.add('recording');
                bar.classList.add('active');
                sound('click');
                setTimeout(() => { if (isRecording) toggleRecord(); }, 30000);
            } catch(e) {
                sound('error');
                toast('Tidak dapat akses mikrofon!', 'error');
            }
        }

        // ===== LIGHTBOX =====
        function openLightbox(src) {
            $('lightboxImg').src = src;
            $('lightbox').classList.add('active');
        }
        function closeLightbox() {
            $('lightbox').classList.remove('active');
        }

        // ===== ADMIN =====
        function openAdmin() {
            sound('click');
            $('tabsBar').style.display = 'none';
            $('heroArea').style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            $('articleView').classList.remove('active');
            $('adminPanel').classList.add('active');
            $('adminLogin').style.display = isAdmin ? 'none' : 'block';
            $('adminDash').classList.toggle('active', isAdmin);
        }

        function doLogin() {
            if ($('adminPass').value === ADMIN_PASS) {
                sound('success');
                isAdmin = true;
                $('adminLogin').style.display = 'none';
                $('adminDash').classList.add('active');
                $('adminPass').value = '';
                toast('Login berjaya! ✅', 'success');
            } else {
                sound('error');
                toast('Kata laluan salah! ❌', 'error');
            }
        }

        function doLogout() {
            isAdmin = false;
            $('adminLogin').style.display = 'block';
            $('adminDash').classList.remove('active');
            resetForm();
        }

        function renderAdminList() {
            const wrap = $('adminList');
            if (!posts.length) {
                wrap.innerHTML = '<p style="color:#555;text-align:center;padding:10px;">Tiada artikel.</p>';
                return;
            }
            wrap.innerHTML = posts.map(p => `
                <div class="admin-post">
                    <div>
                        <h4>${p.title}</h4>
                        <p>${p.category || 'UMUM'}</p>
                    </div>
                    <div class="admin-post-actions">
                        <button class="btn-primary" onclick="editPost('${p.id}')" style="padding:5px 10px;">EDIT</button>
                        <button class="btn-danger" onclick="deletePost('${p.id}')" style="padding:5px 8px;">PADAM</button>
                    </div>
                </div>
            `).join('');
        }

        function savePost() {
            sound('success');
            const id = $('postId').value;
            const data = {
                title: $('postTitle').value.trim(),
                category: $('postCategory').value.trim(),
                icon: $('postIcon').value.trim() || '📄',
                author: $('postAuthor').value.trim(),
                excerpt: $('postExcerpt').value.trim(),
                content: $('postContent').value.trim(),
                date: new Date().toISOString().split('T')[0]
            };
            if (!data.title || !data.category || !data.author) return toast('Sila isi ruangan wajib!', 'error');
            (id ? db.ref('posts/' + id).update(data) : db.ref('posts').push(data))
                .then(() => { toast('Disimpan! ✅', 'success'); resetForm(); });
        }

        function editPost(id) {
            const p = posts.find(x => x.id === id);
            if (!p) return;
            $('postId').value = p.id;
            $('postTitle').value = p.title || '';
            $('postCategory').value = p.category || '';
            $('postIcon').value = p.icon || '';
            $('postAuthor').value = p.author || '';
            $('postExcerpt').value = p.excerpt || '';
            $('postContent').value = p.content || '';
            $('formTitle').textContent = '✏️ EDIT ARTIKEL';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deletePost(id) {
            sound('error');
            if (confirm('Padam artikel ini?')) {
                db.ref('posts/' + id).remove().then(() => toast('Dipadam! ✅', 'success'));
            }
        }

        function resetForm() {
            ['postId','postTitle','postCategory','postIcon','postAuthor','postExcerpt','postContent'].forEach(id => $(id).value = '');
            $('formTitle').textContent = '➕ TAMBAH ARTIKEL';
        }

        // ===== MENU =====
        function toggleMenu() {
            sound('click');
            $('sideMenu').classList.toggle('active');
            $('menuOverlay').classList.toggle('active');
        }

        // ===== TAP BURST =====
        document.addEventListener('click', e => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                const wrap = document.createElement('div');
                wrap.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;z-index:999;pointer-events:none;`;
                document.body.appendChild(wrap);
                for (let i = 0; i < 8; i++) {
                    const p = document.createElement('div');
                    p.style.cssText = 'position:absolute;width:5px;height:5px;border-radius:50%;background:#00f0ff;box-shadow:0 0 8px #00f0ff;animation:burstFly 0.8s ease-out forwards;';
                    const angle = (Math.PI * 2 * i) / 8;
                    const dist = Math.random() * 25 + 10;
                    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                    wrap.appendChild(p);
                }
                setTimeout(() => wrap.remove(), 800);
            }
        });

        // ===== INIT =====
        document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
    </script>

</body>
</html>
