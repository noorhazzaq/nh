<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>ZACK LIVES — 99 Multiplayer</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK Lives","short_name":"ZACK","display":"standalone","theme_color":"%230a0a0f","background_color":"%230a0a0f"}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap');
        :root{--bg:#0a0a0f;--panel:rgba(20,20,30,.92);--glass:rgba(56,189,248,.08);--border:rgba(56,189,248,.25);--cyan:#38bdf8;--orange:#f59e0b;--red:#ef4444;--green:#10b981;--text:#f1f5f9;--dim:#94a3b8}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
        .viewport{max-width:520px;margin:0 auto;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#1a1a2e 0%,#0a0a0f 70%);position:relative;display:flex;flex-direction:column}
        .header{background:var(--panel);padding:16px;text-align:center;border-bottom:1px solid var(--border)}
        .header h1{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:var(--cyan);letter-spacing:3px}
        .nav{display:flex;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
        .nav button{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;cursor:pointer;white-space:nowrap}
        .nav button.aktif{color:var(--cyan);border-bottom:2px solid var(--cyan)}
        .main{flex:1;padding:14px;overflow-y:auto}
        .page{display:none}
        .page.aktif{display:block;animation:fadeIn .3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
        .card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
        .card h2{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--cyan);margin-bottom:10px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .stat{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
        .stat .l{font-size:9px;color:var(--dim);text-transform:uppercase}
        .stat .v{font-size:16px;font-weight:700;margin-top:4px}
        .stat .v.baik{color:var(--green)}
        .stat .v.buruk{color:var(--red)}
        .btn{width:100%;padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;cursor:pointer;margin-bottom:6px;text-align:left}
        .btn:active{transform:scale(.97);border-color:var(--cyan)}
        .log-v{height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:10px;background:rgba(0,0,0,.4)}
        .log-v p{font-size:11px;color:var(--dim);padding:3px 0}
        .log-v p b{color:var(--cyan)}
        .input{width:100%;padding:12px;background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px}
        .pemain{display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:12px}
    </style>
</head>
<body>
    <div class="viewport">
        <div class="header"><h1>ZACK LIVES</h1></div>
        <div class="nav">
            <button class="aktif" onclick="page('hidup',this)">HIDUP</button>
            <button onclick="page('pemain',this)">PEMAIN</button>
            <button onclick="page('chat',this)">CHAT</button>
            <button onclick="page('ekonomi',this)">EKONOMI</button>
            <button onclick="page('sosial',this)">SOSIAL</button>
            <button onclick="page('kumpulan',this)">KUMPULAN</button>
            <button onclick="page('acara',this)">ACARA</button>
            <button onclick="page('ranking',this)">RANKING</button>
            <button onclick="page('misi',this)">MISI</button>
        </div>
        <div class="main">
            <div class="page aktif" id="pg-hidup">
                <div class="card"><h2>LOGIN</h2><input class="input" id="namaLogin" placeholder="Nama"><button class="btn" id="btnLogin">MASUK</button></div>
                <div class="card" id="hidupCard" style="display:none"><h2>STATUS</h2><div class="grid" id="statsHidup"></div><button class="btn" id="btnTahun" style="text-align:center">TAHUN SETERUSNYA</button></div>
            </div>
            <div class="page" id="pg-pemain">
                <div class="card"><h2>SENARAI</h2><div id="senaraiPemain"></div></div>
                <div class="card"><h2>KAWAN</h2><input class="input" id="kawanNama" placeholder="Nama"><button class="btn" id="btnKawan">TAMBAH</button></div>
                <div class="card"><h2>CARI</h2><input class="input" id="cariNama" placeholder="Nama"><button class="btn" id="btnCari">CARI</button></div>
                <div class="card"><h2>LAPOR</h2><input class="input" id="laporNama" placeholder="Nama"><button class="btn" id="btnLapor">LAPOR</button></div>
            </div>
            <div class="page" id="pg-chat">
                <div class="card"><h2>CHAT</h2><div class="log-v" id="chatLog"></div><input class="input" id="chatInput" placeholder="Mesej"><button class="btn" id="btnChat">HANTAR</button></div>
            </div>
            <div class="page" id="pg-ekonomi">
                <div class="card"><h2>TRANSFER</h2><input class="input" id="penerima" placeholder="Nama"><input class="input" id="jumlah" placeholder="Jumlah"><button class="btn" id="btnTransfer">TRANSFER</button></div>
                <div class="card"><h2>JUAL</h2><input class="input" id="jualNama" placeholder="Pembeli"><input class="input" id="jualItem" placeholder="Item"><input class="input" id="jualHarga" placeholder="Harga"><button class="btn" id="btnJual">JUAL</button></div>
                <div class="card"><h2>PINJAM</h2><input class="input" id="pinjamNama" placeholder="Pemberi"><input class="input" id="pinjamJumlah" placeholder="Jumlah"><button class="btn" id="btnPinjam">PINJAM</button></div>
                <div class="card"><h2>BAYAR</h2><input class="input" id="bayarNama" placeholder="Nama"><input class="input" id="bayarJumlah" placeholder="Jumlah"><button class="btn" id="btnBayarPemain">BAYAR</button></div>
            </div>
            <div class="page" id="pg-sosial">
                <div class="card"><h2>KAHWIN</h2><input class="input" id="pasangan" placeholder="Nama"><button class="btn" id="btnKahwin">KAHWIN</button></div>
                <div class="card"><h2>CERAI</h2><button class="btn" id="btnCerai">CERAI</button></div>
                <div class="card"><h2>HADIAH</h2><input class="input" id="hadiahNama" placeholder="Nama"><input class="input" id="hadiahJumlah" placeholder="Jumlah"><button class="btn" id="btnHadiah">HADIAH</button></div>
                <div class="card"><h2>PUJIAN</h2><input class="input" id="pujianNama" placeholder="Nama"><button class="btn" id="btnPujian">PUJI</button></div>
                <div class="card"><h2>SEKAT</h2><input class="input" id="sekatNama" placeholder="Nama"><button class="btn" id="btnSekat">SEKAT</button></div>
            </div>
            <div class="page" id="pg-kumpulan">
                <div class="card"><h2>BUAT</h2><input class="input" id="kumpulanNama" placeholder="Nama"><button class="btn" id="btnBuatKumpulan">BUAT</button></div>
                <div class="card"><h2>SENARAI</h2><div id="senaraiKumpulan"></div></div>
            </div>
            <div class="page" id="pg-acara">
                <div class="card"><h2>ACARA</h2><div id="senaraiAcara"></div></div>
            </div>
            <div class="page" id="pg-ranking">
                <div class="card"><h2>KEKAYAAN</h2><div id="rankingKaya"></div></div>
                <div class="card"><h2>UMUR</h2><div id="rankingUmur"></div></div>
                <div class="card"><h2>BAHAGIA</h2><div id="rankingBahagia"></div></div>
            </div>
            <div class="page" id="pg-misi">
                <div class="card"><h2>HARIAN</h2><div id="misiHarian"></div></div>
                <div class="card"><h2>MINGGUAN</h2><div id="cabaranMingguan"></div></div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
    'use strict';
    var db=firebase.initializeApp({databaseURL:'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/'}).database();
    var pengguna=null;
    var state={umur:18,kesihatan:85,mental:80,tenaga:70,kebahagiaan:75,wang:3000,simpanan:1000,aset:5000,hutang:0,gaji:1500,pekerjaan:'Pelajar',pendidikan:'SPM',berkahwin:false,anak:0,tahun:1,hidup:true,kawan:[],disekat:[],kumpulan:[]};
    window.page=function(n,btn){
        document.querySelectorAll('.page').forEach(function(p){p.classList.remove('aktif')});
        var pg=document.getElementById('pg-'+n);
        if(pg)pg.classList.add('aktif');
        document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('aktif')});
        if(btn)btn.classList.add('aktif');
        if(n==='pemain')muatPemain();
        if(n==='chat')muatChat();
        if(n==='ranking')muatRanking();
        if(n==='kumpulan')muatKumpulan();
        if(n==='acara')muatAcara();
        if(n==='misi')muatMisi();
    };
    function simpan(){if(!pengguna)return;db.ref('profil/'+pengguna).set(state).catch(function(){})}
    function muat(nama){
        db.ref('profil/'+nama).once('value').then(function(snap){
            if(snap.exists()){state=snap.val();}
            else{
                state={umur:18,kesihatan:85,mental:80,tenaga:70,kebahagiaan:75,wang:3000,simpanan:1000,aset:5000,hutang:0,gaji:1500,pekerjaan:'Pelajar',pendidikan:'SPM',berkahwin:false,anak:0,tahun:1,hidup:true,kawan:[],disekat:[],kumpulan:[]};
                simpan();
            }
            document.getElementById('hidupCard').style.display='block';
            showStats();
        }).catch(function(){alert('Ralat memuat profil')});
    }
    function showStats(){
        var k=state.kesihatan>=50?'baik':'buruk';
        document.getElementById('statsHidup').innerHTML=[
            {l:'UMUR',v:state.umur},{l:'TAHUN',v:state.tahun},
            {l:'KESIHATAN',v:state.kesihatan+'%',c:k},
            {l:'MENTAL',v:state.mental+'%'},
            {l:'KEBAHAGIAAN',v:state.kebahagiaan+'%'},
            {l:'WANG',v:'$'+state.wang},
            {l:'PEKERJAAN',v:state.pekerjaan},
            {l:'STATUS',v:state.berkahwin?'Kahwin':'Bujang'}
        ].map(function(x){return '<div class="stat"><div class="l">'+x.l+'</div><div class="v '+(x.c||'')+'">'+x.v+'</div></div>';}).join('');
    }
    function muatPemain(){
        db.ref('profil').on('value',function(snap){
            var l=[];
            if(snap.exists())snap.forEach(function(c){
                var d=c.val();
                if(state.disekat.indexOf(c.key)===-1)l.push({n:c.key,w:d.wang||0});
            });
            document.getElementById('senaraiPemain').innerHTML=l.map(function(p){
                return '<div class="pemain"><span>'+p.n+(p.n===pengguna?' (Anda)':'')+'</span><span>$'+p.w+'</span></div>';
            }).join('')||'<p style="color:#94a3b8">Tiada</p>';
        });
    }
    function muatChat(){
        db.ref('chat').limitToLast(30).on('value',function(snap){
            var l=[];
            if(snap.exists())snap.forEach(function(c){l.push(c.val())});
            document.getElementById('chatLog').innerHTML=l.map(function(m){return '<p><b>'+m.n+'</b> — '+m.t+'</p>';}).join('')||'<p style="color:#94a3b8">Tiada mesej</p>';
        });
    }
    function muatRanking(){
        db.ref('profil').on('value',function(snap){
            var k=[],u=[],b=[];
            if(snap.exists())snap.forEach(function(c){
                var d=c.val();
                k.push({n:c.key,w:d.wang||0});
                u.push({n:c.key,u:d.umur||0});
                b.push({n:c.key,b:d.kebahagiaan||0});
            });
            k.sort(function(a,b){return b.w-a.w});
            u.sort(function(a,b){return b.u-a.u});
            b.sort(function(a,b){return b.b-a.b});
            document.getElementById('rankingKaya').innerHTML=k.map(function(p,i){return '<div class="pemain"><span>'+(i+1)+'. '+p.n+'</span><span>$'+p.w+'</span></div>';}).join('')||'<p style="color:#94a3b8">Tiada</p>';
            document.getElementById('rankingUmur').innerHTML=u.map(function(p,i){return '<div class="pemain"><span>'+(i+1)+'. '+p.n+'</span><span>'+p.u+' thn</span></div>';}).join('')||'<p style="color:#94a3b8">Tiada</p>';
            document.getElementById('rankingBahagia').innerHTML=b.map(function(p,i){return '<div class="pemain"><span>'+(i+1)+'. '+p.n+'</span><span>'+p.b+'%</span></div>';}).join('')||'<p style="color:#94a3b8">Tiada</p>';
        });
    }
    function muatKumpulan(){
        db.ref('kumpulan').on('value',function(snap){
            var l=[];
            if(snap.exists())snap.forEach(function(c){l.push({n:c.key,a:c.val().ahli||1})});
            document.getElementById('senaraiKumpulan').innerHTML=l.map(function(k){return '<div class="pemain"><span>'+k.n+'</span><span>'+k.a+' ahli</span></div>';}).join('')||'<p style="color:#94a3b8">Tiada</p>';
        });
    }
    function muatAcara(){
        document.getElementById('senaraiAcara').innerHTML='<div class="pemain"><span>Piala Dunia</span><span>2026</span></div><div class="pemain"><span>Olimpik</span><span>2028</span></div>';
    }
    function muatMisi(){
        document.getElementById('misiHarian').innerHTML='<div class="pemain"><span>Simpan $100</span><span>+10 XP</span></div>';
        document.getElementById('cabaranMingguan').innerHTML='<div class="pemain"><span>Kumpul $5000</span><span>+100 XP</span></div>';
    }
    document.getElementById('btnLogin').addEventListener('click',function(){var n=document.getElementById('namaLogin').value.trim();if(!n)return;pengguna=n;muat(n);});
    document.getElementById('btnTahun').addEventListener('click',function(){if(!state.hidup)return;state.tahun++;state.umur++;state.kesihatan=Math.max(0,state.kesihatan-5);state.wang+=state.gaji;state.wang=Math.max(0,state.wang-500);if(state.kesihatan<=0||state.umur>80)state.hidup=false;simpan();showStats();});
    document.getElementById('btnChat').addEventListener('click',function(){var t=document.getElementById('chatInput').value.trim();if(!t||!pengguna)return;db.ref('chat').push({n:pengguna,t:t}).then(function(){document.getElementById('chatInput').value='';muatChat();}).catch(function(){});});
    document.getElementById('btnTransfer').addEventListener('click',function(){
        if(!pengguna)return;
        var p=document.getElementById('penerima').value.trim();
        var j=parseInt(document.getElementById('jumlah').value);
        if(!p||!j||j<=0||p===pengguna)return;
        if(state.wang<j){alert('Wang tidak cukup!');return}
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            var d=snap.val();d.wang=(d.wang||0)+j;state.wang-=j;
            db.ref('profil/'+p).update({wang:d.wang}).catch(function(){});
            simpan();showStats();alert('Transfer OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnJual').addEventListener('click',function(){
        var p=document.getElementById('jualNama').value.trim();
        var item=document.getElementById('jualItem').value.trim();
        var h=parseInt(document.getElementById('jualHarga').value);
        if(!p||!item||!h)return;
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            var d=snap.val();d.wang=(d.wang||0)-h;
            if(d.wang<0){alert('Pembeli miskin!');return}
            state.wang+=h;
            db.ref('profil/'+p).update({wang:d.wang}).catch(function(){});
            simpan();showStats();alert('Jualan OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnPinjam').addEventListener('click',function(){
        var p=document.getElementById('pinjamNama').value.trim();
        var j=parseInt(document.getElementById('pinjamJumlah').value);
        if(!p||!j)return;
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            var d=snap.val();if((d.wang||0)<j){alert('Pemberi miskin!');return}
            d.wang-=j;state.wang+=j;state.hutang+=j;
            db.ref('profil/'+p).update({wang:d.wang}).catch(function(){});
            simpan();showStats();alert('Pinjam OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnBayarPemain').addEventListener('click',function(){
        var p=document.getElementById('bayarNama').value.trim();
        var j=parseInt(document.getElementById('bayarJumlah').value);
        if(!p||!j)return;
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            var d=snap.val();d.wang=(d.wang||0)+j;state.wang-=j;
            if(state.wang<0){alert('Anda miskin!');return}
            db.ref('profil/'+p).update({wang:d.wang}).catch(function(){});
            simpan();showStats();alert('Bayar OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnKahwin').addEventListener('click',function(){
        var p=document.getElementById('pasangan').value.trim();
        if(!p||p===pengguna)return;
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            state.berkahwin=true;simpan();showStats();alert('Kahwin OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnCerai').addEventListener('click',function(){state.berkahwin=false;simpan();showStats();alert('Cerai OK!');});
    document.getElementById('btnHadiah').addEventListener('click',function(){
        var p=document.getElementById('hadiahNama').value.trim();
        var j=parseInt(document.getElementById('hadiahJumlah').value);
        if(!p||!j)return;
        if(state.wang<j){alert('Miskin!');return}
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            var d=snap.val();d.wang=(d.wang||0)+j;state.wang-=j;
            db.ref('profil/'+p).update({wang:d.wang}).catch(function(){});
            simpan();showStats();alert('Hadiah OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnPujian').addEventListener('click',function(){
        var p=document.getElementById('pujianNama').value.trim();
        if(!p||p===pengguna)return;
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            var d=snap.val();d.kebahagiaan=Math.min(100,(d.kebahagiaan||70)+5);
            db.ref('profil/'+p).update({kebahagiaan:d.kebahagiaan}).catch(function(){});
            alert('Pujian OK!');
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnSekat').addEventListener('click',function(){
        var p=document.getElementById('sekatNama').value.trim();
        if(!p||p===pengguna)return;
        if(state.disekat.indexOf(p)===-1){state.disekat.push(p);simpan();alert('Sekat OK!');}
    });
    document.getElementById('btnKawan').addEventListener('click',function(){
        var p=document.getElementById('kawanNama').value.trim();
        if(!p||p===pengguna)return;
        db.ref('profil/'+p).once('value').then(function(snap){
            if(!snap.exists()){alert('Tiada!');return}
            if(state.kawan.indexOf(p)===-1){state.kawan.push(p);simpan();showStats();alert('Kawan OK!');}
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnCari').addEventListener('click',function(){
        var n=document.getElementById('cariNama').value.trim();
        if(!n)return;
        db.ref('profil/'+n).once('value').then(function(snap){
            if(snap.exists()){var d=snap.val();alert('Ditemui: '+n+' — $'+(d.wang||0));}else{alert('Tiada!');}
        }).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnLapor').addEventListener('click',function(){
        var p=document.getElementById('laporNama').value.trim();
        if(!p)return;
        db.ref('laporan').push({nama:p,pelapor:pengguna}).then(function(){alert('Laporan dihantar!');}).catch(function(){alert('Ralat')});
    });
    document.getElementById('btnBuatKumpulan').addEventListener('click',function(){
        var n=document.getElementById('kumpulanNama').value.trim();
        if(!n)return;
        db.ref('kumpulan/'+n).set({ahli:1}).then(function(){alert('Kumpulan dibuat!');muatKumpulan();}).catch(function(){alert('Ralat')});
    });
    </script>
</body>
</html>
