<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZACK THREADS • X11</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #b400ff;
            --neon-cyan: #00ffd0;
            --neon-pink: #ff00aa;
            --neon-gold: #ffd700;
            --neon-orange: #ff6a00;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(10, 14, 30, 0.85);
            --glow-cyan: 0 0 30px rgba(0, 255, 208, 0.3);
            --glow-purple: 0 0 30px rgba(180, 0, 255, 0.3);
            --glow-pink: 0 0 30px rgba(255, 0, 170, 0.3);
            --glow-gold: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        html, body {
            height: 100%;
            background: var(--dark-bg);
            color: #e0f0ff;
            font-family: 'Orbitron', 'Segoe UI', monospace;
            overflow-x: hidden;
        }

        /* ===== ANIMATED GRID ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 20% 50%, rgba(180, 0, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
            background-size: 60px 60px, 60px 60px, 100% 100%, 100% 100%;
            z-index: 0;
            animation: gridPulse 6s infinite alternate;
            pointer-events: none;
        }

        @keyframes gridPulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ===== SCANNING LINES ===== */
        body::after {
            content: '';
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-gold), var(--neon-cyan), transparent);
            box-shadow: 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-purple), 0 0 120px var(--neon-pink);
            z-index: 9999;
            animation: scanLine 10s linear infinite;
            pointer-events: none;
            opacity: 0.4;
        }

        @keyframes scanLine {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        /* ===== PARTICLES ===== */
        .particle-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: 0s; width: 4px; height: 4px; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .particle:nth-child(2) { left: 25%; animation-duration: 18s; animation-delay: 2s; width: 3px; height: 3px; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .particle:nth-child(3) { left: 40%; animation-duration: 12s; animation-delay: 4s; width: 5px; height: 5px; background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }
        .particle:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: 1s; width: 3px; height: 3px; background: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }
        .particle:nth-child(5) { left: 70%; animation-duration: 16s; animation-delay: 3s; width: 6px; height: 6px; background: var(--neon-gold); box-shadow: 0 0 20px var(--neon-gold); }
        .particle:nth-child(6) { left: 85%; animation-duration: 22s; animation-delay: 5s; width: 4px; height: 4px; background: var(--neon-orange); box-shadow: 0 0 12px var(--neon-orange); }
        .particle:nth-child(7) { left: 50%; animation-duration: 19s; animation-delay: 7s; width: 5px; height: 5px; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); }
        .particle:nth-child(8) { left: 15%; animation-duration: 15s; animation-delay: 9s; width: 3px; height: 3px; background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }
        .particle:nth-child(9) { left: 65%; animation-duration: 17s; animation-delay: 11s; width: 4px; height: 4px; background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
        .particle:nth-child(10) { left: 35%; animation-duration: 21s; animation-delay: 6s; width: 5px; height: 5px; background: var(--neon-gold); box-shadow: 0 0 18px var(--neon-gold); }
        .particle:nth-child(11) { left: 5%; animation-duration: 13s; animation-delay: 8s; width: 3px; height: 3px; background: var(--neon-orange); box-shadow: 0 0 10px var(--neon-orange); }
        .particle:nth-child(12) { left: 95%; animation-duration: 16s; animation-delay: 4s; width: 4px; height: 4px; background: var(--neon-cyan); box-shadow: 0 0 12px var(--neon-cyan); }

        @keyframes floatParticle {
            0% { transform: translateY(110vh) scale(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1) rotate(720deg); opacity: 0; }
        }

        /* ===== SPARKLE OVERLAY ===== */
        .sparkle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 208, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 170, 0.02) 0%, transparent 70%);
            animation: sparkleBg 10s infinite alternate;
        }

        @keyframes sparkleBg {
            0% { opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { opacity: 0.3; }
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 540px;
            margin: 1.5rem auto;
            padding: 1.8rem;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 240, 255, 0.25);
            border-radius: 28px;
            box-shadow: 
                0 0 40px rgba(0, 240, 255, 0.15),
                0 0 80px rgba(180, 0, 255, 0.1),
                inset 0 0 40px rgba(0, 240, 255, 0.03);
            backdrop-filter: blur(16px);
            animation: containerGlow 4s infinite alternate;
        }

        @keyframes containerGlow {
            0% { 
                box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), 0 0 60px rgba(180, 0, 255, 0.05), inset 0 0 30px rgba(0, 240, 255, 0.02);
                border-color: rgba(0, 240, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 60px rgba(0, 240, 255, 0.2), 0 0 120px rgba(180, 0, 255, 0.15), 0 0 180px rgba(255, 0, 170, 0.05), inset 0 0 50px rgba(0, 240, 255, 0.05);
                border-color: rgba(180, 0, 255, 0.3);
            }
            100% { 
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.1), 0 0 80px rgba(0, 240, 255, 0.1), inset 0 0 40px rgba(255, 215, 0, 0.02);
                border-color: rgba(255, 215, 0, 0.2);
            }
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-gold), transparent);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            animation: headerLine 4s infinite alternate;
        }

        @keyframes headerLine {
            0% { opacity: 0.3; transform: scaleX(0.8); }
            100% { opacity: 1; transform: scaleX(1.2); }
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite, titleFlicker 3s infinite;
            text-shadow: none;
            position: relative;
            display: inline-block;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header h1::before {
            content: '✦';
            position: absolute;
            left: -60px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-text-fill-color: initial;
            color: var(--neon-gold);
            font-size: 2rem;
            animation: sparkleIcon 2s infinite;
            text-shadow: 0 0 30px var(--neon-gold);
        }

        .header h1::after {
            content: '✦';
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            -webkit-text-fill-color: initial;
            color: var(--neon-pink);
            font-size: 2rem;
            animation: sparkleIcon 2s infinite 1s;
            text-shadow: 0 0 30px var(--neon-pink);
        }

        @keyframes sparkleIcon {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1) rotate(0deg); }
            50% { opacity: 0.2; transform: translateY(-50%) scale(1.5) rotate(180deg); }
        }

        @keyframes titleFlicker {
            0%, 100% { opacity: 1; }
            2% { opacity: 0.8; }
            4% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 10px;
            color: rgba(0, 240, 255, 0.4);
            margin-top: 0.3rem;
            font-weight: 400;
            text-transform: uppercase;
            animation: subtitlePulse 3s infinite alternate;
        }

        @keyframes subtitlePulse {
            0% { opacity: 0.4; letter-spacing: 10px; }
            100% { opacity: 0.8; letter-spacing: 14px; }
        }

        /* ===== FORM ===== */
        .form-group {
            margin: 1.8rem 0;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.4rem;
            margin-bottom: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 30px rgba(0, 240, 255, 0.05);
            transform: scale(1.01);
        }

        .form-group input::placeholder {
            color: rgba(0, 240, 255, 0.25);
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        .form-group input:hover {
            border-color: rgba(0, 240, 255, 0.4);
        }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 1rem;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(180, 0, 255, 0.15));
            color: var(--neon-cyan);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-gold));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            background-size: 300% 300%;
            animation: gradientShift 3s ease-in-out infinite;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.2), 0 0 100px rgba(180, 0, 255, 0.1);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-danger {
            background: rgba(255, 0, 170, 0.1);
            color: var(--neon-pink);
            border-color: var(--neon-pink);
        }

        .btn-danger:hover {
            background: rgba(255, 0, 170, 0.2);
            box-shadow: 0 0 50px rgba(255, 0, 170, 0.2);
        }

        .btn-secondary {
            background: rgba(0, 240, 255, 0.03);
            color: rgba(0, 240, 255, 0.5);
            border-color: rgba(0, 240, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.05);
        }

        .btn-gold {
            background: rgba(255, 215, 0, 0.1);
            color: var(--neon-gold);
            border-color: var(--neon-gold);
        }

        .btn-gold:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: var(--neon-pink);
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.5rem;
            text-shadow: 0 0 20px var(--neon-pink);
            animation: errorPulse 1s infinite alternate;
        }

        @keyframes errorPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* ===== USERNAME DISPLAY ===== */
        .username-display {
            text-align: center;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            color: var(--neon-cyan);
            font-size: 0.85rem;
            letter-spacing: 4px;
            border: 1px solid rgba(0, 240, 255, 0.08);
            margin-bottom: 1.2rem;
            animation: usernameGlow 3s infinite alternate;
        }

        @keyframes usernameGlow {
            0% { border-color: rgba(0, 240, 255, 0.08); box-shadow: 0 0 20px rgba(0, 240, 255, 0.02); }
            100% { border-color: rgba(180, 0, 255, 0.2); box-shadow: 0 0 30px rgba(180, 0, 255, 0.05); }
        }

        .username-display span {
            color: var(--neon-purple);
            text-shadow: 0 0 30px var(--neon-purple), 0 0 60px rgba(180, 0, 255, 0.2);
            font-weight: 700;
        }

        /* ===== THREAD INPUT ===== */
        .thread-input {
            margin: 1.2rem 0;
        }

        .thread-input textarea {
            width: 100%;
            padding: 1rem 1.4rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(0, 240, 255, 0.15);
            border-radius: 14px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            transition: all 0.3s;
            outline: none;
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
        }

        .thread-input textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 30px rgba(0, 240, 255, 0.03);
            transform: scale(1.01);
        }

        .thread-input textarea::placeholder {
            color: rgba(0, 240, 255, 0.2);
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        .thread-input .btn {
            margin-top: 0.8rem;
        }

        /* ===== THREADS ===== */
        .threads-container {
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 240, 255, 0.08);
        }

        .threads-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .threads-header span {
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.3);
            text-transform: uppercase;
        }

        .threads-header .thread-count {
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            font-weight: 700;
        }

        .threads-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 0.3rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
        }

        .threads-list::-webkit-scrollbar {
            width: 4px;
        }

        .threads-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .threads-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 10px;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .thread-item {
            padding: 1.2rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            border-left: 3px solid var(--neon-cyan);
            transition: all 0.4s;
            animation: threadIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .thread-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.02), rgba(180, 0, 255, 0.02));
            pointer-events: none;
        }

        .thread-item:hover {
            transform: translateX(4px);
            border-left-color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.03);
        }

        @keyframes threadIn {
            0% { opacity: 0; transform: translateY(-15px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .thread-item .thread-author {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            font-weight: 700;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }

        .thread-item .thread-author::before {
            content: '◆ ';
            color: var(--neon-purple);
        }

        .thread-item .thread-content {
            font-size: 0.85rem;
            color: #e8f0ff;
            margin: 0.6rem 0;
            line-height: 1.8;
            word-break: break-word;
            position: relative;
            z-index: 1;
        }

        .thread-item .thread-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.25);
            margin-top: 0.6rem;
            position: relative;
            z-index: 1;
        }

        .thread-item .thread-actions {
            display: flex;
            gap: 1.2rem;
        }

        .thread-item .thread-actions button {
            background: none;
            border: none;
            color: rgba(0, 240, 255, 0.35);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
        }

        .thread-item .thread-actions button:hover {
            background: rgba(0, 240, 255, 0.05);
            transform: scale(1.05);
        }

        .thread-item .thread-actions .like-btn.liked {
            color: var(--neon-pink);
            text-shadow: 0 0 30px var(--neon-pink);
        }

        .thread-item .thread-actions .like-btn:hover {
            color: var(--neon-pink);
        }

        .thread-item .thread-actions .reply-btn:hover {
            color: var(--neon-purple);
        }

        .thread-item .replies-container {
            margin-top: 0.8rem;
            padding-left: 1.2rem;
            border-left: 1px solid rgba(180, 0, 255, 0.15);
            position: relative;
            z-index: 1;
        }

        .thread-item .reply-item {
            padding: 0.5rem 0;
            font-size: 0.7rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.03);
            animation: replyIn 0.3s ease-out;
        }

        @keyframes replyIn {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .thread-item .reply-item:last-child {
            border-bottom: none;
        }

        .thread-item .reply-item .reply-author {
            color: var(--neon-purple);
            text-shadow: 0 0 15px rgba(180, 0, 255, 0.15);
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 2px;
        }

        .thread-item .reply-item .reply-author::before {
            content: '↳ ';
        }

        .thread-item .reply-item .reply-text {
            color: #c0d0e8;
            margin-left: 0.5rem;
        }

        .thread-item .reply-item .reply-time {
            font-size: 0.45rem;
            color: rgba(0, 240, 255, 0.15);
            float: right;
        }

        .thread-item .reply-input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .thread-item .reply-input-group input {
            flex: 1;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(180, 0, 255, 0.15);
            border-radius: 10px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            outline: none;
            transition: all 0.3s;
        }

        .thread-item .reply-input-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 25px rgba(180, 0, 255, 0.1);
        }

        .thread-item .reply-input-group input::placeholder {
            color: rgba(0, 240, 255, 0.15);
            font-size: 0.5rem;
            letter-spacing: 2px;
        }

        .thread-item .reply-input-group button {
            padding: 0.5rem 1rem;
            background: rgba(180, 0, 255, 0.12);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            color: var(--neon-purple);
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .thread-item .reply-input-group button:hover {
            background: rgba(180, 0, 255, 0.2);
            box-shadow: 0 0 30px rgba(180, 0, 255, 0.15);
            transform: scale(1.05);
        }

        .empty-threads {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(0, 240, 255, 0.1);
            font-size: 0.7rem;
            letter-spacing: 6px;
            border: 1px dashed rgba(0, 240, 255, 0.05);
            border-radius: 16px;
        }

        .empty-threads::before {
            content: '✦ ';
            color: var(--neon-gold);
            opacity: 0.3;
        }

        .empty-threads::after {
            content: ' ✦';
            color: var(--neon-gold);
            opacity: 0.3;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 240, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.2);
            letter-spacing: 3px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-cyan);
            animation: dotBlink 1.5s infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .status-text {
            font-size: 0.55rem;
            letter-spacing: 3px;
        }

        /* ===== EXIT BUTTON ===== */
        .exit-btn {
            background: rgba(255, 0, 170, 0.08);
            border: 1px solid rgba(255, 0, 170, 0.15);
            color: var(--neon-pink);
            padding: 0.4rem 1.2rem;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .exit-btn:hover {
            background: rgba(255, 0, 170, 0.15);
            box-shadow: 0 0 30px rgba(255, 0, 170, 0.1);
            transform: scale(1.05);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { margin: 0.6rem; padding: 1.2rem; border-radius: 20px; }
            .header h1 { font-size: 2rem; letter-spacing: 4px; }
            .header h1::before, .header h1::after { display: none; }
            .thread-item { padding: 0.8rem; }
            .thread-item .thread-content { font-size: 0.75rem; }
            .form-group input { font-size: 0.8rem; padding: 0.8rem 1rem; }
            .btn { font-size: 0.7rem; padding: 0.8rem; }
        }

        @media (max-width: 400px) {
            .container { padding: 0.8rem; }
            .header h1 { font-size: 1.5rem; letter-spacing: 2px; }
            .subtitle { font-size: 0.55rem; letter-spacing: 5px; }
            .thread-item .thread-footer { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .thread-item .thread-actions { width: 100%; justify-content: space-around; }
            .thread-item .reply-input-group { flex-direction: column; }
            .thread-item .reply-input-group button { width: 100%; }
            .threads-header { flex-direction: column; gap: 0.3rem; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="particle-field">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <div class="sparkle-overlay"></div>

    <!-- ===== LOGIN PAGE ===== -->
    <div class="container" id="loginPage">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ cyber social ◈</div>
        </div>
        <div class="form-group">
            <input type="text" id="loginUsername" placeholder="USERNAME" />
            <input type="password" id="loginPassword" placeholder="PASSWORD" />
            <button class="btn" onclick="login()">⚡ SIGN IN</button>
            <button class="btn btn-secondary" onclick="showRegister()" style="margin-top:0.6rem;">⟡ CREATE ACCOUNT</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- ===== REGISTER PAGE ===== -->
    <div class="container hidden" id="registerPage">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ create account ◈</div>
        </div>
        <div class="form-group">
            <input type="text" id="regUsername" placeholder="USERNAME" />
            <input type="password" id="regPassword" placeholder="PASSWORD" />
            <input type="password" id="regConfirm" placeholder="CONFIRM PASSWORD" />
            <button class="btn btn-gold" onclick="register()">⟡ CREATE</button>
            <button class="btn btn-secondary" onclick="showLogin()" style="margin-top:0.6rem;">⬅ BACK</button>
            <div id="regError" class="error-msg"></div>
        </div>
    </div>

    <!-- ===== THREADS PAGE ===== -->
    <div class="container hidden" id="threadsPage">
        <div class="header">
            <h1>Zack Threads</h1>
            <div class="subtitle">◈ cyber social ◈</div>
        </div>
        <div class="username-display">
            WELCOME, <span id="displayUsername">USER</span>
        </div>

        <div class="thread-input">
            <textarea id="threadContent" placeholder="WHAT'S HAPPENING?"></textarea>
            <button class="btn btn-gold" onclick="postThread()">⟐ POST THREAD</button>
        </div>

        <div class="threads-container">
            <div class="threads-header">
                <span>⟡ recent threads</span>
                <span class="thread-count" id="threadCount">0 threads</span>
            </div>
            <div class="threads-list" id="threadsList">
                <div class="empty-threads">⍟ no threads yet ⍟</div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text" id="statusText">online</span>
            </div>
            <button class="exit-btn" onclick="logout()">⬅ EXIT</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const database = firebase.database();
        const usersRef = database.ref('/users');
        const threadsRef = database.ref('/threads');

        let currentUser = null;
        let threads = [];

        function showLogin() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('threadsPage').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
            document.getElementById('threadsPage').classList.add('hidden');
        }

        function showThreads() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('threadsPage').classList.remove('hidden');
        }

        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const errorEl = document.getElementById('regError');

            if (!username || !password || !confirm) {
                errorEl.textContent = 'All fields required';
                return;
            }
            if (password.length < 4) {
                errorEl.textContent = 'Password must be at least 4 characters';
                return;
            }
            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                return;
            }

            usersRef.child(username).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    errorEl.textContent = 'Username already taken';
                    return;
                }
                usersRef.child(username).set({
                    password: password,
                    created: Date.now()
                }).then(() => {
                    errorEl.textContent = '';
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regConfirm').value = '';
                    showLogin();
                    document.getElementById('loginError').textContent = 'Account created! Sign in.';
                }).catch(err => {
                    errorEl.textContent = 'Error: ' + err.message;
                });
            });
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = 'Enter username and password';
                return;
            }

            usersRef.child(username).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    errorEl.textContent = 'User not found';
                    return;
                }
                const data = snapshot.val();
                if (data.password !== password) {
                    errorEl.textContent = 'Wrong password';
                    return;
                }
                errorEl.textContent = '';
                currentUser = username;
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('displayUsername').textContent = username.toUpperCase();
                loadThreads();
                showThreads();
                setStatus('welcome ' + username);
            });
        }

        function logout() {
            currentUser = null;
            threads = [];
            showLogin();
            document.getElementById('loginError').textContent = '';
        }

        function loadThreads() {
            threadsRef.on('value', snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    threads = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                    threads.sort((a, b) => b.timestamp - a.timestamp);
                    renderThreads();
                } else {
                    threads = [];
                    renderThreads();
                }
            });
        }

        function renderThreads() {
            const list = document.getElementById('threadsList');
            const count = document.getElementById('threadCount');

            if (threads.length === 0) {
                list.innerHTML = '<div class="empty-threads">⍟ no threads yet ⍟</div>';
                count.textContent = '0 threads';
                return;
            }

            let html = '';
            threads.forEach(thread => {
                const time = new Date(thread.timestamp).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                const likes = thread.likes || [];
                const liked = likes.includes(currentUser);
                const replies = thread.replies || [];
                
                html += `
                    <div class="thread-item" id="thread-${thread.id}">
                        <div class="thread-author">${thread.author.toUpperCase()}</div>
                        <div class="thread-content">${thread.content}</div>
                        <div class="thread-footer">
                            <span>${time}</span>
                            <div class="thread-actions">
                                <button class="like-btn ${liked ? 'liked' : ''}" onclick="likeThread('${thread.id}')">
                                    ♥ ${likes.length}
                                </button>
                                <button class="reply-btn" onclick="toggleReply('${thread.id}')">
                                    ⌨ ${replies.length}
                                </button>
                            </div>
                        </div>
                        <div class="replies-container" id="replies-${thread.id}">
                            ${renderReplies(thread)}
                        </div>
                        <div class="reply-input-group hidden" id="replyInput-${thread.id}">
                            <input type="text" id="replyText-${thread.id}" placeholder="REPLY..." />
                            <button onclick="postReply('${thread.id}')">SEND</button>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
            count.textContent = `${threads.length} threads`;
        }

        function renderReplies(thread) {
            if (!thread.replies || thread.replies.length === 0) return '';
            let html = '';
            thread.replies.forEach(reply => {
                const time = new Date(reply.timestamp).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="reply-item">
                        <span class="reply-author">${reply.author.toUpperCase()}</span>
                        <span class="reply-text">${reply.text}</span>
                        <span class="reply-time">${time}</span>
                    </div>
                `;
            });
            return html;
        }

        function toggleReply(threadId) {
            const input = document.getElementById(`replyInput-${threadId}`);
            input.classList.toggle('hidden');
            if (!input.classList.contains('hidden')) {
                document.getElementById(`replyText-${threadId}`).focus();
            }
        }

        function postThread() {
            const content = document.getElementById('threadContent').value.trim();
            if (!content) {
                setStatus('enter thread content', true);
                return;
            }
            if (!currentUser) return;

            const newThread = {
                author: currentUser,
                content: content,
                timestamp: Date.now(),
                likes: [],
                replies: []
            };

            threadsRef.push(newThread).then(() => {
                document.getElementById('threadContent').value = '';
                setStatus('thread posted ✓');
            }).catch(err => {
                setStatus('error: ' + err.message, true);
            });
        }

        function likeThread(threadId) {
            if (!currentUser) return;
            const thread = threads.find(t => t.id === threadId);
            if (!thread) return;

            const likes = thread.likes || [];
            const index = likes.indexOf(currentUser);
            if (index > -1) {
                likes.splice(index, 1);
            } else {
                likes.push(currentUser);
            }

            threadsRef.child(threadId).update({ likes: likes }).catch(err => {
                setStatus('error: ' + err.message, true);
            });
        }

        function postReply(threadId) {
            const input = document.getElementById(`replyText-${threadId}`);
            const text = input.value.trim();
            if (!text) return;
            if (!currentUser) return;

            const thread = threads.find(t => t.id === threadId);
            if (!thread) return;

            const replies = thread.replies || [];
            replies.push({
                author: currentUser,
                text: text,
                timestamp: Date.now()
            });

            threadsRef.child(threadId).update({ replies: replies }).then(() => {
                input.value = '';
                document.getElementById(`replyInput-${threadId}`).classList.add('hidden');
                setStatus('reply posted ✓');
            }).catch(err => {
                setStatus('error: ' + err.message, true);
            });
        }

        function setStatus(msg, isError = false) {
            const el = document.getElementById('statusText');
            el.textContent = msg;
            el.style.color = isError ? '#ff00aa' : 'rgba(0,240,255,0.5)';
            if (!isError) {
                setTimeout(() => {
                    el.textContent = 'online';
                    el.style.color = 'rgba(0,240,255,0.5)';
                }, 3000);
            }
        }

        document.getElementById('threadContent').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) postThread();
        });

        document.getElementById('loginPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        document.getElementById('regConfirm').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') register();
        });

        showLogin();
    </script>
</body>
</html>
