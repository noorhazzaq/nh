<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Global Chat Pro</title>

  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;:&quot;Global Chat Pro&quot;,
    &quot;short_name&quot;:&quot;ChatPro&quot;,
    &quot;start_url&quot;:&quot;/&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#1a1a2e&quot;,
    &quot;theme_color&quot;:&quot;#16213e&quot;,
    &quot;icons&quot;:[{
      &quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316213e'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23e94560'%3E💬%3C/text%3E%3C/svg%3E&quot;,
      &quot;sizes&quot;:&quot;512x512&quot;,
      &quot;type&quot;:&quot;image/svg+xml&quot;
    }]
  }" />

  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    :root {
      --bg-primary: #0f0e17;
      --bg-secondary: #1a1a2e;
      --bg-header: #16213e;
      --accent: #e94560;
      --accent-hover: #ff6b81;
      --text-primary: #fffffe;
      --text-muted: #a7a9be;
      --msg-own: #e94560;
      --msg-other: #2d2d44;
      --radius: 2rem;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem;
      overflow: hidden;
    }
    /* ===== CHAT CONTAINER ===== */
    .chat-container {
      max-width: 900px;
      width: 100%;
      height: 98vh;
      max-height: 850px;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* ===== HEADER ===== */
    .chat-header {
      padding: 1rem 1.5rem;
      background: var(--bg-header);
      border-bottom: 2px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 0.5rem;
      z-index: 10;
    }
    .chat-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .chat-header h1 span {
      color: var(--accent);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .online-count {
      font-size: 0.75rem;
      opacity: 0.7;
      padding: 0.25rem 0.75rem;
      background: var(--bg-primary);
      border-radius: 2rem;
      white-space: nowrap;
    }
    .auth-section {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .auth-section input {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 2rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.85rem;
      width: 120px;
      transition: var(--transition);
    }
    .auth-section input:focus {
      outline: 2px solid var(--accent);
      width: 150px;
    }
    .auth-section button {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 2rem;
      background: var(--accent);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .auth-section button:hover {
      transform: scale(1.05);
      background: var(--accent-hover);
    }
    .auth-section button.logout-btn {
      background: var(--msg-other);
    }
    .auth-section button.logout-btn:hover {
      background: #3d3d5c;
    }
    /* ===== MESSAGES AREA ===== */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      background: #12122a;
      scroll-behavior: smooth;
    }
    .messages-area::-webkit-scrollbar {
      width: 5px;
    }
    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-area::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    .status {
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.5;
      padding: 0.5rem;
      font-style: italic;
    }
    /* ===== MESSAGES ===== */
    .message {
      padding: 0.5rem 1rem;
      border-radius: 1.2rem;
      max-width: 82%;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
      position: relative;
      line-height: 1.5;
    }
    .message.own {
      align-self: flex-end;
      background: var(--msg-own);
      border-bottom-right-radius: 0.3rem;
    }
    .message.other {
      align-self: flex-start;
      background: var(--msg-other);
      border-bottom-left-radius: 0.3rem;
    }
    .message .sender {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-bottom: 0.1rem;
    }
    .message .time {
      font-size: 0.55rem;
      opacity: 0.5;
      margin-left: 0.6rem;
    }
    .message .text {
      font-size: 0.95rem;
    }
    .message .text img,
    .message .text video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 0.8rem;
      margin: 0.2rem 0;
      display: block;
    }
    .message .text .emoji-big {
      font-size: 2.5rem;
      display: block;
    }
    .message .text .sticker {
      max-width: 150px;
      max-height: 150px;
      border-radius: 0.8rem;
    }
    .message .text .location {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0.8rem;
      display: inline-block;
      font-size: 0.8rem;
    }
    .message .text .location a {
      color: #4fc3f7;
      text-decoration: none;
    }
    .message .text .location a:hover {
      text-decoration: underline;
    }
    .message .text .gif {
      max-width: 200px;
      max-height: 200px;
      border-radius: 0.8rem;
    }
    .message .text .voice-msg {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
    }
    .message .text .voice-msg audio {
      max-width: 150px;
      height: 30px;
    }
    /* ===== INPUT AREA ===== */
    .input-area {
      padding: 0.75rem 1rem 1rem;
      background: var(--bg-header);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-shrink: 0;
      border-top: 1px solid var(--msg-other);
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .input-row input[type="text"] {
      flex: 1;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 2rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: var(--transition);
      min-width: 60px;
    }
    .input-row input[type="text"]:focus {
      outline: 2px solid var(--accent);
    }
    .input-row input[type="text"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .input-row button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 2rem;
      background: var(--accent);
      color: var(--text-primary);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .input-row button:hover:not(:disabled) {
      transform: scale(1.05);
      background: var(--accent-hover);
    }
    .input-row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .input-row button.icon-btn {
      padding: 0.6rem 0.8rem;
      font-size: 1.2rem;
      background: var(--msg-other);
    }
    .input-row button.icon-btn:hover:not(:disabled) {
      background: #3d3d5c;
    }
    /* ===== TOOLBAR ===== */
    .toolbar {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      padding: 0.2rem 0.2rem 0;
    }
    .toolbar button {
      padding: 0.2rem 0.6rem;
      border: none;
      border-radius: 1rem;
      background: var(--msg-other);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.8;
    }
    .toolbar button:hover {
      opacity: 1;
      transform: scale(1.05);
      background: var(--accent);
    }
    .toolbar button.active {
      background: var(--accent);
      opacity: 1;
    }
    /* ===== EMOJI PICKER ===== */
    .emoji-picker {
      display: none;
      flex-wrap: wrap;
      gap: 0.2rem;
      padding: 0.3rem;
      background: var(--bg-secondary);
      border-radius: 1rem;
      max-height: 120px;
      overflow-y: auto;
    }
    .emoji-picker.open {
      display: flex;
    }
    .emoji-picker button {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.1rem 0.3rem;
      border-radius: 0.3rem;
      transition: var(--transition);
    }
    .emoji-picker button:hover {
      background: var(--msg-other);
      transform: scale(1.2);
    }
    /* ===== STICKER PICKER ===== */
    .sticker-picker {
      display: none;
      flex-wrap: wrap;
      gap: 0.3rem;
      padding: 0.3rem;
      background: var(--bg-secondary);
      border-radius: 1rem;
      max-height: 120px;
      overflow-y: auto;
    }
    .sticker-picker.open {
      display: flex;
    }
    .sticker-picker button {
      background: transparent;
      border: none;
      font-size: 2.5rem;
      cursor: pointer;
      padding: 0.1rem;
      border-radius: 0.5rem;
      transition: var(--transition);
    }
    .sticker-picker button:hover {
      background: var(--msg-other);
      transform: scale(1.15);
    }
    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }
    .typing-indicator {
      align-self: flex-start;
      background: var(--msg-other);
      padding: 0.5rem 1.2rem;
      border-radius: 1.2rem;
      font-size: 0.8rem;
      opacity: 0.7;
      animation: pulse 1.2s ease-in-out infinite;
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .chat-header {
        padding: 0.75rem 1rem;
      }
      .chat-header h1 {
        font-size: 1.1rem;
      }
      .auth-section input {
        width: 80px;
        font-size: 0.75rem;
      }
      .auth-section input:focus {
        width: 100px;
      }
      .messages-area {
        padding: 0.75rem 0.75rem;
      }
      .input-area {
        padding: 0.5rem 0.75rem 0.75rem;
      }
      .message {
        max-width: 90%;
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
      }
      .toolbar button {
        font-size: 0.65rem;
        padding: 0.15rem 0.4rem;
      }
      .emoji-picker button {
        font-size: 1.2rem;
      }
      .sticker-picker button {
        font-size: 2rem;
      }
    }
    @media (max-width: 400px) {
      .auth-section input {
        width: 60px;
      }
      .input-row input[type="text"] {
        font-size: 0.85rem;
        padding: 0.5rem 0.7rem;
      }
      .input-row button {
        font-size: 0.75rem;
        padding: 0.5rem 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- ===== HEADER ===== -->
    <div class="chat-header">
      <h1>🌍 <span>Chat</span>Pro</h1>
      <div class="header-right">
        <span class="online-count" id="onlineCount">👤 0 online</span>
        <div class="auth-section" id="authSection">
          <input type="text" id="usernameInput" placeholder="Name..." maxlength="20" />
          <button id="loginBtn">Join</button>
          <button id="logoutBtn" class="logout-btn" style="display:none;">Leave</button>
        </div>
      </div>
    </div>

    <!-- ===== MESSAGES ===== -->
    <div class="messages-area" id="messagesArea">
      <div class="status">👋 Sign in to start chatting</div>
    </div>

    <!-- ===== INPUT ===== -->
    <div class="input-area">
      <div class="toolbar" id="toolbar">
        <button data-action="emoji">😊 Emoji</button>
        <button data-action="sticker">🎨 Sticker</button>
        <button data-action="gif">🎬 GIF</button>
        <button data-action="image">🖼️ Image</button>
        <button data-action="video">🎥 Video</button>
        <button data-action="voice">🎤 Voice</button>
        <button data-action="location">📍 Location</button>
        <button data-action="poll">📊 Poll</button>
        <button data-action="code">💻 Code</button>
        <button data-action="bold"><b>B</b></button>
        <button data-action="italic"><i>I</i></button>
        <button data-action="strike"><s>S</s></button>
      </div>

      <div class="emoji-picker" id="emojiPicker">
        <button>😊</button><button>😂</button><button>🤣</button><button>❤️</button>
        <button>🔥</button><button>👍</button><button>👎</button><button>🙏</button>
        <button>💪</button><button>🎉</button><button>✨</button><button>🌟</button>
        <button>💀</button><button>👀</button><button>🤔</button><button>😭</button>
        <button>🥰</button><button>😍</button><button>🤩</button><button>😎</button>
        <button>🥳</button><button>😤</button><button>🤯</button><button>😱</button>
        <button>🍕</button><button>🌮</button><button>🍔</button><button>☕</button>
        <button>🏆</button><button>🎯</button><button>💯</button><button>🔮</button>
      </div>

      <div class="sticker-picker" id="stickerPicker">
        <button>🐱</button><button>🐶</button><button>🐼</button><button>🐨</button>
        <button>🦊</button><button>🐰</button><button>🐻</button><button>🐸</button>
        <button>🐵</button><button>🦄</button><button>🐉</button><button>🐲</button>
        <button>🚀</button><button>🛸</button><button>👽</button><button>🤖</button>
        <button>🎃</button><button>👻</button><button>💀</button><button>👾</button>
      </div>

      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message..." disabled />
        <button id="sendBtn" disabled>Send</button>
        <button id="fileInputBtn" class="icon-btn" disabled>📎</button>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" />
      </div>
    </div>
  </div>

  <!-- ===== FIREBASE SDK ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <script>
    // ============================================================
    // 1. FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // 2. DOM REFS
    // ============================================================
    const DOM = {
      messages: document.getElementById('messagesArea'),
      input: document.getElementById('messageInput'),
      send: document.getElementById('sendBtn'),
      username: document.getElementById('usernameInput'),
      login: document.getElementById('loginBtn'),
      logout: document.getElementById('logoutBtn'),
      online: document.getElementById('onlineCount'),
      toolbar: document.getElementById('toolbar'),
      emojiPicker: document.getElementById('emojiPicker'),
      stickerPicker: document.getElementById('stickerPicker'),
      fileInput: document.getElementById('fileInput'),
      fileBtn: document.getElementById('fileInputBtn'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================
    let currentUser = null;
    let listeners = [];
    let typingTimeout = null;
    let isTyping = false;

    // ============================================================
    // 4. CORE FUNCTIONS
    // ============================================================
    function setStatus(text) {
      let el = DOM.messages.querySelector('.status');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    }

    function scrollBottom() {
      setTimeout(() => DOM.messages.scrollTop = DOM.messages.scrollHeight, 50);
    }

    function escapeHTML(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    // ============================================================
    // 5. MESSAGE RENDERER
    // ============================================================
    function renderMessage(data) {
      const isOwn = currentUser && data.uid === currentUser.uid;
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      div.dataset.key = data._key;

      // Sender + time
      const header = document.createElement('div');
      header.className = 'sender';
      header.textContent = data.name || 'Anonymous';
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(data.timestamp);
      header.appendChild(time);
      div.appendChild(header);

      // Content
      const content = document.createElement('div');
      content.className = 'text';

      let html = data.text || '';

      // Auto-detect content types
      if (html.startsWith('📸 ')) {
        // Image
        const url = html.substring(4);
        html = `<img src="${url}" alt="Image" loading="lazy" />`;
      } else if (html.startsWith('🎬 ')) {
        // Video
        const url = html.substring(4);
        html = `<video controls src="${url}" preload="metadata"></video>`;
      } else if (html.startsWith('🎤 ')) {
        // Voice
        const url = html.substring(4);
        html =
          `<div class="voice-msg">🎤 <audio controls src="${url}"></audio></div>`;
      } else if (html.startsWith('📍 ')) {
        // Location
        const coords = html.substring(4);
        html =
          `<div class="location">📍 <a href="https://maps.google.com/maps?q=${coords}" target="_blank">${coords}</a></div>`;
      } else if (html.startsWith('📊 ')) {
        // Poll
        const options = html.substring(4).split('|');
        let pollHtml = '<div class="location" style="background:rgba(255,255,255,0.05);padding:0.5rem;">📊 Poll:<br/>';
        options.forEach((opt, i) => {
          pollHtml += `&nbsp;&nbsp;${i+1}. ${opt}<br/>`;
        });
        pollHtml += '</div>';
        html = pollHtml;
      } else if (html.startsWith('💻 ')) {
        // Code
        const code = html.substring(4);
        html =
          `<pre style="background:#0f0e17;padding:0.5rem;border-radius:0.5rem;overflow-x:auto;font-size:0.8rem;"><code>${escapeHTML(code)}</code></pre>`;
      } else if (html.startsWith('🎬 GIF: ')) {
        // GIF
        const url = html.substring(8);
        html = `<img class="gif" src="${url}" alt="GIF" loading="lazy" />`;
      } else if (html.startsWith('🎨 ')) {
        // Sticker
        const emoji = html.substring(4);
        html = `<span class="sticker">${emoji}</span>`;
      }

      // Bold / Italic / Strike (simple markdown)
      html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      html = html.replace(/\*(.*?)\*/g, '<i>$1</i>');
      html = html.replace(/~~(.*?)~~/g, '<s>$1</s>');

      content.innerHTML = html;
      div.appendChild(content);

      // Remove status on first message
      const status = DOM.messages.querySelector('.status');
      if (status) status.remove();

      DOM.messages.appendChild(div);
      scrollBottom();
    }

    // ============================================================
    // 6. FIREBASE SUBSCRIPTIONS
    // ============================================================
    function subscribeMessages() {
      listeners.forEach(ref => ref.off());
      listeners = [];

      const query = db.ref('messages').orderByKey().limitToLast(150);

      query.on('child_added', (snap) => {
        const data = snap.val();
        data._key = snap.key;
        renderMessage(data);
      });

      query.on('child_removed', (snap) => {
        const el = DOM.messages.querySelector(`[data-key="${snap.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      query.once('value', (snap) => {
        if (!snap.exists()) setStatus('💬 No messages yet. Say hello!');
      });

      // Presence
      setupPresence();
    }

    function setupPresence() {
      const presence = db.ref('.info/connected');
      const users = db.ref('users');

      presence.on('value', (snap) => {
        if (snap.val() && currentUser) {
          const ref = users.child(currentUser.uid);
          ref.set({ name: currentUser.name, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          ref.onDisconnect().remove();
        }
      });

      users.on('value', (snap) => {
        DOM.online.textContent = snap.exists() ? `👤 ${snap.numChildren()} online` : '👤 0 online';
      });

      listeners.push(presence);
    }

    // ============================================================
    // 7. SEND MESSAGE
    // ============================================================
    function sendMessage(text) {
      if (!currentUser) { alert('Sign in first!'); return; }
      if (!text || !text.trim()) return;

      db.ref('messages').push({
        name: currentUser.name,
        uid: currentUser.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch(err => {
        console.error('Send error:', err);
        alert('Failed to send. Check connection.');
      });

      DOM.input.value = '';
      DOM.input.focus();
    }

    // ============================================================
    // 8. FILE HANDLING (Image/Video/Voice)
    // ============================================================
    function handleFile(file) {
      if (!currentUser) { alert('Sign in first!'); return; }

      const type = file.type;
      let prefix = '📸 ';
      if (type.startsWith('video/')) prefix = '🎬 ';
      else if (type.startsWith('audio/')) prefix = '🎤 ';

      // Read as data URL (for demo - in production use Firebase Storage)
      const reader = new FileReader();
      reader.onload = (e) => {
        sendMessage(prefix + e.target.result);
      };
      reader.readAsDataURL(file);
    }

    // ============================================================
    // 9. AUTH
    // ============================================================
    function login() {
      const name = DOM.username.value.trim() || 'Guest';
      currentUser = {
        name: name,
        uid: 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.username.disabled = true;
      DOM.login.style.display = 'none';
      DOM.logout.style.display = 'inline-block';
      DOM.input.disabled = false;
      DOM.send.disabled = false;
      DOM.fileBtn.disabled = false;
      DOM.input.placeholder = `Message as ${name}...`;

      setStatus(`✅ Signed in as ${name}`);
      DOM.messages.innerHTML = '';
      subscribeMessages();
    }

    function logout() {
      if (currentUser) db.ref('users').child(currentUser.uid).remove();
      listeners.forEach(ref => ref.off());
      listeners = [];
      currentUser = null;

      DOM.username.disabled = false;
      DOM.login.style.display = 'inline-block';
      DOM.logout.style.display = 'none';
      DOM.input.disabled = true;
      DOM.send.disabled = true;
      DOM.fileBtn.disabled = true;
      DOM.input.placeholder = 'Sign in to chat...';
      DOM.input.value = '';
      DOM.messages.innerHTML = '';
      setStatus('👋 You left the chat. Sign in to rejoin.');
      DOM.online.textContent = '👤 0 online';
    }

    // ============================================================
    // 10. TOOLBAR ACTIONS
    // ============================================================
    function togglePicker(type) {
      const pickers = {
        emoji: DOM.emojiPicker,
        sticker: DOM.stickerPicker
      };
      const picker = pickers[type];
      if (!picker) return;

      const isOpen = picker.classList.contains('open');
      // Close all
      Object.values(pickers).forEach(p => p.classList.remove('open'));
      if (!isOpen) picker.classList.add('open');
    }

    // ============================================================
    // 11. EVENT BINDINGS
    // ============================================================
    // Auth
    DOM.login.addEventListener('click', login);
    DOM.logout.addEventListener('click', logout);
    DOM.username.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

    // Send
    DOM.send.addEventListener('click', () => sendMessage(DOM.input.value));
    DOM.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.input.value);
      }
    });

    // File input
    DOM.fileBtn.addEventListener('click', () => DOM.fileInput.click());
    DOM.fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleFile(e.target.files[0]);
        e.target.value = '';
      }
    });

    // Toolbar
    DOM.toolbar.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;

      switch (action) {
        case 'emoji':
          togglePicker('emoji');
          break;
        case 'sticker':
          togglePicker('sticker');
          break;
        case 'gif':
          const gifUrl = prompt('Enter GIF URL:');
          if (gifUrl) sendMessage('🎬 GIF: ' + gifUrl);
          break;
        case 'image':
          DOM.fileInput.click();
          break;
        case 'video':
          DOM.fileInput.click();
          break;
        case 'voice':
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            alert('Voice recording: Click OK to start recording (demo)');
            // In production, use MediaRecorder API
            DOM.fileInput.click();
          } else {
            alert('Voice recording not supported in this browser.');
          }
          break;
        case 'location':
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const coords = `${pos.coords.latitude},${pos.coords.longitude}`;
                sendMessage('📍 ' + coords);
              },
              () => alert('Location access denied.')
            );
          } else {
            alert('Geolocation not supported.');
          }
          break;
        case 'poll':
          const options = prompt('Enter poll options (comma separated):');
          if (options) {
            const opts = options.split(',').map(o => o.trim()).filter(o => o);
            if (opts.length >= 2) sendMessage('📊 ' + opts.join('|'));
          }
          break;
        case 'code':
          const code = prompt('Enter code:');
          if (code) sendMessage('💻 ' + code);
          break;
        case 'bold':
          DOM.input.value += ' **bold** ';
          DOM.input.focus();
          break;
        case 'italic':
          DOM.input.value += ' *italic* ';
          DOM.input.focus();
          break;
        case 'strike':
          DOM.input.value += ' ~~strike~~ ';
          DOM.input.focus();
          break;
      }
    });

    // Emoji picker
    DOM.emojiPicker.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) {
        DOM.input.value += btn.textContent;
        DOM.input.focus();
        DOM.emojiPicker.classList.remove('open');
      }
    });

    // Sticker picker
    DOM.stickerPicker.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) {
        sendMessage('🎨 ' + btn.textContent);
        DOM.stickerPicker.classList.remove('open');
      }
    });

    // Click outside to close pickers
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.input-area')) {
        DOM.emojiPicker.classList.remove('open');
        DOM.stickerPicker.classList.remove('open');
      }
    });

    // ============================================================
    // 12. INIT
    // ============================================================
    setStatus('🌐 Connecting...');
    subscribeMessages();

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    console.log('💬 ChatPro loaded with 21+ features!');
  </script>

</body>
</html>
