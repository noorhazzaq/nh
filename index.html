<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>📜 99 Proverbs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden;position:relative}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#trail-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.container{max-width:700px;width:100%;background:rgba(26,26,46,.75);backdrop-filter:blur(30px);border-radius:24px;padding:24px;box-shadow:0 20px 80px rgba(0,0,0,.9);text-align:center;position:relative;z-index:1;border:1px solid rgba(255,255,255,.05);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:2rem;margin-bottom:4px;background:linear-gradient(135deg,#fbbf24,#f59e0b,#e94560,#ff6b81);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:grad 6s ease-in-out infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{font-size:.85rem;opacity:.7;margin-bottom:8px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.badge{display:inline-block;padding:6px 20px;border-radius:50px;font-size:.7rem;font-weight:600;margin-bottom:12px;background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.2);box-shadow:0 0 40px rgba(251,191,36,.1);animation:bp 2s ease-in-out infinite}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.icon{font-size:3.5rem;display:block;margin:8px 0;min-height:70px}
.loading{font-size:1rem;opacity:.6;padding:20px;animation:pulse 1.5s ease-in-out infinite}
.proverb-box{min-height:140px;display:flex;align-items:center;justify-content:center;padding:16px;margin:8px 0;background:rgba(255,255,255,.02);border-radius:16px;border:1px solid rgba(255,255,255,.03);position:relative}
.proverb-text{font-size:1.2rem;line-height:1.8;opacity:.9;font-style:italic}
.proverb-text .origin{display:block;font-size:.7rem;opacity:.5;margin-top:8px;font-style:normal;letter-spacing:1px;text-transform:uppercase}
.counter{font-size:.6rem;opacity:.3;margin:6px 0;min-height:20px}
.btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.btn{padding:10px 20px;border:none;border-radius:50px;font-size:.75rem;font-weight:600;cursor:pointer;transition:.3s;position:relative;overflow:hidden;flex:1;min-width:80px;max-width:140px}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:.3s}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.95)}
.btn--next{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0f0e17;box-shadow:0 4px 30px rgba(251,191,36,.3)}
.btn--next:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(251,191,36,.5)}
.btn--rand{background:linear-gradient(135deg,#e94560,#ff6b81);color:#fff;box-shadow:0 4px 30px rgba(233,69,96,.3)}
.btn--rand:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(233,69,96,.5)}
.btn--prev{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;box-shadow:0 4px 30px rgba(96,165,250,.3)}
.btn--prev:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(96,165,250,.5)}
.btn--refresh{background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 4px 30px rgba(52,211,153,.3)}
.btn--refresh:hover{transform:scale(1.05);box-shadow:0 10px 50px rgba(52,211,153,.5)}
.clock{font-size:.6rem;opacity:.3;margin-top:12px;font-variant-numeric:tabular-nums}
.flower{position:fixed;font-size:2rem;pointer-events:none;z-index:0;animation:ff 25s ease-in-out infinite;opacity:.08}
@keyframes ff{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}25%{transform:translateY(-40px) rotate(20deg) scale(1.1)}50%{transform:translateY(20px) rotate(-10deg) scale(.9)}75%{transform:translateY(-20px) rotate(10deg) scale(1.05)}}
@media(max-width:480px){.container{padding:16px}h1{font-size:1.5rem}.proverb-text{font-size:1rem}.btn{padding:8px 12px;font-size:.65rem;min-width:60px}.icon{font-size:2.5rem}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="trail-canvas"></canvas>

<div class="flower" style="top:5%;left:3%;animation-delay:0s">📜</div>
<div class="flower" style="top:15%;right:5%;animation-delay:-4s">🕊️</div>
<div class="flower" style="bottom:20%;left:8%;animation-delay:-8s">🌿</div>
<div class="flower" style="bottom:10%;right:3%;animation-delay:-12s">⭐</div>
<div class="flower" style="top:45%;left:2%;animation-delay:-16s">🌙</div>
<div class="flower" style="top:60%;right:2%;animation-delay:-20s">☀️</div>

<div class="container">
<div class="badge" id="badge">📜 Click to Fetch</div>
<h1>99 Proverbs</h1>
<div class="sub">Fresh wisdom from free APIs</div>
<div class="icon" id="icon">📜</div>

<div class="proverb-box">
<div class="proverb-text" id="proverb"><span class="loading">⏳ Click a button to fetch proverb</span></div>
</div>
<div class="counter" id="counter">—</div>

<div class="btn-group">
<button class="btn btn--prev" onclick="fetchPrev()">◀ Prev</button>
<button class="btn btn--rand" onclick="fetchRandom()">🎲 Random</button>
<button class="btn btn--next" onclick="fetchNext()">Next ▶</button>
</div>

<div class="btn-group">
<button class="btn btn--refresh" onclick="fetchFresh()" style="max-width:200px">🔄 Fresh Proverb</button>
</div>

<div class="clock" id="clock"></div>
</div>

<script>
// ============================================================
// PURE API — No Storage
// ============================================================

var current=null;
var history=[];

function showLoading(){
document.getElementById('proverb').innerHTML='<span class="loading">⏳ Fetching wisdom...</span>';
document.getElementById('counter').textContent='⏳ Loading...';
document.getElementById('badge').textContent='📜 Fetching...';
document.getElementById('icon').textContent='⏳';
}

function display(data){
var text=data.proverb||data.quote||data.text||'Wisdom';
var origin=data.origin||data.author||data.source||'Unknown';
var cat=data.category||'Wisdom';
var icons=['📜','🕊️','🌿','⭐','🌙','☀️','💫','🌟','✨','🪷','🔮','🌈','🦋','🌸','🍀'];
var icon=icons[Math.floor(Math.random()*icons.length)];

document.getElementById('proverb').innerHTML='"'+text+'"<span class="origin">— '+origin+'</span>';
document.getElementById('counter').textContent='📖 #'+(history.length)+' · '+cat;
document.getElementById('badge').textContent='📜 '+cat;
document.getElementById('icon').textContent=icon;
current=data;
}

function fetchFromAPI(){
showLoading();

// Try multiple free APIs
var apis=[
function(){return fetch('https://api.quotable.io/random')
.then(function(r){return r.json()})
.then(function(d){return{proverb:d.content,origin:d.author,source:'Quotable'}})},
function(){return fetch('https://api.api-ninjas.com/v1/quotes?limit=1',{headers:{'X-Api-Key':'3qT+WckTS2W3+O1G+f4NCA==iAj03j3T1fR4V7Wh'}})
.then(function(r){return r.json()})
.then(function(d){var q=d[0]||{};return{proverb:q.quote||'Wisdom',origin:q.author||'Unknown',source:'Ninjas'}})},
function(){return fetch('https://api.adviceslip.com/advice')
.then(function(r){return r.json()})
.then(function(d){var a=d.slip||{};return{proverb:a.advice||'Advice',origin:'Wisdom',source:'Advice Slip'}})},
function(){return fetch('https://zenquotes.io/api/random')
.then(function(r){return r.json()})
.then(function(d){var q=d[0]||{};return{proverb:q.q||'Quote',origin:q.a||'Zen',source:'Zen Quotes'}})}
];

// Try each API until one works
return apis.reduce(function(promise,fn){
return promise.catch(function(){
return fn();
});
}, Promise.reject())
.catch(function(){
// Fallback: generate wisdom
var fallbacks=[
'Wisdom is knowing when to speak and when to listen.',
'The journey of a thousand miles begins with a single step.',
'Patience is the companion of wisdom.',
'Knowledge speaks, but wisdom listens.',
'The only true wisdom is in knowing you know nothing.',
'Wisdom is the reward you get for a lifetime of listening.',
'A fool thinks himself wise, but a wise man knows himself to be a fool.',
'It is better to remain silent and be thought a fool than to speak and remove all doubt.',
'Turn your wounds into wisdom.',
'The wise man learns from the mistakes of others.'
];
var f=fallbacks[Math.floor(Math.random()*fallbacks.length)];
return Promise.resolve({proverb:f,origin:'Ancient Wisdom',source:'Fallback'});
});
}

function fetchFresh(){
fetchFromAPI().then(function(data){
display(data);
history.push(data);
document.getElementById('counter').textContent='📖 #'+history.length+' · '+data.source;
}).catch(function(){
document.getElementById('proverb').innerHTML='<span class="loading">❌ Try again</span>';
});
}

function fetchRandom(){
fetchFresh();
}

function fetchNext(){
fetchFresh();
}

function fetchPrev(){
if(history.length>1){
var prev=history[history.length-2];
display(prev);
history.pop();
document.getElementById('counter').textContent='📖 #'+(history.length)+' · '+prev.source;
}else{
fetchFresh();
}
}

// ============================================================
// CLOCK
// ============================================================

function updateClock(){
var d=new Date();
document.getElementById('clock').textContent='🕐 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
setInterval(updateClock,1000);updateClock();

// ============================================================
// PARTICLES
// ============================================================

var c=document.getElementById('bg-canvas'),ctx=c.getContext('2d'),W,H,pts=[],running=true;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
document.addEventListener('visibilitychange',function(){running=!document.hidden});
var cols=['#fbbf24','#e94560','#60a5fa','#34d399','#a78bfa','#fb923c','#ff6b81','#22d3ee'];
for(var i=0;i<50;i++){pts.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*3+1,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4-.1,c:cols[Math.floor(Math.random()*cols.length)],l:Math.random()*120+60,ml:Math.random()*120+60,g:Math.random()*12+6})}
function draw(){if(!running){requestAnimationFrame(draw);return}ctx.clearRect(0,0,W,H);pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0||p.x<0||p.x>W||p.y<0||p.y>H){p.x=Math.random()*W;p.y=H;p.l=p.ml;p.vx=(Math.random()-.5)*.4;p.vy=-Math.random()*.4-.1;p.c=cols[Math.floor(Math.random()*cols.length)]}var a=p.l/p.ml;ctx.beginPath();ctx.arc(p.x,p.y,p.s*a,0,Math.PI*2);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=p.g*a;ctx.fill()});requestAnimationFrame(draw)}
draw();

// ============================================================
// MOUSE TRAIL
// ============================================================

var tc=document.getElementById('trail-canvas'),tctx=tc.getContext('2d'),trail=[];
function resizeTrail(){tc.width=window.innerWidth;tc.height=window.innerHeight}
window.addEventListener('resize',resizeTrail);resizeTrail();
document.addEventListener('mousemove',function(e){trail.push({x:e.clientX,y:e.clientY,life:1});if(trail.length>30)trail.shift()});
document.addEventListener('touchmove',function(e){var t=e.touches[0];trail.push({x:t.clientX,y:t.clientY,life:1});if(trail.length>30)trail.shift()},{passive:true});
function drawTrail(){tctx.clearRect(0,0,tc.width,tc.height);trail.forEach(function(p){p.life-=0.03;if(p.life>0){var a=p.life*0.3;var s=p.life*8+2;var g=tctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s);g.addColorStop(0,'rgba(251,191,36,'+a+')');g.addColorStop(1,'rgba(251,191,36,0)');tctx.beginPath();tctx.arc(p.x,p.y,s,0,Math.PI*2);tctx.fillStyle=g;tctx.fill()}});trail=trail.filter(function(p){return p.life>0});requestAnimationFrame(drawTrail)}
drawTrail();

// ============================================================
// BREATHING
// ============================================================

var breathe=0;setInterval(function(){breathe=(breathe+1)%100;var s=1+Math.sin(breathe/20)*.008;document.querySelector('.container').style.transform='scale('+s+')'},100);

// ============================================================
// INIT — Auto fetch first proverb
// ============================================================

fetchFresh();
console.log('📜 Pure API Proverbs — No storage');
</script>
</body>
</html>
