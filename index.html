<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZACK BANK • TRON</title>
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #b400ff;
            --neon-cyan: #00ffd0;
            --neon-pink: #ff00aa;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(10, 14, 30, 0.85);
            --glow-blue: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 40px #00f0ff88;
            --glow-purple: 0 0 10px #b400ff, 0 0 30px #b400ff66;
            --glow-pink: 0 0 10px #ff00aa, 0 0 30px #ff00aa55;
        }

        html, body {
            height: 100%;
            background: var(--dark-bg);
            color: #e0f0ff;
            font-family: 'Orbitron', 'Segoe UI', monospace;
            overflow-x: hidden;
        }

        /* ===== ANIMATED GRID BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridPulse 4s infinite alternate;
            pointer-events: none;
        }

        @keyframes gridPulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ===== SCANNING LINE ===== */
        body::after {
            content: '';
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), var(--neon-cyan), transparent);
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 60px var(--neon-purple);
            z-index: 9999;
            animation: scanLine 8s linear infinite;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes scanLine {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        /* ===== PARTICLES ===== */
        .particle-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-cyan), 0 0 12px var(--neon-blue);
            animation: floatParticle linear infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: 0s; width: 4px; height: 4px; }
        .particle:nth-child(2) { left: 25%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 40%; animation-duration: 12s; animation-delay: 4s; width: 5px; height: 5px; background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }
        .particle:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 70%; animation-duration: 16s; animation-delay: 3s; width: 6px; height: 6px; background: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }
        .particle:nth-child(6) { left: 85%; animation-duration: 22s; animation-delay: 5s; }
        .particle:nth-child(7) { left: 50%; animation-duration: 19s; animation-delay: 7s; width: 4px; height: 4px; }
        .particle:nth-child(8) { left: 15%; animation-duration: 15s; animation-delay: 9s; background: var(--neon-cyan); }
        .particle:nth-child(9) { left: 65%; animation-duration: 17s; animation-delay: 11s; width: 5px; height: 5px; }
        .particle:nth-child(10) { left: 35%; animation-duration: 21s; animation-delay: 6s; background: var(--neon-purple); }

        @keyframes floatParticle {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ===== MAIN CONTAINER ===== */
        .bank-container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 1.5rem auto;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 240, 255, 0.3);
            border-radius: 24px;
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.2),
                inset 0 0 30px rgba(0, 240, 255, 0.05);
            backdrop-filter: blur(12px);
            animation: containerGlow 3s infinite alternate;
        }

        @keyframes containerGlow {
            0% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.03); }
            100% { box-shadow: 0 0 50px rgba(180, 0, 255, 0.25), 0 0 80px rgba(0, 240, 255, 0.1), inset 0 0 40px rgba(0, 240, 255, 0.08); }
        }

        /* ===== HEADER ===== */
        .bank-header {
            text-align: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
        }

        .bank-header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            animation: titleFlicker 3s infinite;
            position: relative;
            display: inline-block;
        }

        .bank-header h1::after {
            content: '⍟';
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
            color: var(--neon-cyan);
            animation: sparkle 1.5s infinite;
            text-shadow: 0 0 20px var(--neon-cyan);
        }

        .bank-header h1::before {
            content: '⍟';
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
            color: var(--neon-purple);
            animation: sparkle 1.5s infinite 0.75s;
            text-shadow: 0 0 20px var(--neon-purple);
        }

        @keyframes titleFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; text-shadow: 0 0 60px rgba(0, 240, 255, 0.5); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
            50% { opacity: 0.3; transform: translateY(-50%) scale(1.5); }
        }

        .bank-subtitle {
            font-size: 0.7rem;
            letter-spacing: 8px;
            color: rgba(0, 240, 255, 0.5);
            margin-top: 0.3rem;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* ===== BALANCE DISPLAY ===== */
        .balance-display {
            margin: 1.8rem 0;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .balance-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 240, 255, 0.05), transparent, rgba(180, 0, 255, 0.05), transparent);
            animation: rotateBg 10s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .balance-label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.6);
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .balance-amount {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.2);
            position: relative;
            z-index: 1;
            animation: balancePulse 2s infinite alternate;
            font-family: 'Orbitron', monospace;
        }

        @keyframes balancePulse {
            0% { text-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
            100% { text-shadow: 0 0 50px rgba(0, 240, 255, 0.6), 0 0 80px rgba(180, 0, 255, 0.3); }
        }

        .balance-currency {
            font-size: 1.2rem;
            color: var(--neon-purple);
            margin-left: 0.3rem;
            text-shadow: 0 0 20px var(--neon-purple);
        }

        /* ===== TRANSACTION PANEL ===== */
        .transaction-panel {
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .input-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 2;
            min-width: 140px;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            color: #e0f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .input-group input::placeholder {
            color: rgba(0, 240, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 90px;
            padding: 0.9rem 1.2rem;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(180, 0, 255, 0.2));
            color: var(--neon-cyan);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3), 0 0 80px rgba(180, 0, 255, 0.2);
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(180, 0, 255, 0.3));
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-danger {
            background: rgba(255, 0, 170, 0.15);
            color: var(--neon-pink);
            border: 1.5px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 170, 0.1);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(255, 0, 170, 0.3);
            background: rgba(255, 0, 170, 0.25);
        }

        .btn-success {
            background: rgba(0, 255, 208, 0.15);
            color: var(--neon-cyan);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 208, 0.1);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 255, 208, 0.3);
            background: rgba(0, 255, 208, 0.25);
        }

        /* ===== TRANSACTION LOG ===== */
        .log-section {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 240, 255, 0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .log-header span {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
        }

        .log-header .log-count {
            color: var(--neon-purple);
            text-shadow: 0 0 10px var(--neon-purple);
        }

        .log-container {
            max-height: 180px;
            overflow-y: auto;
            padding-right: 0.3rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
        }

        .log-container::-webkit-scrollbar {
            width: 4px;
        }

        .log-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .log-item {
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--neon-cyan);
            border-radius: 4px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: logIn 0.3s ease-out;
            transition: all 0.3s;
        }

        .log-item:hover {
            background: rgba(0, 240, 255, 0.05);
            border-left-color: var(--neon-purple);
        }

        .log-item .log-amount {
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .log-item .log-amount.negative {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 0, 170, 0.2);
        }

        .log-item .log-time {
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.3);
            letter-spacing: 1px;
        }

        .log-item .log-type {
            font-size: 0.55rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .log-item .log-type.withdraw {
            background: rgba(255, 0, 170, 0.1);
            color: var(--neon-pink);
            border-color: rgba(255, 0, 170, 0.2);
        }

        @keyframes logIn {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .empty-log {
            text-align: center;
            padding: 1.5rem;
            color: rgba(0, 240, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 4px;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(0, 240, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.55rem;
            color: rgba(0, 240, 255, 0.25);
            letter-spacing: 2px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: dotBlink 1.5s infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .bank-container { margin: 1rem; padding: 1.2rem; }
            .bank-header h1 { font-size: 1.8rem; letter-spacing: 3px; }
            .bank-header h1::before, .bank-header h1::after { display: none; }
            .balance-amount { font-size: 2.4rem; }
            .input-group input { min-width: 100px; font-size: 0.8rem; }
            .btn { font-size: 0.65rem; padding: 0.7rem 0.8rem; min-width: 70px; }
        }

        @media (max-width: 400px) {
            .balance-amount { font-size: 1.8rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }

        /* ===== SPARKLE OVERLAY ===== */
        .sparkle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 240, 255, 0.02) 100%);
            animation: sparkleBg 8s infinite alternate;
        }

        @keyframes sparkleBg {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* flicker effect for some elements */
        .flicker {
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            3% { opacity: 0.8; }
            6% { opacity: 1; }
            7% { opacity: 0.7; }
            8% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- ===== PARTICLES ===== -->
    <div class="particle-field">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== SPARKLE OVERLAY ===== -->
    <div class="sparkle-overlay"></div>

    <!-- ===== MAIN BANK ===== -->
    <div class="bank-container">

        <!-- HEADER -->
        <div class="bank-header">
            <h1>Zack Bank</h1>
            <div class="bank-subtitle">◈ cyber finance ◈</div>
        </div>

        <!-- BALANCE -->
        <div class="balance-display">
            <div class="balance-label">⟡ available balance ⟡</div>
            <div class="balance-amount" id="balanceDisplay">
                0.00 <span class="balance-currency">ZACK</span>
            </div>
        </div>

        <!-- TRANSACTIONS -->
        <div class="transaction-panel">
            <div class="input-group">
                <input type="number" id="amountInput" placeholder="ENTER AMOUNT" step="0.01" min="0.01" />
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="deposit()">⚡ DEPOSIT</button>
                <button class="btn btn-primary" onclick="withdraw()">⬡ WITHDRAW</button>
                <button class="btn btn-danger" onclick="resetBank()">⟲ RESET</button>
            </div>
        </div>

        <!-- TRANSACTION LOG -->
        <div class="log-section">
            <div class="log-header">
                <span>⟡ transaction log</span>
                <span class="log-count" id="logCount">0 entries</span>
            </div>
            <div class="log-container" id="logContainer">
                <div class="empty-log">⍟ no transactions yet ⍟</div>
            </div>
        </div>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="statusText">system online</span>
            </div>
            <span id="timeDisplay">--:--:--</span>
        </div>

    </div>

    <!-- ===== FIREBASE SETUP ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        // ===== FIREBASE CONFIG =====
        const FIREBASE_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const database = firebase.database();
        const bankRef = database.ref('/zackbank');

        // ===== STATE =====
        let balance = 0;
        let transactions = [];
        const MAX_LOG = 20;

        // ===== DOM REFS =====
        const balanceEl = document.getElementById('balanceDisplay');
        const logContainer = document.getElementById('logContainer');
        const logCountEl = document.getElementById('logCount');
        const statusText = document.getElementById('statusText');
        const amountInput = document.getElementById('amountInput');
        const timeDisplay = document.getElementById('timeDisplay');

        // ===== HELPERS =====
        function setStatus(msg, isError = false) {
            statusText.textContent = msg;
            statusText.style.color = isError ? '#ff00aa' : 'rgba(0,240,255,0.5)';
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit',
                second: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ===== RENDER =====
        function render() {
            // Balance
            balanceEl.innerHTML = `${balance.toFixed(2)} <span class="balance-currency">ZACK</span>`;

            // Log
            if (transactions.length === 0) {
                logContainer.innerHTML = '<div class="empty-log">⍟ no transactions yet ⍟</div>';
                logCountEl.textContent = '0 entries';
                return;
            }

            let html = '';
            const display = transactions.slice(0, MAX_LOG);
            display.forEach(tx => {
                const isNegative = tx.type === 'withdraw';
                const cls = isNegative ? 'log-amount negative' : 'log-amount';
                const typeCls = isNegative ? 'log-type withdraw' : 'log-type';
                html += `
                    <div class="log-item">
                        <span class="${typeCls}">${tx.type.toUpperCase()}</span>
                        <span class="${cls}">${isNegative ? '-' : '+'}$${tx.amount.toFixed(2)}</span>
                        <span class="log-time">${formatTime(tx.timestamp)}</span>
                    </div>
                `;
            });
            logContainer.innerHTML = html;
            logCountEl.textContent = `${transactions.length} entries`;
        }

        // ===== FIREBASE SYNC =====
        function loadFromFirebase() {
            bankRef.on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    balance = data.balance || 0;
                    transactions = data.transactions || [];
                    render();
                    setStatus('synced ✓');
                } else {
                    // First time - initialize
                    balance = 1000;
                    transactions = [{
                        type: 'deposit',
                        amount: 1000,
                        timestamp: Date.now()
                    }];
                    saveToFirebase();
                }
            }, error => {
                console.error('Firebase sync error:', error);
                setStatus('sync error', true);
            });
        }

        function saveToFirebase() {
            bankRef.set({
                balance: balance,
                transactions: transactions
            }).catch(err => {
                console.error('Save error:', err);
                setStatus('save failed', true);
            });
        }

        // ===== BANK OPERATIONS =====
        function addTransaction(type, amount) {
            transactions.unshift({
                type: type,
                amount: amount,
                timestamp: Date.now()
            });
            if (transactions.length > 100) transactions = transactions.slice(0, 100);
            saveToFirebase();
            render();
        }

        window.deposit = function() {
            const val = parseFloat(amountInput.value);
            if (!val || val <= 0) {
                setStatus('invalid amount', true);
                return;
            }
            balance += val;
            addTransaction('deposit', val);
            amountInput.value = '';
            setStatus(`+ $${val.toFixed(2)} deposited`);
            // spark effect
            balanceEl.style.transform = 'scale(1.05)';
            setTimeout(() => balanceEl.style.transform = 'scale(1)', 200);
        };

        window.withdraw = function() {
            const val = parseFloat(amountInput.value);
            if (!val || val <= 0) {
                setStatus('invalid amount', true);
                return;
            }
            if (val > balance) {
                setStatus('insufficient funds', true);
                return;
            }
            balance -= val;
            addTransaction('withdraw', val);
            amountInput.value = '';
            setStatus(`- $${val.toFixed(2)} withdrawn`);
            balanceEl.style.transform = 'scale(0.95)';
            setTimeout(() => balanceEl.style.transform = 'scale(1)', 200);
        };

        window.resetBank = function() {
            if (!confirm('⟲ RESET ALL DATA?')) return;
            balance = 1000;
            transactions = [{
                type: 'deposit',
                amount: 1000,
                timestamp: Date.now()
            }];
            saveToFirebase();
            render();
            setStatus('system reset');
            balanceEl.style.transform = 'scale(1.1)';
            setTimeout(() => balanceEl.style.transform = 'scale(1)', 300);
        };

        // ===== KEYBOARD SUPPORT =====
        document.getElementById('amountInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.shiftKey) withdraw();
                else deposit();
            }
        });

        // ===== INIT =====
        loadFromFirebase();
        setStatus('initializing...');

        // Extra sparkle: random glow on balance
        setInterval(() => {
            if (Math.random() > 0.7) {
                balanceEl.style.textShadow = '0 0 60px rgba(0,240,255,0.6), 0 0 120px rgba(180,0,255,0.3)';
                setTimeout(() => {
                    balanceEl.style.textShadow = '0 0 30px rgba(0,240,255,0.4), 0 0 60px rgba(0,240,255,0.2)';
                }, 300);
            }
        }, 2000);
    </script>
</body>
</html>
