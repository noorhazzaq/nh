<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Android Only</title>
  <!-- Firebase SDKs (free tier compatible) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    /* Sorted & minimal styles */
    body {
      font-family: 'Roboto', sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin: 0 0 8px;
    }
    .sub {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .data-box {
      background: #f0f2f5;
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      color: #222;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      margin-bottom: 20px;
    }
    .btn {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }
    .btn:active { transform: scale(0.96); }
    .btn-secondary {
      background: #e94560;
      margin-top: 12px;
    }
    .status {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #666;
    }
    .error { color: #d32f2f; }
    .success { color: #2e7d32; }
    .android-badge {
      display: inline-block;
      background: #3ddc84;
      color: #000;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    /* Android only block - hidden by default, shown via JS */
    .android-only {
      display: block;
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <!-- Android badge (visible only on Android) -->
  <div class="android-badge" id="androidBadge">🤖 Android</div>
  
  <h1>Firebase + Vercel</h1>
  <p class="sub">Free tier · Real-time</p>

  <!-- Data display -->
  <div class="data-box" id="dataDisplay">Loading...</div>

  <!-- Actions -->
  <button class="btn" id="fetchBtn">📥 Fetch Data</button>
  <button class="btn btn-secondary" id="updateBtn">✏️ Update Data</button>

  <!-- Status messages -->
  <div class="status" id="statusMsg">Ready</div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- SORTED: Firebase config (Vercel env vars or hardcoded) ----------
    // For security, use environment variables on Vercel (server-side).
    // But this is a single HTML, so we put it here (free tier safe with rules).
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyReplaceMe",          // <-- REPLACE with your own
      authDomain: "zack360-2b303.firebaseapp.com",
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "zack360-2b303",
      storageBucket: "zack360-2b303.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('testData'); // path

    // DOM refs
    const dataDisplay = document.getElementById('dataDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const fetchBtn = document.getElementById('fetchBtn');
    const updateBtn = document.getElementById('updateBtn');
    const androidBadge = document.getElementById('androidBadge');

    // ---------- SORTED: Android-only detection ----------
    function isAndroid() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      // Check for Android in userAgent
      return /android/i.test(ua);
    }

    // ---------- SORTED: Ban non-Android browsers ----------
    function enforceAndroidOnly() {
      if (!isAndroid()) {
        // Override entire body with a blocking message
        document.body.innerHTML = `
          <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a2e;color:white;font-family:sans-serif;padding:20px;text-align:center;flex-direction:column;">
            <h1 style="font-size:2.5rem;margin:0;">🚫</h1>
            <h2>Access Denied</h2>
            <p style="max-width:300px;color:#ccc;">This page is optimized for <strong>Android</strong> browsers only. Please open on an Android device.</p>
            <small style="margin-top:30px;color:#888;">User-Agent: ${navigator.userAgent}</small>
          </div>
        `;
        return false; // blocked
      }
      // Show badge
      if (androidBadge) androidBadge.style.display = 'inline-block';
      return true; // allowed
    }

    // ---------- SORTED: Helper to set status ----------
    function setStatus(msg, isError = false) {
      if (statusMsg) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status ' + (isError ? 'error' : 'success');
      }
    }

    // ---------- SORTED: Fetch data from Firebase ----------
    function fetchData() {
      setStatus('Fetching...', false);
      dataDisplay.textContent = '⏳';
      
      dbRef.once('value')
        .then((snapshot) => {
          const val = snapshot.val();
          if (val === null || val === undefined) {
            dataDisplay.textContent = '📭 No data yet';
            setStatus('Empty node', false);
          } else {
            // If it's an object, stringify nicely
            const display = typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val);
            dataDisplay.textContent = display;
            setStatus('✅ Data loaded', false);
          }
        })
        .catch((err) => {
          console.error('Fetch error:', err);
          dataDisplay.textContent = '⚠️ Error';
          setStatus('❌ ' + err.message, true);
        });
    }

    // ---------- SORTED: Update data (write) ----------
    function updateData() {
      const newValue = {
        timestamp: Date.now(),
        message: 'Hello from Android!',
        random: Math.floor(Math.random() * 1000)
      };
      
      setStatus('Updating...', false);
      dataDisplay.textContent = '⏳';
      
      dbRef.set(newValue)
        .then(() => {
          setStatus('✅ Updated successfully', false);
          // Refresh display
          return dbRef.once('value');
        })
        .then((snapshot) => {
          const val = snapshot.val();
          const display = typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val);
          dataDisplay.textContent = display;
        })
        .catch((err) => {
          console.error('Update error:', err);
          dataDisplay.textContent = '⚠️ Error';
          setStatus('❌ ' + err.message, true);
        });
    }

    // ---------- SORTED: Init ----------
    function init() {
      // 1. Enforce Android only (blocks if not)
      const allowed = enforceAndroidOnly();
      if (!allowed) return;

      // 2. Load initial data
      fetchData();

      // 3. Event listeners
      if (fetchBtn) fetchBtn.addEventListener('click', fetchData);
      if (updateBtn) updateBtn.addEventListener('click', updateData);

      // 4. Listen for real-time updates (optional - for demo)
      // We use once() above, but you can also use on() for live updates.
      // For free tier, once() is more economical.
      // But we add a listener to show real-time changes (optional)
      // Uncomment if you want live updates:
      /*
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val !== null && val !== undefined) {
          const display = typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val);
          dataDisplay.textContent = display;
        }
      });
      */
    }

    // Run when DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
</script>

</body>
</html>
