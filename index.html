<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pixel Chat</title>
  <style>
    /* ============================================================
       PIXEL DESIGN SYSTEM — PHONE FIRST
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      touch-action: manipulation;
    }

    /* ============================================================
       APP — Phone optimized
       ============================================================ */
    .app {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 932px;
      background: #16213e;
      border: 2px solid #e94560;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      border-radius: 0;
      position: relative;
    }

    /* ============================================================
       HEADER — Phone optimized
       ============================================================ */
    .header {
      padding: 8px 12px;
      background: #0f0e17;
      border-bottom: 2px solid #e94560;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      flex-shrink: 0;
      min-height: 44px;
    }

    .header h1 {
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .header h1 span {
      color: #e94560;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 auto;
      justify-content: flex-end;
      min-width: 0;
    }

    /* ============================================================
       STATUS — Phone optimized
       ============================================================ */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      background: #1a1a2e;
      border: 2px solid #4caf50;
      font-size: 0.35rem;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 32px;
      justify-content: center;
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      background: #4caf50;
      display: inline-block;
      flex-shrink: 0;
    }

    .status-badge .dot.off {
      background: #e94560;
      animation: blink 0.8s infinite;
    }

    .status-badge .count {
      font-size: 0.35rem;
      margin-left: 1px;
    }

    /* ============================================================
       AUTH — Phone optimized
       ============================================================ */
    .auth {
      display: flex;
      gap: 4px;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
    }

    .auth input {
      padding: 3px 8px;
      border: 2px solid #e94560;
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.35rem;
      width: 60px;
      transition: 0.2s;
      min-height: 24px;
      flex: 1 1 auto;
      min-width: 40px;
      max-width: 80px;
    }

    .auth input:focus {
      outline: none;
      border-color: #ff6b81;
      width: 70px;
    }

    .auth input::placeholder {
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.3rem;
    }

    .auth input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      padding: 3px 10px;
      border: 2px solid #e94560;
      background: #e94560;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.35rem;
      cursor: pointer;
      transition: 0.1s;
      text-transform: uppercase;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn--danger {
      background: #e94560;
      border-color: #e94560;
      padding: 3px 8px;
    }

    /* ============================================================
       MESSAGES — Phone optimized
       ============================================================ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: #12122a;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-track {
      background: #0f0e17;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #e94560;
      border: 1px solid #0f0e17;
    }

    .status-msg {
      text-align: center;
      font-size: 0.35rem;
      opacity: 0.4;
      padding: 16px 8px;
      font-style: italic;
    }

    /* ============================================================
       MESSAGE — Phone optimized
       ============================================================ */
    .msg {
      padding: 4px 10px;
      border: 2px solid #ffffff;
      max-width: 88%;
      word-wrap: break-word;
      animation: fadeIn 0.2s steps(2);
      line-height: 1.5;
      font-size: 0.4rem;
    }

    .msg.own {
      align-self: flex-end;
      background: #e94560;
      border-color: #ff6b81;
      border-bottom-right-radius: 0;
    }

    .msg.other {
      align-self: flex-start;
      background: #1a1a2e;
      border-color: #2a2a4e;
      border-bottom-left-radius: 0;
    }

    .msg .sender {
      font-size: 0.3rem;
      text-transform: uppercase;
      opacity: 0.7;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .msg .time {
      font-size: 0.25rem;
      opacity: 0.4;
      margin-left: 4px;
    }

    .msg .text {
      font-size: 0.4rem;
      word-break: break-word;
      line-height: 1.6;
    }

    /* ============================================================
       INPUT — Phone optimized
       ============================================================ */
    .input-area {
      padding: 6px 10px 10px;
      background: #0f0e17;
      border-top: 2px solid #e94560;
      flex-shrink: 0;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .row input {
      flex: 1;
      padding: 6px 10px;
      border: 2px solid #e94560;
      background: #12122a;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.4rem;
      min-width: 40px;
      transition: 0.2s;
      min-height: 32px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }

    .row input:focus {
      outline: none;
      border-color: #ff6b81;
    }

    .row input::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.35rem;
    }

    .row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .row .btn {
      font-size: 0.4rem;
      padding: 6px 14px;
      min-height: 32px;
      flex-shrink: 0;
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.2;
      }
    }

    /* ============================================================
       SMALL PHONES (under 380px)
       ============================================================ */
    @media (max-width: 380px) {
      body {
        padding: 4px;
      }

      .header {
        padding: 5px 8px;
        min-height: 36px;
      }

      .header h1 {
        font-size: 0.4rem;
        letter-spacing: 0.5px;
      }

      .auth input {
        font-size: 0.3rem;
        padding: 2px 6px;
        min-height: 20px;
        width: 45px;
        max-width: 60px;
      }

      .auth input:focus {
        width: 55px;
      }

      .btn {
        font-size: 0.3rem;
        padding: 2px 8px;
        min-height: 20px;
      }

      .status-badge {
        font-size: 0.3rem;
        padding: 2px 6px;
        min-width: 26px;
      }

      .status-badge .dot {
        width: 5px;
        height: 5px;
      }

      .status-badge .count {
        font-size: 0.3rem;
      }

      .messages {
        padding: 5px 6px;
        gap: 2px;
      }

      .msg {
        padding: 3px 8px;
        max-width: 92%;
        font-size: 0.35rem;
      }

      .msg .sender {
        font-size: 0.25rem;
      }

      .msg .text {
        font-size: 0.35rem;
        line-height: 1.4;
      }

      .input-area {
        padding: 4px 6px 8px;
      }

      .row input {
        font-size: 0.35rem;
        padding: 4px 8px;
        min-height: 28px;
      }

      .row .btn {
        font-size: 0.35rem;
        padding: 4px 10px;
        min-height: 28px;
      }

      .status-msg {
        font-size: 0.3rem;
        padding: 12px 6px;
      }
    }

    /* ============================================================
       VERY SMALL PHONES (under 320px)
       ============================================================ */
    @media (max-width: 320px) {
      .header h1 {
        font-size: 0.35rem;
      }

      .auth input {
        width: 35px;
        font-size: 0.25rem;
        padding: 2px 4px;
        min-height: 16px;
      }

      .auth input:focus {
        width: 45px;
      }

      .btn {
        font-size: 0.25rem;
        padding: 2px 6px;
        min-height: 16px;
      }

      .status-badge {
        font-size: 0.25rem;
        padding: 2px 4px;
        min-width: 20px;
      }

      .status-badge .dot {
        width: 4px;
        height: 4px;
      }

      .msg {
        padding: 2px 6px;
        max-width: 95%;
        font-size: 0.3rem;
      }

      .msg .sender {
        font-size: 0.2rem;
      }

      .msg .text {
        font-size: 0.3rem;
      }

      .row input {
        font-size: 0.3rem;
        padding: 3px 6px;
        min-height: 22px;
      }

      .row .btn {
        font-size: 0.3rem;
        padding: 3px 8px;
        min-height: 22px;
      }
    }

    /* ============================================================
       LANDSCAPE PHONES
       ============================================================ */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 4px;
      }

      .app {
        max-height: 95vh;
        border-width: 2px;
      }

      .header {
        padding: 4px 10px;
        min-height: 32px;
      }

      .header h1 {
        font-size: 0.4rem;
      }

      .auth input {
        min-height: 18px;
        padding: 2px 6px;
        font-size: 0.3rem;
        width: 50px;
      }

      .btn {
        min-height: 18px;
        padding: 2px 8px;
        font-size: 0.3rem;
      }

      .messages {
        padding: 4px 8px;
        gap: 2px;
      }

      .msg {
        padding: 2px 8px;
        max-width: 90%;
        font-size: 0.35rem;
      }

      .msg .sender {
        font-size: 0.25rem;
        margin-bottom: 1px;
      }

      .msg .text {
        font-size: 0.35rem;
        line-height: 1.3;
      }

      .input-area {
        padding: 3px 8px 6px;
      }

      .row input {
        min-height: 22px;
        padding: 3px 8px;
        font-size: 0.35rem;
      }

      .row .btn {
        min-height: 22px;
        padding: 3px 10px;
        font-size: 0.35rem;
      }

      .status-badge {
        font-size: 0.3rem;
        padding: 2px 6px;
      }

      .status-badge .dot {
        width: 4px;
        height: 4px;
      }
    }

    /* ============================================================
       SAFE AREA (Notch phones)
       ============================================================ */
    @supports (padding: max(0px)) {
      .app {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
        padding-top: max(0px, env(safe-area-inset-top));
        padding-bottom: max(0px, env(safe-area-inset-bottom));
      }
    }

    /* ============================================================
       DARK MODE SUPPORT
       ============================================================ */
    @media (prefers-color-scheme: light) {
      body {
        background: #1a1a2e;
      }
    }

    /* ============================================================
       REDUCED MOTION
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
  APP
  ============================================================ -->
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <h1>🕹️ <span>PIXEL</span></h1>
      <div class="header-right">
        <div class="status-badge">
          <span class="dot" id="statusDot"></span>
          <span class="count" id="onlineCount">0</span>
        </div>
        <div class="auth">
          <input type="text" id="nameInput" placeholder="NAME" maxlength="20" inputmode="text" autocomplete="off" />
          <button class="btn" id="joinBtn">JOIN</button>
          <button class="btn btn--danger" id="leaveBtn" style="display:none">✕</button>
        </div>
      </div>
    </header>

    <!-- ===== MESSAGES ===== -->
    <div class="messages" id="messagesContainer">
      <div class="status-msg">🔄 CONNECTING...</div>
    </div>

    <!-- ===== INPUT ===== -->
    <footer class="input-area">
      <div class="row">
        <input type="text" id="messageInput" placeholder="TYPE..." disabled inputmode="text" autocomplete="off" />
        <button class="btn" id="sendBtn" disabled>SEND</button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
  FIREBASE
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
  </script>

  <!-- ============================================================
  APP SCRIPT
  ============================================================ -->
  <script>
    /**
     * ============================================================
     * PIXEL CHAT — Phone-First
     * ============================================================
     */

    // ============================================================
    // 1. FIREBASE
    // ============================================================

    firebase.initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // ============================================================
    // 2. DOM
    // ============================================================

    const DOM = {
      messages: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      nameInput: document.getElementById('nameInput'),
      joinBtn: document.getElementById('joinBtn'),
      leaveBtn: document.getElementById('leaveBtn'),
      onlineCount: document.getElementById('onlineCount'),
      statusDot: document.getElementById('statusDot'),
    };

    // ============================================================
    // 3. STATE
    // ============================================================

    let user = null;
    let listeners = [];
    let connected = false;
    let statusTimeout = null;

    // ============================================================
    // 4. HELPERS
    // ============================================================

    const status = (text) => {
      let el = DOM.messages.querySelector('.status-msg');
      if (!el) {
        el = document.createElement('div');
        el.className = 'status-msg';
        DOM.messages.appendChild(el);
      }
      el.textContent = text;
    };

    const clearStatus = () => {
      const el = DOM.messages.querySelector('.status-msg');
      if (el) el.remove();
    };

    const scroll = () => {
      requestAnimationFrame(() => {
        DOM.messages.scrollTop = DOM.messages.scrollHeight;
      });
    };

    const time = (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    };

    const setOnline = (on) => {
      connected = on;
      DOM.statusDot.className = `dot ${on ? '' : 'off'}`;

      if (statusTimeout) {
        clearTimeout(statusTimeout);
        statusTimeout = null;
      }

      if (on) {
        status('✅ CONNECTED');
        statusTimeout = setTimeout(() => {
          const el = DOM.messages.querySelector('.status-msg');
          if (el && el.textContent === '✅ CONNECTED') clearStatus();
          statusTimeout = null;
        }, 1000);
      } else {
        status('🔄 RECONNECTING...');
      }
    };

    // ============================================================
    // 5. SEND
    // ============================================================

    const sendMessage = (text) => {
      if (!user) {
        alert('SIGN IN FIRST!');
        return;
      }
      if (!text || !text.trim()) return;
      if (!connected) {
        alert('WAITING FOR CONNECTION...');
        return;
      }

      db.ref('messages').push({
        name: user.name,
        uid: user.uid,
        text: text.trim(),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      }).catch(() => alert('FAILED TO SEND.'));

      DOM.messageInput.value = '';
      DOM.messageInput.focus();
    };

    // ============================================================
    // 6. RENDER
    // ============================================================

    const renderMessage = (data) => {
      const isOwn = user && data.uid === user.uid;
      const el = document.createElement('div');
      el.className = `msg ${isOwn ? 'own' : 'other'}`;
      el.dataset.key = data._key;

      el.innerHTML = `
        <div class="sender">
          ${data.name || 'ANON'}
          <span class="time">${time(data.timestamp)}</span>
        </div>
        <div class="text">${data.text || ''}</div>
      `;

      const st = DOM.messages.querySelector('.status-msg');
      if (st && (st.textContent === '✅ CONNECTED' || st.textContent === '🔄 CONNECTING...')) {
        clearStatus();
      }

      DOM.messages.appendChild(el);
      scroll();
    };

    // ============================================================
    // 7. SUBSCRIBE
    // ============================================================

    const subscribe = () => {
      // Clean up old listeners
      listeners.forEach(ref => ref.off());
      listeners = [];

      // Connection status
      const presence = db.ref('.info/connected');
      presence.on('value', (snapshot) => {
        const on = snapshot.val() === true;
        setOnline(on);

        if (on && user) {
          const users = db.ref('users');
          const ref = users.child(user.uid);
          ref.set({
            name: user.name,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          ref.onDisconnect().remove();
        }
      });
      listeners.push(presence);

      // Online users
      const usersRef = db.ref('users');
      usersRef.on('value', (snapshot) => {
        if (connected) {
          DOM.onlineCount.textContent = snapshot.exists() ? snapshot.numChildren() : '0';
        }
      });
      listeners.push(usersRef);

      // Messages
      const query = db.ref('messages').orderByKey().limitToLast(100);

      query.on('child_added', (snapshot) => {
        if (connected) {
          const data = snapshot.val();
          data._key = snapshot.key;
          renderMessage(data);
        }
      });

      query.on('child_removed', (snapshot) => {
        const el = DOM.messages.querySelector(`[data-key="${snapshot.key}"]`);
        if (el) el.remove();
      });

      listeners.push(query);

      // Initial check
      query.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          const st = DOM.messages.querySelector('.status-msg');
          if (!st || st.textContent === '🔄 CONNECTING...' || st.textContent === '✅ CONNECTED') {
            status('💬 NO MESSAGES YET');
          }
        }
      });
    };

    // ============================================================
    // 8. AUTH
    // ============================================================

    const login = () => {
      const raw = DOM.nameInput.value.trim() || 'GUEST';
      const name = raw.toUpperCase().slice(0, 20);

      user = {
        name: name,
        uid: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
      };

      DOM.nameInput.disabled = true;
      DOM.joinBtn.style.display = 'none';
      DOM.leaveBtn.style.display = 'inline-block';
      DOM.messageInput.disabled = false;
      DOM.sendBtn.disabled = false;
      DOM.messageInput.placeholder = `MSG AS ${name}...`;

      clearStatus();
      status(`👾 ${name} JOINED`);

      // Re-subscribe with user
      subscribe();

      // Force presence update
      if (connected) {
        const users = db.ref('users');
        const ref = users.child(user.uid);
        ref.set({
          name: user.name,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        ref.onDisconnect().remove();
      }

      DOM.onlineCount.textContent = '1';

      setTimeout(() => {
        const el = DOM.messages.querySelector('.status-msg');
        if (el && el.textContent === `👾 ${name} JOINED`) clearStatus();
      }, 1500);
    };

    const logout = () => {
      if (user) db.ref('users').child(user.uid).remove();

      // Clean up listeners
      listeners.forEach(ref => ref.off());
      listeners = [];
      user = null;

      DOM.nameInput.disabled = false;
      DOM.joinBtn.style.display = 'inline-block';
      DOM.leaveBtn.style.display = 'none';
      DOM.messageInput.disabled = true;
      DOM.sendBtn.disabled = true;
      DOM.messageInput.placeholder = 'TYPE...';
      DOM.messageInput.value = '';

      DOM.messages.innerHTML = '';
      status('👋 LEFT CHAT');
      DOM.onlineCount.textContent = '0';
      setOnline(connected);
    };

    // ============================================================
    // 9. EVENTS — Phone optimized
    // ============================================================

    DOM.joinBtn.addEventListener('click', login);
    DOM.leaveBtn.addEventListener('click', logout);

    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });

    DOM.sendBtn.addEventListener('click', () => {
      sendMessage(DOM.messageInput.value);
    });

    DOM.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(DOM.messageInput.value);
      }
    });

    // Touch feedback for buttons
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.95)';
      }, { passive: true });

      btn.addEventListener('touchend', function() {
        this.style.transform = '';
      }, { passive: true });
    });

    // Prevent zoom on double tap
    document.addEventListener('touchend', (e) => {
      if (e.target.closest('.btn') || e.target.closest('input')) {
        e.preventDefault();
      }
    }, { passive: false });

    // ============================================================
    // 10. INIT
    // ============================================================

    setOnline(false);
    subscribe();

    console.log('🕹️ PIXEL CHAT — PHONE FIRST');
    console.log('📡 Database:', firebase.app().options.databaseURL);
  </script>
