<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="ZACK — Chat Multimedia">
    <title>ZACK — Chat</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"ZACK","short_name":"ZACK","display":"standalone","theme_color":"%23000000","background_color":"%23000000"}'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --c-red: #ff0033;
            --c-cyan: #00f0ff;
            --c-bg: #000000;
            --c-white: #ffffff;
            --c-muted: #777777;
            --c-success: #00ff88;
            --c-danger: #ff0033;
            --grad-text: linear-gradient(135deg, #ff0033, #ff4455, #00f0ff);
            --grad-btn: linear-gradient(135deg, #ff0033, #00f0ff);
            --glow-cyan: 0 0 12px rgba(0,240,255,0.4);
            --border-red: rgba(255,0,51,0.2);
            --r-sm: 10px;
            --r-md: 14px;
            --r-full: 25px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--c-bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--c-white);
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,0,51,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,0,51,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0; pointer-events: none;
        }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: calc(10px + var(--safe-top)) 15px 10px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid var(--border-red);
            backdrop-filter: blur(15px);
        }
        .header-row { display: flex; justify-content: center; align-items: center; max-width: 600px; margin: 0 auto; }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900; letter-spacing: 4px;
            background: var(--grad-text);
            background-size: 300% 300%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoShift 4s ease infinite;
        }
        @keyframes logoShift { 50% { background-position: 100% 50%; } }

        /* Main */
        .main {
            position: relative; z-index: 2;
            padding: calc(60px + var(--safe-top)) 10px calc(15px + var(--safe-bottom));
            max-width: 600px; margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Chat */
        .chat-box {
            display: flex; flex-direction: column;
            flex: 1;
            border: 1px solid var(--border-red); border-radius: var(--r-md);
            background: rgba(255,0,51,0.04); overflow: hidden;
            min-height: 0;
        }

        .chat-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border-bottom: 1px solid var(--border-red);
            flex-shrink: 0;
        }
        .chat-head h3 { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--c-cyan); }
        .chat-head .online { font-size: 8px; }

        .recording-bar {
            display: none; text-align: center; padding: 4px;
            background: rgba(255,0,51,0.08); border-bottom: 1px solid var(--c-danger);
            font-size: 9px; color: var(--c-danger); font-family: 'Orbitron', sans-serif;
            flex-shrink: 0;
        }
        .recording-bar.active { display: block; }

        .chat-log {
            flex: 1; overflow-y: auto; padding: 10px;
            min-height: 0;
        }

        .date-separator {
            text-align: center; font-size: 8px; color: #444;
            margin: 10px 0; font-family: 'Orbitron', sans-serif;
        }

        .msg { margin-bottom: 10px; }
        .msg.own { text-align: right; }
        .msg-name { font-family: 'Orbitron', sans-serif; font-size: 8px; color: var(--c-cyan); margin-bottom: 3px; }
        .msg.own .msg-name { color: var(--c-success); }
        .msg-text {
            display: inline-block; font-size: 12px; color: #ccc;
            background: rgba(0,0,0,0.4); padding: 8px 10px; border-radius: 10px;
            word-break: break-word; max-width: 100%; text-align: left;
        }
        .msg.own .msg-text { background: rgba(0,255,136,0.08); }

        .msg-audio {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,0,51,0.08); border: 1px solid var(--c-red);
            border-radius: 20px; padding: 7px 12px; cursor: pointer;
        }
        .msg-audio .audio-icon { font-size: 14px; color: var(--c-cyan); }
        .msg-audio .audio-duration { font-size: 8px; color: #ccc; }

        .msg-image {
            max-width: 140px; border-radius: 8px; border: 1px solid var(--c-cyan);
            cursor: pointer; display: block;
        }
        .msg.own .msg-image { margin-left: auto; }

        .msg-delete-btn {
            background: none; border: none; color: #444; font-size: 10px;
            cursor: pointer; padding: 2px; margin-left: 5px;
        }
        .msg-delete-btn:active { color: var(--c-danger); }

        .chat-input-area {
            padding: 8px 10px; border-top: 1px solid var(--border-red);
            display: flex; gap: 5px; align-items: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1; padding: 10px 13px;
            background: rgba(0,0,0,0.6); border: 1px solid var(--border-red);
            color: var(--c-white); font-family: 'Rajdhani', sans-serif; font-size: 13px;
            border-radius: var(--r-full); outline: none; min-width: 0;
        }
        .chat-input:focus { border-color: var(--c-cyan); }
        .name-input { max-width: 70px; }

        .send-btn {
            padding: 10px 14px; background: var(--grad-btn); color: var(--c-white);
            font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px;
            border: none; border-radius: var(--r-full); font-weight: 700; cursor: pointer;
        }

        .attach-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,0,51,0.06); border: 1px solid var(--border-red);
            color: var(--c-cyan); font-size: 13px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .attach-btn.recording {
            background: var(--c-danger); color: var(--c-white);
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.6; } }

        /* Toast */
        .toast-wrap {
            position: fixed; top: calc(55px + var(--safe-top)); right: 12px; z-index: 300;
            display: flex; flex-direction: column; gap: 6px; max-width: 260px;
        }
        .toast {
            padding: 10px 16px; border-radius: 10px; font-size: 11px; border: 1px solid;
            animation: toastIn 0.3s var(--ease), toastOut 0.3s var(--ease) 3s forwards;
        }
        .toast-success { background: rgba(0,255,136,0.12); border-color: var(--c-success); color: var(--c-success); }
        .toast-error { background: rgba(255,0,51,0.12); border-color: var(--c-danger); color: var(--c-danger); }
        .toast-info { background: rgba(0,240,255,0.12); border-color: var(--c-cyan); color: var(--c-cyan); }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } }
        @keyframes toastOut { to { transform: translateX(100%); opacity: 0; } }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.95); display: none;
            justify-content: center; align-items: center;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 92%; max-height: 85%; border: 2px solid var(--c-cyan); border-radius: 10px; }
        .lightbox-close {
            position: absolute; top: 18px; right: 18px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.8); border: 2px solid var(--c-red);
            color: var(--c-red); font-size: 20px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        #chatImageInput { display: none; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="toast-wrap" id="toastWrap"></div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">✕</button>
        <img id="lightboxImg" src="" alt="Gambar" onclick="event.stopPropagation()">
    </div>

    <div class="header">
        <div class="header-row">
            <div class="logo">ZACK</div>
        </div>
    </div>

    <div class="main">
        <div class="chat-box">
            <div class="chat-head">
                <h3>💬 CHAT</h3>
                <span class="online" id="onlineStatus">● OFFLINE</span>
            </div>
            <div class="recording-bar" id="recBar">🔴 MERAKAM...</div>
            <div class="chat-log" id="chatLog"></div>
            <div class="chat-input-area">
                <input type="text" id="chatName" class="chat-input name-input" placeholder="NAMA">
                <input type="text" id="chatInput" class="chat-input" placeholder="Tulis...">
                <button class="attach-btn" id="imgBtn" aria-label="Hantar gambar">📷</button>
                <button class="attach-btn" id="recordBtn" aria-label="Rakam audio">🎤</button>
                <button class="send-btn" id="sendBtn">HANTAR</button>
            </div>
            <input type="file" id="chatImageInput" accept="image/*">
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        'use strict';

        /* ============ CONFIG ============ */
        const CONFIG = {
            databaseURL: 'https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/',
            maxImageSize: 2 * 1024 * 1024,
            maxAudioDuration: 30
        };

        /* ============ STATE ============ */
        const state = {
            isRecording: false,
            recordStart: 0,
            recorder: null,
            audioChunks: []
        };

        /* ============ DOM ============ */
        const $ = id => document.getElementById(id);

        const DOM = {
            toastWrap: $('toastWrap'),
            lightbox: $('lightbox'),
            lightboxImg: $('lightboxImg'),
            chatLog: $('chatLog'),
            chatName: $('chatName'),
            chatInput: $('chatInput'),
            onlineStatus: $('onlineStatus'),
            recordBtn: $('recordBtn'),
            recBar: $('recBar')
        };

        /* ============ FIREBASE ============ */
        const db = firebase.initializeApp({ databaseURL: CONFIG.databaseURL }).database();

        /* ============ HELPERS ============ */
        function toast(msg, type = 'info') {
            while (DOM.toastWrap.children.length >= 3) DOM.toastWrap.firstChild.remove();
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            DOM.toastWrap.appendChild(el);
            setTimeout(() => el.remove(), 3300);
        }

        function sanitizeText(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.textContent;
        }

        function getTime() {
            return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
        }

        function getName() {
            return DOM.chatName.value.trim() || 'Anonymous';
        }

        function getDateSeparator(timestamp) {
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            const msgDate = new Date(timestamp).toDateString();
            if (msgDate === today) return 'HARI INI';
            if (msgDate === yesterday) return 'SEMALAM';
            return new Date(timestamp).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long' });
        }

        /* ============ CHAT ============ */
        db.ref('chat').limitToLast(50).on('value', snap => {
            const myName = getName();
            const wasAtBottom = DOM.chatLog.scrollHeight - DOM.chatLog.scrollTop - DOM.chatLog.clientHeight < 50;
            DOM.chatLog.innerHTML = '';
            const fragment = document.createDocumentFragment();
            let lastDate = '';

            if (snap.exists()) {
                snap.forEach(child => {
                    const data = child.val();
                    const dateSep = getDateSeparator(data.timestamp || Date.now());
                    if (dateSep !== lastDate) {
                        lastDate = dateSep;
                        const sep = document.createElement('div');
                        sep.className = 'date-separator';
                        sep.textContent = `— ${dateSep} —`;
                        fragment.appendChild(sep);
                    }

                    const div = document.createElement('div');
                    div.className = 'msg' + (data.name === myName ? ' own' : '');

                    const nameEl = document.createElement('div');
                    nameEl.className = 'msg-name';
                    nameEl.textContent = `${sanitizeText(data.name)} • ${sanitizeText(data.time || '')}`;
                    div.appendChild(nameEl);

                    if (data.type === 'text') {
                        const textEl = document.createElement('div');
                        textEl.className = 'msg-text';
                        textEl.textContent = sanitizeText(data.text);
                        div.appendChild(textEl);
                    } else if (data.type === 'image') {
                        const img = document.createElement('img');
                        img.className = 'msg-image';
                        img.src = data.data;
                        img.alt = 'Gambar';
                        img.addEventListener('click', () => openLightbox(data.data));
                        div.appendChild(img);
                    } else if (data.type === 'audio') {
                        const audioEl = document.createElement('div');
                        audioEl.className = 'msg-audio';
                        audioEl.innerHTML = `<span class="audio-icon">▶</span><span class="audio-duration">${data.duration || 0}s</span>`;
                        audioEl.addEventListener('click', () => {
                            const audio = new Audio(data.data);
                            audio.play().catch(() => toast('Tidak dapat main audio!', 'error'));
                        });
                        div.appendChild(audioEl);
                    }

                    if (data.name === myName) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'msg-delete-btn';
                        delBtn.textContent = '✕';
                        delBtn.addEventListener('click', () => {
                            if (confirm('Padam mesej ini?')) db.ref('chat/' + child.key).remove();
                        });
                        div.appendChild(delBtn);
                    }

                    fragment.appendChild(div);
                });
            }

            DOM.chatLog.appendChild(fragment);
            if (wasAtBottom) DOM.chatLog.scrollTop = DOM.chatLog.scrollHeight;
        });

        function sendMessage(type, data) {
            db.ref('chat').push({
                type, name: getName(), timestamp: Date.now(),
                ...data, time: getTime()
            }).catch(() => toast('Gagal hantar!', 'error'));
        }

        function sendText() {
            const text = DOM.chatInput.value.trim();
            if (!text) return;
            sendMessage('text', { text });
            DOM.chatInput.value = '';
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > CONFIG.maxImageSize) { toast('Saiz terlalu besar!', 'error'); return; }
            const reader = new FileReader();
            reader.onload = ev => { sendMessage('image', { data: ev.target.result }); toast('Gambar dihantar!', 'success'); };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        async function startRecord() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.recorder = new MediaRecorder(stream);
                state.audioChunks = [];
                state.recorder.ondataavailable = e => state.audioChunks.push(e.data);
                state.recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = ev => {
                        sendMessage('audio', { data: ev.target.result, duration: Math.round((Date.now() - state.recordStart) / 1000) });
                        toast('Audio dihantar!', 'success');
                    };
                    reader.readAsDataURL(blob);
                };
                state.recorder.start();
                state.isRecording = true;
                state.recordStart = Date.now();
                DOM.recordBtn.classList.add('recording');
                DOM.recBar.classList.add('active');
                setTimeout(() => { if (state.isRecording) stopRecord(); }, CONFIG.maxAudioDuration * 1000);
            } catch(e) { toast('Tidak dapat akses mikrofon!', 'error'); }
        }

        function stopRecord() {
            state.isRecording = false;
            DOM.recordBtn.classList.remove('recording');
            DOM.recBar.classList.remove('active');
            if (state.recorder) state.recorder.stop();
        }

        /* ============ ONLINE ============ */
        db.ref('.info/connected').on('value', snap => {
            DOM.onlineStatus.textContent = snap.val() ? '● ONLINE' : '● OFFLINE';
            DOM.onlineStatus.style.color = snap.val() ? 'var(--c-success)' : '#555';
        });

        /* ============ LIGHTBOX ============ */
        function openLightbox(src) { DOM.lightboxImg.src = src; DOM.lightbox.classList.add('active'); }
        function closeLightbox() { DOM.lightbox.classList.remove('active'); }

        /* ============ EVENTS ============ */
        function initEvents() {
            $('sendBtn').addEventListener('click', sendText);
            DOM.chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendText(); });
            $('imgBtn').addEventListener('click', () => $('chatImageInput').click());
            $('chatImageInput').addEventListener('change', sendImage);
            DOM.recordBtn.addEventListener('click', () => state.isRecording ? stopRecord() : startRecord());
        }

        /* ============ SERVICE WORKER ============ */
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }))).catch(() => {});
        }

        /* ============ INIT ============ */
        initEvents();
    </script>

</body>
</html>
