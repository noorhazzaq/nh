<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@zack360 — 8Bit Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* ---------- Asas ---------- */
        :root {
            --bg-dark: #1a1a1a;
            --bg-panel: #2a2a2a;
            --green: #00ff00;
            --green-dim: #008800;
            --magenta: #ff00ff;
            --magenta-dark: #cc00cc;
            --yellow: #ffff00;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--green);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            image-rendering: pixelated;
        }

        /* ---------- Bekas Utama ---------- */
        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: var(--bg-panel);
            border: 4px solid var(--green);
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0 var(--black);
        }

        h1 {
            font-size: 16px;
            text-align: center;
            color: var(--magenta);
            text-shadow: 2px 2px var(--black);
            margin-bottom: 15px;
        }

        /* ---------- Kotak Sembang ---------- */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            border: 2px solid var(--green);
            background-color: var(--black);
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            font-size: 10px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message .user {
            color: var(--magenta);
        }

        .message .text {
            color: var(--green);
        }

        .message .img-container {
            margin-top: 5px;
            max-width: 100%;
        }

        .message img {
            max-width: 100%;
            border: 2px solid var(--green);
            image-rendering: pixelated;
        }

        /* ---------- Kawalan Input ---------- */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 5px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            background-color: var(--black);
            border: 2px solid var(--green);
            color: var(--green);
            font-size: 10px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--green-dim);
        }

        button {
            padding: 10px 15px;
            background-color: var(--magenta);
            color: var(--black);
            border: 2px solid var(--green);
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--magenta-dark);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---------- Muat Naik Imej ---------- */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-btn {
            padding: 10px 15px;
            background-color: var(--green);
            color: var(--black);
            border: 2px solid var(--magenta);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        /* ---------- Status ---------- */
        #status {
            font-size: 8px;
            color: var(--yellow);
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>@ZACK360 8BIT CHAT</h1>

        <div id="chat-box"></div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" id="username" placeholder="Nama Anda" maxlength="15">
                <button id="set-name-btn">SET</button>
            </div>
            <div class="input-row">
                <input type="text" id="message-input" placeholder="Taip mesej..." maxlength="200">
                <button id="send-btn">HANTAR</button>
            </div>
            <div class="input-row">
                <label class="file-input-wrapper">
                    <span class="file-btn">MUAT NAIK IMEJ</span>
                    <input type="file" id="image-input" accept="image/*">
                </label>
            </div>
        </div>

        <div id="status">Menyambung...</div>
    </div>

    <script type="module">
        /* ============================================================
           KONFIGURASI FIREBASE — GANTIKAN DENGAN MAKLUMAT ANDA
           ============================================================ */
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "zack360-2b303.firebaseapp.com",
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "zack360-2b303",
            storageBucket: "zack360-2b303.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ============================================================
           INISIALISASI
           ============================================================ */
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const usernameInput = document.getElementById('username');
        const setNameBtn = document.getElementById('set-name-btn');
        const imageInput = document.getElementById('image-input');
        const statusDiv = document.getElementById('status');

        let currentUser = localStorage.getItem('zack360_user') || '';

        /* ============================================================
           PENGURUSAN NAMA PENGGUNA
           ============================================================ */
        function setUserName(name) {
            if (!name) return;
            localStorage.setItem('zack360_user', name);
            currentUser = name;
            usernameInput.value = name;
            usernameInput.disabled = true;
            setNameBtn.disabled = true;
            statusDiv.textContent = `Log masuk sebagai ${name}`;
        }

        if (currentUser) {
            setUserName(currentUser);
        }

        setNameBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) setUserName(name);
        });

        /* ============================================================
           FUNGSI BANTU: PAPAR MESEJ
           ============================================================ */
        function renderMessage(data) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            const userSpan = document.createElement('span');
            userSpan.className = 'user';
            userSpan.textContent = `${data.user}: `;

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = data.text || '';

            msgDiv.appendChild(userSpan);
            msgDiv.appendChild(textSpan);

            if (data.imageUrl) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'img-container';
                const img = document.createElement('img');
                img.src = data.imageUrl;
                img.loading = 'lazy';
                imgContainer.appendChild(img);
                msgDiv.appendChild(imgContainer);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* ============================================================
           SEMBANG TEKS
           ============================================================ */
        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (!currentUser) {
                alert('Sila tetapkan nama anda dahulu.');
                return;
            }
            if (!text) return;

            push(ref(db, 'chats'), {
                user: currentUser,
                text: text,
                timestamp: serverTimestamp()
            });
            msgInput.value = '';
        });

        /* ============================================================
           PEMAMPATAN IMEJ (Canvas)
           ============================================================ */
        function compressImage(file, maxDimension = 600, quality = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;

                    img.onload = () => {
                        let { width, height } = img;

                        if (width > height && width > maxDimension) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else if (height > maxDimension) {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };

                    img.onerror = reject;
                };

                reader.onerror = reject;
            });
        }

        /* ============================================================
           SEMBANG IMEJ (Base64 → Realtime Database)
           ============================================================ */
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!currentUser) {
                alert('Sila tetapkan nama anda dahulu.');
                imageInput.value = '';
                return;
            }

            statusDiv.textContent = 'Memproses imej...';

            try {
                const base64Image = await compressImage(file);
                statusDiv.textContent = 'Menghantar ke pangkalan data...';

                push(ref(db, 'chats'), {
                    user: currentUser,
                    text: ' [Imej]',
                    imageUrl: base64Image,
                    timestamp: serverTimestamp()
                });

                statusDiv.textContent = 'Imej berjaya dihantar.';
            } catch (error) {
                console.error('Gagal memproses imej:', error);
                statusDiv.textContent = 'Gagal memproses imej.';
            }

            imageInput.value = '';
        });

        /* ============================================================
           DENGAR SEMBANG BAHARU
           ============================================================ */
        const chatsRef = ref(db, 'chats');
        onChildAdded(chatsRef, (snapshot) => {
            renderMessage(snapshot.val());
        });

        statusDiv.textContent = 'Bersambung ke Firebase...';
    </script>
</body>
</html>
