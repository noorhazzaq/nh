<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON BLOG - Admin Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

        :root {
            --neon-blue: #00f0ff;
            --neon-cyan: #00ffff;
            --neon-orange: #ff6b00;
            --dark-bg: #000000;
            --glass: rgba(0, 255, 255, 0.05);
            --border-glow: rgba(0, 240, 255, 0.3);
            --accent: #00f0ff;
            --text: #ffffff;
            --text-muted: #999999;
            --danger: #ff0033;
            --success: #00ff00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            background: var(--dark-bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== GRID BACKGROUND ===== */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* ===== SCANLINE ===== */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 1;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid var(--border-glow);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent), 0 0 30px var(--accent);
            text-decoration: none;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .admin-btn {
            padding: 8px 15px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .admin-btn:hover {
            background: var(--accent);
            color: #000000;
            box-shadow: 0 0 20px var(--accent);
        }

        .hamburger {
            width: 40px;
            height: 40px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-glow);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 101;
        }

        .hamburger span {
            width: 20px;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: all 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== MOBILE MENU ===== */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 75%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.98);
            z-index: 99;
            transition: right 0.4s ease;
            padding: 80px 20px 20px;
            border-left: 1px solid var(--border-glow);
            box-shadow: -10px 0 40px rgba(0, 240, 255, 0.2);
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu a {
            display: block;
            padding: 18px 15px;
            color: #cccccc;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .mobile-menu a:hover,
        .mobile-menu a:active {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
            padding-left: 25px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 98;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            position: relative;
            z-index: 2;
            padding-top: 70px;
            min-height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 50px 0 40px;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--accent), 0 0 60px var(--accent);
            margin-bottom: 15px;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px var(--accent), 0 0 60px var(--accent); }
            50% { text-shadow: 0 0 40px var(--accent), 0 0 100px var(--accent); }
        }

        .hero .subtitle {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--accent);
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            max-width: 500px;
            margin: 0 auto 30px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .search-bar button {
            padding: 12px 25px;
            background: var(--accent);
            color: #000000;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px var(--accent);
        }

        .search-bar button:hover {
            background: #ffffff;
            box-shadow: 0 0 40px var(--accent);
        }

        /* ===== BLOG GRID ===== */
        .blog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-bottom: 50px;
        }

        .blog-card {
            border: 1px solid var(--border-glow);
            background: var(--glass);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .blog-card:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .blog-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.05));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent);
            position: relative;
            overflow: hidden;
        }

        .blog-card-content {
            padding: 20px;
        }

        .blog-card-tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .blog-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .blog-card-excerpt {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .blog-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666666;
            letter-spacing: 1px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            border: 1px dashed var(--border-glow);
            color: #666666;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            grid-column: 1 / -1;
        }

        .empty-state .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent);
        }

        /* ===== ARTICLE VIEW ===== */
        .article-view {
            display: none;
            margin-bottom: 50px;
        }

        .article-view.active {
            display: block;
        }

        .article-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .article-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--accent);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .article-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.05));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent);
            margin-bottom: 30px;
            border: 1px solid var(--border-glow);
        }

        .article-content {
            font-size: 15px;
            line-height: 1.9;
            color: #cccccc;
        }

        .article-content p {
            margin-bottom: 20px;
        }

        .back-to-blog {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .back-to-blog:hover {
            background: var(--accent);
            color: #000000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            display: none;
            margin-bottom: 50px;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-login {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid var(--border-glow);
            padding: 30px;
            background: var(--glass);
            text-align: center;
        }

        .admin-login h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .admin-login input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .admin-login input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .admin-dashboard {
            display: none;
        }

        .admin-dashboard.active {
            display: block;
        }

        .admin-dashboard h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
        }

        .admin-form {
            border: 1px solid var(--border-glow);
            padding: 25px;
            background: var(--glass);
            margin-bottom: 30px;
        }

        .admin-form h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .admin-form input,
        .admin-form textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .admin-form input:focus,
        .admin-form textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .admin-form textarea {
            height: 150px;
            resize: vertical;
        }

        .admin-btn-primary {
            padding: 12px 25px;
            background: var(--accent);
            color: #000000;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent);
            transition: all 0.3s;
        }

        .admin-btn-primary:hover {
            background: #ffffff;
            box-shadow: 0 0 30px var(--accent);
        }

        .admin-btn-danger {
            padding: 8px 15px;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .admin-btn-danger:hover {
            background: var(--danger);
            color: #ffffff;
        }

        .admin-post-item {
            border: 1px solid var(--border-glow);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
        }

        .admin-post-info h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .admin-post-info p {
            font-size: 11px;
            color: #666666;
        }

        .admin-post-actions {
            display: flex;
            gap: 8px;
        }

        /* ===== FOOTER ===== */
        footer {
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid var(--border-glow);
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.7);
        }

        footer p {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: #666666;
        }

        footer .footer-glow {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        /* ===== BACK TO TOP ===== */
        .back-to-top {
            position: fixed;
            bottom: 25px;
            right: 20px;
            z-index: 90;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .hero h1 {
                font-size: 48px;
                letter-spacing: 10px;
            }
            
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .article-header h1 {
                font-size: 36px;
            }
            
            .article-image {
                height: 350px;
                font-size: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND EFFECTS -->
    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <!-- HEADER -->
    <header>
        <a class="logo" onclick="showHome()">TRON BLOG</a>
        <div class="header-actions">
            <a class="admin-btn" onclick="showAdminPanel()">ADMIN</a>
            <div class="hamburger" id="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">
        <a onclick="showHome(); closeMenu();">🏠 UTAMA</a>
        <a onclick="showAdminPanel(); closeMenu();">🔐 ADMIN</a>
        <a onclick="closeMenu();">📖 BACA ARTIKEL</a>
        <a onclick="closeMenu();">ℹ️ TENTANG</a>
    </div>

    <!-- MAIN CONTENT -->
    <main>

        <!-- HERO -->
        <div class="hero" id="heroSection">
            <h1>TRON BLOG</h1>
            <p class="subtitle">DIGITAL CHRONICLES</p>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-bar" id="searchSection">
            <input type="text" id="searchInput" placeholder="CARI ARTIKEL..." onkeyup="searchPosts(this.value)">
            <button onclick="searchPosts(document.getElementById('searchInput').value)">CARI</button>
        </div>

        <!-- BLOG GRID -->
        <div class="blog-grid" id="blogGrid">
            <!-- Blog cards akan dipaparkan di sini -->
        </div>

        <!-- ARTICLE VIEW -->
        <div class="article-view" id="articleView">
            <button class="back-to-blog" onclick="showHome()">← KEMBALI KE BLOG</button>
            <div class="article-header">
                <h1 id="articleTitle"></h1>
            </div>
            <div class="article-image" id="articleImage"></div>
            <div class="article-content" id="articleContent"></div>
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <!-- LOGIN -->
            <div class="admin-login" id="adminLogin">
                <h2>🔐 LOGIN ADMIN</h2>
                <input type="password" id="adminPassword" placeholder="KATA LALUAN" onkeypress="if(event.key === 'Enter') adminLogin()">
                <button class="admin-btn-primary" onclick="adminLogin()">LOGIN</button>
            </div>

            <!-- DASHBOARD -->
            <div class="admin-dashboard" id="adminDashboard">
                <h2>📝 PENGURUSAN ARTIKEL</h2>
                
                <!-- FORM -->
                <div class="admin-form" id="adminForm">
                    <h3 id="formTitle">➕ TAMBAH ARTIKEL BARU</h3>
                    <input type="hidden" id="postId">
                    <input type="text" id="postTitle" placeholder="TAJUK ARTIKEL">
                    <input type="text" id="postCategory" placeholder="KATEGORI (TECH / SCI-FI / GAMING / AI)">
                    <input type="text" id="postIcon" placeholder="IKON (EMOJI) — Contoh: 💻">
                    <input type="text" id="postAuthor" placeholder="NAMA PENULIS">
                    <textarea id="postExcerpt" placeholder="RINGKASAN ARTIKEL"></textarea>
                    <textarea id="postContent" placeholder="KANDUNGAN ARTIKEL (HTML)"></textarea>
                    <button class="admin-btn-primary" onclick="savePost()">💾 SIMPAN ARTIKEL</button>
                    <button class="admin-btn-danger" onclick="resetForm()" style="margin-left: 10px;">BATAL</button>
                </div>

                <!-- POST LIST -->
                <div id="adminPostList"></div>

                <button class="admin-btn-danger" onclick="adminLogout()" style="margin-top: 20px;">🚪 LOGOUT</button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 <span class="footer-glow">TRON BLOG</span> — DIGITAL CHRONICLES</p>
    </footer>

    <!-- BACK TO TOP -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ===== ADMIN PASSWORD =====
        const ADMIN_PASSWORD = "admin123"; // Tukar kata laluan ini

        let isAdminLoggedIn = false;
        let blogPosts = [];
        let currentArticle = null;

        // ===== LOAD POSTS FROM FIREBASE =====
        function loadPosts() {
            database.ref('posts').on('value', (snapshot) => {
                blogPosts = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        blogPosts.push({
                            id: childSnapshot.key,
                            ...childSnapshot.val()
                        });
                    });
                }
                renderBlog(blogPosts);
                renderAdminPostList();
            });
        }

        // ===== RENDER BLOG =====
        function renderBlog(posts) {
            const blogGrid = document.getElementById('blogGrid');
            blogGrid.innerHTML = '';

            if (posts.length === 0) {
                blogGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        TIADA ARTIKEL<br>
                        <span style="font-size: 11px; color: #444444; letter-spacing: 1px;">TAMBAH ARTIKEL MELALUI PANEL ADMIN</span>
                    </div>
                `;
                return;
            }

            posts.forEach((post) => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.onclick = () => openArticle(post.id);
                card.innerHTML = `
                    <div class="blog-card-image">${post.icon || '📄'}</div>
                    <div class="blog-card-content">
                        <span class="blog-card-tag">${post.category || 'UMUM'}</span>
                        <h2>${post.title}</h2>
                        <p class="blog-card-excerpt">${post.excerpt || ''}</p>
                        <div class="blog-card-meta">
                            <span>${post.author || 'Tanpa Nama'}</span>
                            <span>${post.date || ''}</span>
                        </div>
                    </div>
                `;
                blogGrid.appendChild(card);
            });
        }

        // ===== SEARCH =====
        function searchPosts(query) {
            const filtered = blogPosts.filter(post => {
                const searchText = (post.title + ' ' + post.excerpt + ' ' + post.category).toLowerCase();
                return searchText.includes(query.toLowerCase());
            });
            renderBlog(filtered);
        }

        // ===== OPEN ARTICLE =====
        function openArticle(id) {
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;

            currentArticle = id;

            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('blogGrid').style.display = 'none';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('articleView').classList.add('active');

            document.getElementById('articleTitle').textContent = post.title;
            document.getElementById('articleImage').textContent = post.icon || '📄';
            document.getElementById('articleContent').innerHTML = post.content || '<p>Tiada kandungan.</p>';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== SHOW HOME =====
        function showHome() {
            document.getElementById('heroSection').style.display = 'block';
            document.getElementById('searchSection').style.display = 'flex';
            document.getElementById('blogGrid').style.display = 'grid';
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.remove('active');
            renderBlog(blogPosts);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== SHOW ADMIN PANEL =====
        function showAdminPanel() {
            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('blogGrid').style.display = 'none';
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('adminPanel').classList.add('active');

            if (isAdminLoggedIn) {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').classList.add('active');
            } else {
                document.getElementById('adminLogin').style.display = 'block';
                document.getElementById('adminDashboard').classList.remove('active');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== ADMIN LOGIN =====
        function adminLogin() {
            const password = document.getElementById('adminPassword').value;

            if (password === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').classList.add('active');
                document.getElementById('adminPassword').value = '';
                renderAdminPostList();
            } else {
                alert('❌ KATA LALUAN SALAH!');
            }
        }

        // ===== ADMIN LOGOUT =====
        function adminLogout() {
            isAdminLoggedIn = false;
            document.getElementById('adminLogin').style.display = 'block';
            document.getElementById('adminDashboard').classList.remove('active');
            resetForm();
        }

        // ===== RENDER ADMIN POST LIST =====
        function renderAdminPostList() {
            const list = document.getElementById('adminPostList');
            list.innerHTML = '';

            if (blogPosts.length === 0) {
                list.innerHTML = '<p style="color: #444444; text-align: center; padding: 20px;">Tiada artikel.</p>';
                return;
            }

            blogPosts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'admin-post-item';
                item.innerHTML = `
                    <div class="admin-post-info">
                        <h4>${post.title}</h4>
                        <p>${post.category || 'UMUM'} • ${post.date || ''}</p>
                    </div>
                    <div class="admin-post-actions">
                        <button class="admin-btn-primary" onclick="editPost('${post.id}')">EDIT</button>
                        <button class="admin-btn-danger" onclick="deletePost('${post.id}')">PADAM</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // ===== SAVE POST =====
        function savePost() {
            const id = document.getElementById('postId').value;
            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value.trim();
            const icon = document.getElementById('postIcon').value.trim();
            const author = document.getElementById('postAuthor').value.trim();
            const excerpt = document.getElementById('postExcerpt').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !category || !author) {
                alert('⚠️ Sila isi sekurang-kurangnya Tajuk, Kategori, dan Penulis.');
                return;
            }

            const postData = {
                title: title,
                category: category,
                icon: icon || '📄',
                author: author,
                excerpt: excerpt,
                content: content,
                date: new Date().toISOString().split('T')[0]
            };

            if (id) {
                // Update
                database.ref('posts/' + id).update(postData)
                    .then(() => {
                        alert('✅ Artikel berjaya dikemaskini!');
                        resetForm();
                    })
                    .catch((error) => {
                        alert('❌ Gagal: ' + error.message);
                    });
            } else {
                // Create
                database.ref('posts').push(postData)
                    .then(() => {
                        alert('✅ Artikel berjaya disimpan!');
                        resetForm();
                    })
                    .catch((error) => {
                        alert('❌ Gagal: ' + error.message);
                    });
            }
        }

        // ===== EDIT POST =====
        function editPost(id) {
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('postId').value = post.id;
            document.getElementById('postTitle').value = post.title || '';
            document.getElementById('postCategory').value = post.category || '';
            document.getElementById('postIcon').value = post.icon || '';
            document.getElementById('postAuthor').value = post.author || '';
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('postContent').value = post.content || '';
            document.getElementById('formTitle').textContent = '✏️ EDIT ARTIKEL';
        }

        // ===== DELETE POST =====
        function deletePost(id) {
            if (confirm('⚠️ Adakah anda pasti ingin memadam artikel ini?')) {
                database.ref('posts/' + id).remove()
                    .then(() => {
                        alert('✅ Artikel berjaya dipadam!');
                    })
                    .catch((error) => {
                        alert('❌ Gagal: ' + error.message);
                    });
            }
        }

        // ===== RESET FORM =====
        function resetForm() {
            document.getElementById('postId').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postCategory').value = '';
            document.getElementById('postIcon').value = '';
            document.getElementById('postAuthor').value = '';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('formTitle').textContent = '➕ TAMBAH ARTIKEL BARU';
        }

        // ===== MOBILE MENU =====
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('hamburger').classList.toggle('active');
        }

        function closeMenu() {
            document.getElementById('mobileMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('hamburger').classList.remove('active');
        }

        // ===== BACK TO TOP =====
        window.addEventListener('scroll', function() {
            const backToTop = document.getElementById('backToTop');
            if (window.scrollY > 300) {
                backToTop.style.display = 'flex';
            } else {
                backToTop.style.display = 'none';
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== INITIAL LOAD =====
        loadPosts();

        // ===== PREVENT ZOOM ON DOUBLE TAP =====
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>

</body>
</html>
