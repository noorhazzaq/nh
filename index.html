<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pixel Chat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      touch-action: manipulation;
    }
    .px-box {
      background: #1e1b4b;
      border: 3px solid #4338ca;
      box-shadow: inset -3px -3px 0 #0f172a, inset 3px 3px 0 #6366f1;
    }
    .px-btn {
      background: #16a34a;
      border: 2px solid #22c55e;
      box-shadow: inset -2px -2px 0 #15803d, inset 2px 2px 0 #4ade80;
    }
    .px-btn:active {
      box-shadow: inset 2px 2px 0 #15803d;
      transform: translateY(1px);
    }
    #v::-webkit-scrollbar { width: 6px; }
    #v::-webkit-scrollbar-track { background: #020617; }
    #v::-webkit-scrollbar-thumb { background: #4338ca; }
  </style>
</head>
<body class="h-full text-white flex flex-col justify-between p-2 bg-slate-950 select-none">

  <!-- HEADER WITH NICKNAME CHANGE -->
  <header class="px-box p-2 mb-2 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-1.5 flex-1 mr-2">
      <span class="text-[9px] text-yellow-300 shrink-0">⛏️</span>
      <input 
        type="text" 
        id="nameInput" 
        maxlength="15" 
        value="Steve" 
        title="Click to edit handle"
        class="bg-slate-900 border-2 border-indigo-700 text-green-400 text-[9px] px-1 py-0.5 w-28 focus:outline-none focus:border-yellow-400 font-bold"
      />
    </div>
    <div class="text-[7px] text-emerald-400 border border-emerald-500/30 bg-emerald-950/50 px-1.5 py-1 uppercase shrink-0">
      ● LIVE
    </div>
  </header>

  <!-- CHAT VIEWPORT -->
  <main id="v" class="flex-1 bg-black border-2 border-indigo-900 p-2 overflow-y-auto space-y-2 mb-2">
    <div id="c" class="space-y-2">
      <div class="text-[8px] text-yellow-400 bg-yellow-950/30 p-1.5 border border-yellow-800">
        [SYS]: Type a custom handle at top-left to rename!
      </div>
    </div>
  </main>

  <!-- INPUT FORM -->
  <footer class="shrink-0">
    <form id="f" class="flex gap-1.5">
      <input 
        type="text" 
        id="i" 
        placeholder="TYPE..." 
        required 
        maxlength="200" 
        class="flex-1 bg-slate-900 border-2 border-indigo-800 text-yellow-300 text-[9px] p-2 focus:outline-none focus:border-yellow-400 placeholder-indigo-600"
        autocomplete="off"
      />
      <button type="submit" class="px-btn text-[9px] text-white px-3 py-2 font-bold uppercase shrink-0">
        SEND
      </button>
    </form>
  </footer>

  <!-- LIGHTWEIGHT REALTIME MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Initialize Database Connection
    const db = getDatabase(initializeApp({
      databaseURL: "https://zack360-2b303-default-rtdb.asia-southeast1.firebasedatabase.app/"
    }));

    // Generate Initial User Handle
    const nameInput = document.getElementById('nameInput');
    nameInput.value = `Steve_${Math.floor(100 + Math.random() * 900)}`;

    const c = document.getElementById('c');
    const v = document.getElementById('v');
    const i = document.getElementById('i');
    const chatRef = ref(db, "global_pixel_chat");

    // Realtime Incoming Message Stream
    onChildAdded(query(chatRef, limitToLast(40)), (snap) => {
      const d = snap.val();
      if (d && d.s && d.t) {
        const isSelf = d.s === nameInput.value.trim();
        const div = document.createElement('div');
        div.className = 'text-[8px] leading-relaxed break-words';
        div.innerHTML = `<span class="${isSelf ? 'text-green-400' : 'text-cyan-400'}">${esc(d.s)}:</span> <span class="text-white">${esc(d.t)}</span>`;
        c.appendChild(div);
        v.scrollTop = v.scrollHeight;
      }
    });

    // Send Form Event
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const txt = i.value.trim();
      const handle = nameInput.value.trim() || 'Steve';
      if (!txt) return;

      i.value = '';
      await set(push(chatRef), { s: handle, t: txt, ts: Date.now() });
    });

    function esc(s) {
      return s.replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[m]));
    }
  </script>
</body>
</html>
