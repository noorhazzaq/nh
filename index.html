<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Global Mesh Chat" />
  <title>Global Enterprise Mesh Chat</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- PeerJS for Global WebRTC Mesh Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Dynamically Injected Manifest -->
  <link id="manifestLink" rel="manifest" />

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="h-full text-gray-100 font-sans flex flex-col overflow-hidden antialiased select-none">

  <!-- TOP APP BAR -->
  <header class="h-14 bg-gray-900 border-b border-gray-800 px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-globe text-base"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-xs font-bold tracking-tight text-white uppercase">Global Mesh Network</h1>
          <span id="cryptoStatusBadge" class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[9px] font-mono px-1.5 py-0.5 rounded">E2EE AES-256</span>
        </div>
        <div class="flex items-center space-x-2 mt-0.5">
          <span id="netStatusBadge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1">
            <span id="netStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="netStatusText">Online</span>
          </span>
          <span id="peerIdDisplay" class="text-[10px] font-mono text-indigo-300">Global ID: Connecting...</span>
        </div>
      </div>
    </div>

    <!-- GLOBAL PEER CONNECT & SHARE CONTROLS -->
    <div class="flex items-center space-x-2">
      <button onclick="Application.ui.promptConnectPeer()" class="bg-gray-800 hover:bg-gray-700 text-indigo-400 border border-indigo-500/30 px-2.5 py-1.5 rounded-lg text-xs transition flex items-center space-x-1">
        <i class="fa-solid fa-plug text-[10px]"></i>
        <span class="hidden sm:inline">Connect Peer</span>
      </button>
      <button onclick="Application.ui.shareApp()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 p-2 rounded-lg text-xs transition">
        <i class="fa-solid fa-share-nodes"></i>
      </button>
      <button id="pwaInstallBtn" onclick="Application.pwa.promptInstall()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white border border-indigo-400/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-download text-[10px]"></i>
        <span>Install</span>
      </button>
    </div>
  </header>

  <!-- CHAT MESSAGES VIEWPORT -->
  <main class="flex-1 flex flex-col bg-gray-950 overflow-hidden relative">
    <div id="messageViewport" class="flex-1 overflow-y-auto p-4 space-y-3">
      <div id="messagesContainer" class="space-y-3"></div>
    </div>

    <!-- COMPOSER -->
    <footer class="bg-gray-900 border-t border-gray-800 p-3 shrink-0">
      <form id="chatForm" onsubmit="Application.ui.handleSendMessage(event)" class="flex items-center space-x-2">
        <input type="text" id="messageInput" placeholder="Broadcast encrypted message globally..." required class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3.5 py-2.5 text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition" autocomplete="off" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition shadow-lg shadow-indigo-600/20">
          <span>Broadcast</span>
          <i class="fa-solid fa-paper-plane text-[10px]"></i>
        </button>
      </form>
    </footer>
  </main>

  <!-- ENTERPRISE GLOBAL ENGINE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Public Relay Firebase Config for Global Synchronization
    const firebaseConfig = {
      databaseURL: "https://realtime-mesh-ip-default-rtdb.firebaseio.com"
    };

    const fbApp = initializeApp(firebaseConfig);
    const fbAuth = getAuth(fbApp);
    const fbDb = getDatabase(fbApp);

    // Dynamic Manifest
    const manifestBlob = new Blob([JSON.stringify({
      "name": "Global Enterprise Chat",
      "short_name": "GlobalMesh",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#030712",
      "theme_color": "#4f46e5",
      "icons": [
        { "src": "https://cdn-icons-png.flaticon.com/512/2592/2592317.png", "sizes": "192x192", "type": "image/png" }
      ]
    })], { type: 'application/json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);


    // ==========================================
    // 1. CRYPTOGRAPHIC ENGINE (AES-256-GCM)
    // ==========================================
    class CryptoEngine {
      constructor() {
        this.key = null;
      }

      async init() {
        // Universal global channel key derive (SHA-256 hashed shared secret)
        const channelSecret = "EnterpriseGlobalMeshSecret2026";
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.digest("SHA-256", enc.encode(channelSecret));

        this.key = await window.crypto.subtle.importKey(
          "raw",
          keyMaterial,
          { name: "AES-GCM" },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async encrypt(plaintext) {
        const enc = new TextEncoder();
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          this.key,
          enc.encode(plaintext)
        );

        return {
          cipherHex: Array.from(new Uint8Array(ciphertext)).map(b => b.toString(16).padStart(2, '0')).join(''),
          ivHex: Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join('')
        };
      }

      async decrypt(cipherHex, ivHex) {
        try {
          const ciphertext = new Uint8Array(cipherHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
          const iv = new Uint8Array(ivHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
          const decrypted = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            this.key,
            ciphertext
          );
          return new TextDecoder().decode(decrypted);
        } catch (e) {
          return "[Decryption Error - Invalid Cipher Payload]";
        }
      }
    }


    // ==========================================
    // 2. INDEXEDDB PERSISTENCE ADAPTER
    // ==========================================
    class StorageAdapter {
      constructor(dbName = "GlobalChatDB", storeName = "messages") {
        this.dbName = dbName;
        this.storeName = storeName;
        this.db = null;
      }

      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName, { keyPath: "id" });
            }
          };
          request.onsuccess = (e) => {
            this.db = e.target.result;
            resolve();
          };
          request.onerror = (e) => reject(e.target.error);
        });
      }

      async getAll() {
        return new Promise((resolve) => {
          const tx = this.db.transaction(this.storeName, "readonly");
          const store = tx.objectStore(this.storeName);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => resolve([]);
        });
      }

      async add(item) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(this.storeName, "readwrite");
          const store = tx.objectStore(this.storeName);
          const request = store.put(item);
          request.onsuccess = () => resolve();
          request.onerror = () => resolve();
        });
      }
    }


    // ==========================================
    // 3. GLOBAL HYBRID MESH NETWORK (PeerJS + Firebase)
    // ==========================================
    class GlobalMeshNetwork {
      constructor(onMessageReceived) {
        this.onMessageReceived = onMessageReceived;
        this.peer = null;
        this.myPeerId = null;
        this.peerConnections = new Map();
      }

      async init() {
        await signInAnonymously(fbAuth);

        // Initialize WebRTC PeerJS Global Signaling
        this.myPeerId = `global_${Math.random().toString(36).substring(2, 9)}`;
        this.peer = new Peer(this.myPeerId);

        this.peer.on('open', (id) => {
          document.getElementById("peerIdDisplay").innerText = `ID: ${id}`;
        });

        this.peer.on('connection', (conn) => {
          this.setupConnection(conn);
        });

        // Listen for global public relay broadcasts
        onValue(ref(fbDb, 'global_channel'), (snapshot) => {
          const data = snapshot.val();
          if (data) {
            Object.values(data).forEach(msg => this.onMessageReceived(msg));
          }
        });
      }

      setupConnection(conn) {
        this.peerConnections.set(conn.peer, conn);
        conn.on('data', (data) => this.onMessageReceived(data));
        conn.on('close', () => this.peerConnections.delete(conn.peer));
      }

      connectToPeer(peerId) {
        if (!peerId || this.peerConnections.has(peerId)) return;
        const conn = this.peer.connect(peerId);
        conn.on('open', () => this.setupConnection(conn));
      }

      async broadcast(msgRecord) {
        // 1. Direct WebRTC Mesh Delivery
        this.peerConnections.forEach(conn => {
          if (conn.open) conn.send(msgRecord);
        });

        // 2. Global Firebase Relay Backup
        const globalRef = ref(fbDb, 'global_channel');
        const newMsgRef = push(globalRef);
        await set(newMsgRef, msgRecord);
      }
    }


    // ==========================================
    // 4. PWA MANAGER
    // ==========================================
    class PwaManager {
      constructor() {
        this.deferredPrompt = null;
      }

      async init() {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          this.deferredPrompt = e;
          document.getElementById("pwaInstallBtn").classList.remove("hidden");
        });
      }

      async promptInstall() {
        if (!this.deferredPrompt) return;
        this.deferredPrompt.prompt();
        const { outcome } = await this.deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          this.deferredPrompt = null;
          document.getElementById("pwaInstallBtn").classList.add("hidden");
        }
      }
    }


    // ==========================================
    // 5. UI CONTROLLER
    // ==========================================
    class UiController {
      constructor(storage, crypto, mesh) {
        this.storage = storage;
        this.crypto = crypto;
        this.mesh = mesh;
        this.renderedMsgIds = new Set();
        this.setupNetwork();
      }

      triggerHaptic() {
        if ('vibrate' in navigator) navigator.vibrate(15);
      }

      setupNetwork() {
        const updateStatus = () => {
          const isOnline = navigator.onLine;
          const badge = document.getElementById("netStatusBadge");
          const dot = document.getElementById("netStatusDot");
          const text = document.getElementById("netStatusText");

          if (isOnline) {
            badge.className = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1";
            dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse";
            text.innerText = "Online";
          } else {
            badge.className = "bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1";
            dot.className = "w-1.5 h-1.5 rounded-full bg-rose-400";
            text.innerText = "Offline";
          }
        };

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
      }

      async shareApp() {
        this.triggerHaptic();
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Global Enterprise Mesh Chat',
              text: `Join my global encrypted mesh chat! My ID: ${this.mesh.myPeerId}`,
              url: window.location.href,
            });
          } catch (e) {}
        }
      }

      promptConnectPeer() {
        const peerId = prompt("Enter Global Peer ID to establish direct WebRTC P2P link:");
        if (peerId) this.mesh.connectToPeer(peerId.trim());
      }

      escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }

      async handleSendMessage(e) {
        e.preventDefault();
        this.triggerHaptic();

        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text) return;

        const encrypted = await this.crypto.encrypt(text);

        const msgRecord = {
          id: `msg_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
          senderId: this.mesh.myPeerId,
          cipherText: encrypted.cipherHex,
          iv: encrypted.ivHex,
          timestamp: Date.now(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        await this.storage.add(msgRecord);
        await this.renderSingleMessage(msgRecord);
        await this.mesh.broadcast(msgRecord);

        input.value = "";
      }

      async renderSingleMessage(m) {
        if (this.renderedMsgIds.has(m.id)) return;
        this.renderedMsgIds.add(m.id);

        const container = document.getElementById("messagesContainer");
        const isSelf = m.senderId === this.mesh.myPeerId;
        const decryptedText = await this.crypto.decrypt(m.cipherText, m.iv);
        const cleanText = this.escapeHTML(decryptedText);

        const msgHtml = `
          <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
            <div class="flex items-baseline space-x-1.5 mb-0.5">
              <span class="text-[9px] font-mono ${isSelf ? 'text-indigo-400' : 'text-emerald-400'}">${isSelf ? 'You' : m.senderId || 'Global Peer'}</span>
              <span class="text-[9px] text-gray-600">${m.time}</span>
            </div>
            <div class="max-w-xs sm:max-w-md ${isSelf ? 'bg-indigo-600 text-white rounded-l-xl rounded-tr-xl' : 'bg-gray-900 text-gray-100 rounded-r-xl rounded-tl-xl border border-gray-800'} p-2.5 text-xs shadow-sm space-y-1">
              <p>${cleanText}</p>
              <div class="flex items-center justify-end space-x-1 text-[8px] opacity-75 font-mono">
                <i class="fa-solid fa-earth-americas"></i>
                <span>Global E2EE</span>
              </div>
            </div>
          </div>
        `;

        container.insertAdjacentHTML('beforeend', msgHtml);
        const vp = document.getElementById("messageViewport");
        vp.scrollTop = vp.scrollHeight;
      }
    }


    // ==========================================
    // 6. APPLICATION COMPOSITION ROOT
    // ==========================================
    class ApplicationRoot {
      constructor() {
        this.crypto = new CryptoEngine();
        this.storage = new StorageAdapter();
        this.pwa = new PwaManager();
        this.mesh = new GlobalMeshNetwork((msg) => this.ui.renderSingleMessage(msg));
        this.ui = new UiController(this.storage, this.crypto, this.mesh);
      }

      async bootstrap() {
        await this.crypto.init();
        await this.storage.init();
        await this.pwa.init();
        await this.mesh.init();

        const storedMessages = await this.storage.getAll();
        storedMessages.sort((a, b) => a.timestamp - b.timestamp).forEach(m => this.ui.renderSingleMessage(m));
      }
    }

    window.Application = new ApplicationRoot();
    window.addEventListener("DOMContentLoaded", () => window.Application.bootstrap());
  </script>
</body>
</html>
